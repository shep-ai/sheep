content: |
  ## Architecture Overview

  Feature 234 follows the exact implementation pattern established by 90+ prior markdown-file-creation features
  (features 069-233). The architecture is minimal and leverages existing project utilities:

  **Content Generation Layer:**
  - Use existing `generate_markdown_content()` from content_generators.py
  - Generates H1 markdown heading + 2-3 sentences of prose using CrewAI LLM framework
  - Already proven across 160+ implementations; handles diverse topics automatically
  - Returns markdown string with proper structure and validation

  **File I/O Layer:**
  - Use existing `write_markdown_file()` from content_generators.py
  - Writes content to repository root using Python open() with explicit UTF-8 encoding
  - Ensures UTF-8 without BOM (Byte Order Mark) per spec NFR-1
  - Ensures Unix-style LF line endings (not Windows CRLF) per spec NFR-2
  - No modifications to any source code, tests, or configuration files (isolated to repository root)

  **Git Integration Layer:**
  - Use subprocess.run() to invoke git CLI directly (consistent with git_tools.py pattern)
  - Three simple operations: git add, git commit, git push
  - Conventional commit format: "feat(234): Create markdown file test-kn5qkm.md with prose content"
  - Push to pre-created feature branch: feat/234-markdown-file-creation-d2604d

  **No Application Integration Needed:**
  This feature operates entirely at the file system and git level. It does not integrate with:
  - Source code in /src/sheep/ (unchanged)
  - Test framework or pytest (no test code created)
  - Configuration management (no config changes)
  - CrewAI agents or Sheep platform orchestration (only uses content generation utility)

  The feature is self-contained: create file, validate, commit, push. Done.

  ## Key Design Decisions

  ### 1. Use Existing Utilities vs. Custom Implementation

  **Decision:** Use existing `generate_markdown_content()` and `write_markdown_file()` from content_generators.py

  **Alternatives Considered:**
  - Hardcoded manual content: Simpler execution but inconsistent with 90+ prior implementations
  - Direct LLM API calls: Duplicates logic already in generate_markdown_content()
  - Template-based generation: Unnecessary indirection

  **Rationale:**
  All 90+ prior implementations use these exact utilities. They are proven, tested, and debugged across
  160+ feature runs. Deviating would create inconsistency and violate the requirement to follow established
  precedent. The functions handle all complexity (LLM API, validation, encoding) transparently.

  ### 2. Content Source: LLM vs. Hardcoded

  **Decision:** Generate content via CrewAI LLM using existing generate_markdown_content() function

  **Alternatives Considered:**
  - Hardcoded prose: Fast but creates duplication across 90+ test files with identical content
  - Template with substitution: Adds unnecessary abstraction layer

  **Rationale:**
  LLM generation provides diverse, coherent content with minimal overhead. Existing test files (test-8hjiqa.md,
  test-9ehmdc.md, test-p2qj1z.md) demonstrate varied topics: automation, resilience, learning. This pattern
  is the established norm and matches all 90+ precedents exactly.

  ### 3. Git Integration: subprocess CLI vs. GitPython Library

  **Decision:** Use subprocess.run() to invoke git CLI directly

  **Alternatives Considered:**
  - GitPython library: Adds abstraction layer not used elsewhere in codebase
  - Direct shell execution: Not portable; requires shell=True which risks injection

  **Rationale:**
  Consistent with git_tools.py pattern in the codebase. subprocess with explicit argument list is simple,
  safe (no shell injection risk), and requires no additional dependencies. The git operations needed (add,
  commit, push) are straightforward enough that library abstraction is unnecessary.

  ### 4. File Encoding: UTF-8 without BOM

  **Decision:** Use Python open() with encoding='utf-8' parameter (defaults to no BOM)

  **Alternatives Considered:**
  - Explicit BOM handling: Spec explicitly forbids BOM (NFR-1)
  - Binary write mode: Error-prone; requires manual newline handling

  **Rationale:**
  Spec requirement NFR-1: "UTF-8 encoding must be without BOM (Byte Order Mark)". Python's open() with
  encoding='utf-8' defaults to UTF-8 without BOM. Verified in existing write_markdown_file() implementation
  and across all 90+ prior test files using this encoding. No special handling needed.

  ### 5. Line Endings: Unix LF vs. Platform Default

  **Decision:** Platform-aware via Python's universal newlines (text mode) + explicit LF in content generation

  **Alternatives Considered:**
  - Explicit CRLF stripping: Adds platform-detection complexity not needed on Linux
  - Binary mode with manual LF: Error-prone; harder to debug

  **Rationale:**
  Spec requirement NFR-2: "Unix-style LF line endings (`\n`), not Windows CRLF". On Linux systems where
  this project runs, open() in text mode ('w') defaults to LF. Additionally, generate_markdown_content()
  ensures trailing newline via ensure_trailing_newline(). This dual approach naturally satisfies the
  requirement without special platform handling.

  ## Implementation Strategy

  **Phase 1: File Creation & Validation** (5 minutes)
  1. Call generate_markdown_content() to produce H1 heading + 2-3 sentences of prose
  2. Call write_markdown_file() to write test-kn5qkm.md to repository root
  3. Validate file: check H1 heading present, sentence count 2-3, size 400-600 bytes, encoding UTF-8, line endings LF

  **Phase 2: Git Integration & Workflow** (5-10 minutes)
  1. Stage file: subprocess.run(["git", "add", "test-kn5qkm.md"])
  2. Commit: subprocess.run(["git", "commit", "-m", "feat(234): Create markdown file test-kn5qkm.md with prose content"])
  3. Push: subprocess.run(["git", "push", "origin", "feat/234-markdown-file-creation-d2604d"])
  4. Verify all operations completed successfully

  **Why This Order:**
  File must exist and be valid before attempting git operations. Git operations have dependencies: file must
  exist before staging, staged before committing, committed before pushing. This is the only logical order.

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Content generation API timeout | Low | Existing generate_markdown_content() handles retries; LLM usually responds in 2-5 seconds |
  | File write permission denied | Very Low | Repository root is writable (verified by 90+ prior implementations); standard workflow |
  | Git operations fail (authentication, branch missing) | Very Low | Feature branch pre-created; git config already set up; workflow proven 90+ times |
  | Markdown structure invalid | Very Low | generate_markdown_content() includes _validate_markdown_content() check; LLM output naturally valid |
  | File encoding/line endings incorrect | Very Low | Python open() defaults to UTF-8 no-BOM on Linux; generate_markdown_content() ensures LF |
  | Commit message format incorrect | Very Low | Spec provides exact format; straightforward string literal in subprocess call |
  | Feature branch not pre-created | Very Low | Spec explicitly states feature branch is pre-created; verified in recent commits |

  **No mitigations are complex:** This feature is minimal. Mitigations rely on existing utilities and
  established patterns proven 90+ times. No novel error handling needed.
