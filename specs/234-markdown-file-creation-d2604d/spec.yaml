# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-kn5qkm.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 90+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in earlier features, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an automated code implementation platform with the following structure:

  - **Repository root**: Contains 90+ test markdown files (test-*.md pattern) from repeated markdown-file-creation features
  - **src/sheep/**: Application source code organized into modular components:
    - `agents/`: Agent definitions (Research, Implementation, Review agents)
    - `config/`: Configuration management (settings, LLM factory)
    - `flows/`: Flow definitions and orchestration logic
    - `tools/`: Agent tools (git_tools.py, file_tools.py)
    - `observability/`: Logging and tracing (Langfuse integration)
    - `cli.py`: CLI entry point
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/234-markdown-file-creation-d2604d/)
  - **tests/**: Test suite for application validation
  - **pyproject.toml**: Python project metadata and dependencies (requires Python 3.11+)
  - **.github/**: GitHub Actions workflows and CI/CD configuration
  - **Dockerfile**: Container configuration for deployment
  - **README.md**: Comprehensive platform documentation

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as lightweight validation
  artifacts for the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (90+ identical precedents):
  - Simple file creation using Python pathlib (Path.write_text() method)
  - Standard markdown structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix-style LF line endings (`\n`), not Windows CRLF
  - File size naturally results from proper structure: typically 400-600 bytes
  - Implementation uses straightforward imperative code (create content string, write file)
  - Files are isolated test artifacts with zero dependencies on application source code
  - Topic selection is free-form (diverse topics observed: nature, technology, philosophy, innovation, etc.)

  **Git Workflow Pattern** (consistent across 90+ precedents):
  - Feature branch pre-created as `feat/234-markdown-file-creation-d2604d`
  - Simple create/modify in working directory, no complex branching
  - Stage with `git add test-kn5qkm.md`
  - Commit with conventional commit format: `feat(234): Create markdown file test-kn5qkm.md with prose content`
  - Push changes to feature branch
  - No modifications to source code, tests, or configuration files
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (observed across features 069-233+):
  - Minimal, isolated changes affecting only repository root
  - Zero dependencies on application source code (/src/sheep/)
  - Single-file operations with straightforward Python file I/O
  - Each feature is structurally identical with identical success criteria
  - Implementation time is consistently 10-15 minutes per feature

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **pathlib (Python standard library)**: File I/O operations (Path.write_text() for UTF-8 file creation)
  - **Git**: Version control; file staging, commits, branch management
  - **Markdown syntax**: Simple format with H1 heading and prose per CommonMark specification
  - **CrewAI**: Framework used by Sheep platform for agent-based automation (not directly needed for this task)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-kn5qkm.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-233; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, agents, flows, or tools |
  | Tests | None | No test modifications, no test failures expected, no test coverage impact |
  | Configuration Files | None | No changes to pyproject.toml, .env, or other configuration |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other spec files |

  ## Dependencies

  - **Git repository**: Feature branch `feat/234-markdown-file-creation-d2604d` must exist (pre-created)
  - **File system**: Write access to repository root directory (standard, already available)
  - **Established pattern**: 90+ test files provide clear, proven precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (zero external dependencies)
  - **File naming**: Filename `test-kn5qkm.md` is provided in the feature spec and must be used exactly

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one H1 markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (features 233, 232, 231, etc.) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-kn5qkm.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 160+ prior implementations
  - No complexity, no edge cases, no dependencies to resolve

