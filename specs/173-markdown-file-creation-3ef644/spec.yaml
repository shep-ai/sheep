content: |
  ## Problem Statement

  Add a new markdown file called test-b96pp3.md to the repository root with a coherent title and 2-3 sentences of prose content. This continues the pattern established across 170+ existing test files in the Sheep repository. The file should follow strict formatting requirements: UTF-8 encoding without BOM, Unix LF line endings, and be staged/committed/pushed to git with a conventional commit message.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **Root directory**: Contains 100+ test markdown files (test-*.md) that serve as test fixtures for the feature implementation workflow
  - **specs/**: Contains subdirectories for each feature numbered 006+ (e.g., specs/173-markdown-file-creation-3ef644/)
  - Each spec directory includes:
    - spec.yaml: Feature specification (this file)
    - create_markdown_file.py: Implementation script
    - test_create_markdown_file.py: Comprehensive test suite

  ### Architecture Patterns

  The project follows a well-established pattern for markdown file creation features:

  1. **File Structure**: All test markdown files follow identical format:
     - H1 heading on line 1 (e.g., `# The Power of Creativity`)
     - Blank line on line 2
     - 2-3 sentences of prose content (lines 3+)
     - Trailing newline
     - Total file size: typically 400-600 bytes

  2. **Encoding Standards**: All files strictly enforce:
     - UTF-8 encoding without Byte Order Mark (BOM)
     - Unix LF line endings (\\n), never Windows CRLF (\\r\\n)
     - Written using pathlib.Path.write_bytes() with explicit UTF-8 encoding

  3. **Implementation Pattern**: Each markdown file creation feature:
     - Defines title and prose content as string constants
     - Uses pathlib.Path for file operations
     - Validates file structure and size before git operations
     - Performs git add, commit, push using subprocess.run() with check=True

  4. **Git Workflow**: Standard conventional commit format:
     - Message: \"feat(NUMBER): create markdown file FILENAME with prose content\"
     - Example: \"feat(173): create markdown file test-b96pp3.md with prose content\"
     - Operations: git add, git commit, git push -u origin HEAD

  ### Relevant Technologies

  - **Python 3**: pathlib module for cross-platform file operations, subprocess for git integration
  - **Git**: Version control operations (add, commit, push)
  - **Markdown**: Standard markdown format with H1 heading level

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Adds new file test-b96pp3.md to root directory |
  | Git history | High | Creates new commit in current branch; adds git operations workflow |
  | specs/173-* directory | Medium | Contains implementation script and tests (documentation only for this analysis phase) |

  ## Dependencies

  - **Python Standard Library**: pathlib (file I/O), subprocess (git commands), sys (exit codes)
  - **Git**: Required for add, commit, and push operations
  - **Existing test pattern**: References 170+ existing test markdown files as templates (no runtime dependency)

  ## Size Estimate

  **S** — This is a straightforward, short-duration task (1-2 hours maximum) because:
  - Pattern is well-established and repeated across 170+ prior features (features 162+)
  - No architectural decisions needed; follows existing conventions exactly
  - Simple file creation: write H1 heading + prose, validate structure, perform 3 git operations
  - Comprehensive reference implementations available (features 165, 166, 171, 172)
  - No code complexity, dependencies, or integration challenges
  - File size validation is simple (check 300-800 byte range)
  - Test suite is straightforward (8-10 test functions following exact pattern from prior features)

  ### Effort Breakdown

  - Implementation script: 15-20 minutes (copy/adapt from feature 165-172)
  - Test suite: 15-20 minutes (standard pytest patterns)
  - Git operations: 5 minutes (add, commit, push)
  - Verification: 5-10 minutes
  - **Total**: 45-60 minutes

