content: |
  ## Architecture Overview

  This feature follows the well-established pattern from features 162-172,
  ensuring consistency across 170+ markdown file creation features in the
  repository. The implementation consists of:

  1. **create_markdown_file.py** — Main script with three key responsibilities:
     - File creation: Write H1 heading + prose content with proper encoding/line endings
     - Validation: Verify structure, encoding, size, and line endings before git ops
     - Git integration: Stage, commit, and push the file with conventional message

  2. **test_create_markdown_file.py** — Comprehensive pytest suite with 8-10 tests
     covering file structure, encoding, line endings, size, and git operations.

  The implementation adheres to these principles from prior features:
  - Single module with helper functions (create_file, validate_file, git_add, git_commit, git_push, main)
  - Fail-fast validation before git operations (prevents invalid commits)
  - Clear error handling with specific exceptions and exit codes
  - Module-level constants for title, prose, and commit message

  ## Key Design Decisions

  ### 1. File I/O Strategy: pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text() with encoding='utf-8' and newline='\n'

  **Rationale:**
  - Modern Python 3 standard for file operations
  - encoding='utf-8' ensures UTF-8 without BOM (BOM only added with 'utf-8-sig')
  - newline='\n' forces Unix LF line endings on all platforms (prevents platform-specific conversion)
  - Single clean call is more Pythonic than write_bytes() or open() context manager
  - Explicitly controls both encoding and line endings in one statement
  - Validated across 170+ prior features in this repository

  ### 2. File Validation Scope & Timing

  **Chosen:** Standard validation (structure, size, encoding, line endings) after file creation but before git operations

  **Validation Checks (in order):**
  1. File exists with non-zero size
  2. UTF-8 encoding without BOM (binary check for EF BB BF bytes)
  3. No CRLF line endings (binary check for \r\n sequences)
  4. H1 heading on first line (starts with '# ')
  5. Blank line on second line
  6. Prose content with 2-3 sentences (counts sentence-ending periods)
  7. File ends with newline character
  8. File size within 300-800 byte range

  **Rationale:**
  - Matches established pattern from features 162-172
  - Provides appropriate assurance without over-engineering
  - Fail-fast approach prevents invalid content from being committed
  - Comprehensive enough to catch all formatting issues
  - Fast to execute (all checks complete in <10ms)

  ### 3. Git Command Execution: subprocess.run() with check=True

  **Chosen:** subprocess.run() with check=True and args as list (not shell string)

  **Git Operations:**
  - git add: subprocess.run(['git', 'add', filename], check=True)
  - git commit: subprocess.run(['git', 'commit', '-m', message], check=True)
  - git push: subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)

  **Rationale:**
  - check=True raises CalledProcessError on non-zero exit (explicit error handling)
  - Args as list prevents command injection vulnerabilities
  - Controlled filename prevents shell interpretation
  - Matches security best practices for subprocess execution
  - Pattern is consistent across features 162-172

  ### 4. Prose Content Strategy: Module Constants

  **Chosen:** Define prose as module-level string constants with creative, thematic content

  **Example Structure:**
  ```
  FILENAME = "test-b96pp3.md"
  MARKDOWN_TITLE = "The Power of Creativity"
  MARKDOWN_PROSE = "Creativity is the spark that ignites innovation and progress. " \
                   "It emerges from the intersection of passion, curiosity, and courage to explore new ideas. " \
                   "By embracing creative thinking, we unlock our potential to transform challenges into opportunities."
  COMMIT_MESSAGE = "feat(173): create markdown file test-b96pp3.md with prose content"
  ```

  **Rationale:**
  - Creative, thematic content maintains consistency with prior features
  - Module-level constants are simple, self-contained, and easily testable
  - Produces professional, readable test files (not lorem ipsum or placeholders)
  - Prose is meaningful and coherent (topical focus on creativity, progress, learning, etc.)
  - No external dependencies or randomization complexity

  ### 5. Error Handling: Specific Exceptions with Context

  **Chosen:** Catch specific exceptions (ValueError, OSError, subprocess.CalledProcessError) with clear error messages

  **Exception Handling Pattern:**
  - ValueError: Validation failures (user-facing, actionable errors)
  - OSError: File I/O problems (file creation, read/write failures)
  - subprocess.CalledProcessError: Git operation failures (add, commit, push)
  - Each exception logged to stderr with context before exiting with code 1

  **Rationale:**
  - Specific exceptions enable clear diagnosis of failure modes
  - Clear error messages help users understand what went wrong
  - Exit codes (0 for success, 1 for failure) integrate with CI/CD pipelines
  - Pattern matches features 162-172 for consistency

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: Implementation & Validation**
  - Creates the core create_markdown_file.py script
  - Defines helper functions for file creation, validation, and git operations
  - Establishes the foundation that all tests will verify
  - Must complete before tests can run

  **Phase 2: Testing & Verification**
  - Builds comprehensive test suite with 8-10 functions
  - Tests file structure, encoding, line endings, size, and git operations
  - Verifies all functional and non-functional requirements
  - Tests both success and failure paths

  **Phase 3: Execution & Commit**
  - Runs the actual implementation script
  - Verifies the test-b96pp3.md file is created correctly
  - Stages, commits, and pushes the file to git
  - Provides evidence that implementation is complete

  ### Why This Order

  Implementation must come before testing (tests need code to test).
  Testing must come before execution (verifies everything works before running the actual script).
  Execution must come last (confirms the implementation works end-to-end).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding mismatch | Explicit encoding='utf-8' parameter in write_text(); validation checks for BOM bytes |
  | Platform-specific line endings | Explicit newline='\n' parameter forces Unix LF on all platforms; validation checks for CRLF |
  | Invalid file committed to git | Comprehensive validation before any git operations; fail-fast approach prevents bad commits |
  | Git operations fail silently | subprocess.run(check=True) raises exception on non-zero exit; explicit error handling with context |
  | Test coverage gaps | Comprehensive test suite with 8-10 functions covering all requirements and edge cases |
  | Inconsistency with prior features | Follow exact pattern from features 162-172; reference implementations available for comparison |
