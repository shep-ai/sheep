decisions:
  - title: "File I/O Implementation Strategy"
    chosen: "pathlib.Path.write_text() with encoding='utf-8' and newline='\\n' parameters"
    rejected:
      - "pathlib.Path.write_bytes() — unnecessarily verbose and requires manual UTF-8 encoding; the text-based approach is cleaner while still providing explicit control"
