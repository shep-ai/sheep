    rationale: >
      subprocess.run() with check=True provides explicit error handling: it raises CalledProcessError if the command exits with non-zero status. Using args as a list (e.g., ['git', 'add', filename]) rather than shell=True prevents command injection vulnerabilities. Even though filename is controlled in this feature, following this pattern consistently prevents future regressions. The check=True parameter makes error conditions obvious in the code and enables clear exception handling. This pattern is used consistently across all prior features and is the Python 3 subprocess best practice.

