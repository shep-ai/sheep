      - "subprocess with cat/echo — shell-based approach introduces security risks and is platform-dependent"
    rationale: >
      pathlib.Path.write_text() is the optimal choice because it provides explicit control over both encoding and line endings in a single, clean call. The encoding='utf-8' parameter ensures UTF-8 without BOM (BOM is only added with 'utf-8-sig'), and newline='\n' ensures Unix LF line endings on all platforms without platform-specific conversion. This approach has been successfully used across 170+ prior features in this repository and is the Python 3 standard for file operations. The parameters are explicit and documented, making the intent clear to maintainers.

  - title: "File Validation Timing and Scope"
    chosen: "Implement standard validation (structure, size, encoding, line endings) after file creation but before git operations"
    rejected:
      - "Minimal validation (file exists only) — provides insufficient assurance that the file meets requirements; undermines quality standards established across prior features"
      - "Post-git validation — introduces risk of invalid files being committed; violates the requirement for pre-commit validation"
      - "Comprehensive validation with content analysis — over-engineered; standard validation provides adequate coverage without unnecessary complexity"
    rationale: >
      Standard validation matches the established pattern from features 162-172 and strikes the right balance between assurance and simplicity. It checks: (1) file exists with non-zero size, (2) UTF-8 encoding without BOM via binary read of magic bytes (EF BB BF), (3) no CRLF line endings, (4) H1 heading on first line, (5) blank line on second line, (6) prose content with 2-3 sentences, (7) file ends with newline, (8) size within 300-800 byte range. This provides comprehensive coverage while remaining maintainable and fast. Validation before git operations ensures invalid content is never committed.

  - title: "Git Command Execution Safety"
    chosen: "subprocess.run() with check=True and args as list (not shell string)"
    rejected:
      - "subprocess.call() without check=True — requires manual return code checking and is less explicit about error handling"
