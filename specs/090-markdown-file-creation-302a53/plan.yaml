  | Unix LF line endings | 1 | Use '\n' in string literals; verify with `od -c` |
  | File size 320-600 bytes | 1 | Check Path.stat().st_size after writing |
  | Staged with git add | 2 | Verify `git status` shows file staged |
  | Conventional commit message | 2 | Use hardcoded message format |
  | Pushed to feature branch | 2 | Verify remote branch contains commit with `git log origin/feat/090-...` |
  | No existing files modified | 1 | Single file creation only; no modifications |
  | Clean working tree after push | 2 | Run `git status` after push; should be clean |

