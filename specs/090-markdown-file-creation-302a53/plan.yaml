# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 090 implements the established pattern for creating test markdown files
  in the repository root. This is the 90th iteration of an identical pattern
  demonstrated across features 069-089, with 89+ existing test files establishing
  clear conventions and precedent.

  **Integration with codebase:**
  - **File creation:** Standard file I/O using Python's pathlib module (used throughout
    Sheep codebase for cross-platform path handling)
  - **Version control:** Standard git workflow using CLI commands (add, commit, push)
    integrated with the Sheep CI/CD pipeline
  - **No code dependencies:** Feature does not depend on or modify application code
    in /src/sheep/ or any configuration files
  - **Pattern consistency:** Follows exact structure of 89+ precedent files
    (test-*.md at repository root with H1 heading, blank line, 2-3 sentences of prose)

  ### Technical Approach

  1. **File I/O:** Use `pathlib.Path.write_text()` with explicit `encoding='utf-8'`
     parameter to ensure UTF-8 encoding without BOM
  2. **Content format:** H1 markdown heading (#), blank line, 2-3 sentences of
     meaningful prose authored manually
  3. **Line endings:** String literals with `'\n'` (Unix LF) throughout the content
  4. **Validation:** Post-creation verification that file meets all technical requirements:
     - H1 heading present on first line
     - Blank line separates heading from prose
     - 2-3 complete sentences present
     - UTF-8 encoding confirmed
     - Unix LF line endings confirmed
     - File size 320-600 bytes
  5. **Git workflow:** Standard git commands: `git add`, `git commit` with conventional
     message, `git push` to pre-existing feature branch

  ---

  ## Key Design Decisions

  ### 1. File I/O Library: Python pathlib

  **Chosen:** `pathlib.Path.write_text(encoding='utf-8')`

  **Rationale (from research):**
  - Modern, recommended approach in Python 3.11+ per language documentation
  - Used throughout Sheep codebase for file operations (see file_tools.py, git_tools.py)
  - Provides cross-platform path handling and clean, intuitive API
  - Ensures UTF-8 encoding compliance via explicit parameter
  - More readable than open() context managers for simple write operations
  - Established pattern across 89+ precedent features

  ---

  ### 2. Text Encoding & Line Ending Strategy: UTF-8 + Unix LF

  **Chosen:** UTF-8 encoding (without BOM); Unix LF line endings (`\n`)

  **Rationale (from research):**
  - Spec explicitly requires UTF-8 and Unix LF per functional requirements
  - Verified across 70+ existing test files (test-objvv0.md: 420B, test-l20qnc.md: 385B)
  - pathlib.Path.write_text() uses UTF-8 by default; string literals with `'\n'`
    ensure Unix line endings are written correctly
  - Critical for CI/CD environments where files are validated by automated systems
  - No platform-specific variations or dynamic detection needed

  ---

  ### 3. Prose Content Generation: Manual Authorship

  **Chosen:** Meaningful, human-authored prose (2-3 coherent sentences on topic of choice)

  **Rationale (from research):**
  - Spec requirement FR-5: "Prose content must be grammatically correct, coherent,
    and semantically meaningful (not placeholder or gibberish text)"
  - Analysis of 89+ precedent files shows thoughtful, diverse topics and high-quality prose
  - Manual authorship requires minimal effort (~5 min to write title + 2-3 sentences)
  - Ensures pattern integrity and content quality
  - Topic selection at implementer's discretion per NFR-6

  ---

  ### 4. File Size Validation: Post-Creation Check

  **Chosen:** Validate file size range (320-600 bytes) after writing using `Path.stat().st_size`

  **Rationale (from research):**
  - Spec requires "approximately 320-600 bytes to match established pattern"
  - Existing files naturally fall within this range; no artificial padding needed
  - Write natural prose and validate; adjust if necessary by adding/removing a sentence
  - Approach prioritizes content quality while ensuring pattern compliance
  - Word "approximately" indicates tolerance (not strict byte-for-byte target)

  ---

  ### 5. Git Workflow: Standard CLI Commands

  **Chosen:** Use standard git commands: `git add test-rhubmf.md`, `git commit -m "..."`, `git push`

  **Rationale (from research):**
  - Spec requirements FR-8 through FR-10 specify this workflow
  - Established pattern across 89+ precedent features
  - Staging only the specific file (not `git add -A`) follows best practices for isolated changes
  - Git CLI is universally available; no external dependencies required
  - Already integrated in Sheep tools (git_tools.py)
  - Commit message format: `feat(090): create markdown file test-rhubmf.md with prose content`
    follows conventional commits standard
  - Feature branch (feat/090-markdown-file-creation-302a53) pre-exists; straightforward push

  ---

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1: File Creation & Technical Validation** comes first because:
  - Must create and validate the file before any git operations
  - Ensures all functional and non-functional requirements are met
  - Allows for content adjustment if file size is outside range before committing

  **Phase 2: Git Integration** follows because:
  - Operates on the completed, validated file from Phase 1
  - Straightforward workflow once file is correct
  - Final step that makes changes permanent in repository

  ### Execution Flow

  1. **Write markdown file** with pathlib: `Path('test-rhubmf.md').write_text(content, encoding='utf-8')`
  2. **Validate file structure:** H1 heading, blank line, 2-3 sentences present
  3. **Verify technical requirements:** UTF-8 encoding, LF line endings, 320-600 byte size
  4. **Stage file:** `git add test-rhubmf.md`
  5. **Commit:** `git commit -m "feat(090): create markdown file test-rhubmf.md with prose content"`
  6. **Push:** `git push -u origin feat/090-markdown-file-creation-302a53`
  7. **Verify:** Check that git working tree is clean after push

  **Total Estimated Effort:** 10-15 minutes
  - File creation + prose authorship: ~10 minutes
  - Git workflow: ~5 minutes

  ---

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File size outside 320-600 bytes | Low | Low | Validate post-creation; adjust prose (add/remove sentence) if needed; re-validate |
  | Encoding not UTF-8 or line endings not LF | Very Low | Medium | Use pathlib.Path.write_text(encoding='utf-8') and '\n' in string literals; verify file with od -c or file command |
  | Prose is placeholder/gibberish | Low | Medium | Manually author meaningful prose; review content before committing |
  | File already exists (overwrite risk) | Very Low | High | Check with Path.exists() before writing; pathlib fails safely if file exists in some modes |
  | Git push fails | Very Low | Low | Feature branch pre-exists; standard workflow applies; verify branch exists before pushing |
  | Git commit message format incorrect | Very Low | Low | Use hardcoded message: `feat(090): create markdown file test-rhubmf.md with prose content` |
  | Working tree not clean after push | Very Low | Low | Verify with `git status` after push; no other changes should exist |

  **Overall Risk Profile:** Very low. Pattern is proven across 89+ features, implementation is
  straightforward, scope is minimal, no dependencies, and all technical decisions are backed
  by research and precedent.

