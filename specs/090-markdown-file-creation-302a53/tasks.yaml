content: |
  ## Summary

  Feature 090 requires creating a single markdown file (test-rhubmf.md) in the repository
  root with a title and prose content, then integrating it into the git repository through
  staging, committing, and pushing to the feature branch.

  **Implementation flow:**
  1. **Phase 1 (10 min):** Write test-rhubmf.md using pathlib with UTF-8 encoding, Unix
     line endings, and validate all technical requirements (heading structure, line endings,
     file size, encoding)
  2. **Phase 2 (5 min):** Stage file, commit with conventional message, and push to feature
     branch (feat/090-markdown-file-creation-302a53); verify working tree is clean

  **Pattern precedent:** 89+ identical features (069-089) establish clear conventions for
  content structure, format, encoding, and git workflow. This implementation follows those
  proven patterns.

  ---

  ## Task Details

  ### Phase 1: File Creation & Technical Validation

  #### Task 1.1: Write and validate markdown file (10 min)

  **What:** Create test-rhubmf.md using Python pathlib with proper markdown structure,
  UTF-8 encoding, and Unix line endings. Manually author meaningful prose (2-3 sentences).
  Validate file meets all technical requirements and adjust if necessary.

  **Why:** File must meet strict technical requirements (encoding, line endings, size,
  content structure) before proceeding to git operations. Validation ensures the file
  complies with the established pattern and all success criteria.

  **TDD Cycle:**

  **RED:** Write tests/assertions that the file meets all requirements:
  - File does not exist before creation
  - File contains H1 heading on first line (starts with '# ')
  - Line 2 is blank
  - File contains exactly 2-3 sentences of prose
  - File is UTF-8 encoded (no BOM)
  - File uses Unix LF line endings (\n)
  - File size is 320-600 bytes

  **GREEN:** Minimal implementation:
  - Write prose content (manually author 2-3 meaningful sentences on topic of choice)
  - Create file: `Path("test-rhubmf.md").write_text(f"# Title\n\n{prose}\n", encoding="utf-8")`
  - Read file back and validate all properties
  - If size outside 320-600 bytes, adjust prose and re-write

  **REFACTOR:**
  - Extract title to variable (e.g., file_title)
  - Extract prose to variable (e.g., prose_content)
  - Ensure code follows Python conventions (PEP 8)

  ---

  ### Phase 2: Git Integration

  #### Task 2.1: Stage file with git add (2 min)

  **What:** Run `git add test-rhubmf.md` to stage the created file for commit.

  **Why:** File must be staged before committing. This is the first step of the git
  integration workflow.

  **TDD Cycle:**

  **RED:** Assert file is not yet staged (git status should not show it under
  "Changes to be committed")

  **GREEN:** Run `git add test-rhubmf.md` and verify file appears in staging area
  (git status shows "new file: test-rhubmf.md" under "Changes to be committed")

  **REFACTOR:** No refactoring needed for git command execution

  ---

  #### Task 2.2: Commit with conventional message (2 min)

  **What:** Create a commit with conventional message format:
  `feat(090): create markdown file test-rhubmf.md with prose content`.
  Verify commit is created locally.

  **Why:** Commit formalizes the change with a standardized message that describes
  the feature and file created. Conventional commit format is required by spec.

  **TDD Cycle:**

  **RED:** Assert commit does not exist (git log should not show the message before
  creation)

  **GREEN:** Run `git commit -m "feat(090): create markdown file test-rhubmf.md with prose content"`
  and verify commit appears in git log (git log --oneline should show the commit)

  **REFACTOR:** No refactoring needed for git command execution

  ---

  #### Task 2.3: Push to feature branch (1 min)

  **What:** Push the commit to the remote feature branch
  `feat/090-markdown-file-creation-302a53`. Verify commit is on remote and working
  tree is clean.

  **Why:** Push makes the changes permanent in the repository and completes the feature
  workflow. Verifying working tree is clean ensures no unintended changes were made.

  **TDD Cycle:**

  **RED:** Assert commit is not on remote before push
  (git log origin/feat/090-markdown-file-creation-302a53 should not show the commit)

  **GREEN:** Run `git push -u origin feat/090-markdown-file-creation-302a53` and verify:
  - Commit appears on remote (git log origin/feat/090-... shows the commit)
  - Working tree is clean (git status outputs "working tree clean")

  **REFACTOR:** No refactoring needed for git command execution

  ---

  ## Effort Breakdown

  | Phase | Task | Estimate | Justification |
  | ----- | ---- | -------- | ------------- |
  | 1 | Write and validate markdown file | 10 min | Write prose (~5 min) + create file + validate (~3-5 min) |
  | 2 | Stage file | 2 min | Run git add command and verify |
  | 2 | Commit and push | 3 min | Run git commit and git push commands, verify |
  | **Total** | | **15 min** | Consistent with spec estimate (S = 10-15 min) |

