# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 89+ times. This feature creates a single
  test markdown file (`test-rhubmf.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 89+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-089.

  ## Success Criteria

  - [ ] File `test-rhubmf.md` is created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (#) serving as the title
  - [ ] File contains 2-3 sentences of prose content following a blank line after the title
  - [ ] Prose content is grammatically correct and semantically meaningful
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix-style LF line endings (\n), not Windows CRLF
  - [ ] File size is between 320-600 bytes (consistent with established pattern)
  - [ ] File is staged with `git add test-rhubmf.md`
  - [ ] Commit message follows conventional format: `feat(090): create markdown file test-rhubmf.md with prose content`
  - [ ] Changes are successfully pushed to feature branch `feat/090-markdown-file-creation-302a53`
  - [ ] No existing files are modified, deleted, or overwritten
  - [ ] Git working tree is clean after push

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-rhubmf.md` in the repository root using Python pathlib
  - **FR-2**: File must contain one H1 markdown heading (#) on the first line serving as the document title
  - **FR-3**: File must contain a blank line separating the title from prose content
  - **FR-4**: File must contain exactly 2-3 complete sentences of prose content following the title
  - **FR-5**: Prose content must be grammatically correct, coherent, and semantically meaningful (not placeholder or gibberish text)
  - **FR-6**: File must be written with UTF-8 encoding (without BOM)
  - **FR-7**: File must use Unix-style LF (\n) line endings throughout
  - **FR-8**: Stage the created file using `git add test-rhubmf.md`
  - **FR-9**: Create a git commit with message: `feat(090): create markdown file test-rhubmf.md with prose content`
  - **FR-10**: Push the commit to the feature branch `feat/090-markdown-file-creation-302a53`

  ## Non-Functional Requirements

  - **NFR-1**: File size must be approximately 320-600 bytes to match the established pattern from 89+ precedent files
  - **NFR-2**: Implementation must use only Python standard library (pathlib module) with no external dependencies
  - **NFR-3**: Implementation must be compatible with Python 3.11+ as specified in project requirements
  - **NFR-4**: Git operations must follow the established workflow pattern from features 069-089
  - **NFR-5**: No modifications to existing files, source code, configuration, or project structure outside of this single file creation
  - **NFR-6**: Topic selection for prose content is at the implementer's discretion; content should be appropriate and meaningful
  - **NFR-7**: Implementation must not depend on internet connectivity, external APIs, or services beyond what is already configured in the environment

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-rhubmf.md) to existing collection of 70+ test files; no modifications to existing files or structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code | None | Feature is purely file creation; does not depend on or impact /src/sheep/ application code |
  | Configuration | None | No modifications to pyproject.toml, .env, or other configuration files |
  | Documentation | None | No changes to README.md or other documentation (though documentation files may exist from prior features) |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/090-markdown-file-creation-302a53` must already exist (pre-created)
  - **File system permissions**: Write access to repository root directory (standard in development environment)
  - **Established pattern**: 89+ test files provide clear precedent for content structure, format, and quality expectations
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose with an appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size ~320-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 89+ prior features with identical requirements
  - Flexible topic selection with no research or architectural decisions required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-089 demonstrate efficient implementation of identical tasks in 10-15 minutes
  - Pattern is simple enough to implement without external libraries or complex logic

