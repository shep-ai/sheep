decisions:
  - title: 'File I/O Library Selection'
    chosen: 'Python pathlib.Path with open()'
    rejected:
      - 'os.path module — older API, less ergonomic for modern Python. pathlib is the standard approach in Python 3.11+'
      - 'Direct string paths with os.open() — lower level, requires more boilerplate for file operations'
    rationale: >
      pathlib is the modern, recommended approach in Python 3.11+ for file operations.
      It provides cross-platform path handling, intuitive API, and is used throughout
      the Sheep codebase (see file_tools.py, git_tools.py). Using Path(file_path).write_text()
      with encoding='utf-8' ensures UTF-8 encoding compliance and is more readable than
      open() context managers. Since features 069-089 demonstrate consistent use of this
      pattern, adopting it here maintains code consistency.

  - title: 'Text Encoding and Line Ending Strategy'
    chosen: 'UTF-8 encoding without BOM; Unix LF line endings (\n)'
    rejected:
      - 'UTF-16 or other encodings — UTF-8 is the standard, universal encoding with better compatibility'
      - 'Windows CRLF line endings (\r\n) — spec explicitly requires Unix LF; CRLF would introduce platform-specific inconsistency'
      - 'Detect system line endings dynamically — spec requirements are clear: Unix LF always'
    rationale: >
      The spec explicitly requires UTF-8 encoding without BOM and Unix LF line endings.
      Verified in existing test files (test-objvv0.md, test-l20qnc.md, test-tq33xp.md):
      all use ASCII (UTF-8 compatible), Unix LF (\n), no BOM. Using Python's default
      open(..., encoding='utf-8') with string concatenation and '\n' for line breaks
      ensures compliance. pathlib.Path.write_text() uses UTF-8 by default and respects
      the '\n' characters in the string literal, maintaining consistent behavior across
      Unix-like systems and CI/CD environments where features are tested.

  - title: 'Prose Content Generation and Quality'
    chosen: 'Meaningful, human-authored prose — no templates or placeholders'
    rejected:
      - 'Auto-generated placeholder text (e.g., "Lorem ipsum", randomly generated strings) — violates spec requirement for "grammatically correct and semantically meaningful" content'
      - 'Copy-pasting repeated content from previous files — violates the implicit expectation of unique, coherent content; would degrade quality if this pattern scales'
      - 'Programmatic content generation from a template — adds unnecessary complexity and risk of poor grammar or incoherent output'
    rationale: >
      The spec (FR-5) explicitly requires prose to be "grammatically correct, coherent,
      and semantically meaningful (not placeholder or gibberish text)." Analysis of
      existing files (features 089, 088, 087) shows diverse, thoughtful prose topics
      (e.g., learning from experience, deep work, regular breaks). These files demonstrate
      that content quality is essential to the feature's purpose. Generating prose manually
      ensures compliance with the quality requirement and maintains pattern integrity.
      The task is trivial (5 minutes to write title + 2-3 sentences), so manual authorship
      is the pragmatic choice.

  - title: 'File Size Validation Approach'
    chosen: 'Validate file size range (320-600 bytes) after writing'
    rejected:
      - 'Programmatic padding/truncation to meet size constraints — introduces risk of corrupting prose or producing unnatural text'
      - 'No validation of size — risks creating files outside the established pattern range and failing success criteria'
      - 'Strict pre-calculation of exact bytes — fragile and prone to off-by-one errors due to platform-specific line ending behavior'
    rationale: >
      The spec (NFR-1) requires files to be "approximately 320-600 bytes to match the
      established pattern from 89+ precedent files." Existing files (test-objvv0.md: 420B,
      test-l20qnc.md: 385B, test-tq33xp.md: 368B) all fall within this range. Rather than
      forcing content to fit a size, write natural prose and validate post-creation using
      Path.stat().st_size. If the file falls outside the range, adjust content (add or remove
      a sentence) and re-validate. This approach ensures quality content without artificial
      constraints and aligns with the "approximately 320-600 bytes" language (not strictly).

  - title: 'Git Workflow Integration'
    chosen: 'Use standard git CLI commands: git add, git commit, git push'
    rejected:
      - 'Direct manipulation of .git directory or using GitPython library — unnecessarily low-level and would require external dependencies'
      - 'Batch operations (git add -A instead of git add <specific-file>) — violates spec requirement (FR-8) to "stage the created file" and best practice of staging only intended changes'
    rationale: >
      The spec (FR-8 through FR-10) and established pattern (features 069-089) use
      standard git commands. Staging only the specific file (git add test-rhubmf.md)
      is clearer and safer than bulk operations. Git CLI is universally available,
      doesn't require additional dependencies, and is already integrated in the Sheep
      tools (see git_tools.py). The commit message format is standardized:
      `feat(090): create markdown file test-rhubmf.md with prose content` following
      conventional commits. The feature branch (feat/090-markdown-file-creation-302a53)
      pre-exists, so pushing to it is straightforward and aligns with the CI/CD workflow.

