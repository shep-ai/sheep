# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-04

  ## Architecture Overview

  The repo uses a flat-root pattern for state machine documentation: all example files
  live directly at the repository root with the naming convention SUBJECT_STATE_MACHINE.md.
  The new file slots in identically alongside STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md,
  and VENDING_MACHINE_STATE_MACHINE.md. No directory changes, index files, or build system
  modifications are needed.

  ## Key Design Decisions

  ### File structure: prose + diagram
  All existing files include a short prose description before the diagram block.
  VENDING_MACHINE_STATE_MACHINE.md (the most recent) uses a single descriptive sentence.
  The spec (FR-6, FR-7) explicitly requires 1–4 sentences of prose and a matching heading
  hierarchy. A single sentence is sufficient and keeps the file minimal.

  ### Mermaid version: stateDiagram-v2
  All three existing files use stateDiagram-v2. NFR-2 mandates it. v1 is deprecated.

  ### Transition label style: inline colon
  DOOR_LOCK_STATE_MACHINE.md — the structurally closest existing file (2 states,
  2 labelled transitions) — uses inline colon syntax: `Locked --> Unlocked : unlock`.
  The turnstile diagram is identical in structure and follows the same pattern.

  ### Initial state: explicit [*] --> Locked
  FR-5 requires it. All three existing files include it. The turnstile starts Locked
  by convention (a new turnstile blocks passage until a coin is inserted).

  ## Implementation Strategy

  One task, one file. Write TURNSTILE_STATE_MACHINE.md matching the DOOR_LOCK pattern
  (closest structural analog) while including the prose sentence used in VENDING_MACHINE.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error | Use stateDiagram-v2 syntax verified against DOOR_LOCK_STATE_MACHINE.md pattern |
  | Naming inconsistency | Mirror exact casing of DOOR_LOCK_STATE_MACHINE.md and VENDING_MACHINE_STATE_MACHINE.md |
  | Accidental modification of existing files | Single new file only; no edits to any existing file |
