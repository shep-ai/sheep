# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. File Structure: Prose + Diagram vs Diagram Only

  **Chosen:** Brief prose description (1 sentence) followed by a `stateDiagram-v2` Mermaid block

  **Rejected:**
  - Diagram only — inconsistent with VENDING_MACHINE_STATE_MACHINE.md; spec FR-6 explicitly requires prose

  **Rationale:** The spec requires 1–4 sentences of prose (FR-6) and the most recent
  comparable file (VENDING_MACHINE_STATE_MACHINE.md) already follows this pattern.

  ### 2. Mermaid Diagram Version

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — all existing files use v2; NFR-2 explicitly mandates v2

  **Rationale:** Every existing state machine file in the repo uses `stateDiagram-v2`.
  Consistency and NFR-2 both require v2.

  ### 3. Transition Label Style

  **Chosen:** Inline colon syntax — `Locked --> Unlocked : coin`

  **Rejected:**
  - Mermaid note blocks — overly verbose, not used anywhere in the repo
  - Unlabelled transitions — would omit required event names (coin, push) per FR-4

  **Rationale:** DOOR_LOCK_STATE_MACHINE.md uses identical structure (2 states, 2
  labelled transitions with inline colon syntax). The turnstile is structurally the same.

  ### 4. Initial State Indicator

  **Chosen:** `[*] --> Locked`

  **Rejected:**
  - No initial state — violates FR-5 and breaks the pattern established by all three existing files

  **Rationale:** All existing files begin with `[*] --> <FirstState>`. FR-5 requires it.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State machine diagram rendering | Use | Already used by all existing state machine files in the repo |

  ## Security Considerations

  None. This feature adds a single static Markdown file with no executable code,
  no user input, no network calls, and no dependencies. There are zero security
  implications.

  ## Performance Implications

  None. A small Markdown file has no measurable impact on repository performance,
  CI time, or any runtime system.

  ## Architecture Notes

  The repo follows a flat-root pattern for state machine documentation files:
  all Markdown examples live directly at the repository root with the naming
  convention SUBJECT_STATE_MACHINE.md. The new file slots in exactly the same
  way with no directory structure, index file, or build system changes needed.
  The turnstile diagram (2 states, 4 lines including [*] and 2 labelled transitions)
  is the simplest possible state machine and satisfies both the "unrelated to repo
  domain" and "super simple" constraints.
