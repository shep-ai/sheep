content: |
  ## Problem Statement

  The repo already contains several state machine diagram files (STATE_MACHINE.md,
  DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md). This feature adds one
  more standalone Markdown file with a simple, self-contained state machine diagram as a
  quick illustrative example unrelated to the repo.

  ## Codebase Analysis

  ### Project Structure

  - Root-level `.md` files hold content (jokes, design patterns, state machines).
  - `specs/` holds per-feature YAML + generated Markdown specs.
  - `src/` and `tests/` contain Python source and pytest tests.
  - `pyproject.toml` configures the Python project.

  ### Architecture Patterns

  Content files live directly at the repo root as standalone Markdown documents.
  No imports or code dependencies — purely documentation/content.

  ### Relevant Technologies

  - **Markdown** — file format for all content files.
  - **Mermaid stateDiagram-v2** — diagramming syntax used in existing state machine files.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new .md file) | Low | One new Markdown file, no code changes |

  ## Dependencies

  No code dependencies. Follows the existing Markdown + Mermaid convention visible in
  STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, and VENDING_MACHINE_STATE_MACHINE.md.

  ## Size Estimate

  **S** — Single file, pure content, no code, no tests required.
