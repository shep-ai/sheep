# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repo already contains several state machine diagram files (STATE_MACHINE.md,
  DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md). This feature adds one
  more standalone Markdown file with a simple, self-contained state machine diagram as a
  quick illustrative example unrelated to the repo domain.

  ## Success Criteria

  - [ ] A new Markdown file named `TURNSTILE_STATE_MACHINE.md` exists at the repo root.
  - [ ] The file contains a valid `stateDiagram-v2` Mermaid code block.
  - [ ] The diagram depicts a turnstile with exactly two states: Locked and Unlocked.
  - [ ] The diagram includes at least two transitions: coin (Locked → Unlocked) and push (Unlocked → Locked).
  - [ ] The file includes a short prose description (1–4 sentences) before the diagram.
  - [ ] The file follows the same Markdown heading and formatting style as existing state machine files.
  - [ ] No existing files are modified.
  - [ ] No source code or tests are added or changed.

  ## Functional Requirements

  - **FR-1**: The system SHALL provide a new file `TURNSTILE_STATE_MACHINE.md` at the repository root.
  - **FR-2**: The file SHALL contain a Mermaid `stateDiagram-v2` diagram block renderable by standard Mermaid parsers.
  - **FR-3**: The diagram SHALL model a turnstile state machine with states `Locked` and `Unlocked`.
  - **FR-4**: The diagram SHALL include a `coin` transition from `Locked` to `Unlocked` and a `push` transition from `Unlocked` to `Locked`.
  - **FR-5**: The diagram SHALL include an initial state indicator (`[*] --> Locked`).
  - **FR-6**: The file SHALL include a prose description of 1–4 sentences explaining the turnstile example.
  - **FR-7**: The file SHALL use the same heading hierarchy (`# Title`, optional `## Description`) as existing state machine files.

  ## Non-Functional Requirements

  - **NFR-1**: The file MUST follow the existing SUBJECT_STATE_MACHINE.md naming convention.
  - **NFR-2**: The Mermaid syntax MUST be valid `stateDiagram-v2` (not `stateDiagram` v1).
  - **NFR-3**: The state machine subject MUST be unrelated to the repository's primary domain.
  - **NFR-4**: The diagram MUST be simple enough to be understood at a glance (≤ 6 states, ≤ 8 transitions).
  - **NFR-5**: No Python source files, test files, or configuration files SHALL be created or modified.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which state machine topic? | Turnstile / coin gate | Canonical minimal example; avoids duplication with existing files |
  | 2 | What filename? | TURNSTILE_STATE_MACHINE.md | Matches established SUBJECT_STATE_MACHINE.md naming pattern |
  | 3 | Prose + diagram or diagram only? | Brief description + diagram | Consistent with all existing state machine files; near-zero extra effort |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new .md file) | Low | One new Markdown file, no code changes |

  ## Dependencies

  No code dependencies. Follows the existing Markdown + Mermaid convention visible in
  STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, and VENDING_MACHINE_STATE_MACHINE.md.

  ## Size Estimate

  **S** — Single file, pure content, no code, no tests required.
