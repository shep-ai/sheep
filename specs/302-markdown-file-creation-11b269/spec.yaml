content: |
  ## Problem Statement

  Feature 302 requires creating a single markdown file named test-5tz11t.md with specific structure and content:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 302nd iteration of a well-established feature pattern successfully executed 300+ times in the Sheep codebase. The implementation must follow proven architectural patterns and use existing infrastructure without modification.

  ## Success Criteria

  - [ ] File `test-5tz11t.md` exists at repository root (no subdirectories)
  - [ ] File contains exactly one H1 heading on the first line (matches `^# .+$` regex)
  - [ ] H1 heading is followed by exactly one blank line before prose content begins
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] Prose content is coherent and grammatically correct
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix LF line endings exclusively (no CRLF or mixed line endings)
  - [ ] File size is at least 50 bytes (ensures meaningful content)
  - [ ] File ends with exactly one trailing newline character
  - [ ] Git commit created with message: `feat(302): create markdown file test-5tz11t.md with prose content`
  - [ ] Commit author and message follow conventional commit format (type: scope: message)
  - [ ] Changes pushed to remote with upstream branch tracking (`git push -u origin HEAD`)
  - [ ] All validation checks pass before git operations (fail-fast)
  - [ ] No other files modified during feature execution
  - [ ] Feature execution completes without errors
  - [ ] No external files or directories outside repository are modified

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named exactly `test-5tz11t.md` at repository root (path: `./test-5tz11t.md`)
  - **FR-2**: File must contain an H1 markdown heading (`# Title`) as the first line
  - **FR-3**: H1 heading must be separated from prose by exactly one blank line
  - **FR-4**: File must contain exactly 2 or 3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be coherent, grammatically correct, and relate to a single topic
  - **FR-6**: Content must be generated via Anthropic Claude API using the LLM factory from `sheep.config.llm.get_reasoning_llm()`
  - **FR-7**: File must be encoded as UTF-8 without BOM and validated before writing to disk
  - **FR-8**: File must use Unix LF line endings exclusively (validated via binary read check)
  - **FR-9**: File changes must be staged using `git add test-5tz11t.md`
  - **FR-10**: Changes must be committed with conventional commit message: `feat(302): create markdown file test-5tz11t.md with prose content`
  - **FR-11**: Commit must be pushed to remote with upstream tracking (`git push -u origin HEAD`)
  - **FR-12**: System must validate file format and encoding before git operations
  - **FR-13**: Implementation must call `create_markdown_file(filename="test-5tz11t.md", feature_number=302)` from `content_generators.py`
  - **FR-14**: No files outside repository root must be modified
  - **FR-15**: Implementation must use `pathlib.Path` for all file operations to ensure cross-platform compatibility

  ## Non-Functional Requirements

  - **NFR-1**: File size must be at least 50 bytes to ensure meaningful content
  - **NFR-2**: Prose content must be grammatically correct and coherent (validated by LLM generation with built-in checks)
  - **NFR-3**: Feature execution must complete within 5 minutes including LLM API call
  - **NFR-4**: All file I/O operations must use `pathlib.Path` for cross-platform compatibility
  - **NFR-5**: Implementation must follow established pattern from features 297-301 (no architectural deviation)
  - **NFR-6**: All validation errors must be logged using `sheep.observability.logging.get_logger()`
  - **NFR-7**: Git operations must not modify any files outside the target markdown file
  - **NFR-8**: Implementation must use only existing infrastructure (no new dependencies or major version updates)
  - **NFR-9**: Code style must match `src/sheep/features/feature_*.py` conventions
  - **NFR-10**: Feature must handle Unicode content gracefully (emoji, accented characters, etc. are acceptable)
  - **NFR-11**: Error messages must be descriptive and actionable for debugging
  - **NFR-12**: Feature module must be located at `src/sheep/features/feature_302_markdown_file_creation.py`
  - **NFR-13**: All git operations must be idempotent where possible (e.g., rerunning should use same commit message)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content topic: random vs. constrained? | Random topic chosen by LLM | Maximizes variety, matches 301 prior features, aligns with "about any topic" spec |
  | 2 | Git push failure handling? | Fail fast - push failure stops feature | Ensures data integrity and consistent git history; explicit requirement in spec |
  | 3 | Validate prose uniqueness vs. previous files? | No uniqueness validation | Not required by spec, not in 301 prior features, would require architectural changes |
  | 4 | Maximum execution time? | 5 minutes (hard timeout) | Already specified in NFR-3, proven constraint from 301 prior features |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/feature_302_markdown_file_creation.py` | High | New file creation following established pattern. Simple wrapper calling `create_markdown_file()` helper. ~40 lines of code. |
  | `src/sheep/content_generators.py` | None | No changes needed. The `create_markdown_file()` orchestration function is already implemented and tested across 301 prior features. Only needs invocation with filename=test-5tz11t.md and feature_number=302. |
  | Repository root | High | Output location where test-5tz11t.md will be created. Existing test-*.md files demonstrate this is the expected location. |
  | `.git/` directory | Medium | Git operations will stage, commit, and push changes to remote. Commit message added to history. No structural changes to git config or hooks. |
  | `src/sheep/config/llm.py` | None | No changes needed. LLM factory already configured for content generation via CrewAI. |
  | `tests/` | None | No new test files required. Feature follows proven pattern with comprehensive validation in content_generators.py. |

  ## Dependencies

  **Internal Dependencies**:
  - `sheep.content_generators.create_markdown_file()` — Main orchestration function (generates content, writes file, validates, commits, pushes)
  - `sheep.observability.logging.get_logger()` — Structured logging utility
  - `pathlib.Path` — Cross-platform path operations

  **External Dependencies**:
  - **CrewAI** (version >=0.86.0) — Agent framework (indirect, used by overall architecture; no direct use in feature module)
  - **Anthropic Claude API** — Content generation via LLM (accessed via CrewAI's factory in `config/llm.py`)
  - **Git CLI** — Executable for staging, committing, pushing (subprocess)
  - **Python Standard Library** — subprocess, pathlib, logging

  **No New Dependencies Required**: All required infrastructure is already in place and proven across 301+ prior features.

  ## Implementation Strategy

  The implementation will follow the established pattern from features 297-301:

  1. **Create feature module** `src/sheep/features/feature_302_markdown_file_creation.py`
     - Define `MARKDOWN_FILENAME = "test-5tz11t.md"`
     - Define `FEATURE_NUMBER = 302`
     - Create function `create_test_5tz11t_markdown_file()` calling `create_markdown_file()`
     - Implement `main()` function for standalone execution

  2. **Invoke orchestration function**
     - Call `create_markdown_file(filename="test-5tz11t.md", feature_number=302)`
     - The function handles all steps: generate, write, validate, commit, push

  3. **Git workflow** (handled automatically by orchestration function)
     - File is created at repository root
     - Git commit with message: `feat(302): create markdown file test-5tz11t.md with prose content`
     - Push to remote branch with upstream tracking

  No changes needed to existing modules. Implementation is a thin wrapper around proven infrastructure.

  ## Size Estimate

  **S** (hours, ~1-2 hours including testing)

  **Rationale**:
  - The core infrastructure (content generation, validation, git operations) is mature and tested across 301+ features
  - The feature follows an established pattern with 301 prior implementations as reference
  - The implementation is primarily a wrapper around `create_markdown_file()` orchestration function
  - No architectural changes, no dependency updates, no complex logic
  - Main effort: create feature module following convention, invoke orchestration, verify output
  - Risk is minimal due to proven pattern and comprehensive validation in content_generators module
  - Creation of feature file itself: ~10 minutes, testing/verification: ~10-20 minutes

  ---

  _Requirements phase complete — ready for implementation_
