  ## Codebase Analysis

  ### Project Structure

  Sheep is an agentic platform for automated code implementation using CrewAI.

  ```
  src/sheep/
  ├── __init__.py
  ├── cli.py                    # Typer CLI entry point
  ├── agents/                   # Agent definitions
  │   ├── code_agents.py        # Research, Implementation, Review agents
  │   └── general_agents.py     # General-purpose agents
  ├── config/                   # Configuration management
  │   ├── settings.py           # Pydantic settings
  │   └── llm.py                # LLM provider factory
  ├── flows/                    # Flow orchestration
  │   ├── code_implementation.py # Main implementation flow
  │   └── chat.py               # Chat flow
  ├── observability/            # Logging and tracing
  │   ├── logging.py            # Structured logging (structlog)
  │   └── langfuse_client.py    # Langfuse integration
  └── tools/                    # Agent tools
      ├── file_tools.py         # File operations
      ├── git_tools.py          # Git operations
      └── web_tools.py          # Web search tools
  ```

  Root-level markdown files contain content generated by previous features
  (jokes, state machine diagrams, design patterns, etc.).

  The `specs/` directory holds feature specifications managed by the shep
  feature agent system.

  ### Architecture Patterns

  - **Flow-based orchestration**: CrewAI flows define execution structure;
    crews provide AI decision-making at each step.
  - **Separation of concerns**: Agents, tools, flows, config, and observability
    are in separate packages.
  - **Pydantic settings**: Configuration via environment variables with
    pydantic-settings.
  - **Multi-LLM support**: Factory pattern in `config/llm.py` supports
    OpenAI, Anthropic, and Google models.
  - **CLI via Typer**: Entry point registered as `sheep` console script.

  ### Relevant Technologies

  - **Python 3.11+** with hatchling build system
  - **CrewAI >= 0.86.0** for agent orchestration
  - **Pydantic v2** for data validation and settings
  - **Typer** for CLI
  - **GitPython** for git operations
  - **Langfuse** for observability/tracing
  - **Ruff** for linting, **mypy** for type checking, **pytest** for testing

