# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings"
    rejected:
      - "subprocess with echo command — requires shell escaping, platform-specific behavior, less reliable for special characters"
      - "os.open() with manual encoding — more verbose, lower-level, no benefit over pathlib API"
      - "open() context manager with manual encoding handling — more boilerplate, pathlib is modern standard"
    rationale: >
      pathlib.Path.write_text() is the modern Python standard (introduced in 3.4) for text file
      operations. It provides atomic writes, handles encoding transparently, and supports the
      newline parameter for cross-platform line ending control. All 300+ precedent test files use
      this approach. The explicit newline="\n" parameter ensures Unix LF line endings on all
      platforms (Windows, Linux, macOS) without relying on platform-specific defaults. This is
      critical for reproducible test artifacts and git diff consistency.

  - title: "Line Ending Handling"
    chosen: "Explicit newline=\"\n\" parameter in write_text() to force Unix LF on all platforms"
    rejected:
      - "Platform default line endings (newline=None) — causes CRLF on Windows, breaks test consistency, diverges from 300+ precedents"
      - "Manual LF replacement with str.replace() — error-prone, loses semantic information about intent"
      - "Use os.linesep — creates platform-specific files, violates spec requirement for Unix LF"
    rationale: >
      The spec explicitly requires Unix-style LF (\n) line endings for consistency across all
      platforms. Using newline="\n" is the correct Python API for this. The Python documentation
      states: "When writing output to the stream, if newline is '\n', any '\n' characters written
      are passed through as-is. When reading input from the stream, if newline is '\n', universal
      newlines mode is disabled." This ensures that constructed content with explicit \n characters
      is written as-is without platform translation. Feature specs and 300+ precedents all require
      this behavior.

  - title: "Git Integration Approach"
    chosen: "subprocess.run() with git CLI commands for add, commit, and push operations"
    rejected:
      - "GitPython library — adds external dependency not in tech stack, overkill for simple git operations, increases attack surface"
      - "os.system() or shell=True — deprecated, security risk (command injection), harder to debug with exit codes"
      - "Direct git manipulation via git API — complexity without benefit, subprocess is lightweight and proven"
    rationale: >
      The git CLI is available in all environments (Linux, macOS, Windows with Git Bash). Using
      subprocess.run() is lightweight, requires no external dependencies, and provides proper exit
      code handling and error reporting. All 300+ precedent implementations use this approach.
      subprocess.run() with check=True raises CalledProcessError on non-zero exit, providing clear
      error handling. The pattern is: git add (stage), git commit -m (conventional message),
      git push -u origin HEAD (push to feature branch). This is the standard workflow across
      the codebase.

  - title: "Content Source and Generation"
    chosen: "Hardcoded prose content in Python source, topically coherent with H1 title"
    rejected:
      - "AI-generated content at runtime — adds non-determinism, complexity, potential latency, not in established pattern"
      - "Content template system — unnecessary abstraction, test files are simple, no reusable template library"
      - "Random content generator — violates determinism requirement for test artifacts, makes debugging harder"
    rationale: >
      Test markdown files are validation artifacts with no production code impact. Hardcoded
      content is deterministic, reproducible, and easy to debug. Feature specifications grant
      \"complete creative freedom\" on topic selection, so each implementer chooses a coherent
      topic and writes 2-3 sentences. This approach is used by all 300+ precedent test files.
      Content should be topically relevant to the H1 heading (e.g., if title is \"Resilience\",
      prose discusses resilience). This creates higher-quality validation artifacts while
      maintaining simplicity.

  - title: "Error Handling Strategy"
    chosen: "Defensive programming with specific exception handling: FileExistsError, OSError, subprocess.CalledProcessError"
    rejected:
      - "No error handling — silently fails or overwrites existing files, makes debugging harder, poor user experience"
      - "Generic catch-all with bare except — masks actual problems, violates Python best practices, loses error context"
      - "Suppress exceptions with try-except-pass — invalid file prevents subsequent git operations, creates hard-to-debug state"
    rationale: >
      Proper error handling prevents data loss (file overwrite), provides clear feedback (why did
      it fail?), and enables debugging. Checking if file exists before writing prevents accidental
      overwrites. Catching specific exceptions allows appropriate handling: FileExistsError ->
      report conflict and exit, OSError -> report I/O problem, CalledProcessError -> report git
      command failure with stderr. This pattern matches production quality standards and is used
      in feature 219 and other recent implementations. The established pattern includes try-catch
      blocks with informative stderr messages.

