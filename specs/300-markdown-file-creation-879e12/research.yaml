  - question: "Should the git push use '-u origin HEAD' (set upstream tracking) or just 'push origin' (push without tracking)?"
    resolved: true
    options:
      - option: "Use 'git push -u origin HEAD' to set upstream tracking"
        description: >
          The -u flag sets the upstream branch for this feature branch, making future pushes
          simpler (git push alone will work). Better for subsequent commits to the same branch.
          Aligns with feature branch workflow.
        selected: true
      - option: "Use 'git push origin HEAD' without upstream tracking"
        description: >
          Push to remote without setting upstream. Works but requires -u flag on next push to
          same branch. Less convenient but acceptable.
        selected: false
      - option: "Use 'git push -f origin HEAD' to force-push"
        description: >
          Force push would overwrite any existing remote history. Dangerous and unnecessary for
