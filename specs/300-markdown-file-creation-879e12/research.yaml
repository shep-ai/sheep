# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-31
  - **Pattern:** Established (300+ precedents)

  ## Overview

  This feature creates a single markdown test file (`test-egnd6v.md`) following the established
  pattern used for 300+ prior test files (features 006-299). The implementation is straightforward
  file creation with standard git workflow.

  **Key Findings:**
  - Well-established pattern with proven implementations in features 297, 298, 299
  - No new technologies or architectural decisions required
  - File I/O uses Python 3.11+ stdlib only (pathlib, subprocess, no external dependencies)
  - Git integration is standard git CLI via subprocess
  - Content is hardcoded prose, topically coherent with H1 title

  ## Technology Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path.write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - `subprocess` with `echo` command — requires shell escaping, platform-specific
  - `os.open()` — verbose, low-level, no benefit over pathlib
  - `open()` context manager — more boilerplate, pathlib is modern standard

  **Rationale:** pathlib is the modern Python standard for text file operations. The `newline="\n"`
  parameter ensures Unix LF line endings on all platforms, which is critical for test consistency
  and git diff clarity. All 300+ precedent test files use this exact approach. The encoding
  parameter ensures UTF-8 without BOM.

  ### 2. Line Endings: Explicit Unix LF

  **Chosen:** `newline="\n"` parameter forces Unix LF on all platforms

  **Rejected:**
  - Platform defaults (newline=None) — causes CRLF on Windows, breaks consistency
  - Manual string replacement — error-prone, loses semantic intent
  - os.linesep — creates platform-specific files

  **Rationale:** The feature spec requires Unix LF line endings for reproducibility. Using
  `newline="\n"` is the correct Python API. This ensures that `\n` characters in content are
  written as-is without platform translation, creating consistent files across Windows, Linux,
  and macOS.

  ### 3. Git Integration: subprocess.run()

  **Chosen:** `subprocess.run(["git", "add", filename], check=True)` and similar for commit/push

  **Rejected:**
  - GitPython library — external dependency, not in tech stack, overkill
  - `os.system()` — deprecated, security risk, poor error handling
  - Direct git API manipulation — unnecessary complexity

  **Rationale:** The git CLI is universally available. subprocess.run() is lightweight, provides
  proper exit code handling, and requires no external dependencies. check=True raises
  CalledProcessError on non-zero exit, enabling clear error handling. All 300+ precedent
  implementations use this approach.

  **Git Workflow:**
  - `git add test-egnd6v.md` — stage file
  - `git commit -m "feat(300): create markdown file test-egnd6v.md with prose content"` — commit with conventional message
  - `git push -u origin HEAD` — push to feature branch with upstream tracking

  ### 4. Content Source: Hardcoded Prose

  **Chosen:** Hardcoded prose in Python source, topically coherent with H1 title

  **Rejected:**
  - AI-generated content — adds non-determinism, latency, unnecessary complexity
  - Template system — unnecessary abstraction for simple content
  - Random generators — violates determinism requirement for test artifacts

  **Rationale:** Test files are validation artifacts, not production code. Hardcoded content is
  fully deterministic and reproducible. The feature spec grants complete creative freedom on
  topic selection. Each implementer chooses a coherent topic and writes 2-3 sentences. This
  approach is universal across 300+ precedent files and keeps implementation simple while
  maintaining quality.

  **Content Pattern:**
  ```
  # Title Here

  2-3 sentences of prose content that are topically relevant to the title. The sentences should
  be grammatically correct and properly punctuated. Content naturally falls within 300-500 bytes.
  ```

  ### 5. Error Handling: Defensive with Specific Exceptions

  **Chosen:** Check file existence, catch FileExistsError, OSError, subprocess.CalledProcessError

  **Rejected:**
  - No error handling — silent failure or accidental overwrite
  - Bare except — masks problems, violates best practices
  - suppress with try-except-pass — creates broken state

  **Rationale:** Defensive programming prevents data loss and provides clear failure messages.
  Checking if file exists prevents overwrites. Specific exception handling enables appropriate
  recovery: FileExistsError → report conflict and exit, OSError → report I/O problem,
  CalledProcessError → report git failure with stderr. This enables effective debugging.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | Text file I/O | Use | Modern, stdlib, supports newline parameter, 300+ precedents |
  | subprocess (stdlib) | Git command execution | Use | Lightweight, no external deps, proper error handling, 300+ precedents |
  | UTF-8 encoding | Text encoding | Use | Spec requirement, Python 3 default, widely supported |
  | GitPython | Alternative git interface | Reject | Not in tech stack, external dependency, unnecessary for simple operations |
  | shell commands | Alternative for git | Reject | Security risk (command injection), deprecated, poor error handling |
  | Template engines (Jinja2, etc.) | Content generation | Reject | Unnecessary complexity, hardcoded prose is simpler and proven |
  | AI APIs (OpenAI, Anthropic, etc.) | Content generation | Reject | Non-determinism, latency, external dependency, diverges from established pattern |

  ## Security Considerations

  **File Operations:**
  - pathlib.Path.write_text() is safe for UTF-8 text files
  - No risk of path traversal (filename is fixed as test-egnd6v.md)
  - File is created in repository root (expected location)
  - No command injection possible (content is literal string, not interpolated into shell)

  **Git Operations:**
  - subprocess.run() with check=True prevents executing broken commands
  - Commit message is hardcoded, not from user input (no injection risk)
  - Using subprocess as list (["git", "commit", "-m", message]) prevents shell injection
  - Git CLI is trusted and widely used in CI/CD systems

  **Prose Content:**
  - Content is hardcoded in source, not from external sources
  - No XSS risk (markdown is for documentation, not web display at this stage)
  - Grammar and coherence are human-curated, not generated

  **Overall Risk Profile:** Minimal. This is a simple file creation with no user input, external
  sources, or network operations.

  ## Performance Considerations

  **File Creation:** Negligible
  - Write operation: < 1ms for 400-600 byte file
  - UTF-8 encoding: < 1ms
  - Path operations: < 1ms
  - Total: < 5ms

  **Git Operations:** Minimal (seconds)
  - `git add`: < 100ms (file already in working tree)
  - `git commit`: < 500ms (local operation, 300+ existing test files)
  - `git push`: 1-5 seconds (depends on network, feature branch is lightweight)
  - Total: 2-6 seconds

  **Overall:** Implementation should complete in 5-15 minutes (as per feature estimate).

  **No optimization needed:**
  - File size is small (400-600 bytes is natural for 2-3 sentences)
  - No memory concerns (single file in memory)
  - No I/O bottlenecks (file creation is atomic)
  - Git operations are sequential but fast (expected behavior)

  ## Architecture Notes

  **Fit into Codebase:**
  - Feature is purely file creation at repository root (no code modules)
  - Does not modify or depend on `/src/sheep/` or application code
  - Follows established pattern from 300+ prior test files (features 006-299)
  - No database, API, or configuration changes required

  **Integration Points:**
  - Git repository: Uses standard git workflow (add, commit, push)
  - Feature branch: `feat/300-markdown-file-creation-879e12` (pre-created)
  - Commit message: Follows conventional commits format (`feat(300):`)
  - No interaction with build, test, or deployment systems

  **Precedents and Patterns:**
  - Features 297, 298, 299: Identical markdown file creation pattern
  - 300+ test files at repository root: Established artifact collection
  - No shared code, utilities, or helpers needed
  - Each feature implementation is self-contained and independent

  ## Known Constraints

  1. **Filename**: test-egnd6v.md must be used exactly as specified
  2. **Git branch**: Must commit on feat/300-markdown-file-creation-879e12 (pre-created)
  3. **Git user**: Must have git user.name and user.email configured
  4. **Write access**: Must have write permission to repository root (expected)
  5. **Markdown format**: Must follow CommonMark spec for H1 headings and prose
  6. **File encoding**: Must be UTF-8 without BOM, with LF line endings

  ## Recommendation

  This is a straightforward feature with a well-established pattern. Proceed with implementation
  using the proven approach from features 297-299:

  1. Create markdown file with pathlib.Path.write_text() using UTF-8 and newline="\n"
  2. Use subprocess.run() for git operations (add, commit, push)
  3. Hardcode prose content that is topically coherent with the H1 title
  4. Include defensive error handling for file and git operations
  5. Follow conventional commit message format

  Expected implementation time: 5-15 minutes.

