content: |
  ## Summary

  This task breakdown implements feature 300 across 2 phases:

  **Phase 1: File Creation** (Task 1)
  Create the markdown file test-egnd6v.md at the repository root with proper structure:
  an H1 heading as title and 2-3 sentences of topically coherent prose content. The implementation
  must explicitly control encoding (UTF-8 without BOM) and line endings (Unix LF) using pathlib
  to ensure cross-platform consistency matching the 300+ precedent test files.

  **Phase 2: Git Integration** (Task 2)
  Implement standard git workflow: stage the created file, commit with a conventional commit
  message (feat(300):...), and push to the remote origin repository with upstream tracking enabled.
  All git operations use subprocess.run() with the check=True flag to ensure proper error handling.

  ## Task Dependencies

  Task 2 depends on Task 1: The file must exist on disk before git operations can stage it.
  The sequential ordering ensures the file is created and validated before any git operations.

  ## TDD Approach

  Each task follows a complete TDD cycle:

  **Task 1 (File Creation)**:
  - RED: Verify preconditions (file doesn't exist yet)
  - GREEN: Create file with pathlib, specifying content, encoding, and line endings
  - REFACTOR: Validate file structure, encoding, line endings, and content quality

  **Task 2 (Git Integration)**:
  - RED: Verify preconditions (commit doesn't exist in git log, file not staged)
  - GREEN: Execute subprocess.run() calls in sequence: add, commit, push
  - REFACTOR: Add error handling, verify exact message format, ensure proper command structure

  ## Effort Breakdown

  - Task 1 (File Creation): 5-10 minutes
    - Content selection and prose writing: ~3-5 minutes
    - File I/O with pathlib: ~1 minute
    - Validation of encoding and line endings: ~1-2 minutes

  - Task 2 (Git Integration): 3-5 minutes
    - Git add/commit/push subprocess calls: ~2-3 minutes
    - Error handling and verification: ~1-2 minutes

  **Total: 10-15 minutes** (aligns with feature estimate of S/Small)
