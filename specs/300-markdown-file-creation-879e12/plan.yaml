content: |
  ## Architecture Overview

  This feature creates a single markdown test artifact following the established pattern from
  300+ precedent test files across features 006-299. The implementation is deliberately minimal
  and straightforward:

  1. **File Creation** (Phase 1): Create test-egnd6v.md at repository root using pathlib.Path.write_text()
     with explicit UTF-8 encoding and Unix LF line endings
  2. **Git Workflow** (Phase 2): Stage, commit with conventional message, and push using subprocess.run()
     for git CLI execution

  The feature integrates seamlessly into the existing codebase:
  - Does not modify or depend on any source code in /src/sheep/
  - Follows the established test artifact pattern (test-*.md files at repository root)
  - Uses only Python 3.11+ stdlib (pathlib, subprocess) — no external dependencies
  - Git workflow aligns with all 300+ precedent implementations

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text() with Explicit Encoding Control

  **Decision**: Use `pathlib.Path("test-egnd6v.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale**:
  - pathlib is the modern Python standard for text file operations (available since Python 3.4)
  - The `newline="\n"` parameter ensures Unix LF line endings on all platforms (Windows, Linux, macOS)
  - The `encoding="utf-8"` parameter ensures UTF-8 without BOM (Byte Order Mark)
  - This approach is proven across 300+ precedent test files
  - Atomic writes prevent partial file creation on failure
  - Handles encoding transparently — no manual stream management needed

  **Alternatives Considered**:
  - subprocess with echo command: requires shell escaping, platform-specific behavior, less reliable
  - os.open(): verbose and low-level, offers no benefit over pathlib modern API
  - open() context manager: more boilerplate, pathlib is the standard approach in modern Python

  ### 2. Line Ending Handling: Explicit Unix LF on All Platforms

  **Decision**: Use `newline="\n"` parameter in write_text() to force Unix LF

  **Rationale**:
  - Feature spec explicitly requires Unix-style LF line endings for reproducibility
  - Platform-default line endings (newline=None) produce CRLF on Windows, breaking consistency
  - The newline parameter is the correct Python API for cross-platform line ending control
  - Ensures consistent git diff output across all developer machines and CI systems
  - All 300+ precedent test files use this exact approach for consistency

  ### 3. Git Integration: subprocess.run() with Git CLI

  **Decision**: Use `subprocess.run(["git", "add", filename], check=True)` pattern for all git operations

  **Rationale**:
  - Git CLI is universally available (Linux, macOS, Windows with Git Bash)
  - subprocess.run() with check=True is lightweight and provides proper exit code handling
  - List-based command format (not shell string) prevents command injection attacks
  - Raises CalledProcessError on non-zero exit, enabling clear error handling
  - No external dependencies (GitPython not in tech stack)
  - All 300+ precedent implementations use this proven pattern

  **Git Workflow**:
  - `git add test-egnd6v.md` — stage file in index
  - `git commit -m "feat(300): create markdown file test-egnd6v.md with prose content"` — conventional commit
  - `git push -u origin HEAD` — push with upstream tracking enabled

  ### 4. Content Source: Hardcoded Prose with Topical Coherence

  **Decision**: Hardcode prose content in Python source, topically relevant to H1 title

  **Rationale**:
  - Test markdown files are validation artifacts, not production code
  - Hardcoded content is fully deterministic and reproducible (no non-determinism from generation)
  - Feature spec grants \"complete creative freedom\" on topic selection
  - Each implementer chooses a coherent topic and writes 2-3 sentences
  - Proven across all 300+ precedent test files — human-curated content creates higher-quality artifacts
  - No need for template systems, AI generation, or random content pools

  **Content Pattern**:
  ```
  # Title Here

  2-3 sentences of prose content that are topically relevant to the title. The sentences
  should be grammatically correct and properly punctuated, creating a coherent document.
  ```

  ### 5. Error Handling: Defensive with Specific Exceptions

  **Decision**: Check file existence, catch FileExistsError, OSError, and subprocess.CalledProcessError

  **Rationale**:
  - Prevents accidental file overwrite if test-egnd6v.md already exists
  - Provides clear, actionable error messages for debugging
  - Specific exception handling enables appropriate recovery strategies:
    - FileExistsError → report conflict and exit
    - OSError → report I/O problem (permissions, disk space, etc.)
    - CalledProcessError → report git failure with stderr output
  - Aligns with production-quality error handling standards

  ## Implementation Strategy

  **Phase 1 → Phase 2 Dependency**: File must be created (Phase 1) before git operations (Phase 2).
  The file on disk is the precondition for `git add`, which stages it for `git commit`.

  **Why This Order**:
  - File creation is fast and self-contained (no dependencies)
  - Git operations depend on file existing in working tree
  - Clear separation of concerns: first create artifact, then integrate with version control

  **Parallel Opportunities**: None. Phase 2 tasks (add, commit, push) are sequential by nature
  (add must complete before commit, commit must complete before push).

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File already exists (collision) | Low | Check with Path.exists() before write; raise FileExistsError with clear message if conflict detected |
  | Incorrect encoding (not UTF-8) | Low | Explicitly specify encoding=\"utf-8\" in write_text(); validation step verifies BOM absence |
  | Incorrect line endings (CRLF on Windows) | Low | Explicitly specify newline=\"\\n\" in write_text(); prevents platform translation |
  | Git configuration missing (user.name, user.email) | Medium | subprocess.run() will fail with clear stderr; error message directs user to configure git |
  | No write permission on repository root | Medium | OSError caught; error message reports permission denied; user must check repository access |
  | Network failure during push | Low | CalledProcessError caught; error message includes git stderr; user can retry push manually |
  | Feature branch doesn't exist | Medium | CalledProcessError on push; error message includes git stderr output with hint about branch |
  | Conflicting git state (uncommitted changes) | Low | git add of new file is non-conflicting; existing unrelated changes don't block this feature |
