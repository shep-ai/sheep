# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature is a minimal, isolated change following the well-established pattern from
  73+ existing test markdown files (test-*.md) at the repository root. The implementation
  involves:

  1. **File Creation**: Use Python's `pathlib.Path.write_text()` to create the markdown file
     with explicit UTF-8 encoding and LF line endings.
  2. **Content**: Direct string construction with a markdown H1 heading and 2-3 sentences of prose.
  3. **Git Workflow**: Use `subprocess.run()` for git operations (add, commit, push), matching
     the existing pattern in `src/sheep/tools/git_tools.py`.

  The feature integrates seamlessly with the existing codebase:
  - **No source code changes**: Feature is purely file creation, no modifications to `/src/sheep/`
  - **Pattern match**: All 73+ existing test files use identical approach
  - **Standard library only**: Uses pathlib and subprocess (no new dependencies)
  - **Size**: Small, single-file operation (~400-650 bytes)

  ## Key Design Decisions

  ### 1. File I/O Implementation (pathlib)

  **Decision**: Use `pathlib.Path().write_text()` directly.

  **Rationale**:
  - Standard library, idiomatic Python 3.4+
  - Matches existing `FileWriteTool` pattern in `src/sheep/tools/file_tools.py:96`
  - All 73+ existing test files use this approach
  - Simpler and more readable than alternatives (os.open, open(), template libraries)
  - Handles encoding and file closing automatically

  **Alternatives rejected**:
  - `os.open() + os.write()`: Low-level, verbose, doesn't match patterns
  - `open()` builtin: Works but less Pythonic than pathlib
  - Template libraries (Jinja2, Mako): Over-engineering for a 2-3 sentence string

  ### 2. Content Generation (Direct String Construction)

  **Decision**: Inline the heading and prose content directly in the implementation.

  **Rationale**:
  - Spec explicitly allows "about anything" (NFR-8); topic is unrestricted
  - No new dependencies allowed (NFR-9); external APIs ruled out
  - Content is small (~100-150 words); doesn't warrant abstraction
  - Maximizes readability and maintainability of test artifacts
  - All 73+ existing test files use this simple approach

  **Alternatives rejected**:
  - External template file: Adds filesystem dependency, over-engineered
  - Procedural generation: Adds complexity with minimal benefit
  - External API integration: Violates no-new-dependencies requirement

  ### 3. Git Workflow (subprocess.run())

  **Decision**: Use `subprocess.run()` with direct git command invocation.

  **Rationale**:
  - Existing pattern established in `src/sheep/tools/git_tools.py` (lines 15-29)
  - Used consistently across 8 different git operations in the codebase
  - subprocess is standard library; no new dependencies required
  - Simpler for trivial operations (add, commit, push) than abstraction layers
  - Error handling via CalledProcessError is straightforward

  **Alternatives rejected**:
  - GitPython: Available in dependencies but adds abstraction for simple operations
  - Shell commands (`os.system()`, `shell=True`): Security risk, harder to handle output
  - High-level abstractions (dulwich): Over-engineered, adds unnecessary dependency

  ### 4. Encoding and Line Endings (UTF-8 + LF)

  **Decision**: UTF-8 encoding without BOM, LF line endings.

  **Rationale**:
  - Spec explicitly requires UTF-8 without BOM and LF line endings (NFR-1, NFR-2)
  - All 73+ existing test files use this encoding
  - Existing `FileWriteTool` uses `encoding="utf-8"` explicitly
  - Use `newline="\n"` in `write_text()` to ensure LF across all platforms
    (Windows defaults to CRLF, which violates spec)

  **Alternatives rejected**:
  - CRLF line endings: Violates spec and test file patterns
  - UTF-8 with BOM: Violates spec, causes markdown parser issues
  - Different encoding: Limits character set unnecessarily

  ### 5. Markdown Syntax (CommonMark Compliant)

  **Decision**: Use H1 heading syntax with plain prose (no inline formatting).

  **Rationale**:
  - CommonMark is the standard markdown specification
  - Spec requires exactly one H1 heading (FR-3) and 2-3 sentences (FR-4)
  - H1 syntax (`# Title`) is more readable than alternatives (underline with ====)
  - Plain prose without formatting keeps content simple and matches 73+ test files

  **Alternatives rejected**:
  - Alternative heading syntax (underline): Less readable in plain text
  - Multiple headings or sections: Over-engineers per spec requirement
  - Inline formatting (bold, italics, code): Not required, adds unnecessary complexity

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2**: File creation must complete and be validated before git operations.
  The file must exist on disk with correct properties before it can be staged, committed, and pushed.

  ### Phase 1: File Creation and Validation
  - Create markdown content string with H1 heading and 2-3 sentences
  - Write to `test-y09rnu.md` using `Path.write_text()` with UTF-8 encoding and LF line endings
  - Validate file exists, has correct size (400-650 bytes), encoding, and content structure
  - TDD cycle: Write test that asserts file properties, implement file creation, refactor if needed

  ### Phase 2: Git Workflow
  - Stage file: `git add test-y09rnu.md`
  - Commit: `git commit -m "feat(075): create markdown file test-y09rnu.md with prose content"`
  - Push: `git push -u origin feat/075-markdown-file-creation-8c70a9`
  - Validate: File is committed and pushed to remote
  - TDD cycle: Write tests for git status/log, implement commands, validate

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (overwrite) | Verify file doesn't exist before creation; if it does, fail explicitly |
  | Incorrect encoding (CRLF on Windows) | Use explicit `newline="\n"` parameter in `write_text()` to force LF |
  | File size out of range | Validate file size after creation (400-650 bytes) |
  | Git operations fail (bad config, network) | Use `check=True` in subprocess.run() to fail fast on errors |
  | BOM in UTF-8 file | Use default UTF-8 encoding (no BOM) in pathlib; don't use UTF-8-sig |
  | Invalid markdown syntax | Test file content against CommonMark spec: verify H1 heading, blank line, 2-3 sentences |
  | Branch doesn't exist or wrong branch | Verify feature branch exists before pushing; use explicit branch name in push command |

  ## Success Criteria Summary

  - ✅ File `test-y09rnu.md` exists in repository root
  - ✅ File contains exactly one H1 heading followed by blank line and 2-3 sentences
  - ✅ File is UTF-8 encoded without BOM, uses LF line endings
  - ✅ File size is 400-650 bytes
  - ✅ Git commit exists with message: `feat(075): create markdown file test-y09rnu.md with prose content`
  - ✅ Changes are pushed to remote feature branch `feat/075-markdown-file-creation-8c70a9`

