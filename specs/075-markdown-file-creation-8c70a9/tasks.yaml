# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature implements 4 sequential tasks across 2 phases:

  **Phase 1: File Creation and Validation** (Task 1)
  - Create markdown file test-y09rnu.md with H1 heading and 2-3 sentences of prose
  - Validate encoding (UTF-8 without BOM), line endings (LF), file size (400-650 bytes)
  - Estimated effort: 20 minutes

  **Phase 2: Git Workflow** (Tasks 2-3-4)
  - Task 2: Stage file with `git add` (10 min)
  - Task 3: Commit with conventional message (10 min)
  - Task 4: Push to remote feature branch (15 min)
  - Subtotal: 35 minutes

  **Total Estimated Effort: 1 hour 15 minutes**

  All tasks use TDD cycles (RED-GREEN-REFACTOR) with specific test assertions.
  Dependencies are linear: Task 1 → Task 2 → Task 3 → Task 4.
  No tasks can run in parallel; file must exist before staging, staging before commit, commit before push.

  ## Task Execution Flow

  1. **Create file** (task-1): Write test-y09rnu.md with valid markdown content, UTF-8 encoding, LF line endings
  2. **Stage file** (task-2): Run `git add test-y09rnu.md` and verify file is staged
  3. **Commit** (task-3): Run `git commit` with conventional message and verify commit exists
  4. **Push** (task-4): Run `git push -u origin feat/075-...` and verify remote is updated

  Each task has explicit acceptance criteria and TDD assertions. Tests verify both success
  (file exists, is staged, etc.) and properties (encoding, size, line endings, commit message).

  ## Testing Strategy

  All tasks use TDD RED-GREEN-REFACTOR cycles:
  - **RED**: Write assertions that fail before implementation
  - **GREEN**: Implement minimal code to pass assertions
  - **REFACTOR**: Clean up, verify quality, optimize if needed

  Tests for file properties (size, encoding, line endings) use low-level file I/O:
  - `Path.stat().st_size` for file size validation
  - `file.read_bytes()[:2]` check for BOM (UTF-8 without BOM has no BOM bytes)
  - `file.read_text().count('\r\n')` vs `file.read_text().count('\n')` for line ending validation

  Tests for git operations use subprocess output capture and return codes:
  - `git status` parsing to verify staged files
  - `git log --oneline` to verify commit message
  - `git ls-remote` to verify remote push

  ## Risk Mitigation

  | Task | Risk | Mitigation |
  | ---- | ---- | ---------- |
  | 1 | File already exists | Check `Path().exists()` before creation; fail if file is present |
  | 1 | Encoding issues (CRLF on Windows) | Use explicit `newline="\n"` in write_text() |
  | 2 | Git not configured | git add will fail fast; catch CalledProcessError |
  | 3 | Branch doesn't exist | Feature branch created in advance (pre-created) |
  | 4 | Network issues | Network errors will cause subprocess to raise CalledProcessError; handle gracefully |
  | 4 | Permission denied | Verify user has push rights to origin; catch PermissionError |

  ## Success Criteria

  All acceptance criteria from all tasks must be met:
  - ✅ File test-y09rnu.md exists with valid markdown content
  - ✅ File is UTF-8 encoded without BOM and uses LF line endings
  - ✅ File size is 400-650 bytes
  - ✅ File is staged in git
  - ✅ Commit exists with message "feat(075): create markdown file test-y09rnu.md with prose content"
  - ✅ Commit is pushed to remote feature branch
  - ✅ All TDD assertions pass (RED-GREEN-REFACTOR cycles complete)

