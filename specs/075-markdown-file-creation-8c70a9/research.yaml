    rationale: >
      CommonMark is the standard markdown specification. The spec requires exactly
      one H1 heading (FR-3) and 2-3 sentences of prose (FR-4). This structure
      matches all 73+ existing test files. H1 syntax (# Title) is more readable
      than alternative heading syntax. Plain prose without inline formatting keeps
      content simple and maintainable.

