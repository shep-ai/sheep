content: |
  ## Architecture Overview

  Feature 175 follows the established self-contained pattern from 170+ similar markdown file creation features
  (170-174). The implementation has three distinct layers that separate concerns and enable comprehensive testing:

  ### Implementation Structure

  **create_markdown_file.py** — Implementation script with three core functions:

  1. **create_file()** — File creation layer
     - Defines markdown content: H1 heading + blank line + 2-3 sentences prose
     - Uses pathlib.Path.write_bytes() with explicit UTF-8 encoding
     - Ensures Unix LF line endings via explicit '\n' characters in content string
     - Returns Path object for validation

  2. **validate_file(filepath)** — Validation layer
     - Verifies file exists and is readable
     - Checks file size is within 300-800 byte guideline
     - Validates structure: H1 heading + blank line + prose content
     - Confirms UTF-8 encoding (no BOM) and LF line endings
     - Raises AssertionError with descriptive messages on failure
     - Returns True on success

  3. **git_operations()** — Git integration layer
     - Executes three-step workflow: git add, git commit, git push
     - Uses subprocess.run(check=True) for strict error handling
     - Follows conventional commit format: feat(175): description
     - Enables clear exception propagation via CalledProcessError

  4. **main()** — Orchestrator function
     - Coordinates workflow: create → validate → git operations
     - Provides user-friendly status messages and error reporting
     - Exits with status 0 on success, 1 on failure

  **test_create_markdown_file.py** — Comprehensive test suite:
  - pytest fixtures for isolated temporary directories
  - TestCreateFile class: 10+ unit tests for file creation
  - TestValidateFile class: 10+ tests for validation logic
  - TestInvalidFileCreation class: Helper function for generating invalid test files
  - TestIntegration class: End-to-end workflow tests with mocked git operations

  ### How This Fits the Sheep Architecture

  Feature 175 is completely self-contained and follows the reference pattern established by feature 173:
  - No modifications to Sheep platform codebase
  - No dependencies on other features or modules
  - Self-executing script pattern (can be run directly with `python create_markdown_file.py`)
  - Git serves as the output interface (commits represent successful completion)
  - Test suite integrates with project pytest framework

  ### File Organization

  ```
  specs/175-markdown-file-creation-35f9af/
  ├── create_markdown_file.py          # Implementation: file creation, validation, git ops
  ├── test_create_markdown_file.py     # Test suite: unit + integration tests
  ├── feature.yaml                     # Feature specification
  ├── plan.yaml                        # This file
  └── tasks.yaml                       # Task breakdown
  ```

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path with write_bytes()

  **Chosen:** `filepath.write_bytes(content.encode('utf-8'))`

  **Rationale:**
  - pathlib is the modern Python 3.11+ standard for file operations
  - write_bytes() provides precise binary control, essential for encoding without BOM
  - Established pattern from feature 173 (reference implementation)
  - Cross-platform compatibility without manual path string manipulation

  ### 2. UTF-8 Encoding Without BOM

  **Chosen:** Python's 'utf-8' codec (not 'utf-8-sig')

  **Rationale:**
  - Python 3's standard 'utf-8' codec never adds Byte Order Mark (BOM)
  - Only 'utf-8-sig' codec adds BOM; we explicitly reject that choice
  - Using write_bytes(content.encode('utf-8')) guarantees BOM-free output
  - Requirement explicitly specifies "UTF-8 encoding without BOM"

  ### 3. Unix LF Line Endings

  **Chosen:** Explicit '\n' characters in content string, combined with write_bytes()

  **Rationale:**
  - Requirement specifies Unix-style LF line endings (not Windows CRLF)
  - When content string is encoded to bytes with 'utf-8', '\n' becomes byte 0x0A (LF)
  - This approach is deterministic and works on all operating systems
  - Avoids os.linesep (platform-dependent) or write_text() (abstracts line endings)
  - Matches pattern from feature 173

  ### 4. File Size Validation: Structure-Based Guideline

  **Chosen:** Validate structure (H1 + blank line + prose) with 300-800 byte consistency check

  **Rationale:**
  - Core requirement is markdown structure, not exact byte count
  - File size naturally emerges from 2-3 sentences of prose: typically 300-800 bytes
  - Overly strict byte enforcement (e.g., "exactly 400-600") is too rigid
  - The 300-800 range serves as a consistency signal to catch malformed content
  - Product decision specifies "300-800 bytes as guideline, not hard constraint"
  - Matches feature 173 approach

  ### 5. Git Operations: subprocess.run(check=True)

  **Chosen:** Three separate subprocess.run() calls with check=True

  **Rationale:**
  - subprocess.run(check=True) automatically raises CalledProcessError on failure
  - Provides clean exception handling without manual error checking
  - check=True enables strict error propagation for main() to catch
  - Modern Python standard for external command execution
  - List-style arguments (not shell=True) prevents shell injection
  - Matches feature 173 pattern

  ### 6. Testing Framework: pytest

  **Chosen:** pytest with fixtures, parametrization, and mock.patch

  **Rationale:**
  - pytest is the standard testing framework in the Sheep project
  - Superior fixture support (tempfile fixtures) vs unittest
  - Cleaner test syntax (assert statements vs self.assertEqual())
  - Better error messages and test discovery
  - Feature 173 establishes pytest pattern for this codebase
  - Active maintenance and community adoption

  ### 7. Test Isolation: Real Temporary Directories

  **Chosen:** tempfile.TemporaryDirectory with os.chdir() to reset working directory

  **Rationale:**
  - Real temporary directories ensure tests work with actual filesystem behavior
  - Using os.chdir() is explicit and ensures tests don't interfere with each other
  - Tests fail with real filesystem issues (not mock misconfigurations)
  - Matches feature 173 established pattern
  - Easier to debug filesystem-related failures

  ### 8. Prose Content: Hardcoded for Feature 175

  **Chosen:** Hardcoded prose specific to feature 175 (test-ijl29t.md)

  **Rationale:**
  - Product decision specifies arbitrary placeholder text with hardcoding
  - Each of 170+ features has unique content; template reusability is minimal
  - Hardcoding is explicit and reduces dependencies
  - Matches feature 173 pattern: unique prose for each feature
  - Simplifies implementation and debugging

  ### 9. Validation Errors: AssertionError

  **Chosen:** AssertionError with descriptive error messages

  **Rationale:**
  - AssertionError is Python standard for validation failures
  - Enables easy pytest matching: `pytest.raises(AssertionError, match="...")`
  - Error messages should be descriptive to aid debugging (e.g., "File size 250 bytes outside typical range")
  - Matches feature 173 pattern and Python testing conventions

  ### 10. Git Commit Message: Conventional Commits

  **Chosen:** "feat(175): create markdown file test-ijl29t.md with title and prose content"

  **Rationale:**
  - Conventional Commits is industry standard for semantic versioning
  - Format: feat(NUMBER): description enables automatic changelog generation
  - Consistent across all 170+ similar features in the codebase
  - Requirement specification defines exact commit message format

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation)** comes first because tests must exist before implementation can be validated.
  Setting up the test file and module structure enables the TDD approach (RED → GREEN → REFACTOR).

  **Phase 2 (File Creation)** comes second because it's the core functionality. Creating the file with
  proper content, encoding, and line endings is foundational for all subsequent steps.

  **Phase 3 (Validation)** comes third because validation builds on file creation. With a working
  create_file() function, we can write comprehensive validation tests and handle error cases.

  **Phase 4 (Git Integration)** comes last because it depends on both file creation and validation.
  The git workflow only makes sense once we have a properly created and validated file.

  ### TDD Approach

  Each task follows the RED → GREEN → REFACTOR cycle:
  - **RED**: Write test that asserts the desired behavior (fails first because code doesn't exist)
  - **GREEN**: Write minimal implementation to pass the test
  - **REFACTOR**: Clean up, extract helpers, improve naming, add docstrings

  This ensures comprehensive test coverage and validates implementation correctness continuously.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Encoding issues (BOM, character encoding) | Use write_bytes() with explicit 'utf-8' codec; test validates no BOM present; test decodes file as UTF-8 |
  | Line ending inconsistency (CRLF vs LF) | Use explicit '\n' in content strings; write_bytes() ensures binary is unchanged; test verifies LF present and CRLF absent |
  | File size outside expected range | Validate file size is 300-800 bytes; tests verify size check passes for valid files and fails for invalid ones |
  | Git operations fail silently | Use subprocess.run(check=True) to raise CalledProcessError on failure; main() catches and reports error |
  | Validation gaps (missing coverage) | Create helper function to generate invalid test files; test all error paths (missing heading, blank line, prose, encoding, size) |
  | Tests interfere with each other | Use tempfile.TemporaryDirectory and os.chdir() to isolate test environments; each test has its own isolated directory |
  | Git operations run in tests | Mock subprocess.run in integration tests to verify commands without executing actual git operations |
  | Incorrect file naming | Use module-level constant FILENAME = "test-ijl29t.md"; all functions reference constant, preventing naming errors |

  ## Implementation Notes

  ### Constants at Module Level

  Following feature 173 pattern, define at module level:
  ```python
  FILENAME = "test-ijl29t.md"
  MARKDOWN_TITLE = "..."  # Unique heading for feature 175
  MARKDOWN_PROSE = "..."  # 2-3 sentences of arbitrary placeholder text
  COMMIT_MESSAGE = "feat(175): create markdown file test-ijl29t.md with title and prose content"
  ```

  This approach ensures:
  - Constants are visible and easy to verify
  - Functions reference constants (no hardcoding filenames in multiple places)
  - Testing can mock/patch constants if needed
  - Pattern is consistent with 170+ similar features

  ### Validation Logic Order

  validate_file() checks in this order:
  1. File exists (immediate failure if missing)
  2. File size in 300-800 range (consistency check)
  3. File starts with H1 heading "# "
  4. File contains blank line ("\n\n")
  5. File has prose content after blank line

  This order is intentional: existence check first (fast failure), then size check (early detection of structural issues),
  then detailed structure checks. Matches feature 173 pattern.

  ### Git Workflow

  Three separate subprocess.run() calls (not batched):
  1. `git add test-ijl29t.md` — Stage the file
  2. `git commit -m "feat(175): ..."` — Commit with conventional message
  3. `git push -u origin HEAD` — Push to remote with upstream tracking

  This separation allows:
  - Clear error reporting (which command failed)
  - Test verification of individual commands
  - Independent failure handling for each step

  ### Error Handling in main()

  main() catches two types of exceptions:
  - `subprocess.CalledProcessError` — Git command failed (specific error reporting)
  - `Exception` — Any other error (generic error reporting)

  Exit codes:
  - 0 on success (file created, validated, committed, pushed)
  - 1 on any failure (with error message to stderr)

  This matches feature 173 pattern and enables CI/CD integration.
