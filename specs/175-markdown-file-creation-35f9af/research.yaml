decisions:
  - title: "File I/O Library Selection"
    chosen: "pathlib.Path"
    rejected:
      - "os.path module — older API, less intuitive, requires more boilerplate for cross-platform compatibility"
      - "subprocess for file operations — overcomplicates file creation, inappropriate tool selection"
    rationale: >
      pathlib.Path is the modern, recommended standard library module for file operations in Python 3.11+.
      It provides an object-oriented API with excellent cross-platform support, works seamlessly with the
      Path.write_bytes() method for encoding control, and is already established in the codebase across
      170+ similar features (feature 173, etc.). pathlib is more readable and maintainable than os.path
      string manipulations.

  - title: "UTF-8 Encoding and BOM Handling"
    chosen: "write_bytes() with explicit 'utf-8' encoding"
    rejected:
      - "write_text() with encoding parameter — doesn't guarantee BOM-free output, less control over binary format"
      - "encoding='utf-8-sig' — adds UTF-8 BOM which violates requirement for BOM-free encoding"
    rationale: >
      The requirement explicitly specifies UTF-8 encoding without Byte Order Mark (BOM). Using
      write_bytes(content.encode('utf-8')) gives precise control: the Python string encoding to bytes
      never adds a BOM with 'utf-8' codec (only 'utf-8-sig' does). This pattern is established in feature 173
      and ensures correct binary output across all platforms. write_text() doesn't provide the same level
      of control and may introduce platform-specific behaviors.

  - title: "Line Ending Strategy (LF vs CRLF)"
    chosen: "Explicit '\\n' characters in content string"
    rejected:
      - "os.linesep — platform-dependent, would create CRLF on Windows, violates Unix LF requirement"
      - "write_text() with universal newlines — abstracts line endings, creates platform-specific behavior"
    rationale: >
      The requirement specifies Unix-style LF line endings (not Windows CRLF). Using explicit '\\n' characters
      in the content string, combined with write_bytes(), ensures LF on all platforms. This is simple, explicit,
      and matches the established pattern from feature 173. When the string is encoded to bytes with 'utf-8',
      '\\n' becomes the single byte 0x0A (LF), never CRLF, regardless of OS.

  - title: "File Size Validation Approach"
    chosen: "Structure validation (H1 + blank line + prose) with 300-800 byte guideline"
    rejected:
      - "Strict byte range enforcement (e.g., must be exactly 400-600 bytes) — overly rigid, sentence length varies naturally"
      - "No size validation — loses consistency signal, weakens ability to detect malformed content"
    rationale: >
      The core requirement is markdown structure (H1 heading, blank line, 2-3 sentences of prose).
      File size naturally emerges from this structure: 2-3 sentences of prose plus heading typically yields
      300-800 bytes. Rather than enforce a hard byte constraint, the implementation validates structure first
      and checks file size is in the observed typical range (300-800 bytes) as a consistency signal.
      This matches feature 173 pattern and the product decision to treat 300-800 bytes as a guideline,
      not a hard constraint.

  - title: "Git Command Execution Strategy"
    chosen: "subprocess.run() with check=True"
    rejected:
      - "subprocess.call() — doesn't raise exception on error, requires manual error checking"
      - "os.system() — deprecated, poor error handling, shell injection risks"
      - "subprocess.Popen() — unnecessary complexity for simple sequential commands"
    rationale: >
      subprocess.run() with check=True is the modern Python standard library approach for executing
      external commands. It automatically raises subprocess.CalledProcessError if any git command fails,
      providing clean exception handling. The check=True parameter ensures strict error handling: any
      non-zero exit code raises an exception rather than silently failing. This matches the established
      pattern in feature 173 and enables clear error propagation in main().

  - title: "Testing Framework Selection"
    chosen: "pytest with fixtures and parametrization"
    rejected:
      - "unittest — more boilerplate, less flexible fixture system, verbose test syntax"
      - "nose — deprecated, no longer actively maintained, less community adoption"
    rationale: >
      pytest is the standard testing framework used throughout the Sheep project. It provides superior fixture
      support (tempfile fixtures), cleaner test syntax (assert statements instead of self.assertEqual()),
      better error messages, and parametrization for testing multiple scenarios. Feature 173 uses pytest
      and establishes the pattern for this codebase. pytest is actively maintained and the modern Python
      testing standard.

  - title: "Test Isolation Strategy"
    chosen: "tempfile.TemporaryDirectory with os.chdir() to reset working directory"
    rejected:
      - "Mock filesystem (unittest.mock.patch('pathlib.Path')) — difficult to debug, obscures actual behavior"
      - "pytest tmpdir fixture alone — doesn't reset cwd, causes test interference if not careful"
    rationale: >
      Creating real temporary directories with tempfile ensures tests work with actual file system
      behavior (permissions, symlinks, encoding detection, etc.) and are easier to debug. Using os.chdir()
      to reset the working directory is explicit and ensures tests don't interfere with each other.
      This approach creates real files so test failures show actual filesystem issues rather than mock misconfigurations.
      Matches the established pattern in feature 173.

  - title: "Prose Content Generation Strategy"
    chosen: "Hardcoded prose specific to this feature (not template-based)"
    rejected:
      - "Template-based generator function — adds complexity, minimal reusability across one-off features"
      - "Random content generation — requires external dependency (faker, random), harder to debug"
    rationale: >
      The product decision specifies arbitrary placeholder text with hardcoded prose. This keeps implementation
      simple and explicit: anyone reading the code sees exactly what prose content will be created. Each feature
      (170+) has unique content, so template reusability is minimal. Hardcoding matches the established pattern
      from feature 173 and reduces dependencies.

  - title: "Validation Error Handling"
    chosen: "AssertionError with descriptive error messages"
    rejected:
      - "ValueError — less semantic for validation assertions, not the convention in Sheep"
      - "Custom exception class — unnecessary complexity for simple validation"
    rationale: >
      AssertionError is the standard Python exception for assertions and validation logic. It clearly communicates
      intent (\"this assumption/requirement failed\"). Using AssertionError makes validation failures easy to catch
      in pytest using pytest.raises(AssertionError, match=\"...\"). Error messages should be descriptive (e.g.,
      \"File size 250 bytes is outside typical range (300-800 bytes)\") to help debug failures. This matches feature 173
      pattern and Python testing conventions.

  - title: "Git Commit Message Format"
    chosen: "Conventional Commits format: feat(175): create markdown file test-ijl29t.md with title and prose content"
    rejected:
      - "Free-form messages (e.g., \"Create test file\") — loses semantic structure, harder to parse"
      - "semantic-release format variations — overkill for simple file creation"
    rationale: >
      Conventional Commits is an industry standard that structures commit messages semantically. The format
      \"feat(NUMBER): description\" clearly indicates this is a feature commit with the feature number and
      a descriptive summary. This matches the requirement specification and is consistent across all 170+
      similar features in the codebase. It enables automatic changelog generation and clear git history.

