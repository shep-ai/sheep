content: |
  ## Technology Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** pathlib.Path with write_bytes() and explicit UTF-8 encoding

  **Rejected:**
  - os.path module — older API, less intuitive, requires more boilerplate for cross-platform paths
  - subprocess for file operations — inappropriate tool, overcomplicates file creation

  **Rationale:** pathlib is the modern Python 3.11+ standard for file operations. It provides an
  object-oriented API, excellent cross-platform support without manual path manipulation, and integrates
  seamlessly with Path.write_bytes() for precise encoding control. The pattern is established across
  170+ similar features in the codebase (feature 173, etc.).

  ### 2. Encoding Strategy: write_bytes() with Explicit UTF-8

  **Chosen:** `filepath.write_bytes(content.encode('utf-8'))`

  **Rejected:**
  - write_text() — doesn't guarantee BOM-free output, less binary control
  - encoding='utf-8-sig' — adds UTF-8 BOM, violates \"no BOM\" requirement

  **Rationale:** The requirement specifies UTF-8 without Byte Order Mark (BOM). Using write_bytes()
  with explicit 'utf-8' encoding gives precise control: Python's 'utf-8' codec never adds BOM
  (only 'utf-8-sig' does). This approach ensures correct binary output across platforms and matches
  the pattern from feature 173.

  ### 3. Line Endings: Explicit \\n Characters

  **Chosen:** Explicit '\\n' in content string, combined with UTF-8 encoding to bytes

  **Rejected:**
  - os.linesep — platform-dependent, creates CRLF on Windows, violates Unix LF requirement
  - write_text() — abstracts line endings, creates platform-specific behavior

  **Rationale:** Requirement specifies Unix-style LF line endings. Using explicit '\\n' in the content
  string ensures LF on all platforms: when encoded as UTF-8, '\\n' becomes byte 0x0A (LF), never CRLF,
  regardless of operating system. This is simple, explicit, and deterministic. Matches feature 173 pattern.

  ### 4. File Size Validation: Structure-Based with Guidelines

  **Chosen:** Validate structure (H1 + blank line + prose); check file size is 300-800 bytes

  **Rejected:**
  - Strict enforcement: \"file must be exactly 400-600 bytes\" — too rigid, sentence length varies
  - No validation: ignore file size — loses consistency signal

  **Rationale:** Core requirement is markdown structure. File size naturally emerges from the structure
  (2-3 sentences typically yields 300-800 bytes). The implementation validates structure first and treats
  the 300-800 byte range as a guideline/consistency check, not a hard constraint. This aligns with the
  product decision \"file size as guideline, not hard constraint\" and matches feature 173 pattern.

  ### 5. Git Operations: subprocess.run(check=True)

  **Chosen:** subprocess.run() with check=True for strict error handling

  **Rejected:**
  - subprocess.call() — doesn't raise exception on error
  - os.system() — deprecated, poor error handling
  - subprocess.Popen() — unnecessary complexity

  **Rationale:** subprocess.run() with check=True is the modern Python standard for executing external
  commands. It automatically raises subprocess.CalledProcessError on non-zero exit codes, enabling clean
  exception handling. This matches the pattern from feature 173 and enables informative error messages in
  main().

  ### 6. Testing Framework: pytest

  **Chosen:** pytest with fixtures, parametrization, and mock.patch for git operations

  **Rejected:**
  - unittest — more boilerplate, less flexible fixtures
  - nose — deprecated, no longer maintained

  **Rationale:** pytest is the standard framework in the Sheep project. It provides superior fixture
  support (tempfile fixtures), cleaner test syntax (assert vs self.assertEqual()), better error messages,
  and active maintenance. Feature 173 establishes the pytest pattern for this codebase.

  ### 7. Test Isolation: Real Temporary Directories

  **Chosen:** tempfile.TemporaryDirectory with os.chdir() for working directory reset

  **Rejected:**
  - Mock filesystem (mock.patch) — difficult to debug, obscures actual behavior
  - pytest tmpdir fixture alone — doesn't reset cwd consistently

  **Rationale:** Real temporary directories ensure tests work with actual filesystem behavior
  (permissions, encoding detection, symlinks). Using os.chdir() is explicit and ensures tests
  don't interfere with each other. This makes failures easier to debug and matches feature 173 pattern.

  ### 8. Prose Content: Hardcoded

  **Chosen:** Hardcoded prose specific to this feature

  **Rejected:**
  - Template-based generator — adds complexity, minimal reusability for one-off features
  - Random generation — adds external dependency, harder to debug

  **Rationale:** Product decision specifies arbitrary placeholder text with hardcoding. Each of the
  170+ features has unique content, so template reusability is minimal. Hardcoding is explicit and
  reduces dependencies. Matches feature 173 pattern.

  ### 9. Validation Errors: AssertionError

  **Chosen:** AssertionError with descriptive error messages

  **Rejected:**
  - ValueError — less semantic for validation
  - Custom exception — unnecessary complexity

  **Rationale:** AssertionError is the Python standard for validation failures. Error messages should
  be descriptive (e.g., \"File size 250 bytes outside typical range (300-800)\"). This matches feature 173
  and enables easy pytest exception matching: `pytest.raises(AssertionError, match=\"...\")`

  ### 10. Git Commit Message: Conventional Commits Format

  **Chosen:** feat(175): create markdown file test-ijl29t.md with title and prose content

  **Rejected:**
  - Free-form messages — loses semantic structure
  - Variations on semantic-release format — overkill

  **Rationale:** Conventional Commits format (feat(NUMBER): description) is an industry standard
  that enables semantic versioning, automatic changelog generation, and clear git history. This
  matches the requirement and is consistent across all 170+ features.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File path operations and I/O | Use | Modern standard library, cross-platform, established in codebase |
  | subprocess | Execute git commands | Use | Standard library, clean error handling with check=True |
  | tempfile | Create isolated test directories | Use | Standard library, ensures test isolation without mocking |
  | pytest | Testing framework | Use | Project standard, superior fixtures and assertions |
  | unittest.mock | Mock subprocess calls in tests | Use | Standard library, enables git operation verification without real commits |
  | sys | Exit status codes | Use | Standard library, needed for main() exit handling |
  | os | Change working directory in tests | Use | Standard library, necessary for test directory isolation |

  No external packages are required beyond pytest (already in project dependencies).

  ## Security Considerations

  1. **File Encoding Safety**: Using explicit UTF-8 encoding without BOM prevents encoding-related attacks
     and ensures consistent, predictable file format across platforms.

  2. **Line Ending Consistency**: Explicit LF line endings prevent CRLF injection attacks and ensure
     consistent file format that can't be manipulated by line ending conversion.

  3. **Subprocess Safety**: Using subprocess.run() with list-style command arguments (not shell=True)
     prevents shell injection attacks. The command is: `['git', 'add', FILENAME]` (not `'git add ' + FILENAME`).

  4. **File Path Safety**: pathlib prevents path traversal attacks better than string concatenation.
     The filename is hardcoded as `test-ijl29t.md`, not user-input.

  5. **Git Credentials**: subprocess.run() inherits environment, so git credentials from .git/config
     or SSH keys are available. No credential storage in code.

  ## Performance Considerations

  1. **File I/O**: write_bytes() is efficient for small files (<1KB). No optimization needed.

  2. **Validation**: Validation is O(n) where n is file size. Reading full file into memory is acceptable
     for markdown files (typically <1KB).

  3. **Git Operations**: subprocess.run() spawns new process for each command (add, commit, push).
     This is standard and expected. Could be optimized to batch commands, but unnecessary for this feature.

  4. **Testing**: tempfile operations are fast. Mock patches avoid real git operations, keeping tests quick.

  5. **No Caching**: File is created once, validated once, committed once. No caching needed.

  ## Architecture Notes

  ### How This Fits Into the Sheep Platform

  This feature follows the established architecture pattern from 170+ similar markdown file creation features
  (170-174). Key architectural characteristics:

  1. **Self-Contained**: Feature 175 is completely independent. No modifications to Sheep platform code.
     No dependencies on other Sheep modules or features.

  2. **Executable Script Pattern**: Implementation is a Python script (create_markdown_file.py) that can
     be run directly with python or through Sheep's automation. The main() function orchestrates the workflow.

  3. **Three-Layer Pattern**: Established across 170+ features:
     - **Creation layer**: create_file() — builds markdown content
     - **Validation layer**: validate_file() — verifies structure and format
     - **Integration layer**: git_operations() — stages, commits, pushes

  4. **Git as Output Interface**: Results are committed to git. This enables:
     - Reproducibility (git history)
     - Tracking (git blame, git log)
     - CI/CD integration (commits trigger workflows)
     - Remote synchronization (push)

  5. **Test Suite Pattern**: Comprehensive pytest tests ensure:
     - File creation correctness
     - Validation logic
     - Error handling
     - Git operation correctness (via mocking)
     - Integration workflows

  ### Code Organization

  - `/specs/175-markdown-file-creation-35f9af/create_markdown_file.py` — Implementation script
  - `/specs/175-markdown-file-creation-35f9af/test_create_markdown_file.py` — Test suite
  - No changes to Sheep platform codebase

  ### Reusability

  This implementation is a reference pattern for future similar features. The three-function approach
  (create/validate/git) can be adapted for other file creation tasks by:
  1. Changing FILENAME, MARKDOWN_TITLE, MARKDOWN_PROSE constants
  2. Adjusting validation rules for different file formats
  3. Keeping git operations and test structure identical

  ## Integration Points

  - **Git Integration**: Uses git add/commit/push via subprocess (standard git commands)
  - **File System**: Creates file in repository root (current working directory)
  - **Testing**: Follows pytest convention, integrates with project test suite
  - **CI/CD**: Commits are automatically tracked by git and can trigger downstream workflows

  ## Implementation Risk Assessment

  **Low Risk**:
  - Uses only standard library modules (pathlib, subprocess, tempfile)
  - Follows established pattern from 170+ successful features
  - Comprehensive test coverage (unit + integration tests)
  - No external dependencies
  - Self-contained, no impact on Sheep platform

  **Mitigation**:
  - Tests use real tempfile (not mocks) to catch filesystem issues early
  - Validation tests cover all failure cases
  - Integration tests verify complete workflow
  - Error messages are descriptive for debugging

  ---

  **Research Phase Complete**: All technical decisions documented with rationale and alternatives considered.
  Ready for implementation phase (feature 175 creation).
