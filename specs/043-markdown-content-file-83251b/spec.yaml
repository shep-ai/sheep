content: |
  ## Problem Statement

  Create a new markdown file called `test-g12aiq.md` in the repository root with a title and 2-3 sentences of content about any topic. This continues an established pattern in the Sheep project, which maintains a collection of markdown content files serving various purposes (documentation, guides, examples, tests, etc.).

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI. The repository structure relevant to this feature includes:

  - **Repository Root**: Contains markdown content files organized in two patterns:
    - Documentation/content files: `JOKE.md`, `CLASSIC_JOKE.md`, `DESIGN_PATTERN.md`, `ELEVATOR_STATE_MACHINE.md`, etc.
    - Test files: `test-509s35.md`, `test-o73tv2.md`, `test-em3o13.md`, `test-gkrlxj.md`, `test-gsul5o.md`, etc.
  - **`/specs`**: Contains 68+ feature specifications organized by number and name (e.g., `specs/043-markdown-content-file-83251b/`, `specs/042-markdown-content-file-4d9hc/`)
  - **`/src/sheep`**: Python source code for the agentic platform (agents, flows, configuration, tools, observability)
  - **`/.github`**: GitHub Actions workflows for CI/CD pipelines
  - **`/tests`**: Pytest test files (29 test files covering various features)
  - **Core Configuration**: `pyproject.toml` (Python project configuration), `Dockerfile`, `docker-compose.yml`, `README.md`

  ### Architecture Patterns

  The repository follows a clear, consistent architectural pattern:

  1. **Feature-Driven Development**: Each feature has a dedicated specification directory under `/specs/{number}-{name}/` with YAML-based specification files
  2. **Lightweight Content Addition**: Markdown files are simple, non-code artifacts added to the repository root with minimal overhead
  3. **Naming Conventions**:
     - Test markdown files: `test-{randomid}.md` (e.g., `test-509s35.md`, `test-o73tv2.md`)
     - Content files: Named after their topic (e.g., `DESIGN_PATTERN.md`, `ELEVATOR_STATE_MACHINE.md`, `honey-bee-dance.md`, `volcanic-eruptions.md`)
  4. **No Code Integration**: Markdown content files are independent and require no code modifications, library integration, or testing framework changes
  5. **Git-Based Workflow**: All changes tracked through feature branches (e.g., `feat/043-markdown-content-file-83251b`)
  6. **Consistent Commit Pattern**: Recent commits show pattern `feat(content): Create test-{id}.md markdown file (#PR_NUM)`

  ### Relevant Technologies

  - **Markdown**: Core content format for all text files in the repository; standard GitHub flavored markdown syntax
  - **Git**: Version control system used for feature branching and change tracking
  - **YAML**: Format for specification files in `/specs/{number}-{name}/spec.yaml`
  - **No Runtime Dependencies**: Markdown files require no Python libraries, frameworks, or build tools

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added; no modifications to existing files, no deletions |
  | `/specs` Directory | None | Feature specification already created; analysis phase only updates `spec.yaml` content section |
  | `/src/sheep` | None | No Python code, source modules, or platform logic affected |
  | `/tests` | None | No test files created, modified, or deleted; feature requires no testing |
  | `/.github` | None | No CI/CD workflows or automation changes required |
  | `pyproject.toml` | None | No dependencies, configuration, or build settings changed |
  | Git History | Low | Single commit added with standardized message; no force pushes or rebases needed |

  ## Dependencies

  - **Git repository**: Feature branch `feat/043-markdown-content-file-83251b` must exist (already created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies
  - **No code dependencies**: Feature is purely file-creation; does not depend on or impact any source code

  ## Functional Requirements

  - **FR-1**: File must be created at repository root with exact name `test-g12aiq.md`
  - **FR-2**: File must contain exactly one Markdown heading (H1 `#` or H2 `##`) serving as title
  - **FR-3**: File must contain 2-3 sentences of content following the title
  - **FR-4**: File content may be about any topic (no topic restrictions)
  - **FR-5**: File must use valid Markdown syntax with no syntax errors

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (without BOM)
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF
  - **NFR-3**: No other files may be created, modified, or deleted during this feature
  - **NFR-4**: Changes must be committed to feature branch with descriptive commit message
  - **NFR-5**: File must follow repository conventions for markdown formatting (consistent with existing `.md` files)
  - **NFR-6**: No code changes, configuration changes, or test files required

  ## Success Criteria

  - [ ] File `test-g12aiq.md` exists in repository root
  - [ ] File contains valid Markdown syntax with no errors
  - [ ] File contains exactly one top-level heading
  - [ ] File contains 2-3 sentences of content after the heading
  - [ ] File is encoded as UTF-8 with LF line endings
  - [ ] Git status shows only the new file (no unintended modifications)
  - [ ] Changes are committed to feature branch `feat/043-markdown-content-file-83251b`
  - [ ] No other repository files have been modified or deleted

  ## Size Estimate

  **S** (Small - approximately 15-20 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one Markdown heading + 2-3 sentences on any topic)
  - **Validation**: ~5 minutes (verify syntax, encoding, line endings, git status)
  - **Commit and push**: ~5 minutes (standard git workflow with feature branch)
  - **Total estimated effort**: 15-20 minutes of actual work

  **Rationale**: No research, no code analysis, no architectural decisions, and no framework integration needed. This is a straightforward content creation task following the exact same pattern as features 042, 041, 040, 039, 038, 037, 036, 035, and many others in the repository. Previous similar features confirm this trivial scope.

  ## Implementation Notes

  - Feature branch `feat/043-markdown-content-file-83251b` already exists in the repository
  - No additional setup or configuration required
  - Implementation can proceed directly to file creation
  - File content topic is completely flexible - any topic is acceptable
  - Recent commits show consistent pattern and workflow for similar features

