content: |
  ## Task Execution Summary

  Feature 168 implementation consists of 5 concrete tasks organized across 4 phases:

  **Phase 1 (Foundation - 30 min):** Task 1 creates the feature module by copying feature_167 and updating 3 constants. This establishes the module structure needed for downstream work. Low risk because only constants change; logic is identical to feature_167.

  **Phase 2 (Implementation - 45 min):** Task 2 implements the orchestration function by calling existing content_generators utilities in sequence. The function coordinates: generate → write → validate → commit → push. No new utilities needed; orchestration is the core task.

  **Phase 3 (Testing - 30 min):** Task 3 creates comprehensive test coverage following patterns from feature_167. Tests use @patch mocks to verify orchestration without calling LLM, file I/O, or git. Ensures quality before delivery.

  **Phase 4 (Integration & Delivery - 30 min):** Tasks 4-5 perform end-to-end validation (real LLM call, file creation, git operations) and then commit the planning phase artifacts. Task 4 verifies all acceptance criteria met. Task 5 commits planning deliverables.

  **Total Effort:** ~1.5 hours (matches S-size estimate from spec)

  ## Task Dependencies

  ```
  task-1 (Create module)
    ↓
  task-2 (Implement function)
    ↓
  task-3 (Create tests)
    ↓
  task-4 (End-to-end validation)
    ↓
  task-5 (Final commit)
  ```

  Each task must complete successfully before the next begins. No parallel work possible due to sequential nature of implementation.

  ## Effort Breakdown

  | Phase | Task | Effort | Notes |
  | ----- | ---- | ------ | ----- |
  | Phase 1 | task-1 (Create module) | 30 min | Copy + update 3 constants; lowest risk |
  | Phase 2 | task-2 (Implement function) | 45 min | Core orchestration logic |
  | Phase 3 | task-3 (Create tests) | 30 min | Test coverage with mocks |
  | Phase 4 | task-4 (Validate) | 20 min | End-to-end execution |
  | Phase 4 | task-5 (Commit) | 10 min | Stage and commit planning artifacts |
  | **Total** | | **~1.5h** | Matches S-size estimate |

  ## Key Assumptions

  1. **Existing Infrastructure Available:** All utilities in `sheep.content_generators` (generate, write, validate, commit, push) already exist and are proven through 167 prior features.

  2. **No New Dependencies:** Python stdlib, CrewAI, GitPython, Pydantic, structlog all already in project dependencies.

  3. **LLM Configuration Ready:** `sheep.config.llm.get_reasoning_llm()` already configured via environment variables (ANTHROPIC_API_KEY, model selection).

  4. **Git Repository Ready:** Working directory is a git repository with remote configured; credentials available for push operations.

  5. **Test Infrastructure Available:** pytest, unittest.mock, and test patterns from feature_167 already established.

  ## Success Definition

  All 5 tasks complete when:
  - Feature module created and imports cleanly
  - Orchestration function implemented and tested
  - Test file created with comprehensive coverage
  - Feature runs end-to-end successfully
  - All changes committed with conventional message
  - Markdown file test-ehvabr.md exists in repository root with correct properties
  - All acceptance criteria from feature specification satisfied

