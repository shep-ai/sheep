content: |
  ## Architecture Overview

  Feature 168 integrates into the Sheep platform's established feature pattern. The implementation follows the orchestration model proven across 167 prior features:

  1. **Feature Module Location:** `src/sheep/features/feature_168_markdown_file_creation.py`
     - Contains module-level constants and metadata (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
     - Defines main orchestration function: `create_feature_168_markdown_file(repo_path: str | None) -> dict[str, str]`
     - Implements `if __name__ == "__main__"` block for direct execution

  2. **Orchestration Pattern:** The feature function coordinates a 5-step workflow using existing utilities from `sheep.content_generators`:
     - **Step 1 (Generate):** Call `generate_markdown_content()` to create H1 + prose via CrewAI LLM
     - **Step 2 (Write):** Call `write_markdown_file()` to persist UTF-8 encoded content with LF line endings
     - **Step 3 (Validate):** Call `validate_markdown_file()` to verify encoding, line endings, content structure, and file size
     - **Step 4 (Commit):** Call `commit_markdown_file()` with conventional commit message
     - **Step 5 (Push):** Call `push_markdown_file()` to remote repository

  3. **Reuse of Existing Infrastructure:** All content generation, file I/O, validation, and git operations are implemented in `sheep.content_generators.py`. Feature 168 simply orchestrates these proven utilities with no changes to existing code.

  4. **Configuration & Logging:**
     - LLM instance sourced from `sheep.config.llm.get_reasoning_llm()` (already configured via environment)
     - All operations logged via `sheep.observability.logging.get_logger()` using structlog for observability

  ## Key Design Decisions

  ### Decision 1: Pattern Replication (Copy Feature 167)
  **Chosen:** Copy `feature_167_markdown_file_creation.py` and update 3 constants

  **Rationale:** All 167 prior features follow identical pattern. Copying preserves consistency, maintains discoverability, supports test framework expectations, and requires only 5 minutes work (change FEATURE_NUMBER to 168, MARKDOWN_FILENAME to "test-ehvabr.md", COMMIT_MESSAGE to "feat(168): Create markdown file test-ehvabr.md with prose content"). No logic changes needed; orchestration is identical across all features.

  ### Decision 2: Content Generation Strategy
  **Chosen:** Use CrewAI via `sheep.config.llm.get_reasoning_llm()` with free topic selection

  **Rationale:** CrewAI is already integrated and proven. The `generate_markdown_content()` function orchestrates LLM calls with a prompt that allows free topic selection (simpler, fewer failure points). Quality is proven through 167 prior features. No additional LLM configuration needed; environment variables handle authentication.

  ### Decision 3: File I/O and Validation
  **Chosen:** Use existing `write_markdown_file()` and `validate_markdown_file()` utilities

  **Rationale:** These functions already handle:
  - UTF-8 encoding without BOM
  - Unix LF line endings (validated post-write to reject CRLF)
  - File size validation (300-600 bytes)
  - Content structure validation (H1 presence, 2-3 sentences, minimum length)
  Reusing these prevents code duplication and maintains consistency with 167 features.

  ### Decision 4: Git Workflow
  **Chosen:** Single atomic commit with conventional message; single push to remote

  **Rationale:** Atomic commits simplify history, are easier to review/revert, and match all 167 prior features. The orchestration function calls `commit_markdown_file()` once with custom message "feat(168): Create markdown file test-ehvabr.md with prose content", then `push_markdown_file()` for remote synchronization.

  ### Decision 5: Return Value Structure
  **Chosen:** `dict[str, str]` with keys: `filepath`, `content`, `commit_message`, `push_result`

  **Rationale:** Matches feature_167 pattern. Provides type clarity (dict[str, str] annotation), IDE discoverability (autocomplete), and flexibility for future extensions. Dictionary is more Pythonic than tuple for multi-value returns with semantic meaning.

  ### Decision 6: Test Coverage Inclusion
  **Chosen:** Include test file (test_168_markdown_file_creation.py) per product decision

  **Rationale:** Maintains consistency with 167 prior features and ensures quality. Tests verify module structure, function signature, constants, and orchestration flow using mocks. Adds ~15 minutes effort for documented, maintainable code. Follows established test patterns.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Foundation):** Create feature module first. This is the smallest, lowest-risk task that establishes the structure needed for all downstream work. Module creation requires only copying and renaming, verified by simple imports.

  2. **Phase 2 (Implementation):** Once module exists, implement orchestration function. This is the core logic that calls existing utilities in sequence. Implementation is straightforward because all utilities already exist and are battle-tested.

  3. **Phase 3 (Testing):** Create tests after implementation. Tests reference the feature function, constants, and expected behavior. Writing tests last (but before validation) follows TDD philosophy: define expectations, then verify implementation satisfies them.

  4. **Phase 4 (Integration & Delivery):** Final phase runs feature end-to-end (actual LLM call, file creation, git operations) and commits changes. This phase validates all prior work and delivers the feature to the repository.

  **Why This Order:**
  - Low-risk foundation work first (module creation)
  - Core logic implementation second (orchestration)
  - Test coverage third (ensures quality before delivery)
  - Integration & delivery last (final validation before pushing to remote)
  - Each phase builds on prior phases with clear dependencies

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM API failure (rate limit, timeout) | Low | Medium | Existing error handling in content_generators; retries built into CrewAI. Structured logging captures failures for debugging. |
  | File encoding issues (CRLF on Windows) | Low | Low | validate_markdown_file() explicitly checks and rejects CRLF. Post-write validation catches encoding errors before commit. |
  | Git push failure (network, auth) | Low | Medium | Existing push_markdown_file() handles git errors. Feature commits locally even if push fails; can be retried. Structured logging shows push status. |
  | Incorrect constants (feature number, filename) | Very Low | Medium | Task 1 includes constant validation test. Easy to spot and fix if wrong. Constants copied directly from spec (test-ehvabr.md, feat(168): ...). |
  | Test framework mismatch | Very Low | Low | Tests follow established patterns from test_167 and prior features. Use same @patch decorator pattern and mock utilities. |
  | Accidental file deletion before commit | Very Low | Low | Feature workflow stages file immediately after write, before any validation. Git stages file before other operations. |

  ## Success Criteria

  Feature 168 is complete when:
  - ✓ Feature module created at `src/sheep/features/feature_168_markdown_file_creation.py`
  - ✓ Orchestration function `create_feature_168_markdown_file()` implemented and tested
  - ✓ Test file created at `tests/test_168_markdown_file_creation.py` with comprehensive test coverage
  - ✓ Feature runs end-to-end: generates content, writes file, validates, commits, pushes
  - ✓ Markdown file `test-ehvabr.md` exists in repository root with proper structure
  - ✓ File properties validated: UTF-8 encoding, LF line endings, 300-600 bytes, 1 H1 + 2-3 sentences
  - ✓ Git commit created with message "feat(168): Create markdown file test-ehvabr.md with prose content"
  - ✓ Changes pushed to remote on feature branch
  - ✓ All operations logged via structlog with clear messages
  - ✓ Code follows established patterns from 167 prior features

  ## Implementation Notes

  1. **Copy Source:** When creating feature_168_markdown_file_creation.py, use feature_167_markdown_file_creation.py as template. Only 3 constants need changes.

  2. **Orchestration Function Signature:** Must match established pattern:
     ```python
     def create_feature_168_markdown_file(repo_path: str | None = None) -> dict[str, str]:
     ```

  3. **Logging Setup:** Use `get_logger()` from sheep.observability.logging at module start:
     ```python
     logger = get_logger(__name__)
     ```

  4. **Error Propagation:** Let exceptions from content_generators utilities propagate; don't catch and suppress. Structured logging captures context.

  5. **Return Dictionary:** Must include keys: `filepath`, `content`, `commit_message`, `push_result`. Tests assert on these keys.

  6. **Test File Pattern:** Follow test_167_markdown_file_creation.py structure. Use @patch decorator to mock content_generators functions. Include import tests, constant tests, signature tests, orchestration tests.

  7. **Conventional Commit Message:** Use exact message: "feat(168): Create markdown file test-ehvabr.md with prose content" (matches feature number and filename from spec).

  8. **Repository Path Handling:** Feature accepts optional repo_path. If None, uses current working directory (Pathlib behavior). Tests should handle both cases via mocking.

