# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 083 integrates into the Sheep platform's automated implementation architecture by leveraging
  the existing content generation infrastructure. All necessary functions already exist and are proven
  by features 080-082.

  ### Existing Infrastructure

  The `src/sheep/content_generators.py` module provides complete implementation for the entire feature:

  1. **Content Generation** (`generate_markdown_content()`, lines 27-68)
     - Calls Claude LLM via CrewAI's `get_reasoning_llm()`
     - Uses `MARKDOWN_GENERATION_PROMPT` template specifying exact format
     - Returns tuple (heading, prose) ready for file writing
     - Proven by features 080-082

  2. **File Writing** (`write_markdown_file()`, lines 101-147)
     - Uses `pathlib.Path` for cross-platform file operations
     - Creates file at repo root with UTF-8 encoding, LF line endings
     - Validates file exists and has content
     - Includes error handling with structlog logging

  3. **Validation** (`validate_markdown_file()`, lines 150-244)
     - Comprehensive validation covering all requirements:
       - UTF-8 without BOM
       - LF line endings only
       - H1 heading format
       - Blank line separator
       - 2-3 sentences
       - Trailing newline

  4. **Git Operations** (`commit_markdown_file()`, lines 274-317)
     - Uses `GitCommitTool` to stage and commit
     - Uses `GitPushTool` to push to remote
     - Includes error handling for git failures
     - **Issue**: Commit message format doesn't match spec FR-7

  ### Key Design Decisions

  #### 1. Use Existing Infrastructure Rather Than Reimplement
  - **Chosen**: Call existing functions from content_generators.py
  - **Rationale**: Features 080-082 prove this pattern works in production. All infrastructure is tested
    and ready. Reimplementing would duplicate code and risk introducing bugs.
  - **Rejected**: Creating new content generation, validation, or git wrapper functions

  #### 2. Fix Commit Message Format for Specification Compliance
  - **Chosen**: Update commit_markdown_file() to generate "feat(083): create markdown file {filename} with prose content"
  - **Rationale**: Specification FR-7 explicitly requires this format. Current implementation uses
    "feat: Create {filename} markdown file with {topic} content". The spec format follows conventional
    commits convention with feature number in scope, is more semantic.
  - **Rejected**: Leaving the format as-is would violate specification requirement

  #### 3. Create Script Entry Point for Executability
  - **Chosen**: Create `specs/083-markdown-file-creation-efd4d5/scripts/create_test_file.py`
  - **Rationale**: Makes the feature executable and testable. Separates orchestration (how to run)
    from implementation (what to run). Follows pattern of having executable scripts in spec directories.
  - **Rejected**: Direct git CLI commands or no explicit entry point would be error-prone and unmaintainable

  #### 4. Use LLM for Content Generation
  - **Chosen**: Continue using existing `generate_markdown_content()` which calls Claude LLM
  - **Rationale**: LLM generates high-quality, coherent prose. Features 080-082 use this approach
    successfully. The MARKDOWN_GENERATION_PROMPT is well-crafted.
  - **Rejected**: Hardcoded topic list would be inflexible; random generation would produce lower quality

  #### 5. Validate File Format Comprehensively
  - **Chosen**: Use existing `validate_markdown_file()` which performs comprehensive validation
  - **Rationale**: Catches all encoding issues, format violations, and content issues. Prevents invalid
    files from being committed. The implementation is already complete with negligible cost.
  - **Rejected**: No validation risks invalid files; basic validation would miss important issues

  #### 6. Use subprocess-Based Git Tools
  - **Chosen**: Use existing `GitCommitTool` and `GitPushTool` from git_tools.py
  - **Rationale**: Codebase established this pattern. Subprocess provides explicit control. Functions
    already handle error cases and logging.
  - **Rejected**: Direct subprocess calls would duplicate error handling; GitPython would add
    unnecessary abstraction

  ## Implementation Strategy

  **Phase 1 (Prepare Infrastructure)**: Fix commit message format
  - Single-line code change in `commit_markdown_file()` function
  - Change format to match spec FR-7 requirement and conventional commits convention

  **Phase 2 (Create Orchestration)**: Create entry point script
  - Create `specs/083-markdown-file-creation-efd4d5/scripts/create_test_file.py`
  - Script imports and orchestrates existing functions: generate → write → validate → commit → push
  - Handles errors with clear logging and reporting

  **Phase 3 (Execute & Verify)**: Run end-to-end
  - Run orchestration script
  - Verify file exists with correct format
  - Verify git commit and push succeeded
  - Confirm all success criteria met

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Commit message format mismatch | High | Fix format in Phase 1. Verify with test checking exact message. |
  | LLM API latency | Medium | Specification allows 10-15 minutes. Single API call completes in 1-3 seconds. Acceptable. |
  | Git operations fail | Medium | Implementation includes error handling in git_tools.py. Script reports failures clearly. Assume git configured. |
  | File already exists | Low | Acceptable behavior. Creates new file or modifies existing. Git shows as new or modified. |
  | Poor LLM output | Low | Claude produces high-quality prose. Validation only checks format compliance, not content quality. |
  | Cross-platform path issues | Low | pathlib.Path handles Windows/Linux separators. Python UTF-8 text mode handles line endings. |
  | Validation too strict | Low | Validation function checks only format requirements. Expected to pass with correctly generated content. |

