# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-szyfny.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 80+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 080-082, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated software development built with CrewAI. Key directories:

  - `/src/sheep/` - Core platform code with agents, flows, tools, and configuration management
  - `/specs/` - Feature specifications directory (currently 83 numbered spec directories)
  - `/tests/` - Pytest test suite for platform functionality
  - Repository root - Contains 80+ test markdown files (test-*.md pattern) and documentation

  The project follows Python 3.11+ standards with strict typing (mypy) and linting (ruff).

  ### Architecture Patterns

  1. **Modular Design**: Separation between flows (orchestration) and agents (intelligence)
  2. **File I/O Pattern**: Uses Python pathlib for cross-platform file operations
  3. **Git Integration**: GitPython library for version control operations (commit, push)
  4. **Content Generation**: `content_generators.py` module provides markdown generation utilities
  5. **Test File Convention**: 80+ precedent files show the exact format expected (H1 heading + 2-3 sentences)

  ### Relevant Technologies

  - **Python 3.11+**: Runtime language with standard library pathlib module
  - **Git/GitPython**: Version control with GitPython library for programmatic operations
  - **CrewAI**: Agentic framework (used in flows for orchestration)
  - **Pydantic**: Configuration and data validation
  - **Pathlib**: Cross-platform file path handling

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-szyfny.md) to existing collection of 80+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 080-082; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/083-markdown-file-creation-efd4d5` must exist and be checked out
  - **File system**: Write access to repository root directory (available in standard CI/CD environment)
  - **Established pattern**: 80+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **CrewAI/tools**: Available through existing project dependencies for git operations

  ## Success Criteria

  - [ ] File `test-szyfny.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] Prose content is readable and grammatically correct
  - [ ] File is staged in git (`git add test-szyfny.md`)
  - [ ] Git commit exists on the current branch with message: `feat(083): create markdown file test-szyfny.md with prose content`
  - [ ] Commit is on the feature branch `feat/083-markdown-file-creation-efd4d5`
  - [ ] Changes have been pushed to remote origin

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size in expected range)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 80+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (080-082) demonstrate efficient implementation of identical features in 10-15 minutes

