content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Completion:** Ready for implementation

  ## Technology Decisions

  The research identifies 8 key technology decisions for feature 083. All leverage existing infrastructure
  in the Sheep codebase. No new libraries or frameworks are needed. The implementation is straightforward
  orchestration of already-implemented functions.

  ### 1. Content Generation Using Claude LLM via CrewAI

  **Chosen:** Use the existing `generate_markdown_content()` function from `src/sheep/content_generators.py`
  which calls Claude LLM via the CrewAI framework using the prompt template already defined in the module.

  **Rejected Alternatives:**
  - **Predefined topic list**: Would require maintaining a hardcoded list of topics and selecting from them.
    This approach is less flexible and inconsistent with the existing pattern established in features 080-082.
  - **Template-based generation**: Could use string interpolation or template engines to combine pre-written
    sentences, but would produce lower-quality output and miss the semantic understanding that LLM provides.

  **Rationale:**
  The existing implementation in `content_generators.py` (lines 27-68) demonstrates the established pattern:
  call Claude via CrewAI's `get_reasoning_llm()` to generate coherent, high-quality prose. The `MARKDOWN_GENERATION_PROMPT`
  is already well-crafted with examples. Features 080-082 show this works reliably. Reusing this avoids
  reimplementing content generation and ensures consistency across all test files.

  ### 2. File I/O Using Python pathlib.Path

  **Chosen:** Use `pathlib.Path` for all file operations (path construction, existence checking, file writing).

  **Rejected Alternatives:**
  - **os.path module**: Older API without type safety. Less readable for modern Python codebases.
  - **Direct open() with string paths**: Possible but loses the safety checks and cross-platform handling that pathlib provides.

  **Rationale:**
  The `write_markdown_file()` function (lines 101-147) already uses pathlib correctly:
  - Line 121: `Path.cwd()` for repo root (works on Windows/Linux)
  - Line 122: `repo_root / filename` for path construction (cross-platform separator handling)
  - Line 128: `with open(file_path, "w", encoding="utf-8")` properly closes file
  - Line 132: `file_path.exists()` provides readable existence check

  This pattern is consistent throughout the codebase (git_tools.py, file_tools.py).

  ### 3. Comprehensive Validation Using validate_markdown_file()

  **Chosen:** Use the existing `validate_markdown_file()` function which performs comprehensive validation
  covering all non-functional requirements.

  **Rejected Alternatives:**
  - **Basic validation only**: Check file exists and has some content. Would miss encoding issues, line ending problems, or format violations.
  - **No validation**: Trust the LLM output. Risky — could produce invalid files that break CI/CD pipelines.

  **Rationale:**
  The `validate_markdown_file()` function (lines 150-244) validates:
  - **UTF-8 encoding without BOM** (lines 187-194): Checks for BOM marker and validates UTF-8 decoding
  - **LF line endings only** (lines 196-198): Rejects CRLF and CR, ensuring Unix convention
  - **H1 heading format** (lines 200-208): Verifies first line starts with "# "
  - **Blank line separator** (lines 210-212): Ensures blank line between heading and prose
  - **2-3 sentences** (lines 226-231): Counts periods to verify sentence count
  - **Trailing newline** (lines 234-235): Ensures file ends with \n for proper Unix convention

  This satisfies all validation requirements without adding complexity. The function already exists and is
  production-ready.

  ### 4. Git Operations Using GitCommitTool and GitPushTool

  **Chosen:** Use existing `GitCommitTool` and `GitPushTool` from `src/sheep/tools/git_tools.py` which
  wrap `subprocess.run()` for git commands.

  **Rejected Alternatives:**
  - **GitPython library** (version 3.1.0+ is already in dependencies): While available, the codebase established
    a pattern of using subprocess for more explicit control. GitPython would add an abstraction layer not needed.
  - **Direct subprocess.run() calls**: Possible but would duplicate error handling and logging logic already
    implemented in the existing tools.

  **Rationale:**
  The git_tools.py module provides:
  - **GitCommitTool** (lines 213-239): Stages changes with `git add -A` and commits with message.
    Includes error handling for "nothing to commit" case (lines 237-239).
  - **GitPushTool** (lines 255-288): Pushes to remote with upstream tracking enabled.
    Handles getting current branch if not specified (lines 275-277).
  - **Pydantic schemas** (GitCommitInput, GitPushInput): Type-safe parameters using BaseModel.
  - **Structured logging**: Integration with structlog for observability.

  The `commit_markdown_file()` function in content_generators.py (lines 274-317) already properly uses these tools.

  ### 5. Commit Message Format Following Conventional Commits

  **Chosen:** Use format `"feat(083): create markdown file test-szyfny.md with prose content"`

  **Current Implementation:** `"feat: Create test-szyfny.md markdown file with {topic} content"`

  **Issue:** There is a mismatch between the specification requirement (FR-7) and the current implementation
  in content_generators.py line 304.

  **Recommendation:** Update the commit message format in the commit_markdown_file() function to match the
  specification FR-7 requirement. The feature number (083) should be included in parentheses as per
  conventional commits convention.

  **Rationale:**
  - **Specification requirement** (FR-7): `"feat(083): create markdown file test-szyfny.md with prose content"`
  - **Conventional commits format**: `<type>(<scope>): <description>` where scope can be the feature/component
  - **Current code** (line 304): Uses a more verbose but less standard format

  The spec format is more aligned with conventional commits and provides better semantic information through
  the feature number in the scope parentheses.

  ### 6. Error Handling for File Operations

  **Chosen:** Catch `IOError` and `ValueError`; propagate with descriptive logging via structlog.

  **Rejected Alternatives:**
  - **No error handling**: Would hide failures. Caller wouldn't know if file was created successfully.
  - **Comprehensive error handling with retry logic**: Over-engineering for a simple file operation.

  **Rationale:**
  The existing `write_markdown_file()` function implements appropriate error handling (lines 126-147):
  - Opens file in write mode with UTF-8 encoding
  - Catches and logs any exceptions (lines 145-147)
  - Verifies file exists after write (line 132)
  - Verifies file is not empty (lines 136-138)

  This catches common issues: permission denied, disk full, invalid paths. Sufficient for the task scope.

  ### 7. Error Handling for Git Operations

  **Chosen:** Catch `subprocess.CalledProcessError`; propagate exceptions for caller to handle.

  **Rejected Alternatives:**
  - **No error handling**: Silent failures would be unclear. Caller wouldn't know if commit/push succeeded.
  - **Automatic retry with exponential backoff**: Unnecessary complexity. Better to fail fast.

  **Rationale:**
  The git_tools.py functions properly implement error handling:
  - **GitCommitTool** (lines 237-239): Returns descriptive error message if commit fails
  - **GitPushTool** (lines 287-288): Returns descriptive error message if push fails
  - All exceptions are logged with structlog for observability

  The `commit_markdown_file()` function (lines 315-317) lets exceptions propagate, allowing callers to
  decide how to handle failures. This is appropriate for a orchestration function.

  ### 8. Encoding and Line Ending Conventions

  **Chosen:** UTF-8 without BOM, LF line endings (Unix convention), trailing newline.

  **Rejected Alternatives:**
  - **UTF-8 with BOM**: Adds unnecessary 3-byte marker. Modern tools don't need it.
  - **CRLF line endings**: Windows convention. Repository is Linux-based and Git can normalize, but explicit LF is cleaner.
  - **No trailing newline**: Would violate POSIX convention that text files end with newline.

  **Rationale:**
  - **Specification requirement** (NFR-1, NFR-2, NFR-5): UTF-8 without BOM, LF line endings
  - **Established convention**: All 80+ test files follow this pattern
  - **Validation support**: validate_markdown_file() explicitly checks for these (lines 187-198, 234-235)
  - **File I/O implementation**: Python's text mode with UTF-8 encoding handles this correctly (line 128)

  No deviation from spec requirements. Implementation already ensures compliance.

  ## Library Analysis

