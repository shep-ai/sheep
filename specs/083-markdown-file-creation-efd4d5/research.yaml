  | ------- | ----------- | -------- | --------- |
  | pathlib | Yes, in file_tools.py, git_tools.py, content_generators.py | **Use** | Standard library, type-safe, cross-platform. Established pattern in codebase. Required for file operations. |
  | subprocess | Yes, in git_tools.py for git commands | **Use** | Standard library. Provides explicit control over git operations. Consistent with codebase pattern (git_tools.py, file_tools.py). |
  | CrewAI | Yes, framework for tool integration and LLM config | **Use** | Provides LLM integration via get_reasoning_llm(). Used for GitCommitTool and GitPushTool which extend BaseTool. Necessary for content generation. |
  | Claude API (via CrewAI) | Yes, in generate_markdown_content() | **Use** | Provides high-quality prose generation. Accessed via CrewAI config which centralizes API key management. Existing pattern proven in features 080-082. |
  | Pydantic | Yes, for tool schemas (BaseModel, Field) | **Use** | Required by CrewAI tools architecture. Used in git_tools.py for GitCommitInput, GitPushInput. Type-safe parameter validation. |
  | structlog | Yes, for observability and logging | **Use** | Provides structured logging throughout codebase. Used in content_generators.py and git_tools.py for clear error/info messages. |
