tasks:
  - id: task-1
    phaseId: phase-1
    title: Create test-jr3mwl.md with valid markdown content and validate against test suite
    description: >
      Author meaningful 2-3 sentence prose on freely-chosen topic. Create markdown file
      (test-jr3mwl.md) in repository root with H1 heading (line 1), blank line (line 2),
      and prose content (lines 3+). Run test_create_markdown.py test suite to validate
      file meets all success criteria. If tests fail, iterate content (adjust prose length
      or quality) until all tests pass. Acceptance requires passing test suite with no failures.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - File test-jr3mwl.md exists in repository root directory
      - File contains H1 markdown heading on line 1 (format: "# [Title]")
      - File contains blank line on line 2 separating heading from prose
      - File contains exactly 2 or 3 sentences of meaningful prose content (lines 3+)
      - File encoding is UTF-8 (verified by test suite)
      - File uses Unix-style LF line endings only (verified by test suite)
      - File size is between 400-600 bytes (verified by test suite)
      - All tests in test_create_markdown.py pass without failures
      - Prose content is coherent and meaningful (not placeholder/template text)
      - Markdown syntax is valid and parseable (verified by test suite)
    tdd:
      red:
        - Run test_create_markdown.py test suite — all tests fail because file does not exist
      green:
        - Author 2-3 sentences of meaningful prose (~500 bytes target) on chosen topic
        - Create file using pathlib.Path('test-jr3mwl.md').write_text(content, encoding='utf-8')
        - Run test_create_markdown.py test suite — verify tests pass
      refactor:
        - Review prose quality — ensure sentences are meaningful and coherent
        - Verify file size is within 400-600 byte range (adjust prose if needed)
        - Confirm all test output is clean with no warnings or skipped tests
        - Ensure heading and blank line formatting match expected structure exactly
    estimatedEffort: 5m

