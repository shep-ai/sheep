  - question: "What character encoding should the markdown file use?"
    resolved: true
    options:
      - option: "UTF-8 without BOM"
        description: "Standard Unicode encoding without Byte Order Mark. Platform-agnostic, supports all characters, no hidden bytes. This is the standard for markdown and source code in modern projects."
        selected: true
      - option: "UTF-8 with BOM"
        description: "UTF-8 with Byte Order Mark prefix. Adds 3 bytes at the start of file. Historically used on Windows but now considered legacy; can cause issues with some tools."
        selected: false
      - option: "ASCII"
        description: "ASCII 7-bit encoding. Severely limits character set to basic Latin letters and numbers. Not suitable for markdown files as it cannot represent special characters or unicode."
        selected: false
    selectionRationale: "UTF-8 without BOM is recommended because it is the standard for markdown and source code, consistent with all 280+ existing test files in the repository, platform-agnostic, and ensures compatibility with all tools and systems."
    answer: "UTF-8 without BOM"

  - question: "What line ending style should the markdown file use?"
    resolved: true
    options:
      - option: "Unix LF (\\n)"
        description: "Line Feed only (single byte, hex 0x0A). Platform-agnostic standard used in Linux, macOS, and modern development. Required by git configuration best practices and enforced by .gitattributes."
        selected: true
      - option: "Windows CRLF (\\r\\n)"
        description: "Carriage Return + Line Feed (two bytes). Legacy Windows standard. Can cause git diffs to show entire file as changed. May cause issues in cross-platform repositories."
        selected: false
    selectionRationale: "Unix LF is recommended because it is the platform-agnostic standard for version control, enforced by git best practices, consistent with all 280+ existing test files, and prevents spurious diffs in cross-platform development."
