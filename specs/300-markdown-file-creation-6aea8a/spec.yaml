content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create test markdown files following
  a well-established pattern that has been implemented 300+ times (features 006-300+). This feature creates a single test
  markdown file (test-tq8wxa.md) at the repository root with a title and prose content, demonstrating basic file creation
  and git integration workflows.

  The feature is part of the markdown-file-creation pattern that has been consistently implemented across the codebase,
  with 300+ test markdown files already existing in the repository root as precedents. All structural and format requirements
  are locked in by this established and proven pattern.

  ## Success Criteria

  - [ ] File test-tq8wxa.md created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (line starting with `#`)
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] Prose content is between 100-300 characters in length
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF (Unix-style) line endings only
  - [ ] File size naturally ranges 400-600 bytes
  - [ ] File is staged with `git add test-tq8wxa.md`
  - [ ] File is committed with message format: `feat(300): create markdown file test-tq8wxa.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/300-markdown-file-creation-6aea8a`
  - [ ] No other files are created or modified
  - [ ] Markdown syntax validates against CommonMark specification
  - [ ] File location verified in repository root (not in subdirectory)
  - [ ] Git history shows single commit on feature branch

  ## Functional Requirements

  - **FR-1**: Create file named `test-tq8wxa.md` at repository root
  - **FR-2**: File must contain exactly one H1 markdown heading (title) using `#` syntax
  - **FR-3**: File must contain exactly 2 or 3 sentences of prose content
  - **FR-4**: Prose content must be between 100-300 characters in length
  - **FR-5**: File must be encoded as UTF-8 without Byte Order Mark (BOM)
  - **FR-6**: File must use LF (Unix-style) line endings exclusively
  - **FR-7**: Stage file using `git add test-tq8wxa.md`
  - **FR-8**: Commit file with conventional message: `feat(300): create markdown file test-tq8wxa.md with prose content`
  - **FR-9**: Push commit to feature branch `feat/300-markdown-file-creation-6aea8a`
  - **FR-10**: Prose content must follow standard sentence structure (separated by periods, question marks, or exclamation marks)
  - **FR-11**: Markdown must be valid per CommonMark specification

  ## Non-Functional Requirements

  - **NFR-1**: Implementation follows established pattern from 300+ existing implementations
  - **NFR-2**: File size naturally results in 400-600 bytes when meeting sentence and character length requirements
  - **NFR-3**: No modifications to source code (`/src/sheep/`), configuration files (pyproject.toml, .env), or tests
  - **NFR-4**: No side effects on other feature specs or repository structure beyond single file addition
  - **NFR-5**: Implementation time should not exceed 15 minutes (aligned with pattern precedent)
  - **NFR-6**: No external dependencies required beyond Python standard library (pathlib, re modules)
  - **NFR-7**: Feature branch must be pre-created and available for pushing

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be restricted to a specific topic domain or allow any arbitrary topic? | Any arbitrary topic | Flexibility reduces decision complexity and aligns with 300+ existing implementations using diverse topics. Prose length constraints (100-300 chars, 2-3 sentences) provide natural structure without topic restrictions. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is organized as follows:

  - **`/src/sheep/`** - Main application package
    - `cli.py` - Command-line interface for the platform
    - `create_markdown.py` - Core module for markdown file generation and validation
    - `/config/` - Configuration management (LLM settings, observability)
    - `/features/` - Feature-specific implementations
    - `/flows/` - Workflow orchestration
    - `/agents/` - CrewAI agents for code implementation
    - `/observability/` - Logging and tracing with Langfuse and structlog
    - `/tools/` - Git integration and utility tools

  - **`/specs/`** - Feature specification repository
    - 300+ subdirectories (one per feature number)
    - Each spec contains: spec.yaml, feature.yaml, plan.yaml, research.yaml, tasks.yaml

  - **Repository Root** - Contains 300+ existing test markdown files following this pattern:
    - test-*.md files (randomly generated filenames)
    - Fixed-topic markdown files (jokes, design patterns, etc.)
    - Total of 396 files already created by previous features

  - **`/tests/`** - Test suite
  - **`pyproject.toml`** - Project metadata and dependencies

  ### Architecture Patterns

  1. **File Creation Pattern** (established across 300+ features):
     - Create a markdown file with one H1 heading + 2-3 sentences of prose
     - Store file in repository root
     - Encode as UTF-8 without BOM
     - Use LF line endings (Unix-style)
     - File size naturally ranges 400-600 bytes

  2. **Git Workflow** (consistent pattern across all features):
     - Stage file with `git add <filename>`
     - Commit with conventional format: `feat(NUMBER): create markdown file <filename> with prose content`
     - Push to feature branch: `feat/NUMBER-markdown-file-creation-HASH`

  3. **Content Validation** (implemented in create_markdown.py):
     - Validates H1 heading presence
     - Validates sentence count (exactly 2-3)
     - Validates prose length (100-300 characters)
     - Validates UTF-8 encoding
     - Validates line endings (LF only)

  ### Relevant Technologies

  1. **Markdown File Format**
     - Standard markdown syntax (H1 heading with `#`)
     - Prose text with sentences separated by periods, question marks, or exclamation marks

  2. **Python Standard Library**
     - `pathlib.Path` - For file I/O operations
     - `re` module - For sentence boundary detection (implemented in create_markdown.py)
     - Text encoding/decoding - UTF-8 handling

  3. **Git Commands**
     - `git add` - Stage file for commit
     - `git commit` - Create commit with conventional message
     - `git push` - Push commit to feature branch

  4. **Project Dependencies** (from pyproject.toml)
     - Python 3.11+ (required)
     - GitPython 3.1.0+ - For git integration
     - CrewAI 0.86.0+ - For agentic orchestration
     - No special dependencies needed for basic markdown file creation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds single markdown file to existing collection of 300+ test files; no existing file modifications or directory structure changes |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory changes, deletions, or overwrites |
  | Git Repository | Low | Standard single commit following established pattern from 300+ prior implementations; no branch/merge complexity |
  | Source Code | None | Feature is purely artifact creation; does not impact `/src/sheep/`, application logic, agents, flows, tools, or configuration |
  | Tests | None | No test files need to be created or modified; feature is artifact-only |
  | Configuration | None | No modifications to pyproject.toml, .github workflows, .env, or other configuration files |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis phase; no impact on other feature specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/300-markdown-file-creation-6aea8a` must exist (pre-created)
  - **File system**: Write access to repository root directory (available)
  - **Established pattern**: 300+ existing test files provide clear precedent for content structure and file format
  - **Python standard library**: pathlib module (available in Python 3.11+; no external dependencies required)
  - **Git configuration**: Standard git user.name and user.email configuration (standard setup)
  - **File naming**: Exact filename `test-tq8wxa.md` provided in feature spec

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation:

  - **File creation**: ~5 minutes (compose one markdown H1 heading + 2-3 sentences of prose on any topic)
  - **Validation**: ~2 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow**: ~3-8 minutes (stage file with git add, commit with conventional message, push to branch)
  - **Total**: 10-15 minutes of actual implementation work

  **Justification**:
  - Extremely well-established pattern with 300+ identical test files providing clear reference
  - No research, design decisions, or architectural considerations required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - Flexible topic selection eliminates research or content generation concerns
  - No testing, documentation, configuration, or source code modifications required
  - File naming is pre-specified; eliminates any naming decisions
  - Git workflow is mechanical and follows exact precedent from 300+ prior implementations
  - Recent feature iterations (features 001-300) demonstrate consistent ~10-15 minute implementation times
  - File I/O can be accomplished using standard Python pathlib (no special libraries needed)
