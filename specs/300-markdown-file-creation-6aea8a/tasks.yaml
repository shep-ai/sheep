content: |
  ## Summary

  This feature implementation consists of 5 concrete tasks across 2 phases:

  **Phase 1: File Creation and Validation** (4 tasks, ~50min)
  1. Compose prose and create markdown file with H1 heading and content
  2. Validate file contains exactly one H1 heading
  3. Validate prose structure (2-3 sentences, 100-300 characters)
  4. Validate UTF-8 encoding without BOM and LF-only line endings

  **Phase 2: Git Integration** (2 tasks, ~20min)
  5. Stage file and commit with conventional message
  6. Push to feature branch

  Each task includes TDD cycles (RED-GREEN-REFACTOR) describing the validation approach even though actual
  test files are not created per spec requirements. The implementation follows the well-established pattern
  from 300+ existing markdown file creation features in the Sheep platform.

  Key implementation details:
  - Prose content: Hand-composed on any topic, 2-3 sentences, 100-300 characters
  - File I/O: pathlib.Path.write_text(encoding='utf-8') with explicit '\n' for LF line endings
  - Validation: Regex-based sentence detection, binary-level encoding/line ending checks
  - Git: GitPython API for add, commit, push operations
  - No external dependencies beyond existing project requirements
  - No modifications to source code, configuration, or tests
