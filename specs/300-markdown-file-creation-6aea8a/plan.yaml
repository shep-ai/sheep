content: |
  ## Architecture Overview

  This feature creates a single markdown test artifact following the well-established pattern demonstrated
  across 300+ existing implementations in the Sheep platform. The implementation is straightforward:

  1. **File Creation**: Use Python pathlib to write a markdown file with:
     - Exactly one H1 heading (markdown `#` syntax)
     - 2-3 sentences of prose content (100-300 characters)
     - UTF-8 encoding without BOM
     - LF (Unix-style) line endings

  2. **Validation**: Verify file structure and content before git operations:
     - H1 heading count validation
     - Sentence count and character length validation
     - Encoding and line ending validation

  3. **Git Workflow**: Use GitPython (existing project dependency) to:
     - Stage the file with `git add`
     - Commit with conventional message: `feat(300): create markdown file test-tq8wxa.md with prose content`
     - Push to feature branch: `feat/300-markdown-file-creation-6aea8a`

  The implementation requires no modifications to source code (`/src/sheep/`), configuration files, or tests.
  It is purely an artifact creation feature that follows established patterns and conventions.

  ## Key Design Decisions

  ### 1. File I/O with pathlib.Path

  **Chosen**: `pathlib.Path.write_text(content, encoding='utf-8')`

  **Rationale**:
  - Modern Python 3.11+ recommended approach (PEP 3151)
  - Built-in encoding parameter ensures UTF-8 without BOM
  - Cross-platform path handling (Windows/Unix automatic)
  - Clean object-oriented API

  ### 2. Sentence Validation with Regex

  **Chosen**: Python `re` module with sentence boundary pattern

  **Rationale**:
  - Uses only Python standard library (aligns with NFR-6: no external dependencies)
  - Spec explicitly lists "re module (sentence boundary detection)" as technology
  - Simple pattern `r'[.!?]+'` efficiently detects sentence boundaries
  - Lightweight and maintainable

  ### 3. Fixed Prose Content (Any Topic)

  **Chosen**: Hand-composed prose meeting constraints (2-3 sentences, 100-300 characters)

  **Rationale**:
  - Spec resolves open question #1: "any arbitrary topic" reduces decision complexity
  - No content generation logic or topic validation needed
  - Deterministic and reproducible
  - Aligns with 300+ existing implementations using diverse topics

  ### 4. Git Integration with GitPython

  **Chosen**: GitPython 3.1.0+ (existing project dependency)

  **Rationale**:
  - Already available in project dependencies
  - Clean Pythonic API vs subprocess shell commands
  - Better error handling and control flow
  - Consistent with Sheep codebase patterns
  - Eliminates shell injection attack surface

  ### 5. Encoding and Line Ending Enforcement

  **Chosen**: Explicit UTF-8 (no BOM) + LF-only line endings

  **Rationale**:
  - `pathlib.write_text(encoding='utf-8')` naturally produces UTF-8 without BOM (Python default)
  - LF enforced by using `'\n'` in content (not `'\r\n'`)
  - Windows compatibility: explicitly use `'\n'`, avoid `os.linesep`
  - Validation: check for BOM bytes (EF BB BF) and `'\r'` characters

  ### 6. File Existence Conflict Resolution

  **Chosen**: Fail with clear error if file already exists

  **Rationale**:
  - Prevents destructive overwrites without consent
  - Violates principle of least surprise
  - Spec requires exact filename (no alternatives)
  - Feature pattern assumes fresh feature branch

  ## Implementation Strategy

  **Phase 1 (File Creation and Validation)** comes first because:
  - Must create valid content before git operations
  - Validation ensures file meets all requirements before staging
  - Fail-fast approach: catch structural issues before commit

  **Phase 2 (Git Integration)** comes second because:
  - Depends on validated file from Phase 1
  - Git operations are mechanical and straightforward
  - Final step pushes artifact to feature branch

  The approach is linear with no parallelization, as Phase 2 depends on Phase 1 completion.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists in repo | Check file existence before creation; fail with clear error message |
  | Prose content fails validation | Compose content manually to ensure 2-3 sentences and 100-300 characters before file creation |
  | Encoding or line ending issues on Windows | Explicitly use UTF-8 encoding and '\n' (not os.linesep) to ensure LF line endings |
  | Git push fails | Verify feature branch exists before push; check git remote configuration |
  | Incomplete git history | Use GitPython API for atomic add/commit/push operations with proper error handling |
  | Markdown syntax invalid | Simple structure (H1 + sentences) is always valid CommonMark; no external validation needed |
