# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-31
  - **Feature:** markdown-file-creation-6aea8a (Feature 300)
  - **Completion:** Research phase completed

  ## Executive Summary

  This feature creates a single markdown file following the well-established pattern used in 300+ existing test file implementations.
  Technical scope is minimal: file I/O, sentence validation, and git workflow. No complex architectural decisions,
  external dependencies (beyond existing project deps), or novel patterns required.

  ## Technology Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** Python pathlib.Path with write_text() method and explicit encoding parameter

  **Rejected:**
  - Built-in open() function — less object-oriented, requires manual path handling, not recommended practice
  - os.path module — older API from pre-pathlib era, string-based manipulation, deprecated for modern Python

  **Rationale:**
  pathlib.Path is the modern, recommended approach for file I/O in Python 3.11+. Benefits include:
  - Clean object-oriented API for path and file operations
  - Built-in encoding parameter (encoding='utf-8') for proper UTF-8 handling without BOM
  - Cross-platform path handling (Windows/Unix automatically handled)
  - Consistent with Python ecosystem best practices (PEP 3151)
  - Likely already used in existing create_markdown.py module

  Implementation pattern:
  ```python
  from pathlib import Path
  content = "# Title\n\nFirst sentence. Second sentence. Third sentence."
  Path('test-tq8wxa.md').write_text(content, encoding='utf-8')
  ```

  ### 2. Sentence Validation: Regex-Based Pattern Matching

  **Chosen:** Python re module with sentence boundary patterns

  **Rejected:**
  - NLTK library — external dependency, overkill, requires additional configuration
  - spaCy library — heavy NLP library, external dependency, excessive complexity
  - Simple string.split('.') — fragile, doesn't handle multiple punctuation marks, abbreviations

  **Rationale:**
  The spec explicitly lists "Python re module (sentence boundary detection)" as a technology. Using regex is optimal because:
  - Uses only Python standard library (aligns with NFR-6: no external dependencies)
  - Sufficient for detecting sentences ending with '.', '!', or '?'
  - Simple to implement and understand
  - Aligns with established pattern in create_markdown.py

  Implementation pattern:
  ```python
  import re
  sentences = [s.strip() for s in re.split(r'[.!?]+', content.strip()) if s.strip()]
  sentence_count = len(sentences)  # Validate: 2 <= sentence_count <= 3
  character_count = len(content)   # Validate: 100 <= character_count <= 300
  ```

  ### 3. Content Generation: Fixed Prose, Any Topic

  **Chosen:** Hand-composed prose content (any topic, meeting constraints)

  **Rejected:**
  - Random topic generation — requires topic selection logic, unnecessary complexity
  - LLM-based generation — external dependency, overkill, introduces non-determinism
  - Template-based approach — still requires design decisions, adds abstraction without benefit

  **Rationale:**
  Fixed, pre-composed prose is ideal because:
  - Spec resolves open question #1 as "any arbitrary topic" — flexible content selection
  - No validation logic needed if content is composed to meet requirements (100-300 chars, 2-3 sentences)
  - Simpler, deterministic, reproducible implementation
  - Aligns with established pattern across 300+ existing test files
  - Content can be any topic (technical explanation, joke, design pattern, etc.)

  Example valid content:
  ```
  # Programming Concepts

  Functional programming emphasizes immutability and pure functions. This paradigm enables easier reasoning about code behavior and facilitates parallel processing. Understanding lambda expressions and higher-order functions is essential for modern development.
  ```

  Character count: ~220 characters (within 100-300 range)
  Sentence count: 3 (valid, 2-3 sentences required)

  ### 4. Git Integration: GitPython Library

  **Chosen:** GitPython 3.1.0+ (existing project dependency)

  **Rejected:**
  - subprocess with git CLI commands — requires shell escaping, less Pythonic, harder to maintain
  - dulwich library — low-level control, not already a dependency, adds complexity
  - Manual byte-level git operations — excessive complexity, no practical benefit

  **Rationale:**
  GitPython is the right choice because:
  - Already listed in project dependencies (GitPython 3.1.0+), no additional packages needed
  - Provides clean Pythonic API for git operations (add, commit, push)
  - Consistent with existing Sheep codebase patterns for git integration
  - Better error handling and control flow compared to subprocess approach
  - More testable and mockable than subprocess-based implementation

  Implementation pattern:
  ```python
  from git import Repo
  repo = Repo('.')  # Current repository
  repo.index.add(['test-tq8wxa.md'])
  repo.index.commit('feat(300): create markdown file test-tq8wxa.md with prose content')
  repo.remotes.origin.push('feat/300-markdown-file-creation-6aea8a')
  ```

  ### 5. Encoding and Line Ending Enforcement

  **Chosen:** Explicit UTF-8 encoding (no BOM) + LF-only line endings

  **Rejected:**
  - Using 'utf-8-sig' encoding — confusing, would handle BOM on read but create issues on write
  - Manual byte-level control — low-level complexity, error-prone
  - Skipping validation — violates spec success criteria

  **Rationale:**
  UTF-8 without BOM and LF-only line endings must be explicitly enforced:
  - pathlib.Path.write_text(encoding='utf-8') naturally produces UTF-8 without BOM (Python default)
  - LF line endings enforced by:
    - Using '\n' in string literals (not '\r\n')
    - Windows compatibility: explicitly use '\n', avoid os.linesep
    - Post-processing: strip any '\r' characters if needed
  - Validation:
    - Check for BOM bytes (EF BB BF) in binary read
    - Verify no '\r' characters exist
    - Confirm file size is 400-600 bytes (natural result of constraints)

  Implementation:
  ```python
  # Enforce LF line endings (important on Windows)
  content = "# Title\n\nSentence one. Sentence two. Sentence three."
  Path('test-tq8wxa.md').write_text(content, encoding='utf-8')  # Ensures UTF-8, no BOM

  # Validation
  binary_content = Path('test-tq8wxa.md').read_bytes()
  assert not binary_content.startswith(b'\xef\xbb\xbf'), "File has BOM"
  assert b'\r' not in binary_content, "File has CRLF line endings"
  assert 400 <= len(binary_content) <= 600, "File size out of range"
  ```

  ### 6. File Existence Conflict Resolution

  **Chosen:** Fail with clear error if file already exists

  **Rejected:**
  - Silently overwrite — destructive, violates principle of least surprise
  - Generate alternative filename — violates spec requirement for exact filename
  - Append to existing file — changes semantics, violates spec

  **Rationale:**
  Clear error handling on file conflict:
  - Spec requires exact filename 'test-tq8wxa.md', no alternatives allowed
  - Overwriting without user consent is dangerous and destructive
  - Clear error message aids debugging and prevents silent failures
  - Feature pattern assumes fresh feature branches (file shouldn't pre-exist)

  Implementation:
  ```python
  filepath = Path('test-tq8wxa.md')
  if filepath.exists():
      raise FileExistsError(f"File {filepath} already exists in repository root")
  filepath.write_text(content, encoding='utf-8')
  ```

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | Use | Standard library, modern Python API, built-in encoding support |
  | re (stdlib) | Sentence boundary detection | Use | Standard library, sufficient for regex-based pattern matching |
  | GitPython 3.1.0+ | Git operations (add, commit, push) | Use | Existing project dependency, Pythonic API, consistent with codebase patterns |
  | NLTK | NLP sentence tokenization | Reject | External dependency, overkill for simple sentence counting, adds complexity |
  | spaCy | Advanced NLP | Reject | External dependency, heavy library, excessive complexity |
  | Markdown validation libs | CommonMark compliance | Reject | Not necessary — prose structure constraints (2-3 sentences, 100-300 chars) ensure valid markdown; simple H1 heading + sentences is always valid |
  | pathspec/gitignore libs | Git pattern matching | Reject | Not needed for single file, simple git add/commit/push sufficient |

  ## Security Considerations

  1. **File Overwrite Protection**
     - Explicit check for file existence prevents accidental data loss
     - Clear error messages aid debugging without exposing sensitive information

  2. **Command Injection Prevention**
     - Using GitPython API instead of subprocess eliminates shell injection risks
     - GitPython abstracts git operations, no shell metacharacter handling needed

  3. **Encoding Safety**
     - Explicit UTF-8 encoding without BOM prevents encoding-related vulnerabilities
     - File content is hardcoded prose (no user input), no injection vectors

  4. **Repository Integrity**
     - GitPython's Repo API verifies repository state before operations
     - Conventional commit message format follows security best practices

  5. **No Secrets or Credentials**
     - File is public markdown content, no sensitive data
     - No configuration, API keys, or credentials involved

  ## Performance Implications

  1. **File I/O Performance**
     - Single file write operation is negligible (400-600 bytes)
     - pathlib.write_text() is optimized for modern Python versions
     - No performance bottlenecks for this operation

  2. **Git Operations**
     - GitPython operations are fast for single-file add/commit/push
     - Network latency on git push is dominant factor (expected)
     - No database queries or expensive operations involved

  3. **Sentence Validation**
     - Regex split on sentence boundaries is O(n) where n = content length
     - Content is small (100-300 chars), negligible computational cost
     - No regex compilation overhead (compile pattern once if in production)

  4. **Scalability**
     - Single-file creation has no scalability implications
     - No loops, batch operations, or external API calls
     - Feature runs in 10-15 minutes as per spec estimates

  5. **Memory Usage**
     - All operations work with in-memory strings (400-600 bytes)
     - No large data structures, no memory overhead
     - Minimal memory footprint

  ## Architecture Notes

  1. **Integration with Sheep Codebase**
     - Feature follows established pattern from 300+ existing implementations
     - Uses existing project dependencies (pathlib, GitPython)
     - No new external dependencies required (aligns with NFR-6)
     - No modifications to src/sheep/, configuration, or tests

  2. **Alignment with Existing Patterns**
     - Markdown file creation pattern: one H1 heading + 2-3 sentences prose
     - Git workflow: conventional commits, feature branch push
     - File location: repository root directory
     - Content validation: sentence count, character length, encoding, line endings
     - These patterns are consistent across 300+ existing features

  3. **Error Handling**
     - File existence check with clear error messages
     - Git operation failures propagate with GitPython exceptions
     - Validation failures detected before git operations (fail-fast)
     - No silent failures or unexpected state changes

  4. **Implementation Location**
     - Feature implementation likely in existing create_markdown.py module
     - Follows patterns already established in that module
     - No new modules or refactoring needed
     - Minimal code addition (likely <50 lines of straightforward Python)

  5. **Testing Approach** (not applicable per NFR-3, but documented for completeness)
     - File creation: verify file exists, content correct, encoding valid
     - Sentence validation: test regex pattern on various sentence structures
     - Git operations: mock GitPython Repo object, verify add/commit/push called
     - No integration tests needed (spec explicitly says no test modifications)

  ## Summary

  This feature requires creating a single markdown file following an extremely well-established pattern
  (300+ existing implementations). Technical decisions are straightforward:

  - Use **pathlib** for modern, clean file I/O
  - Use **regex (re module)** for sentence validation
  - Compose **fixed prose content** (any topic)
  - Use **GitPython** for git operations (existing dependency)
  - Enforce **UTF-8 without BOM** and **LF line endings** explicitly
  - **Fail with clear errors** on file conflicts

  No complex architectural decisions, external dependencies beyond project scope, or security concerns.
  Feature is well-contained, follows existing patterns, and can be implemented in 10-15 minutes with
  minimal code changes. All technical decisions are grounded in established Sheep platform patterns
  proven across 300+ feature implementations.
