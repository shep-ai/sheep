decisions:
  - title: 'File Creation Method'
    chosen: 'Python pathlib.Path.write_text() with UTF-8 encoding'
    rejected:
      - 'Built-in open() with context manager — slightly more verbose, requires manual encoding specification and close handling; pathlib abstracts these concerns'
      - 'os.open() with os.write() — lower-level, requires manual file descriptor management and manual encoding conversion; pathlib provides cleaner API'
      - 'shutil or other utility modules — unnecessary overhead; direct file writing is simpler and more direct for this use case'
    rationale: >
      pathlib.Path.write_text() is the modern Python standard library approach for simple file writing.
      It handles encoding specification elegantly (write_text(content, encoding='utf-8')), is cross-platform,
      automatically closes the file, and is readable. The codebase consistently uses pathlib for file operations
      (as evidenced by 87+ prior features using identical pattern). This approach requires zero external dependencies.

  - title: 'Content Format and Structure'
    chosen: 'H1 markdown heading on first line, blank line, then 2-3 sentences of prose'
    rejected:
      - 'H2 or H3 heading format — inconsistent with established pattern and less suitable for document titles'
      - 'Multiple sections with subheadings — adds unnecessary complexity; spec explicitly requires H1 + prose only'
      - 'Bullet points or lists instead of prose — violates spec requirement for "sentences of prose content"'
      - 'Metadata block (YAML front matter) — not required by spec, adds complexity, inconsistent with 87+ prior features'
    rationale: >
      The spec explicitly requires H1 heading + 2-3 sentences. This format is validated across 87+ prior
      features (069-087) with consistent, high-quality prose. The simplicity of this format reduces cognitive
      load for content generation and validation. Sample analysis: test-tq33xp.md (371 bytes) and test-lwosg1.md
      (458 bytes) demonstrate that this structure naturally produces files in the target 320-600 byte range.

  - title: 'Text Encoding and Line Endings'
    chosen: 'UTF-8 encoding without BOM, Unix-style LF line endings only'
    rejected:
      - 'UTF-8 with BOM — introduces unnecessary byte order marker (3-byte prefix), causes issues with Unix tools and git diff visualization, not standard for source files'
      - 'Windows CRLF (\r\n) line endings — creates platform-specific files, causes git diffs to show entire file as modified, inconsistent with Unix/Linux best practices'
      - 'ASCII encoding — insufficient for international characters, modern Python 3 defaults to UTF-8 anyway, unnecessarily restrictive'
    rationale: >
      UTF-8 without BOM is the Unix/Linux standard, git best practice, and required by spec (NFR-1, NFR-2).
      pathlib.Path.write_text() defaults to the system encoding on Python 3, but explicitly specifying
      encoding='utf-8' ensures consistency across platforms (Windows, macOS, Linux). LF line endings (\n)
      are enforced by the pathlib write_text() method in Python 3 on all platforms when not explicitly
      set to universal newlines mode. This prevents platform-specific drift and ensures files are git-clean
      across different developer environments.

  - title: 'Prose Topic Selection'
    chosen: 'Flexible selection from generic/universal topics (productivity, learning, wellness, etc.)'
    rejected:
      - 'Deterministic random generation (hashlib, uuid seeding) — adds unnecessary complexity, makes content less coherent; human topic selection is simpler'
      - 'Fixed topic rotation (cycling through predefined topics) — creates less variety, appears artificial'
      - 'AI-generated topics from LLM — adds latency, network dependency, cost, and complexity; spec allows flexible human topic selection'
    rationale: >
      The spec (FR-5) explicitly allows flexible topic selection: "any generic/universal topic is acceptable."
      Observed examples across 87+ prior features include "The Importance of Regular Breaks," "The Power of Reading,"
      suggesting that human-curated topics produce more coherent, engaging prose. This approach requires zero complexity,
      no LLM cost, and leverages the specification's explicit flexibility to keep implementation minimal.

  - title: 'Git Workflow Implementation'
    chosen: 'Standard shell git commands (git add, git commit, git push) via subprocess.run()'
    rejected:
      - 'GitPython library — adds external dependency, increases complexity, overkill for three simple commands; native commands are simpler and more reliable'
      - 'Subprocess with shell=True — security risk (command injection), less explicit; use shell=False with argument list'
      - 'Direct libgit2 bindings — excessive complexity, requires C compilation, Python 3.11+ compatibility concerns'
    rationale: >
      Git commands are simple and deterministic for this feature: `git add <filename>`, `git commit -m "<message>"`,
      `git push origin <branch>`. Standard subprocess.run() with shell=False and explicit argument lists is safe,
      reliable, and adds zero dependencies. The feature branch is pre-created (feat/088-markdown-file-creation-41f391),
      so only straightforward add/commit/push are needed. This approach mirrors git operations used throughout the
      Sheep codebase and prior features. No force flags, rebase, or complex git operations needed.

  - title: 'File Size Validation'
    chosen: 'Validate final file size is in range 320-600 bytes, warn if outside range'
    rejected:
      - 'Strict enforcement with failure — too rigid; 320-600 range is empirical observation, not hard constraint; warn is sufficient'
      - 'No validation — loses quality signal; file size is a useful heuristic for content completeness'
      - 'Different size target (e.g., 500 ± 100 bytes) — established precedent uses 320-600 range; consistency matters'
    rationale: >
      The spec (NFR-3) defines the 320-600 byte target empirically from observed test files. Analysis of existing
      files (test-tq33xp.md: 371 bytes, test-lwosg1.md: 458 bytes) confirms this is natural outcome of "H1 + 2-3 sentences"
      structure. Validation via file size is a quick sanity check for content completeness (too small = incomplete prose,
      too large = excessive verbosity). Warning mode (rather than strict failure) preserves developer flexibility while
      providing quality feedback. This aligns with spec NFR-3 requirement.

  - title: 'Commit Message Format'
    chosen: 'Conventional commit format: feat(088): create markdown file test-77rish.md with prose content'
    rejected:
      - 'Generic format (e.g., "Add file", "Update test files") — less informative, inconsistent with codebase convention'
      - 'Long-form commit messages — unnecessary; one-line summary is sufficient and spec-sufficient'
      - 'Custom format (e.g., "[FEATURE-088]") — inconsistent with established pattern in features 069-087'
    rationale: >
      The spec (FR-7) explicitly requires conventional commit format. Git history shows consistent pattern:
      "feat(087): create markdown file test-tq33xp.md with prose content", "feat(086): add markdown file creation feature..."
      Conventional Commits (https://www.conventionalcommits.org/) is a widely adopted standard, improves git history
      readability, enables automated changelog generation, and is already established in this codebase. The format
      includes the feature number (088), action (create), filename, and brief description (with prose content).

