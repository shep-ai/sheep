content: |
  ## Task Execution Flow

  The implementation follows a linear, dependency-ordered sequence:

  **Task 1 - File Creation (Phase 1):** Create the markdown file with proper format, topic,
  and encoding. This is the foundational work that enables all subsequent tasks. Uses
  pathlib.write_text() with explicit UTF-8 encoding to ensure consistent file creation
  across platforms. Topic selection is flexible; choose any generic/universal topic that
  produces 2-3 sentences of coherent prose (e.g., "The Importance of Regular Breaks,"
  "The Power of Reading," "Why Learning New Skills Matters").

  **Task 2 - Validation (Phase 2):** Validate the created file meets all specification
  requirements before committing to git. This quality gate ensures the file is correct before
  pushing. Validation checks: markdown format, UTF-8 encoding, LF line endings, file size
  (320-600 bytes), and prose coherence.

  **Task 3 - Git Integration (Phase 3):** Stage, commit, and push the file to the feature
  branch. This completes the feature implementation and makes the file available for review.

  ## TDD Approach

  Each task includes a RED-GREEN-REFACTOR cycle:

  - **RED:** Write tests that assert the desired behavior (file exists, git operations succeed, etc.)
  - **GREEN:** Implement minimal code to pass the tests (file creation, validation, git commands)
  - **REFACTOR:** Clean up code, improve error handling, verify compliance with specification

  For file creation and validation, TDD provides clear test criteria. For git operations, tests
  verify that files are staged and commits are created with correct messages. All success
  criteria are testable and objective.

  ## Key Implementation Notes

  - **Prose Topic:** Flexible selection. Examples: "The Importance of Regular Breaks," "The Power of
    Reading," "Why Morning Routines Matter," "The Value of Continuous Learning." Any generic/universal
    topic that produces coherent, complete sentences is acceptable.

  - **File Size Validation:** The target range 320-600 bytes is empirically derived from 87+ existing
    test files. Validation warns if outside range but does not fail, allowing developer flexibility.

  - **Platform Consistency:** Explicit use of `\n` in content string ensures Unix LF line endings on all
    platforms (Windows, macOS, Linux). pathlib.write_text() respects the string's line ending characters.

  - **Git Branch:** Feature branch `feat/088-markdown-file-creation-41f391` is pre-created. Push goes
    directly to this branch; no branch creation or switching needed.

  - **Conventional Commits:** Commit message format is standardized per specification:
    `feat(088): create markdown file test-77rish.md with prose content`
    This format includes feature number, action type (feat), and brief description.

  - **Error Handling:** Git operations should fail fast with clear error messages if user.name,
    user.email, or branch configuration is missing. Assume standard development environment.
