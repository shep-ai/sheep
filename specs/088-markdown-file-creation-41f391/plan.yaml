content: |
  ## Architecture Overview

  This feature creates a single test markdown file following an established pattern proven
  across 87+ prior features (069-087). The implementation is entirely self-contained at
  the repository root and does not integrate with the application source code (src/sheep/),
  configuration, or any subsystems.

  **Implementation Model:**
  - Direct file creation using Python's pathlib standard library (no external dependencies)
  - Standard git operations via subprocess with shell=False (safe, reliable, zero dependencies)
  - No agent, flow, or tool framework integration required
  - Output is immediately visible in file system and git; success criteria are objective
    and verifiable

  **Codebase Fit:**
  The markdown file creation pattern is well-established in this codebase, with 87+ test
  files already at the repository root following identical format, encoding, and git
  workflow patterns. This feature adds one more file to the collection using the same
  proven approach. No new architectural patterns, modules, or abstractions are introduced.

  ## Key Design Decisions

  All key design decisions have been researched and validated. The implementation leverages
  patterns proven across 87+ prior features:

  ### File Creation Method
  **Decision:** Use `pathlib.Path.write_text(content, encoding='utf-8')`

  **Rationale:** Modern Python standard library approach, zero external dependencies, handles
  encoding specification elegantly, automatically manages file closing, and is readable.
  Consistent with the codebase's use of pathlib for file operations across all prior features.

  ### Content Format
  **Decision:** H1 markdown heading on first line, blank line, followed by 2-3 sentences of prose

  **Rationale:** Explicit requirement in specification (FR-2, FR-3). Validated format across
  87+ prior features. Simple structure naturally produces files in the target 320-600 byte
  range. Example file sizes: test-tq33xp.md (371 bytes), test-lwosg1.md (458 bytes).

  ### Text Encoding and Line Endings
  **Decision:** UTF-8 without BOM, Unix-style LF line endings only

  **Rationale:** Unix/Linux standard, git best practice, required by specification (NFR-1,
  NFR-2). Explicit encoding specification ensures cross-platform consistency. LF-only line
  endings prevent platform-specific git diffs and file system drift.

  ### Prose Topic Selection
  **Decision:** Flexible human-curated topics from generic/universal domains

  **Rationale:** Specification (FR-5) allows flexible topic selection. Observed examples
  across 87+ prior features include "The Importance of Regular Breaks," "The Power of Reading,"
  demonstrating that human-curated topics produce coherent, engaging prose. Zero implementation
  complexity.

  ### Git Workflow
  **Decision:** Standard shell git commands via subprocess.run() with shell=False

  **Rationale:** Simple, deterministic operations (add, commit, push). subprocess with
  shell=False is safe, reliable, and requires zero external dependencies. Feature branch
  is pre-created, so only straightforward add/commit/push are needed. Consistent with git
  operations throughout the Sheep codebase.

  ### File Size Validation
  **Decision:** Validate file size is in 320-600 byte range; warn if outside range

  **Rationale:** Specification (NFR-3) defines 320-600 bytes as the expected range based on
  empirical observation of existing test files. File size is a useful sanity check (too small
  = incomplete prose, too large = excessive verbosity). Warn mode preserves developer
  flexibility while providing feedback.

  ### Commit Message Format
  **Decision:** Conventional commit format: `feat(088): create markdown file test-77rish.md with prose content`

  **Rationale:** Specification (FR-7) explicitly requires conventional commit format. Consistent
  with git history pattern across all prior features (069-087). Industry-standard format
  improves readability and enables automated tooling.

  ## Implementation Strategy

  The implementation follows a straightforward three-phase approach:

  **Phase 1 - File Creation:** Create the markdown file with proper format, topic selection,
  encoding, and line endings. Use pathlib.Path.write_text() with explicit UTF-8 encoding.
  Ensure the prose is grammatically correct, coherent, and complete (2-3 sentences).

  **Phase 2 - Validation & QA:** Validate the created file meets all specification
  requirements: correct location, markdown format, encoding, line endings, and file size.

  **Phase 3 - Git Integration:** Stage the file, create a conventional commit, and push to
  the feature branch. Use standard git commands via subprocess.run() with explicit argument
  lists (shell=False for safety).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Platform-specific line endings (CRLF on Windows, LF on Unix) | Explicitly use `\n` in content string; pathlib.write_text() respects this across platforms |
  | File size outside expected range (320-600 bytes) | Validate file size after creation; warn if outside range but do not fail (allows flexibility) |
  | Git configuration missing (user.name, user.email) | Assume git is already configured in development environment; fail gracefully if missing |
  | Feature branch doesn't exist or has wrong name | Verify branch name matches specification before push; feature branch is pre-created |
  | Encoding issues with non-ASCII characters | Stick to ASCII-compatible prose (standard English); UTF-8 handles all characters safely |
  | Merge conflicts or push rejection | Simple feature branch, no concurrency expected; unlikely to encounter conflicts |
