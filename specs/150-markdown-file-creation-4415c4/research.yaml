# Structured technology decisions
decisions:
  - title: "File I/O Library Selection"
    chosen: "pathlib.Path (Python standard library)"
    rejected:
      - "Built-in open() function — More verbose, requires manual file handle management with try/finally, less elegant than pathlib's object-oriented API"
      - "os.path module — Older API design, less type-safe, does not provide convenient text I/O methods like write_text()"
      - "External libraries (e.g., py.path) — Introduces unnecessary dependencies and deployment complexity when standard library is sufficient"
    rationale: >
      pathlib is the modern, Pythonic way to handle file I/O in Python 3.11+. It provides a clean,
      object-oriented API with built-in methods for text encoding (encoding parameter) and is already
      used across 100+ identical implementations in this codebase. pathlib.Path.write_text() handles
      UTF-8 encoding correctly without BOM by default, simplifying implementation and reducing boilerplate.
      No external dependencies needed, fully available in Python 3.11+ standard library.

  - title: "Text Encoding Strategy"
    chosen: "UTF-8 without BOM using pathlib.Path.write_text(encoding='utf-8')"
    rejected:
      - "ASCII encoding — Restricts content to ASCII characters only, unnecessarily limits prose flexibility; UTF-8 is the modern standard and superset of ASCII"
      - "Alternative encodings (latin-1, iso-8859-1) — Non-standard, problematic for internationalization; UTF-8 is the universal standard for text files"
      - "Manual BOM handling — Unnecessary complexity; pathlib.write_text() with UTF-8 does not add BOM by default, matching requirement NFR-1"
    rationale: >
      UTF-8 is the universally accepted standard for text files and is explicitly required by NFR-1.
      pathlib.Path.write_text(encoding='utf-8') automatically produces UTF-8-encoded files without BOM.
      This matches the established pattern from 100+ precedent implementations and satisfies both
      functional and non-functional requirements without custom encoding logic.

  - title: "Line Ending Handling"
    chosen: "Explicit LF line endings by including '\\n' in content string; Unix default line separator"
    rejected:
      - "Windows CRLF line endings — Violates requirement NFR-2 (Unix-style LF required), inconsistent with Unix environment"
      - "Manual newline conversion with os.linesep — Adds complexity, environment-dependent behavior; explicit \\n in content is clearer and more portable"
      - "Using file mode 'U' or newline parameter — Not necessary on Unix systems where default is already LF; adds unnecessary code"
    rationale: >
      The development environment is Unix/Linux-based (Linux 6.14.0 kernel), where the default line
      separator is already LF ('\\n'). By constructing the content string with explicit '\\n' line
      terminators (as shown in all 100+ precedent implementations), the file is guaranteed to have
      LF line endings on disk, satisfying NFR-2. This approach is simple, portable, and consistent
      with the established pattern.

