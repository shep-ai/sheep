content: |
  ## Summary

  Feature 285 requires 6 concrete tasks across 2 implementation phases, estimated at 14 minutes total effort.

  **Phase 1: File Creation & Content Structure (Tasks 1-3, ~8 minutes)**
  - Task 1 (3m): Create markdown file with pathlib.Path.write_text(), H1 heading, blank line, and 2-3 prose sentences
  - Task 2 (2m): Validate file encoding (UTF-8 without BOM) and line endings (LF only) using file inspection commands
  - Task 3 (3m): Validate markdown structure (H1 syntax, blank line, sentence count) and file size (400-600 bytes)

  **Phase 2: Git Integration (Tasks 4-6, ~6 minutes)**
  - Task 4 (2m): Stage file with `git add test-ptjhtf.md`
  - Task 5 (2m): Commit with conventional message `feat(285): create markdown file test-ptjhtf.md with prose content`
  - Task 6 (2m): Push to feature branch with `git push -u origin HEAD`

  Each task includes red-green-refactor TDD cycles with clear acceptance criteria. Tasks are ordered by dependency:
  file creation → encoding validation → structure validation → git staging → git commit → git push. No task
  depends on a later task; dependencies flow forward only (task-N depends on task-N-1).

  After all tasks complete, the feature is done: test-ptjhtf.md exists at repository root, contains properly
  formatted markdown content, is committed with conventional message, and is pushed to the feature branch.
  Working directory is clean (all changes committed and pushed per FR-11 and success criteria).
