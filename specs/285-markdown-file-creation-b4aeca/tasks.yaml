tasks:
  - id: task-1
    phaseId: phase-1
    title: "Create markdown file with H1 heading and prose content"
    description: "Create test-ptjhtf.md at repository root with H1 markdown heading and 2-3 sentences of prose. Prose should be clear, grammatically correct sentences related to automated testing or software platform domain. Use pathlib.Path.write_text() with explicit UTF-8 encoding."
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - "File test-ptjhtf.md exists at repository root"
      - "File starts with '# ' followed by a title (H1 heading syntax)"
      - "File contains blank line after heading"
      - "File contains exactly 2-3 sentences of prose content"
      - "Content is grammatically correct and meaningful"
      - "File uses pathlib.Path.write_text() with encoding='utf-8' parameter"
      - "No other files created or modified"
    tdd:
      red:
        - "Assert file 'test-ptjhtf.md' does not exist: `assert not Path('test-ptjhtf.md').exists()`"
        - "Define prose content constant with 2-3 sentences about automated testing framework"
        - "Assert file will have proper H1 heading structure after creation"
      green:
        - "Import pathlib: `from pathlib import Path`"
        - "Define prose content string: H1 heading + blank line + 2-3 sentences, using explicit \\n for line endings"
        - "Create file using Path('test-ptjhtf.md').write_text(content, encoding='utf-8')"
        - "Assert file now exists and contains expected content"
      refactor:
        - "Extract prose content to clearly named constant (e.g., PROSE_CONTENT)"
        - "Verify content string uses explicit '\\n' line separators (not implicit Python line breaks)"
        - "Ensure H1 heading has space after '#' per CommonMark spec"
    estimatedEffort: "3m"

  - id: task-2
    phaseId: phase-1
    title: "Validate file encoding (UTF-8 without BOM) and line endings (LF only)"
    description: "Verify created file uses UTF-8 encoding without BOM (Byte Order Mark) and LF line endings (Unix-style \\n, not CRLF). Use file -i command to check encoding, xxd to verify no BOM bytes, and cat -A to verify LF line endings."
    state: Todo
    dependencies:
      - task-1
    acceptanceCriteria:
      - "File encoding is UTF-8 (verified via 'file -i test-ptjhtf.md' output shows 'utf-8')"
      - "No BOM present in file (verified via 'xxd' showing no BOM bytes at start)"
      - "File uses only LF line endings (verified via 'cat -A' showing '$' at line ends, not '^M')"
      - "Validation runs after file creation and before git staging"
      - "Validation errors are reported clearly if any requirement fails"
    tdd:
      red:
        - "Assert: `result = subprocess.run(['file', '-i', 'test-ptjhtf.md'], capture_output=True, text=True); assert 'utf-8' in result.stdout`"
        - "Assert: `result = subprocess.run(['xxd', 'test-ptjhtf.md'], capture_output=True, text=True); assert 'efbb bf' not in result.stdout`  (no UTF-8 BOM)"
        - "Assert: `content = Path('test-ptjhtf.md').read_bytes(); assert b'\\r' not in content`  (no CR or CRLF)"
      green:
        - "Run `file -i test-ptjhtf.md` and capture output, verify 'utf-8' is present"
        - "Run `xxd test-ptjhtf.md` and verify no 'efbb bf' (UTF-8 BOM bytes)"
        - "Read file as bytes and verify no '\\r' byte (carriage return) present"
        - "Log validation results: 'Encoding validation: UTF-8 without BOM ✓'"
        - "Log validation results: 'Line endings validation: LF only ✓'"
      refactor:
        - "Extract file validation logic into helper function (e.g., validate_file_encoding)"
        - "Consolidate all encoding/line-ending checks into single validation step"
        - "Ensure error messages clearly identify which validation failed"
    estimatedEffort: "2m"

  - id: task-3
    phaseId: phase-1
    title: "Validate markdown structure and file size"
    description: "Verify markdown file structure meets CommonMark requirements: H1 heading with space, blank line separation, 2-3 sentences of prose. Verify file size is 400-600 bytes (natural outcome of proper H1 + prose structure). Perform manual structural validation without external parsing libraries."
    state: Todo
    dependencies:
      - task-2
    acceptanceCriteria:
      - "File starts with '# ' (H1 heading with space per CommonMark FR-2)"
      - "Second line is blank (blank line separation per CommonMark FR-3)"
      - "File contains exactly 2-3 sentences (counted by splitting on '.')"
      - "File size is between 400-600 bytes (natural outcome of proper structure per NFR-1)"
      - "All validation passes before proceeding to git operations"
      - "Validation errors block further progress with clear error message"
    tdd:
      red:
        - "Assert H1 heading: `content = Path('test-ptjhtf.md').read_text(encoding='utf-8'); lines = content.split('\\n'); assert lines[0].startswith('# ')`"
        - "Assert blank line: `assert lines[1] == ''`"
        - "Assert sentence count: `prose = ' '.join(lines[2:]); sentences = [s.strip() for s in prose.split('.') if s.strip()]; assert 2 <= len(sentences) <= 3`"
        - "Assert file size: `assert 400 <= Path('test-ptjhtf.md').stat().st_size <= 600`"
      green:
        - "Read file content as text with UTF-8 encoding"
        - "Split content by lines and verify first line starts with '# '"
        - "Verify second line is empty (blank line)"
        - "Join remaining lines and split by '.' to count sentences"
        - "Verify sentence count is 2 or 3 (inclusive)"
        - "Get file size from Path.stat().st_size and verify in range 400-600 bytes"
        - "Log validation success: 'Markdown structure validation ✓', 'File size validation: NNN bytes ✓'"
      refactor:
        - "Extract structure validation into helper function (e.g., validate_markdown_structure)"
        - "Improve sentence counting logic to handle edge cases (multiple spaces, abbreviations)"
        - "Consolidate all structure checks into single validation step"
        - "Display human-readable validation summary before proceeding"
    estimatedEffort: "3m"

  - id: task-4
    phaseId: phase-2
    title: "Stage file with git add"
    description: "Stage the created markdown file in the git index using 'git add test-ptjhtf.md'. Use subprocess.run() with check=True to ensure command succeeds or raises exception."
    state: Todo
    dependencies:
      - task-3
    acceptanceCriteria:
      - "Command 'git add test-ptjhtf.md' executes successfully"
      - "File is staged in git index (verified by 'git status' showing 'Changes to be committed: new file: test-ptjhtf.md')"
      - "No other files are staged"
      - "Command failure raises subprocess.CalledProcessError with clear error message"
    tdd:
      red:
        - "Assert git add success: `result = subprocess.run(['git', 'add', 'test-ptjhtf.md'], check=True)`"
        - "Assert file is staged: `result = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True); assert 'A  test-ptjhtf.md' in result.stdout`"
      green:
        - "Import subprocess: `import subprocess`"
        - "Execute: `subprocess.run(['git', 'add', 'test-ptjhtf.md'], check=True)`"
        - "Verify staging by running `git status --porcelain` and checking output contains 'A  test-ptjhtf.md'"
        - "Log success: 'Staged test-ptjhtf.md with git add ✓'"
      refactor:
        - "Extract git operations into helper function (e.g., run_git_command)"
        - "Add error handling to provide clear error messages if git add fails"
        - "Verify command output to confirm file is properly staged"
    estimatedEffort: "2m"

  - id: task-5
