      - "No other changes are committed"
      - "Command failure raises exception with clear error message"
    tdd:
      red:
        - "Assert commit message: `commit_msg = 'feat(285): create markdown file test-ptjhtf.md with prose content'`"
        - "Assert commit succeeds: `subprocess.run(['git', 'commit', '-m', commit_msg], check=True)`"
        - "Assert commit log shows message: `result = subprocess.run(['git', 'log', '--oneline', '-1'], capture_output=True, text=True); assert '285' in result.stdout`"
      green:
        - "Define commit message constant: 'feat(285): create markdown file test-ptjhtf.md with prose content'"
        - "Execute: `subprocess.run(['git', 'commit', '-m', commit_msg], check=True)`"
        - "Verify commit by checking git log: `subprocess.run(['git', 'log', '--oneline', '-1'])`"
        - "Log success: 'Committed with message: feat(285): create markdown file test-ptjhtf.md with prose content ✓'"
      refactor:
