content: |
  ## Architecture Overview

  This feature follows the established markdown-file-creation pattern used across 285+ prior features in the
  Sheep automation platform. The implementation is minimal and isolated, creating a single test artifact file
  at the repository root with no modifications to source code, tests, or configuration files.

  **Key architectural characteristics:**
  - **Isolation**: Feature creates only one new file (test-ptjhtf.md); no modifications to existing files
  - **Pattern adherence**: Follows identical structure from features 282-284 (H1 + blank line + prose)
  - **No dependencies**: Uses only Python 3.11+ standard library (pathlib, subprocess); no external packages
  - **Deterministic**: Hard-coded prose content ensures predictable, grammatically correct output
  - **Standard git workflow**: Uses conventional commits and feature branches (established pattern)

  The feature fits the existing codebase as a test validation artifact demonstrating the Sheep platform's
  ability to automate file creation and version control integration. The test files accumulate at the repository
  root as evidence of successful automation across a large feature set.

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Decision**: Use `pathlib.Path('test-ptjhtf.md').write_text(content, encoding='utf-8')` for file creation.

  **Rationale**: pathlib is the modern Python standard for text file operations (Python 3.11+). It provides:
  - Clean, readable syntax compared to open() boilerplate
  - Explicit encoding control via the `encoding` parameter
  - Automatic UTF-8 encoding without BOM (Python default UTF-8 codec behavior)
  - Preservation of LF line endings on Unix systems (default behavior)
  - Proven pattern from 285+ prior features in Sheep platform

  **Alternatives considered**:
  - `open()` with manual encoding — more verbose, older pattern
  - `write_bytes()` with manual encoding — requires extra encoding step, less readable

  ### 2. Prose Content: Hard-Coded String Constant

  **Decision**: Use pre-written, fixed prose content stored as a string constant.

  **Rationale**: Hard-coded prose is:
  - Simple and deterministic (no generation or randomization)
  - Guaranteed grammatically correct (meets NFR-8 requirement)
  - Requires no external dependencies or libraries
  - Requires no validation beyond structure checks
  - Appropriate because content is constant (not user-generated)

  **Alternatives considered**:
  - Generated content (Lorem ipsum, random) — introduces variability and quality risk
  - Template-based (Jinja2, format strings) — adds unnecessary dependency for simple 2-3 sentences
  - External sources (API, file) — introduces failure points and external dependencies

  ### 3. Git Operations: subprocess.run()

  **Decision**: Execute git commands directly using `subprocess.run(['git', ...], check=True)`.

  **Rationale**: subprocess is the Python standard library approach for executing external commands. It:
  - Requires no external dependencies (GitPython)
  - Provides safe command execution with proper argument quoting (list form, not shell=True)
  - Is reliable and standard across 280+ prior feature implementations
  - Is simple and clear for straightforward three-command workflow (add → commit → push)

  **Alternatives considered**:
  - GitPython library — adds external dependency for minimal gain
  - os.system() / os.popen() — less safe and less portable
  - Custom wrapper abstraction — over-engineered for simple operations

  ### 4. Encoding and Line Endings: Explicit UTF-8, Explicit LF

  **Decision**: Use `encoding='utf-8'` in write_text(); ensure prose content uses `\n` (not `\r\n`).

  **Rationale**:
  - Python's UTF-8 codec does not add BOM by default (meets FR-6: UTF-8 without BOM)
  - Content strings with explicit `\n` are preserved as-is on Unix systems (meets FR-7: LF line endings)
  - Explicit encoding ensures consistency across platforms
  - Simple, deterministic, requires no post-processing or file conversion

  **Verification**: File inspection via `file -i`, `xxd`, and `cat -A` confirms encoding and line endings.

  ### 5. Validation: Manual Structural Validation

  **Decision**: Manually validate output file structure against CommonMark requirements without external libraries.

  **Rationale**:
  - Markdown structure is trivial (H1 + blank line + prose) — no parsing library needed
  - Manual validation can verify: H1 heading, blank line, sentence count, file size, encoding, line endings
  - Requires no external dependency (commonmark, markdown-it-py)
  - Clear, maintainable, sufficient for simple content structure

  **Validation steps**:
  1. File starts with `# ` (H1 heading syntax per CommonMark)
  2. Blank line after heading
  3. 2-3 sentences in prose section
  4. File size 400-600 bytes (natural outcome of proper structure)
  5. UTF-8 encoding confirmed via file inspection
  6. LF line endings confirmed via file inspection

  ## Implementation Strategy

  ### Phase 1: File Creation & Content Structure

  This phase focuses on creating the markdown file with correct content structure and encoding. The file must:
  - Contain exactly one H1 heading (`# Title`)
  - Include a blank line after the heading
  - Include 2-3 complete sentences of prose
  - Use UTF-8 encoding without BOM
  - Use LF line endings only
  - Result in file size 400-600 bytes

  **Why Phase 1 comes first**: File creation is foundational; content structure must be correct before git integration.
  Validation ensures the file meets all requirements (FR-1 through FR-7) before moving to git workflow.

  ### Phase 2: Git Integration

  This phase stages the created file, commits with a conventional commit message, and pushes to the feature branch.
  The workflow follows the established pattern:
  - `git add test-ptjhtf.md`
  - `git commit -m "feat(285): create markdown file test-ptjhtf.md with prose content"`
  - `git push -u origin HEAD`

  **Why Phase 2 comes after Phase 1**: File must be created and validated before staging. Cannot commit invalid content.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File not created or write fails | Explicit error handling in subprocess/pathlib; validation step catches file creation failures |
  | Incorrect encoding (not UTF-8) | Use explicit `encoding='utf-8'` parameter in write_text(); verify with `file -i` command |
  | Incorrect line endings (CRLF instead of LF) | Explicitly use `\n` in content string; pathlib preserves on Unix; verify with `cat -A` |
  | BOM in UTF-8 file | Python's UTF-8 codec does not add BOM; use standard 'utf-8' (not 'utf-8-sig') |
  | File size out of range (not 400-600 bytes) | Validation checks file size; if out of range, indicates content issue (easily fixed) |
  | Markdown structure invalid | Manual validation of H1, blank line, sentence count before committing |
  | Git operations fail | Use `check=True` in subprocess.run() to raise exception on command failure; handle and report |
  | Wrong commit message | Commit message is hard-coded in code; guaranteed correct |
  | Push fails (network, auth) | Git configuration (user.name, user.email) assumed to be set; push failure is rare in CI/CD environment |

  ## Implementation Notes

  ### Content Generation

  The prose content is a fixed string constant related to the Sheep automation platform or testing domain.
  Example structure:
  ```
  # Automated Testing Framework

  The Sheep platform uses CrewAI to automate software implementation tasks with agent-based coordination.
  Automated testing ensures the platform creates valid markdown files with correct formatting and structure.
  This test file demonstrates successful integration of file creation, git staging, and version control operations.
  ```

  This provides clear, grammatically correct prose (3 sentences) that is meaningful in the platform context.

  ### File Path

  File path is hard-coded as the repository root with no path traversal or dynamic construction:
  ```python
  from pathlib import Path
  Path("test-ptjhtf.md").write_text(...)
  ```

  This is secure and simple.

  ### No External Dependencies

  Implementation uses only Python 3.11+ standard library:
  - `pathlib.Path` (file I/O)
  - `subprocess` (git operations)
  - Built-in string and file operations

  No pip packages or external libraries are required.

  ---

  Implementation plan complete — Ready for task breakdown and execution phase.
