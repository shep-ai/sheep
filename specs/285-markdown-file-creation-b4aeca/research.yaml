# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Completed 2026-03-30)
  - **Technical decisions:** 5 finalized
  - **Open questions resolved:** 3
  - **External dependencies required:** None (Python 3.11+ stdlib only)

  ## Executive Summary

  This feature creates a single markdown file (test-ptjhtf.md) with H1 heading and 2-3 sentences of prose.
  Implementation uses Python pathlib for file I/O, hard-coded prose to avoid dependencies, subprocess for git
  operations, and manual validation of output. No external libraries required; all work uses Python 3.11+ standard
  library (pathlib, subprocess) plus git CLI.

  ## Technology Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-ptjhtf.md').write_text(content, encoding='utf-8')`

  **Rejected:**
  - `open()` with manual encoding — more verbose, older pattern; pathlib is cleaner and more modern
  - `write_bytes()` with manual encoding — requires extra encoding step; write_text() is more readable

  **Rationale:**
  pathlib.Path.write_text() is the modern Python standard for text file operations. It provides clean syntax,
  explicit encoding control, and is available in Python 3.11+ (project baseline). By default on Unix systems,
  write_text() uses UTF-8 encoding and preserves '\\n' line endings, meeting both encoding requirements (FR-6, FR-7).
  This matches the implementation pattern from 285+ precedent features in the Sheep platform.

  **Example:**
  ```python
  from pathlib import Path

  content = "# Test Heading\\n\\nThis is a test sentence. This is another sentence. And a third sentence.\\n"
  Path("test-ptjhtf.md").write_text(content, encoding='utf-8')
  ```

  ### 2. Markdown Content Generation: Hard-Coded Prose

  **Chosen:** Pre-written, fixed prose content stored as a string constant

  **Rejected:**
  - Generated content (Lorem ipsum, procedural) — introduces variability and potential quality issues
  - Template-based content (Jinja2) — adds unnecessary dependency and complexity
  - External sources (API, file) — introduces failure points and external dependencies

  **Rationale:**
  The requirement is for "2-3 sentences of prose content" with "clear, grammatically correct sentences" (NFR-8).
  Hard-coded prose is simple, reliable, deterministic, and grammatically correct. Since the content is a constant
  (not user input), hard-coding is appropriate. No validation is needed because content is pre-verified. This
  approach requires no external libraries and matches the pattern from 285+ prior features.

  **Content Example:**
  ```
  # Automated Testing Framework

  The Sheep platform uses CrewAI to automate software implementation tasks with agent-based coordination.
  Automated testing ensures the platform creates valid markdown files with correct formatting and structure.
  This test file demonstrates successful integration of file creation, git staging, and version control operations.
  ```

  ### 3. Git Operations: subprocess.run()

  **Chosen:** Execute git commands directly using `subprocess.run()`

  **Rejected:**
  - GitPython library — adds external dependency; subprocess is standard library
  - os.system() / os.popen() — less safe and less portable than subprocess
  - Custom wrapper abstraction — over-engineered for three simple commands

  **Rationale:**
  subprocess.run() is the recommended Python standard approach for executing external commands. The git workflow
  is straightforward (git add, git commit, git push), making subprocess sufficient without external dependencies.
  This approach is reliable, standard, and matches patterns across 280+ prior feature implementations. Error
  handling is available via returncode and exceptions.

  **Implementation Pattern:**
  ```python
  import subprocess

  # Stage file
  subprocess.run(['git', 'add', 'test-ptjhtf.md'], check=True)

  # Commit with conventional message
  subprocess.run(['git', 'commit', '-m', 'feat(285): create markdown file test-ptjhtf.md with prose content'],
                 check=True)

  # Push to feature branch
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  ### 4. Encoding and Line Endings: UTF-8 without BOM, LF Only

  **Chosen:** `encoding='utf-8'` parameter in write_text(); explicit '\\n' in content strings

  **Rejected:**
  - System default encoding — may not be UTF-8; explicit encoding ensures consistency
  - Binary mode with manual encoding — verbose and less readable
  - Post-processing (sed, dos2unix) — fragile; better to control at write time

  **Rationale:**
  Python's pathlib.write_text(content, encoding='utf-8') ensures UTF-8 encoding without BOM (Python's UTF-8 codec
  does not add BOM by default). On Unix systems, write_text() preserves '\\n' exactly as specified in the content
  string, meeting the LF line-ending requirement (FR-7). This approach is simple, deterministic, and correct.

  **Verification:**
  ```bash
  # Verify UTF-8 encoding (should show "utf-8" in output)
  file -i test-ptjhtf.md

  # Verify no BOM (should output "0" meaning no BOM bytes)
  xxd test-ptjhtf.md | head -1

  # Verify LF line endings (should show "$" at end of lines, not "^M")
  cat -A test-ptjhtf.md
  ```

  ### 5. Markdown Validation: Manual Structural Validation

  **Chosen:** Manual inspection of output file against CommonMark requirements

  **Rejected:**
  - Markdown parsing library (markdown-it-py, commonmark) — adds external dependency; unnecessary for simple content
  - Skip validation entirely — risks missing issues; manual validation provides assurance
  - Post-commit validation — too late to fix; validate before commit

  **Rationale:**
  The markdown structure is trivial (H1 + blank line + 2-3 sentences). Manual validation is sufficient and requires
  no external library. Validation steps:
  1. Verify file starts with '# ' (H1 heading per FR-2)
  2. Verify blank line after heading (FR-3)
  3. Verify 2-3 sentences of prose (FR-4)
  4. Verify file size 400-600 bytes (NFR-1)
  5. Verify UTF-8 encoding and LF line endings via file inspection

  **Validation Pseudocode:**
  ```python
  # Read file and verify structure
  content = Path("test-ptjhtf.md").read_text(encoding='utf-8')
  lines = content.split('\\n')

  assert lines[0].startswith('# '), "Missing H1 heading"
  assert lines[1] == '', "Missing blank line after heading"
  prose = ' '.join(lines[2:])
  sentences = [s.strip() for s in prose.split('.') if s.strip()]
  assert 2 <= len(sentences) <= 3, f"Expected 2-3 sentences, got {len(sentences)}"
  assert 400 <= Path("test-ptjhtf.md").stat().st_size <= 600, "File size out of range"
  ```

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | Use | Standard library, available in Python 3.11+, handles encoding/encoding correctly |
  | subprocess (stdlib) | Execute git commands | Use | Standard library, safe, reliable, no external dependencies needed |
  | gitpython | Python git abstraction | Reject | Adds external dependency; subprocess is sufficient for simple workflow |
  | commonmark / markdown-it-py | Markdown validation | Reject | Adds external dependency; manual validation is sufficient for trivial structure |
  | jinja2 / string templates | Content generation | Reject | Adds external dependency; hard-coded prose is simpler and equally effective |

  ## Security Considerations

  ### File Path Security
  - **Risk:** File path traversal or injection attacks
  - **Mitigation:** File name is hard-coded as 'test-ptjhtf.md' (no user input in path); pathlib handles path safely
  - **Status:** ✓ Secure — no user input in file path

  ### Content Security
  - **Risk:** Markdown injection or XSS via prose content
  - **Mitigation:** Content is hard-coded (not user-generated); no variable interpolation or external input used
  - **Status:** ✓ Secure — no user input in content

  ### Git Command Security
  - **Risk:** Command injection in git commands
  - **Mitigation:** subprocess.run() with list argument (not shell=True) prevents shell injection; no user input in commands
  - **Status:** ✓ Secure — no shell=True; no user input in commands

  ### File Encoding Security
  - **Risk:** Unicode normalization attacks or encoding mismatches
  - **Mitigation:** Explicit UTF-8 encoding with no BOM; content uses ASCII-compatible characters (standard prose)
  - **Status:** ✓ Secure — UTF-8 is reliable; content is ASCII

  ### Overall Security Posture
  This is a low-security-risk feature. All inputs (file name, content, git commands) are hard-coded constants with
  no user input or external data sources. No external dependencies are introduced. The implementation is deterministic
  and auditable.

  ## Performance Implications

  ### File I/O Performance
  - **Complexity:** O(1) — single small file write (~500 bytes)
  - **Duration:** < 10ms on any modern system
  - **Optimization:** No optimization needed; file size (400-600 bytes) is negligible

  ### Git Operations Performance
  - **Complexity:** O(n) where n = number of objects to push
  - **Duration:** Typically 100-500ms for small change push
  - **Optimization:** No optimization needed; git operations are standard and efficient for small changes

  ### Overall Performance
  Total execution time for feature is 1-2 seconds (file creation < 10ms, git operations < 1s, including network
  latency). No performance concerns. No caching, indexing, or optimization needed.

