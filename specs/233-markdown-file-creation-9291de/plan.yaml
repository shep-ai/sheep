content: |
  ## Architecture Overview

  ### Fit with Existing Patterns

  This implementation follows the well-established pattern from 200+ existing test markdown
  files and 60+ preceding feature implementations (061-232). The architecture is straightforward:

  1. **Single Implementation Script**: `create_markdown_file_233.py` orchestrates the entire workflow
  2. **No Source Code Changes**: Feature creates a test file only; does not modify `src/sheep/` or any production code
  3. **Standalone Execution**: Script can be run directly via Python; integrates with Sheep platform orchestration layer
  4. **Incremental Pattern**: Identical to features 231, 232, 230, etc.; demonstrates consistent, repeatable automation

  ### Key Components

  **Implementation Script Structure:**
  ```
  create_markdown_file_233.py
  ├── Imports (pathlib, subprocess, sys)
  ├── Constants (FILENAME, TITLE, PROSE, COMMIT_MESSAGE)
  ├── Helper Functions
  │   ├── create_file(file_path, content)
  │   ├── validate_file(file_path)
  │   ├── git_add(filename)
  │   ├── git_commit(commit_message)
  │   └── git_push()
  └── main()
      └── Orchestrate: create → validate → git add → git commit → git push
  ```

  **Output File Structure:**
  ```
  test-p7nwe9.md
  ├── Line 1: # The Magic of Natural Curiosity (H1 heading, example)
  ├── Line 2: (blank line)
  ├── Lines 3-5: 2-3 sentences of prose content
  └── Final line: newline (LF, no trailing text)
  ```

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path.write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:**
  - Modern Python standard (3.4+, stable in 3.11+)
  - Cross-platform consistency (single API for Windows/Linux/macOS)
  - Explicit encoding and line ending control (required for spec compliance)
  - No external dependencies (standard library only)
  - Proven in features 154-232 implementations

  **Alternative Considered:** `open()` with manual encoding
  - Requires more boilerplate code
  - Harder to control cross-platform line endings
  - Less readable for explicit newline control

  ### 2. Git Integration: subprocess.run()

  **Decision:** Use `subprocess.run(["git", ...], check=True, capture_output=True, text=True)`

  **Rationale:**
  - Python standard for external commands (3.5+, recommended over os.system)
  - Error handling via check=True (raises CalledProcessError on failure)
  - Output capture prevents credential/sensitive data leakage to terminal
  - No external dependencies (GitPython adds 30+ KB for simple operations)
  - Git is universally available in this environment

  **Alternative Considered:** GitPython library
  - Unnecessary external dependency when git is available as system command
  - Subprocess simpler and more transparent for this use case

  ### 3. Text Encoding and Line Endings

  **Decision:** UTF-8 without BOM, explicit `newline="\n"` to enforce LF line endings

  **Rationale:**
  - Spec explicitly requires UTF-8 without BOM and LF line endings
  - Cross-platform consistency: Windows would default to CRLF, breaking git diffs
  - Python's `write_text(encoding="utf-8")` automatically omits BOM
  - `newline="\n"` forces Unix-style line endings on all platforms
  - Matches all 200+ existing test files in repository

  **Implementation:**
  ```python
  file_path.write_text(content, encoding="utf-8", newline="\n")
  ```

  ### 4. Error Handling: Fail-Fast with Defensive Checks

  **Decision:** Pre-check file existence, use `check=True` for subprocess, explicit exception handling

  **Rationale:**
  - Spec requires that no existing files are modified (FR-10)
  - Fail-fast ensures clear feedback and prevents silent failures
  - Defensive checks enforce data integrity and prevent corruption
  - Matches error handling pattern from feature 232 implementation

  **Implementation Pattern:**
  ```python
  # Pre-check: prevent accidental overwrites
  if file_path.exists():
      raise FileExistsError(f"File {file_path} already exists")

  # Git operations: check=True raises CalledProcessError on failure
  subprocess.run(["git", "add", filename], check=True, ...)
  ```

  ### 5. Content Composition: Static String Constants

  **Decision:** Use module-level TITLE and PROSE constants; compose with f-string

  **Rationale:**
  - Simplest and most maintainable approach
  - Matches all 200+ precedent test files (coherent, grammar-correct prose)
  - Spec allows arbitrary topic but emphasizes prose shall be "grammatically correct and coherent"
  - Content is directly reviewable in implementation script
  - No external dependencies (templates, LLM generation, random content)

  **Implementation Pattern:**
  ```python
  FILENAME = "test-p7nwe9.md"
  TITLE = "The Magic of Natural Curiosity"
  PROSE = "Sentence one about curiosity and learning. Sentence two about discovery. Sentence three about growth."
  content = f"# {TITLE}\n\n{PROSE}\n"
  ```

  ### 6. File Size Validation

  **Decision:** Validate that created file falls within 300-600 byte range after successful write

  **Rationale:**
  - Spec explicitly requires 300-600 byte range (NFR-1)
  - Minimal cost: 3 lines of code (Path.stat().st_size)
  - Catches truncation errors, encoding issues, malformed output
  - Ensures output conforms to spec and matches precedent files

  **Implementation Pattern:**
  ```python
  file_size = file_path.stat().st_size
  if not (300 <= file_size <= 600):
      raise ValueError(f"File size {file_size} outside spec range 300-600")
  ```

  ## Implementation Strategy

  ### Phase 1: Script Development (Single Phase)

  This feature is small and self-contained, requiring only one development phase:

  1. **Script Structure Setup** (Task 1)
     - Create script boilerplate with imports and module-level constants
     - Define FILENAME, TITLE, PROSE, COMMIT_MESSAGE constants
     - Follows pattern from create_markdown_file_232.py

  2. **File I/O Implementation** (Task 2)
     - Implement file creation with proper encoding and line ending control
     - Compose content: H1 heading + blank line + prose + final newline
     - Test that file is created with correct structure

  3. **Validation Implementation** (Task 3)
     - Implement file existence checks (pre-write and post-write)
     - Implement size validation (300-600 byte range)
     - Test that malformed output is detected

  4. **Git Operations Implementation** (Task 4)
     - Implement git add, commit, push as separate functions
     - Use subprocess.run() with check=True for error handling
     - Test each operation independently

  5. **Main Orchestration & Error Handling** (Task 5)
     - Implement main() function that orchestrates the full workflow
     - Add try/except blocks with clear error messages
     - sys.exit(1) on any failure for proper CI/CD integration

  6. **End-to-End Testing** (Task 6)
     - Run complete script and verify file was created correctly
     - Verify git log shows correct commit message
     - Verify file size and encoding are correct

  ### Rationale for Phase Ordering

  Single phase is appropriate because:
  - Feature is small (S-sized, ~10-15 minutes)
  - All decisions are predetermined (no architectural exploration needed)
  - Dependencies are minimal (only python stdlib + git)
  - No complex integration points (pure file creation)
  - Pattern is proven and stable (200+ precedents)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists (accidental overwrite) | Low | High | Pre-check with `if file_path.exists()` before write; raise FileExistsError |
  | Git not configured (missing user.name/email) | Low | High | Subprocess.run() will fail with clear error; caught by try/except in main() |
  | Wrong encoding or line endings | Low | Medium | Test file encoding with Path.read_bytes() to verify UTF-8 bytes; validate file size |
  | Git push fails (network, credentials, branch) | Low | Medium | Subprocess.run() with check=True catches git errors; clear error message to stderr |
  | File size out of range | Medium | Medium | Validate after write: `if not (300 <= size <= 600): raise ValueError(...)` |
  | Content formatting mistakes (missing blank line, extra newlines) | Low | Medium | Test content string in isolation; verify final output matches spec structure |

