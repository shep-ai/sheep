# Structured technology decisions
decisions:
  - title: "File I/O Method for Markdown Creation"
    chosen: "pathlib.Path.write_text() with explicit UTF-8 and LF parameters"
    rejected:
      - "open() with manual encoding handling — requires more boilerplate and is more error-prone for cross-platform line ending control"
      - "file.write() with bytes encoding — adds unnecessary complexity for text file operations"
      - "Third-party libraries (pathvalidate, etc.) — introduces external dependencies for a simple operation"
    rationale: >
      pathlib.Path.write_text() is the modern Python standard (available since 3.4, stable in 3.11).
      It provides:
      1. **Cross-platform consistency**: Single API for Windows/Linux/macOS file operations
      2. **Explicit encoding control**: encoding="utf-8" explicitly specifies UTF-8 without BOM
      3. **Line ending control**: newline="\n" forces Unix LF endings on all platforms (critical for git consistency)
      4. **No external dependencies**: Standard library only (Python 3.11+ guarantees availability)
      5. **Proven precedent**: Feature 232 implementation uses identical approach with full success

      This approach is verified in the codebase by create_markdown_file_232.py and similar implementations across features 154-232.

  - title: "Git Integration Method"
    chosen: "subprocess.run() with check=True and capture_output=True"
    rejected:
      - "GitPython library — adds external dependency when git is already available as system command; subprocess is simpler and has zero dependencies"
      - "os.system() — lacks error checking capability and doesn't support proper subprocess isolation"
      - "Shell script wrapper — increases complexity and reduces portability (Windows shell differences)"
    rationale: >
      subprocess.run() is the Python standard for executing external commands (recommended over os.system since Python 3.5+).
      Benefits for git integration:
      1. **Error handling**: check=True raises CalledProcessError if git command fails, enabling proper exception handling
      2. **Output capture**: capture_output=True collects stderr/stdout for debugging without polluting terminal
      3. **Clean semantics**: text=True automatically handles string encoding instead of bytes
      4. **No external dependencies**: Standard library; avoids adding GitPython as a dependency
      5. **Proven precedent**: Used identically in features 154-232 implementations with consistent success

      Git is universally available in this CI/repository environment, making direct command execution simpler than library wrapping.

  - title: "Text Encoding and Line Ending Specification"
    chosen: "UTF-8 encoding without BOM, with explicit newline=\"\\n\" parameter to enforce LF line endings"
    rejected:
      - "UTF-16 or other encodings — UTF-8 is the repository standard and file encoding standard; unnecessarily complex"
      - "Relying on system default line endings — Windows would produce CRLF, breaking git diffs and repository consistency across platforms"
      - "BOM (Byte Order Mark) — unnecessarily adds 3 bytes; CommonMark parsers prefer files without BOM"
    rationale: >
      Specification requirements mandate: UTF-8 without BOM, LF line endings throughout.
      Implementation details:
      1. **UTF-8 encoding**: encoding="utf-8" in write_text() ensures UTF-8 without BOM (Python default; confirmed in 3.11 docs)
      2. **LF line endings**: newline="\\n" forces Unix-style LF (\\n) instead of platform-default (CRLF on Windows)
      3. **Cross-platform consistency**: Critical for git — prevents diff noise from line ending changes when files are viewed on different OSes
      4. **Spec compliance**: Both encoding and line endings are explicitly required; this is not optional
      5. **Proven precedent**: Feature 232 implementation uses identical specification with successful file validation

      Existing test files (test-08hm34.md, test-xekj8s.md, etc.) all follow this standard, confirmed by repository consistency.

  - title: "Error Handling Strategy"
    chosen: "Fail-fast with defensive checks: pre-check file existence, use check=True for subprocess, explicit exception handling"
    rejected:
      - "Silent fallbacks (overwrite if exists, continue on git failure) — masks problems and violates spec requirement that no modifications occur to existing files"
      - "Retry loops with exponential backoff — unnecessary complexity for single-shot file creation; inappropriate for user-initiated workflow"
      - "Ignore errors and log warnings only — compromises spec compliance; user needs to know if operation failed"
    rationale: >
      Fail-fast semantics ensure clear, immediate feedback and prevent silent data corruption.
      Implementation approach (verified in create_markdown_file_232.py):
      1. **Pre-check**: if file_path.exists() raises FileExistsError before attempting write — defensive against accidental overwrites
      2. **Explicit exceptions**: catch PermissionError and OSError separately with clear error messages to stderr
      3. **Git command validation**: check=True in subprocess.run() raises CalledProcessError if any git command fails
      4. **Exit on failure**: sys.exit(1) in main() catches all exceptions and reports them, signaling failure to CI/orchestration layer
      5. **Spec compliance**: Requirement FR-10 prohibits modifications to existing files; defensive checks enforce this

      This approach matches feature 232 implementation and all precedent implementations (061-232).

  - title: "Content Composition Method"
    chosen: "Static string composition: f-string with predefined TITLE and PROSE constants"
    rejected:
      - "Random/generated content — spec allows arbitrary prose but precedents use specific, coherent content; static strings are simpler and more maintainable"
      - "Reading from external template files — adds file dependency and I/O complexity for content that fits in memory"
      - "LLM-generated content — introduces unnecessary external dependency and latency; spec allows free-form content without generation requirement"
    rationale: >
      Static string composition is simplest and most maintainable for a single-file feature.
      Structure (from spec and precedents):
      - TITLE constant: H1 heading text (example: \"The Magic of Natural Curiosity\")
      - PROSE constant: 2-3 sentences of coherent prose (example from feature 232: 3 sentences, ~250 words)
      - Content formatted as: f\"# {TITLE}\\n\\n{PROSE}\\n\"
      - Result: heading, blank line, prose, final newline (262-550 bytes typical)

      Advantages:
      1. **Simplicity**: No external dependencies, no I/O, no generation logic
      2. **Consistency**: Matches all 200+ precedent files which use static, predefined prose
      3. **Spec flexibility**: Spec allows \"arbitrary\" topic; all implementations choose coherent prose topics (not gibberish)
      4. **Maintainability**: Content is visible and reviewable in implementation script
      5. **Repeatability**: Deterministic output; no randomness or external service calls needed

  - title: "File Size Target Range"
    chosen: "Target 300-600 bytes range (consistent with 200+ precedent test files)"
    rejected:
      - "Minimize file size (< 300 bytes) — insufficient prose; spec requires 2-3 sentences which typically need 180-400 bytes plus heading"
      - "No size constraint — spec explicitly requires 300-600 byte range; uncontrolled growth could indicate malformed output"
      - "Very large files (> 600 bytes) — indicates excessive prose; spec limits to 2-3 sentences, which fit comfortably in 300-600 range"
    rationale: >
      File size validation ensures output conforms to spec and matches precedent files.
      Analysis from existing test files:
      - Minimum: ~260 bytes (short heading, 2 sentences)
      - Typical: ~350 bytes (medium heading, 3 sentences)
      - Maximum: ~550 bytes (long heading, 3 verbose sentences)
      - Spec target: 300-600 bytes

      Size verification provides sanity check:
      1. File is not empty or truncated (> 300 bytes)
      2. File is not corrupted or excessively long (< 600 bytes)
      3. Prose content is appropriate length (2-3 sentences = typically 150-400 bytes)
      4. Encoding is correct (UTF-8 bytes count correctly)

      Implementation: Python pathlib provides Path.stat().st_size for validation. Feature 232 validates file creation succeeded; this extends to size validation.

