# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-q7dj89.md`)
  at the repository root with a title and prose content. The feature is part of a series of identical
  markdown-file-creation tasks (features 1-269) that serve as minimal, testable units of work for
  validating the automated implementation system.

  Over 200 similar test files (test-*.md) already exist in the repository root, demonstrating a
  consistent pattern: H1 markdown heading, blank line, and 2-3 sentences of prose content. This
  feature continues that established pattern with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 200+ test markdown files (test-*.md) following a consistent format
  - **src/sheep/**: Application source code including agents, config, flows, tools, and observability modules
  - **specs/**: Feature specification directory with numbered subdirectories for each feature
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (Python 3.11+, CrewAI dependencies)
  - **.github/**: GitHub workflows and CI/CD configuration
  - **Dockerfile**: Container configuration for the Sheep platform

  The test markdown files at the repository root are validation artifacts for the automated
  implementation system and do not form part of the application source code.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (200+ precedents):
  - Simple file creation using Python pathlib.Path for I/O operations
  - Consistent structure: `# Title\n\n<2-3 sentences of prose>\n`
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix-style LF line endings (`\n`), not Windows CRLF
  - File size typically 300-600 bytes as natural outcome of content structure
  - Straightforward imperative implementation (construct content, write file)
  - No dependencies on application source code in /src/sheep/
  - Free-form topic selection with diverse subject areas represented

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/270-markdown-file-creation-f9be0f`
  - Create/modify files in working directory
  - Stage with `git add test-q7dj89.md`
  - Commit with conventional format: `feat(270): create markdown file test-q7dj89.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration
  - Branch naming: `feat/<number>-<feature-name>-<suffix>`

  ### Relevant Technologies

  - **Python 3.11+**: Project minimum version requirement (from pyproject.toml)
  - **pathlib (Python standard library)**: Cross-platform file I/O using Path.write_text()
  - **Git**: Version control for staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading and prose per CommonMark specification
  - **CrewAI**: Agent framework used by Sheep platform (not directly relevant to file creation)

  ## Success Criteria

  - [ ] File test-q7dj89.md is created in the repository root
  - [ ] File contains a valid H1 markdown heading (e.g., `# Title Here`)
  - [ ] File contains exactly 2-3 sentences of prose content below the heading
  - [ ] File is properly formatted: H1 heading, blank line, then prose
  - [ ] File encoding is UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (not Windows CRLF)
  - [ ] File size is between 300-600 bytes (natural outcome of content structure)
  - [ ] Markdown syntax validates against CommonMark specification
  - [ ] File is staged with `git add test-q7dj89.md`
  - [ ] Git commit exists with conventional format: `feat(270): create markdown file test-q7dj89.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/270-markdown-file-creation-f9be0f`
  - [ ] No other files are modified or created during this feature

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-q7dj89.md` in the repository root directory
  - **FR-2**: File must contain a single H1 markdown heading (# Title) as the title
  - **FR-3**: File must contain 2-3 sentences of prose content following the heading and a blank line
  - **FR-4**: Prose content must be meaningful and coherent (any topic is acceptable based on established precedent)
  - **FR-5**: Stage the created file using `git add test-q7dj89.md`
  - **FR-6**: Create a git commit with the conventional commit message: `feat(270): create markdown file test-q7dj89.md with prose content`
  - **FR-7**: Push the commit to the feature branch `feat/270-markdown-file-creation-f9be0f` on the remote repository

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark) to maintain consistency with existing test files
  - **NFR-2**: Line endings must be Unix-style LF (`\n`), not Windows CRLF, following project conventions
  - **NFR-3**: File size should naturally fall within 300-600 bytes as a result of the content structure (not forced)
  - **NFR-4**: Markdown syntax must comply with CommonMark specification for H1 headings and paragraph text
  - **NFR-5**: Implementation must use Python standard library pathlib.Path for cross-platform file I/O
  - **NFR-6**: Implementation must follow the established pattern from 200+ existing test files (test-*.md)
  - **NFR-7**: No external dependencies should be introduced; only Python standard library and git
  - **NFR-8**: No modifications to application source code (src/sheep/), configuration files, or existing tests

  ## Product Questions & AI Recommendations

  No ambiguous product decisions identified. This feature:
  - Has a clearly specified filename (test-q7dj89.md)
  - Follows an established pattern with 200+ precedents
  - Has well-defined file structure and formatting rules
  - Uses proven git workflow with conventional commits
  - Allows free-form topic selection (any topic acceptable per existing precedent)

  The analysis phase resolved all requirements through codebase pattern matching. The implementation approach is mechanical and follows exact precedent from features 1-269.

