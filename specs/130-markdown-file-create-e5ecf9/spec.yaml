content: |
  ## Problem Statement

  Create a single markdown file named test-laceiq.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (130) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository is organized as follows:

  - **src/sheep/** - Main application code
    - **agents/** - Agent definitions (code researchers, implementers, reviewers)
    - **config/** - Configuration and LLM settings
    - **flows/** - Orchestration flows (code implementation flow is the main entry point)
    - **tools/** - Git and file operation tools
    - **observability/** - Logging and tracing integration (Langfuse)
    - **cli.py** - Command-line interface
  - **tests/** - Test suite
  - **specs/** - Feature specifications (160+ specs for various features including 100+ identical markdown file creation tests)
  - **Root directory** - Contains test markdown files and documentation files

  The repository contains 160+ feature specifications in the specs/ directory, with numbers 125-129 all being identical markdown file creation features (test-zihquv.md, test-xkd1zo.md, test-zlzcz0.md, test-3pz04c.md). This feature (130) continues that established pattern.

  ### Architecture Patterns

  1. **Flow-Based Execution**
     - CodeImplementationFlow orchestrates the entire feature lifecycle: research → implementation → review → commit → push
     - Flow state is managed through the CodeImplementationState Pydantic model
     - Flows use CrewAI's @start() and @listen() decorators for orchestration

  2. **Agent-Based Implementation**
     - Specialized agents handle distinct roles: CodeResearcherAgent, CodeImplementerAgent, CodeReviewerAgent
     - Each agent has specific tools and backstory
     - Agents are configured with language models (supports OpenAI, Anthropic Claude, Google Gemini)

  3. **Tool-Based Operations**
     - Git operations abstracted into tools: GitCreateBranchTool, GitCommitTool, GitPushTool, GitWorktreeTool
     - File operations managed through file system access tools
     - Tools integrate with both local execution and observable tracing (Langfuse)

  4. **Observability-First Design**
     - Full tracing via Langfuse for execution monitoring
     - Structured logging throughout the flow
     - Metrics tracking for token usage and execution latency

  ### Relevant Technologies

  - **CrewAI** - Multi-agent orchestration framework
  - **Python** - Primary language (Pydantic for data validation)
  - **Git** - Version control (command-line integration)
  - **Markdown** - File format for specifications and generated content
  - **Langfuse** - Observability and tracing platform

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-laceiq.md) will be created in the repository root, following the pattern of 100+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | CodeImplementationFlow | Low | The existing flow requires no modifications; it already handles arbitrary file creation tasks |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing GitCommitTool, GitPushTool, and GitCreateBranchTool from sheep.tools
  4. **Content Generation** - Can use simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-129, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 5+ times in preceding features (125-129)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing Sheep infrastructure (file I/O, git tools, flow) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
