content: |
  ## Problem Statement

  Create a single markdown file named test-laceiq.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (130) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Success Criteria

  - [ ] File test-laceiq.md is created in the repository root directory
  - [ ] File contains valid markdown format with no syntax errors
  - [ ] File includes an H1 heading (# Title) as the first element
  - [ ] File contains exactly 2-3 sentences of prose content below the heading
  - [ ] Prose content is coherent and complete sentences (not placeholder or malformed text)
  - [ ] File is committed to git with a conventional commit message (feat(130): ...)
  - [ ] Changes are pushed to the feature branch (feat/130-markdown-file-create-e5ecf9)
  - [ ] No errors or warnings during file creation or git operations
  - [ ] File follows the established pattern of features 125-129 (consistent structure and formatting)

  ## Functional Requirements

  - **FR-1**: System must create a new file named exactly "test-laceiq.md" in the repository root
  - **FR-2**: File must contain an H1 markdown heading (prefixed with `# `) as the title/first line
  - **FR-3**: File must contain 2-3 complete sentences of prose content following the H1 heading
  - **FR-4**: All content must use valid markdown syntax (proper spacing, no broken formatting)
  - **FR-5**: System must stage the new file to git (equivalent to `git add test-laceiq.md`)
  - **FR-6**: System must create a git commit with message following conventional commit format: "feat(130): Create markdown file test-laceiq.md"
  - **FR-7**: System must push the commit to the remote feature branch (feat/130-markdown-file-create-e5ecf9)

  ## Non-Functional Requirements

  - **NFR-1**: File creation and git operations must complete without errors or exceptions
  - **NFR-2**: File must be immediately readable as valid UTF-8 encoded markdown
  - **NFR-3**: Markdown formatting must be consistent with existing test-*.md files in the repository (established pattern from features 125-129)
  - **NFR-4**: Prose content must be semantically coherent and avoid placeholder/Lorem Ipsum style text
  - **NFR-5**: Git operations must follow conventional commit standards and repository policies
  - **NFR-6**: Implementation must use existing Sheep platform capabilities (no new dependencies or utilities required)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the prose content cover? | Any topic | User explicitly stated "about anything", maximizing flexibility. Aligns with established pattern from features 125-129 which use varied content. |
  | 2 | Should commit message include descriptive context beyond filename? | Simple format (feat(130): Create markdown file test-laceiq.md) | Aligns with most recent related features (127-128), maintains consistency, keeps messages concise while remaining descriptive. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-laceiq.md) will be created in the repository root, following the pattern of 100+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | CodeImplementationFlow | Low | The existing flow requires no modifications; it already handles arbitrary file creation tasks |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing GitCommitTool, GitPushTool, and GitCreateBranchTool from sheep.tools
  4. **Content Generation** - Can use simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-129, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 5+ times in preceding features (125-129)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing Sheep infrastructure (file I/O, git tools, flow) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
