decisions:
  - title: "File I/O Library Selection"
    chosen: "Python pathlib.Path"
    rejected:
      - "os.open() / os.write() — Low-level, verbose API; less Pythonic and error-prone for text file operations. pathlib provides cleaner OOP interface."
      - "Built-in open() with manual path strings — Works but lacks structured path handling; more prone to cross-platform issues."
    rationale: >
      pathlib.Path is mandated by NFR-5 and is the modern Python standard for file operations.
      It provides an object-oriented, cross-platform API that integrates well with text encoding
      specifications. pathlib.Path.write_text() simplifies UTF-8 encoding and newline handling
      in a single method call.

  - title: "Line Ending Handling on Windows"
    chosen: "Use Path.write_text() with explicit newline='\\n' parameter to enforce LF line endings"
    rejected:
      - "Use os.linesep for platform-specific line endings — Violates NFR-2; would generate CRLF on Windows instead of required LF."
      - "Write binary mode with manual byte encoding — More complex; requires manual UTF-8 encoding and increases error risk."
    rationale: >
      The spec explicitly requires Unix-style LF line endings (NFR-2) even though the environment
      is Windows. Analysis of existing test files shows they currently use CRLF, but the feature
      spec clearly mandates LF. Python's text mode with newline='\n' parameter (per PEP 3116)
      ensures platform-independent LF output: it suppresses Python's default newline translation
      and writes '\n' literally, resulting in LF-only line endings on all platforms.

  - title: "UTF-8 Encoding Without BOM"
    chosen: "Use Path.write_text() with encoding='utf-8' (default)"
    rejected:
      - "Use encoding='utf-8-sig' — Would add UTF-8 BOM (Byte Order Mark), violating NFR-1."
      - "Manual byte writing with bytearray — Unnecessary complexity; requires explicit byte-level UTF-8 encoding."
    rationale: >
      Python's default UTF-8 codec (utf-8) does not add a BOM, unlike utf-8-sig. This meets
      NFR-1 requirement for UTF-8 without BOM. pathlib.Path.write_text() defaults to UTF-8
      on most systems, but explicitly specifying encoding='utf-8' ensures consistency and
      clarity across all platforms.

  - title: "Git Integration Approach"
    chosen: "Use subprocess.run() to execute git commands (add, commit, push)"
    rejected:
      - "GitPython library — External dependency; violates NFR-9 (no new dependencies allowed)."
      - "Direct filesystem manipulation of .git directory — Fragile, non-portable, not recommended."
    rationale: >
      subprocess.run() is part of Python's standard library and allows robust execution of git
      commands without external dependencies. Git is available as a system command in standard
      development environments, making this the only viable approach given NFR-9 constraint.
      subprocess provides reliable error handling via return codes and stderr capture.

  - title: "Content Generation Approach"
    chosen: "Simple string concatenation/f-string with implementer-chosen prose topic"
    rejected:
      - "Template engines (Jinja2, etc.) — Unnecessary complexity for simple markdown format; violates NFR-9."
      - "Random content generation — Spec permits free-form topic selection by implementer; doesn't require automation."
    rationale: >
      The feature allows free-form prose topic selection (per product question #2 and FR-5).
      The markdown structure is minimal and fixed: '# Heading\n\n<sentences>'. Simple string
      concatenation is sufficient and requires no additional libraries. This aligns with the
      established pattern across 65+ existing test files.

  - title: "File Validation Approach"
    chosen: "Validate structure correctness; accept natural file size outcome per product question #1"
    rejected:
      - "Strict byte-count enforcement (400-600 bytes) — Inflexible; existing files vary in size. Spec resolves this via product question #1: validate structure, not byte count."
      - "Automated readability scoring tools — Unnecessary; product question #3 resolves this: use manual implementer review."
    rationale: >
      Product questions resolve these decisions: file size is a natural outcome of proper
      structure (not an independent constraint), and prose readability is manually validated
      by the implementer. Validation should focus on verifiable structural requirements: H1
      heading presence, 2-3 sentence count, UTF-8 encoding, LF line endings, and CommonMark
      validity.

