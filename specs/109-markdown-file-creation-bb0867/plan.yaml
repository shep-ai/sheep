content: |
  ## Architecture Overview

  This is a minimal, isolated implementation following the established pattern from 65+ existing
  test markdown files in the repository root (features 063-108). The feature creates a single
  artifact at the repository root with no dependencies on application source code (/src/sheep/).

  **Implementation approach:**
  - Use pathlib.Path for file I/O (mandated by NFR-5)
  - Simple string concatenation to build markdown content: `# <title>\n\n<2-3 sentences>`
  - Explicit encoding and newline parameters for cross-platform consistency
  - subprocess.run() for git integration (standard library, no external dependencies)
  - Structure-based validation (verify heading, sentence count, encoding, line endings)

  **Pattern consistency:**
  The implementation follows the proven pattern from related features 108, 107, and 106:
  - Single markdown file with H1 heading + 2-3 sentences of prose
  - Free-form topic selection by implementer
  - UTF-8 encoding without BOM, Unix-style LF line endings
  - Git workflow: add → commit with conventional message → push
  - No modifications to source code, tests, or configuration

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path (Mandated by NFR-5)

  **Decision:** Use `pathlib.Path.write_text()` with explicit encoding and newline parameters.

  **Alternatives considered:**
  - os.open() / os.write() — Low-level API; less Pythonic and more verbose
  - Built-in open() with manual path strings — Works but lacks structured path handling

  **Rationale:** pathlib.Path is mandated by NFR-5 and is the modern Python standard for file
  operations. The write_text() method provides clean, single-call API for encoding and newline
  handling on all platforms.

  ### 2. Line Ending Handling: Explicit LF on Windows (NFR-2)

  **Decision:** Use `Path.write_text(..., newline='\n')` to enforce Unix-style LF line endings
  despite Windows environment.

  **Alternatives considered:**
  - Use os.linesep — Would generate platform-specific line endings (CRLF on Windows), violating NFR-2
  - Binary mode with manual byte encoding — More complex; higher error risk

  **Rationale:** NFR-2 explicitly requires Unix-style LF line endings regardless of platform.
  Python's text mode with `newline='\n'` parameter (per PEP 3116) suppresses platform-specific
  newline translation and writes literal `\n` characters, resulting in LF-only line endings
  on all platforms including Windows. This is the standard approach for cross-platform text
  file creation with specific line ending requirements.

  ### 3. UTF-8 Encoding Without BOM (NFR-1)

  **Decision:** Use `Path.write_text(..., encoding='utf-8')` (default UTF-8 without BOM).

  **Alternatives considered:**
  - encoding='utf-8-sig' — Would add UTF-8 BOM, violating NFR-1
  - Manual byte encoding — Unnecessary complexity; requires explicit UTF-8 encoding

  **Rationale:** Python's utf-8 codec (not utf-8-sig) does not add a Byte Order Mark. Explicitly
  specifying `encoding='utf-8'` ensures consistency across all platforms and prevents accidental
  BOM injection.

  ### 4. Git Integration: subprocess.run() (Standard Library, NFR-9)

  **Decision:** Use `subprocess.run()` to execute git add, commit, and push commands.

  **Alternatives considered:**
  - GitPython library — External dependency; violates NFR-9 constraint
  - Direct .git directory manipulation — Fragile, non-portable, not recommended

  **Rationale:** subprocess.run() is part of Python's standard library and provides robust
  execution of git commands without external dependencies. Git is available as a system
  command in standard development environments. Using `check=True` ensures CalledProcessError
  is raised on git failures, providing reliable error handling.

  ### 5. Content Generation: Simple String Concatenation

  **Decision:** Use f-string or simple string concatenation to build markdown content.

  **Alternatives considered:**
  - Template engines (Jinja2, etc.) — Unnecessary complexity; violates NFR-9
  - Random/automated content generation — Spec permits free-form topic by implementer

  **Rationale:** The markdown structure is simple and fixed: `# <title>\n\n<prose>`. Simple
  string concatenation is sufficient and requires no additional libraries. Product question #2
  permits free-form topic selection, so automation is not required.

  ### 6. Validation Strategy: Structure-Based (Product Question #1)

  **Decision:** Validate markdown structure correctness; accept natural file size outcome.

  **Alternatives considered:**
  - Strict byte-count enforcement (400-600 bytes) — Inflexible; violates product question #1 resolution
  - Automated readability scoring tools — Unnecessary; violates product question #3 resolution

  **Rationale:** Product question #1 resolves that file size is a natural outcome of proper
  structure, not an independent constraint. Product question #3 resolves that prose readability
  is manually validated by the implementer during creation. Validation focuses on verifiable
  structural requirements: H1 heading presence, 2-3 sentence count, UTF-8 encoding, LF line
  endings, and CommonMark validity.

  ## Implementation Strategy

  **Single phase approach:** File Creation & Git Integration

  The feature is simple and self-contained. All work occurs in one phase:
  1. Create markdown file with proper structure, encoding, and line endings
  2. Validate file meets structural requirements
  3. Stage file with git add
  4. Commit with conventional message
  5. Push to feature branch

  **Why this ordering:** File must be created before git operations. Validation is performed
  before git staging to ensure spec compliance. No parallelization is possible; all steps
  are inherently sequential.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | "Line ending mismatch on Windows" | "Medium" | "Use explicit `newline='\n'` parameter; verify LF in created file before git operations" |
  | "UTF-8 BOM accidentally added" | "Medium" | "Use `encoding='utf-8'` (not utf-8-sig); verify encoding with hex dump if needed" |
  | "Git push fails due to network/auth" | "Low" | "Use `subprocess.run(..., check=True)` to catch errors; provide clear error messages" |
  | "File already exists" | "Low" | "Check if file exists before creation; error with clear message if so" |
  | "Insufficient write permissions" | "Low" | "Repository root is writable in standard development environment; unlikely issue" |
  | "Markdown syntax validation failure" | "Low" | "Use simple structure validation; leverage established pattern from 65+ existing files" |

  ## File Changes Summary

  **Create:**
  - `test-0joupr.md` — Single markdown file at repository root

  **Modify:**
  - None — This feature creates only a new file; no existing files are modified

  ## Implementation Notes

  **Prose topic selection:** Implementer chooses any topic of interest. Examples from related
  features (108, 107, 106) suggest diverse topics work well. The specification emphasizes
  manual prose review for readability and grammatical correctness.

  **Conventional commit format:** The commit message must be exactly:
  `feat(109): create markdown file test-0joupr.md with prose content`

  **Branch context:** Feature branch `feat/109-markdown-file-creation-bb0867` is pre-created.
  Push should target this branch: `git push origin feat/109-markdown-file-creation-bb0867`

  **No additional changes:** This feature does not modify source code, tests, configuration,
  or other project files. It is purely a file creation artifact following the established
  pattern.
