content: |
  ## Task Breakdown Summary

  This feature is implemented across a single phase with 4 ordered tasks that follow a
  logical progression from file creation through validation to git integration and final verification.

  **Task 1: File Creation** (15 min)
  Creates the markdown file with proper encoding (UTF-8 no BOM) and line endings (LF).
  Implementer chooses any topic for the prose content and writes 2-3 sentences.
  Validates file exists with expected content.

  **Task 2: Structure Validation** (10 min)
  Verifies the created file meets structural requirements: H1 heading, blank line separator,
  2-3 sentence count, prose readability and grammatical correctness (manual review).
  Ensures compliance with all functional and non-functional requirements.

  **Task 3: Git Integration** (10 min)
  Stages file with git add, commits with the exact conventional message, and pushes to the
  feature branch. Uses subprocess.run() with check=True for robust error handling.

  **Task 4: End-to-End Verification** (5 min)
  Runs the complete workflow and verifies all success criteria from the specification are met.
  Confirms file creation, encoding, structure, git staging, commit message, branch context,
  and remote push.

  ## Dependency Chain

  Tasks are sequentially dependent: each task builds on the previous one's completion.
  - Task 1 creates the file (must complete before validation)
  - Task 2 validates the file (must complete before git operations)
  - Task 3 executes git operations (must complete before final verification)
  - Task 4 verifies the entire workflow (final validation task)

  ## TDD Cycles

  Each task includes RED-GREEN-REFACTOR cycles:
  - RED: Write assertions/tests that define expected behavior
  - GREEN: Implement minimal code to pass the tests
  - REFACTOR: Clean up, extract helpers, improve naming

  Task 1 focuses on file creation and encoding. Task 2 focuses on structure validation.
  Task 3 focuses on git command execution. Task 4 focuses on end-to-end integration.

  ## Effort Estimates

  Total estimated effort: 40 minutes
  - Task 1 (file creation): 15 min
  - Task 2 (validation): 10 min
  - Task 3 (git integration): 10 min
  - Task 4 (verification): 5 min

  Estimates align with the feature specification's size estimate (S = 10-15 min actual work).
  The slightly higher estimate (40 min total) accounts for TDD cycles and thorough validation
  but is still appropriate for a small, straightforward feature.
