content: |
  ## Summary

  This feature implementation consists of 5 focused tasks across 2 phases:

  **Phase 1 — Core File Creation & Validation (11 minutes):**
  1. Create markdown file with H1 heading and prose content (5 min)
  2. Validate file encoding and line endings — check UTF-8, no BOM, LF only (3 min)
  3. Validate markdown structure and prose quality — verify H1, blank line, 2-3 sentences (3 min)

  **Phase 2 — Git Integration & Remote Push (5 minutes):**
  4. Stage and commit file to git with conventional message (3 min)
  5. Push to remote feature branch with upstream tracking (2 min)

  All tasks follow TDD cycles: write test assertions first (RED), implement minimal code to pass (GREEN),
  then clean up and refactor (REFACTOR).

  **Execution flow:**
  - File creation happens first to generate output that can be validated
  - All validations complete before any git operations (prevents invalid commits)
  - Git workflow (stage, commit, push) happens only after all validation passes
  - Task dependencies ensure correct ordering: 1 → 2 → 3 → 4 → 5

  **Rationale for small task sizes:**
  - Each task has a single, clear purpose
  - Small tasks make progress visible and easy to track
  - Failing tests are easier to debug when tasks are focused
  - TDD cycles ensure high code quality at each step
  - Quick completion time (16 minutes total) matches S size estimate

  **Quality assurance:**
  - Binary encoding checks (BOM, CRLF) catch platform-specific issues early
  - Structure validation ensures CommonMark compliance
  - Prose quality validation ensures content meets requirements
  - Git validation ensures commits are correct before remote push
  - No invalid files reach remote repository
