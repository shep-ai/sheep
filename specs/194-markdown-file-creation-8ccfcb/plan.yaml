content: |
  ## Architecture Overview

  This feature is a self-contained, isolated file creation task that follows the established pattern
  from 193 preceding identical test-file creation features (191-193). The implementation consists of three
  independent concerns: file I/O, validation, and git integration.

  **Integration with existing codebase:**
  - Feature does not interact with src/sheep/ source code
  - Does not require database, configuration, or environment changes
  - Follows established convention from create_markdown_file.py (reference implementation)
  - Uses only Python standard library (pathlib, subprocess) and system git
  - Single output file in repository root; no directory structure changes

  **Pattern consistency:**
  - Directly follows technical approach from feature 193 (immediately preceding)
  - Aligns with conventional commit message format used throughout repository
  - Uses standard Python 3.11+ syntax consistent with pyproject.toml specifications
  - Validates against CommonMark specification (same as features 191-193)

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib with explicit encoding control

  **Chosen approach:** Use `pathlib.Path.write_text()` with explicit UTF-8 encoding and Unix LF line endings
  - Portable across Windows/macOS/Linux
  - Explicit control over encoding (UTF-8 without BOM) via `encoding=\"utf-8\"`
  - Explicit control over line endings (Unix LF) via `newline=\"\\n\"`
  - Part of Python standard library since 3.4 (no external dependencies)

  **Why this approach is best:**
  - Standard, idiomatic Python 3 approach for text file creation
  - Guarantees UTF-8 without BOM (no surprise byte order marks)
  - Enforces LF line endings required for cross-platform git consistency
  - Validated across 193+ test files in repository
  - Matches conventions in existing create_markdown_file.py

  **Alternatives considered:**
  - Open/write/close with manual newline handling: Less portable, requires explicit handling of platform newlines, no built-in encoding validation
  - External markdown libraries (markdown, commonmark): Adds unnecessary dependencies; pathlib suffices for simple text files

  ### 2. Content Structure: Fixed markdown format with deterministic validation

  **Chosen approach:** Fixed structure — H1 heading on line 1, blank line on line 2, 2-3 sentences on lines 3+
  - Deterministic output matching CommonMark specification
  - Validation by period count for sentence detection (simple, effective)
  - Manual prose composition ensures quality without external dependencies

  **Why this approach is best:**
  - Ensures reproducible, testable output (critical for automated feature platform)
  - Direct mapping to functional requirements (FR-2, FR-3, FR-4)
  - CommonMark specification compliance is trivial for this simple structure
  - Period-based sentence counting is simple and effective for prose quality checks
  - Validated across 300+ test files in repository

  **Alternatives considered:**
  - Dynamic AI/LLM-generated content: Introduces external API dependency, breaks determinism, undermines test reliability
  - Flexible prose format: Makes validation ambiguous, complicates acceptance criteria, harder to test

  ### 3. File Encoding & Line Endings: UTF-8 without BOM + Unix LF

  **Chosen approach:** UTF-8 encoding without BOM, Unix LF line endings (enforced via pathlib parameters and validation)
  - Pathlib parameter: `encoding=\"utf-8\"` (standard UTF-8)
  - Pathlib parameter: `newline=\"\\n\"` (Unix line endings)
  - Validation confirms no UTF-8 BOM (bytes EF BB BF) and no CRLF present

  **Why this approach is best:**
  - UTF-8 is standard for modern markdown and Python 3 workflows
  - No BOM required for UTF-8; BOM adds 3 bytes and complicates tool parsing
  - LF (not CRLF) is required for consistent git history across Windows/macOS/Linux
  - Matches production environment conventions (Unix-like systems)
  - Explicitly required by spec (NFR-4)
  - Validation checks catch platform-specific issues early

  **Alternatives considered:**
  - Platform default encoding: Creates cross-platform inconsistency, breaks git history integrity, fails on some systems
  - CRLF line endings: Breaks cross-platform git workflows, incompatible with Unix production environments
  - UTF-8 with BOM: Adds 3 unnecessary bytes, complicates parsing in tools, not required for UTF-8

  ### 4. Validation Strategy: Comprehensive checks across encoding, structure, and prose

  **Chosen approach:** Post-creation validation covering six independent concerns:
  - Encoding: Binary check for UTF-8 BOM (should be absent) — read file in binary mode
  - Line endings: Binary check for CRLF (should be absent) — read file in binary mode
  - UTF-8 validity: Decode file with UTF-8 to ensure no invalid byte sequences
  - Structure: Line-by-line parsing — verify H1 on line 1, blank on line 2, prose on lines 3+
  - Prose quality: Sentence count by period detection — verify exactly 2 or 3 sentences
  - File size: Range check 300-600 bytes (sanity check for content presence)

  **Why this approach is best:**
  - Ensures CommonMark specification compliance (NFR-1, FR-4)
  - Binary checks (BOM, CRLF) detect encoding issues that text parsing might miss
  - Separate validation layers catch issues at the right level (binary encoding, text structure, semantic prose)
  - Proven approach across 193+ features and reference create_markdown_file.py
  - Early detection prevents invalid files from reaching git integration

  **Alternatives considered:**
  - No validation: Risks accepting malformed files, creates technical debt, violates spec requirements
  - Minimal validation (file exists only): Masks encoding and structure problems, reduces confidence
  - Regex-only validation: Cannot detect binary encoding issues (BOM, CRLF), fragile for structure parsing

  ### 5. Git Workflow: Python subprocess with explicit porcelain commands

  **Chosen approach:** Use Python `subprocess` module to execute explicit git porcelain commands:
  - `git add test-9zebfj.md`
  - `git commit -m \"feat(194): create markdown file test-9zebfj.md\"`
  - `git push -u origin HEAD`

  **Why this approach is best:**
  - subprocess is Python standard library (no external dependencies)
  - Explicit, transparent view into git operations (easy to debug and log)
  - Clear error handling via CalledProcessError
  - -u flag ensures upstream tracking for feature branch
  - Validated across 193 preceding features
  - Shell-safe (subprocess called with list of args, not shell=True)

  **Alternatives considered:**
  - GitPython library: Adds external dependency, unnecessary abstraction layer over porcelain commands
  - Git plumbing commands (git hash-object, git mktree): Unnecessarily low-level; porcelain is appropriate
  - Shell script wrapper (bash/sh): Less portable across platforms, harder to debug and test

  ## Implementation Strategy

  **Phase 1: Core File Creation & Validation**
  - Task 1: Create markdown file with proper H1 heading and 2-3 sentences of prose
    - Use pathlib.Path.write_text() with explicit UTF-8 and LF line endings
    - Compose professional prose content that demonstrates quality (3-4 sentences within 2-3 sentence requirement)
  - Task 2: Validate file encoding and line endings
    - Binary check for UTF-8 BOM absence
    - Binary check for CRLF absence
    - UTF-8 decode validation
  - Task 3: Validate markdown structure and prose quality
    - Verify H1 heading on line 1
    - Verify blank line on line 2
    - Verify 2-3 sentences on lines 3+ (period count)
    - Verify file size (300-600 bytes)

  **Phase 2: Git Integration & Remote Push**
  - Task 4: Stage and commit file to git
    - Run git add to stage file
    - Run git commit with conventional message format
    - Verify commit was created successfully
  - Task 5: Push to remote feature branch
    - Run git push with -u origin HEAD
    - Verify upstream tracking is configured
    - Confirm push succeeded

  **Why this ordering:**
  - File creation and validation come first to ensure output quality before git integration
  - All validation completes before touching version control (prevents invalid commits)
  - Git operations happen only when file meets all requirements
  - Testing and validation happen before remote push (reduces remote cleanup needs)

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File already exists in repository | Medium — would fail or overwrite | Check file does not exist before creation; fail fast with clear error message |
  | Incorrect encoding (CRLF or UTF-8 with BOM) | High — breaks cross-platform git consistency | Binary validation checks catch encoding issues before git operations |
  | Markdown syntax errors | Medium — violates CommonMark spec | Validate structure (H1, blank line, prose) post-creation; test against spec |
  | Prose quality issues (wrong sentence count, missing content) | Medium — fails acceptance criteria | Validate sentence count by period detection; check file size (300-600 bytes) |
  | Git commit fails or branch is out of date | Low — would require manual recovery | Use subprocess error handling; verify file is valid before attempting commit |
  | Push fails due to remote conflicts | Low — feature branch should be clean | Use -u origin HEAD for explicit push; assume feature branch is dedicated |
  | Platform-specific path issues | Low — using pathlib (cross-platform) | pathlib handles Windows/macOS/Linux path differences automatically |

  ---

  ## Rationale for 2-Phase Approach

  This feature separates concerns cleanly:

  1. **Phase 1 (Creation & Validation):** Focuses on file quality before integration
     - Creates file with correct content
     - Validates encoding, structure, and prose quality
     - All done in local filesystem (reversible if issues found)

  2. **Phase 2 (Git Integration):** Handles version control
     - Stages and commits validated file
     - Pushes to remote branch
     - Only proceeds after file passes all validation

  This ordering ensures we never push invalid files to git, and validation issues are caught early with clear error messages.
