content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24
  - **Confidence:** High — Pattern validated across 193 preceding identical features
  - **Dependencies:** None (Python standard library + system git only)

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python pathlib (`Path.write_text()`) with explicit UTF-8 encoding and Unix LF line endings

  **Rationale:**
  - Standard, portable Python 3 approach for text file creation
  - Explicit control over encoding (UTF-8 without BOM) and line endings (`newline="\n"`)
  - Part of Python standard library (no external dependencies)
  - Validated pattern across 193 preceding features
  - Matches established codebase conventions in `create_markdown_file.py`

  **Rejected alternatives:**
  - **Open/write/close pattern:** Less portable, requires manual newline handling, no built-in encoding validation
  - **External markdown libraries:** Introduces unnecessary dependencies; pathlib is sufficient for simple text files

  ### 2. Content Structure and Format

  **Chosen:** Fixed markdown structure — H1 heading + blank line + 2-3 sentences, validated by period count

  **Rationale:**
  - Ensures deterministic, reproducible output
  - Direct mapping to functional requirements (FR-2, FR-3, FR-4)
  - CommonMark specification compliance is trivial for this structure
  - Period-based sentence counting is simple and effective
  - Validated across 300+ test files in repository
  - Manual prose composition ensures quality without external AI/LLM dependencies

  **Rejected alternatives:**
  - **Dynamic AI-generated content:** Introduces external API dependency, breaks determinism, undermines test reliability
  - **Flexible prose format:** Makes validation ambiguous, complicates acceptance criteria

  ### 3. Git Workflow Implementation

  **Chosen:** Python subprocess module with explicit git porcelain commands (add, commit, push)

  **Rationale:**
  - subprocess is Python standard library (no external dependencies)
  - Clear error handling via CalledProcessError
  - Good visibility for debugging and logging
  - Transparent view into git operations
  - Validated across 193 preceding features
  - -u flag ensures upstream tracking for feature branch

  **Rejected alternatives:**
  - **GitPython library:** Adds external dependency, unnecessary abstraction layer
  - **Git plumbing commands:** Unnecessarily low-level; porcelain is appropriate
  - **Shell script wrapper:** Less portable, harder to debug

  ### 4. File Encoding and Line Endings

  **Chosen:** UTF-8 without BOM + Unix LF line endings (enforced via `newline="\n"` and validation)

  **Rationale:**
  - UTF-8 is standard for modern markdown and Python 3
  - No BOM for simplicity and minimal file size
  - LF required for consistent git history across Windows/macOS/Linux
  - Matches production environment conventions
  - Explicitly required by spec (NFR-4)
  - Validation checks confirm BOM absence and CRLF absence

  **Rejected alternatives:**
  - **Platform default encoding:** Creates cross-platform inconsistency, breaks git integrity
  - **CRLF line endings:** Breaks cross-platform workflows, incompatible with Unix environments
  - **UTF-8 with BOM:** Adds 3 bytes, unnecessary for UTF-8, complicates tool parsing

  ### 5. Validation Strategy

  **Chosen:** Comprehensive post-creation validation covering encoding, line endings, structure, prose quality, and size

  **Validation checks:**
  - Binary encoding: Verify no UTF-8 BOM (EF BB BF bytes)
  - Line endings: Verify no CRLF (CR LF bytes)
  - UTF-8 decode: Confirm valid UTF-8 text
  - Structure: H1 on line 1, blank line on line 2, prose on line 3+
  - Prose quality: 2-3 sentences (counted by periods)
  - File ending: Must end with newline
  - Size: 300-600 bytes (sanity check for content presence)

  **Rationale:**
  - Ensures CommonMark specification compliance (NFR-1)
  - Detects platform-specific encoding/line-ending issues early
  - Binary checks catch BOM/CRLF issues that text parsing might miss
  - Separate checks for encoding, structure, and content quality
  - Proven across 193+ features and reference `create_markdown_file.py`

  **Rejected alternatives:**
  - **No validation:** Risks malformed files, creates technical debt
  - **Minimal validation:** Masks encoding and structure problems
  - **Regex-only validation:** Cannot detect binary encoding issues

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O | Use | Standard Python approach, explicit encoding/newline control, no dependencies |
  | subprocess (stdlib) | Git integration | Use | Standard Python subprocess execution, good error handling, transparent git commands |
  | markdown / commonmark | Markdown validation | Reject | Unnecessary; simple H1+prose structure is trivial to validate and parse |
  | GitPython | Git interaction | Reject | Adds external dependency; subprocess standard library is sufficient and more transparent |

  ## Security Considerations

  **Input Validation:**
  - Filename is hardcoded (`test-9zebfj.md`), no user input accepted
  - Content is hardcoded prose, no user input accepted
  - No shell injection risks (subprocess called with list of args, not shell=True)
  - Commit message is hardcoded, no interpolation of user input

  **File System Security:**
  - File creation fails safely if file already exists (checked before write)
  - File permissions inherited from umask (standard behavior)
  - No path traversal possible (hardcoded filename in repository root)
  - No privileged file operations

  **Encoding Security:**
  - UTF-8 encoding prevents binary data injection
  - BOM and CRLF validation prevents encoding-based injection vectors
  - File read uses binary mode for encoding validation, then text mode for content validation

  **Git Operations:**
  - subprocess called with list args (not shell=True), preventing shell injection
  - Commit message is constant, no variable interpolation
  - Push uses origin HEAD, no branch name manipulation

  ## Performance Implications

  **File I/O:**
  - Single file write operation (~400-500 bytes) is negligible
  - Validation reads file twice (binary for encoding, text for structure) — minimal overhead
  - Total I/O: ~1 KB read + ~0.5 KB write, negligible performance impact

  **Git Operations:**
  - git add, git commit, git push are standard operations, no performance issues
  - No batch operations or large file handling
  - Total git time: typically 500-1000 ms, dominated by network push

  **Overall:**
  - Feature is I/O and network bound (git push), not compute bound
  - No optimization opportunities without external services
  - Expected total execution time: 5-10 seconds (including git push)

  ## Architecture Notes

  **Integration Points:**
  - Feature is self-contained; creates single file in repository root
  - Does not interact with src/sheep/ codebase
  - Does not require database, config file, or environment changes
  - Git workflow follows standard feature branch pattern (feat/194-*)

  **Codebase Conventions:**
  - Follows pattern from create_markdown_file.py (reference implementation)
  - Uses Python 3.11+ pathlib syntax (consistent with pyproject.toml specification)
  - Follows established error handling patterns (try/except with descriptive messages)
  - Conventional commit message format matches existing commits

  **Extensibility:**
  - Pattern is completely isolated; 194+ identical features can follow the same approach
  - No shared state or global configuration needed
  - Each feature can be implemented independently without coordination

  ---

  ## Implementation Approach

  **Step 1: File Creation (5 minutes)**
  - Use Python pathlib to create test-9zebfj.md
  - Content: `# {TITLE}\n\n{PROSE}\n` (H1 + blank line + 2-3 sentences)
  - Enforce UTF-8 encoding without BOM and LF line endings

  **Step 2: Validation (2-3 minutes)**
  - Validate encoding: no BOM, valid UTF-8
  - Validate line endings: no CRLF
  - Validate structure: H1 on line 1, blank line on line 2, prose on line 3+
  - Validate prose: 2-3 sentences (period count)
  - Validate file size: 300-600 bytes

  **Step 3: Git Integration (2-3 minutes)**
  - Stage file: `git add test-9zebfj.md`
  - Commit: `git commit -m "feat(194): create markdown file test-9zebfj.md"`
  - Push: `git push -u origin HEAD`

  **Total estimated effort:** 10-15 minutes (consistent with spec size estimate "S")

  ---

  _Research phase complete — ready for implementation_
