# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository contains 200+ markdown files including state machine diagrams, design patterns,
  documentation, and prose examples. Feature 266 requires creating a new test markdown file to extend
  this collection. The task is straightforward: create a single markdown file named test-u3x32k.md
  with a markdown heading and 2-3 sentences of prose content about any topic. This continues the
  established pattern from features 260-265, which have all followed the same structure and workflow.

  The implementation is purely additive - no existing files are modified, no code changes are required,
  and no infrastructure changes are needed. This is a documentation-only feature that extends the
  repository's collection of example markdown files.

  ## Success Criteria

  **File Creation & Structure**
  - [ ] File named `test-u3x32k.md` is created at repository root (no subdirectories)
  - [ ] File contains exactly one H1 markdown heading (`# Title`) as the first line
  - [ ] File contains a blank line as the second line
  - [ ] File contains exactly 2-3 complete, grammatically correct sentences of prose content
  - [ ] No blank lines exist between the heading, blank line, and prose content block
  - [ ] No trailing blank lines after prose content

  **Content Quality**
  - [ ] Content is valid GitHub-Flavored Markdown with no syntax errors
  - [ ] All prose sentences are grammatically correct with proper punctuation
  - [ ] Prose is coherent and meaningful (not placeholder or lorem ipsum)
  - [ ] Content is readable and understandable

  **Technical Requirements**
  - [ ] File size is between 300-600 bytes (inclusive)
  - [ ] File uses UTF-8 character encoding without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (`\n`), not Windows CRLF (`\r\n`)
  - [ ] File contains no trailing whitespace on any line

  **Git Integration**
  - [ ] File is committed with conventional commit message: `feat(266): Create markdown file test-u3x32k.md with prose content`
  - [ ] Commit is on the feature branch `feat/266-markdown-file-creation-f77090`
  - [ ] No unrelated files are modified or created in the commit
  - [ ] Changes are pushed to the remote feature branch

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named `test-u3x32k.md` at repository root
  - **FR-2**: File must contain a single H1 markdown heading followed by a blank line
  - **FR-3**: File must contain exactly 2-3 complete sentences of prose content
  - **FR-4**: Prose content must be about any topic of the implementer's choosing
  - **FR-5**: File must be properly formatted as valid GitHub-Flavored Markdown
  - **FR-6**: File must be committed to git with conventional commit message format
  - **FR-7**: File must be pushed to the feature branch in remote repository

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 character encoding without BOM (byte order mark)
  - **NFR-2**: File must use Unix LF line endings (`\n`), not Windows CRLF or other formats
  - **NFR-3**: File size must be constrained to 300-600 bytes to ensure consistent prose length
  - **NFR-4**: Implementation must follow the established pattern from features 260-265 for consistency
  - **NFR-5**: No code changes, infrastructure updates, or test modifications required
  - **NFR-6**: File must be readable and understandable to future repository maintainers
  - **NFR-7**: Prose must be grammatically correct with proper punctuation and spelling

  ## Product Questions & AI Recommendations

  | Question | AI Recommendation | Rationale |
  | -------- | --------------- | --------- |
  | What quality standard for prose content? | Grammatically correct prose only | Maintains consistency with repository documentation standards, matches pattern from features 260-265, ensures professional quality |
  | Should content be constrained to specific topics? | Any topic - complete flexibility | Previous test files use diverse topics, minimizes constraints, supports creative implementation |
  | How to validate technical requirements? | Automated validation + manual review | Automated checks catch encoding/line ending issues reliably, manual review focuses on prose quality |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root level**: Contains 200+ markdown files including:
    - Test files (test-*.md pattern) — hundreds of files with diverse topics
    - Documentation files (README.md, SHEEP.md, etc.) — project overviews and guides
    - Example content files — design patterns, state machines, jokes, domain-specific content
  - **specs/**: Feature specification directory with 260+ subdirectories numbered 006-266
    - Each feature has a dedicated spec.yaml file
    - Specs document requirements, architecture analysis, and success criteria
  - **src/**: Python source code for CrewAI-based agentic platform
    - agents/, flows/, tools/, config/, observability/ modules
    - Not affected by this feature
  - **.github/**: GitHub Actions workflows and CI/CD configuration
  - **Infrastructure files**: Dockerfile, .env.example, .gitignore, etc.

  ### Architecture Patterns

  The repository follows consistent patterns for markdown file creation:

  1. **Naming Convention**: `test-<identifier>.md` where identifier is a 6-character alphanumeric string
     (e.g., test-u3x32k.md, test-4533e5.md, test-hkb9oa.md)
  2. **Content Structure**: Simple document with:
     - H1 markdown heading (# Title) on first line
     - Blank line on second line
     - 2-3 sentences of prose content (typically 300-600 bytes total)
  3. **Placement**: All test markdown files at repository root (no subdirectories)
  4. **Encoding & Line Endings**: UTF-8 encoding without BOM, Unix LF line endings (\n)
  5. **Git Integration**: Added via conventional commit message
     - Format: `feat(#): Create markdown file test-<identifier>.md with prose content`
     - Single file addition per commit
  6. **No Code Changes**: Pure documentation — no Python code, tests, or configuration changes

  ### Relevant Technologies

  - **Markdown**: GitHub-Flavored Markdown (GFM) syntax for file content
  - **Git**: Version control system for file addition and commit tracking
  - **File System**: Plain text file creation at repository root
  - **Text Encoding**: UTF-8 character encoding without Byte Order Mark (BOM)
  - **No Build/Test Infrastructure**: Unlike other features, this requires no build tools,
    test runners, CI changes, or Python environment — pure file creation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new .md file; no modifications to existing files |
  | Git history | Low | Single file addition tracked via one conventional commit message |
  | CI/CD pipelines | None | No code changes, test modifications, or configuration updates; markdown validated via PR review |
  | Source code (src/) | None | Feature does not touch Python code, agents, flows, tools, or infrastructure |
  | README/documentation | None | No updates to existing documentation files or indices |

  ## Dependencies

  None. This is a pure documentation file with no dependencies:
  - No Python code imports or libraries required
  - No external APIs or services
  - No other files need modification
  - No build system dependencies
  - Complete standalone feature with no blockers

  ## Size Estimate

  **S** (Small) — Single markdown file (~10-30 lines). No code changes, no configuration updates,
  no test files. Straightforward documentation file following the well-established pattern from
  features 260-265. Implementation involves:
  1. Create test-u3x32k.md with heading and 2-3 sentences
  2. Verify file encoding (UTF-8) and line endings (LF)
  3. Git add, commit, push

  Can be completed in 15-30 minutes of actual implementation work. Size estimate: S (Small - 1-2 hours including validation and git workflow).
