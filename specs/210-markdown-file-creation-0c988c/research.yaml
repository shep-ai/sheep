decisions:
  - title: "File Encoding"
    chosen: "UTF-8"
    rejected:
      - "ASCII — Unnecessarily restrictive; UTF-8 is the universal standard for markdown and web content, providing better future compatibility."
      - "UTF-16 — Overkill for plain text markdown files; creates unnecessary file size overhead and is not standard for this use case."
    rationale: >
      UTF-8 is the universal encoding standard for markdown files and all 209+ previous test-*.md files in the repository use UTF-8 (implicit through git's default handling). It provides optimal character support, compression, and compatibility with all tooling. No configuration required — UTF-8 is git's default encoding.

  - title: "Line Ending Format"
    chosen: "LF (Unix/Linux line endings)"
    rejected:
      - "CRLF (Windows line endings) — Repository is configured for LF consistency; using CRLF would create unnecessary git diffs and violate repository standards."
      - "CR (old Mac format) — Obsolete and incompatible with modern tooling; no repositories use this format anymore."
    rationale: >
      The repository uses LF line endings (visible in git configuration and all existing test-*.md files). This is standard for Linux/Unix systems and web-based version control. Enforcing LF consistency prevents line-ending noise in git history and is explicitly required by the specification (NFR-6). The local development environment (Linux) defaults to LF, so no special configuration is needed.

  - title: "Markdown Content Structure"
    chosen: "H1 heading + 2-3 sentence paragraph (no additional formatting)"
    rejected:
      - "H1 + bulleted list — Contradicts specification requirement for 'prose content'; lists are not prose."
      - "Multiple sections with H2 subheadings — Over-engineered; specification explicitly requires only an H1 heading followed by 2-3 sentences."
    rationale: >
      The specification explicitly requires an H1 markdown heading (#) as the title and 2-3 sentences of substantive prose content. This structure is consistent with all 209+ previous test-*.md files in the repository. The simple structure (H1 + paragraph) is optimal for the trivial scope of this feature and provides clarity without unnecessary complexity.

  - title: "File Location"
    chosen: "Repository root directory"
    rejected:
      - "Subdirectory (e.g., docs/, tests/, etc.) — Violates specification requirement to place file at repository root; all previous 209+ test-*.md files are at the root."
      - "Random location — Creates inconsistency and makes file discovery difficult; repository convention is repository root."
    rationale: >
      Specification (FR-2) explicitly requires placement at repository root. All 209+ previous test-*.md files follow this pattern. The repository root is the established convention for these test markdown files, making them discoverable and maintaining consistency across the project history.

  - title: "Git Commit Message Format"
    chosen: "Conventional Commits format: 'feat(210): Create markdown file test-vgprsq.md'"
    rejected:
      - "Generic message (e.g., 'Add test file') — Less informative and violates specification requirement (NFR-2) to follow conventional commits format."
      - "Descriptive prose (e.g., 'Creates a new markdown file...') — While clear, does not follow the project's conventional commits convention visible in recent commit history."
    rationale: >
      Specification (NFR-2) explicitly requires conventional commits format. Recent git history confirms this pattern: 'feat(208):', 'feat(209):'. The format `feat(210): Create markdown file test-vgprsq.md` follows the established convention while being descriptive about the change scope and feature number.

