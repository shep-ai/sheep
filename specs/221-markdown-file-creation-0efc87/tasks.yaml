# Markdown content (the full tasks document)
content: |
  ## Implementation Summary

  Feature 221 implementation consists of creating a single Python script that automates the complete workflow:
  file creation, git staging, commit, and push. The work is organized into three focused tasks across a single phase:

  1. **Task 1: File Creation** — Implement core file I/O using pathlib with proper UTF-8 encoding and LF line endings
  2. **Task 2: Git Integration** — Add git operations (add, commit, push) with error handling via subprocess
  3. **Task 3: Verification** — Validate complete workflow against all 9 success criteria

  Each task follows TDD discipline (RED-GREEN-REFACTOR) and includes specific acceptance criteria. The implementation
  is straightforward and well-established (proven by 60+ identical features 160-220), estimated at 1-1.5 hours total effort.

  ## Execution Flow

  All three tasks must execute sequentially because each builds on the previous one:

  ```
  Task 1: Create File
  └─ Task 2: Git Integration (depends on file existing)
     └─ Task 3: Verification (depends on complete workflow)
  ```

  - **Task 1** creates the markdown file that Task 2 operates on
  - **Task 2** stages, commits, and pushes the file created in Task 1
  - **Task 3** validates the entire workflow and verifies all success criteria

  ## Technology Stack

  - **Python 3.11+**: Standard library only (pathlib for file I/O, subprocess for git, sys for exit codes)
  - **Git**: Version control, conventional commits format
  - **Markdown**: Simple H1 heading + prose format (CommonMark)
  - **Unix/Linux**: LF line endings, bash shell for git commands

  ## Detailed Task Breakdown

  ### Task 1: File Creation with pathlib

  **Dependencies:** None (first task)

  **Key Implementation Details:**
  - Use `Path("test-i1otr7.md").write_text(content, encoding="utf-8", newline="\n")`
  - Content format: `f"# {TITLE}\n\n{PROSE}\n"`
  - TITLE: Any topic (e.g., "The Importance of Consistent Testing")
  - PROSE: 2-3 sentences related to the title
  - Handle FileExistsError (file already exists) and OSError (I/O errors)

  **Success Indicators:**
  - File exists with correct content
  - File size 300-500 bytes
  - Proper encoding and line endings

  ### Task 2: Git Integration with subprocess

  **Dependencies:** Task 1 (file must exist)

  **Key Implementation Details:**
  - `subprocess.run(["git", "add", "test-i1otr7.md"], check=True)`
  - `subprocess.run(["git", "commit", "-m", "feat(221): Create markdown file test-i1otr7.md"], check=True)`
  - `subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)`
  - Handle CalledProcessError for failed git commands
  - Log each operation with clear status (✓ or ✗)
  - Exit with code 1 on failure, 0 on success

  **Success Indicators:**
  - File is staged in git
  - Commit created with correct message
  - Commit pushed to feature branch

  ### Task 3: Complete Workflow Verification

  **Dependencies:** Task 2 (git workflow must be complete)

  **Key Verification Steps:**
  - File exists at repository root with correct name
  - File contains H1 heading and 2-3 sentences
  - Line endings are Unix LF (not CRLF)
  - Git log shows correct commit message
  - Commit is on correct feature branch
  - Feature branch HEAD points to new commit
  - All 9 spec success criteria are satisfied

  **Success Indicators:**
  - All acceptance criteria pass
  - Script runs without errors
  - Manual checks confirm file and git state

  ## Estimated Effort Breakdown

  - **Task 1 (File Creation):** 20-30 minutes
    - RED: Write test (5 min)
    - GREEN: Implement pathlib logic (10 min)
    - REFACTOR: Add exception handling (5-10 min)

  - **Task 2 (Git Integration):** 20-30 minutes
    - RED: Write git status test (5 min)
    - GREEN: Implement subprocess calls (10 min)
    - REFACTOR: Add error handling and logging (5-10 min)

  - **Task 3 (Verification):** 15-20 minutes
    - RED: Write comprehensive test suite (5 min)
    - GREEN: Run implementation and verify (5 min)
    - REFACTOR: Cleanup and final checks (5-10 min)

  - **Total:** 1-1.5 hours including planning and testing

  ## Key Decisions

  1. **No separate script file** — All logic in a single Python script for simplicity
  2. **Standard library only** — No external dependencies (pathlib, subprocess, sys)
  3. **Sequential git operations** — Each command separate for clarity and independent error handling
  4. **Minimal error handling** — Catch specific exceptions (FileExistsError, OSError, CalledProcessError)
  5. **No validation layer** — Create file only; no post-creation checks (per spec requirement)
  6. **Simple prose content** — Any topic acceptable; minimal decision overhead

  ## Testing Approach

  **No formal test framework required.** Instead, TDD uses:
  - **RED:** Assert preconditions (e.g., file doesn't exist)
  - **GREEN:** Implement minimal code to satisfy assertion
  - **REFACTOR:** Add error handling and improve code quality
  - **Integration (Task 3):** Run complete workflow and verify all success criteria

  All success criteria are concrete and testable without external testing frameworks.
