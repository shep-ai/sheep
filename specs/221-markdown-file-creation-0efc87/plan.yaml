# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 221 is a minimal, straightforward implementation that creates a single markdown file following
  the established pattern from 60+ identical features (160-220). The implementation is entirely self-contained:
  a single Python script that orchestrates the complete workflow.

  **Workflow:**
  1. Create markdown file with H1 heading and 2-3 sentences of prose
  2. Use pathlib with explicit UTF-8 encoding and `newline="\n"` to ensure Unix LF line endings
  3. Stage the file using `git add test-i1otr7.md`
  4. Commit with conventional message: `feat(221): Create markdown file test-i1otr7.md`
  5. Push to feature branch using `git push -u origin HEAD`

  **No dependencies:**
  - Does not integrate with Sheep core (src/sheep/ untouched)
  - Does not require external packages (standard library only)
  - Does not require test framework or validation layer
  - Simple sequential operations with minimal error handling

  This approach is proven by feature 220 (immediate predecessor) and validated across features 160-220.

  ## Key Design Decisions

  ### 1. File Creation with Python pathlib

  **Decision:** Use `Path.write_text()` with explicit `encoding="utf-8"` and `newline="\n"` to ensure
  portable UTF-8 encoding and Unix LF line endings across all platforms (Windows, macOS, Linux).

  **Rationale:**
  - Standard library only (satisfies NFR-3: no external dependencies)
  - Modern Python idiom (cleanest, most readable API)
  - Cross-platform consistency guaranteed by explicit `newline="\n"` parameter
  - Proven pattern across features 160-220, particularly feature 220
  - Prevents common pitfalls (BOM encoding, CRLF line endings on Windows)

  **Alternatives considered and rejected:**
  - Direct bash/shell commands: Inconsistent with codebase patterns (features 160-220 use Python), harder to debug
  - GitPython library: Adds external dependency (violates NFR-3), not used in existing codebase
  - Template-based or procedural content generation: Over-engineered for simple test file

  ### 2. Content Strategy: Flexible/Generic Prose

  **Decision:** Use any topic for prose content; no thematic constraints. Example topic: "The Importance of Consistent Testing"
  with 2-3 sentences on that topic.

  **Rationale:**
  - User query explicitly states "about anything" (minimizes decision overhead, enables fastest execution)
  - Aligns with established pattern from features 216-220
  - Keeps implementation focused on core workflow (file creation, git integration) rather than content creativity
  - Follows spec requirement: FR-3 "exactly 2-3 sentences of prose content"

  **Alternatives considered and rejected:**
  - Thematic content with specific topics (e.g., all files about Python): Adds decision overhead, contradicts spec "about anything"
  - Random/procedural content generation: Adds non-determinism and complexity without value
  - Pre-generated content library: Over-engineered for simple test files

  ### 3. Git Integration via subprocess.run()

  **Decision:** Use `subprocess.run()` with `check=True` for sequential git operations: `git add` →
  `git commit` → `git push`. Each operation is a separate call for clarity and independent error handling.

  **Rationale:**
  - Standard library only (pathlib, subprocess, sys — no external dependencies)
  - Established pattern across all 200+ features in Sheep project
  - Safe against command injection (uses list-based arguments, not shell strings)
  - Clean error handling via CalledProcessError exception
  - Cross-platform compatible
  - Sequential approach ensures each step depends on previous success (add must succeed before commit, etc.)

  **Git command details:**
  - `git add test-i1otr7.md` — Stages file in index
  - `git commit -m "feat(221): Create markdown file test-i1otr7.md"` — Creates commit with conventional message
  - `git push -u origin HEAD` — Pushes commit to feature branch with upstream tracking

  **Alternatives considered and rejected:**
  - GitPython library: External dependency, not used in existing codebase, violates NFR-3
  - Pygit2/libgit2: Overkill for simple operations, external dependency
  - os.system() / shell=True: Unsafe (command injection risk), harder to capture errors, deprecated pattern

  ### 4. Minimal Error Handling

  **Decision:** Catch specific exceptions (FileExistsError, OSError, CalledProcessError) with minimal
  defensive checks. Add FileExistsError check before file creation to prevent accidental overwrites.

  **Rationale:**
  - Feature 220 pattern (immediate precedent)
  - Spec explicitly requires no validation layer (unlike feature 216 which includes comprehensive validation)
  - FileExistsError defensive check prevents silent overwrites
  - CalledProcessError provides clear context for git failures
  - Keeps implementation lean (~50-75 lines of code) and execution fast
  - Clear error messages to stderr with exit code 1 on failure

  **Error handling scope:**
  - FileExistsError: File already exists (defensive check)
  - OSError: I/O errors (permission denied, disk full, etc.)
  - CalledProcessError: Git command failures (network issues, permissions, etc.)

  **Alternatives considered and rejected:**
  - No error handling: Fragile, unclear failure modes
  - Extensive validation layer: Feature 216 pattern, but spec explicitly says "No validation, create only"
  - Generic Exception catch: Masks specific error types, harder to debug

  ### 5. No Validation Layer

  **Decision:** Create file only, no post-creation validation. The spec explicitly states "No validation layer per spec requirement."

  **Rationale:**
  - Feature 220 (immediate predecessor) follows this pattern
  - Feature 216 includes comprehensive validation (file encoding, line endings, markdown structure, sentence count),
    but feature 221 spec explicitly rejects this approach
  - Keeps implementation lean and execution fast (~10-15 minutes)
  - Aligns with "S" (Small) size estimate
  - File creation via pathlib is inherently safe and reliable for this simple use case

  **What is NOT validated:**
  - File encoding (guaranteed by explicit `encoding="utf-8"`)
  - Line endings (guaranteed by explicit `newline="\n"`)
  - Markdown structure (guaranteed by hardcoded content format)
  - File size (guaranteed by simple prose content)
  - Sentence count (guaranteed by hardcoded prose with 2-3 sentences)

  **Alternatives considered and rejected:**
  - Full validation layer (feature 216 pattern): Adds 100+ lines of code, contradicts spec requirement
  - Partial validation (e.g., file exists after creation): No added value, adds complexity

  ## Implementation Strategy

  **Phase 1: File Creation & Git Workflow (Single phase, 3 ordered tasks)**

  All implementation work occurs in this phase. No parallelization is possible because each task
  builds on previous ones.

  **Execution order:**

  1. **Task 1: Create markdown file with proper encoding and line endings**
     - Implement file creation using pathlib with UTF-8 encoding and `newline="\n"`
     - Add exception handling for FileExistsError and OSError
     - Ensures file is created correctly before git operations proceed

  2. **Task 2: Integrate git operations (add, commit, push)**
     - Depends on Task 1 (file must exist)
     - Add subprocess calls for git add, commit, push
     - Add CalledProcessError exception handling and clear logging
     - Ensures file is properly staged, committed, and pushed

  3. **Task 3: Verify complete workflow against success criteria**
     - Depends on Task 2 (git workflow must be implemented)
     - Run comprehensive tests validating all 9 success criteria from spec
     - Verify file content, git history, feature branch state
     - Final acceptance testing

  **Rationale for sequential approach:**
  - Task 1 creates the file that Task 2 operates on (git add/commit/push)
  - Task 2 must complete before Task 3 can verify the workflow
  - No parallelization is possible; each phase strictly depends on previous completion
  - Sequential testing allows early detection of issues (fail fast)

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File already exists (accidental overwrite) | Low | High | Check for FileExistsError before writing; defensive check prevents silent overwrites |
  | Incorrect line endings (CRLF on Windows) | Low | High | Explicit `newline="\n"` parameter forces Unix LF on all platforms (Windows, macOS, Linux) |
  | Git configuration missing (user.name/email) | Low | High | Assumes pre-configured git environment (NFR-8 requirement); OSError handling provides clear error messaging |
  | Git command failures (network, permissions) | Medium | High | Use `check=True` with CalledProcessError exception handling for clear, actionable error messages |
  | File encoding issues (UTF-8 without BOM) | Low | Medium | Explicit `encoding="utf-8"` without BOM; matches repository standards |
  | Script exits on error (prevents partial commits) | N/A | N/A | By design — fail fast if any step fails; prevents inconsistent repository state |

  ## Testing Strategy

  **No formal test framework required** (spec does not require tests). Instead, verification uses:

  1. **Red phase (each task):** Assert preconditions are not met (e.g., file doesn't exist yet)
  2. **Green phase (each task):** Implement minimal code to satisfy the assertion
  3. **Refactor phase (each task):** Add error handling, logging, and cleanup
  4. **Integration phase (Task 3):** Run complete workflow and verify all 9 success criteria

  **Manual verification (Task 3):**
  - File exists in repository root with correct content
  - File has Unix LF line endings (verify with `git diff` or `file` command)
  - Git log shows commit with message "feat(221): Create markdown file test-i1otr7.md"
  - Commit is on feature branch "feat/221-markdown-file-creation-0efc87"
  - Feature branch HEAD points to the new commit

  ## Estimated Effort

  **Total: 1-1.5 hours**

  - Task 1 (File creation): 20-30 minutes
  - Task 2 (Git integration): 20-30 minutes
  - Task 3 (Verification): 15-20 minutes
  - Buffer for testing and cleanup: 5-10 minutes

  **Justification:**
  - Extremely well-established pattern with 60+ identical features providing proven precedent
  - Flexible topic selection with no research required
  - Single file with minimal, well-understood content format
  - Standard library only (no dependency resolution)
  - No testing framework integration or complex configuration changes
  - Feature branch already created and checked out
