# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the well-established pattern from 180+ prior markdown-file-creation
  implementations (features 069-248). The implementation is minimal and isolated:

  - **Scope**: Single markdown file creation in repository root (no subdirectories)
  - **Dependencies**: None on application source code (/src/sheep/); uses only Python standard library
  - **Workflow**: File creation → validation → git integration (add, commit, push)
  - **File format**: Markdown with H1 heading, blank line, 2-3 sentences of prose
  - **Encoding**: UTF-8 without BOM; LF line endings (consistent with 90+ existing test files)

  The feature does not modify any source code, configuration files, or test suites. It is a pure
  artifact creation task that serves as a validation artifact for the automated implementation system.

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path().write_text()

  **Decision**: Use `pathlib.Path("test-5dj8b5.md").write_text(content, encoding='utf-8')`

  **Rationale** (from research):
  - Modern Python standard per PEP 519 and explicitly required by NFR-5
  - Concise and Pythonic compared to open()/os.makedirs() approaches
  - Explicit encoding='utf-8' parameter prevents platform-specific defaults
  - Matches the pattern used in all 90+ existing test files
  - Single method call eliminates boilerplate and file handle management

  ### 2. Encoding and Line Endings: Strict UTF-8, LF

  **Decision**: Write with `encoding='utf-8'` and use `\n` in content string

  **Rationale** (from research):
  - pathlib.write_text() with encoding='utf-8' produces UTF-8 without BOM by default
  - Python's text mode correctly interprets `\n` as LF across all platforms when using UTF-8
  - Enforces consistency with 90+ existing test files which all use LF without BOM
  - Prevents platform-dependent defaults (CRLF on Windows) that would break consistency
  - Critical for pattern fidelity per NFR-1 and NFR-2

  ### 3. Content Structure: Exact Pattern Match

  **Decision**: Follow established pattern: `# Title\n\n<sentence1> <sentence2> <sentence3>.\n`

  **Rationale** (from research):
  - Examination of 90+ existing test files reveals consistent structure
  - All use single H1 heading, blank line, single paragraph of 2-3 sentences
  - No variations exist (multiple paragraphs, H2/H3 headings, etc.)
  - Naturally produces 400-600 byte files per success criteria
  - Prose is manually written (not templated) per product decision, allowing topic flexibility

  ### 4. Validation Strategy: Basic Structural Checks

  **Decision**: Validate file exists, H1 present, sentence count, and file size after creation

  **Rationale** (from research):
  - Product decision specifies basic structural validation (not comprehensive)
  - Catches obvious errors (missing H1, wrong sentence count) without over-engineering
  - File size check (300-800 bytes) accommodates topic length variation within spec's 400-600 typical range
  - Fails fast with clear error messages if structure is incorrect
  - Matches validation approach from prior markdown-file-creation implementations

  ### 5. Git Integration: subprocess.run()

  **Decision**: Use `subprocess.run()` with shell=False for git add/commit/push

  **Rationale** (from research):
  - No new dependencies: subprocess is in Python standard library per NFR-9
  - Git operations are straightforward: git add, git commit -m "...", git push origin <branch>
  - subprocess with shell=False prevents shell injection attacks
  - Can capture exit codes and output for error reporting
  - Pattern matches all 180+ prior implementations (features 069-248)

  ### 6. Prose Content: Manual Writing

  **Decision**: Write 2-3 sentences manually with chosen topic

  **Rationale** (from research):
  - Product decision specifies manual writing for higher-quality, more natural content
  - Matches pattern from features 243-248
  - Topic is unrestricted per product decision ("about anything")
  - Allows implementer creativity while satisfying grammatical and structural requirements
  - Requires ~2-3 minutes, minimal overhead with superior results

  ## Implementation Strategy

  **Phase ordering rationale**: Create first, validate second, integrate third.

  1. **Phase 1 (File Creation)** must come first because validation and git integration depend on
     the file existing and having correct structure.

  2. **Phase 2 (Validation and Git Integration)** comes second because:
     - Validation runs against the created file
     - Git operations depend on file being in correct state
     - Sequencing prevents unnecessary rework if file structure is wrong

  **Execution approach**:
  - Manual prose creation (~2-3 minutes): Choose topic, write 2-3 grammatically correct sentences
  - Validation (~3 minutes): Run structural checks, verify all criteria pass
  - Git workflow (~2-5 minutes): Stage, commit with conventional message, push to branch
  - Total effort: 10-15 minutes (consistent with prior implementations)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists (collision) | Very Low | Low | File naming test-5dj8b5.md is specified in requirements; random suffix prevents collisions |
  | Encoding/line-ending mismatch | Low | Medium | Explicit UTF-8 encoding and `\n` in string ensure consistency; validation checks file size/structure |
  | Git commit fails (user.email not configured) | Low | Medium | Error handling with clear message; operator can configure git and retry |
  | Network failure during push | Low | Low | Clear error message allows retry; file and commit remain valid if push fails |
  | Markdown syntax invalid | Very Low | Low | Basic validation catches missing H1 and sentence count; manual prose writing ensures grammatical correctness |
  | Wrong commit message format | Very Low | Low | Commit message is hard-coded in code per conventional commit spec; no user input risk |

  **Overall risk profile**: Very low. The feature is isolated, non-destructive, uses only standard
  library, and follows a proven pattern from 180+ prior implementations with no incidents reported.
