decisions:
  - title: "File I/O Method"
    chosen: "pathlib.Path().write_text(encoding='utf-8')"
    rejected:
      - "Using open() with manual mode/encoding — more verbose and less Pythonic than pathlib"
      - "Using os.makedirs()/open() — lacks pathlib's modern abstractions and clarity"
      - "Using pathlib but with newline='' parameter — unnecessary complexity, pathlib handles line endings correctly"
    rationale: >
      pathlib.Path is the modern Python standard (PEP 519) and explicitly required by NFR-5.
      The write_text() method is clean, concise, and handles encoding uniformly across platforms.
      Passing encoding='utf-8' explicitly prevents platform-specific defaults and is future-proof.
      This approach matches the pattern used in all 90+ existing test files.

  - title: "Encoding and Line Ending Enforcement"
    chosen: "write_text(encoding='utf-8') with \\n in content string"
    rejected:
      - "Using platform defaults (system encoding, CRLF on Windows) — risks inconsistency with existing 90+ files"
      - "Using UTF-8-sig — adds unwanted BOM, violates NFR-1 requirement for no BOM"
      - "Binary mode with explicit bytes — unnecessary complexity, text mode with explicit encoding is clearer"
    rationale: >
      pathlib's write_text() with encoding='utf-8' produces UTF-8 without BOM by default.
      Python's text mode automatically converts \\n to the platform's line ending, but since we use
      UTF-8 (not UTF-8-sig) and write explicitly, the file contains LF (\n) across all platforms.
      This is verified by examining existing test files which all use LF despite being created on different systems.
      Explicit encoding='utf-8' parameter ensures consistency and prevents accidental BOM injection.

  - title: "Validation Strategy"
    chosen: "Basic structural validation after file creation"
    rejected:
      - "No validation — risks silent failures where file exists but has wrong structure"
      - "Comprehensive validation (syntax, byte counts, quality scoring) — over-engineered for test artifacts"
      - "Manual verification only — automatable checks should be automated"
    rationale: >
      Basic validation catches structural errors (file exists, contains H1, sentence count)
      without over-engineering per spec's product decision for basic structural validation (NFR-2).
      This matches the principle of failing fast and clearly when requirements aren't met.
      Validation checks: (1) file exists, (2) first line is markdown H1, (3) 2-3 sentences present,
      (4) file size 300-800 bytes (wider range to account for topic length variation).

  - title: "Git Integration Approach"
    chosen: "subprocess.run() for git add/commit/push operations"
    rejected:
      - "GitPython library — violates NFR-9 (no new dependencies), requires installation"
      - "Direct shell invocation with os.system() — less safe, harder to capture errors"
      - "git Python bindings (libgit2) — adds system dependency, violates NFR-9"
    rationale: >
      subprocess.run() is in Python standard library, requires no new dependencies per NFR-9.
      Git operations are simple: git add <filename>, git commit -m \"...\", git push origin <branch>.
      subprocess captures exit codes and output for error reporting. Shell=False for security.
      Pattern matches existing implementations in features 069-248 which all use subprocess/shell commands.

  - title: "Content Structure and Formatting"
    chosen: "Exact pattern: '# Title\\n\\n<sentence1> <sentence2> <sentence3>\\n'"
    rejected:
      - "Multiple paragraphs — adds unnecessary complexity, not present in any existing test files"
      - "Different heading levels (##, ###) — inconsistent with 90+ precedent files using only H1"
      - "Raw HTML or other formatting — adds complexity, not present in established pattern"
    rationale: >
      Examination of 90+ existing test files (test-*.md) reveals consistent pattern:
      Line 1: markdown H1 heading (# Title), Line 2: blank line, Lines 3+: 2-3 sentences.
      All sentences are in a single paragraph with proper punctuation. No variations exist.
      This structure naturally produces 400-600 byte files per spec success criteria.
      Prose is written manually per product decision (not templated), allowing topic flexibility.

  - title: "Error Handling and Reporting"
    chosen: "Catch specific exceptions (FileError, subprocess.CalledProcessError) with clear error messages"
    rejected:
      - "Bare try-except catching all exceptions — masks unexpected errors, makes debugging harder"
      - "No error handling — silently continues on failure, hard to detect problems"
      - "Exit on first error without cleanup — may leave git repository in inconsistent state"
    rationale: >
      Explicit exception handling for file I/O (PermissionError, FileExistsError) and git operations
      (CalledProcessError for non-zero exit codes) allows meaningful error reporting.
      This helps operators understand what failed and why without excessive logging or complexity.
      File creation and git workflow have clear failure modes worth distinguishing.

