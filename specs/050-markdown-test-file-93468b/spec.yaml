# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository maintains a collection of markdown files at the repository root containing educational content, test files, design patterns, and documentation. A new markdown file named `test-ya14ob.md` must be created with a descriptive H2 heading and exactly 3 sentences of prose content about a technical or educational topic.

  This feature follows the well-established pattern successfully completed in features #045, #046, #047, #048, and #049, all of which required creating a single markdown test file with a title heading and 3 sentences of content. No code modifications, configuration changes, or infrastructure updates are required.

  ## Success Criteria

  - [ ] File named `test-ya14ob.md` exists in the repository root directory (not in any subdirectory)
  - [ ] File contains exactly one markdown H2 (`##`) heading with a descriptive title
  - [ ] File contains exactly 3 sentences of prose content about a technical or educational topic
  - [ ] Markdown syntax is valid and renders correctly on GitHub
  - [ ] File encoding is UTF-8 without BOM (Byte Order Mark)
  - [ ] Line endings are LF (Unix-style `\n`), not CRLF or mixed
  - [ ] File size is between 200-600 bytes (consistent with similar test files)
  - [ ] File has been staged and committed to git with a conventional commit message
  - [ ] Commit message follows format: `feat: Create test-ya14ob.md markdown file about <topic>`
  - [ ] Changes have been pushed to the remote repository on the `feat/050-markdown-test-file-93468b` branch
  - [ ] No modifications to any existing files in the repository

  ## Functional Requirements

  - **FR-1**: Create a new file named `test-ya14ob.md` at the repository root (same directory level as other test-*.md files, not in subdirectories)
  - **FR-2**: File must contain a single markdown H2 (`##`) heading that clearly describes the content topic
  - **FR-3**: File must contain exactly 3 sentences of prose content providing information or context about the chosen technical or educational topic
  - **FR-4**: Content must use valid GitHub-Flavored Markdown (GFM) syntax with no syntax errors
  - **FR-5**: File must be committed to git with a conventional commit message matching the format `feat: Create test-ya14ob.md markdown file about <topic>`
  - **FR-6**: Changes must be pushed to the remote repository on the `feat/050-markdown-test-file-93468b` branch

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark), matching repository-wide convention
  - **NFR-2**: Line endings must be LF (Unix-style `\n`), not CRLF or mixed line endings, consistent with Git configuration
  - **NFR-3**: File size should remain minimal, approximately 200-600 bytes including heading and content, consistent with historical test files
  - **NFR-4**: Content must be readable and grammatically correct prose with no spelling errors or awkward phrasing
  - **NFR-5**: Markdown syntax must follow repository conventions and render correctly on GitHub without warnings or errors
  - **NFR-6**: File must have no external dependencies, imports, code references, or runtime requirements
  - **NFR-7**: Single commit should be created for this feature with no merge commits, rebases, or squashes; git history must remain linear

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root level**: Contains 66+ markdown files including educational content (test-*.md files), state machine diagrams (ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, etc.), design pattern documentation, and diverse topics (kiln construction, nautical knots, beekeeping, embossing, etc.)
  - **specs/**: Feature specification directory containing 50+ subdirectories (specs/006 through specs/050), each holding YAML specifications for features using the defined structure
  - **src/sheep/**: Python source code for the agentic platform (agents, flows, tools, configuration, observability)
  - **.github/**: GitHub Actions workflows for CI/CD automation
  - **tests/**: Python test suite for the platform
  - **pyproject.toml, Dockerfile, docker-compose.yml**: Build and deployment configuration
  - **.env.example, .gitignore, .dockerignore**: Environment and repository configuration

  The platform (Sheep) is a CrewAI-based agent automation system. However, for this feature, only the repository root is affected.

  ### Architecture Patterns

  The repository follows these established conventions for markdown test files:

  1. **Naming Convention**: Files follow the pattern `test-<identifier>.md` where `<identifier>` is a 6-character alphanumeric string (e.g., test-ya14ob.md, test-cxrhpd.md, test-sf7prc.md, test-lo8q71.md)
  2. **Placement**: All test markdown files are stored at the repository root (no subdirectories)
  3. **Content Structure**: Simple structure with one markdown H2 (`##`) heading followed by exactly 3 sentences of prose
  4. **Encoding & Line Endings**: UTF-8 encoding without BOM, LF (Unix-style) line endings (`\n`), not CRLF
  5. **Topic Selection**: Technical or educational topics, based on established pattern from features #045-049
  6. **Git Integration**: Added via conventional commit message format (e.g., `feat: Create test-ya14ob.md markdown file about <topic>`)
  7. **No Dependencies**: Pure documentation files with no code imports, external dependencies, or runtime requirements
  8. **File Size**: Minimal, typically 200-600 bytes including heading and content

  ### Relevant Technologies

  - **Markdown**: GitHub-Flavored Markdown (GFM) syntax for content authoring
  - **Git**: Version control system for file tracking, committing, and pushing
  - **File System**: Plain text files at repository root with UTF-8 encoding and LF line endings
  - **No Build/Test Infrastructure**: Unlike source code features, this requires no build tools, test runners, linters, or CI/CD pipeline modifications

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new `.md` file; no modifications, deletions, or renames to existing files |
  | Specs directory | None | Feature specification created beforehand; Requirements phase updates spec.yaml only |
  | Source code (`/src/sheep`) | None | No Python code, platform logic, modules, or dependencies affected |
  | Tests (`/tests`) | None | No test files created, modified, or deleted; purely a content-only feature |
  | CI/CD (`.github/workflows`) | None | No workflow changes, pipeline modifications, or automation updates required |
  | Build system (`pyproject.toml`) | None | No dependencies, configuration, or project settings modified |
  | Git history | Low | Single commit added with standardized conventional commit message; no force pushes, rebases, or merge commits |

  ## Dependencies

  - **Git repository**: Feature branch `feat/050-markdown-test-file-93468b` must exist (pre-created)
  - **File system**: Write access to repository root directory to create the new markdown file
  - **No external libraries**: Markdown files require no runtime dependencies, imports, or Python packages
  - **No code dependencies**: Feature does not depend on or impact any source code, configuration, or infrastructure
  - **No platform features**: Does not depend on CrewAI agents, tools, flows, or any Sheep platform components

  ## Size Estimate

  **S** (Small — 10-15 minutes) — This is a minimal-effort, single-file creation feature with clear, straightforward requirements based on five identical recent features (#045-049):

  - **Topic selection and outline**: ~2 minutes (choose a technical topic and outline 3 sentences)
  - **File creation**: ~3 minutes (write the markdown file with heading and content)
  - **Validation**: ~3 minutes (verify markdown syntax, file encoding is UTF-8, line endings are LF, file size is in range)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes

  This estimate is justified by:
  - Well-established pattern with five identical, recently completed features (#045-049) providing proven precedent
  - Fixed topic type (technical/educational) with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H2 heading + exactly 3 sentences)
  - No testing framework integration, CI/CD changes, documentation updates, or code modifications required
  - Clear success criteria that are straightforward to verify

