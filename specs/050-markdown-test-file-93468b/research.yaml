# Structured technology decisions
decisions:
  - title: 'Markdown Dialect Selection'
    chosen: 'GitHub-Flavored Markdown (GFM)'
    rejected:
      - 'CommonMark — more restrictive, lacks GFM extensions like tables and strikethrough. Repository uses GFM conventions; using CommonMark would diverge from established patterns.'
      - 'Standard Markdown — less feature-rich, inconsistent specification. Repository content and CI/CD systems expect GFM compatibility; deviating creates maintenance burden.'
    rationale: >
      GitHub-Flavored Markdown is the standard across the repository, evidenced by all 25+ existing test files
      rendering correctly on GitHub without warnings or errors. GFM provides a superset of standard Markdown with
      useful features (tables, strikethrough, autolinks, task lists) while maintaining backward compatibility.
      Repository CI/CD and documentation systems assume GFM; using it ensures compatibility and consistency.

  - title: 'File Encoding and Line Ending Standards'
    chosen: 'UTF-8 without BOM; LF (Unix-style) line endings'
    rejected:
      - 'UTF-16 or other encodings — wasteful for ASCII-heavy content, inconsistent with repository convention. Repository is 100% UTF-8 encoded.'
      - 'CRLF (Windows) line endings — conflicts with Git configuration (core.autocrlf=true). Repository enforces LF for Git consistency across platforms.'
    rationale: >
      Repository git configuration enforces `core.autocrlf=true`, which automatically converts CRLF to LF on commit.
      All 25+ existing test files use UTF-8 encoding without BOM and LF line endings. This standard is documented
      in the spec (NFR-1, NFR-2) and enforced by git; deviating creates unnecessary friction. UTF-8 without BOM is
      the modern web standard and works seamlessly with GitHub's Markdown renderer.

  - title: 'Markdown Heading Level'
    chosen: 'H2 (##) for file title heading'
    rejected:
      - 'H1 (#) — creates visual dominance and assumes this file will never be nested within a parent document. While existing test files may use H1, the specification explicitly requires H2 for proper document hierarchy.'
      - 'H3 (###) or deeper — unnecessarily subordinate for a file''s primary heading. Creates poor visual hierarchy and deviates from specification requirement.'
    rationale: >
      The feature specification explicitly resolves this question, requiring H2 (##) heading level. H2 provides
      optimal balance: prominent enough to be a clear title, but respects document nesting if the file is ever
      included in a parent document. This aligns with modern Markdown best practices where H2 is appropriate for
      section/file-level headings when H1 is reserved for document-level use.

  - title: 'Content Validation Approach'
    chosen: 'Automated validation on push via GitHub''s markdown renderer; manual spot-check during implementation'
    rejected:
      - 'Automated linting with markdown-cli or similar — adds pipeline complexity for a simple, well-understood format. Validation scope is small enough that manual review suffices.'
      - 'No validation — risks subtle syntax errors or encoding issues. Given the specification''s explicit success criteria, validation is necessary to confirm compliance.'
    rationale: >
      GitHub automatically renders markdown on push and displays warnings for syntax errors. For a simple H2 heading
      and 3 sentences, this catch-as-you-go approach is sufficient. Manual validation during creation (checking
      file size ~200-600 bytes, character count, sentence structure) is fast and ensures human review. No additional
      tooling is needed; repository conventions already provide adequate validation.

  - title: 'Git Workflow and Commit Strategy'
    chosen: 'Single commit to feature branch using conventional commits format (feat: ...), then push to remote'
    rejected:
      - 'Multiple commits — unnecessary complexity for a single-file creation. Single, atomic commit maintains clean git history.'
      - 'Interactive rebase or squashing — overkill for a straightforward feature. Spec explicitly requires single commit and linear history (NFR-7).'
    rationale: >
      The feature specification requires single commit (NFR-7), linear git history, and conventional commit format
      (e.g., `feat: Create test-ya14ob.md markdown file about <topic>`). This approach is consistent with features
      #045-049, which all used identical workflow. Conventional commits provide semantic meaning for changelog
      generation and code archaeology. Feature branch isolation prevents interference with main branch development.

