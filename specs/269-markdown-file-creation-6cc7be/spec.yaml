content: |
  ## Problem Statement

  Create a single markdown file at the repository root called `test-uh2jl0.md` containing:
  - An H1 title heading
  - A blank line
  - 2-3 sentences of prose content describing the file's purpose in the Sheep test suite
  - Proper UTF-8 encoding and Unix LF line endings

  This is feature 269 in a series of markdown file creation tasks (features 6-268) that test
  the Sheep automation platform's ability to generate well-formed content files following
  established conventions.

  ## Success Criteria

  - [ ] File `test-uh2jl0.md` exists at repository root
  - [ ] Line 1 contains exactly one H1 heading (single `#` followed by title text)
  - [ ] Line 2 is blank (no content or whitespace)
  - [ ] Lines 3+ contain exactly 2-3 sentences of prose content
  - [ ] Prose content is coherent and describes the file's purpose in the Sheep test suite
  - [ ] File uses UTF-8 encoding without byte-order mark (BOM)
  - [ ] File uses Unix LF line endings (not Windows CRLF)
  - [ ] File has trailing newline at end-of-file (EOF)
  - [ ] File is staged and committed with conventional commit message
  - [ ] Git commit message follows format: `feat(269): create markdown file test-uh2jl0.md with prose content`
  - [ ] No extraneous files created or modified
  - [ ] File content matches established markdown format from features 6-268

  ## Functional Requirements

  - **FR-1**: The markdown file must be created at the repository root with exact filename `test-uh2jl0.md`
  - **FR-2**: The file must start with an H1 heading on line 1 (single `#` followed by title text)
  - **FR-3**: The file must have a blank line on line 2 with no content or whitespace
  - **FR-4**: The file must contain prose content on lines 3 and beyond with exactly 2-3 sentences
  - **FR-5**: Prose content must be plain text with no markdown formatting, special characters, or code blocks
  - **FR-6**: The file must be added to git staging area and committed with a conventional commit message
  - **FR-7**: The conventional commit message must follow the pattern `feat(269): create markdown file test-uh2jl0.md with prose content`
  - **FR-8**: The file must use UTF-8 character encoding without byte-order mark (BOM)
  - **FR-9**: The file must use Unix LF line endings (single newline character) for all lines, not Windows CRLF
  - **FR-10**: The file must end with a newline character (no missing final newline)

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must use only Python standard library (pathlib, built-in file I/O) without external dependencies
  - **NFR-2**: File creation and formatting must follow the established pattern from features 6-268 for consistency
  - **NFR-3**: Prose content should be meaningful and self-describing, indicating the file's role in the Sheep platform's test suite
  - **NFR-4**: Implementation should be completed efficiently within the allocated time frame for a small (S) sized feature
  - **NFR-5**: The markdown format must be valid according to CommonMark specification

  ## Product Questions & AI Recommendations

  | Question | AI Recommendation | Rationale |
  | -------- | ----------------- | --------- |
  | What should the H1 title be? | Descriptive title (e.g., "Feature 269: Markdown File Test") | Descriptive titles follow documentation best practices and demonstrate the Sheep platform's ability to generate self-documenting content |
  | What topic should the prose cover? | Describe the file's purpose in the Sheep platform's test suite | Self-describing content makes the test file more meaningful and demonstrates contextual content generation capability |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The
  relevant structure:

  ```
  .
  ├── README.md                      # Platform documentation
  ├── pyproject.toml                 # Python 3.11+ project config
  ├── src/
  │   ├── create_markdown.py         # Markdown file creation utilities
  │   └── sheep/                     # Main platform code (agents, flows, tools)
  ├── specs/                         # Feature specifications (6-269)
  │   └── 269-markdown-file-creation-6cc7be/
  │       └── spec.yaml              # Feature specification
  ├── [400+ markdown files]          # Test files from features 6-268
  └── [Python scripts]               # Feature implementations
  ```

  The repository root is the target location for all markdown files in this feature series.

  ### Architecture Patterns

  1. **Feature-Driven Development**: Each numbered feature has:
     - Git feature branch: `feat/NNN-feature-name-hash`
     - Spec directory: `specs/NNN-feature-name-hash/spec.yaml`
     - Implementation code that creates the artifacts
     - Conventional commits for tracking

  2. **Markdown Format Convention**: All markdown files follow:
     ```
     # [Title]

     [2-3 sentences of prose]
     ```
     Established by features 6-268, with:
     - H1 heading on line 1
     - Blank line on line 2
     - Prose content (no formatting, just text)
     - Trailing newline at EOF
     - UTF-8 encoding without BOM

  3. **Git Workflow**: Features are committed with:
     ```
     feat(NNN): create markdown file [filename] with [content type]
     ```

  ### Relevant Technologies

  - **Python standard library**: `pathlib.Path` for file operations, basic I/O
  - **Markdown**: Plain-text format with H1 syntax (`# Title`)
  - **Git**: Version control and conventional commits (system-level dependency)

  The broader Sheep platform (CrewAI, Pydantic, Langfuse, LLMs) is not involved in
  this specific feature.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-uh2jl0.md` created here |
  | Git repository | Medium | One conventional commit records the file creation |
  | Specs directory (269-*) | Low | Spec documentation already in place |
  | Platform code | None | No changes to Sheep source code or agents |

  ## Dependencies

  - **Python standard library**: pathlib.Path for file operations, built-in file I/O
  - **Git**: System-level dependency for version control (already in use by the project)
  - **Existing conventions**: Markdown format pattern established in features 6-268

