content: |
  ## Architecture Overview

  This feature extends the well-established markdown-file-creation pattern (286+ precedents). The implementation is isolated to repository root and does not affect application source code (/src/sheep/), configuration, or test infrastructure.

  **Existing Pattern Context:**
  - 286+ test-*.md files in repository root demonstrate proven pattern
  - Straightforward, imperative code structure: create content string, write file
  - Standard git workflow: add, commit with conventional format, push to feature branch
  - No external dependencies; Python 3.11+ standard library sufficient

  **File Placement:**
  - Location: /test-14epwa.md (repository root, aligning with 286+ existing test files)
  - No new directories created
  - No impact on .gitignore or repository structure

  ## Key Design Decisions

  ### 1. File I/O: Use pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path.write_text(content)` with default UTF-8 encoding and LF line endings.

  **Alternatives Considered:**
  - `os.path` — legacy approach, less idiomatic in Python 3.11+
  - Raw `open()` — more verbose, requires explicit encoding parameters
  - Third-party I/O libraries — unnecessary external dependencies

  **Rationale:** pathlib.Path is the modern Python standard for file operations. Key benefits:
  - Automatically writes UTF-8 without BOM (platform-consistent default)
  - Produces LF line endings (\n) across all platforms
  - Atomic file creation operation
  - Zero imports beyond Python standard library
  - Aligns with established 286-file codebase pattern
  - Simple, readable syntax: `Path(filename).write_text(content)`

  **Reference:** Research finding — File I/O Implementation decision

  ### 2. Git Operations: Use subprocess CLI Commands

  **Decision:** Use `subprocess.run()` with git CLI commands (git add, commit, push).

  **Alternatives Considered:**
  - GitPython library — external dependency not used elsewhere, overkill for simple operations
  - `os.system()` — shell injection vulnerability, poor error handling
  - libgit2/Paramiko bindings — unnecessary complexity and multiple dependencies

  **Rationale:** subprocess.run() provides:
  - Safe command execution via command list (no shell injection risk)
  - Cross-platform portability (Windows, Linux, macOS)
  - Simple error handling via returncode checking
  - No external dependencies beyond Python standard library
  - Aligns with established git workflow pattern

  **Implementation Pattern:**
  ```
  subprocess.run(["git", "add", "test-14epwa.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(286): create markdown file..."], check=True)
  subprocess.run(["git", "push", "-u", "origin", "feat/286-markdown-file-creation-310757"], check=True)
  ```

  **Reference:** Research finding — Git Operations Implementation decision

  ### 3. Markdown Structure: H1 + Blank Line + 2-3 Sentences

  **Decision:** Use H1 heading (#) followed by blank line, then exactly 2-3 sentences of prose.

  **Specification Compliance:**
  - H1 heading with single `#` (FR-2)
  - Blank line between heading and prose (FR-3)
  - Exactly 2-3 sentences (FR-4)
  - CommonMark compliance (NFR-4)

  **Example Structure:**
  ```
  # Example Title

  First sentence about topic. Second sentence providing detail. Third sentence concluding thought.
  ```

  **File Size:** Natural outcome of H1 (10-20 bytes) + blank line (1 byte) + 2-3 sentences (300-500 bytes) = 400-600 bytes (meets NFR-3)

  ### 4. File Encoding: UTF-8 without BOM, LF Line Endings

  **Decision:** Use pathlib defaults: UTF-8 without BOM, LF line endings (\n).

  **Specification Compliance:**
  - UTF-8 without BOM required (NFR-1)
  - LF line endings required (NFR-2)
  - Cross-platform consistency

  **Rationale:** pathlib.Path.write_text() on Python 3.11+ automatically:
  - Uses UTF-8 without BOM as default encoding (platform-consistent)
  - Writes LF line endings (\n in Python strings) across all platforms
  - No explicit encoding or conversion required

  ### 5. Content: Predefined/Hardcoded Prose

  **Decision:** Use predefined, hardcoded prose content (resolved in spec openQuestion #1).

  **Rationale:**
  - Simplest implementation following straightforward imperative pattern
  - No external generation logic or dependencies required
  - Consistent, reliable, deterministic output
  - Aligns with 286+ existing test files pattern
  - Meaningful, grammatically correct sentences
  - Any topic allowed (nature, technology, science, philosophy, etc.)

  ## Implementation Strategy

  **Phase Ordering:**

  1. **Phase 1: File Creation (5 min)**
     - Write markdown content as string with H1 heading + 2-3 sentences
     - Use pathlib.Path.write_text() to create test-14epwa.md
     - Automatically ensures UTF-8 encoding, no BOM, LF line endings
     - Validation: verify file exists, contains correct content, meets spec requirements

  2. **Phase 2: Git Integration (5-10 min)**
     - Stage file: git add test-14epwa.md
     - Commit: git commit with conventional message
     - Push: git push to feature branch origin/feat/286-markdown-file-creation-310757
     - Validation: verify commit message, confirm push succeeded

  **Rationale for Ordering:**
  - File must exist before git operations can stage/commit it
  - Sequential ordering ensures clear, testable progression
  - No parallelization possible due to git dependency on file existence

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File encoding/line ending issues | Low | High | Use pathlib.Path.write_text() defaults which handle encoding/line endings automatically; validates against NFR-1 and NFR-2 |
  | Git credentials/authentication failures | Low | High | Assume git is configured with user.name/email; subprocess will surface auth errors clearly for diagnostics |
  | File already exists | Low | High | Pathlib.write_text() overwrites existing file; safe for test artifacts; validate file content after creation |
  | Git push to remote fails | Medium | Medium | Check network connectivity; verify branch exists (pre-created); fall back to diagnosing remote configuration |
  | Markdown syntax validation | Very Low | Low | Spec provides clear format (H1 + blank line + 2-3 sentences); CommonMark-compliant structure guaranteed by format |
  | File size out of range | Very Low | Low | Prose sentence structure naturally produces 400-600 byte range; unlikely to deviate if spec followed |
  | Non-UTF-8 encoding created | Very Low | High | pathlib defaults to UTF-8 without BOM; validate file encoding after creation if needed |

  ---

  **Status:** Planning phase complete — architecture decisions documented, implementation phases defined, risks identified. Ready for task breakdown and implementation.
