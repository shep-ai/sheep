  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-30
  - **Status:** Complete — all technical decisions validated and documented

  ## Technology Decisions

  ### 1. File I/O Implementation: pathlib.Path.write_text()

  **Chosen:** Use `pathlib.Path.write_text(content)` with default UTF-8 encoding

  **Rejected:**
  - `os.path` module — legacy approach, requires string manipulation, not idiomatic in Python 3.11+
  - Raw `open()` with explicit encoding — verbose, requires redundant encoding parameters
  - Third-party file I/O libraries — unnecessary external dependencies

  **Rationale:** pathlib is the modern Python standard library for file operations. `Path.write_text()` automatically:
  - Writes UTF-8 without BOM (Python default, cross-platform consistent)
  - Handles file creation atomically
  - Produces LF line endings (Python \n standard)
  - Requires zero imports beyond pathlib (standard library)
  - Aligns with established 286-file codebase pattern

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  content = "# Heading\n\n2-3 sentences of prose."
  Path("test-14epwa.md").write_text(content)
  ```

  ### 2. Git Operations: subprocess CLI Commands

  **Chosen:** Use `subprocess.run()` with git CLI (git add, commit, push)

  **Rejected:**
  - GitPython library — external dependency not used in project, overkill for simple operations
  - `os.system()` — less safe (shell injection vulnerability), poorer error handling
  - libgit2/Paramiko bindings — unnecessary complexity and dependencies

  **Rationale:** subprocess.run() provides:
  - Safe command execution without shell injection risk
  - Cross-platform portability (Windows, Linux, macOS)
  - Simple error handling via returncode checking
  - No external dependencies beyond Python standard library
  - Consistency with established git workflow pattern in 286+ features

  **Implementation Pattern:**
  ```python
  import subprocess

  subprocess.run(["git", "add", "test-14epwa.md"], check=True)
  subprocess.run([
    "git", "commit",
    "-m", "feat(286): create markdown file test-14epwa.md with title and prose content"
  ], check=True)
  subprocess.run([
    "git", "push", "-u", "origin", "feat/286-markdown-file-creation-310757"
  ], check=True)
  ```

  ### 3. Markdown Structure: H1 + Blank Line + 2-3 Sentences

  **Chosen:** H1 heading (`# Title`) + blank line + exactly 2-3 sentences of prose

  **Rejected:**
  - Other heading levels (##, ###) — spec requires H1 specifically
  - Single-line format without blank line — spec requires blank line separation
  - Alternative formats (reST, AsciiDoc, plain text) — spec constrains to markdown

  **Rationale:** Spec success criteria explicitly define:
  - H1 heading with single `#` (FR-2)
  - Blank line between heading and prose (FR-3)
  - Exactly 2-3 sentences (FR-4)
  - CommonMark compliance (NFR-4)

  This structure matches 286+ existing test files and is validated by CommonMark spec.

  **Example Structure:**
  ```markdown
  # Example Title

  First sentence about a topic. Second sentence providing detail. Third sentence concluding the thought.
  ```

  ### 4. File Encoding: UTF-8 without BOM, LF Line Endings

  **Chosen:** UTF-8 without BOM, LF line endings (automatic via pathlib defaults)

  **Rejected:**
  - UTF-8 with BOM — spec forbids (NFR-1), causes tool incompatibilities
  - CRLF line endings — spec forbids (NFR-2), breaks cross-platform compatibility
  - Other encodings (Latin-1, UTF-16, etc.) — spec forbids (NFR-1)

  **Rationale:** pathlib.Path.write_text() on Python 3.11+ automatically:
  - Uses UTF-8 without BOM as default encoding (platform-consistent)
  - Writes LF line endings (\n in Python strings) across all platforms
  - No explicit encoding or conversion required

  **File Size Analysis:**
  - H1 heading: ~10-20 bytes ("# Title\n")
  - Blank line: 1 byte ("\n")
  - Prose (2-3 sentences): ~300-500 bytes
  - **Total:** 400-600 bytes (natural outcome, meets NFR-3)

  ### 5. Content Generation: Predefined/Hardcoded Prose

  **Chosen:** Predefined, hardcoded prose content

  **Rejected:**
  - Dynamic generation (random sentences, topic selection, LLM generation) — adds complexity, unnecessary dependencies, non-deterministic behavior

  **Rationale:**
  - Aligns with straightforward, imperative pattern of 286+ existing test files
  - No external generation logic or dependencies required
  - Consistent, reliable, deterministic output
  - Simple to implement: single prose string variable
  - Matches spec resolution of openQuestion #1

  **Content Guidelines:**
  - Meaningful, grammatically correct sentences
  - Proper capitalization and punctuation
  - Any topic allowed (nature, technology, science, philosophy, communication, etc.)
  - 2-3 sentences exactly (approximately 300-500 bytes)

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib | File I/O (create markdown file) | **Use** | Part of Python standard library (3.11+); automatic UTF-8 encoding, LF line endings; idiomatic modern Python; no external dependency |
  | subprocess | Run git commands (add, commit, push) | **Use** | Part of Python standard library; safe command execution; cross-platform; no external dependency |
  | os.path | File path operations | **Reject** | Legacy API; less idiomatic in Python 3.11+; codebase uses pathlib pattern |
  | GitPython | Git operations via Python API | **Reject** | External dependency not used in project; unnecessary for simple add/commit/push; adds complexity |
  | uuid/random | Generate filename/content | **Reject** | Filename is pre-specified (test-14epwa.md); content is predefined; no random generation needed |
  | json/yaml | Data serialization | **Reject** | File is plain markdown text; no structured data serialization required |
  | requests/httpx | External API calls | **Reject** | No external API integration; file creation is local operation |

  ## Security Considerations

  **Attack Surface:** Minimal
  - File creation is local operation with no network access
  - Git operations use subprocess with list arguments (safe from shell injection)
  - No user input parsing or external data processing
  - No authentication or sensitive data handling

  **Encoding Safety:** UTF-8 without BOM meets security requirements
  - No BOM header prevents encoding detection issues
  - UTF-8 supports full Unicode safely
  - Consistent cross-platform behavior

  **Git Security:** subprocess with list args prevents injection
  - Command list format `["git", "add", "test-14epwa.md"]` is safe
  - No string interpolation or shell=True parameter
  - Conventional commit message is hardcoded (no variable injection)

  **File Permissions:** Standard file creation
  - Created with repository's default permissions (set by umask)
  - No special privilege escalation required
  - Standard read/write permissions appropriate for test artifact

  **Conclusion:** No security vulnerabilities identified. Simple file creation with standard git operations presents minimal risk.

