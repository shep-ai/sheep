  The repository's primary purpose is to serve as a test platform for the Sheep automated implementation
  system. The repository root contains a growing collection of test markdown files generated by feature
  implementations, each demonstrating successful completion of a simple, well-defined task.

  ### Architecture Patterns

  The Sheep platform follows a modular, agentic architecture:

  1. **Flow-Based Execution**: Features are executed through discrete phases (Analysis → Requirements → Implementation → Review → Submission)
  2. **Specification-Driven**: Each feature is guided by a detailed YAML specification document
  3. **Git-Integrated**: All changes are tracked in git with conventional commits
  4. **Declarative Tasks**: Clear success criteria and functional/non-functional requirements

  This feature follows the **Specification-Driven Implementation** pattern:
  - User provides a simple, natural-language request
  - Analysis phase examines the codebase and establishes specification
  - Implementation phase executes the task following the specification
  - All changes are validated against success criteria

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment; `pathlib.Path` module for file I/O
  - **Git**: Version control; used for staging, committing, and pushing changes
  - **Markdown**: Lightweight markup language for documentation and content
  - **Conventional Commits**: Commit message format specification (v1.0.0)
  - **Unix-style line endings (LF)**: Standard in open-source projects

