# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The implementation creates a standalone Python script that automates the complete workflow for
  feature 157. The script orchestrates four sequential stages:

  1. **Content Definition:** Define an H1 markdown heading and 2-3 sentences of prose (in code)
  2. **File Creation:** Use pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings
  3. **Validation:** Verify structure (H1 + blank line + prose), encoding (UTF-8, no BOM), line endings (LF), file size (400-600 bytes), and markdown syntax
  4. **Git Integration:** Stage file, commit with conventional message, push to remote branch

  This follows the established pattern from feature 156 (create_test_x1h34c.py, 267 lines) and aligns
  with the approach used in features 151-156 and 150+ existing test files in the repository.

  **Key principle:** Validate before committing. Each phase completes successfully before the next
  phase begins. Any validation failure aborts the script with a clear error message.

  ## Key Design Decisions

  ### 1. Python pathlib for File I/O
  **Chosen:** `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rationale:** FR-4 explicitly specifies using pathlib. The write_text() method is the idiomatic
  modern approach, automatically handling encoding and line ending management. Using `encoding='utf-8'`
  ensures UTF-8 without BOM (NFR-1). Using `newline='\n'` explicitly enforces Unix LF line endings
  (NFR-2), preventing platform-dependent CRLF issues on Windows systems. This is simpler and safer
  than manual open() or shell scripting approaches.

  ### 2. Static Prose Content Selected at Implementation Time
  **Chosen:** Embed static prose content directly in the script

  **Rationale:** The spec permits implementer freedom in topic selection. Writing 2-3 sentences on a
  topic of choice and embedding this as a fixed string constant matches the pattern of all 150+
  existing test-*.md files. This approach is simpler than dynamic/random generation, ensures perfect
  reproducibility, avoids external dependencies, and aligns with established repository conventions.

  ### 3. Comprehensive Validation Before Commit
  **Chosen:** Validate structure, encoding, line endings, file size, and syntax before git add

  **Rationale:** Success criteria specify exact requirements (H1 heading, blank line, 2-3 sentences,
  400-600 bytes, UTF-8, LF, valid markdown). Validating comprehensively before staging catches
  issues immediately with clear error messages. This prevents committing files that don't meet
  requirements. Pattern validated in feature 156 implementation.

  ### 4. Subprocess for Git Operations (No External Dependencies)
  **Chosen:** Use `subprocess.run()` with `shell=False` for git add, commit, and push

  **Rationale:** NFR-9 prohibits new external dependencies. The feature requires only three simple
  git operations which are best handled by direct CLI calls. Using `shell=False` prevents command
  injection vulnerabilities. Git CLI is universally available in all CI/deployment environments.
  This is the validated approach from features 151-156.

  ### 5. Conventional Commits v1.0.0 Format
  **Chosen:** `feat(157): Create markdown file test-19idn1.md with prose content`

  **Rationale:** NFR-6 explicitly requires Conventional Commits v1.0.0 format. The structure
  'feat(scope): subject' is required for automated changelog and release automation. The scope
  '157' links to the feature number, and the subject clearly describes the action. This format
  aligns with repository conventions and recent feature implementations.

  ## Implementation Strategy

  **Why this ordering?**

  Phase 1 comes first because all subsequent phases depend on having the content defined. We must
  know what will be written before we can validate it.

  Phase 2 (file creation and validation) is the "heart" of the feature. If file creation and
  validation succeed, the rest is straightforward. Validation happens immediately after creation,
  before any git operations, to catch errors early.

  Phase 3 (git integration) comes after file validation succeeds. This ensures we only commit and
  push files that meet all success criteria.

  Phase 4 integrates all previous phases and executes end-to-end. This is the final test that
  everything works together.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding or line ending corruption | Explicit UTF-8 encoding and newline='\\n' in write_text(); validate both before commit. Read file in binary mode to verify no BOM or CRLF. |
  | Git operations fail (missing git config, network, permissions) | Handle subprocess errors with try/except; provide clear error messages. Document required configuration (git user.name, user.email). |
  | File size outside 400-600 byte range | Validate file size immediately after creation; abort with error if out of range. Adjust prose content if needed. |
  | Invalid markdown structure | Validate H1 heading format, blank line, sentence count, and punctuation. Abort if structure doesn't match requirements. |
  | Accidental file overwrite | Check file doesn't exist before creation; abort with error if file already exists. Use unique filename (test-19idn1.md) that doesn't conflict. |
  | Subprocess command injection | Always use subprocess.run() with shell=False and explicit argument list, never with shell strings. Filename is generated, not user input. |
  | Incorrect sentence count or structure | Implement sentence parsing by splitting on [.!?] and validating count is 2-3. Check for complete sentences (no fragments). |

  ## Files

  **To Create:**
  - `create_test_19idn1.py` — Main implementation script with all phases (content, file creation, validation, git)

  **To Modify:**
  - None. The markdown file `test-19idn1.md` is created by the script at runtime, not manually edited.

  ## Dependencies

  **All satisfied by Python standard library; no external packages required:**
  - pathlib (file I/O)
  - subprocess (git operations)
  - os/sys (system operations)
  - re (optional, for sentence/markdown validation)

  ## Success Criteria

  Implementation is complete when:
  1. Script executes without errors
  2. File `test-19idn1.md` exists at repository root
  3. File contains exactly one H1 markdown heading
  4. File contains 2-3 complete sentences of prose
  5. File uses UTF-8 encoding without BOM
  6. File uses Unix LF line endings (not CRLF)
  7. File size is 400-600 bytes
  8. File contains valid markdown syntax
  9. File is staged in git
  10. File is committed with the exact conventional commit message
  11. Commit is pushed to remote branch `feat/157-markdown-file-creation-b9d0e7`
  12. No other files created or modified
