# Markdown content (the full tasks document)
content: |
  ## Summary

  The implementation consists of 7 tasks across 4 phases, totaling approximately 2 hours 10 minutes:

  **Phase 1 (Setup & Content):** Task 1 creates the script skeleton and defines the prose content.
  This establishes what will be written to the markdown file.

  **Phase 2 (File & Validation):** Tasks 2-3 implement file creation using pathlib with proper
  encoding/line endings, and comprehensive validation that checks structure, encoding, file size,
  and markdown syntax before proceeding. This ensures the file meets all non-functional requirements.

  **Phase 3 (Git Integration):** Tasks 4-5 implement git workflow: staging the file, creating a
  conventional commit message, and pushing to the remote branch. Errors are handled gracefully
  with clear messages.

  **Phase 4 (Integration & Verification):** Tasks 6-7 wire together all phases in main() and
  execute the complete script end-to-end, verifying all 11 success criteria from the spec are met.

  **Key ordering:** Content definition → file creation → validation → git operations → integration →
  execution. Each task builds on previous ones with clear dependencies. All tasks use TDD cycles
  (RED-GREEN-REFACTOR) to ensure correctness through test-first development.
