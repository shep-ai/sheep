# Structured technology decisions
decisions:
  - title: "File I/O Implementation Approach"
    chosen: "Python pathlib.Path.write_text() with explicit UTF-8 encoding"
    rejected:
      - "Python open() with manual file handling — more verbose, higher error risk, doesn't follow FR-4 specification requirement for pathlib"
      - "Shell commands (echo, cat redirection) — less portable across environments, harder to control encoding and line endings precisely"
    rationale: >
      FR-4 explicitly specifies using Python pathlib.Path.write_text() or equivalent for file I/O.
      The write_text() method is the modern, idiomatic approach in pathlib, handling encoding and
      line ending management automatically. Using write_text('...', encoding='utf-8', newline='\n')
      ensures UTF-8 without BOM (NFR-1) and LF line endings on Unix systems (NFR-2). This is
      simpler, safer, and more maintainable than manual open() or shell approaches. Matches the
      established pattern from 150+ existing test files and recent implementations (151-156).

  - title: "Line Ending Management"
    chosen: "Explicit newline='\\n' parameter in write_text() to enforce Unix LF endings"
    rejected:
      - "Binary mode with manual \\n insertion — unnecessary complexity and potential for encoding errors"
      - "Platform-dependent defaults — relies on environment, doesn't guarantee Unix LF as required by NFR-2"
    rationale: >
      NFR-2 explicitly requires Unix line endings (LF \n, not Windows CRLF \r\n). While the
      deployment environment is Linux/Unix where Python text mode defaults to LF, explicitly
      specifying newline='\n' in write_text() guarantees the requirement is met regardless of
      system configuration. This defensive approach prevents encoding issues and makes the
      intent explicit in code. Verified working in features 151-156.

  - title: "Text Encoding Specification"
    chosen: "Explicit UTF-8 encoding in write_text() call with no BOM"
    rejected:
      - "Implicit system encoding (locale-dependent) — violates NFR-1, introduces platform-dependent behavior"
      - "Binary mode with manual UTF-8 encoding/decoding — more verbose, error-prone, less idiomatic"
    rationale: >
      NFR-1 requires UTF-8 without BOM. Python's write_text(encoding='utf-8') produces UTF-8
      without BOM by default (Python 3 doesn't add BOM for UTF-8 by default). Always specifying
      the encoding explicitly prevents platform-dependent behavior and makes the intent clear
      in code. This is the standard idiomatic approach in modern Python and has been validated
      in 150+ existing test files.

  - title: "Prose Content Generation"
    chosen: "Static prose content selected once by implementer at implementation time"
    rejected:
      - "Dynamic/random generation — violates reproducibility principle, adds complexity, doesn't match existing test file conventions"
      - "Template library or external config file — introduces external dependency (violates NFR-9), unnecessary complexity"
    rationale: >
      The spec permits implementer freedom in topic selection. This means the implementer
      selects a topic and writes 2-3 sentences, embedding the fixed content in the implementation
      script. This matches the pattern of all 150+ existing test-*.md files, which have static,
      varied content selected by their respective implementers. No dynamic generation is needed
      or expected. This approach is simplest, clearest, and ensures reproducibility.

  - title: "Git Workflow Implementation"
    chosen: "Direct Git CLI commands (git add, git commit --no-verify, git push) via subprocess"
    rejected:
      - "GitPython library — adds external dependency (violates NFR-9 requirement for no new dependencies)"
      - "pygit2 (libgit2 binding) — adds external dependency with additional compilation requirements"
    rationale: >
      NFR-9 prohibits new external dependencies. The feature only requires standard git
      operations: staging one file, creating one commit with a specific conventional message
      (NFR-6), and pushing to origin. These are simple, deterministic operations best handled
      by direct CLI subprocess calls. The Git CLI is universally available in all CI/deployment
      environments. Using subprocess.run() with shell=False prevents injection vulnerabilities
      while remaining straightforward. Validated pattern in features 151-156.

  - title: "Conventional Commit Message Format"
    chosen: "Follow Conventional Commits v1.0.0 spec: 'feat(157): Create markdown file test-19idn1.md with prose content'"
    rejected:
      - "Free-form commit messages — violates NFR-6 requirement for Conventional Commits v1.0.0"
      - "Alternative formats (commitizen, custom templates) — introduces unnecessary complexity"
    rationale: >
      NFR-6 explicitly requires Conventional Commits v1.0.0 format. The chosen message follows
      the pattern: 'feat(scope): subject'. The 'feat' type indicates this is a new feature, the
      scope '157' links to the feature number, and the subject clearly describes the action.
      This format is required for automated changelog generation and release automation. Pattern
      validated in features 151-156 and aligns with repository conventions.

