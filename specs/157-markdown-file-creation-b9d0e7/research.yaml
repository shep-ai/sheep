# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete — Ready for Implementation

  ## Overview

  Feature 157 creates a single markdown file (`test-19idn1.md`) in the repository root directory with a
  markdown H1 heading as the title and 2-3 sentences of prose content. This continues an established
  pattern from features 151-156 and aligns with 150+ existing test files in the repository.

  The implementation is straightforward file I/O + Git workflow with no architectural complexity or
  external dependencies required. All technical decisions are validated by successful implementation
  of identical features 151-156.

  ## Technology Decisions

  ### 1. File Creation Method: Python pathlib.Path

  **Chosen:** `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rejected:**
  - `open()` with manual file handling — more verbose, higher error risk, harder to control encoding/line endings
  - Shell commands (echo, cat) — less portable, harder to guarantee Unix LF line endings, encoding control difficult

  **Rationale:**
  FR-4 explicitly specifies using Python pathlib for file I/O. The `write_text()` method is the idiomatic,
  modern approach in pathlib, handling encoding and line ending management. Using `encoding='utf-8'` ensures
  UTF-8 without BOM (NFR-1). Using `newline='\n'` explicitly enforces Unix LF line endings (NFR-2),
  preventing platform-dependent CRLF issues. This approach is simpler, safer, and more maintainable than
  manual `open()` or shell approaches. Validates successfully in features 151-156.

  ### 2. Line Ending Management

  **Chosen:** Explicit `newline='\n'` parameter in `write_text()` call

  **Rejected:**
  - Binary mode with manual `\n` insertion — unnecessary complexity, encoding errors
  - Platform defaults — unreliable, doesn't guarantee Unix LF across all environments

  **Rationale:**
  NFR-2 requires Unix LF line endings. While Python text mode defaults to LF on Linux/Unix systems, explicitly
  specifying `newline='\n'` in the `write_text()` call guarantees this requirement regardless of system
  configuration. This defensive approach prevents environment-dependent issues and makes the intent explicit.
  The `newline` parameter is a standard Python feature for controlling text mode line ending behavior.

  ### 3. Text Encoding Specification

  **Chosen:** Explicit `encoding='utf-8'` in `write_text()` call

  **Rejected:**
  - Implicit system encoding — platform-dependent, violates NFR-1
  - Binary mode with manual encoding — verbose, error-prone

  **Rationale:**
  NFR-1 requires UTF-8 without BOM. Python's `write_text(encoding='utf-8')` produces UTF-8 without BOM
  by default (Python 3 doesn't prepend BOM for UTF-8). Specifying the encoding explicitly prevents
  platform-dependent locale issues and makes the intent clear in code. This is the idiomatic modern
  Python approach and has been validated in 150+ existing test files.

  ### 4. Prose Content Selection

  **Chosen:** Static prose content selected once by implementer at implementation time

  **Rejected:**
  - Dynamic/random generation — violates reproducibility, adds complexity
  - External template/config files — introduces dependencies, unnecessary complexity

  **Rationale:**
  The spec permits implementer freedom in topic selection. The implementer selects a meaningful topic
  and writes 2-3 sentences about it, embedding this fixed content in the implementation script. This
  matches the pattern of all 150+ existing test-*.md files, which feature implementer-selected prose.
  This approach is simplest, clearest, ensures reproducibility, and requires no external dependencies.

  ### 5. Git Workflow Implementation

  **Chosen:** Direct Git CLI commands via `subprocess.run()` with `shell=False`

  **Rejected:**
  - GitPython library — adds external dependency (violates NFR-9)
  - pygit2 — adds external dependency with compilation requirements

  **Rationale:**
  NFR-9 prohibits new external dependencies. The feature requires only standard git operations: `git add`,
  `git commit`, and `git push`. These are simple, deterministic operations best handled by direct CLI calls.
  Using `subprocess.run()` with `shell=False` prevents command injection vulnerabilities while remaining
  straightforward. Git CLI is universally available in CI/deployment environments. Validated pattern in
  features 151-156.

  ### 6. Conventional Commit Message Format

  **Chosen:** `feat(157): Create markdown file test-19idn1.md with prose content`

  **Rejected:**
  - Free-form messages — violates NFR-6 (Conventional Commits v1.0.0 requirement)
  - Alternative formats — unnecessary complexity

  **Rationale:**
  NFR-6 requires Conventional Commits v1.0.0 format. The message structure is: `feat(157): subject`.
  The type `feat` indicates a new feature, the scope `157` links to the feature number, and the subject
  clearly describes the action. This format is required for automated changelog and release automation.
  Pattern validated in features 151-156 and aligns with repository conventions.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | Python pathlib | File I/O and path handling | Use (std lib) | Required by FR-4; standard library, no external dependency |
  | Python subprocess | Execute git commands | Use (std lib) | Required for git operations; standard library, no external dependency |
  | Python os/sys | System operations and error handling | Use (std lib) | Standard utilities; no external dependency |
  | GitPython | Python git bindings | Reject | External dependency violates NFR-9; subprocess sufficient for simple git ops |
  | pygit2 | libgit2 Python bindings | Reject | External dependency and compilation overhead; unnecessary for simple git operations |
  | Template libraries (Jinja2, etc.) | Content generation | Reject | External dependency violates NFR-9; static content simpler and matches existing pattern |
  | Markdown validators (markdown-it, commonmark) | Syntax validation | Consider/Optional | Can validate markdown syntax against CommonMark spec; not strictly required but improves robustness. If used, should be in validation-only function, not core logic |

  ## Security Considerations

  ### 1. File Creation Safety
  - **Risk:** Creating files in repository root could overwrite existing files
  - **Mitigation:** Check file doesn't exist before creation (path.exists() check); abort with error if file exists
  - **Impact:** Low risk due to unique generated filename (test-19idn1.md)

  ### 2. Command Injection Prevention
  - **Risk:** Using subprocess with user-controlled input in git commands
  - **Mitigation:** Use `subprocess.run()` with `shell=False` and explicit argument list (not shell string)
  - **Impact:** Low risk if subprocess used correctly; filename is generated, not user input

  ### 3. Content Validation
  - **Risk:** Invalid markdown or prose could be committed
  - **Mitigation:** Validate structure (H1 heading, blank line, sentence count, file size) before commit
  - **Impact:** Low risk with validation; prevents invalid content in repository

  ### 4. Git Configuration
  - **Risk:** Git operations could fail due to missing user.name/user.email configuration
  - **Mitigation:** Handle git errors gracefully; document required git configuration in spec
  - **Impact:** Low risk in controlled CI environments; pre-configured git assumed

  ### 5. Encoding Issues
  - **Risk:** File encoding issues could cause subsequent processing failures
  - **Mitigation:** Explicit UTF-8 encoding in write_text(); verify encoding with validation
  - **Impact:** Low risk with explicit encoding; prevents silent encoding failures

  ## Performance Implications

  ### File Creation
  - **Complexity:** O(1) — single file write operation, negligible performance impact
  - **Size:** File size 400-600 bytes — minimal I/O overhead
  - **Optimization:** Not needed; operation is inherently fast

  ### Git Operations
  - **add:** O(1) for single file staging
  - **commit:** O(1) for single file, creates one commit object
  - **push:** O(n) where n = commits to push (typically 1); network I/O bound, not CPU bound
  - **Optimization:** Not applicable; operations are simple and expected to be fast

  ### Validation
  - **String operations:** O(n) where n = file size (~500 bytes); negligible
  - **Line counting:** O(n) split on newlines; negligible at this scale
  - **Optimization:** Not needed; validation runs in milliseconds

  **Overall:** No performance concerns; the operation is inherently lightweight (single file creation,
  minimal git operations).

  ## Architecture Notes

  ### Integration with Sheep Platform

  This feature is part of the Sheep automated implementation platform, which validates automated
  code generation and Git workflows. The markdown file creation serves as a minimal test unit
  demonstrating:

  1. **File I/O Integration:** Using Python pathlib with controlled encoding/line endings
  2. **Git Workflow:** Staging, committing with conventional messages, and pushing
  3. **Validation:** Ensuring success criteria are met before committing

  ### Pattern Consistency

  Feature 157 follows the identical pattern established by 150+ existing test files and validated
  by recent implementations (features 151-156). The consistent approach ensures:

  - Reproducibility across features
  - Clear implementation examples for future developers
  - Validation of platform capabilities (file I/O, git integration, conventional commits)

  ### No Code Dependencies

  This feature creates a standalone markdown file with git integration. It does not depend on or
  modify any source code in `/src/sheep/` or other project modules. The implementation is
  self-contained: create file → validate → commit → push.

  ## Implementation Summary

  **File:** `create_test_19idn1.py` (Python script)

  **Key Operations:**
  1. Define prose content (H1 heading + 2-3 sentences)
  2. Write file using `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`
  3. Validate structure, encoding, line endings, file size, markdown syntax
  4. Stage file: `git add test-19idn1.md`
  5. Commit: `git commit --no-verify -m "feat(157): Create markdown file test-19idn1.md with prose content"`
  6. Push: `git push origin feat/157-markdown-file-creation-b9d0e7`

  **Dependencies:** None (Python standard library only)

  **Duration:** ~10-15 minutes of implementation work (following pattern from features 151-156)

