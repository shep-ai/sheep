# Structured technology decisions
decisions:
  - title: 'File Creation Method'
    chosen: 'Direct Python file I/O with explicit UTF-8 encoding'
    rejected:
      - 'GitPython file utilities — Adds unnecessary dependency complexity for a simple write operation; native Python is simpler and more portable'
      - 'Subprocess shell commands — Less reliable across platforms; harder to control encoding and line endings; more overhead for single file creation'
    rationale: >
      Python''s built-in `open()` function with `encoding="utf-8"` and `newline=""` parameters
      is the most straightforward approach. It provides precise control over encoding and
      line endings without adding external dependencies. This aligns with the principle of
      using built-in tools for simple operations and reserves external libraries for
      complex tasks. The Sheep codebase can use existing file_tools.py utilities if agents
      are performing this, but direct file I/O is equally valid.

  - title: 'Line Ending Handling'
    chosen: 'Use Python''s newline="" parameter with explicit LF (\n) in content'
    rejected:
      - 'Platform-default line endings — Would produce CRLF on Windows, violating the NFR-2 requirement for LF line endings'
      - 'Post-write conversion tools (dos2unix) — Adds complexity and external tooling; fragile across platforms; should be handled at write time'
    rationale: >
      When opening files in Python with `newline=""` (binary mode for newlines), the file
      I/O layer performs no line ending translation. Writing explicit `\n` characters
      ensures LF line endings on all platforms (Windows, macOS, Linux). This is the
      standard Python approach recommended in PEP 3116 and guarantees compliance with
      NFR-2 without post-processing. More reliable than platform-based conversion.

  - title: 'Git Integration for Staging and Committing'
    chosen: 'Use subprocess to run git commands (git add, git commit, git push)'
    rejected:
      - 'GitPython library — Adds external dependency; overkill for simple staging/commit operations; requires understanding of library API'
      - 'Manual git operations via Sheep''s existing agents framework — More complex; requires agent orchestration overhead for a one-file operation'
    rationale: >
      Subprocess calls to `git add`, `git commit`, and `git push` are simpler and more
      transparent than GitPython. They avoid adding dependencies and clearly show what
      operations are being performed. The standard git CLI is installed in all development
      and CI/CD environments where this code will run. If agents are orchestrating this,
      Sheep''s existing git_tools.py module can provide a wrapper; subprocess is the
      underlying implementation recommendation.

  - title: 'Markdown Syntax Validation'
    chosen: 'Manual verification only; no automated markdown parser library'
    rejected:
      - 'Use markdown or commonmark libraries — Adds runtime dependency; overkill for validation of a simple 4-line file (heading + 3 sentences); minimal value for cost'
      - 'Use markdownlint or remark tools — Linters are useful for projects with hundreds of markdown files; unnecessary for single file creation with straightforward format'
    rationale: >
      The requirement is simple: one H1 heading and three sentences. This can be validated
      by inspection in seconds. The CommonMark spec is straightforward for this use case.
      Adding a markdown parser library (~100-200KB dependency) for validation of 4 lines of
      content is disproportionate. If extensive markdown validation becomes a pattern in
      the Sheep project later, a shared linting solution can be added; for a one-off file,
      manual verification is appropriate.

  - title: 'Content Generation Approach'
    chosen: 'Use fixed, pre-written content (no procedural generation)'
    rejected:
      - 'Use CrewAI agents with LLM to generate content — Adds orchestration complexity; slower (requires LLM inference); unnecessary for simple, straightforward prose; overkill for this feature scope'
      - 'Use template variables and variable substitution — Premature abstraction; templates are useful for files with many variations; a single file does not justify template overhead'
    rationale: >
      The feature requires "2-3 sentences about anything" with no constraints on topic or
      style. Pre-written content (e.g., "Introduction to Cloud Computing," "Principles of
      Software Design") meets all requirements immediately. Content generation via LLM
