      POSIX-compliant text files should end with a newline character (LF). This is the
      standard across Unix, Linux, macOS, and modern development tools. A trailing newline
      improves diff readability (git diff will show the file properly), ensures proper
      file concatenation if the file is ever included in others, and matches the output of
      most text editors. This is the standard practice in the Sheep codebase and in most
      open-source projects.

