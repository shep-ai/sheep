      I/O is thoroughly tested; trusting it is appropriate. This approach is fastest and
      simplest while meeting all requirements.

  - question: 'Should the file include a trailing newline after the last sentence (POSIX compliance), or exactly as content is written?'
    resolved: true
    options:
      - option: 'Include trailing newline (POSIX best practice)'
        description: 'Add a final \n at end of file. POSIX requires text files to end with newline. Matches most code editors and Unix conventions. Slightly better for diffs and concatenation.'
        selected: true
      - option: 'No trailing newline (content-as-is)'
        description: 'End with the last character of the final sentence, no newline. Technically valid but non-standard; may cause diff rendering issues; violates POSIX standard for text files.'
