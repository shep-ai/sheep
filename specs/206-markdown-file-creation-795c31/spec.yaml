content: |
  ## Problem Statement

  Create a single markdown file named `test-h0kp6a.md` in the repository root directory
  containing a markdown H1 title and either 2 or 3 sentences of grammatically correct content
  on any topic. This continues the series of similar file creation tasks implemented in features 200-205,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic file creation
  workflows following established patterns and conventions.

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-h0kp6a.md` in the repository root directory
  - **FR-2**: File must contain exactly one valid markdown H1 title (single `#` followed by title text and newline)
  - **FR-3**: File must contain exactly 2 or exactly 3 grammatically complete sentences (each ending with a period)
  - **FR-4**: Sentences must be separated from the title by a blank line and from each other by single spaces or newlines
  - **FR-5**: All file content must follow markdown syntax conventions (valid UTF-8, proper spacing, no syntax errors)
  - **FR-6**: Stage the new file in Git using `git add` with the correct file path
  - **FR-7**: Create a commit with a conventional commit message following the format: `feat(206): [short description]`
  - **FR-8**: Push the commit to the remote branch `feat/206-markdown-file-creation-795c31` using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors (e.g., GitHub, CommonMark)
  - **NFR-4**: Git commit message must follow conventional commits specification (feat scope, lowercase body)
  - **NFR-5**: Implementation must follow patterns and conventions established in features 200-205 (feature module, validation functions, proper error handling)
  - **NFR-6**: No external dependencies or build steps required beyond existing project infrastructure (Git, file I/O, Claude API)
  - **NFR-7**: Implementation should be deterministic; content generation must use Claude API with temperature=0 for consistency
  - **NFR-8**: File size must be within reasonable range (approximately 250-600 bytes, allowing for variation in sentence length)
  - **NFR-9**: Implementation must include comprehensive validation with clear error messages on failure
  - **NFR-10**: All functions must have proper logging via `sheep.observability.logging.get_logger()`

  ## Success Criteria

  - [ ] File `test-h0kp6a.md` exists at repository root after execution
  - [ ] File contains exactly one H1 markdown title at the beginning (pattern: `# [Title Text]`)
  - [ ] File contains exactly 2 or exactly 3 grammatically complete sentences after the title
  - [ ] Each sentence ends with a period and is separated from others by space or newline
  - [ ] No markdown syntax errors in file
  - [ ] File renders correctly when processed by standard markdown tools
  - [ ] File is staged and committed with conventional commit message `feat(206): [description]` (verified by `git log`)
  - [ ] Commit is pushed to remote branch `feat/206-markdown-file-creation-795c31` (verified by `git branch -r`)
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are LF (no CRLF)
  - [ ] File size is between 200-700 bytes
  - [ ] Implementation uses feature module pattern matching features 200-205
  - [ ] Implementation includes dedicated validation functions (not inline checks)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the file contain exactly 2 sentences, exactly 3 sentences, or either 2 or 3 sentences? | Either 2 or 3 sentences | Matches the original \"2-3\" specification phrasing, consistent with features 200-205, and provides implementation flexibility. |
  | 2 | What content topics are acceptable for the file? | Any topic | Aligns with \"on any topic\" in requirements, matches previous feature patterns, and simplifies implementation. |
  | 3 | How strictly should we validate prose content vs. accepting any grammatically correct sentences? | Accept any grammatically correct sentences | Simplest to implement, aligns with straightforward nature of the feature, matches previous patterns. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root Directory** - Contains markdown files created by feature tasks (200+ test-*.md files plus topic markdown files like ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **src/sheep/** - Main Python package with:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management for LLM providers
    - `flows/` - Flow orchestration for the code implementation pipeline
    - `observability/` - Logging and Langfuse integration
    - `tools/` - Git and file operation tools
    - `cli.py` - CLI entry point
  - **src/sheep/features/** - Feature-specific implementation modules (one module per feature)
  - **specs/** - Feature specifications in YAML format (206+ specs with markdown auto-generation)
  - **tests/** - Python test files
  - **.github/** - GitHub workflows and CI/CD configuration
  - **Dockerfile** - Docker configuration for containerized execution

  ### Architecture Patterns

  The Sheep platform uses a **Flow-based architecture** with specialized agents:

  1. **Separation of Structure and Intelligence**
     - Flows define execution structure and control paths
     - Crews provide autonomous AI decision-making
     - Each crew is a specialized unit invoked at specific flow steps

  2. **Agent-Based Design**
     - Research agent - analyzes codebase and project context
     - Implementation agent - writes code following conventions
     - Review agent - validates changes for quality and correctness

  3. **Feature Module Pattern**
     - Each feature has a dedicated Python module (e.g., `feature_206_markdown_file_creation.py`)
     - Modules implement complete workflow: generation, validation, git operations
     - Functions are organized by responsibility: generation, validation, git operations
     - Comprehensive error handling and logging throughout

  4. **Git-Integrated Workflows**
     - Automatic branch creation and management
     - Support for git worktrees for isolated development
     - Full commit/push automation with conventional commit messages

  ### Relevant Technologies

  - **Python** - Primary implementation language (3.10+)
  - **CrewAI** - Multi-agent orchestration framework for task execution
  - **Langfuse** - Observability and execution tracing (optional but configured)
  - **Git** - Version control and change management
  - **Markdown** - Documentation format for file content
  - **Claude API** (Anthropic) - LLM for deterministic content generation with temperature=0

  ### Implementation Infrastructure

  - **LLM Factory** - `sheep.config.llm.create_llm()` creates LLM instances with configurable temperature
  - **Logging** - Structured logging via `sheep.observability.logging.get_logger()`
  - **Pathlib** - Modern Python file operations with proper encoding handling
  - **Subprocess** - Git command execution with proper error handling

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | This feature creates a markdown file (test-h0kp6a.md) directly in the repository root, following the pattern established by previous 205 test markdown files |
  | src/sheep/features/ | High | New feature module (feature_206_markdown_file_creation.py) will be created following the established pattern from features 200-205 |
  | Git Workflow | Medium | New file must be committed with conventional commit message (feat(206): ...) and pushed to remote branch |
  | specs/ | Low | Spec documentation already created; no code changes needed |

  ## Dependencies

  **No external dependencies required beyond existing project infrastructure.** This feature depends on:

  1. **Git** - For committing and pushing the new file
  2. **File I/O** - Standard file creation via pathlib.Path (built-in)
  3. **Markdown format** - Plain text markdown, no special libraries needed
  4. **Claude API** - Via existing `sheep.config.llm.create_llm()` for deterministic content generation
  5. **Existing repository structure** - Uses established root directory convention
  6. **Logging infrastructure** - Via `sheep.observability.logging`

  ## Size Estimate

  **S** (Hours) — This is a straightforward file creation task requiring minimal effort.
  The implementation involves:

  1. Create feature module (feature_206_markdown_file_creation.py) following the established pattern from features 200-205
  2. Implement content generation using Claude API with temperature=0 (copy/adapt from feature 205)
  3. Implement comprehensive validation functions (file existence, markdown format, sentence count, encoding, line endings, file size)
  4. Implement git operations (add, commit, push)
  5. Create main orchestration function coordinating all steps

  No code modification to existing files, no new dependencies, no complex integration.
  Estimated effort: 1-2 hours including testing and validation.

  ---

  _Analysis phase completed — ready for requirements phase_
