content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-25
  - **Status:** Ready for Implementation

  ## Architecture Overview

  Feature 206 follows the established **Feature Module Pattern** from features 200-205:

  ### Module Structure
  ```
  src/sheep/features/feature_206_markdown_file_creation.py
  ├── Module docstring (purpose, scope, approach)
  ├── Constants
  │   ├── FILENAME = "test-h0kp6a.md"
  │   ├── FEATURE_NUMBER = 206
  │   ├── BRANCH_NAME = "feat/206-markdown-file-creation-795c31"
  │   ├── COMMIT_MESSAGE = "feat(206): Create markdown file test-h0kp6a.md"
  │   ├── TITLE_TEXT (H1 title for the markdown file)
  │   └── PROSE_CONTENT (2-3 sentences about a technical topic)
  ├── Content Creation (create_markdown_file)
  ├── Validation Functions (8 dedicated validators + orchestrator)
  ├── Git Operations (add, commit, push)
  └── Main Orchestration (coordinates all phases)
  ```

  ### Validation Function Pipeline
  Feature 206 implements comprehensive validation with dedicated single-purpose functions:

  1. **verify_file_exists()** — Ensures file exists at expected path
  2. **validate_markdown_format()** — Verifies H1 heading, blank line separator, prose structure
  3. **extract_prose_content()** — Helper to extract prose from markdown
  4. **count_sentences()** — Counts sentences using period counting
  5. **validate_sentence_count()** — Ensures exactly 2-3 sentences
  6. **validate_encoding()** — Verifies UTF-8 encoding without BOM
  7. **validate_line_endings()** — Ensures Unix LF line endings only
  8. **validate_file_size()** — Validates file size in 250-600 byte range
  9. **validate_markdown_file()** — Orchestrator running all validators in sequence with fail-fast behavior

  ### Integration with Sheep Platform

  - **Feature Module Pattern**: Matches all features 200-205 for consistency
  - **Logging Infrastructure**: Uses `sheep.observability.logging.get_logger(__name__)` at all phases
  - **Error Handling**: Structured fail-fast with clear error messages for debugging
  - **Git Workflow**: Follows standard Sheep flow: create → validate → commit → push
  - **Determinism**: Hard-coded content ensures identical output on repeated execution

  ## Key Design Decisions

  ### 1. Content Generation: Hard-coded Prose (Feature 205 Pattern)
  **Chosen**: Hard-coded prose embedded directly in Python module
  **Why**: Matches feature 205 evolved best practice, provides faster execution (no API latency), eliminates network failure points, and guarantees deterministic output. Specification allows "any topic" and "any grammatically correct sentences," removing need for API-generated prose.

  ### 2. Validation Architecture: Dedicated Single-Purpose Validators
  **Chosen**: Comprehensive pipeline with 8 dedicated validators + orchestration function
  **Why**: Enables unit testing of individual validators, provides clear error diagnostics, supports maintainability, follows established codebase pattern (features 203-205). Each validator has one clear responsibility.

  ### 3. File Path Resolution: Relative Pathlib
  **Chosen**: Use pathlib.Path with relative paths from repository root
  **Why**: Aligns with all features 200-205, works naturally with git operations, leverages Python standard library, automatically handles cross-platform line endings.

  ### 4. Git Operations: Direct subprocess.run() with shell=False
  **Chosen**: Direct subprocess calls with security hardening (shell=False)
  **Why**: Prevents command injection vulnerabilities, provides clear control flow with check=True, enables output logging via capture_output=True, matches established pattern across all features.

  ### 5. Sentence Detection: Period Counting
  **Chosen**: Simple period counting (prose.count("."))
  **Why**: Proven effective in features 203-205, directly matches specification requirement ("sentences end with period"), requires no external dependencies, works correctly for typical prose.

  ### 6. Error Handling & Logging: Structured Fail-Fast with sheep.observability.logging
  **Chosen**: Comprehensive logging at all phases with fail-fast error propagation
  **Why**: Enables debugging with clear error context, supports specification requirement for "clear error messages on failure," matches established pattern in features 203-205.

  ## Implementation Strategy

  ### Phase 1: Module Foundation & Validation Framework (45-60 min)
  Build the complete validation infrastructure first, independent of file creation. This allows validation to be tested against any input file. Tasks include:
  - Create module skeleton with constants and docstring
  - Implement all 8 validation functions with comprehensive error messages
  - Implement validation orchestrator (validate_markdown_file)

  **Rationale**: Validation functions have no external dependencies beyond pathlib and can be developed and tested in isolation. Having this complete early enables confidence in the validation pipeline.

  ### Phase 2: Content Creation & Git Integration (45-60 min)
  Once validation is solid, add file creation and git operations. Tasks include:
  - Implement create_markdown_file() with hard-coded prose
  - Implement git operations (add, commit, push)
  - Implement main orchestration function

  **Rationale**: File creation and git operations can leverage completed validation functions. Main orchestration coordinates all pieces into a working workflow.

  ### Phase 3: Testing & Verification (30-45 min)
  Execute the complete workflow and verify success criteria. Tasks include:
  - Run feature end-to-end
  - Verify all validation checks pass
  - Confirm git operations succeeded
  - Review file properties and git log

  **Rationale**: Final phase ensures all requirements are met and provides confidence before handoff to implementation teams.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File not created** | Implementation creates file within try-except block and verifies existence immediately after write. Validation confirms file exists before any other checks. |
  | **Incorrect file permissions** | pathlib.Path.write_text() handles permissions automatically. If permissions fail, exception is raised with clear message. |
  | **Encoding issues (BOM or non-UTF-8)** | pathlib with explicit "utf-8" encoding parameter ensures UTF-8 without BOM. Validation explicitly checks for BOM presence. |
  | **Line ending problems (CRLF vs LF)** | pathlib.Path.write_text() on Unix/Linux automatically uses LF. Validation explicitly checks for and rejects CRLF/CR. |
  | **Git operations fail** | Each git operation uses subprocess with check=True for fail-fast behavior. Clear error messages logged for each operation. |
  | **Wrong file content generated** | Hard-coded prose content is manually reviewed and fixed in code. No API failures possible. |
  | **File size out of range** | Prose content is controlled and kept within 250-600 byte range. Validation checks size and fails if outside range. |
  | **Sentence count incorrect** | Period counting is proven method in features 203-205. Manual prose review ensures exactly 2-3 sentences with periods. |

