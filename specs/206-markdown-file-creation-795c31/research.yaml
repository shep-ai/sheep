  ### Logging Strategy

  Uses `sheep.observability.logging.get_logger(__name__)` consistently:
  - INFO level: Major workflow phases (file creation, validation, git operations)
  - DEBUG level: Detailed checks (file exists, validation details, git output)
  - ERROR level: Failures with context

  Example logging pattern:
  ```python
  _logger.info(f"Creating markdown file: {FILENAME}")
  # ... operation ...
  _logger.debug(f"✓ Successfully created {FILENAME}")
  ```

