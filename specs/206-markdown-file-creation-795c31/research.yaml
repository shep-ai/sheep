decisions:
  - title: "Content Generation Strategy"
    chosen: "Hard-coded prose content (Feature 205 pattern)"
    rejected:
      - "Claude API with temperature=0 (Feature 203-204 pattern) — While proven, requires API latency, adds network failure points, and is unnecessary for 'any topic' requirement. Hard-coded approach is simpler, faster, and equally deterministic."
