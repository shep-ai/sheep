# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-19
  - **Feature:** markdown-file-creation-4b3d0d (Feature 103)
  - **Effort Estimate:** 30-45 minutes

  ## Architecture Overview

  Feature 103 is a simple markdown file creation task that orchestrates existing, proven utilities.
  No new code is needed beyond the orchestration module — all file I/O, content generation, validation,
  and git operations leverage existing infrastructure from features 001-102.

  ### Existing Infrastructure (Proven Across 100+ Features)

  **sheep.content_generators module:**
  - `generate_markdown_content(topic=None, llm_client=None)` — calls Claude API, generates H1 + 2-3 sentences
  - `write_markdown_file(file_path, content)` — writes with UTF-8, LF line endings, trailing newline
  - `validate_markdown_file(file_path)` — comprehensive validation (structure, encoding, line endings, size)
  - `commit_markdown_file(file_path, content, message=None)` — stages and commits with conventional format
  - `push_markdown_file(repo_path)` — pushes to remote with upstream tracking (-u flag)

  **sheep.config.llm module:**
  - `get_reasoning_llm()` — returns configured Claude API client (already set up for platform)

  **sheep.tools.git_tools module:**
  - `GitCommitTool` — CrewAI BaseTool for git add + commit (atomic)
  - `GitPushTool` — CrewAI BaseTool for git push with -u flag

  **sheep.observability.logging module:**
  - `get_logger(__name__)` — structured logging integration with platform observability

  ### Implementation Approach

  Create one Python module that orchestrates these existing utilities in the correct order:
  1. Generate H1 + 2-3 sentences via Claude API
  2. Write to disk with UTF-8, LF, trailing newline
  3. Validate all specification requirements
  4. Commit with message: "feat(103): create markdown file test-uamczl.md with prose content"
  5. Push to remote with upstream tracking

  No modifications to existing source code, tests, or configuration files.
  No new external dependencies.

  ## Key Design Decisions

  ### Decision 1: Leverage Existing sheep.content_generators Module

  **Chosen:** Use `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()` functions
  directly from existing sheep.content_generators module

  **Why:**
  - All functions are generic, reusable, and tested across 100+ features
  - Avoids code duplication and reinventing file I/O, encoding handling, validation
  - Ensures consistency with 100+ established features
  - Reduces implementation time significantly
  - These functions already handle UTF-8, LF line endings, BOM validation, CommonMark compliance

  **Evidence:** Feature 102 (and 101, 100, etc.) use identical approach. Functions are robust and
  well-tested with comprehensive error handling.

  ### Decision 2: Use Existing Git Tools from sheep.tools.git_tools

  **Chosen:** Use `GitCommitTool` and `GitPushTool` CrewAI BaseTool classes for all git operations

  **Why:**
  - Provides consistent abstraction for git operations across all features
  - Handles error conditions and provides meaningful error messages
  - Atomic staging + committing (no partial state)
  - Upstream tracking (-u flag) prevents accidental branch mismatches
  - Integrated with platform logging and observability
  - Proven across 100+ features with no issues

  **Evidence:** Feature 102 uses identical approach with clean implementation.

  ### Decision 3: Create Simple Orchestration Module, Not Utility Library

  **Chosen:** Create single feature_103_markdown_file_creation.py module with metadata and one orchestration function

  **Why:**
  - Feature 102 demonstrates this pattern (simple, clean, easy to understand)
  - Avoids over-engineering — only need to orchestrate existing functions
  - Metadata (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME) enables programmatic invocation
  - Consistent with feature registry pattern across codebase
  - Single file is easier to test and maintain than multiple utilities

  **Evidence:** This pattern is replicated across all 100+ features with clear success.

  ### Decision 4: Auto-Generate Prose via Claude API

  **Chosen:** Call Claude API (via get_reasoning_llm()) to generate H1 heading + 2-3 sentences

  **Why:**
  - Ensures high-quality, grammatically correct prose
  - LLM naturally produces varied, appropriate content without hardcoded lists
  - Leverages existing platform infrastructure (already configured)
  - Follows product decision (research finding: "Auto-generated via Claude API" is recommended)
  - Feature 102 uses this approach successfully
  - Prose generation is the only network latency operation (2-5 seconds); unavoidable

  **Evidence:** All 100+ preceding features use this approach with consistent quality output.

  ### Decision 5: Implement Three-Phase Validation

  **Chosen:** Validate at three points: (1) LLM response structure, (2) after file write, (3) binary-level file validation

  **Why:**
  - Catches errors at earliest opportunity
  - Provides meaningful diagnostics for each failure mode
  - Ensures specification compliance before git operations
  - Phase 3 (binary-level validation) catches encoding/line-ending issues on any platform
  - Matches product decision (research finding: "Full technical validation" is recommended)

  **Evidence:** Feature 102 implements all three phases with comprehensive error messages. No known
  issues across 100+ features with this approach.

  ### Decision 6: Strict Commit Message Format

  **Chosen:** Use exact message format: `feat(103): create markdown file test-uamczl.md with prose content`

  **Why:**
  - Matches specification requirement exactly
  - Follows conventional commits convention (feat scope)
  - Consistent with 100+ preceding features (feat(102), feat(101), etc.)
  - Provides clear audit trail for what feature created each file

  **Evidence:** Feature 102 uses identical pattern with consistent success.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Create Module):** Must come first — establishes base module structure and imports before implementing functionality.

  **Phase 2 (Content Generation & File Creation):** Must come after module exists; orchestrates the core workflow
  (generate → write → validate) before git operations.

  **Phase 3 (Validation):** Must come after file creation; verifies all specification requirements are met
  before committing changes. Catches issues early, avoids committing non-compliant files.

  **Phase 4 (Git Integration):** Must come last — only commit and push when file is validated and compliant.
  Final acceptance testing confirms all success criteria met.

  ### Total Effort Estimate: 30-45 Minutes

  - **Phase 1:** 5 minutes — Create module with metadata and imports
  - **Phase 2:** 10-15 minutes — Implement orchestration function, wire LLM integration
  - **Phase 3:** 5-10 minutes — Add validation and verification
  - **Phase 4:** 10-15 minutes — Git integration, acceptance testing, verification

  Breakdown is slightly longer than minimum because of comprehensive testing at each phase.

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | LLM API timeout or failure | Medium | Implement timeout handling in generate_markdown_content(). Feature 102 handles this gracefully. If LLM fails, exception propagates with clear error message. |
  | Git push fails (network/auth) | Low | GitPushTool handles auth errors. Platform configures git credentials. If push fails, exception provides clear diagnostics. Branch is dedicated (feat/103-...) so no conflicts. |
  | File encoding issues on Windows | Low | Use Python's open() with explicit encoding='utf-8'. Binary-level validation checks for BOM and CRLF. Pathlib is platform-agnostic. Proven across 100+ Windows-compatible features. |
  | Validation rejects valid content | Very Low | Validation logic matches specification exactly. Feature 102 uses identical validation with 100% success rate. If validation fails, clear error message describes what requirement failed. |
  | Feature module import fails | Very Low | Simple module structure with standard imports. No circular dependencies. Feature 102 uses identical structure. Python import validation will catch syntax errors immediately. |

