  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-19
  - **Decision Count:** 8 technology decisions
  - **Dependencies:** None new (uses only existing modules and Python standard library)

  ## Executive Summary

  Feature 103 is a markdown file creation task following the proven pattern from 102+ preceding features (001-102).
  All technology choices are validated by successful implementations across the repository. Implementation leverages
  existing sheep.content_generators module and git tools with zero new external dependencies. Primary latency source
  is LLM API call (2-5 seconds); file operations and git workflow are near-instantaneous (<200ms total). No architectural
  changes required. Estimated implementation effort: 10-20 minutes following feature 102 pattern.

  ## Technology Decisions

  ### 1. File I/O and Path Handling

  **Chosen:** Python pathlib.Path with open() in text mode for UTF-8 encoding

  **Why:**
  - NFR-5 explicitly mandates pathlib for file I/O
  - Object-oriented API with safe path validation
  - Automatic platform compatibility (Windows/Unix)
  - Standard library (zero external dependencies)
  - Methods .exists(), .is_file(), .stat() are safer than string operations

  **Alternatives Rejected:**
  - os.path module — older API, string-based, more error-prone
  - raw open() with string paths — no path validation or abstraction
  - external libraries (pathspec, etc.) — unnecessary complexity

  **Evidence:** Features 101-102 use pathlib.Path exclusively in write_markdown_file() and validate_markdown_file().
  This pattern is consistent across 100+ features.

  ### 2. Prose Content Generation

  **Chosen:** Use existing Claude API via get_reasoning_llm() from sheep.config.llm

  **Why:**
  - Leverages existing platform infrastructure (configured for features 001-102)
  - Ensures high-quality, grammatically correct prose
  - Provides natural topic variety without hardcoded lists
  - LLM call is the only latency-critical operation (2-5 seconds)
  - Product decision (openQuestions question 1) explicitly recommends auto-generation via Claude API

  **Alternatives Rejected:**
  - Manual prose writing — slower, implementer burden, not scalable for 100+ features
  - Template-based generation — less flexible, requires template maintenance
  - Random sentence selection — produces incoherent content, brittle approach

  **Evidence:** Feature 102 uses Claude API via CrewAI's get_reasoning_llm() in generate_markdown_content().
  This is demonstrated across 100+ successful features with consistent quality output.

  ### 3. Markdown Structure and Validation

  **Chosen:** Three-phase validation: content generation → file write → post-write verification

  **Phases:**
  1. Content Generation Phase: LLM prompt validates structure (H1 heading, 2-3 sentences)
  2. File Write Phase: write_markdown_file() verifies filename safety and successful write
  3. Post-Write Phase: validate_markdown_file() checks all specification requirements

  **Checked Requirements:**
  - H1 heading at start (# format)
  - Blank line separator (line 2 must be empty)
  - 2-3 sentences of prose (count periods)
  - UTF-8 encoding (no BOM marker)
  - LF line endings (no CRLF)
  - Trailing newline (Unix convention)
  - File size naturally in range (350-600 bytes as guideline)

  **Why This Approach:**
  - Catches errors at earliest opportunity
  - Provides meaningful error messages for debugging
  - Validates at file system level (encoding/line endings)
  - Meets CommonMark specification (NFR-4)

  **Evidence:** Feature 102's validate_markdown_file() (lines 150-244 in content_generators.py) performs all
  these checks with comprehensive error messages. Proven across 100+ features.

  ### 4. Git Workflow and Commit Message

  **Chosen:** Use existing GitCommitTool and GitPushTool from sheep.tools.git_tools

  **Commit Message Format:** `feat(103): create markdown file test-uamczl.md with prose content`

  **Why:**
  - GitCommitTool handles staging (git add) and committing atomically
  - GitPushTool handles upstream tracking (-u flag) and error handling
  - Both tools are CrewAI BaseTool subclasses with logging and error handling
  - subprocess via _run_git() helper ensures Unix compatibility
  - Conventional commit format matches repository style (feat scope)

  **Process:**
  1. Orchestration function prepares custom commit message with feature number
  2. GitCommitTool stages file and commits with message
  3. GitPushTool pushes to remote with upstream tracking (-u flag)

  **Evidence:** Feature 102 uses identical approach with feature 102 metadata. Git log shows pattern:
  feat(102), feat(101), feat(100), etc. across all features.

  ### 5. File Encoding and Line Endings

  **Chosen:** UTF-8 without BOM, LF line endings, explicit trailing newline

  **Why:**
  - NFR-1 explicitly specifies UTF-8 without BOM
  - NFR-2 explicitly specifies LF (Unix-style) not CRLF
  - Python open() with mode="w" and encoding="utf-8" defaults to UTF-8 without BOM
  - On Unix systems, text mode doesn't perform CRLF conversion
  - Trailing newline is POSIX standard (text file definition)

  **Implementation:**
  - write_markdown_file() uses `open(file_path, "w", encoding="utf-8")`
  - Content generation includes trailing newline before file write
  - validate_markdown_file() checks binary level for BOM marker (\\xef\\xbb\\xbf)
  - validate_markdown_file() checks binary level for CRLF (\\r\\n)

  **Evidence:** Feature 102 applies identical encoding strategy and passes all validation checks.
  This pattern is consistent across 100+ features.

  ### 6. Error Handling Strategy

  **Chosen:** Exception propagation with descriptive error messages and logging

  **Pattern:**
  - Validation failures raise ValueError with specific reason
  - File I/O failures raise IOError with context
  - Git operation failures raise Exception with git stderr
  - All exceptions logged with context (file path, operation, input values)
  - Caller catches and re-raises with logging

  **Why:**
  - Descriptive errors enable fast diagnosis
  - Logging provides auditability and traceability
  - Exception propagation allows caller to handle or fail gracefully
  - Matches sheep.observability.logging framework pattern

  **Evidence:** Feature 102's content_generators functions (lines 66-68, 145-147, 240-244) consistently
  use this pattern. Proven across 100+ features.

  ### 7. Topic Selection and Content Uniqueness

  **Chosen:** Allow LLM to choose any topic freely; no topic constraints or registry

  **Why:**
  - Product decision (openQuestions question 3) explicitly allows "Any topic freely chosen"
  - Eliminates infrastructure and maintenance overhead
  - Reduces topic exhaustion risk in multi-feature implementations
  - Quality constraint is prose quality not topic originality
  - LLM naturally produces varied topics across invocations

  **Evidence:** Feature 102's MARKDOWN_GENERATION_PROMPT (lines 13-24 in content_generators.py)
  demonstrates this: "about any topic you choose". This aligns with 100+ precedents.

  ### 8. Logging and Observability

  **Chosen:** Use existing sheep.observability.logging.get_logger() for structured logging

  **Pattern:**
  - Module-level logger: `_logger = get_logger(__name__)`
  - Info level: task starts, task completions, significant milestones
  - Debug level: intermediate state, variable values, file paths
  - Error level: exceptions with context
  - Integration with platform observability sinks (console, langfuse, etc.)

  **Why:**
  - Consistent with feature 102 and all existing features
  - Structured logging enables debugging and diagnostics
  - Platform-level configuration handles output routing
  - No application-level logging configuration needed

  **Evidence:** Feature 102 uses identical logging pattern throughout (lines 62-68, 124-143, 179-237).

