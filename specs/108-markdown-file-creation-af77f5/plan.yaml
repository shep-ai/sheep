# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-19
  - **Status:** Architecture and design complete

  ## Architecture Overview

  This feature is completely isolated from the application codebase. It creates a single test
  artifact (markdown file) in the repository root, following the well-established pattern from
  65+ existing test-*.md files. There are no changes to source code in /src/sheep/, no test
  modifications, no configuration changes, and no new dependencies.

  The implementation is purely imperative: create file with correct encoding and line endings,
  then stage and commit with git. The feature demonstrates basic file I/O and git integration
  without any architectural complexity or abstraction layers.

  ### Pattern from Existing Test Files

  Examined 65+ existing test markdown files (test-*.md in repository root) reveal uniform pattern:
  - H1 heading as title on first line
  - Blank line separator
  - 2-3 sentences of prose content
  - UTF-8 encoding without BOM
  - Unix LF line endings
  - Typical file size: 400-600 bytes (natural outcome of correct structure)
  - No modifications to application source code or configuration

  This feature follows the exact same pattern, ensuring consistency and maintainability across
  all test files.

  ## Key Design Decisions

  All decisions are informed by research findings and precedent from 65+ existing test files.

  ### 1. File I/O: Python pathlib with explicit line ending control

  **Decision:** Use `pathlib.Path` for file paths, but use `open()` with `newline=\"\"` parameter
  to guarantee cross-platform LF line endings.

  **Rationale:**
  - Specification explicitly requires pathlib (NFR-5)
  - pathlib.write_text() respects platform line ending defaults (CRLF on Windows)
  - To guarantee Unix LF line endings on all platforms (NFR-2), use open() with newline=\"\"
  - Explicit UTF-8 encoding ensures no BOM across all platforms (NFR-1)
  - Established pattern: use pathlib for path objects and open() for line ending control

  **Implementation pattern:**
  ```python
  from pathlib import Path
  content = \"# Heading\\n\\nTwo to three sentences of prose.\"
  with open(Path(\"test-4lc6c9.md\"), \"w\", encoding=\"utf-8\", newline=\"\") as f:
      f.write(content)
  ```

  ### 2. Git Integration: subprocess.run() with list arguments

  **Decision:** Use `subprocess.run()` with list-style arguments for all git operations

  **Rationale:**
  - subprocess is part of Python standard library (no new dependencies, satisfies NFR-9)
  - List-style arguments prevent shell injection vulnerabilities
  - Portable across Windows/Linux/macOS
  - Three simple operations: git add, git commit, git push
  - Matches established pattern from 65+ existing test files
  - Research rejected GitPython library due to external dependency requirement

  **Implementation pattern:**
  ```python
  subprocess.run([\"git\", \"add\", \"test-4lc6c9.md\"])
  subprocess.run([\"git\", \"commit\", \"-m\", \"feat(108): create markdown file test-4lc6c9.md with prose content\"])
  subprocess.run([\"git\", \"push\", \"-u\", \"origin\", \"HEAD\"])
  ```

  ### 3. Content: Static hardcoded prose

  **Decision:** Write static, hardcoded prose content (title + 2-3 sentences)

  **Rationale:**
  - Feature requires exactly one file with specific structure (no parameterization needed)
  - Static content is simplest, most maintainable, and fastest to implement
  - Topic is free-form per product question #2 (\"about anything\")
  - This approach matches 65+ existing test files, which cover diverse topics
  - Implementer manually validates readability during creation (product question #3)

  **Implementation pattern:**
  - Choose any topic of interest
  - Write clear, readable prose (2-3 sentences)
  - Verify grammar and readability during implementation
  - Result naturally falls in 400-600 byte range (product question #1 resolution)

  ### 4. Validation: Structure-based, no automation

  **Decision:** Manual validation during implementation; no automated readability checks

  **Rationale:**
  - Product question #1 resolved: file size is natural outcome of correct structure, not strict constraint
  - Product question #3 resolved: prose readability validated by implementer during creation
  - No need for external validation libraries or automated checks
  - Manual structure verification (H1 heading, blank line, 2-3 sentences) is sufficient
  - Validation is standard practice across 65+ existing test files

  **Validation checklist:**
  - File created with exact name: test-4lc6c9.md
  - H1 heading (# Title) on first line
  - Blank line after heading
  - 2-3 sentences of prose content
  - File is readable UTF-8 with LF line endings (not CRLF)
  - Prose is grammatically correct and readable
  - File is in repository root directory

  ### 5. Implementation: Imperative Python code

  **Decision:** Use straightforward imperative Python code with no abstraction layers

  **Rationale:**
  - Feature is minimal: four sequential operations (create, add, commit, push)
  - No state management, configurability, or reusability needed
  - Imperative code is most transparent, maintainable, and debuggable
  - Matches established pattern across 65+ test files
  - Premature abstraction would be over-engineering

  ## Implementation Strategy

  Single sequential phase because all operations are tightly coupled and interdependent:

  1. **Create the markdown file** with correct structure (heading + prose), UTF-8 encoding, and LF line endings
  2. **Validate the file** has correct format, encoding, and structure
  3. **Stage the file** with git add to prepare for commit
  4. **Commit with conventional message** using exact required format
  5. **Push to remote** on the feature branch

  This sequential workflow is simple, transparent, and follows the established pattern from
  65+ preceding markdown-file-creation features (features 063-107). Estimated total time: 10-15 minutes.

  ### Why Single Phase?

  - All operations depend on the previous one (no parallelization possible)
  - File creation must complete before staging
  - Staging must complete before commit
  - Commit must exist before pushing
  - Phase grouping by git workflow would not reduce complexity

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | File encoding issues: CRLF line endings on Windows | Medium | Use newline=\"\" parameter with open() to force LF on all platforms; do NOT rely on pathlib.write_text() defaults |
  | Git config not set (user.name, user.email) | Low | Verify git configuration before running commit; subprocess.run() will fail with clear error if required config missing |
  | File already exists (name collision) | Very Low | Filename is unique per feature (test-4lc6c9.md); 65+ existing test files show no collisions in repository history |
  | Import errors (pathlib, subprocess) | Very Low | Both are Python 3.11+ standard library; no external dependencies; verified imports available in project |
  | Incorrect commit message format | Low | Use exact message from spec: \"feat(108): create markdown file test-4lc6c9.md with prose content\"; validate after commit |
  | Push fails due to permissions or network | Low | Feature branch is pre-created and available; verify branch exists and current user has push permissions to origin |
  | Prose readability is poor | Low | Implementer manually reviews during creation; standard practice across 65+ precedents; test content, not production |
  | File size outside typical range | Very Low | Correct structure (H1 + blank + 2-3 sentences) naturally yields 400-600 bytes; no special handling needed |
