content: |
  ## Architecture Overview

  Feature 169 fits into the Sheep agentic platform architecture as a feature module that orchestrates
  existing, battle-tested helper functions. The implementation follows the established pattern from
  features 166-168:

  1. **Feature Module** (`src/sheep/features/feature_169_markdown_file_creation.py`): Entry point that
     orchestrates helper functions and handles feature-specific concerns (exact commit message with
     feature number).

  2. **Content Generation**: Uses `sheep.content_generators.generate_markdown_content()` to generate
     markdown with H1 heading and 2-3 sentences via Claude API with temperature 0.2 for reproducible
     but creative content.

  3. **File I/O**: Uses `sheep.content_generators.write_markdown_file()` with pathlib for safe file
     creation with explicit UTF-8 encoding (no BOM).

  4. **Validation**: Uses `sheep.content_generators.validate_markdown_file()` for comprehensive checks:
     UTF-8 encoding validation, Unix LF line endings, markdown syntax verification, heading and
     sentence count validation.

  5. **Git Integration**: Uses `sheep.content_generators.commit_markdown_file()` and
     `push_markdown_file()` which wrap CrewAI GitCommitTool and GitPushTool for version control.

  The architecture requires minimal custom code—primarily orchestration of existing, proven utilities.
  All error handling, logging, and validation logic already exists in helper functions.

  ## Key Design Decisions

  ### 1. Use Existing Helper Functions (Not Custom Implementation)
  **Chosen**: `sheep.content_generators` module functions

  **Rationale**: The research identified that sheep.content_generators provides production-proven
  implementations across 168+ markdown file creations. Features 166-168 demonstrate this pattern
  works reliably. The helper functions provide:
  - Proper prompt engineering and LLM error handling
  - Comprehensive file validation (encoding, syntax, format)
  - Safe file I/O with pathlib and explicit UTF-8 encoding
  - Git integration via CrewAI tools with proper error handling

  **Alternatives Rejected**:
  - Custom LLM integration: Duplicates tested logic, loses consistency with existing 168+ test files
  - Template-based content: Less flexible, conflicts with user requirement \"about anything\"
  - External libraries: Would violate NFR-9 (no new dependencies)

  ### 2. Create Feature Module (Not Direct Function Call)
  **Chosen**: Create `feature_169_markdown_file_creation.py` module in `src/sheep/features/`

  **Rationale**: Explicit feature modules provide several benefits:
  - Clear separation of concerns (feature orchestration vs. reusable utilities)
  - Feature-specific customization (exact commit message with feature number \"feat(169): ...\")
  - Consistency with recent implementations (features 166-168 all use dedicated modules)
  - Testability and maintainability through explicit module structure
  - Follows established Sheep platform conventions

  **Alternatives Rejected**:
  - Direct `create_markdown_file()` wrapper call: Less explicit, harder to customize commit message
  - Standalone script in repo root: Breaks established patterns and conventions

  ### 3. Use Comprehensive File Validation
  **Chosen**: `sheep.content_generators.validate_markdown_file()` with all checks

  **Rationale**: The validation function is already implemented and tested. It checks all
  non-functional requirements at zero additional cost:
  - UTF-8 encoding without BOM (NFR-1)
  - Unix LF line endings (NFR-2)
  - Valid markdown syntax per CommonMark (NFR-4)
  - H1 heading presence and format (FR-3)
  - Exactly 2-3 sentences of prose (FR-4)
  - Blank line separator (FR-4)
  - Trailing newline for Unix convention

  Comprehensive validation prevents format drift and maintains consistency across 168+ test files.

  **Alternatives Rejected**:
  - Basic validation (file exists only): Risks encoding issues, format drift, syntax errors
  - No validation: Unacceptable quality risk, breaks consistency with existing files

  ### 4. Orchestrate Sequential Operations (Not Parallel)
  **Chosen**: Sequential orchestration of helper functions

  **Rationale**: Each operation depends on the previous:
  1. Content generation must complete before file creation
  2. File creation must complete before validation
  3. Validation must pass before git operations
  4. Commit must complete before push

  Sequential flow is natural and ensures error detection at each stage. Feature is small enough
  (single file) that parallelization adds no value.

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1: Feature Module Creation** comes first because it:
  - Establishes the module structure and imports all dependencies
  - Sets up the function skeleton that will be implemented in subsequent phases
  - Verifies that all helper functions are accessible

  **Phase 2: Content Generation and File Creation** comes second because it:
  - Builds on the module foundation from Phase 1
  - Implements the core file creation and validation logic
  - Validates that the markdown file meets all technical requirements before attempting git operations

  **Phase 3: Git Integration** comes last because it:
  - Depends on file creation success (Phase 2)
  - Commits and pushes the validated file to version control
  - Is only attempted after validation confirms file integrity

  This ordering ensures each phase builds on validated results from the previous phase, preventing
  partial or invalid states from being committed.

  ### Implementation Approach

  The implementation is primarily **orchestration** of existing helper functions:

  ```python
  # Pseudocode structure (actual implementation in Phase 2-3)

  async def feature_169_markdown_file_creation():
      filename = \"test-54u2yg.md\"

      # Phase 2: Generate, write, validate
      content = await generate_markdown_content()
      await write_markdown_file(filename, content)
      await validate_markdown_file(filename)

      # Phase 3: Git workflow
      commit_msg = \"feat(169): Create markdown file test-54u2yg.md with prose content\"
      await commit_markdown_file(filename, commit_msg)
      await push_markdown_file()

      return {\"status\": \"success\", \"file\": filename}
  ```

  Each helper function encapsulates complex logic:
  - `generate_markdown_content()`: Claude API call with prompt engineering, response parsing, validation
  - `write_markdown_file()`: Safe file I/O with pathlib, UTF-8 encoding validation, size checking
  - `validate_markdown_file()`: Encoding validation, syntax checking, format verification
  - `commit_markdown_file()`: Git staging and commit with conventional message
  - `push_markdown_file()`: Remote push with upstream tracking

  Custom code is minimal—primary effort is orchestrating these proven utilities.

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | LLM generates invalid markdown or wrong format | Low | Use `generate_markdown_content()` which has built-in validation. Validate generated content before writing to file. Temperature 0.2 reduces randomness. |
  | File encoding issues (BOM, line endings) | Very Low | Use `write_markdown_file()` with explicit UTF-8 no-BOM encoding. Validate with `validate_markdown_file()` which checks binary representation. |
  | File size outside 300-600 byte range | Low | `validate_markdown_file()` checks size. If generation produces content outside range, LLM prompt can be adjusted. |
  | Git operations fail (no credentials, no upstream) | Low | Use `commit_markdown_file()` and `push_markdown_file()` which have error handling. Feature branch already exists. Git credentials configured for CI environment. |
  | Markdown syntax invalid per CommonMark | Very Low | `validate_markdown_file()` verifies CommonMark syntax. `generate_markdown_content()` uses validated prompt template proven across 168+ files. |
  | File already exists from prior attempt | Low | `write_markdown_file()` overwrites safely. If commit fails, file still exists and can be retried. Idempotent operation. |
  | Commit message format incorrect | Very Low | Use exact hardcoded string in `commit_markdown_file()` function. No user input in message. Format: `feat(169): Create markdown file test-54u2yg.md with prose content` |
  | Push to remote fails | Low | `push_markdown_file()` includes retry logic. Remote origin preconfigured. Use upstream tracking (`git push -u origin HEAD`). |
  | Module import fails | Very Low | All dependencies already exist and are used by features 166-168. Import paths follow established convention. |
