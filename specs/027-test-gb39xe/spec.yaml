# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository serves as a test and demonstration platform for the automated code implementation
  system. It contains multiple markdown files created as features to showcase different capability patterns.
  This feature adds another markdown file (test-gb39xe.md) following the established convention of creating
  standalone content files at the repository root. The file should contain a title and 2-3 sentences about
  any workplace-appropriate topic of interest.

  ## Success Criteria

  - [ ] File test-gb39xe.md created at repository root (no subdirectories)
  - [ ] File contains an H1 markdown heading (e.g., `# Title`) as the first content
  - [ ] Heading is immediately followed by 2-3 coherent, grammatically correct sentences
  - [ ] Total content is readable and makes logical sense
  - [ ] File uses UTF-8 encoding
  - [ ] File ends with exactly one trailing newline character
  - [ ] No existing repository files are modified by this change
  - [ ] File naming follows established repository conventions (lowercase, hyphens for word separation)
  - [ ] File successfully merges to main branch without conflicts

  ## Functional Requirements

  - **FR-1**: System shall create a markdown file named `test-gb39xe.md` at the repository root
  - **FR-2**: File shall contain an H1 markdown heading as the first content element
  - **FR-3**: Heading shall be followed by exactly 2-3 sentences describing a workplace-appropriate topic
  - **FR-4**: Content shall be grammatically correct and logically coherent
  - **FR-5**: File creation shall not modify any existing files in the repository

  ## Non-Functional Requirements

  - **NFR-1**: File shall use UTF-8 character encoding without BOM (byte order mark)
  - **NFR-2**: File shall terminate with a single newline character (POSIX standard, Git best practice)
  - **NFR-3**: File shall follow the naming convention of existing content files (lowercase with hyphens)
  - **NFR-4**: File shall be mergeable without conflicts on the main branch
  - **NFR-5**: Implementation shall introduce no side effects (no other file modifications, no configuration changes)
  - **NFR-6**: Feature shall have zero external dependencies (no packages, libraries, or code dependencies)

  ## Product Decisions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should topic selection have specific constraints, or should the implementer have complete freedom within workplace-safety guidelines? | Any workplace-appropriate topic | The repository's established pattern shows diverse, unrelated topics (jokes, design patterns, state machines, weather). Imposing constraints would be inconsistent with existing practice. Complete freedom aligns with established patterns and encourages varied contributions. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new markdown file added; no existing files modified; no code changes |
  | specs/027-test-gb39xe/ | Low | Specification and tracking files only; no impact to buildable/executable code |
  | Git Branch | Low | Simple addition of one file; straightforward merge with no conflicts expected |

  ## Dependencies

  None. This feature:
  - Does not depend on any Python packages or external libraries
  - Does not depend on any existing code in the Sheep platform
  - Does not require any build, test, or compilation steps
  - Does not require modifications to configuration, workflow, or any other system file
  - Can be implemented as a pure content creation task

  ## Size Estimate

  **S** (Small) — This is a minimal effort task requiring only the creation of a single markdown file with a title
  and 2-3 sentences of content. No code, no tests, no configuration changes, no dependencies, and no
  modifications to existing files are needed. Typical implementation time: less than 30 minutes.
