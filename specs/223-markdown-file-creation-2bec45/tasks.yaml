content: |
  ## Summary

  Feature 223 requires creating a single markdown file (test-vwl9jb.md) and committing it to git.
  The implementation uses a Python script with 5 ordered tasks:

  **Phase 1: Core Implementation**
  1. Create script foundation (imports, constants, function stubs) — 2 min
  2. Implement file creation with proper UTF-8 and Unix LF — 3 min
  3. Implement git workflow functions (add, commit, push) — 4 min
  4. Implement main() orchestration and entry point — 2 min
  5. Execute and verify successful completion — 3 min

  **Total: ~14 minutes**

  Each task includes TDD cycles (RED-GREEN-REFACTOR) to ensure correctness at each step.
  Dependencies are strictly linear: each task depends on the previous one being complete.
  No parallelization is possible because git operations must happen after file creation,
  and push must happen after commit.

  ## Success Criteria

  After all 5 tasks are complete:
  - File `test-vwl9jb.md` exists in repository root with valid markdown content
  - Commit \"feat(223): Create markdown file test-vwl9jb.md\" is in git history
  - Changes are pushed to feature branch `feat/223-markdown-file-creation-2bec45`
  - Feature branch HEAD points to the new commit
  - All file encoding and line ending requirements are met (UTF-8, LF)

  ## Implementation Notes

  - The Python script uses only standard library (pathlib, subprocess, sys)
  - No external dependencies are required
  - Error handling uses specific exception types (FileExistsError, OSError, CalledProcessError)
  - No validation layer is implemented per spec requirement
  - Prose content is flexible (any topic acceptable per spec \"about anything\")
