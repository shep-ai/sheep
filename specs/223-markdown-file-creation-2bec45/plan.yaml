content: |
  ## Architecture Overview

  Feature 223 is a minimal, stateless file creation task that follows the proven pattern from 60+ preceding features (160-222). The implementation consists of:

  1. **Python Script** (`create_markdown_file_223.py`)
     - ~50 lines of code using only Python standard library
     - No external dependencies
     - Handles file creation, git staging, and commit workflow

  2. **File Creation** via pathlib.Path.write_text()
     - Ensures UTF-8 encoding without BOM
     - Explicitly forces Unix LF line endings (\n) on all platforms
     - Raises FileExistsError if file already exists (defensive check)

  3. **Git Integration** via subprocess.run() calls
     - Sequential operations: add → commit → push
     - Each git command raises CalledProcessError on failure for clear error handling
     - No external git libraries (no GitPython, pygit2 dependencies)

  4. **Content Generation**
     - Flexible/generic prose (any topic acceptable per spec: \"about anything\")
     - H1 markdown heading as title + blank line + 2-3 sentences
     - Natural target size: 300-500 bytes

  The implementation requires no validation layer (per spec) and aligns with established patterns across the Sheep project.

  ## Key Design Decisions

  ### 1. File Creation: Python pathlib with explicit encoding

  **Chosen:** `Path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")`

  **Rationale:**
  - Modern Python standard library (3.11+), cross-platform safe
  - `encoding=\"utf-8\"` ensures UTF-8 without BOM per spec requirement
  - `newline=\"\\n\"` forces Unix LF line endings on all platforms (Windows/macOS/Linux)
  - Matches exact pattern from feature 222 (immediate predecessor)
  - Proven across 60+ identical features with 100% success rate

  **Rejected alternatives:**
  - open()/write() — verbose, same functionality, less clean
  - os.path + open() — legacy approach
  - Direct bash/shell commands — inconsistent with codebase, harder to debug
  - External file libraries — unnecessary dependencies

  ### 2. Content Generation: Flexible/generic prose (any topic)

  **Chosen:** Any topic acceptable; single paragraph with 2-3 sentences

  **Rationale:**
  - User query explicitly states \"about anything\"
  - Reduces decision overhead, enables fastest execution
  - Matches pattern from features 216-222
  - 300-500 byte target naturally constrains to 2-3 sentences
  - No research or creative effort required

  **Rejected alternatives:**
  - Thematic constraints (e.g., only Python topics) — adds complexity
  - Random/procedural generation — unnecessary non-determinism
  - Content template library — over-engineered

  ### 3. Git Integration: subprocess with sequential calls and check=True

  **Chosen:** Three sequential subprocess.run() calls with check=True

  **Rationale:**
  - Established pattern across 200+ features in Sheep project
  - subprocess.run() with check=True raises CalledProcessError on failure
  - List-based arguments prevent command injection
  - Sequential operations allow clear separation and debugging
  - Cross-platform compatible, no external dependencies

  **Rejected alternatives:**
  - GitPython — external dependency (violates NFR-3), not in codebase
  - os.system() — deprecated, unsafe, unclear error handling
  - Single shell command chain — less safe, harder to isolate failures

  ### 4. Error Handling: Minimal, specific exceptions

  **Chosen:** Catch FileExistsError, OSError, and subprocess.CalledProcessError separately

  **Rationale:**
  - Feature 222 (immediate predecessor) uses this exact pattern
  - Spec explicitly requires \"no validation layer\" (unlike feature 217)
  - Specific exceptions provide clear diagnostics without over-engineering
  - Prevents silent failures and accidental overwrites
  - Keeps implementation lean (~50 lines total)

  **Rejected alternatives:**
  - No error handling — fragile, unclear failure modes
  - Broad Exception catching — masks specific errors
  - Full validation layer (feature 217 pattern) — contradicts spec

  ### 5. No Validation Layer

  **Chosen:** Create file only; no post-creation checks

  **Rationale:**
  - Spec explicitly requires \"no validation layer per spec requirement\"
  - Feature 222 (immediate predecessor) confirms this direction
  - Feature 217 included validation; feature 223 does not require it
  - Aligns with \"S\" (small) size estimate: 10-15 minutes
  - Trust pathlib and subprocess implementations

  **Rejected alternatives:**
  - Full validation (check encoding, line endings, markdown structure) — adds 100+ lines
  - Partial validation (check file exists) — no benefit, adds complexity

  ## Implementation Strategy

  **Single-Phase Implementation:** Core Implementation

  **Rationale:**
  - All tasks are sequential and interdependent (no parallelization)
  - File must be created before git add can stage it
  - Commit depends on successful git add
  - Push depends on successful commit
  - Linear dependency chain naturally resolves in one phase

  **Task Ordering:**
  1. Create Python script with imports, constants, and helper functions
  2. Implement file creation with proper encoding and line endings
  3. Implement git workflow (add, commit, push operations)
  4. Execute the complete workflow end-to-end
  5. Verify file exists, commit created, and pushed to remote

  **Why This Order:**
  - Foundation (imports, constants) enables all subsequent code
  - File creation before git operations (prerequisite for staging)
  - Git workflow as sequential chain (add → commit → push)
  - Verification last (validates all prior steps)

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | File already exists (FileExistsError) | Low | Defensive try-except block; prevents accidental overwrites; clear error message |
  | Git configuration missing (user.name/email) | Low | Assume pre-configured per NFR-8; CalledProcessError provides clear diagnostics |
  | File encoding issues (CRLF vs LF) | Very Low | Explicit newline=\"\\n\" in write_text() forces Unix LF on all platforms (Windows/macOS/Linux) |
  | Git push fails (network, permissions, branch) | Very Low | Feature branch pre-created; subprocess error handling provides clear output; user can retry manually |
  | Python environment missing or wrong version | Very Low | Python 3.11+ required by Sheep project; standard library available |
  | Content length outside 300-500 bytes | Very Low | H1 heading + 3 sentences naturally fits; no strict validation required per spec |
  | Script has syntax errors or import issues | Very Low | TDD approach (RED-GREEN-REFACTOR) catches errors early; simple codebase, easy to debug |

  ## Success Criteria

  - [ ] File `test-vwl9jb.md` exists in repository root
  - [ ] File contains valid markdown with H1 heading and 2-3 sentences
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] File is staged in git (`git status` shows committed)
  - [ ] Commit message matches exactly: `feat(223): Create markdown file test-vwl9jb.md`
  - [ ] Commit is pushed to feature branch `feat/223-markdown-file-creation-2bec45`
  - [ ] Feature branch HEAD points to the new commit

  ## Assumptions & Dependencies

  **Pre-conditions (assumed already met per spec):**
  - Feature branch `feat/223-markdown-file-creation-2bec45` exists and is checked out
  - Git repository is initialized and writable
  - Git user.name and user.email are configured
  - Python 3.11+ is available with pathlib and subprocess (standard library)
  - Unix/Linux environment (or Windows with Git Bash/WSL) for LF line endings

  **Not Required:**
  - No modifications to existing source code (src/sheep/)
  - No external package dependencies
  - No test framework integration
  - No CI/CD configuration changes
  - No documentation updates (specs only)
