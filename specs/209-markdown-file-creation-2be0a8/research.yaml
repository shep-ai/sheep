content: |
  ## Technology Decisions

  ### 1. File Creation Method: Python pathlib

  **Chosen:** Use `pathlib.Path` from Python standard library

  **Rejected:**
  - `os.path` module — older string-based API, less safe for path operations, string concatenation prone to cross-platform issues
  - Direct file I/O with string paths — no abstraction, more error-prone, doesn't leverage modern Python
  - External utilities (shell scripts, system tools) — adds dependency, no advantage over stdlib

  **Rationale:** pathlib is the modern Pythonic approach (PEP 428) for file operations in Python 3.4+.
  It provides object-oriented path handling, is safer against path injection, and requires zero external
  dependencies. Since the spec requires Python 3.11+, pathlib is guaranteed available. The implementation
  pattern is straightforward:

  ```python
  from pathlib import Path
  content = "# Title\n\nProse sentence 1. Prose sentence 2. Prose sentence 3."
  Path("test-1j0p04.md").write_text(content, encoding="utf-8")
  ```

  This handles file creation, encoding, and writing atomically.

  ### 2. Prose Content Generation: Hardcoded by Implementer

  **Chosen:** Implementer selects topic and writes (or adapts) 2-3 sentences directly

  **Rejected:**
  - Template system (Jinja2, etc.) — adds external dependency, unnecessary for single static file
  - Procedural generation (LLM API, string templates) — introduces non-determinism, adds latency and dependencies
  - Fetching from external API — network dependency, complexity, potential failure points

  **Rationale:** The spec resolves the topic selection question with "Any topic" — complete implementer
  freedom. Given the goal is a single markdown file with deterministic, human-readable prose, the simplest
  and most reliable approach is hardcoded content. This aligns with the observed pattern in 200+ precedent
  files (test-8hjiqa.md about file creation, test-9ehmdc.md about resilience, test-ww2iac.md about tea,
  etc.), each with thoughtfully-written topic-specific prose. No template engine or procedural generation
  is needed or beneficial.

  ### 3. Git Operations: subprocess with git CLI

  **Chosen:** Use `subprocess` module to invoke git CLI commands

  **Rejected:**
  - GitPython library — adds external dependency, introduces new failure modes, overkill for three simple commands
  - Manual git protocol implementation — extremely complex, not maintainable, no advantage
  - Direct filesystem manipulation of .git — violates git abstraction, not safe

  **Rationale:** The feature requires three standard git operations:
  1. `git add test-1j0p04.md` (stage file)
  2. `git commit -m "..."` (create commit with conventional message)
  3. `git push -u origin HEAD` (push to feature branch)

  Using subprocess to invoke git CLI is minimal and requires no new dependencies. Git is already available
  in the environment (feature branch pre-created per spec). Example implementation:

  ```python
  import subprocess
  subprocess.run(["git", "add", "test-1j0p04.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(209): Create markdown file test-1j0p04.md with prose content"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  This avoids GitPython dependency while remaining clear and maintainable.

  ### 4. File Encoding and Line Endings: UTF-8 + LF

  **Chosen:** Explicit UTF-8 encoding without BOM; Unix line endings (LF only)

  **Rejected:**
  - Platform-default encoding — risks CRLF on Windows, creates repository inconsistency
  - Binary mode with manual bytes — error-prone, violates Python text semantics
  - Relying on git configuration (core.safecrlf, core.autocrlf) — depends on environment setup, not guaranteed

  **Rationale:** The spec explicitly requires:
  - UTF-8 encoding without BOM
  - LF (Unix-style) line endings, not CRLF

  Python's `open(mode='w', encoding='utf-8')` with explicit `\n` in content guarantees this:

  ```python
  Path("test-1j0p04.md").write_text(content, encoding="utf-8")
  # where content uses \n explicitly
  ```

  This ensures the file is created correctly regardless of platform or git configuration. Python's text
  mode semantics handle encoding and newlines properly when explicitly specified.

  ### 5. Validation: Trust Python Semantics

  **Chosen:** No explicit pre-commit validation; trust Python file I/O correctness

  **Rejected:**
  - Pre-write validation routine — adds code complexity, duplicates work Python guarantees
  - Strict byte-range enforcement (400-600) — artificially constrains valid content, conflicts with flexible prose requirement
  - Post-commit verification — unnecessarily complex for deterministic operations

  **Rationale:** The spec includes validation requirements (UTF-8 encoding, LF line endings, 400-600 bytes,
  CommonMark syntax), but these are specification requirements (success criteria to verify), not implementation
  requirements (code to write). When using Python's pathlib and text mode with explicit encoding:
  - UTF-8 encoding is guaranteed
  - LF line endings are guaranteed (when explicitly using `\n`)
  - 400-600 byte size naturally emerges from the structure (observed in precedents: 351-581 bytes)
  - CommonMark validity is implicit when following the established pattern (heading + prose)

  The 200+ precedent files confirm this pattern works. No additional validation code is needed.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O and path handling | Use | Standard library (Python 3.11+), no external dependency, modern and safe |
  | subprocess | Running git CLI commands | Use | Standard library, simple interface for external command execution, no dependency |
  | GitPython | Git operations (alternative) | Reject | Unnecessary external dependency when git CLI is available; adds complexity for simple operations |
  | Jinja2 | Content templating (alternative) | Reject | Unnecessary for single static file; adds external dependency |
  | Any LLM API | Content generation (alternative) | Reject | Adds network dependency, non-determinism, complexity; contradicts hardcoded approach |

  ## Security Considerations

  ### File Path Injection
  **Risk:** If file path comes from untrusted input, path traversal attacks are possible (e.g., `../../../etc/passwd`).
  **Mitigation:** The filename `test-1j0p04.md` is hardcoded in the spec, not user-configurable. pathlib.Path
  operations are safe for path construction. No untrusted input reaches file operations.

  ### Prose Content Injection
  **Risk:** If prose content comes from untrusted sources or is procedurally generated, it could contain malicious markdown
  or encoded content.
  **Mitigation:** Content is either hardcoded by implementer or sourced from trusted, human-reviewed content. No
  untrusted data flows into the file. Markdown is a safe format (not executable code).

  ### Git Credential Exposure
  **Risk:** Git push requires authentication; credentials could be exposed in subprocess output or git configuration.
  **Mitigation:** subprocess commands do not capture git authentication credentials. Git authentication is handled
  by git client (SSH keys, GitHub tokens, etc.) configured in the environment. No credentials are passed as arguments
  or logged.

  ### File System Permissions
  **Risk:** Write operations could fail or create files with incorrect permissions.
  **Mitigation:** Feature requires write access to repository root (already available per spec). pathlib.Path.write_text()
  uses default permissions, which are safe for version-controlled files. No sensitive permissions needed.

  ## Performance Implications

  ### File Creation
  - **Impact:** Negligible. Creating a single ~450-byte file is microseconds of I/O.
  - **Optimization:** No optimization needed for a single small file operation.

  ### Git Operations
  - **Impact:** Minimal. Three git CLI calls (add, commit, push) are fast local operations except for push.
  - **Optimization:** Push to remote branch could take 1-2 seconds depending on network. No optimization available
    without changing the requirement (push is mandatory).

  ### Overall Performance
  - **Total execution time:** ~10-15 minutes (as per spec) is dominated by implementer thinking about prose topic,
    not by file I/O or git operations. Technical execution is negligible (<1 second).

  ## Architecture Notes

  ### Integration with Existing Pattern
  The feature follows the established pattern from 200+ precedent files (features 069-208). Each file:
  - Lives at repository root as `test-*.md`
  - Contains a markdown heading (# Title)
  - Contains 2-3 sentences of prose following the heading (blank line separator)
  - Is committed with conventional commit message format
  - Is pushed to feature branch

  This implementation requires no changes to application code, configuration, or build system. It is purely a
  file creation and git workflow exercise, demonstrating:
  1. Ability to create files with specific structure
  2. Understanding of markdown format
  3. Integration with git version control
  4. Conventional commit message conventions

  ### No Dependencies on Application Code
  The feature does not:
  - Import or use any code from `/src/sheep/`
  - Modify configuration files
  - Create test fixtures or test code
  - Change build, deployment, or CI/CD setup
  - Require any application architecture understanding

  This isolation makes the feature low-risk and fast to implement.

  ### Scalability Notes
  Creating 200+ markdown test files demonstrates the feature scales well. Each file is independent;
  no coordination or complex state management needed. The implementation pattern is identical for any
  markdown file in the repository.

  ---

  _Research phase complete — technical decisions documented, library choices justified, security and
  performance implications evaluated. Ready for implementation phase._
