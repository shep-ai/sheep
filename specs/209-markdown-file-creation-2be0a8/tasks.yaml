  before git integration. Uses Python pathlib for file I/O with explicit encoding control.

  **Phase 2: Git Integration** (Task 2, depends on Task 1)
  Stages the created file in git, commits it with conventional commit message format,
  and pushes to the feature branch. This phase completes the automated workflow,
  demonstrating version control integration.

  Both tasks follow TDD cycles: RED (verify current state is incorrect), GREEN (implement
  minimal code to satisfy requirements), REFACTOR (clean up if needed — minimal for
  simple operations).

  Total effort: 10 minutes (5m file creation + 5m git operations) plus 0-8 minutes for
  prose topic selection and writing, totaling within the S (Small) estimate of 10-15 minutes.

  ## Task Execution Order

  1. **Task 1** must complete before Task 2 (file must exist before staging in git)
  2. Both tasks are deterministic with minimal external dependencies
  3. Phase 1 requires no external state beyond write access to repository root
  4. Phase 2 requires git authentication (environment setup per spec) and existing feature branch
