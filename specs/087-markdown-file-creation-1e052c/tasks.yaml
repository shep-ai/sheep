# Markdown content (the full tasks document)
content: |
  ## Implementation Flow

  Feature 087 implementation follows a straightforward 3-task sequence across 2 phases:

  ### Phase 1: File Creation & Validation (8 minutes)

  **Task 1: Create markdown file with prose content (5 minutes)**

  Write `test-tq33xp.md` at repository root with:
  - H1 heading on line 1: `# <Universal Topic>`
  - Blank line after heading
  - 2-3 sentences of coherent prose on a universal topic (reading, learning, breaks, work habits, etc.)

  Example structure (from existing files):
  ```markdown
  # The Importance of Regular Breaks

  Taking regular breaks throughout your day is essential for maintaining productivity and mental clarity. These brief pauses allow your mind to rest and recharge, enabling you to return to work with renewed focus. Small breaks also help reduce stress and improve overall well-being.
  ```

  **Task 2: Verify file encoding and format requirements (3 minutes)**

  After file creation, verify:
  - File is UTF-8 encoded without BOM (automatic via Python 3 pathlib)
  - File uses LF line endings, not CRLF (automatic via Python 3 strings)
  - File size is 320-600 bytes (adjust prose if needed to stay within range)
  - Markdown syntax is valid (H1 heading matches spec)
  - All sentences are grammatically correct and complete

  If file size is outside the range, revise prose and recount. Expected size for 3 sentences: ~450 bytes.

  ### Phase 2: Git Integration (5 minutes)

  **Task 3: Stage, commit, and push to feature branch (5 minutes)**

  Execute git workflow using standard CLI commands:

  ```bash
  # Stage the file
  git add test-tq33xp.md

  # Verify staging
  git status

  # Create commit with conventional message
  git commit -m "feat(087): create markdown file test-tq33xp.md with prose content"

  # Push to feature branch (already exists)
  git push -u origin feat/087-markdown-file-creation-1e052c
  ```

  All operations use standard git commands with no force flags or destructive operations.

  ## Task Ordering and Dependencies

  Tasks are strictly ordered by dependency:

  1. **Task 1** (Create file) must complete first — no dependencies
  2. **Task 2** (Verify file) depends on Task 1 — file must exist before verification
  3. **Task 3** (Git workflow) depends on Task 2 — file must be valid before staging

  This ordering ensures file quality is verified before committing to git.

  ## TDD Approach

  Each task includes a TDD cycle:

  ### Task 1: RED → GREEN → REFACTOR
  - **RED:** Assert file does not exist before starting
  - **GREEN:** Create file with prose content using pathlib.Path.write_text()
  - **REFACTOR:** Polish prose for clarity and ensure coherence

  ### Task 2: RED → GREEN → REFACTOR
  - **RED:** Assert file encoding, line endings, and size match requirements
  - **GREEN:** Inspect file with Python (bytes, size, encoding) and verify compliance
  - **REFACTOR:** If size is out of range, adjust prose and re-test

  ### Task 3: RED → GREEN → REFACTOR
  - **RED:** Verify file is untracked/unstaged before git operations
  - **GREEN:** Execute git add, commit, and push commands
  - **REFACTOR:** Verify commit message format and push success

  ## Effort Estimate: 13 minutes

  - **Task 1:** 5 minutes (compose prose, write file)
  - **Task 2:** 3 minutes (verify encoding, check size)
  - **Task 3:** 5 minutes (git add, commit, push)
  - **Total:** 13 minutes

  This aligns with the feature spec's size estimate of "S" (10-15 minutes).

  ## Success Criteria

  Feature implementation is complete when:

  1. File `test-tq33xp.md` exists at repository root
  2. File contains valid markdown: `# Title\n\n<3 sentences>`
  3. File is UTF-8 encoded without BOM, uses LF line endings
  4. File size is 320-600 bytes
  5. File is staged, committed, and pushed to branch
  6. Commit message follows conventional format: `feat(087): create markdown file test-tq33xp.md with prose content`
  7. Feature branch `feat/087-markdown-file-creation-1e052c` contains the commit

  All success criteria map to spec requirements and acceptance criteria.
