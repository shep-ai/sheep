content: |
  ## Task Breakdown Summary

  This feature requires 5 concrete, ordered tasks across 2 sequential phases totaling approximately 50 minutes of work.

  ### Phase 1: Content Generation & File Creation (3 tasks, ~35 minutes)

  These tasks produce a valid, spec-compliant markdown file on disk:

  1. **Generate Content** (~15 min): Call `generate_markdown_content()` to produce valid markdown with H1 heading and 2-3 sentences of prose. This leverages the existing LLM integration in the Sheep platform.

  2. **Write File** (~10 min): Write the generated content to `test-59xln4.md` in the repository root using `open()` with UTF-8 encoding in text mode. Ensures proper encoding and Unix line endings.

  3. **Validate File** (~10 min): Use the existing `validate_markdown_file()` function to comprehensively verify all spec requirements are met, including heading structure, blank line separator, sentence count, encoding, line endings, and file size.

  ### Phase 2: Git Workflow (2 tasks, ~15 minutes)

  These tasks stage, commit, and publish the changes:

  4. **Stage & Commit** (~10 min): Stage the file with git and create a commit with the conventional message format following features 001-100. This ensures traceability and consistency.

  5. **Push to Remote** (~5 min): Push the commit to the remote feature branch with proper upstream tracking so the changes are published to the repository.

  ### Rationale for Task Ordering

  - **Content generation precedes file writing:** The generated content must exist before it can be written to disk.
  - **Validation follows file creation:** The file must be written to disk before it can be validated as a complete unit.
  - **Git operations follow validation:** The file must be valid before being committed and published.
  - **Staging precedes commit:** The file must be staged before it can be committed.
  - **Commit precedes push:** The commit must exist locally before it can be pushed to remote.

  ### Task Dependencies

  ```
  task-1-generate-content
    ↓
  task-2-write-file
    ↓
  task-3-validate-file
    ↓
  task-4-stage-and-commit
    ↓
  task-5-push-to-remote
  ```

  All tasks are sequential with no parallelization opportunities. Each task depends on the successful completion of the previous task.

  ### TDD Approach

  Each task follows Test-Driven Development:
  - **RED:** Write assertions/tests that define expected behavior
  - **GREEN:** Implement minimal code to make those tests pass
  - **REFACTOR:** Clean up, log, verify, and improve code quality

  This ensures each task produces verifiable, correct results before moving to the next task.
