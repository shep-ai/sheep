content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-18
  - **Dependencies:** None (uses only existing code and standard library)

  ## Technology Decisions

  ### 1. Content Generation Approach

  **Chosen:** LLM-based generation using CrewAI integration via `sheep.content_generators.generate_markdown_content()`

  **Rejected:**
  - Manual prose writing — slower, adds implementer burden, not scalable for 100+ features
  - Template-based generation — less flexible, requires maintaining topic library, reduces prose quality variance
  - Random text generation — produces incoherent content, fails validation, unhelpful output

  **Rationale:** The codebase already provides a complete LLM-based content generation system. This function integrates with CrewAI's `get_reasoning_llm()` for coherent prose generation and includes built-in validation via `_validate_markdown_content()`. The approach scales across 100+ features, maintains output quality, and aligns with the Sheep platform's agentic architecture. Using the existing implementation avoids code duplication and leverages proven patterns from features 001-100.

  **Implementation Reference:** `src/sheep/content_generators.py`, lines 27-68

  ### 2. File I/O and Encoding Method

  **Chosen:** Python `open()` with explicit `encoding='utf-8'` in text mode

  **Rejected:**
  - `pathlib.Path.write_text()` — less control over encoding specification, harder to debug encoding issues
  - Binary mode with manual byte encoding — more complex, easier to introduce line-ending bugs, verbose
  - Third-party libraries (e.g., codecs) — unnecessary dependency, standard library is sufficient

  **Rationale:** The established pattern in `src/sheep/content_generators.py` (line 128) uses `open(file_path, "w", encoding="utf-8")`. This approach ensures UTF-8 encoding without BOM (Python's default for text mode) and preserves platform-native line endings. On Unix (the deployment target), text mode with UTF-8 preserves LF line endings naturally. The code is readable, maintainable, and proven across 100+ existing test files.

  **Implementation Reference:** `src/sheep/content_generators.py`, lines 127-129

  ### 3. Line Ending Handling (LF vs CRLF)

  **Chosen:** Rely on platform defaults with text-mode `open()` and explicit trailing newline enforcement

  **Rejected:**
  - Platform detection code (if sys.platform...) — adds complexity, error-prone across platforms
  - Cross-platform newline library (universal-newlines flag) — unnecessary, text mode already handles this
  - Binary mode with manual LF replacement — complex, obscures intent, maintenance burden

  **Rationale:** Python's text mode with UTF-8 encoding automatically handles line endings correctly per platform. On Unix/Linux (the deployment target), text mode preserves LF line endings without modification. The `generate_markdown_content()` function explicitly ensures trailing newline (lines 57-58), satisfying the Unix convention requirement. File validation checks for CRLF presence and fails if found (line 197-198), ensuring compliance with the spec's requirement for LF-only files.

  **Implementation Reference:** `src/sheep/content_generators.py`, lines 56-58, 127-129, 196-198

  ### 4. Content Validation Strategy

  **Chosen:** Use existing `validate_markdown_file()` from `sheep.content_generators` module

  **Rejected:**
  - Skip validation — violates spec non-functional requirements, risks publishing invalid files
  - Custom validation in implementation — duplicates existing code, harder to maintain consistency
  - External validation library — unnecessary dependency, codebase already has comprehensive validation

  **Rationale:** The `validate_markdown_file()` function (lines 150-244 in content_generators.py) provides comprehensive validation covering all spec requirements: UTF-8 encoding, LF line endings, H1 heading, blank line separator, 2-3 sentences (by period count), and trailing newline. Using the existing implementation ensures consistency with features 001-100 and avoids code duplication. The validation is thorough, well-tested, and directly addresses all non-functional requirements.

  **Validation Checks:**
  - UTF-8 encoding with no BOM
  - LF line endings (no CRLF)
  - H1 heading as first line
  - Blank line as second line (separator)
  - 2-3 sentences (counted by periods)
  - Trailing newline at end of file

  **Implementation Reference:** `src/sheep/content_generators.py`, lines 150-244

  ### 5. Git Commit Message Format

  **Chosen:** `feat(101): create markdown file test-59xln4.md with prose content`

  **Rejected:**
  - `feat: Create test-59xln4.md markdown file with [topic] content` — missing feature number, inconsistent with 001-100
  - `chore(101): add test-59xln4.md` — wrong commit type, should be feat for new file creation
  - `test(101): create markdown file` — misleading scope, file is not a test

  **Rationale:** Git log shows established pattern: `feat(100): create markdown file test-lk80lh.md with prose content` (commit c534a4b). All features in the 001-100 range follow this format. This format provides traceability (feature number), clarity (scope matches feature type), and consistency with all precedents. The commit message clearly identifies the file and action in conventional commits format.

  **Pattern Evidence:** Features 096-100 all use format: `feat(NNN): create markdown file test-XXXXX.md with prose content`

  **Implementation Reference:** Git commit history (c534a4b, 597a032, 1e807da, etc.)

  ### 6. File Path and Location Strategy

  **Chosen:** Repository root via `Path.cwd()`, exact filename `test-59xln4.md`, no subdirectories

  **Rejected:**
  - Subdirectory organization (test-files/test-59xln4.md) — violates established pattern, inconsistent with 100+ files
  - Dynamic path construction — unnecessary complexity, root is simpler and proven
  - Configurable path via environment variables — adds deployment complexity, contradicts pattern

  **Rationale:** All 100 preceding test markdown files are in the repository root. The spec explicitly requires "repository root directory (no subdirectories)". Using `Path.cwd()` automatically locates the repository root, matching content_generators.py (line 121). This approach is simple, proven, and consistent across the feature set.

  **Evidence:** File listing shows ~79 test-*.md files directly in repository root

  **Implementation Reference:** `src/sheep/content_generators.py`, lines 120-122

