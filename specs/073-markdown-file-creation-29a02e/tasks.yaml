# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation proceeds in two logical phases. **Phase 1 (File Creation & Validation)**
  creates the markdown file with prose content and validates it meets all encoding,
  structure, and content requirements. **Phase 2 (Git Integration)** stages the file,
  commits with a conventional message, and pushes to the feature branch.

  **Task Flow:**
  1. Create markdown file with prose (H1 heading + 2-3 sentences)
  2. Validate encoding (UTF-8, no BOM), line endings (LF), structure, and sentence count
  3. Stage file with `git add`
  4. Commit with message: `feat(073): create markdown file test-gwplv4.md with prose content`
  5. Push to remote origin feature branch

  **Design Rationale:**
  - Validation (Task 2) comes before git operations (Tasks 3-5) to ensure consistent state
  - Git operations are ordered: add → commit → push (each depends on previous success)
  - Each task has clear acceptance criteria with binary success/failure
  - TDD cycles are appropriate for file operations: verify state before/after each action

  **Effort Breakdown:**
  - Task 1 (File Creation): 15min — writing prose content and file creation
  - Task 2 (Validation): 15min — implementing and testing validation checks
  - Task 3 (Stage): 5min — git add and verification
  - Task 4 (Commit): 5min — git commit with correct message
  - Task 5 (Push): 5min — git push and remote verification
  - **Total: 45min** (plus 15min buffer for unexpected issues = ~1 hour)

  **Key Implementation Notes:**
  - Prose content should be readable and coherent (basic readability standard)
  - Prose topic is completely unrestricted ("about anything")
  - File creation uses pathlib: `Path("test-gwplv4.md").write_text(content, encoding='utf-8')`
  - Git commands use subprocess with check=True for error handling
  - No external dependencies required (uses only Python standard library)
