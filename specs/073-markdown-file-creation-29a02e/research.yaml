# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Pattern:** Continuation of 65+ identical test file creation features (064-072)

  ## Executive Summary

  Feature 073 is a straightforward markdown file creation task that follows an
  established, proven pattern with 65+ existing test files in the repository. Technical
  implementation is minimal and uses only Python standard library (pathlib, subprocess),
  requiring no external dependencies. Risk is low due to pattern maturity and simplicity.

  ## Technology Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path("test-gwplv4.md").write_text(prose_content, encoding='utf-8')`

  **Rejected:**
  - `open()` with manual context management — verbose, less idiomatic, error-prone
  - Direct bytes writing — requires manual UTF-8 encoding, loses text conveniences

  **Rationale:**
  pathlib is the modern Python 3 standard for file operations. The write_text() method
  provides concise, safe text file creation with automatic resource management. Explicit
  `encoding='utf-8'` parameter ensures consistent encoding across platforms and satisfies
  NFR-1 (no BOM). This approach is used across all 65+ existing test files and is
  demonstrated in create_markdown.py (the reference implementation provided).

  ### 2. Line Endings: Platform-Native via pathlib

  **Chosen:** Direct string content with \n literals (pathlib handles platform translation)

  **Rejected:**
  - Explicit `newline="\n"` parameter — redundant and may force incorrect behavior
  - Post-write string replacement — additional I/O, not idiomatic, error-prone

  **Rationale:**
  On Unix systems (Linux/macOS/Windows with bash), pathlib.write_text() preserves \n
  literals in source strings as-is, resulting in LF line endings (required by NFR-2).
  The prose content is defined with \n literals in the Python source, ensuring explicit
  control. This satisfies the validation check in create_markdown.py that asserts no
  \r\n byte sequences exist.

  ### 3. Git Integration: subprocess.run() with check=True

  **Chosen:** Three sequential subprocess.run() calls: git add, git commit, git push

  **Rejected:**
  - GitPython library — external dependency (violates NFR-9), overkill for simple sequential operations
  - os.system() — no error handling, less portable, shell injection risks

  **Rationale:**
  subprocess.run() is the standard Python approach for external commands. With `check=True`,
  it raises CalledProcessError on non-zero exit codes, enabling early failure detection.
  Separate calls clarify which step failed and match the pattern in create_markdown.py.
  No external dependencies required (uses only standard library). The `--no-verify` flag
  on commit skips pre-commit hooks, following the established pattern in features 064-072.

  ### 4. Commit Message Format: Conventional Commits

  **Chosen:** `feat(073): create markdown file test-gwplv4.md with prose content`

  **Rejected:**
  - Free-form messages — inconsistent with codebase, harder to automate
  - Semantic versioning format — not applicable for test file features

  **Rationale:**
  Conventional Commits (feat/fix/docs type) is the established standard in the Sheep
  codebase. All features 064-072 follow this format in git history. Including the feature
  number (073) provides clear traceability. The message accurately describes the action
  (create markdown file) and the artifact (test-gwplv4.md) with context (prose content).

  ### 5. Validation: Post-Write Structural Checks

  **Chosen:** Validate after writing using binary and text inspection

  **Rejected:**
  - No validation — risks silent format violations, encoding issues
  - Complex markdown parser validation — adds dependency, overkill for simple format

  **Rationale:**
  The validation step (from create_markdown.py) is essential for catching encoding issues
  and format violations before git operations. Checks performed:

  1. **UTF-8 without BOM:** Assert binary content does not start with `\xef\xbb\xbf`
  2. **LF line endings:** Assert no `\r\n` byte sequences present
  3. **File size:** Assert 350-650 byte range (typical for this pattern)
  4. **Structure:** Assert H1 heading on line 1, blank line 2, prose follows
  5. **Sentence count:** Count periods, assert 2-3 sentences present

  These checks are lightweight, have no external dependencies, and directly verify
  compliance with NFRs and FRs.

  ### 6. Heading Level: H1 (#)

  **Chosen:** Single # (H1) as document title

  **Rejected:**
  - ## (H2) — violates established pattern in 65+ test files
  - No heading — violates FR-3 requirement

  **Rationale:**
  All 65+ existing test markdown files uniformly use H1 headings as document titles.
  This is the established, proven pattern. H1 is semantically correct for a document
  title. Consistency across all test files enables pattern recognition and automated
  processing.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | **Use** | Modern Python 3 standard for path and file operations. No external dependency. Used in all 65+ test files. write_text() provides safe, idiomatic text file creation. |
  | subprocess (stdlib) | External git commands | **Use** | Standard for invoking external commands in Python. Provides proper error handling with check=True. No external dependency. Used in create_markdown.py pattern. |
  | GitPython | High-level git operations | **Reject** | Adds external dependency (violates NFR-9). Overkill for simple sequential git commands (add, commit, push). subprocess provides sufficient functionality. |
  | markdownlint | Markdown validation | **Reject** | External dependency, requires separate tool installation. Unnecessary for simple structure validation (heading+prose+sentences). Built-in checks sufficient. |

  ## Security Considerations

  ### 1. Encoding Safety

  **Issue:** Text encoding mismatches can cause data corruption or security issues.

  **Mitigation:** Explicit `encoding='utf-8'` parameter in write_text() ensures consistent
  UTF-8 encoding across platforms. Validation step explicitly checks for BOM (Byte Order
  Mark) absence using binary content inspection: `assert not binary_content.startswith(b'\xef\xbb\xbf')`.
  This prevents encoding vulnerabilities and ensures file is readable with standard UTF-8
  decoders.

  ### 2. Line Ending Consistency

  **Issue:** Inconsistent line endings (\r\n vs \n) can cause git diffs to show spurious
  changes, confuse tools, or cause cross-platform issues.

  **Mitigation:** Validation step explicitly checks for CRLF:
  `assert b'\r\n' not in binary_content`. Python source code uses \n literals, ensuring
  LF is written. This maintains consistency with 65+ existing test files and prevents
  git configuration surprises.

  ### 3. Content Validation

  **Issue:** Malformed markdown could fail parsing downstream or violate spec requirements.

  **Mitigation:** Post-write validation checks structure (heading present, blank line
  separator, sentence count 2-3). This is a defensive check to catch implementation errors
  before git operations, though the input content is hardcoded and not external.

  ### 4. Git Command Injection

  **Issue:** Passing unsanitized input to git commands could enable shell injection.

  **Mitigation:** Using subprocess.run() with argument list (not shell=True) prevents
  shell injection. File name test-gwplv4.md is hardcoded, not user-provided. Commit
  message is hardcoded, not user-provided. No shell metacharacters in any arguments.
  This approach is safe even if code were to be modified in future.

  ### 5. File Overwrite Safety

  **Issue:** Silently overwriting existing files could lose data.

  **Mitigation:** This is a product decision already resolved in the spec (silently
  overwrite for idempotence). In automated systems, this is acceptable because: (1) feature
  branches are isolated, (2) code is version controlled, (3) overwrites are intentional
  part of idempotent design. For safety in non-automated contexts, pre-write backup or
  confirmation could be added, but this contradicts the design intent.

  ## Performance Implications

  ### 1. File Creation

  **Impact:** Negligible. Single small file (~500 bytes) creation is microseconds.
  No loops, no bulk operations. I/O is blocking but duration is < 1ms.

  **Optimization:** None needed. File I/O dominates total time (10-15 minutes estimate is
  for human workflow, not computational performance).

  ### 2. Validation

  **Impact:** Negligible. Binary inspection and text splitting are O(n) where n = file
  size (500 bytes). String operations (period counting) are O(n). Total validation is
  < 5ms.

  **Optimization:** None needed. Validation is not a bottleneck.

  ### 3. Git Operations

  **Impact:** Dominant factor in total time. git add, commit, and push involve:
  - Index updates (milliseconds for single file)
  - Object creation and compression (milliseconds for small text)
  - Network I/O for push (100ms-1s+ depending on network, typically 5-10s for https)

  **Optimization:** Push is the slowest step but unavoidable. Could use --force-with-lease
  for atomic push, but not necessary for feature branches. Network speed is not controllable.
  The 10-15 minute estimate in the spec includes human delay for manual prose writing,
  which dominates the total.

  ### 4. Memory Usage

  **Impact:** Negligible. Entire file (500 bytes) loaded into memory once. No streaming,
  no large buffers. Constant memory regardless of file size.

  **Optimization:** Not applicable. Memory is not a constraint.

  ## Architecture Notes

  ### 1. Pattern Integration

  This feature is part of a 65+ file series (features 064-072+) that follow an identical
  pattern. The Sheep project uses these features as:
  - **Test cases for automated implementation:** Each feature is a minimal unit of work
    that exercises the platform's ability to: create files, validate content, commit
    with conventional messages, and push to branches.
  - **Progress tracking:** Each successfully implemented feature validates the automation
    pipeline works end-to-end.
  - **Pattern documentation:** The 65+ test files serve as examples of the markdown
    structure that downstream tools expect.

  ### 2. Repository Structure Impact

  - **Repository root:** Adds test-gwplv4.md (500 bytes) to existing 65+ test files
  - **Spec directory:** Updates specs/073-markdown-file-creation-29a02e/ with this research
  - **Source code:** No changes to /src/sheep/ or other application code
  - **Tests:** No changes to test suite
  - **Git history:** Adds one commit to feature branch feat/073-markdown-file-creation-29a02e

  No architectural impact to the application.

  ### 3. No Dependency on Source Code

  This feature is completely isolated from the application in /src/sheep/. It does not:
  - Import or use any Sheep modules
  - Call any APIs or tools
  - Depend on any configuration beyond git setup
  - Require any external services

  This isolation makes it a reliable test of the implementation automation platform without
  requiring full application functionality.

  ### 4. Established Implementation Pattern

  The reference implementation (create_markdown.py) provided in the repository demonstrates
  the exact approach to follow:

  ```python
  # 1. Define prose content
  PROSE_CONTENT = """# Heading\n\n<2-3 sentences>"""

  # 2. Create file with pathlib
  path = Path("test-gwplv4.md")
  path.write_text(PROSE_CONTENT, encoding='utf-8')

  # 3. Validate
  validate_file(path)

  # 4. Stage and commit with git
  subprocess.run(['git', 'add', FILENAME], check=True)
  subprocess.run(['git', 'commit', '--no-verify', '-m', message], check=True)
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  This pattern is proven across 65+ features and provides a reliable template.

  ## Conclusion

  Feature 073 is a straightforward implementation following a well-established pattern with
  65+ precedents. Technical decisions are minimal and all follow existing codebase standards:

  - **File I/O:** pathlib.write_text() with explicit UTF-8 encoding
  - **Git Integration:** subprocess with standard commands
  - **Validation:** Lightweight structural checks before committing
  - **Message Format:** Conventional Commits aligned with codebase
  - **Dependencies:** None (uses only Python standard library)

  Risk is low, and implementation complexity is minimal. The 10-15 minute time estimate
  is dominated by prose writing and git operations, not code complexity.

