  - question: 'What error handling strategy should be used if git commands fail?'
    resolved: true
    options:
      - option: 'Fail fast with CalledProcessError exception'
        description: 'subprocess.run(..., check=True) raises exception on non-zero git exit. Clear error propagation, script stops on first failure. Helps identify which step failed (add, commit, push).'
        selected: true
      - option: 'Log errors and continue execution'
        description: 'Catch exceptions, log, and attempt next steps anyway. Could create inconsistent state (file created but not committed). Less reliable for automated systems.'
