# Structured technology decisions
decisions:
  - title: 'File I/O Approach for Markdown Creation'
    chosen: 'pathlib.Path.write_text() with explicit UTF-8 encoding'
    rejected:
      - 'open() function with manual file handling — less idiomatic Python 3, requires explicit close() or context manager, more boilerplate'
      - 'Writing bytes directly with write_bytes() — requires manual UTF-8 encoding of strings, loses convenience of text mode'
    rationale: >
      pathlib.Path.write_text() is the modern Python 3.11+ standard for text file creation.
      It provides: (1) idiomatic, concise API, (2) automatic file closing, (3) built-in
      encoding parameter, (4) automatic handling of OS-specific path separators. All 65+
      existing test files created via this pattern (observed in create_markdown.py).
      Explicit encoding='utf-8' parameter ensures consistent encoding without BOM across
      platforms, satisfying NFR-1 and NFR-2. Matches established pattern in codebase.

  - title: 'Line Ending Normalization'
    chosen: 'Rely on pathlib.write_text() with utf-8 encoding (no explicit newline conversion)'
    rejected:
      - 'Use newline parameter in write_text(newline="\n") — redundant since write_text() defaults to universal newlines, actual LF handling depends on platform and encoding'
      - 'Post-process file with .replace("\r\n", "\n") after writing — adds unnecessary I/O operation, less performant, error-prone'
    rationale: >
      Python's pathlib.write_text() with utf-8 encoding on Unix systems (Linux/macOS/Windows
      with Unix bash) defaults to LF line endings without BOM. The explicit newline=None
      default uses universal newlines semantics: writes platform-native line endings on
      open(), but since PROSE_CONTENT in implementation uses \n literals (not os.linesep),
      content control is explicit. For Windows bash environment (current), pathlib respects
      the string literal \n as provided. Validation step in create_markdown.py confirms no
      \r\n bytes present. Simplest, most reliable approach with no extra processing.

  - title: 'Git Integration Method for Staging and Committing'
    chosen: 'subprocess.run() for git commands with check=True'
    rejected:
      - 'GitPython library — adds external dependency, violates NFR-9 (no new dependencies), overkill for simple sequential git commands'
      - 'Direct command-line invocation via os.system() — no error handling, less portable, harder to debug failed git commands'
    rationale: >
      subprocess.run() with check=True is the standard Python approach for external command
      execution. Provides: (1) cross-platform compatibility (Windows/Linux/macOS), (2) proper
      error handling (raises CalledProcessError on non-zero exit), (3) no external dependencies,
      (4) explicit argument list prevents shell injection, (5) aligns with create_markdown.py
      pattern. Using --no-verify flag on git commit skips pre-commit hooks (per existing
      pattern in feature implementations), acceptable for automated feature branches. Separate
      calls for git add, commit, and push maintain clarity and allow catching errors at each step.

  - title: 'Commit Message Format'
    chosen: 'Conventional Commits format: "feat(073): create markdown file test-gwplv4.md with prose content"'
    rejected:
      - 'Semantic versioning with version bump — not applicable for test file creation, overkill for non-library features'
      - 'Free-form commit messages — breaks consistency with existing codebase, harder to parse for automation, fails to document feature number'
    rationale: >
      Conventional Commits (feat/fix/docs type prefix) is established standard in Sheep
      codebase (observed in git log: features 064-072 all use feat(N):). Format includes
      feature number (073) for traceability and clear description of what was created.
      Aligns with codebase conventions and enables automated changelog generation if needed.
      Message directly references the created file and its purpose (prose content creation).

  - title: 'Content Validation Strategy'
    chosen: 'Post-write validation with specific checks for encoding, line endings, structure, and sentence count'
    rejected:
      - 'Skip validation entirely — risks silent failures, undetected encoding issues, malformed markdown'
      - 'Validation at write-time with context managers — adds complexity, harder to debug, obscures file creation logic'
    rationale: >
      Validation after file creation is clearest and most maintainable approach. Separate
      validate_file() function (from create_markdown.py pattern) performs: (1) UTF-8 encoding
      check (no BOM), (2) LF line ending verification, (3) file size bounds check (350-650
      bytes), (4) content structure verification (H1 heading, blank line, prose). Binary
      content check for BOM and CRLF is more reliable than text-level inspection. Sentence
      count via period counting is simple heuristic for 2-3 sentence requirement. Validation
      failures raise AssertionError with clear messages, catching issues before git operations.

  - title: 'Markdown Heading Level Choice'
    chosen: 'H1 (single #) as document title'
    rejected:
      - 'H2 (##) — violates established pattern in 65+ test files which uniformly use H1'
      - 'No heading — violates FR-3 requirement and breaks markdown semantic structure'
    rationale: >
      All 65+ existing test markdown files uniformly begin with H1 heading (#). This is
      the established pattern and satisfies FR-3 explicitly ("file must contain markdown H1
      heading"). H1 represents the document title, which is semantically correct. H2 would
      suggest this is a subsection of a larger document, which is not the case. Consistency
      across all test files is critical for pattern recognition and automated processing.

