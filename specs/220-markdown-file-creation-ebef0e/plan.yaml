# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The implementation follows the established pattern of features 099-219: a standalone Python script at the repository root
  that orchestrates markdown file creation and git workflow operations.

  **Script Structure:**
  - Single file: `create_markdown_file_220.py`
  - Modular functions for each operation: `create_markdown_file()`, `stage_file()`, `commit_file()`, `push_to_branch()`
  - Main entry point: `main()` function that executes all operations in sequence
  - Dependencies: Python 3.11+ standard library only (pathlib, subprocess)

  **Integration Point:**
  The script runs independently from the Sheep framework. It does not require integration with src/sheep/features,
  agent systems, or observability infrastructure. Per spec NFR-4, no validation, error handling, or configuration is required.
  The feature branch is dedicated to this single file creation, so imperative execution (create → stage → commit → push)
  is sufficient.

  **Success Verification:**
  1. File `test-yt6y8d.md` exists at repository root with correct content
  2. File is staged in git (visible via `git status`)
  3. Commit with message "feat(220): Create markdown file test-yt6y8d.md" exists in git log
  4. Feature branch is pushed to remote origin

  ## Key Design Decisions

  ### 1. Standalone Script vs. Framework Integration
  **Decision:** Standalone Python script at repository root (`create_markdown_file_220.py`)

  **Rationale:**
  - Matches the pattern of features 216-219 (most recent precedents)
  - Spec explicitly does not require framework integration (NFR-4: no configuration)
  - Simpler to understand, test, and debug in isolation
  - No Sheep framework knowledge required for implementation
  - Aligns with research finding: "Standalone script is simplest, most direct approach"

  ### 2. File I/O Method
  **Decision:** `pathlib.Path.write_text(encoding="utf-8", newline="\n")`

  **Rationale:**
  - Modern Python 3.11+ standard (all 216+ precedent features use pathlib)
  - Explicit encoding and newline parameters ensure cross-platform correctness
  - Atomic write operation (safer than open/write/close pattern)
  - Built-in UTF-8 support without BOM
  - Unix LF line endings on all platforms (including Windows)

  ### 3. Git Command Execution
  **Decision:** `subprocess.run(..., shell=False, check=True)`

  **Rationale:**
  - Secure (no shell interpretation, prevents command injection)
  - Supports fail-fast via `check=True` (automatic CalledProcessError on non-zero exit)
  - No external dependencies (meets NFR-7: stdlib-only requirement)
  - Used by all 216+ precedent features
  - Clear error signaling to system (exit codes)

  ### 4. Markdown Content
  **Decision:** Hardcoded H1 heading + blank line + 2 sentences of prose

  **Rationale:**
  - Avoids LLM API overhead and cost
  - Simple, deterministic, reproducible
  - Sufficient to demonstrate feature capability
  - Spec allows "implementation team selection of topic" (FR-9)
  - Feature 219 (identical spec) uses hardcoded content
  - All 216+ precedents use hardcoded content

  ### 5. Validation and Error Handling
  **Decision:** No validation, minimal error handling (rely on subprocess `check=True`)

  **Rationale:**
  - Spec NFR-4 explicitly forbids validation and error handling
  - Feature 219 (identical spec, immediately preceding) has no validation
  - subprocess `check=True` provides automatic fail-fast on git command failures
  - Imperative pattern (create → stage → commit → push) is sufficient
  - Simplicity over defensiveness per spec requirements

  ### 6. File Overwrite Behavior
  **Decision:** Overwrite silently (direct write without existence check)

  **Rationale:**
  - Spec's resolved question selects "Overwrite silently" as best approach
  - Feature branch is dedicated to this one file
  - pathlib.write_text() naturally overwrites any existing file
  - Ensures correct final state without complexity

  ## Implementation Strategy

  **Phase 1: Core Implementation**
  Implement each operation as a focused, testable function:
  1. File creation function using pathlib
  2. Git add function using subprocess
  3. Git commit function using subprocess
  4. Git push function using subprocess

  Each task is independent and can be verified before moving to the next.

  **Phase 2: Integration and Verification**
  Integrate all four functions into a single script with main() entry point.
  Execute the complete workflow end-to-end and verify success.

  **Task Ordering:**
  Tasks are ordered by logical dependency:
  - File must exist before it can be staged
  - File must be staged before it can be committed
  - File must be committed before it can be pushed

  The implementation script orchestrates these operations sequentially.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists in repository | Spec decision: overwrite silently. pathlib.write_text() naturally overwrites without error. |
  | Git commands fail (e.g., no git config) | subprocess.run(..., check=True) automatically raises CalledProcessError on non-zero exit codes. Fail-fast provides clear error signaling. |
  | Incorrect file encoding (UTF-16, ANSI, BOM) | Explicitly specify encoding=\"utf-8\" and newline=\"\\n\" in pathlib.write_text(). Tested across 216+ features. |
  | Wrong branch or commit message | Hardcoded values in script prevent typos or variation. Feature branch already exists and is checked out. Commit message is templated in code. |
  | File size or content doesn't match spec | Hardcoded content (2 sentences, ~300-600 bytes) is pre-verified against success criteria. Same pattern as 216+ precedent features. |
  | Script not executable or missing dependencies | No external dependencies beyond Python 3.11+ stdlib. Script is simple, standalone Python. Test by running directly: `python create_markdown_file_220.py` |
