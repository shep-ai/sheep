# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-26
  - **Analysis Scope:** Technical decisions, library evaluation, integration patterns

  ## Executive Summary

  Feature 220 (markdown-file-creation-ebef0e) is a straightforward single-file creation task following the proven pattern of 216+ identical features (099-219). Research confirms that the optimal implementation uses:

  - **File I/O:** Python pathlib.Path.write_text() with explicit UTF-8 encoding and Unix LF line endings
  - **Git Integration:** subprocess.run() with shell=False for secure command execution
  - **Content:** Hardcoded markdown with H1 heading and 2-3 prose sentences
  - **Structure:** Standalone Python script at repository root (no framework integration required)
  - **Validation:** None per spec requirement (NFR-4)
  - **Error Handling:** Fail-fast via subprocess check=True (no explicit exception handling)

  No external dependencies are required beyond Python 3.11+ standard library (pathlib, subprocess). The implementation follows the exact pattern of feature 219 (identical spec) and the 216+ precedent features.

  ## Technology Decisions

  ### 1. File I/O Implementation Method

  **Chosen:** pathlib.Path.write_text(encoding=\"utf-8\", newline=\"\\n\")

  **Rejected:**
  - open() with context manager — more verbose, less Pythonic for this use case
  - os.open()/os.write() — lower-level, unnecessary complexity
  - shutil.copy() or other utilities — overkill for simple file creation

  **Rationale:** pathlib is the modern Python standard (3.11+) for file operations and is used by all 216+ precedent features. It provides:
  - Simple, atomic write operation with single method call
  - Built-in UTF-8 support without BOM via encoding=\"utf-8\"
  - Platform-independent newline handling with newline=\"\\n\" (forces Unix LF on Windows)
  - Secure, Pythonic API matching contemporary best practices
  - No external dependencies

  ### 2. Git Command Execution Method

  **Chosen:** subprocess.run() with shell=False (secure, no shell interpretation)

  **Rejected:**
  - subprocess.run() with shell=True — command injection vulnerability
  - GitPython library — external dependency (violates NFR-7 stdlib-only requirement)
  - os.system() — deprecated, no structured error handling
  - Shell scripts or direct system calls — not Pythonic

  **Rationale:** subprocess.run(..., shell=False) is the secure Python standard used by all 216+ precedent features. Benefits:
  - Prevents command injection attacks (no shell interpretation)
  - Supports fail-fast via check=True (automatic CalledProcessError on failure)
  - Provides clean error signaling (exit codes, exceptions)
  - Zero external dependencies (meets NFR-7)
  - Simple, clear, maintainable code

  Git commands to execute (all simple, no shell metacharacters needed):
  - `git add test-yt6y8d.md`
  - `git commit -m \"feat(220): Create markdown file test-yt6y8d.md\"`
  - `git push -u origin feat/220-markdown-file-creation-ebef0e`

  ### 3. Markdown Content Generation

  **Chosen:** Hardcoded topic and prose sentences

  **Rejected:**
  - LLM-generated prose — API integration overhead, cost, scope creep
  - Random/procedural generation — unnecessary complexity, reduces reproducibility
  - Parameter-driven topics — adds CLI/config complexity

  **Rationale:** Feature 219 (identical spec) uses hardcoded prose. The 216+ precedent features all hardcode simple topics:
  - Avoids external API dependency
  - Simple, deterministic, testable
  - Sufficient to demonstrate feature capability
  - Spec allows \"implementation team selection\" (FR-9)
  - Matches all established patterns

  Example topic candidates: \"Innovation\", \"Creativity\", \"Communication\", \"Technology\", \"Learning\", etc.

  ### 4. Implementation Packaging

  **Chosen:** Standalone Python script at repository root (create_markdown_file_220.py)

  **Rejected:**
  - Integrated module in src/sheep/features/ — adds framework overhead, logging complexity
  - Inline in orchestration — requires framework knowledge
  - Custom plugin system — over-engineering

  **Rationale:** Feature 219 (identical spec) uses standalone root-level script. This approach:
  - Simplest, most direct implementation
  - No framework dependencies or complexity
  - Easy to test and debug in isolation
  - Matches recent precedent (features 216-219)
  - Meets spec requirement \"no configuration required\" (NFR-4)

  ### 5. Encoding and Line Ending Handling

  **Chosen:** pathlib.write_text(encoding=\"utf-8\", newline=\"\\n\")

  **Rejected:**
  - System defaults — risks CRLF on Windows, non-deterministic
  - Manual encode()/decode() — verbose, error-prone
  - Implicit pathlib behavior — may use CRLF on Windows

  **Rationale:** Explicit parameters ensure cross-platform correctness:
  - encoding=\"utf-8\" → UTF-8 without BOM (Python default, explicitly stated for clarity)
  - newline=\"\\n\" → Unix LF on all platforms including Windows
  - Matches spec requirements (NFR-1: UTF-8, NFR-2: LF line endings)
  - Verified by 216+ successful implementations
  - Required for git to recognize file correctly

  ### 6. File Overwrite Behavior

  **Chosen:** Overwrite silently if file exists (direct write, no existence check)

  **Rejected:**
  - Raise error if file exists — defensive but violates spec's resolved decision
  - Skip if exists — doesn't meet requirement to create the file

  **Rationale:** Spec's open question is already resolved: \"Overwrite silently\" selected. The reasoning states this keeps implementation simple and matches the 220+ precedent pattern. The feature branch is dedicated to this one file, so overwriting ensures correct final state. Direct pathlib.write_text() naturally overwrites any existing file.

  ### 7. Validation Approach

  **Chosen:** No validation per spec (NFR-4: \"no validation, error handling, or configuration required\")

  **Rejected:**
  - Comprehensive validation — forbidden by spec
  - Basic validation checks — feature 219 (identical spec) has none
  - Post-creation assertions — adds scope beyond spec

  **Rationale:** Spec NFR-4 explicitly forbids validation. Feature 219 (identical spec, immediately preceding) has no validation. Features 217-218 include validation, but their specs mandate it (different success criteria). For feature 220:
  - No validation required per spec
  - Imperative pattern: create → stage → commit → push
  - Success verified by file existence and git history
  - Keeps implementation simple and focused

  ### 8. Error Handling Strategy

  **Chosen:** Minimal — subprocess.run(..., check=True) provides automatic fail-fast

  **Rejected:**
  - Comprehensive try/except — violates spec NFR-4 (no error handling)
  - No error detection — need some mechanism to detect git failures
  - Detailed error recovery — beyond scope of simple feature

  **Rationale:** Spec NFR-4 explicitly forbids error handling. subprocess.run(..., check=True) provides automatic fail-fast:
  - Non-zero git exit codes raise CalledProcessError automatically
  - Script exits with error code, signaling failure to system
  - No explicit exception handling needed
  - Aligns with spec's \"no error handling\" requirement
  - Feature 219 (identical spec) uses this approach

  ## Library and Dependency Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib (Python stdlib) | File I/O operations | **Use** | Modern Python standard (3.11+), used by all 216+ precedent features, atomic writes, built-in encoding/newline support |
  | subprocess (Python stdlib) | Execute git commands | **Use** | Secure (shell=False), standard for external commands, supports fail-fast with check=True, zero external deps |
  | GitPython | Alternative for git commands | **Reject** | External dependency, violates NFR-7 (stdlib-only), added complexity not required, subprocess is sufficient |
  | pathvalidate | Filename validation | **Reject** | Not needed — filename \"test-yt6y8d.md\" is valid, no validation per spec (NFR-4) |
  | chardet | Encoding detection | **Reject** | Not needed — explicitly specify encoding as UTF-8, no validation per spec |
  | shutil | File operations | **Reject** | Unnecessary for text file creation, pathlib is simpler and more direct |

  ## Security Considerations

  ### Subprocess Security (Command Injection Prevention)

  **Threat:** Unsanitized strings in shell commands could allow injection attacks.

  **Mitigation:** Use subprocess.run() with shell=False (no shell interpretation). Git commands are simple and don't use user-supplied variables:
  ```python
  subprocess.run(["git", "add", "test-yt6y8d.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(220): Create markdown file test-yt6y8d.md"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "feat/220-markdown-file-creation-ebef0e"], check=True)
  ```

  shell=False ensures commands are passed directly to the OS without shell interpretation, preventing injection even if strings were user-supplied (they aren't).

  ### File Encoding Security

  **Threat:** Incorrect encoding (UTF-16, ANSI) or BOM could cause issues in downstream tools.

  **Mitigation:** Explicitly specify UTF-8 encoding without BOM:
  ```python
  file_path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")
  ```

  UTF-8 is specified explicitly, and pathlib's default behavior avoids BOM. Verified cross-platform by 216+ successful features.

  ### Path Traversal Prevention

  **Note:** Not applicable. Hardcoded filename \"test-yt6y8d.md\" is at repository root — no path concatenation or user input involved. No traversal risk.

  ## Performance Considerations

  ### File I/O Performance

  - **pathlib.write_text():** O(1) atomic write, typical file size ~300-600 bytes
  - **Expected duration:** <100ms
  - **No async needed:** File is small, operation is fast

  ### Subprocess Performance

  - **Git add:** ~50-100ms (local filesystem operation)
  - **Git commit:** ~100-200ms (object creation, index update)
  - **Git push:** ~500-2000ms (network operation, depends on connection)
  - **Total git time:** 1-3 seconds typical
  - **Overall feature time:** 10-15 minutes estimate includes prose selection and git push latency

  ### No Performance Optimizations Needed

  The feature is I/O-bound and inherently sequential (file must be created before git operations). No parallelization or caching possible. subprocess calls are necessary waits for git. This is acceptable for a simple feature per the size estimate (S: 10-15 minutes).

  ## Architecture Integration Notes

  ### Relationship to Sheep Framework

  Feature 220 does **not** integrate with the Sheep CrewAI framework:
  - No agent integration required (spec: no configuration, no framework dependency)
  - No observability/logging required (spec: no error handling, no validation)
  - No database or state management needed
  - No workflow orchestration needed

  This differs from framework-integrated features (e.g., feature 211) which use Sheep's logging and structure. For feature 220, a standalone script is appropriate per spec and precedent.

  ### Relationship to Spec/Plan Workflow

  Feature 220 is delivered as:
  - Standalone create_markdown_file_220.py script (implementation)
  - Feature 220 spec (requirements, analysis, success criteria)
  - Git commit with conventional message (verification)
  - This research.yaml document (technical decisions)

  Post-implementation artifacts:
  - Test file test-yt6y8d.md (deliverable)
  - Git commit and push record (proof)
  - Feature branch feat/220-markdown-file-creation-ebef0e (integration point)

  ### Codebase Alignment

  Implementation follows established patterns from features 099-219:
  - Standalone script at root level (like features 216-219)
  - pathlib for file creation (all 216+ features)
  - subprocess for git (all 216+ features)
  - No validation/error handling (like feature 219, identical spec)
  - Conventional commit message (all features)
  - Single file per commit (all features)
  - Push to feature branch (all features)

  ## Implementation Checklist

  - [ ] Create standalone script: create_markdown_file_220.py at repository root
  - [ ] Hardcode markdown content: H1 title + blank line + 2-3 prose sentences (~300-600 bytes)
  - [ ] Use pathlib.write_text(encoding=\"utf-8\", newline=\"\\n\") for file creation
  - [ ] Execute git add, commit, push via subprocess.run(..., shell=False, check=True)
  - [ ] No validation layer (no encode/line-ending/size checks)
