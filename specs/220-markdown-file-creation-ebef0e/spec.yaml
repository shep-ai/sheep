content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established and proven pattern. This feature creates a single test markdown file
  (`test-yt6y8d.md`) at the repository root with a title and prose content, demonstrating automated
  file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 220+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 099-219, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-yt6y8d.md` created and exists in the repository root directory at the same level as other test-*.md files
  - [ ] File contains exactly one markdown H1 heading (`# [Title]`) as the first line
  - [ ] File contains a blank line immediately after the H1 heading
  - [ ] File contains exactly 2-3 sentences of coherent prose content following the blank line
  - [ ] File is encoded in UTF-8 with LF line endings
  - [ ] File size is approximately 300-600 bytes
  - [ ] File is staged in git (verifiable with `git status`)
  - [ ] File is committed with message: `feat(220): Create markdown file test-yt6y8d.md`
  - [ ] Commit is successfully pushed to feature branch `feat/220-markdown-file-creation-ebef0e`
  - [ ] No existing files or directories are modified
  - [ ] Implementation uses Python pathlib for file I/O
  - [ ] Implementation follows the architectural pattern established by features 099-219

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named `test-yt6y8d.md` at the repository root directory level
  - **FR-2**: File must contain an H1 heading (`# [Title]`) as the first line (character position 0)
  - **FR-3**: File must contain a blank line (with only newline character) immediately after the H1 heading
  - **FR-4**: File must contain exactly 2-3 sentences of coherent prose content following the blank line
  - **FR-5**: Stage the created file using `git add test-yt6y8d.md`
  - **FR-6**: Commit the staged file with conventional commit message: `feat(220): Create markdown file test-yt6y8d.md`
  - **FR-7**: Push the commit to the feature branch `feat/220-markdown-file-creation-ebef0e` using `git push -u origin feat/220-markdown-file-creation-ebef0e`
  - **FR-8**: Use Python's pathlib module (from standard library) for file I/O operations (Path.write_text())
  - **FR-9**: Allow the implementation to choose any prose topic (no specific topic constraint)

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 (default for pathlib.write_text() on Python 3.11+)
  - **NFR-2**: File must use LF line endings (default on Unix-like systems for pathlib)
  - **NFR-3**: File size must be approximately 300-600 bytes (typical for H1 heading + 2-3 prose sentences)
  - **NFR-4**: Implementation must follow the established architectural pattern of features 099-219 (no validation, error handling, or configuration required)
  - **NFR-5**: No other files, directories, or configuration should be modified by this implementation
  - **NFR-6**: Implementation should complete in approximately 10-15 minutes (from file creation through successful push)
  - **NFR-7**: Implementation must not require any external dependencies beyond Python 3.11+ standard library
  - **NFR-8**: Git configuration (user.name, user.email) must already be set up (pre-existing requirement)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the implementation overwrite an existing `test-yt6y8d.md` if it somehow exists? | Overwrite silently | This is a dedicated feature branch for this specific file. Overwriting ensures the final state is correct, keeps implementation simple, and matches the 220+ precedent features which use simple imperative creation without error handling. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an automated code implementation platform built with Python and CrewAI:

  - **Repository Root**: Contains 220+ test markdown files (test-*.md) from features 099-219,
    establishing a clear, proven pattern for file creation and git workflow
  - **`src/sheep/`**: Main source code with modular architecture
    - `agents/`: Agent definitions (code_agents.py, general_agents.py)
    - `config/`: Configuration and LLM management (settings.py, llm.py)
    - `flows/`: Orchestration and execution flows
    - `features/`: Numbered feature implementations (feature_101_*.py through feature_146_*.py)
    - `cli.py`: Command-line interface entry point
  - **`specs/`**: Specification directory with 220+ feature specifications (numbered 006-220)
  - **`tests/`**: Test suite directory
  - **Build & Config**: pyproject.toml, .env.example, Dockerfile, docker-compose.yml
  - **Git Structure**: Feature-branch based workflow with conventional commit messages

  ### Architecture Patterns

  1. **File Organization Pattern**:
     - Test files placed at repository root alongside existing test-*.md files
     - Naming convention: `test-[random-identifier].md` (e.g., test-yt6y8d.md)
     - No subdirectories required; flat structure at root level
     - 220+ existing precedent files demonstrate this pattern

  2. **Markdown Format (Consistent)**:
     - H1 heading (`# [Title]`) as first line
     - Blank line separator immediately following heading
     - 2-3 sentences of prose content after blank line
     - UTF-8 encoding, LF line endings (default for pathlib on Unix-like systems)
     - Typical file size: 300-600 bytes

  3. **Git Workflow Pattern**:
     - Feature branches created with naming: `feat/[number]-[feature-name]`
     - Files staged with `git add [filename]`
     - Commits use conventional commit format: `feat([number]): [message]`
     - Commits pushed to feature branch with `git push -u origin [branch]`
     - Single file per commit (focused commits matching established pattern)

  4. **Specification Structure**:
     - Feature specifications stored as YAML in `specs/[number]-[name]/spec.yaml`
     - Each spec contains problem statement, analysis, success criteria, and implementation guidance
     - Specifications are source of truth; markdown documentation auto-generated from YAML

  ### Relevant Technologies

  - **Python 3.11+**: pathlib standard library module for file I/O operations (no external dependencies)
  - **Git**: Version control, staging, commits, and push operations (system-level tool)
  - **Markdown**: Standard text file format used throughout repository
  - **CrewAI**: Agentic framework used by Sheep (not required for this feature)
  - **Conventional Commits**: Git commit message format specification

  ### Execution Pattern Observations

  Based on analysis of 220+ similar features (099-219):
  - All follow identical markdown structure (H1 heading + blank line + 2-3 sentences)
  - All use Python pathlib for file creation
  - All follow conventional commit format with feature number in scope
  - All complete in approximately 10-15 minutes
  - All push to isolated feature branches
  - No existing files are modified; only new file creation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-yt6y8d.md) to existing collection of 220+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 099-219; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in src/ or elsewhere |
  | Configuration Files | None | No changes required to any configuration, environment, or settings files |
  | Specifications Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Tests Directory | None | No test files or test infrastructure changes required |
  | Documentation | None | No README, DESIGN, or other documentation updates required |

  ## Dependencies

  **Runtime Dependencies**:
  - **Git repository**: Feature branch `feat/220-markdown-file-creation-ebef0e` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits

  **Established Pattern**:
  - 220+ test files (features 099-219) provide clear precedent for content format, structure, and encoding
  - Features 099-219 demonstrate identical implementation approach with proven success
  - No new libraries, frameworks, or tooling required

  ## Implementation Approach

  The implementation will follow the established pattern from features 099-219:

  1. **Content Creation**: Write a markdown file with:
     - One H1 heading (`# [Title]`)
     - Blank line
     - 2-3 sentences of prose about any topic (implementation team selection)

  2. **File I/O**: Use Python's pathlib to create the file:
     - Path: repository root (same level as other test-*.md files)
     - Filename: `test-yt6y8d.md`
     - Content: Markdown-formatted prose with H1 heading
     - Encoding: UTF-8 (default for pathlib.write_text())
     - Line endings: LF (default on Unix-like systems)

  3. **Git Workflow**:
     - Stage: `git add test-yt6y8d.md`
     - Commit: `git commit -m "feat(220): Create markdown file test-yt6y8d.md"`
     - Push: `git push -u origin feat/220-markdown-file-creation-ebef0e`

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences with appropriate topic)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 220+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format
  - No testing, documentation, or configuration changes required
  - Recent features (218-219) demonstrate efficient implementation in 10-15 minutes
  - Straightforward imperative code pattern (no validation) keeps implementation simple
  - All dependencies and patterns already in place; zero setup required

  ---

  _Requirements phase complete — specification ready for implementation_
