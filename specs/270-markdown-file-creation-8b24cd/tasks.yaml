content: |
  ## Summary

  Feature 270 implementation consists of 11 concrete, ordered tasks across 3 phases:

  **Phase 1: Foundation (2.5 hours, 5 tasks)**
  - Task 1: Curate and validate template pool of 30-50 title+prose pairs
  - Task 2: Implement hash-based deterministic content selection
  - Task 3: Implement file creation with UTF-8 encoding and Unix LF
  - Task 4: Implement file validation with retry logic
  - Task 5: Implement git operation wrappers (stage, commit, push)

  **Phase 2: Core Implementation (45 minutes, 1 task)**
  - Task 6: Create feature script orchestrating complete workflow

  **Phase 3: Quality Assurance & Execution (2 hours, 5 tasks)**
  - Task 7: Unit tests for templates and content selection
  - Task 8: Unit tests for file creation and validation
  - Task 9: Integration tests for git operations
  - Task 10: End-to-end tests for feature script
  - Task 11: Execute feature and manually verify all success criteria

  **Total Effort:** ~6 hours (includes all testing and verification)

  ## Implementation Principles

  **Test-Driven Development (TDD):** Every task with code includes RED-GREEN-REFACTOR cycles:
  - **RED:** Write failing test asserting desired behavior
  - **GREEN:** Implement minimal code to pass the test
  - **REFACTOR:** Clean up, extract helpers, improve naming

  **Reusable Architecture:** Phase 1 utilities are generic and reusable across 270+ similar features:
  - Templates (Phase 1, Task 1): Curated content library
  - Content Selection (Phase 1, Task 2): Deterministic hash-based lookup
  - File Operations (Phase 1, Tasks 3-4): UTF-8+LF encoding, validation with retry
  - Git Operations (Phase 1, Task 5): Stage, commit, push with error handling

  **Feature Isolation:** Phase 2 feature script is minimal orchestrator:
  - Calls utilities with feature-specific parameters
  - Handles error propagation and user feedback
  - Suitable for feature automation and testing

  **Comprehensive Testing:** Phase 3 covers all components:
  - Unit tests validate individual functions (templates, file ops, git ops)
  - Integration tests validate git workflow
  - End-to-end tests validate complete feature workflow
  - Manual execution verifies real-world success criteria

  ## Task Dependencies

  Phase 1 tasks are mostly independent (only Task 2 depends on Task 1):
  - Task 1 (templates) is completely independent
  - Task 2 (selection) depends on Task 1
  - Tasks 3, 4, 5 (file ops, validation, git) are independent of each other

  Phase 2 depends on all Phase 1 tasks:
  - Task 6 (feature script) calls utilities from Tasks 2-5

  Phase 3 depends on Phases 1 & 2:
  - Tasks 7, 8, 9 test individual Phase 1 components
  - Task 10 tests Phase 2 feature script
  - Task 11 executes and verifies everything

  ## Execution Strategy

  1. **Start Phase 1 in parallel** (if multiple developers):
     - Developer A: Tasks 1-2 (templates + selection)
     - Developer B: Tasks 3-5 (file ops + git ops)

  2. **Then Phase 2** (after Phase 1 complete):
     - Developer A+B: Task 6 (wire utilities into feature script)

  3. **Finally Phase 3** (after Phase 2 complete):
     - Developer A+B: Tasks 7-10 (comprehensive testing)
     - Execute Task 11 (manual verification)

  **Sequential Execution (single developer):** Follow task order 1-11 (respects all dependencies)

  ## Success Metrics

  ✅ All 11 tasks completed with TDD cycles
  ✅ All unit tests pass (tasks 7-10)
  ✅ test-1z6fhe.md file meets all success criteria (task 11)
  ✅ Feature executes in <5 seconds (excluding git push network latency)
  ✅ Content is deterministically reproducible (same output on multiple runs)
  ✅ Code is readable, documented, and maintainable
  ✅ Git history is clean (correct commit message, no rewrites)
