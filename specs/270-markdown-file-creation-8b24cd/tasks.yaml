        - "Write test: raises AssertionError if file missing trailing newline"
        - "Write test: retries on first failure, passes on second (simulated by creating file on retry)"
        - "Write test: uses correct delays (100ms then 200ms) in backoff"
      green:
        - "Import time and pathlib"
        - "Implement validation checks for heading, sentence count, size, encoding, line endings"
        - "Implement retry loop with time.sleep() delays"
        - "Raise AssertionError with failure reason"
      refactor:
        - "Extract each validation check into separate function: _validate_heading(), _validate_sentence_count(), etc."
        - "Add docstring with all validation rules"
        - "Improve error messages to be specific about what failed"
        - "Add comments explaining retry logic and backoff calculation"
    estimatedEffort: "1h"

  - id: task-5
    phaseId: phase-1
    title: "Implement git operations wrapper functions (stage, commit, push)"
    description: >
      Create three git operation wrapper functions in utilities: git_stage(filename),
