name: "markdown-file-creation-8b24cd"
summary: >
  11 concrete, ordered tasks across 3 phases implementing feature 270.
  Phase 1 (Foundation): Create template pool and reusable utilities.
  Phase 2 (Core): Implement feature orchestration script.
  Phase 3 (Testing): Write comprehensive tests and verify execution.
  Total effort: ~6 hours. All code follows TDD (RED-GREEN-REFACTOR).

relatedFeatures: []
technologies: []
relatedLinks:
  - title: "Python hashlib Documentation"
    url: "https://docs.python.org/3/library/hashlib.html"
  - title: "Python time Module Documentation"
    url: "https://docs.python.org/3/library/time.html"

tasks:
  - id: task-1
    phaseId: phase-1
    title: "Curate and validate template pool of 30-50 title+prose pairs"
    description: >
      Create templates.py with 30-50 curated title+prose pairs. Each template must
      be validated to produce a markdown file in the 400-600 byte range when formatted
      as: \"# Title\\n\\nProse.\\n\". Templates should cover diverse topics and have
      natural language prose (2-3 sentences minimum, each ending with . ! or ?).
      Store as Python list of dicts: [{\"title\": \"...\", \"prose\": \"...\"}, ...].
      Measure byte size of each template and confirm it meets requirements.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "templates.py exists with at least 30 title+prose pairs"
      - "Each template is a dict with 'title' (str) and 'prose' (str) keys"
      - "Each template produces 400-600 byte markdown file (measured via len(formatted_text.encode('utf-8')))"
      - "All templates cover diverse topics (tech, nature, abstract concepts, etc.)"
      - "All prose contains 2-3 complete sentences"
      - "All titles are minimum 3 characters and maximum ~50 characters"
      - "All sentences end with period (.), exclamation mark (!), or question mark (?)"
      - "Template pool is stored as Python list constant (TEMPLATE_POOL)"
      - "Code comments mark topic of each template group"
    tdd:
      red:
        - "Write test: load_templates() returns list with 30+ dicts"
        - "Write test: each template dict has 'title' and 'prose' string keys"
        - "Write test: calculate_markdown_bytes(title, prose) returns correct byte count"
        - "Write test: all templates produce 400-600 bytes when formatted as markdown"
        - "Write test: each title is 3-50 characters"
        - "Write test: each prose contains 2-3 sentences"
        - "Write test: each sentence ends with . ! or ?"
      green:
        - "Create TEMPLATE_POOL constant with initial set of templates"
        - "Implement load_templates() function returning TEMPLATE_POOL"
        - "Implement calculate_markdown_bytes(title, prose) using UTF-8 encoding"
        - "Add templates until all 30+ pass validation tests"
      refactor:
        - "Extract template validation into validate_template(template) helper"
        - "Add docstrings explaining template structure and byte range logic"
        - "Organize templates by topic with section comments"
        - "Add example template with comments showing expected format"
    estimatedEffort: "1h"

  - id: task-2
    phaseId: phase-1
    title: "Implement hash-based deterministic content selection function"
    description: >
      Create select_content(feature_number) function that deterministically selects
      a template from the pool based on feature number. Use hashlib.md5(str(feature_number).encode()).hexdigest()
      to generate a hash, convert to integer, then use modulo to index into template pool.
      Ensure same feature_number always returns identical template (reproducibility requirement).
      Function should work for feature numbers 1-300+.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "select_content(feature_number) function exists in utilities module"
      - "Function uses hashlib.md5() for deterministic hashing"
      - "Function converts hex hash to integer for pool indexing"
      - "Function returns dict with 'title' and 'prose' keys"
      - "Same feature_number produces identical result on repeated calls"
      - "Works for feature numbers 1-300 without error"
      - "Different feature numbers produce different templates (eventually)"
    tdd:
      red:
        - "Write test: select_content(270) returns dict with 'title' and 'prose' keys"
        - "Write test: select_content(270) called 3 times returns identical dict"
        - "Write test: select_content(269) returns different template than select_content(270)"
        - "Write test: select_content(1) and select_content(300) both work without error"
        - "Write test: returned template has 'title' and 'prose' string values"
      green:
        - "Import hashlib module"
        - "Load TEMPLATE_POOL from templates.py"
        - "Implement select_content() using hash → int → modulo indexing"
        - "Verify function returns template from pool"
      refactor:
        - "Extract pool loading into separate load_pool() function"
        - "Add docstring with example: select_content(270) → {...}"
        - "Add comments showing hash calculation steps"
        - "Add type hints (feature_number: int) → dict"
    estimatedEffort: "30min"

  - id: task-3
    phaseId: phase-1
    title: "Implement file creation with UTF-8 encoding and Unix LF line endings"
    description: >
      Create create_markdown_file(filepath, title, prose) function that creates a markdown
      file with proper encoding and line endings. Use pathlib.Path.write_text() with
      encoding='utf-8' and newline='\\n'. File structure: \"# Title\\n\\nProse\\n\".
      Function should ensure: UTF-8 encoding without BOM, Unix LF (\\n) line endings
      (not CRLF), trailing newline, and file at specified path.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "create_markdown_file(filepath, title, prose) function exists"
      - "File is created at exact filepath specified"
      - "File content starts with '# ' followed by title"
      - "Blank line exists between title and prose"
      - "File contains prose paragraph"
      - "File ends with single newline character (\\n)"
      - "File uses UTF-8 encoding (no BOM)"
      - "File uses Unix LF (\\n) line endings, not CRLF (\\r\\n)"
      - "File is readable and contains expected content"
    tdd:
      red:
        - "Write test: create_markdown_file() creates file at given path"
        - "Write test: file content starts with '# ' followed by title"
        - "Write test: blank line exists after title"
        - "Write test: file ends with newline (\\n not CRLF)"
        - "Write test: file uses UTF-8 encoding (readable with encoding='utf-8')"
        - "Write test: file has no BOM (first bytes are '# ' not BOM markers)"
      green:
