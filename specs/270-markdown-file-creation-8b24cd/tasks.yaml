  - id: task-4
    phaseId: phase-1
    title: "Implement file validation with retry logic and exponential backoff"
    description: >
      Create validate_markdown_file(filepath, max_retries=2) function that validates
      created file meets all requirements: H1 heading present, 2-3 sentences, 400-600 bytes,
      UTF-8 encoding (no BOM), Unix LF line endings, trailing newline. Implement retry logic
      with exponential backoff: 100ms initial delay, 200ms on second retry. Raise AssertionError
      with descriptive message on final validation failure.
    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "validate_markdown_file(filepath, max_retries=2) function exists"
      - "Validates file has H1 heading (starts with '# ')"
      - "Validates file has 2-3 sentences (counts sentence-ending punctuation . ! ?)"
      - "Validates file size is 400-600 bytes"
      - "Validates UTF-8 encoding without BOM"
      - "Validates Unix LF line endings (no CRLF)"
      - "Validates trailing newline (last character is \\n)"
      - "Retries up to max_retries times on validation failure"
      - "Uses exponential backoff: 100ms initial, 200ms second attempt"
      - "Raises AssertionError with specific reason on final failure"
      - "Passes for valid files without retry"
    tdd:
      red:
