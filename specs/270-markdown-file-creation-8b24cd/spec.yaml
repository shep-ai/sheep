# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform uses simple test markdown file creation as a foundational
  feature for validating the end-to-end workflow: research → implementation → validation → git operations.
  This feature (270) continues that pattern by creating a new markdown file (test-1z6fhe.md) with a title
  heading and 2-3 sentences of prose content. With 217+ existing test markdown files in the repository
  and 270 prior feature implementations, this task serves as a lightweight validation of the system's
  ability to execute basic file operations and git integration.

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a modular agentic platform with the following directory layout:

  - **Root directory**: Contains 217+ test markdown files (test-*.md), feature implementation scripts,
    and git configuration files. Also contains spec files for all 270 features in the `specs/` directory.
  - **src/sheep/**: Core platform module with subdirectories:
    - `agents/` - Agent definitions for research, implementation, and review tasks
    - `config/` - Configuration management, LLM setup, and settings
    - `flows/` - Flow definitions using CrewAI for task orchestration
    - `observability/` - Structured logging and Langfuse tracing integration
    - `tools/` - Git operations and file utilities
    - `features/` - Feature-specific implementations (examples at features/feature_101, feature_102, etc.)
    - `content_generators.py` - Utilities for AI-powered markdown content generation
  - **src/create_markdown.py**: Reusable utilities for markdown generation, validation, and git integration
  - **specs/**: Contains 270 feature specification YAML files
  - **tests/**: Test suite for the platform
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies via hatchling)

  ### Architecture Patterns

  1. **Established Markdown File Creation Pattern**: All 270 features follow the same workflow:
     - Generate markdown content with H1 heading + 2-3 sentences (optionally using Claude API or deterministic generation)
     - Validate content structure (heading presence, sentence count, file size 400-600 bytes)
     - Create file with UTF-8 encoding and Unix LF line endings
     - Stage and commit with conventional commit format: `feat(###): create markdown file test-*.md with title and prose content`
     - Push to feature branch

  2. **Markdown Structure**: Standardized across all test files:
     ```
     # Title Here

     Sentence one. Sentence two. Sentence three.
     ```

  3. **Git Workflow**: Files are created at project root, staged with `git add`, committed with conventional
     message format, and pushed to feature branches using `git push -u origin HEAD`.

  4. **Content Generation**: Existing patterns include:
     - Auto-generated prose using Claude API (as seen in feature_101_markdown_file_creation.py)
     - Content validation with retry logic (exponential backoff on generation failure)
     - Comprehensive logging via structured logging from `sheep.observability.logging`

  5. **File I/O Conventions**: All markdown files use:
     - UTF-8 encoding without BOM
     - Unix LF line endings (`\n`, not CRLF)
     - Trailing newline at end of file (POSIX convention)
     - File size naturally falls in 400-600 byte range (H1 + blank line + 2-3 sentences)

  ### Relevant Technologies

  - **Python 3.11+**: Language and runtime (required by pyproject.toml)
  - **pathlib (Python standard library)**: Cross-platform file I/O
  - **subprocess (Python standard library)**: Git command execution
  - **CrewAI 0.86.0+**: Agentic orchestration framework (optional for advanced features)
  - **Claude API (Anthropic SDK)**: Optional content generation (see feature_101 for example)
  - **GitPython 3.1.0+**: Git operations (staging, committing, pushing)
  - **Pydantic 2.0+**: Data validation and settings management
  - **Langfuse 2.0+**: Observability and execution tracing (optional)
  - **Markdown**: File format (no special parser needed — plain text with UTF-8 encoding)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (file creation) | Low | Creates new test-1z6fhe.md file; does not modify existing files or directories |
  | Git repository (working tree) | Low | Staging, committing, and pushing a single file; follows established workflow from 269 prior features |
  | src/create_markdown.py utilities | None | Will reuse existing utilities (if implementation leverages them); no modifications needed |
  | No code changes | None | This feature does not modify source code, tests, configuration, or platform infrastructure |

  ## Dependencies

  **External:**
  - Git (for version control operations) — must be available in execution environment
  - Python 3.11+ standard library (pathlib, subprocess, sys, os)

  **Internal:**
  - No dependencies on other features or modules in Sheep
  - No modifications to existing code or infrastructure required
  - Related to patterns established in features #269, #268, #267

  **Established Pattern:**
  - Optional: src/sheep/content_generators.py (if using AI-powered content generation)
  - Optional: Claude API via sheep.config.llm.get_reasoning_llm() (if generating prose dynamically)
  - Optional: src/sheep/observability/logging.py (for structured logging)

  ## Success Criteria

  - [ ] File `test-1z6fhe.md` is created at the repository root
  - [ ] File contains a valid markdown H1 heading (single `#` followed by title text)
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File is encoded as UTF-8 with Unix LF line endings (`\n`, not CRLF)
  - [ ] File size is within the expected 400-600 byte range
  - [ ] File is staged using `git add test-1z6fhe.md`
  - [ ] Commit is created with conventional format: `feat(270): create markdown file test-1z6fhe.md with title and prose content`
  - [ ] Commit is pushed to feature branch with upstream tracking (`git push -u origin HEAD`)
  - [ ] No existing files in the repository are modified
  - [ ] Implementation follows established markdown file creation pattern from features #269, #268, #267

  ## Size Estimate

  **S** — A few hours of work at most. This is a straightforward feature because:
  - No new source code needs to be written; existing utilities from src/create_markdown.py can be reused
  - File structure is completely standardized and well-tested across 270 prior iterations
  - Content validation and error handling are already implemented and proven
  - Git workflow is established and consistent across all 270 features
  - The only variation is the filename (test-1z6fhe.md) and randomly generated content
  - Implementation can be accomplished by:
    1. Optionally creating a feature implementation script (similar to feature_101_markdown_file_creation.py)
    2. Calling existing utilities or manually executing the workflow with pathlib and subprocess
    3. Staging the file with git
    4. Committing with conventional format
    5. Pushing to the feature branch
  - Actual runtime should be <2 minutes (content generation dominates if using Claude API)

