content: |
  ## Architecture Overview

  Feature 255 follows the established modular architecture of the Sheep project, where each feature
  is a self-contained module in src/sheep/features/. This implementation replicates the proven pattern
  from features 1-254, using the same technologies and architectural patterns.

  **Implementation Structure:**
  ```
  src/sheep/features/feature_255_markdown_file_creation.py
    ├─ Constants: FILENAME, FEATURE_NUMBER, BRANCH_NAME
    ├─ Phase 1: generate_content() → content_generators.generate_markdown_content()
    ├─ Phase 1: validate_content() → content_generators.validate_markdown_content()
    ├─ Phase 2: write_file(content) → pathlib.Path.write_text()
    ├─ Phase 2: verify_file() → content_generators.validate_markdown_file()
    ├─ Phase 3: stage_file() → subprocess git add
    ├─ Phase 3: commit_file() → subprocess git commit
    ├─ Phase 3: push_file() → subprocess git push
    └─ Main: run() → orchestrates all phases with error handling
  ```

  **Integration Pattern:**
  - Content generation imports sheep.content_generators module for LLM-based prose generation
  - File I/O uses pathlib.Path from Python standard library (modern, cross-platform)
  - Git operations use subprocess module with explicit command lists (secure, explicit)
  - Validation leverages content_generators infrastructure (proven across 250+ features)
  - Error handling with specific exception types for debugging and recovery

  This architecture ensures consistency with 250+ prior implementations while providing clear
  separation of concerns and testability of each phase independently.

  ## Key Design Decisions

  ### Decision 1: File I/O Method — pathlib.Path

  **Chosen:** pathlib.Path.write_text() with explicit UTF-8 encoding

  **Alternatives Considered:**
  - os.path + open() — Less Pythonic, requires manual path joining
  - subprocess shell commands — Introduces shell escaping complexity, injection risk

  **Rationale:**
  Modern Python standard (official recommendation since 3.4), used consistently across
  feature_201 and content_generators.py. Clean API with explicit encoding parameter,
  cross-platform path handling, and 250+ prior implementations use this exact pattern.

  ### Decision 2: Content Generation — LLM-Based via content_generators

  **Chosen:** sheep.content_generators.generate_markdown_content()

  **Alternatives Considered:**
  - Hardcoded prose strings — Reduces flexibility, violates DRY across 255+ features
  - Manual hand-written content per feature — Human variance, less scalable

  **Rationale:**
  Proven infrastructure tested and refined across 250+ implementations. Ensures consistent,
  high-quality prose content with format validation. Leverages CrewAI for LLM integration.
  Module includes comprehensive validation (_validate_markdown_content, validate_markdown_file)
  used across entire codebase.

  ### Decision 3: Git Operations — subprocess Module

  **Chosen:** subprocess.run() with explicit command lists (no shell=True)

  **Alternatives Considered:**
  - GitPython wrapper — Available in dependencies but spec explicitly requests subprocess
  - shell=True with git command strings — Shell injection risk, escaping complexity

  **Rationale:**
  Feature specification explicitly requires subprocess. Prevents shell injection vulnerabilities.
  Simple for straightforward operations (add, commit, push). Error handling via check=True.
  Matches established pattern from feature_201 and 250+ prior implementations.

  ### Decision 4: Markdown Format Validation

  **Chosen:** Programmatic validation using pathlib and string operations

  **Alternatives Considered:**
  - markdown/commonmark Python libraries — External dependencies, overkill for simple structure
  - Manual git log inspection — Less reliable, requires git completion first

  **Rationale:**
  Format requirements are simple and well-defined (H1 heading, blank line, 2-3 sentences).
  Can be validated efficiently with pathlib.Path and string operations. content_generators
  module provides reference validation implementations. No external libraries needed.

  ### Decision 5: Encoding and Line Endings

  **Chosen:** Python 3.11+ defaults (UTF-8 encoding, LF line endings on Unix)

  **Alternatives Considered:**
  - Manual encoding specification for every write — Redundant, adds boilerplate
  - Explicit newline mode handling (newline='\\n') — Unnecessary on Unix systems

  **Rationale:**
  Python 3.11+ defaults to UTF-8 for text operations. pathlib.Path.write_text() uses
  this default. Unix/Linux systems produce LF by default (project runs on Azure Linux).
  Validation verifies absence of BOM and CRLF after file creation.

  ### Decision 6: Error Handling Strategy

  **Chosen:** Try/except blocks with specific exception types; validate at each phase

  **Alternatives Considered:**
  - Minimal error handling — Risks silent failures and ambiguous error states
  - Generic broad exception catching — Loses error context and failure categorization

  **Rationale:**
  Feature_201 demonstrates pattern with specific exception types (FileNotFoundError, ValueError,
  subprocess.CalledProcessError). Allows distinguishing between failure categories. Validation
  at each phase provides early feedback. Essential for debugging in automated systems.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Content Generation & Validation)** comes first because:
     - Must generate content before writing to disk
     - Validation must pass before committing to git
     - Fail fast if content requirements not met
     - Separates generation concern from file I/O

  2. **Phase 2 (File Creation & Verification)** comes second because:
     - Must have validated content before writing
     - File verification ensures disk state correct before git
     - Catches file I/O errors before git workflow

  3. **Phase 3 (Git Workflow Integration)** comes third because:
     - File must exist and be valid before staging
     - Separates file creation from version control
     - Git operations are "final" — must be correct before pushing

  4. **Phase 4 (Testing & Integration)** comes last because:
     - Tests validate all phases work correctly
     - Integration tests verify end-to-end workflow
     - Unit tests enable early failure detection during development

  **Implementation Flow:**
  ```
  generate_content()
    ↓ (validate format)
  write_file(content)
    ↓ (validate encoding/line endings)
  verify_file()
    ↓ (git add)
  stage_file()
    ↓ (git commit)
  commit_file()
    ↓ (git push)
  push_file()
    ↓
  run() returns success
  ```

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Content generation fails (LLM API unavailable) | Try/except around content_generators call; fail fast with clear error message before file creation |
  | Generated content doesn't match format requirements | content_generators.validate_markdown_content() checks H1, sentence count before file write |
  | File write fails (permissions, disk full) | Try/except for FileNotFoundError, PermissionError; validate file exists after write |
  | Git operations fail (branch missing, auth) | Try/except for subprocess.CalledProcessError; feature branch pre-created; git config assumed available |
  | File has wrong encoding (CRLF, BOM, non-UTF-8) | content_generators.validate_markdown_file() verifies encoding and line endings after write |
  | Prose content is placeholder or low-quality | content_generators uses LLM generation; module has quality validation |
  | Commit message format incorrect | Message constructed from hardcoded template with feature number and filename |
