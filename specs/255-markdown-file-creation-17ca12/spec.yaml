content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-i3iccc.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 250+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 1-254, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-i3iccc.md` exists in repository root directory
  - [ ] File contains exactly one markdown H1 heading (# Title) on the first line
  - [ ] File contains exactly one blank line (line 2) following the heading
  - [ ] File contains 2-3 sentences of prose content starting on line 3
  - [ ] File is encoded in UTF-8 (verified via encoding attribute or file inspection)
  - [ ] File uses Unix-style line endings (LF, not CRLF)
  - [ ] File is staged in git index via `git add test-i3iccc.md`
  - [ ] File is committed with conventional commit message: `feat(255): create markdown file test-i3iccc.md with prose content`
  - [ ] Commit is pushed to remote branch `feat/255-markdown-file-creation-17ca12`
  - [ ] `git log` shows the commit with correct message format
  - [ ] Prose content is appropriate, non-placeholder, and matches established test file patterns
  - [ ] File size is within expected range of 350-650 bytes
  - [ ] File passes basic markdown validation (CommonMark compatible)

  ## Functional Requirements

  - **FR-1**: Create markdown file with filename exactly matching `test-i3iccc.md` in the repository root directory
  - **FR-2**: File must contain one markdown H1 heading (`# Title`) on the first line, with any appropriate title text
  - **FR-3**: File must contain one blank line (line 2) as separator between heading and prose
  - **FR-4**: File must contain exactly 2-3 sentences of prose content starting on line 3
  - **FR-5**: File must be saved with UTF-8 character encoding without BOM
  - **FR-6**: File must use Unix-style line endings (LF, not Windows CRLF)
  - **FR-7**: File must be staged in git using `git add test-i3iccc.md`
  - **FR-8**: File must be committed with conventional commit message following format: `feat(255): description`
  - **FR-9**: File must be pushed to the remote feature branch `feat/255-markdown-file-creation-17ca12` using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must use Python 3.11+ standard library (specifically `pathlib.Path.write_text()` for file I/O)
  - **NFR-2**: Git operations must use subprocess module for shell commands (no GitPython wrapper required)
  - **NFR-3**: Implementation must follow established pattern from 250+ existing test files (test-*.md)
  - **NFR-4**: Prose content must be substantive and appropriate (not placeholder text, gibberish, or filler)
  - **NFR-5**: No external dependencies required beyond Python 3.11+ and git command-line tool
  - **NFR-6**: Implementation should be completed within estimated 10-15 minutes
  - **NFR-7**: Code must pass Ruff linter with project configuration (line length 100, rule sets E/F/I/N/W/UP/B/C4/SIM)
  - **NFR-8**: Implementation must not modify any existing source code, tests, or configuration files

  ## Product Questions & AI Recommendations

  This feature is extremely well-defined with clear precedent from 250+ identical test files and established architectural patterns.
  No blocking product decisions identified at requirements phase. The specification provides:
  - Exact filename (test-i3iccc.md)
  - Clear structure (H1 heading, blank line, 2-3 sentences)
  - Established encoding and line ending standards
  - Standard git workflow from prior implementations

  Prose topic/content selection is explicitly flexible (\"about anything\") and can be any appropriate, non-trivial subject matter.
  No open questions require escalation before proceeding to design/planning phase.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation built on CrewAI. The repository
  is organized into clear functional areas:

  - **Root directory**: Contains 250+ test markdown files (test-*.md pattern) serving as artifacts
    of feature implementations, plus project configuration and documentation
  - **src/sheep/**: Main application code with modular architecture
    - `cli.py`: Command-line interface for sheep operations
    - `features/`: Individual feature implementations (e.g., feature_201_markdown_file_creation.py)
    - `content_generators.py`: Utilities for generating prose content
    - `__init__.py`: Package initialization
  - **specs/**: Feature specifications directory with 255+ spec folders
    - Each spec folder contains: feature.yaml, plan.yaml, research.yaml, spec.yaml, tasks.yaml
  - **tests/**: Test suite organized by feature
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies, build settings)

  ### Architecture Patterns

  **Modular Feature Architecture**: Each feature is self-contained with:
  - Feature-specific implementation modules in src/sheep/features/
  - Associated test files in tests/
  - Specification documents in specs/
  - Conventional git commit messages following the pattern: `feat(N): description`

  **File Creation Pattern**: Established across 250+ test files (test-{random-id}.md):
  - Structure: markdown H1 heading on line 1, blank line, 2-3 sentences of prose
  - Typical file size: 350-650 bytes
  - Encoding: UTF-8 without BOM
  - Line endings: Unix-style LF (\n), not Windows CRLF
  - Location: Repository root directory (no subdirectories)

  **Git Workflow**: Standard flow used across all 250+ implementations:
  - Create file using pathlib.Path.write_text()
  - Stage file with git add
  - Commit with conventional message format
  - Push to remote origin with -u flag to set upstream tracking

  **Dependency Management**: Minimal external dependencies
  - Python standard library: pathlib (file I/O), subprocess (git operations)
  - CrewAI framework available but not required for simple file creation
  - Git pre-installed in development environment

  ### Relevant Technologies

  **Python 3.11+**: Runtime environment specified in pyproject.toml
  - Target version: 3.11 with Python 3.12 support indicated
  - Ruff linting configured with line length 100, select rule sets E/F/I/N/W/UP/B/C4/SIM
  - MyPy strict type checking enabled

  **pathlib.Path**: Standard library module for file I/O
  - Used in all existing feature implementations (feature_201_markdown_file_creation.py shows pattern)
  - Methods: Path(filename).write_text(content, encoding="utf-8")
  - Advantages: Cross-platform path handling, clean API

  **Git Integration**: Direct subprocess calls to git commands
  - Commands used: git add, git commit -m, git push -u origin branch
  - No GitPython wrapper needed for simple operations (though available in dependencies)
  - Feature branch pre-created in spec: feat/255-markdown-file-creation-17ca12

  **Markdown Format**: Simple, well-defined structure
  - CommonMark specification compatible
  - One H1 heading (# Title) on first line
  - Blank line separator (line 2)
  - Prose content (2-3 sentences) starting line 3
  - Example from test-t5rps2.md shows pattern: heading + 3 sentences about innovation

  **CrewAI Framework**: Available in project but transparent to this feature
  - Used for agentic orchestration in multi-step implementation flows
  - For simple file creation, basic Python scripting sufficient
  - Dependencies include: crewai[anthropic,google-genai,tools]>=0.86.0

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-i3iccc.md) to existing collection of 250+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-650 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-254; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |
  | Dependencies | None | Uses only Python standard library (pathlib) and git (pre-installed); no new dependencies required |

  ## Dependencies

  - **Git repository**: Feature branch `feat/255-markdown-file-creation-17ca12` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 250+ test files provide clear precedent for content format and structure (files test-t5rps2.md, test-b8svdl.md, test-yoduvz.md, etc.)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-i3iccc.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 250+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (250-254) demonstrate efficient implementation of identical features
  - File naming (test-i3iccc.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 254+ prior implementations
  - Python pathlib and git commands are simple and well-documented

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, ready for design/planning phase_
