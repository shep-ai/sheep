content: |
  ## Architecture Overview

  Feature 102 is a minimal, isolated file creation task that does not modify any source code or
  application logic. The implementation is purely imperative:

  1. **File Creation**: Use pathlib.Path.write_text() to create test-g4ssgd.md with content
  2. **Validation**: Verify file attributes (encoding, line endings, size) meet requirements
  3. **Git Operations**: Use subprocess to invoke git add, commit, and push

  This feature is entirely independent from the application codebase (/src/sheep/) and follows
  the established pattern from 101 preceding markdown-file-creation features. No architectural
  changes or new dependencies are required.

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Decision**: Use pathlib.Path.write_text() with explicit encoding and newline parameters.

  **Rationale** (from research):
  - Spec requirement NFR-5 explicitly specifies pathlib for file I/O
  - pathlib is more Pythonic than built-in open()
  - Critical: newline='' parameter prevents automatic CRLF conversion on Windows
  - Explicit encoding='utf-8' ensures UTF-8 without BOM (NFR-1)

  **Alternative Rejected**: Built-in open() function is more verbose and requires explicit
  context manager and encoding specification.

  ### 2. Encoding and Line Ending Specification: UTF-8 with Unix LF

  **Decision**: UTF-8 encoding with explicit Unix-style LF line endings (\n), not Windows CRLF.

  **Rationale** (from spec):
  - NFR-1: UTF-8 encoding without BOM (Byte Order Mark)
  - NFR-2: Unix-style LF line endings, not Windows CRLF
  - Cross-platform consistency required across repository
  - Implementation: Use newline='' parameter to prevent platform-specific conversion

  **Technical approach**:
  ```
  Path("test-g4ssgd.md").write_text(content, encoding="utf-8", newline="")
  ```

  ### 3. Prose Content: Manual Writing by Implementer

  **Decision**: Implementer writes 2-3 sentences of original prose on any chosen topic.

  **Rationale** (from spec Product Decision #3):
  - Spec recommends "any reasonable approach" for prose generation
  - Manual writing is simplest, requires no infrastructure or external dependencies
  - Implementer free choice for topic (spec: "about anything")
  - Flexible 2-3 sentences allows natural prose flow without artificial padding

  **Content Structure**:
  ```
  # Title

  2-3 sentences of readable, grammatically correct prose.
  ```

  ### 4. Git Operations: subprocess Module (Python Standard Library)

  **Decision**: Use subprocess.run() to invoke git CLI commands (add, commit, push).

  **Rationale** (from research):
  - subprocess is part of Python standard library (no new dependencies)
  - Sufficient for simple git operations (add, commit, push)
  - subprocess.run(shell=False) is safe against shell injection
  - More direct than GitPython abstraction for simple operations
  - Required git operations: (1) git add, (2) git commit, (3) git push

  **Command invocation pattern**:
  ```
  subprocess.run(["git", "add", "test-g4ssgd.md"], check=True)
  ```

  ## Implementation Strategy

  **Phase 1: Create and Validate File** (2 tasks, ~10 minutes)
  - Task 1: Create the markdown file with proper content using pathlib
  - Task 2: Validate file encoding, line endings, and size

  **Phase 2: Git Integration** (3 tasks, ~10 minutes)
  - Task 3: Stage file with git add
  - Task 4: Commit with conventional commit message
  - Task 5: Push to remote origin

  **Rationale for Phase Ordering**:
  - Phase 1 must complete first: the file must exist before git operations can reference it
  - Phase 2 depends on Phase 1: cannot stage/commit/push a file that doesn't exist
  - Within each phase: operations build sequentially (create → validate in Phase 1; add → commit → push in Phase 2)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect line endings on Windows | Use explicit newline='' parameter in write_text() to prevent CRLF conversion. Verify with file inspection after creation. |
  | File encoding issues | Use explicit encoding="utf-8" parameter. Verify file starts with correct UTF-8 bytes (no BOM). |
  | Git operations fail | Use subprocess check=True flag to raise exception on failure. Provide clear error messages. |
  | Git user not configured | Assume git user.name and user.email are already configured (standard prerequisite). Document prerequisite. |
  | Prose quality | Spec requires readable, grammatically correct prose. Implementer manual review before committing. |
  | File size out of range | Ensure prose is naturally 2-3 sentences without artificial padding. Typical result is 400-600 bytes. |

  ## Acceptance Criteria (Feature Level)

  - File test-g4ssgd.md exists in repository root directory
  - File contains exactly one markdown H1 heading (#) as title on first line
  - File contains blank line separating heading from prose
  - File contains 2-3 sentences of readable, grammatically correct prose
  - File is UTF-8 encoded without BOM
  - File uses Unix-style LF line endings, not Windows CRLF
  - File is staged with git add
  - Commit exists with exact message: "feat(102): create markdown file test-g4ssgd.md with prose content"
  - Changes are pushed to remote origin

  ---

  _Planning phase complete. Ready for implementation with TDD task breakdown._
