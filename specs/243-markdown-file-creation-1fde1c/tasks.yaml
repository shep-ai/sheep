content: |
  ## Summary

  Eight tasks across four phases implement feature 243 markdown file creation using the
  established Sheep pattern from features 001-242.

  **Phase 1 (Foundation):** Create the feature module with constants and entry point structure.

  **Phase 2 (Content & File Ops):** Generate prose content via Claude API, write markdown file with
  UTF-8/LF enforcement, and implement comprehensive validation before git operations.

  **Phase 3 (Git Integration):** Wire up git add/commit/push using existing Sheep git tools,
  following conventional commits specification.

  **Phase 4 (Verification):** Integrate all components into main function, test end-to-end,
  and manually verify all success criteria from the spec.

  **Key Implementation Points:**
  - Use `get_reasoning_llm()` for content generation with temperature 0.2
  - pathlib.Path with UTF-8 encoding naturally provides Unix LF line endings
  - Multi-point validation catches issues before git commit
  - GitCommitTool/GitPushTool from sheep.tools.git_tools handle git operations
  - Comprehensive logging and error handling at operation boundaries
  - Follow established patterns from features 001-242

  **Total Effort:** ~3 hours of implementation and testing.
