    description: "Implement write_markdown_file(filename, title, content) that creates a markdown file with structure: '# Title\\n\\n<prose_content>\\n'. Use pathlib.Path and open(encoding='utf-8') to ensure UTF-8 without BOM. Python's default on Unix is LF line endings. Write to repository root. Include validation that file was created and contains expected content."
    state: Todo
