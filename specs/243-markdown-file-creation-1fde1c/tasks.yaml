    acceptanceCriteria:
      - "generate_prose_content() function exists and returns a string"
      - "Returned string contains 2-3 sentences (counted by periods)"
      - "Content is original prose (not template/placeholder text)"
      - "Content does not include markdown formatting (no **, *, `, [, etc.)"
