content: |
  ## Architecture Overview

  Feature 243 follows the established Sheep pattern for markdown file creation (features 001-242).
  The implementation creates a dedicated feature module at
  `src/sheep/features/feature_243_markdown_file_creation.py` that orchestrates four main operations:

  1. **Content Generation** — Call Claude API via `get_reasoning_llm()` from `sheep.config.llm`
     with temperature 0.2 to generate unique, meaningful prose content.

  2. **File I/O** — Use Python `pathlib.Path` with `open(encoding='utf-8')` to write markdown
     structure: `# Title\n\n<2-3 sentences>` with UTF-8 encoding (no BOM) and LF line endings.

  3. **Validation** — Multi-point validation before git commit:
     - Markdown format: H1 heading, blank line separator, 2-3 sentences
     - Encoding: UTF-8 without BOM
     - Line endings: LF only (Unix-style `\n`)
     - File structure: trailing newline present
     - Prose quality: grammatically correct, meaningful content

  4. **Git Workflow** — Use `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`:
     - Stage file: `git add test-c2dbie.md`
     - Commit: `feat(243): create markdown file test-c2dbie.md with prose content`
     - Push: to feature branch `feat/243-markdown-file-creation-1fde1c`

  **Integration with Existing Infrastructure:**
  - Logging: `sheep.observability.logging.get_logger(__name__)`
  - Settings/Config: `sheep.config.settings.Settings`
  - LLM: `sheep.config.llm.get_reasoning_llm()`
  - Git Tools: `sheep.tools.git_tools.{GitCommitTool,GitPushTool}`

  No modifications to existing modules required. Feature module uses only existing, proven
  infrastructure from features 001-242.

  ## Key Design Decisions

  ### 1. Dedicated Feature Module vs. Generic Function
  **Chosen:** Create `feature_243_markdown_file_creation.py` following the established pattern.

  **Why:** All 242 prior features use dedicated modules. Provides clear feature identification,
  version control tracking, testability, and explicit feature metadata. Maintains architectural
  consistency across the entire Sheep project.

  ### 2. Content Generation: Claude API vs. Hardcoding
  **Chosen:** Generate fresh content each time via `get_reasoning_llm()` with temperature 0.2.

  **Why:** Ensures unique, meaningful prose satisfying the 'about anything' requirement. Infrastructure
  already proven across 242 prior features. Hardcoding would reduce diversity and violate feature spec.

  ### 3. File I/O: pathlib.Path vs. os.path
  **Chosen:** Use `pathlib.Path` with `open(encoding='utf-8')`.

  **Why:** Modern Python standard (3.4+), already used in codebase. Provides safe, readable,
  cross-platform path handling. Naturally handles UTF-8 and LF line endings on Unix. No external dependencies.

  ### 4. Validation: Comprehensive vs. Minimal
  **Chosen:** Multi-point validation (format, encoding, content structure) before git commit.

  **Why:** Catches all spec violations early, prevents invalid markdown from reaching git,
  enables clear error messages for debugging. Lightweight approach (no external dependencies).

  ### 5. Git Integration: Custom git Tools vs. GitPython
  **Chosen:** Use existing `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`.

  **Why:** Avoids external dependencies. Uses proven, battle-tested code from features 001-242.
  Subprocess without shell=True is secure. Tight integration with Sheep's logging and error handling.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Module Foundation)** must come first — establishes module structure,
     constants, imports, and entry point. TDD: write test that imports module.

  2. **Phase 2 (Content & File Operations)** depends on Phase 1 module existing.
     Implements the core creation logic: generate content → write to disk → validate.
     Validation is critical before git operations.

  3. **Phase 3 (Git Integration)** depends on Phase 2 validation passing.
     Only commit/push validated, correct files.

  4. **Phase 4 (Integration Testing)** verifies all phases work together.
     End-to-end test ensures success criteria met before code considered complete.

  **Why This Order:**
  - Foundation must be in place before any operations
  - File operations must be validated before git commit (fail-fast)
  - Git operations depend on validated file existing
  - Integration test verifies entire pipeline

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API timeout or failure | Retry logic with exponential backoff; clear error message if LLM unavailable; test with mock LLM response |
  | File encoding issues (BOM, CRLF) | Validation function checks for UTF-8 without BOM and LF-only line endings; test on Unix and Windows |
  | Git operations fail (auth, network) | GitCommitTool/GitPushTool handle errors; structured logging at operation boundaries; clear error messages |
  | Markdown format invalid | Validation function checks H1 heading, blank line, 2-3 sentences; catches before commit |
  | Content too short/long or incoherent | LLM temperature 0.2 ensures quality; validation checks sentence count; test with sample prompts |
  | File already exists | Check file non-existence before write; error if exists; test idempotency separately if needed |
  | Git state issues (dirty working tree) | Git operations assume clean state; document prerequisite; test assumes pre-existing feature branch |
