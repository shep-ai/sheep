# Structured technology decisions
decisions:
  - title: "Content Generation Approach"
    chosen: "Claude API with get_reasoning_llm() via CrewAI framework"
    rejected:
      - "Hardcoded prose content — inflexible, violates 'about anything' requirement, reduces diversity across test suite"
      - "Static template library — requires maintenance, limits topic variety, doesn't match established pattern from features 001-242"
      - "Random content generation without LLM — produces incoherent output, fails quality validation, not meaningful prose"
    rationale: >
      Claude API with reasoning LLM is the proven approach across all 242 prior features. The infrastructure
      is already in place (get_reasoning_llm() function, CrewAI integration, Anthropic API keys configured).
      Using LLM ensures each file has unique, meaningful, grammatically correct prose that satisfies the
      'about anything' user query and maintains semantic quality. Temperature 0.2 ensures reasonable consistency
      while preserving topic diversity. This approach avoids new dependencies and follows the established
      architectural pattern across the entire test suite.

  - title: "File I/O Implementation"
    chosen: "Python pathlib.Path with open() for UTF-8 write operations"
    rejected:
      - "os.path module — older API, less type-safe, requires string manipulation for path operations"
      - "Direct string paths with open() — loses safety benefits, path traversal vulnerabilities, less readable"
      - "Custom file writing wrapper — unnecessary abstraction when pathlib provides all needed functionality"
    rationale: >
      pathlib.Path is the modern Python standard (3.4+) and is already used throughout the Sheep codebase
      (see content_generators.py). It provides safe, cross-platform path handling without boilerplate. The
      write operation using open(path, \"w\", encoding=\"utf-8\") naturally handles UTF-8 encoding and LF line
      endings on Unix systems (Python's default). pathlib is part of the Python standard library, requiring
      no additional dependencies. This approach matches existing codebase patterns and provides clear, readable code.

  - title: "UTF-8 Encoding and Line Endings Strategy"
    chosen: "UTF-8 without BOM via open(encoding='utf-8'); validate line endings post-write"
    rejected:
      - "Use .encode('utf-8') manually — duplicates logic, error-prone, harder to validate for BOM"
      - "Use platform-native line endings — violates spec requirement for LF only, causes cross-platform issues"
      - "Skip encoding validation — risks silent failures, hard to debug platform-specific issues"
    rationale: >
      Python's open(encoding=\"utf-8\") automatically writes UTF-8 without BOM (standard behavior). Unix/Linux
      systems automatically use LF line endings. The validation function validate_markdown_file() checks
      for UTF-8 validity and rejects CRLF or BOM, catching any platform-specific issues before git commit.
      This strategy leverages Python's defaults while adding guardrails against human error or platform
      edge cases. Validation ensures compliance with spec requirement NFR-1, NFR-2, NFR-3.

  - title: "Git Integration Method"
    chosen: "subprocess-based git CLI via GitCommitTool and GitPushTool from sheep.tools.git_tools"
    rejected:
      - "GitPython library — adds external dependency, increases maintenance burden, subprocess approach sufficient"
      - "shell=True with git commands — security risk (command injection), harder to debug, subprocess is safer"
      - "Manual Python implementation of git operations — duplicates git functionality, introduces bugs, unmaintainable"
    rationale: >
      The Sheep project already has GitCommitTool and GitPushTool implemented using subprocess (sheep/tools/git_tools.py).
      Using these tools maintains consistency with features 001-242 and leverages proven, battle-tested code.
      subprocess without shell=True is secure and reliable. Using custom tools avoids new external dependencies
      (GitPython) and provides tight integration with Sheep's logging and error handling infrastructure. This
      approach has been validated across 242 prior successful feature implementations.

  - title: "Markdown Content Validation Strategy"
    chosen: "Multi-point validation: format structure, encoding/line endings, sentence count, prose quality"
    rejected:
      - "Minimal validation (only file existence) — risks invalid markdown reaching git, hard to debug failures"
      - "External markdown parser library — adds dependency (commonmark, markdown2), validation logic sufficient without it"
      - "Skip sentence counting — allows single-sentence content, violates spec requirement for 2-3 sentences"
    rationale: >
      Comprehensive validation prevents silent failures and catches issues early. The validate_markdown_file()
      function checks: (1) H1 heading structure (2) blank line separator (3) UTF-8 encoding without BOM (4) LF line
      endings (5) sentence count (2-3 periods required) (6) trailing newline. These checks are lightweight (no new
      dependencies) and catch all spec violations before commit. Simple format checks are sufficient — parsing markdown
      with an external library is overkill for a simple heading + prose structure. This validation approach has proven
      reliable across 242 prior features.

  - title: "Error Handling and Logging Strategy"
    chosen: "Try-except blocks with structured logging via get_logger(__name__) at each operation boundary"
    rejected:
      - "Silent failures (no logging) — impossible to debug issues, violates observability requirements"
      - "assert statements for validation — not suitable for user-facing errors, only for internal logic checks"
      - "Generic exception re-raising — loses context, harder for users to diagnose root causes"
    rationale: >
      The Sheep infrastructure includes observability.logging module with get_logger() providing structured logging.
      Each major operation (generate, write, validate, commit, push) has dedicated try-except-log blocks with
      descriptive error messages. This pattern is used throughout features 001-242 and the content_generators module.
      Structured logging enables debugging, provides audit trail, and helps diagnose failures in production. The
      approach is consistent with Sheep architecture and operational best practices.

