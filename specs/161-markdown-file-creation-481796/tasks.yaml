content: |
  ## Implementation Workflow

  The 5 tasks implement the feature in two distinct phases:

  **Phase 1: File Creation and Validation (Tasks 1.1-1.3)**
  Creates the markdown file with proper content and validates it meets all requirements.
  This phase is self-contained and independent of git integration.

  **Phase 2: Git Integration (Tasks 2.1-2.3)**
  Stages the validated file, commits it with conventional message, and pushes to the
  feature branch. This phase depends on Phase 1 completion.

  Each task follows TDD practices:
  - **RED**: Write failing tests that specify expected behavior
  - **GREEN**: Implement minimal code to pass the tests
  - **REFACTOR**: Clean up, optimize, improve code quality

  ## Task Dependencies

  ```
  task-1-1 (File Creation)
      ↓
  task-1-2 (Add Prose Content)
      ↓
  task-1-3 (Validate File)
      ↓
  task-2-1 (Git Add)
      ↓
  task-2-2 (Git Commit)
      ↓
  task-2-3 (Git Push)
  ```

  All tasks are sequential by design. Each task builds on the previous one, ensuring
  a clear progression from file creation through git integration.

  ## Implementation Notes

  - All file paths are hardcoded (no user input)
  - All git commands use subprocess.run() with argument lists (not shell strings)
  - Conventional commit message is hardcoded (no user input)
  - Prose content is generated/authored directly (no external dependencies)
  - Feature branch name is predetermined (feat/161-markdown-file-creation-481796)
  - No modifications to existing files or source code
