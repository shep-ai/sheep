  - Continues established pattern from 170+ existing test files (`test-*.md`)
  - Format: H1 heading (line 1) + blank line (line 2) + 2-3 sentences of prose (lines 3-5)
  - Typical size: 300-600 bytes (measured from existing files)
  - No special handling or post-processing required
  - Example structure:
