content: |
  ## Architecture Overview

  The feature implementation creates a markdown test file following the established
  pattern from 170+ existing test files in the Sheep repository. The implementation
  consists of:

  1. **File Creation**: Use Python's `pathlib.Path.write_text()` to create the file with
     UTF-8 encoding (default). This approach is modern, cross-platform, and idiomatic Python.

  2. **Content Composition**: Generate original prose about an arbitrary topic (2-3 sentences).
     The spec explicitly allows free-form topic selection, which aligns with existing
     test files that cover diverse subjects.

  3. **Git Integration**: Use Python's `subprocess.run()` to execute git CLI commands
     (git add, git commit, git push). This avoids external dependencies (GitPython) and
     maintains the spec constraint of "no external dependencies beyond Python 3.11+ stdlib
     and git."

  4. **Validation**: Verify file meets all requirements: UTF-8 encoding without BOM,
     LF line endings, proper markdown format (H1 heading + blank line + 2-3 sentences),
     and file size within 300-600 bytes.

  This architecture is consistent with features 159-160 and leverages the established
  patterns in the Sheep project, ensuring maintainability and adherence to project conventions.

  ## Key Design Decisions

  ### Decision 1: File Creation Method — pathlib.Path.write_text()

  **Chosen**: Use `pathlib.Path.write_text()` with default UTF-8 encoding.

  **Alternatives Considered**:
  - `open()` function with manual encoding — more verbose, less elegant
  - `Path.write_bytes()` with manual UTF-8 encoding — requires extra encoding step

  **Rationale**:
  pathlib is the modern Python idiom for file I/O. It automatically handles UTF-8 encoding
  by default on all platforms, satisfies FR-5 (UTF-8 without BOM) through Python's
  standard behavior, and is available in Python 3.11+ stdlib without additional dependencies.
  Consistent with features 159-160 implementations.

  ### Decision 2: Git Integration — subprocess.run()

  **Chosen**: Use `subprocess.run()` to execute git CLI commands.

  **Alternatives Considered**:
  - GitPython library — adds external dependency (violates NFR-4)
  - `os.system()` — less portable, weak error handling, shell-dependent

  **Rationale**:
  subprocess provides reliable, portable execution of git commands without external
  dependencies. Using argument list (not shell string) prevents command injection attacks
  and offers superior error handling. Aligns with NFR-4 constraint and features 159-160
  implementations.

  ### Decision 3: Line Ending Normalization — Trust Python Default

  **Chosen**: Rely on Python's `write_text()` default behavior (uses `\n` on all platforms).

  **Alternatives Considered**:
  - `os.linesep` — produces CRLF on Windows, violates NFR-6
  - Manual line ending conversion — unnecessary complexity

  **Rationale**:
  Python's `write_text()` uses `\n` in text mode on all platforms by default, regardless
  of OS. This automatically satisfies FR-6 (LF line endings) without extra logic and prevents
  cross-platform issues. Aligns with git conventions and repository standards.

  ### Decision 4: Prose Content Generation — Direct Authoring

  **Chosen**: Generate original, coherent 2-3 sentences on arbitrary topic.

  **Alternatives Considered**:
  - Faker library — adds external dependency (violates NFR-4)
  - LLM/API generation — introduces network dependency, unnecessary complexity

  **Rationale**:
  Spec explicitly allows arbitrary topics ("about anything"). Simple prose generation
  requires no external dependencies and maintains consistency with 170+ existing test files.
  Direct generation aligns with NFR-4 constraint and avoids external service dependencies.

  ## Implementation Strategy

  **Phase 1: File Creation and Validation** comes first because it establishes the
  deliverable (the markdown file). This phase is independent and contains no git
  dependencies.

  **Phase 2: Git Integration** follows, building on the validated file from Phase 1.
  This phase adds version control integration, ensuring the change is properly tracked.

  This ordering ensures that the file meets all quality requirements before being
  integrated into git, reducing the risk of committing invalid or incomplete work.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (UTF-8/BOM) | Python's `write_text()` automatically handles UTF-8 without BOM by default. Validation task verifies encoding. |
  | Line ending inconsistency (CRLF vs LF) | Python's text mode uses `\n` on all platforms. Validation task checks line endings. Repository conventions verified. |
  | File size out of range (300-600 bytes) | Prose composition following established pattern naturally falls within range. 170+ precedent files confirm. Validation task verifies size. |
  | Git command failures (network, permissions) | Use `subprocess.run(..., check=True)` to raise exceptions on failure. Handle errors explicitly in implementation. |
  | Commit message format incorrect | Conventional commit message format hardcoded in code. No user input. Validation task verifies exact format. |
  | File path traversal or injection | File path hardcoded in code. No user input in path construction. Prevents path traversal attacks. |
  | Command injection via git commands | Use `subprocess.run()` with argument list (not `shell=True`). Prevents shell metacharacter interpretation. |
