# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repo already has STATE_MACHINE.md (traffic light) and DOOR_LOCK_STATE_MACHINE.md (door lock) as standalone example state machine diagrams. This feature adds one more markdown file with a short, simple state machine diagram — a vending machine — for illustrative purposes, unrelated to the repo's actual functionality.

  ## Success Criteria

  - [ ] A new `.md` file exists in the repo root (e.g., `VENDING_MACHINE_STATE_MACHINE.md`)
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` block with 4–6 states and clearly labeled transitions
  - [ ] The diagram subject is a vending machine (not a traffic light or door lock)
  - [ ] The file includes a heading and a one-sentence intro consistent with existing state machine MD files
  - [ ] The file renders correctly in GitHub Markdown preview (no broken diagram syntax)
  - [ ] No source code or test files are modified

  ## Functional Requirements

  - **FR-1**: A new Markdown file must be created in the repo root directory.
  - **FR-2**: The file must contain a Mermaid `stateDiagram-v2` diagram depicting a vending machine state machine.
  - **FR-3**: The diagram must include at least the following states: `Idle`, `CoinInserted`, `Dispensing`, and at least one error/return state (e.g., `CoinReturned`).
  - **FR-4**: All state transitions must be labeled with the triggering event.
  - **FR-5**: The file must include a level-1 or level-2 heading and a one-sentence description of the diagram.

  ## Non-Functional Requirements

  - **NFR-1**: The file must follow the existing naming convention for state machine MD files (SCREAMING_SNAKE_CASE with `.md` extension).
  - **NFR-2**: Mermaid syntax must be valid and renderable by standard GitHub Markdown parsers.
  - **NFR-3**: The file must be self-contained — no external links or references required to understand it.
  - **NFR-4**: The diagram must remain simple (≤6 states) to serve as a minimal illustrative example.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which subject for the diagram? | Vending machine | Classic CS example, distinct from existing traffic light and door lock files |
  | 2 | Include prose description? | Heading + one-sentence intro + diagram | Matches existing file conventions with minimal added effort |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new .md file) | Low | New standalone content file, no code changes |

  ## Dependencies

  None. Pure content addition following existing conventions.

  ## Size Estimate

  **S** — Single markdown file with a short Mermaid diagram, a heading, and one sentence of prose. No code, no tests, minimal effort.
