content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. File Naming Convention

  **Chosen:** `VENDING_MACHINE_STATE_MACHINE.md` in repo root (SCREAMING_SNAKE_CASE)

  **Rejected:**
  - `vending-machine-state-machine.md` — kebab-case conflicts with existing naming pattern
  - `docs/VENDING_MACHINE_STATE_MACHINE.md` — subdirectory placement conflicts with repo-root convention

  **Rationale:** Both existing examples (`STATE_MACHINE.md`, `DOOR_LOCK_STATE_MACHINE.md`) live in
  the repo root and use SCREAMING_SNAKE_CASE. Matching this is the obvious choice.

  ### 2. Diagram Syntax

  **Chosen:** Mermaid `stateDiagram-v2`

  **Rejected:**
  - PlantUML — not used in repo; no native GitHub rendering support
  - ASCII art — not renderable as a visual diagram; inconsistent with existing files

  **Rationale:** Both existing state machine files use Mermaid `stateDiagram-v2`. GitHub renders
  it natively. Zero new tooling required.

  ### 3. Prose Content

  **Chosen:** Level-1 heading + one-sentence intro + Mermaid block

  **Rejected:**
  - Diagram only — no heading; inconsistent with existing files
  - Heading only — spec explicitly resolved this in favour of including an intro sentence

  **Rationale:** The feature spec resolved question 2 in favour of an intro sentence for
  readability. Minimal added effort; improves orientability for the reader.

  ### 4. State Machine Scope

  **Chosen:** 4 states — `Idle`, `CoinInserted`, `Dispensing`, `CoinReturned`

  **Rejected:**
  - 6+ states — violates NFR-4 (<=6 states) in spirit; adds unnecessary complexity
  - 2-3 abstract states — too vague to be recognisably a vending machine

  **Rationale:** Satisfies FR-3 exactly (Idle, CoinInserted, Dispensing, plus one return state),
  stays within the <=6-state limit, and keeps the diagram instantly readable.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State diagram rendering | Use | Already used in repo; native GitHub support |
  | PlantUML | Alternative diagram format | Reject | Not used in repo; no native GitHub rendering |

  ## Security Considerations

  None. This is a static Markdown/Mermaid content file with no executable code, no user input,
  no external links, and no data. There are no authentication, authorisation, or injection
  concerns.

  ## Performance Implications

  None. A small Markdown file has no runtime performance impact. GitHub renders Mermaid diagrams
  client-side via its built-in pipeline with no server-side rendering cost to the repo.

  ## Architecture Notes

  The file is a self-contained content addition to the repo root. It follows the identical
  structural pattern as `STATE_MACHINE.md` and `DOOR_LOCK_STATE_MACHINE.md`:
  - Repo root placement
  - SCREAMING_SNAKE_CASE filename
  - Level-1 Markdown heading
  - Optional one-sentence intro (as resolved in spec)
  - Single fenced Mermaid `stateDiagram-v2` block

  No source code, tests, configuration, or CI files are touched. The change is entirely additive.
