content: |
  ## Architecture Overview

  This feature is a standalone content addition that lives entirely outside the source tree.
  The repo already contains two peer files at the root level:
  - `STATE_MACHINE.md` — traffic light (no transition labels)
  - `DOOR_LOCK_STATE_MACHINE.md` — door lock (with transition labels)

  `VENDING_MACHINE_STATE_MACHINE.md` follows the same structural pattern:
  - Repo root placement (not in `docs/` or any subdirectory)
  - SCREAMING_SNAKE_CASE filename ending in `_STATE_MACHINE.md`
  - Level-1 Markdown heading
  - One-sentence prose intro (spec-resolved addition over the bare existing convention)
  - Single fenced `mermaid stateDiagram-v2` block

  No source code, tests, configuration, CI, or package files are touched.

  ## Key Design Decisions

  ### File naming
  `VENDING_MACHINE_STATE_MACHINE.md` — SCREAMING_SNAKE_CASE, repo root. Matches the two
  existing siblings exactly. Rejected: kebab-case (conflicts with convention); subdirectory
  placement (conflicts with repo-root convention).

  ### Diagram syntax
  Mermaid `stateDiagram-v2` — already used in both existing files; GitHub renders it natively;
  zero new tooling required. Rejected: PlantUML (not in repo, no native GitHub rendering);
  ASCII art (not renderable as a visual diagram).

  ### Prose content
  Heading + one-sentence intro + diagram block. The feature spec explicitly resolved this
  question in favour of the intro sentence for reader orientation. Rejected: diagram only
  (no heading); heading only (spec overrides bare convention for readability).

  ### State scope
  4 states: `Idle`, `CoinInserted`, `Dispensing`, `CoinReturned`. Satisfies FR-3 exactly,
  respects the <=6-state NFR-4 limit, and keeps the diagram immediately readable. All
  transitions labeled per FR-4. Rejected: 6+ states (unnecessary complexity); 2-3 abstract
  states (loses educational value).

  ## Implementation Strategy

  Single phase, single task: write the file. No sequencing concerns. The diagram structure
  is fully defined by the spec and research:

      [*] --> Idle
      Idle --> CoinInserted : insert coin
      CoinInserted --> Dispensing : select item
      CoinInserted --> CoinReturned : cancel
      Dispensing --> Idle : item dispensed
      CoinReturned --> Idle : coin returned

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Invalid Mermaid syntax breaks GitHub rendering | Keep syntax minimal and consistent with existing files; validate against stateDiagram-v2 spec |
  | Naming drift from existing convention | Filename fixed by spec: VENDING_MACHINE_STATE_MACHINE.md |
  | Accidentally modifying source files | Single-file addition; verify only the new file is staged before commit |
