content: |
  ## Summary

  This feature requires creating a single Markdown file. There is no code to write and no
  tests to run. The entire implementation is the file itself: a heading, one sentence of prose,
  and a Mermaid stateDiagram-v2 block representing the vending machine flow from Idle through
  CoinInserted, Dispensing, and back — with a CoinReturned cancel path.

  Acceptance is verified by visual inspection of the rendered diagram in GitHub Markdown preview
  and a check that no existing files were modified.
