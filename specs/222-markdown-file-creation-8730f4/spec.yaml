content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-ui3mtt.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 200+ similar test files already existing in the repository as precedents. This feature demonstrates
  core capabilities: file creation, git staging, conventional commits, and push-to-remote
  operations—all essential building blocks in the Sheep automation platform.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **Root directory**: Contains 200+ test markdown files (test-*.md, *.md, etc.) serving as implementation targets and precedents
  - **specs/**: Feature specifications organized by feature number and unique identifiers; each contains a spec.yaml defining the feature
  - **src/sheep/**: Core platform code including agents (research, implementation, review), flows (orchestration), configuration, tools, and CLI
  - **tests/**: Test suite for the Sheep platform
  - **pyproject.toml**: Python project configuration with dependencies and build settings
  - **.github/workflows/**: CI/CD pipeline using GitHub Actions

  **Key files relevant to this feature:**
  - Test files: test-5vnehe.md, test-hmis8d.md, test-6ess1a.md, ABOUT_ME.md, DESIGN_PATTERN.md (precedent examples)
  - Implementation scripts: create_markdown_file.py, create_markdown_file_221.py, create_markdown_file_218.py (pattern templates)
  - Git configuration: .gitignore, .github/workflows/

  ### Architecture Patterns

  The Sheep platform uses a **modular, observable agentic architecture** with clear separation of concerns:

  1. **Flows** (structure and orchestration): Define execution steps, control paths, and state transitions using CrewAI's Flow abstraction
  2. **Crews** (AI intelligence): Specialized agent teams with focused roles (Research, Implementation, Review agents)
  3. **Tasks** (goal-oriented work): Well-designed, specific tasks that drive agent performance and decision-making
  4. **Tools** (reusable operations): Git operations, file operations, web search, observability integrations
  5. **Observability**: Langfuse integration for execution tracing, metrics, and monitoring

  For this feature (simple markdown file creation):
  - No flow, crew, or agent integration is required
  - Sequential, deterministic workflow: create file → validate (optional) → git add → git commit → git push
  - Uses Python 3.11+ standard library only (pathlib for file I/O, subprocess for git commands)
  - Follows the established pattern from features 160-221 (60+ successful implementations)
  - No dependency on Sheep platform components; pure file system and git operations

  ### Relevant Technologies

  - **Markdown**: Simple, universally supported text format using CommonMark specification; H1 heading syntax (#) and plain prose
  - **Git**: Distributed version control; 200+ existing test commits demonstrate stability and established workflow patterns
  - **Python 3.11+**: Standard library provides all needed functionality (pathlib for cross-platform file I/O, subprocess for git command execution)
  - **Linux**: Target execution environment with Unix-style LF line endings (repository convention)
  - **Conventional Commits**: Industry standard commit message format with scope notation (feat(222): message)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-500 bytes); no directory creation, no deletions, no overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 160-221; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the Sheep platform |
  | Specs Directory | Low | Updates only spec.yaml file during analysis phase; no impact on other feature specifications |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new external package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to validate |
  | CI/CD Pipeline | None | Git push triggers existing CI, but no additional configuration or pipeline changes needed; feature follows established pattern |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/222-markdown-file-creation-8730f4` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with standard library modules: `pathlib`, `subprocess`, `sys` (all built-in, no external packages)
  - Git configuration with user.name and user.email set for creating commits
  - Unix-based environment (Linux, macOS) to maintain consistent LF line endings

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md, *.md) provide clear and consistent pattern to follow
  - Previous feature implementations (features 160-221) demonstrate successful execution of identical or very similar patterns
  - Implementation scripts in repository root (create_markdown_file_221.py, create_markdown_file_218.py, etc.) show working, proven patterns
  - Feature 221 spec and implementation provide exact, most recent template
  - Repository git history shows 221+ successful commits with consistent conventional commit format

  **Not Required:**
  - No source code dependencies or imports from src/sheep/
  - No external package dependencies beyond Python standard library
  - No modifications to configuration files (.env, pyproject.toml, etc.)
  - No integration with CrewAI, Langfuse, or other Sheep platform components
  - No testing framework integration; feature has no unit tests or test files

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with 60+ identical successful precedents (features 160-221):

  - **File creation**: ~3 minutes (compose markdown H1 heading + select/write 2-3 sentences of prose content)
  - **Validation**: ~2 minutes (basic format checks; many recent features skip formal validation)
  - **Git workflow**: ~3-5 minutes (stage file with git add, create conventional commit message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification:**
  - Extremely well-established pattern with 60+ identical features (160-221) providing proven precedent and templates
  - Flexible topic selection with no required research or architectural decisions
  - Single file with minimal, well-understood content format (one H1 markdown heading + 2-3 plain sentences)
  - No testing, documentation, or complex configuration changes required
  - Recent feature implementations (219-221) demonstrate efficient execution within 10-15 minute timeframe
  - No git merge conflicts or branch management complexity; feature branch already created and checked out
  - Standard library only; no dependency resolution, build process, or environment setup needed
  - Clear success criteria with no ambiguity or edge cases

