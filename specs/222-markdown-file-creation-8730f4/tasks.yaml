content: |
  ## Implementation Summary

  This task breakdown covers 4 concrete, ordered tasks across 2 phases to complete feature 222:

  **Phase 1: File Creation with Markdown Format** (Task 1)
  - Design and create test-ui3mtt.md with H1 heading and 2-3 sentences of prose
  - Use pathlib.Path.write_text() with explicit newline='\n' for Unix LF line endings
  - Validate CommonMark markdown syntax and file structure
  - **Effort:** ~8 minutes

  **Phase 2: Git Integration and Remote Push** (Tasks 2-4)
  - Task 2: Stage file with `git add` (3 minutes)
  - Task 3: Commit with conventional message `feat(222): ...` (4 minutes)
  - Task 4: Push to feature branch on origin with `-u` flag (3 minutes)
  - **Effort:** ~10 minutes

  **Total Effort:** ~18 minutes (includes TDD red/green/refactor cycles and error handling)

  All tasks follow TDD approach with explicit red (test assertions), green (minimal implementation),
  and refactor (validation and error handling) steps. Tasks are sequentially ordered by dependency:
  file creation → git add → git commit → git push. No task depends on a later task.

  ## Validation and Success Criteria

  Each task includes specific, testable acceptance criteria:
  - Task 1: File exists with correct H1, sentence count, LF line endings, valid markdown
  - Task 2: File staged successfully, appears in git status
  - Task 3: Commit message in correct format, visible in git log
  - Task 4: Commit pushed to origin, upstream tracking configured

  Tasks are independent in structure but sequential in execution (each depends on previous task's output).
  Implementation follows established pattern from 60+ preceding features (160-221) with proven success rate.
