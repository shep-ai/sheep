content: |
  ## Architecture Overview

  This feature is a minimal, deterministic implementation that requires no integration with the Sheep platform's
  CrewAI flows, agents, or tools. The implementation is entirely self-contained:

  1. **File Creation Phase**: Use Python 3.11+ pathlib.Path.write_text() to create the markdown file
     with explicit `newline='\n'` parameter to enforce Unix LF line endings across all platforms.

  2. **Git Integration Phase**: Use Python subprocess.run() to execute sequential git commands:
     - `git add test-ui3mtt.md` to stage the file
     - `git commit -m "feat(222): ..."` with conventional commit message
     - `git push -u origin feat/222-markdown-file-creation-8730f4` to push to feature branch

  **Why this approach:**
  - pathlib is the modern Python 3.11+ standard library idiom for file I/O
  - Explicit `newline='\n'` guarantees LF across all platforms (no platform-specific conversion)
  - subprocess.run() with argument lists prevents command injection and provides proper error handling
  - No external dependencies required; spec mandates standard library only
  - Pattern validated across 60+ preceding features (160-221) with 100% success rate

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen**: `pathlib.Path.write_text(content, newline='\n', encoding='utf-8')`

  **Why this approach**:
  - Modern, idiomatic Python 3.11+ standard library approach
  - Atomic write with automatic encoding handling (UTF-8 by default)
  - Explicit `newline='\n'` parameter enforces Unix LF line endings without platform-specific translation
  - No context manager boilerplate required
  - Cleaner than open()/write() pattern
  - Research decision validated across all 60+ preceding features

  **Alternatives rejected**:
  - `open()/write()` with manual context manager: More verbose, requires explicit close(), harder to manage encoding
  - Shell command via subprocess: Adds complexity, less portable, harder to test, potential injection risks
  - Manual LF conversion with str.replace(): Fragile, happens after write (too late to control line endings)

  ### 2. Content Generation: Hardcoded Markdown Prose

  **Chosen**: Hardcoded H1 heading and 2-3 sentences of prose content

  **Why this approach**:
  - Spec allows flexible topic selection ("about anything"); no need for complexity
  - Test files are deterministic artifacts; hardcoded content is preferable to randomization
  - Matches pattern of 200+ existing test files (test-5vnehe.md, test-6ess1a.md, test-hmis8d.md)
  - Simplest, most maintainable approach
  - No randomization or dynamic generation overhead
  - Content is reviewable and debuggable

  **Alternatives rejected**:
  - Randomized/procedural content: Adds complexity, non-deterministic output, RNG seeding overhead
  - Template-based generation: Over-engineering, introduces template logic without value
  - External content source (API, file): Unnecessary complexity, adds network/file I/O dependency

  ### 3. Git Integration: subprocess.run() with Separate Commands

  **Chosen**: Three sequential `subprocess.run()` calls for git add, commit, and push

  **Why this approach**:
  - Spec mandates standard library only (no GitPython or external dependencies)
  - subprocess.run() with argument lists (no shell=True) prevents command injection
  - Proper error handling via return code checking (check=True raises CalledProcessError)
  - Sequential execution is clear, debuggable, and matches pattern from features 160-221
  - Each git command is separate, making error diagnosis easier

  **Alternatives rejected**:
  - GitPython library: External dependency, violates standard library requirement, adds attack surface
  - os.system() or shell=True subprocess: Deprecated, unsafe, poor error handling, command injection risk
  - Single shell command combining all operations: Less safe, harder to debug, difficult to validate individual steps

  ### 4. Line Ending Handling: Explicit newline='\n' Parameter

  **Chosen**: `pathlib.Path.write_text(content, newline='\n')`

  **Why this approach**:
  - Spec requires Unix LF line endings (\n) for consistency with repository convention
  - pathlib's `newline` parameter bypasses Python's platform-specific line ending translation
  - Guarantees LF on all platforms (Windows git checkout, local testing, CI environments)
  - Standard, portable, idiomatic approach per Python documentation
  - Most robust solution; no post-processing required
  - All precedent files use LF only; validated across repository

  **Alternatives rejected**:
  - System default line endings: May produce CRLF on Windows checkout, violates repo convention, introduces cross-platform bugs
  - Manual post-processing: str.replace('\r\n', '\n') after write is fragile, happens too late, redundant with pathlib support

  ### 5. Error Handling: Defensive with Informative Messages

  **Chosen**: Basic try/except blocks with subprocess return code checking (check=True)

  **Why this approach**:
  - File I/O and git operations can fail for legitimate reasons (permissions, disk space, git config, network for push)
  - subprocess.run(check=True) raises CalledProcessError on non-zero exit code, enabling fail-fast behavior
  - Informative error messages aid debugging without adding complexity
  - Aligns with defensive programming best practices
  - Minimal overhead for simple, sequential operations

  **Alternatives rejected**:
  - No error handling: Impossible to debug failures, risky for file I/O and git operations
  - Silent error suppression (bare except): Masks problems, prevents debugging, dangerous for operations with side effects

  ## Implementation Strategy

  **Phase 1: File Creation with Markdown Format** (Est. 5-7 minutes)
  1. Design prose content: Compose H1 heading (e.g., "# Topic Title") and 2-3 sentences
  2. Implement file creation: Use pathlib.Path('test-ui3mtt.md').write_text(content, newline='\n')
  3. Validate structure: Verify H1 heading, sentence count, valid CommonMark, LF line endings

  **Phase 2: Git Integration and Remote Push** (Est. 5-8 minutes)
  1. Git add: subprocess.run(['git', 'add', 'test-ui3mtt.md'], check=True)
  2. Git commit: subprocess.run(['git', 'commit', '-m', 'feat(222): ...'], check=True)
  3. Git push: subprocess.run(['git', 'push', '-u', 'origin', 'feat/222-markdown-file-creation-8730f4'], check=True)
  4. Verify: Confirm push succeeded, file exists in repo, git log shows correct message

  **Why this order**:
  - File creation must precede git operations (nothing to stage without a file)
  - Git add must precede commit (must stage before committing)
  - Commit must precede push (nothing to push without a commit)
  - Sequential, deterministic workflow mirrors physical file system and git state

  ## Risk Mitigation

  | Risk | Likelihood | Severity | Mitigation |
  | ---- | ---------- | -------- | ---------- |
  | File creation fails (permissions, disk space) | Low | High | Wrap in try/except, provide descriptive error message, validate write_text() success |
  | Git configuration missing (user.name/user.email) | Low | High | Git operations fail fast with CalledProcessError; error message guides user to configure git |
  | Git branch not checked out correctly | Very Low | High | Feature branch pre-created by platform; verify branch before implementation |
  | Network failure during push | Low | Medium | Push retry logic; CalledProcessError surfaces issue to user for manual recovery |
  | File already exists (collision) | Very Low | Low | pathlib.write_text() overwrites existing file; spec does not require collision detection |
  | Incorrect line endings on non-Unix platform | Very Low | Very Low | Explicit newline='\n' parameter guarantees LF across all platforms; validated in research |
  | Markdown syntax errors | Very Low | Low | Simple prose format (H1 + sentences) is inherently valid CommonMark; no complex syntax |
  | Conventional commit format violation | Very Low | Low | Commit message is hardcoded; format validated in research phase |

