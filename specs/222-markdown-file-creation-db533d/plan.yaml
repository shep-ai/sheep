# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 222 implements a simple markdown file creation workflow that fits into the Sheep
  platform as a test feature validating core capabilities: file creation, git integration,
  and conventional commits. This feature is self-contained and does not depend on or integrate
  with any source code in src/sheep/ (agents, crews, tasks, tools).

  The architecture is straightforward and stateless:
  1. **File Creation:** Use Python pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings
  2. **Git Integration:** Use subprocess.run() with list-based arguments for safe command execution
  3. **Error Handling:** Catch specific exceptions (FileExistsError, OSError, CalledProcessError)
  4. **No Validation:** Create file only; do not validate file structure after creation

  This matches the exact pattern proven across 60+ identical features (160-221), confirming
  architectural stability and readiness for implementation.

  ## Key Design Decisions

  ### 1. File Creation Method: Python pathlib

  **Chosen:** `pathlib.Path.write_text()` with explicit encoding and newline parameters

  **Rationale:**
  - Modern, safe, cross-platform file handling from Python standard library
  - Explicit parameters ensure UTF-8 without BOM and Unix LF line endings on all platforms
  - Used in features 216-221 (proven pattern across recent implementations)
  - No external dependencies (satisfies NFR-3)
  - Provides clear error semantics (FileExistsError, OSError)

  **Alternative approaches rejected:**
  - Direct bash/shell commands: Inconsistent with codebase patterns, harder to debug
  - GitPython or libgit2: External dependencies (violates NFR-3), not used in existing features
  - Template-based generation: Over-engineered for simple content

  ### 2. Content Generation: Flexible/Generic Prose

  **Chosen:** Any topic, no specific theme constraint (2-3 sentences following H1 heading)

  **Rationale:**
  - User query explicitly states "about anything" (no theme required)
  - Flexible content minimizes decision burden and enables fastest execution
  - Consistent with features 219-221 (proven approach)
  - Allows implementation to focus on core workflow (file creation, git integration) rather than content generation

  ### 3. Git Integration: subprocess.run() with check=True

  **Chosen:** Sequential subprocess calls for git add, commit, and push operations

  **Rationale:**
  - Established pattern across all 60+ features (160-221)
  - Safe error handling via CalledProcessError with check=True
  - Clean separation of concerns (each git command is independent call)
  - Cross-platform compatible
  - No external dependencies

  **Pattern:**
  ```
  git add test-atwx74.md
  git commit -m "feat(222): Create markdown file test-atwx74.md"
  git push -u origin HEAD
  ```

  ### 4. Error Handling: Minimal and Defensive

  **Chosen:** Specific exception handling for file operations and git commands

  **Rationale:**
  - Spec explicitly requires "no validation layer" (feature 217 includes validation, but 222 does not)
  - Feature 221 (immediate predecessor) uses this minimal approach
  - Defensive check for FileExistsError prevents accidental overwrites
  - CalledProcessError provides clear context for git failures
  - Keeps implementation lean (~50 lines) and execution fast (~10-15 minutes)

  ### 5. No Validation Layer

  **Chosen:** Create file only; do not validate file structure, encoding, or content

  **Rationale:**
  - Feature spec explicitly states "no validation layer required"
  - Feature 221 follows this pattern; feature 217 (earlier) includes comprehensive validation
  - Validation would add 100+ lines of regex/parsing code without benefit
  - Validation after commit is impossible to fix (file already committed)
  - Keeps feature scope focused on core workflow

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Core Implementation):** File creation, git staging, and commit
  - These operations are tightly coupled: file must exist before staging, staging must succeed before commit
  - By grouping them, we ensure a clean checkpoint: file created, staged, and committed
  - Time estimate: ~8-9 minutes

  **Phase 2 (Verification and Push):** Execute, verify, and push to remote
  - Run the complete workflow and verify all success criteria are met
  - Push committed changes to origin
  - Isolated from phase 1 to separate implementation from verification
  - Time estimate: ~3-4 minutes (includes network push)

  **Total estimate:** ~11-13 minutes (within spec size "S" estimate of 10-15 minutes)

  ### Why This Order

  This ordering reflects dependency constraints and risk mitigation:
  1. **File creation** is the foundation — everything else depends on it
  2. **Git staging + commit** completes the core workflow locally and provides a safe recovery point
  3. **Verification + push** ensures the workflow succeeded and moves changes upstream

  Separating verification from push is a defensive choice: we can verify before pushing,
  and if push fails, the commit is still safely on the local branch for debugging.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File already exists (test-atwx74.md)** | Wrap file creation in try-except block; catch FileExistsError and exit with clear error message. This prevents accidental overwrites. |
  | **Insufficient write permissions to repository root** | Catch OSError during file write; clear error message guides user to check permissions. This is a pre-condition (NFR-8). |
  | **Git not configured (user.name, user.email missing)** | Git commit will fail with CalledProcessError; error message shows the failed git command. User can configure git and re-run. |
  | **Network failure during push** | CalledProcessError on push failure provides clear context. Commit is safe on local branch. User can retry push manually or investigate network issues. |
  | **Incorrect line endings or encoding** | Explicit `newline=\"\\n\"` and `encoding=\"utf-8\"` parameters ensure correct format on all platforms. Pathlib handles this automatically. |
  | **Feature branch not checked out** | Git operations will fail with CalledProcessError. Pre-condition is that feature branch `feat/222-markdown-file-creation-db533d` is already checked out. |
  | **Markdown format issues (missing H1, sentence count off)** | No validation layer, so format errors go undetected. This is intentional per spec ("no validation required"). User can verify file manually if needed. |

  ## Implementation Confidence

  **High confidence** — This feature is based on 60+ identical successful implementations (features 160-221).
  All design decisions are proven patterns from the codebase. No novel or unproven approaches are used.
  All required technologies (Python 3.11, pathlib, subprocess, git) are standard and available.
  Time estimate (10-15 minutes) is conservative based on feature 221 completion time.

  **Ready to implement:** Yes. Move to task breakdown phase.
