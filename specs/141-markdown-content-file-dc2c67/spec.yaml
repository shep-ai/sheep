  ## Problem Statement

  Create a markdown file named test-vnytef.md with a title (H1 heading) and 2-3 sentences of prose content. This is part of the Sheep agentic platform's feature suite, which uses AI agents to automate software development tasks. The task demonstrates the platform's capability to reliably create, validate, and publish markdown content through an automated workflow.

  ## Codebase Analysis

  ### Project Structure

  The repository is the **Sheep** project — an agentic platform for automated code implementation using CrewAI. Key directories:

  - **`src/sheep/`** — Main package containing agents, configuration, flows, tools, and features
  - **`src/sheep/features/`** — Feature-specific implementation modules (one per feature number)
  - **`src/sheep/content_generators.py`** — Reusable utilities for markdown generation, file I/O, git operations, and validation
  - **`specs/`** — Feature specifications organized by feature number
  - **Repository root** — Output location for generated markdown files

  ### Architecture Patterns

  **Feature Implementation Pattern:**
  1. Each feature has a dedicated Python module at `src/sheep/features/feature_N_markdown_file_creation.py`
  2. Modules import and compose utilities from `content_generators.py`:
     - `generate_markdown_content()` — Uses Claude LLM to generate H1 title + 2-3 sentences
     - `write_markdown_file()` — Writes markdown content to repository root with UTF-8 encoding
     - `validate_markdown_file()` — Validates file meets specification requirements
     - `commit_markdown_file()` — Git stages and commits with conventional message
     - `push_markdown_file()` — Pushes changes to remote feature branch
  3. Each feature follows an identical workflow with minor variations (different filename/content)
  4. Existing patterns from 140+ completed features (136-140) are directly applicable

  **Technology Stack:**
  - **Python**: Core language for feature implementation
  - **CrewAI**: LLM orchestration and agentic framework
  - **Claude API**: LLM for generating markdown content
  - **Git**: Version control integration (commit, push)
  - **Logging**: Structured logging via `sheep.observability.logging`
  - **Markdown**: Output format (simple: H1 heading + prose)

  ### Relevant Technologies

