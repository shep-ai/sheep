# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a markdown file named `test-vnytef.md` in the repository root containing an H1 title and 2-3 sentences of prose content. This feature is part of the Sheep agentic platform's automated software development suite and demonstrates the platform's capability to reliably generate, validate, and publish markdown content through established workflow patterns.

  ## Success Criteria

  - [ ] File `test-vnytef.md` created in repository root with correct filename and location
  - [ ] File contains exactly one H1 heading (markdown title)
  - [ ] File contains 2-3 sentences of prose content (validated sentence count)
  - [ ] File content is valid UTF-8 encoded markdown
  - [ ] Generated content passes markdown format validation checks
  - [ ] Git commit created with conventional commit message format (docs/feat prefix)
  - [ ] Changes successfully pushed to remote feature branch `feat/141-markdown-content-file-dc2c67`
  - [ ] Implementation module created at `src/sheep/features/feature_141_markdown_file_creation.py`
  - [ ] All existing tests continue to pass
  - [ ] Code follows established patterns from features 001-140

  ## Functional Requirements

  - **FR-1**: System must create a new markdown file named exactly `test-vnytef.md` in the repository root
  - **FR-2**: Markdown file must contain exactly one H1 heading (title) as the first line of content
  - **FR-3**: Markdown file must contain 2-3 sentences of prose content after the H1 heading
  - **FR-4**: Prose content must be contextually coherent and readable
  - **FR-5**: File content must be generated using Claude LLM via existing `generate_markdown_content()` utility
  - **FR-6**: System must write generated content to file using UTF-8 encoding
  - **FR-7**: System must validate file meets specification requirements before committing
  - **FR-8**: System must stage and commit changes with conventional commit message format
  - **FR-9**: System must push commits to remote feature branch
  - **FR-10**: Feature must be implemented as Python module at `src/sheep/features/feature_141_markdown_file_creation.py`
  - **FR-11**: Feature module must compose utilities from `content_generators.py` following established orchestration pattern

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow established pattern from features 001-140 without deviation
  - **NFR-2**: Implementation must reuse utilities from `content_generators.py` without modification
  - **NFR-3**: Feature module must be approximately 50-80 lines of Python code (primarily orchestration)
  - **NFR-4**: Must include structured logging via `sheep.observability.logging.get_logger()`
  - **NFR-5**: Implementation must complete within small (S) size estimate of 30-60 minutes
  - **NFR-6**: Code must maintain consistency with existing codebase style and conventions
  - **NFR-7**: Validation checks must complete in under 100ms
  - **NFR-8**: No new external dependencies should be introduced
  - **NFR-9**: Git operations (commit, push) must use existing wrapper functions without modification

  ## Functional Workflow

  1. Feature module invokes `generate_markdown_content()` to create H1 title + 2-3 sentences via Claude LLM
  2. Generated content is passed to `write_markdown_file()` for UTF-8 file I/O to repository root
  3. File is passed to `validate_markdown_file()` for specification compliance checks
  4. Validated file is committed via `commit_markdown_file()` with conventional message
  5. Commits are pushed to remote feature branch via `push_markdown_file()`
  6. Logging occurs at each step via structured logging utility

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | --- | --- | --- | --- |
  | 1 | Content generation method (LLM vs template) | Generate via Claude API (LLM) | Maintains pattern from 140+ features, enables unique content, reuses proven utilities |
  | 2 | Validation scope (basic vs comprehensive) | Basic validation | Meets spec requirements, lightweight, aligns with established pattern, no external dependencies |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/feature_141_markdown_file_creation.py` | High | New file implementing the feature orchestration following established pattern from features 001-140 |
  | `src/sheep/features/__init__.py` | Low | May need to export new feature function if module registration is required |
  | Repository root (test-vnytef.md) | High | New markdown file created as direct output of feature |
  | `src/sheep/content_generators.py` | None | Existing utilities used without modification |

  ## Dependencies

  **Internal dependencies:**
  - `sheep.content_generators.generate_markdown_content()` — Generates H1 + prose content
  - `sheep.content_generators.write_markdown_file()` — File I/O to repository root
  - `sheep.content_generators.validate_markdown_file()` — Validation checks
  - `sheep.content_generators.commit_markdown_file()` — Git staging and commit
  - `sheep.content_generators.push_markdown_file()` — Git push operations
  - `sheep.observability.logging.get_logger()` — Structured logging
  - `sheep.config.llm.get_reasoning_llm()` — LLM API access

  **External dependencies:**
  - CrewAI (already installed)
  - Claude API (already configured via .env)
  - Git (already available in environment)

  ## Size Estimate

  **S** — Approximately 30-60 minutes

  **Justification:**
  - Extremely straightforward feature: single markdown file creation with no complex logic
  - Uses well-established pattern from 140+ preceding identical features
  - Existing reusable utilities in `content_generators.py` handle all core logic
  - Feature implementation is primarily orchestration/composition of existing functions
  - No new utilities, helpers, error handling, or edge case handling required
  - No architectural changes or system boundary interactions
  - Validation and git operations already implemented and proven
  - Primary work: 1) Create feature_141_markdown_file_creation.py module (~50-80 LOC), 2) Follow pattern from feature 138 template
