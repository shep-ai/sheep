content: |
  ## Task Execution Flow

  Implementation follows a linear, sequential flow across two phases:

  **Phase 1: File Creation & Encoding Setup (5 min)**
  - Task 1: Create markdown file with proper structure, encoding, and line endings
    - Write validation test checking file properties (content, encoding, line endings, size)
    - Implement using pathlib.Path.write_text() with UTF-8 and explicit LF handling
    - Test validates all success criteria before proceeding to git operations

  **Phase 2: Git Integration (7 min)**
  - Task 2: Stage file (2 min) — git add
  - Task 3: Commit file (2 min) — git commit with conventional message
  - Task 4: Push to remote (3 min) — git push with upstream tracking

  ### Dependency Chain

  - Task 2 requires Task 1 (file must exist before staging)
  - Task 3 requires Task 2 (file must be staged before committing)
  - Task 4 requires Task 3 (commit must exist before pushing)

  Sequential flow ensures each step validates against the previous state.

  ## Testing Strategy

  Each task follows TDD cycle:

  1. **RED phase:** Write test that fails without implementation
     - File creation test checks file properties (will fail; file doesn't exist)
     - Staging test checks git status for staged file (will fail; file not staged)
     - Commit test checks git log for message (will fail; commit doesn't exist)
     - Push test checks remote branch (will fail; commit not on remote)

  2. **GREEN phase:** Implement minimal code to pass test
     - Create file using pathlib with correct parameters
     - Run git add command
     - Run git commit command
     - Run git push command

  3. **REFACTOR phase:** Clean up code
     - Extract strings to named variables for clarity
     - Remove any redundant operations
     - Improve readability and maintainability

  ## Effort Breakdown

  - Task 1 (File creation): 5 minutes
    - 2-3 min: Write test validation script
    - 1-2 min: Implement pathlib file creation
    - 0-1 min: Refactor prose content string

  - Task 2 (Git add): 2 minutes
    - 1 min: Write staging test
    - 1 min: Run git add command

  - Task 3 (Git commit): 2 minutes
    - 1 min: Write commit test
    - 1 min: Run git commit command

  - Task 4 (Git push): 3 minutes
    - 1 min: Write remote test
    - 1-2 min: Run git push command and verify

  **Total: ~12 minutes** (aligns with feature size estimate S: 10-15 min)

  ## Success Criteria Summary

  All success criteria from feature spec are validated:
  - ✓ File created at repository root with exact filename
  - ✓ File contains markdown heading and 2-3 sentences
  - ✓ UTF-8 without BOM, LF line endings
  - ✓ Valid CommonMark syntax
  - ✓ File size ~400-600 bytes
  - ✓ File staged, committed, and pushed
  - ✓ Conventional commit message used
  - ✓ No modifications to existing files
