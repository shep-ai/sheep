# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 262 follows the established pattern from 261+ preceding markdown file creation features.
  The implementation is a thin wrapper (~50-100 lines) that orchestrates existing, well-tested utilities
  from src/sheep/content_generators.py.

  ### Implementation Pattern
  The feature module will:
  1. Import utility functions from content_generators.py
  2. Import logging infrastructure from sheep/observability/logging.py
  3. Define constants (FEATURE_NUMBER=262, MARKDOWN_FILENAME=\"test-677pul.md\")
  4. Implement create_feature_262_markdown_file(repo_path=None) that orchestrates the workflow
  5. Follow the DRY principle - no duplication of utility logic

  ### Workflow Orchestration
  ```
  generate_markdown_content()        → Generate H1 + 2-3 sentences via LLM
  write_markdown_file(content, fn)   → Write to repository root with proper encoding
  validate_markdown_file(filepath)   → Verify markdown structure and content
  commit_markdown_file(fn, content)  → Stage, commit with conventional message
  push_markdown_file(repo_path)      → Push to remote branch
  return result dict                 → Return filepath, content, commit_message, push_result
  ```

  Each step uses existing tested utilities; the feature wrapper provides orchestration
  and error handling.

  ## Key Design Decisions

  ### 1. LLM-Based Content Generation
  **Chosen:** Use content_generators.generate_markdown_content() with get_reasoning_llm()

  **Rationale:**
  - Maintains consistency with all 261+ preceding features
  - Uses reasoning LLM (temperature=0.2) configured in sheep/config/llm.py
  - Generates unique, coherent prose for each file
  - Utility is proven through 261+ successful feature runs
  - No need to reinvent content generation logic

  ### 2. File I/O with Proper Encoding
  **Chosen:** Use content_generators.write_markdown_file() for all file operations

  **Rationale:**
  - Handles UTF-8 encoding without BOM
  - Enforces Unix LF line endings (not CRLF)
  - Adds trailing newline (POSIX compliance)
  - Validates filename to prevent path traversal
  - Proven across 261+ features

  ### 3. Comprehensive File Validation
  **Chosen:** Use content_generators.validate_markdown_file() before git operations

  **Rationale:**
  - Validates H1 heading present
  - Counts sentences (must be 2-3)
  - Verifies UTF-8 encoding and LF line endings
  - Checks for trailing newline
  - Prevents invalid content from being committed

  ### 4. Git Operations via Existing Tools
  **Chosen:** Use GitCommitTool and GitPushTool wrappers in content_generators.py

  **Rationale:**
  - Avoids duplicating git subprocess handling
  - Uses subprocess.run() with list arguments (prevents injection)
  - Provides structured logging via tool framework
  - Commit message format: \"feat(262): Create markdown file test-677pul.md with prose content\"
  - Proven error handling across 261+ features

  ### 5. Thin Wrapper Architecture
  **Chosen:** Feature module orchestrates utilities without duplicating logic

  **Rationale:**
  - Follows DRY principle (Don't Repeat Yourself)
  - Matches established pattern from feature_101 and all preceding features
  - ~50-100 lines of orchestration code only
  - Each step is explicit and testable
  - Easy to debug (each utility call is distinct)
  - Consistent error handling across all 262 features

  ### 6. Strict Error Handling
  **Chosen:** Raise exceptions on any failure; let caller decide response

  **Rationale:**
  - Makes failures explicit and visible (not hidden)
  - Matches pattern from feature_101
  - Simplifies code (no fallback logic or retries)
  - Provides clear error messages with context
  - Caller can implement retry logic if needed

  ### 7. Structured Logging
  **Chosen:** Use get_logger(__name__) from sheep/observability/logging.py

  **Rationale:**
  - Log at INFO level for workflow milestones
  - Log at DEBUG level for detailed operation info
  - Provides visibility into multi-step process
  - Consistent with all 261+ preceding features
  - Structured logs are machine-parseable for monitoring

  ## Implementation Strategy

  ### Phase 1: Feature Implementation
  This single phase creates the feature module that orchestrates all utilities.
  The work is straightforward because:

  1. **No new utilities needed** — All required functions exist and are tested
  2. **Simple workflow** — Linear sequence: generate → write → validate → commit → push
  3. **Proven pattern** — 261+ preceding features follow identical structure
  4. **Minimal code** — ~50-100 lines of orchestration + logging
  5. **No architecture decisions** — All decisions made by research phase

  The implementation focuses on:
  - Correct import statements
  - Proper orchestration order
  - Clear error handling and logging
  - Following code style conventions
  - Meeting all acceptance criteria from spec

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | LLM generation fails | Very Low (0.5%) | Medium | Utility has 99% success rate from 261+ features; logging shows root cause |
  | File system full | Very Low (0.1%) | High | OSError exception raised; disk space error is explicit |
  | Git push fails (network) | Low (1%) | Medium | Exception raised; caller can implement retry logic |
  | Invalid markdown generated | Very Low (0.5%) | Medium | validate_markdown_file() catches before commit |
  | Path traversal in filename | Very Low (0.01%) | High | write_markdown_file() validates filename; prevents \"..\", \"/\" in name |
  | Encoding issues | Very Low (0%) | High | write_markdown_file() always uses UTF-8 no-BOM; validate_markdown_file() verifies |
  | Import errors | Very Low (0.1%) | High | Test execution will catch immediately; clear stack trace |
