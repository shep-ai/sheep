content: |
  ## Problem Statement

  The user wants a single markdown file named test-677pul.md created in the repository root. The file
  should contain an H1 markdown heading (title) and 2-3 sentences of prose content. This is part of a
  series of 262 similar markdown file creation features that test the platform's ability to automate
  content creation and git workflows.

  ## Codebase Analysis

  ### Project Structure

  The codebase is organized as follows:

  - **src/sheep/** - Main Python package containing the platform logic
    - **agents/** - CrewAI agent definitions (code_agents.py, general_agents.py)
    - **config/** - Configuration management (settings.py, llm.py)
    - **flows/** - Flow definitions for orchestrating agent tasks
    - **tools/** - Tool implementations for git, file, and web operations
    - **features/** - Feature implementations (256+ markdown file creation variants)
    - **content_generators.py** - Reusable utilities for markdown generation, validation, writing, committing, and pushing
    - **observability/** - Logging and Langfuse tracing integration
    - **cli.py** - Command-line interface entry point

  - **specs/** - Feature specifications with YAML specs and research/planning documents for each feature

  - **Root directory** - Contains many generated markdown files (test-*.md) from previous features

  ### Architecture Patterns

  1. **Modular Content Generation**: The project uses centralized utility functions in `content_generators.py`
     for markdown creation tasks. These utilities handle:
     - LLM-based content generation
     - File writing with proper encoding (UTF-8) and line endings (Unix LF)
     - Markdown validation (H1 heading, sentence count, formatting)
     - Git operations (commit with conventional messages, push)

  2. **Established Workflow**: All 256+ markdown file creation features follow this identical workflow:
     1. Generate markdown content with H1 heading + 2-3 sentences
     2. Write file to repository root
     3. Validate markdown structure and content
     4. Stage and commit with conventional commit message
     5. Push to remote branch

  3. **LLM Integration**: Uses CrewAI's LLM framework (`get_reasoning_llm()`) to generate coherent prose
     via Claude API. The generation is templated with specific requirements for format and structure.

  4. **Separation of Concerns**: Feature implementations (in src/sheep/features/) are thin wrappers that
     orchestrate predefined utilities. Git operations are abstracted via GitPushTool and GitCommitTool.

  ### Relevant Technologies

  - **CrewAI**: Multi-agent framework for orchestrating LLM-based workflows
  - **Python**: Language for implementation and tooling
  - **GitPython**: Library for git operations (via wrapper tools)
  - **Pydantic**: Configuration and data validation
  - **Markdown**: Content format for generated files
  - **Langfuse**: Observability and tracing for execution monitoring

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Add feature_262_markdown_file_creation.py following established pattern from feature_256 and others |
  | Repository root | Low | Create single markdown file (test-677pul.md) with ~250-400 bytes of content |
  | Git operations | Low | Stage, commit, and push file as part of standard workflow (no branch creation needed, branch already exists) |

  ## Dependencies

  - **src/sheep/content_generators.py**: Provides reusable utilities:
    - `generate_markdown_content()` - LLM-based content generation
    - `write_markdown_file()` - File writing with proper encoding
    - `validate_markdown_file()` - Format validation
    - `commit_markdown_file()` - Git commit operations
    - `push_markdown_file()` - Git push operations

  - **src/sheep/config/llm.py**: Provides `get_reasoning_llm()` for Claude API access

  - **src/sheep/observability/logging.py**: Provides logger for structured logging

  - **GitPython**: Underlying library for git operations (wrapped by content_generators)

  - **CrewAI**: LLM framework for content generation (wrapped by get_reasoning_llm)

  ## Success Criteria

  - [ ] File named test-677pul.md created in repository root
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains 2-3 sentences of coherent prose content
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings
  - [ ] File ends with trailing newline (POSIX convention)
  - [ ] File is staged, committed, and pushed to remote branch
  - [ ] Commit message follows conventional format: "feat(262): create markdown file test-677pul.md with prose content"
  - [ ] No existing files are modified
  - [ ] Implementation follows established pattern from feature_256 and preceding features

  ## Size Estimate

  **S** — This is a trivial, single-file creation task with no code changes, no tests, and no integration
  required. The entire workflow (content generation, file writing, validation, git operations) can be
  completed in under 1 hour by following the established pattern from 256 preceding identical features.
  The infrastructure and helper utilities are fully in place; implementation is straightforward orchestration
  of existing components.
