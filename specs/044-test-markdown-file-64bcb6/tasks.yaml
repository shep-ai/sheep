  ## Summary

  This feature requires 2 tasks across 2 phases, completing a simple markdown file
  creation with Git integration:

  1. **Phase 1 - Create and Verify:** Create test-r7uy00.md with an H1 heading and
     2-3 sentences of substantive content. Verify all acceptance criteria (encoding,
     line endings, syntax, no side effects).

  2. **Phase 2 - Commit and Push:** Stage the file, commit with a descriptive message,
     and push to the feature branch.

  Total estimated effort is 15 minutes, reflecting the feature's minimal scope (simple
  file creation with standard Git workflow). All requirements are explicit and unambiguous.

  ## Task Details

  ### Task 1: Create markdown file with H1 heading and verified content

  **Phase:** Phase 1 (Create and Verify Markdown File)

  **Dependencies:** None

  **Estimated Effort:** 10 minutes

  **Description:**
  Create the file test-r7uy00.md at the repository root with a single H1 heading (#)
  and exactly 2-3 sentences of substantive content. Verify the file meets all acceptance
  criteria: correct structure, valid Markdown syntax, UTF-8 encoding without BOM, LF
  line endings, and no unintended modifications to other files.

  **Test-Driven Development (TDD) Cycle:**

  **RED (Verify current state):**
  - Run `ls test-r7uy00.md` — should fail (file doesn't exist yet)
  - Document verification checklist covering all acceptance criteria

  **GREEN (Implement minimal solution):**
  - Create file test-r7uy00.md with:
    - One H1 heading line (e.g., `# My Topic Title`)
    - Exactly 2-3 sentences of substantive content (technical, conceptual, or domain-related)
    - No trailing whitespace or extraneous characters

  **REFACTOR (Verify and clean up):**
  - Run `file test-r7uy00.md` to verify UTF-8 encoding (no BOM indicated)
  - Run `git diff --cached` to verify line endings are LF, no CRLF conversion
  - Run `git status` to confirm only test-r7uy00.md is untracked (no side effects)
  - Count sentences and verify exactly 2-3 are present
  - Visually inspect H1 heading syntax: `# ` followed by title text

  **Acceptance Criteria:**
  - File test-r7uy00.md exists at repository root ✓
  - File contains exactly one H1 heading serving as the title ✓
  - File contains exactly 2-3 sentences of prose content ✓
  - Content is substantive and meaningful ✓
  - Valid Markdown syntax with no errors ✓
  - UTF-8 encoding without BOM ✓
  - LF line endings (not CRLF) ✓
  - No other files created, modified, or deleted ✓
  - File encoding verified with `file` command ✓
  - Git status shows only this file as untracked ✓

  ---

  ### Task 2: Commit and push file to feature branch

  **Phase:** Phase 2 (Commit and Push to Feature Branch)

  **Dependencies:** task-1 (must complete file creation and verification first)

  **Estimated Effort:** 5 minutes

  **Description:**
  Stage the file, create a descriptive commit message following repository conventions
  (conventional commits format), commit to the feature branch (feat/044-test-markdown-file-64bcb6),
  and push to the remote repository.

  **Implementation (no TDD cycle for non-code tasks):**
  - Stage file: `git add test-r7uy00.md`
  - Create commit: `git commit -m "feat: Create test-r7uy00.md markdown file about [topic]"`
  - Push to remote: `git push -u origin HEAD`

  **Acceptance Criteria:**
  - File is added to Git staging with `git add test-r7uy00.md` ✓
  - Commit message is descriptive and follows conventional commits format ✓
  - Commit message mentions the file name and describes it as a markdown file ✓
  - Commit is on branch feat/044-test-markdown-file-64bcb6 ✓
  - Changes are pushed to remote with `git push -u origin HEAD` ✓
  - Git log shows new commit with correct message ✓
  - Remote branch is updated ✓

