content: |
  ## Problem Statement

  Create a new markdown file called `test-r7uy00.md` in the repository root with a title and 2-3 sentences of content about any topic. This continues the established pattern of the Sheep project, which maintains a collection of markdown content files serving various purposes (documentation, guides, state machines, examples, test files, etc.).

  **Requirements Status**: All requirements are finalized and unambiguous. No product decisions are required; the feature scope and acceptance criteria are complete.

  ## Functional Requirements

  - **FR-1**: File must be created at the repository root with the exact name `test-r7uy00.md`
  - **FR-2**: File must contain exactly one Markdown heading (H1 or H2) serving as the title
  - **FR-3**: File must contain 2-3 sentences of content following the title
  - **FR-4**: File content may be about any topic (no topic restrictions)
  - **FR-5**: File must use valid Markdown syntax with no syntax errors

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (without BOM)
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF
  - **NFR-3**: No other files may be created, modified, or deleted during this feature
  - **NFR-4**: Changes must be committed to the feature branch with a descriptive commit message
  - **NFR-5**: File must follow repository conventions for markdown files (consistent formatting with existing .md files)
  - **NFR-6**: No code changes, configuration changes, or test files are required

  ## Success Criteria

  - [ ] File `test-r7uy00.md` exists in repository root (verified via `git ls-files`)
  - [ ] File is not empty and contains valid Markdown syntax
  - [ ] File contains exactly one top-level heading (H1 `#` or H2 `##`)
  - [ ] File contains 2-3 sentences of content after the heading
  - [ ] File is encoded as UTF-8
  - [ ] Line endings are LF (checked via `git diff --cached`)
  - [ ] Git status shows only the new file (no unintended modifications)
  - [ ] Changes are committed to feature branch `feat/044-test-markdown-file-64bcb6`
  - [ ] No other files in the repository have been modified

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI. The relevant structure for this feature includes:

  - **Root directory**: Contains markdown content files created by various features (existing .md files include JOKE.md, CLASSIC_JOKE.md, DAD_JOKE.md, DESIGN_PATTERN.md, ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md, test-u6624u.md, test-gsul5o.md, test-gkrlxj.md, enamel-art-pz8a65.md, cloud-computing-xwbxsh.md, acoustic-engineering-590ixe.md, and others)
  - **`/specs`**: Contains feature specifications organized by number and name (e.g., `specs/044-test-markdown-file-64bcb6/`, `specs/035-test-content-file/`)
  - **`/src/sheep`**: Python source code for the agentic platform (agents, flows, config, tools, observability)
  - **`/.github`**: GitHub Actions workflows for CI/CD
  - **`/tests`**: Test suite directory
  - **Core files**: `pyproject.toml`, `README.md`, `Dockerfile`, `docker-compose.yml`

  ### Architecture Patterns

  The repository follows a clear architectural pattern:

  1. **Feature-Driven Development**: Each feature has a dedicated spec directory under `/specs` with structured YAML specifications
  2. **Lightweight Content Addition**: Markdown files are lightweight, non-code artifacts added to the root directory
  3. **Naming Conventions**: Test markdown files follow patterns like `test-{randomid}.md`, content files like `JOKE.md`, `DESIGN_PATTERN.md`, specialized files like `ELEVATOR_STATE_MACHINE.md`
  4. **No Dependencies**: Markdown content files are independent and require no code integration or testing framework
  5. **Git-Based Workflow**: All changes are tracked through feature branches (e.g., `feat/044-test-markdown-file-64bcb6`)
  6. **Modular Python Architecture**: The `/src/sheep` module is organized into agents, flows, config, tools, and observability layers, but this feature doesn't touch any of that code

  ### Relevant Technologies

  - **Markdown**: Core content format for all text files in the repository
  - **Git**: Version control system used for feature branching and change tracking
  - **YAML**: Format for specification files stored in `/specs/{number}-{name}/spec.yaml`
  - **Python**: The Sheep project is Python-based (requires 3.11+) but not relevant to this markdown-only feature

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added to root directory; no modifications to existing files |
  | Specs Directory | Low | Feature specification file already exists; analysis phase only updates content section |
  | Source Code (`/src`) | None | No Python code, configuration, or build artifacts affected |
  | Tests (`/tests`) | None | No test files created or modified |
  | CI/CD (`.github`) | None | No workflows or automation changes required; standard PR/commit flow applies |
  | Git History | Low | Single commit with one new file; no rewriting or destructive operations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/044-test-markdown-file-64bcb6` must exist (already exists)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies
  - **No code dependencies**: Feature is purely file-creation, not code-dependent
  - **No build/test dependencies**: No changes to `pyproject.toml` or test setup

  ## Size Estimate

  **S** (Hours) — This is a minimal-effort, single-file creation feature requiring:

  - **File creation**: ~5 minutes (write one heading + 2-3 sentences)
  - **Testing/verification**: ~5 minutes (validate syntax, check encoding, verify in git)
  - **Commit and push**: ~2 minutes (standard git workflow)
  - **Total estimate**: 10-15 minutes of actual work

  No research, no code analysis, no architectural decisions, and no testing framework integration needed. This is a straightforward content creation task matching the pattern of features 043, 042, 041, and many others in the repository.

  ## Product Decisions & Questions

  **No open product questions.** All requirements are fully specified:
  - File name, location, and format are fixed
  - Content structure (1 heading + 2-3 sentences) is fixed
  - Content topic is unconstrained (any topic allowed)
  - Technical constraints (UTF-8, LF line endings) are standard repository conventions

  Implementation can proceed directly with the finalized requirements.
