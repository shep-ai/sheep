# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-lj7ccz.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 96+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 101-115, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-lj7ccz.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] File size is approximately 300-500 bytes (typical range; variance allowed for prose quality)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-lj7ccz.md`)
  - [ ] Git commit exists on the current branch with message: `feat(116): create markdown file test-lj7ccz.md with prose content`
  - [ ] Commit is on the feature branch `feat/116-markdown-file-creation-d557e6`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-lj7ccz.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-lj7ccz.md`
  - **FR-7**: File must be committed with the exact message: `feat(116): create markdown file test-lj7ccz.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/116-markdown-file-creation-d557e6`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 300-500 bytes (guideline, not strict limit; variance allowed for prose quality)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 96+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (completely unrestricted per user query "about anything")
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Decisions & Resolved Questions

  This feature follows a fully established, proven pattern with zero product ambiguity. All major decisions
  have been resolved through 115 prior identical implementations:

  | Decision | Resolution | Rationale |
  | -------- | ---------- | --------- |
  | **File naming** | Use exact name: `test-lj7ccz.md` | User query specifies this exact filename; consistent with 96+ existing test files |
  | **File location** | Repository root directory (no subdirectories) | Established pattern; all test-*.md files stored at root for simplicity and discoverability |
  | **Content format** | 1 H1 heading + blank line + 2-3 sentences | Pattern proven in 115 prior features; clear, minimal, testable structure |
  | **Implementation method** | Python `pathlib.Path.write_text()` | Standard library, no dependencies; used consistently across all 96+ precedents |
  | **Prose topic** | Implementer's choice (unrestricted) | User query: "about anything"; maximum flexibility without affecting feature scope |
  | **Git workflow** | Standard conventional commit + push | Established pattern; no special merge/rebase logic needed; straightforward linear workflow |
  | **Validation criteria** | File size 300-500 bytes, UTF-8 + LF, valid Markdown | Range validated against 96+ existing files; allows prose quality variation within bounds |

  **Why no open questions?** The combination of 96+ identical precedents, a well-documented pattern,
  and a user query with zero ambiguity means there are no product trade-offs to resolve.
  Every decision is either dictated by the user query, established by precedent, or inherently flexible
  (prose topic). This is intentional feature design for the Sheep platform—test features are meant
  to be minimal and repeatable.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 96+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/116-markdown-file-creation-d557e6/)
  - **tests/**: Test suite for the application
  - **.github/**: GitHub Actions workflows and CI/CD configuration
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile**: Container configuration for deployment

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (96+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 300-500 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/116-markdown-file-creation-d557e6`
  - Create/modify files in working directory
  - Stage with `git add test-lj7ccz.md`
  - Commit with conventional commit format: `feat(116): create markdown file test-lj7ccz.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 101-115):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-lj7ccz.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content

