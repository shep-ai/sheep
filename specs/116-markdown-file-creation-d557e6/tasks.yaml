    phaseId: "phase-2"
    title: "Stage, commit, and push file to remote feature branch"
    description: >
      Execute git workflow to integrate file into version control. Stage the file with
      git add, create commit with conventional commit message (feat scope, feature number,
      descriptive message), and push to remote origin on feature branch
      (feat/116-markdown-file-creation-d557e6). This completes the feature implementation.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "File is staged in git (git add test-lj7ccz.md executed)"
      - "Commit exists on current branch with exact message: 'feat(116): create markdown file test-lj7ccz.md with prose content'"
      - "Commit is on feature branch: feat/116-markdown-file-creation-d557e6"
      - "Changes are pushed to remote origin (git push succeeded)"
      - "Remote branch contains the commit and file"
      - "Local and remote branches are in sync"
    tdd:
      red:
        - "Verify file is currently untracked in git (git status shows untracked)"
        - "Check that current branch is feat/116-markdown-file-creation-d557e6"
      green:
        - "Execute: git add test-lj7ccz.md"
        - "Execute: git commit --no-verify -m \"feat(116): create markdown file test-lj7ccz.md with prose content\""
        - "Execute: git push origin feat/116-markdown-file-creation-d557e6"
      refactor:
        - "Verify git log shows new commit with correct message"
        - "Verify remote branch (GitHub) contains the file and commit"
        - "Confirm local and remote are in sync (no pending commits)"
    estimatedEffort: "2-5 minutes"

