  - id: "task-2"
    phaseId: "phase-1"
    title: "Validate file encoding and line endings match specification"
    description: >
      Verify file meets all technical encoding and line ending requirements from spec.
      Check for UTF-8 without BOM, Unix LF only (no CRLF), valid markdown syntax,
      and file size within expected range. This validation ensures compliance before
      pushing to git and prevents encoding violations in version control.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File is encoded as UTF-8 (verified by reading file bytes)"
      - "File has no BOM (Byte Order Mark) at start"
      - "All line endings are Unix LF (0x0A) only, no CRLF (0x0D0A)"
      - "File size is approximately 300-500 bytes (spec allows variance for prose quality)"
      - "Markdown heading syntax is valid (exactly one # at line start)"
      - "Blank line exists between heading and prose (required separator)"
      - "Prose contains exactly 2-3 sentences (no single sentence, no 4+ sentences)"
      - "All text is readable and grammatically correct"
    tdd:
      red:
        - "Write check: file encoding must be UTF-8 (no BOM), verify with binary file read"
        - "Write check: file line endings must be LF only, verify by searching for CRLF bytes"
        - "Write check: file size must be 300-500 bytes (flexible range, not strict)"
        - "Write check: markdown structure must be valid (H1 + blank line + prose)"
      green:
        - "Read file in binary mode to inspect first bytes (UTF-8 signature would be EF BB BF)"
        - "Read file and count line ending bytes (0x0A for LF, 0x0D0A for CRLF)"
        - "Check file size using os.path.getsize() or Path.stat()"
        - "Validate markdown structure: heading starts with #, blank line exists, prose has 2-3 sentences"
      refactor:
        - "Document all validation results (encoding, line endings, size, markdown validity)"
        - "Create summary of file properties for reference in next phase"

    estimatedEffort: "3 minutes"

