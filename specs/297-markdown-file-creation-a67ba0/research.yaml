decisions:
  - title: "Content Generation Approach"
    chosen: "Claude API with Reasoning LLM via CrewAI Framework"
    rejected:
      - "Manual human-written content — reduces implementer burden but loses automation benefits demonstrated across 296+ prior implementations; human authorship would make feature non-repeatable"
      - "Template-based content with variable substitution — limits content creativity and context-awareness; Claude API proves more reliable and produces higher-quality prose"
    rationale: >
      The existing orchestration in sheep.content_generators.generate_markdown_content() already
      implements Claude API integration with proper error handling, retry logic, and validation.
      This approach has been validated across 296+ prior implementations with consistent success.
      Reasoning LLM produces more contextually-aware, coherent prose than template systems.
      Reusing proven infrastructure reduces implementation effort and risk. The API already
      handles prompt engineering, response parsing, and content validation with exponential
      backoff retry logic for transient failures.

  - title: "File Path Handling and I/O"
    chosen: "pathlib.Path (Python standard library)"
    rejected:
      - "os.path module — older API with more verbose code; pathlib is the modern Python standard and more intuitive for file operations"
      - "Direct string paths — loses type safety and cross-platform compatibility guarantees; pathlib abstracts OS-specific path separators and conventions"
    rationale: >
      pathlib is the modern Python 3.11+ standard for path manipulation and file I/O.
      It provides object-oriented API with operator overloading (/) for path joining,
      automatic cross-platform path separator handling, and methods like .exists(), .is_file(), .stat().
      The existing sheep.content_generators.write_markdown_file() already uses pathlib
      for this reason. Consistent with codebase patterns seen in feature_294 and similar implementations.

  - title: "Markdown Validation Approach"
    chosen: "Comprehensive multi-level validation (content + file properties)"
    rejected:
      - "Minimal validation (file exists only) — fails to catch encoding issues, line ending problems, or content format violations; error discovery would happen late in testing or production"
      - "Post-generation only, no re-validation after write — unable to catch file I/O errors, permission issues, or accidental corruption; gaps in assurance"
    rationale: >
      The existing sheep.content_generators.validate_markdown_file() implements comprehensive
      validation that checks: UTF-8 encoding (no BOM), Unix LF line endings (not CRLF),
      H1 heading presence and position, blank line separator, prose content structure,
      sentence count (2-3), and trailing newline. This validates both content structure
      and file properties at the binary level, catching issues that simpler checks would miss.
      Pattern proven across 296+ prior features with zero reported encoding or format issues.

  - title: "Git Operations Implementation"
    chosen: "Subprocess-based git CLI calls with wrapper functions"
    rejected:
      - "GitPython library — adds external dependency not already required for this project; subprocess provides sufficient capability with minimal overhead"
      - "Custom git tool classes — while sheep.tools contains GitCommitTool and GitPushTool, subprocess functions in content_generators are more direct and easier to trace"
    rationale: >
      The sheep.content_generators module provides git_add(), git_commit(), and git_push()
      functions that wrap subprocess.run() for direct git CLI invocation. This approach:
      (1) uses only Python standard library (subprocess), (2) provides clear visibility into
      git commands being executed, (3) integrates seamlessly with existing orchestration,
      (4) supports conventional commit messages and upstream tracking (-u flag),
      (5) has proven reliable across 296+ prior implementations. Direct subprocess calls
      are faster and more transparent than library abstractions for this straightforward use case.

  - title: "Error Handling and Retry Strategy"
    chosen: "Exponential backoff retry for API failures, fail-fast for validation/file errors"
    rejected:
      - "No retry logic — transient API failures would block feature completion; empirical data from prior implementations shows occasional API timeouts"
      - "Infinite retries — can cause indefinite hangs during true API outages or misconfiguration; bounded retry (3 attempts with exponential backoff) is more robust"
    rationale: >
      Claude API calls can experience transient failures (network timeouts, rate limiting, temporary service issues).
      The existing generate_markdown_content() implements 3-attempt retry with exponential backoff
      (1s, 2s, 4s delay) — proven pattern from sheep.create_markdown.py lines 63-100.
      File I/O and validation errors fail fast with descriptive exceptions (already raised in
      write_markdown_file and validate_markdown_file) — these indicate code/config problems,
      not transient issues. This mixed approach balances reliability against failure modes.

  - title: "Scope of Implementation: Full Orchestration vs Manual Steps"
    chosen: "Full orchestration via sheep.content_generators.create_markdown_file() function"
    rejected:
      - "Manual step-by-step implementation — requires implementer to explicitly call generate, write, validate, commit, push; error-prone and violates DRY principle"
      - "Custom implementation per feature — 296+ prior features standardized on the orchestration module to eliminate duplication and ensure consistent behavior"
    rationale: >
      The feature spec resolves "Should the implementation method be flexible?" with answer:
      "Flexible implementation method — allow any approach as long as outputs meet requirements."
      However, this is a technical implementation decision, not a specification constraint.
      The orchestration function sheep.content_generators.create_markdown_file() provides:
      (1) proven end-to-end workflow, (2) consistency across all 296+ prior features,
      (3) built-in validation and error handling, (4) reduced implementer effort,
      (5) lower risk of specification violations. Using the orchestration function is
      the technically superior choice while remaining compatible with the spec's flexibility requirement.

