content: |
  ## Summary

  Implementation consists of 5 concrete tasks across 3 phases:

  **Phase 1 (Foundation — 5 min):** Create the feature module file with imports, constants,
  and function signature. This establishes the module structure without implementation details.

  **Phase 2 (Implementation — 10 min):** Implement the feature function to call the orchestration
  function with correct parameters, add error handling and logging, and implement the main entry
  point. The orchestration function handles all complexity (content generation, file creation,
  validation, git operations).

  **Phase 3 (Verification — 10 min):** Run the feature to verify the markdown file is created
  with correct structure and content, then verify git operations (staging, commit, push) completed
  successfully. Finally, commit the feature module itself with a conventional message.

  Each task follows TDD: write test/acceptance criteria first (RED), implement minimal code to
  pass (GREEN), then clean up and refactor (REFACTOR). Tasks are sequentially dependent, executed
  in order. Total effort: 25 minutes, well within the feature size estimate (S = 10-15 minutes
  for human implementation; automation provides buffer).

  The implementation is straightforward because the orchestration function (sheep.content_generators.create_markdown_file)
  already implements all required functionality: content generation via Claude API, file creation
  with UTF-8/LF encoding, comprehensive validation, and complete git workflow. The feature module
  acts as a thin wrapper providing feature-level identification and orchestration.

  ---

  _Task breakdown complete — concrete, ordered tasks defined with TDD cycles and acceptance criteria_
