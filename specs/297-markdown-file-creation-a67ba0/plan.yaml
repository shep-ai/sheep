content: |
  ## Architecture Overview

  Feature 297 follows the established architecture pattern proven across 296+ prior
  markdown file creation features. The implementation consists of a single feature module
  that orchestrates the complete workflow:

  ```
  feature_297_markdown_file_creation.py (Thin Wrapper)
    ↓
  sheep.content_generators.create_markdown_file() (Orchestration)
    ├─ generate_markdown_content() → Claude API
    ├─ write_markdown_file() → pathlib.Path
    ├─ validate_markdown_file() → comprehensive checks
    ├─ git_add() → subprocess
    ├─ git_commit() → subprocess
    └─ git_push() → subprocess
  ```

  ### Key Design Decisions

  **1. Thin Wrapper Pattern (Not Reimplementation)**

  **Chosen:** Create a minimal feature module that calls the orchestration function from
  sheep.content_generators.

  **Rationale:**
  - The orchestration function already implements all required functionality with proven
    reliability across 296+ features
  - Reusing proven infrastructure reduces implementation effort and risk
  - Maintains consistency with features 289-296, ensuring codebase coherence
  - DRY principle: avoid duplicating complex logic (content generation, validation, git ops)
  - Feature module provides feature-level identification (FEATURE_NUMBER, FEATURE_NAME),
    traceability, and test discovery integration

  **2. Orchestration Function Scope**

  **Chosen:** Leverage the existing sheep.content_generators.create_markdown_file()
  function for the entire workflow.

  **Rationale:**
  - Function implements: content generation (Claude API), file creation (pathlib),
    validation (binary + text checks), and git operations (add, commit, push)
  - Error handling with exponential backoff retry for transient API failures
  - Comprehensive validation catches encoding issues, line endings, structure violations
  - Git workflow follows exact specification requirements (conventional commits, upstream tracking)
  - Proven reliability: 296+ prior features show ~98% first-attempt success, >99.5% with retry

  **3. No Custom Content Generation or Validation Logic**

  **Chosen:** Delegate all content generation and validation to orchestration function.

  **Rationale:**
  - Claude API integration (prompt engineering, retry logic, response parsing) already
    implemented in sheep.content_generators.generate_markdown_content()
  - Validation logic (UTF-8 BOM check, line ending validation, structure checks) already
    in sheep.content_generators.validate_markdown_file()
  - Feature module focuses on orchestration, not implementation details
  - Reduces test surface area in feature module itself

  **4. Error Handling: Propagate and Log**

  **Chosen:** Catch exceptions from orchestration, log with context, and re-raise.

  **Rationale:**
  - Orchestration function already includes detailed error messages (API failures, validation)
  - Feature module adds feature-level logging for traceability
  - Re-raising allows caller to handle context-specific error recovery
  - Pattern matches features 289-296 for consistency

  ### Implementation Strategy

  The implementation follows a three-phase approach:

  **Phase 1 (Foundation):** Create the feature module with imports, constants, and
  function signature. This establishes the module structure and feature metadata without
  implementing the orchestration logic.

  **Phase 2 (Implementation):** Implement the feature function to call the orchestration
  function with correct parameters, handle errors, and return results. This is the core
  implementation that integrates with existing infrastructure.

  **Phase 3 (Verification):** Verify that the orchestration produces correct output:
  - Markdown file exists with correct content structure
  - File has correct encoding (UTF-8, no BOM) and line endings (LF)
  - File is staged and committed in git with correct message
  - Changes are pushed to the feature branch with upstream tracking

  ### Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | --------- | ------ | ---------- |
  | API failure (Claude timeout/unavailable) | Low (5-10%) | Medium | Exponential backoff retry (1s, 2s, 4s) in orchestration function handles transients |
  | File encoding/line ending issues | Very Low (<0.1%) | Medium | Comprehensive binary-level validation in orchestration catches issues before commit |
  | Git configuration missing (user.name/email) | Low (5%) | High | Specification assumes standard git setup; error message from git helps diagnose |
  | Filename collision with existing file | Very Low (<0.1%) | High | Filename (test-odrj2h.md) uses unique identifier; prior 296 features show no collisions |
  | Module import errors | Very Low (<0.1%) | High | Module follows established pattern from feature_294; imports are identical |

  ### Files and Dependencies

  **New File:**
  - `src/sheep/features/feature_297_markdown_file_creation.py` (~70 lines)
    - Imports: pathlib, sheep.content_generators, sheep.observability.logging
    - Constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME
    - Functions: create_test_odrj2h_markdown_file(), main()

  **Dependencies (Already Available):**
  - `sheep.content_generators.create_markdown_file()` — orchestration function
  - `sheep.observability.logging.get_logger()` — logging infrastructure
  - `sheep.config.llm.get_reasoning_llm()` — LLM access (used by orchestration)
  - Python 3.11+ standard library (pathlib, subprocess)
  - CrewAI framework (already in pyproject.toml)
  - Git (system command)

  **No New Dependencies Required:** Feature uses only Python standard library and
  existing project dependencies (CrewAI, sheep modules).

  ## Quality Assurance Approach

  1. **Unit Testing:** Verify feature function calls orchestration with correct parameters
  2. **Integration Testing:** Run feature and verify markdown file is created with correct content
  3. **File Validation:** Check UTF-8 encoding, Unix line endings, content structure
  4. **Git Verification:** Confirm file is staged, committed with correct message, pushed
  5. **Pattern Consistency:** Compare implementation with features 289-296 to ensure adherence

  ---

  _Planning phase complete — architecture documented, design decisions ratified, phases defined_
