content: |
  ## Architecture Overview

  Feature 147 follows the exact orchestration pattern established by feature_146, which itself is part of a
  successful 146-feature series of markdown file creation tasks. The implementation is a thin orchestration
  layer that coordinates existing, well-tested utility functions from `content_generators.py`.

  ### Orchestration Pattern

  The feature module (`feature_147_markdown_file_creation.py`) implements a single function:
  `create_feature_147_markdown_file(repo_path=None)` that executes five sequential steps:

  1. **Generate** (`generate_markdown_content()`) — Call LLM via get_reasoning_llm() factory to create H1 title + 2-3 sentences
  2. **Write** (`write_markdown_file()`) — Write content to disk at repo root with UTF-8 encoding, no BOM, LF line endings
  3. **Validate** (`validate_markdown_file()`) — Comprehensive validation: H1 structure, blank separator, sentence count, encoding, line endings, trailing newline, minimum size
  4. **Commit** (`commit_markdown_file()`) — Stage file and commit with message "feat(147): create markdown file test-c12y8b.md with prose content"
  5. **Push** (`push_markdown_file()`) — Push to feature branch with upstream tracking

  This pattern has been proven across 146 prior features and requires no architectural changes. All utilities are
  production-tested and the LLM + git infrastructure is reliable.

  ### Integration Points

  - `sheep.config.llm.get_reasoning_llm()` — Factory for LLM with temperature 0.2 (balance quality and variety)
  - `sheep.content_generators.*` — All orchestration step utilities (generate, write, validate, commit, push)
  - `sheep.tools.git_tools.GitCommitTool`, `GitPushTool` — Used internally by commit/push utilities
  - `sheep.observability.logging.get_logger()` — Structured logging for step context and error reporting

  ## Key Design Decisions

  ### Decision 1: Code Organization & Pattern Reuse

  **Chosen:** Create feature_147_markdown_file_creation.py following feature_146 template exactly,
  reusing all utilities from content_generators.py.

  **Alternatives Considered:**
  - Custom content generation logic (rejected: duplicates existing functions, maintenance burden)
  - Generic markdown factory function (rejected: overengineering for single use case)
  - Inline all logic in one function (rejected: reduces testability and reusability)

  **Rationale (from research):** Feature_146 established this pattern with proven success. Code reuse eliminates
  bugs and maintenance cost. The utilities are production-ready. Only five constants differ between features
  (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE). Feature_146 serves as an exact template.

  ### Decision 2: LLM Model Selection

  **Chosen:** Use get_reasoning_llm() factory with default reasoning model at temperature 0.2.

  **Alternatives Considered:**
  - get_fast_llm() (rejected: prioritizes cost over prose quality; fast model less suitable for creative content)
  - Hardcode specific model like 'anthropic/claude-3-5-sonnet' (rejected: locks to version, breaks when models upgrade)
  - Lower temperature 0.0 (rejected: produces repetitive, formulaic content)

  **Rationale (from research):** The factory abstracts model selection and API key management. Reasoning model
  with temperature 0.2 is configured for creative but coherent output. Factory pattern ensures automatic
  propagation of global model upgrades without code changes.

  ### Decision 3: Content Generation Strategy

  **Chosen:** LLM-generated creative content via Claude API (resolved in spec as recommendation 1).

  **Rationale (from research):** LLM generation provides meaningful variety while latency is acceptable (~5s).
  The API dependency already exists and is reliably configured. Template content would produce identical output
  across all 147 files, violating pattern expectations from prior features.

  ### Decision 4: Validation Approach

  **Chosen:** Comprehensive validation via validate_markdown_file() checking H1 structure, blank separator,
  2-3 sentence count, UTF-8 encoding without BOM, Unix LF line endings, trailing newline, and minimum 50 bytes
  (resolved in spec as recommendation 2).

  **Alternatives Considered:**
  - Minimal validation (just file exists) — rejected: would miss encoding/line-ending issues that fail in CI/CD
  - Optional validation with flag — rejected: adds complexity; comprehensive validation is cheap (~10ms)
  - Async validation in background — rejected: unnecessary; validate before commit is safer

  **Rationale (from research):** Comprehensive validation is the established pattern from 001-146 and catches
  encoding/line-ending differences that would silently break on different platforms. Validation is deterministic,
  fast, and already implemented in content_generators.py.

  ### Decision 5: Error Handling Strategy

  **Chosen:** Fail immediately with clear error messages; no retry logic (resolved in spec as recommendation 3).

  **Alternatives Considered:**
  - Retry with exponential backoff — rejected: adds 10-30s to failure path, increases debugging complexity
  - Swallow errors and return partial results — rejected: would mask failures
  - Log and continue on non-critical errors — rejected: could produce invalid markdown silently

  **Rationale (from research):** This is a straightforward, single-user orchestration feature in a controlled
  environment. Failures are easily re-run by an operator. Retry logic adds complexity and obscures root causes.
  Immediate, loud failures are easier to debug.

  ### Decision 6: Test Coverage Strategy

  **Chosen:** Comprehensive test coverage matching feature_146 standard: unit tests for orchestration,
  validation tests for markdown structure, integration tests for git operations (~100 lines of test code).
  (Resolved in spec as recommendation 4.)

  **Alternatives Considered:**
  - Minimal happy-path tests only (~30 lines) — rejected: insufficient confidence, misses error cases
  - Full end-to-end tests with real git/LLM — rejected: slow (5+ seconds), brittle to API changes
  - Manual testing only — rejected: doesn't scale for regression detection

  **Rationale (from research):** Feature_146 established comprehensive testing as the team standard. These tests
  catch regressions early and provide confidence the deliverable meets spec. Mocking external dependencies
  (LLM, git) makes tests fast and reliable while covering orchestration logic.

  ## Implementation Strategy

  ### Why This Phasing?

  **Phase 1 (Test Foundation)** comes first because TDD dictates writing tests before code. Establishing test
  infrastructure and mocking patterns upfront ensures implementation code has clear targets and high-quality
  test coverage from day one. This phase validates that testing approach works.

  **Phase 2 (Feature Orchestration)** builds the core feature module following the test contracts defined
  in Phase 1. The module is small (~100 lines) and implementation is mechanical—adapting feature_146 template
  with three constant differences.

  **Phase 3 (Comprehensive Testing)** completes the test suite and verifies all tests pass. This phase includes
  the detailed validation tests that ensure file properties match specification, plus end-to-end integration
  tests that verify the entire workflow (generate → write → validate → commit → push).

  ### Minimal Code Change

  Total code to write: ~200 lines across two files.

  - Feature module (src/sheep/features/feature_147_markdown_file_creation.py): ~100 lines
    - Imports: 10 lines
    - Constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE): 5 lines
    - Orchestration function with 5 steps + error handling: ~85 lines

  - Test module (tests/test_feature_147_markdown_file_creation.py): ~100 lines
    - Imports and test class setup: 15 lines
    - Unit tests (8 tests × ~5 lines each): 40 lines
    - File property tests (7 tests × ~3 lines each): 21 lines
    - Integration tests (3 tests × ~5 lines each): 15 lines
    - Fixtures and helpers: 9 lines

  ### Effort Timeline

  - Phase 1: ~15 minutes (setup test infrastructure, create test file, write first test)
  - Phase 2: ~30 minutes (implement feature module, get tests passing)
  - Phase 3: ~45 minutes (complete remaining tests, verify all pass, polish)
  - Total: ~1.5 hours (within S estimate of 1-2 hours)

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | LLM API unavailable or slow | Low | High (5s latency) | Feature gracefully fails with clear error; operator retries. Latency is acceptable and within NFR 30s limit. |
  | Git operations fail (push rejected, etc.) | Low | High (commit doesn't reach remote) | Clear error messages from git tools. Feature fails fast so operator can diagnose (e.g., branch protection, network). |
  | Encoding/line-ending issues on Windows | Low | Medium (CI/CD failures, platform-specific bugs) | Comprehensive validation catches these before commit. Validation explicitly checks UTF-8, no BOM, LF-only. |
  | Test infrastructure mocking incorrect | Low | High (false negatives, missed bugs) | Phase 1 validates mocking pattern against feature_146 test suite. Tests are adapted from proven template, reducing risk. |
  | Filename or content doesn't match spec | Low | Low (easily caught in validation) | Validation checks filename, H1 structure, sentence count. Spec defines exact filename (test-c12y8b.md) — no user input. |
  | Circular dependency or import error | Very Low | High (feature won't load) | Uses existing imports from feature_146; minimal new imports. Import test in Phase 1 catches this immediately. |

  ## Files & Structure

  ### New Files to Create

  **src/sheep/features/feature_147_markdown_file_creation.py** (~100 lines)
  - Module-level constants: FEATURE_NUMBER = 147, MARKDOWN_FILENAME = "test-c12y8b.md", COMMIT_MESSAGE
  - Function: create_feature_147_markdown_file(repo_path=None) → dict with result and file path
  - Error handling with structured logging
  - Docstring explaining the five orchestration steps

  **tests/test_feature_147_markdown_file_creation.py** (~100 lines)
  - Class TestFeature147MarkdownFileCreation: 8 unit tests for orchestration
  - Class TestFileCreation: 7 tests for file properties (H1, encoding, line endings, etc.)
  - Class TestEndToEndIntegration: 3 integration tests
  - Fixtures for mocked LLM, git tools, and file cleanup

  ### Existing Files — No Changes

  All utilities (generate, write, validate, commit, push) already exist in content_generators.py.
  All infrastructure (LLM factory, git tools, logging) already exists.
  No changes to existing modules required.

  ## Success Criteria

  - [ ] Feature module imports successfully and function has correct signature
  - [ ] Feature constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE) are defined correctly
  - [ ] LLM content generation produces H1 title + 2-3 sentences (mocked in tests)
  - [ ] File is written to repo root with exact filename test-c12y8b.md
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (no CRLF)
  - [ ] File ends with trailing newline
  - [ ] File is at least 50 bytes
  - [ ] Validation passes all structure and encoding checks
  - [ ] Commit message is "feat(147): create markdown file test-c12y8b.md with prose content"
  - [ ] Commit is pushed to feature branch feat/147-markdown-file-creation-23e4a7
  - [ ] All unit tests pass (8 tests)
  - [ ] All file property tests pass (7 tests)
  - [ ] All integration tests pass (3 tests)
  - [ ] No existing files are modified
  - [ ] Code follows established patterns from feature_146

  ---

  Implementation planning complete. Ready for task breakdown phase.
