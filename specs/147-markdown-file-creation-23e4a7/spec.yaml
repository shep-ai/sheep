content: |
  ## Problem Statement

  The user requires creation of a single markdown file with the exact filename `test-c12y8b.md`.
  The file must contain:
  - An H1 markdown heading (title about any topic)
  - A blank line (separator)
  - 2-3 sentences of coherent prose content

  This follows the established pattern from features 001-146, which all involve similar markdown
  file creation tasks. No code modifications to existing modules are required; this is purely
  a new markdown artifact to be created, validated, committed, and pushed to the feature branch.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  ```
  sheep/
  ├── src/sheep/
  │   ├── agents/                 # CrewAI agent definitions
  │   ├── config/                 # Settings and LLM factory
  │   ├── features/               # Feature implementations (feature_XXX_markdown_file_creation.py)
  │   ├── flows/                  # Orchestration flows
  │   ├── tools/                  # Git and file operation tools
  │   ├── observability/          # Logging and Langfuse integration
  │   └── content_generators.py   # Markdown generation utilities
  ├── specs/                      # Feature specifications (this file)
  ├── tests/                      # Test suites for validation
  └── pyproject.toml              # Python project configuration
  ```

  The repository follows a pattern where each completed feature (001-146+) creates:
  1. A markdown file in the repo root (e.g., test-h875yn.md)
  2. A feature implementation module (e.g., feature_146_markdown_file_creation.py)
  3. Tests validating the implementation
  4. A git commit with conventional message format

  ### Architecture Patterns

  **Orchestration Pattern**: CrewAI flow-based orchestration separates:
  - Flows: Define execution structure and control paths (e.g., code_implementation.py)
  - Agents: Autonomous AI decision-making with specialized roles (e.g., code_agents.py)
  - Tools: Reusable operations for git, file operations, web access

  **Feature Implementation Pattern**: Each feature module follows a consistent 5-step workflow:
  1. **Generate Content**: Use Claude via LLM factory to generate markdown (H1 + 2-3 sentences)
  2. **Write File**: Save to repository root with UTF-8 encoding (no BOM)
  3. **Validate**: Verify markdown structure, encoding, line endings, and trailing newline
  4. **Commit**: Stage file and create conventional commit message
  5. **Push**: Push to remote repository with upstream tracking

  **Content Generation**: The `content_generators.py` module provides:
  - `generate_markdown_content()`: LLM-based generation with validation
  - `write_markdown_file()`: File I/O with encoding/safety checks
  - `validate_markdown_file()`: Comprehensive validation (syntax, encoding, line endings)
  - `commit_markdown_file()`: Git staging with conventional messages
  - `push_markdown_file()`: Push with upstream tracking
  - `create_markdown_file()`: End-to-end orchestration

  **Validation Requirements**:
  - H1 heading must be present and at start of file (format: `# Title`)
  - Blank line must follow heading (line separator)
  - 2-3 sentences of prose content (validated by counting periods)
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - Trailing newline at file end (POSIX convention)
  - Minimum 50 bytes of content

  ### Relevant Technologies

  **CrewAI Framework**: Multi-agent orchestration library
  - Provides Flow class for defining execution structure
  - Agent class for specialized AI personalities
  - Tool decorator for integrating external capabilities
  - Built on top of LangChain

  **Anthropic Claude API**: LLM for content generation
  - Accessed via `get_reasoning_llm()` from config/llm.py
  - Supports structured markdown generation with prompt templates
  - Used for creative content (titles, prose sentences)

  **GitPython**: Git operations
  - Abstracts git commands (add, commit, push)
  - Used via GitCommitTool and GitPushTool wrappers
  - Handles remote upstream tracking

  **Pydantic**: Configuration and validation
  - Settings management via pydantic-settings
  - BaseModel for structured data
  - Used throughout for type safety and validation

  **Langfuse**: Observability and tracing
  - Optional integration for execution monitoring
  - Configured via environment variables
  - Provides full trace of agent decisions and API calls

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Addition of single new markdown file (test-c12y8b.md) |
  | src/sheep/features/ | Low | New feature module feature_147_markdown_file_creation.py required (follows template from feature_146) |
  | specs/147-markdown-file-creation-23e4a7/ | Low | This spec file and accompanying research/plan/tasks files |
  | tests/ | Low | New test suite (test_feature_147_markdown_file_creation.py) to validate implementation |
  | Content Generators | None | No changes to content_generators.py; reuses existing functions |
  | Git Integration | None | No changes to tools; uses existing GitCommitTool and GitPushTool |
  | Configuration | None | No changes to LLM factory or settings |

  ## Dependencies

  **Runtime Dependencies**:
  - Python 3.11+ (from pyproject.toml)
  - CrewAI >= 0.86.0 (already installed)
  - Anthropic API access (ANTHROPIC_API_KEY or similar LLM provider)
  - GitPython >= 3.1.0 (already installed)
  - Valid git repository with remote configured

  **Existing Code Dependencies**:
  - `sheep.content_generators`: Functions for generate, write, validate, commit, push
  - `sheep.config.llm`: get_reasoning_llm() factory
  - `sheep.observability.logging`: Structured logging with get_logger()
  - `sheep.tools`: GitCommitTool, GitPushTool for git operations

  **No External API Dependencies**: The feature does not require any additional external APIs
  beyond the LLM provider already configured for the project.

  ## Implementation Approach

  Based on the established pattern from feature_146, the implementation will:

  1. **Create feature module** at `src/sheep/features/feature_147_markdown_file_creation.py`
     - Define FEATURE_NUMBER = 147
     - Define MARKDOWN_FILENAME = "test-c12y8b.md"
     - Define COMMIT_MESSAGE with feature number
     - Implement `create_feature_147_markdown_file()` orchestration function

  2. **Reuse existing utilities** from `content_generators.py`:
     - Call `generate_markdown_content()` to create H1 + 2-3 sentences
     - Call `write_markdown_file(content, "test-c12y8b.md")`
     - Call `validate_markdown_file(filepath)`
     - Call `commit_markdown_file()` with custom commit message
     - Call `push_markdown_file()` for remote push

  3. **Create test suite** at `tests/test_feature_147_markdown_file_creation.py`
     - Unit tests for file generation
     - Validation tests for markdown structure
     - Git operation tests for commit/push
     - Similar structure to test_feature_146_markdown_file_creation.py

  4. **Git workflow**:
     - Commit message: "feat(147): create markdown file test-c12y8b.md with prose content"
     - Uses conventional commit format (feat scope)
     - Feature branch: feat/147-markdown-file-creation-23e4a7 (already exists)

  ## Size Estimate

  **S** (Small) — 1-2 hours of work

  **Justification**:
  - **Code template exists**: Feature_146 provides exact template to copy and modify (5 lines different)
  - **No architecture changes**: Uses existing content_generators utilities
  - **No infrastructure**: No new dependencies, configuration, or modules to create
  - **Proven pattern**: This is the 147th iteration of the same pattern — minimal uncertainty
  - **Minimal testing**: Can adapt test_feature_146 with find-replace (feature number, filename)
  - **Single artifact**: Only creates one markdown file; no multiple components
  - **Implementation steps**: ~15 lines of code, ~100 lines of tests, ~5 minutes of git operations

  This is a straightforward file creation task with no complexity factors. The effort is purely
  mechanical following the established pattern from 146 preceding features.

