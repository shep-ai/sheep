content: |
  ## Problem Statement

  The user requires creation of a single markdown file with the exact filename `test-c12y8b.md` in the repository root.
  The file must contain:
  - An H1 markdown heading (title about any topic)
  - A blank line (separator)
  - 2-3 sentences of coherent prose content

  This follows the established pattern from features 001-146, which all involve similar markdown file creation tasks.
  The feature must generate meaningful content, validate it meets markdown specifications and encoding standards,
  commit the change with a conventional commit message, and push to the feature branch.

  ## Success Criteria

  - [ ] File `test-c12y8b.md` is created in repository root
  - [ ] File contains exactly one H1 heading (format: `# Title`)
  - [ ] File contains a blank line separating heading from body
  - [ ] File contains 2-3 sentences of coherent prose (validated by period count)
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] File ends with a trailing newline (POSIX convention)
  - [ ] File content is at least 50 bytes
  - [ ] File is staged and committed with message: "feat(147): create markdown file test-c12y8b.md with prose content"
  - [ ] Commit is pushed to feature branch `feat/147-markdown-file-creation-23e4a7`
  - [ ] No existing files in the repository are modified
  - [ ] All unit tests pass for the feature
  - [ ] All validation tests pass (markdown structure, encoding, line endings)
  - [ ] All git operation tests pass (commit/push workflows)

  ## Functional Requirements

  - **FR-1**: The system must create exactly one markdown file named `test-c12y8b.md` in the repository root directory
  - **FR-2**: The markdown file must contain an H1 heading (e.g., `# My Title`) as the first line
  - **FR-3**: The markdown file must contain a blank line immediately following the H1 heading
  - **FR-4**: The markdown file must contain 2-3 sentences of coherent, meaningful prose content after the blank line
  - **FR-5**: The system must validate the generated markdown file against the specification (structure, encoding, line endings, trailing newline)
  - **FR-6**: The system must stage the created file and commit it with a conventional commit message: `feat(147): create markdown file test-c12y8b.md with prose content`
  - **FR-7**: The system must push the commit to the remote repository on the feature branch `feat/147-markdown-file-creation-23e4a7`
  - **FR-8**: The system must use Claude LLM via the configured LLM factory to generate the H1 title and prose content
  - **FR-9**: The system must leverage existing `content_generators.py` utility functions (generate, write, validate, commit, push)
  - **FR-10**: The system must not modify any existing files in the repository

  ## Non-Functional Requirements

  - **NFR-1 (Performance)**: Feature execution must complete within 30 seconds, including LLM content generation, file I/O, validation, and git operations
  - **NFR-2 (Encoding)**: Generated file must use UTF-8 encoding without BOM (Byte Order Mark)
  - **NFR-3 (Line Endings)**: Generated file must use Unix LF line endings (U+000A), not Windows CRLF (U+000D U+000A)
  - **NFR-4 (POSIX Compliance)**: Generated file must end with a trailing newline character per POSIX convention
  - **NFR-5 (Consistency)**: Feature implementation must follow the established pattern from features 001-146 (same orchestration flow, utility reuse, commit format)
  - **NFR-6 (Code Reusability)**: Feature must reuse existing functions from `content_generators.py` module rather than duplicating functionality
  - **NFR-7 (Error Handling)**: Feature must fail fast with clear, actionable error messages (not retry on transient failures)
  - **NFR-8 (Logging)**: Feature must use structured logging with `get_logger()` from `sheep.observability.logging` module
  - **NFR-9 (Testability)**: Feature must have comprehensive test coverage matching feature_146 standard (unit, validation, and git operation tests)
  - **NFR-10 (Maintainability)**: Feature code must be concise (~15 lines of orchestration code) by reusing existing utilities

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content be LLM-generated for variety or use a predetermined template? | LLM-generated creative content | Matches feature 146 pattern, provides variety, negligible latency cost, LLM dependency already reliable |
  | 2 | Should validation be comprehensive or minimal? | Comprehensive validation (all checks) | Established pattern from 001-146, catches edge cases early, confidence in deliverable quality |
  | 3 | Should error handling retry on failures or fail immediately? | Fail immediately with clear errors | Straightforward use case, operator can easily retry, simpler debugging than transient retry scenarios |
  | 4 | What test coverage level should we target? | Comprehensive coverage matching feature 146 | Team standard, catches regressions, small investment (1-2 hours) relative to confidence gained |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Addition of single new markdown file (test-c12y8b.md) |
  | src/sheep/features/ | Low | New feature module feature_147_markdown_file_creation.py required (follows template from feature_146) |
  | specs/147-markdown-file-creation-23e4a7/ | Low | This spec file and accompanying research/plan/tasks files |
  | tests/ | Low | New test suite (test_feature_147_markdown_file_creation.py) to validate implementation |
  | Content Generators | None | No changes to content_generators.py; reuses existing functions |
  | Git Integration | None | No changes to tools; uses existing GitCommitTool and GitPushTool |
  | Configuration | None | No changes to LLM factory or settings |

  ## Dependencies

  **Runtime Dependencies**:
  - Python 3.11+ (from pyproject.toml)
  - CrewAI >= 0.86.0 (already installed)
  - Anthropic API access (ANTHROPIC_API_KEY configured)
  - GitPython >= 3.1.0 (already installed)
  - Valid git repository with remote configured

  **Existing Code Dependencies**:
  - `sheep.content_generators`: Functions for generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.config.llm`: get_reasoning_llm() factory for LLM access
  - `sheep.observability.logging`: get_logger() for structured logging
  - `sheep.tools`: GitCommitTool and GitPushTool for git operations

  **No New External Dependencies**: The feature does not require any new external APIs or packages beyond what is already configured for the project.

  ## Implementation Approach

  Based on the established pattern from feature_146, the implementation will:

  1. **Create feature module** at `src/sheep/features/feature_147_markdown_file_creation.py`
     - Define FEATURE_NUMBER = 147
     - Define MARKDOWN_FILENAME = "test-c12y8b.md"
     - Define COMMIT_MESSAGE with feature number
     - Implement `create_feature_147_markdown_file()` orchestration function

  2. **Reuse existing utilities** from `content_generators.py`:
     - Call `generate_markdown_content()` to create H1 + 2-3 sentences via LLM
     - Call `write_markdown_file(content, "test-c12y8b.md")`
     - Call `validate_markdown_file(filepath)` for comprehensive validation
     - Call `commit_markdown_file()` with custom commit message
     - Call `push_markdown_file()` for remote push

  3. **Create test suite** at `tests/test_feature_147_markdown_file_creation.py`
     - Unit tests for file generation
     - Validation tests for markdown structure
     - Git operation tests for commit/push
     - Similar structure to test_feature_146_markdown_file_creation.py

  4. **Git workflow**:
     - Commit message: "feat(147): create markdown file test-c12y8b.md with prose content"
     - Uses conventional commit format (feat scope)
     - Feature branch: feat/147-markdown-file-creation-23e4a7 (already exists)

  ## Size Estimate

  **S** (Small) — 1-2 hours of work

  **Justification**:
  - **Code template exists**: Feature_146 provides exact template to copy and modify (5 lines different)
  - **No architecture changes**: Uses existing content_generators utilities
  - **No infrastructure**: No new dependencies, configuration, or modules to create
  - **Proven pattern**: This is the 147th iteration of the same pattern — minimal uncertainty
  - **Minimal testing**: Can adapt test_feature_146 with find-replace (feature number, filename)
  - **Single artifact**: Only creates one markdown file; no multiple components
  - **Implementation steps**: ~15 lines of code, ~100 lines of tests, ~5 minutes of git operations

  This is a straightforward file creation task with no complexity factors. The effort is purely
  mechanical following the established pattern from 146 preceding features.

  ---

  _Requirements phase completed — ready for implementation planning_
