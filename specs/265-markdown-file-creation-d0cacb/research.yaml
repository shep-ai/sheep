# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research Complete
  - **Updated:** 2026-03-29

  ## Technology Decisions

  ### 1. Content Generation Implementation

  **Chosen:** Use existing `generate_markdown_content()` function from `sheep.content_generators` module.

  **Rejected:**
  - Hard-code prose content manually — breaks established pattern across 264 precedents, adds manual authorship overhead, introduces quality variability
  - Implement custom LLM call logic — duplicates existing infrastructure, increases complexity, loses benefit of validated function
  - Switch to different LLM provider — CrewAI already configured with Anthropic/Claude, no reason to switch

  **Rationale:** The `generate_markdown_content()` function is purpose-built for this pattern. It calls
  `get_reasoning_llm()` configured with temperature 0.2 for deterministic output, validates generated
  content meets format requirements (H1 heading, 2-3 sentences, proper structure), and ensures trailing
  newlines. Using this function ensures consistency with 264+ prior implementations, eliminates need to
  handle LLM API calls and response parsing manually, and leverages validated, tested code.

  **Implementation Detail:** The function uses CrewAI's LLM interface to call Claude API with a fixed
  prompt template that prevents prompt injection and ensures consistent output format.

  ### 2. File I/O with Encoding/Line Ending Handling

  **Chosen:** Use existing `write_markdown_file(content, filename)` function which uses `pathlib.Path`
  for file operations with explicit UTF-8 encoding and LF line ending normalization.

  **Rejected:**
  - Raw `open()` with manual encoding — reinvents existing logic, no path traversal validation, error-prone
  - Third-party file library — unnecessary, pathlib (stdlib) provides required functionality
  - Custom file writing — duplicate effort, lose validation and security checks

  **Rationale:** The `write_markdown_file()` function handles:
  - **Path safety validation:** Rejects filenames containing "/" or "\\" prefixes to prevent path traversal
  - **Cross-platform paths:** Uses pathlib.Path for platform-agnostic path handling
  - **Encoding:** Explicit UTF-8 encoding (no BOM)
  - **Line endings:** Python's text mode on Unix automatically uses LF
  - **Post-write verification:** Confirms file exists and has non-zero size
  - **Logging:** Structured logging for observability

  This function is already tested across 264+ previous features. Using it avoids reimplementing security
  validations and encoding handling.

  ### 3. File Validation Before Commit

  **Chosen:** Call `validate_markdown_file(filepath)` before committing to catch encoding/format errors early.

  **Rejected:**
  - No validation — risks committing invalid files, silent failures, undetected issues
  - Manual validation post-commit — slower feedback, requires human review, not reproducible
  - Deferred validation during review — allows bad commits to reach remote

  **Rationale:** The `validate_markdown_file()` function performs comprehensive checks:
  - UTF-8 encoding without BOM (reads binary to detect BOM prefix `\xef\xbb\xbf`)
  - LF line endings only (rejects CRLF with `b"\r\n"` detection)
  - H1 heading on first line (`startswith("# ")`)
  - Blank line separator (second line must be empty)
  - 2-3 sentences (counts periods, validates range)
  - Trailing newline (requires file to end with `\n`)

  Running validation before commit (in `create_markdown_file()` orchestration) catches issues immediately
  and prevents bad commits, matching the pattern used in features 260-264.

  ### 4. Git Workflow (Commit and Push)

  **Chosen:** Use existing `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools` module.

  **Rejected:**
  - Direct subprocess for git — reimplements git tool logic, duplicates error handling, breaks CrewAI integration
  - GitPython library — not in pyproject.toml dependencies, adds external dependency unnecessarily
  - Manual shell commands — security risk for command injection

  **Rationale:** The sheep.tools provides CrewAI-integrated tools that:
  - Wrap `subprocess.run()` with shell=False (no command injection vulnerability)
  - Validate repository path exists before operations
  - Handle platform differences via pathlib
  - Support upstream tracking (-u flag for git push)
  - Provide structured error messages and return values
  - Integrate with CrewAI's agent framework

  The `commit_markdown_file()` wrapper function calls GitCommitTool with `add_all=True` to stage all
  changes. The `push_markdown_file()` wrapper calls GitPushTool with `set_upstream=True` to establish
  upstream tracking.

  ### 5. Commit Message Format

  **Chosen:** Conventional commit format: `feat(265): create markdown file test-o09hnk.md with prose content`

  **Rejected:**
  - Minimal format (just filename) — loses feature traceability, inconsistent with precedents
  - Custom format — breaks conventional commits convention, inconsistent with 264+ existing commits

  **Rationale:** Conventional commits enable:
  - Automatic changelog generation (feat → new feature)
  - Feature traceability (feat(265) → links to issue/spec 265)
  - Automated parsing in CI/CD pipelines
  - Consistency with existing commit history (features 001-264)

  The message can be generated automatically as: `feat({feature_num}): create markdown file {filename} with prose content`.
  Note: Current `create_markdown_file()` hardcodes feature number 145 (line 475); update to use 265.

  ### 6. Repository Location

  **Chosen:** Create file at repository root using `Path.cwd()` (current working directory).

  **Rejected:**
  - Hardcoded absolute path — inflexible when repository location changes
  - Subdirectory — inconsistent with 264+ existing test files at root, violates FR-2
  - Configurable location — unnecessary complexity

  **Rationale:** All 264 precedents place test markdown files at repository root alongside each other.
  The `write_markdown_file()` function uses `Path.cwd() / filename` which is simple, flexible, and
  works correctly across CI/CD, local development, and isolated environments.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File path handling, cross-platform operations | **Use** | Built-in Python stdlib, provides safe path operations with validation, used in write_markdown_file() |
  | CrewAI | LLM integration and agent framework | **Use** | Already in pyproject.toml (v0.86.0+), configured with Anthropic provider, get_reasoning_llm() provides temperature-tuned LLM instance |
  | Claude API | LLM for content generation | **Use** | Accessed through CrewAI's LLM wrapper, configured with ANTHROPIC_API_KEY environment variable |
  | subprocess (stdlib) | Git command execution | **Use** | Wrapped in git_tools module, run with shell=False prevents command injection, subprocess.run is standard approach |
  | Git | Version control operations | **Use** | Invoked via subprocess through git_tools wrappers, external command not Python package |
  | GitPython | Git operations library | **Reject** | Not needed—existing git_tools module is sufficient, adding GitPython would be unnecessary complexity and external dependency |
  | Markdown parser | Markdown validation | **Reject** | Not needed—validation is simple text checks (H1 heading, line endings, sentence count), no complex parsing required |

  ## Security Considerations

  ### 1. File Path Validation

  **Threat:** Path traversal attacks (e.g., `../../../etc/passwd` or absolute paths)
  **Mitigation:** The `write_markdown_file()` function explicitly rejects filenames containing "/" or "\\" and
  validates the filename doesn't start with ".". The final path is constructed as `Path.cwd() / filename`
  ensuring the file is always created at repository root.

  ### 2. UTF-8 Encoding and BOM Detection

  **Threat:** Encoding confusion attacks (BOM injection, mixed encodings)
  **Mitigation:** Explicit UTF-8 encoding in file write. The `validate_markdown_file()` function checks for
  UTF-8 BOM prefix (`\xef\xbb\xbf`) and rejects files containing it. Encoding validation decodes entire
  file as UTF-8 and raises UnicodeDecodeError if encoding is invalid.

  ### 3. Line Ending Normalization

  **Threat:** CRLF injection or confusion between line ending conventions
  **Mitigation:** Explicit LF line ending handling. Python's text mode on Unix systems automatically converts
  newlines to LF. The `validate_markdown_file()` function checks for CRLF (`b"\r\n"`) in binary content
  and rejects files containing it.

  ### 4. LLM API Call Security

  **Threat:** Prompt injection via user input or malicious LLM output
  **Mitigation:**
  - Fixed prompt template (no user input injected)
  - Temperature set to 0.2 (low) for predictable, consistent output
  - Output validation in `_validate_markdown_content()` checks format before use
  - API key stored in environment (.env) not hardcoded
  - CrewAI handles API communication securely

  ### 5. Git Operations

  **Threat:** Command injection via filename in git commands
  **Mitigation:** Git operations use subprocess.run with shell=False and explicit argument lists (no shell
  interpretation). GitCommitTool uses `-m` flag with message as separate argument. Filename is already
  validated before git operations.

  ### 6. Environment and Credentials

  **Assumption:** ANTHROPIC_API_KEY is set in environment (.env) and not exposed in logs/commits
  **Verification:** get_reasoning_llm() uses pydantic.SecretStr to handle API keys safely (they don't appear
  in string representations)

  ## Performance Implications

  ### 1. Content Generation Latency

  - **LLM API call:** Dominates overall execution time, estimated 2-5 seconds depending on network latency
  - **Temperature tuning:** Set to 0.2 (low) enables faster, more deterministic responses
  - **No caching:** Single file operation doesn't benefit from caching; acceptable performance hit

  **Optimization notes:** Parallel generation of multiple files would benefit from async/await, but this feature
  creates exactly one file, so no parallelization possible.

  ### 2. File I/O Performance

  - **Write operation:** ~1-5ms for ~500-byte file (dominated by syscall overhead)
  - **Validation read:** Additional binary read for validation, adds ~1-5ms
  - **Total I/O time:** Negligible (~10-20ms total, < 1% of execution time)

  **Optimization notes:** Reading file twice (write, then validate) is acceptable for single-file operations.

  ### 3. Git Operations Performance

  - **git add:** ~10-50ms for single file
  - **git commit:** ~10-50ms to create commit object
  - **git push:** 500ms-2s depending on network latency and server response time
  - **Total git time:** Dominated by network latency in push operation

  **Optimization notes:** No local optimizations possible; git operations are I/O bound on network latency.

  ### 4. Total Execution Time

  | Phase | Time | Notes |
  | ----- | ---- | ----- |
  | Generate content | 2-5s | LLM API call latency |
  | Write file | 5ms | Filesystem I/O |
  | Validate file | 5ms | Binary read + checks |
  | Commit | 50ms | Create git object |
  | Push | 500ms-2s | Network latency dominant |
  | **Total** | **3-7.5s** | Aligned with 10-15 minute estimate including setup/debugging |

  ## Architecture Notes

  ### Integration with Existing Patterns

  This feature perfectly integrates into the established sheep architecture:

  1. **Helper Function Abstraction:** Uses existing `create_markdown_file()` orchestration function that
     combines all steps (generate → write → validate → commit → push) into a single idempotent operation.

  2. **LLM Integration:** Uses `get_reasoning_llm()` from config module, which is CrewAI's standard pattern
     for temperature-tuned LLM instances. This integrates with the agent framework's observability
     (Langfuse tracing) and configuration management.

  3. **Git Tool Integration:** Uses CrewAI's BaseTool subclasses (GitCommitTool, GitPushTool) which can be
     integrated into agent workflows if needed in future features. The tools provide structured return
     values and error handling.

  4. **Configuration Management:** No configuration changes needed. ANTHROPIC_API_KEY is already managed
     by pydantic-settings in settings module. Git configuration (user.name, user.email) must be set up
     beforehand (standard Git requirement).

  5. **Logging and Observability:** Uses structured logging via `get_logger(__name__)` which integrates with
     Langfuse tracing. All helper functions include debug/info/error logging, providing full audit trail.

  ### No Breaking Changes

  - No modifications to existing helper functions needed
  - No changes to core agent architecture
  - No modifications to CrewAI flow definitions
  - No changes to configuration schema
  - Only the commit message needs the feature number 265 (one-line change)

  ### Precedent Across 264 Features

  This exact pattern has been successfully implemented 264 times with:
  - Identical file format (H1 heading + 2-3 sentences)
  - Same helper functions
  - Same git workflow (stage, commit, push)
  - Diverse prose topics demonstrating free-form topic selection works well
  - No issues or regressions reported

  ### Scalability Considerations

  - Feature creates exactly 1 file (no scalability concerns)
  - File size ~500 bytes (negligible storage impact)
  - Commit size small (git compression efficient)
  - No database operations, no API side effects beyond Claude API call
  - Implementation is stateless and idempotent

  ## Summary

  The implementation for feature 265 requires **zero new code**, **zero new dependencies**, and **zero
  architectural decisions**. It uses:

  1. `generate_markdown_content()` — Generate prose + H1 heading via Claude API (temperature 0.2)
  2. `write_markdown_file()` — Write UTF-8 encoded file with LF line endings
  3. `validate_markdown_file()` — Verify encoding, structure, and content format
  4. `GitCommitTool` / `GitPushTool` — Stage, commit, and push with conventional message
  5. `create_markdown_file()` orchestrator — Combine all steps into single workflow

  All functions are proven across 264 prior features, security considerations are addressed by
  existing validation logic, performance is acceptable for single-file operations, and the
  architecture integrates seamlessly with sheep's agent framework and configuration management.
