content: |
  ## Summary

  This task breakdown implements feature 265 in 5 concrete tasks across 4 sequential phases:

  1. **Content Generation** (task-1, 3m): Call generate_markdown_content() to produce prose via Claude API with temperature 0.2
  2. **File Creation** (task-2, 1m): Call write_markdown_file() to persist content with UTF-8 encoding and LF line endings
  3. **Validation** (task-3, 2m): Call validate_markdown_file() to verify all structural and encoding requirements before commit
  4. **Git Operations** (task-4 + task-5, 4m): Stage, commit with conventional message for feature 265, and push to remote with upstream tracking

  ### Total Effort: ~10 minutes

  This estimate aligns with the "S" (small) size classification in the feature spec. The implementation is straightforward because:
  - All heavy lifting is delegated to existing helper functions proven across 264+ prior features
  - No custom code needed—pure orchestration of existing infrastructure
  - All error handling, encoding validation, and git operations are abstracted into functions
  - No architectural decisions or new dependencies required

  ### Task Dependencies

  Tasks form a strict dependency chain:
  - **task-1** → **task-2**: Content must be generated before writing file
  - **task-2** → **task-3**: File must be written before validation
  - **task-3** → **task-4**: File must be validated before commit (prevents bad commits)
  - **task-4** → **task-5**: File must be committed before push

  No tasks can run in parallel due to sequential data dependencies.

  ### TDD Approach

  Each task uses RED-GREEN-REFACTOR cycle:
  - **RED**: Write test that asserts expected behavior (will fail initially)
  - **GREEN**: Implement minimal code to pass the test (use existing functions)
  - **REFACTOR**: Clean up, add error handling, improve logging and observability

  This ensures each task is complete and verified before moving to the next phase.

  ### Implementation Notes

  - All functions are imported from sheep.content_generators module (existing infrastructure)
  - Feature number (265) is hardcoded in commit message per spec
  - Feature branch (feat/265-markdown-file-creation-d0cacb) is pre-created and already checked out
  - Assumes git user.name and user.email are pre-configured (standard Git requirement)
  - ANTHROPIC_API_KEY must be set in environment (.env) for LLM calls
  - Implementation follows identical pattern from features 001-264 with proven success
