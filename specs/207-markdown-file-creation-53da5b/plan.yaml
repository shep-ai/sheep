content: |
  ## Architecture Overview

  ### Module Structure

  Feature 207 follows the identical structure as features 205-206. The implementation is a single
  Python module at `src/sheep/features/feature_207_markdown_file_creation.py` containing:

  1. **Module Docstring** — Explains the feature purpose and approach
  2. **Imports** — subprocess, Path from pathlib, get_logger from sheep.observability.logging
  3. **Module Constants** — FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT
  4. **Validation Functions** — Eight focused functions for different validation concerns
  5. **File Operations** — create_markdown_file() function
  6. **Git Operations** — Three functions for add/commit/push
  7. **Orchestration** — main() function coordinating the workflow
  8. **Module Entry Point** — `if __name__ == "__main__"` block

  ### Design Patterns (from Features 205-206)

  **Hard-Coded Content:** Content is defined as module constants (TITLE_TEXT, PROSE_CONTENT),
  not generated or read from external sources. This satisfies NFR-7 (determinism), matches
  established patterns, and simplifies testing.

  **Focused Validation Functions:** Instead of a single monolithic validate() function,
  feature 207 uses eight focused functions each validating one concern. These functions compose
  into a validate_markdown_file() pipeline that runs checks sequentially.

  **Secure Subprocess Usage:** Git operations use subprocess.run() with shell=False (security),
  check=True (fail-fast), and capture_output=True (logging). Each operation is a separate function.

  **Fail-Fast Error Handling:** All operations raise exceptions immediately on error. Each layer
  logs detailed error messages before re-raising. The main() function catches exceptions, logs failure,
  and returns non-zero exit code.

  **Logging at Appropriate Levels:** INFO for major steps, DEBUG for details, ERROR for failures.

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Chosen:** Use `pathlib.Path.write_text(markdown_content, encoding=\"utf-8\")`

  **Why:** Idiomatic Python 3.4+ for file operations. Automatically uses LF line endings on Unix/Linux
  (NFR-2), UTF-8 encoding ensures no BOM (NFR-1), cleaner than open() or io.open(), matches pattern
  from features 205-206.

  ### 2. Sentence Counting: Period Counting

  **Chosen:** Count periods (.) in prose text — simple, direct, effective

  **Why:** Each sentence must end with period (FR-3), so period count = sentence count. No external
  dependencies (NFR-6), matches features 205-206 pattern, trivially testable.

  ### 3. Git Operations: subprocess.run() with shell=False

  **Chosen:** Separate functions using `subprocess.run(cmd_list, check=True, capture_output=True, text=True)`

  **Why:** Secure (shell=False prevents injection), matches features 205-206 pattern, standard library
  (no external dependencies), clear error handling via CalledProcessError.

  ### 4. Validation Architecture: Multiple Focused Functions

  **Chosen:** Eight validation functions plus validate_markdown_file() pipeline orchestrator

  **Why:** Each function validates one concern (single responsibility), independently testable, error
  messages show exactly which check failed. Functions can be reused. Matches features 205-206.

  ### 5. Content: Hard-Coded Deterministic

  **Chosen:** Define TITLE_TEXT and PROSE_CONTENT as module constants

  **Why:** Satisfies NFR-7 (deterministic implementation), matches features 205-206 pattern, content
  immediately visible (no API calls), transparent and auditable, enables fast testing.

  **Content Details:**
  - TITLE_TEXT: \"The Power of Asynchronous Programming\"
  - PROSE_CONTENT: Exactly 3 sentences about async programming
  - Format: Single paragraph (space-separated sentences)
  - Total file size: ~300-400 bytes

  ### 6. Error Handling: Fail-Fast with Clear Logging

  **Chosen:** Raise exceptions immediately, log detailed error messages, return non-zero exit code

  **Why:** Matches fail-fast principle from features 205-206. File/git operations are deterministic —
  failures indicate real problems that must be visible. Prevents partial/corrupt state. Simple, transparent.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (Foundation):** Module structure and constants must exist first
  2. **Phase 2 (File Creation):** Implement core file creation before validation
  3. **Phases 3-4 (Validation):** Implement validation functions in logical groups
  4. **Phase 5 (Pipeline):** Orchestrate validation functions after all individual functions exist
  5. **Phase 6 (Git):** Implement git operations after file creation and validation are complete
  6. **Phase 7 (Main):** Implement orchestration function after all building blocks are in place
  7. **Phase 8 (Testing):** Integration testing final phase

  ### Dependency Chain

  Constants → File Creation → Validation → Git Operations → Orchestration → Testing

  This build-from-bottom-up approach minimizes risk and allows independent testing of each layer.

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Validation logic misses edge cases | Low | Multiple focused functions with independent tests; explicit checks |
  | Git operations fail in CI | Low | subprocess.run() proven in features 205-206; fail-fast with clear messages |
  | File encoding issues | Very Low | Explicit binary validation (read_bytes() checks); pathlib handles encoding correctly |
  | Syntax errors in module | Low | Follow feature 206 pattern exactly; implement in TDD cycles |
  | Incorrect content | Very Low | Hard-coded constants are transparent; content validated against requirements |
  | Error messages leak sensitive info | Very Low | Use relative filenames; subprocess stderr captured; safe error messages |
  | Main orchestration fails | Low | Implement after all functions work independently; integration testing |

  ## Code Organization

  The feature module will have ~300 lines of code organized as:

  - Lines 1-50: Module docstring, imports, logger setup
  - Lines 51-60: Module constants (FILENAME, FEATURE_NUMBER, etc.)
  - Lines 61-110: File existence and format validation functions
  - Lines 111-160: Prose extraction and sentence validation functions
  - Lines 161-210: Encoding and line ending validation functions
  - Lines 211-250: File size validation and pipeline function
  - Lines 251-280: File creation function
  - Lines 281-320: Git operation functions
  - Lines 321-350: Main orchestration function and entry point

  ## Success Metrics

  Implementation is complete when:
  1. Module file created at `src/sheep/features/feature_207_markdown_file_creation.py`
  2. File `test-jkyks3.md` is created in repository root
  3. All validation functions pass their tests
  4. validate_markdown_file() pipeline passes comprehensive validation
  5. Git operations successfully stage, commit, and push file
  6. main() function exits with code 0 on success, 1 on failure
  7. Integration test verifies complete end-to-end workflow
  8. All specification success criteria are met
