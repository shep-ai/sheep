phases:
  - id: "phase-1"
    name: "Module Foundation & Setup"
    description: >
      Create the feature module skeleton with all necessary imports, module docstring, and
      hard-coded content constants (FILENAME, TITLE_TEXT, PROSE_CONTENT, etc.). This phase
      establishes the structure that all subsequent phases depend on.
    parallel: false

  - id: "phase-2"
    name: "File Creation Implementation"
    description: >
      Implement the create_markdown_file() function using pathlib.Path.write_text() with UTF-8
      encoding. This function constructs markdown content with H1 heading, blank line separator,
      and prose, then writes to disk.
    parallel: false

  - id: "phase-3"
    name: "Basic Validation Functions"
    description: >
      Implement foundational validation functions: verify_file_exists(), validate_markdown_format(),
      extract_prose_content(), and count_sentences(). These functions check file existence,
      H1 heading presence, blank line separator, and enable prose extraction.
    parallel: false

  - id: "phase-4"
    name: "Content Validation Functions"
    description: >
      Implement content-specific validation: validate_sentence_count(), validate_encoding(),
      validate_line_endings(), and validate_file_size(). These functions verify prose has exactly
      2-3 sentences, file is UTF-8 without BOM, uses Unix LF line endings, and size is 250-600 bytes.
    parallel: false

  - id: "phase-5"
    name: "Validation Pipeline"
    description: >
      Implement the validate_markdown_file() pipeline function that orchestrates all validation
      checks in logical order with clear error messages. This function runs all checks sequentially,
      fails fast on first error, and logs progress at INFO level.
    parallel: false

  - id: "phase-6"
    name: "Git Operations Implementation"
    description: >
      Implement three git operation functions: git_add_file(), git_commit(), and git_push().
      Each function uses subprocess.run() with shell=False for security, implements fail-fast error
      handling, and captures output for logging.
    parallel: false

  - id: "phase-7"
    name: "Orchestration & Integration"
    description: >
      Implement the main() function that orchestrates the complete workflow: file creation,
      validation, and git operations in three logical phases. Add module __main__ entry point.
    parallel: false

  - id: "phase-8"
    name: "Integration Testing & Cleanup"
    description: >
      Execute end-to-end testing of the complete workflow. Verify file is created correctly,
      validation passes, git operations succeed, and all specification success criteria are met.
    parallel: false

