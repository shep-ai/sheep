  - title: "Validation Architecture"
    chosen: "Multiple focused validation functions composed into comprehensive pipeline"
    rejected:
      - "Single monolithic validate() function — harder to test individual concerns, unclear which check fails"
      - "Inline validation in create_markdown_file() — mixes concerns, validation duplicated across functions"
      - "External validation library/module — unnecessary dependency, adds indirection"
    rationale: >
      Multiple focused functions (verify_file_exists, validate_markdown_format, extract_prose_content,
      count_sentences, validate_sentence_count, validate_encoding, validate_line_endings, validate_file_size)
      each check one concern, are easy to test independently, provide clear error messages (show which check
