      via CalledProcessError. Separate functions (git_add_file, git_commit, git_push) follow single-responsibility
      principle, aid testing, and match the codebase pattern. Using capture_output=True and text=True allows
      access to stderr for clear error messages. This approach is proven in features 205-206 and requires no
