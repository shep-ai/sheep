content: |
  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** Use `pathlib.Path.write_text()` with explicit UTF-8 encoding

  **Why selected:**
  - Modern Python 3.4+ standard for file operations
  - Automatically uses LF line endings on Unix/Linux systems (critical for NFR-2)
  - UTF-8 encoding parameter ensures no BOM is added (handles NFR-1)
  - Cleaner API than open() or io.open()
  - Matches established pattern from features 205-206
  - Automatically closes file (no resource leaks)
  - Returns Path object for easy validation

  **Implementation:**
  ```python
  markdown_content = f"# {TITLE_TEXT}\n\n{PROSE_CONTENT}\n"
  file_path = Path(FILENAME)
  file_path.write_text(markdown_content, encoding="utf-8")
  ```

  **Rejected alternatives:**
  - `open()` with 'w' mode — verbose, manual file handle management
  - `io.open()` — unnecessary for Python 3.4+, more verbose
  - Subprocess touch + echo — security risk, over-complicates simple I/O

  ---

  ### 2. Sentence Counting: Period Counting

  **Chosen:** Count periods (.) in prose text to validate sentence count

  **Why selected:**
  - Simple, direct, and effective for well-formed prose
  - Each sentence must end with period (FR-3), so period count = sentence count
  - No external dependencies required (matches NFR-6)
  - Matches pattern from features 205-206
  - Easy to test and debug
  - Fast execution (single string operation)
  - Deterministic for hard-coded content

  **Implementation:**
  ```python
  def count_sentences(prose: str) -> int:
      return prose.count(".")
  ```

  **Validation logic:**
  - Extract prose content after blank line separator
  - Count periods: must be exactly 2 or 3 (2 <= count <= 3)
  - Clear error message if count is outside range

  **Rejected alternatives:**
  - Regex sentence boundary detection — over-engineered, hard to test
  - NLTK/spacy NLP — external dependency, unnecessary for deterministic content
  - Line-based counting — doesn't work for single-paragraph format (space-separated sentences)

  ---

  ### 3. Git Operations: subprocess.run() with shell=False

  **Chosen:** Use subprocess.run() with shell=False for git add/commit/push

  **Why selected:**
  - Secure: no shell injection vulnerability (shell=False is critical)
  - Matches established pattern from features 205-206
  - Standard library (no external dependencies per NFR-6)
  - Clear error handling via CalledProcessError exception
  - Separate functions for each operation (single responsibility)
  - Can capture output/stderr for detailed error messages
  - Uses list syntax for command (more explicit, easier to parse)

  **Implementation pattern:**
  ```python
  subprocess.run(
      ["git", "add", filename],
      check=True,
      capture_output=True,
      text=True,
  )
  ```

  **Key parameters:**
  - `shell=False` (default) — secure, prevents shell interpretation
  - `check=True` — raises CalledProcessError if command fails (fail-fast)
  - `capture_output=True` — capture stdout/stderr for logging
  - `text=True` — return strings instead of bytes

  **Function organization:**
  - `git_add_file(filename)` — stage file for commit
  - `git_commit(commit_message)` — create commit with conventional message
  - `git_push(branch_name)` — push to remote with -u flag for tracking

  **Rejected alternatives:**
  - GitPython library — external dependency against NFR-6
  - subprocess with shell=True — security vulnerability
  - Direct python-git bindings — maintenance burden, not in codebase

  ---

  ### 4. Validation Architecture: Focused Functions Pipeline

  **Chosen:** Multiple focused validation functions (6 core + 1 pipeline function)

  **Why selected:**
  - Each function validates one concern (single responsibility)
  - Functions are independently testable
  - Error messages show exactly which check failed
  - Validation functions can be reused (extract_prose_content, count_sentences)
  - Pipeline function (validate_markdown_file) orchestrates checks in logical order
  - Matches successful pattern from features 205-206
  - Clear separation of file format validation vs. encoding validation vs. size validation

  **Validation function organization:**

  1. **verify_file_exists()** — Check file exists at path
  2. **validate_markdown_format()** — Check H1 heading at start, blank line separator, exactly one H1
  3. **extract_prose_content()** — Helper: extract text after blank line
  4. **count_sentences()** — Helper: count periods in prose
  5. **validate_sentence_count()** — Check exactly 2-3 sentences
  6. **validate_encoding()** — Check UTF-8 without BOM
  7. **validate_line_endings()** — Check Unix LF only (no CRLF/CR)
  8. **validate_file_size()** — Check file size 250-600 bytes
  9. **validate_markdown_file()** — Pipeline: run all checks in order, fail on first error

  **Pipeline execution order:**
  ```
  Check 1: File exists
  Check 2: Markdown format (H1 heading, blank line, prose)
  Check 3: Sentence count (exactly 2-3)
  Check 4: File encoding (UTF-8 without BOM)
  Check 5: Line endings (Unix LF only)
  Check 6: File size (250-600 bytes)
  ```

  **Error handling:**
  - Each function logs at DEBUG level before checking
  - If check fails, logs ERROR with specific message
  - Exceptions re-raised to main()
  - main() catches exceptions, logs workflow failure, returns 1

  **Rejected alternatives:**
  - Single monolithic validate() function — unclear which check fails
  - Inline validation in create_markdown_file() — mixes concerns
  - External validation library — unnecessary dependency

  ---

  ### 5. Content Generation: Hard-Coded Deterministic

  **Chosen:** Hard-coded content defined as module constants

  **Why selected:**
  - Satisfies NFR-7 requirement: "implementation must be deterministic"
  - Matches features 205-206 pattern (proven approach)
  - Content is immediately visible and auditable (no API calls)
  - Fast execution (no API latency)
  - Reproducible across executions (critical for testing)
  - Transparent: readers can see exact content
  - No external API dependencies
  - No additional error handling for API failures

  **Implementation:**
  ```python
  TITLE_TEXT = "The Power of Asynchronous Programming"

  PROSE_CONTENT = (
      "Asynchronous programming enables applications to handle multiple tasks concurrently "
      "without blocking the main execution thread. This approach is essential for building responsive "
      "user interfaces and efficient server applications. Modern programming languages and frameworks "
      "provide powerful abstractions like async/await that make asynchronous code easier to write and understand."
  )
  ```

  **Content format:**
  - TITLE_TEXT: Single line string for H1 markdown heading
  - PROSE_CONTENT: Single paragraph (space-separated sentences, not newline-separated)
  - Content is grammatically correct, complete sentences
  - Exactly 3 sentences (3 periods in PROSE_CONTENT)
  - Natural readable English prose

  **Rejected alternatives:**
  - Claude API generation — violates NFR-7 (deterministic), adds latency, unnecessary complexity
  - Template file reading — adds file dependency, less transparent
  - Randomized content — impossible to test deterministically, violates NFR-7

  ---

  ### 6. Error Handling: Fail-Fast with Clear Logging

  **Chosen:** Raise exceptions immediately, log detailed error messages, return non-zero exit code on failure

  **Why selected:**
  - Matches fail-fast principle from features 205-206
  - File/git operations on local system are deterministic
  - Failures indicate real problems (permissions, state corruption, auth failure)
  - Visibility: errors must be clear to operators
  - Prevents partial/corrupt state (no recovery attempts for local operations)
  - Simple, transparent error propagation
  - Clear logging at each failure point

  **Implementation pattern:**
  ```python
  def create_markdown_file() -> Path:
      _logger.info(f"Creating markdown file: {FILENAME}")
      try:
          markdown_content = f"# {TITLE_TEXT}\n\n{PROSE_CONTENT}\n"
          file_path = Path(FILENAME)
          file_path.write_text(markdown_content, encoding="utf-8")
          if not file_path.exists():
              raise OSError(f"File was not created: {file_path}")
          file_size = file_path.stat().st_size
          _logger.info(f"Successfully created {FILENAME} ({file_size} bytes)")
          return file_path
      except Exception as e:
          _logger.error(f"Failed to create markdown file: {e}")
          raise
  ```

  **Main orchestration error handling:**
  ```python
  def main() -> int:
      _logger.info("Starting feature 207 implementation workflow")
      try:
          # Phase 1, 2, 3...
          _logger.info("✓ Feature 207 implementation completed successfully")
          return 0
      except (FileNotFoundError, ValueError, subprocess.CalledProcessError) as e:
          _logger.error(f"Feature 207 workflow failed: {e}")
          return 1
      except Exception as e:
          _logger.error(f"Unexpected error in feature 207 workflow: {e}")
          return 1
  ```

  **Rejected alternatives:**
  - Retry logic with exponential backoff — local operations are deterministic, failures indicate real problems
  - Graceful degradation — hides errors, reduces visibility
  - Swallow errors and continue — prevents debugging, violates transparency principle

  ---

  ### 7. File Encoding Validation: Binary Verification

  **Chosen:** Read file as bytes, check for UTF-8 BOM, attempt UTF-8 decode

  **Why selected:**
  - Direct binary validation: explicitly checks for UTF-8 BOM signature (0xEF 0xBB 0xBF)
  - Decode verification: attempts UTF-8 decode, catches UnicodeDecodeError
  - No assumptions about text encoding
  - Matches pattern from features 205-206
  - No external dependencies
  - Fast: direct byte checks before parsing

  **Implementation:**
  ```python
  def validate_encoding(filename: str = FILENAME) -> None:
      _logger.debug(f"Validating encoding: {filename}")
      file_path = Path(filename)
      if not file_path.exists():
          raise FileNotFoundError(f"File {filename} does not exist")

      binary_content = file_path.read_bytes()

      # Check for UTF-8 BOM
      if binary_content.startswith(b"\xef\xbb\xbf"):
          raise ValueError("File contains UTF-8 BOM (byte order mark)")

      # Verify UTF-8 encoding
      try:
          binary_content.decode("utf-8")
      except UnicodeDecodeError as e:
          raise ValueError(f"File contains invalid UTF-8 encoding: {e}") from e
  ```

  **How pathlib.Path.write_text() ensures UTF-8 without BOM:**
  - write_text() with encoding='utf-8' uses Python's UTF-8 codec
  - Python's UTF-8 codec does NOT add BOM by default (use 'utf-8-sig' for BOM)
  - This validation confirms the guarantee

  **Rejected alternatives:**
  - Assume write_text handles it correctly — defensive programming: verify explicitly
  - Text read + encode roundtrip — less direct, harder to detect BOM
  - chardet library for detection — external dependency, unnecessary

  ---

  ### 8. Line Ending Validation: Binary Pattern Check

  **Chosen:** Read file as bytes, check for CRLF and CR patterns

  **Why selected:**
  - Direct binary validation: checks exact byte patterns
  - Explicit about what's validated: no CRLF, no CR (LF-only)
  - No assumptions about system defaults
  - Matches pattern from features 205-206
  - No external dependencies
  - Fast: simple byte-in-bytes checks

  **Implementation:**
  ```python
  def validate_line_endings(filename: str = FILENAME) -> None:
      _logger.debug(f"Validating line endings: {filename}")
      file_path = Path(filename)
      if not file_path.exists():
          raise FileNotFoundError(f"File {filename} does not exist")

      binary_content = file_path.read_bytes()

      if b"\r\n" in binary_content:
          raise ValueError("File contains Windows CRLF (\\r\\n) line endings")

      if b"\r" in binary_content:
          raise ValueError("File contains Mac CR (\\r) line endings")
  ```

  **How pathlib.Path.write_text() ensures LF on Unix:**
  - Python's text mode (default) converts \\n to system line ending
  - On Unix/Linux: \\n stays as LF (0x0A)
  - On Windows: \\n becomes CRLF (0x0D 0x0A)
  - Since we validate after write, we confirm the guarantee
  - This feature runs on Linux (per environment), so LF is guaranteed

  **Rejected alternatives:**
  - Text read + check for \\n — less reliable, text interpretation varies
  - universal_newlines parameter — masks issues, doesn't verify specification
  - dos2unix library — external dependency, not needed

  ---

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib (built-in) | File I/O, path operations | Use | Modern Python 3.4+ standard; write_text() handles UTF-8 and LF cleanly |
  | subprocess (built-in) | Execute git commands | Use | Secure (shell=False), standard library, matches codebase pattern 205-206 |
  | structlog | Logging | Use | Already configured in sheep.observability.logging; provides get_logger() |
  | sheep.observability.logging | Get logger instance | Use | Part of Sheep platform infrastructure; use get_logger(__name__) |
  | GitPython | Git operations (alternative) | Reject | External dependency violates NFR-6; subprocess works well |
  | chardet | Encoding detection (alternative) | Reject | External dependency; simple UTF-8 validation doesn't need detection |
  | NLTK/spacy | NLP sentence detection (alternative) | Reject | External dependencies; simple period counting sufficient |
  | dos2unix | Line ending validation (alternative) | Reject | External dependency; binary validation faster and simpler |

  ---

  ## Security Considerations

  ### 1. Command Injection Prevention

  **Approach:** Use subprocess.run() with shell=False and list-based command syntax

  **Implementation:**
  ```python
  subprocess.run(
      ["git", "add", filename],
      check=True,
      capture_output=True,
      text=True,
  )
  ```

  **Why secure:**
  - shell=False (default) prevents shell interpretation
  - Command arguments passed as list, not string
  - Git command name and arguments are separated
  - User-controlled filename passed as argument, not interpreted by shell
  - Even if filename contains special characters, they're passed literally to git

  **Risk mitigation:** Command injection via malicious filename is impossible with this approach.

  ---

  ### 2. File Encoding/Corruption Prevention

  **Approach:** Validation explicitly checks file content after write

  **Implementation:**
  - verify_file_exists() — confirms file exists
  - validate_encoding() — checks UTF-8 validity and no BOM
  - validate_line_endings() — checks Unix LF format

  **Why secure:**
  - Defensive validation after every operation
  - Detects file system corruption or permission issues
  - Confirms content matches expectations before git operations
  - Each validation is independent and can detect different failure modes

  ---

  ### 3. Error Message Sanitization

  **Approach:** Log detailed errors, but don't expose sensitive paths/data

  **Implementation:**
  - Error messages use relative filenames (test-jkyks3.md, not full paths)
  - Subprocess stderr is captured and logged, but git operations don't return sensitive data
  - Exception messages are clear but don't expose system internals

  **Why secure:**
  - Detailed error messages aid debugging without exposing sensitive information
  - Relative paths prevent leaking filesystem structure
  - Subprocess output is captured, preventing accidental leaks to stdout

  ---

  ## Performance Considerations

  ### 1. File Operations

  **Choice:** pathlib.Path.write_text() with single write

  **Performance implications:**
  - Single write operation: minimal I/O overhead
  - Content size: ~300-400 bytes (small file)
  - No read-modify-write cycle
  - UTF-8 encoding: fast, built-in Python codec

  **Performance:** Negligible impact. File creation is instant (< 1ms).

  ---

  ### 2. Validation Performance

  **Choice:** Sequential validation with early exit on first error

  **Performance breakdown:**
  - verify_file_exists(): stat system call (~1ms)
  - validate_markdown_format(): text read + line split + counting (~1ms)
  - validate_sentence_count(): prose extraction + period counting (~1ms)
  - validate_encoding(): bytes read + BOM check + decode (~2ms)
  - validate_line_endings(): bytes read + pattern searches (~1ms)
  - validate_file_size(): stat system call (~1ms)

  **Total validation time:** ~7ms per file (negligible)

  **Optimization notes:**
  - Could optimize by reading file once, but current approach is clearer and fast enough
  - Early exit on first error prevents unnecessary checks
  - Debug logging uses lazy evaluation

  ---

  ### 3. Git Operations Performance

  **Choice:** subprocess.run() with capture_output

  **Performance implications:**
  - git add: subprocess spawn (~50ms) + git operation (~10ms)
  - git commit: subprocess spawn (~50ms) + git operation (~10ms)
  - git push: subprocess spawn (~50ms) + network I/O (variable, 100-500ms)
  - Total: ~300-700ms typical (dominated by git push network latency)

  **Performance notes:**
  - Network I/O (push) is rate-limiting factor, not implementation choice
  - capture_output doesn't significantly impact performance
  - Sequential operations (add → commit → push) are correct approach

  ---

  ## Architecture Notes

  ### 1. How Feature 207 Fits into Sheep Platform

  **Module Location:** `src/sheep/features/feature_207_markdown_file_creation.py`

  **Integration points:**
  - Logging: imports `sheep.observability.logging.get_logger`
  - Git integration: uses subprocess (no special Sheep tools needed)
  - File I/O: uses standard pathlib (no special Sheep tools needed)
  - Orchestration: main() function follows Sheep module pattern

  **Invocation:** Feature module is called by Sheep workflow orchestration
  - Run via: `python -m sheep.features.feature_207_markdown_file_creation`
  - Or imported and main() called programmatically

  ### 2. Relationship to Features 200-206

  **Pattern compliance:** Feature 207 follows the identical structure as features 205-206:

  - **Module structure:** feature_207_markdown_file_creation.py
  - **Content approach:** Hard-coded deterministic (matches 205-206)
  - **Validation pattern:** Multiple focused functions composed into pipeline
  - **Git operations:** subprocess.run() with shell=False
  - **Error handling:** Fail-fast with clear logging
  - **Main orchestration:** Three phases (create, validate, git operations)

  **Code reusability:**
  - extract_prose_content() and count_sentences() are generic validation helpers
  - validate_markdown_file() pipeline pattern can be extended for future features
  - git_add_file(), git_commit(), git_push() patterns can be copied to other features

  ### 3. No Architectural Debt

  **Clean design:**
  - Single feature module with clear responsibility
  - No modification to existing files needed
  - No new dependencies introduced
  - Follows established patterns exactly (no exceptions/special cases)
  - Validation is comprehensive and testable
  - Error handling is transparent and debuggable

  **Maintainability:**
  - Code is self-documenting (function names clearly describe purpose)
  - Docstrings explain parameters and exceptions
  - Logging at appropriate levels (INFO for major steps, DEBUG for details, ERROR for failures)
  - No magic numbers or implicit assumptions

  ---

