content: |
  ## Problem Statement

  Create a single markdown file named `test-jkyks3.md` in the repository root directory
  containing a markdown H1 title and either 2 or 3 sentences of grammatically correct content
  on any topic. This continues the series of similar file creation tasks implemented in features 200-206,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic file creation
  workflows following established patterns and conventions.

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-jkyks3.md` in the repository root directory
  - **FR-2**: File must contain exactly one valid markdown H1 title (single `#` followed by title text and newline)
  - **FR-3**: File must contain exactly 2 or exactly 3 grammatically complete sentences (each ending with a period)
  - **FR-4**: Sentences must be separated from the title by a blank line and from each other by single spaces or newlines
  - **FR-5**: All file content must follow markdown syntax conventions (valid UTF-8, proper spacing, no syntax errors)
  - **FR-6**: Stage the new file in Git using `git add` with the correct file path
  - **FR-7**: Create a commit with a conventional commit message following the format: `feat(207): [short description]`
  - **FR-8**: Push the commit to the remote branch `feat/207-markdown-file-creation-53da5b` using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors (e.g., GitHub, CommonMark)
  - **NFR-4**: Git commit message must follow conventional commits specification (feat scope, lowercase body)
  - **NFR-5**: Implementation must follow patterns and conventions established in features 200-206 (feature module, validation functions, proper error handling)
  - **NFR-6**: No external dependencies or build steps required beyond existing project infrastructure (Git, file I/O, standard library)
  - **NFR-7**: Implementation should be deterministic; content can be hard-coded for consistency
  - **NFR-8**: File size must be within reasonable range (approximately 250-600 bytes, allowing for variation in sentence length)
  - **NFR-9**: Implementation must include comprehensive validation with clear error messages on failure
  - **NFR-10**: All functions must have proper logging via `sheep.observability.logging.get_logger()`

  ## Success Criteria

  - [ ] File `test-jkyks3.md` exists at repository root after execution
  - [ ] File contains exactly one H1 markdown title at the beginning (pattern: `# [Title Text]`)
  - [ ] File contains exactly 2 or exactly 3 grammatically complete sentences after the title
  - [ ] Each sentence ends with a period and is separated from others by space or newline
  - [ ] No markdown syntax errors in file
  - [ ] File renders correctly when processed by standard markdown tools
  - [ ] File is staged and committed with conventional commit message `feat(207): [description]` (verified by `git log`)
  - [ ] Commit is pushed to remote branch `feat/207-markdown-file-creation-53da5b` (verified by `git branch -r`)
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are LF (no CRLF)
  - [ ] File size is between 200-700 bytes
  - [ ] Implementation uses feature module pattern matching features 200-206
  - [ ] Implementation includes dedicated validation functions (not inline checks)

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root Directory** - Contains markdown files created by feature tasks (200+ test-*.md files plus topic markdown files like ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **src/sheep/** - Main Python package with:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management for LLM providers and settings
    - `flows/` - Flow orchestration for the code implementation pipeline
    - `observability/` - Logging and Langfuse integration for execution tracing
    - `tools/` - Git and file operation tools
    - `cli.py` - CLI entry point for the Sheep platform
  - **src/sheep/features/** - Feature-specific implementation modules (one module per feature, numbered sequentially)
  - **specs/** - Feature specifications in YAML format (207+ specs with auto-generation support)
  - **tests/** - Python test files for validation and integration testing
  - **.github/** - GitHub workflows and CI/CD configuration
  - **Dockerfile** - Docker configuration for containerized execution
  - **pyproject.toml** - Project configuration and dependency specifications (Python 3.11+)

  ### Architecture Patterns

  The Sheep platform uses a **Flow-based architecture** with specialized agents and feature modules:

  1. **Separation of Structure and Intelligence**
     - Flows define execution structure and control paths
     - Crews provide autonomous AI decision-making
     - Each crew is a specialized unit invoked at specific flow steps

  2. **Feature Module Pattern**
     - Each feature has a dedicated Python module (e.g., `feature_207_markdown_file_creation.py`)
     - Modules implement complete workflow: generation, validation, git operations
     - Functions are organized by responsibility: generation, validation, git operations
     - Comprehensive error handling and logging throughout using structured logging
     - Deterministic content generation using hard-coded values for consistency

  3. **Validation-Driven Design**
     - Multiple validation functions for different aspects (file existence, markdown format, encoding, line endings, file size)
     - Clear separation between content generation and validation logic
     - Descriptive error messages for debugging and troubleshooting
     - Return values and exceptions for error propagation

  4. **Git-Integrated Workflows**
     - Automatic branch utilization (created by Sheep platform)
     - Git staging, commit, and push operations via subprocess
     - Conventional commit message format (`feat(N): Description`)
     - Support for git operations with proper error handling

  ### Relevant Technologies

  - **Python** - Primary implementation language (3.11+ required)
  - **Pathlib** - Modern Python file operations with proper encoding handling (built-in)
  - **Git** - Version control and change management (subprocess-based integration)
  - **Markdown** - Documentation format for file content (plain text, no special libraries)
  - **Structlog** - Structured logging framework via `sheep.observability.logging.get_logger()`

  ### Implementation Infrastructure

  - **Logging** - Structured logging via `sheep.observability.logging.get_logger()` with module-level logger instantiation
  - **Pathlib** - Modern Python file operations with proper UTF-8 encoding handling
  - **Subprocess** - Git command execution (`git add`, `git commit`, `git push`) with proper error handling
  - **String Constants** - Feature number, branch name, commit message, file name, and content defined as module constants
  - **Built-in Modules** - No external dependencies required (uses pathlib, subprocess, and string operations)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | This feature creates a markdown file (test-jkyks3.md) directly in the repository root, following the established pattern from 206 previous test markdown files |
  | src/sheep/features/ | High | New feature module (feature_207_markdown_file_creation.py) will be created following the established pattern from features 200-206 |
  | Git Workflow | Medium | New file must be committed with conventional commit message (feat(207): ...) and pushed to remote branch feat/207-markdown-file-creation-53da5b |
  | specs/ | Low | Spec documentation already created; no code changes needed |

  ## Dependencies

  **No external dependencies required beyond existing project infrastructure.** This feature depends on:

  1. **Git** - For committing and pushing the new file (via subprocess)
  2. **File I/O** - Standard file creation and reading via pathlib.Path (built-in)
  3. **Markdown format** - Plain text markdown, no special libraries needed
  4. **Existing repository structure** - Uses established root directory convention
  5. **Logging infrastructure** - Via `sheep.observability.logging.get_logger()`
  6. **Structured Logging** - Via structlog (already configured in project)

  ## Size Estimate

  **S** (Hours) — This is a straightforward file creation task requiring minimal effort.
  The implementation involves:

  1. Create feature module (feature_207_markdown_file_creation.py) following the established pattern from features 200-206
  2. Define hard-coded content: title text and prose content (2-3 sentences)
  3. Implement comprehensive validation functions (file existence, markdown format, sentence count, encoding, line endings, file size)
  4. Implement git operations (add, commit, push) using subprocess
  5. Create main orchestration function coordinating all steps

  No code modification to existing files, no new dependencies, no complex integration.
  Estimated effort: 1-2 hours including testing and validation.

