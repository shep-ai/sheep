openQuestions:
  - question: "Should the implementation use hard-coded deterministic content or allow content variation?"
    resolved: true
    options:
      - option: "Hard-coded deterministic content"
        description: "Content (title and sentences) is identical across all executions. Ensures predictable, reproducible behavior. Simpler implementation. Best for platform reliability testing."
        selected: true
      - option: "Procedurally generated content"
        description: "Content varies by execution (different topics, word choices). More flexible but harder to test. Requires content generation logic. Makes validation more complex."
        selected: false
    selectionRationale: "Hard-coded deterministic content is recommended because NFR-7 explicitly requires deterministic implementation, features 200-206 follow this pattern, and it aligns with the Sheep platform's testing and demonstration goals. Reproducibility is critical for CI/CD validation."
    answer: "Hard-coded deterministic content"

  - question: "How should the feature handle errors during git operations (commit/push failures)?"
    resolved: true
    options:
      - option: "Fail immediately on any git error"
        description: "Raises exception immediately if git add, commit, or push fails. Prevents partial states. Clear failure signal for callers. Simplest implementation. Aligns with platform reliability expectations."
        selected: true
      - option: "Attempt recovery with retry logic"
        description: "Retries failed git operations with exponential backoff. More resilient to transient failures. Adds complexity. Risk of masking real errors. Not needed for deterministic local operations."
        selected: false
    selectionRationale: "Fail immediately on git error is recommended because: (1) file creation and git operations are deterministic on the local system, transient failures are unlikely; (2) git failures indicate real problems (branch issues, auth failures, repo state) that should be visible; (3) simpler implementation aligns with feature scope; (4) matches error handling patterns in features 200-206."
    answer: "Fail immediately on any git error"

  - question: "How should prose sentences be formatted in the markdown file?"
    resolved: true
    options:
      - option: "Single paragraph with space-separated sentences"
        description: "All sentences in one paragraph block. Each sentence separated by a single space. More compact. Easier to read as flowing prose. Simpler to generate and validate. Standard markdown prose style."
        selected: true
      - option: "Multiple lines with newline-separated sentences"
        description: "Each sentence on its own line. More visual separation. Easier to edit individually. Takes more space. Less common for prose paragraphs. Harder to validate line count."
        selected: false
    selectionRationale: "Single paragraph with space-separated sentences is recommended because: (1) FR-4 allows either format, but single paragraph is more natural for prose; (2) matches standard markdown paragraph conventions; (3) simpler validation (validate sentences as strings, not lines); (4) more readable as flowing content; (5) common style in features 200-206."
    answer: "Single paragraph with space-separated sentences"

content: |
  ## Problem Statement

  Create a single markdown file named `test-jkyks3.md` in the repository root directory
  containing a markdown H1 title and exactly 2 or 3 grammatically correct, complete sentences
  on any topic. This feature continues the established series of similar file creation tasks
  (features 200-206), demonstrating the Sheep platform's capability to execute straightforward,
  deterministic file creation workflows with complete validation and git integration.

  The file must include:
  - Exactly one valid markdown H1 title (format: `# Title Text`)
  - Exactly 2 or 3 grammatically complete prose sentences
  - Proper markdown formatting and syntax
  - UTF-8 encoding with LF line endings
  - Git staging, committing, and pushing to the feature branch

  ## Success Criteria

  ### File Creation & Content
  - [ ] File `test-jkyks3.md` exists at repository root after execution
  - [ ] File contains exactly one H1 markdown title at the start (format: `# [Title Text]`)
  - [ ] File contains exactly 2 or exactly 3 grammatically complete sentences after the title
  - [ ] Each sentence ends with a period (.) and is grammatically correct
  - [ ] Title and sentences are separated by a blank line (markdown formatting)
  - [ ] No markdown syntax errors in file content
  - [ ] File renders correctly when processed by standard markdown tools (e.g., GitHub markdown renderer, CommonMark)

  ### Encoding & Format
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are LF (Unix-style `\n`, not CRLF)
  - [ ] File size is between 250-600 bytes (allows variation in sentence length)

  ### Git Operations
  - [ ] File is staged with `git add test-jkyks3.md`
  - [ ] Commit is created with conventional commit message format: `feat(207): [description]`
  - [ ] Commit is pushed to remote branch `feat/207-markdown-file-creation-53da5b`
  - [ ] Git operations verified by `git log` (commit message), `git status` (clean working tree), and `git push` output

  ### Implementation Quality
  - [ ] Implementation uses feature module pattern (separate file: `feature_207_markdown_file_creation.py`)
  - [ ] Content generation and validation logic are in separate functions (not mixed)
  - [ ] Multiple validation functions for different concerns (file existence, content format, encoding, line endings, file size)
  - [ ] All operations logged via `sheep.observability.logging.get_logger()`
  - [ ] Clear error messages provided for validation failures

  ## Functional Requirements

  - **FR-1**: Create file named exactly `test-jkyks3.md` in the repository root directory
  - **FR-2**: File must contain exactly one valid markdown H1 title (single `#` followed by title text and newline)
  - **FR-3**: File must contain exactly 2 or exactly 3 grammatically complete sentences (each ending with a period)
  - **FR-4**: Sentences must be separated from the title by a blank line and from each other by single spaces (within paragraph)
  - **FR-5**: All file content must follow markdown syntax conventions (valid UTF-8, proper spacing, no syntax errors)
  - **FR-6**: Stage the new file in Git using `git add` with the correct file path
  - **FR-7**: Create a commit with a conventional commit message following the format: `feat(207): [short description]`
  - **FR-8**: Push the commit to the remote branch `feat/207-markdown-file-creation-53da5b` using `git push -u origin HEAD`
  - **FR-9**: Implement dedicated validation function(s) to verify all functional requirements before committing
  - **FR-10**: Provide clear error messages with specific details on validation failure

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (verified by reading bytes and checking for BOM markers)
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF) (verified by checking file bytes)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors (GitHub, CommonMark, etc.)
  - **NFR-4**: Git commit message must follow conventional commits specification (feat scope, lowercase body, proper format)
  - **NFR-5**: Implementation must follow patterns and conventions established in features 200-206 (feature module, validation functions, proper error handling)
  - **NFR-6**: No external dependencies or build steps required beyond existing project infrastructure (Git, file I/O, standard library, structlog)
  - **NFR-7**: Implementation must be deterministic; file content must be hard-coded for consistency across executions
  - **NFR-8**: File size should be within reasonable range (approximately 250-600 bytes, depending on sentence/title length)
  - **NFR-9**: Implementation must include comprehensive validation with clear error messages on failure
  - **NFR-10**: All operations must have proper logging via `sheep.observability.logging.get_logger()` at info level
  - **NFR-11**: Implementation must handle git operations with clear error propagation if git commands fail

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content be hard-coded or procedurally generated? | Hard-coded deterministic content | Ensures reproducibility, aligns with NFR-7, matches features 200-206 pattern, critical for CI/CD testing |
  | 2 | How to handle git operation failures? | Fail immediately with clear error | Simpler implementation, prevents partial states, git failures indicate real problems that should be visible |
  | 3 | Format for prose sentences: paragraph or multi-line? | Single paragraph with space-separated sentences | More natural prose style, simpler validation, standard markdown convention, matches feature 200-206 patterns |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | Creates markdown file (test-jkyks3.md) directly in repository root, following established pattern from 200-206 |
  | src/sheep/features/ | High | New feature module (feature_207_markdown_file_creation.py) required, following established pattern |
  | Git Workflow | Medium | File must be staged, committed (conventional commit), and pushed to feature branch |
  | specs/ | Low | Spec documentation complete; no code changes needed |

  ## Dependencies

  **No external dependencies required beyond existing project infrastructure.**

  This feature depends on:

  1. **Git** - For `git add`, `git commit`, `git push` operations (via subprocess)
  2. **File I/O** - Standard file creation and reading via pathlib.Path (built-in Python)
  3. **Markdown format** - Plain text markdown (no special libraries needed)
  4. **Python 3.11+** - Feature module implementation language
  5. **Existing repository structure** - Root directory convention, feature module pattern
  6. **Structlog** - Logging via `sheep.observability.logging.get_logger()` (already configured)
  7. **Established patterns** - from features 200-206 (module structure, validation approach, git operations)

  ## Size Estimate

  **S** (Small - 1-2 hours)

  Straightforward file creation task. Effort breakdown:

  1. Create feature module (`feature_207_markdown_file_creation.py`) following pattern from 200-206 (~15 min)
  2. Define hard-coded content: title and 2-3 sentences (~10 min)
  3. Implement file creation function with proper encoding/line endings (~15 min)
  4. Implement multiple validation functions (file existence, format, encoding, line endings, size) (~20 min)
  5. Implement git operations (add, commit, push) using subprocess (~15 min)
  6. Implement main orchestration function with error handling (~10 min)
  7. Test and validation (~15 min)

  No changes to existing files, no new dependencies, no complex integration.

  ---

  _Requirements phase completed — ready for implementation_
