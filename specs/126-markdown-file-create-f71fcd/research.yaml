# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-20
  - **Status:** Complete

  ## Summary

  Feature 126 is a straightforward content-creation task following the established pattern in create_markdown.py. Research confirms that:

  1. **No new architectural decisions** are needed — this feature reuses the proven pattern
  2. **Python standard library only** — pathlib for file I/O, subprocess for git operations
  3. **Comprehensive validation** is required and already modeled in the reference implementation
  4. **No external dependencies** — the codebase intentionally avoids framework dependencies for simple tasks
  5. **Security is simple** — no user input, no code generation, no injection vectors

  ## Technology Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path(filename).write_text(content, encoding='utf-8')`

  **Rejected:**
  - `os.open()` + `os.write()` — requires manual encoding handling, more verbose
  - `open()` built-in — requires explicit file.close(), less convenient

  **Rationale:** pathlib is the modern Python standard (3.4+) for filesystem operations. The pattern is established in create_markdown.py. Advantages:
  - Automatic encoding handling (UTF-8 explicit)
  - Automatic file closing
  - Clean, readable API
  - Already proven in this codebase

  ### 2. Encoding: UTF-8 without BOM

  **Chosen:** Explicit `encoding='utf-8'` in write_text() call

  **Rejected:**
  - Default encoding (platform-dependent) — risky, could add BOM on Windows
  - Manual encode/decode with error checking — unnecessary complexity

  **Rationale:** pathlib.write_text() with explicit UTF-8 encoding:
  - Never produces BOM (Python's UTF-8 codec excludes BOM by default)
  - Deterministic across platforms (Windows, Linux, macOS)
  - Validated post-creation by reading bytes and checking for `\xef\xbb\xbf`

  ### 3. Line Endings: Unix LF Only

  **Chosen:** Hardcoded prose with Unix LF (`\n`) line endings

  **Rejected:**
  - `os.linesep` or universal newlines mode — platform-dependent, Windows adds CRLF
  - Manual .replace() — unnecessary if content is pre-formatted

  **Rationale:** Repository conventions require Unix LF line endings. Hardcoding `\n` in the Python string:
  - Bypasses platform-specific newline translation
  - Is validated post-creation: `assert b'\r\n' not in binary_content`
  - Matches create_markdown.py pattern

  ### 4. Git Operations: subprocess.run()

  **Chosen:** `subprocess.run(['git', 'add', filename], check=True)` and similar for commit/push

  **Rejected:**
  - GitPython or pygit2 — external dependencies (not allowed per spec)
  - Manual .git directory manipulation — fragile, violates git integrity
  - Shell command string — less safe than list-based subprocess call

  **Rationale:**
  - Subprocess with list-based arguments prevents shell injection
  - No external dependencies required (Python standard library)
  - Transparent — easy to audit what commands are being run
  - Established pattern in create_markdown.py
  - `check=True` raises CalledProcessError on non-zero exit

  ### 5. Content Validation: Multi-Layered

  **Chosen:** Validate encoding, line endings, structure, size, and sentence count

  **Rejected:**
  - No validation — violates NFR-7 and NFR-8
  - Minimal validation (only file exists) — misses structural problems

  **Rationale:** Comprehensive validation ensures:
  - UTF-8 encoding without BOM: `assert not binary_content.startswith(b'\xef\xbb\xbf')`
  - Unix LF only: `assert b'\r\n' not in binary_content`
  - File size 300-600 bytes: matches 2-3 sentences of prose
  - Structure: H1 heading, blank line, prose, sentences
  - Detects subtle platform-specific issues before pushing to git

  ### 6. Error Handling: Try-Except with Descriptive Messages

  **Chosen:** Catch all exceptions in main(), report to stderr, return exit code

  **Rejected:**
  - No error handling — silent failures
  - Only catch specific exceptions — misses git failures or validation errors

  **Rationale:**
  - Try-except-finally ensures cleanup even on failure
  - sys.stderr output for errors enables CI/CD error detection
  - Exit code 0 (success) vs 1 (failure) is standard convention
  - Descriptive error messages aid debugging

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | Filesystem operations | **Use** | Modern, clean API for file creation and reading. No external dependency. |
  | subprocess (stdlib) | Execute git commands | **Use** | Standard way to orchestrate external commands safely. No external dependency. |
  | sys (stdlib) | Exit codes, stderr output | **Use** | Standard library, required for proper error reporting. |
  | GitPython | Git operations via Python API | **Reject** | External dependency not allowed; subprocess is sufficient and more transparent. |
  | pygit2 | Low-level git bindings | **Reject** | External dependency; overkill for simple add/commit/push operations. |

  ## Security Considerations

  ### 1. No User Input

  **Risk Level:** Minimal

  **Analysis:** Content is hardcoded. No user-supplied text, command-line arguments, or environment variables are used in content creation. No injection vectors.

  ### 2. Subprocess Safety

  **Risk Level:** Low

  **Analysis:** git commands are passed as list (not shell string), preventing shell injection. The commands are simple and fixed:
  - `git add test-8bcjbe.md`
  - `git commit --no-verify -m "..."`
  - `git push -u origin HEAD`

  No variable substitution in command strings.

  ### 3. File Operations

  **Risk Level:** Very Low

  **Analysis:**
  - Creating a file in repo root is intentional and specified
  - pathlib.write_text() raises PermissionError if insufficient permissions
  - No recursive directory traversal, no path manipulation

  ### 4. Git State

  **Risk Level:** Low

  **Analysis:**
  - `--no-verify` flag skips pre-commit hooks (intentional for test features)
  - Commit message is hardcoded, no variable substitution
  - Push to origin HEAD is safe (current branch)

  ### 5. Encoding Attacks

  **Risk Level:** Minimal

  **Analysis:** UTF-8 encoding without BOM prevents null-byte injection or encoding-based attacks. Validation confirms no BOM is present.

  ## Performance Implications

  ### File Creation

  **Impact:** Negligible

  - pathlib.write_text() is highly optimized for simple text files
  - ~500 bytes of prose is written in sub-millisecond time
  - No significant I/O overhead for file validation (read_text, read_bytes)

  ### Git Operations

  **Impact:** Negligible

  - git add: ~5-50ms depending on repository size
  - git commit: ~10-50ms (fast for single-file commits)
  - git push: ~100-500ms (network dependent)
  - Total expected time: <2 seconds (meets NFR-6)

  ### Memory

  **Impact:** Minimal

  - Python process memory: ~10-15MB base
  - File content in memory: <1KB
  - No streaming or memory-intensive operations

  ## Architecture Notes

  ### Integration with Sheep Platform

  This feature follows the established Sheep platform patterns:

  1. **Artifact-Based Design:** Each feature produces an artifact (markdown file) in repo root
  2. **Python Automation:** File creation and git operations are automated via Python script
  3. **Standalone Scripts:** Not integrated into a larger codebase; standalone executable
  4. **Deterministic Execution:** No randomness, no external state dependence
  5. **Test-Friendly:** Validation layer enables automated verification

  ### Reusability

  The script pattern is intentionally reusable for similar features:
  - Other markdown files can use the same create_markdown.py template
  - Validation logic is generic (applies to any prose markdown file)
  - Git operations are standard across all features

  ### Code Organization

  Follows create_markdown.py structure:
  ```
  1. Imports (pathlib, subprocess, sys)
  2. Constants (PROSE_CONTENT, FILENAME)
  3. Helper functions (create_markdown_file, validate_file, stage_and_commit, push_to_remote)
  4. Main function (orchestrates all steps)
  5. __main__ guard and error handling
  ```

  This organization is clear, testable, and maintainable.

  ## Related Work & References

  - **Feature 006 (joke-markdown):** Simple markdown creation, established filename conventions
  - **Feature 069 (markdown-file-creation):** Reference implementation in create_markdown.py
  - **Spec Format:** YAML with conventional commit messages, git workflow
  - **Validation Pattern:** Multi-layered checks established in similar features

  ## Risk Assessment

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | File already exists | Low | Overwrite with new content (spec requirement FR-9) |
  | Git failure (uncommitted state) | Low | Pre-check via `git status`, error handling catches git errors |
  | Encoding mismatch | Low | Explicit UTF-8, validation confirms no BOM |
  | Platform-specific line endings | Low | Hardcoded LF, validation confirms no CRLF |
  | Insufficient permissions | Very Low | pathlib.write_text() raises PermissionError (caught and reported) |

  ## Conclusion

  Feature 126 implementation should follow the create_markdown.py pattern exactly. No architectural changes, no new dependencies, no novel technical decisions required. The pattern is proven, tested, and integrated into the Sheep platform workflows.

  **Recommendation:** Proceed with implementation using the established reusable Python script pattern.
