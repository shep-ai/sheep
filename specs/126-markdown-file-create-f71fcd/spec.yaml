content: |
  ## Problem Statement

  The user wants a simple markdown file created at the repository root with the filename `test-8bcjbe.md`. The file should contain a title (H1 heading) and 2-3 sentences of content about any topic. This is a content-only task with no code changes, architecture decisions, or complex integrations required.

  ## Functional Requirements

  - **FR-1**: The system must create a file named `test-8bcjbe.md` in the repository root
  - **FR-2**: The file must contain a valid markdown H1 heading (single `#` followed by text) as the first line
  - **FR-3**: The file must contain 2-3 sentences of prose content after the heading, separated by a blank line
  - **FR-4**: The file content can be about any topic with no restrictions on subject matter
  - **FR-5**: The created file must be staged using `git add test-8bcjbe.md`
  - **FR-6**: The staged file must be committed with a conventional commit message: `feat(126): create markdown file test-8bcjbe.md with prose content`
  - **FR-7**: The commit must be pushed to the remote origin branch
  - **FR-8**: No existing files in the repository must be modified or deleted by this operation
  - **FR-9**: If the file already exists, the operation must safely handle the conflict (overwrite with new content or report error)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File line endings must be Unix-style LF only (not Windows CRLF, not mixed)
  - **NFR-3**: File must end with a single trailing newline character (POSIX convention)
  - **NFR-4**: File must be valid markdown that renders correctly on GitHub without syntax errors
  - **NFR-5**: Implementation must follow the established pattern and conventions demonstrated in `create_markdown.py`
  - **NFR-6**: File creation and git operations must complete in under 2 seconds (near-instantaneous)
  - **NFR-7**: Implementation must use Python standard library only (`pathlib.Path`, `subprocess`) with no external dependencies
  - **NFR-8**: Error handling must catch and report all exceptions with meaningful messages (file I/O errors, git failures, etc.)
  - **NFR-9**: Created file must be approximately 300-600 bytes (reasonable prose length for 2-3 sentences)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | --------- | --------- |
  | 1 | Should the implementation use a reusable Python script pattern or a minimal one-off approach? | Reusable Python Script | Follows established pattern in create_markdown.py, enables automation and testing, provides consistency, minimal effort difference, sets precedent for future tasks |

  ## Codebase Analysis

  ### Project Structure

  The repository is a demonstration/testing environment for the **Sheep** agentic platform, which automates code implementation tasks using CrewAI and LLM agents. The structure is:

  ```
  repo-root/
  ├── specs/                    # Feature specifications organized by number-name
  │   ├── 006-joke-markdown/
  │   ├── 007-joke-markdown-2/
  │   └── ...                   # Similar pattern for all features
  ├── tests/                    # Pytest test files for validation
  ├── create_markdown.py        # Reference script for markdown file creation
  ├── create_test_*.py          # Various test/script implementations
  ├── README.md                 # Project documentation
  ├── pyproject.toml            # Python project metadata
  ├── Dockerfile                # Container configuration
  └── [many .md files]          # Generated markdown artifacts
  ```

  ### Architecture Patterns

  1. **Feature Implementation Pattern**: Each feature (identified by number) results in a new artifact (usually a markdown file) in the repo root
  2. **Specifications First**: Features are defined in YAML specs before implementation, stored in `specs/{number}-{name}/spec.yaml`
  3. **Python-Based Automation**: File creation, validation, and git operations are handled by Python scripts (not by code generation within a larger codebase)
  4. **Git Workflow**: Files are created, validated, staged with `git add`, committed with conventional messages, and pushed to origin
  5. **Validation Layer**: Created files are validated for correct format (UTF-8 encoding, LF line endings, markdown structure) before committing

  ### Relevant Technologies

  - **Python 3.11+**: Standard file I/O operations using `pathlib.Path`
  - **Markdown**: Plain text markdown format for file content
  - **Git**: Version control operations (add, commit, push)
  - **Conventional Commits**: Commit message format follows pattern `feat({number}): {description}`

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root | Low | Adding a single new markdown file to the repository root |
  | git history | Low | Creating one new commit with a conventional commit message |
  | specs/126-markdown-file-create-f71fcd/ | Medium | This spec file itself documents the feature and success criteria |

  ## Dependencies

  - **No code dependencies**: This is a pure file creation task with no dependencies on existing code or libraries
  - **External**: git binary (for git operations)
  - **Python standard library**: `pathlib.Path` for file I/O, `subprocess` for git commands
  - **Pattern reference**: The implementation should follow the pattern established in `create_markdown.py` (feature 069 equivalent)

  ## Success Criteria

  ### File Creation & Content
  - [ ] File `test-8bcjbe.md` exists at repository root (verified via `ls` or `Path.exists()`)
  - [ ] File is readable as UTF-8 without decoding errors
  - [ ] First line of file is a valid markdown H1 heading matching pattern `# .*`
  - [ ] File contains exactly 2-3 grammatically correct sentences after the heading
  - [ ] Content is prose (natural language sentences, not code or lists)
  - [ ] File size is between 300-600 bytes (reasonable for specified content)

  ### File Format & Encoding
  - [ ] File uses UTF-8 encoding without BOM prefix
  - [ ] File uses only Unix-style LF line endings (`\n`, not `\r\n`)
  - [ ] File ends with exactly one trailing newline character (verified via hex dump or binary inspection)
  - [ ] No trailing whitespace on any line

  ### Markdown Validity
  - [ ] File renders without syntax errors on GitHub
  - [ ] Markdown structure is valid: H1 heading, blank line, prose content
  - [ ] No unclosed or unmatched markdown syntax (brackets, asterisks, etc.)

  ### Git Operations
  - [ ] File is staged in git index via `git add test-8bcjbe.md`
  - [ ] Commit message exactly matches: `feat(126): create markdown file test-8bcjbe.md with prose content`
  - [ ] Commit author and timestamp are recorded correctly
  - [ ] Commit is pushed to origin branch (verified via `git log origin/...`)

  ### Safety & Integrity
  - [ ] No existing files are modified (verified via `git status`)
  - [ ] No files are deleted
  - [ ] Repository is in clean state after operation (no uncommitted changes aside from this feature)

  ## Implementation Notes

  Based on the established pattern in `create_markdown.py`:

  1. **File Creation**: Use `pathlib.Path(filename).write_text(content, encoding='utf-8')`
  2. **Content Structure**: H1 heading + blank line + 2-3 sentences (prose about any topic)
  3. **Validation**: Check UTF-8 encoding, LF line endings, file size (~300-600 bytes), and structure
  4. **Git Operations**: Use subprocess to run `git add`, `git commit --no-verify`, and `git push`
  5. **Error Handling**: Use try-except to catch and report any errors during creation or git operations

  ## Size Estimate

  **S** (Small — hours of work)

  **Justification**:
  - Single file creation with hardcoded content
  - No code changes, no tests, no integration complexity
  - Straightforward file I/O and git operations
  - Well-established pattern from previous similar features (006, 069, etc.)
  - Estimated effort: < 1 hour for implementation and validation
