content: |
  ## Architecture Overview

  Feature 126 follows the Sheep platform's established pattern for artifact creation: a standalone
  Python script orchestrates file generation, validation, and git integration. The script is
  independent, deterministic, reusable, and requires no external dependencies or architectural
  changes to the codebase.

  The implementation reuses proven patterns from create_markdown.py:

  1. **File I/O**: pathlib.Path.write_text() with explicit UTF-8 encoding
  2. **Validation**: Multi-layered checks for encoding, line endings, structure, and size
  3. **Git Integration**: subprocess.run() for add, commit, and push operations
  4. **Error Handling**: Try-except with descriptive messages and proper exit codes

  This approach integrates naturally with existing git workflows and provides high confidence
  that the created file meets all specifications.

  ## Key Design Decisions

  ### Decision 1: File I/O Approach (pathlib.Path.write_text)

  **Chosen**: pathlib.Path(filename).write_text(content, encoding='utf-8')

  **Alternatives Considered**:
  - os.open() + os.write(): More verbose, requires manual encoding handling, error-prone
  - open() built-in: Works but requires explicit close(), less convenient

  **Rationale**: pathlib is the modern Python standard (3.4+) for filesystem operations.
  Automatic encoding handling, automatic file closing, and clean API reduce complexity.
  The pattern is established in create_markdown.py and aligns with current Python best
  practices. This ensures code clarity and reduces likelihood of file handling errors.

  ### Decision 2: Encoding Strategy (Explicit UTF-8, No BOM)

  **Chosen**: Explicit encoding='utf-8' parameter in write_text()

  **Alternatives Considered**:
  - Default platform encoding: Risky on Windows, could add BOM
  - Manual encode/decode: Unnecessary complexity, harder to maintain

  **Rationale**: Python's UTF-8 codec never produces BOM when explicitly specified.
  Explicit encoding ensures deterministic behavior across platforms (Windows, Linux, macOS).
  Post-creation validation confirms no BOM by checking for byte sequence \\xef\\xbb\\xbf.
  This guarantees compliance with non-functional requirement NFR-1.

  ### Decision 3: Line Endings (Hardcoded Unix LF)

  **Chosen**: Hardcode prose with Unix LF (\\n) line endings

  **Alternatives Considered**:
  - os.linesep or universal newlines: Platform-dependent, Windows adds CRLF
  - Manual .replace(): Unnecessary if content is pre-formatted

  **Rationale**: Repository conventions require Unix LF line endings. Hardcoding \\n in
  Python strings bypasses platform-specific translation. Post-creation validation confirms
  no CRLF sequences present. This guarantees compliance with NFR-2 on any platform.

  ### Decision 4: Git Operations (subprocess.run)

  **Chosen**: subprocess.run(['git', 'add', filename], check=True) for git commands

  **Alternatives Considered**:
  - GitPython library: Adds external dependency (not allowed per spec)
  - pygit2: Lower-level, adds dependency, overkill for simple operations
  - Manual .git manipulation: Fragile, violates git integrity

  **Rationale**: subprocess with list-based arguments (not shell strings) prevents shell
  injection. Uses Python standard library only—no external dependencies. Commands are
  transparent and auditable. check=True raises CalledProcessError on non-zero exit.
  This pattern is proven in create_markdown.py.

  ### Decision 5: Content Validation (Multi-Layered Checks)

  **Chosen**: Validate encoding, line endings, structure, size, and sentence count

  **Alternatives Considered**:
  - No validation: Violates NFR-7 and NFR-8
  - Minimal validation: Misses structural and encoding problems

  **Rationale**: Comprehensive validation ensures all non-functional requirements are
  satisfied. Checks UTF-8 (no BOM), Unix LF only, H1 heading, blank line, prose,
  sentence count, and file size. This catches subtle platform-specific issues before
  pushing to git. Required by spec non-functional requirements and demonstrated in research.

  ### Decision 6: Error Handling (Try-Except with Descriptive Messages)

  **Chosen**: Catch all exceptions in main(), report to stderr, return exit codes

  **Alternatives Considered**:
  - No error handling: Silent failures, hard to debug
  - Minimal error handling: Misses git or validation failures

  **Rationale**: Comprehensive error handling ensures cleanup even on failure. Errors
  reported to sys.stderr enable CI/CD error detection. Exit code 0 (success) vs 1 (failure)
  follows standard convention. Descriptive messages aid debugging. This approach is
  demonstrated in create_markdown.py and required by NFR-8.

  ## Implementation Strategy

  **Phase 1 (Script Development)** builds the Python script following create_markdown.py.
  Each function is developed using TDD: write test first (RED), implement minimal code (GREEN),
  refactor for clarity. Functions are ordered by dependency: basic file creation and validation
  before git operations, all building toward main orchestration.

  **Phase 2 (Execution & Validation)** runs the complete script to generate test-8bcjbe.md.
  After execution, comprehensive validation confirms all requirements are met: encoding, line
  endings, structure, size, markdown validity. This phase provides confidence before committing.

  **Phase 3 (Finalization)** verifies git operations succeeded: file is staged, commit message
  is correct, push to origin completed. Repository state is confirmed clean.

  This ordering ensures the script is solid before execution, execution produces a validated
  artifact, and final verification confirms success.

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | File test-8bcjbe.md already exists | Low | Script overwrites with new content (FR-9); validation confirms content |
  | Git operations fail (uncommitted state) | Low | Pre-flight check via git status; subprocess check=True raises on error |
  | Platform adds CRLF line endings | Low | Hardcoded LF in Python strings; validation confirms no CRLF |
  | Encoding mismatch (not UTF-8) | Low | Explicit encoding='utf-8'; validation checks for absence of BOM |
  | Insufficient file permissions | Very Low | pathlib.write_text() raises PermissionError; caught and reported |
  | git binary not in PATH | Low | subprocess.run() raises FileNotFoundError; caught with helpful message |
