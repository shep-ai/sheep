tasks:
  - id: task-1
    phaseId: phase-1
    title: "Generate markdown content via Claude API"
    description: >
      Call content_generators.generate_markdown_content() to produce H1 heading + blank line +
      2-3 sentences of prose using Claude 3.5 Sonnet via CrewAI. This is the foundation for
      all subsequent file creation and validation. LLM generates diverse, high-quality prose
      matching the quality standard demonstrated in 270+ prior test files.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - "Generated content is not empty and is a string"
      - "Content contains exactly one H1 markdown heading (# ...)"
      - "Heading is on the first line"
      - "Content contains 2-3 sentences after the heading"
      - "Content structure matches pattern: heading + blank line + prose"
    tdd:
      red:
        - "Assert generated content is not empty"
        - "Assert content starts with H1 heading pattern (# ...)"
        - "Assert content contains at least 2 sentences and at most 3 sentences"
      green:
        - "Call content_generators.generate_markdown_content()"
        - "Receive generated content string from function"
        - "Verify content matches expected structure"
      refactor:
        - "Log generated content to debug output for inspection"
        - "Count sentences in generated content for verification"
        - "Document the topic chosen by LLM for context"
    estimatedEffort: "5-10 min"

  - id: task-2
    phaseId: phase-2
    title: "Write file to disk with UTF-8 encoding and validate format"
    description: >
      Write generated markdown content to test-y1zgop.md at repository root using
      content_generators.write_markdown_file() with UTF-8 encoding and Unix LF line endings.
      Immediately validate using content_generators.validate_markdown_file() to catch format
      errors before committing. Validation checks: UTF-8 encoding (no BOM), Unix LF line endings,
      H1 heading presence, blank line separator, 2-3 sentence count, trailing newline.
    state: Todo
    dependencies:
      - task-1
    acceptanceCriteria:
      - "File test-y1zgop.md exists at repository root"
      - "File size is between 250-600 bytes"
      - "File contents match generated content exactly"
      - "File encoding is UTF-8 without BOM"
      - "File uses Unix LF line endings (not CRLF)"
      - "Validation function returns success status"
      - "H1 heading is on first line, blank line on second, prose follows"
    tdd:
      red:
        - "Assert test-y1zgop.md does not exist before write"
        - "Assert validation will pass after write"
        - "Assert file size is in expected range (250-600 bytes)"
      green:
        - "Call content_generators.write_markdown_file() with filename and content"
        - "Verify file is created at repository root"
        - "Call content_generators.validate_markdown_file() to verify format"
        - "Capture validation results and verify all checks pass"
      refactor:
        - "Check file permissions match expected defaults (0o644)"
        - "Verify byte count is reasonable for content structure"
        - "Log file creation success with byte count"
    estimatedEffort: "2-3 min"

  - id: task-3
