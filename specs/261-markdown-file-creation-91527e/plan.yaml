# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 261 creates a simple test markdown file following the well-established pattern from features
  151-260 (260+ precedent implementations). The implementation fits seamlessly into the Sheep project's
  automated testing framework, where markdown files in the repository root serve as validation artifacts
  demonstrating the system's ability to create properly formatted, meaningful content with correct
  encoding and git integration.

  **Pattern Context:**
  - 260+ existing test-*.md files in repository root provide clear precedent and validation
  - Features 151-260 demonstrate identical approach with proven success
  - Feature 260 (immediately preceding) validates all technology decisions
  - Spec and research phases have identified no novel technical challenges
  - Implementation requires only Python standard library (pathlib, subprocess) with no external dependencies

  **Integration Points:**
  - File creation uses Python pathlib.Path.write_text() — standard approach for all existing test files
  - Git integration uses subprocess.run() with check=True — consistent with git workflow in src/create_markdown.py
  - Naming convention test-m6or7y.md matches established pattern (test-RANDOMID.md)
  - Follows canonical markdown structure: H1 heading + blank line + prose + final newline
  - Uses conventional commit format matching features 257-260 and codebase standards

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use `Path("test-m6or7y.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:**
  - **Idiomatic Python**: Standard approach since Python 3.4, best practice in 3.6+
  - **Cross-platform safety**: pathlib.Path abstracts platform-specific path syntax
  - **Encoding control**: Explicit encoding="utf-8" ensures consistency across Windows/macOS/Linux
  - **Line ending enforcement**: newline="\n" disables automatic platform conversion, guarantees Unix LF
  - **Atomic writes**: Failure during write doesn't create partial files on disk
  - **Precedent validation**: Used in all 260+ existing test file implementations
  - **Reference implementation**: src/create_markdown.py uses this exact pattern

  **Rejected alternatives:**
  - open() context manager — more verbose, manual mode/buffering configuration, less safe
  - os.open() with file descriptors — overly complex, lacks built-in encoding support
  - Shell-based write operations — unsafe (no shell injection protection), less portable

  ### 2. Git Integration: subprocess.run() with check=True

  **Decision:** Use subprocess.run([cmd, args...], check=True) for all git operations

  **Rationale:**
  - **Standard library**: Part of Python 3.5+, no external dependency requirements
  - **Deterministic error handling**: check=True raises CalledProcessError on failure, making errors explicit
  - **Command injection prevention**: List arguments prevent shell injection attacks (never use shell=True)
  - **Standard approach**: Used in all 260+ precedent implementations, confirmed in feature 260 research
  - **Clean error messages**: Subprocess errors provide clear diagnostics for troubleshooting

  **Rejected alternatives:**
  - GitPython library — external dependency (violates NFR-9), unnecessary for simple operations
  - Direct shell subprocess with shell=True — security risk (command injection), non-portable
  - os.system() — deprecated, no structured error handling

  ### 3. Content Structure: f-String Formatting

  **Decision:** Use f-string template: `f"# {TITLE}\n\n{PROSE}\n"` where TITLE and PROSE are variables

  **Rationale:**
  - **Readable and idiomatic**: f-strings (Python 3.6+) are most readable string interpolation method
  - **Explicit control**: Blank line structure is clear (newline-newline between heading and prose)
  - **Separation of concerns**: TITLE and PROSE are distinct variables, making content modular
  - **Produces correct format**: Yields H1 heading, blank line, prose content, trailing newline
  - **Matched precedents**: All 260+ test files use this structure, confirmed in feature 260 research

  **Rejected alternatives:**
  - Template engines (Jinja2) — unnecessary complexity for simple substitution
  - Hardcoded single string — inflexible, poor separation of components
  - Legacy % or .format() — less readable than f-strings

  ### 4. Prose Content: Manually Authored

  **Decision:** Author 2-3 sentences of clear, informative English prose on topic of choice

  **Rationale:**
  - **Specification requirement**: FR-4 and NFR-2 require "exactly 2-3 sentences of coherent English prose" that is "grammatically correct and coherent"
  - **Validation artifact**: Test files demonstrate prose generation capability, not throwaway content
  - **Quality assurance**: Human-authored prose meets coherence and grammar standards automatically
  - **Established pattern**: All 260+ precedent test files use authored prose
  - **Flexibility**: Any topic permitted per feature spec, maximizing content variety and automation autonomy

  **Rejected alternatives:**
  - Generated/synthetic prose (Lorem Ipsum, algorithmic text) — violates NFR-2 coherence requirement
  - Single sentence or minimal content — violates FR-4 (2-3 sentence requirement)
  - Repetitive boilerplate — lacks variety, doesn't validate prose quality

  ### 5. Title Strategy: Descriptive Title

  **Decision:** Create meaningful H1 title that describes the prose content topic

  **Rationale:**
  - **Documentation best practice**: Meaningful titles improve file clarity and searchability
  - **Resolved product question**: Research identified "Descriptive title" as recommended approach
  - **Quality enhancement**: Makes files more meaningful and useful as validation artifacts
  - **Consistency**: All 260+ existing test files use descriptive topic titles

  ### 6. Character Encoding: UTF-8 without BOM

  **Decision:** Explicit encoding="utf-8" parameter in write_text() with no manual BOM handling

  **Rationale:**
  - **Cross-platform consistency**: Explicit UTF-8 works on Windows, macOS, Linux regardless of system locale
  - **BOM not required**: pathlib.write_text(encoding="utf-8") never adds BOM, only content bytes
  - **Git compatibility**: Git prefers UTF-8 for text files in version control
  - **Established pattern**: All 260+ test files use UTF-8 encoding

  ## Implementation Strategy

  **Phase 1 (File Creation):** Focuses on creating the markdown file with all requirements met.
  - Compose prose content: 2-3 sentences of clear, informative English on chosen topic
  - Create markdown structure: H1 title + blank line + prose + trailing newline
  - Write file using pathlib with explicit UTF-8 encoding and Unix LF line endings
  - Validate file content against spec requirements before proceeding to phase 2

  **Phase 2 (Git Integration):** Integrates the file into version control following conventions.
  - Stage file using git add test-m6or7y.md
  - Commit with conventional message: feat(261): Create markdown file test-m6or7y.md with prose content
  - Push to feature branch using git push -u origin HEAD (sets upstream tracking for CI/CD)
  - Verify all git operations complete successfully

  **Rationale for Sequencing:**
  - Phase 1 must complete before Phase 2 (file must exist to stage and commit it)
  - File validation at end of Phase 1 catches encoding/line ending issues before git integration
  - Git operations in Phase 2 follow natural workflow order: add → commit → push

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Git configuration missing (user.name, user.email not set) | Feature spec assumes properly configured environment; if missing, git produces clear error guiding user to fix configuration. No pre-validation overhead needed. |
  | File already exists (collision on feature branch) | Feature branch is isolated; filename (test-m6or7y.md) is unique to feature 261. On clean branch, collision cannot occur. pathlib.write_text() will overwrite if file exists (safe fallback). |
  | Line endings incorrect (CRLF instead of LF on Windows) | Explicit newline="\n" parameter disables platform normalization and writes literal LF bytes. Guaranteed consistency across all platforms. |
  | Encoding error (non-ASCII characters or incorrect encoding) | Feature spec permits only ASCII and valid UTF-8. Prose content must be grammatically correct English (ASCII subset). UTF-8 encoding in pathlib.write_text() handles all valid characters correctly. |
  | Prose incoherent or grammatically incorrect | Feature spec (NFR-2) requires coherent, grammatically correct prose. Manual authorship ensures quality. Any prose review/validation happens during task 1. |
  | Git push fails (authentication, network, remote branch) | check=True in subprocess will raise CalledProcessError with clear message. Feature spec assumes configured git environment (standard for CI/CD). User can debug and retry. |
  | File content doesn't match spec requirements | Validation in Phase 1 task acceptance criteria checks all requirements: file exists, H1 heading present, blank line exists, 2-3 sentences of prose, UTF-8 encoding, LF line endings. Any mismatch detected before commit. |

  ## Summary

  Feature 261 requires straightforward implementation of a well-established pattern. All technology decisions
  are proven through 260+ precedent implementations. The two-phase approach (file creation → git integration)
  ensures proper sequencing with validation checkpoints. No novel technical challenges or architectural
  decisions required. Minimal risk profile with clear mitigation strategies.
