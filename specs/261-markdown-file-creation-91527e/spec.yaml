content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-m6or7y.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-260,
  with 260+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository demonstrates a clear modular architecture designed for automated code implementation:

  ```
  Repository Root
  ├── src/
  │   ├── create_markdown.py        # Content generation and git integration module
  │   └── sheep/                     # Main package for agentic platform
  │       ├── config/                # Configuration management (LLM setup)
  │       ├── flows/                 # High-level workflow orchestration
  │       ├── crews/                 # Agent teams (specialized intelligence)
  │       └── observability/         # Logging and tracing infrastructure
  ├── specs/                         # Feature specifications (151-261)
  │   ├── 260-markdown-file-creation-71c13a/  # Previous feature
  │   └── 261-markdown-file-creation-91527e/  # Current feature (this spec)
  ├── test-*.md files                # 260+ existing test markdown files
  ├── *.md files                     # Documentation (README, design docs, etc.)
  ├── Dockerfile                     # Container configuration
  ├── .env.example                   # Environment template
  └── .gitignore                     # Git exclusion rules
  ```

  The repository follows a monolithic structure with the Sheep platform code in `src/sheep/` and test files
  created in the repository root directory. Each feature (151-261) has a dedicated spec directory documenting
  requirements, analysis, and implementation notes.

  ### Architecture Patterns

  **Multi-Agent Agentic System**: Sheep implements a multi-LLM, multi-agent architecture using CrewAI for
  orchestration. The system follows a structured flow:
  1. **Research phase** - Analyze repository structure and patterns
  2. **Implementation phase** - Execute changes following conventions
  3. **Review phase** - Self-review for quality
  4. **Push phase** - Commit and push to remote

  **Modular Design**: Code is organized by concern:
  - `flows/` orchestrates high-level workflows
  - `crews/` define specialized agent teams with specific skills
  - `config/` manages LLM provider configuration (OpenAI, Anthropic, Google)
  - `observability/` provides logging and Langfuse tracing

  **Convention-Based Development**: The codebase follows established conventions:
  - File naming: test-{randomId}.md for test files
  - Markdown format: H1 heading + blank line + 2-3 sentences of prose
  - Git workflow: feature branches, conventional commits (feat/fix/docs prefix)
  - Encoding: UTF-8 without BOM, LF line endings

  ### Relevant Technologies

  **Python 3.11+**: The entire codebase is written in Python 3.11 or later, leveraging:
  - `pathlib` for cross-platform file I/O operations
  - `subprocess` for executing git commands
  - Standard library utilities (no external file handling dependencies required)

  **CrewAI**: An agent orchestration framework that manages multi-agent workflows with defined roles,
  goals, and task definitions. Integrates with multiple LLM providers.

  **LLM Providers**: The system supports multiple LLM backends through a unified interface:
  - Anthropic Claude (via `sheep.config.llm.get_reasoning_llm()`)
  - OpenAI GPT models
  - Google Gemini
  - Supports both standard and reasoning models for complex tasks

  **Git Version Control**: Full git integration through subprocess:
  - Creating branches and worktrees
  - Staging files with `git add`
  - Creating conventional commits
  - Pushing to remote repositories

  **Markdown Format**: Simple, standardized markdown format:
  - H1 headings (single `#` prefix)
  - UTF-8 encoding (no special characters beyond ASCII)
  - Unix line endings (LF, not CRLF)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 260+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-260; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | specs/ Directory | Low | Spec documentation (this file) updated during analysis phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/261-markdown-file-creation-91527e` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages required)
  - Git configuration with user.name and user.email set for commits
  - Unix shell environment for git operations (available in current environment)

  **Reference/Precedent:**
  - 260+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-260) demonstrate successful execution of identical pattern
  - Features 151-260 specs provide exact templates and working examples
  - `src/create_markdown.py` provides reference implementation for content generation and git integration
  - Recent markdown files (test-ynmdu9.md, acoustic-engineering-590ixe.md) show concrete examples of the format

  **Not Required:**
  - No source code dependencies beyond standard library
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory
  - No interaction with the CrewAI orchestration system (this is a direct file creation task)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 260+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-260) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Straightforward content generation without complex business logic
  - No need for code review or architectural approval (follows established pattern)

  ---

  **Analysis phase complete — ready for implementation planning**
