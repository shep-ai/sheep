content: |
  ## Summary

  This feature implements a complete workflow for creating a single markdown file with AI-generated content.

  **Phase 1: Content Generation (4-5 min)** — Call Claude API with coordinated prompt to generate title and prose. Single API call ensures thematic relationship between both components. Prose is validated to contain exactly 2-3 sentences.

  **Phase 2: File Creation (2 min)** — Write markdown file using pathlib with explicit UTF-8 encoding and Unix LF line endings. File structure: H1 heading, blank line, prose content. Verify file exists and is readable.

  **Phase 3: Validation (3 min)** — Comprehensive validation before commit. Checks: markdown syntax (H1 format), sentence count (2-3), encoding (UTF-8 no BOM), line endings (LF only), file size (250-600 bytes). Each validation is independent; any failure raises exception to prevent bad commits.

  **Phase 4: Git Integration (3-5 min)** — Stage file, commit with conventional message format, push to feature branch. All operations use subprocess.run() with safe argument list format. Only proceeds if validation passed.

  **Total: 12-17 minutes** (comfortably within S size estimate of 10-15 minutes).

  This implementation follows the established pattern from features 150-197 with zero modifications to source code or project structure.
