# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24
  - **Status:** Complete

  ## Executive Summary

  This feature creates a single markdown file (`test-l5g799.md`) in the repository root following the established pattern from 198+ existing test files (features 150-197). Implementation requires:

  1. **Content Generation**: Single Claude API call to generate thematically-related title and 2-3 sentence prose
  2. **File I/O**: pathlib.Path with explicit UTF-8 encoding and Unix LF line endings
  3. **Validation**: Comprehensive regex-based validation (markdown syntax, sentence count, encoding, line endings, file size)
  4. **Git Workflow**: Standard subprocess-based git operations (add, commit, push)

  No external dependencies beyond project baseline (Anthropic SDK already available). Estimated 10-15 minutes implementation time. Zero risk to existing codebase (creates single new file only).

  ## Technology Decisions

  ### 1. Content Generation: Claude API

  **Chosen:** Anthropic Claude API via anthropic-sdk-python (already integrated)

  **Rejected:**
  - OpenAI API (ChatGPT) — Project uses Anthropic SDKs; would introduce dependency inconsistency
  - Template-based prose — Spec rejects as low-quality and repetitive
  - Random/Lorem Ipsum text — Fails quality standards and doesn't demonstrate platform capabilities

  **Rationale:** Feature spec explicitly requires AI-generated prose. Anthropic SDK is already integrated in project (referenced in crewaiwrapper.py and llm.py configuration). Claude excels at generating coherent, meaningful prose on arbitrary topics in single API call. Efficient for this small feature.

  **Implementation Detail:** Single API call with prompt structure: generate markdown with `# Title` heading, blank line, then 2-3 sentences of prose on related topic. Response parsing extracts title and prose separately.

  ### 2. File I/O: pathlib.Path (standard library)

  **Chosen:** Python pathlib.Path for cross-platform file operations

  **Rejected:**
  - os.open() + os.write() — Lower-level, verbose, requires manual encoding
  - open() builtin — Works but pathlib is modern standard with better encoding support

  **Rationale:** pathlib.Path is standard Python since 3.4, provides clean API with encoding and newline parameters (critical for UTF-8 with LF requirement). Cross-platform path handling. Likely already used in codebase. Method: `Path('.').joinpath('test-l5g799.md').write_text(content, encoding='utf-8', newline='\n')`.

  **Validation Consideration:** After writing, validation must read file in binary mode to verify actual bytes contain correct encoding and line endings.

  ### 3. Line Endings: Explicit Unix LF via newline parameter

  **Chosen:** `newline='\n'` parameter in Path.write_text()

  **Rejected:**
  - Platform defaults — Would produce CRLF on Windows, violating spec
  - Post-processing with sed/tr — Adds complexity, error surface, performance overhead

  **Rationale:** Success criteria explicitly requires Unix LF line endings. Python's pathlib.write_text() accepts newline parameter. Setting `newline='\n'` enforces LF on all platforms. No performance overhead. Validation must verify actual bytes (0x0A not 0x0D0x0A).

  ### 4. Encoding: UTF-8 without BOM via explicit parameter

  **Chosen:** `encoding='utf-8'` in Path.write_text()

  **Rejected:**
  - Default system encoding — Platform-dependent, may include BOM
  - Manual byte encoding — Unnecessarily complex

  **Rationale:** Success criteria requires UTF-8 without BOM. Python's write_text(encoding='utf-8') produces UTF-8 without BOM (correct behavior since Python 3.x). Explicit parameter for clarity and to prevent accidental BOM introduction. Validation reads file bytes to confirm no UTF-8 BOM (0xEFBBBF).

  ### 5. Validation: Comprehensive multi-stage approach

  **Chosen:** Four validation stages before commit:
  1. **Markdown syntax** — Verify `# Title` format on first line
  2. **Sentence count** — Regex-based detection of exactly 2-3 sentences (terminal punctuation: . ! ?)
  3. **Encoding/Line endings** — Read file bytes, verify UTF-8 (no BOM) and LF-only line endings
  4. **File size** — Verify 250-600 byte range (typical for this pattern)

  **Rejected:**
  - Minimal validation — Allows invalid content through; increases rework
  - No validation — Highest risk; contradicts quality standards from features 150-197

  **Rationale:** Spec explicitly requires comprehensive validation. Catches errors early, prevents commits of invalid content. Requires 2-3 minutes but prevents rework. Quality standards from precedent features 150-197 demand this level of verification.

  **Implementation:**
  - Markdown check: regex `^#\s+\w+` on first line
  - Sentence detection: regex `[.!?](?:\s|$)` with abbreviation filtering (exclude Mr., Dr., etc.)
  - Encoding: read file as bytes, check for UTF-8 BOM marker (0xEFBBBF), verify no CRLF (0x0D)
  - Size: `len(content.encode('utf-8'))` must be 250-600 bytes

  ### 6. Sentence Detection: Regex with abbreviation handling

  **Chosen:** Regular expression pattern for terminal punctuation with abbreviation filtering

  **Rejected:**
  - NLTK library — External 30MB dependency, overkill for simple validation
  - spaCy — Another NLP library, requires model downloads
  - Naive period counting — Fails on abbreviations (Mr., Dr., etc.)

  **Rationale:** Feature requires exactly 2-3 sentences. Python re module (standard library) sufficient. Pattern to count sentence-final punctuation: `[.!?](?:\s|$)` detects . ! ? followed by space or end-of-line. Filter out common abbreviations by excluding periods preceded by single uppercase letter. Zero external dependencies. Fast and reliable for prose validation.

  ### 7. Git Operations: subprocess with git CLI

  **Chosen:** subprocess.run() with git commands as argument list

  **Rejected:**
  - GitPython library — External library; adds abstraction layer
  - os.system() — Security risk (shell injection); less error control

  **Rationale:** Spec allows subprocess. Standard library, safe (command as list prevents injection). Three operations needed: `git add`, `git commit`, `git push`. subprocess.run() provides stderr/stdout capture for error handling. GitPython not needed for this minimal workflow. Proven pattern in features 150-197.

  **Implementation:** Three subprocess calls:
  ```
  subprocess.run(['git', 'add', 'test-l5g799.md'], check=True, capture_output=True)
  subprocess.run(['git', 'commit', '-m', 'feat(198): Create markdown file test-l5g799.md with title and prose content'], check=True, capture_output=True)
  subprocess.run(['git', 'push', 'origin', 'feat/198-markdown-file-creation-903bd5'], check=True, capture_output=True)
  ```

  ### 8. Title/Prose Generation: Coordinated single API call

  **Chosen:** Single Claude API prompt requesting both title and prose with thematic relationship

  **Rejected:**
  - Separate API calls — Doubles latency, cost, risks theme mismatch
  - Generate prose then extract title — More complex, may not achieve cohesive theme
  - Template titles — Lower quality alignment

  **Rationale:** Spec requires thematic relationship between title and prose. Single coordinated API call ensures both generated with shared context. Prompt specifies exact format (markdown with # Title, blank line, 2-3 sentences). More efficient than separate calls. Response parsing extracts title and prose. Easier to validate both requirements simultaneously.

  **Prompt Structure:**
  ```
  Generate a markdown file with the following structure:
  1. First line: # Title (replace Title with a creative, one-phrase title)
  2. Blank line
  3. Exactly 2-3 sentences of prose content related to the title

  The topic can be about anything. Ensure the prose is coherent, meaningful, and thematically related to the title.
  ```

  ### 9. Error Handling: Explicit with contextual messages

  **Chosen:** Explicit error handling at each stage with informative error messages

  **Rejected:**
  - Silent failures — Makes debugging difficult
  - Bare exception propagation — Cryptic Python tracebacks

  **Rationale:** Clear error messages help debugging. Examples: "Markdown validation failed: invalid heading format", "Sentence count is 1 but requires 2-3", "File encoding contains BOM", "Git push failed: check branch configuration". Validation failures should raise exceptions immediately (prevents bad commits). Follows established error handling in codebase (structlog for logging).

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | anthropic (Anthropic SDK) | Content generation via Claude API | **Use** | Already integrated in project; excels at prose generation; specified in spec |
  | pathlib (Python stdlib) | File I/O operations | **Use** | Standard library; clean encoding/newline support; modern Python standard |
  | subprocess (Python stdlib) | Execute git commands | **Use** | Standard library; safe argument list format; proven in features 150-197 |
  | re (Python stdlib) | Regex-based validation | **Use** | Standard library; sufficient for sentence detection and syntax validation |
  | unicodedata (Python stdlib) | Unicode handling for BOM detection | **Use** | Standard library; optional but recommended for robust UTF-8 validation |
  | GitPython | Alternative git operations | **Reject** | External dependency; subprocess is simpler for 3 basic operations; adds abstraction |
  | NLTK | Natural Language Toolkit for sentence parsing | **Reject** | External 30MB dependency; overkill for simple terminal punctuation detection |
  | spaCy | Advanced NLP library | **Reject** | External dependency; requires model downloads; excessive for this feature |
  | os (stdlib functions) | Alternative file I/O | **Reject** | Lower-level than pathlib; requires more verbose code; less elegant |
  | json (Python stdlib) | Not needed | **Reject** | Feature doesn't require JSON serialization |

  ## Security Considerations

  ### Content Generation
  - **Low Risk:** Claude API content is generated by trusted LLM, not from user input
  - **Mitigation:** Validate prose content length and structure before file write

  ### File Path Handling
  - **Low Risk:** Filename is hardcoded (`test-l5g799.md`), no path injection possible
  - **No user input in path construction**

  ### Git Command Execution
  - **Low Risk:** subprocess.run() called with argument list (not shell=True), prevents command injection
  - **Mitigation:** Use list format for all git commands, never string concatenation

  ### Encoding/Line Endings
  - **Low Risk:** UTF-8 encoding is safe; explicit newline parameter prevents platform-specific issues
  - **No risk of encoding-based attacks with simple ASCII/Unicode prose**

  ### File System Permissions
  - **Medium Risk:** Requires write access to repository root (already available in feature branch context)
  - **Mitigation:** Catch file permission errors explicitly

  **No new security vulnerabilities introduced.** Implementation uses safe patterns from standard library with no external untrusted inputs. Feature creates single markdown file only (no modifications to existing files).

  ## Performance Implications

  ### Latency
  - **Claude API call:** 0.5-2 seconds (primary latency; network-dependent)
  - **File I/O:** < 1ms (single write operation, small file)
  - **Validation:** < 10ms (regex operations on ~400 bytes)
  - **Git operations:** 1-5 seconds (network-dependent push; local add/commit < 100ms)
  - **Total estimate:** 2-7 seconds (dominated by API and push latency)

  ### Resource Usage
  - **Memory:** Minimal (~1MB for content string and file buffer)
  - **Disk:** Adds ~400 bytes to repository (negligible)
  - **Network:** Single API call + one git push

  ### Caching Opportunities
  - **Not applicable:** Single execution per feature; no repeated calls
  - **No optimization needed** for this small feature

  ### Scaling Implications
  - **Not applicable:** Feature creates one file, no loops or repetitive operations
  - **Future multiple-file features** should batch API calls for efficiency

  ## Architecture Notes

  ### Integration with Sheep Platform

  This feature follows the established pattern from features 150-197 precisely:

  - **File Location:** Repository root (consistent with 198+ existing test files)
  - **File Format:** CommonMark markdown with simple structure (H1 + prose)
  - **Content Generation:** Claude API (established pattern in platform)
  - **Git Workflow:** Conventional commits with feature branch (standard for Sheep)
  - **Validation:** Comprehensive checks before commit (established quality baseline)

  ### No Codebase Modifications

  - **src/sheep/** — Not modified (feature is pure file creation)
  - **Configuration files** — Not modified (uses existing Claude API configuration)
  - **Dependencies** — None new (uses project baseline libraries)
  - **Tests** — Not modified (feature has no logic to test)

  ### Precedent and Consistency

  Features 150-197 establish clear, proven patterns:
  - Content generation via Claude API
  - UTF-8 with Unix LF line endings
  - Comprehensive validation before commit
  - Conventional commit messages
  - No modifications to source code

  This feature follows those patterns exactly, ensuring consistency and quality.

  ## Implementation Roadmap

  ### Stage 1: Content Generation (3-5 minutes)
  1. Call Claude API with prose generation prompt
  2. Parse response to extract title and prose
  3. Validate response has both components

  ### Stage 2: File Creation (1-2 minutes)
  1. Construct markdown file content (title + blank line + prose)
  2. Write to `test-l5g799.md` using pathlib with UTF-8/LF settings
  3. Verify file exists and is readable

  ### Stage 3: Comprehensive Validation (2-3 minutes)
  1. Verify markdown syntax (H1 heading format)
  2. Count sentences (regex terminal punctuation)
  3. Validate encoding (UTF-8 no BOM)
  4. Verify line endings (LF only)
  5. Check file size (250-600 bytes)
  6. Raise exceptions for any validation failures

  ### Stage 4: Git Workflow (2-5 minutes)
  1. Execute `git add test-l5g799.md`
  2. Execute `git commit` with conventional message
  3. Execute `git push` to feature branch
  4. Verify push success

  **Total estimated time:** 10-15 minutes (consistent with spec estimate)

