content: |
  ## Architecture Overview

  This feature follows the established pattern from features 150-197 precisely, with no modifications to source code or project structure. The implementation is a pure file-creation workflow:

  1. **Content Generation** → Claude API generates title and prose
  2. **File Creation** → pathlib writes markdown file with correct encoding
  3. **Validation** → Comprehensive checks before commit
  4. **Git Integration** → Standard workflow (add, commit, push)

  The architecture is linear (not parallel) because each phase depends on the previous: content must be generated before writing, file must exist before validating, validation must pass before committing.

  ## Key Design Decisions

  ### 1. Claude API for Content Generation

  **Chosen:** Single coordinated API call to Anthropic Claude API via anthropic-sdk-python

  **Why:** Feature spec explicitly requires AI-generated meaningful prose. Anthropic SDK is already integrated in the project. Single API call with coordinated prompt ensures thematic relationship between title and prose. More efficient than separate calls or template-based approaches.

  **Alternative Approaches:**
  - OpenAI API (ChatGPT) — Would introduce dependency inconsistency; project uses Anthropic SDKs
  - Template-based prose — Lower quality, repetitive; contradicts spec and precedent standards
  - Random/Lorem Ipsum — Nonsensical; fails to showcase platform capabilities

  ### 2. Pathlib for File I/O

  **Chosen:** Python pathlib.Path with explicit encoding and newline parameters

  **Why:** Modern Python standard (3.4+), provides clean API with critical encoding/newline support. Write with `Path('test-l5g799.md').write_text(content, encoding='utf-8', newline='\n')` ensures UTF-8 without BOM and Unix LF on all platforms.

  **Alternative Approaches:**
  - os.open()/os.write() — Lower-level, verbose, requires manual encoding handling
  - open() builtin — Works but pathlib provides better parameter support and is modern standard

  ### 3. Explicit UTF-8/LF Encoding

  **Chosen:** `encoding='utf-8'` and `newline='\n'` parameters in pathlib.write_text()

  **Why:** Success criteria explicitly requires UTF-8 without BOM and Unix LF line endings. Pathlib parameters enforce this on all platforms (Windows default is CRLF without explicit parameter). Zero performance overhead.

  **Alternative Approaches:**
  - Platform defaults — Would produce CRLF on Windows; violates spec
  - Post-processing with sed/tr — Adds complexity and error surface

  ### 4. Comprehensive Validation Before Commit

  **Chosen:** Four-stage validation: markdown syntax, sentence count, encoding/line endings, file size

  **Why:** Catches errors early, prevents commits of invalid content, aligns with quality standards from features 150-197. Adds only 2-3 minutes but prevents rework and maintains baseline quality.

  **Alternative Approaches:**
  - Minimal validation — Allows invalid content through; increases rework risk
  - No validation — Highest risk; contradicts established quality baseline

  **Validation Checks:**
  - Markdown syntax: Regex `^#\s+` on first line for H1 heading
  - Sentence count: Regex terminal punctuation `[.!?](?:\s|$)` with abbreviation filtering
  - Encoding: Read file bytes to verify UTF-8 (no 0xEFBBBF BOM) and no CRLF (0x0D)
  - File size: Verify 250-600 byte range (typical for this pattern)

  ### 5. Regex-Based Sentence Detection

  **Chosen:** Standard library `re` module for sentence detection

  **Why:** Simple pattern counts terminal punctuation (. ! ?) excluding common abbreviations. Zero external dependencies. Fast and reliable for prose validation. Avoids 30MB NLTK dependency or spaCy complexity.

  ### 6. Subprocess for Git Operations

  **Chosen:** Python subprocess.run() with git commands as argument list

  **Why:** Standard library, safe (list format prevents shell injection), proven pattern in features 150-197. Three simple operations (add, commit, push) need only subprocess.run() with error checking.

  **Alternative Approaches:**
  - GitPython — External library; adds abstraction layer unnecessary for 3 simple commands
  - os.system() — Security risk (shell injection); less error control

  ## Implementation Strategy

  ### Phase Ordering Rationale

  The implementation follows a linear, dependency-ordered sequence:

  1. **Content Generation (3-5 min)** — Must happen first; generates the content to be written
  2. **File Creation (1-2 min)** — Depends on generated content; must succeed before validation
  3. **Comprehensive Validation (2-3 min)** — Must validate before committing; catches errors early
  4. **Git Integration (2-5 min)** — Final step; only runs if all validations pass

  Each phase explicitly depends on the previous. Parallel execution is not possible.

  ### No Parallel Opportunities

  - Content generation must complete before file writing (sequential)
  - File must exist before validation (sequential)
  - Validation must pass before git operations (sequential)

  ### Quality Gates

  Validation phase acts as a hard gate: if any validation fails, an exception is raised immediately. This prevents commits of invalid content and aligns with the quality standards demonstrated by features 150-197.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API unavailable or rate-limited | Explicit error handling with clear error messages. Feature is not time-critical; user can retry. Retry logic not necessary for single small feature. |
  | Generated prose doesn't match requirements (e.g., only 1 sentence) | Validation step checks sentence count. If invalid, exception raised and user can regenerate. Quality validated before commit. |
  | Encoding produces BOM or CRLF on Windows | Explicit pathlib parameters (encoding='utf-8', newline='\n') enforce correct format. Validation step verifies actual bytes. Double-checked. |
  | File already exists (unlikely but possible) | Pathlib.write_text() overwrites existing file. Since this is first creation, not a problem. If running again, intended behavior. |
  | Git operations fail (permission, network, config) | subprocess.run() with check=True raises CalledProcessError. Explicit error handling with informative messages. User can check git configuration or network. |
  | Repository is in detached HEAD state | Feature branch is pre-created. git push will fail with clear error. User should verify branch setup before running. |
  | Prose content is not thematically related to title | Validation doesn't check thematic relationship (subjective). Rely on Claude quality. If problematic, regenerate via Claude prompt. |

  ## No Codebase Modifications

  This feature creates a single markdown file only:
  - `src/sheep/` — Not modified
  - Configuration files — Not modified
  - Dependencies — None new (uses project baseline)
  - Tests — Not modified (no logic to test; pure file creation)

  Follows the pattern established in features 150-197 with zero impact on project structure or quality.
