content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-l5g799.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-197, with 198+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-l5g799.md` exists in the repository root directory (same directory as .git and src/)
  - [ ] File contains an H1 markdown heading as the first line (format: `# Title Text`)
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line following the heading
  - [ ] Prose content is meaningful and coherent (not placeholder or dummy text)
  - [ ] Title is thematically related to the prose content
  - [ ] File is encoded in UTF-8 text format without BOM
  - [ ] File uses Unix line endings (LF character, not CRLF)
  - [ ] File follows CommonMark markdown specification syntax
  - [ ] File is staged with `git add test-l5g799.md` (visible in `git status`)
  - [ ] File is committed with conventional commit message: `feat(198): Create markdown file test-l5g799.md with title and prose content`
  - [ ] Commit is pushed to feature branch `feat/198-markdown-file-creation-903bd5` on origin
  - [ ] File size is between 250-600 bytes (typical for this pattern)
  - [ ] All 197+ existing test markdown files remain unmodified
  - [ ] No source code, configuration files, or other project files are modified

  ## Functional Requirements

  - **FR-1**: Create a markdown file with filename exactly matching `test-l5g799.md`
  - **FR-2**: Write an H1 markdown heading as the first line of content (format: `# <Title>`)
  - **FR-3**: Write exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-4**: Generate meaningful and coherent prose content that is thematically related to the title
  - **FR-5**: Write file to repository root directory (same directory level as .git, src/, specs/)
  - **FR-6**: Encode file as UTF-8 with Unix line endings (LF only, no CRLF)
  - **FR-7**: Stage the file with `git add test-l5g799.md`
  - **FR-8**: Create a commit with message format: `feat(198): Create markdown file test-l5g799.md with title and prose content`
  - **FR-9**: Push the commit to the feature branch `feat/198-markdown-file-creation-903bd5` on origin
  - **FR-10**: Validate file content before commit: confirm markdown syntax, sentence count (exactly 2-3), encoding (UTF-8 no BOM), line endings (LF only), and file size (250-600 bytes)

  ## Non-Functional Requirements

  - **NFR-1**: Implementation should complete in approximately 10-15 minutes (size estimate: S)
  - **NFR-2**: File creation and git operations should use only Python standard library (pathlib, subprocess) and standard git commands (no external package dependencies)
  - **NFR-3**: Output must conform to CommonMark markdown specification (https://spec.commonmark.org/)
  - **NFR-4**: Commit message must follow Conventional Commits specification (https://www.conventionalcommits.org/)
  - **NFR-5**: Implementation must follow the established pattern from features 150-197 for consistency and quality
  - **NFR-6**: No existing files, source code, or configuration should be modified — only create the new markdown file
  - **NFR-7**: Output file should be indistinguishable from the 198+ existing test markdown files in terms of structure, quality, and professionalism
  - **NFR-8**: Prose content should be AI-generated (not templated) to ensure uniqueness and quality alignment with platform capabilities

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 198+ test markdown files following pattern `test-*.md`
  - Examples: `test-9zebfj.md`, `test-yqu2yr.md`, `test-xgtwtq.md`, `test-l5g799.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `Dockerfile`

  **Spec Directory Structure:**
  - `specs/` contains 198+ feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name/spec.yaml`
  - Example: `specs/197-markdown-file-creation-011064/spec.yaml`
  - This spec is located at: `specs/198-markdown-file-creation-903bd5/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions for Research, Implementation, Review
  - `src/sheep/flows/` contains flow orchestration (code_implementation.py)
  - `src/sheep/config/` contains configuration management (settings.py, llm.py)
  - `src/sheep/tools/` contains Git and file operation tools
  - `src/sheep/cli.py` contains CLI entry point
  - `pyproject.toml` specifies Python 3.11+ requirement and CrewAI dependencies

  ### Architecture Patterns

  **Test File Format (198+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-600 bytes
  - Example from `test-yqu2yr.md`:
    ```
    # The Journey of a Thousand Miles

    Every great journey begins with a single step, and the courage to move forward despite uncertainties
    and obstacles that lie ahead. Throughout history, countless individuals have embarked on transformative
    adventures that reshaped their perspectives and opened doors to new possibilities. These experiences
    remind us that progress often requires patience, persistence, and an unwavering belief in the value
    of the destination.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-l5g799.md`
  - Naming is fixed by user specification (not variable)

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with title and prose content`
  - Changes are pushed to feature branch `feat/###-markdown-file-creation-<hash>`
  - Pattern observed from commits 190-197

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default when specified)
  - Binary read for validation of encoding and line endings

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/198-markdown-file-creation-903bd5`
  - No specialized git libraries required; can use subprocess or GitPython
  - Conventional Commits format: `feat(number): Description`

  **Python Environment:**
  - Python 3.11+ required (from pyproject.toml)
  - Project uses: CrewAI, Pydantic, structlog, GitPython, langfuse, openai/anthropic SDKs
  - This feature only needs: pathlib (standard library) and subprocess (standard library)

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 198+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-197; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/198-markdown-file-creation-903bd5` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Access to Claude API or LLM for content generation

  **Reference/Precedent:**
  - 198+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-197) demonstrate successful execution of identical pattern
  - Recent commits (191-197) show exact templates and working examples
  - Feature 197 implementation provides direct code precedent
  - README.md documents Sheep platform architecture and capabilities

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory
  - No test framework integration

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **Content generation**: ~3-5 minutes (generate topic, title, and 2-3 sentences of prose via Claude)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, file size)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 198+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (191-197) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 197 implementation serves as direct working precedent for all code patterns

  ## Implementation Notes

  - Content generation uses Claude to create unique, meaningful prose with thematic title alignment
  - File is written to repository root using `pathlib.Path.write_text()` with explicit encoding and newline parameters
  - Validation verifies all success criteria before staging file
  - Git operations follow standard feature workflow with conventional commit format
  - No complex logic or architectural decisions required — pure file creation following established patterns
