# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 193 implements a straightforward file creation task following the well-established pattern
  from 170+ existing test files in the repository. The implementation has three layers:

  **1. File I/O Layer — pathlib.Path.write_text()**
  - Single atomic file write operation with explicit encoding and line ending parameters
  - `pathlib.Path("test-yqu2yr.md").write_text(content, encoding='utf-8', newline='\n')`
  - Eliminates platform-dependent encoding behavior (Windows CRLF, locale-specific defaults)
  - No external dependencies required — pathlib is Python standard library since 3.4

  **2. Validation Layer — Standard Library Functions**
  - Encoding validation: verify UTF-8 without Byte Order Mark (BOM)
  - Line ending validation: verify LF-only (\n), reject CRLF (\r\n)
  - Structure validation: verify H1 heading + blank line + 2-3 sentences
  - File size validation: verify 300-600 byte range (consistent with 170+ precedents)
  - All validation uses Python standard library only (no external dependencies)

  **3. Git Layer — subprocess.run()**
  - Safe, portable git operations using explicit argument lists
  - Three operations: git add, git commit (with conventional message), git push
  - No shell=True (prevents injection risks), check=True (raises on non-zero exit)
  - No external dependencies — subprocess is Python standard library

  ## Key Design Decisions

  **Decision 1: File I/O Method — pathlib.Path.write_text()**

  Chosen: `Path("test-yqu2yr.md").write_text(content, encoding='utf-8', newline='\n')`

  This approach:
  - Modern Python 3.11+ conventions (pathlib is standard since Python 3.4)
  - Single method call is atomic and more readable than open()/context manager pattern
  - Explicit `encoding='utf-8'` prevents platform/locale-dependent encoding variations
  - Explicit `newline='\n'` guarantees Unix LF line endings on all platforms
  - Proven successful in features 190-192 and 170+ test files

  Alternatives rejected:
  - Traditional `open()` function: verbose, requires context manager, more lines of code
  - `pathlib.Path.touch()` then write: splits operation into two steps unnecessarily

  Rationale from research: "pathlib is the modern Python standard for file I/O. It provides clean,
  readable, single-call file creation. The explicit encoding='utf-8' parameter ensures UTF-8
  encoding across all platforms and locales, preventing platform-dependent variations."

  **Decision 2: Content Strategy — Hardcoded Prose**

  Chosen: Write specific, grammatically correct prose (implementation selects flexible topic)

  This approach:
  - Meets NFR-6 requirement: "Prose must be readable, coherent, and grammatically correct"
  - All 170+ existing test files use hardcoded prose, not generated/templated content
  - Deterministic output ensures predictable, testable, reproducible results
  - Aligns with spec requirement for "flexible topic selection" (implementation chooses topic)
  - Consistent with successful implementations in features 190-192

  Alternatives rejected:
  - Generated/randomized content: violates NFR-6 requirement for grammar and coherence
  - Template-based generation: unnecessary complexity for single file
  - External content sources: adds dependencies and complexity not needed

  Rationale from spec: "Flexible topic selection... Content should be narrative, descriptive,
  or reflective without requiring technical knowledge... Aligns with the established precedent
  of 170+ diverse test files spanning varied topics."

  **Decision 3: Encoding Specification — Explicit UTF-8 Parameter**

  Chosen: Use `encoding='utf-8'` parameter in write_text() + validation before git

  This approach:
  - Meets NFR-1 requirement: "File must be encoded in UTF-8 without Byte Order Mark (BOM)"
  - Explicit beats implicit (PEP 20 Zen of Python)
  - Works correctly across Windows, macOS, Linux regardless of system locale settings
  - Validated before git operations catch any issues early
  - Proven in features 190-192

  Alternatives rejected:
  - Relying on Python defaults: varies by platform and locale, unpredictable
  - Manual `.encode('utf-8')`: lower-level, more error-prone

  Rationale from research: "PEP 20 states 'Explicit is better than implicit.' The requirement
  specifies UTF-8 without Byte Order Mark (NFR-1). Explicit encoding parameter ensures
  compliance across all environments regardless of system locale settings."

  **Decision 4: Line Ending Strategy — Explicit LF Parameter**

  Chosen: Use `newline='\n'` parameter in write_text()

  This approach:
  - Meets NFR-2 requirement: "File must use LF (Unix-style) line endings (\n), not CRLF (\r\n)"
  - Python's universal newline handling with explicit parameter guarantees consistency
  - Validated before git operations to ensure compliance before committing
  - Works correctly across all platforms (Windows, macOS, Linux)
  - Avoids post-processing complexity
  - Proven in features 190-192

  Alternatives rejected:
  - Post-processing with `.replace('\r\n', '\n')`: adds unnecessary operation
  - Relying on system defaults: may produce CRLF on Windows systems

  Rationale from research: "The newline='\n' parameter in write_text() guarantees LF line
  endings across all platforms. This is more reliable than relying on system defaults and
  avoids post-processing complexity."

  **Decision 5: Validation Strategy — Comprehensive Pre-Commit Validation**

  Chosen: Validate all requirements (encoding, line endings, structure, size) before git add

  This approach:
  - Ensures file meets all requirements before committing to git
  - Prevents inconsistency with 170+ existing test files
  - Provides early error detection and quality assurance
  - Overhead (~2-3 minutes) is acceptable for reliability and pattern consistency
  - Consistent with features 190-192 approach

  Alternatives rejected:
  - Minimal validation (file exists only): risks quality issues and pattern divergence
  - No validation: violates specification and provides no assurance

  Rationale from spec: "Comprehensive validation is recommended to ensure consistency with
  170+ existing test files. Given this is part of an automated implementation system with
  strong precedent patterns, validation against those patterns prevents divergence."

  **Decision 6: Git Integration — subprocess.run() with Explicit Arguments**

  Chosen: `subprocess.run(["git", "add", ...], check=True)` for all git operations

  This approach:
  - Standard library, no external dependencies (GitPython adds unnecessary complexity)
  - Safe: explicit argument list prevents shell injection risks
  - Portable: works identically on Windows, macOS, Linux
  - Reliable: `check=True` raises exception on non-zero exit codes
  - Proven in features 190-192

  Alternatives rejected:
  - GitPython: external dependency for trivial git operations
  - `os.system()` or `shell=True`: unsafe (injection risks), deprecated pattern

  Rationale from research: "subprocess is standard library, safe, portable, and ideal for
  simple git operations. No external dependencies required. The operations are straightforward:
  git add, git commit, git push with a conventional commit message."

  ## Implementation Strategy

  ### Phase 1: File Creation & Validation (Tasks 1-5)

  Create the markdown file and validate all requirements before any git operations:

  **File Creation (Task 1):**
  - Use pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\n'
  - Content structure: H1 heading + blank line + 2-3 sentences of prose
  - File created at repository root (same location as 170+ existing test files)

  **Validation (Tasks 2-5, performed sequentially):**
  - Encoding validation (Task 2): verify UTF-8 without BOM using binary read and byte detection
  - Line ending validation (Task 3): verify LF-only, reject CRLF using binary string search
  - Structure validation (Task 4): verify H1 heading + blank line + 2-3 sentences using text parsing
  - File size validation (Task 5): verify 300-600 byte range using stat().st_size

  **Rationale for validation before git:** If validation fails, we can adjust file content
  without committing broken files. This ensures all requirements are met before creating
  permanent git history.

  ### Phase 2: Git Integration (Tasks 6-7)

  Stage, commit, and push the validated file following standard workflow:

  **Git Workflow (Tasks 6-7):**
  - Task 6: `git add test-yqu2yr.md` + `git commit -m "feat(193): create markdown file test-yqu2yr.md"`
  - Task 7: `git push -u origin HEAD` (sets upstream tracking on first push)

  **Rationale for git after validation:** Only commit files verified to meet all requirements.
  This prevents encoding issues, line ending issues, or structural problems from being committed
  to permanent git history.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File I/O error during creation | Use explicit error handling in pathlib operations. Raise exception with clear message if write_text() fails. Check file exists and is readable after creation. |
  | Platform-dependent encoding (Windows locale) | Use explicit `encoding='utf-8'` parameter in write_text(). Validate encoding before git operations with BOM detection. Ensures consistency across Windows, macOS, Linux. |
  | CRLF line endings on Windows | Use explicit `newline='\n'` parameter in write_text(). Validate line endings before git operations with binary string search. Prevents system-dependent CRLF issues. |
  | File size out of range | Validate file size (300-600 bytes) before git operations. Adjust prose length if needed to meet size requirement. Consistent with 170+ precedent files. |
  | Git user.name or user.email not configured | Require git configuration before attempting commit. Provide clear error message if git config is missing. Check with `git config user.name` before proceeding. |
  | Git push fails (branch not tracking) | Use `git push -u origin HEAD` which sets upstream tracking on first push. This handles initial push scenario correctly. |
  | Content quality issues (grammar, coherence) | Prose is hardcoded and reviewed for correctness, not generated. Ensures NFR-6 requirement met with certainty. No quality variance from dynamic content generation. |
  | Implementation diverges from 170+ precedents | Implementation follows exact pattern from features 190-192 (identical structure, encoding, validation, git workflow). Minimal deviation risk due to proven pattern. |
