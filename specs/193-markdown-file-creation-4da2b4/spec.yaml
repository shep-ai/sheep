content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-yqu2yr.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 1-192,
  with 170+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 170+ test markdown files following pattern `test-*.md`
  - Examples: `test-0tyide.md`, `test-3pz04c.md`, `test-zyz8v7.md`, `test-yqu2yr.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`

  **Spec Directory Structure:**
  - `specs/` contains 193 feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Example: `specs/192-markdown-file-creation-c92bc4/spec.yaml`
  - Current spec is located at: `specs/193-markdown-file-creation-4da2b4/spec.yaml`
  - Related files per spec: `feature.yaml`, `plan.yaml`, `research.yaml`, `tasks.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code for CrewAI automation
  - `src/sheep/agents/` contains agent definitions for Research, Implementation, and Review
  - `src/sheep/flows/` contains flow orchestration and execution control
  - `src/sheep/config/` contains configuration management and LLM factory
  - `src/sheep/cli.py` contains CLI entry point
  - `src/sheep/observability/` contains logging and Langfuse integration
  - `src/sheep/tools/` contains git and file operation tools

  ### Architecture Patterns

  **Test File Format (170+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)` — single `#` followed by title text
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 350-550 bytes
  - Example from `test-0tyide.md`:
    ```
    # The Art of Storytelling

    Storytelling has been a fundamental part of human culture for thousands of years, allowing us to share experiences,
    wisdom, and emotional connections across generations. It provides a powerful mechanism for communicating complex
    ideas through narrative, making abstract concepts tangible and memorable. Through effective storytelling, we create
    meaningful bonds with audiences and inspire them to think, feel, and take action.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-yqu2yr.md` (specified in user query)

  **Git Workflow Pattern (from recent commits):**
  - Recent commits: feat(192), feat(191), feat(190), feat(189)
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): create markdown file <filename> ...`
  - Changes are pushed to feature branch `feat/###-<feature-name>`
  - Example: `feat(190): create markdown file test-08hm34.md (#260)`

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library in Python 3.11+ (no external dependencies required)
  - Simple text file write with UTF-8 encoding (Python default)
  - LF (Unix-style) line endings (`\n`), not CRLF

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)
  - File encoding: UTF-8 without Byte Order Mark (BOM)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/193-markdown-file-creation-4da2b4`
  - No specialized libraries required beyond git CLI
  - Conventional Commits specification for commit messages

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)
  - Python 3.11+ is the minimum version requirement

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 170+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-192; no branch/merge complexity |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (pathlib) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Configuration | None | No changes to pyproject.toml, .env, or other config files required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/193-markdown-file-creation-4da2b4` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 170+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (1-192) demonstrate successful execution of identical pattern
  - Recent implementations (190-192) provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Success Criteria

  - [ ] File `test-yqu2yr.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (`\n`), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-yqu2yr.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(193): create markdown file test-yqu2yr.md ...`
  - [ ] Commit is pushed to the feature branch `feat/193-markdown-file-creation-4da2b4`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 170+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (190-192) demonstrate efficient execution
  - No git merge conflicts or branch management complexity

  ---

  _Analysis phase complete — ready for implementation_
