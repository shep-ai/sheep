content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-yqu2yr.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 1-192,
  with 170+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-yqu2yr.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (single `#` symbol followed by title text on first line)
  - **FR-3**: File must contain a blank line immediately following the heading (line 2)
  - **FR-4**: File must contain exactly 2-3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be syntactically correct English sentences with proper punctuation
  - **FR-6**: File must be staged in git using `git add test-yqu2yr.md`
  - **FR-7**: File must be committed with a conventional commit message in format: `feat(193): create markdown file test-yqu2yr.md ...`
  - **FR-8**: Commit must be pushed to feature branch `feat/193-markdown-file-creation-4da2b4`
  - **FR-9**: No existing files or directories in the repository may be modified (pure file creation only)

  ## Non-Functional Requirements

  - **NFR-1**: File Encoding — File must be encoded in UTF-8 without Byte Order Mark (BOM)
  - **NFR-2**: Line Endings — File must use LF (Unix-style) line endings (`\n`), not CRLF (`\r\n`)
  - **NFR-3**: File Size — File should be between 300-600 bytes, consistent with 170+ existing test markdown files
  - **NFR-4**: Format Compliance — File must conform to CommonMark markdown specification (H1 heading + prose, no complex features)
  - **NFR-5**: Pattern Consistency — File must follow established structure from 170+ precedent test files: `# Title\n\nsentence1 sentence2 sentence3.`
  - **NFR-6**: Content Quality — Prose must be readable, coherent, and grammatically correct; topic can be any subject matter
  - **NFR-7**: Git Compliance — Commit must follow Conventional Commits specification (feat(###) format with scope and description)
  - **NFR-8**: Automation Readiness — Implementation should be reproducible and not require manual intervention

  ## Success Criteria

  - [ ] File `test-yqu2yr.md` exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading on the first line
  - [ ] File contains a blank line on line 2
  - [ ] File contains exactly 2-3 sentences of prose on lines 3-5
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings only
  - [ ] File size is between 300-600 bytes
  - [ ] File is staged and tracked by git (verified with `git status`)
  - [ ] Commit message matches pattern `feat(193): create markdown file test-yqu2yr.md ...`
  - [ ] Commit is pushed to feature branch `feat/193-markdown-file-creation-4da2b4`
  - [ ] No modifications to existing files or directories (only new file created)
  - [ ] File is readable in any text editor without encoding issues
  - [ ] Prose is grammatically correct and semantically coherent

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the content topic be predefined in the specification or remain flexible for implementation choice? | Flexible topic selection | User query explicitly states "about anything", indicating topic is not a constraint. Flexible approach matches 170+ diverse precedent files and reduces specification overhead while maintaining quality standards. |
  | 2 | What validation level should be applied to the created markdown file? | Comprehensive validation | Comprehensive validation (encoding, line endings, format, size, sentence count) ensures consistency with 170+ existing test files and prevents quality divergence. The ~2-3 minute overhead for validation is acceptable for reliability. |
  | 3 | Should prose content prioritize any specific quality attributes? | General/narrative prose | General/narrative prose aligns with 170+ diverse test files spanning varied topics. Accommodates flexible topic selection while maintaining readable, well-formed content. Matches user query intent without domain constraints. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 170+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-192; no branch/merge complexity |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (pathlib) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Configuration | None | No changes to pyproject.toml, .env, or other config files required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/193-markdown-file-creation-4da2b4` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 170+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (1-192) demonstrate successful execution of identical pattern
  - Recent implementations (190-192) provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size, sentence count)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 170+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (190-192) demonstrate efficient execution
  - No git merge conflicts or branch management complexity

  ---

  _Requirements phase complete — ready for implementation_
