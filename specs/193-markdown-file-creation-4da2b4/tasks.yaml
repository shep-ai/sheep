# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 193 implementation consists of 7 tasks organized into 2 phases:

  **Phase 1: File Creation & Validation (5 tasks, ~85 minutes)**

  Tasks 1-5 create the markdown file and validate all format, encoding, and structure requirements:
  - Task 1 creates the file using pathlib with H1 heading, blank line, and 2-3 prose sentences
  - Tasks 2-5 validate encoding (UTF-8 without BOM), line endings (LF only), structure (H1 + blank + sentences), and size (300-600 bytes)
  - All validation uses standard library only (no external dependencies)
  - Comprehensive validation ensures file meets all 9 functional and 8 non-functional requirements before git operations

  **Phase 2: Git Integration (2 tasks, ~25 minutes)**

  Tasks 6-7 perform standard git workflow after file is validated:
  - Task 6 stages file and commits with conventional message: `feat(193): create markdown file test-yqu2yr.md`
  - Task 7 pushes commits to feature branch `feat/193-markdown-file-creation-4da2b4`
  - All git operations use subprocess with explicit argument lists for safety and portability

  Each task follows TDD cycles: write test first (RED), implement minimal code to pass (GREEN), refactor for clarity (REFACTOR).
  Total estimated effort is 1 hour 45 minutes across 7 focused, testable tasks.

  The implementation pattern is identical to features 190-192, which successfully created 170+ test files
  using the same pathlib + subprocess approach. This implementation maintains consistency with established
  patterns while ensuring all requirements are met through comprehensive validation.

  ## Task Execution Order

  Tasks follow dependency chain: Task 1 (file creation) must complete before validation tasks 2-5.
  All validation tasks (2-5) can run in parallel or sequentially; they depend only on Task 1.
  Git tasks 6-7 must run after validation tasks are complete (Task 5 is the final validation).
  This ordering ensures validation catches any issues before git operations commit files to history.
