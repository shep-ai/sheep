content: |
  ## Architecture Overview

  Feature 208 implements deterministic markdown file creation following the established pattern
  from features 200-207. The implementation is modular, testable, and self-contained with no
  external API dependencies.

  ### Codebase Integration

  - **Location**: `src/sheep/features/feature_208_markdown_file_creation.py`
  - **Pattern Source**: Feature 207 implementation (`src/sheep/features/feature_207_markdown_file_creation.py`)
  - **Logging**: Uses `sheep.observability.logging.get_logger()` for consistent logging
  - **Dependencies**: Python standard library only (pathlib, subprocess, sys)
  - **Size**: ~100 lines of implementation code (similar to features 206-207)

  ### Architecture Pattern

  The implementation follows a three-phase workflow orchestrated by a `main()` function:

  1. **Phase 1: File Creation**
     - Create markdown file with hard-coded, human-written content
     - Use pathlib.Path.write_text() for UTF-8 encoding and automatic LF line ending handling
     - Verify file creation succeeded
     - Single entry point: `create_markdown_file()` returns Path object

  2. **Phase 2: Validation**
     - Modular, composable validation functions (one function per concern)
     - Functions: `verify_file_exists()`, `validate_markdown_format()`, `validate_sentence_count()`,
       `validate_encoding()`, `validate_line_endings()`, `validate_file_size()`
     - Helper functions: `extract_prose_content()`, `count_sentences()`
     - Master function: `validate_markdown_file()` orchestrates all checks with fail-fast behavior
     - Clear error messages identifying exact validation failure point

  3. **Phase 3: Git Integration**
     - Use subprocess.run() with shell=False for secure, cross-platform git command execution
     - Functions: `git_add_file()`, `git_commit()`, `git_push()`
     - Conventional commit message format: `feat(208): Create markdown file test-s4b1z3.md`
     - Automatic push to remote branch using `git push -u origin HEAD`

  4. **Phase 4: Orchestration**
     - `main()` function coordinates all phases in sequence
     - Fail-fast: first error halts execution and returns error code 1
     - Success returns exit code 0
     - Comprehensive logging at each phase for debugging and observability

  ## Key Design Decisions

  ### 1. Content Source: Hard-Coded, Human-Written Prose

  **Chosen**: Hard-coded content (no external API calls)

  **Alternatives Considered**:
  - Claude API generation with temperature=0 (used in feature 204)
  - Dynamic seed-based generation with variations

  **Rationale**:
  - Specification explicitly recommends hard-coded content for determinism and simplicity
  - Eliminates external API dependencies, network failures, and latency
  - Content is transparent, auditable, and fully reviewable
  - Proven successful approach in features 206-207
  - Aligns with Sheep platform philosophy of explicit, deterministic operations
  - No additional complexity for content generation, validation, or testing
  - Faster execution (no API calls or network delays)

  **Implementation**:
  - Define TITLE_TEXT and PROSE_CONTENT as module-level constants
  - 2-3 sentences of grammatically correct prose on any topic
  - String concatenation: `f"# {TITLE_TEXT}\n\n{PROSE_CONTENT}\n"`

  ### 2. File I/O Method: pathlib.Path.write_text()

  **Chosen**: `pathlib.Path.write_text()` with default encoding and newline parameters

  **Alternatives Considered**:
  - `open(newline='', encoding='utf-8')` context manager
  - Binary mode `os.write()` with manual encoding
  - Legacy `codecs.open()` (deprecated)

  **Rationale**:
  - Modern Python 3.9+ standard library API (most Pythonic)
  - Automatically handles UTF-8 encoding without BOM
  - Default `newline=None` produces correct LF line endings on all platforms
  - Single method call vs multiple manual operations
  - Clear, readable, maintainable code
  - Proven in features 206-207 with perfect results
  - Cross-platform compatible (Windows, macOS, Linux handled automatically)

  **Implementation**:
  ```python
  file_path = Path(FILENAME)
  file_path.write_text(markdown_content, encoding="utf-8")
  ```

  ### 3. Sentence Counting: Simple Period Counting

  **Chosen**: Count periods (.) as sentence delimiters

  **Alternatives Considered**:
  - Regex-based detection: `r'[.!?]+'` (exclamation marks and question marks)
  - Natural language processing with spaCy or NLTK

  **Rationale**:
  - Content is human-written with proper punctuation (by design)
  - Deterministic, fast O(n) algorithm with no external dependencies
  - Specification requires "2-3 sentences" implying standard punctuation
  - Matches proven pattern from features 206-207
  - Reliable for typical prose content
  - Easy to understand, debug, and test
  - No edge case handling needed (author controls punctuation)

  **Implementation**:
  ```python
  def count_sentences(prose: str) -> int:
      return prose.count(".")
  ```

  ### 4. Validation Architecture: Modular Functions

  **Chosen**: One validation function per concern

  **Alternatives Considered**:
  - Single monolithic `validate_markdown_file()` function (all checks in one function)
  - No explicit validation (trust file creation)

  **Rationale**:
  - Each function tests exactly one aspect (format, encoding, size, etc.)
  - Independently testable - can unit test each validation separately
  - Fail-fast with clear error messages identifying exact failure point
  - Functions are reusable in different contexts
  - Matches proven pattern from feature 207
  - Improves maintainability and debugging
  - Enables incremental validation if needed

  **Functions**:
  - `verify_file_exists()` - File exists check
  - `validate_markdown_format()` - H1 heading, blank line, single heading
  - `extract_prose_content()` - Helper to extract prose after blank line
  - `count_sentences()` - Helper to count sentence delimiters
  - `validate_sentence_count()` - Exactly 2-3 sentences
  - `validate_encoding()` - UTF-8 no BOM
  - `validate_line_endings()` - Unix LF only
  - `validate_file_size()` - 300-800 bytes range
  - `validate_markdown_file()` - Master orchestrator

  ### 5. Git Integration: subprocess.run() with shell=False

  **Chosen**: `subprocess.run()` with `shell=False`

  **Alternatives Considered**:
  - `subprocess.run(shell=True)` - command injection risk
  - GitPython library - external dependency
  - `os.system()` - deprecated, less controllable

  **Rationale**:
  - Secure by default (no shell command injection risk)
  - Arguments passed as list, not shell string
  - Platform-independent (works on Windows, macOS, Linux)
  - Standard library only (no external dependencies)
  - Enables output capture for error handling
  - `check=True` provides fail-fast behavior
  - Matches pattern from feature 207 with proven reliability

  **Implementation**:
  ```python
  subprocess.run(
      ["git", "add", filename],
      check=True,
      capture_output=True,
      text=True,
  )
  ```

  ### 6. File Size Constraint: 300-800 Bytes

  **Chosen**: 300-800 bytes (per specification)

  **Rationale**:
  - Specification explicitly defines this range in success criteria
  - 300 bytes minimum ensures meaningful content (~2-3 sentences)
  - 800 bytes maximum prevents excessive verbosity
  - Matches specification exactly - no deviation

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 First (File Creation)**: Establishes the artifact that all subsequent phases depend on.
  If file creation fails, all validation and git operations are unnecessary.

  **Phase 2 Second (Validation)**: Ensures file meets all requirements before attempting git operations.
  Fail-fast: if validation fails, no commit or push occurs, preventing invalid files in repository.
  Clean error messages help developers understand what went wrong.

  **Phase 3 Third (Git Integration)**: Only proceeds after file is validated.
  Guarantees that only properly formatted, valid files are committed and pushed.
  Matches Sheep platform philosophy: validate before committing to repository.

  **Phase 4 Fourth (Orchestration)**: Coordinates all phases and provides integration testing.
  Verifies complete end-to-end workflow succeeds on all platforms.

  ### Validation Ordering Within Phase 2

  1. **File Exists** - Quick check, prevents all downstream failures
  2. **Markdown Format** - Structure validation (H1, blank line, single heading)
  3. **Sentence Count** - Content validation (2-3 sentences required)
  4. **Encoding** - Binary-level check (UTF-8 without BOM)
  5. **Line Endings** - Binary-level check (LF only)
  6. **File Size** - Metadata check (300-800 bytes)

  This order is optimal because:
  - Quick file existence check first (fast fail if missing)
  - Format checks before content checks (structural issues caught early)
  - All content validation before binary checks (reduces validation work)
  - Size check last (least likely to fail if other checks pass)

  ## Risk Mitigation

  | Risk | Impact | Mitigation Strategy |
  | ---- | ------ | ------------------- |
  | File already exists from previous run | Medium | Verify idempotency: test feature can be run multiple times without errors or conflicts |
  | Git operations fail (no git installed, network issues, authentication) | High | Use subprocess error handling with clear error messages; test in CI/CD environment with git installed |
  | Platform-specific line ending issues (CRLF on Windows) | Medium | Use pathlib.Path.write_text() which handles newline normalization automatically on all platforms |
  | Hard-coded content doesn't meet sentence count requirement | Low | Carefully craft prose content to be exactly 2-3 sentences; verify with unit test before committing |
  | File size outside 300-800 byte range | Low | Validation function catches before git operations; adjust prose length if needed |
  | Encoding issues (BOM present, non-UTF-8) | Low | pathlib.Path.write_text() with UTF-8 encoding produces correct output; validation function checks and fails early |
  | Sentence counting fails on edge cases | Very Low | Simple period counting adequate for human-written prose with proper punctuation; this is by design |

  ## Code Pattern Consistency

  Feature 208 implementation strictly follows the proven pattern from feature 207:

  - **Module docstring**: Describes feature purpose, content, approach, benefits
  - **Constants**: FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT
  - **Function signatures**: Match feature 207 exactly (same parameters, return types, docstrings)
  - **Logging pattern**: Use `_logger = get_logger(__name__)` with consistent log levels and messages
  - **Error handling**: Try/except blocks preserve exception chains, clear error messages
  - **Git commands**: subprocess.run() with shell=False, check=True, capture_output=True
  - **Main orchestration**: Three phases with logging at each step, fail-fast on any error

  ## Testing Strategy

  ### Unit Tests (Per Task TDD Cycles)

  - `test_create_markdown_file()` - File created, correct encoding, LF line endings
  - `test_verify_file_exists()` - Exists check, FileNotFoundError on missing file
  - `test_validate_markdown_format()` - H1 heading, blank line, single heading only
  - `test_validate_sentence_count()` - Correctly counts 2-3 sentences, rejects other counts
  - `test_validate_encoding()` - UTF-8 without BOM, rejects BOM or invalid encoding
  - `test_validate_line_endings()` - LF only, rejects CRLF and CR
  - `test_validate_file_size()` - 300-800 byte range, rejects out-of-range
  - `test_git_operations()` - git add, commit, push all succeed

  ### Integration Tests (Phase 4)

  - Complete workflow from creation through push
  - Verify file appears in git history with correct commit message
  - Verify remote push succeeds

  ### Cross-Platform Testing

  - Linux: Primary development and CI environment
  - macOS: Path handling, line ending normalization (if available)
  - Windows: Path handling, CRLF→LF normalization (if available)

