content: |
  ## Problem Statement

  Create a single markdown file named `test-s4b1z3.md` in the repository root directory
  containing a markdown H1 title and 2-3 sentences of prose content on any topic.
  This continues the series of similar file creation tasks implemented in features 200-207,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic
  file creation workflows following established patterns and conventions.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root Directory** - Contains markdown files created by feature tasks (200+ test-*.md
    files plus several topic markdown files like ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **src/sheep/** - Main Python package with:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management for LLM providers
    - `flows/` - Flow orchestration for the code implementation pipeline
    - `observability/` - Logging and Langfuse integration
    - `tools/` - Git and file operation tools
    - `cli.py` - CLI entry point
  - **specs/** - Feature specifications in YAML format (238 feature specs numbered sequentially)
  - **tests/** - Python test files for validation and integration testing
  - **pyproject.toml** - Python project configuration with dependencies
  - **Docker/** - Docker configuration for containerized execution

  ### Architecture Patterns

  The Sheep platform uses a **Flow-based architecture** with specialized agents:

  1. **Separation of Structure and Intelligence**
     - Flows define execution structure and control paths
     - Crews provide autonomous AI decision-making
     - Each crew is a specialized unit invoked at specific flow steps

  2. **Agent-Based Design**
     - Research agent - analyzes codebase and project context
     - Implementation agent - writes code following conventions
     - Review agent - validates changes for quality and correctness

  3. **Git-Integrated Workflows**
     - Automatic branch creation and management
     - Support for git worktrees for isolated development
     - Full commit/push automation with conventional commit messages

  4. **Deterministic File Creation Pattern**
     - Features 200-207 establish a proven pattern for markdown file creation
     - Each feature creates a file, validates format/content, commits with conventional message, and pushes
     - Validation includes: file existence, size (300-800 bytes), H1 format, blank line separator, sentence count (2-3), UTF-8 encoding, LF line endings

  ### Relevant Technologies

  - **Python 3.11+** - Primary implementation language (per pyproject.toml)
  - **CrewAI** - Multi-agent orchestration framework for autonomous task execution
  - **Langfuse** - Observability and execution tracing
  - **Git/GitPython** - Version control and change management with programmatic API
  - **Markdown** - Documentation format (plain text, no special libraries needed)
  - **pathlib** - Cross-platform file path handling
  - **subprocess** - Git command execution
  - **Multiple LLMs** - OpenAI, Anthropic Claude, Google Gemini (optional for this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-s4b1z3.md` will be created and committed here, following the established pattern of 200+ similar files |
  | Git repository | High | File will be staged, committed with conventional message (feat(208): Create markdown file test-s4b1z3.md), and pushed to remote |
  | specs/208-markdown-file-creation-d81757/ | High | Spec documentation and implementation tracking files |
  | Implementation scripts | Low | May reference or extend existing markdown file creation patterns from features 200-207 |

  ## Dependencies

  - **Python standard library**: pathlib, subprocess, sys modules for file operations and git integration
  - **Git**: Available in environment for staging, committing, and pushing
  - **Established markdown creation pattern**: Based on 8+ previous features (200-207) providing proven implementation template
  - **Sentence parsing logic**: Simple parsing to count sentences using punctuation delimiters (period, exclamation mark, question mark)

  ## Success Criteria

  - [ ] File `test-s4b1z3.md` is created in the repository root directory
  - [ ] File contains exactly one H1 (Markdown `# Title`) heading on the first line
  - [ ] A blank line separates the title from prose content
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] All sentences are grammatically correct and properly punctuated
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File size is between 300-800 bytes (inclusive)
  - [ ] File is staged with `git add test-s4b1z3.md`
  - [ ] File is committed with a conventional commit message (format: `feat(208): Create markdown file test-s4b1z3.md`)
  - [ ] Commit is pushed to remote branch with `git push -u origin HEAD`
  - [ ] All validation checks pass without errors

  ## Size Estimate

  **S** (2-4 hours) — This feature is straightforward file creation following an established pattern:
  - Nearly identical scope to features 200-207 (validated through recent commit history and spec analysis)
  - Core implementation requires 3-4 functions: file creation (~30 lines), validation (~50 lines), git operations (~20 lines)
  - File validation is well-understood: check existence, size (300-800 bytes), H1 format, blank line, sentence count, encoding, line endings
  - No complex business logic, external API calls, or architectural changes required
  - Effort breakdown: 2-3 hours implementation and testing, 1 hour validation and git operations
  - Low risk due to proven pattern established across 8+ recent similar features

  ---

  _Analysis phase completed — feature is ready for requirements specification and implementation planning_
