      endings, validate prose quality and grammar, confirm file size is within expected range.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File contains exactly one H1 heading on first line"
      - "Second line is blank (no spaces)"
      - "Prose starts on line 3 and contains exactly 2-3 complete sentences"
      - "No markdown syntax errors detected"
      - "Prose is grammatically correct and readable"
      - "File encoding confirmed as UTF-8 (no BOM)"
      - "Line endings confirmed as LF (no CRLF)"
      - "File size is within 400-600 byte range (natural outcome of proper structure)"
    tdd:
      red:
        - "Verify validation checks identify any structural issues in the file"
