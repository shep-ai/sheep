    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-6rxe9w.md exists in repository root"
      - "File starts with one line: # <heading>"
      - "Second line is blank"
      - "Lines 3+ contain 2-3 sentences of readable prose"
      - "File is encoded as UTF-8 without BOM"
      - "File uses LF line endings (not CRLF)"
      - "File size is approximately 400-600 bytes"
