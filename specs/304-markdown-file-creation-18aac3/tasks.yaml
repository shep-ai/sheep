        - "Check prose: read aloud, verify grammar and complete sentences"
        - "Check encoding: `file -b test-6rxe9w.md` (should include 'UTF-8' or 'ASCII')"
        - "Check line endings: `od -c test-6rxe9w.md | grep -q '\\\\n' && echo 'LF only'`"
        - "Check size: `wc -c test-6rxe9w.md` and confirm 400-600 byte range"
      refactor:
        - "If any issues found, document them and return to task-1 to fix"
