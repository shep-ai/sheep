      green:
        - "Choose a topic for prose content (e.g., nature, technology, science, etc.)"
        - "Compose 2-3 sentences about the chosen topic (grammatically correct)"
        - "Create Python script: `from pathlib import Path; heading='# <Your Heading>'; prose='<Your 2-3 sentences>'; Path('test-6rxe9w.md').write_text(f'{heading}\\n\\n{prose}\\n')`"
        - "Run the script to create the file"
        - "Verify file exists: `test -f test-6rxe9w.md && echo 'File created'`"
      refactor:
        - "Verify file structure: head -5 test-6rxe9w.md (should show heading, blank line, prose)"
        - "Check file encoding: `file test-6rxe9w.md` (should show UTF-8)"
        - "Verify line endings: `od -c test-6rxe9w.md | head -20` (should show \\n, not \\r\\n)"
        - "Check file size: `wc -c test-6rxe9w.md` (should be ~400-600 bytes)"
        - "Review prose for grammar and readability"
