content: |
  ## Architecture Overview

  This feature fits the established test file creation pattern in the Sheep platform.
  The feature creates a single artifact markdown file at the repository root, following
  the exact structure and workflow from 300+ prior implementations (features 1-303).

  **Key Pattern Elements:**
  - **Repository structure**: Test markdown files (test-*.md) are test artifacts stored
    at the repository root, separate from application source code (/src/sheep/)
  - **File format**: Simple markdown with structure: `# Heading\n\n<2-3 sentences>`
  - **File encoding**: UTF-8 without BOM, LF line endings (automatic with Python text mode)
  - **Git workflow**: Standard add → commit → push sequence using git CLI
  - **Dependencies**: None — uses only Python 3.11+ standard library (pathlib, subprocess)

  The feature is isolated, self-contained, and has no impact on application logic,
  configuration, or other systems.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path("test-6rxe9w.md").write_text(content)`

  **Rationale (from research):**
  - Explicitly required by NFR-5 (Implementation must use Python pathlib.Path)
  - Idiomatic Python 3.11+ approach for text file creation
  - Automatically handles UTF-8 encoding without BOM (NFR-1)
  - Transparently handles LF line endings via text mode (NFR-2)
  - Clean, readable object-oriented API
  - **Precedent:** 300+ existing test files use this pattern

  ### 2. Content Generation: Simple String Literal

  **Chosen:** Imperative Python code with manually composed prose (one H1 heading + 2-3 sentences)

  **Rationale (from research):**
  - NFR-8 allows any topic chosen by implementer (free-form selection)
  - Simple string concatenation is clearest, most maintainable approach
  - Manual prose ensures grammatical correctness (FR-5) without external tools
  - No justification for templating, AI generation, or procedural approaches
  - **Precedent:** 300+ test files use simple direct string composition

  ### 3. Encoding & Line Endings: Python Text Mode Defaults

  **Chosen:** Write `\n` in text mode (Python's universal newline mode handles platform differences)

  **Rationale (from research):**
  - Python 3 text mode (used by pathlib.write_text()) implements universal newline mode per PEP 3116
  - Writing `\n` automatically produces LF on all platforms (Unix/Linux/macOS/Windows)
  - UTF-8 encoding is automatic default in Python 3.11+ text mode (no BOM)
  - No manual encoding parameters or binary mode needed
  - **Precedent:** All 300+ test files use this approach

  ### 4. Git Operations: Shell Commands via subprocess

  **Chosen:** Standard git CLI commands (add, commit, push) via subprocess.run()

  **Rationale (from research):**
  - Lightweight, reliable approach for simple git operations (FR-6 to FR-9)
  - Avoids external dependencies — violates NFR-9 (no new dependencies)
  - Git CLI is universally available on development systems
  - No justification for GitPython, Dulwich, or libgit2 bindings for basic workflow
  - **Precedent:** All 300+ prior feature implementations use this pattern

  ### 5. Content Structure Validation: Manual Verification

  **Chosen:** Implementer verifies markdown structure, grammar, and encoding during creation

  **Rationale (from research):**
  - Structure is simple and well-defined: one H1 heading + blank line + 2-3 sentences
  - Manual verification ensures quality without external dependencies (NFR-9)
  - CommonMark specification is straightforward; implementer can validate by reading output
  - Automated validation would require external libraries (mistune, markdown-it, etc.)
  - **Precedent:** 300+ test files validated manually by implementers

  ## Implementation Strategy

  **Phase ordering:** Sequential, not parallel. Each phase builds on the previous:

  1. **Phase 1 (File Creation & Validation)** comes first because:
     - The file must exist and be correct before staging
     - Content validation ensures quality before git operations
     - Faster iteration if corrections needed before committing

  2. **Phase 2 (Git Integration)** follows because:
     - Git operations (add, commit, push) require the file to exist
     - Conventional commit message references the file
     - Remote push should only occur after local commit is correct

  **Mechanical workflow:**
  ```
  1. Compose prose content on chosen topic (2-3 sentences)
  2. Create file with structure: # Heading\n\n<prose>
  3. Verify: UTF-8 encoding, LF line endings, grammar, 400-600 byte size
  4. Stage: git add test-6rxe9w.md
  5. Commit: git commit with conventional message
  6. Push: git push origin feat/304-markdown-file-creation-18aac3
  ```

  No complex decisions, no alternative paths. The established pattern from 300+ prior
  features provides complete guidance.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (CRLF instead of LF, BOM present) | Use pathlib.Path.write_text() in text mode (automatic UTF-8 LF handling); verify with `file` command or hex dump if needed |
  | File content doesn't meet structure requirements | Manual verification of: (1) H1 heading on line 1, (2) blank line 2, (3) prose on lines 3+. Validate against CommonMark spec. |
  | Prose quality/grammar issues | Read prose aloud; check for grammatical correctness and readability during composition |
  | Git staging/commit failures | Verify git config (user.name, user.email); check branch is correct; use `git status` and `git log` to verify state |
  | Push to wrong branch | Verify current branch (`git branch`) matches `feat/304-markdown-file-creation-18aac3` before push |
  | File size out of expected range | Expected outcome of proper structure (# Heading\n\n<2-3 sentences> typically ~400-600 bytes); if significantly different, review structure |
  | Merge conflicts on remote | Feature branch is dedicated; conflicts unlikely. If they occur, resolve and force-push to feature branch. |
