  ## Problem Statement

  The repository already contains several standalone state machine examples (traffic light, door lock, vending machine, turnstile, elevator). This feature adds one more standalone example markdown file with a simple state machine diagram using a familiar, easy-to-understand domain not already covered.

  ## Codebase Analysis

  ### Project Structure

  The repo root contains standalone `.md` files, each demonstrating a concept:
  - `STATE_MACHINE.md` — traffic light state machine
  - `DOOR_LOCK_STATE_MACHINE.md` — door lock state machine
  - `VENDING_MACHINE_STATE_MACHINE.md` — vending machine state machine
  - `TURNSTILE_STATE_MACHINE.md` — turnstile state machine
  - `ELEVATOR_STATE_MACHINE.md` — elevator state machine

  All follow the same pattern: short description + Mermaid `stateDiagram-v2` diagram.

  ### Architecture Patterns

  Pure content files — no source code, no tests. Files are self-contained markdown documents placed directly in the repo root.

  ### Relevant Technologies

  - **Markdown** for content
  - **Mermaid stateDiagram-v2** for state machine diagrams (used in all existing examples)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repo root (new `.md` file) | Low | Adds one new standalone markdown file following existing conventions |

  ## Dependencies

  No code dependencies. Follows the existing markdown + Mermaid pattern already established in the repo.

  ## Size Estimate

  **S** — Single markdown file, ~20-40 lines. Trivial content addition following a well-established pattern.
