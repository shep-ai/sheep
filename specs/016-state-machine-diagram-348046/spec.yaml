content: |
  ## Problem Statement

  The repository already contains five standalone state machine examples (traffic light, door lock, vending machine, turnstile, elevator). This feature adds a sixth example markdown file with a simple, self-contained state machine diagram in a familiar domain not already covered, continuing the established pattern.

  ## Success Criteria

  - [ ] A new `.md` file exists at the repo root named `<DOMAIN>_STATE_MACHINE.md` in SCREAMING_SNAKE_CASE
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` block that renders without errors
  - [ ] The diagram has 5–6 states including an explicit `[*]` start state and `[*]` end state
  - [ ] Each transition is labeled with a meaningful event/action name
  - [ ] The domain is not one already covered by existing files (not traffic light, door lock, vending machine, turnstile, or elevator)
  - [ ] The file includes a brief prose description (1–3 sentences) above the diagram
  - [ ] The file structure matches the pattern of existing state machine markdown files

  ## Functional Requirements

  - **FR-1**: A new markdown file must be created at the repo root following the `<NAME>_STATE_MACHINE.md` naming convention.
  - **FR-2**: The file must contain a Mermaid `stateDiagram-v2` code block as the primary content.
  - **FR-3**: The state machine must include a defined initial state (using `[*]`) and at least one terminal state (using `[*]`).
  - **FR-4**: Every state transition must carry a descriptive label indicating the triggering event or action.
  - **FR-5**: The chosen domain must not duplicate any domain already represented in the repo root (traffic light, door lock, vending machine, turnstile, elevator).
  - **FR-6**: A short prose description (1–3 sentences) must precede the diagram to explain the domain context.

  ## Non-Functional Requirements

  - **NFR-1**: The file must be valid Markdown — no syntax errors that would prevent rendering on GitHub.
  - **NFR-2**: The Mermaid diagram must use correct `stateDiagram-v2` syntax compatible with Mermaid v9+ (the version used in all existing files).
  - **NFR-3**: The total file length should be 20–40 lines — concise and illustrative, not exhaustive.
  - **NFR-4**: State and transition names must be human-readable (no cryptic abbreviations).
  - **NFR-5**: The file must be self-contained — no links, imports, or references to other repo files required to understand it.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which domain should the new state machine use? | Washing machine | Universally understood, distinct from all existing examples, clean linear flow |
  | 2 | What filename convention? | SCREAMING_SNAKE_CASE.md | Matches every existing state machine file in the repo |
  | 3 | How many states? | 5–6 states | Illustrative without being complex; matches existing examples' complexity level |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repo root (new `.md` file) | Low | Adds one new standalone markdown file following existing conventions |

  ## Dependencies

  No code dependencies. Follows the existing markdown + Mermaid pattern already established in the repo.

  ## Size Estimate

  **S** — Single markdown file, ~20–35 lines. Trivial content addition following a well-established pattern. Requirements phase did not uncover any scope increase.
