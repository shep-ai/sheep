content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-04

  ## Architecture Overview

  This is a pure content addition to the repo root. The repo already contains five standalone state machine markdown files (STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md). The new file is the sixth in that series, following the identical structural pattern. No code, configuration, or build system is touched.

  ## Key Design Decisions

  **Domain: Washing machine**
  Chosen over traffic light (too close to existing example), ATM (branching complexity), and phone call (cluttered transitions). Washing machine provides a clean 5-state linear flow that is universally understood without domain knowledge.

  **Filename: WASHING_MACHINE_STATE_MACHINE.md**
  Matches SCREAMING_SNAKE_CASE convention used by all existing state machine files. Kebab-case would be inconsistent with every other file in the series.

  **States: 5 domain states (Idle, Washing, Rinsing, Spinning, Done) + [*] start/end**
  Matches the complexity level of ELEVATOR_STATE_MACHINE.md. Three-state diagrams feel trivial; 7+ states contradict the "SUPER FAST / simple" intent.

  **Syntax: stateDiagram-v2**
  Every existing file in the repo uses stateDiagram-v2. Using v1 would break consistent rendering.

  **File structure: H1 → prose (1–2 sentences) → fenced mermaid block**
  Direct match to ELEVATOR_STATE_MACHINE.md. No extended sections or tables — those patterns don't appear in any existing file.

  ## Implementation Strategy

  Single phase, single task. Read an existing file for exact formatting reference, then create the new file. No integration work required.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error prevents rendering | Reference ELEVATOR_STATE_MACHINE.md exactly; use stateDiagram-v2 with [*] start/end as shown in existing files |
  | Domain overlap with existing examples | Confirmed: washing machine not present in any of the five existing files |
  | Filename deviation from convention | Use SCREAMING_SNAKE_CASE matching all existing files precisely |
