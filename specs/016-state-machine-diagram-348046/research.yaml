content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. Domain Selection

  **Chosen:** Washing machine (Idle → Washing → Rinsing → Spinning → Done)

  **Rejected:**
  - Traffic light (pedestrian) — too close to existing STATE_MACHINE.md traffic light example
  - ATM / bank card — more complex branching; contradicts "simple" intent
  - Phone call — transitions can become cluttered with realistic edge cases

  **Rationale:** Clean linear flow, universally understood domain, zero overlap with existing five examples. Produces a visually clean stateDiagram-v2 diagram without crossed arrows.

  ### 2. Filename Convention

  **Chosen:** `WASHING_MACHINE_STATE_MACHINE.md` (SCREAMING_SNAKE_CASE)

  **Rejected:**
  - kebab-case — inconsistent with every existing state machine file in the repo root

  **Rationale:** All existing files follow SCREAMING_SNAKE_CASE; matching the convention requires no explanation.

  ### 3. Number of States

  **Chosen:** 5 domain states (Idle, Washing, Rinsing, Spinning, Done) + [*] start/end

  **Rejected:**
  - 3–4 states — too trivial, feels incomplete
  - 7+ states — over-engineered for a "simple / SUPER FAST" example

  **Rationale:** Matches the complexity level of ELEVATOR_STATE_MACHINE.md; illustrative without being complex.

  ### 4. Mermaid Syntax Version

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — all existing repo files use v2; v1 would be inconsistent

  **Rationale:** Direct pattern match with every existing file in the repo.

  ### 5. File Structure

  **Chosen:** H1 title → 1–2 sentence prose → fenced mermaid block (matches ELEVATOR_STATE_MACHINE.md)

  **Rejected:**
  - Extended multi-section prose — no existing file uses this; over-engineered
  - Diagram only (no prose) — inconsistent with all existing files

  **Rationale:** The established minimal pattern keeps the file concise (target 15–20 lines) and consistent.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | Diagram rendering | Use | Already used by all existing state machine files in this repo |
  | Any other diagramming tool | Alternative rendering | Reject | Introducing a new diagram format adds tooling complexity with zero benefit |

  ## Security Considerations

  None. This is a static markdown file with no code execution, no user input, and no external dependencies. Mermaid diagrams rendered on GitHub are sandboxed by GitHub's own CSP. No security implications.

  ## Performance Implications

  None. A single ~20-line markdown file has negligible impact on repo size, clone time, or CI duration. Mermaid renders client-side in the browser; no build step is required.

  ## Architecture Notes

  This file is a standalone content addition to the repo root. It follows the exact same pattern as the five existing state machine markdown files and requires no changes to any configuration, build system, or other source file. The implementation is a direct 1:1 content task with no integration points.
