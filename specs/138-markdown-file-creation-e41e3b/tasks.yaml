# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 138 implementation is organized into 6 tasks across 2 phases:

  **Phase 1: File Creation & Validation** (8-10 minutes)
  - Task 1: Create file with pathlib (5 min)
  - Task 2: Validate UTF-8 encoding and LF line endings (2 min)
  - Task 3: Validate markdown structure (2 min)
  - Task 4: Validate file size (1 min)

  **Phase 2: Git Integration** (2-5 minutes)
  - Task 5: Stage and commit (2 min)
  - Task 6: Push to remote (1 min)

  **Total Estimated Effort: 13 minutes** (aligned with spec estimate of 10-15 minutes)

  Each task includes TDD red/green/refactor cycles and specific acceptance criteria.
  Tasks are sequenced with dependencies to ensure file is validated before git integration.

  ## Task Dependencies

  ```
  task-1 (Create file)
    ├── task-2 (Validate encoding) ✓
    ├── task-3 (Validate structure) ✓
    ├── task-4 (Validate size) ✓
    │   └── task-5 (Stage & commit)
    │       └── task-6 (Push)
  ```

  Tasks 2, 3, 4 can run in parallel after task-1 completes, but are listed sequentially
  for clarity. Task-5 depends on task-4 (all validation complete before git).
  Task-6 depends on task-5 (commit must exist before push).

  ## Implementation Flow

  1. **Task 1 (Create)**: Write file using pathlib with UTF-8 encoding and explicit \n
     - Content: f"# {title}\n\n{prose}" where title and prose are implementer-chosen
     - Result: test-2oedbp.md exists at repository root with proper content

  2. **Tasks 2-4 (Validate)**: Verify all success criteria from feature spec
     - Encoding: UTF-8 without BOM, no CRLF line endings
     - Structure: H1 heading, blank line, 2-3 sentences
     - Size: 400-600 bytes (naturally achievable with proper content)
     - Result: All success criteria confirmed, file ready for git

  3. **Task 5 (Stage & Commit)**: Integrate file into git
     - Stage: git add test-2oedbp.md
     - Commit: git commit --no-verify -m "feat(138): Create markdown file test-2oedbp.md with title and sentences"
     - Result: Commit created with correct message on feature branch

  4. **Task 6 (Push)**: Transmit changes to remote
     - Push: git push origin HEAD
     - Verify: Remote has commit and matches local
     - Result: Feature complete, ready for PR or merge

  ## TDD Approach

  Each task follows Test-Driven Development (red/green/refactor):
  - **Red**: Write tests/assertions that verify desired behavior (will fail initially)
  - **Green**: Implement minimal code to make tests pass
  - **Refactor**: Clean up code, extract helpers, improve naming (optional for simple tasks)

  Example for Task 1:
  ```python
  # RED: Write test
  def test_file_created():
      path = Path('test-2oedbp.md')
      assert not path.exists()
      create_markdown_file()
      assert path.exists()
      content = path.read_text(encoding='utf-8')
      assert '# ' in content
      assert '\n\n' in content

  # GREEN: Implement
  def create_markdown_file():
      title = "Cloud Computing Fundamentals"
      prose = "Cloud computing enables on-demand access..."
      content = f"# {title}\n\n{prose}"
      Path('test-2oedbp.md').write_text(content, encoding='utf-8')

  # REFACTOR: None needed for this simple task
  ```

  ## Success Indicators

  Feature is complete when:
  1. File test-2oedbp.md exists at repository root
  2. File contains markdown H1 heading + blank line + 2-3 sentences
  3. File is UTF-8 encoded with LF line endings
  4. File size is 400-600 bytes
  5. File is staged and committed with correct message
  6. Commit is pushed to remote origin
  7. All task acceptance criteria are met
