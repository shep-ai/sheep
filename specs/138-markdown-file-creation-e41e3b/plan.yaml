# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 138 implements a single, isolated markdown file creation following the established
  pattern from 138+ existing test files (features 001-137). The architecture is minimal:

  - **Single file creation**: Create `test-2oedbp.md` at repository root with no modifications to
    existing files, source code, configuration, or tests.
  - **Self-contained implementation**: No dependencies on application source code (/src/sheep/),
    no integration with existing features, no architectural coupling.
  - **Established precedent**: All 138+ existing test files follow identical format and creation
    approach, providing clear reference implementations.
  - **Straightforward validation**: Post-creation verification ensures success criteria are met
    using only Python standard library (pathlib, str methods) — no external validation libraries needed.
  - **Standard git workflow**: Uses conventional commits and direct git CLI commands, matching
    the pattern from all 138+ preceding implementations.

  The feature demonstrates the Sheep automated implementation platform's ability to reliably
  create simple files, validate their contents, and integrate changes into version control.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Choice**: Use `pathlib.Path.write_text(content, encoding='utf-8')`

  **Rationale**:
  - Explicitly required by NFR-5 (feature spec)
  - Standard, idiomatic approach in Python 3.11+
  - Direct `encoding` parameter guarantees UTF-8 without BOM
  - Automatic file closure (no context manager boilerplate)
  - Cross-platform compatibility (pathlib abstracts OS-specific paths)
  - All 138+ existing test files use this approach, establishing clear precedent

  **Alternative Considered**: `open()` builtin with context manager
  - More verbose and lower-level
  - Requires explicit `close()` or context manager
  - Less idiomatic in modern Python

  ### 2. Line Endings: Explicit \n in f-string

  **Choice**: Use f-string with explicit `\n` delimiters: `f"# {title}\n\n{prose}"`

  **Rationale**:
  - Explicit `\n` characters guarantee Unix-style LF endings regardless of platform
  - pathlib's `write_text()` in Python 3 preserves `\n` as-is without translating to CRLF
  - Maximally readable and explicit about intended line endings
  - Simple and idiomatic for fixed markdown structure

  **Alternative Considered**: Multiline string literals or template engines
  - Less explicit about line endings
  - Add unnecessary complexity

  ### 3. Content Validation: Post-Creation Verification

  **Choice**: Implement validation after file write: read file back and verify structure

  **Rationale**:
  - Ensures file was written correctly (catches filesystem errors, permissions issues)
  - Validates encoding, line endings, markdown structure, and file size
  - Uses only Python standard library (no external dependencies)
  - Supports TDD approach (write tests first, then implementation)
  - Research findings confirm this approach is appropriate for the simple format

  **Alternative Considered**: Pre-creation validation or no validation
  - Pre-creation is harder to debug
  - No validation risks silent failures

  ### 4. Topic Selection: Implementer-Chosen

  **Choice**: Allow implementer to choose any topic at implementation time

  **Rationale**:
  - User query explicitly states "about anything"
  - 138+ existing files demonstrate diverse, implementer-chosen topics
  - Maximizes flexibility and aligns with established pattern
  - Reduces implementation complexity (no topic lists or generation)

  **Alternative Considered**: Predefined topic list or auto-generation
  - Constrains flexibility
  - Contradicts "about anything" in user query

  ### 5. Git Workflow: Direct CLI Commands

  **Choice**: Use direct git CLI commands: `git add`, `git commit --no-verify`, `git push`

  **Rationale**:
  - No external dependencies (git CLI available in all CI environments)
  - Simple, transparent, easy to debug
  - Matches all 138+ existing implementations
  - Conventional commit message format enforced by exact specification

  **Alternative Considered**: GitPython or pygit2 libraries
  - Unnecessary dependency
  - More complex and verbose

  ## Implementation Strategy

  ### Two-Phase Approach

  **Phase 1: File Creation & Validation** (8-10 minutes)
  - Create markdown file with proper heading and prose content
  - Validate all success criteria:
    - UTF-8 encoding, no BOM
    - Unix LF line endings (not CRLF)
    - Correct markdown structure (H1 + blank line + 2-3 sentences)
    - File size 400-600 bytes
  - This phase establishes the file on disk before git integration

  **Phase 2: Git Integration** (2-5 minutes)
  - Stage file in git (`git add test-2oedbp.md`)
  - Create conventional commit (`git commit --no-verify -m "feat(138): ..."`)
  - Push to remote (`git push origin HEAD`)
  - This phase completes the feature by integrating into version control

  ### Why This Order

  1. **Validation before git**: Ensures file is correct before committing to version control
  2. **Single commit**: All changes (file creation + validation) staged and committed together
  3. **Sequential git operations**: Add → commit → push, following standard workflow
  4. **Minimal, focused tasks**: Each task accomplishes one clear objective with testable acceptance criteria

  ## Success Criteria Alignment

  The implementation strategy directly maps to the feature spec's success criteria:

  | Spec Requirement | Implementation Phase | Verification Task |
  | --- | --- | --- |
  | File exists at root | Phase 1, Task 1 | Read file path and assert existence |
  | H1 heading on first line | Phase 1, Task 2 | Parse first line and verify `#` prefix |
  | Blank line after heading | Phase 1, Task 2 | Verify line 2 is empty |
  | 2-3 sentences of prose | Phase 1, Task 3 | Count sentences and assert range |
  | UTF-8 encoding, no BOM | Phase 1, Task 2 | Read binary and verify encoding bytes |
  | Unix LF line endings | Phase 1, Task 2 | Verify no `\r` characters in file |
  | File size 400-600 bytes | Phase 1, Task 4 | Check file size with `Path.stat()` |
  | Staged in git | Phase 2, Task 5 | Run `git status` and verify staged |
  | Conventional commit message | Phase 2, Task 6 | Run `git log` and verify message |
  | Changes pushed to remote | Phase 2, Task 6 | Run `git rev-parse HEAD` and compare with remote |

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | --- | --- | --- | --- |
  | File encoding is CRLF instead of LF | Low | Medium | Explicit `\n` in f-string + post-creation validation reads file and asserts no `\r` bytes |
  | File not UTF-8 encoded | Low | Medium | Use pathlib.Path.write_text(encoding='utf-8') explicitly + validation reads and verifies |
  | Markdown structure invalid | Low | Low | Validation parses heading and sentences, asserts structure matches spec |
  | Git push fails (network, permissions, branch issues) | Low | High | Check git status before push, ensure feature branch exists and is tracking remote |
  | Implementer forgets to use pathlib | Medium | Medium | Task description explicitly mandates pathlib usage, research findings provide reference |
  | File size outside 400-600 bytes | Low | Low | Validation checks file size and asserts range (naturally falls in range with 2-3 sentences) |
  | Conventional commit message incorrect | Low | Low | Exact message specified in spec; task provides message template |

  ## Code Quality & Standards

  - **No external dependencies**: All validations use Python standard library (pathlib, str methods)
  - **No complexity**: Simple, straightforward code suitable for an "S" size estimate
  - **Precedent-driven**: Implementation follows established patterns from 138+ existing files
  - **Testable**: Each validation check can be tested independently in TDD red/green/refactor cycle
  - **Documented**: Comments explain why explicit `\n` and `encoding='utf-8'` are needed

  ## Integration Points

  - **No source code coupling**: Feature does not depend on or modify /src/sheep/ code
  - **No configuration changes**: No modifications to pyproject.toml, .github/, or other configs
  - **No test framework changes**: Feature is self-contained validation, not dependent on pytest or other test infra
  - **Standard git workflow**: Uses conventional commits already adopted by project (seen in recent history)
  - **Isolated artifact**: New file is a test artifact, not part of application delivery

  ## Future Extensibility

  This implementation establishes a clear pattern for feature 139 (and 140, 141, etc.) to follow:
  - Same file creation approach (pathlib)
  - Same validation strategy (post-creation verification)
  - Same git workflow (conventional commits + push)
  - Minimal overhead to repeat this feature N times
