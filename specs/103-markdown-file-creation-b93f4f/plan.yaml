content: |
  ## Architecture Overview

  Feature 103 follows the **utility-driven orchestration pattern** established by 102 preceding features.
  Instead of reimplementing markdown generation, file I/O, validation, or git operations, the feature module
  imports proven utility functions from `content_generators.py` and orchestrates them in sequence.

  **Architecture Stack:**
  - **Feature Module** (`feature_103_markdown_file_creation.py`): Thin orchestration layer (~50 lines)
  - **Utility Layer** (`content_generators.py`): Reusable functions for generation, I/O, validation, git ops
  - **Tool Layer** (`git_tools.py`): CrewAI BaseTool wrappers for agent integration
  - **LLM Integration** (`config/llm.py`): Claude API via CrewAI abstraction
  - **Observability** (`observability/logging.py`): Structured logging via structlog

  This layered approach maximizes code reuse, simplifies testing, and ensures consistency across all 103 features.

  ## Key Design Decisions

  ### 1. Utility-Driven Orchestration (Not Inline Implementation)

  **Decision:** Import and compose existing utility functions rather than reimplementing logic.

  **Rationale:**
  - Proven pattern across 102 prior features
  - All utilities tested and production-ready
  - Reduces feature module to ~50 lines of orchestration code
  - Enables rapid feature creation (copy template, update metadata, test)
  - Simplifies debugging via isolated utility functions

  **Alternatives Considered:**
  - Inline implementation: Would duplicate 400+ lines of code. Unmaintainable across 103 features.
  - Monolithic class: Tight coupling; hard to test parts in isolation.

  ### 2. LLM-Based Content Generation (Not Static/Template)

  **Decision:** Use `generate_markdown_content()` from `content_generators.py` which calls Claude API via CrewAI.

  **Rationale:**
  - Generates diverse, contextually-appropriate prose using Claude's reasoning
  - Aligns with Sheep's agent-driven architecture and CrewAI integration
  - Proven across 102 features with high-quality, consistent output
  - Structured prompt engineering ensures format compliance (H1 + blank line + 2-3 sentences)
  - No template management or hardcoded content required

  **Alternatives Considered:**
  - Static prose: Would require hardcoding per feature; violates DRY; not scalable to 103+ features
  - Template-based: Would add template management complexity without flexibility benefits

  ### 3. Strict File Validation (Not Lenient)

  **Decision:** Use `validate_markdown_file()` with comprehensive checks: UTF-8 encoding, LF line endings, H1 heading, exactly 2-3 sentences, ~400-600 bytes, valid markdown syntax.

  **Rationale:**
  - Ensures consistency with 102 preceding test files
  - Catches format issues early (fail-fast principle)
  - Two-stage validation: generation + write prevents LLM bugs from reaching storage
  - Descriptive error messages enable quick debugging

  **Alternatives Considered:**
  - Lenient validation: Would risk inconsistency and mask format issues
  - No validation: Would violate fail-fast; prompt bugs go undetected

  ### 4. Standard Git Integration (Using Proven Tool Wrappers)

  **Decision:** Use `commit_markdown_file()` and `push_markdown_file()` utilities which wrap `GitCommitTool` and `GitPushTool`.

  **Rationale:**
  - Tool wrappers provide abstraction, error handling, and CrewAI integration
  - Proven across 102+ features
  - Conventional Commits format enforced for clean git history
  - Upstream tracking enables CI/CD pipeline integration

  **Alternatives Considered:**
  - Direct subprocess: Low-level, error-prone, difficult to test
  - Shell command strings: Security risk from injection; platform-specific

  ### 5. Structured Logging Throughout

  **Decision:** Use `get_logger(__name__)` for all operations (generation, file write, validation, git ops).

  **Rationale:**
  - Observability for debugging and performance monitoring
  - Integration with Langfuse tracing system
  - Structured logging enables context tracking and JSON serialization
  - Existing infrastructure; no additional setup required

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3**

  1. **Feature Module Implementation First**: Create the orchestration module before testing. The module is the artifact that gets tested and executed.

  2. **Testing Second**: Write comprehensive tests verifying the workflow produces correct markdown file with proper format, encoding, and metadata.

  3. **Git Integration Last**: Execute git operations after the file is created and validated. No point staging/committing a file that doesn't meet quality criteria.

  ### Workflow in Detail

  ```
  1. Import utilities from content_generators.py
  2. Call generate_markdown_content() → returns heading + prose
  3. Call write_markdown_file(filename, content) → creates test-9u3i86.md
  4. Call validate_markdown_file(filepath) → confirms UTF-8, LF, 2-3 sentences, H1 heading
  5. Call commit_markdown_file(filepath, msg) → stages and commits with "feat: create markdown file test-9u3i86.md"
  6. Call push_markdown_file(branch) → pushes to remote feature branch feat/103-markdown-file-creation-b93f4f
  7. Return success status
  ```

  All operations logged via structlog. Each step validates previous step's output before proceeding.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates non-compliant content (e.g., 1 sentence instead of 2-3) | Strict validation with `validate_markdown_file()` after generation; descriptive errors enable quick prompt refinement. Two-stage validation catches issues before file write. |
  | File encoding issues (BOM, CRLF, invalid UTF-8) | `validate_markdown_file()` performs binary read + UTF-8 decode; explicitly checks for BOM and CRLF presence. `write_markdown_file()` uses pathlib with explicit UTF-8 encoding. |
  | Git operations fail (staging, commit, push) | Use tested `commit_markdown_file()` and `push_markdown_file()` utilities which handle error cases. Tool wrappers provide CrewAI integration for tracing and retry logic. |
  | File already exists (collision) | `write_markdown_file()` uses unique filename (test-9u3i86.md); 102 prior features use similar unique names with no collisions. Path validation prevents directory traversal. |
  | Network failure during push | CrewAI tool execution includes retry logic. Push operation is final step, so failure doesn't affect file creation or git history. Can be retried independently. |
  | Upstream branch doesn't exist | `push_markdown_file()` creates upstream tracking on first push. Feature branch `feat/103-markdown-file-creation-b93f4f` exists per requirements. |

  ## Testing Strategy (from tasks.yaml)

  - Unit test: Feature module imports and calls utilities without errors
  - Integration test: Full workflow creates markdown file with correct properties
  - Validation test: Generated content passes `validate_markdown_file()` checks
  - Git test: File is staged, committed with correct message, and pushed to branch

  ## Effort Estimate

  **Total: 10-15 minutes**

  - Phase 1 (Feature Module): 3-5 minutes — Create orchestration module, import utilities, wire workflow
  - Phase 2 (Testing): 4-7 minutes — Write tests, verify markdown content, validate encoding/syntax
  - Phase 3 (Git): 2-3 minutes — Commit and push using utilities

  This estimate is based on:
  - Proven pattern across 102 features with consistent 10-15 minute cycles
  - Complete utility library (no need to implement validation or git logic)
  - Single file creation with no complex dependencies
  - All product decisions already resolved, no architectural unknowns

  ---

  _Plan complete. Ready for implementation with clear phases, architecture decisions documented,
  and risk mitigation strategies in place._
