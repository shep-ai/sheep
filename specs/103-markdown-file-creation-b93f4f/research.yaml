decisions:
  - title: "Content Generation Strategy (LLM vs Static vs Template)"
    chosen: "LLM-based content generation using Claude API via CrewAI framework"
    rejected:
      - "Static/manually-written prose: Would require hardcoding content per feature, violating DRY principle and limiting scalability to 102+ features. Cannot scale beyond single implementation."
      - "Template-based generation: Would require maintaining separate template files and template logic, adding complexity without benefit. Less flexible for varied topics."
    rationale: >
      LLM-based generation aligns perfectly with Sheep's agent-driven architecture.
      This approach generates diverse, contextually-appropriate prose about any topic using Claude's reasoning capabilities,
      matches existing pattern established by features 001-102 (102 successful implementations),
      integrates with CrewAI framework, requires zero template management, and ensures consistent high-quality output
      through structured prompt engineering. The prompt in content_generators.py ensures format compliance:
      H1 heading, blank line, and 2-3 sentences.

  - title: "File Encoding and Line Ending Strategy (UTF-8 variants and line ending styles)"
    chosen: "UTF-8 encoding without BOM, Unix LF line endings"
    rejected:
      - "UTF-8 with BOM: Adds unnecessary 3-byte overhead, causes parser issues, violates Git best practices. No benefit for ASCII-compatible content."
      - "CRLF line endings: Windows-specific convention; repository is Linux-based. Creates spurious diffs. Inconsistent with platform standard."
      - "ASCII encoding: Unnecessarily restrictive; UTF-8 is backward-compatible with ASCII while supporting international characters."
    rationale: >
      UTF-8 without BOM and LF line endings are industry standard for cross-platform compatibility (Unix/Linux/macOS),
      Git repository best practices (no spurious diffs), consistency with 102 preceding test files,
      broad markdown parser support, and Python's default text mode on Unix systems.
      Implementation uses pathlib.Path.open(encoding=\"utf-8\") and validates against CRLF and BOM.

  - title: "Validation Approach (Strict vs Lenient vs None)"
    chosen: "Comprehensive strict validation using binary read and text parsing"
    rejected:
      - "Lenient validation: Accept 1-4 sentences, CRLF or LF, relaxed markdown checks. Risks inconsistency with 102 prior files and hidden format issues."
      - "No validation: Assume LLM always generates correct format. Violates fail-fast principle; prompt bugs would go undetected until integration testing."
    rationale: >
      Strict validation ensures consistency with 102 preceding test files and catches format issues early.
      The validate_markdown_file() function performs comprehensive checks: binary read for encoding issues (BOM, invalid UTF-8),
      sentence counting (2-3 periods), H1 heading check, line ending validation (no CRLF), trailing newline,
      blank line separator, and UTF-8 decoding. All checks fail-fast with descriptive error messages.

  - title: "Git Integration Pattern (Direct subprocess vs Custom tools vs High-level wrappers)"
    chosen: "Custom GitCommitTool and GitPushTool wrappers via content_generators.py utilities"
    rejected:
      - "Direct subprocess.run() calls: Low-level, error-prone, difficult to test. No reusability. Harder to add tracing/logging."
      - "Shell command strings: Security risk from command injection. Platform-specific. Difficult to parse output. Not easily testable."
    rationale: >
      Custom tool wrappers provide abstraction layer proven across 102+ features.
      GitCommitTool handles staging, message formatting, error handling.
      GitPushTool handles upstream tracking, remote configuration, push verification.
      commit_markdown_file() and push_markdown_file() utilities orchestrate git operations with conventional commits format,
      integrate with CrewAI framework for tracing via Langfuse, and provide reusable building blocks across features.

  - title: "Implementation Pattern (Inline vs Utility-driven vs Monolithic class)"
    chosen: "Utility-driven orchestration: Import content_generators functions, create feature-specific wrapper function"
    rejected:
      - "Inline implementation: Duplicate all logic within feature module. Violates DRY; 102 prior implementations show this doesn't scale."
      - "Monolithic class: Single class handling generation, I/O, validation, git ops. Tight coupling; hard to test parts in isolation."
    rationale: >
      Utility-driven approach maximizes code reuse and maintainability, proven across 102 prior features.
      Feature modules import all utilities from content_generators.py and create wrapper functions handling feature-specific metadata.
      Feature 102 demonstrates pattern: ~50 lines of feature code vs. 400+ if inlined.
      Approach enables rapid feature creation, easy debugging via isolated utility functions, and flexible parameterization.

