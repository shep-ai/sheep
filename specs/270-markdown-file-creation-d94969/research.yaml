      without boilerplate code. Codebase analysis of 216+ existing test files and 269 prior features
      confirms this is the established pattern. Simpler, more maintainable than subprocess-based
      file creation.

  - title: "Text Encoding and Line Ending Handling"
    chosen: "Write literal \\n characters (Unix LF) via pathlib.Path.write_text(encoding='utf-8')"
