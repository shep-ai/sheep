content: |
  ## Problem Statement

  Create a single markdown file called `test-nggasu.md` in the repository root with a title and 2-3 sentences of prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established
  pattern and convention used throughout 290+ previous iterations in this repository (features 005-294).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-nggasu.md`
  - Committed with conventional commit message: `feat(295): create markdown file test-nggasu.md with prose content`
  - Pushed to the feature branch `feat/295-markdown-file-creation-40b14d`

  ## Success Criteria

  - [ ] File `test-nggasu.md` exists in repository root directory
  - [ ] File begins with H1 heading using `# Title` format on first line
  - [ ] H1 heading is followed by exactly one blank line
  - [ ] File contains 2-3 sentences of readable prose content after the blank line
  - [ ] File is UTF-8 encoded without byte-order mark (BOM)
  - [ ] File uses Unix LF line endings exclusively (never Windows CRLF)
  - [ ] File size naturally falls between 400-600 bytes (consequence of proper structure)
  - [ ] File is staged using `git add test-nggasu.md`
  - [ ] Git commit created with message: `feat(295): create markdown file test-nggasu.md with prose content`
  - [ ] Commit exists on feature branch `feat/295-markdown-file-creation-40b14d`
  - [ ] Changes are pushed to remote origin repository

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation built on CrewAI. The codebase is organized as follows:

  - **Repository root**: Contains 290+ test markdown files (test-*.md) following a consistent naming and content pattern. These are validation artifacts created by the markdown-file-creation feature workflow, not part of application source code.
  - **src/sheep/**: Application source code organized into subdirectories for agents, flows, tools, observability, and configuration. Not affected by this feature.
  - **specs/**: Feature specification directory with numbered subdirectories (specs/295-markdown-file-creation-40b14d/, etc.) containing YAML specifications for each feature. This feature updates only its own spec.yaml file.
  - **tests/**: Test suite for the application. Not affected by this feature.
  - **.github/workflows/**: CI/CD pipeline configuration. Contains placeholder build/test jobs that sleep for 10 seconds.
  - **pyproject.toml**: Python project configuration specifying Python 3.11+ requirement, dependencies (CrewAI, langfuse, gitpython, etc.), and build configuration.
  - **src/create_markdown.py**: Helper module providing utilities for markdown content generation, validation, and git integration. Available for use if needed.

  The test markdown files at the repository root are isolated artifacts that do not interact with application source code. They serve as validation targets for the automated implementation system and follow a well-established pattern across 290+ prior features.

  ### Architecture Patterns

  **Established File Creation Pattern** (290+ precedents):
  - Simple file creation using Python pathlib (`Path.write_text()` method)
  - Each markdown file follows a strict structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, LF line endings (Unix style)
  - File size typically 400-600 bytes as a natural outcome of proper heading and prose structure
  - Implementation is straightforward imperative code: define content string, write to file using pathlib
  - Files are isolated test artifacts with no dependencies on application source code or other markdown files
  - Content topics are free-form and diverse (nature, technology, science, history, philosophy, culture, etc.) across existing test files

  **Git Workflow Pattern** (consistently applied across all 290+ features):
  - Feature branch pre-created with naming convention: `feat/<number>-<feature-name>-<suffix>`
  - Current branch: `feat/295-markdown-file-creation-40b14d`
  - Workflow sequence: create/modify files → stage with `git add <filename>` → commit with conventional message → push to origin
  - Conventional commit format: `feat(295): create markdown file test-nggasu.md with prose content`
  - No modifications to source code, tests, or configuration files
  - Single commit per feature, no complex merge scenarios

  **Feature Implementation Pattern** (consistent across features 005-294):
  - Minimal, isolated changes affecting only the repository root directory
  - Each feature creates exactly one markdown file
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Simple, repetitive implementation following proven template
  - Feature numbering system drives file naming: feature 295 → test-nggasu.md

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (enforced in pyproject.toml). Used for file I/O operations.
  - **pathlib (Python standard library)**: Core tool for file creation. Method `Path("test-nggasu.md").write_text(content, encoding="utf-8")` creates the file with proper encoding.
  - **Git**: Version control system for staging (`git add`), committing (`git commit`), and pushing (`git push`) changes. Already configured in repository with feature branch `feat/295-markdown-file-creation-40b14d`.
  - **Markdown syntax**: Simple format per CommonMark specification. This feature uses only H1 heading (`#`) and prose text (no advanced features like lists, code blocks, links).
  - **GitHub Actions**: CI/CD pipeline defined in `.github/workflows/ci.yml`. Placeholder jobs run during push/PR. Feature completion includes pushing changes that will trigger CI.
  - **CrewAI framework**: Powers the Sheep platform for agent-based automation. Not directly relevant to this file creation task but provides overall automation context.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-nggasu.md) to existing collection of 290+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 005-294; no branch/merge complexity, no destructive operations, no conflicts |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or other infrastructure |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/295-markdown-file-creation-40b14d` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 290+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<random-string>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  **No External Package Dependencies**:
  - Feature uses only Python standard library (pathlib, subprocess for git operations if needed)
  - No additional pip packages required beyond existing project dependencies
  - No API keys, credentials, or external service integrations needed
  - No database, cache, or storage system dependencies

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes of actual implementation work) — This is a minimal-effort, single-file creation feature:

  **Breakdown**:
  - File creation: ~3-5 minutes (write markdown content with H1 heading and 2-3 sentences of prose)
  - Validation: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - Git operations: ~3-5 minutes (stage file, create commit with conventional message, push to branch)
  - Total implementation: 10-15 minutes of active work

  **Justification**:
  - Well-established pattern with 290+ identical test files providing clear, proven precedent
  - No architectural decisions, design choices, or research required
  - Flexible topic selection with no constraints or requirements analysis needed
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing beyond basic file format validation, no documentation changes, no configuration updates
  - File naming (test-nggasu.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 290+ prior implementations
  - Recent feature implementations (290-294) demonstrate efficient execution of identical features in 10-20 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern

  ---

  _Analysis phase complete — project structure understood, architecture patterns identified, affected areas mapped, dependencies enumerated, complexity assessed as Small (S) — ready for implementation_
