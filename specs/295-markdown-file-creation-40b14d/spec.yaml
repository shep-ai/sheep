content: |
  ## Problem Statement

  Create a single markdown file called `test-nggasu.md` in the repository root with a title and 2-3 sentences of prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established
  pattern and convention used throughout 290+ previous iterations in this repository (features 005-294).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-nggasu.md`
  - Committed with conventional commit message: `feat(295): create markdown file test-nggasu.md with prose content`
  - Pushed to the feature branch `feat/295-markdown-file-creation-40b14d`

  ## Success Criteria

  - [ ] File `test-nggasu.md` created in repository root directory
  - [ ] File begins with H1 heading using `# Title` format on first line
  - [ ] H1 heading is followed by exactly one blank line (no more, no less)
  - [ ] File contains 2-3 sentences of readable, coherent prose content after the blank line
  - [ ] File is UTF-8 encoded without byte-order mark (BOM)
  - [ ] File uses Unix LF line endings exclusively (never Windows CRLF or mixed)
  - [ ] File size is between 400-600 bytes (natural consequence of proper structure)
  - [ ] File is staged using `git add test-nggasu.md`
  - [ ] Git commit created with exact message: `feat(295): create markdown file test-nggasu.md with prose content`
  - [ ] Commit exists on feature branch `feat/295-markdown-file-creation-40b14d`
  - [ ] All changes are pushed to remote origin repository
  - [ ] Commit history shows no conflicts or merge issues
  - [ ] No modifications to existing files in repository

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-nggasu.md` in the repository root directory using Python pathlib `Path.write_text()` method
  - **FR-2**: File structure must be: H1 heading (line 1) + blank line (line 2) + prose content (lines 3+) with no additional blank lines or formatting
  - **FR-3**: H1 heading must use CommonMark-compliant syntax: `# ` followed by descriptive title text (minimum 2 words, maximum 50 characters)
  - **FR-4**: Prose content must consist of exactly 2 or 3 complete sentences (per product decision: flexible within range)
  - **FR-5**: Stage the newly created file using `git add test-nggasu.md` command
  - **FR-6**: Create a git commit with conventional commit message: `feat(295): create markdown file test-nggasu.md with prose content` (exact text required)
  - **FR-7**: Push all changes to the remote origin using `git push origin feat/295-markdown-file-creation-40b14d`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without byte-order mark (BOM); pathlib `write_text(encoding='utf-8')` ensures this
  - **NFR-2**: File line endings must be Unix LF (`\n`) exclusively; must not contain Windows CRLF (`\r\n`) or mixed line endings
  - **NFR-3**: File size should naturally fall within 400-600 bytes as a consequence of H1 heading (~20-40 bytes) + blank line (1 byte) + 2-3 sentences (~350-550 bytes); file size is not explicitly constrained but is a natural outcome of structure
  - **NFR-4**: Implementation must follow established pattern from features 005-294; file structure and git workflow must be identical to prior 290+ implementations
  - **NFR-5**: Code must be compatible with Python 3.11+ as specified in project pyproject.toml; must use only standard library modules (pathlib, subprocess/os for git)
  - **NFR-6**: Implementation must not modify existing files, configuration, tests, or source code; changes are limited to file creation and git operations
  - **NFR-7**: Prose content must be original, coherent, and grammatically correct (no lorem ipsum, no copy-paste from other test files, no AI-generated placeholder text)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be free-form or follow thematic constraints? | Free-form prose | 290+ existing test files demonstrate diverse topics work well; maximizes flexibility, reduces implementation overhead, maintains consistency with proven pattern |
  | 2 | Should sentence count be flexible (2-3) or fixed at a single target? | Flexible within 2-3 range | Allows natural prose flow, accommodates topic length variation, matches established pattern; file size naturally stays 400-600 bytes regardless |
  | 3 | Should implementation include format validation after file creation? | Include basic validation | Light validation gates catch implementation errors before git history, ensures consistency with minimal overhead (2-3 minutes), appropriate for systematic workflow with 290+ priors |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-nggasu.md) to existing collection of 290+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 005-294; no branch/merge complexity, no destructive operations, no conflicts |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or other infrastructure |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/295-markdown-file-creation-40b14d` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 290+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<random-string>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  **No External Package Dependencies**:
  - Feature uses only Python standard library (pathlib, subprocess/os for git operations if needed)
  - No additional pip packages required beyond existing project dependencies
  - No API keys, credentials, or external service integrations needed
  - No database, cache, or storage system dependencies

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes of actual implementation work)

  **Breakdown**:
  - File creation with prose generation: ~5-7 minutes
  - Basic validation (optional per NFR-6): ~2-3 minutes
  - Git operations (stage, commit, push): ~3-5 minutes
  - **Total**: 10-15 minutes of active implementation

  **Justification**:
  - Well-established pattern with 290+ identical test files providing clear, proven precedent
  - No architectural decisions, design choices, or research required
  - Flexible topic selection with no constraints; implementer chooses freely
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - File naming (test-nggasu.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 290+ prior implementations
  - Recent feature implementations (290-294) demonstrate efficient execution in 10-20 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product decisions documented with AI recommendations, specification ready for implementation_
