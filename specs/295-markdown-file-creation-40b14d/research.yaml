content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-31
  - **Status:** Complete

  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** Use `pathlib.Path.write_text()` with explicit `encoding='utf-8'` and `newline=''`

  **Rejected:**
  - `os.open()` with `os.write()` — lower-level API requiring manual encoding handling, byte string conversion, and careful file descriptor management; pathlib provides cleaner abstraction
  - Built-in `open()` function — classic approach but less Pythonic for modern Python 3.11+; pathlib is the recommended standard

  **Rationale:**
  pathlib is the modern Python standard library for file operations and is explicitly recommended in the feature specification.
  The `write_text()` method provides a clean, high-level API that handles string encoding automatically.
  By specifying `encoding='utf-8'` explicitly, we ensure UTF-8 encoding without BOM (as required by spec).
  By specifying `newline=''`, we disable platform-specific newline translation, ensuring the `\n` characters in the prose string are written as-is (Unix LF), meeting the spec requirement for LF-only line endings on all platforms.
  This approach requires no external dependencies — pathlib is part of Python standard library since version 3.4.
  Matches spec recommendation and aligns with Python 3.11+ standards.

  ### 2. Git Operations: subprocess.run() with command lists

  **Chosen:** Use `subprocess.run()` with command as a list: `subprocess.run(['git', 'add', 'test-nggasu.md'], check=True)`

  **Rejected:**
  - GitPython library — adds an external package dependency; spec explicitly requires Python standard library only with zero external packages
  - `os.system()` or `shell=True` subprocess — security risk (command injection vulnerability), less reliable error handling, harder to debug

  **Rationale:**
  The subprocess module is part of Python standard library and provides safe, reliable execution of external processes.
  Using the list form (e.g., `['git', 'add', 'test-nggasu.md']`) prevents shell injection vulnerabilities — each argument is passed directly without shell interpretation.
  Using `check=True` parameter causes subprocess to raise CalledProcessError if the git command fails, enabling clear error detection and informative error messages.
  This approach aligns with spec constraint: Python 3.11+ standard library only, zero external package dependencies.
  subprocess is proven across 290+ prior feature implementations in this project.

  ### 3. Prose Content: Hardcoded Free-Form Topic

  **Chosen:** Write hardcoded original prose about a freely selected topic (any subject matter, implementer choice)

  **Rejected:**
  - Random template selection from predefined prose library — adds unnecessary complexity; 290+ existing test files show simple hardcoded content works well
  - Dynamic content generation (APIs, AI models) — introduces external dependencies, API credentials, violates spec's \"original prose\" requirement, overcomplicated for use case

  **Rationale:**
  The spec explicitly permits and recommends \"free-form prose\" with no thematic constraints.
  Analysis of 290+ prior feature implementations shows each uses simple, unique hardcoded prose about diverse topics: nature, technology, history, science, philosophy, etc.
  Hardcoded prose is simplest (no special complexity), deterministic (reproducible), and avoids any external dependencies or API calls.
  Implementer freedom to choose any coherent topic matches established pattern — no business requirement for content generation complexity.
  This approach has been validated across 290+ existing test files, demonstrating that simple prose works reliably.

  ### 4. Format Validation: Include Basic Validation

  **Chosen:** Implement lightweight validation after file creation before git operations

  **Rejected:**
  - Skip validation entirely — faster execution but defers error detection to code review phase; risks committing malformed files to git history
  - Extensive validation suite — over-engineered; feature doesn't warrant comprehensive test harness

  **Rationale:**
  The spec explicitly recommends basic validation and estimates 2-3 minute overhead as acceptable.
  Light validation gates catch implementation errors before they reach git history, improving overall system reliability.
  Validation checks (all using simple string operations):
  - File exists and is readable
  - First line is valid H1 heading (matches `^# .{2,50}$` pattern)
  - Second line is blank (empty after stripping whitespace)
  - Content contains exactly 2 or 3 sentences (split on `. ` pattern)
  - File is UTF-8 decodable
  - File contains only LF (`\n`), never CRLF (`\r\n`) or mixed endings
  - File size is 400-600 bytes (natural consequence of proper structure)

  These checks require only standard Python string and regex operations — no external validation libraries needed.
  Appropriate for systematic workflow where 290+ prior features demonstrate this pattern's reliability.

  ### 5. Line Ending Consistency: Platform-Independent Control

  **Chosen:** Use `pathlib.Path.write_text(newline='')` to ensure Unix LF line endings on all platforms

  **Rejected:**
  - Allow OS default line endings — violates spec requirement for Unix LF exclusively on all platforms (would use CRLF on Windows)
  - Post-write string replacement with `sed` or similar tools — adds complexity, requires shell commands, error-prone

  **Rationale:**
  Spec explicitly requires: \"File must use Unix LF line endings exclusively (`\n`), not Windows CRLF (`\r\n`) or mixed.\"
  Python's text mode `open()` and pathlib by default use the OS's native line ending convention (CRLF on Windows, LF on Unix).
  To override this and ensure LF on all platforms: set `newline=''` in pathlib.Path.write_text().
  With `newline=''`, no newline translation occurs — the `\n` characters in the Python string are written directly to the file as LF bytes.
  This approach is platform-independent, requires no shell workarounds, and is the standard Python approach for cross-platform line ending control.
  Validation step will verify line endings to catch any issues.

  ### 6. External Dependencies: Zero External Packages

  **Chosen:** Use only Python 3.11+ standard library modules (pathlib, subprocess, re)

  **Rejected:**
  - Add GitPython library — unnecessary external dependency for simple git operations; subprocess is sufficient
  - Add markdown validation library — unnecessary; simple string/regex checks sufficient for format validation
  - Add any other package — violates spec constraint of stdlib-only

  **Rationale:**
  Spec explicitly lists technologies: Python 3.11+, pathlib, subprocess. No external packages mentioned.
  All required functionality is available in Python standard library:
  - File I/O: pathlib (stdlib since 3.4)
  - Git operations: subprocess (stdlib)
  - String validation: re (stdlib)

  Adding external dependencies would:
  - Increase deployment complexity (additional pip install steps)
  - Increase maintenance burden (dependency updates, compatibility issues)
  - Add unnecessary bloat for this simple feature

  Standard library-first approach is proven across 290+ prior features in this project.
  Aligns with project philosophy and reduces operational complexity.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O, path operations | **Use (stdlib)** | Part of Python standard library since 3.4; clean API; handles encoding and newline control; recommended in spec |
  | subprocess | External process execution (git add, commit, push) | **Use (stdlib)** | Part of Python standard library; safe command execution with list form; error handling via check=True; no external dependency |
  | re (regex) | Validation: H1 heading format, sentence counting | **Use (stdlib)** | Part of Python standard library; simple pattern matching for validation; lightweight and reliable |
  | GitPython | Higher-level abstraction for git operations | **Reject** | External package dependency; spec requires stdlib-only approach; subprocess is sufficient for simple sequential operations |
  | click / argparse | CLI argument parsing and command structure | **Reject** | Not needed; feature is not a CLI tool, no command-line arguments required |
  | markdown / bleach | Markdown parsing and validation | **Reject** | Not needed; simple string checks are sufficient; no rendering or advanced parsing needed |
  | requests | HTTP client for external APIs | **Reject** | Not needed; feature has no external API calls or network requests (except git push via subprocess) |

  ## Security Considerations

  ### File Creation Security

  - **Risk:** File system permissions on newly created file
    - **Mitigation:** pathlib.Path.write_text() creates files with OS default permissions (typically 0644 on Unix), appropriate for test markdown file in public repository

  - **Risk:** Path traversal vulnerability (if filename were user-input)
    - **Mitigation:** Filename is hardcoded as 'test-nggasu.md' — no user input involved, no traversal risk

  - **Risk:** File overwrites existing content
    - **Mitigation:** Intentional behavior (feature creates a new file); following established pattern from 290+ prior features

  ### Subprocess Security (Git Operations)

  - **Risk:** Command injection via shell interpretation
    - **Mitigation:** Use subprocess with command as a list (e.g., `['git', 'add', 'test-nggasu.md']`), never `shell=True`; prevents shell injection entirely

  - **Risk:** Git credentials exposed in logs or error messages
    - **Mitigation:** No credentials passed in arguments; uses OS-configured git credentials (user.name, user.email, SSH keys) — these are prerequisite configuration, not handled by this feature

  - **Risk:** Unintended git operations affecting repository state
    - **Mitigation:** Commands are explicit and simple (add, commit, push); script follows established pattern from 290+ prior implementations with no unexpected side effects

  ### Content Security

  - **Risk:** Malicious code injection via prose content
    - **Mitigation:** Content is hardcoded by implementer, not user-generated; plain text prose with no executable code or markdown injection risks

  - **Risk:** UTF-8 encoding issues causing corruption
    - **Mitigation:** Explicit `encoding='utf-8'` in pathlib.write_text(); validation checks UTF-8 decodability

  ### Overall Security Assessment

  **Low Risk:** Feature is file creation and git operations with no external API calls, no user input, no credentials passed. No authentication/authorization concerns. Code is simple, deterministic, and follows established pattern across 290+ prior features.

  ## Performance Implications

  ### Execution Time Breakdown

  - File creation (pathlib.write_text()): ~1-2 ms
  - Validation (string operations + regex): ~1-5 ms
  - git add: ~5-10 ms (local filesystem operation)
  - git commit: ~10-20 ms (local operation, creates object in git database)
  - git push: ~500-2000 ms (network-bound; depends on internet connection, GitHub API latency)
  - **Total:** ~1000-2500 ms (1-2.5 seconds typical), dominated by git push network latency

  ### Resource Usage

  - **Memory:** ~1-2 MB (Python interpreter + small strings for prose content)
  - **Disk:** ~500 bytes (one markdown file in repository root)
  - **Network:** Single push request to GitHub (~5-10 KB payload)
  - **CPU:** Negligible; I/O bound operation, not CPU constrained

  ### Optimization Opportunities

  - None needed; feature is I/O bound on git push (network latency), not CPU or memory constrained
  - No caching opportunities; single-run, non-repeating operation
  - No parallelization opportunities; sequential git workflow required (add → commit → push)

  ### Performance Conclusion

  Feature has no performance constraints or concerns. Execution time is acceptable (1-2 seconds typical, accounting for git push network latency). Resource usage is negligible. No optimization required. Performance is not a limiting factor for this feature.

  ## Architecture Notes

  ### Codebase Integration

  This feature is purely file creation and git workflow — it does not integrate with the main application codebase (/src/sheep/).
  Following established pattern from 290+ prior features (005-294):

  - No modifications to source code, tests, configuration, or CI/CD pipelines
  - No impact on agents, flows, tools, observability infrastructure
  - Feature operates entirely at repository level: creates markdown file in root, stages with git, commits to feature branch, pushes to origin

  ### Pattern Consistency

  Feature implementation should match exactly the pattern established across 290+ prior implementations:

  - File structure: H1 heading + blank line + prose content
  - File encoding: UTF-8 without BOM
  - Line endings: Unix LF exclusively
  - File size: 400-600 bytes (natural outcome of structure)
  - Git workflow: add → commit (conventional message) → push to feature branch
  - Validation: Optional but recommended (per spec product decision)

  ### Implementation Approach

  Recommend simple Python script or shell script that:

  1. Generates markdown file with H1 heading and 2-3 sentences of prose content
  2. Validates file format (optional but recommended)
  3. Stages file with git add
  4. Creates commit with conventional message: `feat(295): create markdown file test-nggasu.md with prose content`
  5. Pushes to feature branch

  No complex architecture or design patterns needed; straightforward sequential operations following established pattern.

  ### Dependencies and Prerequisites

  - Python 3.11+ runtime environment
  - Git command-line tool configured with user.name and user.email
  - Feature branch `feat/295-markdown-file-creation-40b14d` pre-created (handled by feature setup)
  - File system write access to repository root directory
  - Network access to GitHub for git push operation

