content: |
  ## Architecture Overview

  This feature follows the established pattern from 290+ prior features (005-294) in this repository.
  The implementation is straightforward file creation and git workflow with no integration into the main
  application codebase (/src/sheep/). The pattern is proven, well-documented, and requires no architectural
  decisions beyond those already made in the research phase.

  ### Implementation Model

  **File Creation → Validation → Git Workflow**

  1. **File Creation (Phase 1, Task 1):** Use Python pathlib.Path.write_text() to create test-nggasu.md
     with proper structure: H1 heading on line 1, blank line on line 2, prose content on lines 3+.
     Explicit encoding='utf-8' ensures UTF-8 without BOM. Setting newline='' ensures Unix LF
     line endings on all platforms.

  2. **Format Validation (Phase 1, Task 2):** Verify file format before git operations to catch errors early.
     Validation checks: file exists, first line is valid H1 heading (regex: ^# .{2,50}$), second line is blank,
     content has 2-3 sentences, UTF-8 decodable, LF-only line endings, file size 400-600 bytes.

  3. **Git Workflow (Phase 2, Task 3):** Stage file with git add, create commit with exact conventional message,
     push to feature branch. Uses subprocess.run() with command lists (not shell=True) for safe execution.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text(encoding='utf-8', newline='')

  **Rationale:**
  - Modern Python 3.11+ standard library approach (recommended in research)
  - write_text() handles string encoding automatically
  - encoding='utf-8' ensures UTF-8 without BOM (per spec requirement)
  - newline='' disables platform-specific newline translation, ensuring \n writes as LF bytes on all platforms
  - Cleaner, more Pythonic than open() or os.write()
  - Zero external dependencies (part of stdlib since 3.4)

  ### 2. Git Operations: subprocess.run() with command lists

  **Chosen:** subprocess.run(['git', 'add', 'test-nggasu.md'], check=True)

  **Rationale:**
  - Safe execution: list form prevents shell injection (no shell=True)
  - Proper error handling: check=True raises CalledProcessError on git failure
  - Zero external dependencies (part of stdlib)
  - Proven across 290+ prior implementations in this repository
  - Aligns with spec constraint: Python stdlib only

  ### 3. Validation Strategy: Include Light Validation

  **Chosen:** Implement validation checks before git operations

  **Rationale:**
  - Spec explicitly recommends validation (2-3 minute overhead acceptable)
  - Catches format errors early, prevents malformed files in git history
  - Simple string operations and regex only (no external validation libraries)
  - Appropriate for systematic workflow with 290+ prior features
  - Early feedback improves overall system reliability

  ### 4. Prose Content: Hardcoded Free-Form Topic

  **Chosen:** Implementer writes coherent, original prose about any freely selected topic

  **Rationale:**
  - Spec explicitly permits and recommends free-form prose (no thematic constraints)
  - 290+ existing test files demonstrate diverse topics work well
  - Simplest approach (no content generation APIs or templates)
  - Implementer freedom matches established pattern
  - No external dependencies or API calls needed

  ### 5. Line Ending Control: Platform-Independent

  **Chosen:** pathlib.Path.write_text(newline='') with validation confirmation

  **Rationale:**
  - Spec requires Unix LF exclusively on all platforms
  - Python text mode defaults to OS native (CRLF on Windows) — must override
  - newline='' disables translation; \n in string writes directly as LF bytes
  - Validation checks confirm LF-only (catches any issues)
  - No external tools or post-processing needed

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 (File Creation & Validation) → Phase 2 (Git Workflow)**

  This ordering is essential:
  - Phase 1 ensures the file is well-formed before any git operations
  - Validation catches implementation errors early (better than discovering in review)
  - Phase 2 operates on a validated, correct file
  - Follows established pattern: create → validate → commit

  ### Key Milestones

  1. **File Created:** test-nggasu.md exists in repository root with proper structure
  2. **File Validated:** All format checks pass (heading, blank line, sentences, encoding, line endings, size)
  3. **File Staged:** git add confirms file is staged for commit
  4. **Commit Created:** Conventional commit message recorded in git history
  5. **Pushed:** Changes synchronized with remote origin

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Incorrect line endings (CRLF on Windows) | Medium | Use pathlib.write_text(newline='') to ensure LF on all platforms; validation confirms LF-only |
  | UTF-8 encoding issues or BOM present | Low | Explicit encoding='utf-8' in pathlib; validation checks UTF-8 decodability |
  | Invalid H1 heading format | Low | Validation uses regex (^# .{2,50}$) to verify format before commit |
  | Wrong sentence count (not 2-3) | Low | Validation splits on \". \" pattern and counts sentences |
  | Git operations fail (unstaged, commit fails, push fails) | Low | subprocess.run(check=True) raises exception on failure; proper error messages enable debugging |
  | File overwrite or incorrect placement | Very Low | Filename hardcoded as \"test-nggasu.md\"; no path traversal risk; no existing file to overwrite |
  | Malformed prose or lack of coherence | Medium | Implementer responsible for writing coherent prose; review phase validates content quality |

  ## Implementation Notes

  - Feature is purely file creation and git workflow; no integration with /src/sheep/ or application logic
  - Pattern follows exactly the approach used in 290+ prior features (005-294)
  - All work is contained in a single feature branch; no conflicts or merge complexity expected
  - No modifications to existing files, configuration, tests, or CI/CD pipelines
  - Estimated total effort: 10-20 minutes of actual implementation work (per spec size estimate)
