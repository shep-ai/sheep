content: |
  ## Summary

  Implementation proceeds in logical sequence across two phases:

  **Phase 1: File Creation & Validation (Tasks 1-2)**
  Create test-nggasu.md with proper markdown structure (H1 heading, blank line, 2-3 sentences of prose).
  Then validate that file meets all format requirements (UTF-8, LF line endings, heading format, sentence count, size).
  Validation catches errors early before any git operations.

  **Phase 2: Git Workflow (Task 3)**
  Stage validated file with git add, create commit with conventional message, push to feature branch.
  Uses subprocess.run() with safe command lists (no shell injection risk).

  Total estimated effort: 40 minutes (Phase 1: 30 min, Phase 2: 10 min)

  ## Task Dependencies

  **task-1** (Create file) → **task-2** (Validate) → **task-3** (Git workflow)

  Linear dependency chain ensures:
  - File exists before validation runs
  - Validation passes before any git operations
  - Validated file is then committed and pushed

  ## Validation Before Commit

  Task 2 is essential: validation before git operations ensures malformed files never reach git history.
  Catches issues like:
  - Wrong line endings (CRLF instead of LF)
  - Missing blank line after heading
  - Wrong sentence count (1, 2, 3, or 4 sentences)
  - File size outside 400-600 byte range

  Early feedback (immediately after file creation, before commit) enables quick correction.

  ## Git Workflow Details

  Task 3 uses subprocess.run() with command lists for safe, reliable execution:
  - No shell=True (prevents command injection)
  - check=True (raises exception on git failure)
  - Proper error handling with informative messages

  Follows exact conventional commit message format: \"feat(295): create markdown file test-nggasu.md with prose content\"
