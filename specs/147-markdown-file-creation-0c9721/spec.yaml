content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. Feature 147 creates a single test markdown file (`test-mrwvn4.md`) at the repository root with a title (H1 heading) and prose content (2-3 sentences), demonstrating automated file creation and git integration.

  This is the 147th implementation of an identical pattern established in features 001-146. The pattern is foundational to the Sheep project's test suite and serves as a minimal unit of work for validating the automated implementation system. The implementation should leverage proven utilities in the `content_generators` module rather than building custom logic.

  ## Success Criteria

  - [ ] Markdown file `test-mrwvn4.md` is created at the repository root directory
  - [ ] File contains exactly one H1 heading (format: `# Title`) as the first line
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] Prose content is auto-generated by Claude API (not manually written)
  - [ ] File is valid UTF-8 encoded CommonMark markdown per specification
  - [ ] File size is between 400-600 bytes after creation
  - [ ] File uses Unix LF line endings (standard for the project)
  - [ ] File is staged in git after successful validation
  - [ ] File is committed with conventional commit message: `feat(147): create markdown file test-mrwvn4.md with prose content`
  - [ ] Committed changes are pushed to remote repository on current branch
  - [ ] Implementation follows established pattern from features 001-146 (module structure, constants, orchestration)
  - [ ] No existing source code files are modified outside the new feature module
  - [ ] No modifications to `content_generators.py` or other core modules

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with exact filename `test-mrwvn4.md`
  - **FR-2**: File must begin with a single H1 heading (markdown format: `# Title Text`)
  - **FR-3**: File must contain 2-3 sentences of prose content immediately following the H1 heading
  - **FR-4**: Prose content must be auto-generated by Claude API via `content_generators.create_markdown_file()` orchestrator function
  - **FR-5**: Generated markdown must be valid according to CommonMark specification
  - **FR-6**: File must be written to disk with UTF-8 encoding and Unix LF line endings
  - **FR-7**: File must be validated before staging (markdown format, H1 presence, sentence count 2-3, minimum length 50+ characters)
  - **FR-8**: File must be staged in git after successful validation
  - **FR-9**: Staged file must be committed with conventional commit message format: `feat(147): create markdown file test-mrwvn4.md with prose content`
  - **FR-10**: Committed changes must be pushed to the remote repository on the feature branch

  ## Non-Functional Requirements

  - **NFR-1**: Content generation operation must complete within 5 minutes (including Claude API latency)
  - **NFR-2**: File encoding must be UTF-8 (per Python standard library default on Unix systems)
  - **NFR-3**: File must use Unix LF line endings (`\n`, not CRLF)
  - **NFR-4**: File size must be 400-600 bytes (validates content quality and adherence to format)
  - **NFR-5**: Implementation must use `create_markdown_file()` orchestrator from `sheep.content_generators` module (no custom implementation)
  - **NFR-6**: Implementation must follow module pattern from features 001-146 exactly (structure, constants, function signature)
  - **NFR-7**: Feature module must not modify any existing source code files (only add new `feature_147_markdown_file_creation.py`)
  - **NFR-8**: Markdown content generation must use Claude API only (no other LLM providers for this feature)
  - **NFR-9**: Implementation must be contained in single feature module at `src/sheep/features/feature_147_markdown_file_creation.py`
  - **NFR-10**: Code must follow existing project conventions (imports, logging via structlog, error handling patterns)

  ## Product Questions & AI Recommendations

  **Analysis Finding**: This feature has NO ambiguous product decisions.

  **Rationale**: Feature 147 is the 147th implementation of an identical pattern with:
  - Established precedent from 146 identical features (001-146)
  - Proven, production-tested utilities in `content_generators` module
  - Specific, unambiguous user request ("create test-mrwvn4.md with title and 2-3 sentences")
  - Clear architectural pattern and module structure
  - No design choices, no technology options, no scope ambiguities

  All requirements are determined by:
  1. The established pattern from features 001-146
  2. The specific user request
  3. The proven content_generators module architecture

  Implementation is a pure template application: copy feature_146_markdown_file_creation.py, update three constants (FEATURE_NUMBER=147, MARKDOWN_FILENAME="test-mrwvn4.md", COMMIT_MESSAGE), no other changes required.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-mrwvn4.md) to existing collection of 146+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-146; no branch/merge complexity, no destructive operations |
  | src/sheep/features/ | Low | Adds new feature_147_markdown_file_creation.py module; does not modify existing source code beyond using content_generators module utilities |
  | src/sheep/content_generators.py | None | No modifications; only reused via import `from sheep.content_generators import create_markdown_file` |
  | Specs Directory | Low | Updates this spec.yaml file as part of analysis and requirements phases; no impact on other specs or configurations |
  | Test Suite | None | No modifications to test files or testing infrastructure; feature itself creates a test artifact (markdown file) |
  | Application Source Code | None | No modifications to src/sheep/ core modules; only adds new feature module |

  ## Dependencies

  **External Dependencies:**
  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **Git repository**: Feature branch `feat/147-markdown-file-creation-0c9721` must exist (pre-created)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Claude API access**: Content generation requires Claude API key via CrewAI LLM framework (configured in environment)
  - **CrewAI Framework**: Already installed; handles LLM interaction and response formatting
  - **File system write access**: Must have write permission to repository root directory (standard for development)

  **Internal Dependencies (Reusable Modules):**
  - **sheep.content_generators**: Primary dependency; provides `create_markdown_file()` orchestrator function
    - `generate_markdown_content()` — Claude API call for prose generation
    - `write_markdown_file()` — File I/O with UTF-8 encoding
    - `validate_markdown_file()` — Markdown validation (H1 heading, sentence count, length, encoding)
    - `commit_markdown_file()` — Git staging and commit
    - `push_markdown_file()` — Git push to remote
  - **sheep.tools**: GitCommitTool and GitPushTool for git operations
  - **sheep.observability.logging**: structlog-based logging (already configured project-wide)
  - **pathlib**: Python standard library for file path handling

  **Established Pattern:**
  - 146+ test files in features 001-146 provide clear precedent for content format and structure
  - Feature modules from 146 preceding features (001-146) demonstrate identical implementation pattern

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  **Time Breakdown:**
  - **Content generation**: ~2-3 minutes (Claude API call via `create_markdown_file()` in content_generators)
  - **File creation and validation**: ~3-5 minutes (use `write_markdown_file()` and `validate_markdown_file()` utilities)
  - **Git workflow**: ~2-5 minutes (use `commit_markdown_file()` and `push_markdown_file()` utilities)
  - **Feature module creation**: ~2-3 minutes (copy/adapt feature_146_markdown_file_creation.py, update constants)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 146+ identical test files in features 001-146 providing clear precedent
  - Proven content generators in `sheep.content_generators` module available for reuse (`create_markdown_file()` is primary entry point)
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (144-146) demonstrate consistent 10-15 minute implementation of identical features
  - Zero impact on application source code or architecture (only adds feature module)
  - Claude API handles prose generation, eliminating manual content composition
  - Can reuse feature_146_markdown_file_creation.py as template, changing only metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)

  **Implementation Complexity: Minimal**
  - Copy template from feature 146 (proven pattern)
  - Update three constants: FEATURE_NUMBER=147, MARKDOWN_FILENAME="test-mrwvn4.md", COMMIT_MESSAGE with feature number
  - No algorithmic complexity, no architectural decisions, no edge cases
  - All utilities are proven and tested through 146 prior implementations

