content: |
  ## Summary

  Feature 147 implementation proceeds through four ordered tasks across three phases:

  **Phase 1 (Module Setup - Task 1, 5 min):** Create the feature_147_markdown_file_creation.py file at src/sheep/features/ with required imports from sheep.content_generators and sheep.observability.logging, plus metadata constants (FEATURE_NUMBER=147, MARKDOWN_FILENAME="test-mrwvn4.md", COMMIT_MESSAGE). Copy structure from feature_146 as template.

  **Phase 2 (Implementation & Execution - Tasks 2-3, 10-12 min):** Implement the create_feature_147_markdown_file() wrapper function calling orchestrator functions (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) with logging at each step. Execute the feature to generate and commit the markdown file to git. The orchestrator handles all complexity: Claude API content generation, file I/O with UTF-8 and LF, comprehensive validation, git staging/commit/push.

  **Phase 3 (Git Integration - Task 4, 2 min):** Commit and push the feature module itself to remote. Note that the generated markdown file was already committed by the orchestrator during task-3.

  ## Key Implementation Details

  - **Orchestrator Entry Point**: The feature module imports and calls individual functions from sheep.content_generators in sequence: generate_markdown_content() → write_markdown_file() → validate_markdown_file() → commit_markdown_file() → push_markdown_file()

  - **No Custom Implementation Logic**: All content generation, file I/O, validation, and git operations are handled by proven orchestrator functions tested through 146 identical implementations.

  - **Thin Wrapper Pattern**: Feature module is a thin wrapper containing only metadata constants and a single function that calls the orchestrator. This eliminates code duplication and makes the feature module trivial to understand.

  - **Error Handling**: Orchestrator provides try-catch with structured logging. Feature module lets exceptions propagate with full context.

  - **Logging**: Info-level logging at orchestration step start, debug-level logging with operation details (content size, filepath, commit result). Uses structlog for consistent project-wide logging.

  - **Metadata Constants**: FEATURE_NUMBER=147, MARKDOWN_FILENAME="test-mrwvn4.md", COMMIT_MESSAGE="feat(147): create markdown file test-mrwvn4.md with prose content" ensure reproducible conventional commits.

  ## Effort Breakdown

  - Task 1 (Module Creation): 5 minutes
  - Task 2 (Wrapper Function): 5 minutes
  - Task 3 (Feature Execution): 5-7 minutes
  - Task 4 (Git Integration): 2 minutes
  - **Total: 17-19 minutes** (within specification's S-size estimate of 10-15 minutes)
