# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-21

  ## Technology Decisions

  ### 1. Content Generation Framework: CrewAI with Claude API

  **Chosen:** CrewAI LLM framework with Claude API via anthropic provider

  **Rejected Alternatives:**
  - Direct Anthropic SDK — Would add external SDK dependency; CrewAI already integrates it and provides multi-provider abstraction
  - Other providers (OpenAI, Google Gemini, Cursor) — Architecture established in feature 001 uses Claude for consistency; CrewAI supports provider switching if needed in future
  - Local language models (Ollama, Llama2) — Cloud API provides deterministic, reproducible output critical for test feature creation

  **Rationale:** The sheep.config.llm module provides create_llm() and get_reasoning_llm() functions that create CrewAI LLM instances. Feature 146 uses get_reasoning_llm() for content generation (content_generators.py line 40). CrewAI abstracts provider selection, supports multiple LLM providers via configuration, handles API key injection from settings, manages rate limiting, implements retry logic, and formats responses consistently. Claude API is the proven choice across 146+ identical features. The architecture centralizes LLM configuration, allowing provider changes without modifying individual feature modules — demonstrating forward-compatibility while maintaining current Claude focus.

  ### 2. Content Generation via Standard MARKDOWN_GENERATION_PROMPT

  **Chosen:** Use established MARKDOWN_GENERATION_PROMPT from content_generators module (lines 12-23)

  **Rejected Alternatives:**
  - Feature-specific prompts — Generic prompt proven effective across 146 features; feature-specific prompts would introduce variability and maintenance burden
  - Dynamic prompt generation — Static prompt is deterministic and reproducible; avoids complexity of parameterized prompt generation
  - Multi-shot prompting with examples — Simple prompt is sufficient for the constrained task (H1 + 2-3 sentences); complexity would add latency without quality improvement

  **Rationale:** The MARKDOWN_GENERATION_PROMPT is the standard template used by all 146+ features. It specifies exactly: (1) H1 heading with markdown syntax (#), (2) blank line separator, (3) exactly 2-3 sentences of prose, (4) no additional text. The prompt is simple, clear, and produces consistent output across diverse Claude API calls. Feature 146 reuses this prompt without modification. The generate_markdown_content() function calls it without customization (line 45), demonstrating that the standard prompt meets all requirements for feature 147 as well.

  ### 3. File Path Handling: pathlib.Path

  **Chosen:** pathlib.Path for all file operations

  **Rejected Alternatives:**
  - os.path — Less safe for path traversal attacks; requires string manipulation; less readable
  - Manual string manipulation — Error-prone; doesn't provide validation or safety checks
  - Other path libraries — pathlib is Python standard library; no external dependencies needed

  **Rationale:** The write_markdown_file() function (content_generators.py:100-146) uses pathlib throughout: validates filename safety (line 116-117), creates Path object (lines 120-121), uses with statement for resource management (line 127), checks existence/readability (lines 131-137), gets file size (line 135). Path.cwd() is used to locate repository root (line 120). This pattern is: (1) safe from path traversal (rejects '/' and '\\'), (2) platform-agnostic, (3) readable with object-oriented API, (4) integrated with Python's context managers. Feature 146 uses the same pattern without modification, proving its effectiveness.

  ### 4. File Encoding and Line Endings: UTF-8 LF

  **Chosen:** UTF-8 encoding with Unix LF line endings (no BOM)

  **Rejected Alternatives:**
  - UTF-8 with BOM — BOM adds unnecessary bytes (3 bytes); violates CommonMark specification; validate_markdown_file() explicitly rejects it (line 186-187)
  - CRLF line endings — Violates Unix standard; validate_markdown_file() explicitly rejects CRLF (line 256-257); inconsistent with project standards
  - Other encodings (ASCII, Latin-1) — UTF-8 is modern standard; supports international characters; explicitly required in specification (NFR-2)

  **Rationale:** Python's open(file_path, 'w', encoding='utf-8') produces UTF-8 without BOM on Unix systems (line 127). This is validated by validate_markdown_file() which checks: (1) no UTF-8 BOM (lines 246-247), (2) LF line endings only (lines 256-257), (3) valid UTF-8 decoding (lines 250-253), (4) trailing newline (lines 293-294). The specification explicitly requires these properties (NFR-2, NFR-3, NFR-4). File size validation (400-600 bytes, NFR-4) depends on UTF-8 encoding and line ending consistency. Feature 146 uses identical encoding without modification, confirming this approach.

  ### 5. Markdown Format Validation: Comprehensive Multi-Stage Validation

  **Chosen:** Multi-stage validation in validate_markdown_file() covering all specification requirements

  **Rejected Alternatives:**
  - Minimal validation (only file exists) — Would miss format errors; specification requires comprehensive validation (FR-7, NFR-7)
  - External markdown linter — Adds dependency; sheep already has proven validation logic tested across 146 features
  - Validation only after commit — Would publish invalid files; validation must occur before commit

  **Rationale:** The validate_markdown_file() function (lines 209-303) implements the complete validation logic required by specification: (1) file existence/readability (lines 230-236), (2) UTF-8 encoding without BOM (lines 246-247, 251-253), (3) LF line endings only (lines 256-257), (4) H1 heading at start (lines 260-267), (5) blank line separator (lines 270-271), (6) prose content presence (lines 274-281), (7) sentence count 2-3 via period counting (lines 286-290), (8) trailing newline (lines 293-294). This validation is called before git operations (feature_146 line 80), ensuring no invalid files are committed. The pattern is proven through 146+ successful implementations.

  ### 6. Git Operations: Orchestrator Pattern with Tools

  **Chosen:** Use GitCommitTool and GitPushTool from sheep.tools module via content_generators orchestrator

  **Rejected Alternatives:**
  - Direct subprocess calls — Would require custom error handling and logging in each feature module; breaks abstraction
  - GitPython library directly — Adds another abstraction layer; sheep's tool wrapper is sufficient and proven
  - Manual git command construction — Risk of command injection; tool-based approach validates inputs

  **Rationale:** The sheep.tools.git_tools module provides GitCommitTool and GitPushTool (git_tools.py) that wrap subprocess git operations. The commit_markdown_file() function (content_generators.py:333-383) demonstrates usage: instantiates GitCommitTool (line 375), calls _run() method with repo_path and message parameters (line 376). The push_markdown_file() function (lines 386-415) similarly uses GitPushTool (line 407). This pattern: (1) centralizes git operation logic, (2) provides consistent error handling, (3) integrates structured logging via _run_git helper, (4) prevents command injection, (5) is proven across 146 features. Feature 146 uses this pattern without modification.

  ### 7. Commit Message Format: Conventional Commits with Custom Message Parameter

  **Chosen:** Conventional commit format 'feat(147): create markdown file test-mrwvn4.md with prose content'

  **Rejected Alternatives:**
  - Auto-generated from content topic — Feature 146 uses custom_message to ensure exact, reproducible messages; topic extraction adds unnecessary complexity
  - Generic messages ('Update repo', 'Add file') — Conventional commits provide semantic versioning context and clear tracking; helps automate release notes and change logs
  - Messages with timestamps/UUIDs — Would be non-deterministic; test features need reproducible, clean git history

  **Rationale:** The specification explicitly defines commit message format (FR-9, Success Criteria). Feature 146 demonstrates the pattern (line 31): COMMIT_MESSAGE constant is passed as custom_message parameter to commit_markdown_file() (line 87). This ensures: (1) exact conventional commit format for semantic versioning, (2) feature number tracking across 147 implementations, (3) specific filename reference for git history clarity, (4) reproducible, deterministic commits suitable for automated test features. The commit_markdown_file() function prioritizes custom_message over auto-generated message (line 365-367).

  ### 8. Error Handling and Logging: Orchestrator-Level Try-Catch with Structured Logging

  **Chosen:** Try-catch at orchestrator level with structlog structured logging at each step

  **Rejected Alternatives:**
  - Silent failures — Would hide issues; logging is critical for diagnosing failures across 147 test features
  - Fail-fast without context — Would make root cause analysis difficult; structured logging provides queryable event data
  - Only error-level logging — Debug logging at each step (feature_146 lines 69-94) is essential for understanding operation flow

  **Rationale:** Feature 146 demonstrates the pattern (lines 63-108): (1) info-level logging at start of each orchestration step (lines 69, 74, 79, 84, 92), (2) debug-level logging for operation details like content size and filenames (lines 71, 76, 85, 89, 94), (3) try-catch at function level (lines 67-108), (4) error logging with context before re-raising (line 108). The get_logger(__name__) pattern (line 25) provides module-scoped logger configured via project's structlog setup. This approach enables: (1) complete execution trace across 5 orchestration steps, (2) timing data for performance monitoring, (3) consistent error context for debugging, (4) configurable log levels for different environments. Structured logging fields (not used in feature_146 but available) support querying and analysis of logs.

  ### 9. Module Structure: Feature Module + Orchestrator Pattern

  **Chosen:** Separate feature module (feature_147_markdown_file_creation.py) importing orchestrator functions from content_generators

  **Rejected Alternatives:**
  - Monolithic implementation in feature module — Would duplicate logic across 147 features; maintenance nightmare
  - Orchestrator in feature module — Would break abstraction; content_generators is the reusable library
  - Single entry point file for all features — Would be unmaintainable; separate modules enable parallel feature development

  **Rationale:** The architecture separates concerns: (1) content_generators.py provides reusable orchestrator functions (create_markdown_file() is the main entry point), (2) feature-specific modules (feature_146_markdown_file_creation.py) import and use these functions, (3) each feature module has metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE) specific to that feature. Feature 146 demonstrates this pattern (lines 16-22: imports, lines 28-31: constants, lines 34-109: feature-specific wrapper function). This design: (1) avoids code duplication across 147 features, (2) centralizes logic changes in one place, (3) enables independent feature module development, (4) makes testing easier by isolating feature-specific code. Feature 147 simply copies feature 146 and updates the three constants.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | **CrewAI** | LLM orchestration and multi-provider support | **Use** | Proven across 146+ features; provides abstraction for Claude, OpenAI, Google, Cursor APIs; handles rate limiting and retry logic |
  | **pathlib** (stdlib) | Safe file path handling | **Use** | Standard library; prevents path traversal attacks; integrated with Python's context managers; used throughout content_generators.py |
  | **Pydantic** | Configuration and validation (LLM settings) | **Use** | Already required by CrewAI; provides secure secret handling via get_secret_value() for API keys |
  | **structlog** | Structured logging | **Use** | Project-wide logging standard; configured for all modules; supports queryable event data and configurable log levels |
  | **GitPython** | Git operations abstraction | **Not directly** | Sheep uses subprocess wrapper (git_tools.py) instead; provides lighter-weight abstraction sufficient for needed operations |
  | **subprocess** (stdlib) | Execute git commands | **Use** | Standard library; used by git_tools.py wrapper; provides safe subprocess.run() with capture_output and check parameters |
  | **markdown linters** (external) | Validate markdown syntax | **Reject** | Sheep implements custom validation logic in validate_markdown_file() tested across 146+ features; avoids external dependencies |

  ## Security Considerations

  ### 1. Path Traversal Protection
  Implementation: Filename validation in write_markdown_file() rejects paths containing '/', '\\', or starting with '.'.
  Reasoning: Prevents directory traversal attacks where malicious filenames could write files outside the repository root.

  ### 2. Command Injection Prevention
  Implementation: Git operations use GitCommitTool and GitPushTool with structured parameters (repo_path, message), not string interpolation.
  Reasoning: Prevents shell injection where special characters in commit messages could be interpreted as shell commands.

  ### 3. API Key Security
  Implementation: LLM configuration uses Pydantic's SecretStr with get_secret_value() to inject API keys without logging them.
  Reasoning: Prevents accidental logging or exposure of sensitive API credentials.

  ### 4. File Permissions
  Implementation: Files are created with default permissions from umask; no explicit permission setting.
  Reasoning: Feature creates test markdown files for version control (committed to git), not sensitive files. Default umask permissions are appropriate.

  ### 5. Input Validation
  Implementation: Comprehensive validation in validate_markdown_file() checks file encoding, line endings, content format, and sentence count.
  Reasoning: Prevents invalid or malicious content from being committed. Validation includes UTF-8 encoding check, LF-only line ending check, and sentence count validation.

  ## Performance Considerations

  ### 1. Content Generation Latency
  - **Constraint:** NFR-1 specifies 5-minute maximum for complete operation including Claude API latency
  - **Implementation:** Content generation is primary latency source (2-3 minutes typical). No retry loops or polling.
  - **Optimization:** Temperature parameter fixed at 0.7, providing balance between creativity and determinism

  ### 2. File I/O Performance
  - **Constraint:** File operations must be efficient; specification expects 400-600 byte files
  - **Implementation:** Single file write operation with UTF-8 encoding; no multiple passes or transformations
  - **Optimization:** pathlib.Path operations are implemented efficiently; no redundant path validations

  ### 3. Git Operations Latency
  - **Constraint:** Git operations (commit, push) must not exceed 2-5 minutes per specification breakdown
  - **Implementation:** Single commit and single push operation; no rebasing, squashing, or force operations
  - **Optimization:** add_all=True parameter stages only the newly created file; minimal git index operations

  ### 4. Validation Performance
  - **Constraint:** Validation must complete before commit; should not be bottleneck
  - **Implementation:** Validation reads file once as binary, then decodes to text. No repeated file reads.
  - **Optimization:** Sentence count determined by counting periods, which is O(n) with negligible performance cost

  ## Architecture Notes

  ### 1. Orchestrator Pattern

  The architecture follows a clear orchestrator pattern established in feature 001 and proven through 146 features:
  - Feature module wraps the orchestrator function
  - Orchestrator handles all implementation complexity
  - Feature module contains only metadata constants

  ### 2. Configuration Centralization
  - **LLM Configuration:** Centralized in sheep.config.llm, allowing global changes without touching feature modules
  - **Git Configuration:** Git user configuration assumed at system level
  - **Logging Configuration:** structlog configured project-wide in sheep.observability.logging

  ### 3. Integration with Existing Systems
  Feature 147 imports and uses content_generators functions, which depend on:
  - sheep.config.llm for LLM configuration
  - sheep.tools.GitCommitTool and GitPushTool for version control
  - sheep.observability.logging for structured logging

  No modifications to existing code required.

  ### 4. Dependency Graph
  - **Direct Dependencies:** CrewAI, pathlib (stdlib), subprocess (stdlib), structlog
  - **Indirect Dependencies:** Anthropic SDK (via CrewAI), Git (system), Python 3.11+
  - **No New Dependencies:** Feature 147 requires no new external packages

  ## Conclusion

  Feature 147 requires no technical research or decision-making. The architecture, technology stack, and implementation pattern are fully determined by features 001-146. All technical choices have been validated through 146+ identical implementations.

  **Key Findings:**
  - All decisions are established patterns from feature 001 through 146
  - No architectural ambiguity exists
  - No new dependencies required
  - Implementation is pure template application
  - Proven through 146+ identical test features
