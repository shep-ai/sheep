content: |
  ## Architecture Overview

  Feature 147 follows the established zero-complexity pattern from features 001-146:

  1. **Module Structure**: A single feature module (`feature_147_markdown_file_creation.py`) contains:
     - Module docstring explaining feature purpose
     - Imports from `sheep.content_generators` (orchestrator functions) and `sheep.observability.logging`
     - Three metadata constants: `FEATURE_NUMBER=147`, `MARKDOWN_FILENAME="test-mrwvn4.md"`, `COMMIT_MESSAGE`
     - Single wrapper function orchestrating the complete workflow
     - Optional `__main__` block for direct execution

  2. **Orchestrator Pattern**: The feature module imports and calls individual functions from `sheep.content_generators`:
     - `generate_markdown_content()` — Creates H1 heading + 2-3 sentences via Claude API
     - `write_markdown_file()` — Writes to disk with UTF-8 encoding and Unix LF line endings
     - `validate_markdown_file()` — Comprehensive validation (H1 presence, 2-3 sentences, encoding, length, line endings)
     - `commit_markdown_file()` — Git staging and commit with conventional message
     - `push_markdown_file()` — Push to remote repository

  3. **No Code Duplication**: All implementation logic is centralized in reusable orchestrator functions, tested and proven through 146 identical deployments.

  4. **Dependency Graph**: Feature module → orchestrator functions → CrewAI/Claude API, pathlib, GitCommitTool, GitPushTool

  Zero modifications to existing source code beyond adding the new feature module. All technologies and patterns are proven and tested.

  ## Key Design Decisions

  ### 1. Reuse Proven Orchestrator Functions (create_markdown_file pattern)

  **Chosen**: Import and call individual orchestrator functions from `sheep.content_generators` without modification

  **Rationale**: The orchestrator functions are production-tested entry points used by all 146 preceding identical features. They provide:
  - Content generation via CrewAI with Claude API using proven MARKDOWN_GENERATION_PROMPT
  - File I/O with UTF-8 encoding (no BOM) and Unix LF line endings per specification
  - Comprehensive markdown validation covering all requirements: H1 heading, 2-3 sentences, encoding, line endings, file size 400-600 bytes
  - Git staging, commit with conventional message format, and push
  - Structured logging at each step via project-wide structlog configuration
  - Error handling with context logging before re-raising

  Reusing orchestrator functions ensures consistency with 146+ successful implementations and eliminates maintenance burden.

  ### 2. Thin Feature Module Wrapper

  **Chosen**: Feature module contains only metadata constants and a single wrapper function calling orchestrator functions in sequence

  **Rationale**: This minimalist approach:
  - Maintains consistency with established pattern from features 001-146 (demonstrated in feature 146)
  - Eliminates code duplication (each of 147 features would otherwise duplicate orchestration logic)
  - Makes feature modules easy to understand and maintain (only 3 constants differ between features)
  - Enables parallel feature development without blocking shared infrastructure
  - Makes the module trivial to test (orchestrator is already tested)
  - Reduces cognitive load: developers focus on feature metadata, not implementation details

  **Evidence**: Feature 146 uses identical pattern successfully. The pattern scales to 147+ implementations.

  ### 3. Content Generation via Established Prompt

  **Chosen**: Use standard `MARKDOWN_GENERATION_PROMPT` from `content_generators` module (no customization)

  **Rationale**: The prompt is the established template across all 146 features and produces consistent output:
  - Specifies H1 heading with markdown syntax (`#`)
  - Specifies blank line separator
  - Specifies exactly 2-3 sentences of prose
  - Simple and clear, proven effective across diverse Claude API calls

  Customizing prompts would introduce variability and is unnecessary given proven success.

  ### 4. Error Handling via Orchestrator

  **Chosen**: Rely on orchestrator's try-catch and error logging; feature module does not implement error handling

  **Rationale**: The orchestrator (`content_generators` functions) provides:
  - Try-catch at function level with structured logging
  - Error context logging before re-raising exceptions
  - Integration with project's structlog configuration for structured event data

  Feature module simply calls orchestrator and lets exceptions propagate. This maintains consistency with proven pattern and centralizes error handling logic.

  ### 5. Metadata Constants Following Convention

  **Chosen**: Define `FEATURE_NUMBER=147`, `FEATURE_NAME`, `MARKDOWN_FILENAME="test-mrwvn4.md"`, `COMMIT_MESSAGE="feat(147): create markdown file test-mrwvn4.md with prose content"`

  **Rationale**: Specification explicitly defines these values (FR-1, FR-9, Success Criteria). Constants follow feature 146 pattern exactly:
  - `FEATURE_NUMBER` used in logging and feature tracking
  - `FEATURE_NAME` optional but included for clarity
  - `MARKDOWN_FILENAME` ensures exact filename per specification
  - `COMMIT_MESSAGE` ensures reproducible conventional commits across all 147 features

  ## Implementation Strategy

  The implementation follows three sequential phases, each building on previous work:

  **Phase 1 — Module Creation** (5 minutes):
  - Create `src/sheep/features/feature_147_markdown_file_creation.py`
  - Copy structure from `feature_146_markdown_file_creation.py` (proven template)
  - Update docstring to reference feature 147
  - Update three metadata constants: FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE
  - Update function name to `create_feature_147_markdown_file()`
  - Verify module can be imported without errors

  **Phase 2 — Implementation & Execution** (8-10 minutes):
  - Wrapper function calls orchestrator functions in sequence:
    1. `generate_markdown_content()` — Claude API generates H1 + 2-3 sentences
    2. `write_markdown_file(content, MARKDOWN_FILENAME)` — File I/O with UTF-8 and LF
    3. `validate_markdown_file(filepath)` — Comprehensive validation before commit
    4. `commit_markdown_file(filepath, content, repo_path, custom_message=COMMIT_MESSAGE)` — Git staging and commit
    5. `push_markdown_file(repo_path)` — Push to remote
  - Include info-level logging at start of each task
  - Include debug-level logging with operation details (content size, file path, commit result)
  - Return dict with filepath, content, commit_message, push_result
  - Let exceptions propagate (orchestrator provides error context)
  - Execute feature to generate markdown file (orchestrator commits it)
  - Verify markdown file exists at repository root

  **Phase 3 — Git Integration** (2 minutes):
  - Stage feature module: `git add src/sheep/features/feature_147_markdown_file_creation.py`
  - Commit with conventional message: `docs(specs): add feature 147 implementation module`
  - Push to remote repository on current branch
  - Verify both commits in git log (markdown file from orchestrator, feature module from this commit)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Content generation fails (Claude API unavailable/rate-limited) | Orchestrator includes try-catch with error logging and context. API key validation happens at LLM initialization. Feature fails gracefully with detailed error message. |
  | Generated content doesn't meet format requirements (fewer than 2 sentences, missing H1, incorrect encoding) | Orchestrator's `validate_markdown_file()` enforces all format requirements before commit. Invalid files are rejected with specific error details. Specification requirements are comprehensive and proven through 146 implementations. |
  | Markdown file already exists at target path | Orchestrator's `write_markdown_file()` includes existence check. If file exists, operation fails with clear error. User can delete and retry, or feature can be modified to overwrite if needed. |
  | Git operations fail (repository not initialized, push permission denied, wrong branch) | Orchestrator includes try-catch for git operations. GitCommitTool and GitPushTool validate repository state and provide error context. Errors propagate with full context. |
  | Module implementation errors (syntax, missing imports, wrong function name) | Minimal implementation (thin wrapper copying feature 146 as template) reduces bug risk. Feature module contains only 3 constants and function calls; no custom logic. Code review of the thin function can catch issues quickly. |
  | Deviation from established 146-feature pattern | Copying feature_146 as template and updating only 3 constants ensures consistency. Pattern is proven through 146 identical implementations. Structural differences would be immediately obvious in code review. |
  | File encoding/line ending issues | Orchestrator handles all encoding and line ending operations via standard library defaults (UTF-8 no BOM, LF) and validates them. Validation explicitly checks for UTF-8 encoding, rejects BOM, requires LF line endings only. |
