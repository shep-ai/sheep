decisions:
  - title: 'File I/O Library Selection'
    chosen: 'pathlib.Path (Python standard library)'
    rejected:
      - 'os.open() / os.write() — lower-level, more verbose, less idiomatic Python 3'
      - 'open() function directly — requires manual file closing; pathlib is more modern and explicit'
    rationale: >
      NFR-5 mandates pathlib.Path for file I/O operations. pathlib provides a modern,
      object-oriented API that is more readable than os module functions. Path.write_text()
      handles file opening, closing, and encoding automatically. This aligns with Python 3.11+
      best practices and the established pattern observed in 65+ existing test files.

  - title: 'Git Integration Method'
    chosen: 'subprocess.run() with git commands'
    rejected:
      - 'GitPython library — while available as project dependency, adds unnecessary abstraction
        for simple git add/commit/push operations; subprocess is built-in and sufficient'
      - 'Direct git shell invocation — less portable, harder to handle errors, requires shell escaping'
    rationale: >
      For simple git operations (add, commit, push), subprocess.run() is ideal: it is part of
      Python standard library, requires no additional imports or dependencies, provides clear
      separation of concerns, and handles command execution with proper error reporting via
      CalledProcessError. The feature requires only three straightforward git commands with no
      complex piping or conditional logic that would justify a higher-level abstraction.

  - title: 'Prose Content Generation Approach'
    chosen: 'Hardcoded prose string in source'
    rejected:
      - 'Template-based generation — adds unnecessary complexity; the format is fixed and small'
      - 'External file loading — adds file I/O complexity and deployment concerns; content should be self-contained'
    rationale: >
      The feature has a fixed, well-defined format: one H1 heading + exactly 2-3 sentences of prose.
      Hardcoding ensures format compliance without runtime validation. The prose is small (~400-600 bytes)
      and simple enough to embed directly. This pattern matches all 65+ existing test files, which contain
      hardcoded, topic-specific prose. No generation or templating needed.

  - title: 'Sentence Count Validation'
    chosen: 'None (hardcoded content guarantees compliance)'
    rejected:
      - 'Programmatic sentence counting via regex — adds unnecessary validation logic; if content
        is hardcoded, compliance is guaranteed'
      - 'External validation tool — introduces external dependency for a non-critical check'
    rationale: >
      By hardcoding prose content with exactly 2-3 sentences, the feature inherently satisfies
      the sentence count requirement without needing runtime validation. Validation logic would be
      wasted complexity when the content is predetermined and verified at authoring time.

  - title: 'Line Ending Handling'
    chosen: 'Explicit UTF-8 with LF via pathlib.Path.write_text()'
    rejected:
      - 'Platform-native line endings — violates NFR-2 requirement for Unix-style LF across all platforms'
