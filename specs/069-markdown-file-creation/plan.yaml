# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the minimal, established pattern observed in 65+ existing test files
  and features 063-068. The implementation is purely a file artifact creation with no impact
  on application source code, test infrastructure, or configuration.

  **Architecture Pattern:**
  - Repository root markdown file creation (no subdirectories, no nesting)
  - Hardcoded prose content (eliminates runtime validation and format generation complexity)
  - Standard git workflow (add → commit → push) using shell integration
  - Self-contained implementation with no external dependencies
  - Zero integration with /src/sheep/, tests/, or configuration

  **Alignment with Existing Codebase:**
  The implementation is isolated to repository root and does not depend on or interact with:
  - Application source code in /src/sheep/
  - Test suite in tests/ (no modifications, no test files created)
  - Configuration files (pyproject.toml, etc.)
  - Build, CI/CD, or deployment pipelines

  This matches the pattern from preceding features (063-068) which also created simple test
  markdown files at the repository root with zero impact on the application codebase.

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF line endings

  **Rationale:**
  - NFR-5 mandates use of pathlib.Path for file I/O operations
  - pathlib provides modern, object-oriented API for filesystem operations
  - Path.write_text() handles file creation, closing, and encoding in one call
  - Supports explicit newline control for Unix-style LF (via string literals with '\n')
  - Python 3.11+ standard library (no external dependencies)

  **Alternatives Considered:**
  - `open()` built-in: requires manual file management and context managers; less explicit
  - `os.open()` / `os.write()`: lower-level, more verbose; less idiomatic in modern Python 3

  **Research Reference:** Technical decision "File I/O Library Selection" in research.yaml
  validates pathlib as the correct choice aligned with NFR-5 and Python best practices.

  ### 2. Git Integration: subprocess.run()

  **Chosen:** `subprocess.run()` with git commands (add, commit, push)

  **Rationale:**
  - Python standard library (no new dependencies)
  - Clear, transparent command-line semantics
  - Proper error handling via CalledProcessError
  - Minimal abstraction overhead for three sequential, non-conditional operations
  - No complex piping, conditional logic, or output parsing required

  **Alternatives Considered:**
  - GitPython library: Unnecessary abstraction; while available as project dependency,
    subprocess is simpler and more transparent for straightforward operations
  - Direct shell invocation: Harder to handle errors, cross-platform compatibility issues,
    requires shell escaping

  **Research Reference:** Technical decision "Git Integration Method" in research.yaml
  validates subprocess.run() as appropriate for simple, sequential git operations.

  ### 3. Prose Content: Hardcoded String

  **Chosen:** Hardcoded prose content in Python source (H1 heading + 2-3 sentences)

  **Rationale:**
  - Content format is fixed and immutable (exactly 2-3 sentences + heading)
  - File size is small (~400-600 bytes) and simple
  - Hardcoding guarantees format compliance without runtime validation
  - Pattern matches all 65+ existing test files (each contains hardcoded prose)
  - Eliminates need for template engines, external files, or generation logic
  - Flexibility: implementer may choose any topic (per NFR-8)

  **Alternatives Considered:**
  - Template-based generation: Adds complexity (template engine, placeholders) for fixed content
  - External file loading: Adds file I/O complexity, deployment concerns, separates prose logic
  - Programmatic sentence generation: Unnecessary validation overhead; compliance guaranteed by hardcoding

  **Research Reference:** Technical decision "Prose Content Generation Approach" in research.yaml
  confirms hardcoding matches established pattern and eliminates validation complexity.

  ### 4. Format Validation: Implicit via Hardcoding

  **Chosen:** No runtime validation; format compliance guaranteed by hardcoded content

  **Rationale:**
  - By authoring prose with exactly 2-3 sentences upfront, sentence count requirement is satisfied
  - UTF-8 encoding is guaranteed by pathlib.Path.write_text() (default encoding)
  - LF line endings are guaranteed by explicit '\n' characters in prose string
  - File size validation is unnecessary; typical range is 400-600 bytes (guideline, not hard requirement)
  - Validation logic would add unnecessary complexity when compliance is deterministic

  **Alternatives Considered:**
  - Regex-based sentence counting: Non-trivial regex for abbreviations/ellipses; overhead for
    compliance that's already guaranteed by hardcoding
  - External validation tools: Introduces dependencies; adds overhead; not needed when
    compliance is predetermined

  **Research Reference:** Technical decision "Sentence Count Validation" in research.yaml
  confirms validation is unnecessary when content is hardcoded with known structure.

  ## Implementation Strategy

  **Single-phase implementation** with sequential tasks:

  1. **Phase 1: File Creation & Git Integration**
     - Create markdown file with pathlib.Path using hardcoded prose content
     - Verify file encoding (UTF-8), line endings (LF), and format compliance
     - Execute git workflow: stage → commit → push

  **Why this approach:**
  - File creation must precede git operations (can't stage a non-existent file)
  - Git operations are sequential and depend on file existence
  - All operations are straightforward with minimal error cases
  - Testing (RED-GREEN-REFACTOR) is integrated into task definitions, not separate

  **No parallel phases:** All work is sequential; git operations depend on file creation.

  ## Risk Mitigation

  | Risk | Mitigation | Severity |
  | ---- | ---------- | -------- |
  | Encoding mismatch (CRLF vs LF) | Use explicit '\n' in Python string literals; pathlib.Path.write_text() handles encoding. Validate with file check utility or hex dump. | Low |
  | Git authentication/configuration failure | Assume git is configured (user.name, user.email, credentials). Error handling in subprocess.run() will catch failures. | Low |
  | File already exists (collision) | test-n49t8o.md is unique filename; collision with existing file is virtually impossible. pathlib.Path.write_text() overwrites existing files (acceptable for test artifact). | Very Low |
  | File system permissions | Repository root is writable (test files already exist there). No permission escalation needed. | Very Low |
  | Subprocess command injection | All command strings are hardcoded; no user input interpolated. No shell=True used. | Very Low |

  ## Success Criteria

  Feature is complete when:
  - ✓ File test-n49t8o.md exists at repository root
  - ✓ File contains one H1 heading, blank line, 2-3 sentences of prose
  - ✓ File is UTF-8 encoded without BOM
  - ✓ File uses Unix-style LF line endings
  - ✓ File size is approximately 400-600 bytes
  - ✓ Git commit exists with message: `feat(069): create markdown file test-n49t8o.md with prose content`
  - ✓ Changes are pushed to remote origin on feat/069-markdown-file-creation branch

  ## Related Context

  This feature is part of a series (063-069) that creates simple test markdown files following
  an identical pattern. The established pattern provides clear precedent for:
  - File location (repository root)
  - Content structure (H1 heading + 2-3 sentences)
  - Prose encoding (UTF-8, LF)
  - Git workflow (conventional commits, push to feature branch)

  The minimalist design is intentional: these features demonstrate automated file creation,
  git integration, and conventional commit workflows on a tiny, atomic scale with zero
  impact on application source code.
