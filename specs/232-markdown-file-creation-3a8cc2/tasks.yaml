      - "create_file() includes FileExistsError check before attempting write"
      - "File is written with encoding='utf-8' and newline='\\n' parameters"
      - "Function handles OSError exceptions with informative error messages"
      - "Script is executable (shebang #!/usr/bin/env python3 included)"
