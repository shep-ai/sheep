    title: "Implement git operations (add, commit, push)"
    description: |
      Implement three git operation functions using subprocess.run() with check=True: git_add(), git_commit(),
      and git_push(). Each function executes the corresponding git command on the created file. Add proper error
      handling for subprocess.CalledProcessError to provide clear error messages when git operations fail.
      Implement main() orchestration function that calls create_file() → git_add() → git_commit() → git_push()
      in sequence with proper error propagation.
    state: "Todo"
    dependencies:
      - "task-1-script-setup"
    acceptanceCriteria:
