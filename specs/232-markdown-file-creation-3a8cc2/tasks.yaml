    title: "Create implementation script with constants and file creation function"
    description: |
      Establish the Python implementation script (create_markdown_file_232.py) with module-level constants
      for filename, title, prose, and commit message. Implement the create_file() function using
      pathlib.Path.write_text() with UTF-8 encoding and explicit LF line ending enforcement (newline='\n').
