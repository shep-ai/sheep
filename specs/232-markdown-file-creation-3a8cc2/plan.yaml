content: |
  ## Architecture Overview

  Feature 232 follows the established single-file-creation pattern from 200+ identical features (061-231)
  in the Sheep automated implementation platform. The architecture is deliberately minimal and focused:

  1. **File Creation (pathlib):** Write a markdown file to disk using Python's built-in pathlib.Path module
     with explicit UTF-8 encoding and LF line ending enforcement.

  2. **Git Integration (subprocess):** Execute git commands (add, commit, push) via subprocess.run() with
     proper error handling (CalledProcessError).

  3. **No External Dependencies:** Feature uses only Python 3.11+ standard library modules (pathlib, subprocess).
     No additional packages required.

  4. **No Source Code Impact:** Pure file creation; does not depend on or modify src/sheep/ or project source code.

  5. **Single Unified Script:** All logic (constants, file creation, git ops) in one Python file for simplicity
     and consistency with precedent pattern.

  ### Repository Context

  - Feature branch `feat/232-markdown-file-creation-3a8cc2` is pre-created and ready
  - Repository root contains 200+ test files (test-*.md) following identical structure
  - All existing files demonstrate UTF-8 + LF line ending standard across the repository
  - Git is configured with user.name and user.email for commits

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path with explicit encoding/newline parameters

  **Chosen:** `Path.write_text(content, encoding='utf-8', newline='\n')`

  **Why this approach:**
  - Cross-platform file operations without platform-specific code (Windows/Mac/Linux)
  - Object-oriented API is more intuitive than legacy os.path module
  - write_text() method handles file opening/closing automatically (safe, no resource leaks)
  - Explicit newline='\n' parameter forces Unix LF line endings on all platforms (meets FR-6)
  - UTF-8 is Python's default encoding and matches all 200+ existing test files in repository
  - Pattern used identically in all precedent implementations (features 061-231)

  **Alternatives considered:**
  - Direct open() with manual close: More verbose, more error-prone with resource cleanup
  - os.path module: Legacy API with more boilerplate, less readable code

  ### 2. Git Execution: subprocess.run() with check=True

  **Chosen:** `subprocess.run(["git", "add"|"commit"|"push"], check=True, capture_output=True)`

  **Why this approach:**
  - subprocess.run() is part of Python standard library (no external dependencies)
  - check=True automatically raises CalledProcessError on non-zero exit codes
  - capture_output=True provides stderr/stdout for debugging failed operations
  - Lightweight for the required operations (add, commit, push)
  - Pattern matches all 230+ precedent implementations

  **Alternatives considered:**
  - GitPython library: External dependency, overkill for simple commands, adds maintenance burden
  - Direct shell execution (os.system): Poor error handling, deprecated approach, shell injection risk

  ### 3. Markdown Structure: H1 heading + blank line + 2-3 sentences + trailing newline

  **Chosen:** `# {TITLE}\n\n{PROSE}\n` (enforced by all 200+ precedent files)

  **Why this approach:**
  - All 200+ existing test markdown files follow identical structure
  - Consistency is essential for maintainability and pattern recognition across test suite
  - Structure is specified in functional requirements FR-2, FR-3, FR-4
  - Natural file size falls within 300-600 byte target range (NFR-1)

  **Alternatives considered:**
  - Variable markdown structure: Would break consistency, makes parsing/validation difficult
  - No blank line between heading/prose: Reduces readability, violates established pattern

  ### 4. Content Constants: Module-level hardcoded values

  **Chosen:** Define FILENAME, TITLE, PROSE, COMMIT_MESSAGE as module-level constants

  **Why this approach:**
  - All values are predetermined (filename is fixed by spec, commit message follows conventional format)
  - Hardcoded constants are simple, readable, self-documenting
  - Pattern matches all 230+ precedent implementations
  - No configuration file overhead (YAML/JSON would add unnecessary complexity)

  **Alternatives considered:**
  - Configuration file (YAML/JSON): Unnecessary complexity for predetermined values
  - Command-line arguments: Violates spec requirement that values are predetermined

  ### 5. Error Handling: Specific exceptions with defensive checks

  **Chosen:** FileExistsError check before creation, OSError for I/O issues, CalledProcessError for git failures

  **Why this approach:**
  - Defensive FileExistsError check prevents accidental overwrites of existing files
  - Specific exception handling provides clear, actionable error messages
  - Pattern matches all precedent implementations
  - Enables fast failure with visibility into root causes

  **Alternatives considered:**
  - No error handling: Risk silent failures and unpredictable behavior
  - Generic catch-all: Obscures root causes, difficult to debug

  ### 6. Workflow Orchestration: Sequential main() function

  **Chosen:** Single main() function orchestrating: create_file() → git_add() → git_commit() → git_push()

  **Why this approach:**
  - Sequential execution respects git ordering dependencies (file must exist before adding, etc.)
  - Single script maintains cohesion and simplicity
  - Matches pattern from all 230+ precedent implementations
  - Logical order ensures each step completes before next begins

  **Alternatives considered:**
  - Asynchronous/parallel execution: Unnecessary complexity, git has ordering dependencies
  - Separate scripts: Breaks cohesion, difficult to ensure atomicity

  ## Implementation Strategy

  ### Phase 1: File Creation & Content Composition (5-7 minutes)

  1. Create `create_markdown_file_232.py` with module-level constants
  2. Compose TITLE (H1 heading text) — meaningful, coherent, 15-25 bytes typically
  3. Compose PROSE (2-3 sentences) — coherent, grammatically correct, 250-400 bytes typically
  4. Implement create_file() function: validate file doesn't exist, write using Path.write_text()
  5. Verify file size naturally falls within 300-600 byte target range
  6. Verify UTF-8 encoding and LF line endings are enforced by write_text() parameters

  ### Phase 2: Git Integration & Conventional Commits (3-5 minutes)

  1. Implement git_add() function: execute `git add test-rnfcfc.md` via subprocess
  2. Implement git_commit() function: execute `git commit -m "feat(232): ..."` with conventional format
  3. Implement git_push() function: execute `git push -u origin feat/232-...` with upstream tracking
  4. Add proper error handling (CalledProcessError) to all git operations
  5. Implement main() orchestration: call functions in sequence with error propagation
  6. Add shebang and direct execution capability

  ### Phase 3: Execution & Verification (2-3 minutes) — during implementation phase

  1. Execute script: python create_markdown_file_232.py
  2. Verify file test-rnfcfc.md exists in repository root
  3. Verify file contents match expected structure (H1 + blank + prose)
  4. Verify git log shows conventional commit message on correct branch
  5. Verify file is tracked by git (appears in git status after push)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists (prevent overwrite) | Low | Medium | Defensive FileExistsError check before write_text() |
  | Git configuration missing (user.name/email) | Low | High | Dependency stated in spec; feature branch pre-created; subprocess error will provide clear message |
  | Line endings wrong on Windows | Very Low | Medium | Explicit newline='\n' parameter in write_text() forces LF on all platforms |
  | File size out of range | Very Low | Low | Natural file size from H1 + blank + 2-3 sentences falls within 300-600 byte target; no validation needed |
  | Git push fails (network/auth) | Very Low | High | Subprocess CalledProcessError provides clear error; caller can retry; feature branch pre-created |
  | Prose is incoherent | Very Low | Low | Composer responsibility to write grammatically correct sentences (NFR-2); review before commit |

  ## Success Criteria

  The implementation is complete when:

  1. ✓ File `test-rnfcfc.md` exists in repository root
  2. ✓ File contains H1 heading + blank line + 2-3 sentences prose
  3. ✓ File is UTF-8 encoded with LF line endings
  4. ✓ File size is 300-600 bytes
  5. ✓ File is staged and committed with conventional message: `feat(232): Create markdown file test-rnfcfc.md with prose content`
  6. ✓ Commit is pushed to feature branch `feat/232-markdown-file-creation-3a8cc2`
  7. ✓ No existing files modified or deleted

  ## Consistency with Precedent Pattern

  This implementation follows the identical pattern from features 061-231:

  - **File naming:** `test-rnfcfc.md` (predetermined by spec)
  - **Location:** Repository root (established across all 200+ test files)
  - **Markdown format:** H1 + blank line + 2-3 sentences (all precedent files)
  - **Encoding:** UTF-8 without BOM, LF line endings (standard)
  - **Technologies:** pathlib + subprocess (all precedent implementations)
  - **Git workflow:** Conventional commits on feature branch (established pattern)
  - **Error handling:** Specific exceptions, defensive checks (pattern from 230+ features)

  ---

