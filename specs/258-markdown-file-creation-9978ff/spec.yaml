content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-badn62.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-257,
  with 257+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-badn62.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\n), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-badn62.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(258): Create markdown file test-badn62.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/258-markdown-file-creation-9978ff`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-badn62.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\n) line endings throughout
  - **FR-7**: The file SHALL be added to git staging area using `git add test-badn62.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(258): Create markdown file test-badn62.md with prose content`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/258-markdown-file-creation-9978ff`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files in the repository
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or nonsensical sentences)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 151-257 for consistency and maintainability
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Product Decisions & AI Recommendations

  All significant product decisions for this feature have been predetermined by 257+ existing test markdown files
  that follow the identical pattern. No open product questions require stakeholder input:

  | Decision Area | Predetermined Value | Rationale |
  | ------------- | ------------------- | --------- |
  | File name | `test-badn62.md` | Fixed by user query; follows `test-<id>.md` pattern from 257+ precedent files |
  | File location | Repository root | Established pattern; all 257+ test files stored at root level |
  | File format | H1 heading + blank line + 2-3 sentences | Defined by 257+ precedent files; no variation permitted |
  | File size range | 300-600 bytes | Measured from existing test files; consistent with precedents |
  | Prose topic | Free-form (arbitrary) | User query specifies \"about anything\"; no constraint required |
  | Encoding | UTF-8 without BOM | Python standard; matches all existing files |
  | Line endings | LF (\n) | Unix convention; matches repository standards |
  | Git workflow | Conventional commits on feature branch | Established pattern from features 151-257 |

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 257+ test markdown files following pattern `test-*.md`
  - Examples: `test-xekj8s.md`, `test-0tyide.md`, `test-khrvcn.md`, `test-badn62.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`
  - Python implementation scripts: `create_markdown_file.py`, `create_markdown_file_*.py` (precedent implementations)

  **Spec Directory Structure:**
  - `specs/` contains 257+ feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Example: `specs/257-markdown-file-creation-40e7b7/spec.yaml`
  - This spec is located at: `specs/258-markdown-file-creation-9978ff/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions
  - `src/sheep/flows/` contains flow orchestration
  - `src/sheep/config/` contains configuration management
  - `src/sheep/cli.py` contains CLI entry point

  ### Architecture Patterns

  **Test File Format (257+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-600 bytes
  - Example from `test-z5u8bz.md`:
    ```markdown
    # The Power of Patience and Persistence

    Success rarely comes from a single brilliant moment but rather from consistent effort applied over time toward meaningful goals. Every expert started as a beginner, learning incrementally through repetition, reflection, and refinement of technique. By embracing patience and trusting the process, we give ourselves the opportunity to develop mastery and achieve things we thought impossible.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-badn62.md`

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with prose content`
  - Changes are pushed to feature branch `feat/###-<feature-name>`

  **Implementation Pattern (from precedent scripts):**
  - Use `pathlib.Path` for cross-platform file operations
  - Construct content with proper formatting: `f\"# {TITLE}\\n\\n{PROSE}\\n\"`
  - Write file with UTF-8 encoding and explicit `newline=\"\\n\"` parameter to enforce LF line endings
  - Execute git commands via subprocess: `git add`, `git commit`, `git push`
  - Follow error handling pattern from previous implementations

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default)
  - Explicit `newline=\"\\n\"` parameter to enforce Unix line endings on all platforms

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/258-markdown-file-creation-9978ff`
  - No specialized libraries required; subprocess module for git command execution

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 257+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-257; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/258-markdown-file-creation-9978ff` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 257+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-257) demonstrate successful execution of identical pattern
  - Features 151-257 specs provide exact templates and working examples
  - Previous implementation scripts (`create_markdown_file_*.py`) provide working code patterns

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 257+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-257) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity

  ---

  _Analysis phase complete — ready for implementation_
