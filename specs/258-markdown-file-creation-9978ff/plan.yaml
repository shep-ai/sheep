content: |
  ## Architecture Overview

  This feature creates a single test markdown file following the established pattern from features 151-257.
  The implementation is purely file artifact creation with no impact on application source code (/src/sheep/)
  or test suite (/tests/). The feature demonstrates automated file creation, git integration, and
  conventional commit workflows at minimal scale.

  **File Creation Pattern:**
  - Location: Repository root (same as all 257+ existing test files)
  - Format: H1 markdown heading + blank line + 2-3 sentences of prose
  - Encoding: UTF-8 without BOM
  - Line endings: LF (\n, Unix-style)
  - Size: 300-600 bytes (typical for test markdown files)

  **Git Workflow:**
  - File is staged with `git add test-badn62.md`
  - Commit message follows conventional format: `feat(258): Create markdown file test-badn62.md with prose content`
  - Changes are pushed to feature branch `feat/258-markdown-file-creation-9978ff`

  **No Dependency Impact:**
  - Feature does not depend on or modify source code, tests, configuration, or other files
  - Single isolated artifact creation at repository root
  - Fully standalone; can be implemented in isolation

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path (Required per NFR-4)

  **Decision:** Use `pathlib.Path.write_text()` for file creation and content writing.

  **Rationale:**
  - NFR-4 mandates use of pathlib for file I/O operations
  - Modern Python 3.11+ standard; clean object-oriented API
  - Single method encapsulates file creation, writing, closing, and encoding
  - Ensures proper resource management and platform compatibility
  - Consistent with established pattern from features 151-257

  **Why not alternatives:**
  - `os.open()` / `os.write()` — lower-level, more verbose, requires manual file descriptor management
  - `open()` built-in — requires explicit context manager or close(); pathlib is more modern and idiomatic

  ### 2. Git Integration: subprocess.run() (No External Dependencies)

  **Decision:** Use `subprocess.run()` with standard git CLI commands (git add, git commit, git push).

  **Rationale:**
  - Part of Python standard library (adheres to NFR-4: no new external dependencies)
  - Clear, explicit command semantics familiar to developers
  - Proper error handling via CalledProcessError exception
  - No abstraction overhead for three simple sequential operations
  - Consistent with implementation approach in features 151-257

  **Why not alternatives:**
  - GitPython library — adds unnecessary abstraction for simple linear operations
  - Shell invocation — harder error handling, cross-platform concerns, security risks

  ### 3. Prose Content: Hardcoded String (Format Guarantee)

  **Decision:** Embed prose content directly in Python source as hardcoded string.

  **Rationale:**
  - Content format is fixed and small (~400-600 bytes); no dynamic generation needed
  - Hardcoding guarantees format compliance (H1 + blank line + 2-3 sentences) without validation logic
  - Established pattern from all 257+ existing test files — all use hardcoded prose
  - Topic selection is fully flexible (implementer chooses any topic); topic chosen at authoring time, not runtime

  **Why not alternatives:**
  - Template-based generation — unnecessary complexity for fixed format
  - External file loading — adds I/O complexity and deployment concerns
  - No sentence count validation — hardcoding guarantees compliance; runtime validation would be wasteful

  ### 4. Topic Selection: Fully Flexible (Implementer Choice)

  **Decision:** Allow implementer to choose any topic; no predefined list or domain restrictions.

  **Rationale:**
  - User query explicitly permits "about anything"
  - NFR-7 confirms "fully flexible — any topic chosen by implementer"
  - 257+ existing test files demonstrate diverse topics without consistency concerns
  - Topic flexibility does not impact feature compliance (format consistency is what matters)
  - Maximizes implementer autonomy and creative choice

  ### 5. Encoding & Line Endings: UTF-8 + LF (Cross-Platform Consistency)

  **Decision:** Use UTF-8 encoding without BOM; explicitly use LF (\n) line endings throughout.

  **Rationale:**
  - NFR-5 requires UTF-8 without BOM (Python's default for write_text())
  - NFR-6 requires Unix-style LF line endings across all platforms (Windows, Linux, macOS)
  - pathlib.Path.write_text() with explicit '\n' characters ensures LF output on all platforms
  - Avoids platform-specific CRLF on Windows; maintains consistency with existing test files

  **Why not alternatives:**
  - Platform-native line endings — would violate NFR-6 (CRLF on Windows breaks requirement)
  - Binary mode with manual encoding — unnecessary verbosity; text mode is correct approach

  ## Implementation Strategy

  **Single Phase Approach (Phase 1: File Creation & Git Integration)**

  The feature is simple and atomic enough to implement in a single phase:

  1. **Task 1: Create Markdown File** — Compose prose content (implementer topic choice), write file using pathlib.Path.write_text() with UTF-8 encoding and explicit LF newlines.

  2. **Task 2: Verify File Format** — Validate file exists, contains correct structure (H1 + blank line + 2-3 sentences), has correct encoding (UTF-8, no BOM), uses LF line endings, and falls within 300-600 byte size range.

  3. **Task 3: Git Integration** — Stage file with `git add`, commit with conventional message format, push to feature branch using subprocess.run() for each git command.

  **Rationale for Single Phase:**
  - All tasks depend on prior task completion but happen in simple sequence
  - No parallel work opportunities (git operations must happen sequentially)
  - Feature is small ("S" size estimate per spec: 10-15 minutes of work)
  - Pattern is well-established with 257+ precedents; no architectural decisions needed at implementation time

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Prose topic selection paralysis | Implementer has full creative freedom; any topic is valid. Choose quickly; topic does not affect feature acceptance. |
  | File encoding issues (accidental CRLF on Windows) | Use explicit '\n' in prose string and pathlib.Path.write_text() with UTF-8 (default). Test file encoding: verify with `hexdump` or check file size (hardcoded prose guarantees specific byte count). |
  | Git command failures (network issues, wrong branch) | Feature branch `feat/258-markdown-file-creation-9978ff` is pre-created. Use subprocess.run(..., check=True) to raise exception on git failure. Catch and report error. |
  | File already exists (from prior attempt) | Verify file does not exist before creation, or use pathlib.Path.unlink(missing_ok=True) to safely remove if needed. Check git status before staging. |
  | Sentence count drift (accidentally 1 or 4+ sentences) | Hardcode prose with exactly 2-3 sentences at authoring time. No runtime validation needed; format is guaranteed by source code. |
  | Conventional commit format error | Use hardcoded commit message template with file name interpolation: `f"feat(258): Create markdown file test-badn62.md with prose content"`. No user input or dynamic formatting. |

