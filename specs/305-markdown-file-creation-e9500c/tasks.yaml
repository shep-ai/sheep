# Markdown content (the full tasks document)
content: |
  ## Implementation Summary

  Feature 305 is implemented across four phases and five focused tasks:

  **Phase 1: Foundation and Module Setup (Task 1)**
  Establishes the feature module structure by creating src/sheep/features/feature_305.py with
  proper imports for the orchestration function and logging utilities. This foundation enables
  the subsequent implementation phases.

  **Phase 2: Implementation and Orchestration (Task 2)**
  Implements the core feature logic by calling the existing create_markdown_file() function
  with the correct parameters (filename and feature_number). The implementation is minimal
  (2-5 lines of functional code) as all complexity is handled by existing infrastructure.
  Error handling and logging are integrated for observability.

  **Phase 3: Validation and Testing (Tasks 3 and 4)**
  Validates the implementation through two focused test tasks. Task 3 verifies file creation
  and structure (UTF-8 encoding, LF line endings, H1 heading, 2-3 sentences). Task 4 verifies
  git operations (commit with conventional message, upstream push). Each task follows TDD
  cycles (RED-GREEN-REFACTOR) for comprehensive validation.

  **Phase 4: Git Integration and Finalization (Task 5)**
  Performs a comprehensive final check that all success criteria from the feature spec are
  satisfied. This task consolidates all previous validations and ensures the implementation
  is complete and ready for integration.

  ## Workflow Overview

  1. **Module Setup**: Create feature module with imports
  2. **Implementation**: Call orchestration function with correct parameters
  3. **File Validation**: Verify markdown file structure and encoding
  4. **Git Integration**: Verify commit message and push to remote
  5. **Final Verification**: Comprehensive check of all success criteria

  ## Key Design Patterns

  - **TDD Cycles**: Each task includes RED (test first), GREEN (minimal implementation),
    REFACTOR (improve) phases. This ensures thorough testing and maintainability.

  - **Dependency Ordering**: Tasks are ordered so that module structure (task 1) must be
    completed before implementation (task 2), which must be completed before validation
    (tasks 3-4), which must be completed before finalization (task 5).

  - **Reuse of Existing Infrastructure**: The implementation leverages existing functions
    from content_generators.py (create_markdown_file, generate_markdown_content,
    write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file).
    No new utilities or infrastructure is created.

  - **Minimal Implementation**: Following the established pattern from 304+ features, the
    feature implementation is a thin orchestration wrapper (2-5 lines of functional code)
    that calls the existing orchestration function.

  - **Comprehensive Validation**: Each validation task includes multiple acceptance criteria
    that cover encoding, structure, git operations, and conformance to the specification.

  ## Effort Breakdown

  - Task 1 (Module Setup): 10 minutes
  - Task 2 (Implementation): 10 minutes
  - Task 3 (File Validation): 10 minutes
  - Task 4 (Git Verification): 10 minutes
  - Task 5 (Final Verification): 5 minutes
  - **Total: 45 minutes**

  This estimate aligns with the spec's estimate of 15-20 minutes for the core implementation
  plus 20-25 minutes for comprehensive testing and validation.

  ## No Code Modifications Required

  As specified in NFR-2, the implementation creates only the new feature module
  (src/sheep/features/feature_305.py) and the markdown file (test-9s145k.md). No existing
  source code, tests, or configuration files are modified. The implementation reuses all
  existing infrastructure without changes.
