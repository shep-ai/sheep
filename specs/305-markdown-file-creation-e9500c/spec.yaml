content: |
  ## Problem Statement

  Create a single markdown file at the repository root with filename `test-9s145k.md`, containing an H1 heading (title) and 2-3 sentences of coherent prose. The file must be properly encoded (UTF-8, no BOM) with Unix line endings (LF). This feature follows the established workflow pattern from 304 preceding markdown file creation features: generate content → write file → validate → commit → push.

  ## Functional Requirements

  - **FR-1: Content Generation**: Generate markdown content via Claude API consisting of an H1 heading (title) and 2-3 coherent sentences of prose about any topic using the `generate_markdown_content()` utility.

  - **FR-2: File Creation**: Write generated content to a file named `test-9s145k.md` at the repository root using the `write_markdown_file()` utility with proper UTF-8 encoding.

  - **FR-3: UTF-8 Encoding**: Ensure the file is saved with UTF-8 character encoding and contains no Byte Order Mark (BOM).

  - **FR-4: Unix Line Endings**: Ensure the file uses Unix LF (`\n`) line endings, not CRLF (`\r\n`) or CR (`\r`).

  - **FR-5: Markdown Structure**: Ensure the first line of the file is a valid H1 markdown heading in the format `# Title`, followed by 2-3 sentences of prose content.

  - **FR-6: Content Validation**: Validate the file against structural and encoding requirements using the `validate_markdown_file()` utility before committing.

  - **FR-7: Git Operations**: Stage, commit, and push the file to the remote repository with a conventional commit message in the format `feat(305): create markdown file test-9s145k.md with prose content`.

  - **FR-8: Commit Metadata**: Ensure the commit includes proper author information, timestamp, and follows conventional commit structure as required by the project.

  ## Non-Functional Requirements

  - **NFR-1: Code Reusability**: Implementation must reuse existing utilities from `src/sheep/content_generators.py` without modifying them. No new infrastructure or utilities should be created.

  - **NFR-2: No Source Code Modifications**: The feature must not modify any existing source code in `src/sheep/`, configuration files, or tests. Only the new markdown file and feature module should be added.

  - **NFR-3: Minimal Orchestration Code**: Implementation should require approximately 10-15 lines of orchestration code following the established pattern from features 1-304.

  - **NFR-4: Structured Logging**: All steps (generate, write, validate, commit, push) must emit structured log entries via `sheep.observability.logging.get_logger()` for observability and debugging.

  - **NFR-5: Error Propagation**: Any error during generation, file operations, validation, or git operations must be logged with full context and propagated to the caller (fail-fast pattern).

  - **NFR-6: Environment Compatibility**: Implementation must work in Unix environments with Python 3.10+, Git CLI, and configured Claude API credentials via `.env`.

  - **NFR-7: Execution Deadline**: Complete generation, validation, commit, and push within the project's infrastructure timeout constraints (typically 30-60 seconds for full workflow).

  ## Success Criteria

  - [ ] File `test-9s145k.md` exists at the repository root
  - [ ] File contains valid UTF-8 encoded text with no BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings exclusively (not CRLF or CR)
  - [ ] First line is a valid H1 markdown heading in the format `# Title` or `# Proper Title`
  - [ ] Content includes exactly 2-3 sentences of coherent, grammatically correct prose after the heading
  - [ ] Prose content is thematically related and logically connected to the H1 title
  - [ ] File passes all validation checks in `validate_markdown_file()`
  - [ ] File is staged and committed to the local repository
  - [ ] Git commit message matches format: `feat(305): create markdown file test-9s145k.md with prose content`
  - [ ] Commit includes author metadata and timestamp in conventional format
  - [ ] Changes are pushed to remote repository on branch `origin/feat/305-markdown-file-creation-e9500c`
  - [ ] No existing files, source code, or configuration modified
  - [ ] Execution completes without errors or warnings in logs
  - [ ] Feature module `src/sheep/features/feature_305.py` created and follows established orchestration pattern

  ## Codebase Analysis

  ### Project Structure

  The project is a **markdown file creation automation system** with the following key directories:

  | Directory | Purpose |
  | --------- | ------- |
  | `src/sheep/content_generators.py` | Main orchestration module with utilities for generate, write, validate, commit, push |
  | `src/sheep/features/` | Individual feature implementations (currently 304 features) |
  | `src/sheep/config/` | Configuration for LLM and project settings |
  | `src/sheep/observability/` | Structured logging and monitoring |
  | `src/sheep/tools/` | Git operations (commit, push, add) |
  | `specs/` | Feature specifications (currently 305 specs) |
  | Repository root | Where all generated markdown files are stored (test-*.md) |

  ### Architecture Patterns

  **Workflow Pattern**: The project follows a consistent orchestration pattern:

  1. **Generate**: Use Claude API via `generate_markdown_content()` to create content with H1 heading + 2-3 sentences
  2. **Write**: Use `write_markdown_file(content, filename)` to write to disk at repository root
  3. **Validate**: Use `validate_markdown_file(filepath)` to check encoding, line endings, structure
  4. **Commit**: Use `commit_markdown_file()` to stage and commit with conventional message format
  5. **Push**: Use `push_markdown_file()` to push to remote with upstream tracking

  **Code Organization**:
  - Utilities are centralized in `content_generators.py` and reused across all 305 features
  - Each feature gets a corresponding feature module (e.g., `feature_304.py`) that orchestrates the workflow
  - No code duplication; all features follow the same orchestration pattern
  - Conventional commit format: `feat(305): create markdown file test-9s145k.md with prose content`

  ### Relevant Technologies

  **Runtime Stack**:
  - **Python 3.10+**: Primary language for orchestration and file operations
  - **Claude API**: Generates coherent prose via CrewAI LLM framework (accessed via `get_reasoning_llm()`)
  - **Git CLI**: Handles staging, committing, pushing (via `subprocess`)
  - **pathlib**: Cross-platform file path handling (stdlib)

  **Project Infrastructure**:
  - `sheep.config.llm.get_reasoning_llm()`: Returns configured Claude API client
  - `sheep.observability.logging.get_logger()`: Structured logging throughout
  - `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool`: Wrapper classes for git operations
  - `.env` configuration for API credentials

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file (test-9s145k.md) added at root; no existing files modified |
  | src/sheep/features/ | Low | New feature_305.py module will be added; existing code unchanged |
  | src/sheep/content_generators.py | None | Existing utilities reused without modification; no changes needed |
  | Git history | Low | Single commit added with conventional message format (feat(305): ...) |
  | specs/ | None | Spec document itself is updated; no implementation specs touched |

  ## Dependencies

  **Runtime Dependencies**:
  - Python pathlib (standard library)
  - git command-line tool or equivalent (for staging, committing, pushing)
  - Claude API credentials and client (for content generation)
  - CrewAI LLM framework integration (already configured in project)

  **Code Dependencies**:
  - `src/sheep/content_generators.py` (main orchestration: generate, write, validate, commit, push)
  - `src/sheep/config/llm.py` (LLM configuration and model selection)
  - `src/sheep/observability/logging.py` (structured logging)
  - `src/sheep/tools/` (git operations)

  **External Dependencies**:
  - No new Python packages required (all infrastructure exists)
  - No modifications to existing source code, tests, or configuration files
  - No build system changes needed

  ## Size Estimate

  **S** — This is a minimal feature unit:

  - Single file creation at repository root (requires ~5 lines of orchestration code)
  - No new source code modules or utilities required (all infrastructure exists in content_generators.py)
  - No tests, no documentation beyond this spec, no configuration changes
  - Follows battle-tested pattern from 304 preceding features
  - Estimated effort: **15-20 minutes** for implementation
    - Generate content: 2 minutes (Claude API call)
    - Write file: 1 minute (pathlib file write)
    - Validate: 1 minute (validation utility)
    - Commit: 2 minutes (git operations)
    - Push: 2 minutes (git push with upstream)
    - Total orchestration code: ~10-15 lines

  **Why Small?**
  - All supporting infrastructure (generate, write, validate, commit, push) already exists
  - No new dependencies, no architectural changes, no refactoring needed
  - Single file creation with no side effects or impacts
  - Reuses established patterns and utilities without modification

  ## Product Decisions Summary

  | # | Decision | Answer | Rationale |
  | - | -------- | ------ | --------- |
  | 1 | Prose Quality Validation Level | Basic validation only | Claude API output is high-quality; basic validation catches encoding/structure issues while keeping execution fast and simple, matching the established pattern from 304 prior features. |
  | 2 | Error Handling Strategy | Fail fast with error reporting | Keeps orchestration logic transparent and simple; errors are rare in stable infrastructure so retries add unnecessary complexity; enables quick debugging and re-runs without manual intervention. |
  | 3 | Prose Content Topics | Any topic (free-form) | Simplest implementation with no configuration overhead; leverages Claude's creativity; maximizes content diversity; aligns with automation-first philosophy; matches approach from prior features. |

  ---

