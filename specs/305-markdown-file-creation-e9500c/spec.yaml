content: |
  ## Problem Statement

  Create a single markdown file at the repository root with filename test-9s145k.md, containing an H1 heading (title) and 2-3 sentences of coherent prose. The file must be properly encoded (UTF-8, no BOM) with Unix line endings (LF). This feature follows the established workflow pattern from 304 preceding markdown file creation features: generate content → write file → validate → commit → push.

  ## Codebase Analysis

  ### Project Structure

  The project is a **markdown file creation automation system** with the following key directories:

  | Directory | Purpose |
  | --------- | ------- |
  | `src/sheep/content_generators.py` | Main orchestration module with utilities for generate, write, validate, commit, push |
  | `src/sheep/features/` | Individual feature implementations (currently 304 features) |
  | `src/sheep/config/` | Configuration for LLM and project settings |
  | `src/sheep/observability/` | Structured logging and monitoring |
  | `src/sheep/tools/` | Git operations (commit, push, add) |
  | `specs/` | Feature specifications (currently 305 specs) |
  | Repository root | Where all generated markdown files are stored (test-*.md) |

  ### Architecture Patterns

  **Workflow Pattern**: The project follows a consistent orchestration pattern:

  1. **Generate**: Use Claude API via `generate_markdown_content()` to create content with H1 heading + 2-3 sentences
  2. **Write**: Use `write_markdown_file(content, filename)` to write to disk at repository root
  3. **Validate**: Use `validate_markdown_file(filepath)` to check encoding, line endings, structure
  4. **Commit**: Use `commit_markdown_file()` to stage and commit with conventional message format
  5. **Push**: Use `push_markdown_file()` to push to remote with upstream tracking

  **Code Organization**:
  - Utilities are centralized in `content_generators.py` and reused across all 305 features
  - Each feature gets a corresponding feature module (e.g., `feature_304.py`) that orchestrates the workflow
  - No code duplication; all features follow the same orchestration pattern
  - Conventional commit format: `feat(305): create markdown file test-9s145k.md with prose content`

  ### Relevant Technologies

  **Runtime Stack**:
  - **Python 3.10+**: Primary language for orchestration and file operations
  - **Claude API**: Generates coherent prose via CrewAI LLM framework (accessed via `get_reasoning_llm()`)
  - **Git CLI**: Handles staging, committing, pushing (via `subprocess`)
  - **pathlib**: Cross-platform file path handling (stdlib)

  **Project Infrastructure**:
  - `sheep.config.llm.get_reasoning_llm()`: Returns configured Claude API client
  - `sheep.observability.logging.get_logger()`: Structured logging throughout
  - `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool`: Wrapper classes for git operations
  - `.env` configuration for API credentials

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file (test-9s145k.md) added at root; no existing files modified |
  | src/sheep/features/ | None | New feature_305.py module will be added during implementation; existing code unchanged |
  | src/sheep/content_generators.py | None | Existing utilities reused without modification; no changes needed |
  | Git history | Low | Single commit added with conventional message format (feat(305): ...) |
  | specs/ | None | Spec document itself is updated; no implementation specs touched |

  ## Dependencies

  **Runtime Dependencies**:
  - Python pathlib (standard library)
  - git command-line tool or equivalent (for staging, committing, pushing)
  - Claude API credentials and client (for content generation)
  - CrewAI LLM framework integration (already configured in project)

  **Code Dependencies**:
  - `src/sheep/content_generators.py` (main orchestration: generate, write, validate, commit, push)
  - `src/sheep/config/llm.py` (LLM configuration and model selection)
  - `src/sheep/observability/logging.py` (structured logging)
  - `src/sheep/tools/` (git operations)

  **External Dependencies**:
  - No new Python packages required (all infrastructure exists)
  - No modifications to existing source code, tests, or configuration files
  - No build system changes needed

  ## Success Criteria

  - [ ] File `test-9s145k.md` exists at repository root
  - [ ] File contains valid UTF-8 encoded text with no BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (not CRLF or CR)
  - [ ] First line is an H1 markdown heading (format: # Title)
  - [ ] Content includes 2-3 additional sentences of coherent, grammatically correct prose
  - [ ] Prose is thematically related to the title
  - [ ] File passes all validation in `validate_markdown_file()`
  - [ ] File is staged, committed, and pushed to remote
  - [ ] Git commit message follows format: `feat(305): create markdown file test-9s145k.md with prose content`
  - [ ] Commit includes all required metadata (author, timestamp, conventional commit structure)
  - [ ] Changes pushed to remote repository on `origin/feat/305-markdown-file-creation-e9500c` branch
  - [ ] No existing files or source code modified
  - [ ] Execution completes without errors or warnings

  ## Size Estimate

  **S** — This is a minimal feature unit:

  - Single file creation at repository root (requires ~5 lines of orchestration code)
  - No new source code modules or utilities required (all infrastructure exists in content_generators.py)
  - No tests, no documentation beyond this spec, no configuration changes
  - Follows battle-tested pattern from 304 preceding features
  - Estimated effort: **15-20 minutes** for implementation
    - Generate content: 2 minutes (Claude API call)
    - Write file: 1 minute (pathlib file write)
    - Validate: 1 minute (validation utility)
    - Commit: 2 minutes (git operations)
    - Push: 2 minutes (git push with upstream)
    - Total orchestration code: ~10-15 lines

  **Why Small?**
  - All supporting infrastructure (generate, write, validate, commit, push) already exists
  - No new dependencies, no architectural changes, no refactoring needed
  - Single file creation with no side effects or impacts
  - Reuses established patterns and utilities without modification

