content: |
  ## Summary

  This task breakdown implements the markdown file creation feature across four phases in five concrete tasks.

  **Phase 1: Setup** establishes the script structure with module constants and function skeletons.

  **Phase 2: File Creation** implements the core file creation logic using pathlib with proper UTF-8 encoding
  and explicit LF line ending enforcement. This ensures cross-platform consistency and meets the requirement
  for 300-600 byte files with correct markdown structure.

  **Phase 3: Git Integration** implements the git workflow (add, commit, push) using subprocess.run() with
  proper error handling. The conventional commit message format is enforced, and the feature branch is
  explicitly referenced.

  **Phase 4: Orchestration & Verification** creates the main() function to orchestrate all steps and
  provides comprehensive error handling. The final task executes the script and verifies all requirements
  are met: file properties, git state, content quality, and no unintended side effects.

  Each task includes TDD cycles (except setup tasks) that outline what to test (RED), minimal implementation
  (GREEN), and cleanup (REFACTOR). The ordering respects dependencies: setup first, then file creation,
  then git operations, then orchestration and verification.

  Total estimated effort: 1 hour 35 minutes (aligns with feature size estimate of S — Small, 10-15 minutes
  of actual execution time, but includes thorough implementation, error handling, and verification phases).

