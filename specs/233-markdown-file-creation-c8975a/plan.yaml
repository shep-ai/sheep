content: |
  ## Architecture Overview

  This feature implements a standalone Python script that creates a single markdown file and integrates
  it with git version control. The implementation follows the established pattern from 200+ existing
  test markdown files (features 061-232) in the Sheep automated implementation platform.

  ### Design Pattern

  The feature uses a simple, linear architecture:

  1. **Constants Definition** (module-level): FILENAME, TITLE, PROSE, COMMIT_MESSAGE
  2. **File Creation** (pathlib.Path): UTF-8 encoding with explicit `newline='\n'` for LF line endings
  3. **Git Workflow** (subprocess.run()): Sequential execution of add → commit → push
  4. **Main Orchestration** (try/except): Error handling with specific exception types

  ### Repository Integration

  - **Location**: Implementation script at repository root (e.g., `create_markdown_file_233.py`)
  - **Output**: Markdown file created at repository root (e.g., `test-god37p.md`)
  - **No Code Dependencies**: Feature does not import or depend on any Sheep platform code
  - **No Configuration Changes**: No modifications to existing files, configs, or documentation

  ### Consistency with Precedents

  This implementation mirrors features 232, 231, 230, and all prior markdown-file-creation features:
  - File naming: `test-god37p.md` (predetermined by feature spec)
  - Location: Repository root (established pattern across 200+ files)
  - Format: H1 heading + blank line + 2-3 sentences prose (all precedent files)
  - Encoding: UTF-8 without BOM, LF line endings (standard across repository)
  - Git workflow: add → commit → push on feature branch (standard pattern)

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path (Python standard library)

  **Chosen**: `pathlib.Path` with `Path.write_text(encoding='utf-8', newline='\n')`

  **Why**: Cross-platform compatibility, object-oriented API, built-in support for encoding and newline
  parameters in a single method call. The `write_text()` method encapsulates UTF-8 encoding and explicit
  LF line ending enforcement. This pattern is used in all 230+ existing implementation scripts (features
  061-232) and ensures consistency.

  **Alternatives Rejected**:
  - `os.path`: Legacy API with more boilerplate code; less intuitive for file operations
  - Direct `open()`: Requires manual context management and explicit close handling; more error-prone

  ### 2. Git Command Execution: subprocess.run() with check=True

  **Chosen**: `subprocess.run(["git", "add"|"commit"|"push"], check=True, capture_output=True)`

  **Why**: Available in Python standard library with reliable error checking. The `check=True` parameter
  automatically raises `CalledProcessError` on non-zero exit codes, providing clear error visibility.
  Lightweight for simple commands (add/commit/push). This pattern is used in all 230+ precedent
  implementations.

  **Alternatives Rejected**:
  - GitPython library: External dependency; unnecessary complexity for simple add/commit/push operations
  - Shell execution (`os.system()`): Poor error handling; deprecated approach; susceptible to shell injection

  ### 3. Text Encoding and Line Endings: UTF-8 + explicit newline='\n'

  **Chosen**: `Path.write_text(content, encoding='utf-8', newline='\n')`

  **Why**: UTF-8 is Python's default encoding and matches all existing test files in the repository.
  The explicit `newline='\n'` parameter forces Unix-style LF line endings on all platforms
  (Windows/macOS/Linux), meeting functional requirement FR-7. This ensures cross-platform consistency
  and matches the pattern from all 230+ precedent implementations. Without this parameter, Windows
  would create CRLF line endings, violating the requirement.

  **Alternatives Rejected**:
  - Platform-dependent line endings: Would create CRLF on Windows, violating Unix LF requirement
  - Manual line ending conversion: Unnecessary when pathlib provides native support

  ### 4. Markdown Structure: H1 + blank line + 2-3 sentences + trailing newline

  **Chosen**: Strict structure matching all 200+ precedent test files

  **Why**: All 200+ existing test markdown files follow this identical structure (defined in features
  061-232). Consistency is essential for maintainability and pattern recognition. This structure is
  enforced by functional requirements FR-2, FR-3, and FR-4.

  **Alternatives Rejected**:
  - Variable heading levels or structure: Would break consistency across the test file collection
  - Omitting blank line: Reduces readability; violates established pattern in all precedent files

  ### 5. Error Handling: Specific Exceptions with Defensive Checks

  **Chosen**: Catch `FileExistsError` (defensive check), `OSError` (I/O issues), `subprocess.CalledProcessError` (git failures)

  **Why**: Defensive programming prevents common issues like accidentally overwriting existing files.
  Specific exception handling provides clear error messages. The `FileExistsError` check matches the
  pattern used in all precedent implementations.

  **Alternatives Rejected**:
  - No error handling: Risks silent failures and unpredictable behavior on edge cases
  - Generic catch-all (bare `except:`): Obscures root causes; difficult to debug specific failures

  ### 6. Configuration: Module-level Constants

  **Chosen**: Module-level constants (FILENAME, TITLE, PROSE, COMMIT_MESSAGE)

  **Why**: Simple, readable, self-documenting approach. Feature 233 has predetermined values specified
  in the requirements. Constants eliminate configuration overhead and match the pattern from all
  230+ precedent implementations.

  **Alternatives Rejected**:
  - Configuration files (YAML/JSON): Unnecessary complexity for predetermined values
  - Command-line arguments: Violates spec requirement that values are predetermined

  ### 7. Workflow Orchestration: Sequential main() Function

  **Chosen**: Single `main()` function orchestrating: create file → add → commit → push

  **Why**: Sequential execution maintains logical order and ensures each step completes before the next.
  Git workflow requires ordering: file must exist before adding, must be added before committing, etc.
  All precedent implementations use a single orchestrated `main()` function.

  **Alternatives Rejected**:
  - Asynchronous/parallel execution: Unnecessary; git operations have ordering dependencies
  - Separate scripts: Breaks cohesion; difficult to ensure atomicity; violates precedent pattern

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: Setup & Scaffolding**
  - Establish the script structure with module imports (pathlib, subprocess) and constants
  - Define FILENAME, TITLE, PROSE, COMMIT_MESSAGE as module-level constants
  - Create helper functions: `create_file()`, `git_add()`, `git_commit()`, `git_push()`
  - This phase provides the foundation for all subsequent work

  **Phase 2: File Creation**
  - Implement the `create_file()` function using `pathlib.Path.write_text()`
  - Ensure proper UTF-8 encoding and LF line ending enforcement
  - Add defensive `FileExistsError` check to prevent overwrites
  - Verify file is created with correct content, encoding, size

  **Phase 3: Git Integration**
  - Implement `git_add()` using `subprocess.run()` with ["git", "add", FILENAME]
  - Implement `git_commit()` with conventional message format: `feat(233): Create markdown file...`
  - Implement `git_push()` with -u flag for upstream tracking
  - Add error handling for `subprocess.CalledProcessError`

  **Phase 4: Orchestration & Verification**
  - Create `main()` function that orchestrates all steps
  - Add try/except blocks for error handling
  - Execute the script and verify all requirements are met
  - Verify file properties (size, encoding, line endings) and git state

  ## Risk Mitigation

  | Risk | Mitigation | Likelihood |
  | ---- | ---------- | ---------- |
  | File already exists (accidental overwrite) | Defensive `FileExistsError` check before creation; script aborts if file exists | Very Low |
  | CRLF line endings on Windows | Explicit `newline='\n'` parameter in `Path.write_text()` forces LF on all platforms | Very Low |
  | Git command failures (wrong branch, auth issues) | `subprocess.run(..., check=True)` raises `CalledProcessError`; clear error message and early abort | Low |
  | Prose content is not coherent or grammatically correct | Content is hardcoded as a module constant; manually verified during implementation | Very Low |
  | File size exceeds 600 bytes or is less than 300 bytes | Hardcoded H1 heading (~15-20 bytes) + blank line (1 byte) + 2-3 sentences (~250-400 bytes) naturally falls within range | Very Low |
  | Encoding issues (BOM, wrong encoding) | UTF-8 is Python's default; `write_text()` enforces UTF-8; no BOM is created | Very Low |
  | Git repository not initialized or in bad state | Feature spec documents dependency: feature branch pre-created; if git fails, clear error message provided | Low |
  | Prose content is plagiarized | Content is original or clearly paraphrased; manually verified during implementation | Very Low |

