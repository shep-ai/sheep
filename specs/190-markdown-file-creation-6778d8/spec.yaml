content: |
  ## Problem Statement

  Create a markdown file named test-08hm34.md at the repository root with a title (H1 heading) and 2-3 sentences of prose content about any topic. This feature is part of a recurring pattern (features 1-190) that systematically creates and manages markdown files within the Sheep agentic platform using established conventions.

  This follows the exact pattern established by 189 preceding features, with proven implementations available as references. The task involves: file creation with proper encoding, validation of markdown structure and encoding, and git integration (add, commit, push).

  ## Success Criteria

  - [ ] File test-08hm34.md exists at repository root with no path separators
  - [ ] File contains exactly one H1 heading using markdown syntax (# Title format)
  - [ ] File contains 2-3 sentences of valid prose content about any topic
  - [ ] File encoding is UTF-8 without BOM (verified by byte inspection)
  - [ ] File line endings are Unix LF only (0x0A), no CRLF or mixed endings
  - [ ] File passes markdown syntax validation (valid heading and content structure)
  - [ ] File size is between 400-600 bytes (consistent with test-*.md pattern)
  - [ ] File format and structure match existing test-*.md files in repository
  - [ ] File is staged with `git add test-08hm34.md`
  - [ ] File is committed with conventional commit message (feat(190): create markdown file test-08hm34.md)
  - [ ] Commit is pushed successfully to remote repository
  - [ ] If file already exists at start, script aborts with clear error message before any modifications
  - [ ] Script executes without errors or exceptions

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named `test-08hm34.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 heading using markdown syntax (`# Title`)
  - **FR-3**: File must contain 2-3 sentences of prose content (content can be about any topic)
  - **FR-4**: File must be encoded in UTF-8 without BOM (no zero-width byte order marker)
  - **FR-5**: File must use Unix LF (0x0A) line endings exclusively, no CRLF or mixed endings
  - **FR-6**: File must pass markdown syntax validation (H1 heading + valid prose sentences present)
  - **FR-7**: File must be exactly 400-600 bytes in size (natural result of proper H1 + 2-3 sentences)
  - **FR-8**: File must be staged to git index using `git add test-08hm34.md`
  - **FR-9**: File must be committed with message: `feat(190): create markdown file test-08hm34.md`
  - **FR-10**: Commit must be pushed to the configured remote repository (origin)
  - **FR-11**: If file already exists at script start, execution must abort with clear error message without modifying any files or repository state
  - **FR-12**: Script must validate all file properties before attempting git operations (fail-fast on validation errors)

  ## Non-Functional Requirements

  - **NFR-1** (Performance): All operations (file creation, validation, git add/commit/push) must complete within 10 seconds
  - **NFR-2** (Reliability): Script must not corrupt or leave the git repository in an inconsistent state if execution fails at any point
  - **NFR-3** (Consistency): File format and content structure must match existing test-*.md files (189+ examples in repository)
  - **NFR-4** (Maintainability): Implementation must follow patterns established by features 185-189 for easy maintenance and understanding
  - **NFR-5** (Validation): All file properties must be validated (encoding, line endings, syntax) before git commit to ensure quality
  - **NFR-6** (Safety): Script must abort with clear, actionable error messages if any required file property is invalid or git operations fail
  - **NFR-7** (Observability): Error messages must clearly indicate what failed (file creation, validation, git operation) and why

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Commit message format - what exact conventional format? | `feat(190): create markdown file test-08hm34.md` | Descriptive format clearly communicates what file was created and matches pattern from recent features (185-189) |
  | 2 | How to handle git operation failures? | Fail immediately with clear error message | Simple, maintains consistency with prior pattern; repository state not modified if operation incomplete |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation built on CrewAI. The repository contains:

  - **Root directory**: Contains 189+ test markdown files (test-*.md) following the same pattern, plus documentation and configuration files
  - **specs/ directory**: Specifications for all features, numbered 1-190, each with its own subdirectory
  - **src/sheep/**: Main Python package containing agents, flows, tools, and configuration
  - **create_markdown_file.py**: Standalone Python script demonstrating the markdown file creation pattern

  This feature extends the established pattern of creating test markdown files in the repository root, which is a core capability of the Sheep platform.

  ### Architecture Patterns

  The codebase follows these key patterns relevant to this feature:

  1. **File Creation Pattern**: Create files with specific structure (H1 heading + prose), proper encoding (UTF-8), and line endings (Unix LF)
  2. **Validation Pattern**: Comprehensive validation checks on file properties before committing
  3. **Git Integration Pattern**: Consistent workflow of git add → commit → push with conventional commit messages
  4. **Feature Numbering**: Sequential feature numbers with unique identifiers (test-08hm34 in this case)

  Multiple reference implementations exist in the codebase:
  - create_markdown_file.py (feature 174 implementation)
  - create_markdown.py
  - Established pattern across features 101-189

  ### Relevant Technologies

  - **Python pathlib**: Cross-platform file I/O for creating and validating markdown files
  - **subprocess module**: Execute git commands (add, commit, push) programmatically
  - **UTF-8 encoding**: Ensure proper text encoding without BOM
  - **Markdown format**: Standard markdown syntax with H1 headings (# Title)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Creates single new file (test-08hm34.md) following established pattern of 189+ existing test-*.md files |
  | Git repository | Low | Standard git workflow (add, commit, push) using subprocess to execute git commands |
  | File system | Low | Simple file write operation (~450-550 bytes) with UTF-8 encoding and LF line endings |
  | Validation layer | Low | File structure, encoding, and line ending validation reusing patterns from existing implementations |

  ## Dependencies

  **External Dependencies:**
  - Git (version control system) — must be available in PATH for subprocess calls

  **Internal Dependencies:**
  - Established markdown file patterns from existing 189+ test files (test-xgtwtq.md, test-ir293z.md, test-khrvcn.md, etc.)
  - Repository must be a valid git repository with remote configured
  - Python 3.11+ with standard library modules (pathlib, subprocess, sys, os)

  **Known Working Examples:**
  - 189+ similar test markdown files already exist in repository root
  - Reference implementations: create_markdown_file.py, create_markdown.py demonstrate the complete pattern
  - Features 185-189 all completed identical tasks successfully
  - Commit history shows consistent successful pattern with features 185-189

  **No New Dependencies Required**
  - Only Python standard library modules needed
  - File I/O operations handled by pathlib (already used throughout codebase)
  - Git operations via subprocess (standard pattern across repository)

  ## Size Estimate

  **S** — 1-2 hours of work

  **Justification:**
  - Trivial complexity: Single file creation following an established, well-documented pattern with 189 prior implementations
  - No new code paths or logic required: Copy pattern from proven reference implementations (features 185-189, create_markdown_file.py)
  - No external dependencies: Only Python standard library (pathlib, subprocess)
  - Clear success criteria: H1 heading + 2-3 sentences, proper encoding/line endings, git workflow
  - Expected file size: ~450-550 bytes (consistent with similar test files)
  - No architectural decisions required: Pattern is already established and validated
  - Validation is straightforward: File existence, encoding, line endings, markdown syntax checks
  - Reference implementations readily available and tested across 189 prior features
  - Git operations well-tested and reliable

  ---

  _Requirements phase completed — ready for implementation planning_
