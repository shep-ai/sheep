content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24
  - **Pattern:** Validated across 189+ prior implementations
  - **Architecture:** Modular function-based design with Python standard library

  ## Technology Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** pathlib.Path with write_text() method

  **Rejected:**
  - os.path module — older API, requires manual encoding handling
  - open() function — requires file handle management
  - Third-party libraries — unnecessary external dependency

  **Rationale:** pathlib is the modern Python standard for file operations. Provides
  clear API, automatic handle management, and explicit encoding control. Verified across
  189+ prior features in codebase. The write_text(content, encoding='utf-8', newline='\n')
  signature ensures: UTF-8 without BOM, Unix LF line endings on all platforms.

  ### 2. Encoding and Line Ending Enforcement

  **Chosen:** UTF-8 without BOM via encoding='utf-8'; Unix LF via newline='\n'

  **Rejected:**
  - Manual byte encoding (write_bytes) — less convenient, requires explicit LF handling
  - Platform-dependent line endings — causes CRLF on Windows, violates FR-5
  - Manual open() with encoding — more verbose, less safe

  **Rationale:** pathlib.write_text() with encoding='utf-8' ensures UTF-8 (Python's
  UTF-8 encoder never adds BOM). The newline='\n' parameter forces Unix LF (0x0A)
  on all platforms, preventing CRLF. This satisfies FR-4 (UTF-8 without BOM) and
  FR-5 (Unix LF only). Verified in feature 174 and 170+ reference implementations.

  ### 3. Git Integration: subprocess.run()

  **Chosen:** subprocess.run() with check=True for exception-based error handling

  **Rejected:**
  - GitPython library — external dependency not used elsewhere
  - os.system() — no structured error reporting
  - Manual git command parsing — fragile and error-prone

  **Rationale:** subprocess.run() is standard library, already used throughout codebase.
  The check=True parameter raises CalledProcessError on failure, enabling clean exception
  handling. Supports complex operations (git push -u origin HEAD). Matches established
  pattern in features 174-189. No external dependencies.

  ### 4. Validation Timing: Pre-Commit

  **Chosen:** Validate file properties before git add/commit/push

  **Rejected:**
  - Post-commit validation — leaves repository inconsistent if validation fails
  - No validation — violates requirement FR-12
  - Lazy validation — unclear success/failure, breaks fail-fast principle

  **Rationale:** Pre-commit validation (validate_file before git operations) ensures
  files meet requirements before modifying repository. Provides fail-fast semantics,
  repository consistency, clear success signal. Validations check: file exists, size
  in 400-600 byte range, UTF-8 without BOM, no CRLF, H1 heading, blank line, 2-3
  sentences, proper structure. Matches pattern in features 174-189.

  ### 5. Error Handling: Fail Immediately

  **Chosen:** Fail immediately with descriptive error message (no cleanup or retry)

  **Rejected:**
  - Cleanup on failure — adds complexity, not required by spec
  - Retry with backoff — git operations should succeed, adds timeout complexity
  - Silent suppression — violates NFR-6 (clear error messages)

  **Rationale:** Fail-fast approach aligns with feature spec: 'abort with clear error
  message if any git operation fails.' This strategy: matches features 185-189, keeps
  code simple, provides clear error signals, respects user agency. File won't be
  committed if validation fails, so cleanup unnecessary. Repository state unchanged
  if operations fail at any point before final push succeeds.

  ### 6. Implementation Architecture: Modular Functions

  **Chosen:** Modular functions (create_file, validate_file, git_add, git_commit,
  git_push) with main() orchestrator

  **Rejected:**
  - Class-based design — unnecessary abstraction for single-use workflow
  - Monolithic function — harder to test, understand, and debug
  - Multiple scripts per phase — fragmentation, coordination complexity

  **Rationale:** Modular design provides: clear separation of concerns, testability,
  reusability, readability, and matches pattern in features 174-189. Each function
  has clear contract: returns on success, raises specific exception on failure.
  Main function catches exceptions at appropriate granularity. Enables easy validation
  of individual steps.

  ### 7. File Existence Checking: Pre-Creation Check

  **Chosen:** Check with path.exists() before creation; abort if file exists

  **Rejected:**
  - Overwrite existing file — violates FR-11 (abort if file exists)
  - Temporary file then rename — adds complexity, manual cleanup
  - No check — violates FR-11, risk of corrupting existing file

  **Rationale:** path.exists() check provides: FR-11 compliance, simple implementation,
  clear error message, no unintended overwrites. If file exists, create_file() returns
  None and main() exits with error, preventing git operations. Matches pattern in
  features 174-189.

  ### 8. Content Generation: Hard-Coded Constants

  **Chosen:** Prose content defined in module-level TITLE and PROSE constants

  **Rejected:**
  - Random content generation — adds complexity, harder to validate
  - Read from stdin/file — adds I/O complexity and environmental dependencies
  - Template-based generation — unnecessary abstraction

  **Rationale:** Hard-coded prose matches pattern in features 174-189. Ensures: consistent
  content, deterministic creation, no environmental dependencies, easy validation, and
  specification compliance (content about any topic). Content is 2-3 sentences (~100-150
  words) resulting in ~450-550 byte file. Prose will cover technical topic relevant to
  Sheep platform (software patterns, engineering practices, etc.).

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib | File I/O (read, write, validate) | **Use** | Standard library, modern API, supports encoding/newline control, used throughout codebase |
  | subprocess | Git command execution | **Use** | Standard library, structured error handling, check=True raises CalledProcessError, matches established pattern |
  | sys | Exit codes and stderr output | **Use** | Standard library, required for sys.exit() and file=sys.stderr |
  | os | Not needed | **Reject** | pathlib supersedes os.path, subprocess supersedes os.system() |
  | GitPython | Alternative git integration | **Reject** | External dependency, not used elsewhere in codebase, unnecessary complexity |
  | typing | Type hints | **Reject** | Optional; reference implementations (174, 175) do not use type hints, feature spec does not require |
  | logging | Structured logging | **Reject** | Not required by spec; features 174-189 use print() for output, simple approach sufficient |

  ## Security Considerations

  ### Encoding Validation (UTF-8)
  - **Risk:** File corruption if encoded as non-UTF-8 or with BOM
  - **Mitigation:** Explicit encoding='utf-8' parameter in write_text(); validate_file() checks for UTF-8 BOM before processing
  - **Impact:** Low risk; pathlib handles encoding reliably

  ### Line Ending Consistency (LF only)
  - **Risk:** CRLF line endings on Windows violates specification
  - **Mitigation:** Explicit newline='\n' parameter in write_text() forces LF on all platforms; validate_file() checks for CRLF
  - **Impact:** Low risk; pathlib handles platform differences transparently

  ### File Permission Handling
  - **Risk:** Created file has incorrect permissions (too permissive/restrictive)
  - **Mitigation:** pathlib.Path.write_text() creates file with default umask permissions (typically 0644 on Unix)
  - **Impact:** Low risk; default permissions acceptable for committed files in repository

  ### Git Command Injection
  - **Risk:** If filename or commit message came from untrusted input, could enable git command injection
  - **Mitigation:** Filename (test-08hm34.md) and commit message are hard-coded constants; subprocess.run() uses list (not shell=True)
  - **Impact:** Low risk; all inputs are programmer-controlled constants, not user input

  ### Temporary State During Operations
  - **Risk:** If script fails mid-workflow, file exists but not committed; repository left inconsistent
  - **Mitigation:** Fail-fast approach aborts immediately on validation failure; file not committed unless all validations pass
  - **Impact:** Low risk; repository state unchanged if validation or git operations fail

  ## Performance Implications

  ### File I/O Performance
  - **Current:** Single write operation (~450-550 bytes) completes instantly
  - **Optimization:** Not needed; operation well under NFR-1 (10 second limit)
  - **Impact:** Sub-second completion expected

  ### Validation Performance
  - **Current:** File validation involves: existence check, size check, binary read for encoding/line ending validation, text decode, line parsing, sentence counting
  - **Optimization:** All checks necessary per spec; combined overhead <100ms
  - **Impact:** Sub-second completion expected

  ### Git Operation Performance
  - **Current:** Three subprocess calls (git add, git commit, git push)
  - **Bottleneck:** git push to remote server is slowest operation (~1-3 seconds typical)
  - **Optimization:** No further optimization possible without external factors (network latency, server load)
  - **Impact:** Total operation typically 2-5 seconds, well under NFR-1 (10 second limit)

  ### Overall Performance
  - **Estimate:** Total execution time 2-5 seconds (dominated by git push network latency)
  - **Compliance:** Well within NFR-1 requirement (10 seconds)
  - **Profiling:** Not needed; operation inherently fast and limits are generous

  ## Architecture Notes

  ### Integration with Codebase Patterns

  This feature extends the established markdown file creation pattern validated across
  189+ prior features. Architecture aligns with:

  1. **Feature Numbering System:** Features 1-190 all follow same pattern (create test-*.md
     file with specific structure). Feature 190 is direct continuation (test-08hm34.md
     following test-ijl29t.md, test-u9soe6.md, etc.).

  2. **Python Implementation Pattern:** Features 174-189 all use Python scripts with:
     - pathlib for file operations
     - subprocess for git integration
     - Modular function architecture
     - Pre-commit validation
     - Fail-fast error handling

  3. **File Structure Convention:** All test-*.md files follow:
     - H1 heading (# Title) on line 1
     - Blank line on line 2
     - 2-3 sentences of prose content
     - Ends with newline character
     - Total file size 400-600 bytes

  4. **Validation Pattern:** All reference implementations include comprehensive
     validation before git operations:
     - File existence and size checks
     - Encoding validation (UTF-8 without BOM)
     - Line ending validation (LF only, no CRLF)
     - Markdown structure validation (H1 heading, blank line, prose)
     - Sentence count validation (2-3 sentences)

  5. **Git Workflow:** All implementations follow:
     - git add test-*.md (stage file)
     - git commit -m "feat(N): create markdown file test-*.md" (conventional commit format)
     - git push -u origin HEAD (push to remote with upstream tracking)

  ### Reusable Validation Logic

  The validate_file() function includes comprehensive checks that can be extracted
  and reused across markdown file creation scripts. Key validation checks:

  - File existence: if not file_path.exists()
  - File size: 400 <= file_size <= 600 bytes
  - UTF-8 BOM detection: if binary_content.startswith(b"\xef\xbb\xbf")
  - CRLF detection: if b"\r\n" in binary_content
  - H1 heading: if not content.startswith("# ")
  - Blank line: if not lines[1] == ""
  - Prose content: sentence count 2-3 via count(".")
  - Newline termination: if content.endswith("\n")

  This validation logic can be templated for features 191+ if needed.

  ### No Breaking Changes

  This feature introduces no changes to existing codebase. It:
  - Creates single new file (test-08hm34.md) at repository root
  - Does not modify any existing files or modules
  - Does not introduce new dependencies
  - Does not change any configuration or build processes
  - Follows established patterns from 189+ prior features

  Implementation is isolated to feature branch and will be merged via standard PR process.

  ---

  _Research phase completed — ready for implementation planning_
