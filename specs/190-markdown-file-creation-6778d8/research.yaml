decisions:
  - title: "File I/O Library Selection"
    chosen: "pathlib.Path with UTF-8 encoding parameter"
    rejected:
      - "os.path module — older API, requires manual encoding handling, less Pythonic"
      - "open() function — requires manual file handle management and encoding specification"
      - "Third-party file libraries — unnecessary external dependency for simple file creation"
    rationale: >
      pathlib.Path is the modern Python standard library choice for file operations.
      It provides: (1) clear, intuitive API via Path.write_text() and Path.read_bytes(),
      (2) automatic file handle management, (3) explicit encoding parameter (encoding="utf-8")
      to ensure UTF-8 without BOM, and (4) newline parameter control (newline="\n") to force
      Unix LF line endings on all platforms. Verified across 189+ prior features in codebase
      (features 174-189 all use pathlib). Eliminates need for manual file handle cleanup.

  - title: "Encoding and Line Ending Enforcement"
    chosen: "path.write_text(content, encoding='utf-8', newline='\\n')"
    rejected:
      - "path.write_bytes(content.encode('utf-8')) — manual encoding without newline control, platform-dependent line endings on Windows"
      - "open() with mode='w', encoding='utf-8' — manual file handle management, less convenient"
      - "Platform-specific handling — adds complexity, harder to maintain across environments"
    rationale: >
      pathlib.Path.write_text() with explicit encoding='utf-8' ensures UTF-8 without BOM
      (Python's UTF-8 encoder never adds BOM). The newline='\n' parameter forces Unix LF
      (0x0A) line endings on all platforms, preventing CRLF (0x0D 0x0A) on Windows.
      This approach is simpler and more reliable than manual byte encoding. Verified in
      feature 174 implementation and 170+ reference implementations. Python documentation
      confirms: "If newline='\n', text files are opened in universal newlines mode where
      Python handles line endings transparently, and write() interprets newline='\n' to
      produce LF only."

  - title: "Git Integration Method"
    chosen: "subprocess.run() with check=True for exception-based error handling"
    rejected:
      - "GitPython library — external dependency, adds complexity, not used elsewhere in project"
      - "os.system() — no error reporting, requires manual exit code checking, less Pythonic"
      - "Manual git command string parsing — fragile, no structured error handling"
    rationale: >
      subprocess.run() is part of Python standard library and already used throughout
      Sheep codebase. The check=True parameter raises subprocess.CalledProcessError on
      failure, enabling structured exception handling. This approach: (1) requires no
      external dependencies, (2) provides clear error reporting, (3) matches established
      pattern in features 174-189, and (4) supports complex git operations (git push -u
      origin HEAD). Alternative libraries add unnecessary complexity for simple command
      execution.

  - title: "Validation Execution Timing"
    chosen: "Pre-commit validation: validate file properties before git add/commit"
    rejected:
      - "Post-commit validation — if validation fails after commit, repository left in inconsistent state"
      - "No validation — violates requirement FR-12 (fail-fast on validation errors)"
      - "Lazy validation in background — defeats fail-fast principle, unclear success/failure"
    rationale: >
      Pre-commit validation (validate_file before git_add) ensures files meet all
      requirements before modifying git repository. This provides: (1) fail-fast semantics
      per FR-12, (2) repository consistency if validation fails, (3) clear success/failure
      signal to caller, and (4) matches pattern in features 174-189. Validations check:
      file exists, non-zero size, UTF-8 without BOM, no CRLF line endings, H1 heading
      present, blank line after heading, 2-3 sentences of prose, file size in 400-600
      byte range. All validation failures immediately raise ValueError before any git
      operations.

  - title: "Error Handling Strategy"
    chosen: "Fail immediately with descriptive error messages (no cleanup/retry)"
    rejected:
      - "Cleanup on failure — delete file if git commit fails; adds complexity, not required by spec"
      - "Retry with backoff — git operations should succeed consistently, retry adds timeout complexity"
      - "Silent error suppression — violates NFR-6 (clear, actionable error messages)"
    rationale: >
      Fail-fast approach is simplest and aligns with feature spec which states: 'abort
      with clear error message if any git operation fails; repository is left in whatever
      state it was before the script started.' This strategy: (1) matches established
      pattern in features 185-189, (2) keeps code simple and maintainable, (3) provides
      clear error signals, and (4) respects user's decision to run script again if needed.
      File won't be committed if validation or git operations fail, so cleanup unnecessary.

  - title: "Implementation Architecture"
    chosen: "Modular function-based design with main() orchestrator"
    rejected:
      - "Class-based approach — adds unnecessary abstraction for single-use workflow"
      - "Single monolithic function — harder to test, validate, and debug individual steps"
      - "Multiple scripts per phase — fragmentation, harder to coordinate, more complex error handling"
    rationale: >
      Modular functions (create_file, validate_file, git_add, git_commit, git_push) with
      main() orchestrator provides: (1) clear separation of concerns, (2) testability of
      individual steps, (3) reusability of validation logic, (4) readability via descriptive
      function names, and (5) matches established pattern in features 174-189. Main function
      catches exceptions at appropriate granularity (ValueError for validation, OSError for
      file I/O, CalledProcessError for git). Each function has clear contract: returns on
      success, raises specific exception on failure.

  - title: "File Existence Checking"
    chosen: "Check before creation with path.exists(); abort if file already exists"
    rejected:
      - "Overwrite existing file — violates requirement FR-11 (abort if file exists)"
      - "Use temporary file then rename — adds complexity, manual cleanup required on failure"
      - "No existence check — violates requirement FR-11, could corrupt existing file"
    rationale: >
      path.exists() check before creation provides: (1) compliance with FR-11 (abort if
      file exists), (2) simple implementation (one existence check), (3) clear error message
      (existing file detected), and (4) no unintended file overwrites. If file already
      exists, create_file() returns None and main() exits with error status, preventing
      any git operations. Matches pattern in features 174-189 which all include this check.

  - title: "Content Generation Strategy"
    chosen: "Hard-coded prose content in module-level constant matching established pattern"
    rejected:
      - "Random content generation — adds complexity, harder to validate reproducibility"
      - "Read content from stdin/file — adds I/O complexity, environmental dependencies"
      - "Generate from template — unnecessary abstraction for single file creation"
    rationale: >
      Hard-coded prose content (via TITLE and PROSE constants) matches established pattern
      in features 174-189. This approach: (1) ensures consistent, validated content, (2)
      makes file creation deterministic and reproducible, (3) avoids environmental
      dependencies, (4) simplifies validation (known content structure), and (5) aligns
      with feature spec which states 'content about any topic' (not specified by external
      source). Content is 2-3 sentences of ~100-150 words per spec (results in ~400-600 byte
      file per FR-7).

