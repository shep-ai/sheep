# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature implements markdown file creation following the established pattern
  validated across 189+ prior features (174-189). The implementation consists of:

  ### Design Pattern
  - **Modular functions**: Separate concerns into create_file, validate_file, git_add,
    git_commit, git_push, main orchestrator
  - **Pre-commit validation**: All file properties validated before any git operations
  - **Fail-fast error handling**: Abort immediately on any error with clear messages
  - **Subprocess for git**: Use subprocess.run() with check=True for exception-based
    error handling, matching established codebase patterns

  ### File Creation Strategy
  - Use pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\n'
  - This ensures: UTF-8 without BOM (Python's UTF-8 encoder never adds BOM)
  - Forces Unix LF (0x0A) on all platforms, preventing CRLF on Windows
  - Automatic file handle management (no manual cleanup needed)

  ### Validation Strategy
  - Pre-commit validation checks all file properties before git operations
  - Prevents invalid files from being committed
  - Checks: file exists, size 400-600 bytes, UTF-8 without BOM, no CRLF, H1 heading,
    blank line after heading, 2-3 sentences of prose, proper newline termination
  - Matches validation pattern from features 174-189

  ### Git Integration Strategy
  - Use subprocess.run() with command list (not shell=True) for security
  - check=True raises CalledProcessError on git command failure
  - Three operations: git add, git commit, git push (with -u origin HEAD)
  - Conventional commit message: "feat(190): create markdown file test-08hm34.md"
  - No cleanup or retry on failure (matches feature spec and prior pattern)

  ### Content Strategy
  - Hard-coded TITLE and PROSE constants matching established pattern
  - Content is technical prose about software engineering (aligns with Sheep platform)
  - 2-3 sentences (~100-150 words) resulting in ~450-550 byte file
  - Prose content about the importance of testing and reliability in software systems

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path
  **Selected**: pathlib.Path.write_text() with encoding and newline control
  **Rationale**: Modern Python standard library choice. Provides clear API, automatic
  file handle management, and explicit control over encoding and line endings. Used
  throughout features 174-189 in this codebase. The write_text(content, encoding='utf-8',
  newline='\n') signature directly addresses FR-4 (UTF-8 without BOM) and FR-5 (Unix LF).

  ### 2. Encoding and Line Ending Enforcement
  **Selected**: encoding='utf-8' parameter + newline='\n' parameter
  **Rationale**: pathlib.write_text() with encoding='utf-8' ensures UTF-8 (Python's
  UTF-8 encoder never adds BOM). The newline='\n' parameter forces Unix LF (0x0A)
  on all platforms, preventing CRLF on Windows. This directly satisfies FR-4 and FR-5.
  Verified in feature 174 and 170+ reference implementations.

  ### 3. Git Integration: subprocess.run()
  **Selected**: subprocess.run() with check=True for exception-based error handling
  **Rationale**: Part of Python standard library, already used throughout Sheep codebase.
  The check=True parameter raises CalledProcessError on failure, enabling clean
  exception handling. Uses command list (not shell=True) for security. Matches
  established pattern in features 174-189. No external dependencies.

  ### 4. Validation Timing: Pre-Commit
  **Selected**: Validate file properties before git add/commit/push
  **Rationale**: Pre-commit validation ensures files meet requirements before modifying
  repository. Provides fail-fast semantics per FR-12, prevents invalid files from being
  committed, maintains repository consistency. Matches pattern in features 174-189.

  ### 5. Error Handling: Fail Immediately
  **Selected**: Abort immediately with descriptive error message (no cleanup/retry)
  **Rationale**: Simplest approach matching feature spec and features 185-189. Repository
  state unchanged if validation or git operations fail before push completes. File won't
  be committed if validation fails, so cleanup unnecessary.

  ### 6. Implementation Architecture: Modular Functions
  **Selected**: Separate functions (create_file, validate_file, git_add, git_commit,
  git_push) with main() orchestrator
  **Rationale**: Provides clear separation of concerns, testability, reusability, and
  matches pattern in features 174-189. Each function has clear contract: returns on
  success, raises specific exception on failure.

  ### 7. File Existence Checking: Pre-Creation Check
  **Selected**: Check with path.exists() before creation; abort if file exists
  **Rationale**: Complies with FR-11 (abort if file exists). Simple implementation.
  Matches pattern in features 174-189.

  ### 8. Content Generation: Hard-Coded Constants
  **Selected**: Prose content defined in module-level TITLE and PROSE constants
  **Rationale**: Matches pattern in features 174-189. Ensures consistent, validated
  content. Deterministic and reproducible. Avoids environmental dependencies.

  ## Implementation Strategy

  The feature is implemented across three sequential phases:

  **Phase 1 (Setup)**: Create script skeleton with imports and content constants.
  This establishes the foundation for all subsequent work. No external dependencies
  beyond Python standard library. This phase is fast (~5-10 minutes).

  **Phase 2 (Core Logic)**: Implement file creation and validation functions.
  These are independent of git and can be tested in isolation. This phase includes
  comprehensive validation logic that prevents invalid files from being committed.
  Estimated ~30-40 minutes.

  **Phase 3 (Integration)**: Implement git operations and main orchestrator.
  Wire all components together with proper error handling. This phase glues everything
  together and enables end-to-end testing. Estimated ~30-40 minutes.

  Total estimated time: 1.5-2 hours (aligned with S feature estimate).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding incorrect (not UTF-8 or has BOM) | Use pathlib.write_text() with explicit encoding='utf-8' parameter; Python's UTF-8 encoder never adds BOM. Validate with validate_file() before commit. |
  | Line endings incorrect (CRLF instead of LF) | Use pathlib.write_text() with newline='\n' parameter which forces LF on all platforms. Validate with binary file read checking for b\"\\r\\n\". |
  | File not created or validation fails | Script exits with error before git operations; repository state unchanged. User can re-run script after fixing issue. |
  | Git operations fail (network, auth, permission) | subprocess.CalledProcessError caught and reported with clear error message. Repository state unchanged if operations fail before push completes. |
  | File already exists at script start | path.exists() check before creation prevents overwrite. Script aborts with clear error if file exists (FR-11). |
  | Validation too strict or too loose | Validation logic defined explicitly in validate_file() and tested before commit. Based on 189+ prior implementations proven to work. |
  | Script runs slowly | All operations inherently fast: file write (~1ms), validation (~50-100ms), git operations (~1-3s network latency). Well under NFR-1 (10 second limit). |

