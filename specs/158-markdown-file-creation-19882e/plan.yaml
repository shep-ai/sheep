content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-22
  - **Status:** Complete — ready for implementation

  ## Architecture Overview

  This feature is a simple, standalone file creation task following an established pattern with 150+ precedents in the repository (features 151-157 and earlier). The implementation does not integrate with the main Sheep platform code in `src/sheep/`; rather, it demonstrates the platform's ability to execute straightforward, templated file creation workflows.

  **Key Characteristics:**
  - Single file creation at repository root (no directory structure changes)
  - No source code modifications (file creation only)
  - No external dependencies beyond Python 3.11+ standard library and git
  - Deterministic execution (no randomness, no API calls)
  - Conventional git workflow (add → commit → push)

  **Integration Points:**
  - Executed within the Sheep platform's task automation
  - Results in one committed markdown file in repository root
  - Feature branch `feat/158-markdown-file-creation-19882e` already created
  - No modifications to configuration, source code, or other tracked files

  ## Key Design Decisions

  ### 1. File Creation Method: Python pathlib.Path

  **Decision:** Use `pathlib.Path('test-p2qj1z.md').write_text(content, encoding='utf-8')`

  **Rationale:**
  - Modern Python 3.11+ standard library approach (no external dependencies)
  - Automatically handles UTF-8 encoding (matches FR-5 requirement)
  - Simple, clean single-line API vs. open/write/close pattern
  - Cross-platform file operations (Windows/Linux/macOS)
  - Explicit technology choice in feature spec
  - Successfully used in all 150+ precedent markdown file features

  **Alternatives Rejected:**
  - `open()` function — older style, requires manual file handle management
  - `os.write()` — lower-level, requires manual byte encoding
  - Template engines — over-engineered for 2-3 sentence paragraph

  ### 2. Content Generation: Hard-Coded Prose

  **Decision:** Write 2-3 sentences directly as hard-coded strings in implementation code

  **Rationale:**
  - Ensures 100% grammatical correctness (NFR-2 requirement)
  - Zero external dependencies (NFR-4 requirement: standard library only)
  - Deterministic: identical file created every execution (no randomness)
  - Matches all 150+ existing test files (established precedent)
  - Topic is free-form/arbitrary (NFR-7: "about anything" permitted)
  - Simple and efficient for small prose blocks

  **Alternatives Rejected:**
  - LLM API calls (OpenAI, Anthropic) — violates NFR-4, adds dependency and latency
  - Random text generators — violates NFR-2 (coherent prose requirement)
  - Template files — unnecessary file I/O and parsing complexity
  - Environment variables — adds configuration fragility

  **Content Quality:**
  - Exactly 2-3 complete, grammatically correct sentences
  - Thematic coherence (sentences related to shared topic)
  - File size falls within 300-600 byte target range (typical prose paragraph)
  - Topic: arbitrary (free-form selection permitted by spec)

  ### 3. File Validation Strategy

  **Decision:** Validate created file against all functional requirements BEFORE git operations

  **Validation Checklist:**
  - File exists at expected path (`test-p2qj1z.md`)
  - File size in range 300-600 bytes (NFR-1)
  - First line is H1 heading (starts with `# `)
  - Second line is blank
  - Lines 3+ contain exactly 2-3 sentences
  - File encodes as valid UTF-8 without BOM (FR-5)
  - File ends with LF, not CRLF (FR-6)

  **Rationale:**
  - Catches format errors early, before committing to git
  - Ensures all 10 functional requirements (FR-1 through FR-10) are met
  - Low overhead: validation completes in < 1 millisecond
  - Prevents commits of non-compliant files

  **Alternatives Rejected:**
  - Skip validation — risky, could commit incorrectly formatted files
  - Post-commit validation — too late to fix, creates bad commits

  ### 4. Git Integration: subprocess CLI Calls

  **Decision:** Use Python `subprocess` module to call `git add`, `git commit`, `git push`

  **Implementation:**
  ```python
  import subprocess

  # Stage file
  subprocess.run(['git', 'add', 'test-p2qj1z.md'], check=True)

  # Commit with conventional message
  msg = "feat(158): Create markdown file test-p2qj1z.md with prose content"
  subprocess.run(['git', 'commit', '-m', msg], check=True)

  # Push to feature branch
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  **Rationale:**
  - subprocess is Python standard library (zero external dependencies)
  - Git is already configured in repository (feature branch exists)
  - Simple commands are straightforward to invoke
  - Matches successful implementation pattern from features 151-157
  - `check=True` ensures failure is caught immediately
  - No injection risk: command arguments are string literals

  **Alternatives Rejected:**
  - GitPython library — external dependency violates NFR-4
  - Paramiko/SSH — unnecessary network abstraction for local operations
  - Manual git object manipulation — extremely complex, unmaintainable

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1: File Creation** comes first
     - Creates the actual deliverable (test-p2qj1z.md)
     - All subsequent phases depend on file existing
     - Straightforward pathlib operation, lowest risk

  2. **Phase 2: Validation** follows file creation
     - Validates created file meets all requirements
     - Provides early error detection before git operations
     - Allows graceful failure without polluting git history

  3. **Phase 3: Git Integration** comes last
     - Only commits file after validation passes
     - Ensures repository contains only compliant files
     - Follows established git workflow (add → commit → push)

  **Execution Flow:**
  1. Define prose content (hard-coded 2-3 sentences)
  2. Create file using pathlib with UTF-8 encoding
  3. Validate file structure, size, encoding, line endings
  4. If validation passes: stage, commit, and push file to feature branch
  5. If validation fails: report error and stop (do not commit)

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File already exists | Overwrites existing file, potential data loss | Check file doesn't exist before writing; fail gracefully if present |
  | Git push fails | Commit created but not pushed, feature branch out of sync | Verify feature branch exists, validate git config before pushing; ensure remote tracking is correct |
  | Encoding/line-ending issues | File doesn't meet FR-5/FR-6, breaks precedent | Validate encoding/line-endings explicitly before committing to git |
  | File size out of range | Violates NFR-1 (300-600 bytes) | Include size check in validation; use appropriately sized prose |
  | Invalid prose content | Violates NFR-2 (grammatically correct), breaks pattern | Hard-code prose (no generation), verify manually before implementation |
  | Git config missing | commit/push fails (user.name/user.email not set) | Validate git config is present; fail with clear diagnostic |

  ## Summary

  This feature is straightforward to implement using Python's standard library (pathlib, subprocess) and hard-coded prose content. The approach is deterministic, has zero external dependencies, and follows the established pattern from 150+ preceding test features.

  **Implementation will be minimal:**
  - ~20 lines of Python code (file creation, validation, git operations)
  - No external packages, no configuration files, no source code modifications
  - Estimated execution time: 10-15 minutes (matches spec size estimate)

  **Quality assurance:**
  - All 10 functional requirements explicitly validated
  - File format verified before git commit
  - Hard-coded content ensures coherence and determinism
  - Conventional commit message enforced

