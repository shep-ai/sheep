content: |
  ## Architecture Overview

  Feature 131 is a minimal file creation task that integrates seamlessly with the Sheep platform's
  established patterns. No architectural changes are needed; the feature uses only standard Python
  library capabilities (pathlib, subprocess) and git commands that are guaranteed to be available.

  The implementation follows the proven pattern from features 125-130:
  - **Python-based file creation** using pathlib for cross-platform compatibility
  - **Hardcoded, deterministic content** describing the platform's validation purpose
  - **Standard git workflow** (add, commit, push) via subprocess
  - **No external dependencies** beyond Python 3.6+ and git

  The file structure mirrors existing test-*.md files (test-laceiq.md, test-3pz04c.md):
  ```
  # Sheep Platform Validation Test

  <3 sentences of coherent prose>
  ```

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path vs open()

  **Chosen:** `pathlib.Path` for file creation and writing

  **Rationale:**
  - Built into Python standard library (no external dependencies, satisfies NFR-6)
  - Modern, object-oriented API with explicit encoding control
  - Cross-platform path handling (Windows, Linux, macOS)
  - `newline="\n"` parameter ensures LF-only line endings on all platforms
  - Cleaner syntax than traditional `open()` for simple write operations

  **Example implementation:**
  ```python
  from pathlib import Path
  Path("test-qoqhm7.md").write_text(content, encoding="utf-8", newline="\n")
  ```

  ### 2. Encoding & Line Endings: UTF-8 + LF

  **Chosen:** UTF-8 encoding with UNIX line endings (LF, never CRLF)

  **Rationale:**
  - Explicitly required by FR-6 and NFR-2
  - UTF-8 is the universal markdown standard
  - LF is the git standard, ensuring cross-platform consistency
  - Python's text mode with `newline="\n"` provides explicit control

  ### 3. Content Generation: Hardcoded Procedural

  **Chosen:** Hardcoded, semantically coherent prose about Sheep platform validation

  **Rationale:**
  - Resolved in spec's openQuestion #1: content should describe Sheep platform testing validation
  - No external dependencies (no LLM APIs, no templates, no file I/O beyond write)
  - Deterministic and reproducible across all invocations
  - Satisfies NFR-4 (semantic coherence) and NFR-6 (existing capabilities only)
  - Provides meaningful documentation value (self-documenting validation artifact)

  **Content Framework (3 sentences):**
  1. What is being tested (Sheep platform's file creation and git automation capabilities)
  2. Why this matters (validation of platform reliability)
  3. Context (part of test series 125-131, demonstrates reproducible execution)

  ### 4. Git Operations: subprocess + Standard CLI

  **Chosen:** Use Python's subprocess module to invoke git commands directly

  **Rationale:**
  - Git is guaranteed to be available (Sheep is a git-based platform)
  - No external Python dependencies (rejected GitPython, plumbum)
  - Subprocess with explicit argument list prevents command injection
  - Matches existing Sheep platform patterns for git integration
  - Simple, well-tested commands: `git add`, `git commit`, `git push`

  ### 5. Markdown Format: Blank Line + H1 + Prose

  **Chosen:** H1 heading, blank line, 3 sentences of prose (established pattern)

  **Rationale:**
  - FR-3 explicitly requires blank line between H1 and content
  - Follows markdown best practices for document structure
  - Consistent with features 125-130 (NFR-3: established patterns)
  - Produces clean, readable output when rendered
  - H1 title is descriptive (Sheep Platform Validation Test) for documentation value

  ## Implementation Strategy

  ### Phase 1: File Creation & Validation
  Create test-qoqhm7.md with proper markdown structure. The file will be generated with:
  - Clear, descriptive H1 title related to Sheep platform validation
  - Blank line immediately after heading
  - 3 complete sentences of coherent prose (maximal within 2-3 requirement)
  - Explicit UTF-8 encoding
  - UNIX line endings (LF only, never CRLF)

  Implementation uses pathlib to write the file in a single operation, with encoding and
  newline parameters enforced. Validation checks ensure the file meets all format requirements
  before proceeding to git operations.

  ### Phase 2: Git Integration
  Stage the file with `git add`, create a conventional commit with message
  "feat(131): Create markdown file test-qoqhm7.md", and push to the feature branch.
  This follows the standard Sheep workflow and enables CI/CD validation.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists | Feature is designed for first-time creation; if re-run, pathlib will overwrite (acceptable for test feature). No blocker. |
  | Git credentials not configured | Assumed pre-configured by Sheep platform setup. If missing, git push will fail with clear error message. |
  | Encoding/line ending issues on Windows | Explicit `encoding="utf-8"` and `newline="\n"` parameters enforce consistency across all platforms. |
  | Subprocess command fails | Using `check=True` will raise exception, which propagates to test framework (appropriate per NFR-7: let failures be visible). |
  | File format deviates from established pattern | Validation checks compare to requirements before commit. Manual inspection can compare to test-laceiq.md and test-3pz04c.md for format verification. |
  | Git push to wrong branch | Feature branch (feat/131-test-markdown-file-4fbf8b) is assumed already checked out. If not, push will fail with clear error. |

  ## Validation Approach

  After file creation, validation checks will verify:
  1. File exists at test-qoqhm7.md
  2. First non-empty line matches `^# ` (H1 heading)
  3. Second line is empty (blank line separator)
  4. Remaining content has exactly 3 complete sentences
  5. File is valid UTF-8 (decodes without errors)
  6. File contains only LF line endings (no CRLF)
  7. Markdown syntax is valid (H1 heading, prose readable)

  These checks ensure compliance with all functional and non-functional requirements before
  proceeding to git operations.
