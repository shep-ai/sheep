content: |
  ## Summary

  Feature 131 implementation comprises 3 concrete tasks across 2 phases:

  **Phase 1: File Creation & Validation** — Create test-qoqhm7.md with proper markdown structure
  (Task 1) and validate it meets all format requirements (Task 2). The file is created using Python's
  pathlib with explicit UTF-8 encoding and LF line endings. Content is hardcoded prose describing
  Sheep platform validation, ensuring no external dependencies and deterministic output. Validation
  checks verify H1 heading, blank line separator, exactly 3 sentences, UTF-8 encoding, and UNIX
  line endings before proceeding to git operations.

  **Phase 2: Git Integration** — Stage the file, create a conventional commit with message
  "feat(131): Create markdown file test-qoqhm7.md", and push to the remote feature branch
  (Task 3). Git operations use subprocess to invoke standard CLI commands (add, commit, push).

  Each task follows TDD discipline: tests assert desired behavior (RED), minimal implementation
  satisfies those tests (GREEN), and cleanup/verification ensures quality (REFACTOR). Total
  estimated effort is 1 hour. The implementation reuses proven patterns from features 125-130,
  requiring no architectural changes or external dependencies beyond Python 3.6+ and git.

  ## Task Dependencies

  ```
  Task 1 (Create file)
      ↓
  Task 2 (Validate file)
      ↓
  Task 3 (Git operations)
  ```

  Task 2 depends on Task 1 to have a file to validate. Task 3 depends on Task 2 to ensure
  the file is correctly formatted before committing. All other dependencies are satisfied
  by the Sheep platform environment (git, Python, SSH/HTTPS credentials).

  ## Implementation Notes

  - **Content generation:** Use hardcoded prose (no LLM APIs, no templates) to satisfy
    NFR-6 (existing capabilities only). Content describes Sheep platform validation,
    addressing spec's resolved openQuestion #1.

  - **File I/O:** pathlib.Path is cleaner and more portable than open(). Explicit
    encoding="utf-8" and newline="\n" parameters ensure consistent output across
    Windows, Linux, and macOS.

  - **Git operations:** Use subprocess with explicit argument list (not shell=True)
    to prevent command injection. check=True raises exceptions on non-zero exit codes,
    making failures immediately visible (appropriate per NFR-7).

  - **Validation:** Tests verify file format before git operations, catching issues
    early. Validation includes format checks, encoding verification, and comparison
    to established patterns from features 125-130.

  - **Effort estimates:** Based on similar features (125-130) which follow identical
    pattern. File creation ~30min, validation ~15min, git operations ~15min = 1 hour total.
