content: |
  ## Problem Statement

  Create a single markdown file named test-qoqhm7.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (131) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Success Criteria

  - [ ] File "test-qoqhm7.md" is created in the repository root directory
  - [ ] File contains valid markdown syntax with no formatting errors
  - [ ] File includes an H1 heading (prefixed with `# `) as the first element
  - [ ] H1 heading is followed by a blank line (per formatting decision)
  - [ ] File contains exactly 2-3 complete, coherent sentences of prose content
  - [ ] Prose content describes the Sheep platform testing validation purpose (per product decision)
  - [ ] File is encoded as UTF-8 with UNIX line endings (LF)
  - [ ] File is committed with conventional commit message: "feat(131): Create markdown file test-qoqhm7.md"
  - [ ] Changes are pushed to feature branch (feat/131-test-markdown-file-4fbf8b)
  - [ ] No errors or warnings during file creation or git operations
  - [ ] File structure and formatting are consistent with existing test-*.md files (125-130)

  ## Functional Requirements

  - **FR-1**: System must create a new file named exactly "test-qoqhm7.md" in the repository root directory
  - **FR-2**: File must contain an H1 markdown heading (prefixed with `# `) as the first line of content
  - **FR-3**: There must be a blank line between the H1 heading and the prose content
  - **FR-4**: File must contain exactly 2-3 complete sentences describing the Sheep platform testing validation purpose
  - **FR-5**: All content must use valid markdown syntax with no broken formatting
  - **FR-6**: File must use UTF-8 encoding with UNIX line endings (LF, not CRLF)
  - **FR-7**: System must stage the file to git using `git add test-qoqhm7.md`
  - **FR-8**: System must create a git commit with message: "feat(131): Create markdown file test-qoqhm7.md"
  - **FR-9**: System must push the commit to the remote feature branch (feat/131-test-markdown-file-4fbf8b)

  ## Non-Functional Requirements

  - **NFR-1**: File creation and git operations must complete without errors or exceptions
  - **NFR-2**: File must be immediately readable as valid UTF-8 encoded markdown
  - **NFR-3**: Markdown formatting must be consistent with existing test-*.md files in the repository (established pattern from features 125-130)
  - **NFR-4**: Prose content must be semantically coherent and avoid placeholder/Lorem Ipsum style text
  - **NFR-5**: Git commit message must follow conventional commit standards (feat(#): description)
  - **NFR-6**: Implementation must use only existing Sheep platform capabilities (no new dependencies)
  - **NFR-7**: Implementation must be completable in a single commit with minimal complexity

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the prose content describe? | Sheep platform testing validation | Aligns with feature purpose, provides meaningful documentation, avoids placeholder text, maintains consistency with similar test features (125-130) |
  | 2 | Should there be a blank line between H1 heading and prose? | Yes, include blank line | Follows markdown best practices, improves readability, consistent with professional conventions referenced in NFR-3 |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root directory**: Contains the main README.md, 100+ test markdown files (test-*.md pattern), state machine diagrams, and Python utility scripts for feature creation
  - **specs/**: Contains 130+ feature specifications in YAML format, organized by feature number (specs/001-*, specs/002-*, ... specs/131-*)
  - **src/sheep/**: Core platform code with agents, flows, configuration, and tools (not present in this worktree, but referenced in README)
  - **.github/workflows/**: CI/CD pipelines (ci.yml with dummy build and test steps)
  - **Dockerfile**: Container definition for the platform
  - **.claude/**: Claude Code configuration directory

  The repository follows a spec-first development model where each feature is defined in a YAML specification file before implementation begins.

  ### Architecture Patterns

  1. **Spec-First Development**: Features are defined in `specs/{number}-{name}/spec.yaml` before implementation
  2. **Modular Agent Architecture**: The Sheep platform uses specialized agents for distinct phases (Research, Implementation, Review)
  3. **Git Workflow**: All changes follow conventional commits (feat(#): description) and are pushed to feature branches
  4. **Test-Driven Approach**: Features 125-131 are identical file creation tasks used to validate platform reliability

  ### Relevant Technologies

  - **Python**: File I/O and utility scripting (pathlib, built-in file operations)
  - **Git**: Version control, branching, committing, and pushing
  - **Markdown**: Simple structured text format for documentation
  - **GitHub Actions**: CI/CD automation (though minimal in this test repository)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-qoqhm7.md) will be created in the repository root, following the pattern of 130+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | specs/131-test-markdown-file-4fbf8b/spec.yaml | Low | This specification file documents the feature requirements and should be completed during analysis phase |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git commands (add, commit, push)
  4. **Content Generation** - Can use simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-130, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 6+ times in preceding features (125-130)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-130) were completed in a single commit with minimal complexity
