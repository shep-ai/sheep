# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 263 implementation is a single, focused task that creates a thin orchestration layer following the proven pattern from feature_262. The task wraps the complete five-step workflow (generate → write → validate → commit → push) using existing utilities from content_generators.py.

  The TDD cycle is straightforward:
  1. **RED phase**: Write comprehensive tests asserting all success criteria (file existence, markdown structure, encoding, line endings, git operations, idempotency)
  2. **GREEN phase**: Implement minimal code that orchestrates 5 existing utility functions in sequence, returns result dict, and includes basic error handling
  3. **REFACTOR phase**: Add detailed docstrings, comprehensive logging at each operation, enhanced error handling with context, and __main__ block for standalone execution

  The implementation is ~100 lines (matching feature_262 size). No additional tests, no modifications to existing files, no new dependencies. Total estimated effort: 1 hour.

  Key implementation points:
  - Follow feature_262 module structure exactly
  - Reuse all utilities from content_generators.py (no reimplementation)
  - Use get_logger() for structured logging throughout
  - Ensure error messages include operation context for debugging
  - Verify idempotent behavior (running twice produces identical file)
  - Add standalone __main__ block for direct script execution
