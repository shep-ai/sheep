content: |
  ## Problem Statement

  The user wants a single markdown file named test-47n79i.md created in the repository root. The file
  should contain an H1 markdown heading (title) and 2-3 sentences of prose content. This is part of a
  series of 263 similar markdown file creation features that test the platform's ability to automate
  content creation and git workflows.

  This feature leverages fully mature infrastructure (content generation utilities, LLM integration, git
  tooling) established through 262 preceding identical features. The implementation is straightforward
  orchestration of existing components with no new code patterns or infrastructure required.

  ## Success Criteria

  - [ ] File named test-47n79i.md created in repository root
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains exactly 2-3 sentences of coherent prose content
  - [ ] Markdown validation passes all checks
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings
  - [ ] File ends with trailing newline (POSIX convention)
  - [ ] File is staged, committed, and pushed to remote branch
  - [ ] Commit message follows format: feat(263): create markdown file test-47n79i.md with prose content
  - [ ] No existing files are modified
  - [ ] Implementation follows established pattern from feature_262 and preceding features

  ## Functional Requirements

  - **FR-1: Content Generation** — Generate markdown content via CrewAI/Claude with H1 heading as title, following established content generation patterns
  - **FR-2: Prose Content** — Generate exactly 2-3 sentences of coherent, grammatically correct prose
  - **FR-3: File Creation** — Create single markdown file at repository root with exact name test-47n79i.md
  - **FR-4: Encoding** — Use UTF-8 encoding without BOM for all file operations
  - **FR-5: Line Endings** — Use Unix LF line endings throughout file
  - **FR-6: File Format** — Include trailing newline to conform to POSIX conventions
  - **FR-7: Validation** — Validate markdown structure before committing (heading present, sentence count, formatting)
  - **FR-8: Git Operations** — Stage, commit, and push file to remote branch with conventional commit message
  - **FR-9: Isolation** — Do not read, modify, or delete any existing files in the repository
  - **FR-10: Conventional Commits** — Use format "feat(263): create markdown file test-47n79i.md with prose content"

  ## Non-Functional Requirements

  - **NFR-1: Performance** — Complete entire workflow (generation, validation, git operations) within 5 minutes
  - **NFR-2: Reliability** — LLM content generation should succeed on first attempt with >95% success rate
  - **NFR-3: Consistency** — Implementation must follow established patterns from feature_262 and all preceding markdown creation features
  - **NFR-4: Maintainability** — Reuse existing utilities from content_generators.py for all file operations (no code duplication)
  - **NFR-5: Observability** — Log all key operations (generation start, validation results, git operations) for tracing and debugging
  - **NFR-6: Code Quality** — Follow project conventions, existing code style, and patterns already established in src/sheep/features/

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content generation use LLM or static templates? | LLM-based generation | Maintains consistency with 262+ preceding features, ensures unique/coherent content, leverages existing infrastructure |
  | 2 | Should validation be strict or lenient? | Strict validation | Maintains quality consistency, prevents formatting edge cases, aligns with existing validate_markdown_file() utility |
  | 3 | If file exists, overwrite, skip, or error? | Overwrite existing file | Ensures idempotent/deterministic behavior, consistent with previous features, ensures latest content deployed |

  ## Codebase Analysis

  ### Project Structure

  The codebase is organized as follows:

  - **src/sheep/** - Main Python package containing the platform logic
    - **agents/** - CrewAI agent definitions (code_agents.py, general_agents.py)
    - **config/** - Configuration management (settings.py, llm.py)
    - **flows/** - Flow definitions for orchestrating agent tasks
    - **tools/** - Tool implementations for git, file, and web operations
    - **features/** - Feature implementations (262+ markdown file creation variants, e.g., feature_262_markdown_file_creation.py)
    - **content_generators.py** - Reusable utilities for markdown generation, validation, writing, committing, and pushing
    - **observability/** - Logging and Langfuse tracing integration
    - **cli.py** - Command-line interface entry point

  - **specs/** - Feature specifications with YAML specs and research/planning documents for each feature

  - **Root directory** - Contains many generated markdown files (test-*.md) from previous 262+ features

  ### Architecture Patterns

  1. **Modular Content Generation**: The project uses centralized utility functions in `content_generators.py`
     for markdown creation tasks. These utilities handle:
     - LLM-based content generation via Claude API (generate_markdown_content)
     - File writing with proper encoding (UTF-8) and line endings (Unix LF)
     - Markdown validation (H1 heading, sentence count, formatting)
     - Git operations (commit with conventional messages, push)

  2. **Established Workflow**: All 262+ markdown file creation features follow this identical workflow:
     1. Generate markdown content with H1 heading + 2-3 sentences
     2. Write file to repository root
     3. Validate markdown structure and content
     4. Stage and commit with conventional commit message
     5. Push to remote branch

  3. **LLM Integration**: Uses CrewAI's LLM framework (`get_reasoning_llm()`) to generate coherent prose
     via Claude API. The generation is templated with specific requirements for format and structure.

  4. **Separation of Concerns**: Feature implementations (in src/sheep/features/) are thin wrappers that
     orchestrate predefined utilities. Git operations are abstracted via GitPushTool and GitCommitTool.

  ### Relevant Technologies

  - **CrewAI**: Multi-agent framework for orchestrating LLM-based workflows
  - **Python 3.11+**: Language for implementation and tooling (from pyproject.toml)
  - **GitPython**: Library for git operations (via wrapper tools)
  - **Pydantic**: Configuration and data validation
  - **Markdown**: Content format for generated files
  - **Langfuse**: Observability and tracing for execution monitoring
  - **Claude API**: LLM for content generation (accessed via get_reasoning_llm)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Add feature_263_markdown_file_creation.py following established pattern from feature_262 and others |
  | Repository root | Low | Create single markdown file (test-47n79i.md) with ~250-400 bytes of content |
  | Git operations | Low | Stage, commit, and push file as part of standard workflow (no branch creation needed, branch already exists) |

  ## Dependencies

  - **src/sheep/content_generators.py**: Provides reusable utilities:
    - `generate_markdown_content()` - LLM-based content generation
    - `write_markdown_file()` - File writing with proper encoding
    - `validate_markdown_file()` - Format validation
    - `commit_markdown_file()` - Git commit operations
    - `push_markdown_file()` - Git push operations

  - **src/sheep/config/llm.py**: Provides `get_reasoning_llm()` for Claude API access

  - **src/sheep/observability/logging.py**: Provides logger for structured logging

  - **GitPython**: Underlying library for git operations (wrapped by content_generators)

  - **CrewAI**: LLM framework for content generation (wrapped by get_reasoning_llm)

  ## Size Estimate

  **S** — This is a trivial, single-file creation task with no code changes, no tests, and no integration
  required. The entire workflow (content generation, file writing, validation, git operations) can be
  completed in under 1 hour by following the established pattern from 262 preceding identical features.
  The infrastructure and helper utilities are fully in place; implementation is straightforward orchestration
  of existing components.
