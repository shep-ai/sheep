content: |
  ## Problem Statement

  The user requires creation of a single markdown file named test-47n79i.md in the repository root. The file
  must contain an H1 markdown heading (title) followed by 2-3 sentences of coherent prose content. This feature
  is part of a continuous series of 263 similar markdown file creation features that validate the platform's
  ability to automate content generation, file management, and git workflows at scale.

  The implementation leverages fully mature infrastructure (content generation utilities, LLM integration,
  git tooling) established through 262 preceding identical features. No new code patterns, infrastructure,
  or architectural changes are required. The feature is straightforward orchestration of existing components
  following the proven workflow pattern from feature_262 and all preceding features.

  ## Success Criteria

  - [ ] File named test-47n79i.md created in repository root
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains exactly 2-3 sentences of coherent prose content
  - [ ] Markdown structure validation passes (heading present, sentence count accurate)
  - [ ] File uses UTF-8 encoding without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\\n) throughout, no CRLF or CR
  - [ ] File ends with trailing newline (POSIX convention compliance)
  - [ ] File is staged to git index, committed, and pushed to remote branch
  - [ ] Commit message exactly matches format: \"feat(263): Create markdown file test-47n79i.md with prose content\"
  - [ ] No existing files are read, modified, or deleted during execution
  - [ ] Implementation follows established pattern from feature_262 and preceding features
  - [ ] Generated prose is grammatically correct and coherent
  - [ ] File size is reasonable (200-400 bytes target range)

  ## Functional Requirements

  - **FR-1: Content Generation** — Generate markdown content via CrewAI/Claude API with H1 heading as title and 2-3 sentences of prose, following established content generation patterns from preceding features
  - **FR-2: Prose Quality** — Ensure generated prose is coherent, grammatically correct, and contextually sensible (not random or nonsensical)
  - **FR-3: File Creation** — Create single markdown file at repository root with exact filename test-47n79i.md
  - **FR-4: Encoding** — Use UTF-8 encoding without BOM (Byte Order Mark) for all file write operations
  - **FR-5: Line Endings** — Use Unix LF (\\n) line endings throughout file; no CRLF or CR line endings
  - **FR-6: POSIX Compliance** — Include trailing newline character at end of file to conform to POSIX conventions
  - **FR-7: Markdown Validation** — Validate markdown structure before committing: verify H1 heading present, sentence count is exactly 2-3, formatting is valid
  - **FR-8: Git Staging** — Stage file to git index using git add operation
  - **FR-9: Git Commit** — Commit file with conventional commit message format: \"feat(263): Create markdown file test-47n79i.md with prose content\"
  - **FR-10: Git Push** — Push committed file to remote branch using git push
  - **FR-11: Isolation** — Do not read, modify, delete, or otherwise interact with any existing files in the repository except the target test-47n79i.md file
  - **FR-12: Idempotency** — If test-47n79i.md already exists, overwrite with newly generated content to ensure deterministic behavior

  ## Non-Functional Requirements

  - **NFR-1: Performance** — Complete entire workflow (content generation, file writing, validation, git operations) within 5 minutes
  - **NFR-2: Reliability** — LLM content generation must succeed on first attempt with >95% success rate
  - **NFR-3: Consistency** — Implementation must follow established patterns from feature_262 and all preceding markdown creation features (no deviations or custom logic)
  - **NFR-4: Maintainability** — Reuse existing utilities from content_generators.py for all file operations (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file); no code duplication
  - **NFR-5: Observability** — Log all key operations (generation start, validation results, git operations) using project logging infrastructure for tracing and debugging
  - **NFR-6: Code Quality** — Follow project conventions, existing code style, and patterns already established in src/sheep/features/; maintain consistency with feature_262 implementation
  - **NFR-7: Error Handling** — Gracefully handle and report errors from LLM generation, file I/O, or git operations with clear error messages

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Add feature_263_markdown_file_creation.py following established pattern from feature_262 and others |
  | Repository root | Low | Create single markdown file (test-47n79i.md) with ~250-400 bytes of content |
  | Git operations | Low | Stage, commit, and push file as part of standard workflow (no branch creation needed, branch already exists) |

  ## Dependencies

  - **src/sheep/content_generators.py**: Provides reusable utilities:
    - `generate_markdown_content()` - LLM-based content generation via Claude API
    - `write_markdown_file()` - File writing with UTF-8 encoding and Unix LF line endings
    - `validate_markdown_file()` - Markdown structure validation (H1 heading, sentence count, formatting)
    - `commit_markdown_file()` - Git commit operations with conventional message format
    - `push_markdown_file()` - Git push operations to remote branch

  - **src/sheep/config/llm.py**: Provides `get_reasoning_llm()` for Claude API access and LLM configuration

  - **src/sheep/observability/logging.py**: Provides structured logger for operation tracing and debugging

  - **GitPython**: Underlying library for git operations (wrapped by content_generators utilities)

  - **CrewAI**: LLM framework for content generation orchestration (wrapped by get_reasoning_llm)

  ## Implementation Notes

  1. **Workflow Pattern**: Follow the proven five-step workflow from feature_262:
     1. Generate markdown content with H1 heading + 2-3 sentences via CrewAI/Claude
     2. Write file to repository root with UTF-8 encoding, no BOM, Unix LF line endings
     3. Validate markdown structure (heading present, sentence count, formatting valid)
     4. Stage and commit file with conventional commit message format
     5. Push to remote branch

  2. **Code Location**: Create src/sheep/features/feature_263_markdown_file_creation.py with thin wrapper that orchestrates content_generators utilities

  3. **Error Scenarios**: Handle gracefully:
     - LLM generation timeout or failure: retry or report clear error
     - File write permission error: report error with path
     - Git operations failure: report error with git output

  4. **Testing Strategy**: Verify:
     - File exists at repository root with correct name
     - File content contains valid H1 heading and 2-3 sentences
     - File encoding is UTF-8 without BOM
     - File line endings are Unix LF
     - File has trailing newline
     - Git commit and push succeed

  ## Size Estimate

  **S** — This is a trivial, single-file creation task with no code changes to existing files, no tests, and no integration required. The entire workflow (content generation, file writing, validation, git operations) can be
  completed in under 1 hour by following the established pattern from 262 preceding identical features.
  The infrastructure and helper utilities are fully in place; implementation is straightforward orchestration
  of existing components.
