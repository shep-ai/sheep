content: |
  ## Architecture Overview

  Feature 263 integrates seamlessly into the existing Sheep architecture as a thin orchestration layer at the Features level. The implementation follows the exact pattern from feature_262 (immediately preceding feature with identical structure):

  1. **Features Layer**: `feature_263_markdown_file_creation.py` provides `create_feature_263_markdown_file()` function
  2. **Content Generators Layer**: Reuses 5 mature utilities from `src/sheep/content_generators.py`:
     - `generate_markdown_content()` — LLM-based prose generation via Claude API
     - `write_markdown_file()` — File creation with UTF-8 encoding, no BOM, Unix LF line endings
     - `validate_markdown_file()` — Strict markdown validation (H1 heading, 2-3 sentences)
     - `commit_markdown_file()` — Git commit with conventional message format
     - `push_markdown_file()` — Git push to remote branch

  3. **Config/Infrastructure**: Reuses existing services:
     - `src/sheep/config/llm.py`: `get_reasoning_llm()` for Claude API access (CrewAI wrapper)
     - `src/sheep/observability/logging.py`: `get_logger()` for structured logging

  No changes to lower layers needed. Implementation is purely orchestration of existing, proven components.

  ## Key Design Decisions

  ### 1. Content Generation Method: LLM-Based (via Claude API)
  **Chosen**: LLM-based generation via Claude API using CrewAI wrapper
  **Rationale**: LLM-based generation is proven across 262+ preceding features, ensures unique and coherent prose, leverages existing mature infrastructure (`get_reasoning_llm()`), and maintains consistency with project patterns. Temperature 0.2 ensures deterministic outputs. Latency of 2-5 seconds is well within the 5-minute total requirement.

  ### 2. File Writing: Python Standard Library
  **Chosen**: `pathlib.Path` + `open()` with UTF-8 encoding
  **Rationale**: The existing `write_markdown_file()` utility uses this proven approach. UTF-8 encoding is standard, and Unix systems automatically use LF line endings when writing in text mode. This approach is used across 262+ features with no issues.

  ### 3. Markdown Validation: Strict
  **Chosen**: Strict validation ensuring H1 heading, exactly 2-3 sentences, UTF-8 without BOM, Unix LF, trailing newline
  **Rationale**: Strict validation maintains format consistency with all 262+ preceding features, prevents edge cases, and ensures quality guarantees. The existing `validate_markdown_file()` utility performs all required checks. Validation overhead is negligible (<10ms).

  ### 4. Existing File Handling: Overwrite
  **Chosen**: Overwrite existing test-47n79i.md if it already exists
  **Rationale**: Overwrite ensures idempotent execution (running twice produces identical results). This enables safe re-deployment and is consistent with all 262+ preceding features. Deterministic behavior is critical for platform reliability.

  ### 5. Git Operations: Existing Tools
  **Chosen**: Use `content_generators.py` wrappers (`commit_markdown_file`, `push_markdown_file`) which internally use GitCommitTool and GitPushTool
  **Rationale**: Content_generators utilities handle error scenarios, logging, and conventional commit format. Reusing them ensures consistency with 262+ features and avoids duplication. Existing tools are proven and well-tested.

  ### 6. Error Handling: Exception Propagation with Logging
  **Chosen**: Structured logging at key operations; exceptions propagate to caller
  **Rationale**: Structured logging provides clear tracing. Exceptions logged with context before propagation enable debugging. Retry logic is premature optimization—file permission errors, git conflicts won't resolve with retry. Consistent with existing `content_generators.py` patterns.

  ### 7. Code Organization: Thin Wrapper
  **Chosen**: Create thin feature module (~100 lines) orchestrating content_generators utilities
  **Rationale**: Feature_262 establishes this pattern: a thin wrapper that orchestrates existing utilities. This minimizes duplication, maintains consistency, is easy to test, and matches project conventions.

  ## Implementation Strategy

  The implementation follows the proven five-step workflow from feature_262:

  1. **Generate markdown content** via `create_feature_263_markdown_file()`:
     - Call `generate_markdown_content()` which uses Claude API to create H1 heading + 2-3 sentences
     - LLM generates unique, coherent prose each time (temperature 0.2 for determinism)

  2. **Write file** with proper encoding:
     - Call `write_markdown_file("test-47n79i.md", content)` with generated content
     - Enforces UTF-8 encoding without BOM, Unix LF line endings, trailing newline
     - Overwrites if file already exists (idempotent behavior)

  3. **Validate markdown structure**:
     - Call `validate_markdown_file(filepath)` to verify:
       - H1 heading present
       - Exactly 2-3 sentences of prose
       - File encoding is UTF-8 without BOM
       - Line endings are Unix LF
       - Trailing newline present
     - Exception raised if any check fails

  4. **Commit to git**:
     - Call `commit_markdown_file(filepath, content, custom_message)`
     - Message format: `"feat(263): Create markdown file test-47n79i.md with prose content"`
     - Stages file and creates commit atomically

  5. **Push to remote**:
     - Call `push_markdown_file()` to push feature branch to remote
     - Feature branch (feat/263-markdown-file-creation-e8c7cc) already created by platform

  6. **Return results**:
     - Return dict with: filepath, content, commit_message, push_result
     - Enable standalone execution via `if __name__ == "__main__"` block

  **Why this ordering**: Linear dependency chain—each step depends on previous step's output. Content must be generated before validation. File must be written before commit. Commit must exist before push.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM generation timeout/failure | Low (proven across 262+ features) | Medium (blocks file creation) | Propagate exception with clear error message; user can retry |
  | LLM generates invalid format (fails validation) | Very Low (temperature 0.2 ensures determinism) | Medium (caught by validation before commit) | Validation step catches before git commit; no invalid files committed |
  | File write permission denied | Very Low (repository writable) | High (blocks file creation) | IOError propagated with filepath; user sees clear error |
  | Git operations fail (merge conflict, permission) | Low (clean feature branch) | High (blocks workflow) | Exception propagated and logged with git output; user sees cause |
  | File already exists (re-run scenario) | Medium (idempotent re-runs expected) | Low (handled gracefully) | Overwrite behavior ensures idempotent execution—re-running produces identical result |
  | Network error during push | Low (depends on connectivity) | Medium (file created locally, push fails) | Exception propagated; user can retry push or push manually |

  **Mitigation strategy**: All exceptions logged with context (structlog) before propagation. Clear error messages enable debugging. Validation gate ensures no invalid files committed. Idempotent overwrite behavior enables safe re-deployment.
