# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 289 implementation breaks into three concrete tasks across two phases:

  **Phase 1 (Setup):** Create feature_289_markdown_file_creation.py module using copy-paste-modify
  approach from feature_288. Module is minimal (~50 lines) and serves as orchestration entry point,
  delegating all complex operations to proven utility functions from content_generators.py.

  **Phase 2 (Execution & Verification):** Execute the feature module and verify all outputs:
  markdown file structure (H1 heading, 2-3 sentences), file encoding (UTF-8 without BOM), line
  endings (Unix LF), and git operations (staging, commit with conventional message, push with
  upstream tracking). Verification is systematic, checking each success criterion from the
  feature specification.

  **Implementation Flow:**
  1. Create feature module (task-1)
  2. Execute feature and validate file structure (task-2)
  3. Verify git operations and confirm push succeeded (task-3)

  All tasks follow TDD: RED (write assertions first), GREEN (minimal implementation), REFACTOR
  (improve code quality). Total effort: ~20 minutes, dominated by LLM latency (~1-2 seconds) and
  network push time (~1-2 seconds). Implementation and verification steps are quick (~15 minutes).

  ---

  ## Implementation Notes

  ### Task 1: Feature Module Creation

  **Approach:** Copy feature_288_markdown_file_creation.py, update constants and function names.

  **Key Changes:**
  - Line 1: Update docstring to reference feature 289
  - Line 28: FEATURE_NUMBER = 289
  - Line 30: MARKDOWN_FILENAME = \"test-ypijmz.md\"
  - Line 33: Function name create_feature_289_markdown_file()
  - Line 62-64: Update log message to reference feature 289
  - Line 84: Commit message uses new filename test-ypijmz.md
  - Line 112: Update function call in main block

  **Testing Strategy:**
  - Import test: verify module imports without errors
  - Callable test: verify function exists and is callable
  - Signature test: verify function accepts optional repo_path, returns dict with required keys
  - Execution test: verify running function doesn't raise exceptions (covered by task-2)

  ### Task 2: Feature Execution and File Verification

  **Execution Methods:**
  - As module: `python -m sheep.features.feature_289_markdown_file_creation`
  - As script: `python src/sheep/features/feature_289_markdown_file_creation.py`
  - Programmatically: `from sheep.features.feature_289_markdown_file_creation import create_feature_289_markdown_file; create_feature_289_markdown_file()`

  **Verification Checklist:**
  - [ ] File test-ypijmz.md exists in repository root
  - [ ] File starts with \"# \" (H1 markdown)
  - [ ] Blank line after heading
  - [ ] Prose content has exactly 2-3 sentences (period count)
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are Unix LF (0x0A), never CRLF (0x0D0x0A)
  - [ ] File size approximately 250-600 bytes
  - [ ] Content is coherent, readable prose
  - [ ] All INFO-level log messages appeared
  - [ ] No exceptions or errors in logs

  **Command Examples:**
  ```bash
  # Check file exists and size
  ls -la test-ypijmz.md
  wc -c test-ypijmz.md

  # Check encoding and line endings (no BOM, LF only)
  hexdump -C test-ypijmz.md | head -3
  # Should show UTF-8 chars, 0x0A line breaks, no 0xEF 0xBB 0xBF (BOM)

  # Check file structure
  head -5 test-ypijmz.md
  # Should show: \"# [Title]\" on first line, blank line, then prose

  # Count sentences (periods)
  grep -o '\\.' test-ypijmz.md | wc -l
  # Should be exactly 2 or 3
  ```

  ### Task 3: Git Operations Verification

  **Git Verification Checklist:**
  - [ ] git status shows clean working directory (no untracked test-ypijmz.md)
  - [ ] Most recent commit message is \"feat(289): create markdown file test-ypijmz.md with prose content\"
  - [ ] Commit hash is in git log
  - [ ] Upstream branch is configured (git branch -vv shows origin/feat/...)
  - [ ] Local and remote branches are in sync
  - [ ] No merge conflicts or push errors

  **Command Examples:**
  ```bash
  # Check status
  git status
  # Should show: \"On branch feat/289-...\" and \"nothing to commit, working tree clean\"

  # Check commit message
  git log --oneline | head -1
  # Should show: \"feat(289): create markdown file test-ypijmz.md with prose content\"

  # Check full commit
  git show HEAD
  # Should show commit message and file addition

  # Check branch tracking
  git branch -vv
  # Should show: \"feat/289-... [origin/feat/289-...: ahead 1, behind 0]\" or \"[origin/feat/289-...]\"

  # Check remote
  git ls-remote origin feat/289-markdown-file-creation-096a46
  # Should show remote branch exists
  ```

  ## Risk Notes

  - **If file already exists:** Task-1 must ensure write_markdown_file() includes explicit file-exists check. If error occurs, user deletes file and retries task-2.
  - **If LLM generates invalid content:** Validation in task-2 will fail. User retries task-2 to regenerate.
  - **If push fails:** Local file and commit remain (by design). User investigates failure, fixes issue, retries task-3.
  - **If git commands fail:** Errors propagate with clear messages. User reviews error and retries.

