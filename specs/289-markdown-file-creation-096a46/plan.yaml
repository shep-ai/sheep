content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-31

  ## Architecture Overview

  Feature 289 follows the identical architecture established across 288 preceding markdown-file-creation
  features. The implementation uses a thin feature module (feature_289_markdown_file_creation.py)
  that orchestrates the complete workflow through proven utility functions in content_generators.py.

  ### Architecture Pattern

  ```
  feature_289_markdown_file_creation.py
    └── create_feature_289_markdown_file()
        ├── generate_markdown_content() — Claude API for H1 + 2-3 sentences
        ├── write_markdown_file() — pathlib, UTF-8, Unix LF
        ├── validate_markdown_file() — structure, encoding, line endings
        ├── commit_markdown_file() — git add + conventional commit
        └── push_markdown_file() — git push -u origin HEAD
  ```

  **Key Characteristics:**
  - **Orchestration Pattern:** Single feature function calls utility functions in sequence
  - **No New Code Complexity:** All heavy lifting delegated to content_generators.py (proven across 288 implementations)
  - **Composition Over Inheritance:** Simple function calls without class hierarchies or abstractions
  - **Error Handling:** Exceptions propagate naturally; any failure stops workflow (atomic semantics)
  - **Logging:** INFO-level milestones (content generated, file written, validation passed, commit/push completed); DEBUG available on demand
  - **Return Value:** Dictionary with filepath, content, commit_message, push_result for verification/testing

  ### Integration Points

  **Content Generation:**
  - Calls `generate_markdown_content()` from content_generators.py
  - Uses Claude API via `sheep.config.llm.get_reasoning_llm()` (temperature=0.2)
  - Generates H1 heading + 2-3 sentences of prose (validated for exact structure)
  - Non-deterministic content ensures variety across test fixture collection

  **File Operations:**
  - Calls `write_markdown_file(content, "test-ypijmz.md")` from content_generators.py
  - Uses pathlib.Path for cross-platform compatibility
  - Explicit file-exists check: raises ValueError if test-ypijmz.md already exists (prevents overwrites)
  - UTF-8 encoding without BOM, Unix LF line endings enforced

  **Validation:**
  - Calls `validate_markdown_file(filepath)` from content_generators.py
  - Validates: H1 heading present, exactly 2-3 sentences (period-counting), UTF-8 encoding, Unix LF line endings
  - Strict validation ensures consistency across 300+ test files
  - Validation failures raise ValueError with clear error messages

  **Git Integration:**
  - Calls `commit_markdown_file(filepath, content, repo_path, custom_message=...)` from content_generators.py
  - Commit message: "feat(289): create markdown file test-ypijmz.md with prose content"
  - Uses GitCommitTool from sheep.tools.git_tools (works across platforms)

  - Calls `push_markdown_file(repo_path)` from content_generators.py
  - Push command: `git push -u origin HEAD` to feature branch
  - If push fails, local file and commit are preserved for manual retry (standard git workflow)

  **Observability:**
  - Integrates with structlog via `get_logger(__name__)` from sheep.observability.logging
  - INFO-level: milestones (content generated, file written, validation passed, commit/push completed)
  - DEBUG-level: details (generated bytes, commit message, push result)
  - Error messages propagate with full exception context

  ## Key Design Decisions

  ### Decision 1: Orchestration via Existing Utility Functions

  **Chosen:** Call `create_markdown_file()` wrapper or individual orchestration functions from content_generators.py

  **Alternatives Considered:**
  - Custom implementation from scratch — rejected: duplicate code already proven effective across 288 features
  - Modular composition — rejected: direct utility calls are simpler and match established pattern
  - Abstract base class for all features — rejected: unnecessary complexity; functions sufficient

  **Rationale:**
  The content_generators.py module contains all required functionality, tested across hundreds of
  markdown files. Reusing this code ensures consistency with 288 preceding features, eliminates risk
  of introducing new bugs, and keeps implementation trivial (~50 lines of orchestration code).

  ### Decision 2: Feature Module Structure

  **Chosen:** Create feature_289_markdown_file_creation.py following feature 288 pattern

  **Pattern Details:**
  - Module docstring describing feature and workflow
  - Constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME
  - Main function: `create_feature_289_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  - Try/except for error handling with logging
  - `if __name__ == "__main__":` block for direct execution
  - Structured return dictionary with filepath, content, commit_message, push_result

  **Rationale:**
  This pattern has been proven effective across 288 prior implementations. It provides:
  - Clear entry point for feature execution
  - Consistent structure for discovering/invoking features
  - Full observability through structured logging
  - Testable interface with explicit return values

  ### Decision 3: Content Generation - Claude API (temperature=0.2)

  **Chosen:** Use `get_reasoning_llm()` with temperature=0.2 (reasoning-grade Claude)

  **Alternatives Considered:**
  - Fast LLM (temperature=0.3) — rejected: reasoning model produces higher-quality prose
  - Lower temperature (0.0-0.1) — rejected: risks repetitive content across many files
  - No LLM, hardcoded content — rejected: violates content variety requirement

  **Rationale:**
  Temperature=0.2 balances consistency with variation. The MARKDOWN_GENERATION_PROMPT in
  content_generators.py is calibrated for this model. This configuration has produced 288
  unique, high-quality markdown files without issues.

  ### Decision 4: Strict File Structure Validation

  **Chosen:** Enforce exactly 2-3 sentences via period-counting heuristic

  **Alternatives Considered:**
  - Lenient validation (2+ sentences) — rejected: violates explicit spec requirement for 2-3
  - No validation — rejected: violates quality assurance and consistency requirements
  - NLP-based sentence tokenization — rejected: overkill; period-counting proven effective

  **Rationale:**
  Simple period-counting has been effective across 288 prior features. While edge cases exist
  (abbreviations, ellipses), Claude's output is naturally simple and well-punctuated, minimizing
  false positives. This keeps validation lightweight and fast.

  ### Decision 5: File Exists Handling - Fail with Error

  **Chosen:** Explicit check in write_markdown_file(); raise ValueError if file exists

  **Alternatives Considered:**
  - Silent overwrite — rejected: risks data loss, violates safety-first principle
  - Auto-retry with different filename — rejected: adds scope creep, violates spec requirement

  **Rationale:**
  Failing with a clear error maintains atomic semantics (all-or-nothing). User can delete the
  file and retry. This aligns with standard unix tool behavior and spec requirement: "fail with
  clear error if file already exists".

  ### Decision 6: Push Failure Handling - Preserve Local State

  **Chosen:** If push fails, keep local file and commit; user retries manually

  **Alternatives Considered:**
  - Cleanup on failure — rejected: adds complexity, introduces new error vectors
  - Auto-retry with backoff — rejected: scope creep, standard workflows expect manual intervention

  **Rationale:**
  Preserving local state provides better debuggability. User can investigate the failure
  (network, auth, branch conflict), fix the issue, and retry the push. This aligns with
  standard git workflows and provides better user control than automatic cleanup.

  ### Decision 7: Logging Level - INFO (Milestones Only)

  **Chosen:** INFO-level logging for important milestones; DEBUG available on demand

  **Alternatives Considered:**
  - DEBUG-level for all operations — rejected: excessive verbosity, INFO sufficient for troubleshooting
  - No logging — rejected: violates observability requirements

  **Rationale:**
  INFO-level provides essential visibility (content generated, file written, validation passed,
  commit/push completed) without log clutter. DEBUG logs are available when needed for detailed
  troubleshooting. This aligns with production best practices.

  ## Implementation Strategy

  ### Phase 1: Feature Module Setup

  Create src/sheep/features/feature_289_markdown_file_creation.py following the established
  pattern from feature 288. The module is minimal (~50 lines) and serves as the orchestration
  entry point. All complex operations are delegated to content_generators.py utility functions.

  **Key Steps:**
  1. Copy structure from feature_288_markdown_file_creation.py
  2. Update: FEATURE_NUMBER=289, MARKDOWN_FILENAME="test-ypijmz.md"
  3. Ensure all six utility function calls are present and correct:
     - generate_markdown_content()
     - write_markdown_file(content, MARKDOWN_FILENAME)
     - validate_markdown_file(filepath)
     - commit_markdown_file(filepath, content, repo_path, custom_message="feat(289): ...")
     - push_markdown_file(repo_path)
  4. Validate logging is present at INFO and DEBUG levels
  5. Ensure try/except wraps entire workflow with error logging

  **Why Phase 1 Comes First:**
  The feature module is the entry point for all subsequent work. It must be in place
  before executing the feature (Phase 2).

  ### Phase 2: Execution and Verification

  Execute the feature module and verify all operations succeed. This phase includes:

  **Execution Steps:**
  1. Run `python -m sheep.features.feature_289_markdown_file_creation` or call function directly
  2. Observe INFO-level logs: "Creating feature 289...", "Task 1: Generating...", etc.
  3. Verify no exceptions raised during execution

  **Verification Steps:**
  1. **File Existence:** Verify test-ypijmz.md exists in repository root
  2. **File Structure:** Verify file contains H1 heading (starts with "# ") followed by blank line and 2-3 sentences
  3. **File Encoding:** Verify file is UTF-8 without BOM (hexdump check: should not start with EF BB BF)
  4. **Line Endings:** Verify file uses Unix LF only, never CRLF (hexdump check: line breaks are 0A, not 0D 0A)
  5. **File Size:** Verify file is approximately 250-600 bytes (natural outcome of H1 + 2-3 sentences)
  6. **Git Staging:** Verify `git status` shows test-ypijmz.md staged or committed (not untracked)
  7. **Git Commit:** Verify `git log --oneline | head -1` shows "feat(289): create markdown file test-ypijmz.md..."
  8. **Git Push:** Verify `git branch -vv` shows upstream tracking and commits are synced with remote

  **Why Phase 2 Comes After Phase 1:**
  Phase 2 executes the module created in Phase 1. Phases are sequential; no parallelization
  possible (generate → write → validate → commit → push).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File already exists** | Explicit check in write_markdown_file() raises ValueError; user deletes and retries. Prevents accidental overwrites. |
  | **LLM generates invalid prose** | Validation function checks sentence count strictly (2-3 only); rejects invalid content. User retries. |
  | **Git push fails** | Local file and commit preserved; user investigates failure, fixes issue (network, auth, branch), retries push. Standard workflow. |
  | **Encoding issues** | pathlib always writes UTF-8 without BOM; Unix LF line endings enforced. Validation checks encoding after write. |
  | **Logging missing/unclear** | INFO-level logs at all milestones (content generated, file written, validation passed, commit/push). DEBUG available. |
  | **Feature module structure diverges from pattern** | Follow feature_288_markdown_file_creation.py exactly; use copy-paste + modify approach to minimize drift. |
  | **Utility function signatures changed** | Research confirmed content_generators.py is stable (288 uses). No breaking changes expected. Monitor function imports. |
  | **Repository not in clean state** | Feature assumes feature branch exists and is checked out. Workflow expects clean working directory before execution. |

  ## No New Dependencies or Breaking Changes

  This feature requires **zero new libraries or dependencies**:
  - Uses only Python standard library (pathlib, subprocess)
  - Uses only existing sheep.* modules (content_generators, observability.logging, config.llm, tools.git_tools)
  - No changes to existing source code
  - No database migrations or schema changes
  - No configuration changes required

  All technology decisions align with established patterns from 288 preceding features.

