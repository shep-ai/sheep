# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-31
  - **Conclusion:** Implementation is straightforward. Use existing content_generators.py orchestration function. No new libraries or architecture changes required.

  ## Technology Decisions

  ### 1. Implementation Approach: Orchestration via Existing Function

  **Chosen:** Call create_markdown_file(filename, repo_path, feature_number) from content_generators.py

  **Rejected:**
  - Modular composition (call individual functions separately) — reduces consistency with 288 preceding features; adds unnecessary complexity
  - Custom feature_289 module — while consistent with earlier features, the orchestration function is sufficient (module can be added later for clarity)

  **Rationale:** The content_generators.py module already provides a complete, tested orchestration function handling the entire workflow: generate content, write file, validate, commit, and push. Feature 288 demonstrated this approach works reliably. Creating a wrapper feature module (feature_289_markdown_file_creation.py) for consistency with earlier features would follow established patterns, but the core implementation is already complete and production-ready.

  ### 2. Content Generation: LLM Model Selection

  **Chosen:** Claude API via get_reasoning_llm() with temperature=0.2 (reasoning grade)

  **Rejected:**
  - Fast LLM (get_fast_llm, temperature=0.3) — insufficient quality for prose generation; reasoning-grade models produce higher-quality, more varied content
  - Lower temperature (0.0-0.1) — risks repetitive content across 300+ test files; 0.2 balances consistency with variation

  **Rationale:** The MARKDOWN_GENERATION_PROMPT in content_generators.py is calibrated for the reasoning-grade LLM. This model has proven stable across 288 prior implementations. No configuration changes needed; use the existing setup.

  ### 3. File Validation: Sentence Count Enforcement

  **Chosen:** Strict validation: exactly 2-3 sentences via period-counting

  **Rejected:**
  - Lenient validation (2+ sentences) — violates spec requirement for exactly 2-3; reduces consistency
  - No validation — violates non-functional requirements; removes quality assurance proven effective across 288 files

  **Rationale:** The validate_markdown_file() function enforces strict sentence count via period-counting. This heuristic has proven effective across hundreds of files. While edge cases (abbreviations, ellipses) can occur, Claude's output is naturally simple and well-punctuated, minimizing false positives.

  ### 4. File Exists Handling: Safety vs Silent Overwrite

  **Chosen:** Fail with clear error if test-ypijmz.md already exists

  **Rejected:**
  - Silently overwrite — risks data loss and violates safety-first principle per spec decision 1
  - Automatic retry with different name — adds scope creep; user should handle explicit failures

  **Rationale:** Add explicit check in write_markdown_file(): if file exists, raise ValueError with message "File already exists: test-ypijmz.md". This provides immediate feedback and maintains atomic behavior (all-or-nothing). User can delete the file and retry if needed.

  ### 5. Push Failure Handling: Preservation vs Cleanup

  **Chosen:** Preserve local file and commit for manual retry (no cleanup)

  **Rejected:**
  - Cleanup on failure — adds complexity and introduces new error vectors; standard git workflows expect manual intervention
  - Auto-retry with backoff — scope creep; current implementation correctly fails fast with clear error

  **Rationale:** Per feature spec decision 3, preserving local state allows better debugging and user control. If push fails (network, auth, branch conflict), the commit remains for manual retry after fixing the underlying issue. This aligns with standard git workflows.

  ### 6. Logging Level: Information Granularity

  **Chosen:** INFO level — log only important milestones

  **Rejected:**
  - DEBUG level (all operations) — excessive verbosity; INFO suffices for troubleshooting, DEBUG available on demand
  - No logging — violates observability requirements

  **Rationale:** Per spec decision 5, INFO-level logging provides essential visibility without clutter. Key milestones are logged: content generated, file written, validation passed, commit created, push completed. DEBUG logs (LLM response details, git commands) are available when needed.

  ---

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | **pathlib** | Cross-platform file path operations and I/O | **Use** | Built-in Python 3.11+ standard library; used extensively in content_generators.py; provides safe path operations without string manipulation |
  | **CrewAI LLM** | Claude API integration and LLM orchestration | **Use** | Already integrated; get_reasoning_llm() provides stable interface; temperature=0.2 proven across 288 features |
  | **structlog** | Structured logging with context preservation | **Use** | Already configured in project; provides INFO/DEBUG filtering; consistent with observability framework |
  | **subprocess (git)** | Git operations (stage, commit, push) | **Use** | Used by GitCommitTool and GitPushTool; no direct dependency; works reliably across platforms |
  | **NLTK / spaCy** | Advanced sentence tokenization (proposed) | **Reject** | Unnecessary complexity; simple period-counting is sufficient and proven effective; adds external dependency for minimal benefit |
  | **regex (re)** | Advanced content validation (proposed) | **Reject** | Current validation using string methods (count, startswith, split) is sufficient; regex adds no benefit for simple markdown structure |
  | **dataclasses / pydantic** | Input validation (proposed) | **Reject** | Not needed; filename parameter is validated via simple string checks; no complex schema required |

  ---

  ## Security Considerations

  ### File I/O Safety
  - **Filename validation**: write_markdown_file() validates that filename contains no path separators (/ \\) and doesn't start with . (prevents directory traversal)
  - **File exists check**: Add explicit check before write to prevent accidental overwrites
  - **Encoding safety**: Always use UTF-8 encoding to ensure consistent, safe text handling
  - **Path resolution**: Use pathlib.Path exclusively (no string concatenation) to prevent injection attacks

  ### Content Generation Safety
  - **LLM output validation**: Generated content is validated for structure (H1 heading, sentence count) before writing; malformed content is rejected with clear error
  - **No code injection**: Content is treated as data (markdown prose), not code; no eval() or exec() is involved
  - **Error propagation**: All validation failures raise ValueError with descriptive messages, preventing silent failures

  ### Git Integration Safety
  - **Standard git commands**: Uses subprocess with explicit argument lists (no shell=True), preventing command injection
  - **SSH/HTTPS authentication**: Uses system git configuration (SSH keys, credentials) managed by user's git setup; no credentials stored in code
  - **Branch protection**: Feature runs on correct branch (feat/289-markdown-file-creation-096a46); push includes upstream tracking

  ### Data Integrity
  - **All-or-nothing semantics**: File creation, validation, and commit are sequential; any failure stops workflow (no partial commits)
  - **Encoding consistency**: UTF-8 encoding with no BOM and Unix LF line endings ensure cross-platform consistency
  - **Validation before commit**: File is validated before staging to prevent committing invalid files

  ---

  ## Performance Considerations

  ### LLM Latency
  - **Expected latency**: Content generation via Claude API typically 1-2 seconds (measured from feature 288)
  - **Optimization**: No caching or memoization needed; each file should have unique content
  - **Fallback**: If LLM fails, error propagates immediately; no retries (user should fix and retry)
  - **Impact**: Single ~1-2 second LLM call per feature execution; acceptable for test fixture creation

  ### File I/O Performance
  - **File write**: Single write operation (~300-400 bytes); negligible (<1ms)
  - **Validation**: Binary read and text analysis; O(n) where n = file size (~400 bytes); negligible
  - **pathlib overhead**: Minimal; Path operations are fast for single file

  ### Git Operations Performance
  - **git add**: Single file addition; typically <10ms
  - **git commit**: Creates commit object; typically <50ms
  - **git push**: Network-dependent (100ms - several seconds); largest performance variable
  - **Total end-to-end**: Typically 2-4 seconds (dominated by LLM latency + network push time)

  ### Optimization Notes
  - No parallelization needed; feature is inherently sequential (generate → validate → commit → push)
  - No batch processing; single file per feature execution (not a bulk operation)
  - No caching or deduplication; each file should contain unique content

  ---

  ## Architecture Notes

  ### Integration with Existing Codebase

  **Content Generation Pipeline:**
  - Uses established MARKDOWN_GENERATION_PROMPT from content_generators.py
  - Calls get_reasoning_llm() from sheep.config.llm (proven integration point)
  - No new LLM model or configuration changes needed

  **File Operations:**
  - Uses pathlib exclusively (consistent with Python best practices and existing codebase)
  - All file operations centralized in content_generators.py
  - Validation functions handle both content structure and file properties (encoding, line endings)

  **Git Workflow:**
  - Integrates with existing GitCommitTool and GitPushTool from sheep.tools.git_tools
  - Follows conventional commit format: `feat(289): create markdown file test-ypijmz.md with prose content`
  - Push includes upstream tracking (`-u origin HEAD`) for branch synchronization

  **Logging Framework:**
  - Integrates with structlog via get_logger(__name__) from sheep.observability.logging
  - INFO-level messages for milestones; DEBUG-level for details
  - Consistent with observability patterns established across 288 prior features

  **No Database or State Changes:**
  - Feature creates only a single markdown file (no state machine, no persistence)
  - No migrations, schema changes, or configuration updates needed
  - Isolated to repository root; no impact on src/, tests/, or configuration directories

  ### Extension Points for Future Features

  - **Batch creation**: create_markdown_file() can be called in a loop with different filenames
  - **Custom prompts**: MARKDOWN_GENERATION_PROMPT can be parameterized if needed
  - **Content validation rules**: validate_markdown_file() can be extended with additional checks
  - **Git workflow customization**: commit_message generation can accept custom templates

  ### Dependencies and Constraints

  - **Python 3.11+**: Required for pathlib and type hints (str | None syntax)
  - **CrewAI**: Required for LLM integration; must be installed and configured
  - **ANTHROPIC_API_KEY**: Required for Claude API access; must be set in .env or environment
  - **Git**: Must be installed and configured (user.name, user.email) for commits
  - **Feature branch**: feat/289-markdown-file-creation-096a46 must exist (confirmed in git status)

  ---

  ## Summary: No Breaking Changes or New Dependencies

  This feature has **zero breaking changes** to existing code:
  - Uses only existing content_generators.py functions
  - Requires no new libraries or dependencies
  - Makes no changes to core codebase (src/sheep/)
  - No database migrations or schema changes
  - No configuration changes required

  All technology decisions align with the established pattern from 288 preceding features. Implementation is straightforward: create a feature module or script that calls create_markdown_file("test-ypijmz.md", feature_number=289).
