openQuestions:
  - question: "If test-ypijmz.md already exists in the repository root, should the implementation fail with an error or overwrite the existing file?"
    resolved: true
    options:
      - option: "Fail with error"
        description: "Refuse to overwrite; raise an error if file already exists. Safer approach that prevents accidental data loss and aligns with atomic behavior (commit fully succeeds or fully fails). Requires manual deletion if re-running is needed. Recommended for production safety."
        selected: true
      - option: "Overwrite existing file"
        description: "Silently replace the existing file with new content. Faster for iterative development and retry scenarios. Less safe; could accidentally overwrite recent changes or different content without warning. May be appropriate for idempotent test fixtures."
        selected: false
    selectionRationale: "Failing with an error is recommended to maintain safety and atomic behavior. Since this is a test fixture in a deterministic workflow (created fresh for each feature branch), overwriting is not a required use case. The error message provides clear feedback to the user, who can then handle the situation explicitly (delete and retry, or investigate why the file already exists)."
    answer: "Fail with error"

  - question: "Should the validation for sentence count be strict (exactly 2-3 sentences) or lenient (2 or more sentences)?"
    resolved: true
    options:
      - option: "Strict validation (exactly 2-3 sentences)"
        description: "Enforce exactly 2-3 sentences; fail validation if fewer or more. Ensures consistency across all 300+ test files and matches the user requirement precisely. Stricter quality control; may require regeneration if Claude produces 4 sentences. Aligns with established pattern from features 001-288."
        selected: true
      - option: "Lenient validation (2 or more sentences)"
        description: "Accept any number of sentences >= 2. More forgiving of LLM variations and reduces validation failures. Risk of inconsistency if some files have 2 and others have 5+ sentences. Harder to maintain uniform test fixtures across the platform."
        selected: false
    selectionRationale: "Strict validation (exactly 2-3) is recommended to maintain consistency with the 288 preceding features and to honor the user's explicit requirement. Since Claude is reliable for generating content of specific lengths, strict validation is achievable and ensures uniform structure across all test files. This supports long-term maintainability of the test fixture collection."
    answer: "Strict validation (exactly 2-3 sentences)"

  - question: "If git push fails after the file is created and committed locally, should the implementation keep the local file/commit for manual retry, or attempt to clean up and remove it?"
    resolved: true
    options:
      - option: "Keep local file and commit for retry"
        description: "Leave the file and commit in place if push fails. Allows the user to investigate the failure, fix the underlying issue (e.g., network, authentication), and retry the push. Maintains local state for debugging. Less atomicity; file exists locally but not on remote. Practical for real-world troubleshooting scenarios."
        selected: true
      - option: "Attempt cleanup and remove file/commit"
        description: "If push fails, attempt to reset the commit and remove the local file to restore clean state. Enforces all-or-nothing atomicity: either fully succeeds (remote push) or fully fails (no local artifacts). Riskier cleanup could introduce new errors. Simplifies state but reduces debuggability."
        selected: false
    selectionRationale: "Keeping the local file and commit is recommended for better debuggability and user control. If push fails due to temporary network issues or authentication problems, the user can inspect the local commit, verify it's correct, and retry the push without recreating everything. This is more aligned with standard git workflows where local commits are preserved for manual intervention. The risk of cleanup operations introducing new errors outweighs the benefit of strict atomicity."
    answer: "Keep local file and commit for retry"

  - question: "Should the implementation validate that generated content is unique compared to the 288+ existing test files, or is structural validity (H1 + 2-3 sentences) sufficient?"
    resolved: true
    options:
      - option: "Structural validity only (H1 + 2-3 sentences)"
        description: "Validate only that the file structure matches (H1 heading, 2-3 sentences, encoding, line endings). Do not compare content against existing files. Simpler implementation; uniqueness is non-deterministic with Claude and impossible to guarantee. Matches the pattern from features 001-288; no comparison logic exists in established utilities. Appropriate for test fixtures where content is secondary to structure."
        selected: true
      - option: "Require unique content comparison"
        description: "Hash or compare generated content against existing test files to ensure uniqueness. Prevents potential duplicate content. Requires expensive O(n) comparison against 300+ files at each creation. May cause unnecessary regeneration loops if content happens to duplicate. Not established in current pattern; introduces new complexity."
        selected: false
    selectionRationale: "Structural validity only is recommended. The established pattern from 288 preceding features validates only structure, not content uniqueness. Enforcing uniqueness would require comparing against all existing files, which is expensive and unnecessary since Claude's output is naturally varied. Test fixtures in this context are valued for their structure (proper markdown format), not for absolute uniqueness. This keeps implementation simple and fast."
    answer: "Structural validity only (H1 + 2-3 sentences)"

  - question: "What should be the logging level for implementation steps—INFO (important milestones only) or DEBUG (all operations)?"
    resolved: true
    options:
      - option: "INFO level (important milestones only)"
        description: "Log only important milestones: content generation started, file created, validation passed, commit created, push completed. Cleaner logs; easier to scan for issues. Sufficient for most troubleshooting. Reduces log volume. Matches typical production logging practices."
        selected: true
      - option: "DEBUG level (all operations)"
        description: "Log every step including Claude API call details, validation checks, git command invocations, file I/O operations. Very verbose; helpful for detailed debugging during development. Increases log volume and storage. May expose sensitive details (API calls, file paths). Better for active development; not ideal for production."
        selected: false
    selectionRationale: "INFO level is recommended. For a simple, straightforward operation like file creation, INFO-level logging (milestones: content generated, file created, validation passed, commit/push completed) is sufficient for troubleshooting. If issues arise, DEBUG logging can be enabled on demand. This balance maintains clarity and performance while aligning with structlog best practices and the pattern from features 001-288."
    answer: "INFO level (important milestones only)"

content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 289 creates a single test markdown file
  (`test-ypijmz.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-288.
  With 288 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations. The implementation should follow the established
  utilities and patterns without deviation, ensuring consistency across the test fixture collection.

  ## Success Criteria

  - [ ] File `test-ypijmz.md` is created in repository root
  - [ ] File contains exactly one H1 heading (CommonMark `#`) serving as the title
  - [ ] File contains 2-3 sentences of coherent prose content after the heading
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\n) exclusively, no CRLF or CR
  - [ ] File structure validation passes (H1 heading present, sentence count 2-3, encoding UTF-8, line endings LF)
  - [ ] File is properly staged in git working directory
  - [ ] Commit message follows conventional format: `feat(289): create markdown file test-ypijmz.md with prose content`
  - [ ] Commit is successfully pushed to feature branch `feat/289-markdown-file-creation-096a46` with upstream tracking
  - [ ] Content is generated via Claude API using `sheep.config.llm.get_reasoning_llm()`
  - [ ] Implementation uses established utility functions from `src/sheep/content_generators.py`
  - [ ] No source code, test files, or configuration files are modified
  - [ ] File size falls within expected range (250-600 bytes, natural outcome of proper structure)
  - [ ] Structlog emits appropriate INFO/DEBUG messages during execution
  - [ ] All file I/O operations use pathlib for cross-platform compatibility
  - [ ] If file already exists, implementation fails with clear error (not silently overwritten)

  ## Functional Requirements

  - **FR-1**: Create a markdown file with exact filename `test-ypijmz.md` in repository root
  - **FR-2**: File must contain a single H1 heading (CommonMark-compliant syntax `# Title`) as the title
  - **FR-3**: File must contain exactly 2-3 sentences of coherent prose content following the heading, separated by a blank line
  - **FR-4**: Content must be generated by Claude API via `sheep.config.llm.get_reasoning_llm()` for quality and variety
  - **FR-5**: Use core utility functions from `src/sheep/content_generators.py`: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - **FR-6**: Stage file in git using `git add test-ypijmz.md`
  - **FR-7**: Create conventional commit with message: `feat(289): create markdown file test-ypijmz.md with prose content`
  - **FR-8**: Push commit to feature branch with upstream tracking (`git push -u origin HEAD`)
  - **FR-9**: Validate file structure before committing (H1 heading, 2-3 sentences, encoding, line endings)
  - **FR-10**: Fail with clear error message if `test-ypijmz.md` already exists (no overwrite)

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 without BOM
  - **NFR-2**: File must use Unix LF line endings (\n), never CRLF (\r\n) or Mac CR (\r)
  - **NFR-3**: Implementation must follow the established pattern from features 001-288 for consistency
  - **NFR-4**: All logging must use structlog with appropriate severity levels (INFO for milestones, DEBUG on demand)
  - **NFR-5**: All file I/O operations must use pathlib for cross-platform compatibility
  - **NFR-6**: File size naturally falls in 250-600 byte range (outcome of proper implementation, not a hard constraint)
  - **NFR-7**: No modifications to source code, tests, or configuration files
  - **NFR-8**: No directory creation or modification beyond repository root
  - **NFR-9**: Git operations must respect existing repository hooks (standard git workflow)
  - **NFR-10**: Content generation is non-deterministic (each file contains unique/varied content from Claude)
  - **NFR-11**: Validation must be strict: exactly 2-3 sentences, not flexible
  - **NFR-12**: If push fails, local file and commit are preserved for manual retry and debugging

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Existing file handling (overwrite vs fail?) | Fail with error | Prevents accidental data loss; ensures atomic behavior; aligns with safety-first practices for deterministic workflows |
  | 2 | Sentence count validation (strict vs lenient?) | Strict (exactly 2-3) | Ensures consistency across 300+ test files; honors explicit user requirement; achievable with Claude API |
  | 3 | Push failure handling (keep vs cleanup?) | Keep local file/commit | Better debuggability; allows manual retry; aligns with standard git workflows; avoids risky cleanup operations |
  | 4 | Content uniqueness validation required? | Structural validity only | Simpler implementation; matches 288 established features; Claude output is naturally varied; O(n) comparison unnecessary |
  | 5 | Logging verbosity level? | INFO (milestones only) | Sufficient for troubleshooting; cleaner logs; aligns with production best practices; DEBUG available on demand |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-ypijmz.md) to existing collection of 300+ test files; no modifications to existing files |
  | File System | Low | Single file creation (~250-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch/merge complexity |
  | src/sheep/ | None | Feature uses existing utility functions from content_generators.py; no new code required |
  | specs/ | Low | Adds spec directory for feature 289; spec analysis and requirements phases only, no impact on other specs |
  | Tests | None | Feature does not require test modifications; is itself a test artifact |
  | Configuration | None | Feature uses existing config; no changes to .env, pyproject.toml, or other configs |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or core platform functionality |

  ## Dependencies

  - **Git repository**: Feature branch `feat/289-markdown-file-creation-096a46` must exist (pre-created per git status)
  - **File system**: Write access to repository root directory (standard)
  - **Established pattern**: 288 preceding test files provide clear precedent for content format and validation
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library**: pathlib module available in Python 3.11+
  - **sheep.content_generators module**: Utility functions for markdown creation (`generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`)
  - **Claude API access**: ANTHROPIC_API_KEY or equivalent configured in .env for content generation via `sheep.config.llm`
  - **File naming**: Exact filename `test-ypijmz.md` provided in feature spec and must be used as specified
  - **structlog**: Logging framework properly configured in project environment

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation**: ~3 minutes (write file using pathlib, validate structure/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate**: 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 288 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting (content generation, validation, git operations)
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - File naming (test-ypijmz.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 288 prior implementations
  - Recent implementations (features 284-288) demonstrate efficient execution of identical features
  - Product decisions now formalized; no ambiguity remains

  ---

  _Requirements phase complete — functional and non-functional requirements defined, product questions formalized with structured options and AI recommendations, success criteria measurable and comprehensive_
