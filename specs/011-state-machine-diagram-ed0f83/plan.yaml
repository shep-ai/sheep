# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature adds a single standalone markdown file at the repository root.
  It follows the established pattern of other root-level content files:
  JOKE.md, JOKE2.md, JOKE3.md, SHEEP.md, DESIGN_PATTERN.md — all uppercase,
  all self-contained, all unrelated to the repository's functional code.

  No build system, CI pipeline, or existing file is touched.

  ## Key Design Decisions

  ### Mermaid syntax: stateDiagram-v2
  GitHub natively renders stateDiagram-v2 blocks. The v1 syntax is deprecated.
  ASCII art provides no graphical rendering. stateDiagram-v2 is the only viable
  choice that satisfies NFR-1.

  ### Filename: STATE_MACHINE.md
  All existing root content files use ALL_CAPS names. Consistent with JOKE.md,
  SHEEP.md, DESIGN_PATTERN.md. Lowercase alternatives would deviate from the
  established convention.

  ### Content: H1 heading + diagram block only
  User intent was "SUPER FAST! NO TIME FOR ANALYZING!" and size estimate is S.
  Any prose beyond a title heading is waste.

  ## Implementation Strategy

  Single phase, single task: write the file. The traffic light state machine
  has 3 states (Red, Green, Yellow) and 3 transitions forming a cycle, which
  satisfies the minimum requirements (>=3 states, >=3 transitions) while
  remaining instantly comprehensible.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error breaks GitHub rendering | Use stateDiagram-v2 per official docs; verify syntax against spec |
  | Filename conflict with existing file | Confirmed no STATE_MACHINE.md exists in repo root |
