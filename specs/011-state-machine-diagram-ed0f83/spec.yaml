content: |
  ## Problem Statement

  The repository needs a standalone markdown file demonstrating a simple state
  machine diagram as an illustrative example, unrelated to the repo's purpose.

  ## Success Criteria

  - [ ] A file named `STATE_MACHINE.md` exists at the repository root
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` code block
  - [ ] The diagram depicts a simple, self-contained state machine (traffic light)
  - [ ] The diagram renders correctly on GitHub (no syntax errors)
  - [ ] The diagram has at least 3 states and at least 3 transitions
  - [ ] No existing files are modified
  - [ ] The file subject matter is unrelated to the repository's domain

  ## Functional Requirements

  - **FR-1**: The system must include a new file `STATE_MACHINE.md` at the
    repository root.
  - **FR-2**: The file must contain a Mermaid `stateDiagram-v2` diagram block
    that is syntactically valid.
  - **FR-3**: The diagram must represent a traffic light state machine with
    states: Red, Green, Yellow, and transitions forming a cycle.
  - **FR-4**: The file must include at least a top-level heading identifying
    the diagram subject.
  - **FR-5**: The content must be self-contained — no external assets, links,
    or dependencies required for the diagram to render.

  ## Non-Functional Requirements

  - **NFR-1**: The file must render without errors on GitHub's Mermaid renderer
    (stateDiagram-v2 is supported natively).
  - **NFR-2**: The file size must be minimal (< 1 KB) — no padding, no
    unnecessary content.
  - **NFR-3**: The diagram must be readable at a glance without prior context
    or explanation.
  - **NFR-4**: No existing files in the repository may be modified by this
    change.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What state machine subject/theme? | Traffic light | Universal, minimal, instantly understood |
  | 2 | What filename? | STATE_MACHINE.md | Matches existing ALL_CAPS root file convention |
  | 3 | How much prose? | Minimal (heading + diagram only) | Matches "SUPER FAST" user intent |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root | Low | New standalone .md file added, no existing files modified |

  ## Dependencies

  None. Pure content file, no code or library dependencies.

  ## Size Estimate

  **S** — Single file creation, no code changes, minimal content (~10 lines).
