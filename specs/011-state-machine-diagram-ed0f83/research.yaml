content: |
  ## Technology Decisions

  ### 1. Mermaid Diagram Syntax Version

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — deprecated, less expressive, not recommended for new diagrams
  - ASCII/text diagram — no graphical rendering, not supported natively by GitHub

  **Rationale:** GitHub natively renders Mermaid `stateDiagram-v2` blocks in
  markdown files. This is the current recommended syntax and satisfies NFR-1
  (renders without errors on GitHub) out of the box with no tooling required.

  ### 2. File Naming Convention

  **Chosen:** `STATE_MACHINE.md`

  **Rejected:**
  - `state-machine.md` — violates the repo's ALL_CAPS root file convention
  - `state-machine-example.md` — still violates convention and adds unnecessary length

  **Rationale:** All existing root-level content files (JOKE.md, JOKE2.md,
  JOKE3.md, SHEEP.md, DESIGN_PATTERN.md) use uppercase names. Consistency
  requires STATE_MACHINE.md.

  ### 3. Content Verbosity

  **Chosen:** Minimal (H1 heading + Mermaid block)

  **Rejected:**
  - Brief explanation prose — unnecessary for a "SUPER FAST" illustrative example
  - Full tutorial — grossly over-scoped for an S-size feature

  **Rationale:** User intent ("SUPER FAST! NO TIME FOR ANALYZING!") and the S
  size estimate both point to the absolute minimum viable content.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid | State diagram rendering | Use (built-in) | Natively supported by GitHub; no installation needed |

  ## Security Considerations

  None. This is a static markdown file with no executable code, no user input,
  no external links, and no assets. There are zero security implications.

  ## Performance Implications

  None. A sub-1KB static markdown file has no measurable performance impact on
  the repository or its consumers.

  ## Architecture Notes

  Pure content addition. The file sits at the repository root alongside other
  standalone content files (JOKE3.md, SHEEP.md, etc.). No existing files are
  modified, no build system changes are needed, and no integration points are
  affected. This feature is entirely self-contained.
