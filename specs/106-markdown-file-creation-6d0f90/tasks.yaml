# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature implementation follows a straightforward five-task workflow across two phases:

  **Phase 1: Markdown File Creation and Validation** (Tasks 1-4, ~65 minutes)
  - Task 1 creates the file with H1 heading and prose
  - Tasks 2-4 implement comprehensive validation (structure, encoding, content)
  - All validation runs before git operations, ensuring file quality

  **Phase 2: Git Integration** (Task 5, ~15 minutes)
  - Task 5 stages, commits with conventional message, and pushes to remote
  - Depends on all Phase 1 tasks completing successfully
  - Uses subprocess with shell=False for safe command execution

  Each task follows the TDD cycle: RED (failing tests/assertions), GREEN (minimal implementation),
  REFACTOR (organize and improve code). This approach ensures all success criteria are met
  before moving to the next phase.

  The implementation is standalone (no external dependencies), transparent about all operations,
  and directly implements the specification requirements validated by feature 105.
