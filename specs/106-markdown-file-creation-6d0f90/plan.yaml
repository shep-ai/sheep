# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the standalone script pattern validated by feature 105. The implementation
  is a single self-contained Python script (`create_feature_106.py`) that:

  1. **Composes prose content** — Implementer manually chooses a topic and writes 2-3 sentences
  2. **Creates markdown file** — Writes test-tzghro.md to repository root with H1 heading + blank line + prose
  3. **Validates file** — Verifies structure, UTF-8 encoding, LF line endings, content, and size
  4. **Performs git operations** — Stages, commits with conventional message, and pushes to remote

  The script is self-contained (no external dependencies beyond Python stdlib), transparent about
  all operations, and directly implements the specification requirements.

  ## Key Design Decisions

  ### 1. Standalone Script Pattern (Not Helper Functions)
  **Chosen**: Single self-contained Python script with all logic explicit

  **Rationale**: Feature 105 validates this pattern works reliably. It provides clarity on
  implementation, requires no external module dependencies, is self-documenting, and aligns
  with recent successful features. Standalone is simpler than cross-module coupling.

  ### 2. Manual/Hardcoded Prose (Not AI-Generated)
  **Chosen**: Implementer manually composes 2-3 sentences about any topic

  **Rationale**: Specification explicitly allows \"any reasonable approach\" for prose generation.
  Manual composition requires no external dependencies, LLM infrastructure, or API keys.
  For a single-file feature, this is more efficient than setting up LLM services. Feature 105
  validates manual prose works well (\"The Beauty of Persistent Systems\").

  ### 3. Python pathlib with Explicit Encoding/Line Endings
  **Chosen**: `pathlib.Path.write_text(encoding='utf-8', newline='\\n')`

  **Rationale**: NFR-5 explicitly requires pathlib. The `newline='\\n'` parameter is critical
  to force Unix LF line endings on Windows systems, meeting NFR-2. The `encoding='utf-8'`
  parameter ensures UTF-8 without BOM (Python's default behavior). This approach is
  platform-independent, explicit, and validated by feature 105.

  ### 4. subprocess.run() for Git Operations (Not os.system or GitPython)
  **Chosen**: `subprocess.run(['git', ...], shell=False, check=True, capture_output=True)`

  **Rationale**: This is the standard, safe approach for command execution. `shell=False`
  prevents command injection. `check=True` enables early failure detection. `capture_output=True`
  allows error logging. Feature 105 validates this pattern works reliably. No external
  dependencies beyond Python stdlib.

  ### 5. Comprehensive Validation (Not Minimal)
  **Chosen**: Multi-stage validation covering structure, encoding, line endings, content, size

  **Rationale**: Encoding and line-ending issues are platform-dependent and easy to miss.
  Comprehensive validation ensures all success criteria are met before committing.
  Validators check: UTF-8 (no BOM), LF only (no CRLF), H1 heading, blank line, prose count,
  and file size. Early failure detection prevents invalid files being committed.

  ### 6. Implementer Free Topic Choice (Not Predefined List)
  **Chosen**: Implementer may choose any topic for the prose

  **Rationale**: Specification explicitly states \"Prose topic may be freely chosen by the
  implementer (any topic is acceptable)\". User requested \"about anything\", indicating
  maximum flexibility. Free choice enables natural prose composition without constraints
  and eliminates infrastructure overhead.

  ## Implementation Strategy

  ### Phase 1: File Creation and Validation
  - Task 1: Create the markdown file with H1 heading and prose content
  - Task 2: Implement file structure validation (heading, blank line, prose)
  - Task 3: Implement encoding and line-ending validation (UTF-8, LF)
  - Task 4: Implement content validation (sentence count, file size)

  Files created in Phase 1 enable all validations to run before git operations, catching
  errors early. Validation logic is separated by concern (structure, encoding, content)
  for clarity and maintainability.

  ### Phase 2: Git Integration
  - Task 5: Implement git operations (add, commit, push)

  Phase 2 only executes after Phase 1 completes successfully. This ensures the file
  meets all requirements before being committed and pushed.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding issues (CRLF on Windows)** | Use `newline='\\n'` parameter in pathlib.write_text() to force LF; validate line endings before committing |
  | **File overwrite** | Check file doesn't already exist before writing; fail with clear error if it does |
  | **Invalid git commit** | Hardcode exact commit message from specification; verify with subprocess capture_output |
  | **Platform differences** | Use pathlib for cross-platform path handling; explicit newline/encoding parameters; comprehensive validation |
  | **Incomplete prose** | Implement sentence counting validation; fail if not 2-3 sentences |
  | **BOM in UTF-8 file** | Validate file doesn't start with EF BB BF bytes (UTF-8 BOM); use Python's write_text() which doesn't add BOM by default |
  | **Git push failure** | Use subprocess check=True to detect failures; capture stderr for error messages |
  | **Invalid markdown** | Validate H1 heading on line 1, blank line on line 2, prose on remaining lines; fail on structural issues |
