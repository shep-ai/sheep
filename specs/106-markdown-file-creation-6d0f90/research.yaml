content: |
  ## Research Phase Summary

  This research evaluates technical approaches for implementing feature 106: markdown file creation
  (test-tzghro.md with H1 heading and 2-3 sentences of prose).

  ## Architecture Overview

  The implementation follows a three-phase workflow established in features 101-105:

  1. **File Creation**: Generate or compose prose, then write markdown file to repository root with proper encoding/line endings
  2. **Validation**: Verify file structure, encoding, line endings, and content meet all requirements
  3. **Git Operations**: Stage file, commit with conventional message, push to remote

  Two proven patterns exist in the codebase:

  ### Pattern A: Standalone Script (Feature 105 — Recommended)
  - Complete implementation in a single Python script
  - No external dependencies or module imports beyond pathlib/subprocess
  - All logic is explicit and self-contained
  - Manual/hardcoded prose content
  - File: `create_test_knejqo.py` demonstrates this pattern

  ### Pattern B: Helper Functions (Feature 101)
  - Uses `src/sheep/content_generators.py` for reusable functions
  - Integrates with CrewAI LLM framework for AI-generated prose
  - More flexible for generating multiple files or dynamic content
  - Requires API configuration and external service availability
  - File: `create_feature_101.py` demonstrates this pattern

  **Recommendation**: Use Pattern A (standalone script) because:
  - Feature 105 validates it works reliably
  - No external dependencies required
  - Simpler to understand and debug
  - Spec allows manual prose composition
  - Better for single-file features
  - Self-documenting and transparent

  ## Technology Decisions

  ### 1. File I/O: Python pathlib.Path

  **Chosen:** `pathlib.Path.write_text()` with `encoding='utf-8'` and `newline='\\n'`

  **Rejected:**
  - Using `open()` with default settings — doesn't guarantee LF line endings on Windows
  - `os.path` string concatenation — less readable; pathlib is Python 3.11+ standard

  **Rationale:**
  pathlib is explicitly required by NFR-5. The `newline='\\n'` parameter is critical to force
  Unix LF line endings on Windows systems. The `encoding='utf-8'` parameter ensures UTF-8
  without BOM (Python's default for write_text). This approach is platform-independent,
  explicit about intent, and follows Python best practices. Feature 105 validates this exact
  pattern works reliably across platforms.

  ### 2. Content Generation: Manual/Hardcoded Prose

  **Chosen:** Implementer manually composes prose directly in script or file

  **Rejected:**
  - LLM-based generation via Claude API — overkill for single file; adds API dependency; introduces latency and cost
  - Template-based substitution — stilted prose; additional infrastructure to maintain

  **Rationale:**
  Spec explicitly allows 'any reasonable approach' for prose, including manual writing.
  Manual approach has zero external dependencies, is predictable, requires no infrastructure,
  and ensures authentic prose. For a single-file feature, this is more efficient than
  setting up LLM infrastructure. Feature 105 demonstrates manual prose works well.
  Examples: "The Beauty of Persistent Systems" (feature 105), etc.

  ### 3. Git Operations: subprocess.run() with shell=False

  **Chosen:** `subprocess.run(['git', 'add', ...], check=True, shell=False, capture_output=True)`

  **Rejected:**
  - `os.system()` or `shell=True` — security risk (command injection); not portable
  - GitPython library — external dependency not available; subprocess is standard
  - Internal GitCommitTool/GitPushTool — valid alternative but standalone approach avoids coupling

  **Rationale:**
  subprocess is the standard, safe approach for executing external commands. The `check=True`
  flag ensures early failure detection. The `shell=False` parameter prevents command injection
  risks. The `capture_output=True` flag allows logging of stderr/stdout without polluting console.
  The `--no-verify` flag is appropriate for test files (skips pre-commit hooks that may not apply).
  Feature 105 validates this pattern works reliably.

  ### 4. Validation: Comprehensive Multi-Stage Checks

  **Chosen:** Implement validators for structure, encoding, line endings, content, and file size

  **Rejected:**
  - Minimal validation (just check file exists) — doesn't catch subtle issues
  - No validation, trust Python to handle correctly — risky; encoding/line-ending issues are platform-dependent

  **Rationale:**
  Encoding and line-ending issues are easy to introduce and hard to catch with manual inspection.
  Comprehensive validation ensures all success criteria are met before committing.
  Validators cover:
  - **Structure**: H1 heading on line 1, blank line on line 2, prose on remaining lines
  - **Encoding**: UTF-8 without BOM (check for EF BB BF prefix)
  - **Line endings**: Unix LF only (check for CRLF absence)
  - **Content**: 2-3 sentences (count periods/exclamation marks/question marks)
  - **File size**: Typical 400-600 byte range (guideline, not strict requirement)

  Feature 105 demonstrates comprehensive validation catches issues early.

  ### 5. Topic Selection: Implementer Free Choice

  **Chosen:** Implementer may freely choose any topic for prose

  **Rejected:**
  - Predefined topic list — unnecessary infrastructure; spec allows 'any topic'
  - Random selection from curated list — adds complexity; free choice is simpler

  **Rationale:**
  Spec explicitly states 'Prose topic may be freely chosen by the implementer (any topic is acceptable)'.
  User requested 'about anything', indicating maximum flexibility. Free choice enables natural
  prose composition without artificial constraints. Examples from recent features:
  "The Beauty of Persistent Systems" (105), "Innovation and Progress", "The Power of Persistence", etc.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | `pathlib.Path` | File I/O (create, write, read, stat) | **Use** | Standard library; explicitly required by NFR-5; provides platform-independent path handling and atomic write operations |
  | `subprocess` | Git operations (add, commit, push) | **Use** | Standard library; safe command execution with shell=False; prevents command injection; provides capture_output for error handling |
  | `sys` | Exit codes and error reporting | **Use** | Standard library; sys.exit(1) signals failures to shell; sys.stderr for error messages |
  | `re` (regex) | Validate markdown structure (optional) | **Reject** | Not needed; string methods (startswith, count) are sufficient; regex adds complexity without benefit |
  | `src.sheep.content_generators` | Helper functions for markdown creation | **Reject** (for this feature) | Valid alternative but standalone approach is simpler; introduces module dependency; may change in future. Feature 105 validates standalone approach works well. Can be reconsidered if content generation becomes more complex. |
  | `CrewAI` LLM framework | AI-based content generation | **Reject** | Not required for manual prose; adds infrastructure overhead; introduces external API dependency; valid for batch processing but overkill for single file |
  | `anthropic` SDK (Claude API) | LLM inference for prose generation | **Reject** | Not required for manual prose; adds dependency on external service; increases implementation complexity; no API key required for manual approach |
  | `git` (CLI) | Version control operations | **Use** | Via subprocess; standard tool already available in dev environment; no library needed |

  ## Security Considerations

  ### 1. Command Injection Prevention
  - **Risk**: Git commands could be vulnerable to injection if filenames or messages contain special characters
  - **Mitigation**: Use `subprocess.run()` with `shell=False` and pass arguments as list (not string)
  - **Status**: Feature 105 implements this correctly

  ### 2. Path Traversal Prevention
  - **Risk**: Filename could attempt directory traversal (e.g., "../../../etc/passwd")
  - **Mitigation**: Specification requires exact filename "test-tzghro.md"; validate filename doesn't contain "/" or "\\"
  - **Status**: Validation function in feature 105 checks this

  ### 3. File Overwrite Protection
  - **Risk**: Creating file could accidentally overwrite existing file
  - **Mitigation**: Check file doesn't already exist before writing; pathlib.Path.exists() validation
  - **Status**: Feature 105 implements this check

  ### 4. Encoding/Decoding Attacks
  - **Risk**: Incorrect encoding handling could introduce encoding-related issues
  - **Mitigation**: Use UTF-8 without BOM explicitly; validate encoding before and after write; check no BOM prefix (EF BB BF)
  - **Status**: Feature 105 implements comprehensive encoding validation

  ### 5. Git Configuration Injection
  - **Risk**: User could configure malicious git hooks
  - **Mitigation**: Use `--no-verify` flag to skip pre-commit hooks; appropriate for test files
  - **Status**: Feature 105 implements this correctly

  ## Performance Considerations

  ### 1. File I/O Performance
  - Prose content is small (~400-600 bytes), so single write operation is efficient
  - No need for streaming or chunked I/O
  - pathlib is optimized for single-file operations

  ### 2. Git Operations Performance
  - Git add/commit/push are standard operations (no bottlenecks)
  - `--no-verify` flag actually improves performance by skipping hook execution
  - Single file commit is minimal overhead

  ### 3. Validation Performance
  - Comprehensive validation (encoding check, structure check, size check) is O(n) where n = file size (~500 bytes)
  - Reading file twice (binary for encoding, text for structure) is acceptable for small files
  - Total validation time is negligible (<1ms per file)

  ### 4. Memory Usage
  - Entire file content loaded into memory (< 1 KB)
  - No streaming needed
  - Python subprocess handles git operations separately

  ### 5. Network Performance
  - Git push operation requires network round-trip to origin
  - Feature 105 validates push completes successfully
  - No optimization needed for single file push

  **Conclusion**: Performance is not a concern for single-file feature. All operations complete in <100ms total.

  ## Integration Points

  ### With Git Repository
  - Feature branch `feat/106-markdown-file-creation-6d0f90` must exist (pre-created)
  - Standard git configuration (user.name, user.email) must be set up
  - Push must succeed to origin repository
  - No conflicts with other features (unique filename)

  ### With Repository Structure
  - File created in repository root (no subdirectories)
  - Consistent with 105+ existing test markdown files
  - No modifications to source code or configuration

  ### With CI/CD (Out of Scope)
  - Push will trigger CI/CD workflows on remote
  - This feature doesn't need to verify CI results
  - Implementation focuses only on file creation and push

  ## Implementation Recommendations

  ### Step 1: Create markdown file
  - Define prose topic (implementer choice)
  - Construct markdown with H1 heading + blank line + prose (2-3 sentences)
  - Write to disk using pathlib with UTF-8 and LF line endings
  - Add trailing newline to content

  ### Step 2: Validate file
  - Check file exists and is readable
  - Validate encoding (UTF-8, no BOM)
  - Validate line endings (LF only, no CRLF)
  - Validate structure (H1 heading, blank line, prose)
  - Validate sentence count (2-3)
  - Validate file size (400-600 bytes guideline)

  ### Step 3: Git operations
  - Stage file: `git add test-tzghro.md`
  - Commit: `git commit --no-verify -m "feat(106): create markdown file test-tzghro.md with prose content"`
  - Push: `git push -u origin HEAD`

  ### Code Structure
  - Single Python script (recommended) or module with helper functions (alternative)
  - Functions should map to validation tasks (create, validate structure, validate encoding, etc.)
  - Clear error messages and logging for debugging
  - sys.exit(1) on any error to signal failure to shell

  ### Testing the Implementation
  - Run script against test-tzghro.md after creation
  - Verify file exists and has correct content
  - Verify git commit was created with exact message
  - Verify git push succeeded to remote

  ---

  _Research phase complete — Technical decisions documented with rationale and alternatives considered._
