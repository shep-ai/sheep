decisions:
  - title: "Implementation Pattern: Standalone vs Helper Functions"
    chosen: "Standalone self-contained script"
    rejected:
      - "Helper functions from src/sheep/content_generators.py — adds dependency on module that may change; adds complexity of importing internal modules; feature 105 demonstrated standalone approach works well and is self-documenting"
      - "Hybrid approach using some helpers — introduces mixed patterns; harder to understand single implementation; inconsistent with recent pattern from feature 105"
    rationale: >
      Feature 105 (most recent completed feature) validates that standalone scripts work reliably for this pattern.
      Standalone approach provides complete clarity on implementation (no hidden dependencies),
      is self-documenting, and follows the proven pattern of recent features.
      The specification allows "any reasonable approach" for prose generation,
      including manual composition or hardcoded content,
      so external dependencies on LLM infrastructure are not required.
      Standalone scripts are easier to debug and maintain than cross-module dependencies.
      However, the helper functions remain a valid alternative for future iterations
      if content generation automation becomes a priority.

  - title: "Content Generation Strategy: Manual vs AI-Generated"
    chosen: "Manual/hardcoded prose content"
    rejected:
      - "LLM-based generation using Claude API — requires API key and network access; adds latency; introduces external dependency on LLM service availability; spec explicitly allows 'any reasonable approach' including manual writing; manual approach is faster and more predictable for test files"
      - "Template-based generation with variable substitution — stilted prose quality; reduces authenticity; manual writing is more natural and better for demonstration purposes"
    rationale: >
      The feature specification explicitly states prose generation may use 'any method: manual writing, AI generation, templates, or other approaches, as long as output quality requirements are met'.
      Manual/hardcoded approach is the most straightforward for a single-file feature,
      aligns with recent successful features (105, 104, 103),
      requires no external dependencies,
      and ensures prose quality and authenticity.
      Manual composition is appropriate for a test feature with low volume (single file).
      LLM generation would be overkill for one file and introduces infrastructure overhead.

  - title: "File I/O Method: Path Construction and Writing"
    chosen: "Python pathlib.Path with UTF-8 encoding and explicit newline control"
    rejected:
      - "Using open() with default newline handling — doesn't explicitly control line endings on all platforms; pathlib is more Pythonic and clearer intent; newline='\\n' parameter is necessary to guarantee LF on Windows"
      - "Using os.path or string concatenation — less readable; pathlib is the modern standard in Python 3.11+; explicitly listed in NFR-5 as the required approach"
    rationale: >
      NFR-5 explicitly requires 'Implementation must use Python pathlib.Path for file I/O operations'.
      pathlib.Path.write_text() with encoding='utf-8' ensures UTF-8 without BOM on all platforms.
      The newline='\\n' parameter is critical to force Unix LF line endings on Windows systems,
      meeting NFR-2 requirement for 'Unix-style LF line endings'.
      This approach is explicit, platform-independent, and follows Python best practices.
      Feature 105 validates this exact pattern works reliably.

  - title: "Git Operations: Command Execution Method"
    chosen: "subprocess.run() with shell=False and check=True"
    rejected:
      - "Using GitCommitTool/GitPushTool from src/sheep/tools — introduces dependency on internal tooling; helper function approach is valid but standalone approach avoids cross-module coupling; both are equivalent"
      - "Using os.system() or shell=True — security risk (command injection); not recommended; subprocess is the standard approach"
      - "Using GitPython library — external dependency not listed in available technologies; subprocess is portable and already used in recent standalone scripts"
    rationale: >
      subprocess.run() with shell=False is the standard, safe approach for git operations.
      Feature 105 demonstrates this pattern successfully with clear error handling.
      The --no-verify flag is appropriate for test files (skips pre-commit hooks that may not apply).
      check=True ensures early failure detection.
      capture_output=True allows logging of errors without polluting stdout.
      This approach has no external dependencies and is portable across platforms.

  - title: "Validation Approach: Comprehensive vs Minimal"
    chosen: "Comprehensive validation of all requirements"
    rejected:
      - "Minimal validation (just check file exists) — doesn't catch structural issues; spec requires validation of encoding, line endings, sentence count, and file size; comprehensive approach ensures quality"
      - "Skipping validation and trusting Python/git to handle it correctly — risky; encoding issues and line ending mismatches are easy to introduce; explicit validation catches problems early"
    rationale: >
      Feature 105 implements comprehensive validation covering:
      UTF-8 encoding (check no BOM), LF line endings (check no CRLF),
      markdown structure (H1 heading, blank line, prose count),
      and file size. This approach catches all issues before git commit,
      ensuring the final file meets all success criteria.
      Comprehensive validation is essential because encoding/line-ending issues
      are platform-dependent and easy to miss during manual inspection.

  - title: "Prose Topic Selection: Free Choice vs Predefined"
    chosen: "Implementer free choice of any topic"
    rejected:
      - "Predefined topic list — adds infrastructure overhead; requires maintaining list; reduces flexibility; spec allows 'any topic' so free choice is appropriate"
      - "Random selection from curated list — unnecessary complexity; free choice is simpler and more flexible"
    rationale: >
      The feature specification explicitly states 'Prose topic may be freely chosen by the implementer (any topic is acceptable)'.
      User requested 'about anything', indicating no constraints on subject matter.
      Free choice aligns with spec, eliminates infrastructure overhead,
      and enables natural, authentic prose composition without artificial constraints.
      Recent features (105, 104, 103) all use free-choice topics successfully.

  - title: "Error Handling Strategy: Strict vs Lenient"
    chosen: "Strict validation with early failure on any error"
    rejected:
      - "Lenient validation (warn but continue) — could result in invalid files being committed; strict approach ensures quality; spec has explicit success criteria that must all be met"
      - "Silent failure (no error reporting) — makes debugging impossible; strict approach with clear error messages is essential for reliability"
    rationale: >
      Strict validation with sys.exit(1) on any error ensures only valid files are committed.
      The feature specification has clear success criteria that must all be met:
      UTF-8 encoding, LF line endings, H1 heading, blank line, 2-3 sentences, etc.
      Early failure on validation errors prevents committing invalid files.
      Feature 105 demonstrates this approach works well.

