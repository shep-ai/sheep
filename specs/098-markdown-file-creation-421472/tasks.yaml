content: |
  ## Summary

  Feature 098 consists of five ordered tasks across three phases:

  **Phase 1: Markdown File Creation (Task 1)**
  Create test-ar046u.md at repository root with H1 heading and 2-3 sentences of prose.
  Topic selection is flexible; choose any generic/universal subject. Use pathlib.Path.write_text()
  with explicit encoding and newline parameters to ensure UTF-8 without BOM and Unix LF line endings.

  **Phase 2: Quality Validation (Tasks 2-4)**
  Validate the created file meets all technical requirements across three checks:
  - Encoding: UTF-8 without BOM
  - Line endings: Unix LF only, no CRLF
  - Size and syntax: 320-600 bytes, valid markdown, proper structure (H1 + blank + prose)

  **Phase 3: Git Integration (Task 5)**
  Complete the git workflow: stage file, commit with conventional message format,
  push to feature branch, and verify clean working tree.

  ## Task Ordering & Dependencies

  Tasks are ordered by dependency:
  - Task 1 (file creation) must complete first
  - Tasks 2-4 (validation) depend on Task 1 and can run in any order (but sequenced for clarity)
  - Task 5 (git) depends on Task 4 (final validation) to ensure quality before commit

  This sequence ensures:
  1. File is created with all required content
  2. File meets all technical requirements before committing
  3. Validated artifact is committed to version control
  4. Clean working tree after push

  ## Effort Breakdown

  | Phase | Tasks | Time | Total |
  | ----- | ----- | ---- | ----- |
  | Phase 1: File Creation | Task 1 | 20-25 min | 20-25 min |
  | Phase 2: Validation | Tasks 2-4 | 7-11 min | 7-11 min |
  | Phase 3: Git Integration | Task 5 | 3-5 min | 3-5 min |
  | **Total** | **5 tasks** | — | **35-45 minutes** |

  This aligns with the spec estimate of 10-15 minutes of focused work plus validation overhead.
  The task breakdown provides granular tracking and clear acceptance criteria for each phase.

  ## TDD Approach

  **Task 1** uses full TDD cycle (RED-GREEN-REFACTOR) since it involves creating content:
  - RED: Define requirements (H1 heading, blank line, prose structure)
  - GREEN: Write prose and create file
  - REFACTOR: Review grammar, tone, and coherence

  **Tasks 2-5** use validation/shell checks (no TDD, set to null) since they are verification
  and git operations without code testing. Validation is performed via shell commands and
  manual review per established pattern from feature 070.
