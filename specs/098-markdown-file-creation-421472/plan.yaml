# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature is a purely additive implementation of a well-established pattern demonstrated across
  97+ identical features (069-097). The feature creates a single markdown file artifact at the repository
  root following a proven structure: H1 markdown heading + blank line + 2-3 sentences of prose content.

  ### Integration with Existing Codebase

  The implementation:
  - **Does not depend on source code** — no /src/sheep/ imports or modifications
  - **Does not modify configuration** — no changes to pyproject.toml, .env, or settings
  - **Does not impact tests** — no test infrastructure changes
  - **Does not affect documentation** — no README or docs updates
  - **Is purely additive** — creates one new file, zero modifications to existing files

  The feature branch (feat/098-markdown-file-creation-421472) is pre-created and checked out.
  Implementation only requires file creation and standard git operations (add/commit/push).

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text() with Explicit Parameters

  **Decision:** Use `Path("test-ar046u.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:**
  - Built-in Python standard library (Python 3.11+) — no external dependencies
  - Explicitly controls both encoding (UTF-8 without BOM) and line endings (Unix LF)
  - Atomic write operation — simplest, most reliable approach for single file creation
  - Proven pattern from feature 070 (implementation.py line 47)
  - Directly satisfies FR-4 requirement which specifies this exact method

  **Alternatives considered and rejected:**
  - Standard `open()` context manager — more verbose, requires manual encoding handling, less Pythonic
  - External libraries (filesystem, pydantic) — unnecessary complexity and dependencies for simple file write

  ### 2. Prose Content: Static, Human-Written with Generic/Universal Topic

  **Decision:** Write prose manually with a generic/universal topic (science, philosophy, observations, etc.)

  **Rationale:**
  - Static prose is simple, fast, and proven across 97+ prior test files
  - Flexible topic selection per spec (any appropriate subject acceptable)
  - Natural file size (H1 heading + blank line + 2-3 sentences) naturally hits 320-600 byte target
  - Fits within 10-15 minute implementation timeline
  - Examples from existing test files: persistence (test-u6624u.md), progress (test-uxhn30.md), bioluminescence (test-gt1tgb.md)

  **Alternatives considered and rejected:**
  - Programmatic generation (AI APIs, random generators) — adds latency, violates simplicity
  - Template-based system — unnecessary abstraction for single-use artifact

  ### 3. Encoding: Explicit UTF-8 Without BOM

  **Decision:** Use `encoding="utf-8"` parameter in Path.write_text()

  **Rationale:**
  - Platform-independent (consistent across Windows/Linux/macOS)
  - pathlib automatically handles UTF-8 without BOM correctly
  - Satisfies NFR-3: "File encoding must be UTF-8 without byte order mark"
  - Verifiable via `file test-ar046u.md` command (returns "UTF-8" or "ASCII text")

  **Alternatives considered and rejected:**
  - System default encoding — platform-dependent (cp1252 on Windows, UTF-8 on Linux)
  - Manual BOM stripping — unnecessary, pathlib handles correctly

  ### 4. Line Endings: Unix LF via newline Parameter

  **Decision:** Use `newline="\n"` parameter in Path.write_text() to enforce Unix LF line endings

  **Rationale:**
  - Forces literal "\n" characters without platform conversion (works identically on all platforms)
  - Satisfies NFR-4: "Line endings must be Unix-style (LF: \n only, not CRLF: \r\n)"
  - Proven pattern from feature 070 validation (lines 91-94 CRLF detection)
  - Reliable, platform-independent, requires no post-processing

  **Alternatives considered and rejected:**
  - System defaults (os.linesep) — produces CRLF on Windows, violates requirement
  - Post-processing conversion — adds latency, error-prone, unnecessary

  ### 5. Git Workflow: subprocess.run() for Direct Command Execution

  **Decision:** Use shell commands via subprocess.run() for `git add`, `git commit`, `git push`

  **Rationale:**
  - No external dependencies (subprocess is stdlib)
  - Direct, reliable command execution without abstraction overhead
  - Three simple sequential commands don't justify external library (e.g., GitPython)
  - Feature branch is pre-created; implementation only needs add/commit/push
  - Proven pattern from prior features

  **Alternatives considered and rejected:**
  - GitPython library — external dependency, slower imports, unnecessary for 3 simple commands
  - Direct .git directory manipulation — complex, error-prone, violates principle of using standard tools

  ### 6. File Size Target: 320-600 Bytes (Natural Range)

  **Decision:** Target 320-600 byte range based on observed pattern from existing test files

  **Rationale:**
  - Analysis of 97+ existing test files shows consistent natural range: ~320-600 bytes
  - Structure naturally produces this size: H1 heading (~20-40 chars) + blank line (1) + prose (250-400 chars) + trailing newline
  - No artificial padding or truncation needed; standard prose hits target naturally
  - Satisfies success criteria SF-8: "File size is 320-600 bytes"

  **Alternatives considered and rejected:**
  - No size validation — fails success criteria, unmeasurable
  - Strict byte enforcement with padding — brittle, artificial, violates simplicity

  ### 7. Validation: Manual Post-Creation Checks

  **Decision:** Validate file properties and structure via manual checks after creation

  **Rationale:**
  - Confirms all measurable success criteria are met
  - Validation checks: file existence, H1 heading structure, prose (2-3 sentences), UTF-8 encoding,
    Unix LF line endings, file size, markdown syntax validity, grammar coherence
  - Takes ~3-5 minutes (quick shell checks + visual prose review)
  - Proven pattern from feature 070 (implementation.py lines 58-141)

  **Alternatives considered and rejected:**
  - No validation — risks silent failures, unmeasurable criteria
  - Automated test suite — unnecessary complexity for simple file creation

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3** reflects the natural workflow:

  1. **Phase 1: File Creation** — Must complete first; phases 2 and 3 depend on having a file to validate and commit
  2. **Phase 2: Validation** — Must complete before git integration; ensures quality before committing
  3. **Phase 3: Git Integration** — Final step; commits and pushes validated artifact

  This sequence ensures:
  - The file meets all requirements before being committed
  - Clean, validated state is committed to version control
  - No rework or cleanup needed after push
  - Efficient 10-15 minute timeline (create ~5 min, validate ~3 min, git ~2-5 min)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding incorrect (not UTF-8 or includes BOM)** | Use explicit `encoding="utf-8"` parameter; verify with `file test-ar046u.md` returns "UTF-8" |
  | **Line endings mixed (CRLF on Windows)** | Use explicit `newline="\n"` parameter; verify with `grep -P '\r'` (should return no matches) |
  | **File size outside acceptable range** | Structure prose naturally (H1 + 2-3 sentences) to hit 320-600 byte range; verify with `wc -c` |
  | **Prose quality poor (grammar, coherence)** | Write prose manually; perform visual review of grammar and coherence before commit |
  | **Markdown syntax invalid** | Verify H1 heading format (`# Title`), blank line separator, 2-3 sentences; test with markdown parser |
  | **File not staged/committed properly** | Verify `git status` shows file in staging area after add; verify `git log --oneline` shows correct commit message |
  | **Push fails or commits to wrong branch** | Feature branch is pre-created and checked out; verify `git push` output shows correct branch |
  | **Uncommitted changes after implementation** | Verify clean working tree with `git status` shows nothing to commit after push |

  ## Dependencies Validation

  All dependencies listed in spec are satisfied:
  - ✅ Feature branch `feat/098-markdown-file-creation-421472` pre-exists and is checked out
  - ✅ File system permissions: write access to repository root (standard development environment)
  - ✅ Established pattern: 97+ test files provide proven precedent (features 069-097)
  - ✅ Git configuration: user.name/user.email assumed configured (standard development setup)
  - ✅ Python standard library: pathlib available in Python 3.11+

  No blockers identified; implementation can proceed as planned.
