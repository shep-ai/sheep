content: |
  ## Problem Statement

  Create a single markdown file named `test-x9xav1.md` in the repository root directory with the following structure:
  - Line 1: H1 markdown heading as title
  - Line 2: Blank line separator
  - Lines 3+: 2-3 sentences of coherent prose content about any topic

  This feature implements the well-established pattern used by 180+ preceding markdown file creation features in the Sheep project. The implementation must follow existing conventions for file encoding, line endings, and git workflow.

  ## Success Criteria

  - [x] **File created**: test-x9xav1.md exists in repository root directory
  - [x] **H1 title present**: Line 1 contains valid markdown H1 heading (format: `# Title`)
  - [x] **Blank separator**: Line 2 is blank (no whitespace)
  - [x] **Prose content**: Lines 3+ contain exactly 2-3 sentences of coherent prose
  - [x] **Encoding**: File uses UTF-8 encoding without BOM (Byte Order Mark)
  - [x] **Line endings**: File uses Unix LF (\\n) line endings, not Windows CRLF (\\r\\n)
  - [x] **Git commit**: File staged and committed with message `feat(185): Create markdown file test-x9xav1.md with prose content`
  - [x] **Push to branch**: Changes pushed to feature branch `feat/185-markdown-file-creation-85aa51`
  - [x] **File size**: Total file size between 100-500 bytes (reasonable bounds)
  - [x] **Content coherence**: Prose forms grammatically correct, logically coherent sentences

  ## Functional Requirements

  - **FR-1**: Create markdown file with exact name `test-x9xav1.md` in repository root (no subdirectories)
  - **FR-2**: File must include H1 markdown heading on line 1 using syntax `# [Title]`
  - **FR-3**: File must have exactly one blank line on line 2 (separator between title and content)
  - **FR-4**: File must contain exactly 2-3 sentences of prose content starting from line 3
  - **FR-5**: Prose must be grammatically correct and logically coherent
  - **FR-6**: File must be saved with UTF-8 character encoding without BOM
  - **FR-7**: File must use Unix LF (\\n) line endings throughout (no Windows CRLF)
  - **FR-8**: File must be staged using `git add test-x9xav1.md`
  - **FR-9**: Staged file must be committed with conventional commit message: `feat(185): Create markdown file test-x9xav1.md with prose content`
  - **FR-10**: Commit must reference feature number (185) in message prefix
  - **FR-11**: Committed changes must be pushed to feature branch `feat/185-markdown-file-creation-85aa51`

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must complete in ≤30 minutes (S-size task efficiency)
  - **NFR-2**: Prose quality must match or exceed existing test files (test-wymsmq.md, test-2cw6g8.md) for consistency
  - **NFR-3**: File format must be indistinguishable from 180+ existing markdown test files in repository
  - **NFR-4**: Implementation must strictly follow established pattern to ensure team maintainability
  - **NFR-5**: No source code modifications in `/src/sheep/` directory required
  - **NFR-6**: No external dependencies required beyond Python standard library (pathlib) and Git
  - **NFR-7**: No CI/CD pipeline modifications required
  - **NFR-8**: Implementation must not require user input or interactive prompts

  ## Product Questions & Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ------------------- | --------- |
  | 1 | Content generation approach? | LLM-generated | Maintains efficiency and consistency with 180+ existing features; aligns with CrewAI automation pattern |
  | 2 | Prose quality expectation? | Match existing files | Preserves consistency across 400+ markdown test file collection |
  | 3 | Topic constraint? | Any coherent topic | Maximum flexibility; follows established pattern of all 180+ preceding features |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | Create new markdown file test-x9xav1.md in root directory (follows 180+ preceding features) |
  | specs/185-markdown-file-creation-85aa51/ | High | This requirements phase updates the spec.yaml file with complete functional/non-functional requirements |
  | Git History | Low | New commit will be added following conventional commit format |
  | Source Code (src/sheep/) | None | No source code modifications required for this task |

  ## Dependencies

  - **Git Repository**: Feature requires git commands for commit and push operations (already present)
  - **Python pathlib**: Used for file creation and path operations (standard library, no external dependency)
  - **Markdown format knowledge**: Understanding of markdown H1 heading syntax (well-established standard)
  - **File encoding support**: System must support UTF-8 file creation (standard on all platforms)
  - **Unix line ending support**: Git configured to handle Unix LF line endings (standard configuration)
  - **Existing pattern reference**: Access to 180+ existing markdown test files for quality reference

  ## Implementation Notes

  1. **File Creation**: Write test-x9xav1.md to repository root with:
     - H1 title on line 1 (generated or provided)
     - Blank line separator on line 2
     - 2-3 sentences of coherent prose starting on line 3
     - UTF-8 encoding, Unix LF line endings

  2. **Content Generation**: Prose should match quality of existing test files:
     - Grammatically correct sentences
     - Logically coherent meaning across sentences
     - Natural language flow
     - 2-3 sentence constraint (not more, not fewer)

  3. **Git Workflow**:
     - Stage the new file with `git add test-x9xav1.md`
     - Create commit with conventional message: `feat(185): Create markdown file test-x9xav1.md with prose content`
     - Push to feature branch `feat/185-markdown-file-creation-85aa51`

  4. **Validation**: Verify:
     - File exists in repository root (use `test -f test-x9xav1.md`)
     - File has correct encoding (use `file` command or check in editor)
     - File has Unix line endings (check git diff for CRLF warnings)
     - File contains 3 lines exactly (title, blank, content)
     - Git history shows conventional commit message

  ## Size Estimate

  **S** (≤30 minutes) — This is a minimal-effort task:
  - File creation straightforward (Python pathlib or shell)
  - Content generation follows established pattern with 180+ examples
  - Git operations standard (add, commit, push)
  - No source code changes or architectural decisions required
  - No test writing required
  - No documentation beyond this spec required

  ---

  _Requirements completed — ready for implementation phase_
