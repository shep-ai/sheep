content: |
  ## Task Breakdown Summary

  This feature implementation consists of 4 concrete tasks across 2 phases:

  **Phase 1: File Creation & Validation**
  - Task 1 (10 min): Create markdown file with H1 title and coherent prose
  - Task 2 (8 min): Validate file format, encoding, and structure

  **Phase 2: Git Integration**
  - Task 3 (5 min): Stage, commit, and verify conventional message
  - Task 4 (5 min): Push changes to remote feature branch

  **Total Effort:** ~28 minutes of actual implementation work

  ## Task Ordering and Dependencies

  Tasks are ordered by logical dependency:
  1. Create file (no dependencies) — must complete before validation
  2. Validate file — depends on task-1 creation
  3. Commit file — depends on task-2 validation completing
  4. Push to remote — depends on task-3 commit

  This ordering ensures:
  - File is created before any git operations
  - File format is validated before committing (fail fast principle)
  - Changes are committed locally before pushing
  - Push is final step (immutable on remote)

  ## TDD Approach

  Each task follows RED-GREEN-REFACTOR cycle:

  **RED:** Define desired behavior with assertions/tests that currently fail
  - Ensures we understand requirements before implementing
  - Prevents scope creep (only implement what test requires)
  - Creates clear success criteria

  **GREEN:** Implement minimal code to make test pass
  - Creates functionality with minimum complexity
  - Avoids over-engineering or adding unnecessary features
  - Focuses on the specific requirement

  **REFACTOR:** Clean up, verify, and validate implementation
  - Improves code quality without changing behavior
  - Verifies implementation matches specification
  - Ensures no regressions or side effects

  ## Validation Strategy

  Each task includes specific validation steps:
  - File format validation (encoding, line endings, size)
  - Markdown syntax validation (CommonMark compliance)
  - Git workflow validation (commit message, branch, tracking)
  - Content validation (meaningful prose, correct structure)

  Validation is embedded in REFACTOR phase, ensuring quality before moving to next task.

  ## Success Metrics

  Feature is complete when:
  1. File test-x9xav1.md exists at repository root ✓
  2. File contains valid markdown with H1 heading and prose ✓
  3. File properties match specification (UTF-8, LF, 350-600 bytes) ✓
  4. File is committed with conventional message on feature branch ✓
  5. Changes are pushed to remote and visible on GitHub ✓

  All tasks must be completed in order. No task can be skipped without failing the feature.

  ## Notes for Implementation

  - **Task 1 (File Creation):** The most time-intensive task (10 min) involves composing
    coherent, meaningful prose that matches quality of existing test files. Technical
    file creation is straightforward (2-3 lines of Python code using pathlib).

  - **Task 2 (Validation):** Can be automated with file command, du, and markdown validators,
    but requires manual review of prose for semantic meaning (cannot be fully automated).

  - **Task 3 (Commit):** Straightforward git operations; commit message format must exactly
    match specification to pass validation.

  - **Task 4 (Push):** Final verification step; validates that changes are successfully
    published to remote and ready for pull request review.

  **Effort Distribution:**
  - File composition (coherent prose): ~5 minutes
  - Technical implementation: ~3 minutes
  - Validation and verification: ~8 minutes
  - Git workflow: ~12 minutes
