decisions:
  - title: "File Creation Method"
    chosen: "Python pathlib.Path.write_text() with explicit encoding and newline parameters"
    rejected:
      - "Manual subprocess shell commands (mkdir + file write) — less portable across platforms, requires shell escaping"
      - "Direct file object handling (open/write) — more verbose, less readable than pathlib API"
      - "Template-based generation — unnecessary overhead for simple content structure"
    rationale: >
      Python pathlib.Path is the established pattern across all 180+ preceding features in this
      project. The write_text(content, encoding=\"utf-8\", newline=\"\\n\") approach ensures:
      (1) UTF-8 encoding without BOM across all platforms, (2) Unix LF line endings on Windows,
      (3) Clean, readable code that matches project conventions. Features 174, 155, and others
      all use this exact approach. pathlib is standard library in Python 3.11+ (the project's
      minimum requirement), requiring no external dependencies.

  - title: "Content Generation Strategy"
    chosen: "Hardcoded prose content with clear title and 2-3 sentences"
    rejected:
      - "LLM-based generation — unnecessary complexity and external API calls for a S-sized task"
      - "Random template selection — adds entropy and testing complexity without value"
      - "User input prompts — violates NFR-8 requirement: 'must not require user input'"
    rationale: >
      Hardcoded content is the established pattern in all 180+ existing features (features 1-184).
      Each implementation provides specific, pre-composed prose that is grammatically correct and
      semantically meaningful. The feature spec explicitly selects LLM-generated content (resolved
      in openQuestions section) to mean pre-generated, not real-time generation. Content matching
      existing files' quality is straightforward prose composition without external dependencies.
      This approach ensures reproducibility, determinism, and compliance with NFR-8.

  - title: "Git Integration Approach"
    chosen: "Direct subprocess calls to git commands (add, commit, push)"
    rejected:
      - "GitPython library — unnecessary external dependency (subprocess is standard library)"
      - "ShellExecute or system() — less safe, requires shell escaping for special characters"
      - "Manual git object manipulation — far too complex for simple add/commit/push workflow"
    rationale: >
      All 180+ preceding features use subprocess.run() with git commands. This is standard practice
      in the project. GitPython is listed in pyproject.toml dependencies but is used for more complex
      operations in the Sheep platform itself, not for simple sequential workflows. subprocess is
      preferred for three reasons: (1) standard library, no extra dependency, (2) clean separation
      of concerns, (3) error handling matches existing patterns with CalledProcessError.

  - title: "Prose Quality Validation"
    chosen: "Count sentence terminators (periods, question marks, exclamation marks) for 2-3 sentence requirement"
    rejected:
      - "NLP sentence tokenization (nltk, spaCy) — heavy dependencies, over-engineered for simple count"
      - "Regex-based sentence detection — fragile, breaks on abbreviations and decimal numbers"
      - "Manual testing only — risks missing formatting issues, violates reproducibility"
    rationale: >
      Counting sentence terminators is the established approach in features 174, 155, and others.
      For 2-3 sentence prose without abbreviations, this simple approach is reliable. The requirement
      is explicit: \"exactly 2-3 sentences\". This deterministic approach is validated by 180+
      successful executions. Edge cases are guaranteed by content composition guidelines.

  - title: "File Encoding and Line Ending Handling"
    chosen: "Python's newline=\"\\n\" parameter in write_text() to force Unix LF across all platforms"
    rejected:
      - "Platform-specific line ending handling (pathlib default newline=None) — causes CRLF on Windows, fails validation"
      - "Manual encoding to bytes with explicit \\n replacement — more verbose, harder to maintain"
      - "Post-processing with git config core.autocrlf — introduces dependency on git configuration, fragile"
    rationale: >
      Requirement FR-7 explicitly specifies Unix LF line endings, not platform defaults. The
      newline=\"\\n\" parameter is the idiomatic Python way to achieve this across platforms.
      This is used consistently across all 180+ existing implementations. UTF-8 encoding without
      BOM is ensured by encoding=\"utf-8\" parameter (no 'utf-8-sig'). This approach is simple,
      portable, and standard across the project.

openQuestions:
  - question: "Should content be directly inserted into code or loaded from a configuration file?"
    resolved: true
    options:
      - option: "Hardcoded in implementation script"
        description: >
          Title and prose are constants in the Python script. Simplest approach, no file dependencies,
          all-in-one implementation. Matches patterns from features 174, 155, and others.
        selected: true
      - option: "Load from external YAML/JSON file"
        description: >
          Separate file contains title and prose content, loaded at runtime. Adds file dependency,
          complicates deployment, but allows separation of concerns. Not used by existing features.
        selected: false
      - option: "Accept as command-line arguments"
        description: >
          Title and prose passed as CLI flags. Violates NFR-8 requirement \"must not require user input\".
          Added complexity with no benefit.
        selected: false
    selectionRationale: >
      Hardcoded content is the universal pattern across all 180+ preceding features. It ensures
      determinism, reproducibility, and simplicity. No external files or dependencies required.
      Follows the principle of minimizing moving parts. Matches the \"no user input\" requirement.

  - question: "Should implementation be a standalone Python script or integrated into Sheep platform?"
    resolved: true
    options:
      - option: "Standalone Python script (execute directly)"
        description: >
          Implementation as independent .py file in repository root. Can be executed with
          \"python create_feature_185.py\" or by Sheep agent. Simple, easy to understand,
          matches features 174, 155, and others.
        selected: true
      - option: "Integrate into Sheep platform agents"
        description: >
          Create a Sheep agent or task using CrewAI. Adds complexity with orchestration overhead.
          Not required per spec (NFR-5: no source code modifications required). Only justified
          for complex features.
        selected: false
      - option: "Shell script"
        description: >
          Bash/shell implementation. Less portable (requires POSIX shell), harder to maintain,
          less readable. Python is preferred in this project.
        selected: false
    selectionRationale: >
      Standalone Python script follows the established pattern. The spec explicitly states NFR-5:
      \"No source code modifications in /src/sheep/ directory required.\" This feature is pure file
      creation, not a platform feature. Simplicity matters more than integration. The script can be
      executed by Sheep platform if needed, but stands alone for testing and debugging.

  - question: "Should prose content be on a single line or wrapped across multiple lines?"
    resolved: true
    options:
      - option: "Single paragraph on one line (or logically one block)"
        description: >
          Prose stored as single string. Parsed as single block after blank line. Matches existing
          features like test-wymsmq.md and test-2cw6g8.md (prose on consecutive lines after heading).
        selected: true
      - option: "Multiple lines with intentional line breaks"
        description: >
          Prose split across multiple lines at sentence boundaries. More readable in code but adds
          complexity. Could accidentally introduce unwanted line breaks in final output.
        selected: false
      - option: "Wrapped at 80 characters for code readability"
        description: >
          Split long prose lines to 80-char limit. Unnecessary complexity, risks introducing extra
          whitespace, not done by existing features.
        selected: false
    selectionRationale: >
      All existing markdown test files have prose as continuous text on consecutive lines after
      the blank line separator. Content is not broken at artificial boundaries. The implementation
      stores prose as a single Python string, then writes it as-is to file. This matches features
      174, 155, and the established pattern.

content: |
  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `Path(filename).write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - Shell commands (`touch`, `echo >`) — platform-specific, requires escaping, less readable
  - Direct `open()` file objects — more verbose, less idiomatic Python
  - External file generation libraries — unnecessary overhead for simple text file

  **Rationale:**
  pathlib is Python's modern file system interface (standard library, Python 3.11+). The
  write_text() method is idiomatic, readable, and handles encoding/line-ending concerns elegantly.
  Using `encoding="utf-8"` ensures UTF-8 without BOM. Using `newline="\n"` forces Unix LF
  line endings across all platforms (Windows, macOS, Linux), satisfying requirement FR-7.
  This exact approach is used in features 174, 155, and all 180+ preceding features.

  ### 2. Content Generation: Hardcoded Prose

  **Chosen:** Pre-composed title and prose strings as module constants

  **Rejected:**
  - LLM API calls — adds network dependency, slower execution, unnecessary for simple content
  - Random template selection — adds entropy, harder to debug and validate
  - User input (`input()` or CLI args) — violates NFR-8: "must not require user input"

  **Rationale:**
  All 180+ preceding features use hardcoded prose. This approach ensures:
  (1) Determinism — same input always produces same output
  (2) Reproducibility — no external dependencies or randomness
  (3) Simplicity — no additional libraries or API calls
  (4) Speed — content is ready immediately
  The spec's open question about content generation resolves to "LLM-generated" meaning
  pre-generated offline, not real-time generation via API.

  ### 3. Git Integration: subprocess.run()

  **Chosen:** Direct subprocess calls for `git add`, `git commit`, `git push`

  **Rejected:**
  - GitPython library — overkill for sequential simple commands, adds dependency
  - ShellExecute/system() — less safe, requires careful escaping
  - Manual git object manipulation — far too complex, not idiomatic

  **Rationale:**
  subprocess is Python's standard library for running external commands. Using direct git
  commands is standard practice across this project. GitPython is in pyproject.toml but is
  used for complex platform operations, not simple add/commit/push workflows. Subprocess
  provides clean error handling via CalledProcessError. Commands are simple string lists,
  minimizing injection risks.

  ### 4. Prose Quality Validation

  **Chosen:** Count sentence terminators (`.`, `?`, `!`) to verify 2-3 sentences

  **Rejected:**
  - NLP tokenization (nltk, spaCy) — heavy external dependencies, overkill for simple count
  - Regex patterns — fragile, breaks on abbreviations and special cases
  - No validation — risks invalid output, violates correctness requirements

  **Rationale:**
  Counting sentence punctuation is simple, deterministic, and matches existing patterns. For
  the constrained prose in this feature, this approach is reliable. Requirement FR-4 specifies
  "exactly 2-3 sentences." Content is composed carefully to meet this constraint. This validation
  method is proven across 180+ features.

  ### 5. File Encoding and Line Endings

  **Chosen:** `encoding="utf-8"` and `newline="\n"` parameters in pathlib.write_text()

  **Rejected:**
  - Platform defaults (newline=None) — causes CRLF on Windows, fails validation
  - Post-processing with `str.replace()` — fragile, easy to miss newlines
  - Relying on git config (core.autocrlf) — fragile, depends on user configuration

  **Rationale:**
  Requirements FR-6 (UTF-8 without BOM) and FR-7 (Unix LF line endings) are explicit and
  non-negotiable. Using `encoding="utf-8"` (not `utf-8-sig`) ensures UTF-8 without BOM.
  Using `newline="\n"` is Python's idiomatic way to force Unix line endings across platforms.
  This is the established pattern in all 180+ preceding features.

  ### 6. Validation Approach

  **Chosen:** Comprehensive validation of all success criteria

  **Rejected:**
  - No validation — risks silent failures, invalid output
  - Minimal validation (only file existence) — misses encoding/format errors

  **Rationale:**
  Comprehensive validation is standard in this project. Validates existence, size, encoding,
  H1 heading, blank line, sentence count, trailing newline. Early error detection prevents
  invalid commits and provides clear feedback on failures.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File creation, path operations | Use | Standard library, idiomatic Python 3.11+, no external dependency |
  | subprocess (stdlib) | Execute git commands | Use | Standard library, clear error handling, established project pattern |
  | GitPython | Advanced git operations | Reject | Overkill for simple add/commit/push, adds external dependency |
  | tempfile (stdlib) | Temporary files if needed | Not needed | Content is straightforward, no temporary files required |
  | re (stdlib) | Regex operations | Not needed | Simple sentence counting via punctuation is sufficient |
  | nltk/spaCy | NLP sentence detection | Reject | Heavy dependencies, overkill for 2-3 sentence constraint |

  ## Security Considerations

  ### File Creation Permissions
  - **Risk:** Creating files in repository root with incorrect permissions
  - **Mitigation:** pathlib.Path inherits default system permissions; no explicit chmod needed
  - **Impact:** Low — standard file creation uses secure defaults

  ### Git Command Injection
  - **Risk:** Malicious filenames or commit messages could inject git commands
  - **Mitigation:** All strings are hardcoded constants. subprocess.run() uses list format (not shell=True)
  - **Impact:** Low — strings are controlled by developer, not external input

  ### UTF-8 Encoding
  - **Risk:** Invalid UTF-8 could corrupt file or cause encoding errors
  - **Mitigation:** Python's UTF-8 encoder handles all valid Unicode; prose is ASCII-compatible
  - **Impact:** None — prose contains only ASCII characters

  ### Line Ending Inconsistencies
  - **Risk:** CRLF line endings could cause git issues, validation failures
  - **Mitigation:** Explicit `newline="\n"` parameter forces Unix LF across all platforms
  - **Impact:** None — requirement FR-7 explicitly addresses this

  ## Performance Considerations

  ### File I/O Performance
  - File creation: ~1-5 milliseconds (single file ~400-600 bytes)
  - Validation: ~1-2 milliseconds (file reading and parsing)
  - **Optimization:** None needed; I/O is trivial for this file size

  ### Git Operations Performance
  - `git add`: ~100-500ms (depends on repository size)
  - `git commit`: ~100-500ms (depends on hooks, signing)
  - `git push`: ~500ms-5s (depends on network, repository size)
  - **Optimization:** None needed; operations are sequential and acceptable

  ### Overall Execution Time
  - Phase 1 (file creation): ~10-20ms
  - Phase 2 (validation): ~5-10ms
  - Phase 3 (git workflow): ~1-10 seconds
  - **Total:** ~1-15 seconds, well within 30-minute S-sized estimate

  ## Architecture Notes

  ### Relationship to Sheep Platform
  This feature is pure file creation, not a platform feature. Per spec NFR-5, no modifications
  to `/src/sheep/` are required. The implementation can be:
  1. Executed directly as a Python script for testing/debugging
  2. Wrapped by Sheep agents/tasks if platform orchestration is desired

  ### Relationship to Established Pattern
  Features 1-184 establish a clear pattern. Feature 185 follows this pattern exactly:
  - File creation with pathlib.Path.write_text()
  - Hardcoded prose matching quality of existing files
  - Git workflow via subprocess commands
  - Comprehensive validation against success criteria

  ### Integration with CrewAI (if used by Sheep platform)
  If the Sheep platform executes this feature:
  - The implementation script can be a tool in a CrewAI agent
  - The agent calls `python create_feature_185.py`
  - The script handles all logic; CrewAI just orchestrates timing/execution
  - No modifications to `/src/sheep/` required per spec

  ## Summary: Technical Approach

  1. **File Creation:** Python pathlib with explicit UTF-8 encoding and Unix LF line endings
  2. **Content:** Hardcoded title and prose strings matching quality of existing test files
  3. **Validation:** Comprehensive checks against all success criteria
  4. **Git Integration:** subprocess commands for add, commit, push
  5. **Dependencies:** Only Python standard library (pathlib, subprocess)
  6. **Execution:** Standalone Python script, can be run directly or by Sheep platform
  7. **Execution Time:** ~1-15 seconds for complete workflow (well within 30-minute estimate)
  8. **Pattern Adherence:** Follows established approach from 180+ preceding features

  ---

  _Research phase complete. Technical decisions validated by 180+ successful implementations.
  Ready for implementation phase._
