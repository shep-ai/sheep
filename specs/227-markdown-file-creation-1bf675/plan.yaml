content: |
  ## Architecture Overview

  Feature 227 creates a single markdown test file at the repository root, following the established
  pattern from 150+ identical features (069-226). The implementation leverages existing Sheep platform
  components (sheep.config.llm for Claude API access) and standard library modules (pathlib for file I/O,
  subprocess for git operations).

  The feature is isolated from application source code (/src/sheep/) and creates only a data artifact.
  This isolation allows independent implementation and validation without impacting core platform functionality.

  ### Codebase Integration

  - **sheep.config.llm**: Provides Claude API access for high-quality prose content generation
  - **sheep.observability.logging**: Provides structured logging for debugging and observability
  - **pathlib (stdlib)**: Handles file creation with guaranteed UTF-8 encoding and Unix line endings
  - **subprocess (stdlib)**: Executes git commands (add, commit, push) with transparent error handling
  - **Repository root**: Placement mirrors all 90+ existing test-*.md files

  No modifications to source code, tests, or configuration files are required.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path("test-arvwkm.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:**
  - Idiomatic Python 3.11+ approach with safe file handle management
  - Explicit `newline="\n"` parameter guarantees Unix LF line endings on all platforms (Windows, Linux, macOS)
  - Prevents CRLF issues that could fail on Windows systems
  - Matches pattern from feature 226 implementation (commit 658750e0)
  - Used consistently across all 150+ existing feature implementations

  **Alternatives Considered:**
  - `open() context manager`: Requires manual encoding spec and file handle management (less idiomatic)
  - `pathlib.Path.write_bytes()`: Requires manual UTF-8 encoding (unnecessary for text files)
  - Git-based creation: Does not create file in working directory first (violates requirement)

  ### 2. Content Generation: Claude API via sheep.config.llm

  **Decision:** Use `sheep.config.llm.get_reasoning_llm()` with validation and retry logic

  **Rationale:**
  - Existing Sheep platform component, already integrated and tested
  - Generates high-quality, thematically consistent prose (not random or hardcoded)
  - Includes retry logic with exponential backoff for API resilience
  - Ensures prose content meets 2-3 sentence requirement
  - Proven pattern across features 199-226

  **Alternatives Considered:**
  - Static hardcoded content: Reduces variation and realism of test artifact
  - Random text generation: No quality control, may produce nonsensical output
  - User-provided input: Not suitable for automated, unattended testing

  ### 3. Unix Line Ending Enforcement

  **Decision:** Pass `newline="\n"` to pathlib.write_text() to guarantee LF endings cross-platform

  **Rationale:**
  - Python's default system line ending is platform-dependent (CRLF on Windows, LF on Unix)
  - Explicit `newline="\n"` parameter overrides system default
  - Direct implementation of requirement NFR-2 (Unix-style LF line endings)
  - Prevents build failures and validation errors on Windows development systems
  - Demonstrated in feature 226 implementation

  **Alternatives Considered:**
  - System default line endings: Unpredictable across platforms, fails on Windows
  - Post-creation normalization: Adds processing complexity and is not guaranteed
  - Rely on git auto-conversion: Depends on git config state (core.safecrlf, core.autocrlf)

  ### 4. Git Integration: subprocess.run() with List-Based Commands

  **Decision:** Use `subprocess.run(["git", "add", "test-arvwkm.md"], check=True, capture_output=True, text=True)`

  **Rationale:**
  - Transparent command execution with visible git operations in source code
  - List-based format prevents shell metacharacter injection vulnerabilities
  - Minimal overhead with no library abstraction layer
  - Return code and stderr provide clear error detection
  - Consistent with pattern in features 201-226

  **Alternatives Considered:**
  - GitPython library: Available but adds unnecessary abstraction overhead
  - Git plumbing commands: Lower-level, harder to understand and debug
  - CI/CD automation: Not needed for deterministic single-file operations

  ### 5. Comprehensive Validation Strategy

  **Decision:** Multi-stage validation covering file existence, structure, encoding, size, git tracking, and commit message

  **Rationale:**
  - Catches encoding errors, format violations, and git workflow issues early
  - Validates all 9 functional requirements (FR-1 through FR-9) and 9 non-functional requirements (NFR-1 through NFR-9)
  - Provides actionable error messages for debugging
  - Proven pattern from features 201-226
  - Gives confidence that all success criteria are met before pushing

  **Alternatives Considered:**
  - No validation: Risks missing bugs in file format, encoding, or git integration
  - Minimal validation (file existence only): Insufficient to detect encoding or format issues
  - Post-commit validation only: Misses file creation errors before git operations

  ## Implementation Strategy

  The implementation follows a three-phase approach proven across 150+ identical features:

  ### Phase 1: File Creation & Local Validation
  Create the markdown file with AI-generated prose content and validate that the file has the correct
  structure (H1 heading + 2-3 sentences), UTF-8 encoding without BOM, and Unix LF line endings.
  This phase ensures the file is ready for detailed validation before git operations.

  ### Phase 2: Comprehensive Verification
  Perform detailed checks on all functional and non-functional requirements: file existence, heading
  format, prose content length, file size (400-600 bytes typical), encoding, line endings, and structure.
  This phase provides confidence that all success criteria will be met before pushing to remote.

  ### Phase 3: Git Integration & Push
  Stage the file, commit with a conventional commit message, and push to the feature branch.
  This phase integrates the artifact into version control following the established workflow
  pattern from all prior features.

  **Why This Ordering:**
  1. Create and validate file locally first → catch format/encoding issues early
  2. Run comprehensive verification → ensure all requirements are met
  3. Integrate with git → minimize risk of pushing invalid artifacts

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Platform-specific line ending issues (CRLF on Windows) | Explicit `newline="\n"` parameter in pathlib.write_text() ensures Unix LF on all platforms |
  | Claude API unavailability or timeouts | Retry logic with exponential backoff in content generation; graceful error handling |
  | File encoding errors (wrong codec, BOM presence) | Explicit UTF-8 encoding in write_text(); validation function detects BOM and encoding anomalies |
  | Git credential/authentication failures | Rely on pre-configured git credentials (SSH keys, OAuth, credential manager); no credentials in code |
  | File path traversal or injection attacks | Use hardcoded filename from spec; pathlib handles symlinks and traversal safely |
  | Invalid markdown syntax | Validate heading format and prose content length; CommonMark compliance for simple H1 + prose structure |
  | Git workflow errors (wrong branch, failed push) | Validate branch name and commit message format; subprocess captures stderr for debugging |
  | File already exists (overwrite risk) | Validation function checks file existence; implementation only creates new file, no overwrites |
