content: |
  ## Summary

  Feature 227 implementation follows a three-phase approach proven across 150+ identical features.

  **Phase 1 (File Creation & Local Validation)** creates the markdown file with Claude-generated prose content
  and validates file structure, encoding, and line endings. Tasks 1-3 handle content generation, file creation,
  and local validation to ensure the file meets basic requirements before detailed verification.

  **Phase 2 (Comprehensive Verification)** performs thorough checks on all functional and non-functional requirements.
  Tasks 4-5 implement comprehensive verification functions and run them to ensure all requirements are satisfied
  before git operations.

  **Phase 3 (Git Integration & Push)** integrates the artifact into version control. Tasks 6-8 handle staging the
  file, committing with a conventional message, and pushing to remote origin.

  This ordering ensures that file creation and format issues are caught early (Phase 1), comprehensive validation
  confirms all requirements are met (Phase 2), and git integration is only performed on validated artifacts (Phase 3).
