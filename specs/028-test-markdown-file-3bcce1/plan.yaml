# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature applies the **Content Artifact Pattern** established in the Sheep project, where markdown
  files are stored at the repository root and serve as self-contained documentation, guides, jokes, state
  machines, and test content. The pattern is proven and established through 40+ existing markdown files
  and related features (#008, #026, #027).

  The implementation requires no architectural changes, new modules, dependencies, or infrastructure:
  - File is a pure content addition (no code or configuration)
  - Isolated from other systems (no cross-file dependencies)
  - Tracked by Git following standard conventions
  - Integrates seamlessly into the existing repository structure

  ## Key Design Decisions

  ### 1. File Format: Markdown (.md)

  **Chosen:** Markdown format (.md extension)

  **Rationale:** Markdown is the established standard in the Sheep project with 40+ existing .md files at
  repository root. Related features (#008, #026, #027) all use markdown. Provides the required heading
  syntax (H1 `#` or H2 `##`) with minimal overhead. CommonMark specification ensures portability and
  compatibility with any markdown parser. Plain text is readable without rendering tools.

  This decision is deterministic — spec explicitly requires "Markdown syntax" and project conventions
  mandate this format across all content artifacts.

  ### 2. Content Structure: H1 Heading + 2-3 Sentences

  **Chosen:** Use H1 syntax (`# Title`) as default; H2 (`##`) also acceptable per spec

  **Rationale:** Spec permits either H1 or H2 (FR-2: "Markdown heading (H1 `#` or H2 `##`)"). H1 is
  conventional for single-heading documents and observed in existing files (`test-quk4of.md`,
  `weather-forecasting-vhiwx5.md`). Spec requires exactly 2-3 sentences following the heading (FR-3).
  This mirrors the pattern in all related features.

  ### 3. Encoding: UTF-8 without BOM; Line Endings: LF

  **Chosen:** UTF-8 encoding without BOM; LF (Unix-style) line endings

  **Rationale:** Spec explicitly mandates these (NFR-1: "UTF-8 (without BOM)", NFR-2: "LF (Unix-style),
  not CRLF"). UTF-8 is the standard for version control and modern text files. Git on Linux defaults to
  LF line endings. These are deterministic requirements — no alternatives exist. Verified via standard
  tools (`file` command for encoding, `git diff` for line endings).

  ### 4. File Location: Repository Root

  **Chosen:** Create file at `./test-idm3s2.md` (repository root)

  **Rationale:** FR-1 explicitly requires "repository root" location. Related features (#008, #026, #027)
  and all existing content files (40+ .md files) are at repository root. Spec and pattern alignment are
  deterministic — no alternative locations are viable.

  ### 5. Commit Message: Conventional Commits Format

  **Chosen:** `feat(content): add test-idm3s2.md markdown file`

  **Rationale:** Success criteria require "descriptive commit message" following "conventional commit
  format". Project pattern (recent commits show `docs(specs):`, `feat(content):`) demonstrates conventional
  commit adoption. Format: `type(scope): subject` where type=`feat` (new feature), scope=`content`
  (domain), subject uses imperative mood ("add" not "adds"). This matches project conventions and spec
  requirements.

  ## Implementation Strategy

  ### Phase 1: Content Creation

  Create `test-idm3s2.md` at repository root with valid Markdown content. File must:
  - Contain exactly one H1 or H2 heading as title
  - Contain 2-3 sentences of content following the heading
  - Use UTF-8 encoding without BOM (standard editor default on modern systems)
  - Use LF line endings (standard default on Linux)
  - Be valid Markdown syntax with no parsing errors

  Content topic is unrestricted ("about anything" per spec) — focus on selecting a clear, coherent topic
  and writing 2-3 well-formed sentences.

  ### Phase 2: Validation & Integration

  Verify file correctness and integrate into Git repository:
  1. Verify file encoding is UTF-8 (using `file test-idm3s2.md` command)
  2. Verify line endings are LF only (using `git diff --cached` to check staged file)
  3. Verify file is at repository root and no other files modified (using `git status`)
  4. Stage file in Git (using `git add test-idm3s2.md`)
  5. Commit with conventional commit message (using `git commit`)
  6. Push to feature branch

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Wrong filename | Very Low | Low | Spec explicitly defines filename; copy-paste from requirements |
  | Wrong location (not at root) | Very Low | Low | Spec requires root; related features all use root |
  | Wrong encoding (UTF-16, etc.) | Very Low | Very Low | Text editor defaults to UTF-8 on modern systems; verify with `file` command |
  | CRLF line endings | Low | Low | Git on Linux defaults to LF; verify with `git diff --cached` |
  | Too many/few sentences | Very Low | Low | Spec clearly requires "2-3 sentences"; manually count terminal punctuation (., ?, !) |
  | Unintended file modifications | Very Low | Medium | Use `git status` before commit; stage only `test-idm3s2.md` |
  | Missing heading or invalid Markdown | Very Low | Low | Verify file opens correctly in Markdown viewer; check for `#` or `##` at start |

  **Overall Risk Assessment:** Minimal. All identified risks have low likelihood, low impact, and
  straightforward mitigations. This is a deterministic, straightforward content creation task following
  an established, proven pattern.
