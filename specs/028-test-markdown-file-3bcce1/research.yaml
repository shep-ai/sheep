content: |
  ## Status

  - **Phase:** Research (completed 2026-03-15)
  - **Complexity:** Minimal — single file, no code changes, no dependencies
  - **Risk:** Very Low — isolated content artifact, no cross-system impact

  ## Research Summary

  This feature is a straightforward content creation task following an established pattern in the Sheep project.
  No novel technical decisions or architectural complexity exists. All implementation details are determined by:

  1. **Explicit spec requirements** (filename, location, content format)
  2. **Established project patterns** (40+ existing markdown files at repo root)
  3. **Standard platform conventions** (UTF-8 encoding, LF line endings, Markdown format)

  Related features (#008, #026, #027) are identical in scope and complexity — all create single markdown files
  at repo root with title + 2-3 sentences. This feature follows the same proven pattern.

  ## Technology Decisions

  ### 1. File Format: Markdown

  **Chosen:** Markdown (.md)

  **Rejected:**
  - ReStructuredText — Adds complexity; Sheep project standardizes on Markdown (40+ existing .md files)
  - Plain Text — Lacks required heading syntax; less semantic
  - Org Mode — Emacs-specific; not used in Sheep project
  - HTML — Violates pattern of plain-text sources; unnecessary overhead

  **Rationale:** Markdown is the universal standard in the Sheep project. All related features and existing
  content files use .md format. Spec explicitly requires "Markdown syntax". CommonMark specification ensures
  portability. This is the deterministic, unambiguous choice given project conventions.

  ### 2. Content Structure: H1 Heading with 2-3 Sentences

  **Chosen:** H1 heading (`#`) is default; H2 (`##`) also acceptable per spec

  **Rejected:**
  - Multiple headings — Spec requires "exactly one" top-level heading
  - H3+ headings — Violates "top-level" requirement (H1 or H2 only)
  - No heading — Violates FR-2 requirement for Markdown heading as title

  **Rationale:** Spec explicitly permits H1 or H2 (FR-2). H1 is conventional for single-heading documents;
  observed in existing files (`test-quk4of.md`, `weather-forecasting-vhiwx5.md`). Spec requires exactly 2-3
  sentences (FR-3) following the heading. This mirrors the pattern in related features.

  ### 3. Encoding and Line Endings: UTF-8 + LF

  **Chosen:** UTF-8 encoding (without BOM); LF line endings (Unix-style)

  **Rejected:**
  - UTF-8 with BOM — Adds 3-byte marker; NFR-1 explicitly forbids BOM
  - UTF-16/other — Complicates git diffs; UTF-8 is standard for text files
  - CRLF line endings — Violates NFR-2 requirement for LF only; generates diff noise

  **Rationale:** Spec mandates "UTF-8 (without BOM)" and "LF (Unix-style), not CRLF" (NFR-1, NFR-2).
  UTF-8 is the standard for version control and modern text files. Git on Linux defaults to LF line endings.
  These requirements are deterministic — no alternatives exist.

  ### 4. File Location: Repository Root

  **Chosen:** File created at `./test-idm3s2.md` (repository root)

  **Rejected:**
  - Subdirectories (e.g., `/content/`, `/docs/`) — Violates FR-1 ("repository root"); contradicts pattern of 40+ existing markdown files
  - Nested in `/specs/` — Violates spec; spec files belong in `/specs/{number}-{name}/`
  - Hidden directories — Unconventional and inconsistent with project patterns

  **Rationale:** FR-1 explicitly requires "repository root". Related features (#008, #026, #027) and all
  existing content files (40+ .md files) are at repository root. This decision is deterministic — spec and
  project pattern alignment mandate this location.

  ### 5. Commit Message: Conventional Commits Format

  **Chosen:** `feat(content): add test-idm3s2.md markdown file`

  **Rejected:**
  - Non-standard messages (e.g., "Add file", "test-idm3s2") — Violates spec requirement for "descriptive" message in "conventional commit format"
  - Wrong mood (e.g., "adds", "added") — Conventional commits require imperative mood ("add" not "adds")
  - Missing scope — `feat(content)` clarifies this is content creation, improving navigability

  **Rationale:** Success criteria require "descriptive commit message" following "conventional commit format".
  Recent project commits (e.g., `docs(specs):`, `feat(content):`) demonstrate conventional commit adoption.
  Format is: `type(scope): subject`. Type=`feat` (new feature), scope=`content` (domain), subject is imperative.
  This matches project conventions and spec requirements.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | Markdown (format) | Markup syntax for heading + content | Use | Spec requirement; 40+ existing files use Markdown; CommonMark standard ensures compatibility |
  | Git | Version control, file tracking, history | Use (existing) | Already in use; needed for commit and file tracking; spec requires Git commit |
  | Standard text editors | File creation and editing | Use (any) | Plain text file; any editor works (nano, vim, echo, Python, etc.). No special tools needed. |
  | markdownlint | Markdown validation | Reject | Spec explicitly forbids code/config/test changes (NFR-6); adds external tooling for unnecessary validation |
  | Python test suite | Automated validation | Reject | Spec forbids test file creation (NFR-6). Success criteria validated manually via Git commands. |

  ## Security Considerations

  **Risk Level:** Negligible

  1. **File Content:** Markdown file with 2-3 sentences poses zero security risk. No code execution, no data access, no authentication required.

  2. **Encoding Safety:** UTF-8 without BOM is safe and standard. No buffer overflow risks from encoding.

  3. **Line Ending Attacks:** LF line endings are standard; CRLF mixing could theoretically cause shell injection if file were sourced (which it won't be). Enforcing LF eliminates any theoretical risk.

  4. **File Permissions:** Git tracks file permissions but markdown files don't need execution bits. File will inherit safe default permissions.

  5. **Repository Integrity:** Single new file poses no risk to repository integrity or CI/CD pipelines. Content files are non-executable artifacts.

  **Conclusion:** No security hardening required. This is a plain-text content artifact with zero attack surface.

  ## Performance Implications

  **Risk Level:** None

  1. **File Size:** Spec requires ~100-500 bytes (title + 2-3 sentences). Negligible impact on repository size.

  2. **Git Operations:** Adding 1 file has zero measurable impact on clone, pull, or push performance. 40+ existing markdown files demonstrate no scaling issues.

  3. **Build/CI Pipelines:** File creation does not trigger builds or tests (spec forbids test changes). No CI/CD performance impact.

  4. **Indexing:** File is plain text; adds one entry to Git index. Negligible cost.

  **Conclusion:** No performance optimization needed. This is a trivial content addition with no performance consequences.

  ## Architecture Notes

  ### Existing Pattern

  The Sheep project maintains a **Content Artifact Pattern** for markdown files at repository root:

  - **Purpose:** Store documentation, guides, jokes, state machines, design patterns, and test content
  - **Location:** Repository root (40+ existing files observed)
  - **Format:** Markdown (.md) with UTF-8 encoding and LF line endings
  - **Structure:** Single H1 or H2 heading + content (typically 2-3 sentences or several paragraphs)
  - **Isolation:** No cross-file dependencies; each markdown file is self-contained
  - **Versioning:** Tracked by Git; one commit per feature
  - **Related Features:** #008, #026, #027 (all identical pattern)

  ### How This Feature Fits

  This feature (`test-idm3s2.md`) is a **direct application** of the established Content Artifact Pattern:

  - Follows the same directory structure (repository root)
  - Uses the same file format (Markdown)
  - Follows the same encoding standard (UTF-8 + LF)
  - Matches the same complexity level (single file, no dependencies)
  - Integrates seamlessly into existing convention

  ### No Architectural Changes Required

  The Sheep project's architecture is unchanged by this feature:

  - No new modules or services
  - No new configuration or build steps
  - No new dependencies or third-party libraries
  - No API or database schema changes
  - No CI/CD pipeline modifications

  This is a **pure content addition** to an existing, stable pattern.

  ### Git Integration

  - File will be tracked by Git in repository history
  - Commit will use conventional commits format (`feat(content):`)
  - One atomic commit required (no multi-commit features needed)
  - Feature branch: `feat/028-test-markdown-file-3bcce1`
  - PR/merge strategy: Standard (no special handling needed)

  ## Implementation Approach

  ### Step-by-Step Execution

  1. **Create file:** `test-idm3s2.md` at repository root
  2. **Add heading:** Use H1 syntax (`# Title Here`)
  3. **Add content:** Write 2-3 sentences after heading
  4. **Save file:** Use UTF-8 encoding with LF line endings
  5. **Stage file:** `git add test-idm3s2.md`
  6. **Commit:** Use message `feat(content): add test-idm3s2.md markdown file`
  7. **Push:** `git push -u origin HEAD` to feature branch
  8. **Verify:** Run `pnpm build`, `pnpm test`, `pnpm lint` to ensure no regressions

  ### Quality Checks

  - **File existence:** Verify via `git ls-files | grep test-idm3s2.md`
  - **Encoding:** Verify via `file test-idm3s2.md` (should report UTF-8)
  - **Line endings:** Verify via `git diff --cached` (should show LF only)
  - **Heading:** Verify file starts with `#` or `##`
  - **Sentence count:** Count terminal punctuation marks (., ?, !) — should be 2-3
  - **No other changes:** `git status` should show only `test-idm3s2.md` as new file

  ## Risk Assessment

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Wrong filename | Very Low | Low — catches at commit message review | Spec explicitly defines filename; copy-paste from requirements |
  | Wrong location | Very Low | Low — catches at Git status check | Spec requires root; related features (#008, #026, #027) are at root |
  | Wrong encoding | Very Low | Very Low — text editors default to UTF-8 on modern systems | Standard editor defaults; `file` command validates |
  | CRLF line endings | Low | Low — causes diff noise and merge conflicts | Git on Linux defaults to LF; configure `git config core.safecrlf true` if needed |
  | Too many/few sentences | Very Low | Low — easy to recount and fix | Spec clearly requires "2-3 sentences"; manual count during creation |
  | Unintended file modifications | Very Low | Medium — could bloat commit | Use `git status` before commit; stage only `test-idm3s2.md` |
  | Missing commit | Very Low | Low — feature incomplete; retried as part of implementation | Commit is straightforward; no special complexity |

  **Overall Risk:** Minimal. All identified risks are low-likelihood with low-impact and straightforward mitigations.

  ## Conclusion

  This feature is a **deterministic, low-complexity content creation task** following an established and proven
  pattern in the Sheep project. All technical decisions are mandated by:

  - Explicit specification requirements (filename, location, format, encoding)
  - Project conventions (40+ existing markdown files at root following identical pattern)
  - Platform standards (UTF-8, LF, Markdown, Git)

  No novel architectural decisions, library evaluations, security hardening, or performance optimizations are
  required. Implementation is straightforward:

  1. Create file `test-idm3s2.md` at repository root
  2. Add H1 heading + 2-3 sentences of content
  3. Ensure UTF-8 encoding and LF line endings (standard defaults)
  4. Commit with conventional message `feat(content): add test-idm3s2.md markdown file`
  5. Push to feature branch
  6. Verify build/test/lint pass

  Related features (#008, #026, #027) confirm this pattern is established, proven, and low-risk. Estimated
  implementation time: < 5 minutes. Ready for implementation phase.
