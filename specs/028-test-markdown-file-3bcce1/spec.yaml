content: |
  ## Problem Statement

  Create a new markdown file called `test-idm3s2.md` in the repository root with a title and 2-3 sentences of content about any topic. This continues the established pattern of the Sheep project, which maintains a collection of markdown content files serving various purposes (documentation, guides, checklists, state machines, and test files).

  The specification is complete and unambiguous: the filename is explicitly specified (`test-idm3s2.md`), content requirements are clear (title + 2-3 sentences), topic scope is unrestricted ("about anything"), and location follows established project patterns (repository root).

  ## Functional Requirements

  - **FR-1**: File must be created at the repository root with the exact name `test-idm3s2.md`
  - **FR-2**: File must contain exactly one Markdown heading (H1 `#` or H2 `##`) serving as the title
  - **FR-3**: File must contain 2-3 sentences of content following the title
  - **FR-4**: File content may be about any topic (no topic restrictions)
  - **FR-5**: File must use valid Markdown syntax with no syntax errors
  - **FR-6**: File must be a plain text file with no binary content

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (without BOM)
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF
  - **NFR-3**: No other files may be created, modified, or deleted during this feature
  - **NFR-4**: Changes must be committed to the feature branch with a descriptive commit message
  - **NFR-5**: File must follow repository conventions for markdown files (consistent formatting with existing .md files)
  - **NFR-6**: No code changes, configuration changes, or test files are required
  - **NFR-7**: File size must be reasonable for a documentation artifact (< 10 KB, typically ~100-500 bytes)

  ## Success Criteria

  - [ ] File `test-idm3s2.md` exists in repository root (verified via `git ls-files`)
  - [ ] File is not empty and contains valid Markdown syntax (no parsing errors)
  - [ ] File contains exactly one top-level heading (H1 `#` or H2 `##`)
  - [ ] File contains 2-3 sentences of content after the heading
  - [ ] Content sentence count is verified by counting terminal periods (., ?, !)
  - [ ] File is encoded as UTF-8 with no BOM
  - [ ] Line endings are LF only (verified via `git diff --cached` or `file` command)
  - [ ] Git status shows only the new file (no unintended modifications)
  - [ ] Changes are committed to feature branch `feat/028-test-markdown-file-3bcce1`
  - [ ] Commit message is descriptive and follows conventional commit format (e.g., `feat(content): add test-idm3s2.md markdown file`)
  - [ ] No other files in the repository have been created, modified, or deleted
  - [ ] File content is readable and coherent (basic quality check)

