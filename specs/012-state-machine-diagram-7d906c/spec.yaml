# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repo collects miscellaneous example content files (jokes, random words, design
  patterns, state machine diagrams). An additional state machine diagram example is
  requested as another standalone content file — purely illustrative, not tied to
  project functionality, using a different subject from the existing STATE_MACHINE.md.

  ## Success Criteria

  - [ ] A new markdown file exists at the repo root following the ALL_CAPS naming convention
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` code block
  - [ ] The diagram depicts a door lock state machine with at least Locked and Unlocked states
  - [ ] The file renders correctly in GitHub's Mermaid preview (no syntax errors)
  - [ ] No existing files are modified
  - [ ] No source code or test files are added or changed

  ## Functional Requirements

  - **FR-1**: A new standalone markdown file must be created at the repository root.
  - **FR-2**: The file must contain a Mermaid `stateDiagram-v2` diagram block.
  - **FR-3**: The diagram must model a door lock state machine with at minimum a `Locked`
    and `Unlocked` state and transitions between them (e.g. lock/unlock events).
  - **FR-4**: The file must include a top-level heading (H1) identifying the diagram.
  - **FR-5**: The Mermaid syntax must be valid and renderable without errors.

  ## Non-Functional Requirements

  - **NFR-1**: The file must follow the existing ALL_CAPS naming convention used by other
    content files in the repo root (e.g. `DOOR_LOCK_STATE_MACHINE.md`).
  - **NFR-2**: The diagram must be concise — no more than 6 states to remain "simple" per
    the user's request.
  - **NFR-3**: No prose explanation is required; the diagram must be self-explanatory from
    the state/transition labels alone.
  - **NFR-4**: The file must not introduce any dependencies, build steps, or CI changes.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which state machine subject? | Door lock | Simple, distinct from existing traffic light example, universally understood |
  | 2 | Prose or diagram only? | Diagram only | Matches "SUPER FAST" user intent; diagram is self-explanatory |
  | 3 | File name? | DOOR_LOCK_STATE_MACHINE.md | Follows ALL_CAPS convention, descriptive, avoids collision with STATE_MACHINE.md |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root `.md` files | Low | Add one new standalone markdown file |

  ## Dependencies

  None — plain markdown file, no code changes.

  ## Size Estimate

  **S** — Single file addition, no code or test changes needed.
