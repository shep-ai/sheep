content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. Diagram Subject Selection

  **Chosen:** Door lock (Locked ↔ Unlocked)

  **Rejected:**
  - Traffic light — already used in existing `STATE_MACHINE.md`; duplicate subject
  - Vending machine — more states than necessary for a "simple" example

  **Rationale:** Door lock requires only 2 states and 2 transitions. It is universally
  understood with no explanation needed and does not duplicate existing content.

  ### 2. Mermaid Diagram Syntax Version

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — legacy, less readable; repo already uses v2
  - `flowchart` — semantically incorrect for state machines

  **Rationale:** `STATE_MACHINE.md` already uses `stateDiagram-v2`, establishing repo
  convention. GitHub renders it natively with no configuration.

  ### 3. File Content Structure

  **Chosen:** H1 heading + Mermaid code block only

  **Rejected:**
  - Heading + prose + diagram — contradicts "SUPER FAST" user intent; unnecessary
  - Diagram only (no heading) — inconsistent with `STATE_MACHINE.md` pattern

  **Rationale:** `STATE_MACHINE.md` uses exactly this structure. Matching it ensures
  consistency and satisfies FR-4 with the minimum possible content.

  ### 4. File Naming

  **Chosen:** `DOOR_LOCK_STATE_MACHINE.md`

  **Rejected:**
  - `STATE_MACHINE2.md` — numeric suffix is ambiguous and non-descriptive
  - `EXAMPLE_STATE_MACHINE.md` — generic, does not identify the subject

  **Rationale:** Follows the repo's ALL_CAPS naming convention observed across
  `JOKE.md`, `DESIGN_PATTERN.md`, `STATE_MACHINE.md`, `SHEEP.md`, etc.

  ### 5. State Count

  **Chosen:** 2 states (Locked, Unlocked)

  **Rejected:**
  - 3 states with Ajar — unnecessary for "simple" requirement
  - 4+ states with alarm/error — out of scope

  **Rationale:** NFR-2 allows up to 6 states, but minimum viable is preferred.
  Two states is self-explanatory and maximally concise.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State machine diagram syntax | Use | Already used in repo; GitHub renders natively; no install needed |
  | Any other diagramming tool | Alternative diagram format | Reject | Adds dependency; breaks consistency with existing STATE_MACHINE.md |

  ## Security Considerations

  None. This is a static markdown file with no executable code, no user input,
  no dependencies, and no CI changes. There are no security implications.

  ## Performance Implications

  None. A small static markdown file has no measurable performance impact on the
  repository. Mermaid rendering is handled client-side by GitHub's preview.

  ## Architecture Notes

  This file fits the existing pattern of standalone illustrative content files at
  the repo root. No integration with source code, tests, or build systems is
  required or intended. The implementation is a single `git add` + commit.
