content: |
  ## Architecture Overview

  The repo root contains standalone illustrative content files (JOKE.md, SHEEP.md,
  DESIGN_PATTERN.md, STATE_MACHINE.md, RANDOM_WORD.txt). This feature adds one more
  file to that collection. No source code, tests, CI, or build configuration is
  touched. The file is inert — it serves only as a rendered diagram on GitHub.

  The existing STATE_MACHINE.md establishes the exact template:
  - Line 1: `# <Title>` (H1 heading)
  - Lines 3–N: fenced Mermaid code block using `stateDiagram-v2`

  DOOR_LOCK_STATE_MACHINE.md will follow this template identically.

  ## Key Design Decisions

  **Subject: Door lock (Locked ↔ Unlocked)**
  Traffic light already exists in STATE_MACHINE.md; door lock is the next simplest
  subject — 2 states, 2 labeled transitions, universally understood, no explanation
  required. Vending machine was rejected for having more states than necessary.

  **Syntax: stateDiagram-v2**
  Matches existing STATE_MACHINE.md convention. GitHub renders it natively.
  Legacy v1 and flowchart syntaxes were rejected for inconsistency.

  **Content: heading + diagram only (no prose)**
  Matches STATE_MACHINE.md structure. Satisfies FR-4 (H1 required) and NFR-3
  (self-explanatory diagram). Aligns with the user's "SUPER FAST" intent.

  **Filename: DOOR_LOCK_STATE_MACHINE.md**
  Follows the ALL_CAPS descriptive naming convention of the existing content files.
  Avoids collision with STATE_MACHINE.md and is unambiguous about the subject.

  **State count: 2 (Locked, Unlocked)**
  NFR-2 permits up to 6, but minimal is preferred. Two states with lock/unlock
  transition labels are sufficient and maximally concise.

  ## Implementation Strategy

  One phase, one task: write the file. There are no prerequisites, no code
  dependencies, and no follow-up steps beyond the commit.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error breaks GitHub preview | Use identical block structure from STATE_MACHINE.md; stateDiagram-v2 with [*] initial state is known-good |
  | Filename collision with existing file | DOOR_LOCK_STATE_MACHINE.md is distinct from STATE_MACHINE.md — no collision |
  | Accidental modification of existing files | Task scope is strictly additive; no existing file is opened or edited |
