# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-w2kr34.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-157,
  with 150+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-w2kr34.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\n), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-w2kr34.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(158): Create markdown file test-w2kr34.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/158-markdown-file-creation-e008a0`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-w2kr34.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\n) line endings throughout
  - **FR-7**: The file SHALL be added to git staging area using `git add test-w2kr34.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(158): Create markdown file test-w2kr34.md with prose content`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/158-markdown-file-creation-e008a0`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files in the repository
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or nonsensical sentences)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 151-157 for consistency and maintainability
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content topic be free-form or constrained? | Free-form topic selection | All 150+ existing test files use arbitrary topics; feature spec says "about anything"; free-form matches precedent and minimizes complexity |
  | 2 | Should line endings be explicitly enforced to LF? | Enforce LF line endings | Git best practices, existing files use LF, prevents CRLF issues across platforms; standard for modern projects |
  | 3 | Should file encoding be validated as UTF-8 without BOM? | Enforce UTF-8 without BOM | Python 3 default, git standard, existing files use this encoding, prevents text editor and version control issues |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 150+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-157; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis and requirements phases; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is a simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/158-markdown-file-creation-e008a0` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 150+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-157) demonstrate successful execution of identical pattern

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 150+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-157) demonstrate efficient execution in 10-15 minutes

