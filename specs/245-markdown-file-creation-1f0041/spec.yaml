# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-nxclc0.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 90+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-244, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-nxclc0.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-nxclc0.md`
  - [ ] Git commit with exact message exists: `feat(245): create markdown file test-nxclc0.md with prose content`
  - [ ] Commit is created on the feature branch `feat/245-markdown-file-creation-1f0041`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-nxclc0.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct (validated through LLM generation with appropriate prompting)
  - **FR-6**: File must be staged using `git add test-nxclc0.md`
  - **FR-7**: File must be committed with the exact message: `feat(245): create markdown file test-nxclc0.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/245-markdown-file-creation-1f0041`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size is a natural outcome of proper structure validation; no explicit size bounds enforcement required (per resolved product question #1)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 90+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files beyond optional feature module creation
  - **NFR-8**: Prose topic may be any topic chosen by the LLM; no topic constraints (per resolved product question #2)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages
  - **NFR-10**: Implementation must complete within the time estimate of 10-15 minutes of actual development work

  ## Product Questions & AI Recommendations

  All three product decisions have been resolved with AI-recommended defaults. Detailed rationale and structured options are defined in the openQuestions array at the top of this specification.

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should file size be strictly enforced (400-600 bytes) or treated as a natural outcome of proper structure? | **Natural outcome** — validate structure correctness, accept any resulting file size | File size is consequence of content structure, not independent constraint. Flexibility in topic/sentence length is intentional. Structure validation is sufficient. Matches all 90+ precedents. |
  | 2 | Should prose topic be constrained or free-form? | **Free-form** — any topic chosen by LLM | User query states \"about anything\". No business constraints on topic. Flexibility enables natural, varied test file creation. Diverse topics work well across 90+ precedents. Proven effective pattern. |
  | 3 | How should prose readability (FR-5) be validated? | **LLM-based validation** — quality ensured through generation | This is test content, not production. LLM generation with proper prompting ensures readable output. Standard practice across 90+ precedents. No additional validation tools needed. Cost-effective and proven. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 90+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into logical modules:
    - **agents/**: Agent definitions for research, implementation, and review workflows
    - **config/**: Configuration management and LLM factory
    - **flows/**: Flow definitions for orchestration and control logic
    - **tools/**: Agent tools for git, file operations, and other utilities
    - **observability/**: Logging and tracing utilities
    - **features/**: Feature implementation modules (e.g., feature_116_markdown_file_creation.py)
    - **content_generators.py**: Utilities for generating markdown content and managing file I/O
    - **cli.py**: Command-line entry point
  - **specs/**: Feature specification directory with subdirectories for each feature number
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile**: Container configuration for the Sheep platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as validation artifacts
  for the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (90+ precedents):
  - Markdown content generation using Claude LLM via `generate_markdown_content()` function in content_generators.py
  - File creation using Python `pathlib.Path` for I/O operations via `write_markdown_file()` function
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings enforced
  - File size naturally 400-600 bytes (as outcome of proper structure)
  - Implementation follows straightforward imperative code pattern
  - Files are isolated test artifacts with no dependencies on application source code
  - Diverse topics (nature, technology, science, history, culture, philosophy, etc.) observed across existing test files

  **Feature Implementation Module Pattern** (observed in features 116, 148, and others):
  - Feature module located at `src/sheep/feature_<number>_markdown_file_creation.py`
  - Contains task functions (task_2_generate_markdown_content, task_3_write_markdown_file_to_disk)
  - Calls shared utilities from content_generators.py for actual content generation and file writing
  - Includes main() orchestration function that runs tasks sequentially
  - Proper logging via get_logger()
  - Exception handling with clear error messages

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/245-markdown-file-creation-1f0041`
  - Create/modify files in working directory
  - Stage with `git add test-nxclc0.md`
  - Commit with conventional commit format: `feat(245): create markdown file test-nxclc0.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Content Generation Pattern** (from content_generators.py):
  - Uses Claude LLM via get_reasoning_llm() from config/llm.py
  - Prompt specifies exact format: H1 heading + blank line + 2-3 sentences
  - LLM returns raw markdown content
  - write_markdown_file() function handles all encoding and line-ending requirements
  - Ensures UTF-8 without BOM and LF line endings

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (Path.write_text())
  - **Claude LLM API**: Via Anthropic SDK for prose content generation
  - **CrewAI Framework**: Agent-based automation framework used by Sheep platform
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content per CommonMark specification

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-nxclc0.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-244; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | Low | May create or update feature module at src/sheep/feature_245_markdown_file_creation.py following established pattern, but this is optional and does not impact core application |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature is purely file creation; does not depend on or impact any core flows, agents, or tools beyond utilizing existing content_generators utilities |
  | Configuration & Build | None | No changes to pyproject.toml, Dockerfile, GitHub workflows, or environment configuration |
  | Tests | None | No modifications to existing test files or test suite |

  ## Dependencies

  - **Git repository**: Feature branch `feat/245-markdown-file-creation-1f0041` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **LLM Configuration**: Claude API access via .env configuration (ANTHROPIC_API_KEY)
  - **Content Generators Module**: Existing `content_generators.py` provides generate_markdown_content() and write_markdown_file() functions
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-nxclc0.md is provided in the feature spec and must be used exactly as specified
  - **CrewAI/Claude SDK**: Already configured in project dependencies for LLM access

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~2-3 minutes (LLM API call to generate H1 heading + 2-3 sentences)
  - **File creation**: ~2 minutes (write markdown file to disk with proper encoding)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Content generation delegated to existing LLM utilities and content_generators.py functions
  - Free-form topic selection eliminates research/architectural decisions
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - File naming (test-nxclc0.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 176+ prior implementations
  - Existing feature modules (116, 148) demonstrate efficient implementation in 10-15 minutes
  - No complex dependencies or system integrations required

