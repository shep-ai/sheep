content: |
  ## Task Breakdown Summary

  Seven tasks across four phases implement the complete markdown-file-creation workflow:

  **Phase 1 (Foundation):** Tasks 1-2 establish the feature module with constants, imports,
  logging setup, and main() orchestration function. Main() defines the strict task sequence.

  **Phase 2 (Content & File):** Tasks 3-4 implement content generation and file writing,
  delegating to proven content_generators utilities. Task 3 generates markdown via Claude LLM.
  Task 4 writes file with UTF-8/LF validation.

  **Phase 3 (Git Workflow):** Tasks 5-6 implement commit and push, completing the full
  workflow from file creation to published artifact. Both delegate to existing git tool
  abstractions.

  **Phase 4 (Verification):** Task 7 executes the feature end-to-end and verifies all
  nine success criteria are met: file structure, encoding, line endings, git commit,
  and push to remote.

  ## TDD Approach

  Each task follows the RED-GREEN-REFACTOR cycle:

  - **RED:** Describe the failing condition (function doesn't exist, file doesn't exist, etc.)
  - **GREEN:** Write minimal code to make the test pass (implement function, call utilities)
  - **REFACTOR:** Improve code quality (docstrings, logging, error handling)

  For file creation and git tasks, the \"test\" is the observable artifact (file exists,
  commit in git log, etc.). Manual verification in task 7 confirms all criteria are met.

  ## Dependencies and Sequencing

  Task 1 (module skeleton) is the foundation. Task 2 (main orchestration) depends on task 1
  and provides the execution entry point. Tasks 3-6 implement workflow and depend on task 2.
  Task 7 (verification) depends on all workflow tasks being complete.

  ## Effort Justification

  - **Module skeleton (task 1):** 15 minutes — Create file, define constants, imports
  - **Main orchestration (task 2):** 10 minutes — Wire up task calls in sequence
  - **Content generation (task 3):** 10 minutes — Delegate to content_generators function
  - **File write (task 4):** 10 minutes — Delegate to content_generators function
  - **Git commit (task 5):** 10 minutes — Delegate to content_generators function
  - **Git push (task 6):** 10 minutes — Delegate to content_generators function
  - **Integration test (task 7):** 15 minutes — Execute workflow and verify outputs

  **Total: 1 hour 20 minutes.** Specification estimates 10-15 minutes of \"actual development
  work\"; this plan includes infrastructure setup, comprehensive logging, and manual
  verification that collectively take the additional time.
