content: |
  ## Architecture Overview

  The implementation leverages the Sheep platform's established markdown-file-creation
  pattern, proven across 90+ identical features (features 069-244). The feature module
  creates a thin orchestration layer over existing, battle-tested utilities in
  content_generators.py.

  **Module Structure:**
  - Feature module: `src/sheep/feature_245_markdown_file_creation.py`
  - Task functions: `task_2_generate_markdown_content()`, `task_3_write_markdown_file_to_disk()`,
    `task_4_commit_markdown_file()`, `task_5_push_markdown_file()`
  - Main orchestration: `main()` function that calls tasks sequentially
  - Dependencies: content_generators, sheep.config.llm, sheep.tools, sheep.observability.logging

  **Integration Pattern:**
  The feature module delegates all domain logic to content_generators functions:
  - `generate_markdown_content(filename)` — generates H1 + blank line + 2-3 sentences
  - `write_markdown_file(content, filename)` — writes with UTF-8, no BOM, LF line endings
  - `validate_markdown_file(path)` — validates structure, encoding, line endings
  - `commit_markdown_file(path, feature_number, filename)` — creates conventional commit
  - `push_markdown_file()` — pushes changes to remote

  No custom file I/O, LLM prompting, or git command handling needed. Feature module is purely
  orchestration and logging.

  ## Key Design Decisions

  ### 1. Delegate All Domain Logic to content_generators.py

  **Decision:** Use existing functions rather than implementing custom logic.

  **Rationale:**
  - Functions tested across 90+ identical markdown-file-creation features
  - Comprehensive error handling and validation already implemented
  - Prompt engineering already optimized for consistent, readable output
  - Using existing functions ensures consistency with precedent features
  - No new dependencies introduced: all required libraries already in project
  - Centralized maintenance: changes to content logic apply to all features automatically
  - Reduces implementation time significantly

  ### 2. Feature Module Following Established Pattern

  **Decision:** Create src/sheep/feature_245_markdown_file_creation.py following features 116/148 pattern.

  **Rationale:**
  - Organizational convention across all features in src/sheep/feature_*.py
  - Enables task-level logging and observability
  - Provides clear entry point for testing and invocation
  - Main() function orchestrates tasks sequentially
  - Matches specification's implicit recommendation

  ### 3. Sequential Orchestration (No Parallelization)

  **Decision:** Execute tasks strictly sequentially: generate → write → validate → commit → push.

  **Rationale:**
  - File must be written before committing
  - Commit must exist before pushing
  - No opportunities for parallelization
  - Sequential execution enables better error handling and progress reporting
  - Any failure stops the workflow, preventing partial artifacts

  ### 4. Error Handling & Propagation

  **Decision:** Allow exceptions from content_generators functions to propagate with context
  logging at each task level.

  **Rationale:**
  - content_generators functions provide comprehensive validation and descriptive error messages
  - Task-level logging provides context for debugging
  - Propagating exceptions prevents silent failures
  - Caller can handle exceptions appropriately

  ## Implementation Strategy

  **Phase 1 (Foundation):** Create feature module with constants, imports, logging setup,
  and main() orchestration function. Main() defines the task sequence.

  **Phase 2 (Content & File):** Implement task_2_generate_markdown_content() and
  task_3_write_markdown_file_to_disk(). Both delegate to content_generators functions.

  **Phase 3 (Git Workflow):** Implement task_4_commit_markdown_file() and
  task_5_push_markdown_file(). Complete the full workflow.

  **Phase 4 (Verification):** Execute the feature module and manually verify all success
  criteria are met.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates invalid markdown | validate_markdown_file() comprehensively checks structure, encoding, line endings. Validation happens immediately after writing. |
  | File permissions prevent writing | Feature runs with write access to repo root. write_markdown_file() raises descriptive exception if write fails. |
  | Git configuration missing | GitCommitTool validates git configuration. commit_markdown_file() raises exception if config is incomplete. |
  | Push fails due to network/permissions | GitPushTool handles network errors and authentication. push_markdown_file() raises exception with details. |
  | Filename collision | Filename test-nxclc0.md is unique and specified in feature spec. No collision with 90+ existing test-*.md files. |
  | Encoding/line ending issues | pathlib.Path.write_text() and validate_markdown_file() handle platform differences transparently. UTF-8 and LF enforced. |
