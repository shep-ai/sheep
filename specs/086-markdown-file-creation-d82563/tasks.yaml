# Markdown content (the full tasks document)
content: |
  ## Implementation Flow

  **Phase 1: File Creation & Validation (15 minutes)**

  1. **Task 1 — Create markdown file** (10 minutes)
     - Compose 2-3 coherent sentences on a generic universal topic (workplace/productivity)
     - Create test-6eniyw.md at repository root
     - Ensure proper structure: H1 heading + blank line + prose
     - Use pathlib.Path with UTF-8 encoding and Unix LF preservation

  2. **Task 2 — Validate file properties** (5 minutes)
     - Verify UTF-8 encoding without BOM
     - Verify Unix LF line endings (no CRLF)
     - Verify file size is 320-600 bytes
     - Verify markdown syntax is valid
     - Verify prose is coherent and grammatically correct

  **Phase 2: Git Workflow (7 minutes)**

  3. **Task 3 — Stage file** (2 minutes)
     - Execute: `git add test-6eniyw.md`
     - Verify file appears in git staging area

  4. **Task 4 — Create conventional commit** (2 minutes)
     - Execute: `git commit -m "feat(086): create markdown file test-6eniyw.md with prose content"`
     - Verify commit created with correct message format

  5. **Task 5 — Push to feature branch** (3 minutes)
     - Execute: `git push -u origin HEAD`
     - Verify commit appears on remote feature branch

  ## Pattern Consistency

  This implementation follows the established pattern from 85+ prior similar test files (features 063-085).
  All tasks align with existing practices: pathlib for file creation, static prose content, standard git workflow.
  No architectural changes, no dependencies, no configuration modifications.
