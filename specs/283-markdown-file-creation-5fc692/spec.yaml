content: |
  ## Problem Statement

  Create a single markdown file called test-5pi0d2.md with a title (markdown heading) and
  2-3 sentences of prose content about any topic. This is part of a systematic test file
  creation workflow in the Sheep project.

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as follows:
  - **Repository Root**: Contains 280+ test markdown files (test-*.md pattern)
  - **specs/ Directory**: Contains structured feature specifications with YAML and markdown
  - **Feature Format**: Each feature gets a numbered directory (e.g., specs/283-markdown-file-creation-5fc692/)
  - **Build System**: Uses Docker (Dockerfile present)
  - **Version Control**: Git with conventional commit messages (feat(N): description format)

  ### Architecture Patterns

  This project follows a **test file generation pattern**:
  1. Each feature request creates a single markdown file
  2. File naming follows pattern: test-{random-alphanumeric}.md
  3. Content structure is consistent: H1 heading + 2-3 sentence prose
  4. Git workflow: Create file → Stage → Commit → Push
  5. Commit messages follow convention: `feat(N): create markdown file test-*.md with title and prose content`

  **Dependencies and Sequencing**:
  - No code dependencies (pure file creation)
  - Sequential numbering (features 278-282 already completed, 283 is next)
  - Established patterns from 280+ prior implementations

  ### Relevant Technologies

  - **Markdown**: Simple text format with H1 heading syntax (`# Title`)
  - **Git**: Version control for staging, committing, and pushing
  - **File I/O**: Write operations to create .md files
  - **Conventional Commits**: Git commit message standard (feat(N): description)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | New markdown file (test-5pi0d2.md) will be created at project root |
  | .git/objects | Medium | New commit and push add objects to git history |
  | Git Staging Area | Medium | File must be staged and committed using git add/commit/push |

  ## Dependencies

  **Internal Dependencies**: None — this feature is self-contained and doesn't depend on
  other features or code modules.

  **External Dependencies**:
  - Git command-line tools (for version control operations)
  - File system write permissions (to create .md file)
  - Markdown specification (simple format, well-established)

  **Established Precedents**:
  - 280+ completed markdown test files (test-8hjiqa.md, test-440dhk.md, etc.)
  - Established commit message pattern from features 278-282
  - Consistent file structure: H1 heading + 2-3 prose sentences

  ## Success Criteria

  - [ ] File test-5pi0d2.md is created in repository root
  - [ ] File contains a valid markdown H1 heading (e.g., `# Title Here`)
  - [ ] File contains 2-3 sentences of prose content
  - [ ] File is staged and committed with conventional commit message
  - [ ] Commit is pushed to feat/283-markdown-file-creation-5fc692 branch
  - [ ] File size is approximately 400-600 bytes (natural outcome of structure)

  ## Size Estimate

  **S** (hours) — This is a trivial, single-operation task. The implementation involves:
  - Creating a single text file (1 minute)
  - Writing a title and 3 sentences (2 minutes)
  - Git add/commit/push operations (2 minutes)
  - Total: ~5 minutes of execution time

  This estimate is informed by 280+ completed identical features with consistent execution
  times and proven feasibility.
