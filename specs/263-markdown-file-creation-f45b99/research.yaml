  **Reused Utilities from src/sheep/content_generators.py:**
  - generate_markdown_content() — LLM content generation
  - write_markdown_file() — file writing with validation
  - validate_markdown_file() — comprehensive file validation
  - commit_markdown_file() — git staging and commit
  - push_markdown_file() — git push with upstream

  **No new source files needed.** Everything is orchestration of existing utilities.

