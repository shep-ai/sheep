content: |
  ## Problem Statement

  The user wants a single markdown file named test-i3yjp8.md created in the repository root. The file
  should contain an H1 markdown heading (title) and 2-3 sentences of prose content. This is part of a
  series of 263 similar markdown file creation features that test and exercise the platform's ability
  to automate content creation and git workflows.

  This feature leverages fully mature infrastructure (content generation utilities, git tooling)
  established through 262 preceding identical features. The implementation is straightforward
  orchestration of existing components with no new code patterns or infrastructure required.

  ## Success Criteria

  - [ ] File named test-i3yjp8.md created in repository root
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains exactly 2-3 sentences of coherent prose content
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings
  - [ ] File ends with trailing newline (POSIX convention)
  - [ ] File is staged, committed, and pushed to remote branch
  - [ ] Commit message follows format: feat(263): Create markdown file test-i3yjp8.md with prose content
  - [ ] No other existing files are modified (test-i3yjp8.md itself may be created or overwritten)

  ## Functional Requirements

  - **FR-1: Content Generation** — Generate markdown content with H1 heading as title and exactly 2-3 sentences of prose
  - **FR-2: File Creation** — Create single markdown file at repository root with exact name test-i3yjp8.md
  - **FR-3: Encoding** — Use UTF-8 encoding without BOM for file operations
  - **FR-4: Line Endings** — Use Unix LF line endings throughout file
  - **FR-5: File Format** — Include trailing newline to conform to POSIX conventions
  - **FR-6: Git Operations** — Stage, commit, and push file to remote branch with conventional commit message
  - **FR-7: Isolation** — Do not read, modify, or delete any existing files in the repository except test-i3yjp8.md (which is the target file for this feature)

  ## Non-Functional Requirements

  - **NFR-1: Performance** — Complete entire workflow within 5 minutes
  - **NFR-2: Consistency** — Implementation must follow established patterns from features 1-262
  - **NFR-3: Maintainability** — Reuse existing utilities (no code duplication)
  - **NFR-4: Idempotency** — Feature execution must be fully repeatable; running it multiple times produces the same result without manual cleanup

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | How should prose content be generated? | Simple hardcoded string | Supports testing/automation goal; maintains consistency across all 263 features; reduces external dependencies |
  | 2 | How to handle if test-i3yjp8.md already exists? | Overwrite existing file | Enables idempotent, repeatable automation; file is auto-generated with no manual edits to lose; aligns with CI/CD best practices |
  | 3 | What validation for prose? | No automated validation | Subjective validation is impractical; manual PR review catches issues; aligns with testing-focused feature purpose |

  ## Codebase Analysis

  ### Project Structure

  This repository is the \"Sheep\" agentic platform for automated code implementation using CrewAI.
  The structure is organized as:

  - **src/sheep/** - Main Python package containing platform logic
    - **agents/** - CrewAI agent definitions for various tasks
    - **config/** - Configuration management (settings, LLM factory)
    - **flows/** - Flow definitions for orchestrating agent tasks
    - **tools/** - Tool implementations for git, file, and web operations
    - **observability/** - Logging and Langfuse tracing integration
    - **cli.py** - Command-line interface entry point

  - **specs/** - Feature specifications with YAML specs and planning documents

  - **Root directory** - Contains 262+ generated markdown files (test-*.md) from previous features,
    along with Python scripts for feature implementation

  ### Architecture Patterns

  1. **Modular Utilities Pattern**: The project centralizes reusable functionality:
     - Content generation is abstracted into helper functions
     - File writing follows consistent patterns (UTF-8 encoding, Unix line endings)
     - Git operations are standardized (conventional commits, push workflows)

  2. **Established Workflow**: All 262+ markdown file creation features follow this identical pattern:
     1. Generate markdown content with H1 heading + 2-3 sentences
     2. Write file to repository root
     3. Stage and commit with conventional commit message
     4. Push to remote branch

  3. **Simplicity Through Repetition**: The 262 preceding features demonstrate that the infrastructure
     is mature and stable. Each feature is a straightforward orchestration of existing patterns.

  ### Relevant Technologies

  - **Markdown**: Content format for generated files (standard text with H1 headings and prose)
  - **Python**: Language for implementation (file I/O, string manipulation)
  - **GitPython**: Library for git operations (commit, push)
  - **CrewAI**: Optional for LLM-based content generation (if used)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Create or overwrite single markdown file (~300-500 bytes) with no modifications to other existing files |
  | Git staging area | Low | Stage and commit file as part of standard workflow |
  | Git remote | Low | Push file to existing feature branch |

  ## Dependencies

  - **Python standard library**: `pathlib`, `os` for file operations
  - **GitPython**: For git commit and push operations (if using git workflows)
  - **Markdown format**: Understanding of basic markdown syntax (H1 headings, text content)

  The implementation can reuse patterns from the 262 preceding features. No complex dependencies or
  external APIs are required beyond basic file I/O and git operations.

  ## Size Estimate

  **S** — This is a trivial, single-file creation task with no code changes, no tests, and no integration
  required. The entire workflow (content generation, file writing, git operations) can be completed in
  under 1 hour. The infrastructure and patterns are fully established through 262 preceding identical
  features. Implementation is straightforward execution of existing patterns with no novel architecture,
  design decisions, or complex problem-solving required.
