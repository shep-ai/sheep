content: |
  ## Summary

  Feature 263 implementation is orchestration of proven utilities across 4 phases:

  **Phase 1 (1.5h):** Set up module structure with metadata and LLM-based content generation (tasks 1-2).
  Generate markdown content once per execution using Claude reasoning model.

  **Phase 2 (1.5h):** Implement file operations: write file to repository root with correct encoding/line
  endings (task 3), validate file meets all structural and encoding requirements (task 4).

  **Phase 3 (1.5h):** Implement git integration: commit file with conventional message (task 5), push to
  remote with upstream tracking (task 6).

  **Phase 4 (1.5-2h):** Wire orchestration function that choreographs all 5 steps (task 7), add standalone
  execution mode (task 8), comprehensive integration test (task 9).

  **Key pattern:** Each task builds on previous ones. All tasks reuse proven utilities from content_generators.py.
  No new code patterns or dependencies. Implementation mirrors feature_262 exactly (intentionally — consistency
  is the goal).

  **Testing strategy:** TDD approach for each task (write failing test first, implement minimal code to pass,
  refactor). Integration test verifies all success criteria are met end-to-end.

  **Risk mitigation:** Use same utilities as feature_262; if they work there, they work here. No custom
  implementations = low risk.
