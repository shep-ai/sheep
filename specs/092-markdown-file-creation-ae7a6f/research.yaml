  - title: Prose Content Generation
    chosen: Hardcode prose content directly in implementation
    rejected:
      - 'Dynamic/randomized generation — Adds complexity, external dependencies, testing difficulty; spec allows flexible topic but not required'
      - 'Template system or external prose library — Over-engineered; single 3-sentence paragraph does not justify template infrastructure'
    rationale: >
      Spec explicitly states "Topic selection for prose content is flexible — any generic/universal
      topic is acceptable" (FR-5). Hardcoding is simplest, deterministic, and fastest.
      Prose is quality-controlled at authoring time, not runtime. Matches pattern from
      prior 90+ features which all use hardcoded prose.

  - title: Git Operation Approach
    chosen: Use subprocess module to call git commands (git add, git commit, git push)
    rejected:
      - 'GitPython library — Adds external dependency (not in pyproject.toml); subprocess is built-in and explicit for simple operations'
      - 'Existing src/sheep/tools/git_tools.py — Not needed for straightforward operations; adds unnecessary coupling to agent infrastructure'
    rationale: >
      Three simple sequential operations (git add, commit, push) are transparent and
      straightforward via subprocess. No external dependencies. Explicit and easy to debug.
      Standard approach for simple git workflows in Python scripts. Subprocess is built-in
      and requires no additional setup.

  - title: Line Ending Enforcement
    chosen: Use newline parameter in Path.write_text() — specifically write_text(content, newline='\n')
    rejected:
      - 'Post-write normalization (read, replace \\r\\n with \\n, rewrite) — Additional I/O, more complex, error-prone'
      - 'Rely on git autocrlf configuration — Not portable; depends on individual git config and platform; not guaranteed'
    rationale: >
      Spec explicitly requires "Unix-style line endings (LF, \n only — not CRLF)" (NFR-2).
      Using newline='\n' parameter in write_text() is explicit, guaranteed to work across
      platforms (Windows, Linux, macOS), and adds no complexity. Direct and most reliable approach.

  - title: Platform Compatibility
    chosen: Write path as repository-relative (Path("test-1vmxtp.md")) ensuring consistency across Windows/Linux/macOS
    rejected:
      - 'Hard-coded absolute paths — Brittle, breaks across different machines and CI environments'
