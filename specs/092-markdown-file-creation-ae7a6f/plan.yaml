# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 092 is a minimal, self-contained implementation that creates a single markdown
  file following an established pattern proven across 90+ prior features (069–091). The
  feature has no dependencies on the Sheep application codebase (src/sheep/), no code
  modifications, and no configuration changes.

  **Pattern Precedent:**
  The repository already contains 90+ test markdown files (test-*.md) created by features
  069–091, all following an identical structure:
  ```
  # [H1 Heading / Title]

  [2-3 sentences of prose content]
  ```

  - All files reside at repository root (no subdirectories)
  - File size range: 320–600 bytes (consistent across prior features)
  - Encoding: UTF-8 without BOM, Unix-style LF line endings (\n)
  - Git workflow: `git add` → `git commit` (conventional format) → `git push` to feature branch

  Feature 092 adds one more file to this collection using the same proven pattern.

  **Integration with Codebase:**
  - Independent operation — does not depend on or modify source code
  - Follows existing convention — file placement, format, size, git workflow all established
  - No state changes — creates one new file only; does not modify existing files
  - Standard git workflow — uses built-in git commands, feature branch pre-exists

  ## Key Design Decisions

  ### 1. File Creation Method: Python pathlib

  **Decision:** Use `Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rationale:**
  - Spec explicitly requires pathlib (FR-1)
  - Modern Python best practice; abstracts cross-platform path handling
  - Atomic write operation; handles encoding and newline specification elegantly
  - No external dependencies; standard library only
  - Matches pattern from all 90+ prior features (069–091)

  **Alternatives rejected:**
  - `open()` function — verbose, requires explicit close(); less Pythonic
  - `os` module — lower-level, non-idiomatic; pathlib is the modern standard

  ### 2. Prose Content: Hardcoded (No Randomization)

  **Decision:** Write prose content directly in code (fixed topic, fixed text)

  **Rationale:**
  - Spec allows "flexible" topic selection (FR-5) but requires "grammatically correct,
    coherent, and complete" prose (FR-4)
  - Hardcoding ensures quality control at authoring time, not runtime
  - Simplest approach with zero complexity, no external dependencies, no testing overhead
  - Deterministic and reproducible
  - Matches all 90+ prior features which use hardcoded prose
  - Topic selection: generic, universal (e.g., "The Value of Curiosity", "Why Consistency Matters")

  **Alternatives rejected:**
  - Dynamic/randomized generation — adds complexity, external dependencies, harder to validate
  - Template system (Jinja2, etc.) — over-engineered for a single 3-sentence paragraph

  ### 3. Git Operations: Subprocess Module

  **Decision:** Call `git add`, `git commit`, `git push` via Python subprocess

  **Rationale:**
  - Three simple, sequential operations are transparent and explicit via subprocess
  - Built-in Python module; no external dependencies
  - Easy to understand, debug, and log
  - Standard approach for simple Python→git workflows
  - Commands are hardcoded (no user input, no injection risk)

  **Alternatives rejected:**
  - GitPython library — adds external dependency not in pyproject.toml
  - src/sheep/tools/git_tools.py — overkill for straightforward operations; unnecessary coupling

  ### 4. Line Ending Enforcement: Explicit newline Parameter

  **Decision:** Use `newline='\n'` parameter in `Path.write_text()`

  **Rationale:**
  - Spec requires "Unix-style line endings (LF, \n only — not CRLF)" (NFR-2)
  - Explicit parameter guarantees LF line endings across all platforms (Windows, Linux, macOS)
  - Portable and reliable; does not depend on git config (autocrlf) which is platform-dependent
  - Adds zero complexity; single parameter in write_text() call
  - Most direct and reliable approach

  **Alternatives rejected:**
  - Post-write normalization — additional I/O, more complex, error-prone
  - Rely on git autocrlf configuration — not portable; platform/user-config dependent

  ### 5. File Encoding: UTF-8 Without BOM

  **Decision:** Use `encoding='utf-8'` parameter in `Path.write_text()` (no BOM)

  **Rationale:**
  - Spec requires "UTF-8 encoded without BOM" (NFR-1)
  - Standard `encoding='utf-8'` produces UTF-8 without BOM (Python default behavior)
  - No special handling needed; safe and standard
  - Matches all 90+ prior features

  ## Implementation Strategy

  The implementation follows two straightforward phases:

  **Phase 1: File Creation & Validation**
  Create the markdown file with hardcoded H1 heading and 2-3 sentences of prose.
  Validate that the file meets all quality requirements: encoding, line endings, file size.
  This phase produces the artifact and ensures it matches the established pattern.

  **Phase 2: Git Workflow**
  Stage the file, commit with conventional commit message format, and push to the feature
  branch. This phase integrates the artifact into version control and completes the feature.

  Both phases use standard library tools (pathlib, subprocess) with no external dependencies.
  The pattern is proven and straightforward; no architectural decisions or complexity needed.

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Line ending issues (CRLF on Windows) | Low | Explicit `newline='\n'` parameter in write_text() guarantees LF encoding on all platforms |
  | File size outside 320–600 byte range | Very Low | Prose content is simple and straightforward; easy to validate and adjust if needed |
  | Git push fails | Very Low | Feature branch pre-exists; no merge conflicts expected; standard git workflow with no force flags |
  | Encoding/BOM issues | Very Low | Explicit `encoding='utf-8'` parameter (Python default, no BOM) ensures correct encoding |
  | File path issues | Very Low | Relative path (Path("test-1vmxtp.md")) works cross-platform with pathlib; standard in git repo context |

