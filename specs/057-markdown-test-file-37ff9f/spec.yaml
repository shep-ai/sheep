content: |
  ## Problem Statement

  Create a single markdown file named `test-czw2u7.md` in the repository root directory containing a title (markdown heading)
  and 2-3 sentences of prose about any topic of choice. This continues the established pattern of markdown test files
  in the repository.

  ## Success Criteria

  - [ ] File `test-czw2u7.md` exists in repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line)
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] All content uses valid markdown syntax
  - [ ] File is committed to git with a conventional commit message (e.g., `feat: Create markdown test file test-czw2u7.md`)
  - [ ] Commit message follows project conventions (likely `feat(docs):` or `feat:` prefix)
  - [ ] File structure and naming convention matches related features (049-056)

  ## Functional Requirements

  - **FR-1**: File must be created with the exact filename `test-czw2u7.md` (case-sensitive)
  - **FR-2**: File must be placed in the repository root directory (same level as README, LICENSE, etc.)
  - **FR-3**: File must contain a single markdown H1 heading (using `#` syntax) as the first line, serving as the title
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following the heading (separated by a blank line or directly after heading)
  - **FR-5**: File must use valid markdown syntax throughout (properly formatted headings, valid punctuation, standard paragraph formatting)
  - **FR-6**: File must be added to git staging area and committed as part of this feature branch
  - **FR-7**: Commit message must follow conventional commits format and describe the file creation

  ## Non-Functional Requirements

  - **NFR-1**: File must comply with markdown syntax standards (CommonMark or GFM compatible)
  - **NFR-2**: File structure and content must be consistent with established pattern from related features 049-056 (H1 heading + 2-3 sentences format)
  - **NFR-3**: Content should be human-readable with standard grammar and punctuation conventions
  - **NFR-4**: File must be compatible with standard markdown renderers (GitHub markdown preview, VS Code, etc.)
  - **NFR-5**: Topic choice should be accessible and clear to readers (avoid obscure jargon without explanation)
  - **NFR-6**: File size should be minimal (less than 1 KB expected) to maintain repository cleanliness

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose topics be unrestricted or guided? | Unrestricted topic choice | Specification explicitly states "any topic," established pattern (features 049-056) shows diverse topics without constraints, and this maximizes developer autonomy for a simple content-creation task. |

  ## Codebase Analysis

  ### Project Structure

  The repository (Sheep) is an agentic platform for automated code implementation built with CrewAI. The project organization
  includes:

  - **Root directory**: Contains multiple markdown files, many of which are outputs from similar features (049-056)
  - **specs/ directory**: Feature specifications organized by feature number (008-057+)
  - **src/ directory**: Python source code for the Sheep platform itself
  - **github/ directory**: GitHub Actions workflows and templates

  The repository follows a pattern where features 049-057 are dedicated to creating simple markdown test files.

  ### Architecture Patterns

  This is a content-creation feature, not a code feature, so traditional architecture patterns do not apply. The pattern observed
  in the repository is:

  - Each markdown test file is created in the repository root
  - Files follow naming convention: `test-XXXXXX.md` where X is a random alphanumeric character
  - Each file contains a single markdown heading (H1) followed by 2-3 sentences of prose
  - No dependencies between files; each is independent
  - Diverse topics are acceptable (Fibonacci, recursion, simplicity, continuous learning, etc.)

  ### Relevant Technologies

  - **Markdown**: Standard markdown syntax for the content file
  - **Git**: Version control for tracking the new file

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single new markdown file will be created in the root directory alongside existing test files |
  | specs/057-markdown-test-file-37ff9f/ | Low | Specification and metadata files already exist in this directory (untracked) |
  | Git history | Low | Single new commit will record the file creation |

  ## Dependencies

  **None** — This feature has no dependencies on:
  - External libraries or frameworks
  - Existing code in the repository
  - Other features or systems

  The markdown file is a standalone artifact with no integrations or dependencies.

  ## Size Estimate

  **S** — This is a trivial feature requiring only:
  1. Choose a topic for the prose content (unrestricted)
  2. Create the markdown file with a title and 2-3 sentences (estimated 5-15 minutes)
  3. Commit and push (automated via git commands)

  No complexity, no dependencies, no integration points. This follows the established pattern from features 049-056
  which were similarly straightforward.
