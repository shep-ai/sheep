content: |
  ## Problem Statement

  Create a single markdown file named `test-czw2u7.md` in the repository root directory containing a title (markdown heading)
  and 2-3 sentences of prose about any topic of choice. This continues the established pattern of markdown test files
  in the repository.

  ## Codebase Analysis

  ### Project Structure

  The repository (Sheep) is an agentic platform for automated code implementation built with CrewAI. The project organization
  includes:

  - **Root directory**: Contains multiple markdown files, many of which are outputs from similar features (049-056)
  - **specs/ directory**: Feature specifications organized by feature number (008-057+)
  - **src/ directory**: Python source code for the Sheep platform itself
  - **github/ directory**: GitHub Actions workflows and templates

  The repository follows a pattern where features 049-057 are dedicated to creating simple markdown test files.

  ### Architecture Patterns

  This is a content-creation feature, not a code feature, so traditional architecture patterns do not apply. The pattern observed
  in the repository is:

  - Each markdown test file is created in the repository root
  - Files follow naming convention: `test-XXXXXX.md` where X is a random alphanumeric character
  - Each file contains a single markdown heading (H1) followed by 2-3 sentences of prose
  - No dependencies between files; each is independent

  ### Relevant Technologies

  - **Markdown**: Standard markdown syntax for the content file
  - **Git**: Version control for tracking the new file

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single new markdown file will be created in the root directory alongside existing test files |
  | specs/057-markdown-test-file-37ff9f/ | Low | Specification and metadata files already exist in this directory (untracked) |
  | Git history | Low | Single new commit will record the file creation |

  ## Dependencies

  **None** — This feature has no dependencies on:
  - External libraries or frameworks
  - Existing code in the repository
  - Other features or systems

  The markdown file is a standalone artifact with no integrations or dependencies.

  ## Size Estimate

  **S** — This is a trivial feature requiring only:
  1. Choose a topic for the prose content
  2. Create the markdown file with a title and 2-3 sentences (estimated 5-15 minutes)
  3. Commit and push (automated via git commands)

  No complexity, no dependencies, no integration points. This follows the established pattern from features 049-056
  which were similarly straightforward.
