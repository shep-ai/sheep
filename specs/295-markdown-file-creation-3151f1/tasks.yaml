content: |
  ## Summary

  Feature 295 will be implemented across 5 phases in 9 sequential tasks:

  **Phase 1: Foundation** (1 task) establishes module structure, imports, and logging configuration.
  This provides the baseline for all subsequent work and takes ~30 minutes.

  **Phase 2: Content Generation** (2 tasks) implements Claude API integration to generate prose
  (45 min) and validation logic to verify content quality (30 min). This is the critical business
  logic that creates the intellectual content.

  **Phase 3: File Creation** (2 tasks) constructs markdown file structure using pathlib (30 min)
  and verifies the written file meets all structural requirements (20 min). This produces the
  tangible output artifact.

  **Phase 4: Git Operations** (2 tasks) stages the file and commits with conventional message
  (25 min) then pushes to the feature branch (20 min). This integrates the feature into version
  control as required.

  **Phase 5: Integration & Validation** (2 tasks) creates comprehensive integration test (40 min)
  and performs manual end-to-end verification against actual repository (20 min). This confirms
  the entire workflow functions correctly.

  **Total estimated effort: 2 hours 50 minutes** of focused development work. No new dependencies
  or architectural changes required; all technologies used are already available in the Sheep
  platform.

  ## Task Execution Notes

  - Each code task (1-8) includes TDD cycle: RED (write failing test), GREEN (minimal implementation),
    REFACTOR (clean up and improve)
  - Task 9 (manual verification) is non-code work; no TDD cycle needed
  - Dependencies ensure sequential execution without circular dependencies
  - Phases 1, 2, 3, 4 are strictly sequential; Phase 5 depends on all previous phases
  - Total execution could be compressed to ~2 hours if executing tasks very efficiently
  - Recommended pace: 1-2 tasks per session with time for testing between task groups
