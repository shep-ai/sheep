name: "markdown-file-creation-3151f1"
summary: >
  9 tasks across 5 phases to implement feature 295. Foundation setup → content generation →
  file creation → git operations → integration testing. TDD approach with red-green-refactor
  cycles for all code tasks. Total estimated effort: 2.5-3 hours.

relatedFeatures:
  - number: 294
    name: "markdown-file-creation-d5f4d7"
    relationship: "Reference implementation for identical workflow pattern"
  - number: 293
    name: "markdown-file-creation-aced5f"
    relationship: "Proven pattern and architecture"

technologies:
  - "Python 3.11+ (runtime)"
  - "pathlib (file I/O)"
  - "GitPython 3.1.0+ (git operations)"
  - "Anthropic Claude API (content generation)"
  - "structlog (logging)"
  - "pytest (testing framework)"

relatedLinks:
  - title: "CommonMark Markdown Specification"
    url: "https://spec.commonmark.org/"
  - title: "Python pathlib Documentation"
    url: "https://docs.python.org/3/library/pathlib.html"
  - title: "GitPython Documentation"
    url: "https://gitpython.readthedocs.io/"

tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Set up Python module structure and imports"
    description: |
      Create or identify Python module for feature 295 implementation. Establish baseline
      structure with required imports (pathlib, git, structlog, sheep.config). Configure
      structured logging with appropriate log levels for observability.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "Module can be imported without errors"
      - "Required imports present: pathlib.Path, git.Repo, structlog, sheep.config"
      - "structlog logger is configured with feature context"
      - "Module has clear function signatures for content generation, file creation, git operations"
    tdd:
      red:
        - "Write test that imports module and verifies all required imports are available"
        - "Write test that confirms structlog logger is initialized"
      green:
        - "Create module with all required imports"
        - "Initialize structlog logger with appropriate context (feature ID, branch)"
      refactor:
        - "Extract logging configuration to separate function if complex"
        - "Verify imports follow PEP 8 conventions"
    estimatedEffort: "30min"

  - id: "task-2"
    phaseId: "phase-2"
    title: "Implement content generation using Claude API"
    description: |
      Implement function that calls Claude API via sheep.config.llm.get_reasoning_llm()
      to generate 2-3 sentences of prose about any topic. Use simple prompt approach.
      Include error handling for API failures (network, rate limit, timeout).
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "Function returns non-empty string from Claude API"
      - "Generated content is appropriate prose (not errors or malformed output)"
      - "Function includes try-except block for API errors"
      - "Errors are logged with structured context (feature ID, error type, message)"
      - "Function completes within reasonable time (~3 seconds typical)"
    tdd:
      red:
        - "Write test that calls content generation function and verifies non-empty string returned"
        - "Write test that confirms generated string contains recognizable English prose"
        - "Write test that verifies error handling when API call fails (mock API error)"
      green:
        - "Implement function that calls sheep.config.llm.get_reasoning_llm()"
        - "Construct simple prompt: 'Generate 2-3 sentences of coherent prose about any topic'"
        - "Add try-except for APIError, Timeout, etc. with structured logging"
      refactor:
        - "Extract prompt to module constant for reusability"
        - "Improve error logging with additional context fields"
    estimatedEffort: "45min"

  - id: "task-3"
    phaseId: "phase-2"
    title: "Add validation for generated prose content"
    description: |
      Implement lenient validation for generated prose: verify presence, approximate sentence
      count (at least 2 sentences), and approximate length (100-500 characters). Accept
      natural variation from LLM output. Log validation results.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "Validation function returns True for valid prose, False for invalid"
      - "Valid prose: contains at least 2 sentence-ending punctuation marks (.!?)"
      - "Valid prose: length between 100-500 characters"
      - "Invalid prose is logged with specific validation failure reason"
      - "Lenient validation accepts prose with 2-4 sentences (not strict 2-3)"
    tdd:
      red:
        - "Write test that validates good prose (2-3 sentences) returns True"
        - "Write test that validates too-short content returns False"
        - "Write test that validates content with too few sentences returns False"
        - "Write test that validates content with 4 sentences still returns True (lenient)"
      green:
        - "Implement validation function with sentence count check (split on .!?)"
        - "Implement length check (100-500 chars)"
        - "Return True/False based on validation results"
      refactor:
        - "Extract magic numbers (100, 500, 2) to named constants"
        - "Improve punctuation detection robustness if needed"
        - "Add logging for validation failures with specific reason"
    estimatedEffort: "30min"

  - id: "task-4"
    phaseId: "phase-3"
    title: "Implement markdown file creation with pathlib"
    description: |
      Create function that takes prose content and constructs markdown file with:
      - H1 heading (# Title)
      - Blank line separator
      - Prose content
      Write to disk as test-7z6o6n.md in repository root using pathlib.Path.write_text()
      with UTF-8 encoding. Include error handling for file I/O failures.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File test-7z6o6n.md is created in repository root"
      - "File first line is H1 heading (# followed by title)"
      - "Blank line exists between heading and prose (second line is empty)"
      - "File is written with UTF-8 encoding (no BOM)"
      - "pathlib.Path used for all file operations"
      - "File I/O errors are caught and logged"
    tdd:
      red:
        - "Write test that calls file creation function and verifies file exists"
        - "Write test that reads file and verifies first line contains '# '"
        - "Write test that verifies second line is blank"
        - "Write test that verifies file contains prose content"
        - "Write test that verifies UTF-8 encoding (no BOM in raw bytes)"
      green:
        - "Implement function that constructs markdown string: '# Title\\n\\n{prose}'"
        - "Use pathlib.Path('.') / 'test-7z6o6n.md' to resolve path"
        - "Write using path.write_text(content, encoding='utf-8')"
        - "Return path or confirmation that file was written"
      refactor:
        - "Extract title generation to separate function if needed"
        - "Verify line endings are consistent (LF on Unix, but Python handles this)"
        - "Add pre-write existence check and logging"
    estimatedEffort: "30min"

  - id: "task-5"
    phaseId: "phase-3"
    title: "Verify markdown structure and file encoding"
    description: |
      Create validation function that verifies written file meets markdown format
      requirements: proper H1 heading, blank line separator, prose content length,
      and UTF-8 encoding without BOM. This is post-write verification.
    state: "Todo"
    dependencies:
      - "task-4"
    acceptanceCriteria:
      - "Verification reads file and checks all structural requirements"
      - "Verifies first line matches '# {title}' pattern"
      - "Verifies blank line at position 2"
      - "Verifies prose starts at line 3 and has content"
      - "Verifies file encoding is UTF-8 (reads raw bytes and checks for BOM)"
      - "Returns True/False with descriptive error messages"
    tdd:
      red:
        - "Write test that verifies valid markdown file passes all checks"
        - "Write test that fails if H1 heading is missing"
        - "Write test that fails if blank line separator is missing"
        - "Write test that detects UTF-8 BOM and reports error"
      green:
        - "Implement function that reads file content and header lines"
        - "Check first line pattern: startswith('# ')"
        - "Check second line is empty"
        - "Check file size and prose length are reasonable"
        - "Read raw bytes and check for UTF-8 BOM (EF BB BF)"
      refactor:
        - "Improve error messages with specific failure reasons"
        - "Extract magic strings and patterns to constants"
    estimatedEffort: "20min"

  - id: "task-6"
    phaseId: "phase-4"
    title: "Implement git staging and commit operations"
    description: |
      Implement function using GitPython to stage the created markdown file
      and commit with conventional commit message:
      \"feat(295): create markdown file test-7z6o6n.md with prose content\"
      Include error handling for git command failures.
    state: "Todo"
    dependencies:
      - "task-4"
    acceptanceCriteria:
      - "File is staged in git index (appears in git status)"
      - "Commit is created with exact message format"
      - "Commit hash is returned or logged for tracing"
      - "Git errors (permissions, detached HEAD, etc.) are caught and logged"
      - "Structured logging includes commit context"
    tdd:
      red:
        - "Write test that mocks Repo and verifies add() called with correct filename"
        - "Write test that mocks Repo and verifies commit() called with correct message"
        - "Write test that verifies error handling if git command fails"
      green:
        - "Implement function using git.Repo('.')"
        - "Call repo.index.add(['test-7z6o6n.md'])"
        - "Call repo.index.commit('feat(295): create markdown file test-7z6o6n.md with prose content')"
        - "Capture and return commit hash"
      refactor:
        - "Extract commit message to constant for reusability"
        - "Improve error messages with git stderr details"
        - "Add post-commit verification logging"
    estimatedEffort: "25min"

  - id: "task-7"
    phaseId: "phase-4"
    title: "Implement git push to feature branch"
    description: |
      Implement function using GitPython to push the commit to the feature branch
      \"feat/295-markdown-file-creation-3151f1\" on the remote repository.
      Include error handling for network failures, authentication issues, and branch conflicts.
    state: "Todo"
    dependencies:
