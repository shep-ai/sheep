  - question: "How should generated prose be prompted to ensure quality and length?"
    resolved: true
    options:
      - option: "Simple prompt: 'Write 2-3 sentences about any topic'"
        description: "Minimal prompt relying on Claude's default capabilities"
        selected: true
      - option: "Detailed system prompt with examples and constraints"
        description: "Explicit system prompt with examples and strict tone/length guidelines"
        selected: false
      - option: "Multi-turn prompt engineering with validation feedback"
        description: "Initial prompt + validation + regeneration if out of spec"
