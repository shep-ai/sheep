content: |
  ## Problem Statement

  Create a single markdown file named `test-7z6o6n.md` in the repository root directory with a properly formatted markdown structure: an H1 heading as the title on the first line, followed by a blank line, then exactly 2-3 sentences of coherent prose content about any topic. This feature is part of an established series (features 289-294+) that demonstrates the Sheep automation platform's capability to consistently execute simple, repetitive file creation tasks while maintaining pattern fidelity and quality standards.

  ## Success Criteria

  - [ ] File "test-7z6o6n.md" exists in the repository root directory
  - [ ] File contains exactly one H1 heading as the first line (markdown format: `# Title`)
  - [ ] Blank line exists between the H1 heading and prose content
  - [ ] File contains 2-3 sentences of coherent prose content about any topic
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File is staged in git (appears in `git add` output)
  - [ ] File is committed with message: "feat(295): create markdown file test-7z6o6n.md with prose content"
  - [ ] Commit appears on the feature branch (feat/295-markdown-file-creation-3151f1)
  - [ ] Feature branch is pushed to remote repository
  - [ ] File validates against CommonMark specification (no syntax errors)

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly "test-7z6o6n.md" in the repository root directory (no subdirectories)
  - **FR-2**: File must begin with an H1 heading in CommonMark format (single `#` followed by space and title text)
  - **FR-3**: Exactly one blank line must separate the H1 heading from the prose content
  - **FR-4**: File must contain 2-3 sentences of coherent, grammatically correct prose content
  - **FR-5**: Prose content may be about any topic (no topic restrictions)
  - **FR-6**: File must be written with UTF-8 encoding (standard text encoding for markdown files)
  - **FR-7**: File must be staged in git using `git add` command
  - **FR-8**: File must be committed to the feature branch with conventional commit message: "feat(295): create markdown file test-7z6o6n.md with prose content"
  - **FR-9**: Commit must be pushed to the remote repository on the feature branch (feat/295-markdown-file-creation-3151f1)
  - **FR-10**: Implementation must follow the established workflow pattern from features 289-294 (generate content → create file → stage → commit → push)

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must use pathlib for all file I/O operations (cross-platform compatibility)
  - **NFR-2**: Implementation must use GitPython 3.1.0+ for git operations (add, commit, push)
  - **NFR-3**: Content generation should use Claude API via `sheep.config.llm.get_reasoning_llm()` (standard platform integration)
  - **NFR-4**: All operations should be logged via structlog for observability and debugging traceability
  - **NFR-5**: Implementation must be compatible with Python 3.11+ and CrewAI 0.86.0+ (platform versions)
  - **NFR-6**: Implementation must follow the architecture patterns established in features 289-294 (no new patterns)
  - **NFR-7**: File structure must be valid CommonMark markdown (verifiable against spec.commonmark.org)
  - **NFR-8**: Implementation should complete within a single feature development cycle (commit-ready within this feature)
  - **NFR-9**: No modifications to existing source code, configuration files, or other features (isolated change)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the implementation use Claude API for content generation or pre-defined prose? | Claude API generation | Aligns with Sheep platform design, maintains consistency with features 289-294, and authentically demonstrates LLM integration capabilities |
  | 2 | Should sentence count validation be strict (exactly 2-3) or lenient? | Lenient validation | Pragmatic for LLM-generated content; core requirement is meaningful prose, not mathematical exactness; reduces complexity and retries |
  | 3 | Should the commit message follow the exact format from features 289-294? | Exact pattern consistency | Preserves git history readability, enables automation, and maintains the proven pattern that has worked for 50+ features |

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is organized as follows:
  - **Root directory**: Contains markdown test files (test-*.md pattern), configuration files (pyproject.toml, .env.example), Docker setup, and git metadata
  - **src/**: Contains the Python implementation, with `create_markdown.py` providing utilities for content generation, validation, and git operations
  - **src/sheep/**: Main platform source code with modular subdirectories (agents, flows, tools, config, observability)
  - **specs/**: Specifications for features numbered sequentially (006-295+), each in its own directory with spec.yaml
  - **.github/**: GitHub workflows and CI/CD configuration
  - **tests/**: Test suite (pytest-based)

  ### Architecture Patterns

  The Sheep platform follows these key patterns:
  - **Separation of Concerns**: Flows (orchestration) vs. Crews (intelligence) vs. Tools (capabilities)
  - **LLM Integration**: Centralized LLM access via `sheep.config.llm.get_reasoning_llm()`, supporting Claude, OpenAI, and Google models
  - **Git-Based Workflow**: All features are isolated to feature branches, with conventional commit messages
  - **Observable Execution**: Full tracing via Langfuse with structured logging via structlog
  - **Modular Agent Design**: Specialized agents (Research, Implementation, Review) for specific tasks
  - **Simple File Creation Pattern**: For features 289-294+, the workflow is straightforward: generate content → create file → stage → commit → push

  ### Relevant Technologies

  - **CrewAI 0.86.0+**: Agentic framework providing agents, crews, flows, and task orchestration
  - **Claude API**: Via Anthropic SDK for intelligent content generation; accessed through `sheep.config.llm`
  - **GitPython 3.1.0+**: For git operations (add, commit, push) from Python
  - **pathlib**: Cross-platform file I/O for creating markdown files
  - **Markdown Format**: Simple CommonMark-compatible format (H1 heading + blank line + prose)
  - **structlog**: Structured logging framework for observable execution traces
  - **Pydantic 2.0+**: For validation of content and configuration
  - **Python 3.11+**: Required runtime; supports modern syntax and features
  - **UTF-8 Encoding**: Standard text encoding for markdown files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | High | The markdown file (test-7z6o6n.md) will be created here, which is the standard location for all test files in this series |
  | Git Repository | Low | File will be tracked by git on the feature branch; no changes to git configuration or infrastructure |
  | specs/295-markdown-file-creation-3151f1 | Medium | This spec file documents the feature definition and serves as the source of truth for requirements |
  | Feature Branch (feat/295-markdown-file-creation-3151f1) | High | All changes will be isolated to this branch and committed there before pushing |
  | Repository File Structure | None | No architectural changes; only addition of one new markdown file with no modifications to existing files or source code |

  ## Dependencies

  - **File System**: Standard file creation capability via Python pathlib (no external libraries required beyond Python standard library)
  - **Git**: Version control system already configured in the repository for staging, committing, and pushing
  - **Markdown Format**: Standard CommonMark-compatible markdown syntax (no special parsers or libraries needed for validation)
  - **Claude API Access**: For content generation via Sheep platform's `sheep.config.llm` integration (pre-configured based on features 289-293)
  - **No External APIs**: Content generation uses existing Sheep platform LLM integration, no additional API setup required
  - **No Database Requirements**: Pure file creation with persistence only through git history
  - **Git Hooks**: No special git hooks required; standard pre-commit/commit-msg hooks (if any) should work with conventional format

  ## Size Estimate

  **S** — This is an extremely minimal, straightforward task:

  - **Single file creation**: Requires creating one markdown file with standard H1 + prose format (~5 minutes of actual work)
  - **Established pattern**: Requirements are identical to features 289-294; no new architectural decisions or code changes needed
  - **Proven precedent**: 289+ previous features follow this exact same pattern, making this highly predictable and low-risk
  - **No testing or validation**: Beyond basic file existence and format verification
  - **Simple repetitive workflow**: Create file → stage in git → commit with conventional message → push
  - **Zero complexity**: No edge cases, error handling, or special requirements beyond standard operations

  The **S** estimate reflects the straightforward nature of the underlying task. Within the Sheep platform's context, the full feature cycle (spec analysis, implementation, review, CI/CD) may require additional time, but the core implementation itself is minimal and well-defined.
