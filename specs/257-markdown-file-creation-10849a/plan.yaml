content: |
  ## Architecture Overview

  Feature 257 follows the established pattern from features 255-256 for markdown
  file creation. The implementation is straightforward:

  1. **Feature Module Structure** — Procedural Python module at
     src/sheep/features/feature_257_markdown_file_creation.py (~35-40 lines)
  2. **Wrapper Function Composition** — Calls high-level functions from
     content_generators.py in sequence
  3. **Content Generation** — Uses Claude API via get_reasoning_llm() for
     markdown content with proven prompt template
  4. **File Validation** — Two-phase validation (content, then file properties)
  5. **Git Integration** — Uses GitCommitTool and GitPushTool wrappers for
     staging, committing, and pushing
  6. **Observability** — structlog-based logging at INFO/DEBUG levels

  The feature fits cleanly into the existing Sheep architecture:
  - No modifications to existing modules (zero source code changes)
  - Only imports from content_generators.py (high-level layer)
  - Respects existing CrewAI framework setup
  - Compatible with existing git workflow and CI/CD

  ## Key Design Decisions

  ### 1. Use High-Level Wrappers from content_generators.py
  **Chosen:** Import and call wrapper functions rather than low-level utilities.

  **Rationale:** Requirement FR-12 explicitly mandates high-level wrapper usage.
  The content_generators.py module provides clean abstractions that:
  - Handle content generation with validation
  - Implement file writing with UTF-8/LF guarantees
  - Provide git operations with error handling
  - Include logging and structured error messages
  - Are proven across 256+ prior features

  This approach simplifies the feature module to ~35-40 lines and ensures
  consistency with established patterns.

  ### 2. Two-Phase Validation Strategy
  **Chosen:** Validate generated content before persistence, then validate file.

  **Rationale:** Separates concerns and catches failures early:
  - generate_markdown_content() validates H1 structure, sentence count, length
  - validate_markdown_file() checks encoding, line endings, file size, syntax
  - Fail-fast approach: API failures trigger retry; validation failures propagate

  This satisfies FR-6, FR-7, and NFR-5 (fail-fast) while reusing proven
  validation functions.

  ### 3. Procedural Function-Based Design
  **Chosen:** Simple procedural function rather than class-based approach.

  **Rationale:** Matches 256+ precedents exactly. The feature module will be
  a single function with:
  - Feature metadata constants (FEATURE_NUMBER=257, FEATURE_NAME, etc.)
  - Main function: create_feature_257_markdown_file(repo_path=None)
  - Sequential workflow: generate → write → validate → commit → push
  - Dictionary return value with filepath, content, commit_message, push_result
  - if __name__ == \"__main__\" block for direct execution

  This approach keeps code simple and maintainable while following precedent.

  ### 4. structlog-Based Logging
  **Chosen:** Use structlog.get_logger(__name__) for all logging.

  **Rationale:** Requirement NFR-3 requires structured logging. structlog provides:
  - JSON-compatible output for monitoring integration
  - Context preservation across function calls
  - Already integrated throughout Sheep platform
  - Matches features 255-256 exactly

  Logging will include milestones (generate, write, validate, commit, push)
  at INFO level and details at DEBUG level.

  ### 5. Fail-Fast Error Handling
  **Chosen:** Top-level try-except; let wrapper exceptions propagate with context.

  **Rationale:** Requirement NFR-5 mandates fail-fast behavior. The approach:
  - Wraps entire workflow in try-except at function level
  - Allows exceptions from wrappers to propagate (ValueError, IOError, Exception)
  - Logs error with ERROR level and full context before re-raising
  - Error messages from wrappers clearly identify failure point

  This enables rapid detection and reporting of issues while maintaining
  consistency with established patterns.

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  **Phase 1: Feature Module Creation**
  - Create feature_257_markdown_file_creation.py with boilerplate structure
  - Define feature metadata constants (number, name, filename)
  - Implement main orchestration function with sequential wrapper calls
  - Add structlog logging for all major steps
  - Implement try-except error handling at function level
  - Return structured result dictionary

  This phase produces the feature module that will be executed.

  **Phase 2: Workflow Execution & Validation**
  - Execute the feature module to generate test-nm5lr3.md
  - Verify all success criteria are met:
    - File exists with correct name and structure
    - Content validation passes (H1, sentence count, length)
    - File validation passes (encoding, line endings, size)
    - Git operations succeed (add, commit, push)
  - Commit spec files (plan.yaml, tasks.yaml) to git

  This phase produces the artifact (test-nm5lr3.md) and validates it.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | API failure during content generation | generate_markdown_content() includes exponential backoff (3 retries); if all retries fail, exception propagates with clear message |
  | File I/O failure (disk full, permissions) | pathlib.Path.write_text() raises IOError; caught by top-level try-except; clear error message identifies failure |
  | Git operations fail (network, config) | GitCommitTool and GitPushTool include error handling; exceptions propagate with failure context |
  | Generated content fails validation | Validation in content_generators.py catches structure issues; feature module retries or fails-fast as appropriate |
  | Feature branch doesn't exist | Git push will fail with clear error; this is caught and reported; pre-requisite is that branch is created before feature execution |
  | Missing ANTHROPIC_API_KEY | CrewAI/Anthropic SDK will raise exception during API call; caught and logged with clear message |
  | Encoding/line ending issues | validate_markdown_file() explicitly checks; rejects CRLF, BOM, non-UTF-8; clear error if validation fails |

  All error conditions follow fail-fast approach with clear error messages
  identifying the failure point, enabling rapid diagnosis and remediation.
