decisions:
  - title: "Feature Implementation Approach"
    chosen: "Create feature-specific function (`create_feature_133_markdown_file`) that orchestrates reusable utilities"
    rejected:
      - "Reuse generic `create_markdown_file()` function directly - loses feature context/metadata and doesn't follow established pattern from 125-132"
      - "Create new custom implementation with inline utilities - violates DRY principle, duplicates code already proven in features 125-132"
    rationale: >
      Features 125-132 establish a consistent pattern: each feature has its own module with a feature-specific function
      that orchestrates the established content_generators utilities. This approach provides:
      (1) Clear feature identity and metadata (FEATURE_NUMBER, MARKDOWN_FILENAME)
      (2) Consistent error handling and logging context
      (3) Proven pattern with 8+ successful implementations
      (4) Explicit workflow documentation (tasks 1-5)
      (5) Maintainability via isolated feature modules
      The feature 127/121 implementations demonstrate this pattern works reliably.

  - title: "Content Generation Strategy"
    chosen: "Use existing `generate_markdown_content()` from content_generators.py with Claude LLM via CrewAI"
    rejected:
      - "Implement custom prompt/LLM integration - wastes effort, duplicates existing proven utility, adds maintenance burden"
      - "Use template-based generation instead of LLM - violates requirement FR-4 (use existing generate_markdown_content), loses flexibility"
      - "Use alternative LLM provider - increases dependency complexity, existing Claude integration is proven and configured"
    rationale: >
      The existing `generate_markdown_content()` utility is battle-tested across 126+ features and handles:
      (1) Proper Claude API integration via CrewAI framework
      (2) Validation of format requirements (H1 heading, 2-3 sentences)
      (3) Structured error handling with descriptive logging
      (4) Trailing newline normalization (Unix convention)
      Requirement FR-4 explicitly mandates reuse of this function.
      No new LLM integration is needed.

  - title: "File I/O and Encoding Approach"
    chosen: "Use existing `write_markdown_file()` utility with Python pathlib, UTF-8 encoding, no BOM"
    rejected:
      - "Use open() directly without utility wrapper - loses validated encoding handling, BOM checks, file verification"
      - "Use higher-level file framework (e.g., Apache Commons) - adds external dependency not in project stack"
    rationale: >
      The existing `write_markdown_file()` utility ensures:
      (1) UTF-8 encoding without BOM (verified by binary prefix check in validation)
      (2) Proper pathlib Path handling for cross-platform compatibility
      (3) File existence and size verification post-write
      (4) Structured logging of all operations
      (5) Filename validation to prevent path traversal attacks
      Requirement FR-6 explicitly mandates use of this utility.
      Implementation is already proven across 126+ features.

  - title: "File Validation Strategy"
    chosen: "Use strict validation via existing `validate_markdown_file()` - enforce exactly 2-3 sentences, H1 heading, UTF-8, LF endings, no BOM"
    rejected:
      - "Use lenient validation - violates requirements NFR-6 and spec product question 2 (strict validation required for testing platform)"
      - "Skip validation - loses quality assurance, undetectable LLM failures, doesn't meet success criteria"
    rationale: >
      Strict validation is required per spec product question 2 and NFR-6 because:
      (1) This is a validation/testing suite for the Sheep platform itself (not a user-facing feature)
      (2) Strict validation ensures platform reliability mechanisms work correctly
      (3) Catches LLM generation failures early (alerts to API/prompt issues)
      (4) All success criteria depend on strict format compliance
      The existing `validate_markdown_file()` function checks:
      - H1 heading with single # prefix
      - Blank line separator after heading
      - Exactly 2-3 sentences (by counting periods)
      - UTF-8 encoding with no BOM
      - LF line endings (no CRLF)
      - Trailing newline
      This is comprehensive and proven across 126+ features.

  - title: "Git Workflow Integration"
    chosen: "Use existing GitPython tools via `commit_markdown_file()` and `push_markdown_file()` utilities with conventional commits"
    rejected:
      - "Use subprocess to call git directly - loses abstraction, error handling, and consistency with GitPython integration"
      - "Use GitPython API directly in feature code - increases complexity, duplicates logic already abstracted in utilities"
    rationale: >
      The existing utilities provide:
      (1) GitCommitTool wrapper that stages (git add) and commits with conventional format
      (2) GitPushTool wrapper that pushes with upstream tracking
      (3) Error handling with descriptive logging
      (4) Standardized commit message generation
      Requirements FR-7, FR-8, FR-9 explicitly mandate these utilities.
      Conventional commit format: `feat(133): Create markdown file test-4xsqpj.md`
      (matches pattern from features 125-132)

  - title: "Error Handling and Logging"
    chosen: "Propagate exceptions with structured logging context at each workflow step"
    rejected:
      - "Catch and suppress errors silently - violates NFR-7, NFR-8 (structured logging required), masks failures"
      - "Use custom exception classes - adds complexity, no value-add vs propagating with context"
    rationale: >
      The established pattern from features 125-132 uses structured logging at each step:
      (1) Step entry/exit logging (5 workflow steps)
      (2) Debug logging with intermediate values (generated bytes, file paths, commit messages)
      (3) Error logging with exception context (get_logger() from sheep.observability.logging)
      (4) Exception propagation to calling code (don't catch and swallow)
      This provides full observability required by NFR-7 and NFR-8.
      Features 127 and 121 demonstrate this pattern.

  - title: "File Collision Handling"
    chosen: "Overwrite existing file if test-4xsqpj.md already exists"
    rejected:
      - "Fail with error if file exists - violates spec product question 1 (overwrite recommended), adds error handling complexity"
      - "Skip silently if file exists - may hide issues, harder for validation platform to detect problems"
    rationale: >
      Specification product question 1 recommends overwrite because:
      (1) Feature branch is freshly created for this feature (feat/133-markdown-file-creation-b8697f)
      (2) Should start in clean state by design
      (3) Simplest implementation, reduces operational complexity
      (4) Consistent with features 125-132 which assume clean branch state
      The existing `write_markdown_file()` opens file in 'w' mode which overwrites.
      No additional collision handling needed - existing implementation handles this.

