content: |
  ## Task Breakdown Summary

  Feature 133 implementation consists of 7 focused tasks across 3 phases:

  **Phase 1: Foundation (Task 1)**
  Sets up the feature module with imports, metadata, and function skeleton. This is the prerequisite for all implementation work.

  **Phase 2: Workflow Implementation (Tasks 2-6)**
  Implements the 5-step workflow by orchestrating existing utilities:
  1. Generate markdown content via LLM (task 2)
  2. Write to disk with proper encoding (task 3)
  3. Validate format requirements (task 4)
  4. Stage and commit with conventional format (task 5)
  5. Push to remote feature branch (task 6)

  Each step includes structured logging at entry/exit, intermediate values logged at debug level, and exception handling with context. The workflow follows the pattern proven in features 125-132.

  **Phase 3: Integration & Verification (Task 7)**
  Executes the complete workflow end-to-end and verifies all 10 success criteria. This ensures the implementation meets all requirements and has no side effects.

  ## Effort Estimation Rationale

  Total estimated effort: **2h 25min**

  Task effort is driven by:
  - **Module setup (task 1)**: 15min — straightforward file creation with imports
  - **Workflow steps (tasks 2-6)**: 20min each — each step is minimal (single utility call + logging), 5 steps × 20min = 100min
  - **Integration test (task 7)**: 30min — comprehensive verification of all success criteria and edge cases

  The relatively short effort estimate reflects:
  - Existing utilities are proven and require no implementation
  - Each task is focused and isolated
  - Pattern is well-established from 8+ prior features
  - No complex error handling or edge cases needed (utilities handle that)
  - Straightforward orchestration with structured logging

  ## Test Strategy

  Each task uses Test-Driven Development (TDD) with RED-GREEN-REFACTOR cycles:

  **RED**: Write a test that describes the desired behavior (assertion fails initially)
  **GREEN**: Implement minimal code to make the test pass
  **REFACTOR**: Clean up, improve logging, add error handling, improve naming

  Tests will verify:
  - Module structure and imports (task 1)
  - Each workflow step produces expected output (tasks 2-6)
  - Complete workflow passes all success criteria (task 7)
  - No side effects or unintended file modifications
  - Proper error handling and logging

  ## Success Criteria Verification

  Task 7 explicitly verifies these 10 success criteria from the specification:
  1. File exists in repository root
  2. Contains exactly one H1 heading
  3. Contains exactly 2-3 sentences
  4. Format matches markdown pattern
  5. UTF-8 encoding without BOM
  6. LF line endings (Unix style)
  7. Staged in git
  8. Conventional commit message
  9. Pushed to feature branch
  10. No side effects

  This ensures the implementation fully meets the feature specification and is ready for integration.
