content: |
  ## Architecture Overview

  The implementation creates a single feature-specific module (`feature_133_markdown_file_creation.py`) that orchestrates existing utilities from the `content_generators` module. This follows the proven pattern established by features 125-132, where each feature has:

  1. **Feature-specific module** with clear responsibility and metadata
  2. **Orchestration function** (`create_feature_133_markdown_file()`) that coordinates 5-step workflow
  3. **Structured logging** at each workflow step for observability
  4. **Error handling** with exception propagation and context

  The module integrates with existing infrastructure:
  - **Content Generators** (`generate_markdown_content`, `write_markdown_file`, `validate_markdown_file`, `commit_markdown_file`, `push_markdown_file`)
  - **Observability** (`sheep.observability.logging.get_logger()`)
  - **LLM Config** (`sheep.config.llm.get_reasoning_llm()`)
  - **Git Tools** (`GitCommitTool`, `GitPushTool` via GitPython)

  ## Key Design Decisions

  ### 1. Feature-Specific Module Pattern

  **Chosen:** Create dedicated `feature_133_markdown_file_creation.py` module with orchestration function.

  **Rationale:** Features 125-132 demonstrate this pattern works reliably. It provides:
  - Clear feature identity and metadata (FEATURE_NUMBER=133, MARKDOWN_FILENAME=\"test-4xsqpj.md\")
  - Explicit 5-step workflow documentation
  - Isolated module for maintainability and testability
  - Consistent error handling and logging context
  - Follows Sheep platform conventions

  ### 2. Utility Orchestration

  **Chosen:** Call existing utilities in sequence (generate → write → validate → commit → push).

  **Rationale:** All required utilities are battle-tested across 126+ features:
  - `generate_markdown_content()` — proven LLM integration with format validation
  - `write_markdown_file()` — handles UTF-8 encoding, no BOM, file verification
  - `validate_markdown_file()` — strict format validation (H1 heading, 2-3 sentences)
  - `commit_markdown_file()` — conventional commits with git staging
  - `push_markdown_file()` — git push with upstream tracking

  No custom implementation or reimplementation needed. Requirements FR-1 through FR-9 explicitly mandate using these utilities.

  ### 3. Structured Logging Strategy

  **Chosen:** Log at each workflow step with debug/info/error levels, propagate exceptions with context.

  **Rationale:** Requirements NFR-7 and NFR-8 mandate structured logging for observability. The pattern logs:
  - Step entry/exit messages
  - Intermediate values (generated content bytes, file paths, commit messages)
  - Errors with exception context (don't catch/suppress)
  - Uses `sheep.observability.logging.get_logger()` for consistent context

  ### 4. File Collision Handling

  **Chosen:** Overwrite existing file if test-4xsqpj.md already exists.

  **Rationale:** Specification product question 1 resolves to \"Overwrite existing file\" because:
  - Feature branch is freshly created (feat/133-markdown-file-creation-b8697f)
  - Should start in clean state by design
  - Existing `write_markdown_file()` opens file in 'w' mode (overwrites automatically)
  - Consistent with features 125-132 behavior

  ### 5. Strict Content Validation

  **Chosen:** Use `validate_markdown_file()` with strict enforcement of format requirements.

  **Rationale:** Specification product question 2 resolves to \"Strict validation\" because:
  - This is a validation/testing suite for Sheep platform itself (not user-facing)
  - Strict validation ensures platform reliability mechanisms work correctly
  - Catches LLM generation failures early
  - All success criteria depend on exact format compliance
  - `validate_markdown_file()` checks: H1 heading with single #, blank line separator, exactly 2-3 sentences, UTF-8 without BOM, LF line endings

  ## Implementation Strategy

  The implementation follows a linear 3-phase approach:

  **Phase 1: Foundation (Module Setup)**
  - Create `src/sheep/features/feature_133_markdown_file_creation.py`
  - Import utilities: `generate_markdown_content`, `write_markdown_file`, `validate_markdown_file`, `commit_markdown_file`, `push_markdown_file`
  - Import logging: `get_logger` from `sheep.observability.logging`
  - Define feature metadata: `FEATURE_NUMBER=133`, `FEATURE_NAME`, `MARKDOWN_FILENAME=\"test-4xsqpj.md\"`
  - Define function skeleton: `create_feature_133_markdown_file(repo_path=None) -> dict[str, str]`

  **Phase 2: Implementation (5-Step Workflow)**
  Each step is implemented with:
  - Step entry logging with task description
  - Call to orchestrated utility with proper arguments
  - Debug logging of intermediate values
  - Error handling (propagate exceptions, log context)
  - Step exit logging with result summary

  Steps in order:
  1. **Generate**: Call `generate_markdown_content()` → returns content string
  2. **Write**: Call `write_markdown_file(content, filename)` → returns filepath
  3. **Validate**: Call `validate_markdown_file(filepath)` → returns validation result
  4. **Commit**: Call `commit_markdown_file(filepath, content, repo_path, message)` → returns commit result
  5. **Push**: Call `push_markdown_file(repo_path)` → returns push result

  **Phase 3: Verification (Testing & Success Criteria)**
  - Execute complete workflow end-to-end
  - Verify 10 success criteria:
    1. File exists at repository root
    2. Contains exactly one H1 heading
    3. Contains exactly 2-3 sentences
    4. Format matches pattern: `# Title\n\nSentence 1. Sentence 2.`
    5. UTF-8 encoded with no BOM
    6. LF line endings (Unix style)
    7. Staged in git with `git add`
    8. Conventional commit created
    9. Changes pushed to feature branch
    10. No side effects on other files

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates invalid content (wrong sentence count, no H1) | Validation step (`validate_markdown_file`) will catch and propagate error with descriptive logging. Strict validation enforced per requirement NFR-6. |
  | Git operations fail (push to protected branch, auth issues) | Existing `push_markdown_file()` handles git errors. Error logged with context, exception propagates to caller for handling. Feature branch is dedicated and not protected. |
  | File already exists from prior run | Existing `write_markdown_file()` opens file in 'w' mode (overwrites). No collision handling needed — overwrite is intended per product question 1. |
  | Encoding/line ending issues (BOM, CRLF) | Existing `write_markdown_file()` enforces UTF-8 without BOM. Validation step checks for LF line endings. Cross-platform compatibility verified. |
  | Feature module import fails | Module follows standard Python package structure. Uses only stdlib and existing project imports. No new external dependencies. |
  | Logging context missing | Uses `sheep.observability.logging.get_logger()` consistently. All operations logged with debug/info/error levels and context. |

  ## Summary

  Feature 133 implementation is straightforward: a lightweight feature module that orchestrates battle-tested utilities from `content_generators` in a proven 5-step workflow. No new dependencies, infrastructure changes, or architectural modifications required. The approach prioritizes consistency with features 125-132, code reuse, and operational simplicity. All technical decisions are derived from or validated by the research findings and existing codebase patterns.
