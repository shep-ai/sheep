content: |
  ## Summary

  Feature 114 creates a single test markdown file following the established pattern
  of 94+ existing test-*.md files in the repository root. Implementation proceeds
  in two sequential phases:

  **Phase 1: File Creation** — Use pathlib.Path.write_text() to create test-y1u0zg.md
  with a markdown H1 heading and 2-3 sentences of prose. Ensure UTF-8 encoding
  without BOM and Unix LF line endings through Python defaults and string literals.

  **Phase 2: Git Integration** — Stage the file with git add, commit with conventional
  message format (feat(114): ...), and push to remote origin on the feature branch.
  This completes the feature and enables subsequent merge.

  Total estimated effort is approximately 15 minutes: 5 minutes for file creation
  with validation, 3 minutes for git operations, plus buffer for verification.

  ## Task Sequence

  1. **Task 1: Create markdown file** (Phase 1, 5m)
     - Create file in repo root using pathlib
     - Write H1 heading + blank line + 2-3 sentences
     - Verify encoding (UTF-8, no BOM) and line endings (LF)
     - Confirm file size is reasonable (300-500 bytes typical)

  2. **Task 2: Stage, commit, and push** (Phase 2, 3m, depends on Task 1)
     - Stage with git add test-y1u0zg.md
     - Create commit with exact conventional message
     - Push to remote on feature branch
     - Verify remote is updated and feature is complete

  The two tasks are sequential and logically distinct:
  file must exist before it can be committed, and commit
  must be created before push to remote.
