# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single test markdown file in the repository root,
  following the established pattern of 94+ existing test-*.md files.
  The implementation is completely isolated with no dependencies on application
  source code (/src/sheep/), configuration, or test files.

  Integration with existing codebase:
  - Repository root contains a collection of test markdown files (test-*.md)
  - Each file follows identical format: H1 heading + blank line + prose
  - Git workflow uses conventional commits matching project style (feat(N): ...)
  - No modifications to application code, tests, or infrastructure
  - Feature is purely additive (one new file, no overwrites)

  ## Key Design Decisions

  **1. File I/O Library: pathlib.Path.write_text()**
  - Chosen for compliance with NFR-5 (explicitly required in spec)
  - Modern Python standard, built into 3.11+ (project requirement)
  - Handles UTF-8 encoding transparently without BOM
  - Cleaner, more idiomatic than open() function
  - Consistent with 94+ existing test files (established pattern)
  - Rationale: Meets requirement, idiomatic, matches precedent

  **2. Text Encoding: UTF-8 without BOM**
  - Required by NFR-1 (explicit spec requirement)
  - Python pathlib.write_text() defaults to UTF-8 without BOM
  - Verified against all existing test files (test-4ylnjw.md, test-9riwv3.md, etc. — none contain BOM)
  - Compatible with CommonMark specification and markdown processors
  - Rationale: Satisfies requirement, Python default behavior, verified pattern

  **3. Line Endings: Unix LF (\n)**
  - Required by NFR-2 (explicit spec requirement)
  - Python 3 uses \n in string literals across all platforms
  - Verified in existing test files (byte analysis shows no \r sequences)
  - Repository configured for Unix line endings (git config and .gitattributes patterns)
  - Rationale: Satisfies requirement, Python default, consistent with repo

  **4. Content Format: H1 Heading + Blank Line + 2-3 Sentences**
  - Mandated by FR-3 (exactly one H1 heading) and FR-4 (exactly 2-3 sentences)
  - Verified in all 94+ precedent files (test-4ylnjw.md shows: "# Heading\n\n[sentences]")
  - Simple, unambiguous, aligns with markdown best practices
  - Example pattern: "# The Art of Deliberate Practice\n\nProse content here..."
  - Rationale: Meets functional requirements, established pattern, best practices

  **5. File Size: Flexible Guideline (300-500 bytes typical)**
  - NFR-3 describes as "typical range" not strict requirement
  - Research analysis shows natural variance: test-3ulhtl.md (484), test-4ylnjw.md (422),
    test-9riwv3.md (502), test-0ztu6n.md (393) — all valid despite variance
  - Manual verification sufficient for this simple pattern
  - Prioritizes prose quality over exact file size
  - Rationale: Spec language suggests flexibility, precedent shows variance, quality over size

  **6. Prose Topic: Completely Open Selection**
  - User query explicitly states "about anything" with no topic restrictions
  - Feature spec resolves to "Completely open" selection in product questions
  - No evidence of topic restrictions in 94+ existing files
  - Respects implementer judgment and interests
  - Enables faster implementation with authentic content
  - Rationale: User requirement, no precedent restrictions, flexibility

  ## Implementation Strategy

  **Phase 1: File Creation**
  Create the markdown file in repository root using pathlib.Path.write_text().
  This is the foundation — the file must exist with correct content,
  encoding, and line endings before it can be committed to git.
  Task focuses on creating valid markdown following the established pattern.

  **Phase 2: Git Integration**
  After file creation, integrate into version control:
  stage the file with git add, create a conventional commit with the
  required message format, and push to the remote feature branch.
  This completes the implementation and satisfies all functional requirements.

  The two phases are sequential (file must exist before committing)
  but logically distinct (creation vs. integration).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding incorrect (BOM present or wrong charset) | Use pathlib.write_text() which defaults to UTF-8 without BOM; verify by reading file bytes and checking for BOM signature (0xEF 0xBB 0xBF) |
  | Line ending incorrect (CRLF instead of LF) | Use Python string literals with \n (always LF in Python 3); verify with hex dump (git diff shows ^M for CRLF) |
  | Markdown format invalid | Follow established pattern from existing files; manually verify: H1 heading on line 1, blank line 2, prose on line 3+; check with markdown parser if needed |
  | Git operations fail or message incorrect | Verify git config set (git config user.name); use standard git commands exactly as specified; verify commit message in git log |
  | File created in wrong location | Create in repository root (Path("test-y1u0zg.md")); verify with ls test-y1u0zg.md or git status |
  | File already exists (overwrite risk) | Check if file exists before creating; if it does, review and manually delete or verify it's the intended content |
  | Push fails due to branch issues | Verify on correct branch (git status shows feat/114-markdown-content-file-8b811e); ensure upstream tracking set with -u flag in push |
