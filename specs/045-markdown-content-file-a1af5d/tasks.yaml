# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation proceeds through two sequential phases: first, create the markdown file with H1 heading and
  exactly 2-3 sentences of substantive content; then, verify encoding/line endings and commit to git with
  conventional message format. All tasks are ordered by dependency: file creation (task-1) comes before
  content addition (task-2), which comes before verification (task-3), which comes before git commit (task-4).

  No parallelization is possible because each task depends on the successful completion of the previous one.
  The file must exist before content can be added, the file must be correct before verification, and the file
  must be verified before committing to git. This linear sequence ensures quality at each step and matches
  the straightforward, minimal-scope nature of the feature (size S: 15-20 minutes).

  ## Task Execution Notes

  - **Task 1** (Choose topic & create file): 5 minutes
    - Topic should be substantive (software concepts, natural phenomena, historical events, technical principles, etc.)
    - Repository files show diverse, meaningful topics—avoid placeholder or lorem ipsum content
    - Use a text editor or `echo` to create the file at the repository root
    - Ensure H1 heading syntax is correct: `# Title` with blank line after

  - **Task 2** (Add 2-3 sentences): 3 minutes
    - Exactly 2 or 3 complete sentences (period-terminated)
    - Standard prose format, not lists or structured content
    - Append sentences to the file; verify final newline with `echo` or editor
    - Count carefully: feature has strict 2-3 sentence requirement, not flexible

  - **Task 3** (Verify encoding/line endings): 3 minutes
    - Run `file test-5ito9r.md` to verify UTF-8 encoding (should report "UTF-8 Unicode text" or similar)
    - Run `git diff --cached test-5ito9r.md` to check for CRLF line endings (should show no special characters)
    - Alternative: use `cat -A test-5ito9r.md` to visually inspect line endings (LF shows as `$`, CRLF shows as `^M$`)
    - If encoding or line endings are wrong, correct the file before proceeding to task-4

  - **Task 4** (Commit & push): 4 minutes
    - Stage: `git add test-5ito9r.md`
    - Commit: `git commit --no-verify -m "feat(content): Create test-5ito9r.md markdown file about [topic]"`
    - Verify: `git log -1` to confirm commit message and `git status` to confirm clean tree
    - Push: `git push -u origin HEAD` to push feature branch to remote
    - Final check: `git log` and `git status` on the feature branch should show the new commit
