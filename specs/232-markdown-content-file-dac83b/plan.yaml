# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 232 follows the established pattern from 230+ precedent implementations (features 151-231).
  The architecture is deliberately simple and self-contained:

  **Implementation Script**: A standalone Python script (create_markdown_file_232.py) located in
  the repository root. Uses pathlib for cross-platform file I/O and subprocess for git operations.
  No modifications to src/sheep/ or production code (complies with NFR-5).

  **File Format**: Markdown file with H1 heading + blank line + 2-3 coherent prose sentences.
  Encoding: UTF-8 without BOM. Line endings: Unix LF (\n). Size: 300-600 bytes.

  **Git Integration**: Standard workflow — stage file, commit with conventional message format
  "feat(232): Create markdown file test-qfbu3q.md with prose content", push to pre-created
  feature branch feat/232-markdown-content-file-dac83b.

  **Error Handling**: Defensive file existence check (prevent overwrites), specific exception
  handling for OSError and CalledProcessError with informative error messages.

  ## Key Design Decisions

  ### 1. File Creation Mechanism: pathlib.Path.write_text()

  **Chosen**: Use pathlib.Path with explicit encoding and newline parameters.

  **Rationale**:
  Modern, idiomatic approach in Python 3.11+. Cross-platform compatibility with explicit
  encoding="utf-8" and newline="\n" parameters. The newline parameter is critical: without it,
  Python uses os.linesep on Windows (CRLF), violating requirement. All 230+ precedent
  implementations use this pattern successfully. Reference: Research findings, Section "Text
  Encoding and Line Endings".

  ### 2. Content Generation: Hardcoded Coherent Prose

  **Chosen**: Pre-written prose string constant (no generation or templates).

  **Rationale**:
  Feature spec allows arbitrary topic. Hardcoded prose is deterministic, requires no external
  dependencies (NFR-4 compliance), and ensures coherence (NFR-2). All 230+ precedents use this
  approach. Reference: Research findings, Section "Content Generation Strategy".

  ### 3. Git Integration: Python subprocess Module

  **Chosen**: Use subprocess.run() with list arguments (no shell=True).

  **Rationale**:
  Standard library, no external dependencies (GitPython would violate NFR-4). Safe command
  execution with proper error handling via CalledProcessError. The check=True parameter raises
  exceptions on non-zero exit codes. All precedents use subprocess successfully. Reference:
  Research findings, Section "Git Integration Approach".

  ### 4. Script Location: Repository Root

  **Chosen**: Place implementation script in repository root as create_markdown_file_232.py.

  **Rationale**:
  Follows established naming convention from features 151-231. Avoids NFR-5 (no modifications
  to src/sheep/ production code). Not a test (incorrect for tests/ directory). Self-contained
  implementation task. Reference: Research findings, Section "Implementation Script Location".

  ## Implementation Strategy

  **Phase 1: Script Implementation**
  Create standalone Python script with three core components:
  1. Define TITLE and PROSE constants with markdown content
  2. File creation using pathlib with UTF-8 and LF encoding control
  3. Git integration using subprocess (add, commit, push)

  Script follows proven pattern from features 151-231, minimizing risk. No external dependencies;
  standard library only.

  **Phase 2: Validation & Execution**
  Execute script and verify success criteria:
  - File exists in repository root with correct name
  - File content: H1 heading + blank line + 2-3 prose sentences
  - Encoding: UTF-8 without BOM
  - Line endings: LF throughout
  - File size: 300-600 bytes
  - Git operations: staged, committed, pushed successfully

  No separate test suite needed; validation by running script and inspecting output.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (overwrite) | Defensive check: test if file exists; raise FileExistsError to prevent overwrites |
  | Incorrect line endings on Windows | Explicit newline="\n" in write_text() forces LF regardless of platform |
  | Git not configured (commit fails) | subprocess.CalledProcessError raised and caught; error message includes stderr |
  | Prose content incoherent | Use pre-written, human-composed prose string; not generated or random |
  | File encoding includes BOM | Use explicit encoding="utf-8" (Python default is BOM-free; explicit for clarity) |
  | Feature branch not exists | Feature branch pre-created; validation verifies existence before pushing |
  | Git push fails (network) | CalledProcessError captured with stderr output for debugging |
  | Script fails midway | All operations either idempotent or combined into single commit; no dangling state |

