content: |
  ## Problem Statement

  Create a single markdown file named `test-msqxtg.md` in the repository root with a properly formatted title (H1 heading) and 2-3 sentences of prose content about any topic. This is part of a continuous series of markdown file creation features (273-293+) that demonstrate the Sheep automation platform's ability to consistently execute simple, repetitive tasks.

  ## Success Criteria

  - [ ] File `test-msqxtg.md` exists in the repository root directory
  - [ ] File contains valid markdown with an H1 heading as the first content line
  - [ ] H1 heading is followed by a blank line before prose content
  - [ ] File contains exactly 2-3 sentences of prose content in a single paragraph
  - [ ] Prose content is grammatically correct and coherent with the H1 title
  - [ ] File is committed with message: `feat(293): create markdown file test-msqxtg.md with prose content`
  - [ ] File is tracked by git in the feature branch `feat/293-markdown-file-creation-aced5f`
  - [ ] Implementation follows the established pattern from features 273-292

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-msqxtg.md` in the repository root directory
  - **FR-2**: The file must begin with a properly formatted H1 markdown heading (single `#` followed by title text)
  - **FR-3**: The H1 heading must be separated from prose content by a blank line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be topically coherent and related to the H1 heading
  - **FR-6**: File must be committed with the conventional commit message: `feat(293): create markdown file test-msqxtg.md with prose content`
  - **FR-7**: Commit must be made to the feature branch `feat/293-markdown-file-creation-aced5f`

  ## Non-Functional Requirements

  - **NFR-1**: File must be valid markdown that parses correctly in standard markdown parsers (GFM-compatible)
  - **NFR-2**: Prose content must be grammatically correct English with proper punctuation
  - **NFR-3**: Prose must be coherent and readable (no nonsensical, auto-generated, or lorem ipsum text)
  - **NFR-4**: Implementation must match the established pattern and structure from features 273-292
  - **NFR-5**: File must be properly tracked by git and appear in the repository history
  - **NFR-6**: No modifications to existing files, only creation of the new markdown file

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose paragraph structure: single or multiple paragraphs? | Single paragraph | Aligns with established 273-292 pattern, keeps file compact, natural for 2-3 related sentences |
  | 2 | Must prose content be topically related to H1 title? | Yes, required | Ensures file coherence, maintains quality standards, creates better artifact |
  | 3 | Commit message: exact pattern or allow variations? | Exact pattern required | Maintains consistency across feature series, reliable git history, supports CI/CD parsing |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | This is where the markdown file (test-msqxtg.md) will be created |
  | Git Repository | Low | The file will be tracked by git as part of the feature branch |
  | Repository Structure | None | No changes to existing files or architecture |

  ## Dependencies

  - **File System**: Standard file creation capability
  - **Git**: For tracking the new file (already configured)
  - **Markdown Parser**: Standard markdown formatting (no special parser needed)
  - **No external libraries or APIs**: This is a pure file creation task

  ## Size Estimate

  **S** — This is a minimal, straightforward task:
  - Single file creation (< 5 minutes of actual work)
  - No code changes, no architecture decisions
  - Simple, repetitive task that follows established precedent from 20+ previous features
  - No testing or validation beyond file existence and format verification
  - Requirements phase clarifies only 3 simple product decisions with clear defaults

  The "S" estimate reflects the simplicity of the underlying task, though the overall feature cycle (including research, planning, and CI/CD) may take longer within the Sheep automation platform context.
