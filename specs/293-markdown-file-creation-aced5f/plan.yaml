# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 293 implements a single automation task within the Sheep platform's established patterns for markdown file creation.
  The implementation is straightforward and stateless: it does not modify existing files or introduce architectural complexity.

  The feature fits into Sheep's architecture as:
  1. **Automation Task**: One of a series (273-293+) demonstrating consistent, repeatable execution
  2. **AI-Integrated**: Uses Claude API to generate topically coherent prose content
  3. **Python-Based**: Implements automation in Python, the platform's primary automation language
  4. **Git-Aware**: Fully integrated with git for version control and CI/CD pipelines
  5. **Content Generation**: Demonstrates Sheep's capability to generate and format content intelligently

  ### Pattern from Features 273-292

  Features 273-292 established a consistent pattern that feature 293 continues:
  - Single markdown file creation in repository root (test-RANDOM.md)
  - AI-generated prose content topically related to H1 title
  - Proper markdown formatting (H1 + blank line + paragraph)
  - Git commit with conventional message: feat(N): create markdown file test-NAME.md with prose content
  - File merged to main via PR

  The implementation must follow this pattern exactly to maintain consistency across the feature series.

  ## Key Design Decisions

  All major architectural decisions have been researched and documented. This implementation follows the research findings:

  ### 1. Technology Stack: Python with Built-in Libraries

  **Decision**: Use Python with only built-in libraries (open(), subprocess) for file I/O and git operations.

  **Rationale** (from research):
  - Python is explicitly specified in feature requirements
  - Python is the automation language throughout Sheep platform
  - Built-in libraries provide all necessary functionality without external dependencies
  - Ensures consistency with features 273-292

  ### 2. Prose Content Generation: Claude API with Topical Relevance

  **Decision**: Use Claude API to generate exactly 2-3 sentences of prose topically related to the H1 title.

  **Rationale** (from research):
  - Requirements FR-5 and NFR-3 mandate topically coherent, grammatically correct prose
  - Claude API ensures high-quality content while maintaining automation
  - AI-based approach aligns with Sheep platform's design as an AI-driven automation tool
  - Matches prose quality and approach used in features 290-292

  ### 3. Sentence Validation: Strict Enforcement with Regeneration

  **Decision**: Validate that generated prose contains exactly 2-3 sentences. Regenerate if count is incorrect.

  **Rationale** (from research):
  - FR-4 explicitly requires \"exactly 2-3 sentences\"
  - Strict validation ensures reliable compliance with requirements
  - AI model is prompted to generate exactly N sentences, with count validation before acceptance
  - Acceptable to regenerate if needed (only 1-2 API calls max per feature)

  ### 4. Git Integration: Subprocess with Native git Commands

  **Decision**: Use Python subprocess to execute native git commands (git add, commit, push).

  **Rationale** (from research):
  - Avoids external dependencies (GitPython library not needed)
  - Provides clear visibility into git operations (helpful for CI/CD debugging)
  - subprocess approach is lighter and simpler for this use case
  - Requirements FR-6 and FR-7 explicitly mandate git tracking and committed history

  ### 5. File Format: Markdown with Single Paragraph

  **Decision**: Format markdown with H1 title, blank line, then single-paragraph prose.

  **Rationale** (from research):
  - Single paragraph aligns with established pattern from features 273-292
  - More compact and natural for 2-3 related sentences
  - Easier to parse and verify programmatically

  ## Implementation Strategy

  The implementation proceeds in four phases, each building on previous work:

  **Phase 1: Foundation & Pattern Analysis**
  Review features 273-292 to understand:
  - File structure and naming convention (test-RANDOM.md)
  - Prose content quality and style expectations
  - Git workflow and commit message format
  - Integration points with Sheep platform (API calls, error handling)

  **Phase 2: Core Automation Implementation**
  Build the Python automation script:
  - Claude API integration with Anthropic SDK
  - Prose generation prompt engineering (exactly 2-3 sentences, topically relevant)
  - Sentence counting and validation logic with regeneration
  - Markdown file formatting and creation

  **Phase 3: Git Integration & Deployment**
  Implement and test git operations:
  - git add test-msqxtg.md
  - git commit -m \"feat(293): create markdown file test-msqxtg.md with prose content\"
  - git push -u origin HEAD

  **Phase 4: Verification & Refinement**
  Complete testing and validation:
  - Verify file exists and contains correct markdown format
  - Verify content meets all requirements (H1, prose count, topical relevance)
  - Verify git tracking (file in git history, commit message correct)
  - Manual review of file quality

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API call fails or times out | Implement retry logic with exponential backoff; clear error messages for debugging |
  | Generated prose has incorrect sentence count | Validate count before acceptance; regenerate up to 3 times before failing |
  | Git operations fail (credentials, permissions) | Git already configured by Sheep platform; validate git availability before operations |
  | File write fails (disk full, permissions) | CI/CD environment guarantees permissions and space; log detailed errors if failure occurs |
  | Prose content is low quality or incoherent | Claude's capabilities are well-established; simple quality checks can validate output |
  | API rate limiting | Feature makes only 1-2 API calls total; rate limiting is not a concern for single-feature execution |

  ## Dependencies & Integration Points

  **External Dependencies:**
  - Claude API (via Anthropic SDK) — must be available and configured
  - Git (already configured in repository) — must be available in execution environment
  - File system (already available) — must have write permissions in repository root

  **Integration with Sheep Platform:**
  - Claude API credentials managed by Sheep platform (via environment variables or configuration)
  - Git configuration already in place (SSH keys, user.name, user.email)
  - Execution environment must have Python 3.7+ with Anthropic SDK installed

  **No new dependencies on other features** — Feature 293 is independent and stateless.

