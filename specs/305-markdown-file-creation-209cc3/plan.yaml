# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 305 integrates seamlessly with the existing Sheep project architecture by
  orchestrating proven utilities from the content_generators.py module. The feature
  follows the exact pattern established by features 001-304:

  **Architecture Pattern:**
  ```
  Feature Module (305_markdown_file_creation.py)
    └─> create_feature_305_markdown_file()
        └─> create_markdown_file("test-evp6mu.md", feature_number=305)
            ├─> generate_markdown_content()      [CrewAI LLM + Claude API]
            ├─> write_markdown_file()            [pathlib for safe I/O]
            ├─> validate_markdown_file()         [Encoding, line endings, structure]
            ├─> commit_markdown_file()           [GitCommitTool wrapper]
            └─> push_markdown_file()             [GitPushTool wrapper]
  ```

  **Key Integration Points:**
  1. **Content Generation** — Uses get_reasoning_llm() from config/llm.py to obtain Claude
     API client via CrewAI framework. MARKDOWN_GENERATION_PROMPT template ensures H1 heading
     + blank line + 2-3 sentences format.
  2. **Logging** — Uses get_logger() from observability/logging.py for structured logging
     with timestamps and context. All steps log at appropriate levels (info for success,
     error for failures).
  3. **Git Operations** — Leverages GitCommitTool and GitPushTool wrappers from tools/git_tools.py,
     which handle subprocess safety, branch detection, and upstream tracking.
  4. **File I/O** — Uses pathlib.Path for safe path operations and explicit UTF-8 encoding
     with LF line endings per spec requirements.

  **Why This Architecture:**
  - **100% Code Reuse** — The create_markdown_file() orchestration function already exists
    in content_generators.py and implements all required logic (generate, write, validate,
    commit, push). The feature module simply calls it.
  - **Pattern Consistency** — All features 001-304 follow this module-per-feature pattern.
    Deviating would break CI/CD expectations and complicate future maintenance.
  - **Proven & Tested** — The infrastructure has been battle-tested across 300+ preceding
    features with high confidence in correctness.
  - **Minimal Complexity** — Feature module is ~20 lines of orchestration code. Zero new
    dependencies, zero new infrastructure needed.

  ## Key Design Decisions

  ### 1. Create Dedicated Feature Module (vs. Use Utilities Directly)

  **Chosen:** src/sheep/features/305_markdown_file_creation.py

  **Rationale:**
  - Maintains consistency with 300+ prior features (all use feature modules)
  - Provides clear entry point for execution and testing
  - Aligns with repository's organizational structure and CI/CD pipeline expectations
  - Enables future feature-specific logic or hooks if needed
  - Minimal code cost (~20 lines) is justified by pattern consistency

  **Rejected Alternative:** Direct utility usage without feature wrapper
  - Would break pattern from 300+ prior features
  - Lacks clear entry point for CI/CD execution
  - Complicates future feature-specific logic or testing

  ### 2. Use CrewAI LLM Framework for Content Generation (vs. Hardcoding or External Service)

  **Chosen:** Existing create_markdown_content() function via CrewAI LLM framework

  **Rationale:**
  - Infrastructure already exists and is proven by 300+ features
  - CrewAI abstracts provider complexity (supports Claude, GPT, Gemini, etc.)
  - MARKDOWN_GENERATION_PROMPT template ensures consistent H1 + 2-3 sentence format
  - Zero new dependencies — already a project dependency
  - Claude API handles free-form topic generation per spec requirement

  **Rejected Alternatives:**
  - Hardcoded static content — less flexible, doesn't exercise infrastructure
  - External content service — adds API complexity, authentication overhead, latency

  ### 3. Fail Fast on Validation Errors (vs. Retry or Graceful Degradation)

  **Chosen:** Fail immediately with clear error messages at each step

  **Rationale:**
  - Ensures content quality by catching issues immediately
  - Provides clear feedback for debugging (which step failed and why)
  - Follows explicit error handling principles from spec resolution
  - Prevents malformed content from being committed
  - Already implemented in create_markdown_file()

  **Rejected Alternatives:**
  - Retry logic — adds complexity, masks underlying issues, extends execution time
  - Graceful degradation with fallback content — hides problems, violates error handling principles

  ### 4. Full File Validation (Encoding, Line Endings, Structure)

  **Chosen:** Comprehensive validation using validate_markdown_file()

  **Rationale:**
  - Existing validate_markdown_file() already implements all checks
  - Prevents malformed content from being committed
  - Matches 300+ feature pattern
  - Validation checks: UTF-8 no BOM, LF line endings, H1 heading, 2-3 sentences, trailing newline

  **Rejected Alternatives:**
  - Minimal validation — risks committing malformed content
  - No validation — violates NFR-3 and NFR-5 requirements

  ### 5. Use Existing Git Tools

  **Chosen:** Leverage GitCommitTool and GitPushTool from src/sheep/tools/git_tools.py

  **Rationale:**
  - Maintains consistency with content_generators.py implementation
  - Tools handle subprocess safety and branch detection
  - Already used by commit_markdown_file() and push_markdown_file()

  **Rejected Alternatives:**
  - Direct subprocess calls — duplicates code, risks injection
  - GitPython library — introduces new dependency

  ## Implementation Strategy

  **Phase 1: Feature Module Setup**
  Create src/sheep/features/305_markdown_file_creation.py with module structure, imports,
  and function skeleton. This establishes the entry point that CI/CD expects.

  **Phase 2: Implementation & Integration**
  Implement create_feature_305_markdown_file() to call create_markdown_file() and return
  result dict. Wire logging infrastructure for observability.

  **Phase 3: Execution & Validation**
  Execute the feature and validate: file exists, content is correct, git operations succeed,
  all success criteria met.

  **Execution Time Breakdown:**
  - Content generation (Claude API): 5-15 seconds (~85% of total)
  - File I/O (write + validate): < 100ms (~1% of total)
  - Git operations (add + commit + push): 1-2 seconds (~10% of total)
  - **Total: 6-17 seconds** (well within 60-second requirement)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API timeout | CrewAI LLM framework handles retries. 60s requirement provides buffer over typical 30s timeout. |
  | File write fails | pathlib validates parent directory. Repository root is always writable (CI/CD requirement). |
  | Invalid encoding/line endings | validate_markdown_file() checks UTF-8 BOM, CRLF. Fail-fast catches issues immediately. |
  | Git commit/push fails | GitCommitTool and GitPushTool handle subprocess errors with structured messages. |
  | Content quality issues | MARKDOWN_GENERATION_PROMPT template ensures H1 and sentence structure. Validation catches violations. |
  | File already exists | Spec requires unique filename (test-evp6mu.md). Write is idempotent. Git handles existing commits. |
  | Pattern divergence | Implementation follows exact pattern from features 302-304. All utilities from content_generators.py (single source of truth). |

  ## Implementation Notes

  - **Module Naming:** Use underscores (feature_305_markdown_file_creation.py)
  - **Function Naming:** Use create_feature_305_markdown_file()
  - **Imports:** Import create_markdown_file and get_logger at module level
  - **Return Value:** Dict with filepath, content, commit_message, push_result keys
  - **Logging:** Info for success, error for failures. Include feature number and filename in context.
  - **Testing:** Manual test via `python -m sheep.features.feature_305_markdown_file_creation`
    should create test-evp6mu.md, commit, and push to remote.
