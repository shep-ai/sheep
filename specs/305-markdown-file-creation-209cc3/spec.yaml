content: |
  ## Problem Statement

  Create a single markdown file at the repository root with filename test-evp6mu.md, containing an H1 heading (title) and 2-3 sentences of coherent prose. The file must be properly encoded (UTF-8, no BOM) with Unix line endings (LF). This feature follows the established workflow pattern from 300+ preceding markdown file creation features: generate content → write file → validate → commit → push.

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as a Python 3 project with a clear separation of concerns:

  - **src/sheep/** - Main application code
    - **content_generators.py** - Reusable utilities for markdown file creation (generate, write, validate, commit, push)
    - **features/** - Feature implementations (100+ markdown file creation examples)
    - **config/** - Configuration (LLM settings, application settings)
    - **observability/** - Logging infrastructure
    - **tools/** - Git operations utilities
    - **agents/** - AI agent implementations
    - **cli.py** - Command-line interface

  - **specs/** - Feature specifications (one per feature, 300+ directories)
  - **Repository root** - Markdown files created by features, documentation

  ### Architecture Patterns

  The codebase follows a consistent pattern for markdown file creation:

  1. **Utility-First Design**: Core functionality is centralized in `content_generators.py` with functions for each operation step (generate, write, validate, commit, push)

  2. **Orchestration Pattern**: Each feature uses the `create_markdown_file()` function which orchestrates the entire workflow:
     - Generates content via Claude API
     - Writes to disk with proper encoding/line endings
     - Validates file properties and structure
     - Stages and commits with conventional message
     - Pushes to remote with upstream tracking

  3. **Conventional Commits**: All features use the format `feat(N): create markdown file FILENAME with prose content` where N is the feature number

  4. **File Structure Consistency**: All markdown files follow the same structure:
     - Line 1: H1 heading (# Title)
     - Line 2: Blank line (separator)
     - Lines 3+: Exactly 2-3 sentences of prose

  5. **Encoding Standards**:
     - UTF-8 without BOM (Byte Order Mark)
     - Unix LF line endings (0x0A), not CRLF
     - Trailing newline per Unix convention

  ### Relevant Technologies

  **Python 3 Ecosystem:**
  - pathlib: Safe file path handling and creation
  - subprocess: Git command execution
  - Built-in I/O: File reading/writing with encoding control

  **External Dependencies:**
  - Claude API: Via CrewAI LLM framework for content generation (get_reasoning_llm)
  - Git: Command-line version control tool
  - GitPython: Potential alternative for git operations (tools/GitCommitTool, tools/GitPushTool)

  **Supporting Infrastructure:**
  - src/sheep/observability/logging.py: Structured logging using get_logger()
  - src/sheep/config/llm.py: LLM configuration and model selection
  - src/sheep/tools/: Git operation wrappers (GitCommitTool, GitPushTool)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file added (test-evp6mu.md); no existing files modified |
  | src/sheep/content_generators.py | None | Existing utilities reused without modification; core functions already support all required operations |
  | src/sheep/features/ | Low | Feature 305 implementation module may be added (optional), but no changes to existing feature code |
  | Git history | Low | Single commit added with conventional message format |
  | No source code files modified | None | Feature is content-only; no changes to core application logic or utilities |

  ## Dependencies

  **Runtime Dependencies:**
  - Python 3.8+ (standard library: pathlib, subprocess)
  - git command-line tool (installed system-wide)
  - Claude API credentials (via environment or config)
  - CrewAI LLM framework (for get_reasoning_llm)

  **Code Dependencies:**
  - src/sheep/content_generators.py:
    - generate_markdown_content() - Generates H1 heading + 2-3 sentences via Claude API
    - write_markdown_file() - Writes file with UTF-8/LF encoding
    - validate_markdown_file() - Validates encoding, line endings, markdown structure
    - commit_markdown_file() - Stages and commits with feature number
    - push_markdown_file() - Pushes with upstream tracking
  - src/sheep/config/llm.py:
    - get_reasoning_llm() - Retrieves configured LLM instance
  - src/sheep/observability/logging.py:
    - get_logger() - Provides structured logging
  - src/sheep/tools/:
    - GitCommitTool - Git commit operations
    - GitPushTool - Git push operations

  **No new external package dependencies required** — all needed functionality exists in stdlib or is available via existing project infrastructure.

  ## Size Estimate

  **S** — This is the smallest possible feature unit:

  - Single markdown file creation at repository root (minimal implementation code)
  - No new source code modules or utilities required
  - No tests, no documentation generation, no configuration changes
  - Follows an established, battle-tested pattern from 300+ preceding features
  - Estimated effort: 15-25 minutes for implementation (100% code reuse from content_generators.py)
  - All supporting infrastructure (generate, write, validate, commit, push) already exists and proven in 300+ prior features
  - Implementation can be as simple as: call create_markdown_file("test-evp6mu.md", feature_number=305)

  **Justification for S (not M):**
  - M would imply multiple days of effort; this feature requires <1 hour
  - Infrastructure investment already complete from features 000-304
  - Zero architectural decisions needed; established pattern is clear
  - Zero dependency changes or environment configuration needed
  - Minimal code needed beyond orchestration layer

