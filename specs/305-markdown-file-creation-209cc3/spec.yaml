content: |
  ## Problem Statement

  Create a single markdown file at the repository root with filename test-evp6mu.md, containing an H1 heading (title) and 2-3 sentences of coherent prose. The file must be properly encoded (UTF-8, no BOM) with Unix line endings (LF). This feature follows the established workflow pattern from 300+ preceding markdown file creation features: generate content → write file → validate → commit → push.

  ## Success Criteria

  - [ ] File test-evp6mu.md exists at repository root with no other file modifications
  - [ ] File starts with exactly one H1 markdown heading (single `#` followed by title text)
  - [ ] File contains exactly 2-3 sentences of coherent, grammatically correct prose after the heading
  - [ ] File is encoded in UTF-8 without BOM (verified by byte inspection if needed)
  - [ ] File uses Unix LF (0x0A) line endings exclusively (no CRLF or mixed endings)
  - [ ] File ends with a single newline character per Unix convention
  - [ ] Markdown structure follows pattern: H1 heading (line 1) → blank line (line 2) → prose content (lines 3+)
  - [ ] Git commit exists with message exactly matching "feat(305): create markdown file test-evp6mu.md with prose content"
  - [ ] Changes are pushed to remote repository with upstream tracking (branch is tracking origin/feat/305-markdown-file-creation-209cc3)
  - [ ] Implementation uses only existing utilities from content_generators.py (no duplication, no new helpers)
  - [ ] No validation errors occur during execution (all checks pass)
  - [ ] All operations are logged via get_logger() with appropriate log levels (info for success, error for failures)
  - [ ] Feature completes without external errors within 60 seconds

  ## Functional Requirements

  - **FR-1**: Generate markdown content via Claude API that includes an H1 heading and 2-3 sentences of coherent prose
  - **FR-2**: Write the generated content to a file named test-evp6mu.md at the repository root
  - **FR-3**: Validate that the written file has UTF-8 encoding without Byte Order Mark (BOM)
  - **FR-4**: Validate that the file uses Unix LF (0x0A) line endings exclusively throughout the file
  - **FR-5**: Validate that the markdown structure matches: H1 heading on line 1, blank line on line 2, 2-3 sentences of prose on lines 3 onwards
  - **FR-6**: Include a trailing newline at the end of the file per Unix convention
  - **FR-7**: Stage the file in git and create a commit with the conventional message format "feat(305): create markdown file test-evp6mu.md with prose content"
  - **FR-8**: Push the committed changes to the remote repository with upstream tracking configured
  - **FR-9**: If any step fails (content generation, writing, validation, commit, push), fail immediately with a clear error message identifying the step and issue

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must reuse existing utilities from src/sheep/content_generators.py without code duplication
  - **NFR-2**: Code must follow established patterns and conventions from features 300-304 (file structure, function naming, error handling)
  - **NFR-3**: All file operations must validate encoding (UTF-8 without BOM) and line endings (Unix LF only)
  - **NFR-4**: All operations must use structured logging via get_logger() from src/sheep/observability/logging.py
  - **NFR-5**: Feature execution must complete within 60 seconds (reasonable time for Claude API call + file I/O + git operations)
  - **NFR-6**: No new external package dependencies should be introduced; use only Python stdlib and existing project infrastructure
  - **NFR-7**: No source code files should be modified; this is a content-only feature (markdown file creation only)
  - **NFR-8**: Feature module (if created) should follow the naming pattern of prior features: src/sheep/features/305_markdown_file_creation.py

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file added (test-evp6mu.md); no existing files modified |
  | src/sheep/content_generators.py | None | Existing utilities reused without modification; core functions already support all required operations |
  | src/sheep/features/ | Low | Feature 305 implementation module may be added (optional), but no changes to existing feature code |
  | Git history | Low | Single commit added with conventional message format |
  | No source code files modified | None | Feature is content-only; no changes to core application logic or utilities |

  ## Dependencies

  **Runtime Dependencies:**
  - Python 3.8+ (standard library: pathlib, subprocess)
  - git command-line tool (installed system-wide)
  - Claude API credentials (via environment or config)
  - CrewAI LLM framework (for get_reasoning_llm)

  **Code Dependencies:**
  - src/sheep/content_generators.py:
    - generate_markdown_content() - Generates H1 heading + 2-3 sentences via Claude API
    - write_markdown_file() - Writes file with UTF-8/LF encoding
    - validate_markdown_file() - Validates encoding, line endings, markdown structure
    - commit_markdown_file() - Stages and commits with feature number
    - push_markdown_file() - Pushes with upstream tracking
  - src/sheep/config/llm.py:
    - get_reasoning_llm() - Retrieves configured LLM instance
  - src/sheep/observability/logging.py:
    - get_logger() - Provides structured logging
  - src/sheep/tools/:
    - GitCommitTool - Git commit operations
    - GitPushTool - Git push operations

  **No new external package dependencies required** — all needed functionality exists in stdlib or is available via existing project infrastructure.

  ## Size Estimate

  **S** — This is the smallest possible feature unit:

  - Single markdown file creation at repository root (minimal implementation code)
  - No new source code modules or utilities required
  - No tests, no documentation generation, no configuration changes
  - Follows an established, battle-tested pattern from 300+ preceding features
  - Estimated effort: 15-25 minutes for implementation (100% code reuse from content_generators.py)
  - All supporting infrastructure (generate, write, validate, commit, push) already exists and proven in 300+ prior features
  - Implementation can be as simple as orchestrating calls to create_markdown_file("test-evp6mu.md", feature_number=305)

  **Justification for S (not M):**
  - M would imply multiple days of effort; this feature requires <1 hour
  - Infrastructure investment already complete from features 000-304
  - Zero architectural decisions needed; established pattern is clear
  - Zero dependency changes or environment configuration needed
  - Minimal code needed beyond orchestration layer

  ---

  _Requirements phase complete — ready for implementation_
