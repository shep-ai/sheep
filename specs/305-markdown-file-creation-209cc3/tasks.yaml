# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 305 implementation spans 6 focused tasks across 3 phases:

  **Phase 1: Feature Module Setup (1 task, 5 min)**
  - Create src/sheep/features/305_markdown_file_creation.py with metadata constants and imports.
    This establishes the module structure and entry point that CI/CD expects.

  **Phase 2: Implementation & Integration (3 tasks, 25 min)**
  - Implement create_feature_305_markdown_file() orchestration function that calls create_markdown_file()
    with correct parameters and returns result dict.
  - Add structured logging using get_logger() to log execution steps, success, and errors.
  - Add __main__ block for direct module execution (python -m sheep.features.feature_305_markdown_file_creation).

  **Phase 3: Execution & Validation (2 tasks, 20 min)**
  - Execute feature and validate file creation: verify test-evp6mu.md exists with correct H1 heading,
    2-3 sentences, UTF-8 encoding, LF line endings, and trailing newline.
  - Verify git operations: confirm commit was created with correct message, file was staged, and
    changes were pushed to remote with upstream tracking.

  **Execution Flow:**
  1. Create module with imports and metadata
  2. Implement orchestration function calling create_markdown_file()
  3. Add logging to observe execution steps
  4. Add __main__ block for testing execution
  5. Run feature and verify file creation (H1 heading, 2-3 sentences, encoding, line endings)
  6. Verify git commit and push succeeded with correct message and tracking

  **Key Design Approach:**
  - **100% Code Reuse**: All heavy lifting (generate, write, validate, commit, push) is performed
    by existing create_markdown_file() orchestration function from content_generators.py. Feature
    module simply calls it with correct parameters.
  - **Pattern Consistency**: Implementation follows exact pattern from features 302-304. No new
    utilities, no new git code, no new infrastructure.
  - **Fail-Fast Error Handling**: Validation errors are caught immediately and logged. No retries,
    no graceful degradation — errors stop execution with clear messages.
  - **Structured Logging**: All steps are logged using get_logger() with appropriate levels
    (info for success, error for failures) and context (feature number, filename).

  **Why This Ordering:**
  1. **Module First** (task-1) — Must exist before implementing logic. Establishes contract.
  2. **Orchestration Next** (task-2) — Core logic that calls existing utilities. Foundation for other tasks.
  3. **Logging** (task-3) — Adds observability to orchestration. Depends on orchestration being complete.
  4. **__main__ Block** (task-4) — Enables execution and testing. Depends on logging for output.
  5. **File Validation** (task-5) — Proves feature works end-to-end. Depends on __main__ for execution.
  6. **Git Verification** (task-6) — Confirms all operations succeeded. Depends on file being created.

  ## TDD Approach

  Each task follows Red-Green-Refactor cycle:
  - **Red**: Write tests that assert desired behavior (file exists, function returns dict, etc.)
  - **Green**: Implement minimal code to pass the tests
  - **Refactor**: Clean up, extract helpers, verify patterns match established conventions

  Example (task-1):
  - Red: Test asserts import succeeds and FEATURE_NUMBER == 305
  - Green: Create module with imports and constant
  - Refactor: Verify module structure matches feature_304.py

  Example (task-5):
  - Red: Test asserts file exists, has H1 heading, UTF-8 encoding, LF endings
  - Green: Execute feature, read file, verify structure
  - Refactor: Extract validation into helper functions for reuse

  ## Acceptance Criteria Strategy

  Each task includes specific, testable acceptance criteria:
  - **Existence checks**: File exists, function exists, imports work
  - **Behavior checks**: Function returns correct dict structure, logging calls correct methods
  - **Content checks**: File has H1 heading, 2-3 sentences, correct encoding/line endings
  - **Integration checks**: Git commit exists with correct message, branch tracking configured

  All criteria must be verified before task is considered complete.

  ## Effort Breakdown

  | Task | Phase | Effort | Reason |
  | ---- | ----- | ------ | ------ |
  | task-1 | Module Setup | 5min | Creating module file with imports and constants |
  | task-2 | Implementation | 10min | Implementing orchestration function (mostly calling existing code) |
  | task-3 | Implementation | 10min | Adding logging to track execution steps |
  | task-4 | Implementation | 5min | Adding __main__ block for execution |
  | task-5 | Validation | 10min | Executing feature and validating file creation |
  | task-6 | Validation | 10min | Verifying git commit and push operations |
  | **Total** | **All** | **50min** | Estimated total for complete implementation |

  The bulk of effort is in validation (task-5 and task-6) which must thoroughly verify all
  success criteria. Implementation is fast because all utilities already exist.
