content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-17
  - **Author:** Claude Code (Planning Phase)

  ## Architecture Overview

  ### Existing Infrastructure

  The Sheep codebase provides a complete, proven implementation framework for markdown
  file creation in `src/sheep/content_generators.py`:

  **Core Functions:**
  - `generate_markdown_content()` — Calls Claude API via CrewAI to generate H1 heading + 2-3 sentences
  - `write_markdown_file(content, filename)` — Writes to repository root with UTF-8 encoding (no BOM)
  - `validate_markdown_file(filepath)` — Validates markdown syntax, encoding, line endings, content structure
  - `commit_markdown_file(filepath, content, repo_path)` — Stages file and creates conventional commit
  - `push_markdown_file(repo_path, remote)` — Pushes to remote with upstream tracking
  - `create_markdown_file(filename, repo_path)` — **Orchestration function** that chains all 5 steps above

  **Precedent:** Features 063-078 all use `create_markdown_file()` successfully, with 70+ test files
  demonstrating the pattern works reliably and consistently.

  ### Implementation Approach

  Per the research findings' recommendation, this feature will use the existing `create_markdown_file()`
  orchestration function rather than decomposing steps manually. This approach:

  1. **Leverages Proven Code:** All functions are already implemented, tested, and used in production
  2. **Reduces Risk:** Reusing tested infrastructure is safer than reimplementation
  3. **Aligns with Spec:** NFR-6 explicitly requires following the established pattern from 70+ files
  4. **Minimizes Custom Code:** Orchestration function handles all 5 workflow steps end-to-end
  5. **Enables Observation:** Existing logging and error handling provide full visibility

  ### Workflow Overview

  The `create_markdown_file("test-o8mjmj.md")` function will:

  1. **Generate Content** → Call Claude API, validate H1 heading + 2-3 sentences format
  2. **Write File** → Create test-o8mjmj.md at repo root with UTF-8 (no BOM), LF line endings
  3. **Validate File** → Check markdown syntax, encoding, line endings, content structure
  4. **Stage & Commit** → Use GitCommitTool to commit with message: `feat: Create test-o8mjmj.md markdown file with [topic] content`
  5. **Push** → Use GitPushTool to push to origin with upstream tracking for feature branch

  All steps are logged via structlog and errors are handled with descriptive messages.

  ## Key Design Decisions

  ### Decision 1: Content Generation Method
  **Chosen:** LLM-based generation using Claude API via CrewAI

  **Rationale:** Per research findings, system-generated content:
  - Aligns with Sheep platform's automated implementation philosophy
  - Test files validate file creation workflow, not prose originality (spec resolution)
  - Leverages existing LLM infrastructure and CrewAI integration
  - Generates deterministic, reproducible output suitable for test files
  - Features 063-078 established this as the proven pattern

  **Implementation:** Use existing `generate_markdown_content()` function which:
  - Calls Claude API with structured prompt
  - Validates response format (H1 heading, 2-3 sentences, ≥50 chars)
  - Returns content with trailing newline (Unix convention)
  - Logs all steps to observability system

  **Alternatives Rejected:**
  - Hand-authored prose: Slower, not aligned with automated platform ethos
  - Templated/formulaic: Inflexible, maintenance burden across 70+ files

  ### Decision 2: File I/O Implementation
  **Chosen:** Python `pathlib.Path` with `write_text(encoding="utf-8")`

  **Rationale:** Per research findings and spec requirement (NFR-5):
  - Spec explicitly requires pathlib (NFR-5)
  - Modern Python standard library approach (preferred over os.path)
  - Existing codebase uses pathlib consistently
  - Cross-platform compatibility (handles / vs \ automatically)
  - Atomic operations: exists(), is_file(), stat() are clear and reliable

  **Implementation:** Use existing `write_markdown_file()` function which:
  - Validates filename safety (rejects path traversal attempts)
  - Resolves to repository root via `Path.cwd()`
  - Writes with UTF-8 encoding (handles LF on Unix systems)
  - Verifies file creation and non-empty size
  - Logs all operations

  **Alternatives Rejected:**
  - os.path module: Legacy API, less object-oriented
  - Direct file write with open(): Lower-level, manual encoding/newline handling

  ### Decision 3: Text Encoding and Line Endings
  **Chosen:** UTF-8 encoding without BOM, Unix-style LF line endings

  **Rationale:** Per research findings and spec requirements (NFR-1, NFR-2):
  - Spec explicitly requires UTF-8 without BOM (NFR-1) and LF endings (NFR-2)
  - UTF-8 is modern standard: universal encoding, backward-compatible with ASCII, no BOM needed
  - LF is Unix convention: consistent across 70+ existing files, required for cross-platform compatibility
  - Python 3 write_text(encoding="utf-8") uses system line ending (LF on Unix)
  - Validation function checks both requirements at file read time

  **Implementation:** Use existing `validate_markdown_file()` function which:
  - Reads file as binary to verify encoding and line endings
  - Checks for UTF-8 BOM (0xEF 0xBB 0xBF) — must not be present
  - Decodes as UTF-8 to verify encoding correctness
  - Checks for CRLF sequences (0x0D 0x0A) — must not be present
  - Verifies trailing newline present (Unix convention)

  **Alternatives Rejected:**
  - UTF-8 with BOM: Unnecessary for UTF-8, adds 3 bytes per file
  - Windows CRLF: Breaks cross-platform consistency, existing 70+ files use LF

  ### Decision 4: Git Workflow Integration
  **Chosen:** Use existing GitCommitTool and GitPushTool from `src/sheep/tools/git_tools.py`

  **Rationale:** Per research findings:
  - No new dependencies needed (both tools already in codebase)
  - Consistent with platform patterns (all git operations go through these tools)
  - Higher-level abstraction over subprocess with proper error handling
  - Integrated logging: errors and operations logged to observability system
  - Proven in features 063-078

  **Implementation:** Use existing functions:
  - `commit_markdown_file(filepath, content, repo_path)` → Stages file and creates conventional commit
    - Extracts topic from H1 heading for commit message
    - Message format: `feat: Create test-o8mjmj.md markdown file with [topic] content`
    - Uses GitCommitTool._run() with add_all=True
  - `push_markdown_file(repo_path, remote="origin")` → Pushes with upstream tracking
    - Uses GitPushTool._run() with set_upstream=True
    - Ensures feature branch is properly configured for future pushes

  **Alternatives Rejected:**
  - GitPython library: Would add new dependency, duplicates existing functionality
  - Direct subprocess calls: Loses abstraction layer, harder to test and maintain

  ### Decision 5: Using Orchestration Function vs. Manual Step Composition
  **Chosen:** Use existing `create_markdown_file()` orchestration function

  **Rationale:** Per research findings and spec requirement (NFR-6):
  - Spec requires following established pattern (NFR-6)
  - Features 063-078 all use `create_markdown_file()` successfully
  - Function provides complete workflow with validation and error handling
  - Reduces custom code, reduces risk, faster implementation
  - Consistent with platform design philosophy (code reuse, proven patterns)

  **Implementation:** Single call to:
  ```python
  result = create_markdown_file("test-o8mjmj.md")
  ```

  Returns:
  - filepath: Full path to created file
  - content: The markdown content
  - commit_message: The git commit message used
  - push_result: The result from git push operation

  **Alternatives Rejected:**
  - Manual step composition: Requires reimplementing error handling and validation
  - Custom implementation from scratch: Duplicates code, introduces risk

  ## Implementation Strategy

  ### Phase 1: Content Generation and File Creation (5 minutes)

  1. **Generate markdown content** using `generate_markdown_content()`
     - LLM call generates H1 heading + 2-3 sentences
     - Validates format in response
     - Returns content with trailing newline

  2. **Write file to disk** using `write_markdown_file()`
     - Writes content to test-o8mjmj.md at repository root
     - Ensures UTF-8 encoding without BOM
     - Verifies file creation and non-empty size

  This phase is fast because:
  - All code is already implemented and proven
  - LLM latency (~1-2 sec) dominates execution time
  - Local file I/O is negligible (<1 sec)

  ### Phase 2: Validation and Git Integration (5 minutes)

  1. **Validate file** using `validate_markdown_file()`
     - Checks markdown syntax (H1 heading, blank line, prose structure)
     - Verifies encoding (UTF-8 without BOM)
     - Verifies line endings (LF only, no CRLF)
     - Validates content structure (2-3 sentences, proper formatting)

  2. **Stage and commit** using `commit_markdown_file()`
     - Extracts topic from H1 heading
     - Formats conventional commit message
     - Uses GitCommitTool to stage and commit

  3. **Push to remote** using `push_markdown_file()`
     - Pushes to origin with upstream tracking
     - Ensures feature branch is properly configured

  This phase is fast because:
  - Validation is local (no network calls)
  - Git operations are subprocess calls (~1-3 sec)
  - All code is pre-implemented and proven

  ### Total Execution Time
  - Expected: 3-6 seconds (dominated by LLM API and git push network latency)
  - Typical breakdown:
    - Content generation: 1-2 seconds
    - File write: <1 second
    - Validation: <100 ms
    - Commit: <1 second
    - Push: 1-3 seconds

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | **LLM API failures** | Low | High (workflow blocks) | Catch exceptions, log descriptively, let observability system alert. Existing error handling in generate_markdown_content(). |
  | **File already exists** | Very Low | Low (clear error) | Git will reject changes if file unchanged, error message guides user. Use force flag if retry needed. |
  | **File permission errors** | Very Low | Low (clear error) | IOError with descriptive message directs user to check repo permissions. Standard permission model applies. |
  | **Git commit failures** | Very Low | Medium (workflow incomplete) | GitCommitTool catches subprocess.CalledProcessError, logs details, raises with descriptive message. User checks git configuration. |
  | **Network failures (push)** | Low | Medium (workflow incomplete) | GitPushTool handles subprocess errors, logs details. Feature branch remains locally committed. User can retry push manually. |
  | **Validation failures** | Very Low | Low (clear error) | validate_markdown_file() checks all requirements, raises descriptive ValueError if any check fails. Helps debugging. |
  | **Encoding/line ending issues** | Very Low | Low (clear error) | Validation function explicitly checks UTF-8 decoding, BOM, CRLF — catches and reports issues clearly. |

  ### Risk Notes

  - **Well-Tested Pattern:** 70+ existing files demonstrate the workflow is reliable
  - **No New Code:** Feature uses only existing, proven infrastructure
  - **Observable:** Structured logging via structlog provides full visibility into each step
  - **Error Handling:** All functions include try/except with meaningful error messages
  - **Reversible:** If errors occur, git state is clean — local commit, push can be retried

  ## No Code Changes Required

  This feature does NOT require:
  - Creating new functions or modules
  - Modifying existing source code (no changes to /src/sheep/)
  - Changes to configuration files
  - Changes to test files
  - New dependencies (all required libraries already in pyproject.toml)
  - Changes to CI/CD pipelines or git workflows

  The feature is pure usage of existing infrastructure.

