content: |
  ## Status

  - **Phase:** Implementation Planning
  - **Updated:** 2026-03-17
  - **Author:** Claude Code (Planning Phase)
  - **Estimate:** 15-20 minutes total

  ## Summary

  This feature implements a straightforward workflow using existing infrastructure from
  `src/sheep/content_generators.py`. The implementation consists of 5 tasks organized
  across 2 phases:

  **Phase 1: Content Generation and File Creation (4 minutes)**
  - Task 1: Generate markdown content via LLM (generate_markdown_content)
  - Task 2: Write file to disk with proper encoding (write_markdown_file)

  **Phase 2: Validation and Git Integration (6 minutes)**
  - Task 3: Validate file format and properties (validate_markdown_file)
  - Task 4: Stage and commit with conventional message (commit_markdown_file)
  - Task 5: Push to remote repository (push_markdown_file)

  All tasks use existing, proven functions from the content_generators module. Each task
  includes TDD cycles (RED: write test assertions, GREEN: call existing function, REFACTOR: verify
  no changes needed). No new code is written; implementation is pure orchestration and
  verification of existing infrastructure.

  The workflow mirrors features 063-078 which use identical patterns with 70+ test files
  demonstrating reliability. Total estimated effort is 15-20 minutes, dominated by network
  latency (LLM API call ~1-2 seconds, git push ~1-3 seconds).

  ## Task Dependencies

  ```
  Task 1: Generate content
    ↓
  Task 2: Write file
    ↓
  Task 3: Validate file
    ↓
  Task 4: Commit file
    ↓
  Task 5: Push to remote
  ```

  Each task depends on the previous task's successful completion. All tasks are linear
  (no parallel work possible).

  ## Implementation Notes

  ### No Code Writing Required

  All tasks use existing functions:
  - `generate_markdown_content()` — Already implemented, tested, proven in features 063-078
  - `write_markdown_file(content, filename)` — Already implemented, tested, proven
  - `validate_markdown_file(filepath)` — Already implemented, tested, proven
  - `commit_markdown_file(filepath, content, repo_path)` — Already implemented, tested, proven
  - `push_markdown_file(repo_path, remote)` — Already implemented, tested, proven

  No source code modifications needed. Implementation is pure usage of existing infrastructure.

  ### TDD Approach

  Each task follows RED-GREEN-REFACTOR cycle:

  - **RED:** Write test assertions that specify expected behavior
  - **GREEN:** Call existing function(s) to pass the test
  - **REFACTOR:** Verify no cleanup needed (functions already optimized)

  Since functions are pre-implemented, the GREEN step is just function calls. The RED step
  writes assertion code to validate behavior. The REFACTOR step verifies error handling and
  edge cases are covered by existing code.

  ### Execution Flow

  1. Task 1 generates content: `content = generate_markdown_content()`
  2. Task 2 writes file: `filepath = write_markdown_file(content, "test-o8mjmj.md")`
  3. Task 3 validates: `validate_markdown_file(filepath)` must return True
  4. Task 4 commits: `commit_markdown_file(filepath, content)` creates git commit
  5. Task 5 pushes: `push_markdown_file()` publishes to remote

  All tasks are sequential with clear dependencies. Each task is isolated and can be tested
  independently by calling the corresponding function.

  ### Success Criteria Summary

  - File test-o8mjmj.md exists at repository root
  - File contains H1 heading + 2-3 sentences of prose
  - File encoded as UTF-8 without BOM, LF line endings
  - File staged in git with conventional commit message
  - Changes pushed to remote origin repository
  - Upstream tracking set for feature branch
  - No new code written, only existing infrastructure used

