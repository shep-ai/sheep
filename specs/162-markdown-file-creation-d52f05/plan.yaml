content: |
  ## Architecture Overview

  This feature follows the well-established **markdown-file-creation pattern** documented in features 069-161.
  The implementation is self-contained with no dependencies on source code (/src/sheep/), no external APIs,
  and no configuration changes. The file creation and git workflow are straightforward, sequential operations.

  **Pattern Foundation:**
  - 161+ test markdown files in repository root demonstrate proven implementation approach
  - Consistent structure: H1 heading → blank line → 2-3 prose sentences
  - UTF-8 with LF line endings enforced via Python pathlib with explicit encoding parameters
  - Git workflow: add → commit → push using subprocess CLI calls (no external git libraries)

  **Feature Scope:**
  - Single file creation (test-yx4an9.md) at repository root
  - No modifications to existing files, source code, or configuration
  - No dependencies on application logic or other features
  - Linear execution with minimal complexity

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path (Python stdlib)

  **Chosen:** `pathlib.Path` from Python 3.11+ standard library

  **Why this approach:**
  - Modern, ergonomic API for cross-platform file operations
  - No external dependencies (aligns with requirement constraints)
  - Excellent support for encoding control (`encoding=` and `newline=` parameters)
  - Matches pattern used across Sheep codebase for file operations
  - Available in required Python 3.11+ environment

  **Alternatives considered & rejected:**
  - `os.path` — older API; pathlib is now the Python standard
  - External libraries (PyYAML, Toml, etc.) — unnecessary for plain text file creation

  ### 2. Encoding & Line Ending Enforcement

  **Chosen:** UTF-8 with explicit `newline='\n'` parameter in open()

  **Why this approach:**
  - `encoding='utf-8'` explicitly specifies UTF-8 (no BOM/Byte Order Mark) — matches requirement
  - `newline='\n'` disables platform-specific line ending conversion:
    - On Windows, text mode defaults to converting `\n` to `\r\n` (CRLF)
    - Setting `newline='\n'` prevents this and enforces LF throughout the file
  - This is standard Python practice for enforcing Unix line endings cross-platform
  - Requirement FR-6 (LF line endings) and NFR-2 (UTF-8 no BOM) both satisfied in one operation

  **Alternatives considered & rejected:**
  - `encoding='utf-8-sig'` — adds BOM; spec explicitly requires BOM-free UTF-8
  - Binary mode with manual byte control — unnecessarily complex; text mode handles cleanly

  ### 3. Git Integration: subprocess.run() CLI

  **Chosen:** Use `subprocess.run()` to execute git commands (add, commit, push)

  **Why this approach:**
  - Lightweight, stdlib-native solution (no external package management)
  - Git is standard in development environments (always available)
  - Git operations required are straightforward shell commands:
    - `git add test-yx4an9.md`
    - `git commit -m "feat(162): ..."`
    - `git push -u origin feat/162-markdown-file-creation-d52f05`
  - Using explicit argument lists (not `shell=True`) prevents command injection
  - Matches patterns used in similar file creation scripts across Sheep codebase

  **Alternatives considered & rejected:**
  - GitPython — external dependency; violates constraint of stdlib-only approach
  - Dulwich (pure Python git) — overkill for simple operations; adds package dependency

  ### 4. Content Generation: Manual Prose Writing

  **Chosen:** Hardcoded H1 heading and 2-3 sentences of coherent prose

  **Why this approach:**
  - Prose content requires coherent, grammatically correct English (NFR-2)
  - Topic selection is flexible and unconstrained (NFR-7)
  - Manual writing ensures quality and readability
  - No dynamic content generation needed (single file, single execution)
  - All 161+ precedent test files use manually written prose (maintains consistency)

  **Alternatives considered & rejected:**
  - Template-based generation — overengineering for single file; reduces readability
  - AI-generated prose — adds external API dependency, non-deterministic output, violates constraint

  ### 5. Post-Creation Validation: File Size Check

  **Chosen:** After writing, validate file size using `Path.stat().st_size` (should be 300-600 bytes)

  **Why this approach:**
  - Only reliable validation point (actual byte count depends on text length and platform encodings)
  - Early detection: catch malformed files before git operations
  - Simple, low-cost safety check: single stat() system call
  - Ensures compliance before push

  **Alternatives considered & rejected:**
  - Pre-creation estimation — error-prone; impossible to predict exact byte count
  - No validation — risks non-compliance; simple validation is better than discovering after push

  ### 6. Implementation Approach: Single Synchronous Script

  **Chosen:** Linear, synchronous execution (write file → validate → git add → commit → push)

  **Why this approach:**
  - This is a one-off file creation task (single execution during implementation)
  - No reusability, testing framework, or configuration variation needed (S-size feature)
  - Linear sequential script is clearest, fastest approach
  - No parallelization opportunities (operations are dependent)
  - Matches successful pattern from features 159-161

  **Alternatives considered & rejected:**
  - Modular function-based design — premature abstraction; no reuse case
  - Configuration-driven approach — unnecessary indirection for fixed inputs

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Validation) must come first** because:
  - Git operations depend on the file existing with correct content
  - Validation catches problems early (before irreversible push)
  - Creates clear checkpoint: if file validation fails, git operations never run

  **Phase 2 (Git Integration) depends on Phase 1** because:
  - File must exist and pass validation before staging
  - Commit message references the file being created
  - Push follows only after successful commit

  ### Detailed Workflow

  1. **Create file with content:** Use pathlib to write H1 heading + blank line + prose sentences
  2. **Validate encoding:** Read file in binary mode, verify UTF-8 without BOM
  3. **Validate line endings:** Verify all line separators are `\n` (LF) only
  4. **Validate file size:** Check stat().st_size is 300-600 bytes
  5. **Git add:** Stage file with `git add test-yx4an9.md`
  6. **Git commit:** Create commit with message `feat(162): Create markdown file test-yx4an9.md with prose content (#<PR_NUMBER>)`
  7. **Git push:** Push to origin with `git push -u origin feat/162-markdown-file-creation-d52f05`

  ### No Conditional Logic

  This feature has no complex branching. Every step is straightforward:
  - If validation fails, we can catch and report (or re-run with corrected content)
  - Git operations are standard commands with no error paths in the happy case
  - Feature is too small to require environment-based branching

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | **File encoding incorrect (includes BOM or non-UTF-8)** | Medium | High (validation failure) | Explicitly specify `encoding='utf-8'` in open(); verify with binary read after creation |
  | **Line endings incorrect (CRLF instead of LF)** | Medium | High (validation failure) | Use `newline='\n'` parameter in open(); this disables platform-specific conversion on Windows |
  | **File size out of range** | Low | Medium (validation failure) | Post-creation check: `Path.stat().st_size`; reasonable content (2-3 sentences) naturally yields 300-600 bytes |
  | **Prose quality (gibberish, placeholder text)** | Low | Medium (manual review failure) | Write coherent sentences manually; NFR-2 explicitly requires grammatically correct English |
  | **Git operations fail (missing git, wrong branch, etc.)** | Low | High (cannot merge) | Verify git is available; confirm feature branch exists; use subprocess with explicit args (no shell injection) |
  | **Commit message format incorrect** | Low | Low (can fix in follow-up) | Use exact format from product decision: `feat(162): Create markdown file test-yx4an9.md with prose content (#<PR_NUMBER>)` |
  | **File not pushed to remote** | Very Low | High (cannot merge) | Check git push output; feature branch should auto-track after `-u` flag |

  ## Files to Create & Modify

  **Files to Create:**
  - `test-yx4an9.md` — markdown file at repository root with H1 heading and prose content

  **Files to Modify:**
  - None — this feature is purely file creation, no existing files are changed

  **Why No Source Code Changes:**
  - Feature is self-contained artifact creation (test file)
  - No dependencies on /src/sheep/ or application logic
  - No configuration or build-system changes needed (FR-4)

  ## Compliance with Established Pattern

  This implementation adheres to the **markdown-file-creation pattern** defined in features 069-161:

  - ✅ Single markdown file at repository root (test-*.md)
  - ✅ File structure: H1 heading → blank line → 2-3 prose sentences
  - ✅ UTF-8 encoding (no BOM), LF line endings
  - ✅ Prose content is coherent, readable, manually written
  - ✅ Git workflow: add → commit (conventional format) → push
  - ✅ No modifications to source code, config, or existing files
  - ✅ Completable in 10-15 minutes per S-size estimate

  ---

  _Planning phase complete. Architecture and design decisions documented. Ready for task breakdown and implementation._
