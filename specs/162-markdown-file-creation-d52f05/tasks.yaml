content: |
  ## Summary

  This task breakdown implements the markdown-file-creation feature in 7 sequential tasks across 2 phases:

  **Phase 1: File Creation & Validation (Tasks 1-4)**
  - Task 1: Create the markdown file with H1 heading and 2-3 prose sentences (10 min)
  - Task 2: Validate UTF-8 encoding without BOM (3 min)
  - Task 3: Validate LF line endings (no CRLF) (2 min)
  - Task 4: Validate file size is 300-600 bytes (2 min)

  **Phase 2: Git Integration (Tasks 5-7)**
  - Task 5: Stage file with git add (2 min)
  - Task 6: Commit with conventional message including PR number (3 min)
  - Task 7: Push to remote origin (3 min)

  **Total effort:** ~25 minutes (aligns with S-size estimate of 10-15 min feature work plus validation/git overhead)

  ## Task Dependency Graph

  ```
  Task 1 (create file)
      ↓
  Task 2 (validate encoding)
      ↓
  Task 3 (validate line endings)
      ↓
  Task 4 (validate file size)
      ↓
  Task 5 (git add)
      ↓
  Task 6 (git commit)
      ↓
  Task 7 (git push)
  ```

  All tasks are sequential (linear dependency chain) because:
  - File must exist before validation
  - Validation must pass before git operations
  - Git add must precede commit
  - Commit must precede push

  ## Implementation Notes

  ### File Content (Task 1)

  The markdown file should follow this structure:

  ```markdown
  # Example Heading

  This is the first sentence of prose content. This is the second sentence. This is the third sentence to complete the requirement.
  ```

  **Requirements:**
  - Line 1: H1 heading (one `#` followed by space and heading text)
  - Line 2: Blank line (empty, only newline character)
  - Line 3+: 2-3 sentences of coherent prose (no placeholder text, no lorem ipsum)

  **Topic selection:** Flexible (any reasonable subject matter)

  **Prose quality:** Must be grammatically correct English (no gibberish or made-up words)

  ### Encoding and Line Endings (Tasks 2-3)

  **UTF-8 without BOM:**
  - Incorrect: File starts with bytes `EF BB BF` (BOM signature)
  - Correct: File starts with ASCII/UTF-8 text without BOM prefix
  - Verification: Read file in binary, check first 3 bytes ≠ b'\xef\xbb\xbf'

  **LF line endings:**
  - Incorrect: File contains `\r\n` (CRLF, Windows style)
  - Correct: File contains only `\n` (LF, Unix style)
  - Verification: Check file contains no `\r` (CR, byte 0x0D)

  ### Git Commit Message (Task 6)

  **Format:** `feat(162): Create markdown file test-yx4an9.md with prose content (#<PR_NUMBER>)`

  **Example:** `feat(162): Create markdown file test-yx4an9.md with prose content (#232)`

  **Where to get PR number:**
  - From CI/CD environment variable (e.g., GITHUB_PR_NUMBER, CI_PULL_REQUEST_IID)
  - Or passed as argument to implementation script
  - Or extracted from GitHub API using gh CLI

  ### Feature Branch

  **Branch name:** `feat/162-markdown-file-creation-d52f05`

  **Expected state:** Feature branch should already exist and be checked out before starting tasks

  **After task 7:** Branch contains the new commit and is pushed to origin

  ## Success Criteria Summary

  ✅ File exists: test-yx4an9.md in repository root
  ✅ Content format: H1 heading → blank line → 2-3 prose sentences
  ✅ Encoding: UTF-8 without BOM
  ✅ Line endings: LF (Unix style, no CRLF)
  ✅ File size: 300-600 bytes
  ✅ Git status: File staged, committed with conventional message, pushed to origin
  ✅ Commit message: Includes PR number per product decision
  ✅ Branch: Changes on feat/162-markdown-file-creation-d52f05, pushed to remote

  ---

  _Task breakdown complete. Ready for implementation phase._
