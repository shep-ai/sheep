content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-24
  - **Feature:** 201 — markdown-file-creation-04332b

  ## Architecture Overview

  Feature 201 creates a single test markdown file (test-y9go1c.md) at the repository root,
  continuing the well-established pattern from 200+ existing test files (features 150-200).
  The architecture is intentionally minimal — this is a pure file creation task with no source
  code modifications, no new dependencies, and no infrastructure changes required.

  ### Relationship to Existing Codebase

  The Sheep platform repository contains 200+ markdown test files (test-*.md) in the root
  directory, each following an identical structure:

  - H1 markdown heading (title)
  - Blank line separator
  - Exactly 2-3 sentences of thematically related prose
  - UTF-8 encoding without BOM
  - Unix LF line endings only
  - File size: typically 300-550 bytes

  Feature 201 adds one more file to this collection, demonstrating the platform's ability
  to reliably generate high-quality, validated artifacts at scale. Features 199 and 200
  provide direct implementation precedents with proven approaches that can be directly reused.

  ### No Code Changes Required

  This feature does not require:
  - Modifications to src/sheep/ source code
  - Changes to configuration files (pyproject.toml, .env, docker-compose.yml, etc.)
  - Test framework modifications
  - Documentation updates beyond this spec
  - New external package dependencies

  The implementation is a standalone script/workflow using only Python standard library
  (pathlib, subprocess, re) and Claude API (already available in the platform).

  ## Key Design Decisions

  ### 1. Content Generation: Claude API with Deterministic Output

  **Decision:** Use Claude API with temperature=0 (or seed-based topic selection) to generate
  prose content deterministically.

  **Alternatives Considered:**
  - Static template library: Fast but produces indistinguishable boilerplate
  - Manual human-written content: Defeats automation purpose, does not scale
  - Random generation: Increases variety but sacrifices reproducibility

  **Rationale:** Claude API is available in the platform environment (demonstrated by features
  150-200, 200+ existing test files) and generates unique, coherent prose that maintains
  thematic alignment between title and content. Deterministic output ensures reproducibility
  and enables exact verification of results — critical for automated systems. Temperature=0
  or seed-based approach provides variety without sacrificing determinism. This demonstrates
  the platform's capability to generate professional-quality content, not templated boilerplate.

  **Implementation:** Call Claude API with:
  - Prompt: "Generate a meaningful title (one sentence, 5-10 words) and 2-3 sentences about [topic]"
  - temperature: 0 (for deterministic convergence)
  - Parse response into title and prose components
  - Validate sentence count and thematic coherence

  ### 2. File Writing: Python pathlib with Explicit Encoding

  **Decision:** Use `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')` to
  write the file with explicit UTF-8 encoding and Unix LF line endings.

  **Alternatives Considered:**
  - open() context manager with manual write: More verbose, less pythonic
  - os.path with os.write(): Deprecated pattern, requires bytes conversion
  - Other libraries (not available in standard library)

  **Rationale:** pathlib is the Python 3.11+ standard for file I/O and provides clean syntax
  with automatic resource management. The write_text() method accepts explicit encoding and
  newline parameters, guaranteeing UTF-8 (no BOM) and Unix LF line endings without additional
  boilerplate. This meets strict validation requirements and aligns with modern Python
  conventions used in the Sheep codebase. Proven across features 199-200.

  **Implementation:**
  ```python
  from pathlib import Path

  repo_root = Path("/path/to/repo")
  file_path = repo_root / "test-y9go1c.md"
  content = "# Title\n\nSentence one. Sentence two. Sentence three.\n"
  file_path.write_text(content, encoding='utf-8', newline='\n')
  ```

  ### 3. Validation: Comprehensive Pre-Commit Checks

  **Decision:** Implement comprehensive validation covering all success criteria before
  staging the file with git add.

  **Alternatives Considered:**
  - Minimal validation (file exists, H1 present): Misses encoding/line-ending errors
  - No validation: Risks committing malformed files, violates quality standards

  **Rationale:** Feature specification mandates validation of markdown syntax, sentence count,
  UTF-8 encoding (no BOM), LF line endings, file size (250-600 bytes), and prose coherence.
  These constraints are observed across all 200+ existing test files, representing a platform
  quality standard. Validation adds minimal overhead (2-3 minutes) and ensures consistency
  with the established pattern. Pre-commit validation catches errors early, preventing rework
  and ensuring high-quality artifacts.

  **Validation Checklist:**
  1. File exists at repository root (test-y9go1c.md)
  2. File is readable and accessible
  3. Exactly one H1 heading at start of file
  4. Blank line separates heading from prose
  5. Exactly 2-3 sentences in prose (regex-based boundary detection)
  6. UTF-8 encoding without BOM (verify no xefbbbf bytes)
  7. Unix line endings only (LF \n, no CRLF \r\n)
  8. File size between 250-600 bytes
  9. CommonMark syntax compliance
  10. Prose is meaningful and coherent

  ### 4. Git Integration: subprocess Module

  **Decision:** Use Python subprocess module to execute git add, git commit, and git push
  commands with shell=False for safety.

  **Alternatives Considered:**
  - GitPython library: Adds external dependency, violates requirement for standard library only
  - Manual git API over HTTP: Overly complex, loses git command semantics

  **Rationale:** subprocess is Python standard library and provides direct, reliable access
  to git commands with clear error reporting. The feature explicitly requires standard library
  only (NFR-5), making subprocess the only appropriate choice. subprocess enables clean
  execution of conventional commit workflow with shell=False (prevents command injection).

  **Implementation:**
  ```python
  import subprocess

  subprocess.run(['git', 'add', 'test-y9go1c.md'], check=True, cwd=repo_root)
  subprocess.run(['git', 'commit', '-m',
                  'feat(201): Create markdown file test-y9go1c.md with title and prose content'],
                 check=True, cwd=repo_root)
  subprocess.run(['git', 'push', '-u', 'origin', 'feat/201-markdown-file-creation-04332b'],
                 check=True, cwd=repo_root)
  ```

  ### 5. Markdown Format: CommonMark Specification

  **Decision:** Follow CommonMark-compliant ATX heading format with blank line separation.

  **Alternatives Considered:**
  - Non-standard heading formats: Violates CommonMark spec and existing test file patterns
  - Prose directly after heading (no blank line): Violates spec block structure requirements

  **Rationale:** Feature specification requires CommonMark compliance (NFR-1). Analysis of
  existing test files confirms the pattern: '# Title', blank line, prose sentences. This
  structure ensures valid markdown parsing across all processors and maintains consistency
  with 200+ existing test files. The blank line is required by CommonMark for proper block
  separation (block-level elements must be separated by blank lines).

  ## Implementation Strategy

  The feature will be implemented in three sequential phases:

  ### Phase 1: Content Generation (Establish prose content)
  - Task 1.1: Implement Claude API prose generation function with deterministic output
  - Task 1.2: Generate and validate title and prose content

  ### Phase 2: File Creation & Validation (Write and validate file)
  - Task 2.1: Implement file writing function using pathlib with UTF-8/LF
  - Task 2.2: Implement comprehensive validation function covering all success criteria
  - Task 2.3: Execute file creation and validate before proceeding to git integration

  ### Phase 3: Git Integration (Complete workflow)
  - Task 3.1: Implement git workflow functions (add, commit, push)
  - Task 3.2: Execute git integration to complete feature
  - Task 3.3: Verify all success criteria and confirm feature completion

  This ordering ensures content is correct before writing to disk, file is validated before
  committing to git, and git operations complete the workflow. Dependencies between phases
  enforce correct sequencing.

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Claude API unavailable | Low | High | Feature 199-200 confirm API is available; fallback to manual prose if needed (violates automation philosophy but unblocks feature) |
  | Generated prose is incoherent | Low | Medium | Validate sentence count and provide semantic feedback; Claude generally produces appropriate content for neutral topics; manual review possible |
  | UTF-8 encoding fails | Very Low | Medium | pathlib.write_text() handles encoding; validation verifies bytes; explicit encoding parameter prevents surprises |
  | CRLF line endings on Windows | Medium | High | Explicit newline='\n' parameter and validation check prevent this; subprocess runs on Linux environment (verified in platform setup) |
  | File already exists (collision) | Very Low | Low | Filename test-y9go1c.md is unique (not in 200+ existing files); git will reject duplicate commit if somehow created |
  | Git operations fail | Low | High | subprocess check=True raises exception on git command failure; clear error messages enable quick debugging |
  | Validation checks are too strict | Low | Medium | Validation criteria match 200+ existing test files; success criteria are explicit and non-negotiable |

  ## Effort Estimate

  **Total: 10-15 minutes** (consistent with feature size estimate "S" and precedent from features 198-200)

  - Content generation (Claude API call): 3-5 minutes (includes API latency)
  - File creation and validation: 2-3 minutes
  - Git workflow: 2-5 minutes
  - Verification and cleanup: 1-2 minutes

  ---

  _Implementation plan complete — ready for task breakdown and execution_
