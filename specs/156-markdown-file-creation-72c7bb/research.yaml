# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "Python pathlib.Path with explicit encoding and newline parameters"
    rejected:
      - "open() function — older style, less ergonomic API, requires explicit file handle management"
      - "os.open() — lower-level interface, requires more boilerplate code, prone to encoding errors"
    rationale: >
      pathlib.Path.write_text() provides a modern, clean API that is part of Python standard library
      since 3.4. It handles file encoding and newline parameters elegantly, ensuring cross-platform
      compatibility. By setting encoding='utf-8' and newline='\n', we ensure NFR-1 (UTF-8 encoding)
      and NFR-2 (LF line endings) are satisfied. This approach is used in features 153-155 and aligns
      with Python best practices for file I/O in modern codebases.

  - title: "Content Generation Strategy"
    chosen: "Hardcoded meaningful prose content about a topic"
    rejected:
      - "Randomly generated content — violates spec requirement for 'meaningful' content, would require external library or complex generation logic"
      - "External content API or library — adds network dependency, external package dependency, violates NFR-6 (standard library only), unnecessary complexity"
    rationale: >
      Spec explicitly requires 'meaningful, topic-based content' and allows flexibility in topic selection.
      Hardcoding prose content about a single topic (e.g., technology, history, nature) is simplest,
      meets the requirement, and matches the pattern of 150+ existing test files in the repository.
      This approach has no dependencies, is deterministic, and is easy to validate. Related features
      153-155 use this same pattern successfully.

  - title: "Line Ending Handling Strategy"
    chosen: "Explicitly set newline='\\n' parameter in pathlib.Path.write_text() call"
    rejected:
      - "Rely on platform default line endings — Windows uses CRLF by default, violating NFR-2 which requires LF (Unix-style) line endings. Current platform is Windows, so this would fail the requirement."
      - "Post-process file after creation to convert line endings — adds unnecessary complexity, requires additional file I/O operation, violates DRY principle"
    rationale: >
      Python's pathlib.write_text() and open() both accept a newline parameter. Setting newline='\n'
      tells Python to always use LF line endings regardless of platform. This is the correct approach
      for a cross-platform tool that must produce consistent output. On Windows, this prevents the
      automatic CRLF conversion that would normally occur. This directly satisfies NFR-2 and is the
      simplest, most direct approach. Python documentation recommends this pattern for text files
      that must use specific line endings.

  - title: "Git Operations Approach"
    chosen: "Use subprocess.run() to invoke git command-line tool"
    rejected:
      - "GitPython library — external package dependency, violates NFR-6 (Python standard library only), adds unnecessary complexity"
      - "pygit2 library — requires libgit2 system dependency, violates NFR-6, overkill for simple add/commit/push operations"
    rationale: >
      NFR-6 explicitly requires using only Python standard library with no external dependencies.
      subprocess.run() is part of the standard library and is the standard way to invoke external
      programs from Python. For simple git workflows (add, commit, push), subprocess.run() is
      straightforward and reliable. Features 153-155 use this same approach. Error handling is simple
      via check=True and catching CalledProcessError. This approach is lightweight and maintains
      the requirement of zero external dependencies.

  - title: "Error Handling and Idempotency"
    chosen: "Check if file exists; skip creation if present; explicitly handle git operation failures"
    rejected:
      - "Always fail if file exists — violates NFR-9 (idempotency requirement); would break if feature is run twice"
      - "Always overwrite without checking — potentially destructive, not truly idempotent, could corrupt data if file was modified"
    rationale: >
      NFR-9 requires idempotency: 'Implementation MUST be idempotent — creating the file multiple
      times should not cause errors'. The correct pattern is to check if the file exists using
      Path.exists(), and if it does, verify it matches expectations (or skip creation). This allows
      safe re-runs. For git operations, catch subprocess.CalledProcessError to detect failures and
      report them clearly. This approach is defensive and production-ready, matching patterns from
      features 153-155.

  - title: "Git Push Failure Handling"
    chosen: "Use git push with appropriate error handling; do not fail silently"
    rejected:
      - "Use git push -f (force push) — dangerous, can overwrite remote history, should never be default behavior"
      - "Skip push entirely — violates functional requirements (FR-7), would break the workflow"
    rationale: >
      NFR-8 states 'Git operations MUST not fail if branch is already synchronized with remote'.
      This is handled naturally by git push behavior: if the branch is up-to-date, push succeeds
      with no-op status. If there are changes to push, they are pushed. If there are conflicts
      (remote has commits not on local), push will fail — which is correct behavior and indicates
      a real problem requiring user intervention. Do not use force push or suppress errors; instead,
      report them clearly and let the user investigate.

