content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established and well-validated pattern. This feature creates a single test markdown file
  (`test-0ap4py.md`) at the repository root with a title and prose content, demonstrating automated file
  creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 001-259, with 259+
  similar test files already existing in the repository as proven, working precedents. The feature serves
  as a minimal, testable, and reproducible unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-0ap4py.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark (no BOM)
  - [ ] File uses LF (Unix-style) line endings (\n), not CRLF (\r\n)
  - [ ] File ends with a trailing newline
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-0ap4py.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(260): Create markdown file test-0ap4py.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/260-markdown-file-creation-47737c`
  - [ ] No modifications to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-0ap4py.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\n) line endings throughout
  - **FR-7**: The file SHALL end with a trailing newline (Unix convention)
  - **FR-8**: The file SHALL be added to git staging area using `git add test-0ap4py.md`
  - **FR-9**: The file SHALL be committed with a conventional commit message: `feat(260): Create markdown file test-0ap4py.md with prose content`
  - **FR-10**: The commit SHALL be pushed to the feature branch `feat/260-markdown-file-creation-47737c`
  - **FR-11**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 001-259 for consistency
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 259+ test markdown files following pattern `test-*.md`
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration: `pyproject.toml`, `docker-compose.yml`, `.env.example`
  - Spec directories: `specs/NNN-feature-name-hash/` (e.g., `specs/260-markdown-file-creation-47737c/`)

  **Source Code Structure:**
  - `src/sheep/agents/` — Agent definitions (code_agents.py, general_agents.py)
  - `src/sheep/config/` — Configuration management (settings.py, llm.py)
  - `src/sheep/features/` — Feature implementations (260+ feature modules)
  - `src/sheep/tools/` — Git, file, and web tools (git_tools.py, file_tools.py)
  - `src/sheep/content_generators.py` — Reusable content generation and validation utilities
  - `src/sheep/observability/` — Logging and tracing

  **Helper Functions Available:**
  - `generate_markdown_content()` — Generates H1 heading + 2-3 sentences via Claude LLM
  - `write_markdown_file(content, filename)` — Writes file with UTF-8 encoding and LF line endings
  - `validate_markdown_file(filepath)` — Validates markdown structure, encoding, and line endings
  - `commit_markdown_file(filepath, content, repo_path, custom_message)` — Stages and commits file
  - `push_markdown_file(repo_path, remote)` — Pushes to remote repository
  - `create_markdown_file(filename, repo_path)` — End-to-end orchestration (optional shortcut)

  ### Architecture Patterns

  **Test File Format (259+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3+: Exactly 2-3 sentences of prose content
    - File size: 300-600 bytes (typical)

  **Implementation Pattern (from feature_166 and predecessors):**
  - Define feature constants: `FEATURE_NUMBER`, `MARKDOWN_FILENAME`, `COMMIT_MESSAGE`
  - Create main orchestration function: `create_feature_260_markdown_file(repo_path=None)`
  - Call helper functions in sequence:
    1. `generate_markdown_content()` — LLM-generated content
    2. `write_markdown_file(content, MARKDOWN_FILENAME)` — Write to disk
    3. `validate_markdown_file(filepath)` — Verify file properties
    4. `commit_markdown_file(filepath, content, repo_path, custom_message)` — Git staging and commit
    5. `push_markdown_file(repo_path)` — Push to remote
  - Return dictionary with keys: `filepath`, `content`, `commit_message`, `push_result`

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-0ap4py.md`

  **Git Workflow Pattern:**
  - Feature branch pre-created: `feat/260-markdown-file-creation-47737c`
  - File created in repository root
  - Staged with `git add <filename>`
  - Commit format: `feat(###): Create markdown file <filename> with prose content`
  - Pushed to feature branch with upstream tracking

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Python 3.11+ standard library (no external dependencies for file operations)
  - UTF-8 encoding with explicit `newline="\n"` to enforce Unix LF line endings
  - File validation: checks for UTF-8 BOM, CRLF, trailing newline

  **Markdown Format:**
  - CommonMark-compatible format
  - Simple structure: H1 heading + blank line + prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **LLM Content Generation:**
  - Claude LLM via CrewAI framework (specified in `src/sheep/config/llm.py`)
  - Prompt-based generation with structured format requirements
  - Validation checks ensure 2-3 sentences, non-empty content, coherent prose

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - CrewAI/GitPython tools for command execution (no direct subprocess calls required)
  - Feature branch already created by system

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 259+ test files; no modifications to existing files |
  | File System | Low | Single file creation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-259; no branch/merge complexity |
  | Source Code (src/sheep/) | None | Feature is purely file creation; reuses existing content_generators.py utilities; no code modifications needed |
  | Specs Directory | None | Only this spec.yaml updated during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library and existing project dependencies; no new packages required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/260-markdown-file-creation-47737c` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, included)
  - Git configuration with user.name and user.email set for commits
  - CrewAI framework with Claude LLM configured (via .env or system configuration)

  **Reference/Precedent:**
  - 259+ existing test markdown files (test-*.md) provide clear, working pattern
  - Feature implementations 001-259 demonstrate identical approach and successful execution
  - Feature 166 (`src/sheep/features/feature_166_markdown_file_creation.py`) provides exact template
  - Feature 259 spec provides most recent, detailed specification

  **Helper Functions Available:**
  - `content_generators.generate_markdown_content()` — LLM-based content generation
  - `content_generators.write_markdown_file()` — File I/O with encoding/line ending guarantees
  - `content_generators.validate_markdown_file()` — Comprehensive validation
  - `content_generators.commit_markdown_file()` — Git staging and commit
  - `content_generators.push_markdown_file()` — Git push with upstream tracking

  **Not Required:**
  - No source code modifications or new code beyond module creation
  - No new external package dependencies
  - No configuration file changes
  - No changes to existing modules in src/sheep/

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established, proven precedent:

  - **Create feature module** (5 min): Define constants and orchestration function using pattern from feature 166
  - **Verify pattern adherence** (2 min): Ensure constants and function signature match precedent
  - **Test coverage** (3 min): Create simple unit test following test_feature_166_markdown_file_creation.py pattern
  - **Commit and verification** (2 min): Verify feature structure and readiness for implementation

  **Justification:**
  - 259 identical features completed successfully with identical implementation pattern
  - All helper functions already exist and are proven to work
  - No architectural decisions required; pattern is predetermined by precedent
  - Flexible topic selection with no research, planning, or complex logic needed
  - Recent feature implementations (166-259) demonstrate execution in 10-15 minutes
  - Simple Python module creation (under 150 lines of code following established template)
  - No git merge conflicts, branch management, or testing complexity

  ---

  _Analysis phase complete — ready for implementation_
