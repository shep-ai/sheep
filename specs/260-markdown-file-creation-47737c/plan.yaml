content: |
  ## Architecture Overview

  Feature 260 is a straightforward extension of the 259-feature markdown file creation pattern. The
  implementation fits into the existing codebase as follows:

  **Module Organization:**
  - **Feature Module:** `src/sheep/features/feature_260_markdown_file_creation.py` (new)
    - Defines feature constants: FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE
    - Implements orchestration function: create_feature_260_markdown_file(repo_path=None)
    - Returns dict with filepath, content, commit_message, push_result

  - **Helper Functions:** `src/sheep/content_generators.py` (existing, reused)
    - generate_markdown_content() — Claude API call with structured prompt
    - write_markdown_file(content, filename) — UTF-8 file I/O with LF enforcement
    - validate_markdown_file(filepath) — Binary-level validation (BOM, CRLF, structure)
    - commit_markdown_file(filepath, content, repo_path, custom_message) — Git staging/commit
    - push_markdown_file(repo_path) — Git push with upstream tracking

  - **Git Tools:** `src/sheep/tools/` (existing, reused)
    - GitCommitTool — Executes git commit commands safely
    - GitPushTool — Executes git push with upstream tracking

  - **LLM Configuration:** `src/sheep/config/llm.py` (existing, reused)
    - get_reasoning_llm() — Returns configured Claude model instance

  **Execution Flow:**
  ```
  create_feature_260_markdown_file(repo_path=None)
    ├─ generate_markdown_content()     → Prompt Claude for H1 + 2-3 sentences
    ├─ write_markdown_file(content)    → UTF-8 file to test-0ap4py.md
    ├─ validate_markdown_file(path)    → Check encoding, structure, line endings
    ├─ commit_markdown_file(...)       → Git add + git commit (conventional message)
    └─ push_markdown_file(repo)        → Git push to feat/260-markdown-file-creation-47737c
  ```

  The feature is entirely orchestration; no new business logic is introduced. All heavy lifting
  (content generation, file validation, git operations) is delegated to proven helpers.

  ## Key Design Decisions

  **1. LLM-Based Content Generation (from research)**
  - **Chosen:** Claude API via CrewAI framework with structured prompts
  - **Rationale:** Proven across all 259 predecessors. Generates dynamic, coherent content that
    exercises the entire stack. Prompt ensures H1 + blank line + 2-3 sentences format.
  - **Impact:** Each file has unique content, improving test coverage value over hardcoded templates.

  **2. UTF-8 Encoding with Binary-Level Validation**
  - **Chosen:** Explicit UTF-8 with post-write validation for BOM and CRLF
  - **Rationale:** Windows Python defaults can inject CRLF; some editors add BOM. Binary-level
    validation catches platform-specific issues that text-mode operations miss. Ensures FR-6, FR-7, FR-8 compliance.
  - **Impact:** Consistent file format across all platforms and tools.

  **3. Repository Root File Location**
  - **Chosen:** Repository root (Path.cwd() / filename) — established pattern across 259 features
  - **Rationale:** All 259 preceding test files (test-*.md) are at root. Consistency with precedent
    is paramount. The write_markdown_file() helper enforces this via path traversal prevention.
  - **Impact:** Predictable file location, no config changes needed.

  **4. Comprehensive Multi-Layer Validation**
  - **Chosen:** Structure + encoding + line endings + sentence count + trailing newline
  - **Rationale:** Catches encoding mismatches, malformed markdown, and platform-specific issues.
    Validation is performed post-write, forming a critical checkpoint before git operations.
  - **Impact:** High confidence in file correctness; failures are clear and actionable.

  **5. Conventional Commits with Feature Context**
  - **Chosen:** Custom message: "feat(260): Create markdown file test-0ap4py.md with prose content"
  - **Rationale:** Includes feature number (260) and filename (test-0ap4py.md) for easy correlation
    between git history, feature spec, and test file. Follows Conventional Commits spec.
  - **Impact:** Clear git history; easier to track which feature created which file.

  **6. Fail-Fast Error Handling**
  - **Chosen:** Raise specific exceptions (ValueError, OSError) with descriptive messages
  - **Rationale:** Prevents partial state (file created but not committed). Exceptions force attention
    to failures. Proven approach across all 259 predecessors.
  - **Impact:** Reproducible, debuggable failure modes; no silent failures.

  ## Implementation Strategy

  **Phase Ordering Rationale:**
  1. **Phase 1 (Implementation)** comes first because tests depend on the module existing and the
     function being callable. We follow TDD: write minimal implementation first, then add tests.
  2. **Phase 2 (Testing)** adds comprehensive test coverage, ensuring each component works in
     isolation (unit tests) and as an integrated whole (integration tests).
  3. **Phase 3 (Verification)** runs the feature end-to-end with real git operations and file I/O,
     confirming all success criteria are met.

  **Why This Approach:**
  - **Minimal Implementation:** Feature module is ~100 lines: constants + orchestration function.
    No business logic; just glue code orchestrating existing helpers.
  - **Reuse Over Reinvention:** All heavy lifting (content generation, validation, git ops) uses
    proven helpers from content_generators.py and tools/.
  - **Proven Pattern:** Feature 166 provides exact template; 259 predecessors have validated
    this approach. Risk of implementation issues is minimal.
  - **Quick Turnaround:** S-sized estimate (10-15 minutes) is achievable by following the template
    and relying on existing helpers. No research, complex logic, or architectural decisions needed.

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | **LLM Call Fails** | Medium | Task blocks until LLM responds | Fail-fast with clear error message. LLM timeout configured in CrewAI config. Retry logic exists in content_generators.py. |
  | **File Already Exists** | Low | File overwrite (lose data) | Python's open(path, "w") will overwrite; mitigated by test environment. Feature always creates new file for each run. |
  | **Git Config Missing** | Low | Commit/push fails | Fail-fast with clear error. Pre-requisite: git user.name and user.email must be configured. Caught by commit_markdown_file(). |
  | **Platform Line Endings** | Low | CRLF instead of LF on Windows | Binary validation in validate_markdown_file() catches and rejects CRLF. Write uses encoding=\"utf-8\" without platform defaults. |
  | **UTF-8 BOM Injection** | Low | File has BOM when it shouldn\'t | Binary validation checks for BOM prefix (EF BB BF) and rejects. Some editors add BOM by default; validation prevents this. |
  | **Test Isolation Issues** | Low | Tests interfere with each other | Each test creates unique filename (feature number changes per test). Use pytest fixtures for setup/teardown. Mock git operations in unit tests. |
  | **Feature Branch Missing** | Very Low | Push fails (branch doesn\'t exist) | Pre-requisite: feature branch feat/260-markdown-file-creation-47737c must exist. Caught during git push. |

  **Assumptions:**
  - Git is installed and configured with user.name and user.email
  - Feature branch feat/260-markdown-file-creation-47737c exists
  - CrewAI and Claude LLM are configured (ANTHROPIC_API_KEY environment variable set)
  - Write access to repository root
  - Python 3.11+ is available
