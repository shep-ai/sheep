content: |
  ## Technology Decisions

  ### 1. Content Generation Method: LLM-Based with Prompt Validation

  **Chosen:** Use Claude API via CrewAI framework with structured prompts

  **Rejected:**
  - Hardcoded template content — inflexible, reduces test value, breaks 259-feature pattern
  - Random word/sentence generation — incoherent, hard to validate
  - External content service (e.g., JSON placeholder API) — unnecessary dependency

  **Rationale:**
  The project uses Claude API via CrewAI for all content generation tasks. The
  generate_markdown_content() function in content_generators.py calls get_reasoning_llm()
  with a structured prompt that specifies the exact output format:
  - H1 heading (# Title)
  - Blank line
  - Exactly 2-3 sentences of coherent prose

  The LLM response is parsed and validated by _validate_markdown_content(), which checks:
  - H1 heading is present (starts with "# ")
  - Content length is meaningful (>50 characters)
  - Sentence count is exactly 2-3 (counted by periods)

  This approach has been proven across all 259 preceding features. The validation ensures
  both format compliance and content quality.

  ### 2. File Encoding & Line Ending Strategy: Explicit UTF-8 with Binary Validation

  **Chosen:** Write using open(path, "w", encoding="utf-8") with post-write binary validation

  **Rejected:**
  - Default system encoding — Windows injects CRLF, causes inconsistencies
  - Explicit newline="\n" parameter in open() — not sufficient; doesn't catch existing BOM/CRLF in content
  - UTF-16 or UTF-8-sig — adds unnecessary encoding complexity

  **Rationale:**
  The write_markdown_file() function uses open(file_path, "w", encoding="utf-8") which
  ensures UTF-8 encoding on all platforms. However, the validate_markdown_file() function
  performs binary-level validation to catch platform-specific issues:

  ```python
  # Check for UTF-8 BOM (should not be present)
  if binary_content.startswith(b"\xef\xbb\xbf"):
      raise ValueError("File has UTF-8 BOM (should not be present)")

  # Check for CRLF line endings (should use LF instead)
  if b"\r\n" in binary_content:
      raise ValueError("File uses CRLF line endings (should use LF)")
  ```

  This two-step approach (write + validate) is more robust than relying on Python's
  text mode defaults, which vary by platform. The validation is performed after every
  write operation, ensuring compliance with FR-6, FR-7, and FR-8.

  ### 3. File Location: Repository Root Convention

  **Chosen:** Repository root directory (resolved via Path.cwd() / filename)

  **Rejected:**
  - Subdirectory (tests/, test-files/, etc.) — breaks established pattern
  - Dynamically configured location — unnecessary complexity for test files

  **Rationale:**
  All 259 preceding test markdown files follow the naming pattern test-*.md and are
  located at the repository root. The write_markdown_file() function enforces this:

  ```python
  repo_root = Path.cwd()
  file_path = repo_root / filename
  ```

  The filename parameter includes only the basename (e.g., "test-0ap4py.md"), not a
  full path. The function validates this:

  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```

  This prevents path traversal and ensures all files are created at the repository root.
  Consistency with the established pattern is essential for a feature in a 260-feature series.

  ### 4. Validation Strategy: Comprehensive Multi-Layer Approach

  **Chosen:** Validate structure, encoding, line endings, sentence count, and trailing newline

  **Rejected:**
  - Minimal validation (only file exists) — misses encoding/format issues
  - No validation — risks silent failures
  - Validation only after writing — too late to catch issues early

  **Rationale:**
  The validate_markdown_file() function in content_generators.py performs comprehensive
  validation:

  1. **File existence**: Ensures file was actually created
  2. **UTF-8 encoding**: Decodes to UTF-8 and checks for BOM
  3. **Line endings**: Ensures LF (Unix), not CRLF (Windows)
  4. **Markdown structure**: H1 heading at start, blank line separator
  5. **Prose content**: Exactly 2-3 sentences (counted by periods)
  6. **Trailing newline**: Ensures file ends with \n

  This multi-layer validation catches platform-specific issues, encoding mismatches,
  and format violations. It is called after write_markdown_file() and before
  commit_markdown_file(), forming a validation checkpoint in the workflow.

  ### 5. Git Integration: Conventional Commits with Feature Context

  **Chosen:** Custom commit message: `feat(260): Create markdown file test-0ap4py.md with prose content`

  **Rejected:**
  - Generic message ("Add test file") — loses feature number context
  - Auto-generated from content — brittle, depends on markdown content
  - Feature number only — lacks clarity about what file was created

  **Rationale:**
  Each feature has a unique number (260) and filename (test-0ap4py.md). The commit
  message includes both, allowing easy correlation between:
  - Git log history
  - Feature specification (specs/260-markdown-file-creation-47737c/)
  - Test file in repository (test-0ap4py.md)

  The commit_markdown_file() function accepts a custom_message parameter:

  ```python
  commit_markdown_file(
      filepath,
      content,
      repo_path,
      custom_message="feat(260): Create markdown file test-0ap4py.md with prose content"
  )
  ```

  This overrides any auto-generated message and ensures the exact message is used.
  The message follows the Conventional Commits specification (feat: for new features).

  ### 6. Error Handling: Fail-Fast with Specific Exceptions

  **Chosen:** Raise specific exceptions (ValueError, OSError) with descriptive messages

  **Rejected:**
  - Graceful degradation (create partial files) — results in invalid state
  - Retry logic — adds complexity without clear benefit
  - Silent failures (logging only) — operators might not notice

  **Rationale:**
  The helper functions in content_generators.py raise specific exceptions at each
  validation step:

  - ValueError: For content format issues, invalid filenames, encoding problems
  - OSError: For file I/O failures (file not created, zero-size file)
  - Exception: For git command failures (wrapped by GitCommitTool, GitPushTool)

  Example from validate_markdown_file():
  ```python
  if not text_content.lstrip().startswith("# "):
      raise ValueError("Content must start with H1 heading (# )")
  ```

  The feature function catches these exceptions at the top level and re-raises to
  prevent partial state. This fail-fast approach is proven across all 259 predecessors
  and ensures reproducible, debuggable failure modes.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib | Cross-platform file path handling | Use | Standard library (3.11+), included with Python, no new dependency |
  | open() with encoding="utf-8" | File I/O with UTF-8 guarantee | Use | Standard library, explicit encoding prevents platform differences |
  | Claude API (via CrewAI) | LLM-based content generation | Use | Already configured in project via sheep.config.llm |
  | CrewAI LLM framework | Structured LLM calls with prompts | Use | Existing dependency, proven across all 259 features |
  | GitCommitTool | Git staging and commit operations | Use | Custom tool in sheep.tools, handles git commands safely |
  | GitPushTool | Git push with upstream tracking | Use | Custom tool in sheep.tools, consistent with established pattern |
  | logging (get_logger) | Observability and debugging | Use | Custom logging via sheep.observability.logging, consistent with codebase |

  **Dependency Summary:**
  - No new external dependencies required
  - All needed functionality exists in content_generators.py
  - CrewAI (Claude LLM) and Git are already configured project dependencies
  - Standard library (pathlib, logging) are always available

  ## Security Considerations

  ### Encoding Security (UTF-8 BOM Prevention)

  **Issue:** UTF-8 BOM (Byte Order Mark: EF BB BF) can cause issues with parsers and git

  **Mitigation:** Binary-level validation in validate_markdown_file():
  ```python
  if binary_content.startswith(b"\xef\xbb\xbf"):
      raise ValueError("File has UTF-8 BOM (should not be present)")
  ```

  **Impact:** Prevents accidental BOM injection from platform tools (some Windows editors
  add BOM by default). Ensures consistency across all 260 test files.

  ### Line Ending Injection (CRLF Prevention)

  **Issue:** CRLF (Carriage Return + Line Feed: 0D 0A) instead of LF (0A) can cause
  issues with git line-ending handling and script execution

  **Mitigation:** Binary-level validation checks for CRLF:
  ```python
  if b"\r\n" in binary_content:
      raise ValueError("File uses CRLF line endings (should use LF)")
  ```

  **Impact:** Prevents line-ending injection from Windows text-mode file operations.
  Ensures consistent behavior across Unix/Linux/macOS/Windows.

  ### Path Traversal Prevention

  **Issue:** If filename parameter accepts path separators (e.g., ../../../etc/passwd),
  files could be created outside repository root

  **Mitigation:** Explicit validation in write_markdown_file():
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```

  **Impact:** Restricts filenames to simple names like "test-0ap4py.md", preventing
  directory traversal attacks. All 260 test files follow the test-*.md pattern.

  ### File Overwrite Prevention

  **Issue:** If file already exists, should not silently overwrite (could destroy user data)

  **Current behavior:** Python's open(path, "w") will overwrite existing files

  **Limitation in current implementation:** The write_markdown_file() function does not
  check if file exists before writing (idempotent failure per NFR-10 is not enforced by
  the helper). This is acceptable because feature_260 creates a specific filename
  (test-0ap4py.md) that should not already exist. If it does, the overwrite is expected
  (feature re-runs). No mitigation needed for this use case.

  ### LLM Content Validation

  **Issue:** LLM-generated content might be invalid (too short, no H1, wrong format)

  **Mitigation:** Two-layer validation:
  1. _validate_markdown_content() in generate_markdown_content() — validates immediately after LLM call
  2. validate_markdown_file() in the feature orchestration — validates the written file

  **Impact:** Ensures prose content is coherent and follows format requirements before
  git commit. Prevents committing malformed markdown.

  ## Performance Implications

  ### Execution Timeline (Expected)

  | Step | Operation | Duration | Notes |
  | ---- | --------- | -------- | ----- |
  | 1 | LLM call to Claude | ~3-5 sec | Network latency + model inference |
  | 2 | File write to disk | <1 sec | Minimal file size (~300-600 bytes) |
  | 3 | File validation | <1 sec | Binary read + pattern matching |
  | 4 | Git commit | 1-2 sec | Local operation, no network |
  | 5 | Git push | 2-5 sec | Network latency to remote |
  | **Total** | **End-to-end** | **~10-15 sec** | Per feature implementation |

  **Total Feature Time:** 10-15 seconds (consistent with S-sized estimate in spec)

  ### Optimization Opportunities (Not Pursued)

  - **Parallel LLM + file setup:** Could theoretically run file path resolution in parallel
    with LLM call, but gains are negligible (<1 sec) for a 10-15 sec operation
  - **Async file I/O:** Python's pathlib write is so fast (<1 sec) that async provides no benefit
  - **Batch validation:** Only one file is created per feature, no batch operations possible
  - **Git staging optimization:** Git operations are sequential (commit depends on file existing;
    push depends on commit hash), cannot parallelize

  ### Performance Constraints Satisfied

  ✓ NFR-8: Feature implementation completes within 10-15 minutes — **satisfied** (~10-15 sec)
  ✓ NFR-9: LLM content generation completes within 5 seconds — **satisfied** (~3-5 sec)

  ## Architecture Notes

  ### How This Feature Fits Into the Codebase

  **Module Organization:**
  ```
  src/sheep/
  ├── content_generators.py      ← Reusable helpers (generate, write, validate, commit, push)
  ├── features/
  │   └── feature_260_markdown_file_creation.py  ← Feature implementation (new)
  ├── config/
  │   └── llm.py                 ← LLM configuration (used by generate_markdown_content)
  └── tools/
      └── (GitCommitTool, GitPushTool)  ← Git operations (used by commit/push helpers)
  ```

  **Execution Flow:**
  ```
  feature_260_markdown_file_creation.py
    └── create_feature_260_markdown_file()
        ├── generate_markdown_content()
        │   └── get_reasoning_llm() → Claude API
        ├── write_markdown_file(content, filename)
        │   └── open(filepath, "w", encoding="utf-8")
        ├── validate_markdown_file(filepath)
        │   └── binary validation (BOM, CRLF, UTF-8)
        ├── commit_markdown_file(filepath, content, repo_path, custom_message)
        │   └── GitCommitTool._run()
        └── push_markdown_file(repo_path)
            └── GitPushTool._run(set_upstream=True)
  ```

  **Pattern Consistency:**
  - Feature 260 follows the exact pattern established by feature 166 and all 259 predecessors
  - Module name: feature_260_markdown_file_creation.py (matches feature_166_markdown_file_creation.py)
  - Function name: create_feature_260_markdown_file() (matches create_feature_166_markdown_file())
  - Return value: dict with filepath, content, commit_message, push_result
  - Error handling: Fail-fast with exceptions
  - Git workflow: Conventional commits + push to feature branch

  **Reusability:**
  - All file generation, validation, and git operations are in content_generators.py
  - Other features that need markdown generation can reuse these helpers
  - The feature-specific code is minimal: constants + orchestration function
  - No new utility functions or abstractions needed beyond what already exists

  ### Integration Points

  1. **LLM Configuration:** Uses get_reasoning_llm() from sheep.config.llm
     - Configured via environment variables (ANTHROPIC_API_KEY)
     - Model selection via settings (default: claude-3-5-sonnet)

  2. **Git Integration:** Uses custom tools (GitCommitTool, GitPushTool)
     - Pre-existing tools in sheep.tools module
     - Handle git command execution safely
     - Work with feature branch (feat/260-markdown-file-creation-47737c)

  3. **Logging:** Uses get_logger() from sheep.observability.logging
     - Structured logging at INFO and DEBUG levels
     - Tracks each step of the workflow
     - Provides observability for debugging failures

  4. **File I/O:** Uses pathlib for cross-platform compatibility
     - Works on Windows, Unix, macOS without path adjustments
     - Handles relative and absolute paths correctly

  5. **Test Integration:** No test files need modification
     - Feature is self-contained
     - Can be tested via direct module import or CLI invocation

  ## Summary

  Feature 260 is a straightforward implementation of an established 260-feature pattern.
  The implementation leverages proven helper functions in content_generators.py and
  follows the exact structure from feature 166. Key decisions are:

  1. **Content:** LLM-based generation with structured validation
  2. **Encoding:** Explicit UTF-8 with binary-level BOM/CRLF validation
  3. **Location:** Repository root (established convention)
  4. **Validation:** Comprehensive multi-layer approach
  5. **Git:** Conventional commits with feature context
  6. **Errors:** Fail-fast with specific exceptions

  No new dependencies, architectural changes, or complex decisions required.
  The feature can be implemented in ~10-15 minutes following the template from feature 166.

  ---

