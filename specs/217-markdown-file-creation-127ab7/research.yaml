decisions:
  - title: "File I/O Library Choice"
    chosen: "Python pathlib.Path (standard library)"
    rejected:
      - "open() builtin function — lower-level, more verbose, less Pythonic for modern Python 3.11+"
      - "os module functions — system-level calls, less readable, less suitable for cross-platform file operations"
    rationale: >
      pathlib.Path is the modern, idiomatic Python approach for file I/O in Python 3.11+ and is
      explicitly specified in the technology stack. Provides clean object-oriented API with
      Path.write_text() method that handles both encoding (UTF-8) and line endings (LF) in a
      single call, essential for meeting FR-4 (UTF-8) and FR-5 (LF line endings) requirements.
      Cross-platform path handling and no external dependencies align with the stdlib-only
      requirement (matching feature 216 specification). Matches implementation pattern from
      features 214-216.

  - title: "Git Operations Method"
    chosen: "subprocess.run() with git CLI commands (standard library)"
    rejected:
      - "GitPython library — violates stdlib-only requirement; used in feature 215 but not applicable to feature 217"
      - "Manual git command construction — more error-prone than subprocess wrapper"
    rationale: >
      Technology stack specifies \"Python 3.11+ (standard library)\" with no external dependencies.
      subprocess.run() is the standard library approach for invoking git commands. Provides
      safe subprocess execution with check=True for error handling, clear error messages on
      failure. Three git operations needed: add, commit, push. Simple, direct invocation of
      git CLI is the appropriate choice when external libraries are prohibited. Matches
      feature 216 which faced identical stdlib constraint and successfully used subprocess.

  - title: "Markdown Validation Approach"
    chosen: "Basic period-counting + line structure validation (standard library re module)"
    rejected:
      - "markdown library with CommonMark parser — external dependency, violates stdlib-only requirement; used in feature 215"
      - "No validation — violates FR-5 requirement for basic format validation before git operations"
      - "Strict NLP/grammar checking — excessive complexity beyond \"basic format validation\" requirement"
    rationale: >
      Spec explicitly calls for \"basic format validation only\" (requirements phase), not strict
      CommonMark parsing. Basic validation means: H1 heading detected, sentence count 2-3, valid
      UTF-8 encoding, LF line endings. Simple period-counting approach works for requirement:
      split prose by periods and filter empties. This simple approach avoids external dependencies.
      Validation checks: (1) first line matches pattern \"^# .+$\" for H1 heading, (2) count periods
      in prose section (sentence approximation), (3) verify file size in range 300-600 bytes,
      (4) read as UTF-8 to verify encoding, (5) check for CRLF. Pre-commit validation (before git
      add) follows defensive programming pattern. Matches feature 216 validation approach.

  - title: "File Existence Error Handling"
    chosen: "Defensive check with FileExistsError before creation"
    rejected:
      - "Overwrite silently — violates FR-9 requirement, risks accidental data loss"
      - "Append with suffix — creates wrong filename (test-9lbh6c_1.md), violates spec"
    rationale: >
      FR-9 explicitly requires failing with clear error message if test-9lbh6c.md already
      exists. Defensive approach: use pathlib.Path.exists() before write_text(), raise
      FileExistsError with descriptive message like \"File 'test-9lbh6c.md' already exists.
      Remove it to proceed.\" Prevents accidental overwrites and follows defensive programming
      best practices. NFR-6 requirement (fail-safe behavior) means second execution must fail
      with clear message, not overwrite. Matches pattern from features 214-216.

  - title: "Line Ending Strategy"
    chosen: "Use newline='\\n' parameter in pathlib.write_text() to enforce LF"
    rejected:
      - "Allow OS default line endings — violates FR-5 (explicit LF requirement), creates inconsistency across platforms"
      - "Post-write conversion — unnecessary complexity, defeats pathlib benefits"
    rationale: >
      FR-5 explicitly requires Unix line endings (LF, \\n). pathlib.write_text() with
      newline='\\n' parameter forces Unix-style line endings regardless of platform
      (Windows/Linux/Mac), ensuring deterministic behavior. This is the standard Python approach
      for platform-independent text files. Pre-commit hooks won't convert already-LF endings.
      Simple, reliable, requires single parameter to Path.write_text(). Matches feature 216
      and earlier features approach.

  - title: "UTF-8 Encoding Strategy"
    chosen: "Use encoding='utf-8' in pathlib.write_text(), validate no BOM at file start"
    rejected:
      - "Use encoding='utf-8-sig' — adds UTF-8 BOM marker (EF BB BF bytes), violates FR-4 (no BOM)"
      - "Binary mode with manual encoding — verbose, error-prone, defeats pathlib cleanliness"
    rationale: >
      FR-4 explicitly requires UTF-8 encoding without BOM (Byte Order Mark). pathlib.write_text()
      with encoding='utf-8' creates clean UTF-8 file without BOM prefix. Python 3.11+ defaults
      to UTF-8 text encoding, so explicit parameter is both clear and safe. Validation: read
      file as bytes and verify first bytes are NOT UTF-8 BOM marker (hexadecimal EF BB BF).
      Simple validation check ensures encoding correctness. Matches feature 216 pattern.

  - title: "Prose Content Strategy"
    chosen: "Hardcoded coherent prose (implementer-chosen topic at implementation time)"
    rejected:
      - "Template-based content generation — unnecessary complexity, template management overhead"
      - "AI generation or random content — overkill for test file, introduces non-determinism"
    rationale: >
      Spec requirements phase explicitly allows implementer free choice of prose topic. No topic
      specification needed. Hardcoding prose at implementation time is simplest approach: choose
      any coherent, grammatically correct topic, write 2-3 sentences, store as constant. Pattern
      from 216+ existing test files shows diverse, implementer-chosen topics work well. File must
      contain genuine prose (not Lorem Ipsum, placeholders, or templates per requirements). Example
      from feature 216: \"Python Simplicity\" topic with 3 clear sentences. Generic prose (~350
      bytes) naturally fits file size target (200-800 bytes per FR-8).

  - title: "Sentence Validation Logic"
    chosen: "Count periods in prose content as simple sentence approximation"
    rejected:
      - "NLP-based sentence boundary detection — external library needed, violates stdlib-only requirement"
      - "Regex-based sentence parsing — complex to handle abbreviations, decimals, and edge cases correctly"
    rationale: >
      Basic validation requirement allows simple approximation. Sentence count validation:
      split prose by periods, filter empty strings, count result. This simple approach works for
      the 2-3 sentence requirement without external dependencies. False positives (abbreviations
      like \"U.S.\" count as multiple sentences) are acceptable for basic validation. Matches
      feature 216 approach which counted periods in prose. Proper sentence boundary detection is
      overkill for basic validation on short prose (2-3 sentences is unmistakable).

