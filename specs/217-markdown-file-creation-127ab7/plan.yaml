# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 217 is a minimal, straightforward file creation task following the
  established pattern from 216+ preceding test files (features 100-216). The
  implementation follows the stdlib-only constraint established in feature 216,
  using only Python standard library (pathlib, subprocess, re) with no external
  dependencies. This direct pattern continuation ensures consistency and risk reduction.

  **Core Implementation Approach:**
  1. **File Creation**: pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings
  2. **Validation**: Basic format checks using regex (H1 heading) and period counting (sentence count)
  3. **Error Handling**: Defensive file existence check prevents accidental overwrites
  4. **Git Workflow**: subprocess.run() for git add/commit/push operations with error checking

  **Pattern Consistency with 216+ Precedents:**
  - File location: repository root (no subdirectories)
  - File naming: test-<6-char-id>.md (test-9lbh6c.md is target filename)
  - Content structure: H1 heading + blank line + 2-3 sentence prose
  - Git workflow: add → commit with conventional message → push to feature branch
  - Validation: basic format checks (not strict CommonMark parsing)
  - Technology: stdlib-only, no external dependencies (matching feature 216 exactly)

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path (Standard Library)

  **Chosen**: pathlib.Path.write_text() with encoding='utf-8' and newline='\n'

  **Alternatives Rejected**:
  - open() builtin function (lower-level API, more verbose, less Pythonic)
  - os module functions (system-level calls, less readable, not idiomatic Python 3.11+)

  **Rationale**: pathlib is the modern, idiomatic approach for file I/O in Python 3.11+
  and is explicitly specified in technology stack. The write_text() method elegantly
  handles both encoding (UTF-8) and line endings (LF) in a single call, cleanly satisfying
  FR-4 and FR-5 requirements. Cross-platform path handling with zero external dependencies
  aligns with stdlib-only constraint. Direct precedent: features 214-216 all use pathlib.

  ### 2. Git Integration: subprocess.run() (Standard Library)

  **Chosen**: subprocess.run() with git CLI commands for add/commit/push

  **Alternatives Rejected**:
  - GitPython library (violates stdlib-only constraint, used in feature 215 but not applicable)
  - Manual shell invocation (less safe, subject to injection vulnerabilities)
  - Direct file manipulation (doesn't achieve git requirements FR-6, FR-7, FR-8)

  **Rationale**: Technology specification explicitly requires "Python 3.11+ (standard library)"
  with no external dependencies. subprocess.run() is the standard library approach for system
  commands. Three git operations required: add (FR-6), commit (FR-7), push (FR-8). Using
  check=True provides error handling via CalledProcessError on failure. Clean error messages
  on git command failures. Matches feature 216 which faced identical stdlib constraint and
  successfully used subprocess.

  ### 3. Markdown Validation: Basic Regex + Period Counting (Standard Library)

  **Chosen**: re module with simple regex patterns and period counting for sentence detection

  **Alternatives Rejected**:
  - markdown library (external dependency, violates stdlib-only constraint, used in feature 215)
  - No validation (violates FR-5 requirement for basic format validation)
  - Strict CommonMark parser (over-engineering for "basic validation" requirement, would need external library)

  **Rationale**: Requirements explicitly specify "basic format validation only" per product
  decision. Simple period-counting approach using re module (stdlib) avoids external dependencies
  and is appropriate for validating 2-3 sentence prose on short files. Validation checks:
  (1) H1 heading pattern via regex (^# .+$), (2) blank line separator (3) sentence count
  by counting periods (4) file size 300-600 bytes typical range, (5) UTF-8 encoding correctness,
  (6) LF line endings (no CRLF), (7) no UTF-8 BOM marker. Pre-commit validation follows
  defensive programming pattern to catch errors before git staging.

  ### 4. File Existence Error Handling: Defensive Check

  **Chosen**: Check Path.exists() before creation, raise FileExistsError if file exists

  **Alternatives Rejected**:
  - Overwrite silently (violates FR-9, risks accidental data loss)
  - Append with suffix (creates wrong filename like test-9lbh6c_1.md, violates spec)
  - Skip silently (non-obvious behavior, hides problems)

  **Rationale**: FR-9 explicitly requires failing with clear error if test-9lbh6c.md
  already exists. Defensive check prevents accidental overwrites. NFR-6 requirement
  (fail-safe behavior) means second execution must fail with clear message, not overwrite.
  Follows defensive programming best practices. Pattern from features 214-216.

  ### 5. Prose Content: Hardcoded with Implementer-Chosen Topic

  **Chosen**: Hardcode prose content at implementation time with topic of implementer's choice

  **Alternatives Rejected**:
  - Template-based generation (unnecessary complexity, template management overhead)
  - AI generation or random content (overkill for test file, introduces non-determinism)
  - Lorem Ipsum or placeholder text (violates requirements for "genuine prose content")

  **Rationale**: Specification explicitly allows implementer free choice of prose topic
  with no constraints. Hardcoding at implementation time is simplest approach: select any
  coherent, grammatically correct topic (tech, nature, philosophy, etc.) and write 2-3
  sentences. Pattern from 216+ existing test files shows diverse, implementer-chosen topics
  work well. Prose naturally fits file size target (200-800 bytes per FR-8).

  ## Implementation Strategy

  **Ordered Phases (Sequential)**

  **Phase 1: File Creation & Validation**

  Create the markdown file with proper encoding and line endings, implement validation
  logic with defensive checks, then verify format before proceeding to git operations.
  This early validation catches obvious formatting mistakes and prevents staging invalid files.

  Task sequence:
  1. Create file with pathlib.Path.write_text() and hardcoded prose (20 minutes)
  2. Implement validation function checking H1 heading, sentences, encoding, line endings (25 minutes)
  3. Add defensive file existence check before creation (10 minutes)

  **Phase 2: Git Integration & Workflow**

  Stage, commit, and push validated file using subprocess.run() with error handling.
  All three git operations use check=True to raise errors on failure.

  Task sequence:
  1. Implement git operations function for add/commit/push (20 minutes)
  2. Integration test verifying complete workflow end-to-end (15 minutes)

  **Why This Order:**
  - File creation must precede validation (nothing to validate without file)
  - Validation must precede git operations (should not stage invalid files)
  - Defensive check can happen early to prevent any wasted work
  - Git operations depend on validated file, must come after Phase 1
  - Integration test comes last to verify complete workflow

  ## Risk Mitigation

  | Risk | Mitigation | Priority |
  | ---- | ---------- | -------- |
  | File already exists (accidental overwrite) | Defensive Path.exists() check before creation; raise FileExistsError with clear message | High |
  | UTF-8 BOM present (wrong encoding) | Explicit encoding='utf-8' parameter (not utf-8-sig); validate no BOM bytes (EF BB BF) at file start | High |
  | CRLF line endings (platform inconsistency) | Force LF via newline='\n' parameter in write_text(); validate no CRLF in file | High |
  | Git command fails (network/permission) | subprocess.run() with check=True raises CalledProcessError; clear error messages per git operation | Medium |
  | Validation too strict/loose (false pass/fail) | Basic validation matches requirement and 216+ precedent pattern; simple, non-strict approach | Low |
  | Platform-specific behavior (Windows vs Linux) | pathlib handles cross-platform paths; explicit newline='\n' ensures deterministic behavior on all platforms | Medium |
  | Sentence count detection edge cases (U.S., decimals) | Simple period-counting acceptable for basic validation; false positives tolerable for short 2-3 sentence text | Low |
  | File size outside range (too small/large) | Check 300-600 byte typical range; catches obvious format violations | Low |

  **Overall Risk Assessment**: Very Low

  - 216+ identical features completed successfully establish high confidence
  - Well-established, non-complex implementation pattern
  - All success criteria directly testable
  - No architectural decisions or complex logic required
  - Defensive error handling prevents major failure scenarios
  - stdlib-only approach eliminates dependency management risk
