  ## Summary

  Implementation proceeds in two phases. Phase 1 creates the markdown file with proper
  UTF-8 encoding and LF line endings, then validates the format before any git operations.
  Phase 2 implements the git workflow (add, commit, push) using subprocess.run() for
  safety and error handling.

  **Task Flow:**
  1. Create file with pathlib.Path.write_text() and hardcoded prose content
  2. Implement validation function checking H1 heading, sentence count, encoding, line endings
  3. Add defensive file existence check to prevent accidental overwrites
  4. Implement git operations (add → commit → push) using subprocess.run()
  5. Integration test verifying complete workflow end-to-end

  **Key Implementation Decisions:**
  - Use only Python standard library (pathlib, subprocess, re) per feature 216 pattern
  - pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\n'
  - subprocess.run() for git operations with check=True error handling
  - Basic validation using regex (H1 heading) and period counting (sentences)
  - Defensive file existence check before creation
  - Hardcoded prose content with implementer-chosen topic

  **Estimated Duration:** 1.5 hours total (20-25 min per task, with dependencies)

  All tasks follow TDD approach: write failing test (RED), implement minimal code to pass
  (GREEN), then clean up and refactor (REFACTOR). Task dependencies ensure logical ordering
  and prevent wasted work on invalid files or missing prerequisites.
