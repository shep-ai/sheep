# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature integrates seamlessly into Sheep's modular architecture by reusing the
  proven `content_generators.py` utility module. The module implements a clean separation
  of concerns with single-responsibility functions:

  - **generate_markdown_content()** — LLM integration via CrewAI's get_reasoning_llm()
  - **write_markdown_file()** — File I/O with pathlib, UTF-8 encoding, LF normalization
  - **validate_markdown_file()** — Two-layer validation (content structure + file properties)
  - **commit_markdown_file()** — Git staging/commit via GitCommitTool with conventional message
  - **push_markdown_file()** — Remote push via GitPushTool with upstream tracking
  - **create_markdown_file()** — Orchestration function coordinating the entire workflow

  The feature creates no new source code in src/sheep/; it leverages existing utilities
  that have been validated across 273+ prior identical implementations. The orchestration
  function returns a dict with visibility into each step (filepath, content, commit_message,
  push_result), enabling verification without additional logging.

  ## Key Design Decisions

  ### 1. Reuse Existing content_generators.py Module

  **Decision:** Call create_markdown_file() orchestration function instead of implementing
  custom orchestration logic.

  **Rationale:** The content_generators module is battle-tested across 273+ features with
  100% success rate. It encapsulates all complexity (error handling, validation, observability).
  Reusing it follows DRY principle, maintains consistency, and minimizes implementation risk.
  The orchestration function handles coordination internally; implementation requires a single
  function call: `create_markdown_file("test-ihdf8h.md", feature_number=274)`.

  **Alternatives Rejected:**
  - Custom orchestration script — Would duplicate proven logic, break consistency, introduce maintenance burden
  - Direct subprocess git calls — Bypasses Sheep's tool abstraction, loses observability, introduces error handling duplication

  ### 2. Claude API via CrewAI's get_reasoning_llm() Factory

  **Decision:** Use CrewAI's get_reasoning_llm() to obtain Claude API integration for content generation.

  **Rationale:** get_reasoning_llm() (from sheep.config.llm) is the standard integration point
  used by all 273+ prior features. It provides pluggable LLM support (Claude, OpenAI, Gemini)
  through configuration, handles API key management via Pydantic SecretStr, and encapsulates
  provider selection. Default model is Claude 3.5 Sonnet. This requires zero configuration
  changes and reuses proven patterns. The LLM call interface (llm.call([{"role": "user", "content": prompt}]))
  matches content_generators.py expectations.

  **Alternatives Rejected:**
  - Direct Anthropic SDK — Would duplicate CrewAI's configuration logic and provider abstraction
  - OpenAI GPT-4o — Feature 273+ established Claude as canonical provider; switching would break 273+ implementations
  - Local LLM (Ollama) — Incompatible with cloud-based Sheep platform architecture

  ### 3. Structured Prompt-Based Content Generation

  **Decision:** Use MARKDOWN_GENERATION_PROMPT (defined in content_generators.py) to instruct Claude
  to generate markdown with specific structure: H1 heading, blank line, 2-3 sentences of prose.

  **Rationale:** The prompt is clear, unambiguous, and produces consistent output across 273+ features.
  Claude generates the exact structure required; the _validate_markdown_content() function checks
  format compliance before file write. Single-call generation (3-5 minutes) fits within 10-15 minute
  budget. Prompt-based approach leverages LLM intelligence while maintaining predictable output.

  **Alternatives Rejected:**
  - Template-based generation — Eliminates LLM intelligence, produces monotonous output
  - Multi-step agentic workflow (Research → Plan → Write) — Overkill for 2-3 sentences; exceeds time budget

  ### 4. Two-Layer Validation: Content Structure + File Properties

  **Decision:** Validate markdown structure during LLM response processing (Layer 1) and file
  properties after write (Layer 2).

  **Rationale:** Layer 1 (_validate_markdown_content) checks H1 heading, sentence count, minimum
  length. Fails fast (no file created if validation fails). Layer 2 (validate_markdown_file) verifies
  UTF-8 validity, no BOM, LF-only line endings, complete markdown structure. Catches encoding/line-ending
  anomalies introduced during file I/O on different platforms. This defensive dual-layer approach is
  proven across 273+ features and ensures compliance with all NFRs.

  **Alternatives Rejected:**
  - Single-layer validation (file only) — Delays invalid content detection until file exists; requires rollback logic
  - No validation — Violates NFR-3, NFR-4 requirements; allows invalid files into repository

  ### 5. Conventional Commits with GitCommitTool Abstraction

  **Decision:** Use content_generators.commit_markdown_file(), which delegates to GitCommitTool
  (sheep.tools.git_tools) with conventional message format.

  **Rationale:** Commit message template: `feat(274): create markdown file test-ihdf8h.md with prose content`.
  This format is clear, parseable, and enables automated changelog generation. GitCommitTool provides
  error handling and observability (Langfuse tracing). Delegation to tools follows Sheep's architecture
  (no subprocess calls). Message doesn't include LLM-generated prose, only filename (prevents git commit injection).

  **Alternatives Rejected:**
  - Direct git subprocess calls — Breaks abstraction, duplicates error handling, loses observability
  - Manual add/commit/push orchestration — Duplicates content_generators.py logic, inconsistent with 273+ features

  ### 6. File I/O with UTF-8 Encoding, No BOM, Unix LF Line Endings

  **Decision:** Use Python pathlib with explicit UTF-8 encoding; validate for no BOM and LF-only endings.

  **Rationale:** content_generators.write_markdown_file() uses `open(file_path, "w", encoding="utf-8")`,
  which on Unix systems produces LF line endings automatically. validate_markdown_file() explicitly checks
  for absence of UTF-8 BOM (bytes \xef\xbb\xbf) and rejects CRLF line endings. Pathlib prevents path
  traversal by rejecting filenames with "/" or "\\" characters. This strategy meets NFR-1, NFR-2, NFR-3
  and aligns with 273+ prior implementations on Unix-based infrastructure.

  **Alternatives Rejected:**
  - Default platform encoding — Causes cross-platform issues (UTF-16 on Windows, UTF-8 on Linux)
  - CRLF line endings — Violates Git conventions in this repository; requires normalization on push
  - os.path API — Legacy; less safe (path traversal vulnerabilities); more verbose

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1: Environment Verification** comes first because it validates prerequisites before
     orchestration. If ANTHROPIC_API_KEY is not set, LLM calls will fail. If git is misconfigured,
     commits will fail. If feature branch is not checked out, pushes will go to wrong branch.
     Early verification prevents wasted LLM API calls and failed git operations.

  2. **Phase 2: Content Generation & File Creation** is the core orchestration. It calls
     create_markdown_file(), which internally coordinates all steps (generate, write, validate,
     commit, push). The function is idempotent (if run twice, it overwrites; not a concern for
     this feature). Observability is integrated via Langfuse tracing.

  3. **Phase 3: Verification & Confirmation** validates that all prerequisites and orchestration
     succeeded. It confirms file properties, git commit format, and upstream tracking. This phase
     provides visibility into the final state and catches any issues before declaring success.

  ### Why This Approach Works

  - **Minimal custom code:** Implementation reuses existing, proven utilities (no new source code)
  - **Clear error handling:** Pre-checks and post-validation catch issues early
  - **Observability:** Sheep's observability layer (Langfuse) traces execution for debugging
  - **Risk mitigation:** Dual-layer validation, early environment checks, final confirmation
  - **Consistency:** Identical pattern to 273+ prior features; no novel architectural decisions

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | ANTHROPIC_API_KEY not set | Medium | High | Phase 1 checks env var before orchestration; clear error message guides setup |
  | Claude API quota exceeded / rate limit | Low | Medium | Fail-fast error handling in content_generators; user retries later; no rollback needed |
  | Git configuration missing (user.name, user.email) | Low | High | Phase 1 verifies git config; GitCommitTool validates before attempting commit |
  | Feature branch not checked out | Low | High | Phase 1 validates current branch name; git error if mismatch |
  | Remote 'origin' not configured | Very Low | High | Phase 1 checks git remote; GitPushTool validates before push |
  | Repository root not writable | Very Low | High | Permissions checked implicitly by pathlib; 273+ prior features succeed on same repo |
  | Generated content invalid (missing H1, wrong sentence count) | Very Low | Medium | Layer 1 validation checks content structure; _validate_markdown_content() fails fast; no file created |
  | File encoding/line ending anomalies | Very Low | Low | Layer 2 validation checks UTF-8 validity, BOM, line endings; validate_markdown_file() fails if invalid |
  | Git commit already exists | Very Low | Low | Each feature run uses same branch; commit message is deterministic; user can force-push if needed |
  | Upstream tracking not set | Very Low | Low | GitPushTool uses set_upstream=True; git branch -vv confirms tracking after push |
  | Network timeout during API call or push | Low | Medium | Fail-fast with clear error; user can retry; no partial state left (file validated before commit) |

  ## Files

  - **Creates:** test-ihdf8h.md (repository root; ~250-600 bytes)
  - **Modifies:** None (no source code changes)
  - **Commits:** Single conventional commit on feature branch (feat(274): create markdown file test-ihdf8h.md with prose content)
  - **Pushes:** Feature branch to origin with upstream tracking

