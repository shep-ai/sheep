content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-an35bo.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established across 130+ similar features
  (features 006–133), with identical requirements and implementation approach. The feature validates
  the platform's core capability to handle minimal, well-defined file creation tasks.

  ## Success Criteria

  - [ ] File `test-an35bo.md` exists in repository root directory
  - [ ] File contains exactly one H1 markdown heading (line starting with `# `)
  - [ ] File contains exactly 2-3 sentences of prose content below the heading
  - [ ] File uses UTF-8 text encoding (verified by hex inspection or encoding check)
  - [ ] File uses LF line endings (not CRLF); verified via `git diff --check` or hex inspection
  - [ ] File size is between 400-600 bytes (inclusive)
  - [ ] File has been git staged and committed to the feature branch
  - [ ] Commit message follows conventional commits format (e.g., `feat(134): ...` or `docs(134): ...`)
  - [ ] Commit has been pushed to feature branch `feat/134-markdown-file-creation-1d839a`
  - [ ] Markdown syntax is valid (no unclosed brackets, unbalanced delimiters, or malformed headings)
  - [ ] No existing files in the repository were modified
  - [ ] No files were deleted

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-an35bo.md` in the repository root directory (at the same level as other test-*.md files)
  - **FR-2**: File must contain exactly one H1 markdown heading using `# ` syntax (single hash, followed by a space, followed by title text)
  - **FR-3**: File must contain exactly 2-3 sentences of descriptive prose content after the heading, separated by a blank line from the heading
  - **FR-4**: File must use UTF-8 text encoding (no other encodings; ASCII is a subset of UTF-8 and acceptable)
  - **FR-5**: File must use LF line endings (Unix-style `\n`, not Windows-style `\r\n` / CRLF)
  - **FR-6**: File must be git staged (using `git add`) and committed with a conventional commit message
  - **FR-7**: Commit message must follow conventional commits standard, using one of: `feat(134):`, `docs(134):`, or similar format with the feature number
  - **FR-8**: Commit must include the feature number (134) in the message for traceability
  - **FR-9**: Commit must be pushed to the feature branch `feat/134-markdown-file-creation-1d839a`
  - **FR-10**: File must not contain any special formatting (no bold, italic, code blocks, or other markdown features beyond the heading)

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 400-600 bytes inclusive, ensuring content is proportional to 2-3 sentences
  - **NFR-2**: Markdown syntax must be valid and parseable by standard markdown validators (e.g., no unclosed delimiters, proper heading syntax)
  - **NFR-3**: Implementation must strictly follow the established pattern from features 130-133 for consistency across the test file collection
  - **NFR-4**: Implementation should complete within 15 minutes of execution time (automated or manual)
  - **NFR-5**: Git operations must use standard git configuration (user.name and user.email pre-configured) and follow the repository's conventional commits standard
  - **NFR-6**: No modifications to existing files or directories; the only change must be the creation of the new markdown file
  - **NFR-7**: Implementation must not create any intermediate or temporary files; only the final `test-an35bo.md` should appear in the repository
  - **NFR-8**: No side effects on CI/CD pipeline, build system, or other repository systems

  ## Product Questions & AI Recommendations

  **No product decisions required.** This feature is fully specified with:
  - Fixed file name and location
  - Clear content format (H1 heading + 2-3 sentences)
  - Established pattern from 130+ similar features providing precedent
  - No architectural or design decisions needed
  - Implementation flexibility limited to prose content selection (any topic acceptable)

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a Python package with the following key directories:

  - **`src/sheep/`** - Core application source code (agents, flows, tools, config, observability)
  - **`specs/`** - Feature specifications directory containing YAML files for each feature (006-134+)
  - **`tests/`** - Test suite (pytest-based)
  - **Repository root** - Contains existing test markdown files (JOKE.md, SHEEP.md, test-*.md files, etc.)
  - **Configuration files** - pyproject.toml (Python project config), .env, docker-compose.yml, Dockerfile

  The repository is version-controlled with git and uses a worktree-based feature branch pattern
  (`feat/NNN-<feature-name>`).

  ### Architecture Patterns

  The Sheep platform follows these architectural patterns:

  1. **Separation of Structure and Intelligence**
     - Flows define execution structure and control paths
     - Crews provide autonomous AI decision-making
     - Each crew is a specialized unit invoked at specific flow steps

  2. **Modular Agent-Based Design**
     - Agents have focused roles (Research, Implementation, Review)
     - Tools handle specific operations (git_tools.py, file_tools.py)
     - CrewAI orchestration framework manages execution

  3. **Multi-Phase Development Workflow**
     - Analysis → Requirements → Planning → Implementation → Review → Push
     - Each phase has specific deliverables and gate criteria

  4. **Established Test Pattern**
     - 130+ test markdown files at repository root following consistent format
     - Each feature creates one markdown file: heading + 2-3 sentences of prose
     - Files demonstrate platform capability and provide test coverage

  ### Relevant Technologies

  - **Python 3.11+** - Core language (pathlib for file operations, standard library I/O)
  - **Git** - Version control (staging, commits, branch management)
  - **Markdown** - File format (simple H1 heading + prose)
  - **CrewAI** - Agent orchestration framework (for the broader platform)
  - **pydantic & pydantic-settings** - Configuration management
  - **UTF-8 text encoding** - Standard for file creation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-an35bo.md) to existing collection of 130+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 123-133; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the main application |
  | Configuration & Build | None | No changes to pyproject.toml, .env, Docker config, or build system |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/134-markdown-file-creation-1d839a` must exist and be active
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 130+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib available in Python 3.11+ (no external dependencies needed)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 130+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, configuration, or source code changes required
  - Similar features (130-133) demonstrate efficient implementation of identical features in 10-15 minutes

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, ready for planning_
