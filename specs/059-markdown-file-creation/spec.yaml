content: |
  ## Problem Statement

  Create a markdown file named `test-g0dk19.md` in the repository root containing a title and 2-3 sentences of content about any topic. This feature continues the established pattern of the Sheep project, which maintains a collection of markdown content files at the repository root for demonstration and testing purposes.

  The feature is straightforward and follows the identical pattern to recently completed features #044 and #047. No code changes, configuration, testing framework integration, or infrastructure modifications are required.

  ## Success Criteria

  - [ ] File named `test-g0dk19.md` is created in the repository root directory (not in subdirectories)
  - [ ] File contains valid markdown syntax that renders correctly in GitHub preview
  - [ ] File has a single title as an H1 (`#`) or H2 (`##`) markdown heading
  - [ ] File contains exactly 2-3 complete sentences of prose content below the heading
  - [ ] Prose content does not include code blocks, lists, tables, or other formatting elements
  - [ ] File uses UTF-8 encoding without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix-style) line endings, not CRLF or mixed
  - [ ] No existing repository files are modified, deleted, or renamed
  - [ ] Changes are committed with a conventional commit message: `feat: Create test-g0dk19.md markdown file`
  - [ ] Commit is pushed to feature branch `feat/059-markdown-file-creation`

  ## Functional Requirements

  - **FR-1**: Create a file named `test-g0dk19.md` in the repository root directory
  - **FR-2**: Include a markdown heading (H1 or H2 level) as the file title
  - **FR-3**: Include 2-3 complete sentences of prose content below the heading
  - **FR-4**: Stage the file in Git and commit with a conventional commit message
  - **FR-5**: Push the commit to the feature branch `feat/059-markdown-file-creation`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding without Byte Order Mark (BOM)
  - **NFR-2**: File must use LF (Unix-style) line endings, not CRLF or mixed line endings
  - **NFR-3**: Markdown syntax must be valid and render correctly in GitHub preview
  - **NFR-4**: No modifications to existing repository files; this feature is purely additive
  - **NFR-5**: Commit message must follow Conventional Commits format (type: subject)
  - **NFR-6**: File size should be minimal (< 1KB); prose-only content with no extraneous formatting

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content be completely original, or can it reference/adapt existing sources? | Original prose preferred, but any appropriate prose acceptable | Flexibility matches established pattern (features 044, 047); goal is content creation, not original research |
  | 2 | Should there be constraints on content topic or subject matter? | Free topic choice, no constraints | Established pattern shows no topical constraints; maximizes implementer autonomy and matches test-file nature |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added to root directory; no modifications to existing files, no deletions |
  | Specs Directory | None | Feature specification already created; requirements phase updates only this spec.yaml file |
  | Source Code (`/src/sheep`) | None | No Python code, platform logic, or module changes affected |
  | Tests (`/tests`) | None | No test files created, modified, or deleted; this is a content-only feature |
  | CI/CD (`.github`) | None | No workflows or automation changes required; standard git workflow applies |
  | Build System (`pyproject.toml`) | None | No dependencies, configuration, or build settings modified |
  | Git History | Low | Single commit added with standardized conventional commit message; no force pushes or rebases |

  ## Dependencies

  - **Git repository**: Feature branch `feat/059-markdown-file-creation` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Related features**: Features #044 and #047 establish the precedent pattern (no technical dependency, only reference)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature with clear, straightforward requirements:

  - **File creation**: ~5 minutes (write one heading + 2-3 sentences of prose content)
  - **Validation**: ~3 minutes (verify markdown syntax is valid, file encoding is UTF-8, line endings are LF)
  - **Git workflow**: ~2-5 minutes (stage file, create commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with identical, recently completed features (#044, #047) providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing framework integration, CI/CD changes, or documentation updates required

  ---

  _Requirements phase complete — ready for design and implementation_
