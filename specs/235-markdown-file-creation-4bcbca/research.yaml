# Structured technology decisions
decisions:
  - title: "File I/O Method"
    chosen: "pathlib.Path.write_text() with explicit UTF-8 encoding and newline parameter"
    rejected:
      - "Built-in open() function — more verbose, requires explicit file handle management"
      - "os.open() with low-level flags — unnecessarily complex for this straightforward use case"
    rationale: >
      Feature 234's implementation uses pathlib.Path.write_text() as the idiomatic Python 3.11+ approach.
      This method provides: (1) explicit encoding control ensuring UTF-8 without BOM per spec NFR-1;
      (2) platform-aware line ending handling via newline='\n' enforcing Unix LF per spec NFR-2;
      (3) automatic file handle management; (4) consistency with proven 90+ precedent implementations.
      The approach is safe, readable, and matches the established codebase pattern.

  - title: "Content Generation Strategy"
    chosen: "Deterministic inline prose content with free-form topic selection"
    rejected:
      - "LLM-based generation using CrewAI — overkill for single test file; adds API latency"
      - "Template system with variable substitution — unnecessary indirection not used in precedents"
    rationale: >
      The spec explicitly permits 'anything' as topic with no LLM requirement. Examination of test files
      shows successful implementations use simple, deterministic prose written once. Inline content generation
      is simpler, faster, and aligns with the 10-15 minute size estimate. The spec's requirement for
      'substantive prose related to title' is easily satisfied by crafting 2-3 coherent sentences once.

  - title: "Git Integration Approach"
    chosen: "subprocess module invoking git CLI commands (add, commit, push)"
    rejected:
      - "GitPython library abstraction — adds wrapper layer not used by precedent implementations"
      - "Manual shell scripts — non-portable, harder to integrate with Python workflow"
    rationale: >
      The established pattern across 90+ implementations uses subprocess to invoke git commands directly.
      This approach is: (1) part of Python stdlib with no new dependencies; (2) consistent with git_tools.py
      patterns; (3) simple enough that library abstraction adds no value; (4) proven across all precedent
      implementations. Subprocess provides direct control and transparency without GitPython overhead.

  - title: "Markdown Validation Approach"
    chosen: "Simple structural validation of file properties (encoding, line endings, size, structure)"
    rejected:
      - "Full CommonMark validation with external parser — adds external dependency not needed"
      - "No validation after file creation — risks silent failures; basic checks ensure spec compliance"
    rationale: >
      The spec's success criteria require validation of: UTF-8 encoding (NFR-1), Unix LF line endings (NFR-2),
      400-600 byte size (NFR-3), structure (H1 + blank line + prose), and 2-3 sentence count. Simple structural
      checks reading file in binary mode are sufficient. Full CommonMark parsing is not needed — manually
      crafted prose naturally generates valid CommonMark. This validation (~50 lines) provides confidence
      without external dependencies.

  - title: "Character Encoding Strategy"
    chosen: "UTF-8 without Byte Order Mark (BOM) via encoding='utf-8' parameter in Path.write_text()"
    rejected:
      - "UTF-8 with BOM — explicitly forbidden by spec requirement NFR-1"
      - "ASCII encoding — unnecessarily restrictive; CommonMark supports Unicode characters"
    rationale: >
      Spec requirement NFR-1 explicitly requires UTF-8 without BOM. Python's pathlib.Path.write_text() with
      encoding='utf-8' parameter defaults to UTF-8 without BOM, exactly matching this requirement. This is
      verified across all 90+ prior test files using this encoding. No special handling needed — Python's
      default behavior is correct.

  - title: "Line Ending Handling"
    chosen: "Explicit Unix LF via newline='\\n' parameter in Path.write_text()"
    rejected:
      - "Platform-default line endings — creates inconsistency across OS platforms; spec requires Unix LF"
      - "Binary write mode with manual LF insertion — more error-prone and less Pythonic than parameter"
    rationale: >
      Spec requirement NFR-2 requires Unix-style LF line endings. The newline='\n' parameter in Path.write_text()
      ensures LF regardless of platform (Linux, macOS, Windows). This explicit parameter is idiomatic Python,
      avoids manual string manipulation, and is consistent with successful prior implementations using this parameter.

