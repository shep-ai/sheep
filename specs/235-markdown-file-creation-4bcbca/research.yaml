# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-27
  - **Completeness:** All technical decisions documented and rationalized

  ## Technology Decisions Summary

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text(content, encoding='utf-8', newline='\n')

  **Rejected:**
  - Built-in open() function — more verbose, manual handle management
  - os.open() with low-level flags — unnecessarily complex for text file creation

  **Rationale:** Idiomatic Python 3.11+; explicit encoding control (UTF-8 without BOM per NFR-1);
  platform-aware line ending handling (Unix LF via newline='\n' per NFR-2); consistent with
  successful feature 234 implementation and 90+ precedents. Provides safe, readable, proven pattern.

  ### 2. Content Generation: Inline Deterministic Prose

  **Chosen:** Write 2-3 sentences directly in implementation with free-form topic

  **Rejected:**
  - LLM-based generation via CrewAI — unnecessary API overhead
  - Template system — adds indirection not present in prior implementations

  **Rationale:** Spec permits 'anything' as topic; simple prose satisfies 'substantive' requirement;
  aligns with 10-15 minute size estimate; matches actual pattern from examination of 90+ test files
  containing hand-crafted, diverse prose content (not LLM-generated).

  ### 3. Git Integration: subprocess with git CLI

  **Chosen:** subprocess.run() invoking git commands: add, commit, push

  **Rejected:**
  - GitPython library — unnecessary abstraction not used by precedents
  - Manual shell scripts — non-portable, harder to integrate with Python

  **Rationale:** Established pattern across all 90+ implementations; subprocess is stdlib (no new
  dependencies); simple, transparent git operations; consistent with git_tools.py patterns in
  codebase. No value from library abstraction for straightforward add/commit/push operations.

  ### 4. File Validation: Structural Property Checks

  **Chosen:** Validate file properties (encoding, line endings, size, structure) after creation

  **Rejected:**
  - No validation — risks invalid files being committed
  - Full CommonMark parsing — external dependency not needed for content validation

  **Rationale:** Spec success criteria require verification of encoding, line endings, size, structure,
  and sentence count. Simple validation logic (~50 lines) reading file in binary mode and checking
  properties provides confidence without external dependencies. Consistent with feature 234's
  comprehensive validation approach.

  ### 5. Character Encoding: UTF-8 without BOM

  **Chosen:** UTF-8 without Byte Order Mark via encoding='utf-8' parameter

  **Rejected:**
  - UTF-8 with BOM — explicitly forbidden by spec NFR-1
  - ASCII — unnecessarily restrictive for CommonMark

  **Rationale:** Spec requirement NFR-1 explicitly requires UTF-8 without BOM. Python's default
  behavior with encoding='utf-8' parameter provides exactly this. No special handling needed;
  verified across all 90+ prior test files using this encoding.

  ### 6. Line Ending Handling: Explicit Unix LF

  **Chosen:** Unix LF via newline='\n' parameter in Path.write_text()

  **Rejected:**
  - Platform defaults — creates OS-dependent inconsistency; spec requires Unix LF
  - Binary write with manual insertion — more error-prone than text mode parameter

  **Rationale:** Spec requirement NFR-2 requires Unix LF. The newline='\n' parameter ensures LF
  regardless of platform. Idiomatic Python; consistent with successful prior implementations;
  satisfies requirement across all environments (Linux, macOS, Windows).

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O operations (create, write) | Use | Python stdlib; idiomatic for 3.11+; explicit encoding/newline control; proven in 90+ precedents |
  | subprocess | Git command execution | Use | Python stdlib; simple CLI invocation; consistent with git_tools.py patterns |
  | re | Regular expressions (H1 validation) | Use | Python stdlib; lightweight pattern matching for markdown structure |
  | GitPython | Git operations library | Reject | Unnecessary abstraction; subprocess provides sufficient functionality with less complexity |
  | markdown-it-py | CommonMark validation | Reject | External dependency; simple content validation is sufficient |
  | CrewAI | LLM-based content generation | Reject | Overkill for single file; inline prose simpler and matches precedent |

  ## Security Considerations

  **File Creation:**
  - pathlib.Path.write_text() is safe; handles file creation without manual open/close
  - encoding='utf-8' prevents encoding-related security issues
  - File size validation (400-600 bytes) prevents unbounded growth

  **File Path Handling:**
  - Use pathlib (not string concatenation) for cross-platform path safety
  - Filename (test-qz1gsg.md) provided by spec; no user input used in path construction
  - Check if file already exists before writing to prevent accidental overwrites

  **Git Operations:**
  - subprocess.run() with list-based arguments prevents shell injection vulnerabilities
  - No shell=True parameter (safer than shell invocation)
  - Filename (test-qz1gsg.md) provided by spec; no user input in git commands

  **Content Validation:**
  - Validate file is UTF-8 decodable (prevents binary/corrupt content)
  - Check for Windows CRLF line endings (file format consistency)
  - Verify file size within expected range (detects corrupted/oversized files)
  - Validate structure (H1 heading present, 2-3 sentences) ensures valid markdown

  **No elevated privileges needed** — simple file creation in writable directory.

  ## Performance Implications

  **File I/O Performance:**
  - pathlib.Path.write_text() is optimized for single-file writes
  - Expected execution: <10ms for 400-600 byte file (negligible)
  - Validation (binary read + structure checks): <5ms (negligible)

  **Git Operations Performance:**
  - git add: ~100-200ms (varies by repo; typically negligible)
  - git commit: ~50-100ms (quick local operation)
  - git push: 1-5 seconds (network dependent; asynchronous)

  **Total Time Estimate:** 10-15 minutes (matching spec size estimate "S")
  - File creation and validation: ~3 minutes
  - Content writing and review: ~5 minutes
  - Git operations and verification: ~2-5 minutes

  **Scalability Note:** This feature creates a single file; no scalability optimizations apply.
  Implementation designed for simplicity, not scale.

  ## Architecture Notes

  ### Codebase Integration

  **Existing Patterns (90+ Precedents):**
  - File creation follows pattern from test-*.md files at repository root
  - Git workflow (add → commit → push) matches established feature implementation pattern
  - No modifications to source code, tests, or configuration (read-only outside test file creation)
  - Feature branch pre-created; implementation works on existing branch

  **No Dependencies On:**
  - src/sheep/ application code (test artifact, not part of application)
  - CrewAI agents (standalone Python script, no agent orchestration)
  - Configuration files (pyproject.toml, .env, etc. — all read-only)
  - Test suite (markdown files do not require pytest tests)

  ### Implementation Structure

  ```
  1. Define constants (filename, commit message, prose content)
  2. Create file using pathlib with UTF-8 and LF
  3. Validate file properties (encoding, line endings, size, structure)
  4. Execute git operations (add, commit, push)
  5. Return success status or raise error if any step fails
  ```

  Straightforward linear structure reflecting the feature's minimal complexity.

