content: |
  ## Summary

  Feature 206 implementation spans 5 phases and 11 tasks, from module setup through end-to-end testing.
  Phase 1 establishes the foundation (constants, imports, logging). Phase 2 creates the file with
  hard-coded content using pathlib.Path.write_text(). Phase 3 implements a comprehensive validation
  pipeline with 6 independent validators (H1 format, blank line, sentence count, UTF-8 encoding,
  LF line endings, file size), orchestrated through a fail-fast pipeline. Phase 4 implements git
  operations (add, commit, push) using subprocess.run(). Phase 5 orchestrates everything together
  and performs end-to-end testing to verify all success criteria are met.

  Each task follows TDD (RED-GREEN-REFACTOR), enabling independent component testing and early
  error detection. Tasks are ordered by dependency: setup comes first, file creation before
  validation, validation before git operations, and orchestration last. The design prioritizes
  simplicity, maintainability, and clarity of error messages. All code uses only Python 3.11+
  standard library (pathlib, subprocess, sys, re) and sheep.observability.logging.

  Total estimated effort is 9-11 hours, distributed across phases as follows:
  - Phase 1: 0.5 hours (setup)
  - Phase 2: 1 hour (file creation)
  - Phase 3: 3.5 hours (validation pipeline + orchestrator)
  - Phase 4: 1.5 hours (git operations)
  - Phase 5: 2.5 hours (orchestration + end-to-end testing)
