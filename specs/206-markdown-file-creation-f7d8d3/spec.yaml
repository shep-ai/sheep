content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-afcl8i.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 200-205, with 200+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system, proving the platform can consistently produce high-quality files that match established patterns.

  ## Success Criteria

  - [ ] File `test-afcl8i.md` is created at repository root (not in subdirectory)
  - [ ] File contains valid CommonMark markdown syntax with no parse errors
  - [ ] File starts with an H1 heading (title) on first line
  - [ ] File contains exactly 2-3 prose sentences after the title
  - [ ] File is encoded in UTF-8 with Unix LF line endings (0x0A, not CRLF)
  - [ ] File size is between 100-600 bytes (inclusive)
  - [ ] File is staged in git index with no uncommitted changes
  - [ ] Git commit message follows Conventional Commits format with feature scope
  - [ ] Commit is pushed to `feat/206-markdown-file-creation-f7d8d3` branch
  - [ ] Git history shows single commit for this feature with no merge commits
  - [ ] No existing files in repository are modified or deleted
  - [ ] All validation checks pass with clear, specific error messages on any failure

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-afcl8i.md` at the repository root using `pathlib.Path` for cross-platform compatibility
  - **FR-2**: File must begin with an H1 markdown heading (single `#` followed by space and title text) that serves as the file's title
  - **FR-3**: File must contain exactly 2-3 complete prose sentences after the title, separated by blank line from heading
  - **FR-4**: Write file with UTF-8 encoding and Unix LF line endings; validate and automatically convert if necessary
  - **FR-5**: File must be valid CommonMark markdown; validate H1 structure and paragraph syntax compliance (see openQuestions for validation approach)
  - **FR-6**: Stage the file in git using subprocess to run `git add test-afcl8i.md`
  - **FR-7**: Create a git commit with conventional commit message using subprocess (format: `feat(206): Create markdown file test-afcl8i.md`)
  - **FR-8**: Push commit to the feature branch `feat/206-markdown-file-creation-f7d8d3` using subprocess
  - **FR-9**: Validate that no existing files were modified during this operation; fail if repository state diverges unexpectedly

  ## Non-Functional Requirements

  - **NFR-1**: Execution must complete within 5 minutes total (file I/O and git operations)
  - **NFR-2**: File size must be in range 100-600 bytes (inclusive) to match established test file patterns
  - **NFR-3**: Implementation must follow architecture patterns from features 200-205 with identical module structure
  - **NFR-4**: All error messages must be specific and actionable (include context, show expected vs. actual values), enabling quick resolution
  - **NFR-5**: File I/O must use `pathlib.Path` exclusively for cross-platform compatibility (no os.path module)
  - **NFR-6**: Git operations must use Python `subprocess` module with no external git wrapper dependencies
  - **NFR-7**: Code must be maintainable and follow existing feature module patterns from the codebase
  - **NFR-8**: No external package dependencies; use only Python 3.11+ standard library and git command-line tools
  - **NFR-9**: Prose content must be hard-coded (deterministic) to ensure reproducibility across runs

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | How should CommonMark syntax be validated given NFR-8 (no external packages)? | Regex-based validation for H1 heading and paragraph structure | Sufficient for simple files, avoids external dependencies, keeps implementation maintainable |
  | 2 | What scope should the conventional commit message use? | Feature number: `feat(206)` | Provides clear traceability to feature tracking system, enables easy correlation between commits and specs |
  | 3 | Should file encoding/line ending validation fail fast or attempt recovery? | Automatic conversion to UTF-8/LF | Aligns with FR-4, ensures consistency regardless of system defaults, maintains robustness |
  | 4 | How should the implementation handle validation failures? | Fail immediately with specific error | Aligns with NFR-4, implements fail-fast pattern, enables quick debugging |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized into the following key directories:

  - **Root Directory** - Contains 200+ markdown test files following pattern `test-*.md` (examples: test-afcl8i.md, test-0tyide.md, test-x1h34c.md)
  - **src/sheep/** - Main source code directory containing all modules
    - **agents/** - Agent definitions for research, implementation, and review phases
    - **config/** - Configuration management including LLM factory and settings
    - **flows/** - Flow definitions for orchestrating multi-step workflows
    - **observability/** - Logging infrastructure and Langfuse integration
    - **tools/** - Agent tools for file operations and git commands
    - **cli.py** - Command-line interface entry point
  - **specs/** - Feature specifications organized by number (206+ feature specs)
  - **.github/** - GitHub Actions workflows and CI/CD configuration
  - **pyproject.toml** - Python project configuration
  - **README.md** - Project documentation

  ### Architecture Patterns

  The Sheep platform follows these architectural patterns:

  **Separation of Structure and Intelligence:**
  - Flows define the execution structure and control flow paths
  - Crews provide autonomous AI decision-making within each flow
  - Each agent has a focused role with clear goals and backstories

  **Feature Implementation Pattern:**
  - Each feature is a self-contained operation (200+ markdown file creation tasks)
  - Operations follow conventional commit patterns and git workflow best practices
  - Validation is comprehensive with fail-fast error handling
  - File creation uses standard pathlib.Path for cross-platform compatibility

  **Dependency Flow:**
  - Simple operations depend on: Python standard library (pathlib, subprocess)
  - Git operations use Python `subprocess` module (no external git wrapper dependencies)
  - File I/O uses `pathlib.Path` for cross-platform compatibility

  ### Relevant Technologies

  - **Python 3.11+**: Required runtime with access to standard library modules (pathlib, subprocess, sys, re)
  - **Git**: Version control system required for staging, committing, and pushing changes
  - **Markdown**: CommonMark specification for file format (H1 heading + prose structure)
  - **pathlib**: Cross-platform file path handling (Python standard library)
  - **subprocess**: Git command execution (Python standard library)
  - **re**: Regular expressions for CommonMark syntax validation (Python standard library)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 200-205; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess, re) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/206-markdown-file-creation-f7d8d3` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib`, `subprocess`, `re` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Target filename: `test-afcl8i.md` (specified in requirements)

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (200-205) demonstrate successful execution of identical pattern
  - Recent commits (200-205) show exact templates and working examples
  - Feature 205 implementation provides direct code precedent for implementation approach

  **Not Required:**
  - No source code modifications to existing files
  - No changes to core platform logic in agents, flows, or tools
  - No modification of configuration files
  - No test framework integration
  - No documentation updates beyond spec files
  - No external dependencies or build steps

  ## Size Estimate

  **S (Small — approximately 1-2 hours of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 200+ existing test files:

  - **Content composition**: ~10-15 minutes (write title and 2-3 sentences of prose content)
  - **File creation and encoding**: ~5 minutes (write file with UTF-8 encoding and LF line endings using pathlib)
  - **Validation implementation**: ~10-15 minutes (regex validation for markdown syntax, sentence count, encoding, line endings, file size)
  - **Git workflow**: ~10-15 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total estimate**: 40-60 minutes (1-1.5 hours) of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (200-205) demonstrate efficient execution in similar timeframes
  - No git merge conflicts or branch management complexity
  - Feature 205 implementation serves as direct working precedent for all implementation patterns
  - File creation and git operations use only Python standard library (pathlib, subprocess, re) and standard git commands

  ---

  _Requirements phase complete — ready for implementation planning_
