# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository contains a collection of markdown files documenting various topics, examples,
  and state machine diagrams. A new simple test markdown file is needed to extend this collection.
  The task is straightforward: create a single markdown file named test-mf05k4.md with a title
  (heading) and 2-3 sentences of content about any topic. This follows the established pattern of
  four recent similar files (test-quk4of.md, test-idm3s2.md, test-an5dun.md, test-xa3rxn.md).

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root level**: Contains 40+ markdown files including state machine diagrams, example documents, design patterns, jokes, and domain-specific content (enamel art, nautical knots, beekeeping, etc.)
  - **specs/**: Feature specification directory with 50+ subdirectories, each containing specs for planned/completed features (numbered 006-031)
  - **.github/**: GitHub Actions workflows and configuration
  - **src/**: Python source code for the agentic platform (agents, flows, tools, config, observability)
  - **Dockerfile, .env.example, .gitignore**: Infrastructure and configuration files

  The repository is a Python/CrewAI-based agentic platform that automates software development tasks.
  However, for this feature, only the root-level markdown directory is affected.

  ### Architecture Patterns

  The repository follows these patterns for test markdown files:

  1. **Naming Convention**: `test-<identifier>.md` where `<identifier>` is a 6-character alphanumeric string
     (e.g., test-xa3rxn.md, test-quk4of.md, test-mf05k4.md)
  2. **Content Structure**: Simple 1-3 paragraph file with heading + body sentences
  3. **Placement**: All test markdown files are at the repository root (no subdirectories)
  4. **Encoding & Line Endings**: UTF-8 encoding, LF line endings (\n, not CRLF)
  5. **No Dependencies**: Standalone documentation files with no code references or imports
  6. **Git Integration**: Added via conventional commit message format (e.g., `feat(content): add test-mf05k4.md markdown file`)

  ### Relevant Technologies

  - **Markdown**: GitHub-Flavored Markdown (GFM) for content syntax
  - **Git**: Version control for file addition and commit history
  - **File System**: Plain text file at repository root
  - **No Build/Test Infrastructure Required**: Unlike some other features, this requires no build tools, test runners, or CI changes

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new .md file; no code or configuration changes to existing files |
  | Git history | Low | Single file addition tracked via conventional commit message |
  | CI/Tests | None | No test code changes, Python code, configuration updates, or CI pipeline modifications required; documentation files validated via PR review |
  | README/docs | None | No updates to README.md, documentation indices, or other existing files |

  ## Dependencies

  None. This is a pure documentation file with no code dependencies, external libraries, or requirements.
  No changes to other files are necessary. The feature is completely standalone and additive.

  ## Size Estimate

  **S** — Single markdown file (~10-20 lines including heading and content). No code changes, configuration
  updates, or test files required. Straightforward documentation file following an established pattern
  used successfully in four recent features (030, 029, 028, 027). Can be completed in minutes.

  ## Success Criteria

  - [ ] File `test-mf05k4.md` exists at the repository root
  - [ ] File contains a single markdown heading (# or ##) as the title
  - [ ] File contains exactly 2-3 complete sentences of body content
  - [ ] Content is valid GitHub-Flavored Markdown with no syntax errors
  - [ ] File uses UTF-8 encoding
  - [ ] File uses LF line endings (not CRLF)
  - [ ] File name matches pattern `test-mf05k4.md`
  - [ ] Changes are committed with a conventional commit message (e.g., `feat(content): add test-mf05k4.md markdown file`)
  - [ ] No unrelated files are modified or created

  ## Implementation Approach

  1. Create a new file at `/test-mf05k4.md` with a heading and 2-3 sentences of content
  2. Use UTF-8 encoding and LF line endings (git should auto-normalize based on .gitattributes)
  3. Add and commit the file with message: `feat(content): add test-mf05k4.md markdown file`
  4. Push to the feature branch

  No code changes, test modifications, or configuration updates are required.
