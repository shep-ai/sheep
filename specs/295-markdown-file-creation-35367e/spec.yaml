content: |
  ## Problem Statement

  Create a single markdown file named `test-ydhh74.md` in the repository root directory with a properly formatted markdown structure: an H1 heading as the title on the first line, followed by a blank line, then exactly 2-3 sentences of coherent prose content about any topic. This feature is part of an established series (features 289-295+) that demonstrates the Sheep automation platform's capability to consistently execute simple, repetitive file creation tasks while maintaining pattern fidelity and quality standards.

  ## Codebase Analysis

  ### Project Structure

  **Sheep Platform Organization:**
  - **Root Level**: Test markdown files (test-*.md) created in repository root directory per established pattern (features 289-294 create test files here)
  - **src/sheep/**: Core Sheep platform modules
    - `config/llm.py`: LLM configuration and Claude API integration (provides `get_reasoning_llm()`)
    - `observability/logging.py`: Structured logging via structlog (provides `get_logger()`)
    - `features/`: Feature-specific implementations
    - `flows/`: Workflow orchestration (branch creation, implementation, review, push phases)
    - `agents/`: CrewAI agent definitions for different development tasks
    - `tools/`: Custom tools available to agents (git operations, file I/O, etc.)
    - `content_generators.py`: Generic content generation utilities
  - **specs/**: Feature specification directory with 295+ subdirectories (one per feature), each containing spec.yaml
  - **create_markdown.py**: Standalone markdown file creation and validation module used by implementations (imports from sheep.config.llm and sheep.observability.logging)

  ### Architecture Patterns

  **Sheep Platform Workflow:**
  1. **Branch Creation**: Create isolated feature branch for development
  2. **Research Phase**: Analyze repository structure and architecture (performed during analysis phase)
  3. **Implementation Phase**: Execute task following established patterns and conventions
  4. **Review Phase**: Self-review changes for quality, correctness, and pattern adherence
  5. **Push Phase**: Commit with conventional messages and push to remote

  **Markdown File Creation Pattern (Established in Features 289-294):**
  - Create single markdown file with deterministic format: H1 heading + blank line + 2-3 sentences
  - Use Claude API (via `sheep.config.llm.get_reasoning_llm()`) for content generation
  - Validate generated content against format requirements (see `src/create_markdown.py:validate_content()`)
  - Stage file in git, commit with conventional message format, push to feature branch
  - No modifications to existing files, no architectural changes

  **Conventional Commit Format:**
  - Pattern established in features 289-294: `feat({number}): create markdown file {filename} with prose content`
  - Example from feature 294: `feat(294): create markdown file test-xvaf7y.md with prose content`
  - Enables clear git history and PR tracking

  ### Relevant Technologies

  **Core Platform (Sheep):**
  - **CrewAI Framework**: Multi-agent orchestration for code implementation tasks; provides agent/task abstractions and execution engine
  - **Claude API Access**: Integrated via `sheep.config.llm` module; accessed through `get_reasoning_llm()` for LLM calls
  - **structlog**: Structured logging framework used throughout Sheep for observable execution tracking
  - **Langfuse Integration**: Optional observability backend for execution tracing and metrics

  **Task-Specific Technologies:**
  - **Python 3.11+**: Runtime and standard library (pathlib for cross-platform file I/O)
  - **Git CLI**: Version control operations via subprocess calls (staging, committing, pushing)
  - **Markdown Format**: CommonMark-compatible syntax; validated by `src/create_markdown.py`
  - **UTF-8 Encoding**: Standard encoding for markdown files and Python 3 strings

  **File I/O & Validation:**
  - `src/create_markdown.py:generate_markdown_content()`: Main function for markdown generation with retry logic (max_retries=3, exponential backoff)
  - `src/create_markdown.py:validate_content()`: Validates H1 heading, sentence count (2-3), prose length, UTF-8 encoding
  - `src/create_markdown.py:MARKDOWN_GENERATION_PROMPT`: Template prompt for Claude API content generation (defined at module level)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | High | The markdown file (test-ydhh74.md) will be created here, which is the standard location for all test files in this series (features 289+) |
  | Git Repository | Low | File will be tracked by git on the feature branch; no changes to git configuration, hooks, or repository infrastructure |
  | specs/295-markdown-file-creation-35367e | Medium | This spec file documents the feature definition and serves as the source of truth for requirements |
  | Feature Branch (feat/295-markdown-file-creation-35367e) | High | All changes will be isolated to this branch and committed there before pushing to remote |
  | Repository File Structure | None | No architectural changes; only addition of one new markdown file with no modifications to existing files or modules |

  ## Dependencies

  **Runtime Environment:**
  - **File System**: Standard file creation capability via Python pathlib (no external libraries required beyond Python standard library)
  - **Python 3.11+**: Runtime environment with standard library modules (pathlib, subprocess, time, re)
  - **Git**: Version control system already configured in the repository for staging, committing, and pushing
  - **Markdown Format**: Standard CommonMark-compatible markdown syntax (validated by src/create_markdown.py's validate_content function)

  **Platform Integration:**
  - **Claude API Access**: Content generation uses Sheep platform's `sheep.config.llm.get_reasoning_llm()` integration (pre-configured, credentials provided via ANTHROPIC_API_KEY in environment)
  - **Sheep Module Imports**: Depends on sheep.config.llm and sheep.observability.logging modules (internal to Sheep platform)
  - **structured Logging**: Uses structlog for logging via sheep.observability.logging.get_logger() (already integrated into platform)

  **No Additional Dependencies:**
  - No external markdown validation libraries needed (basic format validation is simple regex/string operations)
  - No database or persistence beyond git history
  - No git hooks or special pre-commit configurations required
  - File format (H1 + prose) is straightforward and doesn't require specialized parsers

  ## Size Estimate

  **S** — This is an extremely minimal, straightforward task:

  - **Single file creation**: Requires creating one markdown file with standard H1 + prose format (leverages existing `src/create_markdown.py` module)
  - **Established pattern**: Requirements are identical to features 289-294; no new architectural decisions, code changes, or complexity
  - **Proven precedent**: 289+ previous features follow this exact same pattern, making this highly predictable and low-risk
  - **No testing or validation beyond format**: Existing `validate_content()` function in src/create_markdown.py handles all validation
  - **Simple repetitive workflow**: Generate content → Create file → Stage in git → Commit with conventional message → Push
  - **Zero complexity**: No edge cases, error handling, or special requirements beyond standard operations
  - **Reusable components**: Can leverage existing `generate_markdown_content()` function from src/create_markdown.py for content generation

  The **S** estimate reflects the straightforward nature of the underlying task. Within the Sheep platform's context, the full feature cycle (spec analysis, implementation, review, CI/CD) may require additional time, but the core implementation itself is minimal and well-defined. Previous features (289-294) demonstrate this pattern completes quickly and reliably.

