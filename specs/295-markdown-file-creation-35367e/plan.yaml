content: |
  ## Architecture Overview

  Feature 295 is the seventh iteration in an established markdown file creation series
  (features 289-295+). The implementation seamlessly integrates with the Sheep platform
  architecture by leveraging the proven `sheep.content_generators.create_markdown_file()`
  orchestration function.

  The feature fits the existing architecture as follows:

  ### 1. Sheep Platform Integration

  - Uses platform-provided LLM abstraction: `sheep.config.llm.get_reasoning_llm()`
  - Uses platform logging infrastructure: `sheep.observability.logging.get_logger()`
  - Leverages orchestration module: `sheep.content_generators`
  - No modifications to application source code, configuration, or system architecture

  ### 2. Workflow Pattern (Proven Across Features 289-294)

  ```
  create_markdown_file(filename='test-ydhh74.md', feature_number=295)
    ↓
  Content Generation (Claude API via platform abstraction)
    - Generate H1 heading + prose
    - Validate sentence count (2-3 periods)
    - Retry up to 3 times on validation failure
  ↓
  File Creation (pathlib, UTF-8 encoding)
    - Write file with H1 + blank line + prose
    - Verify encoding (no BOM, LF line endings, trailing newline)
  ↓
  Validation (lightweight checks)
    - H1 heading present and well-formed
    - Blank line separator
    - Exactly 2-3 sentences
    - UTF-8 encoding compliance
    - POSIX file conventions (LF endings, trailing newline)
  ↓
  Git Operations (subprocess with proper error handling)
    - git add test-ydhh74.md
    - git commit -m "feat(295): create markdown file test-ydhh74.md with prose content"
    - git push -u origin feat/295-markdown-file-creation-35367e
  ```

  ### 3. File Location

  - Repository root directory (same as features 289-294 test files)
  - No subdirectories or architectural changes
  - Pure additive change (single new file)

  ## Key Design Decisions

  ### 1. Orchestration Function Reuse (CRITICAL DECISION)

  **Decision:** Leverage `sheep.content_generators.create_markdown_file()` to handle the complete
  workflow rather than implementing inline.

  **Alternatives Considered:**
  - Inline implementation of workflow steps — Code duplication across 289+ features, higher
    maintenance burden, increased consistency risk
  - Direct subprocess calls without orchestration — Bypasses proven error handling/logging
    infrastructure, reinvents the wheel, reduces reliability
  - Static template generation — Violates requirement for meaningful, topically coherent prose

  **Rationale:** Features 289-294 demonstrate that this orchestration function is proven,
  reliable, and complete. Reusing it ensures:

  - Perfect consistency with established patterns (6 prior features, 100% success rate)
  - Minimal implementation code (single function call vs 50+ lines of custom code)
  - Automatic error handling, logging, and retry logic
  - Reduced defect risk by avoiding code duplication
  - Clear precedent from working, tested implementations

  **Evidence:** Features 294, 293, 292, 291, 289 all successfully used this exact pattern with
  zero implementation issues. This is not experimental — it is proven infrastructure.

  ### 2. Content Generation via Platform LLM Abstraction

  **Decision:** Use `sheep.config.llm.get_reasoning_llm()` for Claude API access (via orchestration
  function), not direct Anthropic SDK calls.

  **Rationale:** The Sheep platform abstracts LLM access through CrewAI's unified factory, providing:

  - API credential management (ANTHROPIC_API_KEY environment variable)
  - Model selection abstraction (easy to swap providers without code changes)
  - Temperature/parameter tuning for quality output
  - Error handling and retry logic for transient failures
  - Observability integration with structlog and Langfuse

  This abstraction is the platform's architectural pattern — all features use it, including
  289-294. Bypassing it would violate the architecture and reduce code quality.

  ### 3. File I/O with pathlib and UTF-8 Encoding

  **Decision:** Use pathlib for file operations and UTF-8 encoding with no BOM, LF line endings,
  and trailing newline (POSIX standard).

  **Rationale:**

  - pathlib is Python 3.4+ standard and idiomatic throughout the Sheep codebase
  - Provides cross-platform path handling (Windows/Unix compatibility)
  - UTF-8 encoding is required by spec (FR-6) and standard for markdown files
  - POSIX conventions (LF line endings, trailing newline) ensure portability and compatibility
  - Features 289-294 validate this approach produces correct encoding on all platforms

  ### 4. Lightweight Markdown Validation

  **Decision:** Validate H1 heading, blank line, sentence count (2-3), UTF-8 encoding (no BOM),
  LF line endings, and trailing newline — not full CommonMark spec.

  **Rationale:**

  - Actual markdown format is a trivial subset of CommonMark (just H1 + prose)
  - Lightweight validation covers all requirements (FR-2 through FR-6, NFR-1)
  - O(n) linear complexity, no external dependencies
  - Full CommonMark parsing is unnecessary overhead and adds external dependencies
  - Features 289-294 demonstrate this approach ensures quality while keeping complexity minimal

  ### 5. Sentence Count Validation with Regeneration

  **Decision:** Strictly count terminal periods; if count ≠ 2-3, regenerate content up to
  3 times with exponential backoff.

  **Rationale:**

  - FR-4 explicitly requires 'exactly 2-3 sentences' — not approximate
  - Period-counting is reliable for English prose (simple regex operation)
  - LLM outputs are non-deterministic; validation prevents invalid outputs
  - Retry logic ensures strict compliance while remaining simple
  - Features 289-294 show average <1 retry per feature (statistically rare failure)

  ### 6. Git Operations via subprocess

  **Decision:** Use subprocess.run() with shell=False for git add/commit/push operations.

  **Rationale:**

  - Transparent command execution visible in logs for debugging
  - No external dependencies (stdlib-only solution)
  - Proper error handling via CalledProcessError
  - Cross-platform compatibility (subprocess handles platform differences)
  - Security: shell=False prevents command injection
  - Git is guaranteed available in CI/CD environment
  - Pattern used consistently across features 289-294

  ### 7. Structured Logging Integration

  **Decision:** Use `sheep.observability.logging.get_logger()` for platform-integrated structured
  logging via structlog.

  **Rationale:**

  - NFR-4 requires structured logging for observability
  - Provides JSON-compatible output for machine parsing
  - Contextual metadata (timestamps, feature number, operation)
  - Integration with Langfuse for distributed tracing
  - Consistent format across all 289+ features
  - Reduces troubleshooting friction for failures

  ## Implementation Strategy

  The implementation strategy follows three sequential phases:

  **Phase 1: Setup & Orchestration Function Verification**
  - Verify that `sheep.content_generators.create_markdown_file()` is importable and callable
  - Confirm function signature and understand required parameters (filename, feature_number)
  - Verify any dependencies (e.g., git initialization, Claude API credentials) are available

  **Phase 2: Markdown File Creation Execution**
  - Call `create_markdown_file(filename='test-ydhh74.md', feature_number=295)` with correct parameters
  - The orchestration function handles: content generation, file creation, validation, git operations
  - Monitor logs for execution progress and any errors

  **Phase 3: Validation & Success Criteria Verification**
  - Verify all 9 success criteria are met:
    1. File `test-ydhh74.md` exists in repository root
    2. H1 heading present (single `#` followed by space and title)
    3. Blank line separates H1 from prose
    4. Exactly 2-3 sentences of coherent prose
    5. No grammatical errors or nonsensical content
    6. UTF-8 encoding (no BOM, LF line endings, trailing newline)
    7. Validation passes via `src/create_markdown.py:validate_content()`
    8. File staged in git (`git add`)
    9. Commit created with exact message: `feat(295): create markdown file test-ydhh74.md with prose content`
    10. Commit pushed to feature branch `feat/295-markdown-file-creation-35367e`

  All phases are sequential (not parallel) because:
  1. Setup must complete before execution
  2. Execution must complete before validation
  3. Validation confirms success of earlier phases

  ## Risk Mitigation

  | Risk | Mitigation |
  |------|-----------|
  | Orchestration function doesn't exist or has changed signature | Verify function existence and signature in Phase 1 before calling it. If signature differs from expected, adjust parameters based on actual interface. |
  | Content generation fails (LLM API error) | The orchestration function includes error handling and retry logic with exponential backoff (max 3 retries). If retries exhaust, function will raise an exception with clear error message. |
  | Generated prose fails validation (wrong sentence count) | The orchestration function validates sentence count and regenerates if needed (up to 3 attempts). This ensures output compliance. |
  | File encoding issues (BOM, CRLF line endings) | The orchestration function writes files with UTF-8 encoding and POSIX conventions. Python's text mode (encoding='utf-8') handles this automatically. Validation function checks encoding compliance. |
  | Git operations fail (add/commit/push) | The orchestration function captures git error output and raises exceptions on failure. Error messages include actual git output for debugging. |
  | Feature branch doesn't exist or is stale | Git operations will fail if branch doesn't exist, exposing the issue clearly. The worktree environment ensures branch exists and is properly initialized. |
  | Claude API credentials not available | Sheep platform's `sheep.config.llm` reads ANTHROPIC_API_KEY from environment. If credentials missing, LLM calls will fail with clear error message. |

  ## Summary

  Feature 295 leverages proven infrastructure from features 289-294, eliminating technical risk
  and implementation complexity. The single orchestration function call encapsulates all
  workflow steps: content generation with validation and retry logic, file creation with
  proper encoding, comprehensive validation, and git operations. This approach ensures
  consistency, reduces defect risk, and minimizes code duplication across the 289+ feature
  series.
