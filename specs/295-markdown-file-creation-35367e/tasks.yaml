content: |
  ## Summary

  Feature 295 implementation consists of 3 tasks organized across 3 sequential phases:

  ### Phase 1: Setup & Verification

  Task 1 verifies that the proven orchestration function `sheep.content_generators.create_markdown_file()`
  exists and is importable, establishing that we have the necessary infrastructure to execute the feature.
  This task imports the function, confirms it is callable, and documents the expected interface.

  ### Phase 2: Execution

  Task 2 executes markdown file creation by calling the orchestration function with correct parameters
  (filename='test-ydhh74.md', feature_number=295). The orchestration function handles the complete
  workflow: content generation via Claude API, file creation with UTF-8 encoding, comprehensive
  validation (H1 heading, blank line, 2-3 sentences), and git operations (add, commit, push).

  ### Phase 3: Validation

  Task 3 validates all 9 success criteria by executing comprehensive tests:

  - **File Structure (3 criteria):** H1 heading present, blank line separator, exactly 2-3 sentences
  - **Content Quality (1 criterion):** Prose is grammatically correct and semantically coherent
  - **Encoding Compliance (3 criteria):** UTF-8 encoding (no BOM), LF line endings, trailing newline
  - **Validation Pass (1 criterion):** File passes src/create_markdown.py:validate_content()
  - **Git Operations (3 criteria):** File staged, commit message exact, pushed to feature branch

  ### Task Dependencies and Execution Order

  All tasks are sequential because later tasks depend on earlier ones:
  - Task 2 (execution) depends on Task 1 (verification)
  - Task 3 (validation) depends on Task 2 (execution)

  Within Phase 3, Task 3 includes multiple independent validation checks (file structure, encoding,
  git operations) that can be validated in parallel once Task 2 completes.

  ### Implementation Approach

  The implementation leverages the established pattern from features 289-294, which successfully
  used this exact orchestration function with 100% success rate. No new code is written — the
  orchestration function encapsulates all complexity:

  - **Content Generation:** Claude API call with automatic validation and retry logic (max 3 retries)
  - **File Creation:** pathlib-based UTF-8 writing with POSIX compliance (no BOM, LF endings, trailing newline)
  - **Validation:** Lightweight checks (H1 heading, blank line, sentence count, encoding)
  - **Git Operations:** subprocess-based add/commit/push with proper error handling

  This approach ensures consistency across the 289+ feature series, minimizes implementation code
  (single function call vs 50+ lines), and reduces defect risk by avoiding code duplication.

  ### Total Effort

  - Task 1 (Verification): 15 minutes
  - Task 2 (Execution): 30 minutes
  - Task 3 (Validation): 45 minutes
  - **Total: 1.5 hours** (includes planning, execution, validation, and git operations)

  The time estimate reflects the straightforward nature of the task. Within the Sheep platform context,
  this feature demonstrates the platform's capability to consistently execute the same automation
  pattern across 289+ identical features with minimal variation and maximum consistency.
