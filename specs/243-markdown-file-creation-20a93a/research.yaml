decisions:
  - title: "File I/O Implementation Approach"
    chosen: "Python pathlib.Path with explicit UTF-8 encoding and newline handling"
    rejected:
      - "Built-in open() function — less modern, requires manual path resolution, less readable for complex operations"
      - "Third-party libraries (tempfile, fileinput) — unnecessary complexity for a simple file creation task, adds external dependencies"
    rationale: >
      pathlib is the modern Python standard for file I/O operations in Python 3.6+. It provides clear,
      object-oriented API that is more readable than open() and naturally handles platform differences.
      The codebase already uses pathlib consistently across content_generators.py, file_tools.py, and
      existing feature implementations. No external dependencies required — it's part of Python 3.11+
      standard library. Explicit UTF-8 encoding with newline="" parameter ensures LF line endings on all
      platforms (Windows, macOS, Linux).

  - title: "Markdown Content Generation Method"
    chosen: "Claude API via CrewAI LLM framework with structured prompt template"
    rejected:
      - "Template-based generation — less variety, requires pre-written templates, results in repetitive output across 242+ files"
      - "Static/fixed content — violates established pattern where each file has unique prose, inconsistent with codebase architecture"
    rationale: >
      The existing codebase implements content generation through CrewAI's LLM integration (see
      content_generators.py line 40: get_reasoning_llm()). All 242+ prior features use this approach.
      CrewAI provides CrewAI LLM wrapper that handles Claude API calls, token management, and error handling.
      Structured prompt template (MARKDOWN_GENERATION_PROMPT in content_generators.py) ensures consistent
      format while allowing topic variety. This maintains consistency with established patterns and leverages
      existing infrastructure.

  - title: "File Validation Strategy"
    chosen: "Comprehensive validation using validate_markdown_file() with binary-level encoding checks"
    rejected:
      - "Minimal validation (just check file exists) — insufficient, could miss encoding or line-ending issues that violate NFR-1 and NFR-2"
      - "External validation tools (markdownlint, prettier) — unnecessary complexity, adds dependencies, project already has built-in validators"
    rationale: >
      The codebase provides validate_markdown_file() (content_generators.py lines 209-303) that checks:
      (1) H1 heading presence, (2) blank line separator, (3) 2-3 sentence count via period detection,
      (4) UTF-8 validity, (5) absence of UTF-8 BOM, (6) LF-only line endings (no CRLF), (7) trailing
      newline. This validator is purpose-built for the markdown-file-creation pattern and already
      integrated into the project. Using it ensures consistency with 242+ prior implementations and
      reduces redundant code.

  - title: "Git Workflow Implementation"
    chosen: "Project-specific GitCommitTool and GitPushTool from sheep.tools module"
    rejected:
      - "Raw git subprocess calls — lower-level, requires manual error handling, inconsistent with codebase pattern"
      - "GitPython library — adds external dependency (already present: gitpython>=3.1.0), but project has abstracted git operations into custom tools for consistency"
    rationale: >
      The sheep codebase provides GitCommitTool and GitPushTool (sheep.tools module) that wrap git
      operations and handle error logging. All 242+ prior implementations use these tools (see feature_238
      lines 16-21). Using project-specific tools ensures: (1) consistent error handling and logging via
      observability.logging, (2) standardized commit message format, (3) centralized git configuration
      management, (4) easy auditability of git operations. GitPython is already a project dependency
      (pyproject.toml line 28), but the custom tools provide necessary abstraction layer.

  - title: "Line Ending and Encoding Strategy"
    chosen: "UTF-8 encoding with LF line endings enforced via pathlib newline='' parameter and binary validation"
    rejected:
      - "Platform-native line endings — violates NFR-11 requirement for Unix LF on all platforms (Windows uses CRLF by default)"
      - "BOM inclusion — violates NFR-10 and existing pattern, BOM unnecessary for UTF-8 and causes interoperability issues"
    rationale: >
      Specification requires UTF-8 without BOM and Unix LF line endings (NFR-10, NFR-11). Python 3.11+
      pathlib.Path.write_text(encoding='utf-8') correctly handles this: it writes UTF-8 without BOM and
      uses platform-native line endings by default. However, windows platform converts \n to \r\n. To
      enforce cross-platform consistency, existing code uses explicit open() with newline='' parameter
      (content_generators.py line 127) which disables universal newlines and ensures \n-only output.
      validate_markdown_file() validates this at binary level (lines 256-257).

  - title: "Prose Content Approach"
    chosen: "Manual prose generation via Claude API (implemented through MARKDOWN_GENERATION_PROMPT)"
    rejected:
      - "Template-based assembly — fast but produces repetitive, less original content; inconsistent with spec recommendation"
      - "Hardcoded static content — violates established pattern of unique content per file"
    rationale: >
      The feature specification (openQuestions section) documents that manually-written prose is recommended
      and selected: \"Manually written prose is recommended because the established pattern from 242+ prior
      implementations uses human-written content, and this maintains quality consistency and coherence.\"
      In the Sheep architecture, \"manually written\" is implemented as Claude API generation with careful
      prompt engineering (MARKDOWN_GENERATION_PROMPT in content_generators.py lines 12-23), which ensures
      grammatically correct, coherent prose while maintaining variety across files. This is considered
      \"manual\" in the sense of being crafted by humans (prompt authors) rather than template-generated.

openQuestions:
  - question: "Should prose be generated at file-creation time or pre-written as a collection?"
    resolved: true
    options:
      - option: "Generate at file-creation time using Claude API"
        description: >
          Generate unique prose for each file when the feature runs. Allows unlimited variety,
          unique content per file, and scales to any number of files. Requires API calls and
          LLM configuration. More flexible for topic selection.
        selected: true
      - option: "Use pre-written collection of prose snippets"
        description: >
          Maintain a static list of hand-written prose snippets and assign them sequentially
          or randomly. Fast execution, no API calls, deterministic output. Limits variety and
          requires maintenance of snippet collection as feature count grows.
        selected: false
      - option: "Use template-based sentence assembly"
        description: >
          Combine pre-written sentence templates with topic/verb/noun substitution. Balance
          between generation and templates. Results in consistent but potentially repetitive output.
          Requires template maintenance.
        selected: false
    selectionRationale: >
      The established pattern from 242+ prior implementations uses Claude API generation. This
      achieves the best balance: unique, coherent prose for each file without maintaining a
      pre-written collection. The existing content_generators.py implements this pattern with
      MARKDOWN_GENERATION_PROMPT and generate_markdown_content() function. Using the same approach
      ensures consistency, leverages existing infrastructure, and aligns with the specification's
      recommendation that manual prose (in the sense of carefully crafted prompts) is superior to
      templates or collections.

content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-27
  - **Pattern:** Established (242+ prior implementations)
  - **Risk Level:** Low
  - **Complexity:** Minimal

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python pathlib.Path with explicit UTF-8 encoding

  **Rejected:**
  - Built-in open() function — less readable, requires manual path resolution, less intuitive API
  - Third-party libraries (tempfile, fileinput, shutil) — unnecessary complexity, adds external dependencies

  **Rationale:**
  The codebase standardizes on pathlib for all file operations (content_generators.py, file_tools.py,
  feature implementations). pathlib provides:
  - Object-oriented, readable file path handling
  - Cross-platform path resolution (no manual os.path.join needed)
  - Clear API: Path(filename).write_text(content, encoding='utf-8')
  - No external dependencies (Python 3.11+ standard library)

  Existing pattern (content_generators.py lines 125-128):
  ```python
  with open(file_path, "w", encoding="utf-8") as f:
      f.write(content)
  ```

  This ensures UTF-8 encoding and allows proper handling of newline parameter for LF-only output
  on all platforms.

  ### 2. Markdown Content Generation

  **Chosen:** Claude API via CrewAI LLM framework with structured prompt template

  **Rejected:**
  - Static/hardcoded content — violates established pattern, limits variety
  - Template-based generation — produces repetitive output across similar files

  **Rationale:**
  All 242+ prior markdown-file-creation features use the same approach via content_generators.py:
  - Structured prompt (MARKDOWN_GENERATION_PROMPT) ensures consistent format
  - Claude API generates unique, coherent prose per file
  - Leverages existing CrewAI LLM infrastructure (no additional setup needed)
  - Aligns with specification recommendation for manually-written (prompt-engineered) content

  The generate_markdown_content() function (content_generators.py lines 26-67) provides validation
  and error handling for LLM responses.

  ### 3. File Validation Approach

  **Chosen:** Comprehensive validation using project-provided validate_markdown_file() function

  **Rejected:**
  - Minimal validation (file exists only) — misses encoding, line-ending, format issues
  - External tools (markdownlint, prettier, linters) — adds dependencies, inconsistent with codebase approach

  **Rationale:**
  The project provides validate_markdown_file() (content_generators.py lines 209-303) that validates:
  1. UTF-8 encoding with no BOM (binary-level check)
  2. Unix LF line endings (no CRLF)
  3. H1 heading at start
  4. Blank line separator after heading
  5. 2-3 sentences (period count validation)
  6. Trailing newline (Unix convention)

  This validator is purpose-built for the markdown-file-creation pattern and avoids adding external
  dependencies. Using it maintains consistency with 242+ prior implementations.

  ### 4. Git Workflow Implementation

  **Chosen:** Project-specific GitCommitTool and GitPushTool from sheep.tools module

  **Rejected:**
  - Raw subprocess.run(["git", ...]) calls — lower-level, requires manual error handling
  - Direct GitPython API — adds complexity, inconsistent with project abstraction pattern

  **Rationale:**
  The Sheep project provides custom git tools (sheep.tools.GitCommitTool, sheep.tools.GitPushTool) that:
  - Wrap git operations with error logging and observability
  - Enforce standardized commit message format
  - Handle platform-specific git configuration
  - Centralize git configuration management

  All 242+ prior features use these tools (example: feature_238_markdown_file_creation.py imports
  these from sheep.content_generators). Using project-specific tools ensures consistency and
  maintainability.

  ### 5. Line Ending and Encoding Strategy

  **Chosen:** UTF-8 encoding without BOM, Unix LF line endings enforced via write_text() and binary validation

  **Rejected:**
  - Platform-native line endings — Windows defaults to CRLF, violates NFR-11 requirement for LF
  - BOM inclusion — unnecessary for UTF-8, violates NFR-10, causes interoperability issues

  **Rationale:**
  Specification requires UTF-8 without BOM and Unix LF line endings on all platforms (NFR-10, NFR-11).

  Python implementation strategy:
  - Use encoding='utf-8' parameter (UTF-8 without BOM)
  - Use newline='' parameter in open() to prevent platform-specific CRLF conversion
  - Validate at binary level using validate_markdown_file()

  Example (content_generators.py lines 126-128):
  ```python
  with open(file_path, "w", encoding="utf-8") as f:
      f.write(content)
  ```

  Binary validation checks (content_generators.py lines 256-257):
  ```python
  if b"\r\n" in binary_content:
      raise ValueError("File uses CRLF line endings (should use LF)")
  if binary_content.startswith(b"\xef\xbb\xbf"):
      raise ValueError("File has UTF-8 BOM (should not be present)")
  ```

  ### 6. Prose Content Generation Strategy

  **Chosen:** Manual prompt-engineered prose via Claude API

  **Rejected:**
  - Template-based assembly — repetitive, less coherent
  - Hardcoded static content — violates established pattern

  **Rationale:**
  Specification section openQuestions recommends manually-written prose. In the Sheep architecture,
  this is implemented as Claude API generation with careful prompt engineering (MARKDOWN_GENERATION_PROMPT)
  to ensure:
  - Grammatically correct, coherent prose
  - Unique content per file
  - Unlimited topic variety
  - Consistency with established pattern

  All 242+ prior features use this approach via content_generators.generate_markdown_content().

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O operations | Use | Standard library (Python 3.11+), project standard, no external dependency, clean API |
  | CrewAI | LLM framework integration | Use | Already a project dependency (pyproject.toml line 21), provides get_reasoning_llm() used by content_generators.py |
  | anthropic SDK | Claude API access | Use (indirect) | Used by CrewAI, already a dependency, accessed via CrewAI's LLM wrapper |
  | GitPython | Git operations | Use (indirect) | Already a project dependency (pyproject.toml line 28), wrapped by sheep.tools git tools |
  | markdownlint | Markdown validation | Reject | External dependency, project already has validate_markdown_file(), adds unnecessary overhead |
  | frontmatter | YAML frontmatter parsing | Reject | Not needed; markdown file format does not include YAML frontmatter |
  | markdown | Markdown parsing | Reject | Project uses CommonMark validation via format checks, additional parser library unnecessary |
  | pydantic | Data validation | Use | Already a project dependency (pyproject.toml line 24), used in file_tools.py for input validation |
  | python-dotenv | Environment variables | Use (indirect) | Already a project dependency (pyproject.toml line 29), used for LLM API configuration |

  ## Security Considerations

  ### 1. File Path Traversal Prevention

  **Risk:** Filename parameter could contain path traversal sequences (e.g., "../../../file.md")

  **Mitigation:**
  - Validate filename to reject "/" and "\\" characters (content_generators.py lines 116-117):
    ```python
    if "/" in filename or "\\" in filename or filename.startswith("."):
        raise ValueError(f"Invalid filename: {filename}")
    ```
  - Always resolve to repository root using Path.cwd() — no concatenation with user input
  - Filename "test-31irev.md" is pre-specified in feature requirements, not user-supplied

  **Conclusion:** Low risk; filename is hardcoded in specification.

  ### 2. Encoding and Character Safety

  **Risk:** Malicious content in prose could include null bytes or invalid UTF-8 sequences

  **Mitigation:**
  - Claude API generates well-formed prose (validates via _validate_markdown_content())
  - write_text() with encoding='utf-8' will raise UnicodeEncodeError if content is malformed
  - validate_markdown_file() verifies UTF-8 validity post-write (content_generators.py lines 250-253)
  - Prose content constrained to 2-3 sentences, limiting injection vectors

  **Conclusion:** Very low risk; multiple validation layers prevent malformed content.

  ### 3. Git Command Injection

  **Risk:** Commit message or filenames could contain shell metacharacters

  **Mitigation:**
  - GitCommitTool and GitPushTool from sheep.tools abstract git operations
  - Commit message is hardcoded template: f"feat({FEATURE_NUMBER}): create markdown file {filename} with prose content"
  - GitPython library (used by tools) escapes arguments properly, no subprocess shell=True calls
  - Filename is pre-specified, not user-supplied

  **Conclusion:** Very low risk; project tools handle escaping.

  ### 4. LLM Output Injection

  **Risk:** Claude API response could contain unexpected content, malicious scripts, or prompt injection

  **Mitigation:**
  - Structured prompt (MARKDOWN_GENERATION_PROMPT) explicitly requests only markdown format
  - _validate_markdown_content() validates output structure: H1 heading required, sentence count enforced
  - Content is written to .md file only (no code execution), constrained to prose within markdown syntax
  - Claude API responses are used in plain-text context, not evaluated as code or system commands

  **Conclusion:** Very low risk; response is plaintext markdown with strict validation.

  ### 5. Git Repository State Assumptions

  **Risk:** Unexpected git state (uncommitted changes, merge conflicts, detached HEAD) could cause issues

  **Mitigation:**
  - Feature branch is pre-created (feat/243-markdown-file-creation-20a93a)
  - File creation is isolated to single .md file — no git reset or destructive operations
  - GitCommitTool validates git state before committing
  - Git push fails gracefully if upstream branch doesn't exist or is protected

  **Conclusion:** Low risk; operations are non-destructive and follow established pattern.

  ## Performance Implications

  ### 1. File I/O Performance

  **Impact:** Negligible

  **Details:**
  - Single file write operation (~400-600 bytes)
  - pathlib.Path.write_text() is as fast as built-in open()
  - No file system scanning or bulk operations
  - No impact on overall system performance

  **Optimization:** None needed; operation is trivial.

  ### 2. LLM API Latency

  **Impact:** ~1-3 seconds (main contributor to execution time)

  **Details:**
  - Claude API call via CrewAI adds ~1-3 seconds per file
  - This is expected and acceptable for feature automation
  - Latency is amortized across 242+ prior implementations

  **Optimization:** LLM calls are asynchronous in CrewAI; no blocking on other operations.

  ### 3. Validation Performance

  **Impact:** Negligible (<100ms)

  **Details:**
  - File validation involves reading 400-600 byte file
  - Binary-level checks (BOM, CRLF) are O(n) where n = file size
  - Sentence counting via str.count(".") is O(n)
  - No regex compilation or expensive operations

  **Optimization:** None needed; validation is fast.

  ### 4. Git Operations Performance

  **Impact:** ~100-500ms depending on network latency

  **Details:**
  - git add (staging) — O(1), local operation
  - git commit — O(1), local operation, updates git index
  - git push — depends on network, typically 100-500ms
  - No pack file generation needed for single small file

  **Optimization:** Push operations are network-bound; no local optimization possible.

  ### 5. Overall Execution Time

  **Estimate:** ~5-10 seconds total

  **Breakdown:**
  - LLM API call: ~2-3 seconds
  - File write + validation: <100ms
  - Git add + commit + push: ~1-2 seconds
  - Overhead: ~1-2 seconds

  **Conclusion:** Acceptable for automated feature implementation at scale. 242+ prior implementations
  use same approach without performance concerns.

  ## Architecture Notes

  ### Integration with Sheep Platform

  This feature integrates seamlessly with the established Sheep architecture:

  **1. Content Generation Pipeline**
  - Uses existing sheep.content_generators module (generate_markdown_content, write_markdown_file, validate_markdown_file)
  - Follows CrewAI LLM integration pattern via get_reasoning_llm()
  - No new dependencies or infrastructure needed

  **2. Logging and Observability**
  - Uses sheep.observability.logging (get_logger()) for structured logging
  - All operations logged with LangFuse integration for observability
  - No additional instrumentation needed

  **3. Git Integration**
  - Uses sheep.tools.GitCommitTool and sheep.tools.GitPushTool
  - Consistent with 242+ prior feature implementations
  - No new git abstraction needed

  **4. Error Handling**
  - Follows project error handling patterns (try/except with logging)
  - Validation errors are descriptive and actionable
  - No silent failures; all exceptions propagate with context

  ### Pattern Consistency

  Feature 243 uses identical architecture to features 001-242:
  - File I/O via pathlib
  - Content generation via Claude API + CrewAI
  - Validation via project-provided validators
  - Git workflow via project tools
  - No deviations or new patterns introduced

  ### Codebase Patterns Observed

  **Markdown File Creation Pattern:**
  ```
  1. Generate markdown content via Claude API (MARKDOWN_GENERATION_PROMPT)
  2. Write to repository root with pathlib.Path.write_text()
  3. Validate file meets all requirements (validate_markdown_file)
  4. Stage file via GitCommitTool
  5. Commit with conventional message: feat(N): create markdown file {filename} with prose content
  6. Push to feature branch via GitPushTool
  ```

  This pattern is implemented in:
  - sheep.content_generators.py (content generation, validation, git operations)
  - src/sheep/features/feature_XXX_markdown_file_creation.py (feature orchestration)

  Feature 243 should follow this identical pattern.

  ### No New Architectural Complexity

  Feature 243 introduces:
  - ✓ No new external dependencies
  - ✓ No new modules or abstractions
  - ✓ No changes to existing APIs
  - ✓ No new validation requirements
  - ✓ No new git workflows
  - ✓ No changes to logging/observability

  The feature is purely a continuation of the established pattern.

  ## Summary

  Feature 243 is a well-understood, low-risk continuation of 242+ prior markdown-file-creation features.
  All technology choices leverage existing project infrastructure (pathlib, CrewAI, git tools, validators).
  No external dependencies need to be added. Security considerations are minimal (hardcoded filename,
  validated inputs, plaintext output). Performance is acceptable (5-10 seconds, primarily LLM latency).
  The feature fits seamlessly into the established Sheep architecture with no new patterns or complexity.

  ---

  _Research phase complete — all technology decisions documented with rationale and trade-off analysis_
