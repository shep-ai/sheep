content: |
  ## Architecture Overview

  Feature 243 is a continuation of the markdown-file-creation pattern established across 242+
  prior features in the Sheep automated implementation platform. The implementation integrates
  three core subsystems:

  1. **Content Generation via Claude API** — Uses CrewAI's LLM framework to generate unique,
     grammatically correct prose. The existing MARKDOWN_GENERATION_PROMPT template in
     content_generators.py ensures consistent formatting while allowing topic variety.

  2. **File I/O and Validation** — Uses Python pathlib for cross-platform file writing with
     explicit UTF-8 encoding and LF line ending enforcement. The project-provided
     validate_markdown_file() function performs comprehensive checks: H1 heading presence, blank
     line separator, sentence count (2-3), UTF-8 encoding, BOM absence, Unix line endings, and
     trailing newline compliance.

  3. **Git Integration** — Uses sheep.tools.GitCommitTool and GitPushTool to stage, commit, and
     push changes. These custom tools provide centralized error handling, standardized conventional
     commit format enforcement, and observability integration.

  The feature is non-invasive (creates only one .md file at repository root), introduces no new
  dependencies or architectural patterns beyond what's already established in features 001-242,
  and leverages existing project infrastructure with no modifications required.

  ## Key Design Decisions

  ### 1. Content Generation via Claude API Through CrewAI

  **Decision:** Use Claude API through CrewAI's LLM framework with MARKDOWN_GENERATION_PROMPT
  template for content generation

  **Alternatives Considered:**
  - Template-based generation with sentence assembly — rejected because it produces repetitive,
    less original output across similar files
  - Static/hardcoded content — rejected because it violates the established pattern of unique
    prose content per file
  - Pre-written prose collection — rejected because it requires ongoing maintenance as feature
    count grows to 243+

  **Rationale:** The specification (section openQuestions, selectionRationale) recommends
  manually-written prose. In the Sheep architecture, this is implemented as Claude API generation
  with careful prompt engineering. This approach:
  - Leverages existing CrewAI LLM infrastructure (no new setup needed)
  - Maintains consistency with all 242+ prior implementations
  - Provides unique, coherent prose for each file
  - Avoids template maintenance burden
  - Allows unlimited topic variety
  - Ensures grammatical correctness via structured prompt template

  **Implementation Details:** Reuse existing sheep.content_generators.generate_markdown_content()
  function which handles CrewAI LLM integration, validates output structure via
  _validate_markdown_content(), and handles errors with logging.

  ### 2. File I/O with Explicit UTF-8 Encoding and LF Enforcement

  **Decision:** Use Python pathlib.Path with encoding='utf-8' parameter for file writing

  **Alternatives Considered:**
  - Built-in open() function — rejected because pathlib provides cleaner, more readable
    object-oriented API
  - Third-party file libraries (tempfile, shutil) — rejected as unnecessary complexity

  **Rationale:** pathlib is the modern Python standard (Python 3.6+) and the established
  codebase standard (used across content_generators.py, file_tools.py, and all prior feature
  implementations). pathlib provides:
  - Object-oriented file path handling
  - Cross-platform path resolution (avoids os.path.join complexity)
  - Clear, readable API: Path(filename).write_text(content, encoding='utf-8')
  - No external dependencies (part of Python 3.11+ standard library)
  - Proper UTF-8 encoding without BOM
  - Unix LF line ending preservation (validated via validate_markdown_file() binary checks)

  **Implementation Details:** Use Path("test-31irev.md").write_text(content, encoding='utf-8')
  to write generated content with UTF-8 encoding. Binary-level validation in validate_markdown_file()
  ensures LF-only line endings and BOM absence on all platforms.

  ### 3. Comprehensive File Validation Using Project-Provided Function

  **Decision:** Use sheep.content_generators.validate_markdown_file() for all validation

  **Alternatives Considered:**
  - Minimal validation (file exists only) — rejected because it misses encoding, line-ending,
    and structural issues that violate NFR requirements
  - External tools (markdownlint, prettier, linters) — rejected because project has built-in
    validators and adding tools introduces unnecessary external dependencies

  **Rationale:** The Sheep platform provides validate_markdown_file() (content_generators.py
  lines 209-303) which is purpose-built for the markdown-file-creation pattern. It checks:
  - UTF-8 encoding validity with no byte order mark (BOM)
  - Unix LF line endings (binary-level check for absence of CRLF)
  - H1 heading presence at start of file
  - Blank line separator between heading and prose
  - Exactly 2-3 sentences (validated via period counting)
  - Trailing newline (Unix convention)

  Using the built-in validator:
  - Avoids adding external dependencies
  - Maintains consistency with 242+ prior implementations
  - Provides comprehensive validation coverage meeting all NFR requirements
  - Reuses tested, proven code rather than reinventing validation

  **Implementation Details:** Call sheep.content_generators.validate_markdown_file('test-31irev.md')
  after file write. Function raises ValueError with descriptive message if any check fails,
  preventing promotion of invalid files to git.

  ### 4. Git Integration Using Project-Specific Tools

  **Decision:** Use sheep.tools.GitCommitTool and GitPushTool from project codebase

  **Alternatives Considered:**
  - Raw subprocess.run() calls with git commands — rejected because it requires manual error
    handling and is inconsistent with codebase patterns
  - Direct GitPython API calls — rejected because project has abstracted git operations for
    consistency and centralized configuration

  **Rationale:** The Sheep platform provides custom git tools (GitCommitTool, GitPushTool)
  in sheep.tools module that wrap GitPython with:
  - Error logging and observability integration via sheep.observability.logging
  - Standardized conventional commit message format enforcement
  - Centralized git configuration management
  - Clear error messages for failure cases

  All 242+ prior implementations use these tools (see feature_238_markdown_file_creation.py
  examples). Using project-specific tools ensures:
  - Consistent error handling across all features
  - Standardized commit format enforcement
  - Easy auditability of git operations
  - Centralized configuration

  **Implementation Details:**
  - GitCommitTool: stages file with git add and creates commit with message "feat(243):
    create markdown file test-31irev.md with prose content"
  - GitPushTool: pushes commit to feature branch feat/243-markdown-file-creation-20a93a with
    error handling for network/auth failures

  ## Implementation Strategy

  The feature implementation is organized into two sequential phases, each with clear dependencies:

  **Phase 1: Content Generation and Validation**
  This phase produces a validated markdown file ready for git integration. The phase includes:
  1. Generate markdown content using Claude API (2-3 minutes including LLM latency)
  2. Write file to repository root with UTF-8 encoding and proper line endings (<1 minute)
  3. Validate file structure, encoding, and requirements (quick binary checks, <1 minute)

  Phase 1 gates git integration: file must pass all validation checks before staging.

  **Phase 2: Git Integration and Delivery**
  This phase delivers the validated file to the feature branch. The phase includes:
  1. Stage file with git add (trivial, <1 minute)
  2. Create conventional commit with standardized message (trivial, <1 minute)
  3. Push commit to feature branch with error handling (1-2 minutes network latency)

  Phase 2 depends entirely on Phase 1 success.

  **Rationale for Phase Ordering:**
  - Content generation and validation must precede git integration to ensure quality
  - File validation catches encoding/format issues before version control
  - Sequential phases leverage established patterns and require no coordination
  - Each phase has clear success criteria before proceeding to next

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | **LLM Generation Fails** | Low | generate_markdown_content() includes try-catch error handling. If Claude API fails, exception propagates with clear error message and is logged via observability.logging. Failure prevents file creation. |
  | **File Encoding Issues (CRLF/BOM)** | Very Low | validate_markdown_file() performs explicit binary-level checks for both issues (content_generators.py lines 256-257). If detected, raises ValueError immediately. This catches platform-specific encoding problems early. |
  | **Git Operations Fail** | Very Low | GitCommitTool and GitPushTool wrap git operations with try-catch and descriptive error messages. Failures include root cause (e.g., \"branch not found\", \"auth failed\"). Operations fail fast and don't silently succeed. |
  | **File Already Exists** | Very Low | Not a risk for test-31irev.md because filename is unique and differs from all 242+ prior test files. If overwrite occurs (e.g., feature re-run), pathlib.Path.write_text() overwrites existing files without warning. This is intentional behavior for idempotency. |
  | **Malformed Prose Content** | Very Low | _validate_markdown_content() checks LLM output structure at generation time (H1 heading required, sentence count validated). Invalid output is rejected before file write, preventing invalid files from reaching disk. |
  | **Feature Branch Not Found** | Very Low | Feature branch is pre-created and specified (feat/243-markdown-file-creation-20a93a). If branch doesn't exist, git push fails with clear error message \"branch not found\". This indicates setup issue, not feature code issue. |
  | **Encoding Validation Disabled** | Very Low | validate_markdown_file() is mandatory part of Phase 1 completion. If validation is skipped, file proceeds to git with potential encoding issues. Mitigation: test suite verifies validate_markdown_file() is always called. |

  ## Success Criteria

  Feature 243 is complete when:
  1. File test-31irev.md exists at repository root with correct content
  2. File contains valid UTF-8 without BOM and Unix LF line endings
  3. File structure: H1 heading, blank line, 2-3 sentences
  4. File size is 400-600 bytes (natural outcome of proper structure)
  5. File is staged and committed with conventional message to feature branch
  6. Commit is pushed to feat/243-markdown-file-creation-20a93a
  7. No other files are modified
  8. Implementation uses only existing project infrastructure (no new dependencies)

  ---

  _Planning phase complete — architecture, design decisions, and implementation strategy defined_
