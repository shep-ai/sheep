content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-31irev.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 195+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 001-242, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 195+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability) for the CrewAI-based automation platform
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/243-markdown-file-creation-20a93a/)
  - **tests/**: Test suite for the application
  - **.github/**: GitHub workflows and CI/CD configuration
  - **pyproject.toml**: Python project configuration (dependencies, build system, tools)
  - **README.md**: Comprehensive project documentation for Sheep platform
  - **Dockerfile**: Container configuration for the platform

  The test markdown files at the repository root are validation artifacts of the markdown-file-creation
  feature pattern and do not form part of the application source code. They serve as test cases for
  the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (195+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows consistent structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without byte order mark (BOM), LF line endings
  - File size typically 400-600 bytes (natural outcome of proper heading and prose structure)
  - Implementation uses straightforward imperative code (create content string, write to file)
  - Files are isolated test artifacts with no dependencies on application source code
  - Diverse topics observed across existing test files (nature, technology, science, history, culture, philosophy, etc.)

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/243-markdown-file-creation-20a93a`
  - Create/modify files in working directory
  - Stage with `git add test-31irev.md`
  - Commit with conventional commit format: `feat(243): create markdown file test-31irev.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (observed in features 001-242):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, configuration changes, or documentation updates
  - Single-file operations with straightforward I/O
  - Each feature is identical in structure and requirements
  - Implementation methodology is consistent across all 242+ prior iterations

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (e.g., Path("test-31irev.md").write_text())
  - **Git**: Version control system for file staging, commits, and branch push operations
  - **Markdown syntax**: Simple format with heading (#) and prose content per CommonMark specification
  - **CrewAI**: Framework used by Sheep platform for agent-based automation (not directly relevant to this file creation task)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-31irev.md) to existing collection of 195+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-242; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, tools, or observability |

  ## Dependencies

  - **Git repository**: Feature branch `feat/243-markdown-file-creation-20a93a` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 195+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-31irev.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 195+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (001-242) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-31irev.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 242+ prior implementations

