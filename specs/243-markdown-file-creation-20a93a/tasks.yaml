content: |
  ## Summary

  Feature 243 implementation is broken into 5 sequential tasks across 2 phases, with strict
  dependencies ensuring correct execution order:

  **Phase 1: Content Generation and Validation (Tasks 1-3)**
  Task 1 generates unique prose via Claude API (reuses existing generate_markdown_content()
  function). Task 2 writes the validated content to disk using pathlib with UTF-8 encoding.
  Task 3 validates the file using the project's validate_markdown_file() function, ensuring
  all structural, encoding, and formatting requirements are met before git integration.

  Phase 1 gates Phase 2: file must pass all validation checks before any git operations.

  **Phase 2: Git Integration and Delivery (Tasks 4-5)**
  Task 4 stages the validated file and creates a conventional commit using GitCommitTool.
  Task 5 pushes the commit to the feature branch using GitPushTool, completing feature delivery.

  Both phases depend entirely on previous tasks succeeding. Task dependency graph is linear:
  task-1 → task-2 → task-3 → task-4 → task-5

  **Implementation Approach**
  All tasks follow TDD cycles (RED-GREEN-REFACTOR):
  - RED: Write test asserting desired behavior
  - GREEN: Implement minimal code to pass test
  - REFACTOR: Clean up and improve implementation

  Each task leverages existing project infrastructure:
  - Task 1-3: Reuse sheep.content_generators functions
  - Task 4-5: Reuse sheep.tools git integration tools

  No new modules, functions, or dependencies are introduced.

  **Effort Breakdown**
  - Task 1: 5m (2-3m is LLM API latency, unavoidable)
  - Task 2: 1m (trivial pathlib operation)
  - Task 3: 2m (validation function call and checks)
  - Task 4: 3m (git staging and commit)
  - Task 5: 3m (1-2m is network latency, unavoidable)
  - **Total: 14m** of actual development work plus unavoidable LLM and network latency

  **Success Criteria**
  Implementation is complete when:
  1. File test-31irev.md exists at repository root
  2. File contains H1 heading + 2-3 sentences with proper structure
  3. File uses UTF-8 encoding without BOM and Unix LF line endings
  4. File passes validate_markdown_file() checks
  5. File is staged, committed, and pushed to feat/243-markdown-file-creation-20a93a
  6. All tests pass for each task
  7. No modifications to files outside test-31irev.md

  ---

  _Task breakdown complete — ready for implementation phase_
