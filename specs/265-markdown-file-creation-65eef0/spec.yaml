content: |
  ## Problem Statement

  The user requires creation of a single markdown file named test-hvw0ab.md in the repository root. The file
  must contain an H1 markdown heading (title) followed by 2-3 sentences of coherent prose content. This feature
  is part of a continuous series of 265 similar markdown file creation features that validate the platform's
  ability to automate content generation, file management, and git workflows at scale.

  The implementation leverages fully mature infrastructure (content generation utilities, LLM integration,
  git tooling) established through 264 preceding identical features. No new code patterns, infrastructure,
  or architectural changes are required. The feature is straightforward orchestration of existing components
  following the proven workflow pattern from feature_264 and all preceding features.

  ## Success Criteria

  - [ ] File named test-hvw0ab.md created in repository root
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains exactly 2 or exactly 3 sentences of coherent prose content
  - [ ] Markdown structure validation passes (heading present, sentence count accurate)
  - [ ] Generated prose is grammatically correct with no obvious syntax errors
  - [ ] Generated prose is coherent and contextually sensible (not hallucinated or incoherent)
  - [ ] File uses UTF-8 encoding without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\\n) throughout, no CRLF or CR
  - [ ] File ends with trailing newline (POSIX convention compliance)
  - [ ] File is staged to git index, committed, and pushed to remote branch
  - [ ] Commit message exactly matches format: \"feat(265): Create markdown file test-hvw0ab.md with prose content\"
  - [ ] No existing files are read, modified, or deleted during execution
  - [ ] Implementation follows established pattern from feature_264 and preceding features

  ## Functional Requirements

  - **FR-1: Content Generation** — Generate markdown content via CrewAI/Claude API with H1 heading as title and exactly 2 or 3 sentences of prose, following established content generation patterns from preceding features
  - **FR-2: Prose Quality** — Ensure generated prose is coherent, grammatically correct, and contextually sensible; validate for obvious grammatical errors, spelling, and logical consistency before accepting
  - **FR-3: File Creation** — Create single markdown file at repository root with exact filename test-hvw0ab.md
  - **FR-4: Encoding** — Use UTF-8 encoding without BOM (Byte Order Mark) for all file write operations
  - **FR-5: Line Endings** — Use Unix LF (\\n) line endings throughout file; no CRLF or CR line endings
  - **FR-6: POSIX Compliance** — Include trailing newline character at end of file to conform to POSIX conventions
  - **FR-7: Markdown Validation** — Validate markdown structure before committing: verify H1 heading present, sentence count is exactly 2 or 3, grammar and coherence are acceptable
  - **FR-8: Git Staging** — Stage file to git index using git add operation
  - **FR-9: Git Commit** — Commit file with conventional commit message format: \"feat(265): Create markdown file test-hvw0ab.md with prose content\"
  - **FR-10: Git Push** — Push committed file to remote branch using git push
  - **FR-11: Isolation** — Do not read, modify, delete, or otherwise interact with any existing files in the repository except the target test-hvw0ab.md file
  - **FR-12: Idempotency** — If test-hvw0ab.md already exists, overwrite with newly generated content to ensure deterministic behavior
  - **FR-13: Single LLM Attempt** — Attempt LLM-based content generation once; on failure, report clear error immediately without automatic retries

  ## Non-Functional Requirements

  - **NFR-1: Performance** — Complete entire workflow (content generation, file writing, validation, git operations) within 5 minutes
  - **NFR-2: Reliability** — LLM content generation must succeed on first attempt with >95% success rate for acceptable prose quality
  - **NFR-3: Consistency** — Implementation must follow established patterns from feature_264 and all preceding markdown creation features (no deviations or custom logic)
  - **NFR-4: Maintainability** — Reuse existing utilities from content_generators.py for all file operations (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file); no code duplication
  - **NFR-5: Observability** — Log all key operations (generation start, validation results, prose quality checks, git operations) using project logging infrastructure for tracing and debugging
  - **NFR-6: Code Quality** — Follow project conventions, existing code style, and patterns already established in src/sheep/features/; maintain consistency with feature_264 implementation
  - **NFR-7: Error Handling** — Gracefully handle and report errors from LLM generation, file I/O, or git operations with clear error messages; no silent failures

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose quality validation: LLM-based or heuristic-based? | LLM-based validation | Aligns with quality standards (NFR-2 >95% success), matches sophisticated infrastructure already in place, provides comprehensive semantic checking. Latency (<10s) acceptable within 5-minute budget (NFR-1). |
  | 2 | Should prose have topic guidance or free choice? | Free topic selection | Matches user query "about anything", maintains simplicity, aligns with all 264 preceding features. Allows natural language variety while keeping implementation minimal. |
  | 3 | Explicit Claude model or configuration default? | Use configuration default | Maintains consistency with all 264 preceding features, enables centralized model management without code changes, follows software engineering best practices. Maximum flexibility and maintainability. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository follows a modular, layered architecture for automated code implementation:

  - **src/sheep/**: Main source directory
    - **content_generators.py**: Core utilities providing all markdown creation, validation, and git operations
    - **features/**: Feature implementations directory containing individual feature orchestration modules (feature_001.py through feature_264.py)
    - **config/**: Configuration management including LLM initialization (llm.py provides get_reasoning_llm())
    - **observability/**: Structured logging infrastructure (logging.py provides get_logger())
    - **tools/**: Low-level git tools (GitCommitTool, GitPushTool wrapping GitPython)
    - **agents/**, **flows/**: Higher-level orchestration for complex workflows
  - **specs/**: Feature specifications directory (specs/265-markdown-file-creation-65eef0/ contains this analysis)
  - **tests/**: Test suite (pytest framework)
  - **pyproject.toml**: Python project configuration with dependencies and build settings

  ### Architecture Patterns

  **Layered Utility Architecture**: The project follows a clear separation of concerns with reusable utilities:

  1. **Utility Layer** (content_generators.py):
     - `generate_markdown_content()` - LLM-based content generation via Claude API
     - `write_markdown_file()` - File I/O with UTF-8 encoding and Unix LF enforcement
     - `validate_markdown_file()` - Structure and format validation
     - `commit_markdown_file()` - Git staging and conventional commit messages
     - `push_markdown_file()` - Remote push operations
     - Helper functions for extraction and validation

  2. **Feature Layer** (src/sheep/features/feature_NNN_markdown_file_creation.py):
     - Thin orchestration wrapper combining utilities into 5-step workflow
     - Feature-specific metadata (feature number, filename)
     - Clear logging at each step
     - Error handling and result reporting

  3. **Configuration Layer** (src/sheep/config/llm.py):
     - Centralized LLM initialization via CrewAI framework
     - Supports multiple LLM providers (Claude, OpenAI, Google)
     - Environment-based configuration via .env

  4. **Observability Layer** (src/sheep/observability/logging.py):
     - Structured logging with configurable levels
     - Integration with Langfuse for execution tracing

  **Idempotent Workflow Pattern**:
  All 264 preceding features follow an identical 5-step workflow:
  1. Generate content (Claude API via CrewAI)
  2. Write file to disk
  3. Validate structure and properties
  4. Stage and commit with feature-specific message
  5. Push to remote with upstream tracking

  This pattern ensures deterministic, repeatable execution across the entire feature series.

  ### Relevant Technologies

  - **Python 3.11+** - Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **CrewAI 0.86+** - Framework for agentic workflows and LLM orchestration
  - **Anthropic Claude API** - LLM for content generation (via CrewAI wrapper)
  - **GitPython 3.1+** - Git repository operations
  - **Pydantic 2.0+** - Data validation and configuration management
  - **structlog 24.0+** - Structured logging framework
  - **Rich 13.0+** - Terminal formatting and output
  - **typer 0.12+** - CLI framework for command-line interface

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Add feature_265_markdown_file_creation.py following established pattern from feature_264 and others |
  | Repository root | Low | Create single markdown file (test-hvw0ab.md) with ~250-400 bytes of content |
  | Git operations | Low | Stage, commit, and push file as part of standard workflow (no branch creation needed, branch already exists) |

  ## Dependencies

  - **src/sheep/content_generators.py**: Provides reusable utilities:
    - `generate_markdown_content()` - LLM-based content generation via Claude API
    - `write_markdown_file()` - File writing with UTF-8 encoding and Unix LF line endings
    - `validate_markdown_file()` - Markdown structure validation (H1 heading, sentence count, formatting, grammar, coherence)
    - `commit_markdown_file()` - Git commit operations with conventional message format
    - `push_markdown_file()` - Git push operations to remote branch

  - **src/sheep/config/llm.py**: Provides `get_reasoning_llm()` for Claude API access and LLM configuration

  - **src/sheep/observability/logging.py**: Provides structured logger for operation tracing and debugging

  - **GitPython**: Underlying library for git operations (wrapped by content_generators utilities)

  - **CrewAI**: LLM framework for content generation orchestration (wrapped by get_reasoning_llm)

  ## Implementation Notes

  1. **Workflow Pattern**: Follow the proven five-step workflow from feature_264:
     1. Generate markdown content with H1 heading + exactly 2 or 3 sentences via CrewAI/Claude
     2. Write file to repository root with UTF-8 encoding, no BOM, Unix LF line endings
     3. Validate markdown structure + prose quality (heading present, sentence count, grammar, coherence)
     4. Stage and commit file with conventional commit message format
     5. Push to remote branch

  2. **Code Location**: Create src/sheep/features/feature_265_markdown_file_creation.py with thin wrapper that orchestrates content_generators utilities

  3. **Error Scenarios**: Handle gracefully with clear reporting:
     - LLM generation failure: Log error and exit immediately (no retries)
     - File write permission error: Report error with path
     - Git operations failure: Report error with git output
     - Prose quality validation failure: Log details and exit immediately

  4. **Testing Strategy**: Verify:
     - File exists at repository root with correct name
     - File content contains valid H1 heading and exactly 2 or 3 sentences
     - File encoding is UTF-8 without BOM
     - File line endings are Unix LF
     - File has trailing newline
     - Generated prose is grammatically correct and coherent
     - Git commit and push succeed

  ## Size Estimate

  **S** — This is a trivial, single-file creation task with no code changes to existing files, no tests, and no integration required. The entire workflow (content generation, file writing, validation, git operations) can be
  completed in under 1 hour by following the established pattern from 264 preceding identical features.
  The infrastructure and helper utilities are fully in place; implementation is straightforward orchestration
  of existing components.
