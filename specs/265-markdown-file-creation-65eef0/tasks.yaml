content: |
  ## Summary

  Feature 265 implementation follows a straightforward three-task approach across two phases.

  **Phase 1: Feature Module Creation**
  - Task 1: Create the Python module skeleton with proper structure, imports, and constants
  - Task 2: Implement the 5-step orchestration workflow that calls existing utilities

  **Phase 2: Execution and Validation**
  - Task 3: Execute the feature end-to-end and verify all success criteria are met

  The implementation reuses 100% of existing infrastructure (content_generators utilities, LLM
  configuration, logging, git tools). The feature module is ~120 lines of code following the
  exact pattern from feature_264.

  **No separate test code is required.** Validation is integrated into the workflow via
  validate_markdown_file() which performs comprehensive structure, encoding, and line ending
  checks. All success criteria are automatically validated during execution.

  **Key Design Principles:**
  1. Follow feature_264 pattern exactly (proven, tested, 100% success rate across 264 features)
  2. Reuse all existing utilities without modification
  3. Add thin orchestration layer for feature-specific metadata and logging
  4. Use configuration-driven LLM model selection (no hardcoding)
  5. All validation happens automatically via existing validate_markdown_file()

  **Workflow (5 Steps):**
  1. Generate markdown content with H1 heading and 2-3 sentences via Claude API
  2. Write file to repository root with UTF-8 encoding, no BOM, Unix LF line endings
  3. Validate file meets all requirements (structure, encoding, line endings, formatting)
  4. Stage and commit with conventional commit message: \"feat(265): Create markdown file test-hvw0ab.md with prose content\"
  5. Push to remote branch with upstream tracking

  **Effort Estimate: 1 hour**
  - Task 1 (module skeleton): 15 minutes
  - Task 2 (orchestration workflow): 20 minutes
  - Task 3 (execution and validation): 25 minutes
