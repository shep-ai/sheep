content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-dd91rz.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 113+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 123-132, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-dd91rz.md` exists at repository root
  - [ ] File contains exactly one H1 markdown heading (#) as the first element
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses LF (Unix) line endings
  - [ ] File size is between 400-600 bytes
  - [ ] File is staged in git (git add test-dd91rz.md)
  - [ ] File is committed with conventional commit message format: `feat(133): Create markdown file test-dd91rz.md`
  - [ ] Commit is pushed to feature branch `feat/133-markdown-file-creation-a3e3e2`
  - [ ] No modifications to source code files in /src/sheep/
  - [ ] No modifications to configuration files
  - [ ] No modifications to existing test files
  - [ ] Feature branch state matches pattern established by features 123-132

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-dd91rz.md` at repository root
  - **FR-2**: File must contain a markdown H1 heading (#) as the first line, followed by a blank line
  - **FR-3**: File must contain 2-3 sentences of prose content describing any topic
  - **FR-4**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **FR-5**: File must use LF (Unix-style) line endings, not CRLF or CR
  - **FR-6**: Stage the file in git using `git add test-dd91rz.md`
  - **FR-7**: Commit the file with message format: `feat(133): Create markdown file test-dd91rz.md`
  - **FR-8**: Push the commit to remote feature branch `feat/133-markdown-file-creation-a3e3e2`
  - **FR-9**: Implement without modifying any source code in /src/sheep/ or other source directories

  ## Non-Functional Requirements

  - **NFR-1**: File size must be 400-600 bytes (typical for established pattern)
  - **NFR-2**: Implementation must not modify any files outside repository root directory
  - **NFR-3**: Implementation must not create any dependencies on /src/sheep/ source code
  - **NFR-4**: Implementation execution time must be < 1 minute (simple file I/O operation)
  - **NFR-5**: Implementation must follow the exact pattern established by 113+ existing test-*.md files
  - **NFR-6**: Git commit message must follow conventional commit format (feat/fix/docs/etc)
  - **NFR-7**: No modifications to application configuration, testing, or build systems

  ## Product Decisions (with AI Recommendations)

  | Question | AI Recommendation | Rationale |
  |----------|-------------------|-----------|
  | Should the prose topic be freely chosen or follow specific domain guidance? | Free topic selection | 113+ precedent files use diverse topics without constraints; aligns with user request for "any topic"; simplifies implementation |
  | Within 2-3 sentences, should content have fixed or flexible count? | 2-3 sentences (flexible) | User explicitly specified "2-3 sentences"; existing pattern supports this flexibility; simplifies implementation |
  | Should markdown be limited to heading + prose only, or allow formatting elements? | Heading + plain prose only | 113+ existing test files follow this exact format; ensures consistency and maintainability |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-dd91rz.md) to existing collection of 113+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 123-132; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/133-markdown-file-creation-a3e3e2` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 113+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 113+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (123-132) demonstrate efficient implementation of identical features in 10-15 minutes

  ---

  _Requirements phase complete — functional and non-functional requirements defined, product decisions resolved with AI recommendations, ready for implementation_
