  - [ ] Execute git add, commit, push via subprocess.run()
  - [ ] Include error handling with fail-fast semantics
  - [ ] Test locally to verify output
  - [ ] Verify file encoding (hexdump/od to check for BOM, LF line endings)
  - [ ] Commit research artifacts to feature branch

