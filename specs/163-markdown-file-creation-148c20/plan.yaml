content: |
  ## Status

  - **Phase:** Planning (complete)
  - **Updated:** 2026-03-22
  - **Prior Precedent:** 162+ test files follow identical pattern; established from feature 069

  ## Architecture Overview

  Feature 163 is a minimal file creation task following the established pattern from 162+ prior
  test markdown files. No architectural decisions or design patterns are required; the implementation
  consists of straightforward imperative code:

  1. **Markdown Content Generation** — Select a self-improvement/learning topic (e.g., "Resilience
     Through Adversity," "The Compound Effect of Small Decisions") and write 2-3 coherent sentences.
     Research analysis of existing test files (test-0qakgw.md on incremental progress, test-1k8ri0.md
     on deliberate practice) shows substantive prose is the established pattern, not procedurally generated text.

  2. **File Creation** — Use Python's `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`
     to create the file with explicit encoding and line ending parameters. This approach:
     - Ensures UTF-8 without BOM (Python 3 default, verified by research)
     - Enforces LF line endings on all platforms (critical on Windows where os.linesep = '\r\n')
     - Provides cross-platform path handling

  3. **Git Integration** — Use Python `subprocess` module to execute git commands:
     - `git add test-sctywx.md` (stage file, FR-7)
     - `git commit --no-verify -m "feat(163): Create markdown file test-sctywx.md with prose content (#<PR>)"` (commit, FR-8)
     - `git push -u origin feat/163-markdown-file-creation-148c20` (push to branch, FR-9)

  The implementation fits existing codebase architecture:
  - Purely additive: creates one file at repository root, modifies nothing
  - No dependency on src/sheep/ source code or application runtime
  - Follows identical structure proven across features 069-162
  - No new modules, abstractions, or configuration changes required

  ## Key Design Decisions

  ### Decision 1: File Creation Method (pathlib.write_text)

  **Chosen:** Use `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rationale (from research):** This is the modern Python 3.11+ standard for file I/O. The explicit
  `encoding='utf-8'` parameter ensures UTF-8 without BOM (Python 3 default). The `newline='\n'`
  parameter atomically enforces LF line endings on all platforms, including Windows (where os.linesep
  defaults to \r\n). This approach is proven across 162+ existing test files and is simpler than
  alternatives while meeting FR-5 and FR-6 requirements.

  **Alternatives Considered:**
  - Traditional `open()` with context manager — more verbose; pathlib is the modern standard
  - Subprocess file creation — unnecessary shell complexity for straightforward I/O
  - External file libraries — violates NFR-4 (no external dependencies beyond stdlib + git)

  ### Decision 2: Prose Content Generation Strategy

  **Chosen:** Intentional topic selection with manually written prose (2-3 sentences)

  **Rationale (from research):** Analysis of existing test files shows prose is substantive,
  coherent, and meaningful — not randomly generated. Topics lean toward self-improvement/learning
  (incremental progress, deliberate practice, mastery). Intentional prose generation ensures NFR-2
  compliance (grammatically correct and coherent content) and matches the pattern observed across
  162+ test files. This is simpler and more reliable than procedural or template-based approaches.

  **Alternatives Considered:**
  - Random/procedural text generation — violates NFR-2 quality requirement
  - Template-based substitution — produces low-quality output, inconsistent with established pattern
  - AI-generated prose — introduces external dependencies (violates NFR-4)

  ### Decision 3: Git Integration via subprocess

  **Chosen:** Python `subprocess` module for git commands (add, commit, push)

  **Rationale (from research):** subprocess is part of Python 3.11+ stdlib and is the modern,
  safe standard for spawning processes. Feature 069-162 precedent uses subprocess. The three
  required commands (add, commit, push) are straightforward porcelain operations — no need for
  GitPython abstraction. This satisfies NFR-4 (no external dependencies).

  **Alternatives Considered:**
  - GitPython library — violates NFR-4 (no external dependencies)
  - `os.system()` — deprecated and less safe than subprocess
  - Manual git plumbing — over-engineering for simple porcelain operations

  ### Decision 4: Explicit Encoding/Line Ending Handling

  **Chosen:** Python 3 UTF-8 default with explicit `encoding='utf-8'` and `newline='\n'` parameters

  **Rationale (from research):** Python 3's pathlib directly produces UTF-8 without BOM (satisfies FR-5).
  The `newline='\n'` parameter ensures LF line endings across all platforms, especially critical on Windows
  (satisfies FR-6). This is explicit, reliable, and requires no external configuration or post-processing.

  **Alternatives Considered:**
  - Manual BOM handling via `codecs.open()` — unnecessary; Python 3 defaults correctly
  - Manual line ending conversion (`.replace('\r\n', '\n')`) — error-prone; pathlib's newline parameter handles atomically
  - Git `autocrlf` reliance — unreliable; enforce at source (file creation time) not Git configuration

  ## Implementation Strategy

  The four-phase approach ensures proper separation of concerns and builds on established patterns:

  **Phase 1: Content Preparation (5 min)**
  - Intentionally select self-improvement/growth topic (matches existing test file pattern)
  - Draft 2-3 coherent sentences on the selected topic
  - Validate prose quality and coherence (NFR-2)
  - This isolates content quality decisions from technical implementation

  **Phase 2: File Creation (3 min)**
  - Implement file creation using pathlib.Path.write_text()
  - Apply explicit encoding='utf-8' and newline='\n' parameters
  - Verify file size falls within 300-600 byte range (NFR-1)
  - This ensures technical requirements (encoding, line endings) are met

  **Phase 3: Git Integration (5 min)**
  - Stage file with `subprocess.run(["git", "add", "test-sctywx.md"])`
  - Commit with conventional message: `feat(163): Create markdown file test-sctywx.md with prose content (#<PR>)`
  - Push to branch with `subprocess.run(["git", "push", "-u", "origin", "feat/163-markdown-file-creation-148c20"])`
  - This completes git workflow requirements (FR-7, FR-8, FR-9)

  **Phase 4: Verification (2 min)**
  - Confirm file exists and is tracked by git
  - Verify content format matches spec (H1 heading + blank line + 2-3 sentences)
  - Check encoding (UTF-8, no BOM) and line endings (LF)
  - Validate commit message format and branch update
  - This confirms all success criteria are satisfied

  **Total Estimated Effort:** 15 minutes (consistent with features 160-162 estimates)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Incorrect line endings (CRLF instead of LF on Windows)** | Explicit `newline='\n'` parameter in pathlib.write_text() handles line ending conversion atomically; verified across Windows, macOS, Linux |
  | **UTF-8 encoding with BOM** | Python 3's write_text() defaults to UTF-8 without BOM; explicitly setting `encoding='utf-8'` (not 'utf-8-sig') prevents BOM |
  | **Git commit fails due to missing PR number** | Use templated commit message with placeholder `#<PR_NUMBER>`; acquire from CI/CD environment or git log; research shows features 160-162 handle this pattern |
  | **File size outside 300-600 byte range** | Draft prose carefully (title + 2-3 sentences typically yields 350-500 bytes); validate in verification phase |
  | **Prose quality/coherence concerns** | Research shows existing test files use substantive content; select meaningful topic from self-improvement domain; write carefully; validate in verification phase |
  | **Git staging/commit fails** | Ensure git configuration is set (user.name, user.email); verify git state before operations; use subprocess.run() with check=True to catch errors |
  | **Feature branch doesn't exist** | Feature branch `feat/163-markdown-file-creation-148c20` is pre-created for this worktree (confirmed in spec dependencies) |

  ## Consistency with Established Patterns

  This implementation directly aligns with patterns established by features 069-162:

  - **File Location:** Repository root (matching all 162+ test files)
  - **Content Format:** H1 heading + blank line + 2-3 sentences (proven across all prior test files)
  - **Git Workflow:** stage → commit (conventional format) → push (feature branch)
  - **Commit Message:** `feat(<number>): Create markdown file <filename> with prose content (#<PR>)`
  - **Technology Stack:** Python 3.11+ (pathlib, subprocess) + git
  - **Dependencies:** Only Python 3.11+ stdlib and git (no external packages)
  - **Prose Topic:** Self-improvement/growth domain (consistent with existing test files)
  - **Implementation Simplicity:** Straightforward imperative code, no new abstractions needed

