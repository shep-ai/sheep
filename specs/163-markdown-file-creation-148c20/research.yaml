# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (complete)
  - **Updated:** 2026-03-22
  - **Prior Precedent:** 162+ test files follow identical pattern; established from feature 069

  ## Overview

  Feature 163 requires creating a single markdown file (`test-sctywx.md`) in the repository root with:
  - H1 markdown heading
  - Blank line separator
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM
  - LF line endings (not CRLF)
  - 300-600 byte file size
  - Git staging and conventional commit

  **Key Finding**: This feature is low complexity — 162+ identical test files provide clear, proven implementation pattern. No architectural decisions needed; no external dependencies required.

  ## Technology Decisions

  ### 1. File Creation Method

  **Chosen:** Python `pathlib.Path.write_text()` with `encoding='utf-8'` and `newline='\\n'`

  **Rejected:**
  - Traditional `open()` with context manager — pathlib is more modern and Pythonic for Python 3.11+ projects
  - Subprocess file creation — unnecessary shell complexity for straightforward I/O
  - External libraries — violates dependency constraint (stdlib + git only)

  **Rationale:**
  pathlib is Python 3's modern standard for file I/O and is part of stdlib. The `encoding='utf-8'` parameter ensures UTF-8 without BOM (Python 3 default behavior). The `newline='\\n'` parameter atomically enforces LF line endings on all platforms, including Windows (where os.linesep defaults to \\r\\n). This approach is proven across 162+ test files and is simpler than alternatives.

  **Code pattern** (from features 069-162 precedent):
  ```python
  from pathlib import Path

  content = "# Title\\n\\nProse sentence 1. Prose sentence 2. Prose sentence 3.\\n"
  Path("test-sctywx.md").write_text(content, encoding="utf-8", newline="\\n")
  ```

  ### 2. Prose Content Generation

  **Chosen:** Intentional topic selection with manually written, substantive prose

  **Rejected:**
  - Procedural/random text generation — violates NFR-2 (prose quality requirement); existing test files contain meaningful, coherent content
  - Template-based variable substitution — still produces low-quality output; inconsistent with established pattern

  **Rationale:**
  Analysis of existing test files shows prose is substantive and meaningful (e.g., test-0qakgw.md discusses incremental progress, test-1k8ri0.md discusses deliberate practice). The spec allows arbitrary topic selection (NFR-7) with no domain constraints. Quality prose (NFR-2: "grammatically correct and coherent") is non-negotiable. Intentional topic selection ensures this requirement is met reliably.

  **Established pattern:** Topics in existing test files tend toward self-improvement, learning, and personal development (e.g., incremental progress, deliberate practice, mastery, persistence). Selecting within this domain (e.g., "Resilience Through Adversity") maintains consistency and quality standards.

  ### 3. Encoding and Line Ending Handling

  **Chosen:** Python 3 UTF-8 default with explicit parameters in `pathlib.write_text(encoding='utf-8', newline='\\n')`

  **Rejected:**
  - Manual BOM handling via codecs — unnecessary; Python 3's write_text() produces UTF-8 without BOM by default
  - Manual line ending conversion (.replace('\\r\\n', '\\n')) — error-prone; pathlib's newline parameter handles atomically
  - Git autocrlf reliance — unreliable; enforce at source instead of depending on Git configuration

  **Rationale:**
  Python 3's pathlib directly produces UTF-8 without BOM (spec requirement FR-5). The `newline='\\n'` parameter ensures LF line endings across all platforms, including Windows (FR-6). This is explicit, reliable, and requires no external configuration or post-processing.

  ### 4. Git Integration

  **Chosen:** Python `subprocess` module for git add, commit, and push

  **Rejected:**
  - GitPython library — violates NFR-4 (no external dependencies beyond stdlib + git)
  - os.system() — deprecated; subprocess is the modern, safe standard
  - Direct git plumbing commands — over-engineering for simple porcelain operations

  **Rationale:**
  Spec explicitly requires NFR-4 (no external dependencies). subprocess is part of Python 3.11+ stdlib. Feature 069-162 precedent shows simple subprocess wrapping of git commands. The required operations (git add, git commit, git push) are straightforward and don't require GitPython's abstraction.

  **Code pattern** (from established features):
  ```python
  import subprocess

  subprocess.run(["git", "add", "test-sctywx.md"], check=True)
  subprocess.run(["git", "commit", "--no-verify", "-m",
                  "feat(163): Create markdown file test-sctywx.md with prose content (#<PR_NUMBER>)"],
                 check=True)
  subprocess.run(["git", "push", "-u", "origin", "feat/163-markdown-file-creation-148c20"],
                 check=True)
  ```

  ### 5. Implementation Language

  **Chosen:** Python 3.11+ (project standard)

  **Rejected:**
  - Shell/bash — less portable on Windows despite bash availability; inconsistent with Python-primary project
  - JavaScript/Node.js — incompatible with Python infrastructure; requires external dependency installation

  **Rationale:**
  Project enforces Python 3.11+ (pyproject.toml). Existing features 069-162 use Python. Maintains consistency with codebase architecture.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O, path handling | **Use** | Part of Python 3.11+ stdlib; modern standard for file operations |
  | subprocess (stdlib) | Git command execution | **Use** | Part of stdlib; safe, modern process spawning for git commands |
  | UTF-8 encoding (native) | Text encoding | **Use** | Python 3 default; no external library needed |
  | GitPython | Git abstraction layer | **Reject** | Violates NFR-4 (no external dependencies); subprocess sufficient |
  | os.system() | Command execution | **Reject** | Deprecated; subprocess is modern, safe alternative |
  | Custom file generation libraries | Text/markdown generation | **Reject** | Over-engineering; simple string concatenation sufficient |

  ## Security Considerations

  **File Path Security:**
  - Use pathlib.Path for path construction (prevents path traversal attacks via string concatenation)
  - Hardcoded filename `test-sctywx.md` eliminates injection vectors
  - Path is always relative to repo root (no absolute paths with user input)

  **Content Security:**
  - Prose content is authored, not user-generated or unsanitized
  - No code execution, templating, or dynamic content generation that could introduce vulnerabilities
  - No external data sources (content is static/intentional)

  **Git Command Security:**
  - Use subprocess.run() with `check=True` (validates command success)
  - Command arguments passed as list, not shell string (prevents shell injection)
  - No user input in git commands (commit message is templated with known values)
  - `--no-verify` flag used deliberately to bypass pre-commit hooks (documented in specification)

  **Overall Assessment:** Low security risk. Feature is purely file creation with no external input, no code execution, and no privilege escalation. Hardcoded values and proper subprocess usage eliminate injection vectors.

  ## Performance Implications

  **File I/O Performance:**
  - Single file write operation (~400-600 bytes) — negligible performance impact
  - pathlib.write_text() is synchronous but adequate for single-file operation
  - No caching, indexing, or optimization needed at this scale

  **Git Operations Performance:**
  - git add (single file) — O(1) relative to repository size
  - git commit — minimal overhead for single commit
  - git push — network-dependent, but acceptable for feature branch workflow
  - Overall execution time: 5-15 seconds including subprocess overhead

  **Overall Assessment:** Performance is not a concern for this feature. File size (300-600 bytes) and operation count (one write, three git commands) have negligible impact. No optimization opportunities needed.

  ## Architecture Notes

  **Integration with Existing Codebase:**
  - Feature is purely additive: creates one file, modifies nothing
  - File stored in repository root alongside 162+ existing test files (established pattern location)
  - No dependency on src/sheep/ source code or application architecture
  - No changes to CI/CD, build system, or configuration
  - Feature operates independently from application runtime

  **Pattern Consistency:**
  - Follows identical structure established by features 069-162
  - Commit message follows conventional format established in features 160-162
  - File location (repository root) matches all prior test files
  - Content format (H1 + blank line + 2-3 sentences) is proven across 162+ examples
  - No new patterns or architectural decisions needed

  **Implementation Simplicity:**
  - No new modules, classes, or abstractions required
  - Straightforward imperative code (generate string, write file, run git commands)
  - No testing framework integration needed (file itself is a test artifact)
  - Estimated implementation: 10-15 minutes (consistent with features 160-162)

  ## Conclusion

  **Research Finding:** Feature 163 requires minimal technical complexity. 162+ prior test files establish a proven, repeatable pattern. Implementation uses only Python 3.11+ stdlib (pathlib, subprocess) and git. No architectural decisions, no external dependencies, no novel technical challenges.

  **Key Decisions:**
  1. Use pathlib.write_text() for file creation (modern, stdlib, cross-platform)
  2. Generate prose via intentional topic selection (ensures quality, matches pattern)
  3. Enforce UTF-8 + LF explicitly in pathlib parameters (reliable across platforms)
  4. Use subprocess for git commands (stdlib, simple, safe)
  5. Implement in Python 3.11+ (project standard)

  All decisions reference established patterns from features 069-162 and respect project constraints (no external dependencies, no source code modifications, minimal scope).

