# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-sctywx.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in feature 069, with 162+
  similar test files already existing in the repository as precedents (test-*.md files at root directory).
  The feature serves as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-sctywx.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (`\n`), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-sctywx.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(163): Create markdown file test-sctywx.md with prose content (#<PR_NUMBER>)`
  - [ ] Commit is pushed to the feature branch `feat/163-markdown-file-creation-148c20`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-sctywx.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading (line 2)
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line (lines 3+)
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (`\n`) line endings throughout (not CRLF or other styles)
  - **FR-7**: The file SHALL be added to git staging area using `git add test-sctywx.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message following the pattern from features 160-162
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/163-markdown-file-creation-148c20`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or placeholder text)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 069-162 for consistency
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Product Decisions & Predetermined Choices

  All significant product decisions for this feature have been predetermined by 162+ existing test markdown files
  that follow the identical pattern. No open product questions requiring input:

  | Decision Area | Predetermined Value | Rationale |
  | ------------- | ------------------- | --------- |
  | File name | `test-sctywx.md` | Fixed by user query; follows `test-<id>.md` pattern from 162+ precedent files |
  | File location | Repository root | Established pattern; all 162+ test files stored at root level |
  | File format | H1 heading + blank line + 2-3 sentences | Defined by 162+ precedent files; consistent pattern established |
  | Commit message format | `feat(163): Create markdown file test-sctywx.md with prose content (#<PR_NUMBER>)` | Follows pattern from features 160-162; includes PR number for traceability |
  | Prose topic | Any arbitrary topic | Flexible per features 069-162; no domain constraints |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 162+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., `163-markdown-file-creation-148c20/`)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **.github/**: GitHub Actions CI/CD configuration
  - **docker-compose.yml** / **Dockerfile**: Container configuration

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as test cases for the
  automated implementation workflow.

  ### Architecture Patterns

  **Established File Creation Pattern** (162+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows the pattern: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings (`\n`)
  - Implementation uses straightforward imperative code (generate content string, write to file)
  - Typical file size: 300-600 bytes

  **Git Workflow Pattern** (Established across features 069-162):
  - Feature branch pre-created with naming convention: `feat/<number>-markdown-file-creation-<hash>`
  - Create/modify files on feature branch
  - Stage files with `git add`
  - Commit with conventional commit format: `feat(<number>): Create markdown file <filename> with prose content`
  - Include PR number reference (e.g., `(#231)`) in commit message per pattern from features 160-162
  - Push to feature branch with `git push -u origin <branch-name>`
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (Observed in features 069-162):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O and git integration
  - Estimates consistently 10-15 minutes for implementation
  - No architectural decisions or design patterns required

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); provides pathlib standard library
  - **pathlib (Python standard library)**: Used for file I/O operations; provides cross-platform path handling
  - **Git**: Version control system; file staging, commits, and branch operations
  - **Markdown syntax**: Simple, well-defined format with H1 heading (`#`) and prose content
  - **Text encoding**: UTF-8 standard (Python 3 default)
  - **Line endings**: LF convention for Unix/Linux/macOS (Git normalized)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-sctywx.md) to existing collection of 162+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-162; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | CI/CD | None | Feature triggers standard CI/CD pipeline; no workflow changes or configuration modifications |

  ## Dependencies

  - **Git repository**: Feature branch `feat/163-markdown-file-creation-148c20` must exist (pre-created for this worktree)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 162+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **CI/CD system**: PR number information available from CI/CD system or build environment

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown H1 heading + 2-3 sentences of prose with appropriate topic selection)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, prose quality and coherence)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message and PR number, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 162+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (160-162) demonstrate efficient implementation in 10-15 minutes
  - No dependencies on source code or complex workflows

