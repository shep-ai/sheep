content: |
  ## Architecture Overview

  Feature 267 integrates seamlessly into the existing Sheep architecture by reusing the proven infrastructure pattern established across features 262-266. The implementation is a **thin orchestration module** that sequences five well-tested functions from the content_generators module.

  ### Module Organization

  The feature will be implemented in `src/sheep/features/feature_267_markdown_file_creation.py` following the exact pattern of feature_262:

  1. **Module-level docstring**: Clear description of the feature and workflow
  2. **Feature metadata constants**:
     - FEATURE_NUMBER = 267
     - FEATURE_NAME = "markdown-file-creation-e4197f"
     - MARKDOWN_FILENAME = "test-leaw3w.md"
  3. **Orchestration function**: `create_feature_267_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  4. **__main__ block**: Allows standalone execution

  ### Workflow Sequence

  The orchestration function executes these steps in order, using existing infrastructure:

  1. **generate_markdown_content()** (content_generators.py:26-67)
     - Calls sheep.config.llm.get_reasoning_llm() for Claude API access
     - Applies MARKDOWN_GENERATION_PROMPT template
     - Returns markdown with H1 heading + 2-3 sentences + trailing newline

  2. **write_markdown_file(content, "test-leaw3w.md")** (content_generators.py:100-146)
     - Validates filename (no path traversal attacks)
     - Writes file with UTF-8 encoding at repository root
     - Returns filepath as string

  3. **validate_markdown_file(filepath)** (content_generators.py:209-303)
     - Checks UTF-8 encoding (no BOM)
     - Verifies LF line endings (not CRLF)
     - Validates H1 heading, blank line, 2-3 sentences
     - Confirms trailing newline
     - Raises ValueError if any check fails

  4. **commit_markdown_file(filepath, content, repo_path, custom_message)** (content_generators.py:333-383)
     - Constructs custom message: `feat(267): create markdown file test-leaw3w.md with prose content`
     - Stages file with git add
     - Commits with conventional format
     - Returns commit result

  5. **push_markdown_file(repo_path)** (content_generators.py:386-415)
     - Pushes to remote with set_upstream=True
     - Establishes remote tracking for feature branch
     - Returns push result

  ### Error Handling & Logging

  Following the pattern from feature_262:

  - **Logging**: Uses sheep.observability.logging.get_logger(__name__) for structured logging at each step
  - **Error propagation**: Wraps entire workflow in try-except, logs exceptions, re-raises for caller to handle
  - **Return value**: Dictionary with filepath, content, commit_message, push_result for visibility

  ### Dependency Integration

  All dependencies are satisfied by existing infrastructure:

  ```
  feature_267_markdown_file_creation.py
    ├── sheep.content_generators (all 5 functions)
    │   ├── sheep.config.llm.get_reasoning_llm()
    │   │   └── CrewAI LLM + Anthropic Claude API
    │   ├── sheep.tools.GitCommitTool (wrapped in commit_markdown_file)
    │   └── sheep.tools.GitPushTool (wrapped in push_markdown_file)
    └── sheep.observability.logging.get_logger()
        └── structlog
  ```

  No new external dependencies required. All modules are already part of the Sheep infrastructure.

  ## Key Design Decisions

  ### 1. Reuse content_generators Infrastructure (vs. Inline Implementation)

  **Chosen:** Call existing functions from content_generators.py (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file).

  **Rejected alternatives:**
  - Inline all logic in feature_267 module (duplicates tested code, violates DRY principle)
  - Use lower-level APIs directly (subprocess for git, anthropic SDK directly for LLM)
  - Template-based content generation (cannot produce diverse, quality prose)

  **Rationale:** The content_generators module provides proven, tested implementations that have been successfully used by 260+ prior features. Reusing it ensures: (1) consistency across all markdown file features, (2) centralized maintenance of validation logic, (3) consistent error handling and logging, (4) validated encoding/line-ending behavior. The functions already handle all edge cases (response parsing, encoding validation, BOM checking, sentence counting). This is the **exact pattern used in features 262, 264, 265, 266** and represents the established best practice in the codebase.

  ### 2. Custom Commit Message with Feature Number (vs. Default Template)

  **Chosen:** Use the `custom_message` parameter of commit_markdown_file() to pass `f"feat({FEATURE_NUMBER}): create markdown file {MARKDOWN_FILENAME} with prose content"`.

  **Rejected alternatives:**
  - Use default commit message from content_generators (hardcodes feature 145, produces wrong number)
  - Auto-generate from topic extracted from content (duplicates logic already in commit_markdown_file)
  - Omit feature number (violates conventional commit format)

  **Rationale:** The commit_markdown_file() function accepts an optional custom_message parameter, allowing us to embed the correct feature number (267) in the conventional commit format. This ensures the commit message is accurate and matches the established pattern from features 262-266, which all use the same format. The hardcoded feature number bug in the default template is avoided by providing a custom message.

  ### 3. Follow feature_262 Module Pattern Exactly (vs. Generic Approach)

  **Chosen:** Create feature_267_markdown_file_creation.py module following the exact structure of feature_262_markdown_file_creation.py.

  **Rejected alternatives:**
  - Implement as a generic function in create_markdown.py (breaks convention, reduces traceability)
  - Use the pre-built create_markdown_file() function directly (violates feature numbering and isolation)
  - Merge feature 267 with feature 266 (violates feature uniqueness)

  **Rationale:** Features 262, 264, 265, 266 all follow the same modular pattern in src/sheep/features/. This provides: (1) single responsibility (each module owns its feature), (2) easy navigation (simple file path feature_N_markdown_file_creation.py), (3) traceability for testing and debugging, (4) consistency across 260+ features. The pattern is well-established, proven, and copied verbatim from feature_262 (which itself succeeded).

  ### 4. Propagate Exceptions with Logging (vs. Suppress or Return Codes)

  **Chosen:** Wrap workflow in try-except that logs the error and re-raises the exception.

  **Rejected alternatives:**
  - Suppress exceptions silently (errors become invisible)
  - Return error codes instead of raising (callers must remember to check, Python idiom is to raise)
  - Retry failed operations automatically (adds complexity, not needed for atomic operations)

  **Rationale:** Following Python idiom and the pattern in feature_262, exceptions provide clear error signals with full call stack context. Logging provides observability while re-raising allows the caller (typically CLI or test runner) to decide how to handle the failure. This is the **established error handling pattern across the Sheep codebase**.

  ## Implementation Strategy

  ### Phase 1: Feature Module Implementation (Est. 30 min)

  Create the feature module by directly copying the structure of feature_262 and adapting:
  - Replace FEATURE_NUMBER (262 → 267)
  - Replace FEATURE_NAME with actual feature name from spec
  - Replace MARKDOWN_FILENAME (test-677pul.md → test-leaw3w.md)
  - Replace function name (create_feature_262 → create_feature_267)
  - Copy the entire orchestration logic (no changes needed to the workflow)

  This is **mechanical work** — the implementation logic is identical to feature_262. The only changes are string constants and function naming.

  ### Phase 2: Testing & Validation (Est. 90 min)

  Write tests to verify:
  - **Unit test**: Feature module imports correctly, constants are defined, function exists
  - **Orchestration test**: Each infrastructure function is called with correct parameters
  - **Integration test**: Full workflow produces the markdown file, git commit, and push
  - **End-to-end test**: File has correct content, encoding, line endings, and git history

  Tests will use mocking for external dependencies (LLM API, git commands) to ensure test speed and isolation, with an optional integration test against a real temporary git repository.

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | LLM API fails or times out | Low (existing infra tested) | Medium (file not created) | Use existing error handling in generate_markdown_content(); tests mock the API call |
  | Git operations fail (commit/push) | Very Low (feature branch pre-created) | Medium (workflow incomplete) | Use existing error handling in commit/push functions; test with temporary repo |
  | File encoding issues (BOM, CRLF) | Very Low (validation tested on 260+ files) | Medium (validation failure) | validate_markdown_file() checks all encoding requirements; use Python's built-in UTF-8 handling |
  | Filename collision (file already exists) | Low (new feature, new filename) | Low (overwrite, idempotent per spec) | Implementation is idempotent by design; overwriting is acceptable per NFR-5 |
  | Feature module has bugs | Very Low (copy from feature_262) | High (feature fails) | Exhaustive testing in Phase 2; follow existing pattern exactly |
  | Commit message format incorrect | Very Low (custom_message approach) | Low (cosmetic, easy to fix) | Hardcode message format matching spec convention; test verifies format |

  **Mitigation summary:** All major risks are addressed by reusing proven infrastructure (260+ features), comprehensive testing, and following the exact pattern of feature_262 which has already succeeded.
