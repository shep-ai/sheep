tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Create markdown file with title and prose content"
    description: |
      Create test-aear8n.md at repository root with pathlib.Path.write_text() using explicit
      UTF-8 encoding and Unix LF line endings. File should contain H1 markdown heading as title
      and 2-3 sentences of meaningful prose. Use hardcoded content matching established pattern
      from prior features.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-aear8n.md exists in repository root directory"
      - "File contains valid markdown H1 heading (# followed by title text)"
      - "H1 heading is followed by blank line and 2-3 complete sentences"
      - "File is written with encoding='utf-8' and newline='\\n' parameters"
      - "File is readable and contains expected prose content"
    tdd:
      red:
        - "Write test that asserts test-aear8n.md exists in repository root"
        - "Write test that asserts file contains H1 heading with title"
        - "Write test that asserts file contains 2-3 sentences after blank line"
      green:
        - "Define hardcoded markdown content (H1 + blank line + 2-3 sentences)"
        - "Use pathlib.Path('test-aear8n.md').write_text(content, encoding='utf-8', newline='\\n')"
        - "Verify tests pass"
      refactor:
        - "Extract content string into constant for reusability"
        - "Add comments explaining H1 heading format and blank line requirement"
    estimatedEffort: "10 minutes"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Validate file encoding (UTF-8 without BOM)"
    description: |
      Implement validation that file uses UTF-8 encoding without BOM (Byte Order Mark).
      Read file in binary mode and verify it does not start with BOM bytes (0xef 0xbb 0xbf).
      This ensures consistency with NFR-1 and cross-platform compatibility.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "Validation function reads file in binary mode"
      - "Validation checks that binary content does not start with 0xef 0xbb 0xbf (BOM)"
      - "Validation passes for UTF-8 without BOM"
      - "Validation fails (raises exception) if BOM is detected"
      - "Error message clearly indicates BOM issue"
    tdd:
      red:
        - "Write test that asserts file does not have UTF-8 BOM"
        - "Write test that would fail if file had BOM prefix"
      green:
        - "Read test-aear8n.md in binary mode"
        - "Check if binary_content.startswith(b'\\xef\\xbb\\xbf')"
        - "Raise ValueError if BOM is present"
      refactor:
        - "Extract into validate_encoding(filepath) function"
        - "Add clear error message: 'File must be UTF-8 without BOM'"
    estimatedEffort: "8 minutes"

  - id: "task-3"
    phaseId: "phase-1"
    title: "Validate line endings (LF only, no CRLF)"
    description: |
      Implement validation that file uses Unix-style LF line endings only (no CRLF).
      Read file in binary mode and verify absence of carriage return (\\r) characters.
      This ensures consistency with NFR-2 and cross-platform git compatibility.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "Validation function reads file in binary mode"
      - "Validation checks that binary content contains no b'\\r\\n' (CRLF) sequences"
      - "Validation checks that no b'\\r' (CR) characters exist"
      - "Validation passes for LF-only line endings"
      - "Validation fails if CRLF or mixed line endings detected"
      - "Error message clearly indicates line ending issue"
    tdd:
      red:
        - "Write test that asserts file has no CRLF (\\r\\n)"
        - "Write test that asserts file has no CR (\\r) characters"
      green:
        - "Read test-aear8n.md in binary mode"
        - "Check if b'\\r' in binary_content"
        - "Raise ValueError if CR is found"
      refactor:
        - "Extract into validate_line_endings(filepath) function"
        - "Add clear error message: 'File must use Unix LF line endings only'"
    estimatedEffort: "8 minutes"

  - id: "task-4"
    phaseId: "phase-1"
    title: "Validate file structure and size"
    description: |
      Implement validation of file content structure (H1 heading, blank line, prose count)
