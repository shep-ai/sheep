content: |
  ## Summary

  Feature 100 implementation proceeds in two sequential phases across 7 focused tasks:

  **Phase 1: File Creation & Validation (Tasks 1-4)** creates the markdown file and validates
  it meets all requirements before any git operations. Task 1 creates the file with pathlib,
  ensuring proper encoding and line endings. Tasks 2-4 implement post-creation validation:
  encoding check (UTF-8 without BOM), line ending check (LF only), and structure/size check
  (H1 + blank + 2-3 sentences, 320-600 bytes). Validation catches platform-specific issues
  early (Windows CRLF, accidental BOM) before git commit.

  **Phase 2: Git Integration (Tasks 5-7)** stages, commits, and pushes the validated file.
  Task 5 stages with `git add`. Task 6 commits with conventional format and --no-verify flag.
  Task 7 pushes to the feature branch with upstream tracking. All git operations use
  subprocess.run() with list arguments for safety, and check=True for failure detection.

  **TDD Approach:** Each task follows red-green-refactor cycle. RED writes tests asserting
  desired behavior. GREEN implements minimal code to pass tests. REFACTOR extracts helpers,
  improves naming, and adds error messages. This ensures code is well-tested and maintainable.

  **Dependencies:** Phase 1 tasks (2-4) depend on Task 1 (file must exist before validation).
  Phase 2 tasks (5-7) are sequential: add → commit → push. No parallel tasks; all dependencies
  are explicit and ordered.

  **Effort Breakdown:** 59 minutes total = Phase 1 (36 min) + Phase 2 (23 min). File creation
  and validation take slightly longer due to multiple validation checks. Git operations are
  straightforward subprocess calls, so phase 2 is faster.
