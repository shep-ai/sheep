# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 99+ times. This feature creates a single
  test markdown file (`test-aear8n.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 99+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-099.

  ## Success Criteria

  - [ ] File `test-aear8n.md` exists in the repository root directory
  - [ ] File contains a valid markdown H1 heading (single `#` with title text)
  - [ ] H1 heading is followed by a blank line and 2-3 complete sentences of prose
  - [ ] File encoding is UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (\\n only, never CRLF)
  - [ ] File size is between 320-600 bytes (within established pattern bounds)
  - [ ] Markdown syntax is valid (no syntax errors in heading or prose)
  - [ ] Prose content is semantically coherent and meaningful (not random text)
  - [ ] File is staged in git index (ready for commit)
  - [ ] Conventional commit with message `"feat(100): create markdown file test-aear8n.md with prose content"` exists
  - [ ] Feature branch `feat/100-markdown-file-creation-c927ed` contains the new commit
  - [ ] No other files are modified or staged

  ## Functional Requirements

  - **FR-1**: Create a markdown file at repository root with exact filename `test-aear8n.md`
  - **FR-2**: File must contain exactly one H1 markdown heading (`#` prefix) serving as the title
  - **FR-3**: H1 heading must be followed by a blank line separating it from prose content
  - **FR-4**: File must contain 2-3 complete sentences of prose after the blank line
  - **FR-5**: Stage the created file in git index using `git add test-aear8n.md`
  - **FR-6**: Create a git commit with conventional commit message: `feat(100): create markdown file test-aear8n.md with prose content`
  - **FR-7**: Push the commit to the feature branch using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (use Python pathlib.Path.write_text(encoding='utf-8'))
  - **NFR-2**: Line endings must be Unix-style LF (\\n only, not CRLF or mixed)
  - **NFR-3**: File size must be within 320-600 bytes to match established pattern bounds
  - **NFR-4**: Markdown syntax must be valid (H1 heading format: `# Title`)
  - **NFR-5**: Prose content must be semantically meaningful and coherent (match tone/quality of features 069-099)
  - **NFR-6**: Implementation must not modify any existing files or directories
  - **NFR-7**: Git workflow must follow established pattern: stage → commit → push with no intermediate branches or complex operations

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Use pathlib.Path or subprocess/os for file creation? | Use pathlib.Path.write_text() | Established pattern across 99+ features (069-099) uses pathlib; idiomatic Python; direct file I/O without subprocess overhead |
  | 2 | Should prose content be technical or generic? | Generic/flexible (any coherent topic) | Prior features use varied topics (not domain-specific); focus should be on structure, not content; gives implementer creative flexibility while meeting requirements |
  | 3 | Should commit include a PR number or reference? | No, follow exact format without PR references | Pattern from features 069-099 uses simple format: `feat(NNN): create markdown file [filename] with prose content`; no additional context needed |
  | 4 | Validate file post-creation before commit? | Yes, basic validation (encoding, line endings, size) | Ensures quality; detects accidental issues (CRLF line endings, wrong encoding); aligns with NFR requirements; previous features demonstrate success with this approach |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-aear8n.md) to existing collection of 99+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites of existing content |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact application code or modules |
  | Configuration Files | None | No modifications to pyproject.toml, .env, Dockerfile, or other configuration files |
  | Specifications Directory | None | No modifications to existing specs; this spec file itself is the only spec updated |
  | Documentation | None | No changes to README.md or other documentation files |
  | Test Suite | None | No modifications to test infrastructure or test files |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/100-markdown-file-creation-c927ed` must already exist
  - **File system permissions**: Write access to repository root directory (standard in development environments)
  - **Established pattern**: 99+ test files (features 069-099) provide clear precedent for content structure and format
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits to succeed
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown H1 heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size within bounds)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 99+ prior features (069-099) with identical requirements
  - Flexible topic selection with no research, architectural decisions, or design choices required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-099 demonstrate efficient implementation of identical tasks within 10-15 minute window
  - Pattern is simple enough to implement without external libraries or complex logic
