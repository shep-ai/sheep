# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 89+ times. This feature creates a single
  test markdown file (`test-9ur3n4.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 89+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-089.

  ## Success Criteria

  - [ ] File `test-9ur3n4.md` exists at repository root
  - [ ] File contains valid markdown H1 heading (`# <Title>`) as the title
  - [ ] File contains exactly 2-3 sentences of grammatically correct and coherent prose following the title
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix-style line endings (LF, `\n` only — not CRLF)
  - [ ] File size is between 320-600 bytes (following established pattern)
  - [ ] File is staged in git with `git add test-9ur3n4.md`
  - [ ] Commit created with conventional commit message: `feat(090): create markdown file test-9ur3n4.md with prose content`
  - [ ] Commit pushed to feature branch `feat/090-markdown-file-creation-4373fd`
  - [ ] Feature branch contains the commit and is ready for review

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-9ur3n4.md` at the repository root directory using Python pathlib (e.g., `Path("test-9ur3n4.md").write_text(content)`)
  - **FR-2**: The file must contain a markdown H1 heading on the first line, using the format `# <Title>` (where Title is a descriptive heading)
  - **FR-3**: The file must contain a blank line after the H1 heading, followed by 2-3 sentences of prose content
  - **FR-4**: Prose content must be grammatically correct, coherent, and complete (not fragments or incomplete thoughts)
  - **FR-5**: Topic selection for prose content is flexible — any generic/universal topic is acceptable (e.g., "Why Coffee Shops Are Great for Work", "The Importance of Regular Breaks", "Learning New Skills")
  - **FR-6**: Stage the created file in git using `git add test-9ur3n4.md`
  - **FR-7**: Create a git commit with conventional commit message format: `feat(090): create markdown file test-9ur3n4.md with prose content`
  - **FR-8**: Push the commit to the feature branch `feat/090-markdown-file-creation-4373fd` on the remote repository

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be Unix-style LF (`\n`), not Windows-style CRLF (`\r\n`)
  - **NFR-3**: File size must be within the range of 320-600 bytes, consistent with existing test files in the repository
  - **NFR-4**: Implementation must follow the established pattern used in features 069-089 without deviations
  - **NFR-5**: No modifications to existing files or directories (other than the new test-9ur3n4.md file)
  - **NFR-6**: No changes to source code, configuration files, or project metadata (pyproject.toml, .env, etc.)
  - **NFR-7**: Git operations must use standard git commands (git add, git commit, git push) with no force flags or destructive operations

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 89+ test markdown files (test-*.md) following a consistent pattern, created by features 069-089
  - **src/sheep/**: Application source code with modular architecture (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/090-markdown-file-creation-4373fd/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with dependencies and build metadata
  - **.env.example / .env**: Environment configuration for API keys (OpenAI, Anthropic, Google, Langfuse)
  - **README.md**: Project documentation describing the CrewAI-based agentic platform
  - **Documentation files**: DESIGN_PATTERN.md, ABOUT_ME.md, TOPIC.md, etc. (artifacts from prior feature implementations)

  The test markdown files at repository root are artifacts created during feature implementation phases
  and do not form part of the application source code. They serve as simple, repeatable test cases
  for the Sheep automated implementation system.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (89+ precedents):
  - Simple file creation using Python pathlib: `Path("test-9ur3n4.md").write_text(content)`
  - Standard markdown format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix-style LF line endings (\n)
  - File size typically 320-600 bytes (observed range across existing test files)
  - Topic selection is flexible (generic/universal topics like "Why Coffee Shops Are Great for Work")
  - Prose content must be grammatically correct and coherent

  **Git Workflow Pattern** (consistently applied across features 069-089):
  - Feature branch pre-created with naming convention: `feat/{number}-markdown-file-creation-{slug}`
  - Files created at repository root (no subdirectories)
  - Standard git workflow: `git add <file>` → `git commit -m "feat({number}): ..."` → `git push`
  - Conventional commit format: `feat({number}): create markdown file {filename} with prose content`
  - Commits pushed to feature branch (not merged to main during implementation phase)

  **Modular Application Architecture**:
  - Separation of flows (control structure) and crews (LLM intelligence)
  - Multi-LLM support with factory pattern (OpenAI, Anthropic, Google APIs)
  - Observable execution via Langfuse integration
  - Specialized agents for research, implementation, and review phases
  - File I/O and git operations via dedicated tool modules

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); supports 3.11-3.12
  - **pathlib (Python standard library)**: Cross-platform file I/O operations for markdown file creation
  - **Git**: Version control system for file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content blocks

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-9ur3n4.md) to existing collection of 89+ test files; no modifications to existing files or structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code | None | Feature is purely file creation; does not depend on or impact /src/sheep/ application code |
  | Configuration | None | No modifications to pyproject.toml, .env, or other configuration files |
  | Documentation | None | No changes to README.md or other documentation (though documentation files may exist from prior features) |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/090-markdown-file-creation-4373fd` must already exist (pre-created)
  - **File system permissions**: Write access to repository root directory (standard in development environment)
  - **Established pattern**: 89+ test files provide clear precedent for content structure, format, and quality expectations
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose with an appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size ~320-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 89+ prior features with identical requirements
  - Flexible topic selection with no research or architectural decisions required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-089 demonstrate efficient implementation of identical tasks in 10-15 minutes
  - Pattern is simple enough to implement without external libraries or complex logic

