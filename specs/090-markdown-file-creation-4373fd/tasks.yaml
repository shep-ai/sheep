content: |
  ## Implementation Summary

  Feature 090 requires creating a single markdown file (test-9ur3n4.md) at repository root
  with an H1 heading and 2-3 sentences of LLM-generated prose content. The implementation
  reuses the proven create_markdown_file() orchestration function from sheep.content_generators,
  which handles all steps: content generation via Claude API, file creation with UTF-8/LF
  validation, git staging/commit/push.

  Five tasks implement this feature across three phases:

  **Phase 1 (Setup):** Task 1 verifies function accessibility and dependencies. Quick validation
  that the established pattern is available and properly configured.

  **Phase 2 (Implementation):** Tasks 2-3 create the markdown file and validate all format
  requirements (encoding, line endings, structure, size). The create_markdown_file() function
  handles all heavy lifting; tasks verify it worked correctly.

  **Phase 3 (Verification):** Tasks 4-5 confirm git operations succeeded and all acceptance
  criteria are met. Final gates before feature is complete.

  Each task follows TDD: RED (write failing test), GREEN (implement minimal code to pass),
  REFACTOR (cleanup and optimization). Tasks are ordered by dependency with no circular references.

  **Total Effort:** ~45-55 minutes, matching the spec's size estimate (S = 10-15 minutes of actual
  work). This estimate accounts for proper testing, validation, and documentation.

  ## Task Dependencies

  ```
  task-1 (Setup)
    ↓
  task-2 (Create File)
    ↓
  task-3 (Validate Format)
    ↓
  task-4 (Verify Git)
    ↓
  task-5 (Final Acceptance)
  ```

  Linear dependency chain. Each task depends on previous task's success. No parallel execution.

  ## Testing Strategy

  Each task includes RED-GREEN-REFACTOR TDD cycle:

  1. **RED**: Write test that currently fails (asserts desired behavior that doesn't exist yet)
  2. **GREEN**: Write minimal code to make test pass (simplest implementation)
  3. **REFACTOR**: Clean up, improve naming, extract helpers, add logging/docs

  This approach ensures:
  - Each requirement is testable and validated
  - Implementation is correct before moving forward
  - Technical debt is minimized
  - Future changes are safer (tests already exist)

  ## Success Criteria Mapping

  All 9 spec success criteria are verified across tasks:

  | Criterion | Verified In Task |
  | --------- | ---------------- |
  | File exists at repo root | Task 2 (creation), Task 5 (final check) |
  | H1 heading present | Task 3 (format validation), Task 5 |
  | 2-3 sentences prose | Task 3 (format validation), Task 5 |
  | UTF-8 without BOM | Task 3 (encoding check), Task 5 |
  | Unix LF line endings | Task 3 (line ending check), Task 5 |
  | File size 320-600 bytes | Task 3 (size validation), Task 5 |
  | Git add completed | Task 4 (git verification), Task 5 |
  | Conventional commit message | Task 4 (git log check), Task 5 |
  | Push to feature branch | Task 4 (remote verification), Task 5 |

  ## Risk Management

  Each task includes mitigations for identified risks:

  - **LLM API Failure**: Caught by exception handling in create_markdown_file(), logged with context
  - **Windows CRLF Conversion**: Prevented by newline="" parameter in file write; validated in Task 3
  - **Git Operations Failure**: GitPushTool error handling logs issues; verified in Task 4
  - **Validation Failures**: Task 3 runs comprehensive checks; Task 5 retests all criteria

  ## Integration Points

  Implementation integrates with existing Sheep architecture:

  - **sheep.content_generators.create_markdown_file()** - Core orchestration function
  - **sheep.config.llm.get_reasoning_llm()** - LLM provider abstraction (Claude)
  - **sheep.tools.git_tools.GitCommitTool, GitPushTool** - Git operations
  - **sheep.observability.logging** - Structured logging and Langfuse observability
  - **.env** - Configuration (ANTHROPIC_API_KEY, model settings)

  No new modules or refactoring required. Reuses existing, proven patterns.

  ## Effort Justification

  Estimate breakdown:
  - Task 1 (Setup): 10 min (quick import and config verification)
  - Task 2 (File Creation): 10 min (call function, verify file exists)
  - Task 3 (Validation): 10 min (run validation checks, document results)
  - Task 4 (Git Verification): 10 min (git log, git show, remote check)
  - Task 5 (Final Acceptance): 5-10 min (summary report, criteria checklist)
  - **Total: 45-55 minutes**

  Why this is reasonable:
  - Pattern is well-established (89+ precedents with identical requirements)
  - All heavy lifting is in create_markdown_file() (already written, tested)
  - Tasks are verification and validation, not novel implementation
  - Each task is straightforward with clear acceptance criteria
  - No architectural decisions or complex logic needed

  Spec estimate of "10-15 minutes of actual work" is accurate for the core implementation
  (calling the function). The 45-55 minute estimate includes proper testing, validation,
  documentation, and verification for production quality.

  ---

