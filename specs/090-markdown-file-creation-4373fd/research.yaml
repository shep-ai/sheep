content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-18
  - **Status:** Complete — All technical decisions documented with rationale

  ## Technology Decisions

  ### 1. LLM Provider for Content Generation

  **Chosen:** Claude API via Anthropic, configured as reasoning_model in Sheep settings.
  Accessed through CrewAI's LLM abstraction layer using get_reasoning_llm() from config/llm.py.

  **Rejected:**
  - Direct OpenAI API (GPT-4o) — While available as default_model, content_generators.py
    explicitly uses Anthropic/Claude for reasoning tasks. Maintaining consistency with prior
    89+ features ensures predictable, coherent output.
  - Manual hardcoded prose — Contradicts Sheep's LLM-driven automation philosophy.
    Unsustainable for 89+ files; automation through LLM is the established pattern.
  - External content APIs — Adds unnecessary external dependencies. In-system LLM is faster,
    more reliable, and already integrated.

  **Rationale:** The Sheep codebase is fundamentally LLM-driven. The content_generators module
  uses get_reasoning_llm() which defaults to Claude 3.5 Sonnet. This choice:
  - Aligns with proven pattern from features 069-089 (89+ test files)
  - Reuses tested, production-ready code (no reinvention)
  - Claude consistently generates coherent, grammatically correct prose
  - No additional setup or dependencies required

  ### 2. File I/O with Cross-Platform Line Ending Handling

  **Chosen:** Python pathlib.Path with text-mode open() using `newline=""` parameter.
  Pattern: `open(filepath, "w", encoding="utf-8", newline="").write(content)`

  **Rejected:**
  - Binary mode with manual byte writing — Unnecessary complexity. Text mode with newline=""
    is the standard, cleaner Python approach.
  - FileWriteTool from CrewAI — Adds abstraction layer for a simple operation.
    Direct pathlib is more idiomatic and matches content_generators pattern.
  - Third-party file management libraries (pathspec, fsspec) — No added value for basic file creation.

  **Rationale:** pathlib is idiomatic Python 3.11+, cross-platform, and extensively used
  in content_generators.py. The critical detail is handling line endings:
  this feature runs on Windows Server 2025 but requires Unix LF (\n) line endings per spec (NFR-2).
  Python's text mode on Windows defaults to CRLF. The solution is the standard Python technique:
  `newline=""` parameter prevents automatic line ending conversion while preserving UTF-8 text handling.
  This is what the validate_markdown_file() function expects (checks for and rejects CRLF at lines 196-198).

  ### 3. Markdown Prompt and Content Validation

  **Chosen:** Use existing MARKDOWN_GENERATION_PROMPT template and validation functions
  from content_generators.py. Prompt instructs LLM to generate H1 heading + blank line +
  2-3 sentences with no extraneous text. Validate with _validate_markdown_content() and
  validate_markdown_file().

  **Rejected:**
  - Custom prompt variations — MARKDOWN_GENERATION_PROMPT (lines 13-24) is proven across
    89+ implementations. No reason to rewrite when existing version works reliably.
  - Skip validation — Would violate NFRs (encoding, line endings, format, file size).
    Validation catches 10+ error categories early.
  - LLM post-processing — Adds latency and failure points. Prompt is well-designed;
    simple parsing suffices.

  **Rationale:** The content_generators module contains mature, production-tested code.
  The prompt clearly specifies format requirements. Validation functions (71-244 lines)
  comprehensively check: UTF-8 without BOM, LF-only line endings, H1 format, blank line,
  2-3 sentences, trailing newline, file size. Reusing proven components reduces risk
  and maintains consistency with 89+ prior successful features.

  ### 4. Git Workflow (Stage, Commit, Push)

  **Chosen:** Use git CLI via subprocess through GitCommitTool and GitPushTool from
  sheep.tools.git_tools. Workflow: `git add test-9ur3n4.md` → commit with conventional
  message → push to feature branch.

  **Rejected:**
  - GitPython library — While in dependencies (gitpython>=3.1.0), current codebase uses
    git CLI via subprocess. Switching would diverge from established pattern.
  - Manual git command construction — Could work but less safe. Tool abstractions provide
    error handling, logging, and consistency.
  - Auto-push without explicit add — Skips spec requirement (FR-6) for explicit staging.
    Proper workflow maintains separation of concerns.

  **Rationale:** sheep.tools.git_tools provides tested abstractions (GitCommitTool lines 213-239,
  GitPushTool lines 255-288) that wrap git CLI with error handling. This is the established
  pattern. The feature branch feat/090-markdown-file-creation-4373fd is pre-created.
  Conventional commit message format is: `feat(090): create markdown file test-9ur3n4.md with prose content`

  ### 5. Prose Topic Selection

  **Chosen:** Allow LLM to freely select the topic via the prompt.
  Prompt says "with a title about any topic you choose" (line 14).
  No constraints, filters, or predefined topic list.

  **Rejected:**
  - Predefined topic list — Adds maintenance burden and configuration overhead.
    Spec (FR-5) explicitly allows "any generic/universal topic", so constraints are unnecessary.
  - User/environment input — Feature is fully automated. Sheep doesn't require human interaction.
  - Topic validation/filtering — LLM consistently generates suitable topics (see test files:
    "The Value of Learning from Experience", "The Art of Deep Work"). Filtering is premature
    optimization.

  **Rationale:** Sheep is LLM-driven and fully automated. The spec allows any generic/universal topic.
  Claude reliably generates appropriate, coherent topics. No filtering needed. This approach is
  simplest, most flexible, and aligns with Sheep's automation philosophy.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File path handling and I/O | **Use** | Idiomatic Python 3.11+, cross-platform, already used extensively in content_generators.py |
  | CrewAI | LLM framework abstraction | **Use** | Already integrated in Sheep, handles multi-provider LLM support (OpenAI, Anthropic, Google) |
  | Anthropic Claude API | LLM for content generation | **Use** | Configured as reasoning_model, proven across 89+ features, reliably generates coherent prose |
  | subprocess (stdlib) | Git CLI execution | **Use** | Current pattern in git_tools.py, provides control and error handling |
  | GitPython | Alternative git library | **Reject** | Already in dependencies but codebase uses git CLI via subprocess. Switching would diverge from established pattern. |
  | Third-party file libs | Advanced file operations | **Reject** | No added value for simple text file creation. pathlib suffices. |

  ## Security Considerations

  1. **File Path Traversal Prevention:**
     - content_generators.write_markdown_file() validates filenames (line 117-118):
       Rejects paths with "/" or "\\" or starting with "." to prevent directory traversal.
     - Implementation must use this validation; only pass "test-9ur3n4.md", not paths.

  2. **UTF-8 Encoding Safety:**
     - Files are UTF-8 encoded without BOM, preventing encoding-based injection attacks.
     - No shell commands or code execution from file content.

  3. **Git Command Injection:**
     - git_tools.py uses subprocess with list arguments (not shell=True), preventing
       command injection via filename or commit message. Commit message is passed via -m flag.

  4. **Temporary File Handling:**
     - No temporary files created. File is written directly to repository root.
     - No intermediate processing that could leak content.

  5. **API Key Exposure:**
     - LLM calls use configured credentials from environment (.env or settings).
     - No hardcoded API keys. CrewAI handles secure credential management.

  **Conclusion:** No novel security risks introduced. Implementation reuses proven, secure
  patterns from content_generators and git_tools modules.

  ## Performance Implications

  1. **LLM API Latency:**
     - Claude API call typically takes 2-5 seconds depending on network.
     - This is the dominant operation; file I/O and git ops are negligible (~100-500ms combined).
     - Total expected time: 3-7 seconds for complete workflow.

  2. **File I/O Performance:**
     - Single file write: ~1-5ms for 320-600 byte file on modern storage.
     - Negligible impact.

  3. **Git Operations:**
     - git add: ~5-20ms
     - git commit: ~10-50ms
     - git push: 500ms-2s depending on network and remote size
     - Combined: ~1-2 seconds

  4. **Memory Usage:**
     - String content: ~500 bytes (markdown) + ~100 bytes overhead = ~1KB peak
     - No memory concerns for this small operation.

  5. **Optimization Notes:**
     - No caching needed (single-run feature).
     - Parallel execution not applicable (sequential workflow).
     - No database or heavy I/O beyond file creation.

  **Conclusion:** Performance is acceptable. LLM latency (2-5s) dominates but is unavoidable
  for content generation. No optimization needed.

  ## Architecture Notes

  ### Integration with Sheep Platform

  The implementation leverages existing Sheep architecture:

  1. **Content Generation:** Uses content_generators.py module designed for exactly this workflow.
     This module is part of the core application (src/sheep/) and is reused across 89+ features.

  2. **LLM Configuration:** Uses sheep.config.llm.get_reasoning_llm() which respects environment
     settings and supports multiple providers (OpenAI, Anthropic, Google, Cursor). This is
     the standard LLM access pattern across Sheep.

  3. **Logging and Observability:** Uses sheep.observability.logging.get_logger() for structured
     logging. Compatible with Langfuse observability integration configured in settings.

  4. **Git Tools:** Reuses sheep.tools.git_tools.GitCommitTool and GitPushTool which provide
     consistent error handling and logging across the platform.

  5. **Settings and Configuration:** Uses sheep.config.settings.get_settings() to access API
     keys, model configuration, and other settings from .env and environment variables.

  ### No Architectural Changes Required

  This feature does not require:
  - New modules or refactoring of existing code
  - Changes to flows or agent structure
  - Configuration file modifications (pyproject.toml, .env, etc.)
  - New dependencies (all used libraries already in requirements)

  ### Established Pattern Across 89+ Features

  Features 069-089 follow the same implementation pattern:
  - Call create_markdown_file(filename)
  - Returns success/failure with metadata
  - Creates test-{random}.md file at repo root
  - Commits with feat({number}): create markdown... message
  - Pushes to pre-created feature branch

  This feature (090) follows the identical pattern. No architectural exploration needed.

  ## Implementation Approach (Recommended)

  **Use the create_markdown_file() function directly:**

  ```python
  from sheep.content_generators import create_markdown_file

  result = create_markdown_file("test-9ur3n4.md")
  print(f"Created: {result['filepath']}")
  print(f"Commit: {result['commit_message']}")
  ```

  **Why this approach:**
  - Minimal code (3 lines)
  - Proven across 89+ implementations
  - Complete error handling and validation included
  - Returns metadata for verification and logging
  - Maintains consistency with features 069-089

  ## File Size and Content Validation

  The spec requires file size 320-600 bytes (NFR-3). Observed examples:
  - test-objvv0.md: 423 bytes
  - test-l20qnc.md: 388 bytes

  Content structure:
  ```
  # Title (20-40 bytes)

  Sentence 1. Sentence 2. Sentence 3. (150-350 bytes)

  ```

  Markdown overhead: 20-30 bytes (heading, blank lines, trailing newline)
  **Expected range: 300-600 bytes** ✓ Matches spec

  The LLM prompt provides example format which Claude follows reliably
  based on 89+ observed outputs.

  ## Testing and Validation

  The validate_markdown_file() function (content_generators.py:150-244) performs
  10+ validation checks:

  1. File exists and is a file
  2. No UTF-8 BOM
  3. Valid UTF-8 encoding
  4. No CRLF line endings (LF only)
  5. H1 heading at start
  6. First line is H1 heading
  7. Second line is blank
  8. Prose content exists after blank line
  9. Sentence count (2-3)
  10. Trailing newline present

  All checks must pass. This is part of the create_markdown_file() orchestration
  and is automatically run at step 3 of the workflow.

  ## Known Issues and Mitigations

  ### Windows CRLF Line Ending Conversion

  **Issue:** Python's open() in text mode on Windows converts \n to \r\n by default.
  The spec requires LF-only line endings (NFR-2).

  **Mitigation:** Use `newline=""` parameter in open():
  ```python
  open(filepath, "w", encoding="utf-8", newline="").write(content)
  ```

  This is the standard Python approach for portable text file writing.
  The existing write_markdown_file() implementation should use this correctly.

  ### LLM Rate Limiting or API Failures

  **Issue:** Claude API calls could fail due to rate limits, quota exhaustion, or network issues.

  **Mitigation:** CrewAI's LLM framework includes built-in retry logic. If retry logic is
  insufficient, the create_markdown_file() function's exception handling (line 427-429)
  will catch errors and log them with context.

  ### Sentence Count Validation Edge Cases

  **Issue:** Period-heavy content (abbreviations, decimals) could confuse sentence counting.

  **Rationale:** The validation function counts periods as sentence delimiters (line 227-231).
  For simple prose (2-3 sentences), this is reliable. Complex edge cases are handled by
  the LLM's understanding of natural sentence structure.

  ## Comparison with Prior Features (089, 088, 087)

  All recent markdown file creation features (089-087) use the same pattern:
  - Same content_generators.py module
  - Same LLM (Claude)
  - Same file structure (H1 + blank line + prose)
  - Same git workflow
  - Same validation approach

  Feature 090 is architecturally identical. No new patterns or decisions needed.
  Reuses proven implementation from features 069-089.

  ---

  **Research Complete** — All technical decisions documented with rationale.
  Ready for implementation phase.
