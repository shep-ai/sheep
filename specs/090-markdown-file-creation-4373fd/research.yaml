decisions:
  - title: LLM Provider for Content Generation
    chosen: >
      Claude API via Anthropic (configured as reasoning_model in Sheep settings).
      Use CrewAI's LLM abstraction layer via get_reasoning_llm() from config/llm.py.
    rejected:
      - >
        Direct OpenAI API calls (GPT-4o) — While configured as default_model,
        the content_generators module already uses Anthropic/Claude as reasoning_model.
        Claude is suitable for creative prose generation; reusing existing configuration
        maintains consistency with prior features (089, 088, etc.) that likely used Claude.
      - >
        Manual hardcoded prose content — Counter to Sheep's automation goals.
        Would require maintaining topic/content lists and wouldn't leverage LLM efficiency
        demonstrated across 89+ existing test files.
      - >
        External content APIs (contentful, etc.) — Adds unnecessary dependency.
        LLM-based generation is simpler, faster, and already integrated.
    rationale: >
      The Sheep codebase is an LLM-driven automated implementation platform. The content_generators.py
      module explicitly uses get_reasoning_llm() which defaults to Claude 3.5 Sonnet.
      This approach: (1) Aligns with established pattern from 89+ prior features;
      (2) Maintains consistency with Sheep's automation-first architecture;
      (3) Reuses existing, tested code in content_generators.generate_markdown_content();
      (4) Claude reliably generates coherent, grammatically-correct prose meeting all requirements;
      (5) No additional dependencies or configuration needed beyond what exists.

  - title: File I/O and Path Handling
    chosen: >
      Python pathlib.Path with text-mode open() using explicit newline="" parameter
      to prevent Windows CRLF conversion. Use Path.write_text() or equivalent.
    rejected:
      - >
        FileWriteTool from CrewAI tools — Excessive abstraction for direct implementation.
        While available, direct pathlib usage is simpler and matches content_generators pattern.
      - >
        Binary mode with manual byte writing — Unnecessary complexity.
        Text mode with newline="" parameter is the standard Python approach.
      - >
        Third-party file management libraries (pathspec, fsspec, etc.) — No added value for this simple operation.
    rationale: >
      The established pattern in content_generators.py uses pathlib.Path extensively
      (lines 121-122, 171-177, etc.). This is idiomatic Python 3.11+, cross-platform,
      and proven in production across 89+ test files. Critical detail: the environment is
      Windows Server 2025, but the spec requires Unix LF line endings (not CRLF).
      Python's text mode on Windows defaults to CRLF. Solution: use newline="" in open()
      to prevent automatic conversion: `open(path, "w", encoding="utf-8", newline="").write(content)`.

  - title: Line Ending Enforcement (Windows Environment, Unix Requirement)
    chosen: >
      Use newline="" parameter in open() when writing file to prevent Windows line ending
      conversion. Generate content with only \n (LF), never \r\n (CRLF).
      Validate with validate_markdown_file() which checks for CRLF and raises ValueError.
    rejected:
      - >
        Git's core.safecrlf config — Operates at repo level, not per-file.
        Would require repo-wide setting change; spec requires Unix LF specifically for this file.
      - >
        Binary mode with manual \n bytes — Works but less idiomatic.
        newline="" parameter is the standard Python approach for portable text file writing.
      - >
        Accepting CRLF and converting on push — Violates spec requirement (NFR-2).
        Spec explicitly requires Unix LF (\n) only, no CRLF.
    rationale: >
      Environment is Windows Server 2025. Without special handling, Python's open() in text mode
      converts \n to \r\n on write. But the spec (NFR-2) requires Unix-style LF only.
      The validate_markdown_file() function (content_generators.py:196-198) explicitly rejects
      CRLF with "File uses CRLF line endings (should use LF)". The correct approach is the
      standard Python technique: newline="" prevents automatic conversion while still using
      text mode for UTF-8 handling. This is used in the existing codebase and is the
      most reliable cross-platform solution.

  - title: Markdown Content Generation Prompt and Validation
    chosen: >
      Use MARKDOWN_GENERATION_PROMPT template from content_generators.py (lines 13-24).
      Prompt instructs LLM to generate H1 heading + blank line + 2-3 sentences with no extra text.
      Validate output with _validate_markdown_content() and validate_markdown_file() functions.
    rejected:
      - >
        Custom prompt variations — MARKDOWN_GENERATION_PROMPT is proven across 89+ files.
        Unnecessary to rewrite or customize when existing prompt reliably works.
      - >
        Skip validation steps — Would violate NFR requirements (encoding, line endings, format).
        Validation catches common errors early (sentence count, heading format, etc.).
      - >
        LLM post-processing and restructuring — Adds latency and failure points.
        Prompt is well-designed; LLM output parsing is straightforward.
    rationale: >
      The content_generators module contains a mature, tested implementation (89+ successful uses).
      The prompt (lines 13-24) clearly instructs the LLM on format requirements.
      Validation functions (lines 71-244) comprehensively check: UTF-8 encoding, no BOM,
      LF-only line endings, H1 heading format, blank line separator, sentence count (2-3),
      trailing newline, and file size expectations. Reusing these proven components reduces
      risk and ensures consistency with prior implementations.

  - title: Git Workflow Integration (Stage, Commit, Push)
    chosen: >
      Use git CLI commands via subprocess (as implemented in git_tools.py).
      Stage with "git add test-9ur3n4.md", commit with conventional message,
      push to feature branch feat/090-markdown-file-creation-4373fd using GitCommitTool
      and GitPushTool from sheep.tools.git_tools.
    rejected:
      - >
        GitPython library — Already in dependencies (gitpython>=3.1.0), but git CLI via
        subprocess is the current pattern in git_tools.py. Switching would diverge from
        established codebase pattern.
      - >
        Manual git command construction with no abstraction — Could work but less safe.
        Using tool abstractions (GitCommitTool, GitPushTool) ensures consistent error handling
        and logging.
      - >
        Auto-push without explicit staging — Would skip the git add step required by spec (FR-6).
        Proper workflow: add → commit → push (with proper separation of concerns).
    rationale: >
      The sheep.tools.git_tools module provides GitCommitTool (lines 213-239) and GitPushTool
      (lines 255-288) which wrap git CLI in subprocess calls with error handling and logging.
      This is the established pattern across the codebase. GitCommitTool supports both
      "add all" and selective staging. For this feature, we use add_all=False and explicitly
      call "git add test-9ur3n4.md" first, then commit with conventional message
      "feat(090): create markdown file test-9ur3n4.md with prose content", then push.
      The feature branch feat/090-markdown-file-creation-4373fd already exists (pre-created).

  - title: Prose Topic Selection Strategy
    chosen: >
      Let LLM choose the topic freely via MARKDOWN_GENERATION_PROMPT.
      Prompt (line 14) says "An H1 heading (using #) with a title about any topic you choose".
      No topic filtering, constraints, or predefined list.
    rejected:
      - >
        Predefined topic list — Adds maintenance burden and configuration overhead.
        Spec (FR-5) explicitly allows "any generic/universal topic", so constraint is unnecessary.
        Random selection from list would complicate implementation without benefit.
      - >
        User/environment input for topic — Feature is fully automated; no human interaction.
        Sheep is designed for autonomous LLM-based implementation without external input.
      - >
        Topic validation/filtering — LLM-generated topics are reliable and diverse.
        Adding filtering rules would be premature optimization; existing 89+ files show
        LLM consistently produces suitable topics.
    rationale: >
      The Sheep platform is fully automated and LLM-driven. The spec (FR-5) explicitly allows
      "any generic/universal topic" with no constraints. The LLM (Claude) reliably generates
      appropriate, coherent topics. Observed examples from test files (test-objvv0.md,
      test-l20qnc.md) show Claude naturally produces professional, meaningful topics.
      No filtering or constraints are needed. This approach is simplest, most flexible, and
      aligns with Sheep's automation philosophy.

