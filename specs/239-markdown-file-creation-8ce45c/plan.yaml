# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the established pattern from 238+ prior markdown-file-creation implementations.
  The task is straightforward: create a single markdown file in the repository root, stage it in git,
  and commit/push with a conventional commit message.

  The implementation involves two sequential phases:

  1. **File Creation Phase**: Compose and write the markdown file to disk with proper structure
  2. **Git Integration Phase**: Execute the standard git workflow (add → commit → push)

  The feature is fully isolated at the repository root and does not interact with the /src/sheep/
  application source code, test files, or configuration. Success criteria focus on file structure
  (markdown syntax, encoding, line endings) and git operations (staging, commit message format, push).

  ## Key Design Decisions

  ### 1. Use pathlib.Path.write_text() for File I/O

  **Decision**: Use Python standard library `pathlib.Path.write_text()` to create the file.

  **Why**:
  - Modern, idiomatic Python 3.11+ approach for file writing
  - Automatically handles UTF-8 encoding without BOM
  - On Unix systems, naturally produces LF line endings (satisfies NFR-2)
  - Clean, readable syntax
  - No external dependencies (stdlib only)
  - Proven across all 558+ existing test files

  **Alternatives Considered**:
  - `open()` builtin: More boilerplate with context manager, less idiomatic than pathlib
  - `os.open()`: Lower-level, verbose, requires manual encoding management
  - External utilities: Unnecessary indirection for a stdlib operation

  ### 2. Free-Form Prose Content Selection

  **Decision**: Implementer chooses the topic and writes 2-3 sentences of original prose.

  **Why**:
  - Spec explicitly permits free-form topic selection (NFR-8)
  - 558+ existing test files demonstrate diverse topics (innovation, testing, nature, etc.)
  - No research or complex decisions needed
  - Simple prose writing requires no special tooling or templates

  **Alternatives Considered**:
  - Template strings: Limits flexibility, contradicts spec's explicit allowance
  - Generated content: Over-engineered for 2-3 sentences
  - External API (LLM): Violates NFR-9 (no new dependencies)

  ### 3. Git CLI Commands for Version Control

  **Decision**: Use shell-invoked git CLI commands (add, commit, push).

  **Why**:
  - Established pattern across all 238+ prior implementations
  - Transparent and auditable — can see exactly what's happening
  - Three simple, self-contained commands suffice
  - No additional dependencies required beyond git (already available)

  **Alternatives Considered**:
  - GitPython library: Available in dependencies but adds unnecessary abstraction for simple commands
  - sh/pexpect libraries: Not in dependencies, overkill for standard git commands
  - Git plumbing (write-tree, commit-tree): Overcomplex for add/commit/push workflow

  ## Implementation Strategy

  **Phase 1 - Markdown File Creation** comes first because the file must exist before git operations.

  Task sequence:
  1. Compose prose content (2-3 sentences on any topic)
  2. Write markdown file using pathlib with proper structure (heading + blank line + prose)
  3. Validate file encoding (UTF-8, no BOM) and line endings (LF)

  **Phase 2 - Git Workflow Integration** follows after file creation succeeds.

  Task sequence:
  1. Stage the file with `git add test-4ulmku.md`
  2. Commit with conventional message: `feat(239): Create markdown file test-4ulmku.md with prose content`
  3. Push to remote with `git push -u origin HEAD`

  This ordering is critical: file must exist locally → stage → commit → push. No reversing this sequence.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding mismatch (not UTF-8 or contains BOM) | pathlib.Path.write_text() handles encoding automatically; validate with binary inspection |
  | Line ending issues (CRLF instead of LF) | pathlib uses platform newlines (LF on Unix); verified by 558+ existing files with same approach |
  | Git configuration missing (user.name, user.email) | Assume standard git configuration already set up (used in all prior 238 implementations) |
  | File already exists (naming collision) | Use filename provided in spec (test-4ulmku.md); this is first implementation with this name |
  | Insufficient write permissions | Writing to repository root under version control; standard git permissions apply |
  | Push fails (remote unreachable) | git push will fail loudly with clear error; diagnose network/permission issues; retry |
  | Prose quality issues | Spec allows free-form topic; implementer responsible for readable, grammatically correct sentences |

