  ## Implementation Blueprint

  ### Step 1: Compose Content
  1. Choose prose topic (any topic)
  2. Write 2-3 sentences of readable, grammatically correct prose
  3. Create markdown string: `# Title\n\n<prose>\n`

  ### Step 2: Write File
  ```python
  from pathlib import Path

  content = \"# My Title\n\nSentence one. Sentence two. Sentence three.\n\"
  Path(\"test-4ulmku.md\").write_text(content, encoding=\"utf-8\")
  ```

  ### Step 3: Verify File
  - File exists at repository root
  - File size is 350-600 bytes (natural outcome of structure)
  - Content is readable and grammatically correct

  ### Step 4: Git Workflow
  ```bash
  git add test-4ulmku.md
  git commit -m \"feat(239): Create markdown file test-4ulmku.md with prose content\"
  git push -u origin HEAD
  ```

  ### Step 5: Verify Git State
  - `git log` shows the new commit on feature branch
  - `git status` shows clean working directory
  - Remote repository reflects the pushed commit

