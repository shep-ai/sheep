content: |
  ## Architecture Overview

  This feature creates a standalone Python script (`scripts/create_markdown.py`) with zero
  dependencies on application code in `/src/sheep/`. The implementation follows a simple,
  linear flow:

  1. **Content Definition**: Define markdown content as a Python string constant
  2. **File Creation**: Write content to `test-70rjoj.md` using pathlib.Path.write_text()
  3. **Validation**: Verify file properties (encoding, line endings, structure, size)
  4. **Git Integration**: Stage, commit, and push using subprocess with git CLI
  5. **Error Handling**: Fail fast with exit code 1 on any error; exit code 0 on success

  The script is self-contained and executable directly from the command line:
  ```
  python scripts/create_markdown.py
  ```

  This approach aligns with the 240+ existing test files (test-*.md in repository root),
  which are artifacts created through similar simple file-writing operations.

  **Why standalone script vs. integrated into application:**
  - Feature spec explicitly requires no modification to application source code (/src/sheep/)
  - Test artifact creation is logically separate from application logic
  - Standalone script is easier to test, debug, and reuse
  - No need to understand CrewAI agents or application architecture

  ## Key Design Decisions

  ### 1. File I/O Method: Python pathlib (vs. os.path or open())

  **Chosen:** pathlib.Path.write_text()

  **Why:** Pathlib is modern, idiomatic Python 3.11+. The project targets Python 3.11+,
  and pathlib provides object-oriented, cross-platform file operations. Single-line invocation
  with explicit encoding handling: `Path("test-70rjoj.md").write_text(content, encoding='utf-8', newline='')`.

  **Alternatives rejected:**
  - os.path API: older design, less ergonomic, requires open() context manager
  - open() with context manager: lower-level, more boilerplate code

  ### 2. Content Strategy: Hard-Coded Prose (vs. parameterized or generated)

  **Chosen:** Hard-code meaningful prose content on a specific topic

  **Why:** Simplest, fastest, deterministic approach. Feature spec permits flexible topic
  selection with no restrictions. Hard-coded prose eliminates external dependencies (no
  parameterization logic, no API calls, no random number generation) while naturally yielding
  the ~400-600 byte target. Matches the 240+ existing test files, each with curated prose.

  **Alternatives rejected:**
  - Parameterized content: unnecessary abstraction for single-file operation
  - Random topic selection: introduces non-determinism and requires data file
  - Generated from API/NLP: external service dependency, slower execution

  ### 3. Line Ending Handling: Explicit LF with newline=''

  **Chosen:** Build content string with `\n` and use `newline=''` parameter in write_text()

  **Why:** Spec explicitly requires LF (Unix-style) line endings, not CRLF (Windows default).
  Using explicit `\n` in the content string and `newline=''` in write_text() ensures LF
  on all platforms, including Windows. This is the most portable approach.

  **Alternative rejected:**
  - Platform-default line endings: would produce CRLF on Windows, violating spec

  ### 4. Encoding: UTF-8 Without BOM

  **Chosen:** UTF-8 encoding without Byte Order Mark

  **Why:** UTF-8 without BOM is the standard for modern text files, required by CommonMark
  specification, and used throughout the 240+ existing test files. Python's default
  `encoding='utf-8'` never adds a BOM (only UTF-16 gets BOM by default).

  **Alternative rejected:**
  - UTF-8 with BOM or UTF-16: violates CommonMark spec and existing pattern

  ### 5. Git Integration: subprocess with git CLI (vs. GitPython/pygit2)

  **Chosen:** Python subprocess module to invoke git CLI commands

  **Why:** Requires zero external dependencies (subprocess is standard library).
  Git CLI is stable, available on all systems with git installed, and provides full
  transparency and control. Only needs basic operations: add, commit, push.

  **Alternatives rejected:**
  - GitPython: external dependency, heavier API than needed
  - pygit2: compiled C dependency, requires libgit2, unnecessary complexity
  - Shell script: less portable, harder to validate, string handling complexity

  ### 6. Validation: Standard File Properties

  **Chosen:** Verify file exists, size, encoding, and structure

  **Why:** After Path.write_text(), verify file was created correctly by checking:
  - File exists (Path.exists())
  - File size is ~400-600 bytes (Path.stat().st_size)
  - File is readable as UTF-8 (re-read and decode)
  - Markdown structure is correct (heading + blank line + 2-3 sentences)

  These checks are straightforward string/byte operations with no external dependencies.
  Catches obvious write failures (permissions, disk space) early without full CommonMark parsing.

  **Alternative rejected:**
  - Minimal validation: risks late discovery of encoding/format issues
  - Extensive parsing with CommonMark library: external dependency for simple structure

  ### 7. Error Handling: Fail Fast with Clear Messages

  **Chosen:** Raise exceptions with descriptive error messages; exit with status 1 on error

  **Why:** For straightforward file creation and git operations, any failure is a real
  problem that should be visible. Spec requires exit status 0 on success (implying non-zero
  on failure). Clear error messages facilitate debugging.

  **Alternative rejected:**
  - Silent failures: mask real problems
  - Retry logic: unnecessary for local file operations; root causes need fixing

  ## Implementation Strategy

  **Phase ordering rationale:**

  1. **Phase 1 (Script Foundation):** Create the basic script structure with main entry point,
     error handling, and exit codes. This provides the skeleton for subsequent phases.

  2. **Phase 2 (File Creation & Validation):** Implement the core file I/O and validation logic.
     File creation must be validated immediately to ensure correctness before proceeding to git.

  3. **Phase 3 (Git Integration):** Implement staging, committing, and pushing. By this point,
     the file is known to be correct, so git operations can focus on integration without
     worrying about file validity.

  4. **Phase 4 (Integration Testing):** Run the complete script end-to-end and verify all
     requirements are met. This confirms the script works as an integrated whole.

  **Why this order:**
  - Foundation first: everything depends on correct script structure and error handling
  - File I/O before git: verify file is correct before touching version control
  - Testing last: only after all components are integrated
  - No parallelization: each phase builds on the previous one

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File creation fails (permissions, disk space) | Explicit error handling in file creation; validation after write catches issues |
  | Git operations fail (misconfigured git, branch doesn't exist) | Explicit error handling for subprocess calls; clear error messages show git output |
  | Encoding mismatch (CRLF instead of LF) | Explicit `newline=''` parameter and UTF-8 encoding; validation re-reads and checks |
  | File size outside 400-600 byte range | Validation checks file size; adjust prose content if needed during implementation |
  | Markdown structure incorrect | Validation checks for heading + blank line + sentences; structure is simple and deterministic |
  | Script is not executable | Standalone Python script, no special permissions needed; run with `python scripts/create_markdown.py` |

  ## Files

  **Create:**
  - `scripts/create_markdown.py` — Standalone script implementing file creation, validation, and git integration

  **Modify:**
  - None — Feature requires no modifications to existing files

  ## Success Criteria

  - [ ] Script runs without errors and exits with status 0
  - [ ] File `test-70rjoj.md` exists in repository root with correct content
  - [ ] File is UTF-8 encoded without BOM, uses LF line endings, ~400-600 bytes
  - [ ] Markdown structure is valid: one heading + blank line + 2-3 sentences
  - [ ] File is staged and committed with message: "feat(243): create markdown file test-70rjoj.md with prose content"
  - [ ] Commit is pushed to feature branch feat/243-markdown-file-creation-967ad1
  - [ ] All validation checks pass without errors
