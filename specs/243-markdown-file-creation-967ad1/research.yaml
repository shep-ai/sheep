decisions:
  - title: "File I/O Method"
    chosen: "Python pathlib.Path"
    rejected:
      - "os.path API — older design, less ergonomic, equivalent functionality to pathlib"
      - "open() with context manager — lower-level, requires more boilerplate than Path.write_text()"
    rationale: >
      pathlib is the modern, Pythonic approach for file I/O in Python 3.11+.
      The project already targets Python 3.11+, and pathlib provides object-oriented,
      cross-platform file operations. The single-line Path(filename).write_text(content, encoding='utf-8')
      is clean and explicit about encoding. This approach is idiomatic and requires no additional imports
      beyond the standard library.

  - title: "Content Strategy"
    chosen: "Hard-coded prose content with flexible topic selection"
    rejected:
      - "Random topic selection from a predefined list — adds complexity and external data dependency"
      - "Generated content from an NLP model or API — introduces external dependencies and slower execution"
    rationale: >
      Hard-coded prose is the simplest, fastest approach that aligns with the feature's requirements.
      The spec explicitly permits flexible topic selection with no restrictions. By choosing a single,
      meaningful topic with 3 well-written sentences, we satisfy all requirements (UTF-8, proper structure,
      ~400-600 bytes) while maintaining zero external dependencies. This mirrors the 240+ existing test files,
      each with curated, topic-specific prose content.

  - title: "Line Ending Normalization"
    chosen: "Explicit LF line ending using Python string literals (\\n)"
    rejected:
      - "Platform-default line endings with os.linesep — would produce CRLF on Windows, violating spec"
      - "Manual binary mode with rb/wb — overly complex for text file creation"
    rationale: >
      The spec explicitly requires LF (Unix-style) line endings, not CRLF (Windows default).
      Using Python string literals with \\n ensures LF on all platforms, including Windows.
      pathlib.Path.write_text() with encoding='utf-8' automatically converts \\n to the platform default,
      so we must use newline='' parameter in write_text() or explicitly use binary mode, or instead
      construct the string with explicit \\n and use Path.write_bytes() with UTF-8 encoded content.
      The simplest approach: build content string with explicit \\n and use Path.write_text(content, encoding='utf-8', newline='').

  - title: "Encoding Specification"
    chosen: "UTF-8 without BOM (Byte Order Mark)"
    rejected:
      - "UTF-16 or other encodings — adds complexity and incompatibility with Unix text tools"
      - "UTF-8 with BOM — violates CommonMark spec and existing test file pattern"
    rationale: >
      UTF-8 without BOM is the standard for web/text, required by the CommonMark spec, and used throughout
      the 240+ existing test files. Python's default encoding='utf-8' parameter in pathlib and open()
      never adds a BOM (Python only adds BOM for UTF-16 or when explicitly requested). This is the most
      compatible encoding for Unix-like systems and aligns with project conventions.

  - title: "Git Integration Approach"
    chosen: "subprocess module with git CLI commands"
    rejected:
      - "GitPython library — adds external dependency, heavier implementation for simple operations"
      - "pygit2 — adds compiled C dependency, requires libgit2, not necessary for basic operations"
    rationale: >
      The feature requires only basic git operations: add, commit, push. Using subprocess with git CLI
      is lightweight, requires no external dependencies beyond Python standard library, and provides full
      control and transparency. The git command-line interface is stable and available on all systems with git.
      This approach avoids supply chain risk from external Python packages and keeps the implementation minimal.

  - title: "Validation Approach"
    chosen: "Standard validation: verify file exists, check encoding, validate structure, confirm file size"
    rejected:
      - "Minimal validation (file exists only) — risks format inconsistency and late discovery of encoding issues"
      - "Extensive validation with CommonMark parser library — adds external dependency for marginal benefit"
    rationale: >
      Standard validation checks critical properties: UTF-8 encoding verification, LF line ending confirmation,
      file size in range (400-600 bytes as natural outcome of proper structure), and markdown structure
      (one heading, blank line, 2-3 sentences). These checks are straightforward string/byte operations without
      external dependencies. Extensive parsing adds no value since the file structure is simple and deterministic.
      This balances correctness (catching format issues early) with simplicity (no external deps).

  - title: "Error Handling Strategy"
    chosen: "Fail fast with clear error messages; exit with status 1 on any error"
    rejected:
      - "Silent failures or warnings — mask real problems and violate spec requirement for exit status 0 on success"
      - "Retry logic with backoff — unnecessary for local file operations; indicates deeper problems that should be fixed, not masked"
    rationale: >
      For a straightforward file creation and git operation, any error (file creation failure, encoding mismatch,
      git failure) indicates a real problem that should be visible. Failing fast with clear error messages helps
      debugging. The spec explicitly requires exit status 0 on success, implying non-zero on failure. Retry logic
      adds complexity without addressing root causes (disk full, permission denied, git misconfiguration).

