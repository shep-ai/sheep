content: |
  ## Summary

  This task breakdown implements a standalone Python script for creating a test markdown file
  with git integration. Work flows through four phases:

  **Phase 1 (Script Foundation):** Create the basic script structure with main entry point
  and error handling. Establishes the foundation for all subsequent phases.

  **Phase 2 (File Creation & Validation):** Define markdown content, write to disk using pathlib
  with UTF-8 encoding and explicit LF line endings, then validate all file properties
  (size, encoding, structure, line endings).

  **Phase 3 (Git Integration):** Implement git staging, committing with the exact conventional
  commit message, and pushing to the feature branch using subprocess.

  **Phase 4 (Integration Testing):** Run the complete script end-to-end and verify all
  success criteria are met through git history and filesystem checks.

  **Key implementation principles:**
  - Each task builds on the previous one (strict dependencies)
  - TDD approach: RED (test assertion) → GREEN (minimal code) → REFACTOR (cleanup)
  - Simple, straightforward logic with no external dependencies
  - Comprehensive validation and error handling
  - Clear git integration with subprocess (no shell=True for security)

  **Effort breakdown:**
  - Task 1 (Script foundation): 3 minutes
  - Task 2 (Content definition): 2 minutes
  - Task 3 (File creation): 2 minutes
  - Task 4 (Validation): 4 minutes
  - Task 5 (Git integration): 5 minutes
  - Task 6 (Integration testing): 2 minutes
  - **Total: 15 minutes** (aligns with size estimate of 10-15 minutes)

  No blockers or architectural risks identified. Implementation is straightforward and follows
  established patterns from 240+ identical test files already in the repository.
