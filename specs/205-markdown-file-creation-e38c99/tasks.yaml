# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation of feature 205 is broken into 16 concrete tasks across 4 phases, totaling 5-6 hours of effort.

  **Phase 1 (Foundation):** Tasks 1-2 create the basic module structure and file creation using pathlib,
  plus immediate existence validation.

  **Phase 2 (Validation):** Tasks 3-10 implement comprehensive validation for all success criteria: heading
  format, blank line, sentence counting, encoding/line endings, file size, trailing newline, and a wrapper
  orchestrator.

  **Phase 3 (Git Integration):** Tasks 11-14 implement git operations (add, commit, push) using subprocess
  with comprehensive error handling.

  **Phase 4 (Integration & Verification):** Tasks 15-16 wire all components together and create an
  end-to-end integration test.

  Each task includes RED-GREEN-REFACTOR TDD cycles with specific test cases, minimal implementations,
  and refactoring steps. Validation is sequential and completes before git operations, preventing
  invalid commits. Error handling is exception-based with clear diagnostic messages.
