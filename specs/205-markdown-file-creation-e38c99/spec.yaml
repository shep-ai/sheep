content: |
  ## Problem Statement

  Create a single markdown file called test-axs39z.md containing a title and 2-3 sentences of prose. This is a simple file creation task that follows the established pattern used throughout the Sheep project for markdown file generation features. The file must adhere to specific structural and encoding requirements consistent with prior implementations.

  ## Success Criteria

  - [ ] File test-axs39z.md exists in project root directory
  - [ ] File contains exactly one H1 heading on the first line (format: "# {title}")
  - [ ] Second line of file is blank (empty line)
  - [ ] File contains exactly 2-3 sentences of prose content after blank line
  - [ ] Each sentence ends with one of: period (.), exclamation mark (!), or question mark (?)
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses Unix LF line endings (\n), not Windows CRLF
  - [ ] File has trailing newline at end
  - [ ] File size is between 300-600 bytes
  - [ ] All validation checks pass before git operations
  - [ ] File is staged with git add command
  - [ ] File is committed with conventional commit message: "feat(205): create markdown file test-axs39z.md with prose content"
  - [ ] File is pushed to remote on branch feat/205-markdown-file-creation-e38c99

  ## Functional Requirements

  - **FR-1**: Create markdown file named test-axs39z.md in project root directory using pathlib.Path
  - **FR-2**: File must start with H1 heading in format "# {title}" on first line
  - **FR-3**: Second line of file must be blank (contains only newline character)
  - **FR-4**: File must contain exactly 2-3 sentences of prose content starting from line 3
  - **FR-5**: File must end with trailing newline character
  - **FR-6**: File must be encoded as UTF-8 without BOM using Path.write_text(encoding='utf-8')
  - **FR-7**: File must use Unix LF line endings (\n) exclusively, not Windows CRLF (\r\n)
  - **FR-8**: Validate file existence immediately after creation
  - **FR-9**: Validate heading format (must match regex "^# .+$" on first line)
  - **FR-10**: Validate blank line (second line must be empty string)
  - **FR-11**: Validate sentence count using regex to split on [.!?] boundaries (must be exactly 2-3)
  - **FR-12**: Validate file encoding and line endings match UTF-8 and LF requirements
  - **FR-13**: Validate file size is between 300-600 bytes
  - **FR-14**: Stage file with git add using subprocess.run(['git', 'add', <filepath>])
  - **FR-15**: Commit file with conventional commit message using subprocess.run(['git', 'commit', ...]) with message "feat(205): create markdown file test-axs39z.md with prose content"
  - **FR-16**: Push file to feature branch using subprocess.run(['git', 'push', '-u', 'origin', 'feat/205-markdown-file-creation-e38c99'])

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must complete in under 1 hour for a developer familiar with project patterns
  - **NFR-2**: Code must be maintainable with clear variable names and follow project conventions
  - **NFR-3**: Validation must be deterministic and repeatable (same input always produces same validation result)
  - **NFR-4**: Git operations must handle errors gracefully and provide clear error messages for debugging
  - **NFR-5**: Code must use only Python stdlib (pathlib, subprocess, re) and no external dependencies
  - **NFR-6**: File operations must handle edge cases (parent directory exists, sufficient permissions, no name conflicts)
  - **NFR-7**: Error messages must clearly indicate which validation check failed (heading format, sentence count, encoding, etc.)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be generated using Claude API or hardcoded? | Hardcoded prose | Simpler implementation, faster execution, no external dependencies. Claude API can be added later as an enhancement. |
  | 2 | When should file validation occur—before or after git operations? | Validate before git operations | Prevents invalid commits and maintains repository quality. Aligns with established project patterns. |
  | 3 | Which library should be used for git integration? | subprocess module | Direct control, minimal overhead, no additional dependencies. Adequate for straightforward git operations. |
  | 4 | How should validation failures be handled? | Raise exceptions and stop | Clear failure semantics, explicit error handling, easier debugging. Prevents partial state. |
  | 5 | Should file path be hardcoded or parameterized? | Hardcoded to test-axs39z.md | Specification requires this exact filename. Parameterization adds unnecessary complexity. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as follows:
  - **Root directory**: Contains generated markdown files (test-*.md), implementation scripts, and feature-specific Python modules
  - **src/sheep/**: Core CrewAI-based agentic platform with agents, configuration, observability, tools, and CLI
  - **src/sheep/config/**: LLM configuration via get_reasoning_llm() wrapper and settings management
  - **specs/**: Feature specifications in YAML format, with each feature having its own numbered directory (e.g., specs/205-markdown-file-creation-e38c99/)
  - **tests/**: Pytest test suites for feature validation
  - **pyproject.toml**: Python project configuration (requires Python >=3.11)

  The project follows a clear pattern where each markdown file creation feature:
  1. Creates a markdown file in the project root with naming convention: test-{random_id}.md
  2. Validates file structure (heading, blank line, prose content)
  3. Integrates with git (staging, committing, pushing)

  ### Architecture Patterns

  **File Creation Pattern**:
  - Files are created in the current working directory (project root)
  - Structure: H1 heading (# Title) + blank line + 2-3 sentences of prose + trailing newline
  - Text encoding: UTF-8 without BOM, Unix LF line endings (\n)
  - Typical file size: 300-600 bytes

  **Validation Approach**:
  - File existence check
  - Heading format verification (# on first line)
  - Blank line verification (second line empty)
  - Sentence counting using regex (split on [.!?] boundaries)
  - Sentence count validation (2-3 required)
  - Encoding and line ending verification
  - File size bounds checking

  **Git Integration Pattern**:
  - Stage files: git add <filepath>
  - Commit with conventional message: git commit -m "feat(205): create markdown file test-axs39z.md with prose content"
  - Push to feature branch: git push -u origin feat/205-markdown-file-creation-e38c99
  - Use subprocess module for git operations

  ### Relevant Technologies

  **Python File Operations**:
  - pathlib.Path for file system abstraction
  - Path.write_text() for file creation with encoding control
  - Path.exists() for existence checking
  - Path.read_text() for validation

  **Git Integration**:
  - subprocess module for git command execution
  - Available on current branch: feat/205-markdown-file-creation-e38c99

  **Content**:
  - Hardcoded prose content (per product decision Q1)
  - No external API calls required

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | File System | High | Must create new markdown file in project root with specific encoding and line endings |
  | Git Workflow | High | Must stage, commit, and push file following conventional commit message format |
  | File Validation | Medium | Must verify file structure (heading, blank line, 2-3 sentences, encoding) before git operations |
  | Project Root | Low | File created in project root alongside other generated markdown files (test-*.md) |
  | Configuration | Low | Self-contained implementation, no configuration needed |

  ## Dependencies

  **Internal**:
  - Existing git repository with current branch: feat/205-markdown-file-creation-e38c99
  - Project root as working directory
  - Git configured with user.name and user.email (for commits)

  **External**:
  - Python standard library: pathlib, subprocess, re (regex)
  - No additional dependencies required (per product decision Q3)

  **No Database, API, or Complex Dependencies Required**:
  - Pure file system operations using pathlib
  - Git command-line integration via subprocess
  - No external services required

  ## Size Estimate

  **S** — This is a small, straightforward task requiring:
  - Simple file creation with pathlib (10-20 lines)
  - Basic content validation with regex (20-30 lines)
  - Git integration with subprocess (10-15 lines)
  - Total implementation: ~50-80 lines of core logic

  **Justification**:
  - Single file creation with no complex logic
  - Well-established patterns from prior features (200+, 204+)
  - No database, API, or architectural changes
  - Validation is simple pattern matching
  - Git operations are straightforward subprocess calls
  - Can be completed in under an hour once pattern is understood
