# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The implementation follows established patterns from features 200 and 204, organizing the feature into
  four sequential phases: file creation, validation, git integration, and end-to-end verification.

  ### Module Structure

  Create a new module `src/sheep/features/markdown_creator.py` containing:
  - `create_markdown_file()` — main entry point orchestrating all phases
  - `_create_file()` — file creation using pathlib
  - `_validate_file()` — comprehensive validation wrapper
  - Individual validation functions: `_validate_heading()`, `_validate_blank_line()`, `_validate_sentences()`,
    `_validate_encoding()`, `_validate_file_size()`, `_validate_trailing_newline()`
  - Git integration functions: `_git_add()`, `_git_commit()`, `_git_push()`

  This modular approach ensures each validation concern is isolated and testable independently.

  ### Design Decisions

  **1. File Creation with pathlib.Path.write_text()**
  - **Chosen:** pathlib.Path.write_text() with explicit encoding='utf-8'
  - **Rationale:** Modern, Pythonic API (Python 3.6+). Built-in encoding support eliminates manual
    file handle management. Aligns with Python 3.11+ requirement and project patterns from features 200/204.
  - **Alternative rejected:** open() builtin requires more boilerplate and explicit file handle management.

  **2. Validation Before Git Operations**
  - **Chosen:** Sequential validation phase completes fully before any git operations
  - **Rationale:** Prevents invalid commits and maintains repository quality. Aligns with product decision Q2.
    Clear separation of concerns: validation phase → git phase.
  - **Alternative rejected:** Validate after git operations allows invalid files to be committed, requiring rollback.

  **3. Git Integration via subprocess.run()**
  - **Chosen:** subprocess.run() with direct git command invocation
  - **Rationale:** Direct CLI execution with minimal overhead. Adequate for three straightforward operations
    (add, commit, push). No external dependencies required. Aligns with product decision Q3 and established
    project patterns. Error handling via CalledProcessError provides clear diagnostics.
  - **Alternative rejected:** GitPython adds external dependency and unnecessary abstraction layer.

  **4. Exception-Based Error Handling**
  - **Chosen:** Specific exception types — ValueError for validation failures, subprocess.CalledProcessError
    for git operation failures
  - **Rationale:** Python standard for error signaling. Allows precise error categorization. Aligns with
    product decision Q4 (raise exceptions and stop execution). Clear error messages aid debugging.
  - **Alternative rejected:** Error codes/return values are un-Pythonic and require caller to check status.

  **5. Simple, Focused Validation Regex**
  - **Chosen:** Heading regex `^# .+$`, sentence boundary split on `[.!?]`
  - **Rationale:** Simple patterns are maintainable and sufficient. Heading pattern ensures \"# \" prefix with
    non-empty title. Sentence split on punctuation marks precisely detects sentence boundaries per
    requirement FR-11.
  - **Alternative rejected:** Complex lookahead/lookbehind patterns over-engineer the solution.

  **6. Hardcoded Prose Content**
  - **Chosen:** Hardcoded prose string defined in code
  - **Rationale:** Aligns with product decision Q1. Eliminates API overhead, avoids external dependencies,
    ensures deterministic output. Content is simple and testable.
  - **Alternative rejected:** Claude API generation adds external dependency and latency; unnecessary for
    current requirements.

  **7. Hardcoded File Path**
  - **Chosen:** Filename hardcoded to exactly \"test-axs39z.md\" in project root
  - **Rationale:** Feature specification explicitly requires this filename (success criteria, FR-1).
    Hardcoding ensures precise specification compliance. Aligns with patterns from features 200/204.
  - **Alternative rejected:** Parameterization violates explicit specification requirement.

  ## Implementation Strategy

  The implementation follows a four-phase sequential approach:

  1. **Phase 1 (Foundation):** Create the module structure and implement basic file creation. Define
     hardcoded prose content and validate that the file exists after creation. This phase establishes the
     foundation for all subsequent validation.

  2. **Phase 2 (Validation):** Build comprehensive validation functions for all success criteria. Each
     validation function is isolated and testable independently. All validation occurs in-memory after
     reading the file once. Validation completes before any git operations.

  3. **Phase 3 (Git Integration):** Implement three subprocess calls for git operations: add, commit, push.
     Each operation is a separate subprocess call for clarity and error handling. Git operations occur only
     after all validation passes.

  4. **Phase 4 (Integration & Verification):** Wire all components together. Create integration tests
     verifying the full end-to-end workflow from file creation through git push. This phase ensures all
     components work cohesively.

  ## Files to Create and Modify

  **Files to Create:**
  - `src/sheep/features/markdown_creator.py` — Main module containing all functionality

  **Files to Modify:** None

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File creation fails due to permissions or full disk | Validation will fail immediately with clear error message. Caller can catch exception and handle appropriately. pathlib provides descriptive error messages. |
  | Git operations fail (no network, not in repo, git not configured) | subprocess.CalledProcessError includes returncode and stderr output. Clear error message indicates which git operation failed. Validation phase completed first, so repository isn\'t partially modified. |
  | Regex patterns don\'t match actual file format | Simple patterns are well-tested (feature 200/204 already use them). Regex is verified against all success criteria during implementation. |
  | File size calculation incorrect | Use pathlib.Path.stat().st_size which is standard library function. Byte size validation is straightforward numeric comparison. |
  | CRLF line endings on Windows | Explicitly check for \\r\\n in file content and reject if found. write_text() with encoding=\'utf-8\' doesn\'t add CRLF; only issue is if content is pre-formatted with CRLF. |
  | UTF-8 BOM included | write_text(encoding=\'utf-8\') uses UTF-8 without BOM (correct implementation). read_text(encoding=\'utf-8\') reads correctly. No manual handling needed. |

  ## Testing Strategy

  Each task includes TDD cycles: RED (write failing test), GREEN (minimal implementation), REFACTOR
  (improve). Tests verify:
  - File creation and existence
  - Heading format validation
  - Blank line presence
  - Sentence counting accuracy
  - Encoding and line ending validation
  - File size bounds
  - Trailing newline presence
  - git add, commit, push success
  - Error handling for validation failures and git operation failures

  All validation tests use in-memory file operations (read_text from created file). Integration test
  verifies full workflow end-to-end.
