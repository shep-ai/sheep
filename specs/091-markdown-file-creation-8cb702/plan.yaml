# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 091 is a test artifact creation for the Sheep automated implementation platform.
  It operates purely at the repository root level — no integration with `/src/sheep/` source code,
  no configuration file changes, no project metadata modifications.

  The implementation follows the exact pattern established by features 063-090:
  - **File Location**: Repository root (not in subdirectories)
  - **File Format**: Markdown with H1 heading + blank line + 3-sentence prose
  - **Content Topic**: Universal, positive personal development themes (flexible per FR-5)
  - **Encoding**: UTF-8 without BOM
  - **Line Endings**: Unix LF only
  - **Size**: 320-600 bytes (naturally achieved by standard markdown format)
  - **Git Workflow**: Conventional commits on feature branch

  **Why This Architecture:**
  - Simplicity: Single file, no code changes, no external dependencies
  - Consistency: Matches 90+ prior implementations without deviation
  - Verifiability: Clear acceptance criteria, straightforward validation
  - Maintainability: Standard pathlib + git commands, no custom abstraction

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision**: Use `pathlib.Path("test-nl1k6h.md").write_text(content, encoding='utf-8', newline='')`

  **Rationale**:
  - **Explicitly Required**: Feature requirement FR-1 mandates pathlib approach
  - **Cross-Platform**: Automatic handling of path separators (`/` vs `\`)
  - **Encoding Control**: `encoding='utf-8'` ensures UTF-8 output without BOM (NFR-1)
  - **Line Ending Control**: `newline=''` disables automatic line ending translation, writing exactly
    what is provided — ensures Unix LF on all platforms (NFR-2)
  - **Standard Library**: No external dependencies, available in Python 3.11+
  - **Established Pattern**: Already used across 90+ test files in this repository

  **Alternatives Rejected**:
  - `open()` function — more verbose, requires manual encoding/newline setup
  - `os.open()` with flags — low-level, error-prone
  - LLM API for content — non-deterministic, adds latency and external dependency

  ### 2. Content Generation: Handcrafted Prose on Universal Topics

  **Decision**: Write 3 grammatically correct sentences on a universal, positive topic
  (e.g., "The Power of Continuous Learning", "Value of Deep Work", "Making a Positive Impact")

  **Rationale**:
  - **Deterministic**: Handcrafted ensures predictable, reproducible output (no randomness)
  - **No Dependencies**: No LLM calls, no external APIs, no latency
  - **Quality Guarantee**: Ensures grammatical correctness and semantic coherence (FR-4)
  - **Flexibility**: Topic selection is flexible per FR-5 (any generic/universal topic acceptable)
  - **Precedent**: All 90+ existing test files use this approach successfully
  - **Pattern Consistency**: Maintains uniformity across entire test file collection

  **Alternatives Rejected**:
  - LLM-generated content — non-determinism, external API dependency, slower
  - Random sentence assembly — risks grammatical errors and incoherence
  - Hardcoded single prose — fails if reused across multiple files

  ### 3. Encoding & Line Endings: UTF-8 + LF with Explicit Control

  **Decision**: Specify both `encoding='utf-8'` and `newline=''` in pathlib.write_text()

  **Rationale**:
  - **UTF-8 without BOM**: `encoding='utf-8'` produces UTF-8 with no Byte Order Mark (NFR-1)
  - **Unix LF Only**: `newline=''` prevents Python's automatic line ending translation, ensuring
    only `\n` characters are written (NFR-2)
  - **Platform-Independent**: Works correctly on Windows, macOS, and Linux
  - **Explicit**: Makes intent clear to future maintainers
  - **Established**: Already proven across 90+ test files in repository

  **Why This Matters**:
  - Platform default line endings would produce CRLF on Windows (violates NFR-2)
  - Automatic BOM stripping would be unnecessary complexity (pathlib never adds BOM)
  - This combination is the simplest, most explicit approach

  ### 4. File Size Validation: Standard Format + Post-Creation Check

  **Decision**: Write standard markdown (H1 title + blank + 3 sentences) and validate size post-creation

  **Rationale**:
  - **Natural Fit**: Standard format (20-40 char title + 380-450 char prose) naturally yields 320-600 bytes
  - **No Dynamic Sizing**: Avoids complexity and unpredictability
  - **Simple Validation**: Read file, check byte count (1 line of code)
  - **Verifiable**: Clear assertion criteria for validation task
  - **Precedent**: This approach works reliably across 90+ existing files

  **Alternatives Rejected**:
  - Dynamic content sizing — adds complexity, unpredictable results
  - Content compression — violates readable markdown requirement
  - Iterative adjustment — unnecessary overhead, proven pattern works reliably

  ### 5. Git Workflow: Standard Commands via subprocess

  **Decision**: Use standard git commands: `git add`, `git commit`, `git push` via subprocess calls

  **Rationale**:
  - **Explicitly Required**: Feature spec NFR-7 mandates "standard git commands"
  - **No Dependencies**: subprocess is Python standard library
  - **Transparent**: Easy to debug, understand, and verify operations
  - **Simple**: No need for GitPython or manual ref manipulation
  - **Established**: Matches pattern across all 90+ prior features
  - **Feature Branch Pre-exists**: Per spec dependencies, `feat/091-markdown-file-creation-8cb702` exists

  **Alternatives Rejected**:
  - GitPython library — adds external dependency, no advantage for simple operations
  - Manual git operations (ref updates) — violates NFR-7 requirement, complex and error-prone
  - Automatic commits — violates explicit requirements (FR-6, FR-7, FR-8 specify distinct steps)

  ## Implementation Strategy

  **Why This Phase Ordering:**

  1. **Phase 1 (File Creation)** comes first because:
     - Creates the core artifact required by the feature
     - Must be complete before validation and git operations
     - Simple, well-understood task with no dependencies

  2. **Phase 2 (Validation)** comes second because:
     - Verifies Phase 1 output meets all requirements
     - Catches encoding/size/format issues before git workflow
     - Provides feedback if content adjustment is needed
     - Acts as gate before committing to git

  3. **Phase 3 (Git Workflow)** comes last because:
     - Only executes after quality assurance passes
     - Depends on validated file from Phase 2
     - Finalizes feature for review and merge
     - No value in committing before validation

  **Why This Approach is Low-Risk:**
  - Follows proven pattern from 90+ prior implementations
  - No architectural decisions required (precedent exists)
  - No code changes, only artifact creation
  - Single file with straightforward format
  - No external dependencies or API calls
  - Clear, verifiable acceptance criteria
  - Easy to diagnose and fix issues if validation fails

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding Issues** (non-UTF-8 or BOM added) | Explicitly specify `encoding='utf-8'` in pathlib call; validate post-creation using Python file reading with explicit encoding |
  | **Line Ending Issues** (CRLF instead of LF) | Specify `newline=''` in pathlib.write_text() to disable automatic translation; validate by reading bytes and checking for `\r` characters |
  | **Prose Coherence** (sentences don't flow logically) | Handcraft 3 grammatically connected sentences on single topic; review for grammatical correctness and logical flow before committing |
  | **File Size Out of Range** (< 320 or > 600 bytes) | Use standard markdown format (H1 + blank + 3 sentences) which naturally fits range; validate post-creation and adjust prose length if needed |
  | **Markdown Format Invalid** (missing H1, blank line, or prose) | Validate structure: assert line 1 starts with `# `, line 2 is blank, lines 3+ contain prose; each validation task checks specific format requirement |
  | **Git Stage/Commit Failure** | Use standard git commands with explicit error checking; verify file is staged before commit, commit exists before push |
  | **Branch Push Failure** | Feature branch `feat/091-markdown-file-creation-8cb702` pre-created per spec; if push fails, verify branch exists and is checked out |
  | **Feature Branch Not Tracking** | Feature branch pre-exists per spec dependencies section; if push fails, verify branch exists and is checked out |
