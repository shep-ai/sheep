  - Same git workflow: conventional commits, feature branch push
  - Same technology stack: Python pathlib + standard git commands

  **Simplicity and Maintainability:**
  All technical decisions prioritize simplicity and maintainability:
  - No external dependencies beyond Python standard library
  - Standard library modules (pathlib, subprocess) are stable and well-documented
  - No custom abstractions or complex logic required
