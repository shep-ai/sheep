content: |
  ## Problem Statement

  Create a single markdown file named `test-po6190.md` in the repository root containing a markdown heading and 2-3 sentences of prose content about any topic. This is part of the Sheep repository's test file collection, which validates the system's ability to perform well-defined, straightforward file creation tasks with appropriate version control workflows.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. The repository maintains a flat file structure at its root containing:

  - **Test markdown files**: Files like `test-*.md` (e.g., `black-holes-lpgi51.md`, `cloud-computing-xwbxsh.md`) that contain simple content with titles and prose
  - **Example documentation**: State machine examples and design pattern files
  - **Configuration files**: `README.md`, `Dockerfile`, `docker-compose.yml`, `pyproject.toml`
  - **Specs directory**: `/specs/` contains feature specifications organized by feature number and name
  - **Source code**: `/src/sheep/` contains the main platform code (agents, flows, tools, CLI)

  The repository demonstrates a consistent pattern of adding simple markdown content files to the root directory with no subdirectories for content organization.

  ### Architecture Patterns

  The repository follows these key patterns:

  - **Flat content structure**: All markdown content files are stored at the repository root
  - **Naming convention**: Test files follow the pattern `test-<random-id>.md` or `<topic>-<random-id>.md`
  - **Content pattern**: Each markdown file contains:
    - A single H1 or H2 heading (title)
    - 2-3 sentences of prose content about a topic
    - No additional structure, formatting, or complexity
  - **Version control workflow**: Each new file is committed with conventional commit messages (e.g., `feat: Create test-po6190.md markdown file`)

  ### Relevant Technologies

  - **Markdown**: Plain text markup language for formatting content
  - **Git**: Version control system for tracking changes and managing branches
  - **No dependencies**: No build tools, compilers, testing frameworks, or external libraries involved

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single file addition; no structural changes or modifications to existing files |
  | Git history | Low | Single commit added to branch history with conventional commit message |
  | File system | Low | One new `.md` file created (approximately 150-250 bytes); no deletions or modifications |
  | Specs directory | None | Feature specification already created; analysis phase updates this spec.yaml file only |
  | Source code (`/src/sheep`) | None | No Python code, platform logic, or module changes |
  | Tests (`/tests`) | None | No test files created, modified, or deleted |
  | CI/CD (`.github`) | None | No workflow changes required; standard git workflow applies |
  | Build system (`pyproject.toml`) | None | No dependencies or configuration changes |

  ## Dependencies

  - **Git repository**: Feature branch `feat/060-markdown-test-file-054a6b` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation with zero code changes or impacts
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Precedent pattern**: Features #058 and #059 establish the identical pattern (no technical dependency, only reference)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation and content**: ~5 minutes (write one heading + 2-3 sentences of prose about any topic)
  - **Validation**: ~3 minutes (verify markdown syntax is valid, file encoding is UTF-8, line endings are LF)
  - **Git workflow**: ~2-5 minutes (stage file, create commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with identical, recently completed features (#058, #059) providing clear precedent
  - Completely flexible topic selection with no research, decision-making, or architectural work required
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - No testing framework integration, CI/CD changes, documentation updates, or code reviews required
  - Straightforward git operations with no complexity (single add/commit/push sequence)

