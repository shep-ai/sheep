content: |
  ## Architecture Overview

  The repository root contains markdown content files including three joke files
  (JOKE.md, JOKE2.md, JOKE3.md) that follow a consistent format. This feature
  adds a new standalone markdown file alongside them. There are no code dependencies,
  imports, or integration points.

  ## Key Design Decisions

  ### Filename: CLASSIC_JOKE.md
  The spec's open question #1 has a contradiction: the selectionRationale advocates
  for JOKE4.md (sequential pattern), but the answer field and selected flag both
  resolve to CLASSIC_JOKE.md. Following the research decision, the answer field
  is authoritative. This breaks the sequential numbering but provides a more
  descriptive name.

  ### Content Type: General classic joke (non-tech)
  The spec's open question #2 similarly contradicts: the rationale advocates for
  tech humor consistency, but the answer resolves to non-tech. All three existing
  files use programmer jokes (dark mode/bugs, Java/C#, Oct 31/Dec 25). Adding a
  non-tech classic joke introduces variety per the spec decision.

  ### Format: Single Q&A matching JOKE2.md/JOKE3.md
  The majority pattern (2 of 3 files) uses: `# Joke` heading, blank line,
  `**Q:**` line, blank line, `**A:**` line, blank line, `---` separator, trailing
  newline. JOKE.md has extra jokes after the Q&A but this is the minority pattern.

  ### Encoding: UTF-8 with LF line endings
  Matches existing files per NFR-1. Trailing newline follows POSIX convention.

  ## Implementation Strategy

  This is a single-phase, single-task feature. Create the file with the correct
  format and content. The only consideration is choosing an appropriate well-known,
  workplace-safe, non-tech classic joke that fits the Q&A format.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Filename contradiction in spec | Follow the answer field (CLASSIC_JOKE.md) as authoritative per research decision |
  | Joke content inappropriate | Choose a universally known, workplace-safe classic joke |
  | Format inconsistency | Mirror JOKE2.md structure exactly (verified by reading existing files) |
