content: |
  ## Summary

  This feature requires creating a single markdown file (CLASSIC_JOKE.md) at the
  repository root. The file follows the exact structure of JOKE2.md/JOKE3.md:
  a level-1 heading, a Q&A joke with bold formatting, and a trailing horizontal
  rule. The joke content should be a well-known, non-tech classic joke that is
  workplace-appropriate. The TDD cycle validates file existence, structure, and
  format compliance before and after creation.
