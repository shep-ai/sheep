content: |
  ## Problem Statement

  The repository collects various markdown content files (jokes, state machine diagrams,
  design patterns). The request is to add another markdown file containing an old/classic joke,
  continuing the pattern established by JOKE.md, JOKE2.md, and JOKE3.md.

  ## Success Criteria

  - [ ] A new file named JOKE4.md exists at the repository root
  - [ ] The file contains a classic/old programming or tech joke
  - [ ] The file starts with a `# Joke` heading (matching existing files)
  - [ ] The joke uses bold **Q:** / **A:** format (matching existing files)
  - [ ] The file ends with a horizontal rule separator `---`
  - [ ] The file uses valid markdown syntax

  ## Functional Requirements

  - **FR-1**: Create a new file named `JOKE4.md` in the repository root directory
  - **FR-2**: The file must contain exactly one classic/old programming or tech joke in Q&A format
  - **FR-3**: The file must start with a level-1 heading `# Joke`
  - **FR-4**: The joke question must be formatted as `**Q:** <question text>`
  - **FR-5**: The joke answer must be formatted as `**A:** <answer text>`
  - **FR-6**: The file must end with a horizontal rule (`---`) after the joke content

  ## Non-Functional Requirements

  - **NFR-1**: The file must use UTF-8 encoding consistent with other markdown files in the repo
  - **NFR-2**: The file must use standard markdown syntax that renders correctly on GitHub
  - **NFR-3**: The joke should be well-known/classic (not original or obscure) to match the "old joke" requirement
  - **NFR-4**: The joke content must be appropriate and inoffensive (workplace-safe humor)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What should the new joke file be named? | JOKE4.md | Continues the sequential naming pattern (JOKE.md, JOKE2.md, JOKE3.md) |
  | 2 | What type of classic joke should be included? | Classic programming/tech joke | All existing joke files use tech humor; maintains thematic consistency |
  | 3 | How many jokes should the file contain? | Single Q&A joke | Matches the majority pattern (JOKE2.md, JOKE3.md use single Q&A format) |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | New markdown file added alongside existing joke files |

  ## Dependencies

  None. This is a standalone content file with no code dependencies.

  ## Size Estimate

  **S** — Single file addition, no code changes, no tests needed. Minimal effort.
