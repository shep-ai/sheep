content: |
  ## Problem Statement

  The repository collects various markdown content files (jokes, state machine diagrams,
  design patterns). The request is to add another markdown file containing an old/classic joke,
  continuing the pattern established by JOKE.md, JOKE2.md, and JOKE3.md.

  ## Codebase Analysis

  ### Project Structure
  - Root directory contains standalone markdown content files (JOKE.md, JOKE2.md, JOKE3.md,
    STATE_MACHINE.md, DESIGN_PATTERN.md, SHEEP.md, etc.)
  - `src/sheep/` — Python agentic platform code (not affected)
  - `tests/` — test suite (not affected)
  - `specs/` — feature specifications

  ### Architecture Patterns
  - Content markdown files live at the repository root with UPPER_CASE naming
  - Joke files follow a sequential naming pattern: JOKE.md, JOKE2.md, JOKE3.md
  - Jokes use standard markdown formatting with bold Q&A and horizontal rule separators

  ### Relevant Technologies
  - Markdown for content files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | New markdown file added alongside existing joke files |

  ## Dependencies

  None. This is a standalone content file with no code dependencies.

  ## Success Criteria

  - [ ] A new markdown file with an old/classic joke exists at the repo root
  - [ ] File follows existing naming convention (e.g., JOKE4.md)
  - [ ] Content uses markdown formatting consistent with existing joke files

  ## Size Estimate

  **S** — Single file addition, no code changes, no tests needed. Minimal effort.
