content: |
  ## Problem Statement

  Create a single markdown file named `test-5e76ie.md` in the repository root directory. The file must contain:

  1. A markdown header (title) at the beginning
  2. 2-3 sentences of prose content about any topic

  This feature is part of a validated pattern used across 140+ features in the Sheep platform for validating automated file creation capabilities. The file will be created, staged, committed with a conventional commit message, and pushed to the remote repository.

  ## Codebase Analysis

  ### Project Structure

  The repository is **Sheep** - an agentic platform for automated code implementation using CrewAI. Key structure:

  - **Repository root**: Contains numerous markdown files (test-*.md, ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **specs/ directory**: Contains 140+ feature specifications, each in its own subdirectory (e.g., specs/140-markdown-file-creation-12b9c4/)
  - **.github/ directory**: GitHub-related configuration
  - **src/sheep/**: Source code for the Sheep platform itself (not relevant to this feature)
  - **Dockerfile, .env.example**: Configuration files for deployment

  ### Architecture Patterns

  This repository uses a **feature-driven test pattern** where:

  1. Each feature (numbered 1-140+) is defined in a spec.yaml file under specs/
  2. Features progress through phases: Analysis → Requirements → Implementation → Review → Merged
  3. Each completed feature results in a corresponding artifact (in this case, a markdown file)
  4. All changes follow conventional commit format: `feat(NUMBER): Description`
  5. Git workflow: create branch → make changes → commit → push → merge

  ### Relevant Technologies

  - **Markdown**: File format for content creation
  - **Git**: Version control system for staging, committing, pushing changes
  - **YAML**: Format for spec files
  - **Conventional Commits**: Commit message standard (feat, fix, docs, etc.)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New markdown file `test-5e76ie.md` will be created here, following the established pattern of 100+ similar files in the repository |
  | Git workflow | Medium | Requires staging file with `git add test-5e76ie.md`, committing with message `feat(140): Create markdown file test-5e76ie.md`, and pushing to remote branch |
  | specs/140-markdown-file-creation-12b9c4/ directory | Low | This spec.yaml file will be updated during analysis and implementation phases |

  ## Dependencies

  - **No external dependencies**: This feature requires no libraries, frameworks, or external code
  - **No code dependencies**: Does not depend on any existing source code or platform features
  - **No infrastructure dependencies**: Requires only basic git operations
  - **Pattern dependency**: Follows established pattern from features 69-139 for markdown file creation (100+ prior similar features serve as reference)

  ## Size Estimate

  **S** — This is a trivial feature requiring only a few minutes of work. Specific reasoning:

  - Single file creation with no code generation or transformation needed
  - Content is freeform prose (any topic, 2-3 sentences)
  - No validation, testing, or infrastructure required
  - Follows an established, well-known pattern from 70+ prior identical features
  - Only tasks: create file with markdown header + 2-3 sentences + git operations (add/commit/push)
  - Estimated effort: 5-10 minutes total
  - Complexity is minimal - straightforward file I/O and git operations
