  ## Summary

  Implementation breaks into 7 concrete tasks across 3 phases:

  **Phase 1 (Module Setup):** Task 1 creates the feature module with proper structure and metadata.
  This establishes the foundation for all subsequent work.

  **Phase 2 (Content & File Creation):** Tasks 2-4 generate prose via Claude API (task-2), write
  markdown file to disk (task-3), and validate structure/encoding (task-4). This phase produces
  the markdown artifact that will be committed.

  **Phase 3 (Git Integration):** Tasks 5-7 stage and commit file (task-5), push to remote branch
  (task-6), and implement final orchestration with error handling (task-7). This phase completes
  the feature workflow.

  **Task Dependencies:** All tasks follow a linear dependency chain:
  task-1 → task-2 → task-3 → task-4 → task-5 → task-6 → task-7

  Each task follows TDD: write failing test (RED), implement minimal code (GREEN), clean up (REFACTOR).
  Total effort estimate: 60 minutes for complete implementation, testing, and validation.

  **Implementation Approach:**
  The implementation orchestrates existing functions from `sheep.content_generators` module,
  ensuring consistency with 100+ preceding features (001-101) and maximum code reuse. No new
  infrastructure or external dependencies are introduced. The orchestrator function coordinates
  five reusable workflow steps:

  1. Content generation via Claude API
  2. File write with proper encoding (UTF-8 without BOM, LF line endings)
  3. Three-phase validation (structure, encoding, file properties)
  4. Git staging and commit with conventional message format
  5. Push to remote with upstream tracking

  This proven pattern has been successfully executed 100+ times across features 001-101.

