content: |
  ## Summary

  Feature 115 breaks down into 5 concrete tasks across 2 phases:

  **Phase 1: Content Generation & File Creation (3 tasks, ~60 minutes)**
  - Task 1: Generate markdown content via LLM (20 min) — Creates H1 heading + 2-3 sentences using CrewAI
  - Task 2: Write file to disk (15 min) — Uses pathlib.Path.write_text() with UTF-8 encoding
  - Task 3: Validate file format (25 min) — Verifies all spec requirements (encoding, line endings, headings, sentences, size)

  **Phase 2: Git Integration (2 tasks, ~25 minutes)**
  - Task 4: Stage and commit (15 min) — Git add and conventional commit with spec-compliant message
  - Task 5: Push to remote (10 min) — Git push to origin with upstream tracking

  **Total effort**: 1.5 hours (aligned with spec's size estimate of S = 10-15 minutes for manual work;
  task estimates include TDD cycle overhead for comprehensive testing).

  Each task follows TDD approach:
  1. **RED**: Write test that asserts the desired behavior
  2. **GREEN**: Implement minimal code to pass the test
  3. **REFACTOR**: Clean up code, extract helpers, improve naming and logging

  ### Task Dependencies

  Tasks are sequentially dependent:
  - Task 2 depends on Task 1 (need content before writing)
  - Task 3 depends on Task 2 (need file before validating)
  - Task 4 depends on Task 3 (need validation before staging)
  - Task 5 depends on Task 4 (need commit before pushing)

  ### Reusable Utilities Pattern

  Tasks leverage existing, proven functions from `content_generators.py` module:
  - `generate_markdown_content(topic=None)` — Task 1 implementation
  - `write_markdown_file(filename, content)` — Task 2 implementation
  - `validate_markdown_file(filepath)` — Task 3 implementation
  - `commit_markdown_file(filepath, message)` — Task 4 implementation
  - `push_markdown_file(branch)` — Task 5 implementation

  These functions are tested across features 101-114 and used as reference implementations.
  New implementation should follow the same patterns for consistency.

  ### Success Validation

  All tasks complete successfully when:
  ✓ test-ww2iac.md exists with H1 heading + 2-3 sentences (Tasks 1-2)
  ✓ File is UTF-8 with LF endings, 300-500 bytes (Task 3)
  ✓ Commit exists with message 'feat(115): create markdown file test-ww2iac.md with prose content' (Task 4)
  ✓ Changes pushed to remote origin/feat/115-markdown-content-file-763a04 (Task 5)
  ✓ All TDD cycles (RED-GREEN-REFACTOR) pass for each task

  ---

  _Ready for implementation. All tasks have clear acceptance criteria, TDD cycles,
  and dependencies. Estimated effort 1.5h aligned with feature complexity._
