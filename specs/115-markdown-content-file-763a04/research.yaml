content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-19
  - **Decisions:** Complete — All technical decisions resolved by precedent and analysis

  ## Technology Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** Python pathlib.Path.write_text() with UTF-8 encoding

  **Rejected:**
  - open()/write() — Lower level, requires manual encoding specification, error-prone with newline handling
  - os.path/os module — Older style, less convenient, less Pythonic than pathlib
  - Third-party libraries — Adds unnecessary dependencies for simple synchronous file write

  **Rationale:**
  pathlib is the modern Python standard (3.4+) and is explicitly recommended in the spec (NFR-5).
  The write_text() method handles UTF-8 encoding automatically and is clean and readable.
  No external dependencies. Proven approach in features 101-114.

  ### 2. Content Generation: LLM via CrewAI Framework

  **Chosen:** Use existing CrewAI LLM infrastructure (get_reasoning_llm() API)

  **Rejected:**
  - Manual prose templates — Inflexible, limited topic variety, hardcoded content doesn't scale
  - Random/template generators — Risk of invalid markdown, lower prose quality
  - User input — Incompatible with automated Sheep platform design

  **Rationale:**
  The Sheep platform is built around LLM-based agents. Using existing CrewAI infrastructure
  aligns with platform purpose and architecture. The LLM generates contextually appropriate,
  grammatically correct prose that meets format requirements. Proven in features 101-104.
  No additional infrastructure needed. Flexible topic selection is best served by LLM generation.

  ### 3. Validation: Comprehensive Per Spec

  **Chosen:** Use validate_markdown_file() from content_generators.py

  **Rejected:**
  - Minimal validation (file exists check only) — Insufficient, misses encoding/format errors
  - Regex-only validation — Brittle, does not catch encoding issues, incomplete format coverage
  - No validation — Risky, defects propagate to repository, no spec compliance assurance

  **Rationale:**
  The spec defines detailed non-functional requirements (UTF-8 + no BOM, LF line endings,
  H1 heading, 2-3 sentences, trailing newline, 300-500 byte range). Comprehensive validation
  ensures all requirements are met before staging. Catches encoding issues, line ending errors,
  format violations, and sentence count violations. Provides clear error messages for debugging.

  ### 4. Git Integration: Subprocess via Existing Tools

  **Chosen:** Use GitCommitTool and GitPushTool abstractions (subprocess-based)

  **Rejected:**
  - GitPython library — Adds abstraction but project already has tool abstractions, redundant
  - Direct shell commands — Less safe, no error handling structure, harder to test
  - Manual git plumbing — Over-engineered for simple commit+push operations

  **Rationale:**
  The Sheep platform provides GitCommitTool and GitPushTool abstractions that wrap git CLI.
  These tools are already in the codebase, used in features 101-104, and provide structured
  error handling and logging. Using existing abstractions maintains architectural consistency
  and avoids duplicating git integration logic. GitPython is in dependencies but the tool
  abstraction is preferred for consistency with established pattern.

  ### 5. Code Organization: Reuse Existing Utilities

  **Chosen:** Use existing functions from content_generators.py (recommended pattern from feature 104)

  **Rejected:**
  - Inline implementation — Duplicates logic from features 101-104, violates DRY principle
  - Extract new utility module — Unnecessary refactoring, utilities already well-structured
  - Direct main task implementation — Low cohesion, harder to test, harder to maintain

  **Rationale:**
  content_generators.py provides well-tested, documented composable functions:
  - generate_markdown_content() — LLM-based content generation with validation
  - write_markdown_file() — Safe file writing with UTF-8 encoding
  - validate_markdown_file() — Comprehensive format and encoding validation
  - commit_markdown_file() — Git staging and commit with conventional messages
  - push_markdown_file() — Push to remote with upstream tracking
  - create_markdown_file() — Main entry point orchestrating complete workflow

  These functions are tested in features 101-114 and stable. Using them ensures consistency,
  reduces testing burden, and leverages proven implementations. Following feature_104 style
  is recommended.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | Use | Modern Python standard, clean API, UTF-8 support, no external deps |
  | CrewAI | LLM framework | Use (existing) | Already in dependencies, used for reasoning LLM access |
  | GitPython (3.1.0+) | Git operations abstraction | Optional (tools wrap it) | In dependencies but Sheep tools provide abstraction layer |
  | subprocess (stdlib) | Git command execution | Use (via tools) | Standard approach, reliable, used by existing GitCommitTool/GitPushTool |
  | structlog (existing) | Structured logging | Use (via get_logger) | Already in dependencies, used for observability |
  | Markdown (format, not lib) | Content format | Use | CommonMark standard, validated in content_generators.py |

  ## Security Considerations

  ### File Path Safety
  - **Risk**: Path traversal attacks via filename parameter (e.g., "../../../etc/passwd")
  - **Mitigation**: write_markdown_file() validates filename to reject "/" and "\\" characters
  - **Status**: Mitigated ✓

  ### Content Injection
  - **Risk**: LLM-generated content could contain malicious markdown/code
  - **Mitigation**: Content is validated to contain only prose + heading, no embedded code/scripts
  - **Status**: Mitigated ✓

  ### UTF-8 Encoding
  - **Risk**: File encoding could introduce issues in downstream processing
  - **Mitigation**: Explicit UTF-8 encoding, validation checks for BOM, line ending normalization
  - **Status**: Mitigated ✓

  ### Git Operations
  - **Risk**: Unexpected git state could cause unintended commits
  - **Mitigation**: Git tools validate repo state, operations fail safely with clear errors
  - **Status**: Mitigated ✓

  ### No New Dependencies
  - **Risk**: Supply chain security from added libraries
  - **Mitigation**: Uses only existing standard library and project dependencies
  - **Status**: No additional risk ✓

  ## Performance Implications

  ### File Operations
  - **Time Complexity**: O(1) — Single file write of ~400 bytes
  - **Space Complexity**: O(1) — No accumulation, file size within bounds
  - **Optimization**: Not needed — Writing 300-500 bytes is negligible
  - **Caching**: Not applicable — Simple write operation

  ### LLM API Call
  - **Latency**: ~1-3 seconds (typical LLM API response time)
  - **Throughput**: Single request per feature, not a bottleneck
  - **Optimization**: None needed — Expected behavior
  - **Note**: Bottleneck is network, not local operations

  ### Git Operations
  - **Time Complexity**: O(1) — Single commit + push
  - **Network**: Push requires network I/O, typical latency ~1-5 seconds
  - **Local overhead**: Negligible (staging, commit are fast on single file)
  - **Optimization**: Not needed for single-file feature scope

  ### Overall Performance
  - **Expected runtime**: 5-10 seconds (LLM ~3s + file I/O <100ms + git ~2-5s)
  - **No performance constraints**: Feature is asynchronous in broader platform context
  - **Scalability**: Not applicable — Single feature, no scaling considerations

