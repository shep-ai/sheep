# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature implements the established markdown-file-creation pattern from features 101-114.
  The Sheep platform uses automated agents to create test artifacts that demonstrate core capabilities:
  file I/O, LLM-based content generation, and git integration.

  ### Design Pattern

  The implementation follows a proven, minimal architecture:

  1. **Content Generation**: Use CrewAI LLM (existing infrastructure) to generate contextually
     appropriate prose that meets format requirements (2-3 sentences, grammatically correct)

  2. **File I/O**: Use Python pathlib.Path.write_text() with explicit UTF-8 encoding. This is the
     modern Python standard (3.4+) and is used consistently across features 101-114.

  3. **Validation**: Apply comprehensive validation per spec before staging:
     - UTF-8 encoding with no BOM (Byte Order Mark)
     - LF line endings (not CRLF)
     - Exactly one H1 heading on first line
     - Blank line separator between heading and prose
     - Exactly 2-3 sentences of prose
     - Trailing newline present
     - File size 300-500 bytes (typical range)
     - Valid CommonMark syntax

  4. **Git Integration**: Use existing GitCommitTool and GitPushTool abstractions from
     src/sheep/tools/ which provide structured error handling and logging via subprocess calls.

  ### Integration with Existing Codebase

  **Reusable Utilities**: The content_generators.py module (tested in features 101-104) provides
  composable functions that implement the complete workflow:
  - `generate_markdown_content(topic=None)` - LLM-based content generation
  - `write_markdown_file(filename, content)` - File writing with UTF-8 encoding
  - `validate_markdown_file(filepath)` - Comprehensive format validation
  - `commit_markdown_file(filepath, message)` - Git add + commit
  - `push_markdown_file(branch)` - Git push to remote
  - `create_markdown_file(filename)` - Main entry point orchestrating complete workflow

  **No Code Modifications**: Feature 115 does not modify:
  - src/sheep/ source code (except adding feature module if needed)
  - pyproject.toml (no new dependencies)
  - tests/ (no test modifications)
  - Configuration files

  **Architecture Consistency**: Using existing utilities ensures:
  - Consistent file I/O patterns across 95+ test files
  - Proven LLM integration via CrewAI
  - Familiar git abstraction via existing tools
  - Minimal testing burden (functions already tested in prior features)

  ## Key Design Decisions

  ### 1. Use Existing content_generators.py Utilities

  **Chosen**: Leverage existing well-tested functions from content_generators.py

  **Rationale**: The content_generators.py module was designed as a composable set of building
  blocks for this exact pattern. Functions are tested across features 101-114 and stable. Using
  them ensures consistency, reduces testing burden, and avoids duplicating proven implementations.
  This follows the recommendation from research findings and feature 104 implementation style.

  ### 2. LLM-Based Content Generation

  **Chosen**: CrewAI framework LLM access via get_reasoning_llm() API

  **Rationale**: The Sheep platform is built around LLM-based agents for code generation and
  content creation. CrewAI is already in project dependencies. LLM generation produces contextually
  appropriate, grammatically correct prose that meets all format requirements. Proven in features
  101-104. Flexible topic selection ("about anything") is best served by LLM generation.

  ### 3. pathlib.Path.write_text() for File I/O

  **Chosen**: Python pathlib.Path.write_text() with explicit UTF-8 encoding

  **Rationale**: pathlib is the modern Python standard (3.4+) and explicitly required by spec
  (NFR-5). The write_text() method handles UTF-8 encoding automatically and is clean, readable,
  and safe. No external dependencies. Proven approach across features 101-114. This is a
  fundamental Python best practice for file operations.

  ### 4. Comprehensive Validation Per Spec

  **Chosen**: Use validate_markdown_file() from content_generators.py

  **Rationale**: The spec defines detailed non-functional requirements (UTF-8 without BOM, LF
  line endings, H1 heading, 2-3 sentences, trailing newline, 300-500 byte range). Comprehensive
  validation ensures all requirements are met before git staging. The validate_markdown_file()
  function checks all format and encoding requirements. This prevents defects from reaching the
  repository and provides clear error messages for debugging.

  ### 5. Existing Git Tool Abstractions

  **Chosen**: Use GitCommitTool and GitPushTool from src/sheep/tools/git_tools.py

  **Rationale**: The Sheep platform provides GitCommitTool and GitPushTool abstractions that
  wrap subprocess calls to git CLI. These tools are used in features 101-104 and provide
  structured error handling and logging. Using existing tool abstractions maintains architectural
  consistency and avoids duplicating git integration logic.

  ## Implementation Strategy

  ### Phase 1: Content Generation & File Creation
  This phase focuses on creating the markdown file with proper formatting and validating
  it meets all spec requirements before git operations.

  **Why first**: File must exist and be valid before staging in git. Content validation prevents
  defects from reaching repository. LLM generation and file writing are prerequisites for git ops.

  **What gets built**:
  1. Generate markdown content using CrewAI LLM (heading + 2-3 sentences)
  2. Write content to test-ww2iac.md using pathlib.Path.write_text()
  3. Validate file against all spec requirements
  4. Ensure file is ready for git staging

  ### Phase 2: Git Integration
  This phase stages the validated file, creates a conventional commit, and pushes to remote.

  **Why second**: Only valid files should enter version control. Git operations are the final
  "publish" step after content validation.

  **What gets built**:
  1. Stage file with `git add test-ww2iac.md`
  2. Create commit with message: `feat(115): create markdown file test-ww2iac.md with prose content`
  3. Push to remote origin on feature branch `feat/115-markdown-content-file-763a04`

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **LLM generates invalid markdown** | Comprehensive validation in validate_markdown_file() catches format errors. LLM proven across 14+ prior features. |
  | **File encoding is not UTF-8 or has BOM** | pathlib.write_text(encoding='utf-8') ensures UTF-8. Validation checks for BOM byte sequence. |
  | **Line endings are CRLF instead of LF** | pathlib writes text mode (platform-aware). Validation checks for LF. Feature runs on Linux. |
  | **File size exceeds 300-500 bytes** | Validation checks file size and rejects if out of range. LLM prompted for 2-3 sentences (~300-400 bytes). |
  | **Git state is unexpected** | Feature branch `feat/115-markdown-content-file-763a04` is pre-created. Git tools validate repo state before operations. |
  | **Remote push fails** | GitPushTool provides structured error handling. Failure is explicit, not silent. |
  | **Prose grammar incorrect** | LLM trained on high-quality text. Validation does not check grammar (out of scope). |

