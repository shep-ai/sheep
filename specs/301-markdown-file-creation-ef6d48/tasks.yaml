content: |
  ## Implementation Summary

  Feature 301 implementation consists of 4 ordered tasks across 2 phases:

  **Phase 1: Feature Module Creation**
  - Task 1: Create the feature module with constants and wrapper function
  - Task 2: Implement main() entry point with error handling

  **Phase 2: Testing and Verification**
  - Task 3: Write integration test covering all success criteria
  - Task 4: Run feature end-to-end and verify all functionality

  The implementation leverages the existing `create_markdown_file()` orchestration function from
  `src/sheep/content_generators.py`, which handles all complex logic: content generation, file writing,
  validation, and git operations. The feature module is a thin wrapper that provides a consistent
  entry point and feature-level error handling.

  Task dependencies are linear: constants and wrapper function (task-1) → main entry point (task-2) →
  integration test (task-3) → manual verification (task-4). Each task builds on the previous one.

  Total estimated effort is 2 hours 5 minutes, with the bulk of work in integration testing.
  The actual implementation (creating the module and main function) is minimal because all complex
  logic is already implemented in the orchestration function.
