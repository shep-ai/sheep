content: |
  ## Problem Statement

  Feature 301 requires creating a single markdown file named test-wx8ewb.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 301st iteration of a well-established feature pattern successfully executed 300+ times in the Sheep codebase.

  ## Success Criteria

  - [ ] File `test-wx8ewb.md` exists at repository root (no subdirectories)
  - [ ] File contains exactly one H1 heading on the first line (matches `^# .+$`)
  - [ ] H1 heading is followed by exactly one blank line before prose
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] Prose content is coherent and grammatically correct
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix LF line endings throughout (no CRLF or mixed line endings)
  - [ ] File size is at least 50 bytes (ensures meaningful content)
  - [ ] File ends with exactly one trailing newline
  - [ ] Git commit created with message: `feat(301): create markdown file test-wx8ewb.md with prose content`
  - [ ] Commit author and message follow conventional commit format
  - [ ] Changes pushed to remote with upstream branch tracking (`git push -u`)
  - [ ] All validation checks pass before git operations
  - [ ] No other files modified during feature execution
  - [ ] Feature execution completes without errors

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named exactly `test-wx8ewb.md` at repository root (path: `./test-wx8ewb.md`)
  - **FR-2**: File must contain an H1 markdown heading (`# Title`) as the first line
  - **FR-3**: H1 heading must be separated from prose by exactly one blank line
  - **FR-4**: File must contain exactly 2 or 3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be coherent and relate to a single topic
  - **FR-6**: Content must be generated via Anthropic Claude API using the LLM factory from `config/llm.py`
  - **FR-7**: File must be encoded as UTF-8 without BOM and validated before writing
  - **FR-8**: File must use Unix LF line endings exclusively (validated binary read check)
  - **FR-9**: File changes must be staged using `git add test-wx8ewb.md`
  - **FR-10**: Changes must be committed with conventional commit message: `feat(301): create markdown file test-wx8ewb.md with prose content`
  - **FR-11**: Commit must be pushed to remote with upstream tracking (`git push -u`)
  - **FR-12**: System must validate file format and encoding before git operations
  - **FR-13**: Implementation must call `create_markdown_file(filename="test-wx8ewb.md", feature_number=301)` from `content_generators.py`
  - **FR-14**: No files outside repository root must be modified

  ## Non-Functional Requirements

  - **NFR-1**: File size must be at least 50 bytes (enforced by content validator)
  - **NFR-2**: Prose content must be grammatically correct and coherent (validated by LLM generation)
  - **NFR-3**: Feature execution must complete within 5 minutes including LLM API call
  - **NFR-4**: All file I/O operations must use `pathlib.Path` for cross-platform compatibility
  - **NFR-5**: Implementation must follow established pattern from features 297-300 (no architectural deviation)
  - **NFR-6**: All validation errors must be logged using `sheep.observability.logging.get_logger()`
  - **NFR-7**: Git operations must not modify any files outside the target markdown file
  - **NFR-8**: Implementation must use only existing infrastructure (no new dependencies)
  - **NFR-9**: Code style must match `src/sheep/features/feature_*.py` conventions
  - **NFR-10**: Function must handle Unicode content gracefully (emoji, accented characters OK)
  - **NFR-11**: Error messages must be descriptive and actionable for debugging
  - **NFR-12**: Feature module must be located at `src/sheep/features/feature_301_markdown_file_creation.py`

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should validation include metrics beyond sentence count (e.g., flesch reading level, grammar checking)? | Minimal validation only | The existing `content_generators.py` validation is proven across 300+ features. Sentence count and LLM coherence are sufficient. Additional metrics add complexity without improving the output quality or meeting the spec's explicit requirements. |
  | 2 | How should git push failures be handled after file is committed? | Raise exception and fail feature | Preserves data integrity and matches error handling in existing git_tools. User gets explicit notification to investigate. Retry logic adds unnecessary complexity to a proven pattern. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | Low | The `create_markdown_file()` orchestration function and all validation logic are already implemented and tested. Only needs invocation with filename=test-wx8ewb.md. |
  | `src/sheep/features/feature_301_markdown_file_creation.py` | High | New file creation following established pattern from feature_297.py and others. Simple wrapper calling `create_markdown_file()` helper. |
  | Repository root | High | Output location where test-wx8ewb.md will be created. |
  | `.git/` directory | Medium | Git operations will stage, commit, and push changes to remote. Commit message added to history. |
  | `src/sheep/config/llm.py` | None | No changes needed. LLM factory already configured for content generation. |

  ## Dependencies

  **Internal Dependencies**:
  - `sheep.content_generators.create_markdown_file()` — Main orchestration function (generates content, writes file, validates, commits, pushes)
  - `sheep.observability.logging.get_logger()` — Structured logging utility
  - `pathlib.Path` — Cross-platform path operations

  **External Dependencies**:
  - **CrewAI** — Agent framework (indirect, used by overall architecture)
  - **Anthropic Claude API** — Content generation via LLM
  - **Git CLI** — Executable for staging, committing, pushing (subprocess)
  - **Python Standard Library** — subprocess, pathlib, logging

  **No New Dependencies Required**: All required infrastructure is already in place and proven across 300+ prior features.

  ## Implementation Strategy

  The implementation will follow the established pattern from features 297-300:

  1. **Create feature module** `src/sheep/features/feature_301_markdown_file_creation.py`
     - Define `MARKDOWN_FILENAME = "test-wx8ewb.md"`
     - Define `FEATURE_NUMBER = 301`
     - Create function `create_test_wx8ewb_markdown_file()` calling `create_markdown_file()`

  2. **Invoke orchestration function**
     - Call `create_markdown_file(filename="test-wx8ewb.md", feature_number=301)`
     - The function handles all steps: generate, write, validate, commit, push

  3. **Git workflow** (handled automatically by orchestration function)
     - File is created at repository root
     - Git commit with message: `feat(301): create markdown file test-wx8ewb.md with prose content`
     - Push to remote branch with upstream tracking

  No changes needed to existing modules. Implementation is a thin wrapper around proven infrastructure.

  ## Size Estimate

  **S** (hours, ~1-2 hours including testing)

  **Rationale**:
  - The core infrastructure (content generation, validation, git operations) is mature and tested
  - The feature follows an established pattern with 300 prior implementations as reference
  - The implementation is primarily a wrapper around `create_markdown_file()` orchestration function
  - No architectural changes, no dependency updates, no complex logic
  - Main effort: create feature module following convention, invoke orchestration, verify output
  - Risk is minimal due to proven pattern and comprehensive validation in content_generators module

  ---

  _Requirements phase complete — ready for implementation_
