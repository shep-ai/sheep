content: |
  ## Problem Statement

  Feature 301 requires creating a single markdown file named test-wx8ewb.md with:
  - An H1 markdown heading (# Title)
  - A blank line separator
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote

  This is the 301st repetition of a well-established feature pattern in the Sheep codebase.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. Key directories:

  - `src/sheep/agents/` — AI agent definitions (research, implementation, review roles)
  - `src/sheep/config/` — Configuration management (LLM factory, settings)
  - `src/sheep/flows/` — CrewAI flow orchestration (code implementation flow, chat flow)
  - `src/sheep/tools/` — Agent tools (git_tools.py, file_tools.py, web_tools.py)
  - `src/sheep/observability/` — Logging and Langfuse tracing integration
  - `src/sheep/features/` — Feature implementation modules (100+ markdown file creation features)
  - `src/sheep/content_generators.py` — Centralized markdown content generation and validation

  ### Architecture Patterns

  **Separation of Concerns**:
  - Flows define execution orchestration and control paths
  - Crews provide autonomous AI decision-making via CrewAI agents
  - Tools encapsulate external system interactions (Git, file I/O, LLM calls)

  **Content Generation Pipeline**:
  The project uses a proven 5-step orchestration pattern in `create_markdown_file()`:
  1. Generate markdown content via LLM (Claude API) with format validation
  2. Write file to repository root with UTF-8 encoding
  3. Validate file meets all format and encoding requirements
  4. Stage and commit with conventional commit message format (feat(FEATURE_NUMBER): ...)
  5. Push to remote with upstream branch tracking (-u flag)

  **Tool Architecture**:
  - `FileReadTool`, `FileWriteTool`, `FileSearchTool`, `DirectoryTreeTool` — File operations
  - `GitCommitTool`, `GitPushTool`, `GitStatusTool` — Git operations
  - Tools inherit from CrewAI's `BaseTool` with Pydantic schema validation

  ### Relevant Technologies

  **LLM Integration**:
  - Uses `get_reasoning_llm()` factory from `config/llm.py`
  - Supports multiple providers: OpenAI, Anthropic Claude, Google Gemini
  - Calls LLM with structured prompt expecting markdown format

  **Content Generation**:
  - `MARKDOWN_GENERATION_PROMPT` template defines expected output format
  - Validation checks: H1 heading present, 2-3 sentence count, trailing newline, >50 bytes
  - File validation ensures UTF-8 encoding, no BOM, LF line endings, proper markdown structure

  **Git Operations**:
  - Uses subprocess to execute `git add`, `git commit`, `git push`
  - Conventional commit format: `feat(301): create markdown file test-wx8ewb.md with prose content`
  - Push uses `-u` flag for upstream tracking on new branches

  **File I/O**:
  - Pathlib for cross-platform path handling
  - UTF-8 encoding with error handling
  - Binary read for encoding validation (checks for BOM, CRLF)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | Low | The `create_markdown_file()` orchestration function and all validation logic are already implemented and tested. Only needs invocation with filename=test-wx8ewb.md. |
  | `src/sheep/features/feature_301_markdown_file_creation.py` | High | New file creation following established pattern from feature_297.py and others. Simple wrapper calling `create_markdown_file()` helper. |
  | Repository root | High | Output location where test-wx8ewb.md will be created. |
  | `.git/` directory | Medium | Git operations will stage, commit, and push changes to remote. Commit message added to history. |
  | `src/sheep/config/llm.py` | None | No changes needed. LLM factory already configured for content generation. |

  ## Dependencies

  **Internal Dependencies**:
  - `sheep.content_generators.create_markdown_file()` — Main orchestration function (generates content, writes file, validates, commits, pushes)
  - `sheep.observability.logging.get_logger()` — Structured logging utility
  - `pathlib.Path` — Cross-platform path operations

  **External Dependencies**:
  - **CrewAI** — Agent framework (indirect, used by overall architecture)
  - **Anthropic Claude API** — Content generation via LLM
  - **Git CLI** — Executable for staging, committing, pushing (subprocess)
  - **Python Standard Library** — subprocess, pathlib, logging

  **No New Dependencies Required**: All required infrastructure is already in place and proven across 300+ prior features.

  ## Implementation Strategy

  The implementation will follow the established pattern from feature 297:

  1. **Create feature module** `src/sheep/features/feature_301_markdown_file_creation.py`
     - Define `MARKDOWN_FILENAME = "test-wx8ewb.md"`
     - Define `FEATURE_NUMBER = 301`
     - Create function `create_test_wx8ewb_markdown_file()` calling `create_markdown_file()`

  2. **Invoke orchestration function**
     - Call `create_markdown_file(filename="test-wx8ewb.md", feature_number=301)`
     - The function handles all steps: generate, write, validate, commit, push

  3. **Git workflow** (handled automatically)
     - File is created at repository root
     - Git commit with message: `feat(301): create markdown file test-wx8ewb.md with prose content`
     - Push to remote branch with upstream tracking

  No changes needed to existing modules. Implementation is a thin wrapper around proven infrastructure.

  ## Size Estimate

  **S** (hours, ~1-2 hours including testing)

  **Rationale**:
  - The core infrastructure (content generation, validation, git operations) is mature and tested
  - The feature follows an established pattern with 300 prior implementations as reference
  - The implementation is primarily a wrapper around `create_markdown_file()` orchestration function
  - No architectural changes, no dependency updates, no complex logic
  - Main effort: create feature module following convention, invoke orchestration, verify output
  - Risk is minimal due to proven pattern and comprehensive validation in content_generators module

