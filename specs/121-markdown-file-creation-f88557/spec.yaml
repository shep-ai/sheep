content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established and proven pattern. This feature creates a single test markdown file (`test-6kxv9g.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 099-120, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-6kxv9g.md` exists at the repository root
  - [ ] File contains exactly one H1 heading (single `#` character) that serves as the markdown title
  - [ ] File contains 2-3 sentences of prose content below the heading
  - [ ] A blank line separates the H1 heading from the prose content
  - [ ] File is UTF-8 encoded with no BOM
  - [ ] File size is between 350-600 bytes (consistent with 100+ established test files)
  - [ ] File is staged in git via `git add test-6kxv9g.md`
  - [ ] Commit exists with conventional message format: `feat(121): Create markdown file test-6kxv9g.md with prose content`
  - [ ] Commit is pushed to remote origin on the feature branch `feat/121-markdown-file-creation-f88557`
  - [ ] No other files are modified, created, or deleted during implementation
  - [ ] Implementation follows the straightforward imperative pattern (file I/O + git workflow, no validation or error handling)

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-6kxv9g.md` at the repository root directory
  - **FR-2**: File MUST contain a single H1 heading (markdown syntax: `# Title`) as the first line
  - **FR-3**: File MUST contain exactly 2-3 sentences of prose content following the H1 heading
  - **FR-4**: A blank line MUST separate the H1 heading from the prose content
  - **FR-5**: File MUST be UTF-8 encoded with no byte order mark (BOM)
  - **FR-6**: File MUST be created using Python's pathlib module (pathlib.Path().write_text())
  - **FR-7**: File MUST be staged in git using `git add test-6kxv9g.md`
  - **FR-8**: A commit MUST be created with the message format `feat(121): Create markdown file test-6kxv9g.md with prose content`
  - **FR-9**: Changes MUST be pushed to the remote origin on the current feature branch
  - **FR-10**: Prose content MUST be grammatically correct and coherent, consisting of complete sentences
  - **FR-11**: No modifications to existing files, directories, or configuration are permitted

  ## Non-Functional Requirements

  - **NFR-1**: File size MUST be between 350-600 bytes (consistent with 100+ established test files in the pattern)
  - **NFR-2**: Implementation MUST follow the straightforward imperative code pattern established in features 099-120 (no validation, error handling, or edge-case management beyond standard git and file I/O)
  - **NFR-3**: File creation operations MUST be atomic and deterministic (file is fully written before staging)
  - **NFR-4**: Implementation MUST use only Python 3.11+ standard library (pathlib, subprocess)
  - **NFR-5**: Git operations MUST use standard git CLI commands (add, commit, push) via subprocess.run()
  - **NFR-6**: Implementation effort MUST not exceed 15 minutes (estimated 10-15 minutes based on features 099-120)
  - **NFR-7**: No testing, documentation updates, or configuration changes are required
  - **NFR-8**: Prose content MUST be generic and simple, requiring no domain-specific expertise or research
  - **NFR-9**: The implementation MUST be idempotent in structure and logic (same pattern applied consistently as in features 099-120)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the 2-3 sentences be about? | Generic educational topic | Neutral and applicable to any context. Easy to generate consistently. Appropriate for test files that demonstrate automation capability. |
  | 2 | Should the implementation exactly replicate features 099-120, or allow variations? | Exactly replicate the established pattern | Consistency with 100+ existing test files is critical. Established pattern is proven. Straightforward imperative approach requires no deviations. Variations would complicate review and maintenance. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-6kxv9g.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 099-120; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the Sheep platform |
  | Configuration Files | None | No changes to .env, docker-compose.yml, setup.py, pyproject.toml, or any other config |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/121-markdown-file-creation-f88557` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (standard access level)
  - **Established pattern**: 100+ test files provide clear precedent for content format, structure, and encoding
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (already available in development environment)
  - **Python subprocess**: Standard library module for executing git commands
  - **Encoding**: UTF-8 without BOM (default behavior of pathlib.Path().write_text() on Unix/Linux systems)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed (see existing test-*.md files)
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (099-120) demonstrate efficient implementation of identical features in 10-15 minutes
  - Straightforward imperative code pattern (write file, stage, commit, push) keeps implementation simple
  - No validation or error handling needed per established pattern

  ---

  _Requirements phase complete — specification ready for implementation_
