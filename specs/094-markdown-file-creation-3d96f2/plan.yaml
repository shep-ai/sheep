content: |
  ## Architecture Overview

  This feature follows an established pattern demonstrated across 93+ test files in the repository
  (features 069-093). The implementation is straightforward:

  1. Create a markdown file at repository root using Python pathlib.Path.write_text()
  2. Compose prose with H1 markdown heading and 2-3 sentences on a universal topic
  3. Validate file format (structure, encoding, size, line endings)
  4. Execute standard git workflow: add → commit → push

  The feature is purely additive—creating a new test file without modifications to existing code
  or configuration. It does not depend on src/sheep/ application code, and introduces no architectural
  changes.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use pathlib.Path.write_text(content, encoding='utf-8') to create the markdown file.

  **Rationale:**
  - Specification explicitly requires pathlib for file creation (FR-4)
  - Modern Python standard (available in Python 3.4+; universal in 3.11+)
  - Handles UTF-8 encoding transparently by default
  - Cross-platform path handling
  - Aligns with existing codebase pattern in src/sheep/tools/git_tools.py (line 4)
  - 80+ precedent test files confirm reliability across features 069-093

  **Alternatives rejected:**
  - os.open()/os.write(): Lower-level, more verbose, no encoding benefits
  - open() context manager: More boilerplate than Path.write_text()
  - Third-party libraries: Unnecessary overhead for simple write operation

  ### 2. Git Operations: subprocess CLI Interface

  **Decision:** Use subprocess.run() to call git CLI commands (add, commit, push).

  **Rationale:**
  - Established pattern in src/sheep/tools/git_tools.py (lines 15-29)
  - Explicit command visibility and control
  - Proper error handling via CalledProcessError
  - Cross-platform compatibility
  - Aligns with existing agent tool infrastructure
  - gitpython is already in pyproject.toml but subprocess provides simpler, more transparent API

  **Alternatives rejected:**
  - GitPython library: Adds abstraction overhead for simple operations
  - Shell execution (os.system, shell=True): Security risks, poor error handling
  - Direct os.system(): Deprecated, platform-dependent behavior

  ### 3. Prose Content: Static Composition with Universal Topic

  **Decision:** Compose static prose with a universal, educational topic matching established pattern.

  **Rationale:**
  - Specification preference: "generic/universal topics are preferred" (NFR-9)
  - 80+ precedent files use universal topics: "The Value of Deep Work", "Bioluminescence", etc.
  - Static composition ensures:
    - Deterministic, repeatable output (testable)
    - No external API calls or latency
    - Natural prose quality matching precedent
    - Fast implementation (no random generation, no LLM calls)
  - Topic selection from established pattern ensures prose quality meets NFR-2 (grammatically correct)

  **Alternatives rejected:**
  - Random topic generation: Non-deterministic, complicates testing, not requested
  - LLM-based generation: Unnecessary latency, API dependency, cost
  - Template engines (Jinja2): Overkill for single static composition

  ### 4. Markdown Syntax Validation: String Inspection (No External Parser)

  **Decision:** Validate markdown format using Python string operations (no external markdown library).

  **Rationale:**
  - Required markdown is trivial: `# Heading\n\n<2-3 sentences>\n`
  - Can be validated entirely with Python string operations:
    - Check first non-empty line starts with '#'
    - Verify blank line separates heading from prose
    - Count sentences (split on '. ', verify 2-3 results)
    - Validate UTF-8 encoding (write_text() default)
    - Verify LF-only line endings (explicit '\n' in content)
  - Aligns with principle of minimal dependencies

  **Alternatives rejected:**
  - markdown or commonmark library: Adds dependency for trivial validation
  - Regex validation: Fragile, hard to maintain
  - No validation: Risks invalid output, violates success criteria

  ### 5. File Encoding & Line Endings: UTF-8 with Explicit LF

  **Decision:** Use Path.write_text(encoding='utf-8') with explicit '\n' in content string.

  **Rationale:**
  - Path.write_text() defaults to UTF-8 without BOM, satisfying NFR-3
  - Explicit '\n' characters in content string ensure LF-only output (NFR-4)
  - Cross-platform approach handles platform-specific line ending defaults
  - Testable via system commands: `file test-ky4beg.md` confirms UTF-8
  - Aligns with observed behavior in 80+ precedent test files

  **Alternatives rejected:**
  - write_bytes() with explicit encoding: More verbose, no benefit
  - Platform default encoding: Risk of CRLF on Windows
  - Ignoring encoding/line endings: Violates success criteria

  ### 6. Topic Selection: Universal, Educational Domains

  **Decision:** Select topic from established pattern (e.g., "Resilience", "The Power of Patience", "Adaptability").

  **Rationale:**
  - Precedent analysis shows consistent pattern across 80+ files
  - Topics are universal, educational, non-controversial
  - Ensures prose quality (meets NFR-2)
  - Natural language flow without forced padding
  - File size typically 420-500 bytes with 3 sentences
  - Consistency with 93+ prior implementations

  **Alternatives rejected:**
  - Highly technical topics: Breaks precedent pattern
  - Controversial/opinion-heavy topics: Risk of poor prose quality
  - Random topic selection: Non-deterministic, testing complexity

  ## Implementation Strategy

  ### Phase 1: File Creation & Validation

  This phase creates and validates the markdown file to ensure it meets all success criteria:
  format, structure, encoding, size, and line endings. Work is sequential: compose content,
  create file, then validate properties.

  **Why first:** The file must exist and be properly formed before git operations can succeed.
  Validation ensures success criteria are met before committing.

  ### Phase 2: Git Workflow

  This phase executes standard git operations: stage file, commit with conventional message,
  push to feature branch. These operations depend on the file being created and validated.

  **Why second:** Only after file is created and validated should git operations proceed.
  This phase completes the feature and pushes changes to the feature branch.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (not UTF-8 or CRLF present) | Use pathlib.Path.write_text(encoding='utf-8') and explicit '\n' in content; validate with `file` command |
  | File size outside 320-600 byte range | Compose 2-3 sentences targeting 420-500 bytes; validate with `wc -c` |
  | Invalid markdown syntax | Validate H1 heading (first line starts with '#'), blank line separator, 2-3 sentences using string inspection |
  | Git operations fail | Use subprocess.run() with error handling; follow established pattern from git_tools.py |
  | File already exists or uncommitted changes | Clean working tree before starting; feature branch pre-exists (per dependency list) |
  | Prose quality issues | Select topic from established universal pattern; compose 3 grammatically correct sentences matching precedents |
  | Commit message format incorrect | Use exact format from specification: `feat(094): create markdown file test-ky4beg.md with prose content` |
