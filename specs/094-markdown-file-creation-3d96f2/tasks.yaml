content: |
  ## Summary

  Implementation proceeds in two sequential phases:

  **Phase 1: File Creation & Validation (Tasks 1-3, ~15 minutes)**
  First, compose the prose content with a universal, educational topic and 2-3 sentences
  (task-1). Second, create the markdown file at repository root using pathlib.Path.write_text()
  with proper structure: H1 heading, blank line, prose content (task-2). Third, validate the file
  meets all success criteria: correct structure, UTF-8 encoding, LF-only line endings, and
  file size within 320-600 bytes (task-3). This phase ensures the file is properly formed before
  any git operations.

  **Phase 2: Git Workflow (Tasks 4-6, ~10 minutes)**
  Execute standard git workflow: stage the file with `git add` (task-4), commit with conventional
  message format `feat(094): create markdown file test-ky4beg.md with prose content` (task-5),
  and push to the feature branch `feat/094-markdown-file-creation-3d96f2` (task-6). This phase
  completes the feature by pushing changes to the remote repository.

  **Rationale for Ordering:**
  - Tasks 1-3 must complete before git operations because the file must be created and validated
    to ensure it meets all quality criteria before committing
  - Tasks 4-6 are strictly sequential: files must be staged before they can be committed, and
    committed before they can be pushed
  - No parallel work is possible; each phase depends on the completion of the previous

  **Total Effort:** ~30 minutes (well within the S size estimate of 10-15 minutes for the feature,
  with buffer for validation and any issues)
