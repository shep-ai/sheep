# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** Python pathlib.Path.write_text(content, encoding='utf-8')

  **Rejected:**
  - os.open() / os.write() — Lower-level APIs, more verbose boilerplate, no built-in encoding handling
  - open() context manager — More boilerplate, no efficiency gain over Path.write_text()
  - Third-party file libraries — Unnecessary overhead for simple write operation

  **Rationale:** pathlib is the modern Python standard for file I/O (standard since Python 3.4,
  universal in 3.11+). It is cross-platform, concise, and handles UTF-8 encoding transparently
  by default. The specification explicitly requires this method (FR-4). This aligns with existing
  codebase patterns: git_tools.py already imports and uses pathlib.Path (line 4). The 80+ precedent
  test files confirm this approach has been reliable across features 069-093.

  ### 2. Git Operations: subprocess CLI Interface

  **Chosen:** subprocess.run() calling git CLI commands (git add, git commit, git push)

  **Rejected:**
  - GitPython library — Already in pyproject.toml (gitpython>=3.1.0), but subprocess is more explicit,
    aligns with existing codebase pattern in git_tools.py, avoids object abstraction overhead
  - Shell execution (os.system, shell=True) — Security risk, poor error handling, cross-platform issues
  - Direct os.system() — Deprecated approach, platform-dependent behavior

  **Rationale:** The codebase establishes a clear pattern in src/sheep/tools/git_tools.py:
  all git operations use subprocess.run() with a _run_git() helper (lines 15-29). This provides:
  explicit command visibility, proper error handling via CalledProcessError, cross-platform
  compatibility, and alignment with the existing tool infrastructure. Reusing this pattern ensures
  consistency, maintainability, and reliability validated by existing agent tool usage.

  ### 3. Prose Content Generation

  **Chosen:** Static prose composition with a universal, educational topic

  **Rationale:** The feature spec states "prose topic can be any appropriate subject
  (generic/universal topics are preferred)" (NFR-9). Analysis of 80+ precedent test files shows
  all use universal educational topics like "The Value of Deep Work" and "Bioluminescence".
  Static composition is deterministic, testable, and requires no external API calls or LLM
  integration. This approach ensures:
  - Deterministic, repeatable output (testable)
  - No external dependencies or latency
  - Natural prose quality matching precedent patterns
  - Fast implementation (no API calls, no random generation retry loops)

  **Rejected:**
  - Random topic generation — Non-deterministic makes testing harder, no user requirement for randomness
  - LLM-based generation — Introduces latency, API dependency, cost, learning curve; simple prose can be written directly
  - Template engines — Overkill for single static composition

  ### 4. Markdown Syntax Validation

  **Chosen:** Manual validation via Python string inspection (no external markdown parser)

  **Rationale:** The required markdown format is trivial: H1 heading + blank line + 2-3 sentences
  + trailing newline. This can be validated entirely with Python string operations:
  - Check first non-empty line starts with '#'
  - Verify blank line separates heading from prose
  - Count sentences (split on '. ', check 2-3 results)
  - Validate UTF-8 encoding via write_text(encoding='utf-8')
  - Verify line endings are LF-only (no '\r')

  No external parser is needed. This aligns with the principle of minimal dependencies and
  ensures compliance with the exact format required by success criteria.

  **Rejected:**
  - markdown or commonmark library — Adds external dependency for trivial validation
  - Regex validation — Fragile, hard to maintain, prone to false positives
  - No validation — Risk of invalid output, violates success criteria (NFR-1)

  ### 5. File Encoding and Line Endings

  **Chosen:** Python Path.write_text(encoding='utf-8') with explicit newline control

  **Rationale:** Python 3's Path.write_text() defaults to UTF-8 encoding without BOM, satisfying
  NFR-3. Line endings are controlled by composing the content with explicit '\n' characters
  (not '\r\n'), ensuring LF-only output as required by NFR-4. Validation via system commands
  (e.g., `file test-ky4beg.md`) confirms UTF-8 encoding.

  This approach is:
  - Cross-platform (handles platform-specific line ending defaults)
  - Explicit (source code shows exact '\n' usage)
  - Testable (file command confirms UTF-8, `grep -U $'\r'` would fail for CRLF)
  - Aligned with observed behavior in 80+ precedent test files

  **Rejected:**
  - write_bytes() with explicit encoding — More verbose, no benefit over write_text()
  - Platform default encoding — Risk of CRLF line endings on Windows (violates NFR-4)
  - Ignoring encoding/line endings — Violates success criteria and non-functional requirements

  ### 6. Topic Selection for Prose Content

  **Chosen:** Universal, educational topic matching established pattern from precedents

  **Rationale:** Analysis of 80+ precedent test files shows consistent pattern:
  - Topics are universal and educational: "The Value of Deep Work", "Bioluminescence",
    "Consistency", "Adaptability"
  - Prose is naturally written, 2-3 sentences, grammatically correct
  - Topics avoid controversy or opinion-heavy language
  - File sizes typically 400-600 bytes with natural prose flow

  Selecting a topic in this pattern ensures:
  - High prose quality (meets NFR-2: "grammatically correct and coherent")
  - Natural language flow without forced padding
  - File size within bounds (typically 420-500 bytes with 3 sentences)
  - Consistency with 93+ prior implementations
  - User preference alignment (NFR-9: "generic/universal topics are preferred")

  **Rejected:**
  - Highly technical topics — Breaks precedent pattern, harder to write naturally
  - Controversial/opinion-heavy topics — Risk of poor prose quality, grammar issues
  - Random topic selection — Non-deterministic, testing complexity, not required

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  |---------|---------|----------|-----------|
  | pathlib | File I/O operations | Use (standard library) | Built-in to Python 3.11+; required by spec (FR-4); handles cross-platform paths and UTF-8 encoding transparently |
  | subprocess | Git CLI execution | Use (standard library) | Built-in to Python 3.11+; aligns with existing codebase pattern in git_tools.py; explicit command control |
  | gitpython | Git object abstraction | Reject (not needed) | Already in pyproject.toml but adds abstraction overhead for simple operations; subprocess pattern is established |
  | markdown | Markdown validation | Reject (not needed) | Markdown format is trivial (H1 heading + 2-3 sentences); manual validation with strings is simpler and faster |
  | re | Regex validation | Reject (fragile) | String inspection is simpler and more maintainable than regex for this format |
  | random | Topic randomization | Reject (not needed) | Topics should be universal and matching established pattern; randomization adds complexity without user requirement |

  ## Security Considerations

  **File Creation Security:**
  - No user input validation needed (filename is hardcoded as "test-ky4beg.md")
  - File is created at repository root with standard permissions
  - UTF-8 encoding prevents encoding-based attacks
  - Path.write_text() prevents path traversal (always relative to cwd)

  **Git Operations Security:**
  - Commit message is constructed from safe string literals (no user input)
  - subprocess.run() is called with explicit arguments (no shell=True, no injection risk)
  - Follows established pattern in git_tools.py with error handling
  - No credentials or secrets involved

  **No security vulnerabilities identified for this straightforward file creation task.**

  ## Performance Implications

  **Execution Performance:**
  - File creation via pathlib.Path.write_text(): <1ms (local I/O)
  - Git add/commit/push: <500ms total (local operations on feature branch)
  - Total implementation time: 10-15 minutes (size estimate: S)
  - No performance concerns; operations are fast local file/git operations

  **Resource Usage:**
  - File size: 420-500 bytes (negligible)
  - Memory: Python string composition in memory (minimal)
  - Disk: Single new file, no deletion or overwrite (additive only)
  - Network: Git push to remote (standard one-time operation)

  **No performance constraints or optimizations required.**

  ## Architecture Notes

  **Alignment with Existing Codebase:**
  - File creation follows implicit pattern from 80+ precedent test files (features 069-093)
  - Git operations align with git_tools.py pattern: subprocess.run() with _run_git() helper
  - Modular design: file creation and git operations are orthogonal concerns
  - No changes to src/sheep/ application architecture required

  **Integration Points:**
  - If this feature is implemented as a direct script/CLI task: minimal integration needed
  - If wrapped in CrewAI agent tool: can follow GitStatusTool/GitCommitTool pattern from git_tools.py
  - Git operations can leverage existing GitCommitTool and GitPushTool if agent execution is desired

  **Codebase Consistency:**
  - No breaking changes to existing APIs or tools
  - No modifications to pyproject.toml dependencies (all required libraries are standard)
  - Follows established patterns for file I/O (pathlib) and git operations (subprocess)
  - Additive only: creates new test file, no deletions or modifications to existing code

  ## Implementation Checklist

  - [ ] Create markdown file with pathlib.Path.write_text()
    - [ ] H1 heading: "# {Topic}" (e.g., "# Resilience")
    - [ ] Blank line separator
    - [ ] 2-3 sentences of prose (target 420-500 bytes for natural sizing)
    - [ ] UTF-8 encoding without BOM (default for write_text())
    - [ ] LF-only line endings (explicit '\n' in content string)
  - [ ] Validate file format
    - [ ] File exists at repository root
    - [ ] First non-empty line is H1 heading
    - [ ] Blank line separates heading from prose
    - [ ] Exactly 2-3 sentences in prose section
    - [ ] File size 320-600 bytes (testable: `wc -c test-ky4beg.md`)
    - [ ] UTF-8 encoding confirmed (testable: `file test-ky4beg.md`)
    - [ ] LF-only line endings (no CRLF)
  - [ ] Git workflow
    - [ ] Stage file: `git add test-ky4beg.md`
    - [ ] Commit: `git commit -m "feat(094): create markdown file test-ky4beg.md with prose content"`
    - [ ] Push: `git push -u origin HEAD` or `git push`
    - [ ] Verify: `git log --oneline` shows new commit
  - [ ] Final validation
    - [ ] `git status` shows clean working tree (no uncommitted changes)
    - [ ] File is in staging area and pushed to feature branch

