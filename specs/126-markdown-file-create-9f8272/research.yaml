technologies:
  - Python 3.11+ (pathlib, subprocess from standard library)
  - pathlib.Path for file I/O operations
  - subprocess for git command execution
  - Markdown (file format with # heading + prose)
  - Git (version control, staging, committing, pushing)
  - UTF-8 text encoding
  - Unix LF line endings

relatedLinks:
  - title: "Python pathlib documentation"
    url: "https://docs.python.org/3/library/pathlib.html"
  - title: "Python subprocess documentation"
