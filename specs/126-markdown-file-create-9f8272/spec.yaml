content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-qghca6.md) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 100+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 121-125, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-qghca6.md` exists in repository root directory
  - [ ] File contains a markdown level-1 heading (# format) with a meaningful title
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] Blank line separates heading from prose content
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF (Unix) line endings
  - [ ] File size falls in the 400-600 byte range (natural consequence of required structure)
  - [ ] Prose content is coherent and grammatically correct
  - [ ] Markdown syntax is valid and parseable
  - [ ] File is staged in git via `git add test-qghca6.md`
  - [ ] Git commit created with message: `feat(126): create markdown file test-qghca6.md with prose content`
  - [ ] Commit is pushed to remote on feature branch `feat/126-markdown-file-create-9f8272`
  - [ ] Repository shows clean working tree after push (no uncommitted changes)

  ## Functional Requirements

  - **FR-1**: Create a file named `test-qghca6.md` in the repository root directory using Python pathlib
  - **FR-2**: File must contain a single markdown level-1 heading (`# `) with a meaningful, coherent title (3-10 words)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content after the heading
  - **FR-4**: A blank line must exist between the heading and prose section
  - **FR-5**: Stage the created file in git using `git add test-qghca6.md`
  - **FR-6**: Create a git commit with conventional commit message: `feat(126): create markdown file test-qghca6.md with prose content`
  - **FR-7**: Push the commit to the remote repository on the feature branch `feat/126-markdown-file-create-9f8272`
  - **FR-8**: Verify that the working tree is clean after the push (no uncommitted or untracked files remaining from this feature)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (byte order mark)
  - **NFR-2**: File line endings must be LF (Unix/Linux style), not CRLF (Windows style) or CR
  - **NFR-3**: File size must naturally fall within the 400-600 byte range as a consequence of proper structure (no artificial padding or compression)
  - **NFR-4**: Prose content must be grammatically correct (proper spelling, punctuation, sentence structure)
  - **NFR-5**: Prose content must be coherent and logically sound (not random words, disjointed thoughts, or nonsensical)
  - **NFR-6**: Markdown syntax must be valid and parseable by standard markdown parsers
  - **NFR-7**: Implementation must not modify, delete, or overwrite any existing files
  - **NFR-8**: Implementation must not change repository structure, create subdirectories, or modify non-markdown files
  - **NFR-9**: Git operations must use the pre-created feature branch; no branch creation or switching is required
  - **NFR-10**: No external dependencies beyond Python 3.11+ standard library (pathlib) and git

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Topic scope for prose content? | Any arbitrary topic | User query says "about anything"; 100+ precedents show diverse topics; no business constraint; minimizes implementation overhead |
  | 2 | Markdown structure flexibility? | Strict format only (heading + prose, no extra formatting) | Matches 100+ precedent pattern; simplifies validation; consistent with features 121-125 |
  | 3 | Prose quality validation method? | Manual review by implementer | Small feature, human-reviewable; no existing automated tools in repo; catches nuanced issues; lightweight approach matches test-file philosophy |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-qghca6.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-125; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create-9f8272` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Git configuration**: User name and email configured in git (standard setup requirement)
  - **Python 3.11+**: pathlib module available in standard library (no external packages required)
  - **Established pattern**: 100+ test files provide clear precedent for content format, structure, and git workflow
  - **Remote branch**: Feature branch must exist on remote repository for push operation

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (121-125) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Requirements phase complete — functional and non-functional requirements specified, product decisions resolved with structured recommendations, success criteria defined and measurable_
