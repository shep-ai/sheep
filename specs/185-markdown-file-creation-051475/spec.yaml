content: |
  ## Problem Statement

  Create a markdown file named test-setn4k.md with a title (H1 heading) and 2-3 sentences of prose content about any topic.
  This feature is part of a recurring pattern (features 1-185) that tests the ability to systematically create and manage
  markdown files within the Sheep agentic platform using established conventions.

  ## Codebase Analysis

  ### Project Structure

  The repository follows a standard Python package structure with Sheep as an agentic platform for automated code implementation:

  ```
  .
  ├── src/sheep/                    # Main package
  │   ├── agents/                   # CrewAI agent definitions
  │   ├── features/                 # Feature implementations (101+)
  │   ├── flows/                    # Orchestration flows
  │   ├── config/                   # LLM and settings configuration
  │   ├── tools/                    # Git, file, and web tools
  │   ├── content_generators.py     # Content generation utilities
  │   ├── observability/            # Logging and tracing (structlog, Langfuse)
  │   └── cli.py                    # CLI entry point (typer)
  ├── tests/                        # Test suite
  ├── specs/                        # Feature specifications (185 subdirectories)
  └── pyproject.toml                # Project configuration
  ```

  The root directory already contains 184 example markdown files (test-*.md) and corresponding implementation scripts.

  ### Architecture Patterns

  **1. Content Generation (src/sheep/content_generators.py)**
  - `generate_markdown_content()`: Uses CrewAI LLM integration to generate valid markdown (H1 + 2-3 sentences)
  - `write_markdown_file(content, filename)`: Uses `pathlib.Path.write_text()` with UTF-8 encoding
  - `validate_markdown_file(filepath)`: Validates structure, encoding (UTF-8 without BOM), line endings (LF), file size
  - `commit_markdown_file()`: Stages and commits with conventional commit message
  - `push_markdown_file()`: Pushes to remote origin

  **2. Feature Implementation Pattern (src/sheep/features/feature_101_markdown_file_creation.py)**
  - Each feature (101-184) follows identical structure: orchestration function calling content_generators utilities
  - Returns dict with filepath, content, commit_message, push_result
  - Uses structured logging via get_logger(__name__)
  - Handles exceptions with meaningful error logging

  **3. Git Workflow**
  - Conventional commits: `feat(NUMBER): create markdown file FILENAME.md with prose content`
  - No-verify flag to skip pre-commit hooks (--no-verify)
  - Push with upstream tracking: `git push -u origin HEAD`

  **4. Configuration & Logging**
  - LLM via CrewAI: Claude Opus/Sonnet via Anthropic API (src/sheep/config/llm.py)
  - Structured logging: structlog with Langfuse integration for observability
  - Settings managed via pydantic-settings

  ### Relevant Technologies

  - **CrewAI (≥0.86.0)**: Agent orchestration framework for LLM-based task execution
  - **Claude API**: LLM for content generation (via CrewAI integration)
  - **pathlib**: Cross-platform file I/O (Python 3.11+ stdlib)
  - **GitPython (≥3.1.0)**: Git operations (staging, committing, pushing)
  - **structlog (≥24.0.0)**: Structured logging with JSON output
  - **Langfuse (≥2.0.0)**: Observability and tracing for LLM calls
  - **pydantic (≥2.0.0)**: Configuration validation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | File will be created at /repo/test-setn4k.md (alongside 184 existing test-*.md files) |
  | src/sheep/features/ | Medium | New feature module feature_185_markdown_file_creation.py will be added following feature_101-184 pattern |
  | Git history | High | Will create commit and push, adding to feature branch history |
  | File system I/O | Low | Uses existing pathlib utilities; no new infrastructure needed |
  | Content generation | Low | Reuses existing generate_markdown_content() function from content_generators.py |
  | Git operations | Low | Reuses existing commit/push utilities from content_generators.py |

  ## Dependencies

  **Code Dependencies:**
  - `sheep.content_generators`: Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.observability.logging`: get_logger() for structured logging
  - `pathlib.Path`: Standard library for cross-platform file operations

  **External Dependencies:**
  - CrewAI LLM framework and Claude API (for content generation)
  - GitPython library (already present as dependency)
  - Git command-line tool (required by git operations)

  **Infrastructure Dependencies:**
  - Authenticated git repository with configured remote origin
  - Claude API credentials (via ANTHROPIC_API_KEY in environment)
  - Langfuse integration (optional, for observability)

  ## Success Criteria

  - File test-setn4k.md created in repository root directory
  - File contains valid markdown: H1 heading + blank line + 2-3 sentences of prose
  - File encoded as UTF-8 without BOM
  - File uses Unix LF line endings (not Windows CRLF)
  - File passes validation checks (structure, encoding, size ~400-600 bytes)
  - File staged and committed with conventional message: feat(185): create markdown file test-setn4k.md with prose content
  - Changes pushed to remote origin on feature branch

  ## Implementation Approach

  **Option A (Recommended): Reuse Pattern from Features 101-184**
  1. Create feature_185_markdown_file_creation.py in src/sheep/features/
  2. Orchestration function that calls existing content_generators utilities
  3. Minimal code (~100 lines) following established pattern
  4. Leverage all existing validation, logging, and git infrastructure

  **Option B: Standalone Script**
  1. Create standalone create_test_setn4k.py in repo root (like create_markdown.py examples)
  2. Hardcode prose content (no LLM call needed)
  3. Direct pathlib/subprocess usage
  4. Similar to earlier feature implementations

  Both approaches will produce identical file output and git history. Option A maintains architectural consistency with features 101-184.

  ## Size Estimate

  **S** — 30-60 minutes of work

  **Justification:**
  - Established pattern with 184 prior implementations to reference
  - Reusable infrastructure (content_generators.py utilities already exist and tested)
  - Minimal code: ~100 lines for feature module or ~50 lines for standalone script
  - No new dependencies, architecture changes, or complex logic
  - Git operations well-tested and reliable
  - Validation logic pre-built in content_generators.py

  Task breakdown:
  - 10 min: Understand pattern from feature_101-184 examples
  - 15 min: Write feature_185_markdown_file_creation.py module
  - 10 min: Test locally (run feature function, verify file created)
  - 10 min: Commit and push changes
  - 5 min: Verify remote branch and CI status
