# Markdown content (the full tasks document)
content: |
  ## Summary

  Three tasks implement the feature in linear sequence: First, create the markdown file
  with correct structure, encoding, and line endings. Second, stage and commit with
  conventional commit message. Third, push to the feature branch. Each task has explicit
  TDD cycles: assertions (RED), minimal implementation (GREEN), and cleanup (REFACTOR).
  Dependencies ensure proper ordering: task-2 depends on task-1 (file must exist before
  git operations), task-3 depends on task-2 (must commit before pushing).

  ## Task-by-Task Breakdown

  **Task 1: Create markdown file (5 minutes)**
  - Write test assertions validating file existence, structure, encoding, line endings, size
  - Implement via pathlib.Path.write_text() with encoding='utf-8' and newline='\\n'
  - Content: H1 heading + blank line + 2-3 sentences of prose (300-600 bytes)

  **Task 2: Stage and commit (5 minutes)**
  - Write test assertions validating file staging and commit message
  - Implement subprocess.run() calls for git add and git commit with conventional format
  - Commit message: 'feat(275): create markdown file test-zpf0fj.md with prose content'

  **Task 3: Push to remote (3-5 minutes)**
  - Write test assertions validating successful push and remote branch sync
  - Implement subprocess.run() call for git push to origin/feat/275-markdown-file-creation-02e887
  - Verify commit is visible in remote repository

  ## Implementation Notes

  - All tasks use TDD approach: assert expectations (RED), implement minimal code (GREEN), refactor
  - No external dependencies beyond Python stdlib (pathlib, subprocess) and git CLI
  - All three tasks are linear with no parallel work possible
  - Encoding and line endings are handled explicitly to satisfy NFR-1 and NFR-2
  - Git operations respect existing configuration (hooks, user.name, user.email, core.autocrlf)
  - Total estimated effort: 13-15 minutes (consistent with S size estimate)
