# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 178 leverages the proven markdown file creation infrastructure established
  across features 101-177. The codebase has successfully implemented 78 markdown
  file creation features following an identical pattern:

  1. **Reuse `create_markdown_file()` orchestration function** — This function in
     `sheep.content_generators` handles the complete workflow, validated through
     70+ successful implementations.

  2. **Minimal feature file** — The feature implementation is intentionally minimal:
     import the orchestration function, define constants (FEATURE_NUMBER, MARKDOWN_FILENAME,
     COMMIT_MESSAGE), call `create_markdown_file()`, return result. This matches
     feature_170 and preceding implementations.

  3. **LLM configuration via existing factory** — Use `sheep.config.llm.get_reasoning_llm()`
     which returns Claude configured with temperature 0.2 (low randomness for
     consistent output). Already integrated throughout the codebase.

  4. **Git tools integration** — Use `sheep.tools.GitCommitTool` and `GitPushTool`
     via wrapper functions `commit_markdown_file()` and `push_markdown_file()`.
     Tested, reliable, consistent with established pattern.

  5. **Logging system integration** — Use `sheep.observability.logging.get_logger()`
     for structured logging consistent with the rest of the codebase.

  The feature fits cleanly into the existing architecture with no new dependencies,
  no infrastructure changes, and no deviations from established patterns.

  ## Key Design Decisions

  ### 1. Orchestration Strategy
  **Decision:** Reuse `create_markdown_file()` function from `sheep.content_generators`.
  **Rationale:** The function has been validated across 70+ features, eliminating
  code duplication, maintaining consistency, and reducing implementation risk.
  The feature file becomes minimal: import, define constants, call orchestrator.

  ### 2. LLM Model and Temperature
  **Decision:** Claude API via `get_reasoning_llm()` with temperature 0.2.
  **Rationale:** Low temperature (0.2) ensures consistent, well-formatted output.
  Markdown generation requires precise format (H1 with #, blank line, exactly 2-3 sentences).
  Validated across 70+ features with high success rates.

  ### 3. Content Validation Strategy
  **Decision:** Comprehensive multi-stage validation (generation-time + post-write).
  **Rationale:** Belt-and-suspenders approach catches generation errors early (fail
  fast), detects file I/O failures, guarantees final state matches specification
  exactly. Each validation stage has specific error messages for debugging. Proven
  in features 101-177.

  ### 4. Error Handling Approach
  **Decision:** Fail fast on validation failure; stop immediately, report clear error.
  **Rationale:** Explicitly resolved in specification Product Questions section.
  Ensures repository stays clean, provides immediate debugging feedback, prevents
  partial state changes. Aligns with fail-safe patterns.

  ### 5. Sentence Validation Method
  **Decision:** Count periods using `string.count(".")` — simple and reliable.
  **Rationale:** Matches Claude's naturally generated output format. Simple, fast,
  no external dependencies (avoid nltk/spacy overkill). Validated across 70+ features.

  ### 6. File Encoding
  **Decision:** UTF-8 without BOM; Python's default `encoding=\"utf-8\"` parameter.
  **Rationale:** UTF-8 is universal standard, cross-platform consistent, Python's
  default. Specification explicitly requires UTF-8 without BOM. Proven in features
  101-177.

  ### 7. Line Endings
  **Decision:** Unix LF (\\n only); validate via binary read that no CRLF (\\r\\n) present.
  **Rationale:** LF is standard for version control, expected by git, consistent
  across all platforms (Windows, macOS, Linux). Specification explicitly requires
  LF. Validated approach in features 101-177.

  ### 8. Git Workflow
  **Decision:** Use `GitCommitTool` and `GitPushTool` via wrapper functions.
  **Rationale:** Tested, reliable, consistent with established pattern. Eliminates
  code duplication, leverages validated infrastructure, proper error handling,
  integrates with logging system.

  ### 9. Commit Message Format
  **Decision:** Conventional commit: `feat(178): create markdown file test-l2bcbe.md with prose content`
  **Rationale:** Specification explicitly defines this message format. Follows
  Conventional Commits specification (type, scope, subject). Enables automated
  changelog generation, commit filtering, version bumping.

  ### 10. Content Topic Selection
  **Decision:** Let Claude choose topic freely; no constraint in prompt.
  **Rationale:** Specification explicitly states \"about any topic\" and resolves
  this question as \"Let Claude choose freely\". Simplifies prompt, satisfies
  specification exactly. Claude naturally produces coherent prose on various topics.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Feature File Setup) → Phase 2 (Integration & Execution)**

  Phase 1 must come first because it creates the Python file that Phase 2 will
  execute. The feature file structure is straightforward—import existing functions,
  define constants, implement a wrapper function that calls `create_markdown_file()`.
  This follows TDD: write test for module import, create minimal file, add docstring
  and formatting.

  Phase 2 depends on Phase 1 being complete. Once the feature file exists, Phase 2
  executes it to create test-l2bcbe.md through the complete workflow. Phase 2 validates
  that all specification requirements are met: file exists, markdown is valid, UTF-8
  encoding, LF line endings, H1 heading, 2-3 sentences, git commit/push succeeded.

  ### No Parallelization Possible

  Phases must execute sequentially:
  - Phase 1 creates the feature file (prerequisite for Phase 2)
  - Phase 2 executes the feature file and validates output
  - Each phase depends on previous phase completion

  ### Total Implementation Time

  Size estimate from specification: **S (2-4 hours)**
  - Features 101-177 follow identical pattern, established infrastructure exists
  - No new dependencies, no infrastructure changes
  - Estimated breakdown:
    - Phase 1 (Feature File Setup): ~1 hour (create file, add imports, define constants)
    - Phase 2 (Integration & Execution): ~2-3 hours (execute, validate all requirements, debug if needed)
  - Total: 3-4 hours including validation and any troubleshooting

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Claude API unavailable or errors | Content generation fails, feature incomplete | Orchestration function implements fail-fast error handling with clear error messages. Logging captures all API calls for debugging. |
  | Generated content fails validation | File not created, repository stays clean | Multi-stage validation (generation-time + post-write) catches all issues early. Each validation function raises ValueError with specific error message. |
  | Git operations fail (commit/push) | Partial state, unclear error | GitTools (GitCommitTool, GitPushTool) implement comprehensive error handling. Orchestration function catches git exceptions and logs context. |
  | File encoding issues on Windows | CRLF line endings instead of LF | Validation explicitly checks for CRLF and raises error if found. Windows Python text mode writes LF automatically when no conversion flags set. |
  | UTF-8 BOM in file | Content parsing problems | Validation explicitly rejects UTF-8 BOM: checks `binary_content.startswith(b\"\\xef\\xbb\\xbf\")`. |
  | File I/O failures (disk full, permissions) | Incomplete file or exception | write_markdown_file() verifies file created and non-empty (stat().st_size > 0). validate_markdown_file() performs comprehensive binary/text validation. |
  | Sentence count incorrect | Validation failure, need to regenerate | Claude's low-temperature sampling (0.2) produces consistent, predictable output. Validation counts periods; matches Claude's natural format. If validation fails, complete fail-fast (clean repository, clear error). |

  ## Success Criteria Mapping

  The implementation design ensures all specification success criteria are met:

  - **File location & naming:** `create_markdown_file(\"test-l2bcbe.md\")` writes to repo root
  - **H1 heading:** Claude prompt specifies \"H1 heading (using #)\"; validation confirms \"starts with '# '\"
  - **Prose content:** Claude generates 2-3 sentences; validation counts periods
  - **UTF-8 encoding:** `write_markdown_file()` uses `encoding=\"utf-8\"` and validation confirms via binary decode
  - **LF line endings:** Validation explicitly checks for absence of CRLF (\\r\\n)
  - **Git tracking:** GitCommitTool stages file and commits; GitPushTool establishes upstream tracking
  - **Commit message:** Hardcoded in feature file: `feat(178): create markdown file test-l2bcbe.md with prose content`
  - **Git push:** GitPushTool with set_upstream=True ensures upstream tracking
  - **Validation passes:** Comprehensive validation pipeline checks all requirements
  - **Logging at INFO level:** Feature file uses `_logger.info()` for major operations
  - **Existing utilities:** `create_markdown_file()` from `sheep.content_generators` is reused
  - **Pattern consistency:** Feature file follows established pattern from features 101-177

  ## Notes

  - **No new dependencies:** Entire stack (CrewAI, Claude API, Git tools, pathlib) already integrated
  - **No infrastructure changes:** No modifications to existing modules, no new utilities needed
  - **Cross-platform compatibility:** pathlib.Path for file operations, LF validation for consistency
  - **Proven pattern:** Implementation reuses 10+ validated architectural decisions from features 101-177

