content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-23

  ## Technology Decisions

  ### 1. Content Generation and Orchestration Strategy

  **Chosen:** Reuse existing `create_markdown_file()` orchestration function from `sheep.content_generators` module.

  **Rejected:**
  - Implement feature-specific workflow from scratch — duplicates validated logic across 78 features, introduces risk of inconsistency, requires re-validation
  - Create new utility functions — breaks established pattern, adds complexity, duplicates logic

  **Rationale:** The codebase has established a proven pattern across features 101-177 (78 successful implementations) that successfully creates markdown files meeting all specification requirements. The `create_markdown_file(filename, repo_path)` function in `content_generators.py` orchestrates the complete workflow:

  1. Generate markdown content (H1 heading + 2-3 sentences) via Claude API with reasoning model
  2. Write file to repository root with UTF-8 encoding and proper line endings
  3. Validate file comprehensively (encoding, line endings, H1 structure, sentence count, trailing newline)
  4. Stage and commit with conventional commit message
  5. Push to remote with upstream branch tracking

  This function has been validated through 70+ successful feature implementations. Reusing it:
  - Eliminates code duplication (DRY principle)
  - Maintains consistency with established patterns
  - Reduces implementation risk (proven code path)
  - Accelerates implementation (no reinvention)
  - Ensures all validation logic is identical across features

  The feature file becomes minimal: import the function, define metadata (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE), call orchestrator, return result. This matches feature_170 and earlier patterns.

  ### 2. LLM Provider and Model Selection

  **Chosen:** Claude API via `get_reasoning_llm()` with temperature 0.2 (reasoning model for consistency).

  **Rejected:**
  - Use `get_fast_llm()` instead — fast model is for cheap/fast operations; reasoning model better suited for precise output
  - Other LLM providers — not integrated at this scale, adds infrastructure complexity

  **Rationale:** The `get_reasoning_llm()` function (from `sheep.config.llm.py`) returns a Claude LLM configured with temperature 0.2, which provides low randomness for consistent, reliable output. The markdown generation task requires exact format:
  - Exactly one H1 heading using `#` syntax
  - Blank line separator
  - Exactly 2-3 sentences of coherent prose

  Claude's low-temperature sampling (0.2) produces consistent, well-formatted output matching these requirements. The CrewAI LLM abstraction layer (using `llm.call([{"role": "user", "content": ...}])`) is already integrated throughout the codebase. This approach has been validated across 70+ features with high success rates.

  ### 3. Content Validation Strategy

  **Chosen:** Comprehensive multi-stage validation: check both at generation time AND after file write (belt-and-suspenders approach).

  **Rejected:**
  - Validate only after generation — misses file I/O errors that could corrupt content written to disk
  - Validate only after file write — doesn't catch generation failures early, harder to debug failures
  - Skip validation entirely — violates specification functional requirements (FR-3 through FR-6)

  **Rationale:** The `content_generators.py` module implements three-stage validation:

  1. **Generation-time validation** (`_validate_markdown_content()` during `generate_markdown_content()`):
     - Checks content is non-empty
     - Verifies H1 heading present
     - Validates sentence count (exactly 2-3 periods)
     - Catches generation errors immediately (fail fast)

  2. **File write verification** (`write_markdown_file()`):
     - Verifies file was created on disk
     - Checks file is non-empty (stat().st_size > 0)
     - Detects file I/O failures immediately

  3. **Comprehensive post-write validation** (`validate_markdown_file(filepath)`):
     - Binary read check: UTF-8 encoding validity
     - Binary read check: No UTF-8 BOM present
     - Binary read check: No CRLF line endings (must be LF)
     - Text parsing: H1 heading on first line
     - Text parsing: Blank line as separator (second line)
     - Text parsing: Prose content present and properly formatted
     - Text parsing: Exactly 2-3 sentences (count periods)
     - Text parsing: Trailing newline present

  Each validation stage has specific error messages for debugging (e.g., "Content must start with H1 heading (#)", "File uses CRLF line endings (should use LF)"). This belt-and-suspenders approach:
  - Catches generation errors early (fail fast)
  - Detects file I/O problems
  - Guarantees final state matches specification exactly
  - Provides clear debugging information
  - Proven pattern in features 101-177

  ### 4. Error Handling Strategy

  **Chosen:** Fail fast: stop execution immediately on validation failure, report clear error message, keep repository clean.

  **Rejected:**
  - Implement retry mechanism — adds complexity, masks underlying issues, consumes resources (API calls), doesn't solve non-transient problems
  - Partial commit — corrupts repository state with incomplete/invalid files, violates specification success criteria
  - Silent failure — prevents debugging, obscures problems, violates specification

  **Rationale:** The specification document explicitly resolves this as "fail fast" in the Product Questions section:

  > "If markdown validation fails, should we retry or fail fast?"
  > Selection: "Fail fast"
  > Rationale: "Fail fast is recommended because it ensures the repository stays clean, provides immediate feedback for debugging, prevents partial state changes..."

  The `content_generators.py` functions use this strategy throughout:
  - `validate_markdown_content()` raises ValueError immediately on any issue
  - `write_markdown_file()` raises IOError if creation fails
  - `validate_markdown_file()` raises ValueError on any validation failure
  - The orchestration function `create_markdown_file()` catches exceptions and re-raises with context

  This approach:
  - Ensures repository state remains clean (no partial commits)
  - Provides immediate, clear error feedback for debugging
  - Prevents cascading failures from propagating
  - Aligns with fail-safe patterns
  - Proven in features 101-177

  ### 5. Sentence Validation Method

  **Chosen:** Count periods using `string.count(".")` — simple, reliable, matches Claude's output format.

  **Rejected:**
  - NLP sentence tokenization (nltk, spacy) — adds heavy external dependencies, fragile with abbreviations/numbers/URLs, overkill for requirement
  - Regex-based parsing — brittle, difficult to maintain, doesn't handle edge cases reliably
  - Custom parser — duplicates mature solutions, introduces bugs

  **Rationale:** The specification requires "exactly 2-3 sentences" with sentence boundaries determined by terminal punctuation (period, exclamation mark, question mark). However, the generation prompt specifies "Exactly 2-3 sentences" with an example showing periods, so Claude naturally generates output with periods as sentence terminators.

  The validation code in `content_generators.py` uses:
  ```python
  sentence_count = prose_content.count(".")
  if sentence_count < 2 or sentence_count > 3:
      raise ValueError(f"Content must have 2-3 sentences, found {sentence_count}")
  ```

  This simple approach:
  - Matches the format Claude naturally produces (periods)
  - Is fast and reliable
  - Requires no external dependencies
  - Has been validated across 70+ features
  - Avoids complexity of NLP libraries

  ### 6. File Encoding Strategy

  **Chosen:** UTF-8 without BOM (Byte Order Mark); use Python's default `encoding="utf-8"` parameter in `open()`.

  **Rejected:**
  - ASCII encoding — cannot represent all possible content, too restrictive
  - UTF-16 or other multi-byte encodings — unnecessary complexity, breaks cross-platform consistency
  - UTF-8 with BOM — explicitly rejected by specification validation (raises error if BOM detected)

  **Rationale:** The specification requires:
  - Success Criteria: "File has UTF-8 encoding"
  - Functional Requirement FR-3: "Validate generated content has UTF-8 encoding after file write"
  - Non-Functional Requirement NFR-7: "Implement feature in standard Python (3.8+)"

  UTF-8 is the universal standard for text encoding:
  - Supports all Unicode characters (content flexibility)
  - Backwards compatible with ASCII
  - Cross-platform consistent (same bytes on Windows, macOS, Linux)
  - Python's default text mode encoding
  - Internet standard (RFC 3629)

  The `write_markdown_file()` function uses:
  ```python
  with open(file_path, "w", encoding="utf-8") as f:
      f.write(content)
  ```

  The `validate_markdown_file()` function validates encoding:
  ```python
  if binary_content.startswith(b"\xef\xbb\xbf"):
      raise ValueError("File has UTF-8 BOM (should not be present)")

  try:
      binary_content.decode("utf-8")
  except UnicodeDecodeError as e:
      raise ValueError(f"File is not valid UTF-8: {e}")
  ```

  This approach is proven in features 101-177.

  ### 7. Line Ending Normalization

  **Chosen:** Unix LF line endings (\\n only); validate that binary content contains no CRLF (\\r\\n).

  **Rejected:**
  - OS-specific line endings (CRLF \\r\\n on Windows, LF \\n on Unix) — breaks platform consistency, git expects LF
  - Mixed line endings — invalid, breaks parsers and git
  - Allow both LF and CRLF — violates specification requirement for consistent LF

  **Rationale:** The specification explicitly requires:
  - Success Criteria: "File uses LF line endings (Unix-style, not CRLF)"
  - Functional Requirement FR-4: "Validate file uses LF line endings (Unix-style) and not CRLF (Windows-style)"

  Unix LF (\\n) is the standard for modern development:
  - Git expects LF (core.autocrlf issues on Windows)
  - Consistent across all platforms (Windows, macOS, Linux)
  - Standard for version control
  - Used in CI/CD systems

  The implementation strategy: Python's text mode file writing uses OS defaults (\\r\\n on Windows), but the validation ensures LF-only through binary validation:

  ```python
  with open(path, "rb") as f:
      binary_content = f.read()

  if b"\r\n" in binary_content:
      raise ValueError("File uses CRLF line endings (should use LF)")
  ```

  On Unix systems, Python's text mode writes LF automatically. On Windows, the binary validation ensures no CRLF is present. This guarantees consistent LF-only output. The approach is proven in features 101-177.

  ### 8. Git Workflow Implementation

  **Chosen:** Use existing `GitCommitTool` and `GitPushTool` via wrapper functions `commit_markdown_file()` and `push_markdown_file()` from `content_generators.py`.

  **Rejected:**
  - Invoke git commands directly via subprocess — duplicates logic, less robust error handling, no integration with existing tools
  - Reimplement git staging/commit logic — high risk of bugs, maintenance burden, conflicts with existing patterns

  **Rationale:** The `content_generators.py` module provides tested wrapper functions:

  `commit_markdown_file(filepath, content, repo_path, custom_message)`:
  ```python
  tool = GitCommitTool()
  result = tool._run(repo_path=repo_path, message=commit_message, add_all=True)
  ```
  - Stages all changes (add_all=True)
  - Commits with custom conventional commit message
  - Returns result with context

  `push_markdown_file(repo_path, remote)`:
  ```python
  tool = GitPushTool()
  result = tool._run(repo_path=repo_path, remote=remote, set_upstream=True)
  ```
  - Pushes to specified remote (default: origin)
  - Sets upstream branch tracking (set_upstream=True)
  - Establishes feature branch tracking

  These functions:
  - Eliminate code duplication
  - Leverage tested, reliable git tools
  - Ensure consistent behavior across features
  - Provide proper error handling
  - Integrate with logging system
  - Proven in features 101-177

  ### 9. Commit Message Format

  **Chosen:** Conventional commit format with feature number: `feat(178): create markdown file test-l2bcbe.md with prose content`

  **Rejected:**
  - Generic messages ("Create file", "Add content") — less informative, hard to parse/search
  - Long descriptive messages — violates conventional commits convention
  - Omit feature number — breaks traceability to feature requirements

  **Rationale:** The specification explicitly requires:
  - Success Criteria: "File is committed with message 'feat(178): create markdown file test-l2bcbe.md with prose content'"

  This follows the Conventional Commits specification (https://www.conventionalcommits.org/):
  - Type: `feat` (feature addition)
  - Scope: `178` (feature number for traceability)
  - Subject: concise description of action
  - Format enables automated changelog generation, commit filtering, version bumping

  The implementation uses the `custom_message` parameter:
  ```python
  commit_result = commit_markdown_file(
      filepath, content, repo_path,
      custom_message="feat(178): create markdown file test-l2bcbe.md with prose content"
  )
  ```

  This ensures exact message format matching specification. All features 101-177 follow this pattern.

  ### 10. Content Topic Selection

  **Chosen:** Let Claude choose topic freely; no topic constraint in generation prompt.

  **Rejected:**
  - Specify fixed topic (e.g., "technology", "science", "nature") — adds unnecessary constraint not in specification
  - Implement random topic selector — increases complexity, requires topic list maintenance

  **Rationale:** The specification explicitly states:
  - Summary: "about any topic"
  - Functional Requirement: "Generate markdown content using Claude API...about any topic"
  - Product Question: "Should we specify a topic...or let Claude choose freely?"
  - Selected Answer: "Let Claude choose freely"
  - Selection Rationale: "Specification says 'about any topic', simpler prompt, more flexible"

  The markdown generation prompt specifies: "An H1 heading...with a title about any topic you choose", giving Claude complete autonomy in topic selection. This:
  - Matches specification exactly
  - Simplifies prompt (no topic constraint logic)
  - Increases variability (different topics across features)
  - Reduces prompt engineering
  - Proven in features 101-177

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | `sheep.content_generators` | Markdown generation, file I/O, validation orchestration | **Use** | Complete, tested, proven across 70+ features; provides `create_markdown_file()` orchestration function |
  | `sheep.config.llm` | LLM configuration and factory | **Use** | Provides `get_reasoning_llm()` for Claude API with proper temperature/model selection |
  | `sheep.tools` | Git operations (GitCommitTool, GitPushTool) | **Use** | Tested, reliable git integration with proper error handling |
  | `sheep.observability.logging` | Structured logging | **Use** | Provides `get_logger()` for consistent logging across codebase |
  | `pathlib.Path` | Cross-platform file operations | **Use** | Python standard library, cross-platform path handling, more robust than string paths |
  | `CrewAI` (crewai.LLM) | LLM abstraction layer | **Use** | Already integrated, provides consistent interface across LLM providers |
  | `re` (regex) | String pattern matching | **Not needed** | Simple string operations sufficient; period counting doesn't need regex |
  | `nltk` / `spacy` | NLP sentence tokenization | **Reject** | Overkill for requirement; adds heavy dependencies; period counting sufficient |

  ## Security Considerations

  ### 1. Path Traversal Prevention
  - **Risk:** Filename parameter could contain path separators ("../../etc/passwd")
  - **Mitigation:** `write_markdown_file()` validates filename: `if "/" in filename or "\\" in filename or filename.startswith("."): raise ValueError(f"Invalid filename: {filename}")`
  - **Impact:** Only safe filenames allowed; all writes confined to repository root

  ### 2. UTF-8 Encoding Validation
  - **Risk:** Invalid UTF-8 could contain malformed bytes
  - **Mitigation:** `validate_markdown_file()` decodes content and validates: `binary_content.decode("utf-8")` raises UnicodeDecodeError on invalid bytes
  - **Impact:** Only valid UTF-8 content accepted

  ### 3. Git Command Injection Prevention
  - **Risk:** Custom commit message could contain git metacharacters
  - **Mitigation:** Commit message hardcoded in specification: `feat(178): create markdown file test-l2bcbe.md with prose content`; no user input in message
  - **Impact:** No injection vector

  ### 4. BOM/Encoding Attack Prevention
  - **Risk:** UTF-8 BOM could hide or misdirect content parsing
  - **Mitigation:** Explicit validation rejects BOM: `if binary_content.startswith(b"\xef\xbb\xbf"): raise ValueError("File has UTF-8 BOM")`
  - **Impact:** BOM forbidden; ensures consistent parsing

  ### 5. Denial of Service Prevention
  - **Risk:** Generated content could be extremely large, consuming resources
  - **Mitigation:** Claude API enforces token limits; validation checks minimum length (`len(content) < 50`)
  - **Impact:** Bounded resource consumption

  ## Performance Considerations

  ### 1. Content Generation Latency
  - **API Call:** Claude API call via CrewAI (`llm.call()`)
  - **Expected latency:** 1-5 seconds (typical Claude response time)
  - **Optimization:** Use reasoning model (already selected) for consistency over speed; temperature 0.2 avoids excessive retries
  - **Monitoring:** Logging captures timings via `_logger.info()`

  ### 2. File I/O Operations
  - **Write:** Single text mode write (UTF-8) to repository root
  - **Expected:** <100ms for typical file size (300-600 bytes)
  - **Validation:** Binary reads add <50ms overhead
  - **Optimization:** All I/O sequential, no redundant reads

  ### 3. Git Operations
  - **Commit:** `git add` + `git commit` via GitCommitTool
  - **Push:** `git push --set-upstream origin <branch>` via GitPushTool
  - **Expected:** 1-5 seconds (depends on network, repository size)
  - **Optimization:** Single add operation (add_all=True), single push operation

  ### 4. Validation Operations
  - **Generation validation:** String checks (startswith, count) - O(n) in content length
  - **File properties validation:** Binary read entire file - O(n) in file size
  - **Markdown validation:** Line parsing - O(n) in line count
  - **Total overhead:** <100ms for typical 300-600 byte file
  - **Optimization:** No redundant reads; validation is sequential

  ### 5. Overall Execution Time
  - **Total expected:** 3-15 seconds
    - Content generation: 1-5s (API call)
    - File I/O + validation: <200ms
    - Git operations: 1-5s (network dependent)
    - Logging/overhead: <100ms
  - **Optimization:** Sequential pipeline; no parallelization possible (each step depends on previous)

  ## Architecture Notes

  ### Integration with Existing Codebase

  Feature 178 integrates cleanly with the established markdown file creation pattern:

  1. **Reuses Content Generation Pipeline:** `sheep.content_generators` module handles all markdown logic
  2. **Leverages LLM Configuration:** `sheep.config.llm.get_reasoning_llm()` provides Claude API access
  3. **Integrates Git Tools:** Uses `sheep.tools.GitCommitTool` and `GitPushTool` for version control
  4. **Uses Logging System:** Integrates with `sheep.observability.logging` for structured logging
  5. **Follows Established Pattern:** Matches feature_170 and preceding implementations (101-169)

  ### Feature File Structure

  The implementation follows the established pattern:

  ```python
  """Module docstring describing purpose."""

  from pathlib import Path
  from sheep.content_generators import create_markdown_file
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  FEATURE_NUMBER = 178
  MARKDOWN_FILENAME = "test-l2bcbe.md"
  COMMIT_MESSAGE = "feat(178): create markdown file test-l2bcbe.md with prose content"

  def create_feature_178_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """Create markdown file for feature 178."""
      ...
      result = create_markdown_file(MARKDOWN_FILENAME, repo_path)
      ...

  if __name__ == "__main__":
      result = create_feature_178_markdown_file()
      ...
  ```

  ### Validation Pipeline

  The implementation executes this validation pipeline:

  1. **Content Generation** → `_validate_markdown_content()` (fails fast on format error)
  2. **File Write** → Verify file created and non-empty
  3. **Comprehensive Validation** → `validate_markdown_file()` checks all requirements
  4. **Git Operations** → Commit and push (no rollback; repository already clean)

  ### Error Handling Flow

  ```
  generate_markdown_content()
      ├─ _validate_markdown_content() → ValueError if invalid
      └─ return content

  write_markdown_file(content, filename)
      ├─ Validate safe filename
      ├─ Write to disk with UTF-8
      ├─ Verify file exists and non-empty
      └─ IOError if write fails

  validate_markdown_file(filepath)
      ├─ Binary validation (UTF-8, no BOM, LF only)
      ├─ Text validation (H1, blank line, sentences)
      └─ ValueError if any check fails

  commit_markdown_file(filepath, content, repo_path, custom_message)
      └─ GitCommitTool._run() → Exception if git fails

  push_markdown_file(repo_path, remote)
      └─ GitPushTool._run() → Exception if git fails
  ```

  All exceptions bubble up; calling code implements fail-fast strategy.

  ## Dependency Management

  ### Required Dependencies
  - **Python 3.8+** - Standard library (pathlib, logging, re)
  - **CrewAI** - LLM orchestration framework (already in project)
  - **Anthropic SDK** - Claude API client (via CrewAI, already in project)
  - **Git** - Command-line tool (already installed/available)

  ### No Additional Dependencies Required
  The entire technology stack is already integrated in the codebase. No new external libraries need to be added. All utility functions are available in existing modules:
  - `sheep.content_generators` - All markdown operations
  - `sheep.config.llm` - LLM configuration
  - `sheep.tools` - Git operations
  - `sheep.observability.logging` - Logging

  ### Why Avoid Additional Dependencies
  - Adds maintenance burden
  - Increases deployment complexity
  - Introduces security surface (dependency vulnerabilities)
  - Overkill for straightforward requirements
  - Proven solutions already exist in codebase

