content: |
  ## Problem Statement

  Create a single markdown file called test-l2bcbe.md that contains a valid markdown document with an H1 heading as a title and 2-3 sentences of prose content about any topic. The file should follow established conventions for encoding (UTF-8), line endings (LF), and git workflow (commit and push). The implementation must reuse existing infrastructure and follow the established pattern from features 101-177.

  ## Success Criteria

  - [x] File test-l2bcbe.md is created at repository root
  - [x] File contains exactly one H1 markdown heading using `#` format
  - [x] File contains exactly 2-3 sentences of coherent prose
  - [x] File has UTF-8 encoding
  - [x] File uses LF line endings (Unix-style, not CRLF)
  - [x] File is tracked by git
  - [x] File is committed with message "feat(178): create markdown file test-l2bcbe.md with title and prose content"
  - [x] File is pushed to remote with upstream tracking
  - [x] All markdown structure validation passes
  - [x] All encoding validation passes
  - [x] Implementation uses existing `create_markdown_file()` function from content_generators.py
  - [x] Feature file follows pattern from features 101-177
  - [x] Feature file includes module docstring with description and purpose
  - [x] No errors or exceptions during execution
  - [x] All log entries are at INFO level or higher (no DEBUG/TRACE pollution)

  ## Functional Requirements

  - **FR-1**: Generate markdown content using Claude API that contains an H1 heading and 2-3 sentences of coherent prose about any topic using the CrewAI framework
  - **FR-2**: Write the generated markdown content to a file named `test-l2bcbe.md` at the repository root directory
  - **FR-3**: Validate generated content has UTF-8 encoding after file write
  - **FR-4**: Validate file uses LF line endings (Unix-style) and not CRLF (Windows-style)
  - **FR-5**: Validate markdown structure contains exactly one H1 heading in the first non-empty line
  - **FR-6**: Validate prose content contains exactly 2-3 sentences (sentence boundaries determined by `.!?` punctuation)
  - **FR-7**: Stage the markdown file with `git add` for commit
  - **FR-8**: Commit the file with conventional commit message in format `feat(178): create markdown file test-l2bcbe.md with title and prose content`
  - **FR-9**: Push committed file to remote repository with upstream tracking using `git push --set-upstream origin <branch>`

  ## Non-Functional Requirements

  - **NFR-1**: Reuse existing utility functions from `sheep.content_generators` module (`create_markdown_file()` or component functions) to eliminate code duplication and leverage validated patterns
  - **NFR-2**: Follow Python code conventions, style, and patterns established in existing feature files (features_101 through feature_177) for consistency and maintainability
  - **NFR-3**: Log all major operations (content generation, file validation, file write, git commit, git push) at INFO level with sufficient context for debugging failures
  - **NFR-4**: Use `pathlib.Path` for all file path operations to ensure cross-platform compatibility (Windows, macOS, Linux)
  - **NFR-5**: Handle validation errors with clear, descriptive error messages indicating which validation step failed and why
  - **NFR-6**: Complete feature implementation and testing within 4 hours
  - **NFR-7**: Implement feature in standard Python (3.8+) with no additional external dependencies beyond those already in the project
  - **NFR-8**: Include module-level docstring in feature file describing purpose, expected outcomes, and integration point

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should H1 use `#` or `<h1>` format? | Use `#` markdown format | Native markdown syntax, simpler, more readable, follows conventions |
  | 2 | If validation fails, retry or fail fast? | Fail fast | Clearer error reporting, keeps repository clean, prevents partial state |
  | 3 | Enforce exactly 2-3 sentences or allow flexibility? | Exactly 2-3 sentences | Matches specification requirement precisely, ensures predictable output |
  | 4 | Specify prose topic or let Claude choose? | Let Claude choose freely | Specification says "about any topic", simpler prompt, more flexible |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | File System | High | Creates new markdown file test-l2bcbe.md in repository root |
  | Git Repository | High | Stages, commits, and pushes file with conventional message feat(178): ... |
  | LLM Integration | Low | Reuses existing Claude API integration through `get_reasoning_llm()` |
  | Content Generation | Low | Reuses prompt template and validation logic in content_generators.py |
  | Feature Implementations | Medium | Requires creating new feature_178_markdown_file_creation.py following established pattern |

  ## Dependencies

  **Internal dependencies** (already available):
  - `sheep.content_generators.create_markdown_file()` - Main orchestration function (recommended approach)
  - `sheep.config.llm.get_reasoning_llm()` - Claude API access
  - `sheep.tools.GitCommitTool` and `GitPushTool` - Git operations
  - `sheep.observability.logging.get_logger()` - Structured logging
  - Features 101-177 source files - Pattern templates for implementation

  **External dependencies** (already in project):
  - CrewAI for LLM orchestration
  - Anthropic Claude API credentials (via .env)
  - Git binary (for underlying git operations)
  - Python 3.8+ standard library (pathlib, re, logging)

  **No additional dependencies required** - entire implementation stack is already available in the codebase.

  ## Size Estimate

  **S** (2-4 hours) — Feature #178 follows an established pattern repeated 77+ times in codebase. All infrastructure exists:
  - Markdown generation prompt and LLM integration: pre-built
  - File validation logic (UTF-8, LF endings, H1 structure, sentence count): pre-built
  - Git commit/push workflow: pre-built
  - Feature file template: available in features/feature_101_markdown_file_creation.py through features/feature_177_*

  Implementation requires:
  1. Copy existing feature file pattern (feature_177 or earlier as template)
  2. Update constants: FEATURE_NUMBER = 178, MARKDOWN_FILENAME = "test-l2bcbe.md"
  3. Call existing `create_markdown_file()` function with filename
  4. Add docstring and module metadata
  5. Execute and validate

  **Estimated effort: 2-4 hours** including validation and git operations.
