content: |
  ## Problem Statement

  Create a single markdown file called test-l2bcbe.md that contains a valid markdown document with an H1 heading as a title and 2-3 sentences of prose content about any topic. The file should follow established conventions for encoding, line endings, and git workflow (commit and push).

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation. The repository contains:

  - `src/sheep/agents/` - Agent definitions for research, implementation, and review
  - `src/sheep/config/` - LLM configuration (settings.py, llm.py) for Claude API access
  - `src/sheep/content_generators.py` - **Central utility module** containing all markdown-related functions:
    - `generate_markdown_content()` - Uses Claude via CrewAI to generate H1 + prose
    - `write_markdown_file()` - Writes content to disk at repo root with UTF-8 encoding
    - `validate_markdown_file()` - Validates structure, encoding, and line endings
    - `commit_markdown_file()` - Stages and commits with conventional message
    - `push_markdown_file()` - Pushes to remote with upstream tracking
  - `src/sheep/features/feature_*_markdown_file_creation.py` - Feature implementations (101-177 already exist, feature 178 is next)
  - `src/sheep/tools/` - Git and file operation tools used by utilities
  - `src/sheep/observability/` - Logging infrastructure

  ### Architecture Patterns

  1. **Separation of Concerns**: Utility functions in `content_generators.py` handle all logic; feature files orchestrate them
  2. **Reuse Pattern**: All features (101-177) follow identical pattern - create a feature file that calls `create_markdown_file()` or individual utilities
  3. **Validation Chain**: Content validated at three stages - after generation, after writing, before commit
  4. **LLM Integration**: Claude API called via CrewAI's LLM interface with structured prompt for consistent output
  5. **Git Workflow**: Standard git add → commit → push with upstream tracking

  ### Relevant Technologies

  - **Python 3.x**: Source language with pathlib for cross-platform file handling
  - **CrewAI**: Framework for orchestrating LLM calls and agent workflows
  - **Claude API**: Generates markdown content via `llm.call()` interface
  - **Git**: Version control integration (commit/push via GitCommitTool and GitPushTool)
  - **Structured Logging**: Custom observability module for debugging and tracing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | File System | High | Creates new markdown file test-l2bcbe.md in repository root |
  | Git Repository | High | Stages, commits, and pushes file with conventional message feat(178): ... |
  | LLM Integration | Low | Reuses existing Claude API integration through `get_reasoning_llm()` |
  | Content Generation | Low | Reuses prompt template and validation logic in content_generators.py |
  | Feature Implementations | Medium | Requires creating new feature_178_markdown_file_creation.py following established pattern |

  ## Dependencies

  **Internal dependencies** (already available):
  - `sheep.content_generators.create_markdown_file()` - Main orchestration function
  - `sheep.config.llm.get_reasoning_llm()` - Claude API access
  - `sheep.tools.GitCommitTool` and `GitPushTool` - Git operations
  - `sheep.observability.logging.get_logger()` - Structured logging

  **External dependencies** (already in project):
  - CrewAI for LLM orchestration
  - Anthropic Claude API credentials (via .env)
  - Git binary (for underlying git operations)

  **No additional dependencies required** - entire implementation stack is already available in the codebase.

  ## Size Estimate

  **S** (few hours) — Feature #178 follows an established pattern repeated 77+ times in codebase. All infrastructure exists:
  - Markdown generation prompt and LLM integration: pre-built
  - File validation logic (UTF-8, LF endings, H1 structure, sentence count): pre-built
  - Git commit/push workflow: pre-built
  - Feature file template: available in features/feature_101_markdown_file_creation.py through features/feature_177_*

  Implementation requires:
  1. Copy existing feature file pattern (feature_177 or earlier as template)
  2. Update constants: FEATURE_NUMBER = 178, MARKDOWN_FILENAME = "test-l2bcbe.md"
  3. Call existing `create_markdown_file()` function with filename
  4. Add docstring and module metadata

  **Estimated effort: 2-4 hours** including validation and git operations.
