content: |
  ## Problem Statement

  The project needs a new markdown file called `test-3ffwg8.md` created at the repository root, containing minimal content (a title and 2-3 sentences about the selected topic). This follows the established pattern in the codebase where multiple markdown files are stored at the root level with short, focused content. The file must conform to existing project conventions for markdown files and pass the associated test suite.

  ## Success Criteria

  - [ ] Markdown file `test-3ffwg8.md` created at repository root
  - [ ] File contains exactly one H1 heading as the title
  - [ ] File contains 2-3 sentences of descriptive content about the selected topic
  - [ ] File is fewer than 80 lines in total
  - [ ] File ends with a newline character
  - [ ] Associated pytest test file created in `tests/` directory
  - [ ] Test file validates file existence
  - [ ] Test file validates H1 heading presence
  - [ ] Test file validates topic keyword mention
  - [ ] Test file validates line count constraint
  - [ ] Test file validates newline ending
  - [ ] All tests pass locally
  - [ ] All project linting checks pass
  - [ ] Feature branch ready for merge with clean commit history

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-3ffwg8.md` at the repository root
  - **FR-2**: File must contain exactly one H1 (markdown level 1) heading that serves as the title
  - **FR-3**: File must contain exactly 2-3 sentences of descriptive content about the selected topic
  - **FR-4**: Create an associated pytest test file in the `tests/` directory following naming pattern `tests/test_3ffwg8.py`
  - **FR-5**: Test file must contain a test function that verifies the markdown file exists at the expected path
  - **FR-6**: Test file must contain a test function that verifies the markdown file contains an H1 heading
  - **FR-7**: Test file must contain a test function that verifies the markdown file contains the topic keyword
  - **FR-8**: Test file must contain a test function that verifies the markdown file is under 80 lines
  - **FR-9**: Test file must contain a test function that verifies the markdown file ends with a newline character
  - **FR-10**: All test functions must use pytest assertions and pass without warnings or errors

  ## Non-Functional Requirements

  - **NFR-1**: Markdown file must conform to existing project conventions (H1 title + brief content format)
  - **NFR-2**: Test file must follow the established testing pattern used in similar features (e.g., test-quk4of.py, cloud-computing test)
  - **NFR-3**: Test file must use pytest framework with proper test function naming (test_*) and fixtures as needed
  - **NFR-4**: Code must be maintainable, readable, and follow Python style guidelines (PEP 8)
  - **NFR-5**: File naming must follow project conventions (lowercase, kebab-case if multiple words, .md extension)
  - **NFR-6**: All project tests must pass without warnings or errors after this feature is merged
  - **NFR-7**: The implementation must not introduce any linting violations when checked with project linters

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the markdown file cover? | Generic markdown documentation (e.g., "Getting Started with Markdown") | Neutral, appropriate for testing, easy to write, aligns with test-file pattern where content is illustrative rather than substantive |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation built with CrewAI. The repository structure includes:

  - **Root directory**: Contains multiple markdown files (weather-forecasting-vhiwx5.md, cloud-computing-xwbxsh.md, test-quk4of.md, etc.)
  - **src/sheep/**: Main Python package with agents, flows, tools, and configuration
    - **agents/**: Code researcher, implementer, and reviewer agents
    - **flows/**: CrewAI flow definitions for orchestrating agent tasks
    - **tools/**: Agent tools including FileWriteTool, FileReadTool, GitTools, etc.
    - **config/**: LLM configuration and settings management
  - **specs/**: Feature specifications and tracking
  - **tests/**: Pytest test files, one per major content file

  ### Architecture Patterns

  1. **Markdown File Convention**: All content files are markdown (.md) with H1 title and brief content
  2. **Testing Pattern**: Each markdown file has an associated test file in `tests/` that validates:
     - File exists at the expected path
     - Contains an H1 heading
     - Mentions the topic (keyword search)
     - Is under 80 lines
     - Ends with a newline character
  3. **Agent-Based Implementation**: Code changes are implemented by CrewAI agents using provided tools (FileWriteTool, etc.)
  4. **Git Workflow**: Features are created in branches and pushed after implementation

  ### Relevant Technologies

  - **Python 3.11+**: Language used for the project and test framework
  - **pytest**: Testing framework used for all tests
  - **CrewAI**: Agent orchestration framework
  - **Pydantic**: Data validation in agents and tools
  - **Git**: Version control with branch support

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory / `test-3ffwg8.md` | High | New markdown file must be created at repository root following established naming and content conventions |
  | `tests/test_3ffwg8.py` | High | New test file required to validate the markdown file against project conventions (file exists, H1 heading, keyword mention, line count, newline ending) |
  | Feature branch | Medium | Implementation will be done on branch `feat/028-test-markdown-file-2b154b` with conventional commit |

  ## Dependencies

  **No external dependencies**. This feature only requires:
  - Standard file I/O (Python built-in)
  - pytest (already in dev dependencies)
  - Git operations (already configured in workflow)

  The implementation follows the existing FileWriteTool pattern used by code implementer agents in the codebase.

  ## Size Estimate

  **S** — This is a trivial feature requiring:
  - Creating a 3-4 line markdown file with title and 2-3 sentences
  - Creating a pytest test file (~30 lines) following the established pattern
  - Total implementation time: under 1 hour
  - No code refactoring, architectural changes, or complex logic needed
  - No dependencies to resolve or integration points

  The complexity is minimal as this directly follows proven patterns already established in the codebase for 25+ existing markdown files (test-quk4of.md, weather-forecasting-vhiwx5.md, cloud-computing-xwbxsh.md, etc.).
