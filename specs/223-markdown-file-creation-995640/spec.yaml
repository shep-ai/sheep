content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-do4dr9.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 220+ similar test files already existing in the repository as precedents. This feature demonstrates
  core capabilities: file creation, git staging, conventional commits, and push-to-remote
  operations—all essential building blocks in the Sheep automation platform.

  ## Success Criteria

  - [ ] File `test-do4dr9.md` created in repository root directory
  - [ ] File contains valid markdown with H1 heading (`#`) as title
  - [ ] File contains 2-3 sentences of prose content
  - [ ] File encoded in UTF-8 format
  - [ ] File uses LF (Unix) line endings
  - [ ] Git commit created with message following conventional commits format: `feat(223): Create markdown file test-do4dr9.md`
  - [ ] Commit created on feature branch `feat/223-markdown-file-creation-995640`
  - [ ] Commit successfully pushed to remote origin
  - [ ] No git errors or warnings during workflow execution
  - [ ] Implementation follows established pattern from features 160-222

  ## Functional Requirements

  - **FR-1: File Creation**: Create a markdown file named `test-do4dr9.md` in the repository root directory with the exact filename specified by the user.
  - **FR-2: Markdown Structure**: File must contain a valid markdown H1 heading (`# Title`) serving as the document title.
  - **FR-3: Content**: File must contain 2-3 sentences of prose text content following the H1 heading.
  - **FR-4: Encoding**: File must be saved with UTF-8 character encoding.
  - **FR-5: Line Endings**: File must use LF (Unix-style) line endings for consistency with repository standards.
  - **FR-6: Git Staging**: File must be staged for commit using `git add test-do4dr9.md`.
  - **FR-7: Commit Creation**: Create a git commit with message following conventional commits format: `feat(223): Create markdown file test-do4dr9.md`.
  - **FR-8: Commit Placement**: Commit must be created on the feature branch `feat/223-markdown-file-creation-995640`.
  - **FR-9: Remote Push**: Commit must be pushed to the remote repository on the feature branch with `git push`.
  - **FR-10: Content Flexibility**: Allow implementation to select any topic or content type for the prose, matching the requirement "anything".

  ## Non-Functional Requirements

  - **NFR-1: Performance**: File creation and git workflow must complete within 30 seconds total execution time.
  - **NFR-2: Reliability**: Implementation must produce consistent, reproducible results matching the established pattern from 60+ preceding features (160-222).
  - **NFR-3: Code Quality**: Implementation must use only Python standard library modules (`pathlib` for file I/O, `subprocess` for git commands) with no external dependencies.
  - **NFR-4: Idempotency**: Implementation should be safe to re-run; multiple executions should not create corrupted or duplicate files (overwrite if necessary).
  - **NFR-5: Platform Compatibility**: Implementation must function correctly on Linux environments (primary target platform) using standard UTF-8 and LF conventions.
  - **NFR-6: Git Standards Compliance**: Commit message must follow conventional commits format; author must be properly configured via git `user.name` and `user.email`.
  - **NFR-7: Error Handling**: Implementation must handle common errors gracefully (missing git config, insufficient permissions, existing file) with clear error messages.
  - **NFR-8: Simplicity**: Implementation should be minimal and direct, avoiding unnecessary abstraction or over-engineering for a straightforward file creation task.

  ## Product Decisions

  | # | Decision | Recommendation | Rationale |
  | - | --------- | -------------- | --------- |
  | 1 | Content flexibility | Flexible (any topic) | User requirement explicitly states "anything"; 220+ test files demonstrate successful content variability; maintains consistency with established pattern. |
  | 2 | Validation approach | Skip validation | Recent features (216-222) skip validation; reduces complexity; low risk for simple file creation task; can be added later if needed. |
  | 3 | Implementation pattern | Follow established pattern | 60+ identical features use proven approach; reference implementations exist; faster execution; maintains team conventions. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 220+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-500 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 160-222; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the Sheep platform |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or feature configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`, `subprocess`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic |
  | CI/CD Pipeline | None | Git push triggers existing CI, but no additional configuration or pipeline changes needed |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/223-markdown-file-creation-995640` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Unix-based environment (Linux, macOS) for consistent LF line endings

  **Reference/Precedent:**
  - 220+ existing test markdown files (test-*.md, *.md) provide clear pattern to follow
  - Previous feature implementations (features 160-222) demonstrate successful execution of identical pattern
  - Implementation scripts in repository root (create_markdown_file.py, create_markdown_file_222.py) show working patterns
  - Feature 222 spec and implementation provide exact template

  **Not Required:**
  - No source code dependencies (src/sheep/ remains untouched)
  - No external package dependencies
  - No modifications to configuration files (.env, pyproject.toml, etc.)
  - No integration with CrewAI or other Sheep platform components
  - No testing framework integration (feature has no tests)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with 60+ identical successful precedents (features 160-222):

  - **File creation**: ~3 minutes (compose markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~0 minutes (skipped per product decision, many recent features skip validation)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification:**
  - Extremely well-established pattern with 60+ identical features (160-222) providing proven precedent
  - Flexible content selection with no research or architectural decisions required (user stated "anything")
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or complex configuration changes required
  - Recent feature implementations (216-222) demonstrate efficient execution within estimated timeframe
  - No git merge conflicts or branch management complexity
  - Feature branch already created and checked out
  - Standard library only (no dependency resolution or build process)
  - Validation skipped per product decision (reduces time)
