content: |
  ## Architecture Overview

  Feature 223 implements a minimal, self-contained Python script following the established pattern from
  60+ preceding features (160-222). The implementation is organized as:

  ```
  create_markdown_file_223.py
  ├─ Module-level constants (FILENAME, TITLE, PROSE, COMMIT_MESSAGE)
  ├─ Helper functions
  │  ├─ create_file() — pathlib.Path.write_text() with UTF-8/LF encoding
  │  ├─ git_add() — subprocess.run(['git', 'add', ...], check=True)
  │  ├─ git_commit() — subprocess.run(['git', 'commit', ...], check=True)
  │  └─ git_push() — subprocess.run(['git', 'push', ...], check=True)
  └─ main() — orchestrator that calls helpers in sequence
  ```

  **Why This Architecture:**
  - **Modularity:** Each git operation is a separate function, making code clear and testable
  - **Consistency:** Matches the pattern used in features 221-222, ensuring team conventions
  - **Safety:** subprocess with list arguments prevents shell injection attacks
  - **Simplicity:** No external dependencies, only Python stdlib (pathlib, subprocess)
  - **Clarity:** Constants at module level make content easy to modify for future features

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen:** `Path(FILENAME).write_text(content, encoding='utf-8', newline='\n')`

  **Why This Approach:**
  - Modern, idiomatic Python standard for file operations (Python 3.4+)
  - Explicit encoding and newline parameters ensure UTF-8 and LF requirements
  - Single method call (simpler than open() context managers)
  - Cross-platform path handling
  - All 60+ preceding features (160-222) use this pattern

  **Alternatives Rejected:**
  - Built-in `open()` — verbose, requires context manager, less Pythonic
  - `os.path` — outdated API, less convenient
  - External libraries — unnecessary, violates stdlib-only constraint

  ### 2. Git Integration: subprocess.run() with List Arguments

  **Chosen:** `subprocess.run(['git', 'add', FILENAME], check=True)`

  **Why This Approach:**
  - Safe against shell injection (list-based arguments, not string-based)
  - `check=True` raises CalledProcessError on git failure (proper error handling)
  - No external dependencies (GitPython not needed for simple operations)
  - Established pattern in all 60+ preceding features
  - Minimal overhead, clean API

  **Alternatives Rejected:**
  - GitPython — external dependency, violates stdlib constraint, overkill for simple operations
  - `os.system()` — unsafe (vulnerable to injection), deprecated
  - Manual git internals — extremely complex, unnecessary

  ### 3. Content Approach: Module-Level Constants

  **Chosen:** Define TITLE and PROSE as module-level constants, build content string in function

  **Why This Approach:**
  - Flexible — easily modified for different feature instances
  - Clear separation of data (constants) from logic (functions)
  - Supports FR-10 (content flexibility; allows any topic)
  - Matches pattern in features 221-222

  **Alternatives Rejected:**
  - Hardcoded inline strings — poor maintainability
  - Template system — unnecessary complexity
  - Random generation — requires external library, loses reproducibility

  ### 4. Error Handling: Specific Exceptions with Clear Messages

  **Chosen:** Separate handlers for FileExistsError, OSError, subprocess.CalledProcessError

  **Why This Approach:**
  - Each exception type has a distinct cause (file exists, I/O error, git failure)
  - Clear error messages help users understand what went wrong (NFR-7)
  - Matches pattern in features 221-222
  - More maintainable than generic `except Exception` catch-all

  **Alternatives Rejected:**
  - Generic exception catch-all — hides root causes, difficult to debug
  - No error handling — crashes silently, poor user experience
  - Silent failure — no feedback about what went wrong

  ### 5. Validation: Skip Per Product Decision

  **Chosen:** No pre-commit validation checks

  **Why This Approach:**
  - Product spec explicitly recommends skipping validation
  - Recent features (216-222) skip validation for simple file creation
  - Implementation design itself ensures correctness: pathlib.write_text with encoding/newline params
  - Markdown structure is too simple (H1 + 2-3 sentences) to justify validation overhead
  - Reduces execution time

  **Alternatives Rejected:**
  - Pre-commit validation — adds latency for minimal benefit
  - Comprehensive validation — overkill for straightforward task

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Foundation)** comes first because the script structure and constants are foundational
     — all other code depends on imports and constants being defined.

  2. **Phase 2 (File Creation)** comes before git operations because the file must exist before git can add it.

  3. **Phase 3 (Git Integration)** happens after file creation and is organized in sequence: add must happen
     before commit, commit before push (git operations have dependencies).

  4. **Phase 4 (Error Handling & Feedback)** wraps the core logic with error handling and output.
     Could happen earlier in development, but placed after core logic for clarity.

  5. **Phase 5 (Integration Testing)** comes last because it verifies the complete workflow.

  **Why This Ordering:**
  - Follows natural dependency flow: structure → file creation → git operations → error handling → testing
  - Matches TDD rhythm: write test/assertion → implement functionality → add error handling → verify
  - Similar to features 221-222 implementation order

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | **FileExistsError** | Feature fails if file already exists (idempotency issue) | Specific exception handler with clear message; aligns with features 221-222 pattern |
  | **Git configuration missing** | Commit fails if user.name/user.email not configured | Listed as Required dependency; Sheep platform responsible for ensuring git is configured |
  | **SSH/HTTPS credentials missing** | Push fails if git credentials not available | Listed as Required dependency; Sheep platform handles credential setup |
  | **File permissions issues** | write_text() fails due to permission denied | Specific OSError handler with clear message; repository root is writable by design |
  | **Network connectivity** | Push fails if remote is unreachable | subprocess.CalledProcessError handler provides clear message; transient failures can be retried |
  | **Invalid UTF-8 content** | File created with wrong encoding | Explicitly specified encoding='utf-8' in write_text(); this constraint prevents encoding issues |
  | **CRLF line endings on Windows** | File gets wrong line endings if pathlib defaults to system | Explicitly specified newline='\n' in write_text() to force LF regardless of platform |
  | **Command injection via filename** | Malicious filename could break git command | Filename is known constant (test-do4dr9.md), not user input; list-based subprocess args prevent injection |

  ## Success Metrics

  - ✓ File `test-do4dr9.md` exists in repository root with correct content
  - ✓ File contains valid markdown with H1 heading and 2-3 sentences
  - ✓ File has UTF-8 encoding and LF line endings
  - ✓ Git commit created with message: `feat(223): Create markdown file test-do4dr9.md`
  - ✓ Commit pushed to remote on feature branch `feat/223-markdown-file-creation-995640`
  - ✓ No git errors or warnings
  - ✓ Implementation uses only Python stdlib (pathlib, subprocess)
  - ✓ Script exits cleanly with appropriate error handling
