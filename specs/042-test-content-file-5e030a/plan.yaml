# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the established content-file architecture in the repository:

  - **Location**: Repository root (alongside .env, README.md, Docker files, and 100+ other test-*.md files)
  - **Pattern**: `test-{randomstring}.md` — consistent naming across similar features (041, 040, 039, 035, 034)
  - **Structure**: H1 heading on line 1, blank line, then 2-3 sentences of substantive content
  - **Encoding/Line Endings**: UTF-8 without BOM, LF line endings (Unix convention) — repository standard
  - **Integration**: Pure content addition; no dependencies on code, configuration, CI/CD, or other systems

  The markdown file is a static, standalone content asset. No runtime dependencies, build process integration,
  or code-level architectural changes are needed.

  ## Key Design Decisions

  ### 1. Direct File Creation (vs. Templated/Programmatic)

  **Decision**: Create the file directly with hand-written, substantive content.

  **Rationale** (from research): The spec requires "substantive content contextually relevant to the chosen
  title" (FR-3 detail). Existing files (test-o73tv2.md, test-em3o13.md) demonstrate this principle with
  meaningful text on topics like state machines, persistence, forestry, etc. Templated or programmatic
  generation introduces unnecessary complexity and risk of placeholder text or formatting errors. Direct
  creation is simplest and most reliable for this scope.

  **Alternatives considered**:
  - Templated/programmatic generation — Unnecessary complexity; templates risk incorrect formatting
  - Lorem ipsum or placeholder text — Violates explicit "substantive content" requirement (FR-3)

  ### 2. UTF-8 Encoding (no BOM) + LF Line Endings

  **Decision**: UTF-8 without BOM, LF line endings per Unix/Linux convention.

  **Rationale** (from research): Spec NFR-1 explicitly mandates UTF-8 without BOM; BOM can cause parsing
  issues in some tools. Spec NFR-2 mandates LF line endings (Unix convention). These are standard repository
  conventions confirmed by examining existing test markdown files. Consistency across the codebase is essential
  for tooling, version control, and cross-platform compatibility.

  **Alternatives considered**:
  - UTF-8 with BOM — Spec NFR-1 explicitly excludes; causes tool incompatibility issues
  - CRLF line endings — Repository standard is LF per NFR-2; Windows convention not appropriate here
  - UTF-16 or other encodings — No multi-language requirements; UTF-8 is repository standard

  ### 3. Markdown Format (vs. Other Markup)

  **Decision**: Standard Markdown syntax (H1 heading + plain text sentences).

  **Rationale** (from research): All existing test markdown files in the repository use identical structure.
  This is a proven pattern across 100+ similar features. The spec explicitly requires a markdown file
  (FR-1: "test-509s35.md"). Consistency with established conventions is essential.

  **Alternatives considered**:
  - Other markup (reStructuredText, AsciiDoc) — Repository uses Markdown exclusively for test content files
  - Structured formats (YAML, JSON) — Contradicts markdown file requirement and content-focused nature

  ### 4. Manual Verification (vs. Automated Testing)

  **Decision**: Manual verification of file properties and acceptance criteria.

  **Rationale** (from research): This feature creates only a markdown file with simple structural requirements
  (H1 heading, 2-3 sentences, proper encoding, line endings). These can be verified manually in seconds.
  No code exists to unit test. The overhead of setting up automated tests would exceed the value provided.
  Content quality is better evaluated through human review in the pull request process.

  **Alternatives considered**:
  - Automated test suite — No code to test; overhead not justified for simple file
  - CI/CD pipeline validation — No code changes; CI pipelines not appropriate for pure content creation

  ## Implementation Strategy

  **Phase 1 → Phase 2 ordering rationale**:

  1. **Phase 1 (File Creation) comes first**: The file must exist before it can be verified or committed.
     Creating the file with correct structure and content is the foundational prerequisite.

  2. **Phase 2 (Verification & Commit) comes second**: Only after the file exists with proper content can
     we verify encoding, line endings, and commit it with confidence. Verification ensures all non-functional
     requirements (NFR-1 through NFR-6) are met before pushing to remote.

  No parallelization is possible — verification requires the file to exist first.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Incorrect file encoding (BOM or non-UTF-8) | Low | Medium | Verify encoding explicitly during phase 2; use hex dump or `file` command to confirm UTF-8 without BOM |
  | Wrong line endings (CRLF instead of LF) | Low | Low | Verify line endings explicitly during phase 2; use `od -c` or editor line-ending display; Git status will flag if wrong |
  | Missing terminal newline | Low | Low | Verify file ends with newline during phase 2; use `tail -c 1 \| od -c` to check last byte |
  | Content doesn't meet "substantive" requirement | Very Low | Low | Review content carefully before committing; ensure 2-3 meaningful, topic-relevant sentences (not filler) |
  | Git status shows unintended modifications | Very Low | Low | Run `git status` and `git diff` before committing; ensure only test-509s35.md is staged |
  | Typos or syntax errors in markdown | Low | Low | Review file content visually; render in markdown viewer if available to check syntax validity |
