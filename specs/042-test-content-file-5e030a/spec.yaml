  ## Size Estimate

  **S** (Small) — 10-15 minutes total effort:

  - File creation: ~5 minutes (one H1 heading + 2-3 sentences)
  - Verification: ~5 minutes (check syntax, encoding, line endings, git status)
  - Commit and push: ~2 minutes (standard git workflow)

  No research, no code analysis, no architectural decisions, no testing framework integration.
