# Markdown content (the full tasks document)
content: |
  ## Summary

  The implementation consists of two sequential tasks:

  1. **Create the markdown file** (Phase 1): Write test-509s35.md with proper H1 heading and 2-3 substantive
     sentences. Ensure UTF-8 encoding (no BOM), LF line endings, and terminal newline. This is the content
     creation step where the file is written to disk with correct properties.

  2. **Verify and commit** (Phase 2): Verify all file properties (encoding, line endings, newline), stage the
     file, commit with the established convention, and push to remote. This step ensures the file meets all
     non-functional requirements and is properly integrated into version control.

  Both tasks follow the TDD pattern (RED-GREEN-REFACTOR):
  - **RED**: Define requirements and verify starting conditions
  - **GREEN**: Implement minimal changes to satisfy requirements
  - **REFACTOR**: Clean up, verify, and ensure quality standards

  **Total estimated effort**: 20 minutes (~10 min per task). This aligns with the spec size estimate of Small (S).

  ## Task Ordering

  Task-1 must complete before Task-2 because:
  - Task-1 creates the file that Task-2 verifies
  - Task-2 commits the file created by Task-1
  - No parallelization is possible — sequential execution is required

  ## Implementation Notes

  ### Task-1: File Creation

  The RED phase confirms the file doesn't exist and specifies the exact requirements from the spec
  (file name, H1 heading, 2-3 sentences). The GREEN phase writes the file with careful attention to:
  - UTF-8 encoding without BOM (use `echo` with `printf` or a text editor that respects UTF-8)
  - LF line endings (ensure no CRLF conversion)
  - Final newline character (standard Unix convention)
  - Substantive content (2-3 meaningful sentences, not placeholder text)

  The REFACTOR phase verifies content quality and correctness before proceeding to commit.

  ### Task-2: Verification and Commit

  The RED phase specifies all acceptance criteria for encoding, line endings, and git status. The GREEN phase
  runs verification commands and performs the git workflow:
  - `file test-509s35.md` confirms UTF-8 (no BOM)
  - `od -c` verifies LF endings and final newline
  - `git status` confirms clean state
  - `git add` stages the file
  - `git commit` with established message format
  - `git push` sends to remote

  The REFACTOR phase reviews the commit on remote and confirms no unintended files were modified.
