content: |
  ## Architecture Overview

  Feature 083 is a minimal, isolated file creation task that follows the established "test markdown file creation" pattern used in features 079-082. The implementation consists of:

  1. **File Creation Phase** — Create a single markdown file (test-jac2un.md) in the repository root using Python's pathlib module with explicit UTF-8 encoding and LF line endings.
  2. **Git Workflow Phase** — Stage the file, commit with a conventional commit message, and push to the remote feature branch.

  **Integration Pattern:** Test File Creation (Isolated, Atomic)
  - Creates exactly 1 file; no existing files modified
  - Atomic git commit: all changes bundled in a single commit
  - No source code changes or build/test infrastructure modifications
  - No external dependencies; uses Python 3.11+ standard library only
  - Follows a fully determined technical pattern (confirmed by 60+ existing test files)

  **Key Characteristics:**
  - **Zero complexity:** File format is fixed (H1 heading + 2-3 sentences), topic is freely chosen
  - **No decision overhead:** All technical choices predetermined by spec and 80+ existing files
  - **High confidence:** Pattern has been executed 60+ times with zero reported issues
  - **Minimal effort:** Estimated 10-15 minutes total (file creation + git workflow)

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Selected:** `pathlib.Path('test-jac2un.md').write_text(content, encoding='utf-8')`

  **Rationale:**
  - Explicitly required by FR-4 (functional requirement)
  - Modern Python standard library (3.4+) with cross-platform support
  - Explicit encoding parameter ensures UTF-8 without BOM (NFR-1)
  - Eliminates manual file handle management
  - Verified by successful implementations in features 080-082

  **Alternatives Rejected:**
  - `open()` context manager — lower-level, requires manual handle management
  - `os.path` module — legacy, superseded by pathlib in Python 3.4+

  ### 2. Git Workflow: subprocess.run() with explicit argument lists

  **Selected:** Three subprocess.run() calls (add, commit, push) with shell=False

  **Rationale:**
  - Standard library (Python 3.11+); no external dependencies allowed (NFR-4)
  - Safe execution with shell=False prevents command injection
  - Git commands are simple (no complex shell syntax needed)
  - Matches proven pattern from features 080-082
  - Explicit argument lists (not shell strings) improve reliability and safety

  **Alternatives Rejected:**
  - GitPython library — external dependency violates NFR-4
  - os.system() — security risk (command injection), less reliable error handling

  ### 3. Content Format: Fixed Template (H1 heading + 2-3 sentences)

  **Selected:** Exact format matching all 60+ existing test files
  ```
  # Topic Title

  First sentence explaining the topic. Second sentence providing additional context.
  Third sentence concluding or expanding the thought.
  ```

  **Rationale:**
  - Established, proven pattern with zero variability
  - Natural prose in this format produces 400-600 bytes (NFR-3)
  - All 60+ existing test files follow this exact structure
  - Eliminates formatting decisions and validation complexity
  - Topic selection is free choice per spec resolution (openQuestions #1)

  **Alternatives Rejected:**
  - Template engines (Jinja2) — overkill for 4 lines of trivial content
  - Random topic generation — adds complexity; free choice is simpler per spec

  ### 4. Encoding: UTF-8 explicit, no BOM

  **Selected:** `encoding='utf-8'` parameter in write_text(); content composed with \n only

  **Rationale:**
  - Satisfies requirements NFR-1 (UTF-8, no BOM) and NFR-2 (LF line endings)
  - pathlib.write_text() with explicit encoding avoids platform-specific defaults
  - On Unix systems (deployment target), text mode with \n produces LF
  - All existing test files use UTF-8 without BOM and LF line endings exclusively

  **Alternatives Rejected:**
  - Default system encoding — risks platform-specific encoding issues
  - Manual binary mode with encode() — unnecessary complexity

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1: File Creation and Validation** comes first because:
     - File must exist before git operations
     - Validation ensures requirements are met before committing
     - Self-contained: can be verified independently without git

  2. **Phase 2: Git Workflow Integration** follows because:
     - Depends on Phase 1 completing successfully
     - Atomic: stages, commits, and pushes in sequence
     - Final verification occurs after push (commit in remote history)

  **Execution Flow:**
  - Write implementation script that creates file, validates it, then stages/commits/pushes
  - Each task focuses on a specific requirement area (content validation, git operations)
  - TDD approach: verify requirement first, implement minimal code, refactor if needed
  - Post-implementation verification: file exists at repo root, is in HEAD commit, is in git history

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File encoding issues (wrong encoding or BOM) | Very Low | High | Explicit UTF-8 in write_text(); validated against spec requirements |
  | Line ending issues (CRLF instead of LF) | Very Low | High | Compose content with \n only; text mode on Unix produces LF natively |
  | File size out of range (400-600 bytes) | Very Low | Medium | Follow established pattern (H1 + 2-3 sentences); confirmed by 60+ existing files |
  | Git command failure | Very Low | High | subprocess.run(..., check=True) raises exception on non-zero exit; fails fast |
  | Branch or remote not found | Low | High | Assumes feature branch exists and origin is configured (standard in CI/CD); fails explicitly |
  | File already exists and needs overwrite | Very Low | Low | pathlib.write_text() naturally truncates; no silent overwrites; requirement FR-8 guarantees no conflicts |
  | Content format invalid (missing heading or too few sentences) | Very Low | High | Follow fixed template exactly; validate structure post-creation if needed |
  | Unauthorized access to git operations | N/A | N/A | Delegated to host environment; git credentials pre-configured in CI/CD |

  ## Implementation Notes

  - **No testing infrastructure changes** (NFR-8): Feature is pure file creation; no unit tests, no CI/CD modifications
  - **No source code changes** (FR-8): Feature does not modify /src/sheep/ or any existing code
  - **Estimated effort:** 10-15 minutes (proven by features 080-082 implementations)
  - **Success verification:** File exists in repo root, contains valid H1 heading + prose, is in git HEAD commit
  - **Confidence level:** High — Pattern is deterministic, proven by 60+ existing test files, no architectural changes

