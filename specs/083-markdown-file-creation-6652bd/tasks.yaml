content: |
  ## Summary

  Feature 083 consists of 5 concrete tasks organized across 2 implementation phases:

  **Phase 1: File Creation and Validation** (Tasks 1-2)
  - Create the markdown file (test-jac2un.md) in the repository root with proper structure, encoding, and content
  - Validate that the file meets all requirements: UTF-8 encoding, LF line endings, correct byte size, valid markdown

  **Phase 2: Git Workflow Integration** (Tasks 3-5)
  - Stage the file in git using `git add`
  - Commit with a conventional commit message
  - Push to the remote feature branch

  **Total Estimated Effort:** 45-60 minutes

  ### Task Dependency Graph

  ```
  task-1 (Create file)
    └─> task-2 (Validate file)
          └─> task-3 (Git add)
                └─> task-4 (Git commit)
                      └─> task-5 (Git push)
  ```

  All tasks are sequential with linear dependencies. Each task must complete before the next begins.

  ### TDD Approach

  Each task follows the red/green/refactor cycle:
  - **RED:** Write test/validation code that verifies the requirement (should fail before implementation)
  - **GREEN:** Implement minimal code to satisfy the requirement and pass the test
  - **REFACTOR:** Clean up code, improve readability, extract helpers if useful

  ### Acceptance Criteria

  Success is verified by:
  1. File exists at correct location with correct structure and content
  2. File passes all encoding and format validations
  3. File is staged in git (appears in `git status`)
  4. Commit appears in `git log` with correct message
  5. Commit appears in remote branch (reachable from `origin/feat/083-...`)

  ### Implementation Notes

  - All git commands use `subprocess.run()` with `shell=False` for safety
  - No GitPython or external dependencies; Python 3.11+ standard library only
  - File creation uses `pathlib.Path.write_text(encoding='utf-8')` as specified
  - Content is written once; no modification after creation (FR-8 compliance)
  - All tasks are straightforward implementations of clear requirements

