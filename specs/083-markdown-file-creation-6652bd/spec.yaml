# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-jac2un.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 80+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-doc-creation pattern established
  in features 079-082, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-jac2un.md` exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (format: `# Title`)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] Prose content is coherent and grammatically correct English
  - [ ] File is encoded in UTF-8 (without BOM)
  - [ ] File uses LF line endings only (Unix style, no CRLF)
  - [ ] File size is between 400-600 bytes (matches established pattern)
  - [ ] File content is valid CommonMark markdown (renders without syntax errors)
  - [ ] File is staged and committed in git with message format: `feat(083): ...`
  - [ ] Commit is pushed to feature branch `feat/083-markdown-file-creation-6652bd`
  - [ ] File is reachable from the feature branch HEAD (git log shows the commit)
  - [ ] No existing files are modified by this feature

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-jac2un.md` in the repository root directory
  - **FR-2**: File must contain a markdown H1 heading on the first line (format: `# <title>`)
  - **FR-3**: File must contain 2-3 sentences of original prose content following the heading
  - **FR-4**: File must be created using Python's `pathlib.Path` module (Python 3.11+ standard library)
  - **FR-5**: File must be staged in git using `git add`
  - **FR-6**: File must be committed to git with a conventional commit message: `feat(083): create markdown file test-jac2un.md with prose content`
  - **FR-7**: Commit must be pushed to the remote feature branch `feat/083-markdown-file-creation-6652bd`
  - **FR-8**: Implementation must not modify any existing files in the repository
  - **FR-9**: Implementation must not create subdirectories or additional files beyond the single markdown file

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 character encoding (no BOM prefix)
  - **NFR-2**: File must use LF line endings exclusively (Unix/Linux style, not CRLF)
  - **NFR-3**: File size must be within 400-600 bytes range (consistent with 80+ existing test files)
  - **NFR-4**: Implementation must use only Python 3.11+ standard library (no external dependencies)
  - **NFR-5**: Markdown content must be valid CommonMark-compliant markdown
  - **NFR-6**: Git commit must follow conventional commit specification (`feat(NNN): <description>`)
  - **NFR-7**: Implementation must be completed without modifying source code in `/src/sheep/` or build/test infrastructure
  - **NFR-8**: No CI/CD pipelines, tests, or documentation should be required or modified
  - **NFR-9**: Feature follows the identical pattern established by features 079-082 for consistency and precedent adherence

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the markdown file topic be freely chosen or domain-restricted? | Free choice (any topic) | Aligns with features 079-082 precedent, eliminates decision overhead, maximizes velocity, appropriate for test file creation |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-jac2un.md) to existing collection of 80+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 079-082; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/083-markdown-file-creation-6652bd` must exist and be checked out
  - **File system**: Write access to repository root directory (available in standard CI/CD environment)
  - **Established pattern**: 80+ test files provide clear precedent for content format and structure (confirmed in test-v7xasn.md, test-mkh44q.md, etc.)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **No external dependencies**: Feature uses only standard library (pathlib, subprocess for git commands)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size in expected range)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 80+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (079-082) demonstrate efficient implementation of identical features in 10-15 minutes
  - No code changes, no build/test/review complexity, purely file creation and git workflow

