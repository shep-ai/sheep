content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-pgmhaa.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 220+ similar test files already existing in the repository as precedents. This feature demonstrates
  core capabilities: file creation, git staging, conventional commits, and push-to-remote
  operations—all essential building blocks in the Sheep automation platform.

  ## Success Criteria

  - [ ] File `test-pgmhaa.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (# Title) as the title
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] File content is coherent and readable
  - [ ] File uses Unix line endings (LF), not Windows line endings (CRLF)
  - [ ] File is staged and committed to the git repository
  - [ ] Commit message follows conventional commits format: "feat(222): Create markdown file test-pgmhaa.md"
  - [ ] Commit is pushed to the feature branch `feat/222-markdown-file-creation-7d3552`
  - [ ] No unintended files are created or modified during implementation
  - [ ] Git repository remains in a clean state with no uncommitted changes

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-pgmhaa.md` in the repository root directory
  - **FR-2**: File must contain a valid markdown H1 heading (single # followed by title text) as the primary title
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading, separated by a blank line
  - **FR-4**: File content must be coherent and readable, with meaningful or illustrative prose (not placeholder gibberish)
  - **FR-5**: File must use Unix line endings (LF, \n) to match repository conventions
  - **FR-6**: Add the created file to the git staging area using `git add test-pgmhaa.md`
  - **FR-7**: Create a commit with the conventional commit message "feat(222): Create markdown file test-pgmhaa.md"
  - **FR-8**: Push the commit to the feature branch `feat/222-markdown-file-creation-7d3552` using `git push`
  - **FR-9**: Ensure the file is the only new file added during this feature (no accidental files created)
  - **FR-10**: Verify no existing files in the repository are modified during file creation

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must complete within the 15-minute time estimate (target: 10-15 minutes)
  - **NFR-2**: Must use only Python 3.11+ standard library modules (`pathlib` for I/O, `subprocess` for git operations); no external package dependencies
  - **NFR-3**: Implementation approach must follow established patterns from features 160-221 (60+ proven identical features)
  - **NFR-4**: Git operations must strictly follow the Conventional Commits specification (https://www.conventionalcommits.org/)
  - **NFR-5**: Markdown format must comply with CommonMark specification (https://spec.commonmark.org/)
  - **NFR-6**: Must target Unix/Linux environment with LF line endings; Windows CRLF is not acceptable
  - **NFR-7**: Code must be straightforward and minimal, avoiding unnecessary complexity or abstractions
  - **NFR-8**: Implementation must require no modifications to existing files, configuration, or source code

  ## Product Decisions

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the markdown file be created using direct file I/O or a wrapper script? | Direct file creation | Direct implementation is proven efficient in features 220-221, minimizes complexity, and matches recent successful patterns. No reusability requirement justifies wrapper overhead. |
  | 2 | Should the content topic be predetermined or arbitrary? | Arbitrary/random topic | User spec explicitly states "about anything". Arbitrary topics are proven effective across 220+ test files. Maximum flexibility aligns with feature's pattern-demonstration purpose. |
  | 3 | Should implementation include post-creation validation before git operations? | No validation | Recent features 220-221 skip validation; the pattern is proven across 220+ files. Validation overhead contradicts minimal-effort design and recent precedent. |
  | 4 | Should git push happen immediately after commit or be staged for manual review? | Push immediately | All 220+ preceding test features pushed automatically. Workflow is proven, risk-free (single file, no conflicts), and autonomous implementation matches project pattern. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 220+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-500 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 160-221; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the Sheep platform |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or feature configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`, `subprocess`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic |
  | CI/CD Pipeline | None | Git push triggers existing CI, but no additional configuration or pipeline changes needed |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/222-markdown-file-creation-7d3552` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Unix-based environment (Linux, macOS) for consistent LF line endings

  **Reference/Precedent:**
  - 220+ existing test markdown files (test-*.md, *.md) provide clear pattern to follow
  - Previous feature implementations (features 160-221) demonstrate successful execution of identical pattern
  - Implementation scripts in repository root (create_markdown_file_221.py, create_markdown_file_220.py) show working patterns
  - Features 220-221 specs provide exact templates

  **Not Required:**
  - No source code dependencies (src/sheep/ remains untouched)
  - No external package dependencies
  - No modifications to configuration files (.env, pyproject.toml, etc.)
  - No integration with CrewAI or other Sheep platform components
  - No testing framework integration (feature has no tests)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with 60+ identical successful precedents (features 160-221):

  - **File creation**: ~3 minutes (compose markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~0 minutes (skipped per product decision; pattern is proven)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification:**
  - Extremely well-established pattern with 60+ identical features (160-221) providing proven precedent
  - Flexible topic selection with no research or architectural decisions required (per product decisions)
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or complex configuration changes required
  - Recent feature implementations (220-221) demonstrate efficient execution within estimated timeframe
  - No git merge conflicts or branch management complexity
  - Feature branch already created and checked out
  - Standard library only (no dependency resolution or build process)
