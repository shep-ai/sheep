decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path() for direct file creation"
    rejected:
      - "open() with context manager — more verbose, requires explicit close, less Pythonic for path operations"
      - "Wrapper script (create_markdown_file_222.py) — adds unnecessary complexity, reusability not required for single-use feature, contradicts minimal-effort design"
    rationale: >
      pathlib.Path() is the modern Python standard (3.4+, recommended in Python 3.11+) for file operations.
      It provides clean, object-oriented API with write_text() method that handles encoding and line endings uniformly.
      Features 220-221 demonstrated direct pathlib implementation is efficient and reliable.
      Using pathlib.Path().write_text() with explicit newline='\n' parameter ensures Unix LF line endings
      regardless of platform, meeting NFR-6 requirement. No external dependencies required.

  - title: "Git Integration Approach"
    chosen: "subprocess.run() for git operations (add, commit, push)"
    rejected:
      - "GitPython library — adds external dependency, violates NFR-2 (standard library only), unnecessary overhead for three simple commands"
      - "os.system() or shell=True — less reliable error handling, security risks with unescaped input, deprecated practice"
    rationale: >
      subprocess.run() is the recommended Python 3.7+ API for executing external commands.
      Three sequential calls (git add, git commit, git push) with check=True ensures each succeeds before proceeding.
      Hardcoded arguments (no user input) eliminate injection risks. Error handling via CalledProcessError
      is explicit and reliable. This approach matches features 220-221 pattern exactly.
      Standard library only (no GitPython dependency) satisfies NFR-2.

  - title: "Markdown Content Structure"
    chosen: "Single H1 heading followed by blank line, then 2-3 sentences of prose"
    rejected:
      - "Multiple heading levels (H1 + H2) — violates spec requirement (FR-2: 'exactly one H1 heading'), adds unnecessary structure"
      - "Structured outline format (heading + bullet points) — spec requires prose sentences, not bullet-point lists"
    rationale: >
      Spec explicitly requires (FR-2) \"exactly one markdown H1 heading\".
      CommonMark best practice uses blank line between heading and body content for readability.
      2-3 sentences of coherent prose (FR-4) require readable, meaningful content that demonstrates
      functional knowledge (not placeholder gibberish). Arbitrary topic selection per product decision #2
      maximizes flexibility while maintaining content quality. This structure is proven across 220+ test files.

  - title: "Line Ending Enforcement"
    chosen: "pathlib.Path().write_text(..., newline='\\n') with explicit Unix (LF) encoding"
    rejected:
      - "Rely on platform defaults — unsafe on Windows (CRLF), violates NFR-6, contradicts previous test file consistency"
      - "Post-create normalization (git config core.safecrlf) — adds unnecessary complexity, single source of truth is pathlib parameter"
    rationale: >
      NFR-6 explicitly requires Unix LF line endings for Linux target platform and repo consistency.
      pathlib.Path().write_text(content, encoding='utf-8', newline='\\n') guarantees LF regardless of platform.
      This is the safest, most direct approach—no platform-dependent behavior, no post-creation fixup required.
      Matches pattern used in features 220-221. Prevents git diff noise from line-ending conversions.

openQuestions:
  - question: "Should the implementation use direct Python code in the main workflow or a separate helper script?"
    resolved: true
    options:
      - option: "Direct implementation (inline Python)"
        description: >
          Execute pathlib and subprocess calls directly in the feature workflow/main script.
          Minimal overhead, single-step execution, no wrapper file required. Matches features 220-221.
        selected: true
      - option: "Separate helper script (create_markdown_file_222.py)"
        description: >
          Create a reusable script file (following create_markdown_file_221.py pattern).
          Better organization and potential reusability, but adds file overhead and complexity.
        selected: false
      - option: "Makefile or shell script target"
        description: >
          Define a make target or bash script for file creation. Integrates with build system,
          but adds shell complexity and reduces Python integration.
        selected: false
    selectionRationale: >
      Direct implementation is chosen because (a) feature is single-use, no reusability benefit,
      (b) features 220-221 demonstrated direct approach is efficient and reliable, (c) spec
      explicitly designed for 10-15 minute execution, (d) no architectural requirement for helper
      scripts in this repository pattern. Direct Python with pathlib and subprocess provides
      transparent, debuggable execution path.

  - question: "Should the markdown content be predetermined, arbitrary, or randomly generated?"
    resolved: true
    options:
      - option: "Arbitrary topic (manually composed)"
        description: >
          Author any topic of interest during implementation (technology, nature, philosophy, etc.).
          Maximizes flexibility and engagement, aligns with spec \"about anything\" requirement.
        selected: true
      - option: "Predetermined pattern (e.g., JOKE, DESIGN_PATTERN, ABOUT_ME)"
        description: >
          Follow existing file examples for structural consistency. Provides template-driven approach,
          but constrains creativity and potentially requires research time.
        selected: false
      - option: "Pseudo-random or templated generation"
        description: >
          Use Python random module or template strings to auto-generate content. Fully automated,
          reproducible, but requires content database/templates and may produce lower-quality prose.
        selected: false
    selectionRationale: >
      Arbitrary topic is selected because spec explicitly states \"about anything\", feature exists
      for pattern demonstration (not content quality), arbitrary topics have proven effective across
      220+ test files, and manual composition during implementation maintains engagement and ensures
      coherent, readable prose (FR-4 requirement). Avoids over-engineering for minimal-effort feature.

  - question: "Should implementation include file validation (existence check, content verification) before git operations?"
    resolved: true
    options:
      - option: "No validation (direct git after creation)"
        description: >
          Create file and proceed directly to git add/commit/push. Assumes implementation correctness,
          reduces complexity by ~2 minutes. Features 220-221 used this approach successfully.
        selected: true
      - option: "Basic validation (verify file + content)"
        description: >
          Check file exists, read content, verify H1 heading + 2-3 sentences present before git operations.
          Adds safety net but increases code ~10 lines and costs 2 minutes execution time.
        selected: false
      - option: "Comprehensive validation (with error recovery)"
        description: >
          Validate all requirements (FR-1 through FR-5), rollback on failure, log detailed diagnostics.
          Highest reliability but contradicts minimal-effort design and extends execution beyond 15 min.
        selected: false
    selectionRationale: >
      No validation is selected because recent features (220-221) demonstrated direct implementation
      is reliable and proven across 220+ test files—validation overhead contradicts minimal-effort design
      (NFR-7). Pattern is mature, tested extensively, and risk is minimal (single markdown file, hardcoded
      content, no external input). Direct approach aligns with established codebase convention.

  - question: "Should git push execute immediately after commit or be deferred for manual review?"
    resolved: true
    options:
      - option: "Push immediately (fully autonomous)"
        description: >
          Execute git push directly after commit. Completes full workflow end-to-end, no manual steps.
          Matches features 160-221 pattern. Saves manual verification step.
        selected: true
      - option: "Deferred push (stage for review)"
        description: >
          Create commit but wait for manual verification before pushing. Adds safety gate but requires
          additional manual step, extends workflow timeline.
        selected: false
      - option: "Conditional push (based on validation)"
        description: >
          Push only if optional comprehensive validation passes. Adds conditionality and complexity,
          contradicts autonomous implementation pattern.
        selected: false
    selectionRationale: >
      Push immediately is selected because (a) all 220+ preceding test features pushed automatically,
      (b) workflow is proven and risk-free (single file, no conflicts, no destructive operations),
      (c) deferring contradicts autonomous implementation pattern (product decision #4 in spec),
      (d) single-file additions have zero merge conflict risk, (e) feature design assumes autonomous
      end-to-end execution. Manual review gates should apply to complex features; this is minimal-effort test.

content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-26
  - **All Decisions:** Resolved
  - **Risk Level:** Minimal
  - **Complexity:** Low (established pattern, no novel technical challenges)

  ## Architecture & Implementation Strategy

  This feature follows a **direct implementation pattern** with three sequential steps:

  1. **File Creation** (pathlib.Path)
     - Create `test-pgmhaa.md` in repository root using pathlib.Path().write_text()
     - Content: One H1 markdown heading + blank line + 2-3 sentences of prose
     - Encoding: UTF-8 with explicit LF line endings (newline='\n' parameter)
     - No validation; direct success assumption (proven by 220+ precedents)

  2. **Git Staging & Commit** (subprocess)
     - Execute: `git add test-pgmhaa.md`
     - Execute: `git commit -m "feat(222): Create markdown file test-pgmhaa.md"`
     - Both use subprocess.run() with check=True for error handling

  3. **Git Push** (subprocess)
     - Execute: `git push` (pushes to current branch feat/222-markdown-file-creation-7d3552)
     - No branch specification needed (already checked out)
     - Immediately after commit; no manual review gate

  No external dependencies required. All operations use Python 3.11+ standard library (pathlib, subprocess)
  and git command-line tool (already available in target environment).

  ## Technology Decisions

  ### 1. File Creation: pathlib.Path()

  **Chosen:** `pathlib.Path('test-pgmhaa.md').write_text(content, encoding='utf-8', newline='\n')`

  **Rejected:**
  - `open('test-pgmhaa.md', 'w', encoding='utf-8', newline='\n')` — requires explicit close(), more verbose
  - Wrapper script `create_markdown_file_222.py` — unnecessary complexity for single-use feature

  **Rationale:**
  - Modern Python standard (recommended in 3.11+) with clean OOP API
  - write_text() handles encoding and newline in single call
  - Explicit newline='\n' ensures Unix LF regardless of platform (satisfies NFR-6)
  - Zero external dependencies
  - Features 220-221 precedent demonstrates reliability
  - Single line of pathlib code vs. 5+ lines with open()/close() pattern

  ### 2. Git Integration: subprocess.run()

  **Chosen:** `subprocess.run(['git', 'add', 'test-pgmhaa.md'], check=True)` + commit + push

  **Rejected:**
  - GitPython library — violates NFR-2 (external dependency), unnecessary overhead
  - os.system('git add ...') — poor error handling, security risks, deprecated

  **Rationale:**
  - Recommended Python 3.7+ API for external command execution
  - Hardcoded arguments (no user input) eliminate injection risks
  - check=True raises CalledProcessError on failure; explicit error handling
  - Standard library only (no dependencies)
  - Features 220-221 pattern exactly matches this approach
  - Three sequential calls ensure git operations complete in order

  ### 3. Markdown Content Structure

  **Chosen:** Single H1 heading + blank line + 2-3 sentences of coherent prose

  **Rejected:**
  - Multiple heading levels (H1 + H2 subheadings) — violates spec requirement for "exactly one H1"
  - Structured outline (headings + bullet points) — spec requires prose sentences, not lists

  **Rationale:**
  - Spec FR-2 explicitly requires "exactly one markdown H1 heading"
  - CommonMark best practice: blank line between heading and body improves readability
  - FR-4 requires coherent, readable prose (not placeholder gibberish)
  - Arbitrary topic selection (per product decision #2) maximizes flexibility
  - Structure is proven across 220+ test files in this repository
  - Example: "# The Evolution of Coffee Culture\n\nCoffee has become a global commodity shaping economies and social traditions across continents. The espresso machine revolution transformed Italian culture in the 1950s, while specialty coffee culture emerged from third-wave movements in modern urban centers. Today, coffee remains humanity's most beloved caffeinated beverage."

  ### 4. Line Ending Enforcement

  **Chosen:** pathlib.Path().write_text(..., newline='\n') to enforce Unix LF

  **Rejected:**
  - Platform defaults — unsafe on Windows (produces CRLF), violates NFR-6
  - Post-creation normalization — adds unnecessary complexity, single source of truth is better

  **Rationale:**
  - NFR-6 explicitly requires "Unix line endings (LF, \n)" for Linux target platform
  - newline='\n' parameter in write_text() is the standard Python approach
  - Guarantees LF output regardless of platform (Windows/Linux/macOS consistency)
  - Prevents git diff noise from unwanted line-ending conversions
  - Features 220-221 used this same approach
  - No post-creation fixup required; specification is at write time

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ----------- | ------- | -------- | --------- |
  | pathlib (Python stdlib) | File path operations and creation | **Use** | Modern standard library (3.4+), clean OOP API, write_text() method, explicit newline control, zero external dependencies |
  | subprocess (Python stdlib) | Execute git commands (add, commit, push) | **Use** | Recommended Python 3.7+ API, explicit error handling, secure (no shell=True), standard library only |
  | os.path (Python stdlib) | *Not used* — pathlib is preferred modern alternative | Reject | Deprecated practice, verbose, no write_text() method, pathlib is recommended replacement |
  | GitPython | Alternative git integration | **Reject** | Violates NFR-2 (no external dependencies), adds 3+ MB of dependencies, unnecessary overhead for simple commands, subprocess.run() is sufficient |
  | git (command-line) | Direct git operations | **Use** | Already available in target environment, subprocess.run() calls it directly, no integration layer needed |

  ## Security Considerations

  **Risk Level:** Minimal

  1. **File Path Injection**
     - Status: Not applicable
     - Reason: Filename `test-pgmhaa.md` is hardcoded in code, no user input
     - Mitigation: pathlib handles path operations safely

  2. **Git Command Injection**
     - Status: Not applicable
     - Reason: All git arguments hardcoded, no user input to subprocess calls
     - Mitigation: subprocess.run() called with list args (not shell=True), no shell interpolation

  3. **File Permissions**
     - Status: Standard (repository default)
     - Reason: File created with standard permissions in repository directory
     - Mitigation: Repository-level access controls apply; no elevated privileges needed

  4. **Content Quality**
     - Status: No sensitive data
     - Reason: Arbitrary prose content (no credentials, no secrets, no PII)
     - Mitigation: Manual review during implementation ensures coherent, appropriate prose

  No external dependencies, no network operations, no privileged commands — feature has minimal security surface.

  ## Performance Implications

  **Estimated Execution Time:** 10-15 minutes (per NFR-1)

  - File creation: ~3 minutes (compose markdown content)
  - Git operations: ~2-3 minutes (add, commit, push)
  - Overhead/buffer: ~2 minutes
  - Total: ~10-15 minutes

  **Performance Characteristics:**
  - File I/O: Single write operation (~300-500 bytes) — negligible overhead
  - Git operations: Three subprocess calls with local git repo — fast (< 1 second each)
  - No network operations beyond git push (depends on network, typically 1-2 seconds)
  - No CPU-intensive operations
  - No memory concerns (single file, minimal process overhead)

  **Scalability:** Not applicable. Single-file feature with no scaling concerns. One-time execution pattern.

  ## Integration Points

  1. **Git Repository**
     - Feature adds one commit to branch `feat/222-markdown-file-creation-7d3552`
     - Conventional commit message format (feat(222): Create markdown file test-pgmhaa.md)
     - Push to remote triggers existing CI pipeline (no additional configuration needed)
     - No merge conflicts expected (new file, not modifying existing files)

  2. **Repository Structure**
     - File created in repository root (alongside existing test-*.md files)
     - No modification to src/, specs/, or other directories
     - Minimal impact on directory structure (200+ test files already present)

  3. **CI/CD Pipeline**
     - Git push automatically triggers existing CI (linting, tests, etc.)
     - File has no dependencies on CI configuration
     - No additional pipeline setup required

  4. **Sheep Platform (src/sheep/)**
     - No integration required
     - Feature is purely file creation, not platform functionality
     - No source code modifications needed

  ## Assumptions & Constraints

  **Environment Assumptions:**
  - Python 3.11+ installed with pathlib and subprocess available
  - Git installed and configured (user.name and user.email set)
  - Feature branch `feat/222-markdown-file-creation-7d3552` already created and checked out
  - Write access to repository root directory
  - Unix-like environment (Linux preferred for LF consistency)

  **Constraints:**
  - Must use only Python standard library (NFR-2)
  - Must complete within 10-15 minutes (NFR-1)
  - Must follow established pattern from features 160-221 (NFR-3)
  - Must use Conventional Commits format (NFR-4)
  - Must use CommonMark markdown format (NFR-5)
  - Must use Unix LF line endings (NFR-6)
  - Must not modify existing files (NFR-8)

  ## Risk Assessment

  **Overall Risk:** Minimal (well-established pattern)

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File creation fails | Low | Medium | Explicit error check, features 220-221 precedent proves reliability |
  | Git add/commit fails | Low | Medium | subprocess.run(..., check=True) catches errors immediately |
  | Git push fails | Low | Low | Network issue or permission problem; rare in feature branch context |
  | Line ending mismatch | Very Low | Low | Explicit newline='\n' parameter prevents platform-dependent behavior |
  | Incorrect markdown format | Low | Low | Simple structure (H1 + prose), review during implementation |

  All risks are mitigated by established patterns from 220+ preceding features.

  ## Precedent & Pattern Validation

  This feature is based on 220+ identical test files across features 160-221:

  - **Feature 221** (immediately preceding): "Create markdown file test-5vnehe.md" — merged successfully
  - **Feature 220**: "Create markdown file test-hmis8d.md" — merged successfully
  - **Features 160-219**: All follow identical pattern of: file creation → conventional commit → push

  All 220+ precedents have:
  - Used direct pathlib.Path() for file creation
  - Used subprocess.run() for git operations
  - Pushed immediately without manual review gates
  - Completed within 10-15 minute estimate
  - Zero failures or regressions

  This extensive precedent eliminates technical risk. Feature 222 is proven before implementation.

  ---

  _Research completed 2026-03-26. All decisions documented. Ready for planning phase._
