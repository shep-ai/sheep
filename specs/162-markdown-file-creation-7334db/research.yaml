# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete

  ## Technology Decisions

  ### 1. File I/O Abstraction Layer

  **Chosen:** Python `pathlib.Path` with `write_text()` method

  **Rejected:**
  - `os.path` module — older API style, less readable, requires string concatenation for path operations
  - Direct `open()` calls — less object-oriented, less convenient for path operations

  **Rationale:**
  pathlib.Path is the modern Python standard (introduced 3.4, required for Python 3.11+).
  It provides object-oriented file operations, automatic cross-platform path handling, and cleaner API.
  Using `Path.write_text(encoding='utf-8')` is idiomatic and handles all encoding requirements in a single call.
  This matches modern Python practices and aligns with Python 3.11+ requirements.

  ### 2. Text Encoding Strategy

  **Chosen:** Explicit UTF-8 encoding with `encoding='utf-8'` parameter

  **Rejected:**
  - Python default encoding (implicit) — while Python 3 defaults to UTF-8, explicit specification is clearer
  - UTF-8 with BOM (`encoding='utf-8-sig'`) — spec explicitly requires no BOM

  **Rationale:**
  Feature spec requires UTF-8 without Byte Order Mark.
  Explicitly specifying `encoding='utf-8'` is best practice for clarity and portability.
  This ensures platform-independent behavior and makes the requirement visible in code.

  ### 3. Line Ending Handling

  **Chosen:** Explicit LF (`\n`) characters in content strings with Python 3 text mode

  **Rejected:**
  - `os.linesep` — produces CRLF on Windows, violates Unix convention
  - Binary mode with explicit byte handling — unnecessary complexity

  **Rationale:**
  Feature spec requires Unix-style LF line endings.
  Python 3 pathlib text mode correctly writes LF on all platforms when strings contain `\n`.
  Explicitly including `\n` in content strings ensures portability across Windows/Mac/Linux.

  ### 4. Git Integration Method

  **Chosen:** `subprocess.run()` with `check=True` for `git add`, `git commit`, `git push`

  **Rejected:**
  - GitPython library — external dependency not in spec requirements
  - `os.system()` — poor practice; no error handling; security concerns

  **Rationale:**
  Feature spec explicitly requires no external dependencies beyond Python 3.11+ standard library and git.
  `subprocess.run(check=True)` is modern (Python 3.5+) with proper error handling.
  It is the idiomatic way to invoke external programs and matches established patterns in the codebase.
  Git is a required dependency (feature works within a git repository).

  ### 5. Markdown Content Generation

  **Chosen:** Hard-coded, pre-written coherent prose matching established test file precedents

  **Rejected:**
  - Programmatic generation (random words, templates) — over-engineering for simple requirement
  - External content generation (API calls, ML models) — violates no-dependencies requirement

  **Rationale:**
  Feature spec indicates prose topic is "free-form (arbitrary)" with requirement for grammatical correctness.
  170+ existing test files show hand-written sensible prose (e.g., test-fzgsdv.md on simplicity).
  Hard-coding ensures simple, reliable, coherent content without external dependencies.
  This matches the implementation pattern of all preceding features (151-161).

  ### 6. Commit Message Format

  **Chosen:** Conventional commits: `feat(162): Create markdown file test-l2av8j.md with prose content`

  **Rejected:**
  - Generic format (e.g., "Add file") — lacks semantic information
  - Freestyle format — inconsistent with established repository standard

  **Rationale:**
  Feature spec and all preceding features (151-161) use conventional commits format.
  This provides semantic versioning information and maintains git history quality.
  The repository follows this standard consistently across 162 features.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | --------------- | --------- | -------- | ----------- |
  | `pathlib.Path` | File I/O, path operations | **Use** | Standard library, modern API, handles cross-platform paths and encoding cleanly |
  | `subprocess` | Git command execution | **Use** | Standard library, modern subprocess.run() API provides error handling and compatibility |
  | `GitPython` | Git operations | **Reject** | External dependency; not in spec requirements; subprocess sufficient without adding dependencies |
  | `os.path` | Path operations | **Reject** | Older API; pathlib is more modern and readable; no advantage over pathlib |
  | `os.system()` | Command execution | **Reject** | Poor practice; no error handling; security concerns with shell interpretation |

  ## Security Considerations

  ### File Path Security
  - **Risk:** Path traversal via malicious filenames
  - **Mitigation:** Filename is hard-coded as `test-l2av8j.md`; no user input; path is fixed; no traversal possible

  ### File Permissions
  - **Risk:** Created file could have overly permissive permissions
  - **Mitigation:** Default umask applies; permissions depend on system defaults; acceptable for test file use case

  ### Encoding Safety
  - **Risk:** Incorrect encoding could lead to data corruption
  - **Mitigation:** Explicit UTF-8 encoding specified; Python 3 default is UTF-8; properly handled by pathlib

  ### Git Integration
  - **Risk:** Subprocess calls vulnerable to command injection
  - **Mitigation:** Using subprocess.run() with list-style arguments (not shell=True); no user input; arguments hard-coded

  ### Content Injection
  - **Risk:** Malicious content in markdown file
  - **Mitigation:** File content is hard-coded; no user input; content is coherent prose with no processing

  ## Performance Implications

  ### File I/O Performance
  - Single file write operation (~350-500 bytes) — negligible overhead
  - pathlib.write_text() is optimized for single-call writes; minimal system calls
  - No caching required; operation is simple and deterministic

  ### Git Operations Performance
  - Three subprocess calls: `git add`, `git commit`, `git push`
  - Each call invokes external git process; minimal overhead for test infrastructure
  - No batch optimizations needed; operations are sequential and simple
  - No performance-critical code paths affected

  ### Overall Performance Profile
  - Total execution time: ~2-5 seconds (dominated by network latency for push)
  - File system overhead: negligible (~1ms for write)
  - Git overhead: minimal for single-commit push
  - No performance bottlenecks or optimizations needed

  ## Architecture Notes

  ### Integration with Existing Codebase
  - Feature is pure file creation; does not integrate with src/sheep/ source code
  - Follows established pattern from 170+ existing test files in repository
  - No code modules, classes, or functions created; simple utility file creation
  - No configuration changes required; no dependencies to update

  ### Markdown Format Consistency
  - Matches CommonMark-compatible format used in all existing test files
  - H1 heading + blank line + 2-3 sentences of prose
  - File size 300-600 bytes matches precedent files
  - Encoding (UTF-8 without BOM) matches all existing files

  ### Git Workflow Pattern
  - Follows established pattern from features 151-161:
    - Create file in repository root
    - Stage with `git add`
    - Commit with conventional commit format
    - Push to feature branch
  - No merge complexity; single-commit feature
  - Clean, linear git history

  ### No Code Dependencies
  - Feature requires no modifications to src/sheep/ or other source code
  - Uses only Python 3.11+ standard library (pathlib, subprocess)
  - Uses only git (already required)
  - No external package dependencies; no pyproject.toml changes needed
  - No test modifications or additions required

