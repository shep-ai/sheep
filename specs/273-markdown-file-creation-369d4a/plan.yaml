  - src/sheep/content_generators.py — orchestration and utility functions
  - src/sheep/tools/git_tools.py — GitCommitTool and GitPushTool abstractions
  - src/sheep/config/llm.py — LLM configuration and get_reasoning_llm()

  ## Dependencies

  **Internal:**
  - Feature branch feat/273-markdown-file-creation-369d4a (pre-created, must be checked out)
  - content_generators.py module (stable, proven across 272+ features)
  - Git tools and configuration
  - CrewAI LLM integration

  **External:**
  - Claude API (must be available and API key configured)
  - Git configuration (user.name, user.email required for commits)
  - Remote origin (GitHub or equivalent, must be configured)

  **Environment:**
  - ANTHROPIC_API_KEY environment variable (or equivalent LLM provider key)
  - Python 3.11+ runtime
  - Git binary in PATH

