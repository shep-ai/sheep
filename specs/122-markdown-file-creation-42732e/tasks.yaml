content: |
  ## Summary

  Feature 122 is implemented across 3 phases and 6 tasks. Phase 1 (task-1) establishes the module foundation.
  Phase 2 (tasks 2-6) implements and tests each component of the workflow in strict dependency order: content
  generation (task-2), file creation (task-3), validation (task-4), git integration (task-5), and main
  orchestration (task-6). Each task builds on the previous one, with components tested independently before
  integration. Phase 3 (task-7) runs comprehensive end-to-end testing to verify all success criteria are met.

  The implementation reuses existing proven helpers from sheep.content_generators.py: generate_markdown_content(),
  write_markdown_file(), validate_markdown_file(), commit_markdown_file(), and push_markdown_file(). This
  approach minimizes risk, ensures consistency with 120+ preceding features, and keeps implementation efficient.

  Each Phase 2 task follows TDD discipline: tests are written first (RED) to specify expected behavior, then
  minimal implementation is added to pass the test (GREEN), then code is cleaned up (REFACTOR). Tasks are
  strictly ordered by dependency: content must be generated before the file can be written; the file must be
  created before validation; validation must pass before git operations; all components must work before
  orchestration can integrate them.

  Total effort: 55 minutes across all 6 tasks, distributed as: module setup (5min), content generation (8min),
  file creation (8min), validation (8min), git integration (8min), orchestration (8min), end-to-end test (7min).
