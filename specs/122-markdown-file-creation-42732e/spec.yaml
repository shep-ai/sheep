# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-duijn0.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 120+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 099-121, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-duijn0.md` created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# [Title]`)
  - [ ] File contains 2-3 sentences of prose content below the heading
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses LF (Unix-style) line endings
  - [ ] File size is between 300-600 bytes (consistent with established pattern)
  - [ ] File is staged to git with `git add test-duijn0.md`
  - [ ] Commit created with message format: `feat(122): Create markdown file test-duijn0.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/122-markdown-file-creation-42732e`
  - [ ] No other files modified or created in repository root
  - [ ] No changes to source code (`/src/sheep/`) or configuration files

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-duijn0.md` in the repository root directory
  - **FR-2**: File must contain a single H1 markdown heading as the title (format: `# [Title]`)
  - **FR-3**: File must contain 2-3 sentences of prose content following the heading
  - **FR-4**: Stage the created file to git using `git add test-duijn0.md`
  - **FR-5**: Create a git commit with conventional commit message: `feat(122): Create markdown file test-duijn0.md with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/122-markdown-file-creation-42732e` using `git push`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM, consistent with established pattern from features 099-121
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF or CR
  - **NFR-3**: File size should be approximately 300-600 bytes, following the pattern of 120+ existing test files
  - **NFR-4**: Implementation must follow straightforward imperative code pattern: create content string, write to file (no validation)
  - **NFR-5**: Implementation must not modify source code, configuration files, or test files
  - **NFR-6**: Implementation must follow the established pattern from features 099-121 exactly

  ## Product Decisions & AI Recommendations

  The primary product decision for this feature has been resolved:

  **Implementation Approach (Resolved)**: Use straightforward imperative pattern with no post-write validation.
  This approach creates content, writes to file using pathlib, and skips post-write verification. It aligns with
  the established pattern from features 099-121, keeps implementation simple and fast (10-15 minutes total),
  and matches the conventions of 120+ existing test files. Validation is unnecessary for this straightforward
  file creation task.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 120+ test markdown files (test-*.md) following a consistent pattern, plus configuration and documentation files
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability) implementing the CrewAI-based automated implementation platform
    - **src/sheep/features/**: Individual feature implementations (e.g., feature_121_markdown_file_creation.py)
    - **src/sheep/content_generators.py**: Helper functions for markdown generation, file I/O, git operations
    - **src/sheep/tools/**: Git tools (GitCommitTool, GitPushTool) and file tools
    - **src/sheep/config/llm.py**: LLM initialization and management
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/122-markdown-file-creation-42732e/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (requires Python >=3.11) with CrewAI, Pydantic, and other dependencies
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation describing the Sheep platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern (features 099-121) and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern (120+ precedents)**:
  - Content generation using Claude API via CrewAI LLM framework (get_reasoning_llm())
  - File creation using Python pathlib for I/O operations (Path.write_text())
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 300-600 bytes
  - Implementation follows straightforward imperative code (generate content, write to file)
  - Available helper functions: generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file() in content_generators.py

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/122-markdown-file-creation-42732e`
  - Create/modify files in working directory
  - Stage with `git add test-duijn0.md`
  - Commit with conventional commit format: `feat(122): Create markdown file test-duijn0.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern (observed in features 099-121)**:
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Can be implemented as a simple Python script or module in src/sheep/features/

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **CrewAI**: Framework for agent orchestration and LLM integration (provides get_reasoning_llm() and LLM interface)
  - **Claude API**: Used via CrewAI for generating markdown content (anthropic/claude provider)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path(\"test-duijn0.md\").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-duijn0.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 099-121; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/122-markdown-file-creation-42732e` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 120+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python 3.11+**: Required by pyproject.toml
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **CrewAI and Claude API**: Already available in project dependencies (pyproject.toml: crewai[anthropic] and anthropic provider)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~3-5 minutes (Claude API call to generate H1 heading + 2-3 sentences via CrewAI LLM)
  - **File creation**: ~1-2 minutes (use pathlib to write file to disk with UTF-8 encoding)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch using GitCommitTool and GitPushTool)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 120+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (099-121) demonstrate efficient implementation of identical features in 10-15 minutes
  - Straightforward imperative code pattern (no validation) keeps implementation simple
  - Helper functions available in content_generators.py can be reused (similar to feature_121_markdown_file_creation.py)

