decisions:
  - title: "Content Generation Framework"
    chosen: "Use CrewAI LLM interface (get_reasoning_llm) for Claude API integration"
    rejected:
      - "Direct Anthropic SDK calls — inconsistent with project architecture; duplicates LLM initialization logic already centralized in sheep.config.llm"
      - "Hardcoded content — inflexible and defeats purpose of automated generation; inconsistent with feature intent"
      - "Other LLM providers — project standardizes on Claude via CrewAI"
    rationale: >
      CrewAI's get_reasoning_llm() function centralizes Claude API initialization and manages model configuration consistently.
      This approach is proven across 120+ similar features (099-121). The codebase provides generate_markdown_content() in
      content_generators.py with prompt template that generates H1 heading + 2-3 sentences and validates output format.
      Reusing this established helper ensures consistency and avoids reinventing LLM integration.

  - title: "File I/O Implementation"
    chosen: "Use Python pathlib.Path with open() context manager, encoding set to UTF-8"
    rejected:
      - "os.path.join() + open() — legacy approach; pathlib is the modern Python 3.11+ standard"
      - "Third-party file libraries — unnecessary overhead; pathlib handles all requirements built-in"
    rationale: >
      Python 3.11+ (project requirement per pyproject.toml) makes pathlib the idiomatic choice for path handling.
      The established pattern in content_generators.py uses open() with encoding=\"utf-8\" (line 128) which guarantees
      UTF-8 without BOM. No external dependencies needed; standard library is sufficient and proven.

  - title: "Git Integration Approach"
    chosen: "Use GitCommitTool and GitPushTool from src/sheep/tools/ via content_generators.py wrapper functions"
    rejected:
      - "Direct subprocess git commands — duplicates existing tools; reinvents error handling and logging"
      - "GitPython library — adds external dependency when project uses subprocess-based tools; inconsistent"
      - "Manual bash scripts — platform-incompatible; loses structured error handling"
    rationale: >
      The codebase provides GitCommitTool and GitPushTool with standardized error handling and logging. These are integrated
      into wrapper functions in content_generators.py (commit_markdown_file, push_markdown_file) that handle conventional
      commit format. Feature 121 demonstrates this pattern works reliably across 120+ features. Reusing existing tools
      maintains consistency and avoids code duplication.

  - title: "Implementation Module Location"
    chosen: "Create feature_122_markdown_file_creation.py in src/sheep/features/ following established pattern"
    rejected:
      - "Inline in build/run script — isolates feature from project structure; harder to discover and integrate"
      - "Root-level script — clutters repository; source code belongs in src/sheep/"
      - "Direct in content_generators.py — mixes utilities with feature-specific implementations"
    rationale: >
      All features (099-121) follow identical structure: feature_XXX_markdown_file_creation.py modules in src/sheep/features/
      that import generic helpers. This structure is discoverable, testable, and integrates cleanly with automated system.
      Feature 121 demonstrates the proven approach with metadata constants, orchestration function, and main entry point.

  - title: "Validation Strategy"
    chosen: "Include comprehensive post-write validation using validate_markdown_file() from content_generators.py"
    rejected:
      - "Skip validation entirely — misses encoding, line ending, and format issues that violate non-functional requirements"
      - "Minimal validation (file existence only) — insufficient to catch format violations and encoding problems"
    rationale: >
      The spec resolved toward straightforward imperative pattern, but content_generators.py provides validate_markdown_file()
      (lines 150-244) which validates UTF-8 encoding without BOM, LF line endings, H1 heading format, sentence count, and
      file size. Feature 121 includes this validation (line 79) after writing. This lightweight validation is proven and
      essential for meeting NFR-1 through NFR-3. It's part of the established pattern across features 099-121.

  - title: "Commit Message Format"
    chosen: "Conventional commit: feat(122): Create markdown file test-duijn0.md with prose content"
    rejected:
      - "Generic message (e.g., \"Add test file\") — loses context; violates conventional commits specification used project-wide"
      - "Complex dynamic message — unnecessary complexity; simple format from feature 121 works reliably"
    rationale: >
      The spec explicitly requires this message format (FR-5). It follows Conventional Commits specification used by project
      and provides clear traceability. Feature 121 implements this exact format (line 84). Structure (feat + feature number
      + filename) enables automated changelog generation and maintains consistency across test suite.

