content: |
  ## Architecture Overview

  Feature 122 integrates seamlessly into the existing Sheep platform architecture by reusing established patterns
  and proven helper functions from content_generators.py. The implementation consists of a single feature module
  that orchestrates existing utilities for content generation, file I/O, validation, and git operations.

  ### Component Structure

  **Feature Module: src/sheep/features/feature_122_markdown_file_creation.py**
  - Metadata constants (FEATURE_NUMBER, FEATURE_NAME, etc.)
  - Orchestration function create_markdown_file_feature() that sequences the workflow
  - Main entry point for standalone execution

  **Reused Helper Functions (from sheep.content_generators.py)**
  - generate_markdown_content(): Calls CrewAI LLM to generate H1 heading + 2-3 sentences
  - write_markdown_file(): Writes file to disk with UTF-8 encoding and validates path
  - validate_markdown_file(): Comprehensive validation (encoding, line endings, format, size)
  - commit_markdown_file(): Stages file and creates git commit with conventional message
  - push_markdown_file(): Pushes commit to remote branch

  **Existing Infrastructure Used**
  - sheep.config.llm: Centralized LLM initialization via get_reasoning_llm()
  - sheep.tools.git_tools: GitCommitTool and GitPushTool with standardized error handling
  - sheep.observability.logging: Structured logging via get_logger()

  ### Data Flow

  Orchestration → Generate Content → Write File → Validate Output → Stage & Commit → Push to Remote

  Each step logs progress at appropriate levels (DEBUG for details, INFO for milestones) and raises
  exceptions with context if any step fails.

  ## Key Design Decisions

  ### 1. Reuse Existing Helper Functions

  **Decision:** Import and use helper functions from sheep.content_generators.py rather than reimplementing

  **Alternatives Considered:**
  - Implement all logic directly in feature module (violates DRY principle, creates duplication)
  - Create new high-level wrapper function (obscures individual steps, harder to debug)

  **Rationale:**
  - Proven across 120+ features (099-121) in the exact pattern we're following
  - Centralizes common logic in maintainable utility module
  - Eliminates code duplication and maintenance burden
  - Ensures consistency with established patterns across codebase
  - Reduces implementation time and risk of introducing bugs

  ### 2. Straightforward Orchestration (vs. Single-Function Wrapper)

  **Decision:** Use individual helper imports with explicit sequential calls in main function

  **Alternatives Considered:**
  - Single high-level create_markdown_file(filename, topic) wrapper function (less visibility)
  - Inline all code in feature module (code duplication, maintenance burden)

  **Rationale:**
  - Feature 121 demonstrates this approach is effective and maintainable
  - Provides clear visibility into each step of the workflow
  - Enables logging at each stage for debugging and monitoring
  - More flexible for error handling and conditional logic
  - Easier to understand the complete workflow when reading the code

  ### 3. CrewAI LLM Framework for Content Generation

  **Decision:** Use CrewAI's get_reasoning_llm() interface via existing generate_markdown_content() helper

  **Alternatives Considered:**
  - Direct Anthropic SDK calls (duplicates LLM initialization logic in sheep.config.llm)
  - Hardcoded content (inflexible, defeats purpose of automated generation)
  - Other LLM providers (project standardizes on Claude via CrewAI)

  **Rationale:**
  - Project architecture centralizes LLM initialization in sheep.config.llm
  - CrewAI handles authentication, configuration, and error handling
  - Single point of configuration for Claude API across entire project
  - Proven across all 120+ preceding features in this series

  ### 4. Python pathlib for File I/O

  **Decision:** Use pathlib.Path with open(encoding=\"utf-8\") via existing write_markdown_file() helper

  **Alternatives Considered:**
  - os.path.join() + open() (legacy approach, less readable)
  - Third-party file libraries (unnecessary dependencies, pathlib is sufficient)

  **Rationale:**
  - Python 3.11+ (project requirement) makes pathlib idiomatic standard
  - Standard library with no external dependencies
  - encoding=\"utf-8\" guarantees UTF-8 without BOM
  - Consistent with existing content_generators.py implementation (proven safe)

  ### 5. Comprehensive Validation

  **Decision:** Use validate_markdown_file() helper to verify all non-functional requirements before git operations

  **Alternatives Considered:**
  - Skip validation (risks violating spec NFR-1 through NFR-3)
  - Minimal validation (file exists only) (insufficient, catches only obvious errors)

  **Rationale:**
  - Essential for meeting spec requirements: UTF-8 without BOM (NFR-1), LF line endings (NFR-2), file size 300-600 bytes (NFR-3)
  - Lightweight helper function is proven in feature 121 (lines 79)
  - Catches encoding/format issues before committing to git
  - Validates H1 heading format, sentence count (2-3), and complete structure

  ### 6. Conventional Commit Message Format

  **Decision:** Create commits with message: \"feat(122): Create markdown file test-duijn0.md with prose content\"

  **Alternatives Considered:**
  - Generic message like \"Add test file\" (loses context, violates project standards)
  - Dynamic message with topic (unnecessary complexity, simple format works reliably)

  **Rationale:**
  - Spec explicitly requires this format (FR-5)
  - Follows Conventional Commits specification used project-wide
  - Feature 121 implements this exact format reliably (line 84)
  - Provides clear traceability and enables automated changelog generation

  ## Implementation Strategy

  ### Phase 1 (Foundation) → Phase 2 (Implementation) → Phase 3 (Verification)

  **Why this order:**
  - Phase 1 must come first: the module structure is required before any implementation
  - Phase 2 comes after Phase 1: builds the feature logic step-by-step using existing helpers
  - Phase 3 comes last: validates the complete workflow, which depends on Phase 2 being complete

  **Within Phase 2:**
  - Tasks are strictly ordered by dependency
  - Each task builds on output from the previous task
  - Content generation (task-2) produces the content string used by file creation (task-3)
  - File creation (task-3) produces the file validated by validation (task-4)
  - Validation (task-4) must complete before git operations (task-5)
  - Main orchestration (task-6) integrates all components

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API failure during content generation | generate_markdown_content() validates responses; invalid responses fail fast with clear error message before file creation |
  | File write permission denied | write_markdown_file() validates path and uses standard system permissions; feature fails fast if write fails |
  | Git operations fail (commit or push) | GitCommitTool and GitPushTool have built-in error handling; failures are caught, logged, and re-raised with context |
  | File encoding incorrect (not UTF-8) | write_markdown_file() explicitly sets encoding=\"utf-8\" and validate_markdown_file() checks for BOM |
  | Line endings incorrect (not LF) | validate_markdown_file() explicitly checks for LF and rejects CRLF/CR; Python file I/O on Unix handles this correctly |
  | File size outside 300-600 byte range | validate_markdown_file() checks file size and rejects if outside range with clear error message |
  | Path traversal vulnerability in filename | write_markdown_file() validates filename to prevent \"..\" or \"/\" characters; only simple filenames accepted |
  | Feature branch doesn't exist | Per spec, branch feat/122-markdown-file-creation-42732e is pre-created; GitPushTool operates in current branch context |
  | Duplicate file conflict (test-duijn0.md already exists) | Feature design assumes file doesn't exist; git workflow will error appropriately if file already staged |
  | Markdown format validation fails | validate_markdown_file() provides specific error for each validation type; content regeneration or manual adjustment required |
