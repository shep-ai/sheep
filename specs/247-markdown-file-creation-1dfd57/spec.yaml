# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-mz0zi2.md) at the repository root with a title and prose content, demonstrating the core capability of automated file creation and git integration.

  This is a continuation of the markdown-file-creation pattern established across features 069-246, with identical requirements and implementation approach. Over 240+ similar test files already exist in the repository as precedents, demonstrating the robustness and simplicity of this pattern.

  ## Success Criteria

  - [ ] File test-mz0zi2.md created at repository root
  - [ ] File contains exactly one H1 markdown heading (CommonMark syntax: #)
  - [ ] File contains 2-3 sentences of prose content after heading
  - [ ] Heading and prose separated by exactly one blank line
  - [ ] File is valid markdown per CommonMark specification
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File size is 400-600 bytes (natural outcome of correct structure)
  - [ ] File is staged in git working tree (git add performed)
  - [ ] Commit exists with message format: "feat(247): create markdown file test-mz0zi2.md with prose content"
  - [ ] Commit is on feature branch feat/247-markdown-file-creation-1dfd57
  - [ ] Changes pushed to remote origin
  - [ ] No existing files modified or overwritten
  - [ ] No source code changes in /src/sheep/ or elsewhere
  - [ ] No test files modified

  ## Functional Requirements

  - **FR-1**: Create file at repository root with exact filename `test-mz0zi2.md`
  - **FR-2**: File must contain exactly one H1 markdown heading using CommonMark syntax (`# Heading Text`)
  - **FR-3**: Heading must be separated from prose content by exactly one blank line
  - **FR-4**: File must contain 2-3 sentences of prose content after the heading
  - **FR-5**: File must be valid markdown per CommonMark specification
  - **FR-6**: File must be staged in git working tree using `git add test-mz0zi2.md`
  - **FR-7**: A commit must be created with conventional commit message: `feat(247): create markdown file test-mz0zi2.md with prose content`
  - **FR-8**: Commit must be made on feature branch `feat/247-markdown-file-creation-1dfd57`
  - **FR-9**: Changes must be pushed to remote `origin` on the feature branch
  - **FR-10**: No existing files in the repository may be modified or overwritten
  - **FR-11**: No source code changes may be made to `/src/sheep/` or any other application code

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding without BOM
  - **NFR-2**: File must use LF (Unix-style `\n`) line endings, not CRLF
  - **NFR-3**: File size should naturally fall in the 400-600 bytes range based on heading and prose content
  - **NFR-4**: Implementation must follow the well-established pattern from 240+ existing test files for consistency
  - **NFR-5**: No external dependencies beyond Python standard library (pathlib) should be introduced
  - **NFR-6**: Implementation must be simple and straightforward with minimal complexity
  - **NFR-7**: No test coverage or documentation additions required beyond the markdown file itself

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content use a template-based or unique-per-file approach? | Template-based prose | Recommended for consistency with established pattern, speed (S size estimate), and the fact that test files prioritize consistency over uniqueness. The requirement "about anything" gives full flexibility in topic selection. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Root directory**: Contains README, configuration files, and accumulated markdown test files (240+ total)
  - **src/sheep/**: Main source code for the Sheep platform
    - agents/: Agent definitions and configurations
    - config/: Configuration management (settings, LLM factory)
    - flows/: Flow definitions and orchestration logic
    - observability/: Logging and tracing (Langfuse integration)
    - tools/: Reusable tools for git operations and file manipulation
    - features/: Feature implementations
  - **specs/**: Feature specifications directory with 247+ subdirectories (one per feature)
  - **tests/**: Test suite for the platform
  - **.github/workflows/**: CI/CD pipeline configuration

  ### Architecture Patterns

  **Sheep Platform Architecture**:
  - Multi-phase feature development: Analysis → Requirements → Implementation → Review → Completion
  - Modular agent-based design using CrewAI framework
  - Separation of concerns: Flows handle structure, Crews handle AI intelligence
  - Observable execution with Langfuse tracing and metrics
  - Git-based workflow: Feature branches, conventional commits, automated pushing

  **File Creation Pattern** (Established across 240+ features):
  - Target location: Repository root directory
  - File format: Markdown (.md extension)
  - Content structure: H1 heading + blank line + 2-3 sentences of prose
  - Encoding: UTF-8 without BOM
  - Line endings: LF (Unix-style, \\n)
  - File size: Naturally 400-600 bytes based on heading and prose
  - File naming: Pre-specified in feature requirements (test-mz0zi2.md)

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment, required per pyproject.toml
  - **pathlib.Path**: Standard library module for file I/O, no external dependencies
  - **Git/GitPython**: Version control, staging, committing, and pushing changes
  - **Markdown (CommonMark)**: Standard file format for content
  - **CrewAI**: Agentic orchestration framework (context but not directly used for file creation)
  - **Pydantic**: Configuration management

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-mz0zi2.md) to existing collection of 240+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-246; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, tools, or platform functionality |

  ## Dependencies

  - **Git repository**: Feature branch feat/247-markdown-file-creation-1dfd57 must exist (pre-created)
  - **File system**: Write access to repository root directory (standard development environment)
  - **Established pattern**: 240+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python 3.11+**: Runtime environment; pathlib.Path available in standard library (no external dependencies)
  - **File naming**: Filename test-mz0zi2.md is provided in feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 240+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-246) demonstrate efficient implementation of identical features
  - File naming (test-mz0zi2.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 176+ prior implementations
  - Zero complexity in content generation — simple prose creation with any topic

  ---

  _Requirements phase complete — feature has clear, measurable success criteria and straightforward implementation path._
