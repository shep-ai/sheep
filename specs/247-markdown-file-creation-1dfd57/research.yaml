decisions:
  - title: "File Creation Method"
    chosen: "Use Python pathlib.Path with open() for file I/O"
    rejected:
      - "Using os.path module — older API, less Pythonic, not the codebase standard. pathlib is modern (Python 3.4+) and matches existing codebase patterns (file_tools.py uses pathlib.Path)"
      - "Using external file handling libraries — unnecessary dependency bloat. Python standard library pathlib is sufficient and already used throughout the codebase"
    rationale: >
      pathlib.Path is the modern, Pythonic standard for file operations in Python 3.4+. The codebase already uses this pattern consistently (see src/sheep/tools/file_tools.py). It provides intuitive path manipulation, cross-platform compatibility, and is part of the Python standard library with no external dependencies. Matches the established pattern across 240+ test files created with this approach.

  - title: "Line Ending Handling"
    chosen: "Write file with explicit LF line endings using newline='' parameter in open()"
    rejected:
      - "Use default system line endings — On Windows, this would produce CRLF by default. The spec explicitly requires LF (Unix-style) endings. Would violate NFR-2"
      - "Rely solely on git core.autocrlf=true conversion — While this works (git converts CRLF to LF on commit), it is implicit and fragile. Better to be explicit about line endings at the file creation layer for clarity and reliability"
      - "Post-processing with sed/str.replace() — Adds unnecessary complexity and performance overhead. Better to write correct line endings initially"
    rationale: >
      The spec explicitly requires LF (Unix-style newline) line endings (NFR-2), not CRLF. On Windows (the development environment), Python's default text mode converts newline to carriage-return-newline (CRLF). Using open(..., newline='') in text mode tells Python \"I am handling line endings myself, do not convert them\". This ensures newline stays as newline in the file. While git's core.autocrlf=true will also normalize these (CRLF to LF on commit), being explicit at the file creation layer is more reliable and clearer in intent. This matches the practice of being explicit about encoding (encoding='utf-8').

  - title: "Text Encoding"
    chosen: "UTF-8 encoding without BOM, using encoding='utf-8' parameter in open()"
    rejected:
      - "UTF-8 with BOM — Spec explicitly requires without BOM (NFR-1). BOM is unnecessary for UTF-8 and can cause parsing issues with some tools"
      - "ASCII encoding — Too restrictive, does not support full Unicode character range. UTF-8 is standard, backward-compatible with ASCII, and recommended"
      - "Other encodings (latin-1, iso-8859-1) — No justification for non-standard encodings. UTF-8 is the modern standard for web and text files"
    rationale: >
      Spec explicitly requires UTF-8 without BOM (NFR-1). Python 3's default encoding is UTF-8, but explicitly specifying encoding='utf-8' in the open() call is a best practice for clarity and ensures consistent behavior across platforms. Python's open() with encoding='utf-8' does not add a BOM by default (only utf-8-sig does). This matches the existing file_tools.py pattern which uses encoding='utf-8'.

  - title: "Prose Content Generation"
    chosen: "Template-based prose — pre-written sentences about a single topic"
    rejected:
      - "LLM-generated unique content (Claude API) — Requires API calls, adds latency and cost, introduces external dependency on Claude API. Unnecessary for test files where consistency is valuable. This feature is estimated as size S (10-15 min); LLM approach would expand this significantly"
      - "Pattern-matching from existing files — Requires parsing 240+ existing files, implementing similarity matching, and template extraction. Over-engineered for a simple test file. No performance or quality benefit over simple template"
    rationale: >
      Template-based approach is already decided in the spec with detailed rationale: (1) Requirement states \"about anything\", giving full flexibility in topic selection; (2) This is a test file where consistency matters more than uniqueness; (3) Template approach is fastest, matching the S size estimate; (4) Avoids unnecessary API calls and complexity; (5) Aligns with the established pattern across 240+ test files. The template should be 2-3 sentences on a single coherent topic, matched to the tone of existing files (e.g., \"The Art of Learning\", \"The Art of Thoughtful Design\").

  - title: "Git Integration"
    chosen: "Use subprocess.run() to execute git commands (add, commit, push)"
    rejected:
      - "Use GitPython library — While available as dependency (gitpython>=3.1.0), it is unnecessary for simple sequential git operations. Subprocess gives direct control, is simpler for this use case, and matches the pattern in git_tools.py. GitPython would be justified for complex branching/merging logic, not for simple add/commit/push"
      - "Use shell script or os.system() — Less safe (command injection risks), less portable, harder to parse output and handle errors. subprocess.run() is the recommended approach"
      - "Manual file system manipulation without git commands — Does not satisfy FR-6 (git add), FR-7 (commit), FR-9 (push). Must use actual git commands"
    rationale: >
      subprocess.run() is the standard, safe way to execute external commands in Python. The codebase already uses this pattern extensively in git_tools.py (_run_git helper function). For simple sequential git operations (git add, git commit, git push), subprocess is clearer and more direct than GitPython. It allows capturing output, checking return codes, and handling errors gracefully. Matches the established pattern: git_tools.py uses subprocess with capture_output=True and check=True for reliable error handling.

  - title: "Repository Root Directory"
    chosen: "Create file at repository root (Path('.') / 'test-mz0zi2.md')"
    rejected:
      - "Create in specs/ directory — File spec explicitly requires \"repository root\". specs/ is for feature specifications, not test files"
      - "Create in tests/ directory — The requirement and pattern clearly indicate root directory. tests directory is for pytest test code, not markdown test files"
    rationale: >
      The feature spec explicitly requires file to be created \"at the repository root\" (FR-1). This is confirmed by examining 240+ existing test files (test-zlzcz0.md, test-zo2ge0.md, etc.) which are all in the root directory. The .md files in root represent the \"test files\" for the Sheep platform's automated markdown creation capability, distinct from source code tests in /tests/.

