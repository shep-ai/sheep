# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown file following the well-established pattern from 240+ existing test files
  in the Sheep repository. The implementation is straightforward and requires no architectural complexity:

  1. **File Creation Layer**: Use Python pathlib.Path to construct file path and write markdown content with explicit
     encoding and line ending parameters. This is the same approach used in the existing codebase (src/sheep/tools/file_tools.py).

  2. **Git Integration Layer**: Execute sequential git commands (add → commit → push) using subprocess.run(). This matches
     the pattern established in src/sheep/tools/git_tools.py and is simpler than GitPython for sequential operations.

  3. **Content Structure**: Template-based prose (2-3 sentences on a coherent topic) provides consistency with existing
     test files and avoids unnecessary complexity. The requirement states "about anything", providing full flexibility.

  The implementation has no dependencies beyond Python standard library (pathlib, subprocess) and no impact on
  application source code or existing files.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path

  **Chosen**: Use pathlib.Path.write_text() with explicit encoding and line ending parameters

  **Rationale**:
  - Modern, Pythonic API (Python 3.4+, we require 3.11+)
  - Already used throughout codebase (src/sheep/tools/file_tools.py)
  - Cross-platform path handling built-in
  - No external dependencies (standard library)

  **Alternative considered**: os.path (rejected as older API, less Pythonic)

  ### 2. Line Ending Handling: Explicit LF with newline=''

  **Chosen**: Use `newline=""` parameter in text mode to write LF line endings explicitly

  **Why this matters**:
  - Spec requires LF line endings (NFR-2), not CRLF
  - Windows development environment defaults to CRLF
  - Python's text mode converts \\n to \\r\\n on Windows by default
  - Using `newline=""` prevents this automatic conversion
  - Git's core.autocrlf=true is configured but relying on it is implicit; being explicit is clearer

  **Implementation**: Construct content with explicit newlines, write using `path.write_text(content, encoding='utf-8', newline='')`

  **Alternative considered**: Rely solely on git's autocrlf conversion (rejected as implicit and fragile)

  ### 3. Encoding: UTF-8 without BOM

  **Chosen**: UTF-8 encoding via `encoding='utf-8'` parameter in write_text()

  **Why**:
  - Spec explicitly requires UTF-8 without BOM (NFR-1)
  - Python's encoding='utf-8' parameter does NOT add BOM (only utf-8-sig does)
  - UTF-8 is the modern standard, backward-compatible with ASCII
  - Matches existing codebase pattern (file_tools.py uses encoding='utf-8')

  **Alternative considered**: UTF-8-sig (rejected because it adds BOM, violating spec)

  ### 4. Prose Content: Template-Based Approach

  **Chosen**: Pre-written template sentences on a coherent topic (2-3 sentences)

  **Why**:
  - Requirement states "about anything", giving full flexibility in topic selection
  - Test files prioritize consistency over uniqueness
  - Avoids unnecessary complexity and API calls
  - Aligns with S (small) size estimate (10-15 min)
  - Matches established pattern across 240+ existing test files

  **Alternative considered**:
  - LLM-generated unique content (rejected: adds latency, cost, complexity, unnecessary for test files)
  - Pattern-matching from existing files (rejected: over-engineered, no quality benefit)

  ### 5. Git Integration: subprocess.run()

  **Chosen**: Execute git commands via subprocess.run() with list-based arguments

  **Three sequential commands**:
  1. `git add test-mz0zi2.md`
  2. `git commit -m "feat(247): create markdown file test-mz0zi2.md with prose content"`
  3. `git push -u origin feat/247-markdown-file-creation-1dfd57`

  **Why subprocess over GitPython**:
  - Direct control over git commands for simple sequential operations
  - Matches established codebase pattern (src/sheep/tools/git_tools.py)
  - No additional abstraction layer needed
  - list-based arguments prevent shell injection attacks (not shell=True)

  **Alternative considered**: GitPython library (rejected: unnecessary abstraction for simple operations)

  ### 6. File Location: Repository Root

  **Chosen**: Create file at . (repository root) as test-mz0zi2.md

  **Why**:
  - Spec explicitly requires "repository root" (FR-1)
  - Examined 240+ existing test files: all are in repo root (not in /tests/ or /specs/)
  - Feature branch working directory is set to repo root
  - Consistent with established pattern from features 244-246

  **Alternative considered**: tests/ or specs/ directories (rejected: violates spec requirement)

  ## Implementation Strategy

  ### Phase 1: File Creation (Dependencies: None)

  Create the markdown file with all required properties in a single write operation:

  1. Construct prose content as template-based string with explicit newlines
  2. Use pathlib.Path to write file with explicit encoding and line ending parameters
  3. Validate file exists, has correct encoding, line endings, size, and markdown validity

  This phase is self-contained and requires no external state.

  ### Phase 2: Git Integration (Dependencies: Phase 1 - file exists)

  Execute git operations sequentially to stage, commit, and push changes:

  1. Run `git add test-mz0zi2.md` to stage the file
  2. Run `git commit` with conventional commit message format
  3. Run `git push -u origin` to push to the feature branch
  4. Verify each operation succeeds before proceeding to the next

  All git operations use subprocess.run() with check=True for error handling.

  ### Ordering Rationale

  Phase 1 must complete before Phase 2 because:
  - File must exist on disk before git can stage it
  - Git operations require the file to be present and untracked initially
  - Sequential ordering matches the natural workflow: create, then integrate with version control

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Line endings differ from spec** | Write with explicit `newline=''` parameter. Do not rely on implicit git conversion. Verify with binary inspection if needed. |
  | **File encoding incorrect** | Use explicit `encoding='utf-8'` parameter. Python 3 defaults to UTF-8, but explicit is safer. Verify with `file` command. |
  | **Git command fails** | Use subprocess with `check=True` to raise CalledProcessError on failure. Catch and log error clearly. |
  | **Filename wrong or file in wrong location** | Feature spec provides exact filename test-mz0zi2.md. Use pathlib.Path to construct relative path from repo root. |
  | **Prose content violates markdown** | Use simple H1 heading (CommonMark: # ) followed by plain text. No complex syntax that could cause parsing issues. Validate with markdown parser if needed. |
  | **Existing files overwritten** | Create only new file test-mz0zi2.md. Verify file doesn't exist before writing (or use write_text which will overwrite but file shouldn't exist). No modifications to other files. |
  | **Commit message format incorrect** | Hard-code exact conventional commit format: `feat(247): create markdown file test-mz0zi2.md with prose content`. No variable interpolation. |
  | **Push fails due to remote issues** | Use `git push -u origin` to create upstream tracking. If push fails, verify network connectivity and that feature branch exists on remote. |

  ---

  _Plan complete. Implementation is straightforward: single file creation in Phase 1, git integration in Phase 2. No architectural complexity, follows established patterns from 240+ similar features._
