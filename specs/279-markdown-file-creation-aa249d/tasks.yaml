content: |
  ## Summary

  This feature requires 4 concrete tasks implementing markdown file creation using the existing
  content_generators.py orchestration module. The workflow is straightforward and proven across
  278+ prior identical features.

  **Task 1** (Phase 1 - Foundation) creates a minimal implementation script that calls the
  existing `create_markdown_file()` orchestration function. This 4-5 line script triggers the
  complete workflow: content generation via Claude API, file write with proper encoding,
  automated validation, git commit with conventional message, and push to remote.

  **Task 2** (Phase 2 - Validation) develops a comprehensive test suite covering all success
  criteria: file existence, structure (H1 heading + blank line), content (2-3 sentences),
  encoding (UTF-8 without BOM), line endings (Unix LF), file size (400-600 bytes), and git
  integration. Tests serve as executable specification and ensure feature quality.

  **Task 3** (Phase 3 - Execution) executes the implementation script and verifies success.
  Runs the test suite to confirm all success criteria are met. This gate ensures quality
  before proceeding to commit.

  **Task 4** (Phase 3 - Integration) commits the feature with a conventional commit message
  and pushes to the remote repository. Completes the feature workflow.

  The total estimated effort is 3 hours across 3 phases. Phase 1 (foundation) is quick due
  to the existing orchestration module. Phase 2 (validation) is the longest, developing
  comprehensive tests. Phase 3 (execution) is relatively quick, primarily executing and
  verifying success criteria.

  Dependencies flow linearly: Task 1 → Task 2 → Task 3 → Task 4. Each task builds on
  successful completion of the previous task. This ensures a clean progression from
  implementation → validation → execution → integration.
