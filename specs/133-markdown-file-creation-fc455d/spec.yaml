content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following a well-established pattern. This feature creates a single test markdown file (`test-fsakw9.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 001-132.
  Over 130+ similar test files already exist in the repository as precedents (test-*.md files
  at the root directory), making this a highly standardized, repetitive feature with proven
  implementation patterns and reusable infrastructure.

  ## Success Criteria

  - [ ] File `test-fsakw9.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is approximately 400-600 bytes (typical range for this pattern)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git
  - [ ] Git commit exists with conventional message: `feat(133): create markdown file test-fsakw9.md with prose content`
  - [ ] Commit is on feature branch `feat/133-markdown-file-creation-fc455d`
  - [ ] Changes have been pushed to remote origin

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 130+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into modules:
    - `content_generators.py`: Reusable functions for markdown creation, validation, and git operations
    - `features/`: Directory with feature implementations (feature_001.py through feature_132.py)
    - `config/`: Configuration management (LLM factory, settings)
    - `observability/`: Logging and tracing infrastructure
    - `tools/`: Git tools (GitCommitTool, GitPushTool)
    - `cli.py`: Command-line interface
  - **specs/**: Feature specification directory with subdirectories for each feature (specs/133-markdown-file-creation-fc455d/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build tools, metadata)

  Test markdown files at the repository root are artifacts of the markdown-file-creation feature pattern
  and do not form part of the application source code.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (130+ identical precedents):

  All markdown-file-creation features follow this identical pattern:

  1. **Content Format**: Every file contains:
     - Line 1: H1 markdown heading (`# Title`)
     - Line 2: Blank line (separator)
     - Lines 3+: Exactly 2-3 sentences of grammatically correct prose
     - Trailing newline (Unix convention)

  2. **File Properties**:
     - UTF-8 encoding without BOM
     - Unix LF line endings (`\n`), never CRLF
     - Filename: `test-{random_id}.md` or specific name per feature
     - Location: Repository root directory (no subdirectories)
     - Size: Typically 400-600 bytes (guideline, not strict enforcement)

  3. **Implementation Pattern** (features 001-132):
     - Create feature module in `src/sheep/features/feature_{N}_markdown_file_creation.py`
     - Define constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME
     - Implement function `create_feature_{N}_markdown_file(repo_path=None)`
     - Call orchestration functions from `src/sheep/content_generators.py`:
       - `generate_markdown_content()`: LLM-generated H1 heading + 2-3 sentences
       - `write_markdown_file(content, filename)`: Write to disk with UTF-8 encoding
       - `validate_markdown_file(filepath)`: Validate all format and encoding requirements
       - `commit_markdown_file(filepath, content, repo_path, custom_message)`: Stage and commit
       - `push_markdown_file(repo_path)`: Push to remote with upstream tracking

  4. **Git Workflow Pattern**:
     - Feature branch pre-created: `feat/133-markdown-file-creation-fc455d`
     - Create/write file to repository root
     - Stage with git add
     - Commit with conventional format: `feat(133): create markdown file test-fsakw9.md with prose content`
     - Push to feature branch with upstream tracking
     - No modifications to source code (/src/sheep/), tests, or configuration

  5. **Reusable Infrastructure** (already implemented):
     - `content_generators.py` provides all necessary functions (lines 1-440)
     - `GitCommitTool` and `GitPushTool` from `sheep.tools` module (imported in content_generators)
     - LLM factory (`sheep.config.llm.get_reasoning_llm()`) for content generation
     - Structured logging via `sheep.observability.logging.get_logger()`

  ### Relevant Technologies

  - **Python 3.11+**: Required by pyproject.toml; project uses type hints, pathlib, standard library
  - **pathlib.Path**: Standard library for cross-platform file I/O operations
  - **CrewAI**: LLM orchestration framework; used for calling Claude API with structured prompts
  - **Claude API**: Anthropic's reasoning model accessed via CrewAI LLM factory for content generation
  - **Git**: Version control; file staging, commits, branch operations, push with upstream tracking
  - **Markdown (CommonMark)**: Simple text format with H1 heading and prose; validated in content_generators.py
  - **UTF-8 Encoding**: Standard text encoding with BOM detection and validation

  ### Content Generation Pattern

  The `generate_markdown_content()` function (content_generators.py:26-67) uses Claude API:

  1. Constructs prompt requesting H1 heading + exactly 2-3 sentences (prompt: lines 12-23)
  2. Calls Claude via `get_reasoning_llm()` with structured message
  3. Extracts response and validates format:
     - Starts with `# ` (H1 heading marker)
     - Contains 2-3 periods (sentence count)
     - Content length > 50 characters
  4. Ensures trailing newline (Unix convention)
  5. Returns validated markdown string for writing to file

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-fsakw9.md) to existing collection of 130+ test files; no modifications to existing files or directory structure |
  | src/sheep/features/ | Low | Adds one new feature module (feature_133_markdown_file_creation.py) following established pattern; no modifications to existing modules |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory modifications, no overwrites, no deletions |
  | Git Repository | Low | Single commit and push following established pattern from features 001-132; no branch/merge complexity, no destructive operations |
  | Content Generators Module | None | Uses existing functions in content_generators.py; no modifications required (functions fully implement the pattern) |
  | Source Code (src/sheep/) | None | Feature implementation does not depend on or require modifications to config, tools, observability, or CLI modules |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or feature directories |
  | Tests | None | No test modifications required for this feature type |
  | Configuration | None | No changes to pyproject.toml, environment variables, or git configuration required |

  ## Dependencies

  - **Git repository**: Feature branch `feat/133-markdown-file-creation-fc455d` must exist (pre-created)
  - **File system**: Write access to repository root directory (available)
  - **Established pattern**: 130+ test files and feature implementations provide clear precedent
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **LLM API**: Claude API access via Anthropic SDK (CrewAI integration) configured in environment
  - **Python 3.11+**: Runtime requirement (already satisfied by project)
  - **pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Content generators module**: `src/sheep/content_generators.py` with all helper functions
  - **Git tools**: GitCommitTool and GitPushTool from `sheep.tools` module (already implemented)

  ## Implementation Strategy

  The implementation will follow the proven pattern from features 001-132:

  1. **Create feature module**: `src/sheep/features/feature_133_markdown_file_creation.py`
     - 120-130 lines of well-documented code
     - Define FEATURE_NUMBER=133, MARKDOWN_FILENAME="test-fsakw9.md"
     - Implement `create_feature_133_markdown_file(repo_path=None)` function
     - Call functions from content_generators in sequence: generate → write → validate → commit → push
     - Add logging at each step
     - Follow docstring format from features 001-132 (parameter types, return types, exceptions)

  2. **Integration points**: No modifications to other files required
     - content_generators.py provides all helper functions
     - Feature can be run standalone: `python -m src.sheep.features.feature_133_markdown_file_creation`
     - Feature can be imported: `from src.sheep.features.feature_133_markdown_file_creation import create_feature_133_markdown_file`

  3. **Validation**: The feature will automatically validate:
     - File created at repository root with correct name
     - Markdown format with H1 heading
     - Exactly 2-3 sentences in prose content
     - UTF-8 encoding without BOM
     - Unix LF line endings
     - File size 400-600 bytes (typical)
     - Conventional commit message format
     - Successful push to remote

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort feature:

  - **Copy existing feature module**: ~2 minutes (use feature_132 as template, update feature number and filename)
  - **Adapt constants and docstrings**: ~3 minutes (FEATURE_NUMBER, MARKDOWN_FILENAME, function name)
  - **Update function calls**: ~2 minutes (modify logging messages and return values if needed)
  - **Testing and validation**: ~3-5 minutes (verify file created, commit message, all validations pass)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:

  - Well-established pattern with 130+ identical precedents in the repository
  - All infrastructure already implemented in content_generators.py (no utility code needed)
  - Reusable function signatures and patterns from features 001-132
  - No architectural decisions, research, or complex logic required
  - No testing, documentation beyond docstrings, or configuration changes
  - Recent feature implementations (001-132) demonstrate efficient execution of identical features
  - Copy-paste with minimal customization is the expected implementation approach
  - Implementation complexity: similar to renaming a file and updating variable names

  ---

  _Analysis phase complete — feature dependencies and affected areas mapped, size estimate confirmed as S (small)_
