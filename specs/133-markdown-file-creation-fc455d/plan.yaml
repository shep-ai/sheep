content: |
  ## Architecture Overview

  Feature 133 implements the markdown-file-creation pattern that has been successfully executed 130+ times
  across features 001-132. The architecture consists of a single feature module that orchestrates a well-defined
  workflow using existing infrastructure from content_generators.py.

  ### Pattern Foundation
  - **Proven pattern**: Features 001-132 establish a clear, tested approach to markdown file creation
  - **Reusable infrastructure**: content_generators.py provides all required functions (generate, write, validate, commit, push)
  - **Minimal new code**: Only 120-130 lines needed for the feature module (copy-paste from feature_127)
  - **No source modifications**: Feature does not require changes to any existing modules

  ### Workflow Architecture
  ```
  create_feature_133_markdown_file(repo_path=None)
    ├─ Step 1: Generate markdown content (LLM-generated via Claude API)
    ├─ Step 2: Write file to disk at repository root (test-fsakw9.md)
    ├─ Step 3: Validate file format, encoding, line endings, and content
    ├─ Step 4: Stage and commit file with conventional commit message
    └─ Step 5: Push commits to remote origin with upstream tracking
  ```

  ### Integration with Existing Systems
  - **LLM orchestration**: Uses CrewAI's LLM factory via `get_reasoning_llm()` from sheep.config.llm
  - **Content generation**: Prompt engineering and validation via `generate_markdown_content()`
  - **File I/O**: Cross-platform file handling with UTF-8 encoding and Unix line endings via `write_markdown_file()`
  - **Validation**: Comprehensive format validation via `validate_markdown_file()`
  - **Git operations**: Conventional commit staging and push via `commit_markdown_file()` and `push_markdown_file()`
  - **Observability**: Structured logging at each step via sheep.observability.logging.get_logger()

  ## Key Design Decisions

  ### Decision 1: Content Generation Method (LLM-Generated)
  **Chosen**: LLM-generated content using Claude API through CrewAI

  **Rationale**: All 130+ preceding features use this approach. The content_generators.py module provides
  proven, tested functions for prompt engineering, API integration, and response validation. This maintains
  consistency across the feature suite and provides content variety while being acceptable in performance
  (2-3 second API latency). No modifications to existing code are needed.

  ### Decision 2: File Location (Repository Root)
  **Chosen**: Create test-fsakw9.md at repository root (alongside 130+ existing test files)

  **Rationale**: All features 001-132 create markdown files at the repository root via Path.cwd() in
  write_markdown_file(). This location is hardcoded into the existing content generation pipeline.
  Changing location would require infrastructure modifications. The established pattern is proven and
  should not be altered.

  ### Decision 3: Validation Approach (Lenient Guideline)
  **Chosen**: Treat 400-600 bytes as a guideline, allow natural variation in file size

  **Rationale**: LLM-generated content inherently varies in length due to model sampling and prose
  variation. Strict byte-count enforcement would cause fragile failures for valid content. The
  validate_markdown_file() function enforces more important properties (heading presence, sentence
  count, encoding, line endings) rather than byte count. The guideline approach accommodates natural
  variation while ensuring content is substantial.

  ### Decision 4: Module Execution Model (Dual Support)
  **Chosen**: Support both standalone execution (python -m) and module import (from ... import)

  **Rationale**: All feature modules 001-127 implement both modes, providing flexibility for CLI
  workflows and programmatic integration. The __main__ guard enables standalone execution while
  the public create_feature_133_markdown_file() function enables reusability in larger workflows.

  ### Decision 5: Implementation Approach (Copy-Paste Pattern)
  **Chosen**: Copy feature_127 module as template and update only feature-specific constants

  **Rationale**: Feature 127 demonstrates the exact pattern needed (dual execution modes, proper
  logging, error handling). Copying ensures consistency and minimizes risk of introducing bugs.
  Only three elements change: FEATURE_NUMBER (133), MARKDOWN_FILENAME ("test-fsakw9.md"), and
  function name (create_feature_133_markdown_file). This approach has been successfully used for
  all 130+ features.

  ## Implementation Strategy

  ### Phase 1: Module Setup & Structure
  Create the feature module file with proper Python structure, imports, and metadata. Use feature_127
  as the template to ensure consistency with established patterns. This phase establishes the
  foundation before implementing the main logic.

  ### Phase 2: Core Function Implementation
  Implement the create_feature_133_markdown_file() function with the 5-step orchestration:
  1. Call content_generators.generate_markdown_content() for LLM-generated content
  2. Call content_generators.write_markdown_file() to persist the markdown to disk
  3. Call content_generators.validate_markdown_file() to ensure format and encoding compliance
  4. Call content_generators.commit_markdown_file() to stage and commit the file
  5. Call content_generators.push_markdown_file() to push commits to remote origin

  Add comprehensive logging at each step using sheep.observability.logging.get_logger(). Ensure
  proper error handling and return a dictionary with results (filepath, content, commit message, push result).

  ### Phase 3: Execution & Validation
  Execute the feature to generate test-fsakw9.md and verify all success criteria from the specification:
  - File exists at repository root
  - File contains H1 heading and 2-3 sentences of prose
  - File is UTF-8 encoded without BOM
  - File uses Unix LF line endings
  - File passes validate_markdown_file() checks
  - Git commit exists with conventional message: "feat(133): create markdown file test-fsakw9.md with prose content"
  - Changes are pushed to remote origin with upstream tracking

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | "Content generation fails (LLM API issue)" | CrewAI's LLM factory includes automatic retry logic for transient failures. If API is unavailable, error is logged and propagated with clear context. The feature fails fast rather than retrying indefinitely. |
  | "File already exists (overwrite concern)" | write_markdown_file() overwrites existing files by design (expected behavior). If file should be preserved, manual intervention is required. The feature is idempotent — running it again overwrites with new content. |
  | "Git operations fail (auth, network)" | Git errors are propagated from GitCommitTool and GitPushTool. If push fails (auth, network), the error is logged and the operation fails. Manual push can be performed after resolving the issue. |
  | "File encoding/line ending issues" | validate_markdown_file() enforces UTF-8 without BOM and Unix LF endings. If file doesn't meet these requirements, validation fails with descriptive error. write_markdown_file() ensures correct encoding and line endings by default. |
  | "Module import or syntax errors" | TDD approach (Phase 1) catches import errors early. Python syntax validation occurs at module load time. Comprehensive testing in Phase 3 identifies issues before they affect downstream features. |
  | "Performance regression (API latency)" | LLM API latency is expected and acceptable (~2-3 seconds). Total execution time for feature development estimated at 10-15 minutes. No optimization is needed — latency is inherent to content generation. |

  ## Files and Scope

  **Files to Create:**
  - `src/sheep/features/feature_133_markdown_file_creation.py` — Feature module with create_feature_133_markdown_file() function

  **Files to Modify:**
  - None — No existing files require modification. The feature reuses content_generators.py functions without changes.

  **Artifacts Generated:**
  - `test-fsakw9.md` — Generated markdown file at repository root (created by the feature during execution)

  **No Impact On:**
  - Source code structure or configuration
  - Existing feature implementations
  - Test suite (no unit tests added; validation is integrated into the feature)
  - Project dependencies (uses existing CrewAI and Anthropic SDK)
  - Git branch structure (feature branch pre-created, isolated)
