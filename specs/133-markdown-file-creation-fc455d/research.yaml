decisions:
  - title: "Content Generation Method"
    chosen: "LLM-generated (Claude API via CrewAI)"
    rejected:
      - "Static predefined text — breaks established pattern from 130+ features, provides no content variety, simpler but inconsistent with project conventions"
      - "Random template combinations — less coherent, not established in pattern, adds complexity without benefit"
    rationale: >
      LLM-generated content is the correct choice because all 130+ preceding markdown-file-creation features
      (001-132) use Claude API for content generation via CrewAI's LLM abstraction. The content_generators.py
      module already implements generate_markdown_content() with proper prompt engineering, error handling, and
      validation. This approach provides content variety, leverages existing infrastructure with zero modifications,
      and maintains consistency across the feature suite. The ~2-3 second API latency is acceptable for a Small-sized feature.

  - title: "File Location Strategy"
    chosen: "Repository root directory"
    rejected:
      - "Subdirectory (e.g., /test-files or /markdown-tests) — all 130+ test markdown files from features 001-132 are located at repository root; changing location would break the established pattern, require infrastructure changes across 130+ features, and necessitate modifications to content_generators.py's write_markdown_file() function"
      - "Feature-specific subdirectory under /src/sheep/features — violates separation of concerns; features produce artifacts (markdown files) at repository root, not in source code directory"
    rationale: >
      Repository root location is the correct choice because features 001-132 established a clear precedent:
      all test markdown files (test-*.md) are created at the repository root via Path.cwd() in write_markdown_file().
      Changing this location would require modifications to the content generation pipeline and break consistency.
      The established pattern is proven to work across 130+ features and should not be altered for a single feature.

  - title: "File Size Validation Approach"
    chosen: "Lenient guideline (approximately 400-600 bytes, allow natural variation)"
    rejected:
      - "Strict enforcement (exact byte count within narrow range) — LLM-generated content naturally varies in length due to model sampling and prompt randomness; strict validation would cause fragile failures for valid, coherent content; breaks established pattern from features 001-132"
      - "No size validation — reduces quality assurance; file size is a useful proxy for content completeness and presence of required elements (heading + prose)"
    rationale: >
      The guideline approach is correct because LLM-generated markdown content inherently varies in length.
      The generate_markdown_content() function uses a reasoning LLM with temperature=0.2 (low temperature
      for consistency) but prose length still varies naturally based on sentence structure and word choice.
      A ~400-600 byte guideline accommodates this natural variation while ensuring content is substantial
      (ruling out near-empty or minimal files). The established pattern from features 001-132 treats 400-600
      as a guideline, not a hard constraint, and validate_markdown_file() enforces more important properties
      (heading presence, sentence count, encoding, line endings) rather than byte count.

  - title: "Module Execution Modes"
    chosen: "Dual support (standalone executable + importable module)"
    rejected:
      - "Import-only (no standalone execution) — limits flexibility, breaks established pattern where all feature modules (001-127) support 'python -m src.sheep.features.feature_XXX' execution; reduces CLI usability"
      - "Standalone-only (no imports) — defeats modularity and reusability; prevents programmatic access and integration into larger workflows; unnecessarily restrictive"
    rationale: >
      Dual support is the correct choice because all feature modules from 001-127 implement both execution modes:
      they define a create_feature_XXX_markdown_file() function that is importable AND include a __main__ guard
      that allows standalone execution. This pattern provides flexibility for both CLI workflows (python -m)
      and programmatic access (from src.sheep.features.feature_133_markdown_file_creation import create_feature_133_markdown_file).
      The feature_127 implementation demonstrates this pattern clearly and should be followed exactly.

