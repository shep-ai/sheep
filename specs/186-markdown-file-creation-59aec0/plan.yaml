# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 186 follows the **feature module pattern** established by features 101-185. This pattern organizes each feature as a standalone module in `src/sheep/features/` that orchestrates existing utilities from `sheep.content_generators`.

  ### Module Structure

  The feature module will be organized as follows:
  - Module docstring describing feature 186 and the workflow
  - Imports from content_generators and observability.logging
  - Constants for FEATURE_NUMBER, MARKDOWN_FILENAME, and COMMIT_MESSAGE
  - Main orchestration function: create_feature_186_markdown_file(repo_path=None)
  - Optional __main__ block for standalone execution (for testing)

  ### Orchestration Pattern

  The main function chains five operations in sequence, using structured logging at each step:

  1. Generate markdown content via `generate_markdown_content()` (CrewAI LLM integration)
  2. Write file to disk via `write_markdown_file(content, \"test-xvie87.md\")` (UTF-8 + Unix LF)
  3. Validate file via `validate_markdown_file(filepath)` (encoding, line endings, content structure)
  4. Stage and commit via `commit_markdown_file(filepath, content, repo_path, custom_message)` (--no-verify)
  5. Push to remote via `push_markdown_file(repo_path, \"origin\")` (upstream tracking)

  Each step logs at INFO level for major milestones and DEBUG level for details (content size, file path, commit message). Exceptions are caught at the orchestration level, logged with context, and re-raised.

  ### Return Value

  The function returns a dictionary with semantic keys:
  - filepath: Full path to created file
  - content: Generated markdown content
  - commit_message: Conventional commit message used
  - push_result: Result from git push operation

  ## Key Design Decisions

  ### Decision 1: Reuse Existing Utilities Instead of Custom Implementation

  **Chosen:** Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), and push_markdown_file() from content_generators.py

  **Rationale:** All utilities are tested across features 101-185 (proven reliability). Functions provide comprehensive validation (encoding, line endings, structure). LLM-based generation integrates with Langfuse for observability. Code reuse minimizes implementation effort and maintenance burden. Consistent with established pattern (features 101-185 all use this approach).

  ### Decision 2: Feature Module Pattern vs. Standalone Script

  **Chosen:** Create feature_186_markdown_file_creation.py in src/sheep/features/ following the feature module pattern

  **Rationale:** 185 prior features use this pattern (proven architecture). Feature 185 is direct reference implementation (minimal friction path). Feature-specific orchestration stays in feature module; reusable utilities stay in content_generators.py. Enables code organization, testability, and Langfuse observability hooks. Allows each feature to be independently versioned and tested.

  ### Decision 3: LLM-Based Content Generation vs. Hardcoded Prose

  **Chosen:** Use generate_markdown_content() with CrewAI reasoning LLM and Claude API

  **Rationale:** Consistent with features 101-185 (proven approach). Integrates with Langfuse for automatic LLM call tracking (observability). Produces semantically coherent, unique content. Demonstrates agentic platform's core capability. Function handles all validation internally (H1 heading, 2-3 sentences).

  ### Decision 4: Comprehensive File Validation vs. Skip Validation

  **Chosen:** Use validate_markdown_file() for comprehensive validation post-write

  **Rationale:** Function already exists and is thoroughly tested across features 101-185. Comprehensive checks catch encoding issues (UTF-8 BOM, CRLF line endings). Validates content structure (H1 heading, 2-3 sentence prose, trailing newline). Low-cost quality assurance (single file read, ~10 string checks). Enables early error detection before git operations.

  ### Decision 5: Error Handling Strategy

  **Chosen:** Catch exceptions at orchestration level with structured logging, then re-raise

  **Rationale:** Feature 185 uses this pattern consistently. Exceptions are logged with full context (type, message, traceback) via structlog. Specific exception types are preserved (ValueError, IOError, Exception) for CI/CD detection. Minimal code complexity while providing full visibility for debugging. Consistent with existing patterns in content_generators.py.

  ### Decision 6: Logging Strategy

  **Chosen:** Use structlog.get_logger(__name__) at module level; log INFO for major steps, DEBUG for details

  **Rationale:** Feature 185 uses get_logger(__name__) consistently. Integrates with Langfuse for LLM call tracking (automatic via CrewAI). Structured logs enable JSON output and observability platform ingestion. INFO level for major steps provides high-level visibility. DEBUG level for details aids in debugging.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (Setup)** comes first: Review reference implementation and validate utilities are available. This ensures implementation uses proven patterns and identifies any deviations.

  2. **Phase 2 (Implementation)** comes second: Create the feature module using the reviewed pattern. This is the core development effort (~30-40 minutes).

  3. **Phase 3 (Testing)** comes third: Validate locally before committing. This catches issues before pushing to remote.

  4. **Phase 4 (Integration)** comes last: Commit and push only after validation passes. This ensures remote branch has tested, working code.

  ### Why This Order Works

  Dependency flow is linear (Setup → Implementation → Testing → Integration) with no cycles. Risk is reduced by testing before commit. Knowledge building informs implementation. Validation gates each phase.

  ### Implementation Approach

  Phase 2 implementation uses feature 185 as a direct template:
  - Same module structure (imports, constants, function signature)
  - Same orchestration pattern (5-step workflow)
  - Same logging strategy (INFO + DEBUG levels)
  - Same error handling (catch at orchestration level, re-raise)
  - Same return type (dict with filepath, content, commit_message, push_result)

  Only customization needed:
  - Change FEATURE_NUMBER from 185 to 186
  - Change MARKDOWN_FILENAME from \"test-setn4k.md\" to \"test-xvie87.md\"
  - Change COMMIT_MESSAGE to include feature 186 and the new filename
  - Update docstring to reference feature 186 instead of 185

  This copy-paste-then-customize approach minimizes friction and reduces the chance of introducing bugs.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Content generation fails (LLM timeout or API error) | generate_markdown_content() has built-in validation and error logging; exceptions propagate with context so CI/CD detects failures. Retries handled by CrewAI framework. |
  | File write fails (permissions, disk full) | write_markdown_file() validates filename and checks file was created with content. OSError exceptions propagate; operations on valid repository should not hit permission issues. |
  | Validation fails (unexpected file properties) | validate_markdown_file() has comprehensive checks (encoding, line endings, content structure). If it fails, issue is logged and exception propagates; allows debugging post-failure. |
  | Git commit fails (modified files, merge conflict) | Feature branch should be clean (no uncommitted changes). commit_markdown_file() handles staging and commit; GitCommitTool provides error details. Failures logged with stderr output. |
  | Git push fails (network, remote rejection) | push_markdown_file() uses GitPushTool which handles authentication and retry logic. Network timeouts will raise exceptions. Pre-commit hooks are bypassed via --no-verify flag. |
  | Logging integration breaks | structlog is configured globally in sheep.observability; get_logger(__name__) is standard pattern used across codebase. Unlikely to fail unless global logging misconfigured (out of scope). |
  | Feature module not discoverable | Module placed in standard location (src/sheep/features/), follows established naming convention (feature_XXX_name.py). Python import path should work via standard site-packages discovery. |
  | Pattern deviations from feature 185 | Reference implementation (feature 185) is used as template; direct code comparison during implementation mitigates divergence. Code review before commit checks for consistency. |

