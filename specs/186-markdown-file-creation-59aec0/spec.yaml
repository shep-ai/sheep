  ## Dependencies

  **Code Dependencies:**
  - `sheep.content_generators`: Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.observability.logging`: get_logger() for structured logging
  - `pathlib.Path`: Standard library for cross-platform file operations
  - `typing`: Standard library for type hints (dict, str)

  **External Dependencies:**
  - CrewAI LLM framework (>=0.86.0) and Claude API (for content generation)
  - GitPython library (>=3.1.0, already present as dependency)
  - Git command-line tool (required by GitPython for git operations)

  **Infrastructure Dependencies:**
