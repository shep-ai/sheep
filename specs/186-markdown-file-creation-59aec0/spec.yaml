content: |
  ## Problem Statement

  Create a markdown file named test-xvie87.md with a title (H1 heading) and 2-3 sentences of prose content about any topic.
  This feature is part of a recurring pattern (features 1-186) that tests the ability to systematically create and manage
  markdown files within the Sheep agentic platform using established conventions.

  ## Success Criteria

  - [ ] File test-xvie87.md is created in the repository root directory
  - [ ] File contains valid markdown with H1 heading as first line (syntax: # Title)
  - [ ] File contains exactly 2-3 sentences of prose content after the H1 heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (0x0A), not Windows CRLF (0x0D0A)
  - [ ] File passes validation via validate_markdown_file() for structure, encoding, and line endings
  - [ ] File size is between 400-600 bytes (appropriate for H1 + 2-3 sentences)
  - [ ] File is staged to git index without errors
  - [ ] Commit is created with message: "feat(186): create markdown file test-xvie87.md with prose content"
  - [ ] Commit uses --no-verify flag to skip pre-commit hooks
  - [ ] Changes are pushed to remote origin on feature branch using "git push -u origin HEAD"
  - [ ] Push completes without errors
  - [ ] Structured logging records all steps (generation, write, validation, commit, push)
  - [ ] Error messages are logged with full context if any step fails

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named test-xvie87.md in the repository root directory
  - **FR-2**: The markdown file must start with an H1 heading using standard markdown syntax (# Title)
  - **FR-3**: The file must contain 2-3 sentences of prose content (readable, semantically coherent text) after the H1 heading
  - **FR-4**: Content generation must use the existing generate_markdown_content() function from sheep.content_generators module with CrewAI/Claude LLM integration
  - **FR-5**: File must be written using pathlib.Path.write_text() with explicit UTF-8 encoding parameter
  - **FR-6**: File must be written with Unix LF line endings (0x0A) and must not contain Windows CRLF sequences (0x0D0A)
  - **FR-7**: Generated file must be validated using validate_markdown_file() from sheep.content_generators to confirm structure, encoding, and line endings
  - **FR-8**: File must be staged to git index using GitPython or git commands
  - **FR-9**: Staged file must be committed with conventional commit message: "feat(186): create markdown file test-xvie87.md with prose content"
  - **FR-10**: Commit operation must use --no-verify flag to skip pre-commit hooks
  - **FR-11**: Committed changes must be pushed to remote origin using "git push -u origin HEAD"
  - **FR-12**: Implementation must follow the architectural pattern established by features 101-185 (feature module in src/sheep/features/)
  - **FR-13**: All operations must be logged using structlog with module-level logger (get_logger(__name__))
  - **FR-14**: Function must return a dictionary containing: filepath, content, commit_message, and push_result

  ## Non-Functional Requirements

  - **NFR-1**: Performance: LLM-based content generation should complete within 10 seconds (typical Claude API latency)
  - **NFR-2**: File size: Generated markdown file should be between 400-600 bytes, typical for H1 heading plus 2-3 sentences
  - **NFR-3**: Architectural consistency: Implementation must follow the established feature module pattern from features 101-185 with no deviations
  - **NFR-4**: Code reuse: Implementation must leverage existing content_generators.py utilities (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) to minimize code duplication
  - **NFR-5**: Observability: All steps must be logged via structlog with appropriate log levels (info for major steps, debug for details) and Langfuse integration for LLM call tracking
  - **NFR-6**: Error handling: Implementation must catch exceptions at appropriate boundaries and log errors with full context (exception type, message, traceback) using structlog
  - **NFR-7**: Git reliability: Git operations (staging, commit, push) must complete successfully; any git command failures must be caught and logged as errors with exit codes and stderr output
  - **NFR-8**: Scope: Implementation must fit within the small (S) estimate of 30-60 minutes of work
  - **NFR-9**: Documentation: Implementation must include docstring for the main orchestration function describing inputs, outputs, and error behavior
  - **NFR-10**: Encoding correctness: File must be encoded as UTF-8 without BOM; any encoding verification should use binary read to confirm exact byte sequence

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | File test-xvie87.md will be created at /repo/test-xvie87.md (alongside 185 existing test-*.md files) |
  | src/sheep/features/ | Medium | New feature module feature_186_markdown_file_creation.py will be added following feature_101-185 pattern |
  | Git history | High | Will create commit and push, adding to feature branch history |
  | File system I/O | Low | Uses existing pathlib utilities; no new infrastructure needed |
  | Content generation | Low | Reuses existing generate_markdown_content() function from content_generators.py |
  | Git operations | Low | Reuses existing commit/push utilities from content_generators.py |
  | Observability | Low | Uses existing structlog logger; no new observability infrastructure needed |

  ## Dependencies

  **Code Dependencies:**
  - `sheep.content_generators`: Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.observability.logging`: get_logger() for structured logging
  - `pathlib.Path`: Standard library for cross-platform file operations
  - `typing`: Standard library for type hints (dict, str)

  **External Dependencies:**
  - CrewAI LLM framework (>=0.86.0) and Claude API (for content generation)
  - GitPython library (>=3.1.0, already present as dependency)
  - Git command-line tool (required by GitPython for git operations)

  **Infrastructure Dependencies:**
  - Authenticated git repository with configured remote origin
  - Claude API credentials (via ANTHROPIC_API_KEY in environment)
  - Langfuse integration (optional, configured via LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY)

  **No New Dependencies Required**
  - All required libraries already listed in pyproject.toml
  - All utilities already exist in content_generators.py
  - Pattern established by 185 prior features provides reference implementations

  ## Implementation Approach

  **Selected Approach: Feature Module Pattern (Validated by 185 prior features)**

  1. Create feature_186_markdown_file_creation.py in src/sheep/features/ following the exact pattern from features 101-185
  2. Main orchestration function create_feature_186_markdown_file(repo_path=None) that calls existing content_generators utilities in sequence:
     - Call generate_markdown_content() to generate H1 + prose via LLM
     - Call write_markdown_file() to write content with UTF-8 encoding
     - Call validate_markdown_file() to confirm structure, encoding, line endings
     - Call commit_markdown_file() to stage and commit with conventional message
     - Call push_markdown_file() to push to remote origin
  3. Implement structured logging using get_logger(__name__) at each step
  4. Return dict with filepath, content, commit_message, push_result
  5. Include optional __main__ block for standalone execution
  6. Minimal code (~100 lines) leveraging existing tested infrastructure

  ## Size Estimate

  **S** — 30-60 minutes of work

  **Justification:**
  - Established pattern with 185 prior implementations to reference (lowest friction path)
  - Reusable infrastructure (content_generators.py utilities already exist, tested, and documented)
  - Minimal code: ~100 lines for feature module following established pattern
  - No new dependencies, architecture changes, or complex logic required
  - Git operations well-tested and reliable across all prior features
  - Validation logic pre-built in content_generators.py
  - No edge cases or special handling needed (follows standard pattern)

  **Task Breakdown:**
  - 10 min: Review pattern from feature_102-185 examples and understand architecture
  - 15 min: Implement feature_186_markdown_file_creation.py module with logging
  - 10 min: Test locally (run feature function, verify file created with correct properties)
  - 10 min: Commit and push implementation to feature branch
  - 5 min: Verify remote branch and CI status

  ---

  _Requirements phase completed based on comprehensive analysis and product question resolution_
