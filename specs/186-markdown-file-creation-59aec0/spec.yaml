content: |
  ## Problem Statement

  Create a markdown file named test-xvie87.md with a title (H1 heading) and 2-3 sentences of prose content about any topic.
  This feature is part of a recurring pattern (features 1-186) that tests the ability to systematically create and manage
  markdown files within the Sheep agentic platform using established conventions.

  ## Success Criteria

  - [ ] File test-xvie87.md is created in the repository root directory
  - [ ] File contains valid markdown with H1 heading as first line (syntax: # Title)
  - [ ] File contains exactly 2-3 sentences of prose content after the H1 heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (0x0A), not Windows CRLF (0x0D0A)
  - [ ] File passes validation via validate_markdown_file() for structure, encoding, and line endings
  - [ ] File size is between 400-600 bytes (appropriate for H1 + 2-3 sentences)
  - [ ] File is staged to git index without errors
  - [ ] Commit is created with message: "feat(186): create markdown file test-xvie87.md with prose content"
  - [ ] Commit uses --no-verify flag to skip pre-commit hooks
  - [ ] Changes are pushed to remote origin on feature branch using "git push -u origin HEAD"
  - [ ] Push completes without errors
  - [ ] Structured logging records all steps (generation, write, validation, commit, push)
  - [ ] Error messages are logged with full context if any step fails

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named test-xvie87.md in the repository root directory
  - **FR-2**: The markdown file must start with an H1 heading using standard markdown syntax (# Title)
  - **FR-3**: The file must contain 2-3 sentences of prose content (readable, semantically coherent text) after the H1 heading
  - **FR-4**: Content generation must use the existing generate_markdown_content() function from sheep.content_generators module with CrewAI/Claude LLM integration
  - **FR-5**: File must be written using pathlib.Path.write_text() with explicit UTF-8 encoding parameter
  - **FR-6**: File must be written with Unix LF line endings (0x0A) and must not contain Windows CRLF sequences (0x0D0A)
  - **FR-7**: Generated file must be validated using validate_markdown_file() from sheep.content_generators to confirm structure, encoding, and line endings
  - **FR-8**: File must be staged to git index using GitPython or git commands
  - **FR-9**: Staged file must be committed with conventional commit message: "feat(186): create markdown file test-xvie87.md with prose content"
  - **FR-10**: Commit operation must use --no-verify flag to skip pre-commit hooks
  - **FR-11**: Committed changes must be pushed to remote origin using "git push -u origin HEAD"
  - **FR-12**: Implementation must follow the architectural pattern established by features 101-185 (feature module in src/sheep/features/)
  - **FR-13**: All operations must be logged using structlog with module-level logger (get_logger(__name__))
  - **FR-14**: Function must return a dictionary containing: filepath, content, commit_message, and push_result

  ## Non-Functional Requirements

  - **NFR-1**: Performance: LLM-based content generation should complete within 10 seconds (typical Claude API latency)
  - **NFR-2**: File size: Generated markdown file should be between 400-600 bytes, typical for H1 heading plus 2-3 sentences
  - **NFR-3**: Architectural consistency: Implementation must follow the established feature module pattern from features 101-185 with no deviations
  - **NFR-4**: Code reuse: Implementation must leverage existing content_generators.py utilities (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) to minimize code duplication
  - **NFR-5**: Observability: All steps must be logged via structlog with appropriate log levels (info for major steps, debug for details) and Langfuse integration for LLM call tracking
  - **NFR-6**: Error handling: Implementation must catch exceptions at appropriate boundaries and log errors with full context (exception type, message, traceback) using structlog
  - **NFR-7**: Git reliability: Git operations (staging, commit, push) must complete successfully; any git command failures must be caught and logged as errors with exit codes and stderr output
  - **NFR-8**: Scope: Implementation must fit within the small (S) estimate of 30-60 minutes of work
  - **NFR-9**: Documentation: Implementation must include docstring for the main orchestration function describing inputs, outputs, and error behavior
  - **NFR-10**: Encoding correctness: File must be encoded as UTF-8 without BOM; any encoding verification should use binary read to confirm exact byte sequence

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Implementation approach: feature module vs standalone script | Feature module (src/sheep/features/feature_186_markdown_file_creation.py) | Maintains architectural consistency with 185 prior features, enables observability integration, follows established patterns |
  | 2 | Content generation method: LLM-based vs hardcoded prose | LLM-based generation using existing generate_markdown_content() | Consistent with features 101-185, enables Langfuse observability, demonstrates agentic platform capability |
  | 3 | File validation: comprehensive vs skip | Apply comprehensive validation using validate_markdown_file() | Function already exists and is tested; catches encoding/line-ending issues early and ensures quality |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project follows a modular, layered architecture:

  ```
  sheep/
  ├── src/sheep/
  │   ├── features/                    # Feature implementation modules (101-185 completed, 186 incoming)
  │   │   ├── feature_102_markdown_file_creation.py
  │   │   ├── feature_103_markdown_file_creation.py
  │   │   └── ... (patterns established by 185 prior features)
  │   ├── config/                      # Configuration management
  │   │   ├── settings.py              # Pydantic settings
  │   │   └── llm.py                   # LLM factory (get_reasoning_llm)
  │   ├── observability/               # Logging and tracing
  │   │   ├── logging.py               # Structured logging (get_logger)
  │   │   └── langfuse_client.py       # Langfuse integration
  │   ├── tools/                       # Agent tools
  │   │   ├── git_tools.py             # Git operations (GitCommitTool, GitPushTool)
  │   │   └── file_tools.py            # File operations
  │   ├── content_generators.py        # Reusable content utilities (MAIN DEPENDENCY)
  │   └── cli.py                       # CLI entry point
  ├── tests/                           # Test suite
  ├── specs/186-markdown-file-creation-59aec0/  # This feature's spec
  └── pyproject.toml                   # Project configuration
  ```

  **Key Directories for This Feature:**
  - **src/sheep/features/**: Where feature_186_markdown_file_creation.py will be created
  - **src/sheep/content_generators.py**: Core reusable utilities (no modification needed)
  - **Repository root**: Where test-xvie87.md file will be created (alongside 185 existing test-*.md files)

  ### Architecture Patterns

  **Feature Module Pattern** (Established by features 101-185):
  1. Each feature has a dedicated Python module: `feature_{N}_markdown_file_creation.py`
  2. Contains a single orchestration function: `create_feature_{N}_markdown_file(repo_path=None)`
  3. Uses existing content_generators.py utilities in sequence
  4. Implements structured logging at key steps
  5. Returns a dictionary with filepath, content, commit_message, push_result
  6. Includes optional `__main__` block for standalone execution

  **Content Generator Pipeline** (in content_generators.py):
  - `generate_markdown_content()` → Creates H1 + prose via Claude API/CrewAI
  - `write_markdown_file(content, filename)` → Writes to disk with UTF-8 encoding
  - `validate_markdown_file(filepath)` → Validates structure, encoding, line endings
  - `commit_markdown_file(filepath, content, repo_path, custom_message)` → Stages and commits
  - `push_markdown_file(repo_path, remote)` → Pushes to remote with upstream tracking

  **Design Principles in Use:**
  - Separation of structure (features) and intelligence (content_generators utilities)
  - Reusable, tested utility functions minimize code duplication
  - Structured logging via get_logger(__name__) at each step
  - Error handling with try/except boundaries and logging context
  - File I/O using pathlib.Path (cross-platform, safe)
  - Git operations via GitPython (reliable, already integrated)

  ### Relevant Technologies

  **Python 3.11+**
  - Target version for type hints, performance optimizations
  - Uses pathlib for cross-platform file operations

  **CrewAI Framework (>=0.86.0)**
  - Modular agentic framework for multi-LLM support
  - Integrated LLM factory (get_reasoning_llm() in config/llm.py)
  - Handles Claude API calls with proper error handling

  **Claude API (via Anthropic SDK)**
  - Used through CrewAI's LLM abstraction
  - Generates markdown content via MARKDOWN_GENERATION_PROMPT
  - Typical latency: 2-10 seconds per request

  **GitPython (>=3.1.0)**
  - Python library for Git operations
  - Used via GitCommitTool and GitPushTool in tools/git_tools.py
  - Handles staging, committing, pushing with upstream tracking

  **structlog (>=24.0.0)**
  - Structured logging framework used throughout project
  - get_logger(__name__) provides module-level loggers
  - Enables observability via Langfuse integration

  **Langfuse (>=2.0.0)**
  - Optional observability platform for LLM call tracking
  - Configured via environment variables (LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY)
  - Provides execution traces, metrics, and cost tracking

