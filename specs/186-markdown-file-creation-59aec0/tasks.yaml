content: |
  ## Summary

  Feature 186 implementation follows a straightforward 4-phase, 8-task workflow:

  **Phase 1 (Setup & Review):** Tasks 1-2 establish understanding by reviewing feature 185 pattern and verifying existing utilities are available. This foundational knowledge informs the implementation.

  **Phase 2 (Implementation):** Tasks 3-5 create the feature module. Task 3 sets up the file structure with imports and constants. Task 4 implements the main orchestration function (the core work). Task 5 adds a __main__ block for testing.

  **Phase 3 (Testing):** Task 6 validates the implementation locally. Verifies file creation, validation, and git operations work correctly before pushing.

  **Phase 4 (Integration):** Tasks 7-8 commit and push the implementation to remote. Ensures the code is persisted to the feature branch and CI/CD pipeline accepts it.

  All tasks are ordered by dependency. Later tasks only start after their dependencies complete. The estimated total effort is 45-60 minutes, matching the small (S) size estimate from the specification.

  ## Task Dependencies

  - Tasks 1-2 are setup (no dependencies)
  - Tasks 3-5 depend on task-2 completion (setup → implementation)
  - Task 6 depends on task-5 completion (testing requires complete implementation)
  - Tasks 7-8 depend on task-6 completion (integration only after testing passes)

  This dependency flow is linear (no cycles) and risk-reducing (testing happens before pushing).

  ## Implementation Notes

  - **Code Reuse:** All tasks leverage existing utilities from content_generators.py and logging infrastructure. No custom implementations needed.
  - **Pattern Adherence:** Feature 185 serves as direct template. Tasks follow the copy-paste-then-customize approach to minimize friction.
  - **Testing Strategy:** Local testing (task-6) catches issues before remote push. Unit tests are implicit in TDD cycles.
  - **Error Handling:** Implementation catches exceptions at orchestration level, logs context, re-raises for CI/CD detection.
  - **Documentation:** Each task has clear acceptance criteria for verification. Implementation includes comprehensive docstrings.
