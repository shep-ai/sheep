content: |
  ## Architecture Overview

  This feature has minimal architectural footprint. It is a **self-contained file creation and git workflow task** with no integration points to the Sheep platform core, no new dependencies, and no modifications to existing code.

  **Pattern Conformance:**
  - Follows the established test pattern from features 125-132 (all identical markdown file creation tasks)
  - Uses the same technology stack: Python standard library + subprocess + git
  - Produces output at repository root (alongside 130+ existing test-*.md files)
  - Executes in single atomic operation: file creation → git workflow

  **Integration Points:**
  - None. This feature is orthogonal to platform internals.
  - File I/O: Uses Python's pathlib and open() (no platform dependencies)
  - Git operations: Uses subprocess to call git CLI (no platform dependencies)
  - Output validation: Git history and filesystem verify success

  ## Key Design Decisions

  All design decisions are resolved in the research findings. Implementation should follow these patterns:

  ### 1. File Creation Method
  **Decision:** Use Python pathlib.Path with open() for cross-platform file I/O
  **Why:** Pythonic, modern standard, no external dependencies, consistent with Sheep platform patterns
  **Alternative rejected:** os.path (outdated), external libraries (over-engineered), shell commands (not portable)

  ### 2. Content Generation
  **Decision:** Hardcoded meaningful prose (not templated or placeholder)
  **Why:** Spec requires meaningful prose; single file creation doesn't need complex generation; hardcoding is simpler
  **Alternative rejected:** Templated content (unnecessary complexity), Lorem ipsum (violates spec), LLM generation (over-engineered)

  ### 3. Git Workflow Execution
  **Decision:** subprocess.run() with direct git commands (add, commit, push)
  **Why:** Standard pattern in Sheep platform, no external dependencies, reliable error handling
  **Alternative rejected:** GitPython (external dependency), shell scripts (platform-specific), file-only (incomplete)

  ### 4. File Encoding and Line Endings
  **Decision:** UTF-8 without BOM, LF line endings, trailing newline
  **Why:** UTF-8 is universal standard; LF matches repo convention (visible across 130+ files); trailing newline satisfies POSIX; spec forbids BOM
  **Alternative rejected:** UTF-8 with BOM (problematic), CRLF (repo uses LF), no trailing newline (violates convention)

  ### 5. File Location and Naming
  **Decision:** Repository root, filename test-g25exv.md (exact spec requirement)
  **Why:** Spec is explicit and non-negotiable; matches pattern in features 125-132
  **Alternative rejected:** Subdirectories (breaks established pattern), alternative naming (test suite validates exact filename)

  ### 6. Markdown Structure
  **Decision:** Single H1 heading (#), blank line, 2-3 sentences
  **Why:** Spec requires this exact structure; matches existing test-*.md files; blank line is critical for markdown parsing
  **Example:**
  ```
  # The Art of Problem Solving

  The ability to solve problems effectively is a cornerstone of personal and professional growth.
  By breaking complex challenges into manageable parts and approaching them with patience and
  creativity, we unlock solutions that seemed impossible at first. Success depends less on avoiding
  problems and more on developing the resilience to overcome them.
  ```

  ## Implementation Strategy

  ### Phase 1: File Creation and Git Integration

  **Rationale for single phase:** This task is inherently atomic. File creation and git workflow must complete together to satisfy success criteria. Separating them would introduce failure points and complicate error handling.

  **Execution flow:**
  1. Create markdown file with pathlib.Path and open()
  2. Write H1 heading + blank line + 2-3 sentences
  3. Ensure UTF-8 encoding and LF line endings
  4. Execute git add, commit, push via subprocess
  5. Verify success criteria (file exists, git log shows commit, remote updated)

  **Error handling:**
  - Wrap git operations in try/except (subprocess.CalledProcessError)
  - Fail gracefully if file already exists (don't overwrite)
  - Log clear error messages for diagnostics

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Git authentication fails | Low | Verify GitHub credentials pre-execution; feature branch already exists |
  | File already exists | Very Low | Check file path before creation; fail with clear error if exists |
  | Merge conflict on push | Very Low | Feature branch is isolated; should not conflict |
  | Encoding/line ending issues | Very Low | Use Python's default text mode (UTF-8); write newlines explicitly |
  | Disk space exhausted | Very Low | File is ~250 bytes; negligible risk |
  | Feature branch doesn't exist | Very Low | Branch is pre-created as prerequisite |

  ## Success Criteria Summary

  Implementation is complete when:
  - [ ] File test-g25exv.md exists in repository root
  - [ ] File contains exactly one H1 markdown heading
  - [ ] File contains 2-3 sentences of meaningful prose
  - [ ] File is UTF-8 without BOM, LF line endings, trailing newline
  - [ ] Git commit created with message "feat(133): Create markdown file test-g25exv.md"
  - [ ] Changes pushed to feat/133-markdown-file-creation-7905c7
  - [ ] No other files modified or created
  - [ ] Git history shows the commit on the feature branch
