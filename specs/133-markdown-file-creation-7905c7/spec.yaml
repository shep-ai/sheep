content: |
  ## Problem Statement

  Create a single markdown file named test-g25exv.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content, then execute the complete git workflow (add/commit/push) to integrate this file into the feature branch. This is test iteration 133 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks.

  ## Success Criteria

  - [ ] File test-g25exv.md exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (single `#` prefix) as the title
  - [ ] File contains 2-3 sentences of prose content separated from the heading by a blank line
  - [ ] File follows the established format: `# Title\n\nSentence 1. Sentence 2. Sentence 3.`
  - [ ] File is encoded in UTF-8 with no BOM
  - [ ] File has been staged with `git add test-g25exv.md`
  - [ ] Git commit created with conventional commit message format: `feat(133): Create markdown file test-g25exv.md`
  - [ ] Changes pushed to the feature branch feat/133-markdown-file-creation-7905c7
  - [ ] No other files have been modified or created
  - [ ] Pull request created and merged (or in progress) following the pattern of related features 132-128

  ## Product Decisions & AI Recommendations

  | # | Decision | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose content quality | Meaningful prose | Demonstrates platform capability with real-world artifacts; minimal additional effort; maintains quality standards in repository |
  | 2 | PR scope | CI/CD automation handles PR | Aligns with established Sheep platform patterns; keeps implementation focused and simple; reduces manual workflow steps |

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-g25exv.md` in the repository root (same directory level as README.md and other test-*.md files)
  - **FR-2**: File must contain an H1 markdown heading as the primary title (using `#` syntax)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading
  - **FR-4**: Prose content must be separated from the heading by a single blank line
  - **FR-5**: Stage the new file with `git add test-g25exv.md`
  - **FR-6**: Create a git commit with a conventional commit message following the pattern `feat(133): Create markdown file test-g25exv.md`
  - **FR-7**: Push the commit to the remote feature branch `feat/133-markdown-file-creation-7905c7` with `git push -u origin feat/133-markdown-file-creation-7905c7` (or equivalent if already tracking)
  - **FR-8**: File content must not be empty and must contain readable prose (no null bytes, invalid UTF-8, or binary data)

  ## Non-Functional Requirements

  - **NFR-1**: File must be valid UTF-8 encoded text without a byte order mark (BOM)
  - **NFR-2**: File formatting must match the established pattern used in existing test-*.md files (130+ existing test files in repository root)
  - **NFR-3**: Git workflow must follow Sheep platform conventions for conventional commits (feat(#): description format)
  - **NFR-4**: Implementation must not introduce changes to any other files or directories (no side effects)
  - **NFR-5**: Git operations must complete successfully without merge conflicts or authentication errors
  - **NFR-6**: File should be created and committed within a single feature branch lifecycle (no additional branches or rebases needed)
  - **NFR-7**: No code, configuration, or architecture changes required; task is purely file creation and git workflow execution

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as an agentic platform for automated code implementation using CrewAI. Key structure:

  - **Root Directory**: Contains 130+ test markdown files (test-*.md pattern) created as part of the validation suite (features 1-133)
  - **src/sheep/**: Core platform code for agent orchestration, LLM integration, and tooling
  - **specs/**: Feature specifications directory with subdirectories for each feature (e.g., `specs/133-markdown-file-creation-7905c7/`)
  - **GitHub Workflows**: CI/CD integration via `.github/workflows/ci.yml` for automated testing

  ### Architecture Patterns

  1. **Feature-Driven Development**: Each feature has an isolated spec directory containing YAML files for requirements, planning, research, and tasks
  2. **Established Test Pattern**: Features 125-132 follow an identical markdown file creation pattern, indicating this is a deliberate validation test series
  3. **Git-First Workflow**: All test features include complete git workflow (add/commit/push) to verify platform capability
  4. **Conventional Commits**: Messages follow `feat(#): description` format across all 132+ preceding features

  ### Relevant Technologies

  - **Python 3**: Primary implementation language (based on create_markdown.py pattern scripts)
  - **Git**: Version control and workflow automation
  - **Markdown**: Plain text file format used for documentation
  - **pathlib**: Python standard library for cross-platform file operations
  - **subprocess**: Python standard library for executing git commands

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-g25exv.md) will be created in the repository root, following the pattern of 132+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting and encoding |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git commands (add, commit, push)
  4. **Content Generation** - Simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-132, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 8+ times in preceding features (125-132)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-132) were completed in a single commit with minimal complexity
