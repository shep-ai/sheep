# Structured technology decisions
decisions:
  - title: "File I/O Method for Markdown Creation"
    chosen: "Python pathlib.Path.write_text() for direct string-to-file writing"
    rejected:
      - "open()/write() built-in functions — more verbose, less Pythonic, doesn't provide path convenience methods"
      - "Third-party file I/O libraries (filelock, pathspec, etc.) — introduces unnecessary dependencies, violates NFR-9 (no new dependencies)"
      - "Shell script with echo/cat — reduces code clarity, less portable, harder to validate encoding"
    rationale: >
      Specification explicitly requires pathlib.Path (NFR-5). This is a built-in Python 3.11+ standard
      library module with no external dependencies. The method `.write_text(encoding='utf-8')` provides
      atomic file writes with explicit encoding control. This approach is consistent with all 280+ existing
      test markdown files and proven effective across the established pattern. Pathlib provides cleaner
      syntax and is the modern Python standard for file operations since Python 3.4+.

  - title: "File Encoding Strategy"
    chosen: "UTF-8 without BOM (Byte Order Mark)"
    rejected:
      - "UTF-8 with BOM — legacy encoding practice, creates file size overhead (3 extra bytes), breaks plaintext markdown compatibility"
      - "Other encodings (ASCII, Latin-1, UTF-16) — incompatible with Unicode content flexibility, inconsistent with existing test files"
    rationale: >
      Specification requirement NFR-1 mandates UTF-8 without BOM. This is the standard encoding for
      markdown files and source code across the industry. UTF-8 without BOM provides maximum compatibility
      with all platforms and git systems. Python's pathlib.Path.write_text() defaults to UTF-8, and
      specifying `encoding='utf-8'` ensures consistency. All 280+ existing test files use UTF-8 without BOM.

  - title: "Line Ending Format (CRLF vs LF)"
    chosen: "Unix-style LF (line feed, \\n) line endings"
    rejected:
      - "Windows CRLF (carriage return + line feed, \\r\\n) — platform-specific, violates git best practices, creates diffs showing every line changed on cross-platform projects"
      - "Mixed line endings — causes inconsistency, violates git standards, complicates diffs"
    rationale: >
      Specification requirement NFR-2 mandates Unix LF line endings. This is the standard for git
      repositories and cross-platform development. Python's pathlib.Path.write_text() uses the system
      default, but specifying `newline=''` in pathlib or using explicit '\\n' in content strings ensures
      LF line endings on all platforms. Git is configured for LF line endings per best practices. All 280+
      existing test files use LF. Windows git automatically converts CRLF on checkout/commit if configured.

  - title: "Markdown Content Structure"
    chosen: "H1 heading on first line, blank line, 2-3 sentences of prose (following CommonMark spec)"
    rejected:
      - "H2 headings or lower — specification explicitly requires H1 (FR-3, success criterion)"
      - "No heading — violates specification requirement FR-3 for H1 title"
      - "Multiple headings or complex structure — violates minimalism principle, exceeds specification (2-3 sentences)"
    rationale: >
      Specification defines the exact structure in FR-3 and FR-4. This format is validated across 280+
      existing test files. The structure `# Heading\\n\\n<prose>` follows CommonMark specification and
      ensures proper markdown parsing. The 2-3 sentence constraint keeps files focused and demonstrates
      content validation discipline. Topic selection is free-form per specification (NFR-8) and observed
      diversity across existing files shows this provides flexibility.

  - title: "File Location and Naming"
    chosen: "Repository root directory with exact filename test-t8i8ub.md (no subdirectories)"
    rejected:
      - "Subdirectory placement (docs/, test/, examples/) — violates architectural pattern, spec explicitly requires root (FR-2)"
      - "Different filename — violates specification FR-1, changes test artifact identification"
      - "Numbered or timestamped variants — unnecessary complexity, violates established pattern from 280+ files"
    rationale: >
      Specification FR-1 and FR-2 define exact filename and location. The repository root is the
      established location for all 280+ test markdown files. Filenames follow the pattern `test-<random-suffix>.md`
      where the suffix is provided. Root placement keeps test artifacts distinct from source code and
      maintains clear separation of concerns. No directory creation needed — write directly to root.

  - title: "Git Workflow and Commit Strategy"
    chosen: "Standard add/commit/push on pre-existing feature branch with conventional commit format"
    rejected:
      - "Direct push without commit — violates git workflow standards and audit trail requirements"
      - "Squashing into existing commits — complicates history, violates single-feature-per-commit principle"
      - "Amending previous commits — destroys historical accuracy, violates conventional commits"
    rationale: >
      Specification FR-6 through FR-9 define the git workflow. The feature branch `feat/287-markdown-file-creation-12ba4d`
      is pre-created. The conventional commit format `feat(287): create markdown file test-t8i8ub.md with prose content`
      follows the established pattern from 280+ prior implementations (e.g., commits 0e67f121, 165905ff, 90c8a223).
      This workflow provides clear audit trail, feature isolation, and PR integration. `git add test-t8i8ub.md`,
      then `git commit`, then `git push -u origin HEAD` on the feature branch.

  - title: "Topic Selection and Content Validation"
    chosen: "Free-form topic selection by implementer, with self-validation for readability and grammar"
    rejected:
      - "Pre-selected topics from a list — restricts creativity, unnecessary constraint not in specification"
      - "Automated topic generation from templates — adds complexity, reduces authenticity of prose"
      - "Review/approval cycle for topics — violates pragmatic specification approach (NFR-8: any topic)"
    rationale: >
      Specification NFR-8 allows any topic. Examination of 280+ existing test files shows diverse topics
      (testing, persistence, markdown, nature, technology, science, etc.). This diversity demonstrates
      that free-form selection works well. The self-validation approach (check prose for readability and
      grammar during creation per NFR-5) is pragmatic and proven. Implementer judgment is sufficient given
      clear structural requirements.

