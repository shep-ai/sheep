content: |
  ## Architecture Overview

  This feature creates a single markdown file at the repository root following the established
  pattern from features 001-286 (280+ existing test files). The implementation is minimal and
  isolated — it does not depend on or modify any source code in /src/sheep/ and has no impact
  on application behavior.

  The markdown file serves as a validation artifact for the automated implementation system,
  demonstrating file creation, encoding control, and git integration capabilities.

  ### File Structure Pattern

  ```
  # Heading\n
  \n
  <2-3 sentences of prose content>
  ```

  All 280+ existing test files follow this identical structure with diverse topics chosen by
  implementers. File size naturally falls in the 400-600 byte range as a consequence of proper
  formatting.

  ## Key Design Decisions

  ### 1. File I/O Method: Python pathlib.Path.write_text()

  **Chosen:** `pathlib.Path("test-t8i8ub.md").write_text(content, encoding='utf-8')`

  **Rationale:** Specification explicitly requires pathlib (NFR-5). It is a Python 3.11+
  standard library module with no external dependencies (required by NFR-9). The
  `.write_text()` method provides atomic writes with explicit encoding control. This approach
  is proven across all 280+ existing test markdown files and represents the modern Python
  standard for file operations since Python 3.4+.

  **Alternatives Considered:**
  - `open()/write()` built-in functions — more verbose, less Pythonic, lacks convenience methods
  - Third-party file I/O libraries (filelock, pathspec) — introduces unnecessary dependencies, violates NFR-9
  - Shell script (echo/cat) — reduces portability, harder to validate encoding, less clear

  ### 2. File Encoding: UTF-8 Without BOM

  **Chosen:** UTF-8 without Byte Order Mark (BOM)

  **Rationale:** Specification requirement NFR-1. UTF-8 without BOM is the industry standard
  for markdown and source code, providing maximum platform compatibility. Python's pathlib
  `.write_text()` method defaults to UTF-8; explicit `encoding='utf-8'` parameter ensures
  consistency. This matches the encoding of all 280+ existing test files.

  **Alternatives Considered:**
  - UTF-8 with BOM — legacy practice, adds 3-byte overhead, breaks plaintext markdown compatibility
  - Other encodings (ASCII, Latin-1, UTF-16) — incompatible with content flexibility, inconsistent with existing files

  ### 3. Line Ending Format: Unix LF (\\n)

  **Chosen:** Unix-style LF (line feed, `\n`) line endings

  **Rationale:** Specification requirement NFR-2. LF is the standard for git repositories and
  cross-platform development. Python string literals naturally use `\n` for LF line endings.
  Git configuration is set for LF across the repository. All 280+ existing test files use LF
  line endings.

  **Alternatives Considered:**
  - Windows CRLF (`\r\n`) — platform-specific, violates git best practices, creates spurious diffs on cross-platform projects
  - Mixed line endings — violates consistency, complicates git handling and diffs

  ### 4. Markdown Content Structure

  **Chosen:** H1 heading on first line, blank line, 2-3 sentences of prose

  **Rationale:** Specification defines exact structure in FR-3 and FR-4. The format
  `# Heading\n\n<prose>` follows CommonMark specification for proper markdown parsing.
  The 2-3 sentence constraint ensures focused content. Topic selection is free-form per NFR-8,
  and examination of 280+ existing files shows diverse topics (testing, persistence, nature,
  technology, science, history, philosophy, culture) — this flexibility proves effective.

  **Alternatives Considered:**
  - H2 or lower headings — violates specification requirement FR-3 (must be H1)
  - No heading — violates specification requirement FR-3
  - Multiple headings or complex structure — exceeds specification scope, unnecessary complexity

  ### 5. Topic Selection: Free-Form with Self-Validation

  **Chosen:** Implementer selects any topic, validates prose for readability and grammar

  **Rationale:** Specification NFR-8 allows any topic. Observation of 280+ existing files
  demonstrates diverse topics work well. Self-validation approach (checking prose for
  readability and grammar during creation) is pragmatic per the product decisions in the
  spec and proven effective across all prior implementations.

  **Alternatives Considered:**
  - Pre-selected topics from a list — unnecessarily restrictive, reduces implementer creativity
  - Automated topic generation — adds complexity, reduces authenticity of prose
  - Review/approval cycle — violates pragmatic specification approach, adds overhead

  ### 6. Git Workflow: Feature Branch with Conventional Commits

  **Chosen:** Standard add/commit/push workflow on pre-existing feature branch with conventional commit format

  **Rationale:** Specification FR-6 through FR-9 define the git workflow. The feature branch
  `feat/markdown-file-creation-12ba4d` is pre-created. Conventional commit message format
  `feat(287): create markdown file test-t8i8ub.md with prose content` follows the established
  pattern from prior implementations (see commits 0e67f121, 165905ff). This workflow provides
  clear audit trail, feature isolation, and PR integration.

  **Alternatives Considered:**
  - Direct push without commit — violates git workflow standards and audit trail requirements
  - Squashing into existing commits — complicates history, violates single-feature-per-commit principle
  - Amending previous commits — destroys historical accuracy, violates conventional commits best practice

  ## Implementation Strategy

  ### Phase 1: Content Creation & File I/O

  This phase focuses on creating the markdown file with proper structure and encoding:

  1. Compose markdown content: H1 heading with topic of choice + blank line + 2-3 sentences of prose
  2. Use Python pathlib to write file using `Path("test-t8i8ub.md").write_text(content, encoding='utf-8')`
  3. Validate file was created successfully with correct structure, encoding, and line endings

  This phase must complete first — the file must exist before git operations can proceed.

  ### Phase 2: Git Integration

  This phase handles version control workflow:

  1. Stage the file using `git add test-t8i8ub.md`
  2. Commit with conventional message: `feat(287): create markdown file test-t8i8ub.md with prose content`
  3. Push to remote origin using `git push -u origin HEAD`

  This phase depends on Phase 1 completion — the file must be created and validated before staging it.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (collision) | Specification provides unique filename with random suffix (test-t8i8ub.md); 280+ existing files show no collisions; minimal risk |
  | Incorrect encoding (BOM or wrong encoding) | Use pathlib with explicit `encoding='utf-8'`; validation checks file size (400-600 bytes confirms proper structure); Python pathlib ensures UTF-8 without BOM by default |
  | CRLF line endings instead of LF | Python string literals with `\n` ensure LF; pathlib respects content string's line endings; git configuration enforces LF on the repository |
  | Missing or malformed content | Clear specification requirements in FR-3 and FR-4; well-defined success criteria; self-validation approach proven across 280+ iterations |
  | Git commit fails | Feature branch pre-created and exists; conventional commit message matches specification exactly FR-7; use `git push -u origin HEAD` to explicitly push to current branch |
  | File not pushed to remote | Use explicit `git push -u origin HEAD` to clearly identify current branch; verify with `git log` and `git status` after push |

  ## Success Criteria

  Implementation is complete when:
  - File `test-t8i8ub.md` exists in repository root
  - File contains H1 heading on first line
  - File contains blank line after heading (per CommonMark)
  - File contains 2-3 sentences of readable, grammatically correct prose
  - File is UTF-8 encoded without BOM
  - File uses Unix LF (\\n) line endings
  - File size is 400-600 bytes (natural consequence of proper structure)
  - File is staged with `git add test-t8i8ub.md`
  - Commit exists with exact message: `feat(287): create markdown file test-t8i8ub.md with prose content`
  - Commit is on feature branch `feat/markdown-file-creation-12ba4d`
  - Changes are pushed to remote origin repository
