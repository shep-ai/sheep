content: |
  ## Architecture Overview

  Feature 202 implements a minimal, well-established pattern for creating test markdown files.
  The implementation builds on 200+ existing test files (test-*.md) and directly follows feature 201's approach.

  **Module Structure:**
  - Single feature module: `src/sheep/features/feature_202_markdown_file_creation.py`
  - Reuses existing `sheep.content_generators.py` for markdown structure helpers
  - Uses `sheep.config.llm.create_llm()` for Claude API integration with temperature=0
  - Standard library only for file I/O (pathlib) and git operations (subprocess)

  **Architecture Integration:**
  - LLM: Leverages existing CrewAI infrastructure (already in pyproject.toml)
  - Git: Matches pattern from git_tools.py—transparent subprocess calls
  - Validation: Reuses existing markdown validation patterns from content_generators.py
  - File system: Writes to repo root, consistent with 200+ existing test files

  ## Key Design Decisions

  ### 1. Deterministic Prose Generation (Claude API, temperature=0)

  **Decision:** Use Claude API with temperature=0 (sampling disabled) for deterministic prose generation.

  **Alternatives Rejected:**
  - CrewAI Agent framework—adds unnecessary abstraction; subprocess approach from feature_201 is simpler
  - Hard-coded content per feature—defeats purpose of prose generation; cannot maintain 200+ unique topics

  **Rationale:**
  - Spec requirement (question 1): "Deterministic (same output each run)"
  - Claude API temperature=0 inherently ensures reproducible output (always returns most likely token)
  - Proven effective: 200+ test files demonstrate prose quality with this approach
  - Aligns with NFR-6 requirement for deterministic generation
  - No custom seeding logic needed—temperature=0 provides determinism by default

  ### 2. Sentence Validation via Period Counting

  **Decision:** Count periods (.) in prose text to validate 2-3 sentences.

  **Alternatives Rejected:**
  - NLTK/spaCy NLP libraries—external dependency not in pyproject.toml; overkill for simple counting
  - Complex regex-based detection—fragile across languages; mishandles abbreviations

  **Rationale:**
  - Simple and transparent—count periods directly in prose content
  - Proven by feature_201 and 200+ existing test files
  - No external dependencies needed
  - Easy to debug—direct character counting is reliable
  - Spec requirement: exactly 2-3 sentences = exactly 2-3 periods in typical prose

  ### 3. Git Operations via subprocess (Standard Commands)

  **Decision:** Use Python subprocess to call standard git commands directly.

  **Alternatives Rejected:**
  - GitPython library—adds abstraction layer; feature_201 uses subprocess and proves it works
  - CrewAI GitCommitTool/GitPushTool—adds complexity; raw subprocess is clearer for debugging

  **Rationale:**
  - Transparent—see exactly what git commands run
  - Simple—no abstraction layers to debug
  - Proven by feature_201
  - Fail-fast: subprocess.run(..., check=True) raises CalledProcessError on git errors
  - Three operations: git add, git commit -m, git push -u origin branch

  ### 4. File Encoding: pathlib.Path.write_text() + Binary Validation

  **Decision:** Write file via pathlib with UTF-8 encoding, validate via binary read for BOM/CRLF detection.

  **Alternatives Rejected:**
  - Manual binary encoding—unnecessary complexity; pathlib handles UTF-8 without BOM automatically
  - Cross-platform line ending conversion—spec requires Unix LF only; unnecessary in Linux environment

  **Rationale:**
  - pathlib.Path.write_text(encoding=\"utf-8\") is Python 3.11+ standard library
  - Automatically encodes as UTF-8 without BOM
  - Binary validation checks for BOM (b'\\xef\\xbb\\xbf') and CRLF (b'\\r\\n')
  - Matches feature_201 validation pattern—aligns with existing approach
  - No external dependencies required

  ### 5. Prose Quality Validation (Trust Claude + Structural Checks)

  **Decision:** Trust Claude API output at temperature=0 plus basic structural validation (markdown format, sentence count, file size).

  **Alternatives Rejected:**
  - LLM-based semantic quality check—expensive (2x API cost), slow, unnecessary with temperature=0
  - Complex heuristics (entropy, readability)—fragile, hard to debug, no evidence needed from 200+ files

  **Rationale:**
  - Spec requirement: "meaningful, coherent, thematically related to title"
  - With temperature=0 and well-crafted prompt, Claude output is consistently high quality
  - 200+ existing test files demonstrate uniform quality without secondary validation
  - Validation focuses on structural requirements: sentence count, markdown syntax, file size bounds
  - Aligns with feature_201 approach (no semantic validation needed)
  - Fails fast on structural issues; content quality assured by LLM selection

  ### 6. Module Structure: Isolated Feature Module

  **Decision:** Create `src/sheep/features/feature_202_markdown_file_creation.py` (mirrors feature_201 pattern).

  **Alternatives Rejected:**
  - Add to content_generators.py—feature-specific logic should be isolated
  - Reusable orchestration class—premature abstraction; only 2 features use this pattern

  **Rationale:**
  - Consistent naming: feature_NNN_* pattern is discoverable in codebase
  - Feature 201 uses this structure and proves it works
  - Isolated code easier to maintain and test
  - Feature-specific logic doesn't pollute general utility modules
  - Aligns with existing Sheep platform conventions

  ### 7. Error Handling: Fail Fast

  **Decision:** Stop immediately on any validation or git failure with clear error message.

  **Alternatives Rejected:**
  - Retry logic with exponential backoff—spec explicitly resolved question 4 to \"fail immediately\"
  - Automatic correction (re-encode, fix line endings)—spec resolved question 3 to fail immediately

  **Rationale:**
  - Spec requirements explicitly choose fail-fast (questions 3-4)
  - Transparency—user sees exact failure point for debugging
  - Aligns with Sheep platform's transparency-first philosophy
  - Validation failures indicate environmental/configuration issues that must be debugged, not hidden
  - subprocess.run(..., check=True) raises CalledProcessError; all validation raises ValueError

  ## Implementation Strategy

  **Phase 1 (Content Generation & File Creation):**
  Create module with deterministic prose/title generation via Claude API (temperature=0), then write markdown file to disk with proper encoding and line endings. This builds the foundation: reproducible content generation and verified file creation.

  **Phase 2 (Validation Pipeline):**
  Implement comprehensive validation checks before commit. Validation is critical because it ensures the file meets all success criteria (markdown format, sentence count, encoding, line endings, file size, content quality). Fail fast on any validation error.

  **Phase 3 (Git Integration & Orchestration):**
  Implement git workflow (add, commit, push) with proper error handling. Create main orchestration function that coordinates content generation → file creation → validation → git operations. This phase brings everything together into an executable feature.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API rate limiting or timeout | Use temperature=0 (faster deterministic generation); keep prompt concise; feature is small (5-8 second total execution) |
  | Prose generation returns low-quality content | Use well-crafted system prompt; temperature=0 ensures consistency; 200+ existing test files validate approach effectiveness |
  | File encoding issues (BOM, CRLF) | Binary validation reads file and explicitly checks for BOM marker and CRLF sequences; fails fast if detected |
  | Git authentication or push failure | subprocess check=True raises CalledProcessError immediately; clear error message helps user debug (auth config, branch name, network) |
  | Sentence count validation is fragile | Period counting is simple and proven; handles typical prose well; if edge cases arise, can expand with simple heuristics |
  | File already exists (test-b1weep.md) | pathlib.write_text() overwrites; acceptable for test file creation (consistent with 200+ precedent); could add pre-check if needed later |
  | Wrong branch checked out | Validate current branch before push; fail if not feat/202-markdown-file-creation-4dbea6 |
