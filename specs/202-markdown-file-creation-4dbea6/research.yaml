decisions:
  - title: "Prose Generation Method"
    chosen: "Claude API with temperature=0 for deterministic generation"
    rejected:
      - "CrewAI Agent framework—adds unnecessary abstraction layer and complexity; stdlib subprocess approach in feature_201 proves simpler and sufficient for this task"
      - "Hard-coded content per feature number—defeats purpose of demonstrating prose generation capability; reduces platform credibility; cannot maintain 200+ unique meaningful topics"
    rationale: >
      "The spec requirement for 'deterministic output (same output each run)' is best achieved via Claude API with
      temperature=0 (sampling disabled), ensuring reproducible prose generation. This approach:
      (1) Aligns with NFR-6 (deterministic generation);
      (2) Leverages existing CrewAI LLM infrastructure already in pyproject.toml;
      (3) Matches content_generators.py pattern (already validates markdown structure);
      (4) Requires no custom seeding logic—Claude with temperature=0 is inherently deterministic;
      (5) Enables arbitrary topics per spec question 5 resolution;
      (6) Is proven effective: 200+ test files demonstrate prose quality with this approach."

  - title: "Sentence Validation Strategy"
    chosen: "Simple period counting (count '.' characters in prose content)"
    rejected:
      - "NLTK or spaCy NLP libraries—adds external dependency; not in pyproject.toml; overkill for simple sentence counting; increases wall-clock time significantly"
      - "Complex regex-based sentence detection—fragile across languages; mishandles abbreviations, decimals, ellipsis; harder to debug than direct period count"
    rationale: >
      "Period counting is simple, reliable, and proven by feature_201 and 200+ existing test files.
      Sentence validation rules (from spec success criteria and content_generators.py):
      Extract prose content (lines after H1 heading + blank line), count periods in prose text,
      validate count is 2-3 (matching specification).
      This approach handles the exact requirement (2-3 sentences = 2-3 periods for typical prose).
      Reduces complexity, maintains transparency for debugging, aligns with established patterns."

  - title: "Git Operations Implementation"
    chosen: "Use Python subprocess to call standard git commands (git add, git commit -m, git push -u origin branch)"
    rejected:
      - "GitPython library—available in pyproject.toml but not used by existing features; adds unnecessary abstraction; subprocess approach in feature_201 is proven, simple, and transparent"
      - "CrewAI GitCommitTool and GitPushTool—adds abstraction layer; makes debugging harder; feature_201 uses raw subprocess for clarity and direct error handling"
    rationale: >
      "Subprocess approach directly mirrors feature_201 implementation.
      Benefits: (1) Transparent—exactly what git commands run; (2) Simple—no abstraction layers to debug;
      (3) Proven—feature_201 successfully uses this approach; (4) Compatible—no additional library imports needed;
      (5) Aligned—matches Sheep platform's preference for clarity and direct control.
      Specific commands: git add test-b1weep.md; git commit -m 'feat(202): Create markdown file...';
      git push -u origin feat/202-markdown-file-creation-4dbea6.
      Error handling: Subprocess.run with check=True (fail fast on any git error)."

  - title: "File Encoding and Line Endings"
    chosen: "Write via pathlib.Path.write_text() with encoding='utf-8', then verify via binary read for encoding/line ending validation"
    rejected:
      - "Manual binary encoding with UTF-8 BOM handling—unnecessary complexity; pathlib write_text() defaults to UTF-8 without BOM"
      - "Cross-platform line ending conversion—spec requires Unix LF only; unnecessary for Linux environment; content_generators.py already demonstrates UTF-8 only"
    rationale: >
      "Pathlib.Path.write_text(encoding='utf-8') is Python 3.11+ standard library. Benefits:
      (1) Automatically encodes as UTF-8 without BOM; (2) Avoids CRLF on any platform (text mode);
      (3) Aligns with content_generators.py and feature_201 validation patterns;
      (4) Requires no external dependencies.
      Validation uses binary read to detect BOM (b'\\xef\\xbb\\xbf') and CRLF (b'\\r\\n'),
      matching feature_201 verification pattern. Success criteria require explicit verification of encoding/line endings,
      so binary validation is necessary before committing."

  - title: "Prose Quality Validation"
    chosen: "Trust Claude API output + basic structural validation (sentence count, length, markdown format)"
    rejected:
      - "LLM-based semantic quality check via secondary API call—expensive (2x API cost), slow (10-15m wall-clock target), unnecessary if using temperature=0 with well-crafted prompt"
      - "Complex heuristics (entropy, word diversity, readability scores)—fragile, hard to debug, may reject valid prose; no evidence from 200+ test files that this is needed"
    rationale: >
      "Specification requirement is 'meaningful, coherent, thematically related to title' (Success Criteria #7, NFR-2).
      With Claude API at temperature=0 and well-crafted prompt, output quality is consistently high—evidenced by
      200+ existing test files of uniform quality. Validation focuses on structural requirements:
      (1) Sentence count is 2-3 (period counting); (2) Markdown syntax is valid (H1 at start);
      (3) Content length is within bounds (250-600 bytes per spec).
      This matches feature_201 approach (no semantic validation) and aligns with fail-fast principle:
      structural failures stop execution; content quality is assured by LLM selection and temperature."

  - title: "Deterministic Generation Mechanism"
    chosen: "Use Claude API with temperature=0 (sampling disabled)"
    rejected:
      - "Custom seed-based RNG—unnecessary; Claude API respects temperature parameter; adds complexity without benefit"
      - "Fixed seed string concatenation (feature number + static salt)—overcomplicates generation when temperature=0 already provides determinism"
    rationale: >
      "Spec requirement (resolved question 1): 'Deterministic (same output each run)'.
      Claude API with temperature=0 disables sampling and always returns the most likely next token.
      This is the standard way to achieve determinism in LLM outputs. Benefits:
      (1) Simple—no custom logic needed; (2) Standard—documented LLM behavior;
      (3) Proven—existing content_generators.py uses get_reasoning_llm() which can be configured to temperature=0;
      (4) No additional dependencies or complexity.
      Feature 202 will use: create_llm(model=settings.reasoning_model, temperature=0)."

  - title: "Implementation Module Structure"
    chosen: "Create src/sheep/features/feature_202_markdown_file_creation.py (mirrors feature_201 pattern)"
    rejected:
      - "Add to content_generators.py—feature-specific logic should be isolated; existing content_generators.py is general-purpose; easier to maintain separate per-feature modules"
      - "Create reusable orchestration class—premature abstraction; only two features (201-202) use this pattern; abstraction beneficial after 3+ similar features"
    rationale: >
      "Feature 201 is located at src/sheep/features/feature_201_markdown_file_creation.py.
      Consistent module naming follows Sheep platform convention. Benefits:
      (1) Easy to find—feature_NNN_* pattern is discoverable;
      (2) Isolated—feature-specific code doesn't pollute general utilities;
      (3) Compatible—matches existing project structure and CI/CD expectations;
      (4) Precedent—feature_201 demonstrates this structure works.
      Module will contain: content generation (reusing content_generators.py), file creation/validation,
      git operations, and main orchestration. Can extend content_generators.py functions as needed."

  - title: "Error Handling Strategy"
    chosen: "Fail fast with subprocess.run(check=True)—immediate exit on any validation or git failure"
    rejected:
      - "Retry logic with exponential backoff—spec resolved question 4 to 'Fail immediately with clear error'; adds complexity; transient failures rare in local repos"
      - "Automatic correction (re-encode, fix line endings)—spec resolved question 3 to fail immediately; masks systemic issues that should be debugged, not hidden"
    rationale: >
      "Spec requirements explicitly choose fail-fast approach (resolved questions 3-4):
      'Fail immediately and report error', 'Stop on first git error, report error to user'.
      Benefits: (1) Transparency—user sees exact failure point; (2) Debuggability—no hidden corrections mask issues;
      (3) Reliability—aligns with Sheep platform's transparency-first philosophy;
      (4) Simplicity—no retry loops or backoff timers.
      Implementation: subprocess.run(..., check=True) raises CalledProcessError on failure.
      All validation checks raise ValueError with descriptive messages. main() catches exceptions,
      logs with sys.stderr, and exits with code 1. Matches feature_201 error handling pattern."

