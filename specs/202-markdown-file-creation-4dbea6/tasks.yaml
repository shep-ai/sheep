content: |
  ## Task Breakdown Summary

  **Phase 1: Content Generation & File Creation (2 tasks, ~55 min)**

  Create the feature module and implement deterministic prose/title generation using Claude API with temperature=0.
  Generate title as H1 markdown heading, construct markdown content (heading + blank line + prose),
  and write to disk with proper UTF-8 encoding and Unix LF line endings.

  **Phase 2: Validation Pipeline (4 tasks, ~75 min)**

  Implement comprehensive validation covering all success criteria:
  - Markdown format (H1 heading at start, blank line after)
  - Sentence count (period counting for 2-3 sentences)
  - Encoding and line endings (UTF-8 no BOM, LF only)
  - File size (250-600 bytes)

  Each validation function is independent and can be tested in isolation, then combined into
  a validation pipeline that runs before git operations.

  **Phase 3: Git Integration & Orchestration (2 tasks, ~55 min)**

  Implement git workflow (add, commit with conventional message, push to branch) using subprocess.
  Integrate all steps into main() orchestration function with proper error handling,
  fail-fast behavior, and clear error messages for debugging.

  **Total Effort: ~3 hours across 8 focused tasks**

  Implementation follows established patterns from feature 201 with TDD approach (RED-GREEN-REFACTOR)
  for each task, ensuring quality and testability.
