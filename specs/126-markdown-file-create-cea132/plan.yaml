# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown test file following the established pattern from 100+ existing test files in the repository.
  The implementation is straightforward and self-contained:

  - **Prose Generation**: Uses Claude API via subprocess (no external Python dependencies)
  - **File I/O**: Uses Python pathlib with explicit UTF-8 encoding and LF line endings
  - **Validation**: Programmatic checks using Python standard library (file size, encoding, line endings)
  - **Git Integration**: Uses subprocess to invoke native git commands (stage, commit, push)

  No source code modifications are required. The feature creates a single file and performs standard git operations.

  ## Key Design Decisions

  ### 1. Prose Content via Claude API (Subprocess)

  **Chosen**: Use subprocess to invoke Claude API at runtime for dynamic prose generation

  **Rationale**: The spec resolves that prose should be LLM-generated. Subprocess approach:
  - Avoids external Python dependencies (satisfies NFR-8)
  - Maintains automation alignment with the Sheep platform theme
  - Provides semantic diversity by generating new topics each run
  - Matches the approach used in features 123-125

  **Alternative Considered**: Pre-written static prose (rejected because it diverges from LLM-generated decision and limits flexibility)

  ### 2. File I/O with Pathlib

  **Chosen**: Python pathlib for all path operations and file creation

  **Rationale**:
  - Modern, cross-platform standard library API (FR-10 explicitly specifies pathlib)
  - Automatic platform-specific path handling (Windows vs Unix)
  - Type-safe path operations
  - Seamless integration with file I/O

  **Alternative Considered**: os module with string paths (rejected as less modern and error-prone)

  ### 3. Explicit UTF-8 and LF Encoding Control

  **Chosen**: Use open(encoding='utf-8', newline='\\n') to enforce UTF-8 without BOM and Unix-style LF line endings

  **Rationale**:
  - Python's open() parameters provide cross-platform control regardless of system defaults
  - Prevents platform-specific regressions (CRLF on Windows, different encodings)
  - Matches the pattern used in 100+ existing test files
  - Single-point control, no post-processing needed

  **Alternative Considered**: Post-processing conversion (rejected as adding unnecessary complexity)

  ### 4. Strict Programmatic Validation

  **Chosen**: Validate all file properties using Python standard library: file existence, encoding (via decode attempt), line endings (string inspection), file size (Path.stat().st_size)

  **Rationale**:
  - The spec resolves to use strict validation for consistency with established pattern
  - Pure Python validation is cross-platform and maintainable
  - Catches subtle encoding/line-ending issues before they propagate
  - No external tools required (satisfies NFR-8)

  **Alternative Considered**:
  - No validation (rejected as risking silent failures)
  - External tools like `file` or `wc` (rejected as adding dependencies)

  ### 5. Strict Content Format

  **Chosen**: Enforce exact format: heading + blank line + 2-3 sentences + final newline, with no additional markdown elements

  **Rationale**:
  - Matches the format of 100+ existing test files (e.g., test-kpaotj.md, test-z4ucz3.md)
  - Simplifies both prose generation (Claude focuses on coherent prose, not complex structure) and validation (no complex markdown parsing)
  - Prevents scope creep (FR-9: no lists, code blocks, links, etc.)

  ### 6. Git Operations via Subprocess

  **Chosen**: Use subprocess module to invoke native git commands for staging, committing, and pushing

  **Rationale**:
  - No external Python dependencies (satisfies NFR-8)
  - Reliable, battle-tested native git CLI
  - Simple and maintainable compared to implementing git protocol
  - Matches features 123-125 approach

  **Alternative Considered**: GitPython library (rejected as external dependency)

  ## Implementation Strategy

  The implementation follows a linear progression of 6 tasks across 5 phases:

  1. **Setup (Phase 1)**: Validate git repository is ready
  2. **Content Generation (Phase 2)**: Generate prose via Claude API
  3. **File Creation (Phase 3)**: Create markdown file with proper format and encoding
  4. **Validation (Phase 4)**: Verify all file properties match success criteria
  5. **Git Integration (Phase 5)**: Stage, commit, push, and verify

  Each task follows TDD (RED-GREEN-REFACTOR) cycles to ensure correctness and maintainability.

  Dependencies are linear: setup → generation → creation → validation → git operations.
  No parallel work is possible since each phase depends on the previous.

  The total estimated effort is 10-15 minutes actual implementation, consistent with the S (Small) size estimate.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Claude API unavailability** | Use simple error propagation (fail-fast). API errors bubble up as clear exceptions rather than silent failures. Appropriate for controlled environment. |
  | **Platform-specific encoding issues (CRLF on Windows)** | Explicit UTF-8 and LF control via open() parameters ensures consistent behavior across platforms. |
  | **Git operation failures (branch doesn't exist, no credentials)** | Validate repository state in Phase 1 before attempting git operations. Check working tree is clean, correct branch exists, git credentials configured. |
  | **Prose generation produces invalid markdown** | Claude API is highly reliable for simple prose generation. Validation in Phase 4 catches any structural issues. |
  | **File size outside 400-600 byte range** | This range is well-established from 100+ existing files. 2-3 sentences of typical prose consistently fall within this range. If generation produces edge cases, validation will catch it. |
  | **Duplicate topics across test files** | Optional enhancement: pass sample of existing test file topics to Claude API to request diversity. For initial implementation, simple open-ended prompt is sufficient. |

