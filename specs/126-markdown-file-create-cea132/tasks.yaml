content: |
  ## Task Summary

  This feature is implemented in 6 focused tasks across 5 phases, following TDD (RED-GREEN-REFACTOR) methodology:

  **Phase 1: Setup & Validation (Task 1-1)**
  - Validate git repository is ready (correct branch, clean working tree, git configured)

  **Phase 2: Content Generation (Task 2-1)**
  - Generate diverse prose via Claude API using subprocess (no external Python dependencies)

  **Phase 3: File Creation (Task 3-1)**
  - Create markdown file with proper format, UTF-8 encoding, and LF line endings using pathlib

  **Phase 4: Validation (Tasks 4-1, 4-2)**
  - Validate file encoding/line endings (Task 4-1)
  - Validate file size and content structure (Task 4-2)

  **Phase 5: Git Integration (Tasks 5-1, 5-2)**
  - Stage file and create commit with exact conventional message (Task 5-1)
  - Push to feature branch and verify commit in git log (Task 5-2)

  ## Dependency Chain

  The task flow is strictly linear:

  - Task 1-1 (validation) must complete first
  - Task 2-1 (prose generation) depends on nothing technical, but logically precedes file creation
  - Task 3-1 (file creation) depends on Task 2-1 output (generated prose)
  - Tasks 4-1 and 4-2 (validation) both depend on Task 3-1 (file must exist)
  - Task 5-1 (commit) depends on Tasks 4-1 and 4-2 (validation must pass)
  - Task 5-2 (push) depends on Task 5-1 (commit must exist)

  ## Estimated Timeline

  Each task has granular time estimates:

  - Task 1-1: 15 min (git validation with subprocess and error handling)
  - Task 2-1: 20 min (Claude API integration with subprocess and response parsing)
  - Task 3-1: 15 min (file creation with pathlib and encoding control)
  - Task 4-1: 15 min (encoding/line ending validation with comprehensive checks)
  - Task 4-2: 15 min (size and structure validation with clear error messages)
  - Task 5-1: 10 min (staging and commit with subprocess)
  - Task 5-2: 10 min (push and verification)

  **Total: ~90 minutes of implementation effort**

  This includes full TDD cycles (RED-GREEN-REFACTOR) for each task. The actual feature execution time is estimated at 10-15 minutes (size S), but implementation with test coverage takes longer.

  ## Success Criteria for Entire Feature

  All 6 tasks complete successfully when:

  1. Git repository is validated and ready ✓
  2. Prose generated via Claude API ✓
  3. Markdown file created with correct format and encoding ✓
  4. File encoding and line endings validated ✓
  5. File size and structure validated ✓
  6. File staged and committed with exact conventional message ✓
  7. Commit pushed to feature branch ✓
  8. Commit verified in git log ✓

  All validation checks pass, and git log shows the new commit with correct metadata (message, author, file).

