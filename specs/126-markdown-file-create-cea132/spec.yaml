content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-lqbnqn.md) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 100+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 123-125, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-lqbnqn.md` created at repository root (not in subdirectory)
  - [ ] File contains Level-1 markdown heading (# Title) as first line
  - [ ] File contains exactly 2-3 sentences of coherent, grammatically correct prose
  - [ ] Prose content is meaningful and demonstrates writing quality
  - [ ] File encoding is UTF-8
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File size is between 400-600 bytes (inclusive)
  - [ ] File is staged using `git add test-lqbnqn.md`
  - [ ] Commit message is exactly: `feat(126): create markdown file test-lqbnqn.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/126-markdown-file-create-cea132`
  - [ ] `git log` shows the commit with correct message and author
  - [ ] File follows established markdown format: heading + blank line + prose (no extra sections)

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-lqbnqn.md` at the repository root directory
  - **FR-2**: File must contain a Level-1 markdown heading (# Title) as the first line
  - **FR-3**: File must contain a blank line after the heading
  - **FR-4**: File must contain 2-3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be coherent, grammatically correct, and demonstrate semantic quality
  - **FR-6**: File must be staged in git using `git add test-lqbnqn.md`
  - **FR-7**: File must be committed with commit message: `feat(126): create markdown file test-lqbnqn.md with prose content`
  - **FR-8**: Commit must be pushed to remote feature branch `feat/126-markdown-file-create-cea132`
  - **FR-9**: File must not contain any markdown elements beyond the heading and prose (no lists, code blocks, links, etc.)
  - **FR-10**: Implementation must use Python pathlib for cross-platform file I/O

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 with no BOM (Byte Order Mark)
  - **NFR-2**: File must use LF (Unix-style, \n) line endings, not CRLF or CR
  - **NFR-3**: File size must be approximately 400-600 bytes
  - **NFR-4**: Markdown syntax must be valid and follow the established pattern from existing 100+ test files
  - **NFR-5**: Prose content must be diverse in topic and distinct from other test files
  - **NFR-6**: Implementation must complete in less than 15 minutes
  - **NFR-7**: Implementation must not modify any existing files or directories other than creating test-lqbnqn.md
  - **NFR-8**: Implementation must not require external dependencies beyond Python 3.11+ standard library and Git
  - **NFR-9**: Git operations must succeed without errors or conflicts
  - **NFR-10**: Heading title (prose topic) should be lowercase or title case for consistency

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose be LLM-generated or manually written? | LLM-generated | Aligns with automated platform theme, ensures quality and diversity, enables scale |
  | 2 | Should file properties be strictly validated (encoding, line endings, bytes)? | Strict validation | Ensures consistency with 100+ existing test files and established pattern |
  | 3 | Should commit message follow strict format or allow flexibility? | Strict format | Maintains git history consistency and matches features 123-125 pattern |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-lqbnqn.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 123-125; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, agents, or tooling |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create-cea132` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **LLM access** (if using LLM-generated content): Access to Claude or similar LLM for prose generation

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (generate one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (123-125) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product decisions documented_
