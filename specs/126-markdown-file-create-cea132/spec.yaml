content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files following an established pattern. This feature creates a single test markdown file
  (test-lqbnqn.md) at the repository root with a title and prose content, demonstrating
  automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 123-125, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep project has the following key structure:

  ```
  /
  ├── specs/                      # Feature specification directory (analysis, planning, docs)
  │   ├── 006-joke-markdown/
  │   ├── 125-markdown-file-create/
  │   └── 126-markdown-file-create-cea132/
  ├── src/sheep/                  # Main source code (agents, config, tools, CLI)
  │   ├── agents/                 # CrewAI agent definitions
  │   ├── config/                 # Settings and LLM configuration
  │   ├── features/               # Feature implementations (numbered)
  │   └── cli.py                  # Command-line interface
  ├── tests/                      # Test directory for unit tests
  ├── pyproject.toml              # Python project configuration
  ├── test-*.md                   # 100+ markdown test files at repository root
  ├── README.md                   # Project documentation
  └── Dockerfile, docker-compose.yml   # Container configuration
  ```

  ### Architecture Patterns

  **Pattern Recognition from Established Precedents:**

  The repository demonstrates a clear pattern for this feature type:

  - **File Creation Pattern**: 100+ test markdown files (test-0qakgw.md, test-kpaotj.md, test-a6pcqm.md, etc.) exist
    at the repository root, each following an identical format:
    - Level-1 heading (# Title) with a meaningful title
    - Blank line separator
    - 2-3 sentences of prose content
    - File size in range of 400-600 bytes
    - UTF-8 encoding with LF line endings

  - **Git Workflow Pattern**: Based on commit history (features 121-125):
    - Create file in feature branch
    - Stage with `git add <filename>`
    - Commit with conventional format: `feat(NNN): create markdown file <filename> with prose content`
    - Push to remote on feature branch

  - **Content Generation Pattern**: Prose content is auto-generated, covering diverse topics including:
    - Abstract concepts (incremental progress, sleep, power)
    - Scientific fields (black holes, acoustic engineering, cloud computing)
    - Traditional crafts and humanities (embossing, fermentation, folklore)
    - Natural phenomena and observational topics
    - All content is coherent, grammatically correct, and 2-3 sentences long

  ### Relevant Technologies

  - **Python 3.11+**: Standard library provides all necessary tools (pathlib, json, os)
  - **Markdown Format**: Simple plain-text markdown with no complex syntax
  - **Git/GitPython**: Version control integration for staging, committing, and pushing
  - **File I/O**: `pathlib.Path` for cross-platform file creation with UTF-8 encoding

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-lqbnqn.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 123-125; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, agents, or tooling |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create-cea132` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (123-125) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Analysis phase complete — codebase structure understood, architectural patterns identified, affected areas mapped_
