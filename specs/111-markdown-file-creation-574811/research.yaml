decisions:
  - title: "File I/O Implementation Method"
    chosen: "Python pathlib.Path"
    rejected:
      - "os.open() / os.write() — lower-level, more verbose, less Pythonic; pathlib provides higher-level abstraction"
      - "open() built-in with context managers — valid but pathlib's write_text() is more concise for single operations"
      - "Subprocess-based file creation (echo, cat) — platform-dependent, unnecessary when pathlib available"
    rationale: >
      pathlib.Path is the standard, modern Python approach for file I/O since Python 3.4.
      It is explicitly required in NFR-5. The method Path("filename").write_text(content, encoding="utf-8")
      handles file creation, encoding, and line endings in a single call. This matches the established
      pattern across 110+ existing test files in the repository and requires zero external dependencies
      (pathlib is Python standard library). The API is more readable and less error-prone than open()/write()
      for simple single-file operations.

  - title: "Content Generation Strategy"
    chosen: "Simple deterministic prose generation with flexible topic selection"
    rejected:
      - "Random prose generation with external library — adds complexity and external dependency; no practical benefit for test files"
      - "Fetching content from external API — introduces network I/O, latency, failure modes, and external service dependency; violates NFR-9 (no new dependencies)"
      - "Template-based generation with parameterization — unnecessary indirection for single 2-3 sentence requirement"
    rationale: >
      The user query explicitly states \"about anything\", and product guidance confirms no topic restriction
      is needed (see spec product question #1). Feature should demonstrate straightforward, deterministic behavior.
      Observed across all 110+ existing test files: prose is simple, grammatically correct sentences on any topic
      (e.g., innovation, communication, problem-solving, learning). This approach is human-readable, testable,
      reproducible, and requires zero external dependencies. Content generation should be trivial and not the
      focus of this feature; the focus is file creation and git integration.

  - title: "Git Integration Approach"
    chosen: "Git CLI via subprocess (standard git commands)"
    rejected:
      - "GitPython library — available in dependencies (gitpython>=3.1.0) but introduces unnecessary abstraction layer for simple operations; git CLI is widely understood and debuggable"
      - "Direct git objects/plumbing — overcomplicated for simple add/commit/push workflow"
      - "Pre-commit hooks or CI automation — out of scope; this feature must complete git operations directly"
    rationale: >
      The established pattern across 110+ existing features uses git CLI commands: git add, git commit,
      git push. These are simple, transparent, and universally available on any system with git installed.
      Subprocess-based git is already proven in the codebase (used in prior features 063-110). While GitPython
      is available as a dependency, it adds abstraction without benefit for straightforward operations.
      Git CLI commands are easier to debug, understand in logs, and maintain. Implementation uses
      subprocess.run() with proper error handling and output capture.

  - title: "File Encoding and Line Endings"
    chosen: "UTF-8 without BOM, LF line endings (\\n)"
    rejected:
      - "UTF-8 with BOM — adds unnecessary bytes; CommonMark spec recommends UTF-8 without BOM; not used in any existing test files"
      - "UTF-16 or other encodings — unnecessary; UTF-8 is standard for markdown and text files"
      - "CRLF line endings (\\r\\n) — Windows-style; NFR-2 explicitly requires LF; all existing test files use LF"
    rationale: >
      UTF-8 without BOM is the standard for markdown files and text across the web. The CommonMark specification
      assumes UTF-8 encoding. NFR-2 explicitly requires LF line endings (\\n), and all 110+ existing test files
      follow this convention. Python's pathlib.Path.write_text() defaults to system encoding but can be overridden;
      passing encoding=\"utf-8\" ensures consistent behavior across platforms. LF is enforced by writing content
      directly as strings with \\n separators (not os.linesep which varies by platform).

  - title: "File Size Validation Strategy"
    chosen: "No strict validation; guideline-based (400-600 bytes typical)"
    rejected:
      - "Strict byte-count enforcement with rejection/retry — adds validation complexity; natural prose variation makes this unnecessary and overly rigid"
      - "Dynamic content sizing to hit exact target — over-engineered; forces artificial prose expansion/contraction"
      - "Size checks post-creation with file truncation — error-prone; adds failure modes and awkward retry logic"
    rationale: >
      NFR-3 specifies 400-600 bytes as a guideline (\"typically\"), not a hard requirement. Analysis of existing
      test files shows natural variation within and near this range based on sentence length and vocabulary choice.
      Enforcing exact sizes introduces unnecessary complexity and failure modes. The feature's purpose is file creation
      with valid markdown and 2-3 sentences of prose; file size is a natural consequence, not a constraint. Tight
      coupling between content generation and size metrics would be premature optimization and would require
      iterative content generation with measurement/retry logic.

  - title: "Implementation Approach (Single vs. Script-Based)"
    chosen: "Direct file creation and git operations (imperative, single-step)"
    rejected:
      - "Python script generation and execution — unnecessary indirection; directly create file and run git commands"
      - "Makefile-based approach — adds dependency on make; not portable to all systems"
      - "CI/CD pipeline integration — out of scope; feature should work standalone locally"
    rationale: >
      The established pattern across 110+ features is straightforward: create file, stage it, commit it, push it.
      No complex orchestration, no generated scripts, no CI dependencies. Direct implementation keeps the feature
      simple, testable, and debuggable. Matches the \"small\" (S) size estimate: ~10-15 minutes of imperative
      operations without intermediate artifacts.

