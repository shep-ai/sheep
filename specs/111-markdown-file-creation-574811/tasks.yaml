content: |
  ## Summary

  This feature implementation consists of 5 focused tasks across 2 phases:

  **Phase 1: File Creation & Content Generation** (Tasks 1-2, ~8 minutes)
  - Create the markdown file with H1 heading and 2-3 prose sentences using pathlib
  - Verify UTF-8 encoding without BOM and LF line endings for cross-platform compatibility

  **Phase 2: Git Integration & Publication** (Tasks 3-5, ~7 minutes)
  - Stage file with git add
  - Commit with conventional commit message format
  - Push to remote origin to complete the feature

  Each task follows TDD discipline: RED (verify current state), GREEN (minimal implementation), REFACTOR (validate and document).

  All tasks are sequential with clear dependencies. No parallel work is possible given the workflow dependencies (file must exist before git staging, staging must complete before commit, commit must exist before push).

  **Total Estimated Effort:** 15 minutes (consistent with feature size estimate: S)

  ## Implementation Notes

  **File Content Guidelines:**
  - Topic: Flexible; any topic is acceptable (user query: "about anything")
  - Structure: `# Heading\n\n<sentence 1>. <sentence 2>. <sentence 3>.`
  - Length: ~2-3 sentences, typically 400-600 bytes total
  - Examples from prior features: innovation, communication, learning, problem-solving, nature
  - Prose should be grammatically correct and readable

  **Git Commit Message:**
  - Exact format: `feat(111): create markdown file test-0ztu6n.md with prose content`
  - No variations; exact string for consistency with feature 111
  - Follows conventional commits format (feat, scope, description)

  **Encoding & Line Endings:**
  - UTF-8 without BOM (no leading bytes 0xEF 0xBB 0xBF)
  - LF line endings only (0x0A); no CRLF (0x0D 0x0A)
  - Use pathlib.write_text(encoding="utf-8") and \n in content strings

  **Success Criteria (Summary):**
  ✓ File exists: test-0ztu6n.md in repository root
  ✓ Content: H1 heading + blank line + 2-3 prose sentences
  ✓ Encoding: UTF-8 without BOM, LF line endings
  ✓ Git: Staged, committed, pushed to remote
  ✓ Commit message: `feat(111): create markdown file test-0ztu6n.md with prose content`
  ✓ Branch: Feature branch `feat/111-markdown-file-creation-574811`

  ---

  _5 tasks, 15 minutes estimated, ready for implementation_
