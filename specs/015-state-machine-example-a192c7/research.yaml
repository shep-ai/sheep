content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. State Machine Subject: Elevator

  **Chosen:** Elevator

  **Rejected:**
  - ATM / Vending machine variant — redundant with existing VENDING_MACHINE_STATE_MACHINE.md
  - Phone call lifecycle — more abstract; less universally intuitive

  **Rationale:** Universal familiarity, physically intuitive transitions, distinct from all
  four existing examples.

  ### 2. Prose Level: Heading + one-liner + diagram

  **Chosen:** Heading + one descriptive sentence + Mermaid block

  **Rejected:**
  - Diagram only — inconsistent with TURNSTILE_STATE_MACHINE.md pattern
  - Full prose + table — violates "short" requirement and 40-line NFR

  **Rationale:** Matches the most recently added file's structure exactly.

  ### 3. Mermaid Version: stateDiagram-v2

  **Chosen:** stateDiagram-v2

  **Rejected:**
  - stateDiagram v1 — deprecated and inconsistent with all existing files
  - flowchart/graph — wrong diagram type for state machines

  **Rationale:** Required by NFR-2 and used in every existing file.

  ### 4. File Naming and Location

  **Chosen:** ELEVATOR_STATE_MACHINE.md at repo root

  **Rejected:**
  - kebab-case name — breaks existing naming convention
  - subdirectory placement — inconsistent with existing file locations

  **Rationale:** Matches FR-1 and the SCREAMING_SNAKE_CASE pattern of all existing files.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State diagram rendering | Use | Already used in all existing files; required by NFR-2 |
  | No other libraries | — | N/A | Pure markdown file; no build tools or dependencies needed |

  ## Security Considerations

  No security implications. This is a static documentation file with no executable code,
  no user input, no network requests, and no secrets.

  ## Performance Implications

  No performance implications. A ~30-line markdown file has negligible impact on repo
  size or documentation rendering time.

  ## Architecture Notes

  The change is purely additive: one new markdown file at the repo root. It follows the
  identical structural pattern established by DOOR_LOCK_STATE_MACHINE.md,
  VENDING_MACHINE_STATE_MACHINE.md, and TURNSTILE_STATE_MACHINE.md. No existing files
  are modified and there are no code dependencies.
