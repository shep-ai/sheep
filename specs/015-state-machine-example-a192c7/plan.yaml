# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The repo contains a flat collection of standalone markdown files at the root,
  each illustrating a different state machine with a Mermaid stateDiagram-v2
  diagram. The pattern is: level-1 heading, one descriptive sentence, fenced
  Mermaid code block. No index, no cross-references, no build pipeline — purely
  human- and GitHub-renderable documentation.

  The new file slots into this collection without touching any existing file.

  ## Key Design Decisions

  **Subject: Elevator**
  All existing examples (traffic light, door lock, vending machine, turnstile) are
  covered. An elevator provides a universally intuitive operating cycle
  (Idle → Moving Up → Floor Reached → Moving Down → Idle) with clean transitions,
  distinct from everything already in the collection.

  **Prose level: Heading + one-liner + diagram**
  TURNSTILE_STATE_MACHINE.md (most recently added) uses exactly this structure.
  Matching it keeps the collection consistent and satisfies the "short" requirement
  (NFR-3: ≤40 lines).

  **Diagram version: stateDiagram-v2**
  Every existing file uses stateDiagram-v2. NFR-2 requires it. It supports [*]
  initial/terminal arrows (FR-3).

  **Naming and location: ELEVATOR_STATE_MACHINE.md at repo root**
  FR-1 specifies this explicitly. SCREAMING_SNAKE_CASE matches all existing files.
  Root placement keeps the collection co-located.

  ## Implementation Strategy

  Single phase: create the file. The file is self-contained with no dependencies,
  so there is nothing to sequence or parallelize. Verification is manual inspection
  against the six success criteria in the spec.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error in diagram | Cross-check against stateDiagram-v2 reference; mirror the exact syntax pattern from TURNSTILE_STATE_MACHINE.md |
  | File encoding / line-ending drift | Write with LF endings and UTF-8 encoding (NFR-5) |
  | Naming inconsistency | Use exact filename from FR-1: ELEVATOR_STATE_MACHINE.md |
