content: |
  ## Problem Statement

  The repo collects illustrative markdown documents with state machine diagrams.
  A new standalone example is needed that is self-contained and unrelated to the
  repository's main domain, extending the collection with a fresh subject.

  ## Success Criteria

  - [ ] A new markdown file exists at the repo root following the `<SUBJECT>_STATE_MACHINE.md` naming pattern
  - [ ] The file contains a valid `stateDiagram-v2` Mermaid code block that renders without errors
  - [ ] The state machine subject is not already covered by an existing file in the repo
  - [ ] The diagram has at least 3 distinct states and at least 3 labeled transitions
  - [ ] The file includes a brief (one sentence) description of the state machine subject
  - [ ] The file does not reference or depend on any other file in the repo

  ## Functional Requirements

  - **FR-1**: Create a single new markdown file named `ELEVATOR_STATE_MACHINE.md` at the repository root.
  - **FR-2**: The file must contain a `stateDiagram-v2` Mermaid diagram block with a minimum of 4 states and 4 labeled transitions representing an elevator's operating cycle.
  - **FR-3**: The diagram must include an `[*]` initial state arrow and an `[*]` terminal state arrow consistent with existing examples.
  - **FR-4**: The file must include a level-1 or level-2 heading matching the subject (e.g., `# Elevator State Machine`).
  - **FR-5**: The file must include one descriptive sentence explaining what the diagram represents, placed before the code block.
  - **FR-6**: No existing files may be modified; the change is purely additive.

  ## Non-Functional Requirements

  - **NFR-1**: The file must be valid GitHub-Flavored Markdown renderable without plugins beyond Mermaid.
  - **NFR-2**: The Mermaid diagram syntax must be valid `stateDiagram-v2` (not `stateDiagram` v1) to match the existing repo convention.
  - **NFR-3**: Total file length should not exceed 40 lines to remain "short" per the user requirement.
  - **NFR-4**: State and transition labels must be human-readable plain English with no abbreviations.
  - **NFR-5**: The file must use LF line endings and UTF-8 encoding consistent with the repo's other markdown files.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which state machine subject to use? | Elevator | Universal, distinct from all existing examples, clean 4-5 state diagram |
  | 2 | How much prose beyond the diagram? | Heading + one-liner + diagram | Matches existing file pattern; satisfies "short" requirement |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new .md file) | Low | Adds one standalone markdown file; no code changes |

  ## Dependencies

  None. Pure documentation file with no code dependencies.

  ## Size Estimate

  **S** — Single markdown file, ~25-35 lines, following the established pattern of existing state machine files.
