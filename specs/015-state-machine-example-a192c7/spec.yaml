  ## Problem Statement

  The repo collects illustrative markdown documents with state machine diagrams.
  A new standalone example is needed that is self-contained and unrelated to the
  repository's main domain.

  ## Codebase Analysis

  ### Project Structure

  Root-level markdown files are the pattern: STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md,
  VENDING_MACHINE_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md all live at the repo root
  and contain Mermaid stateDiagram-v2 diagrams. This new file follows the same pattern.

  ### Architecture Patterns

  Flat root-level placement, no subdirectory needed. Files are purely documentation with
  no code dependencies.

  ### Relevant Technologies

  - Markdown for the document
  - Mermaid `stateDiagram-v2` for the diagram (consistent with existing files)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new .md file) | Low | Adds one standalone markdown file, no code changes |

  ## Dependencies

  None. Pure documentation file.

  ## Size Estimate

  **S** — Single markdown file, ~20 lines, following established pattern from existing state machine files.
