content: |
  ## Summary

  Feature 133 implementation follows a linear dependency chain of 5 sequential tasks:

  1. **Content Generation (task-1)** — Implement prose generation using template-based approach with deterministic topic selection. Returns markdown string with heading + prose targeting 500 bytes.

  2. **File I/O (task-2)** — Write generated content to test-2b39vd.md using pathlib.Path.write_text() with UTF-8 encoding and LF line endings.

  3. **Constraint Validation (task-3)** — Verify file meets all requirements: size 400-600 bytes, UTF-8 without BOM, LF line endings, valid markdown structure.

  4. **Git Integration (task-4)** — Stage file, create conventional commit, and push to feature branch using subprocess calls to git CLI.

  5. **Final Verification (task-5)** — Confirm repository is clean, file exists with correct content, commit is on remote, and all success criteria are satisfied.

  Each task has clear input/output and explicit dependencies. No parallelism is needed for this single-file feature. Task execution is straightforward: each task builds directly on the output of the previous task.

  **Total estimated effort: ~1 hour** (including TDD cycles for all tasks)

  ### Why This Task Structure

  - **Sequential dependency chain:** File must be created before validation, validated before committing, committed before pushing, pushed before final verification.
  - **TDD throughout:** Each task has explicit RED (test assertions), GREEN (minimal implementation), REFACTOR (improvement) phases.
  - **Single-file scope:** Feature complexity is minimal (one markdown file); task count is proportional to implementation steps, not feature complexity.
  - **Pattern validation:** Each task validates against established patterns from features 125-132, ensuring consistency.

  ### Implementation Notes

  - **No external dependencies:** All code uses Python 3.11+ standard library (pathlib, subprocess) and system git CLI.
  - **Idempotent file creation:** pathlib.Path.write_text() overwrites silently; re-running feature produces identical result.
  - **Deterministic content:** Topic selection based on filename hash ensures same input → same output (reproducible).
  - **Error handling:** Each task should gracefully report failures with clear error messages to aid troubleshooting.
  - **Git workflow simplicity:** Standard add/commit/push sequence with --no-verify flag to skip hooks on test files.
