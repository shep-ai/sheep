content: |
  ## Problem Statement

  Create a single markdown file named `test-0egl0w.md` in the repository root directory.
  The file should contain a valid markdown structure with an H1 title/heading and 2-3 sentences
  of prose content about any topic. This is a trivial, content-only task with no code changes,
  no architectural decisions, and no infrastructure modifications required.

  ## Success Criteria

  - [ ] File `test-0egl0w.md` is created in the repository root directory
  - [ ] The file contains valid markdown with an H1 heading (syntax: `# Title`)
  - [ ] The file contains exactly 2-3 sentences of prose content
  - [ ] The prose content is grammatically correct and readable
  - [ ] The file uses UTF-8 encoding
  - [ ] The file ends with a trailing newline (POSIX convention)
  - [ ] No existing files are modified or affected

  ## Functional Requirements

  - **FR-1**: The markdown file MUST be named exactly `test-0egl0w.md`
  - **FR-2**: The file MUST be created in the repository root directory
  - **FR-3**: The file MUST contain a valid H1 markdown heading (using `# ` syntax)
  - **FR-4**: The file MUST contain between 2 and 3 sentences of prose content following the heading
  - **FR-5**: The prose content may be about any topic (no topic restrictions apply)
  - **FR-6**: The heading and prose content together must form valid, well-formed markdown

  ## Non-Functional Requirements

  - **NFR-1**: The file MUST use UTF-8 character encoding
  - **NFR-2**: The file MUST end with a trailing newline character (Unix/POSIX convention)
  - **NFR-3**: No existing files, directories, or code in the repository shall be modified
  - **NFR-4**: The prose content MUST be grammatically correct and readable
  - **NFR-5**: The total file size should not exceed 1 KB (typical for this file type)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adding a single new markdown file; no modifications to existing files or code |

  ## Dependencies

  None. This task is completely self-contained:
  - No code imports or library dependencies
  - No interaction with Python modules or the Sheep platform
  - No git operations beyond file creation (handled by implementation phase)
  - No build, test, or infrastructure changes required

  ## Size Estimate

  **S** — Single file creation with only content, no code changes, no tests, no architectural impact.
  This is a trivial task requiring minimal effort (minutes to complete).
