content: |
  ## Architecture Overview

  Feature 203 follows the proven architectural pattern established in features 150-202.
  The implementation is a single feature module that orchestrates content generation, file creation,
  validation, and git operations. It integrates with existing sheep infrastructure:
  - Uses `sheep.config.llm.create_llm()` for Claude API access
  - Uses `sheep.observability.logging.get_logger()` for logging
  - Follows functional programming style (generation → file creation → validators → git operations)
  - Uses Python standard library (pathlib, subprocess) — no new external dependencies

  ## Key Design Decisions

  ### 1. Single Module Architecture
  **Chosen:** Single file `feature_203_markdown_file_creation.py` with all functions

  **Rationale:** Feature 202 demonstrates this pattern successfully. Scope is small enough that
  separate modules would add unnecessary overhead. All functions are cohesive (single feature)
  and fit in ~750 lines of well-structured code. Matches established pattern across features 150-202.

  ### 2. Deterministic Content Generation
  **Chosen:** Claude 3.5 Sonnet with temperature=0 (via CrewAI)

  **Rationale:** Research findings show proven use across 200+ test files with 100% success rate.
  Temperature=0 ensures identical prose on repeated runs (reproducibility NFR-2). Single API call
  per generation with no retries needed. Deterministic output enables fast validation without variance.

  ### 3. File I/O with UTF-8 and Unix Line Endings
  **Chosen:** `pathlib.Path.write_text(content, encoding=\"utf-8\")`

  **Rationale:** Modern Python standard library approach proven through 200+ existing test files.
  Automatically encodes as UTF-8 without BOM, inherits Unix LF line endings on Unix systems,
  atomically writes file, no external dependencies.

  ### 4. Modular Validation Pipeline
  **Chosen:** Sequence of granular validators raising exceptions on first error

  **Rationale:** Specification requires 10 specific success criteria. Modular validators enable:
  - Independent testing of each validation check
  - Clear error messages for debugging
  - Fail-fast behavior (stop at first error)
  - Code reusability within validators

  **Validator Sequence:**
  1. File exists
  2. Markdown format (H1 heading, blank line, prose)
  3. Sentence count (2-3 sentences)
  4. UTF-8 encoding without BOM
  5. Unix LF line endings only
  6. File size (250-600 bytes)

  ### 5. Git Operations via subprocess.run()
  **Chosen:** `subprocess.run()` with structured command lists

  **Rationale:** Three simple sequential operations (add, commit, push) don't require GitPython
  abstraction. Proven in feature 202. Uses check=True to raise on errors, capture_output=True
  for error diagnostics.

  ### 6. Sentence Validation via Period Counting
  **Chosen:** `prose.count(\".\")`

  **Rationale:** Simple, deterministic, proven method for Claude-generated prose. No external
  NLP dependencies. 100% accuracy for 2-3 sentence requirement. Proven in features 200-202.

  ## Implementation Strategy

  **Phase Ordering:**
  1. Module setup first (constants used throughout)
  2. Content generation before file creation (validate content before writing)
  3. File creation with validation (fail-fast, don't push invalid files)
  4. Git operations after validation (only push validated files)
  5. Orchestration last (coordinates all phases)

  **Workflow Time:** ~10-15 seconds
  - Content generation: 2-5 seconds (Claude API)
  - File creation + validation: ~1 second
  - Git operations: 1.5-5.5 seconds

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API rate limiting or failure | Use temperature=0 to eliminate retries; timeout handling in main() |
  | File already exists | Check existence before writing; raise FileExistsError with clear message |
  | UTF-8 encoding issues (BOM, invalid characters) | pathlib.Path.write_text() handles safely; validate_encoding() checks |
  | Line ending conversion (Git auto-CRLF) | pathlib respects OS default (LF on Unix); validate_line_endings() checks |
  | Generated prose invalid sentence count | Claude with temperature=0 highly reliable; validate_sentence_count() catches edge cases |
  | Git operations fail | subprocess with check=True raises CalledProcessError; error messages captured |
  | File size outside range | Claude prose produces ~350-550 bytes; validate_file_size() verifies |
  | Directory permissions issue | Feature assumes write access to repo root; OSError caught in main() |

  ## Deliverables

  **Code:** `src/sheep/features/feature_203_markdown_file_creation.py` (~750 lines)

  **Validation:** All success criteria verified:
  - File test-saop27.md created in repository root
  - Contains H1 heading + blank line + 2-3 sentences
  - UTF-8 encoding without BOM, Unix LF line endings
  - File size 250-600 bytes
  - Staged with git add, committed, and pushed

