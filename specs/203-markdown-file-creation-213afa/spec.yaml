content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-saop27.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-202, with 200+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system, proving the platform can consistently produce high-quality files that match established patterns.

  ## Success Criteria

  - [ ] File named `test-saop27.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings only (\n, not \r\n or \r)
  - [ ] File size is between 250 and 600 bytes (inclusive)
  - [ ] Prose content is thematically coherent and meaningful (not random words)
  - [ ] File is staged with `git add test-saop27.md`
  - [ ] Commit message follows conventional commits format: `feat(203): Create markdown file test-saop27.md with title and prose content`
  - [ ] Changes are pushed to feature branch `feat/203-markdown-file-creation-213afa`
  - [ ] All validation checks pass (format, encoding, line endings, sentence count, file size)

  ## Functional Requirements

  **FR-1: File Creation**
  - Must create a markdown file named `test-saop27.md`
  - File must be created in the repository root directory (same level as .git, src/, specs/)

  **FR-2: Markdown H1 Heading**
  - File must contain exactly one H1 markdown heading (format: `# Title`)
  - Heading must be the first content line of the file
  - No other headings of any level are permitted

  **FR-3: Prose Content Structure**
  - File must contain exactly 2-3 sentences of prose after the H1 heading
  - Prose must be separated from heading by exactly one blank line
  - Sentences must be separated by standard punctuation (periods, exclamation marks, question marks)
  - No additional blank lines within the prose section are permitted

  **FR-4: File Encoding**
  - File must be UTF-8 encoded
  - File must not contain a Byte Order Mark (BOM)
  - All characters must be valid UTF-8 (no mojibake or encoding errors)

  **FR-5: Line Ending Format**
  - File must use Unix LF line endings only (\n)
  - Must not contain Windows CRLF line endings (\r\n)
  - Must not contain old Mac CR line endings (\r)
  - Final line must end with a newline character

  **FR-6: Prose Quality**
  - Prose content must be thematically coherent and meaningful
  - Prose must follow proper English grammar and spelling
  - Content must be appropriate and non-offensive
  - Sentences must form a logically connected thought or narrative

  **FR-7: File Size Constraint**
  - File size must be between 250 and 600 bytes (inclusive)
  - Measured as UTF-8 encoded bytes on disk
  - Includes heading, blank line, prose, and trailing newline

  **FR-8: Git Staging**
  - File must be staged to the git index using `git add test-saop27.md`
  - File must be included in the next git commit

  **FR-9: Git Commit**
  - Commit message must follow Conventional Commits specification
  - Message format: `feat(203): Create markdown file test-saop27.md with title and prose content`
  - Commit scope must be `203`
  - Commit type must be `feat`
  - Commit description must describe the file creation action
  - Commit must include only the test markdown file

  **FR-10: Git Push**
  - Changes must be pushed to the feature branch `feat/203-markdown-file-creation-213afa`
  - Remote tracking branch must be set up if pushing for the first time
  - Push must succeed without merge conflicts or remote rejections

  ## Non-Functional Requirements

  **NFR-1: File Size Optimization**
  - Target file size should be in the 300-550 byte range (within the 250-600 range)
  - Ensures efficient storage without excessive verbosity or truncation
  - Aligns with precedents from 200+ existing test files

  **NFR-2: Content Generation Determinism**
  - Prose generation should use deterministic approach (e.g., Claude API with temperature=0)
  - Ensures reproducible, consistent output across multiple runs
  - Reduces variance in generated content while maintaining quality

  **NFR-3: Dependency Minimization**
  - Implementation must use only Python standard library for file I/O operations
  - Git operations must use standard `subprocess` module
  - No external dependencies required beyond project's existing dependencies
  - Must not introduce new package requirements to pyproject.toml

  **NFR-4: Pattern Consistency**
  - Implementation must follow established pattern from features 150-202
  - File format must match precedents from 200+ existing test markdown files
  - Git workflow must follow conventional commits pattern
  - Code structure should match feature implementation modules in `src/sheep/features/`

  **NFR-5: Performance**
  - File creation and git operations must complete within 30 seconds
  - Prose generation via Claude API should complete within 15 seconds
  - File I/O operations should complete within 1 second
  - No unnecessary API calls or delays

  **NFR-6: Error Handling and Validation**
  - If file creation fails, provide clear error messages describing the failure
  - If git operations fail (add, commit, push), provide diagnostic information
  - All validation checks must complete without raising unhandled exceptions
  - Validation failures must be caught and reported with specific error reasons

  **NFR-7: Maintainability**
  - Implementation code should follow project's existing code style and patterns
  - Modules should include clear docstrings for functions
  - Validation functions should be modular and reusable
  - Code should be readable and maintainable for future contributors

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-202; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | Low | Creates one new feature module feature_203_markdown_file_creation.py following established pattern from 200+ prior features; no modifications to existing code |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/203-markdown-file-creation-213afa` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Claude API access with valid authentication credentials (for LLM prose generation)
  - Target filename: `test-saop27.md` (specified in user query)

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-202) demonstrate successful execution of identical pattern
  - Recent commits (200-202) show exact templates and working examples
  - Feature 202 implementation provides direct code precedent for implementation approach

  **Not Required:**
  - No source code modifications to existing files
  - No changes to core platform logic in agents, flows, or tools
  - No modification of configuration files
  - No test framework integration
  - No documentation updates beyond spec files

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 200+ existing test files:

  - **Content generation**: ~3-5 minutes (generate title and 2-3 sentences via Claude API with deterministic seed)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings using pathlib)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, line endings, file size, prose quality)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (200-202) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 202 implementation serves as direct working precedent for all implementation patterns
  - File creation and git operations use only Python standard library (pathlib, subprocess) and standard git commands
  - Claude API for prose generation reduces content creation time and ensures quality

  ---

  _Requirements phase complete — ready for implementation planning_
