content: |
  ## Task Summary

  Feature 203 implementation consists of 13 tasks across 5 phases:

  **Phase 1: Module Setup** (Task 1)
  - Create feature module with imports, constants, and prompt template

  **Phase 2: Content Generation** (Tasks 2-3)
  - Implement title generation via Claude API (temperature=0)
  - Implement prose generation via Claude API (temperature=0)

  **Phase 3: File Creation & Validation** (Tasks 4-10)
  - Create markdown file with UTF-8 encoding and LF line endings
  - Validate markdown format (H1 heading, blank line, prose)
  - Validate sentence count (2-3 sentences via period counting)
  - Validate encoding (UTF-8 without BOM)
  - Validate line endings (Unix LF only)
  - Validate file size (250-600 bytes)
  - Run comprehensive validation pipeline (fail-fast)

  **Phase 4: Git Integration** (Task 11)
  - Implement git add, commit, and push operations
  - Each uses subprocess.run() with error handling

  **Phase 5: Orchestration & Testing** (Tasks 12-13)
  - Implement main() orchestration function
  - Run end-to-end integration test

  ## Implementation Notes

  - Each task includes TDD cycle (write test first, minimal implementation, refactor)
  - Validators are modular and reusable
  - Fail-fast behavior: stop on first validation error
  - All logging via sheep.observability.logging module
  - Error messages are specific and actionable
  - No external dependencies beyond Python stdlib and existing project stack

  ## Estimated Timeline

  - Total effort: 60-75 minutes
  - Content generation: 15-20 minutes (Claude API calls, parsing, validation)
  - File creation: 10-15 minutes (pathlib write, verification)
  - Validation pipeline: 25-30 minutes (6 validators, comprehensive testing)
  - Git operations: 10-15 minutes (subprocess integration, error handling)
  - Orchestration & testing: 15-20 minutes (main function, end-to-end test)

  ---

  _Task breakdown ready for implementation._
