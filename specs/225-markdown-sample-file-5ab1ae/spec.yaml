content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-t7zfgs.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 90+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-224, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-t7zfgs.md` exists in the repository root
  - [ ] File begins with a valid markdown H1 heading (format: `# Title`)
  - [ ] File contains exactly 2-3 complete prose sentences following the heading
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File size is in the typical range of 400-600 bytes (natural outcome of quality prose)
  - [ ] Markdown syntax is valid per CommonMark specification
  - [ ] Prose content is grammatically correct and meaningful
  - [ ] File is staged with `git add test-t7zfgs.md`
  - [ ] Commit is created with conventional message: `feat(225): create markdown file test-t7zfgs.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/225-markdown-sample-file-5ab1ae`
  - [ ] Git commit signature and author are correctly set (user.name and user.email configured)

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-t7zfgs.md` in the repository root directory
  - **FR-2**: File must contain a valid markdown H1 heading (starting with `#`) followed by a blank line
  - **FR-3**: File must contain exactly 2-3 complete sentences of prose content after the heading
  - **FR-4**: File must be staged using `git add test-t7zfgs.md`
  - **FR-5**: Staged changes must be committed with conventional commit message format: `feat(225): <description>`
  - **FR-6**: Commit must include a concise description of the file creation (e.g., "create markdown file test-t7zfgs.md with prose content")
  - **FR-7**: Commit must be pushed to the existing feature branch `feat/225-markdown-sample-file-5ab1ae`
  - **FR-8**: Markdown content must conform to CommonMark specification and be renderable without errors

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM to ensure consistency with existing test files and cross-platform compatibility
  - **NFR-2**: File must use LF (Unix-style) line endings to match existing test files and Git best practices
  - **NFR-3**: File size should naturally result in approximately 400-600 bytes as a function of proper prose structure; no artificial padding or minimization
  - **NFR-4**: Conventional commit message must follow the format `feat(225): <description>` exactly (lowercase "feat", number in parentheses, colon and space before description)
  - **NFR-5**: Prose content must be grammatically correct, meaningful, and demonstrate clear communication
  - **NFR-6**: No metadata, comments, or markdown extensions should be added; implementation should follow the established minimal pattern of heading + prose

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content topics be restricted or completely flexible? | Complete freedom (implementer chooses topic) | Feature spec explicitly states "about any topic"; 90+ precedents show successful diverse implementations; no business constraint requires restriction |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-t7zfgs.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-224; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/225-markdown-sample-file-5ab1ae` must already exist (verified in analysis)
  - **File system**: Write access to repository root directory (standard for development environment)
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **File naming**: Filename `test-t7zfgs.md` is specified in the feature requirement and must be used exactly as provided

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-224) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-t7zfgs.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 155+ prior implementations

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria specified, product decisions identified and recommended_
