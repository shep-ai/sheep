  ## Summary

  Three sequential tasks implement this feature:

  1. **Create the markdown file** (task-1): Write test-t7zfgs.md with H1 heading, blank line, and 2-3 prose
     sentences using pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings.

  2. **Stage and commit** (task-2): Use git add and git commit to stage the file and create a conventional
     commit with message 'feat(225): create markdown file test-t7zfgs.md with prose content'.

  3. **Push to branch** (task-3): Push the commit to origin/feat/225-markdown-sample-file-5ab1ae to complete
     the feature integration.

  All tasks are ordered sequentially with clear dependencies. No parallelization is possible because each task
  depends on the previous one (file must exist before staging, commit must exist before pushing). The total
  estimated effort is 10 minutes, matching the \"S\" (Small) size estimate from the feature spec.

  **TDD approach:** Task-1 includes traditional RED-GREEN-REFACTOR cycles. Tasks 2-3 are git workflow tasks
