    title: "Implement H1 heading and markdown structure validation"
    description: "Validate basic markdown format: H1 heading on line 1 (regex ^# .+$), blank line on line 2, prose content starting line 3. Extract to validate_file() function. Prevents malformed markdown from reaching git staging."
    state: "Todo"
