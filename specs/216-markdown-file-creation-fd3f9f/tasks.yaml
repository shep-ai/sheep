tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Create Python script with pathlib file creation and UTF-8/LF encoding"
    description: "Implement core file creation logic using pathlib.Path.write_text() with explicit UTF-8 encoding and Unix (LF) line endings. Create markdown content: H1 heading + blank line + 2-3 sentences of implementer-chosen prose. Extract to create_file() function."
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-wyvzr1.md is created in repository root directory"
      - "File contains H1 heading on line 1 (format: # Title)"
      - "File contains blank line on line 2"
      - "File contains 2-3 sentences of coherent prose on lines 3+"
      - "File is written with UTF-8 encoding (no BOM)"
      - "File uses LF (\\n) line endings only, no CRLF"
      - "File size is between 300-600 bytes"
      - "create_file() function is extracted and callable"
    tdd:
      red:
        - "Write test_create_file_creates_markdown_file() that asserts file exists after create_file()"
        - "Write test_file_encoding_is_utf8() that reads file bytes and verifies UTF-8 (no BOM)"
        - "Write test_file_has_lf_line_endings() that verifies all line endings are \\n, not \\r\\n"
        - "Write test_file_has_correct_structure() that splits lines and verifies H1, blank, prose"
      green:
        - "Define prose content as string constant (H1 + blank + 2-3 sentences)"
        - "Implement create_file() using Path(\"test-wyvzr1.md\").write_text(content, encoding=\"utf-8\", newline=\"\\n\")"
        - "Return Path object for verification in tests"
      refactor:
        - "Extract prose content to PROSE_CONTENT constant for clarity"
        - "Extract function signature to module-level docstring"
        - "Simplify test assertions by using pathlib operations"
    estimatedEffort: "45min"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Implement defensive file existence check"
    description: "Check if test-wyvzr1.md already exists before creation (FR-5). Raise FileExistsError with descriptive message to prevent accidental overwrites. Ensures idempotency (NFR-6)."
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "FileExistsError is raised if test-wyvzr1.md already exists"
      - "Error message clearly states file already exists and user action needed"
      - "Error message format: \"File 'test-wyvzr1.md' already exists. Remove it to proceed.\""
      - "create_file() does not overwrite or append to existing file"
      - "Second execution of create_file() fails gracefully (idempotent behavior)"
    tdd:
      red:
        - "Write test_file_existence_check_raises_error() that creates file, then calls create_file() again, expects FileExistsError"
        - "Write test_error_message_is_descriptive() that verifies error message contains filename and instructions"
      green:
