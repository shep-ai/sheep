openQuestions:
  - question: "What approach should the implementation take for prose content topic selection?"
    resolved: true
    options:
      - option: "Implementer chooses freely"
        description: "Allow the implementer to select any coherent prose topic of their choice. This provides maximum flexibility and is consistent with how 200+ existing test files have varied topics. Fastest execution path since no topic specification overhead is required."
        selected: true
      - option: "Specify a predetermined topic"
        description: "Define a specific topic (e.g., science, history, technology) for consistency. This ensures topical alignment but adds coordination overhead and reduces implementer autonomy on a test file."
        selected: false
      - option: "Provide a template or category"
        description: "Offer a set of category options (e.g., nature, storytelling, education) for the implementer to choose from. Provides structure while maintaining flexibility, but adds decision overhead."
        selected: false
    selectionRationale: "Allowing free topic selection aligns with the established pattern where 200+ test files have diverse, implementer-chosen topics. Since this is a test file with no user-facing content requirements, implementer autonomy maximizes efficiency without sacrificing quality."
    answer: "Implementer chooses freely"

  - question: "What level of content validation should be performed before git operations?"
    resolved: true
    options:
      - option: "Basic validation only"
        description: "Verify that the file contains an H1 heading (line starts with #), has 2-3 sentences of prose content, and is valid UTF-8. This catches obvious formatting mistakes while keeping validation simple and fast."
        selected: true
      - option: "No validation"
        description: "Skip validation and trust the implementer. Fastest execution but risks malformed files entering the repository, requiring cleanup later."
        selected: false
      - option: "Strict validation"
        description: "Full markdown parsing, sentence count verification with NLP, grammar checking, and content quality analysis. Ensures high quality but adds significant complexity, external dependencies, and execution time overhead."
        selected: false
    selectionRationale: "Basic validation strikes the right balance: it prevents obviously malformed files (missing heading, wrong line count) while avoiding the complexity of strict validation. This matches the precedent pattern from features 160-215, which all performed basic format checking."
    answer: "Basic validation only"

  - question: "How should the system handle the case where test-wyvzr1.md already exists?"
    resolved: true
    options:
      - option: "Fail with clear error message"
        description: "Detect the existing file and terminate with a descriptive error indicating the file already exists. This prevents accidental overwrites and data loss. Requires the user to manually handle the conflict, but is the safest approach."
        selected: true
      - option: "Overwrite existing file"
        description: "Replace the existing file with new content without warning. Fastest execution but risks losing existing content and data integrity, violating idempotency principles."
        selected: false
      - option: "Append to existing file"
        description: "Add new content to the existing file. Maintains data but violates the single-file creation contract and could create malformed markdown."
        selected: false
    selectionRationale: "Failing with a clear error message protects data integrity and prevents accidental overwrites of existing test files. This aligns with defensive programming principles and is consistent with standard file creation patterns in Unix-like systems."
    answer: "Fail with clear error message"

  - question: "Should the implementation enforce Unix line endings (LF) or allow platform-specific line endings?"
    resolved: true
    options:
      - option: "Enforce LF (Unix) line endings"
        description: "Always write files with LF (\\n) line endings, regardless of platform. Ensures consistency across the repository and aligns with git best practices for cross-platform projects. The repository is Linux-based and uses LF standard."
        selected: true
      - option: "Use platform-default line endings"
        description: "Allow the operating system's default (LF on Unix/Linux, CRLF on Windows). Simpler implementation but introduces inconsistency across platform boundaries, complicating git diffs."
        selected: false
    selectionRationale: "The repository is Linux-based and the .gitignore/git configuration uses Unix conventions. Enforcing LF ensures consistency with the 200+ existing test files and prevents line-ending drift in git history."
    answer: "Enforce LF (Unix) line endings"

content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-wyvzr1.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 200+ similar test files already existing in the repository as precedents. This feature demonstrates
  core capabilities: file creation, validation, git staging, conventional commits, and push-to-remote
  operations—all essential building blocks in the Sheep automation platform.

  ## Success Criteria

  - [ ] File `test-wyvzr1.md` is created in the repository root directory
  - [ ] File contains valid markdown structure: H1 heading + blank line + 2-3 sentences of prose
  - [ ] File encoding is UTF-8 with Unix line endings (LF)
  - [ ] File size is between 300-600 bytes (typical for test files)
  - [ ] Basic validation passes: H1 heading detected, sentence count in range, no encoding errors
  - [ ] File is staged for commit (`git add` succeeds)
  - [ ] Commit follows conventional commit format: `feat(216): Create markdown file test-wyvzr1.md with prose content`
  - [ ] Commit is recorded in git history with correct message and timestamp
  - [ ] Changes are pushed to feature branch `feat/216-markdown-file-creation-fd3f9f`
  - [ ] Git operations complete without errors or conflicts
  - [ ] Prose content is human-readable and coherent (not Lorem ipsum or placeholders)

  ## Functional Requirements

  - **FR-1**: The system must create a new markdown file named exactly `test-wyvzr1.md` in the repository root directory
  - **FR-2**: The file must contain an H1 heading (line starting with `#`) as the title on line 1
  - **FR-3**: The file must contain a blank line (line 2) between the heading and prose content
  - **FR-4**: The file must contain exactly 2-3 sentences of prose content (lines 3+) describing any topic of implementer's choice
  - **FR-5**: The system must verify the file does not already exist before creation and fail with an error if it does
  - **FR-6**: The file must be written with UTF-8 encoding and Unix line endings (LF, \n)
  - **FR-7**: The system must validate basic markdown format (H1 heading present, sentence count 2-3) before proceeding to git operations
  - **FR-8**: The system must add the created file to git staging area using `git add test-wyvzr1.md`
  - **FR-9**: The system must create a git commit with message: `feat(216): Create markdown file test-wyvzr1.md with prose content`
  - **FR-10**: The system must push the commit to the remote feature branch using `git push -u origin HEAD`
  - **FR-11**: The system must report success and provide the file path, commit hash, and branch name upon completion
  - **FR-12**: The prose content must be coherent, grammatically correct sentences (not Lorem ipsum, templates, or placeholders)

  ## Non-Functional Requirements

  - **NFR-1**: File creation must complete within 5 minutes end-to-end
  - **NFR-2**: File size should be between 300-600 bytes (within typical range for test files)
  - **NFR-3**: Markdown format must be CommonMark-compatible with no special characters or complex features
  - **NFR-4**: Git operations must not modify or affect any existing files in the repository
  - **NFR-5**: Implementation must use only Python standard library (pathlib, subprocess) with no external dependencies
  - **NFR-6**: Implementation must be idempotent: if executed twice, second execution must fail gracefully with clear error message
  - **NFR-7**: All error messages must be descriptive and indicate the specific failure point (file creation, validation, git operation)
  - **NFR-8**: Implementation must support execution on Linux platforms (the repository environment)
  - **NFR-9**: Git configuration with user.name and user.email must be available and properly configured

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What approach should the implementation take for prose content topic selection? | Implementer chooses freely | Maximizes flexibility and aligns with the pattern of 200+ existing test files with varied topics. Provides autonomy without overhead. |
  | 2 | What level of content validation should be performed before git operations? | Basic validation only | Catches obvious formatting mistakes (missing heading, wrong sentence count) while avoiding the complexity of strict validation. Matches the precedent pattern. |
  | 3 | How should the system handle the case where test-wyvzr1.md already exists? | Fail with clear error message | Protects data integrity, prevents accidental overwrites, and is consistent with standard file creation patterns in Unix systems. |
  | 4 | Should the implementation enforce Unix line endings (LF) or allow platform-specific line endings? | Enforce LF (Unix) line endings | Repository is Linux-based and uses LF standard. Ensures consistency with 200+ existing test files and prevents git diff confusion. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 160-215; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/216-markdown-file-creation-fd3f9f` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (160-215) demonstrate successful execution of identical pattern
  - Features 200-215 specs provide exact templates and working examples
  - Implementation scripts in repository root (create_markdown.py, create_markdown_file.py, etc.) show working patterns

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory
  - No integration with CrewAI or other automation frameworks (file creation is standalone)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~3 minutes (compose markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (basic format checks: H1 heading, sentence count, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Product decisions resolved: topic selection, validation level, error handling, line endings
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (210-215) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature branch already created and checked out

  ---

  _Requirements phase complete — ready for implementation planning_
