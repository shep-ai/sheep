content: |
  ## Architecture Overview

  Feature 216 is a minimal markdown file creation task that creates a single test file following
  the established pattern from 210+ preceding test files (features 100-215) in the Sheep project.

  **Implementation approach:**
  - Single Python script (`create_markdown_file.py`) with three main functions: create_file(), validate_file(), git_operations()
  - Uses Python standard library only (pathlib, subprocess, re) per NFR-5
  - No external dependencies, no agent orchestration, no complex logic
  - Direct file I/O and git CLI invocation via subprocess
  - Defensive programming: file existence check before creation, validation before staging

  **Workflow:**
  1. Define markdown content: H1 heading + blank line + 2-3 sentences of prose
  2. Check file doesn't exist (defensive, FR-5)
  3. Create file with pathlib.Path.write_text(encoding='utf-8', newline='\n') (FR-6)
  4. Validate basic format: H1 heading, sentence count, file size, encoding (FR-7)
  5. Stage with git add (FR-8)
  6. Commit with conventional format (FR-9)
  7. Push to feature branch (FR-10)
  8. Report success with path/hash/branch (FR-11)

  **Key characteristics:**
  - No modifications to existing production code or source files
  - Single file added to repository root (test-wyvzr1.md)
  - File size target: 300-600 bytes (typical for test markdown)
  - Prose content is implementer-chosen, coherent, and non-placeholder (FR-12)
  - Total effort: 10-15 minutes (size estimate: Small)

  ## Key Design Decisions

  All design decisions are grounded in the research findings and product requirements resolved
  during the requirements phase.

  ### 1. File I/O Library: pathlib.Path (Standard Library)

  **Decision:** Use `pathlib.Path` from Python standard library for file creation.

  **Why:** pathlib is the modern, idiomatic Python approach for file I/O in Python 3.11+. Provides
  clean object-oriented API with `Path.write_text()` method that handles both encoding (UTF-8)
  and line endings (LF) in a single call, essential for FR-6 requirements. Cross-platform path
  handling, zero external dependencies, part of standard library.

  **How:** Use `Path("test-wyvzr1.md").write_text(content, encoding="utf-8", newline="\n")` to
  create file with explicit UTF-8 encoding and Unix line endings.

  ### 2. Git Operations: subprocess.run() (Standard Library)

  **Decision:** Use `subprocess.run()` with git CLI commands for all git operations.

  **Why:** NFR-5 explicitly mandates "Python standard library only, no external dependencies."
  subprocess.run() is the standard library approach for invoking system commands like git.
  Provides safe subprocess execution with check=True for error handling and CalledProcessError
  on failures. Feature 215 used GitPython (external), but feature 216 constraints require stdlib.
  Matches feature 214 approach.

  **How:** Three git operations via subprocess:
  - `git add test-wyvzr1.md` (FR-8)
  - `git commit -m "feat(216): Create markdown file test-wyvzr1.md with prose content"` (FR-9)
  - `git push -u origin HEAD` (FR-10)

  ### 3. Validation: Basic Regex + Line Counting (Standard Library)

  **Decision:** Use Python `re` module for regex validation and simple line counting for sentence detection.

  **Why:** Spec explicitly requires "basic validation only" (FR-7), not full CommonMark parsing.
  Basic validation means: H1 heading present, sentence count 2-3, file size in range, valid UTF-8.
  Simple regex approach with Python's re module avoids external dependencies and is appropriate
  for "basic" validation level. Matches feature 214 pattern.

  **How:** Validation checks:
  - First line matches regex `^# .+$` (H1 heading format)
  - Prose split by periods and count non-empty results (sentence count)
  - Sentence count between 2-3
  - File size in range 300-600 bytes
  - File readable as UTF-8 (no encoding errors)
  - File contains only LF line endings (no CRLF)
  - First bytes are NOT UTF-8 BOM marker (EF BB BF)

  ### 4. File Existence Error Handling: Defensive Check

  **Decision:** Use `Path.exists()` check before file creation, raise `FileExistsError` if exists.

  **Why:** FR-5 explicitly requires failing with clear error message if file already exists.
  Defensive check prevents accidental overwrites. Idempotency requirement (NFR-6) means second
  execution must fail with clear message, not overwrite. Matches Unix-like defensive programming
  best practices.

  **How:** Check `filepath.exists()` before `write_text()`, raise `FileExistsError` with
  descriptive message: "File 'test-wyvzr1.md' already exists. Remove it to proceed."

  ### 5. Line Ending Strategy: LF Only

  **Decision:** Use `newline='\n'` parameter in `pathlib.write_text()` to enforce Unix line endings.

  **Why:** FR-4 explicitly requires Unix line endings (LF). pathlib.write_text() with
  `newline='\n'` forces Unix-style line endings regardless of platform, ensuring deterministic
  behavior across Windows/Linux/Mac. Standard Python approach for cross-platform consistency.

  **How:** Pass `newline='\n'` to `Path.write_text()` method. No post-write conversion needed.

  ### 6. UTF-8 Encoding Strategy: No BOM

  **Decision:** Use `encoding='utf-8'` in `pathlib.write_text()`, validate no BOM bytes.

  **Why:** FR-6 requires UTF-8 without BOM (Byte Order Mark). pathlib.write_text() with
  `encoding='utf-8'` creates clean UTF-8 file without BOM prefix (unlike 'utf-8-sig' which
  adds 3-byte EF BB BF prefix). Python 3.11+ defaults to UTF-8.

  **How:** Use `encoding='utf-8'` parameter. Validation: read file as bytes and verify first
  bytes are NOT UTF-8 BOM marker (hex EF BB BF).

  ### 7. Prose Content: Hardcoded, Implementer-Chosen Topic

  **Decision:** Hardcode 2-3 sentences of coherent prose at implementation time, implementer
  selects topic freely.

  **Why:** Spec explicitly allows implementer free choice of prose topic (resolved in requirements
  phase). No topic specification overhead needed. Pattern from 210+ existing test files shows
  diverse, implementer-chosen topics work well. File must contain genuine prose (not Lorem Ipsum,
  placeholders, or templates per FR-12).

  **How:** Choose any coherent topic (example: science, history, technology, nature, learning),
  write 2-3 grammatically correct sentences, store as Python string constant. File size naturally
  falls in 300-600 byte target range.

  ### 8. Architecture: Inline Script with Function Decomposition

  **Decision:** Single Python script with functions for create_file(), validate_file(),
  git_operations() tasks.

  **Why:** This is minimal file creation with straightforward workflow. No business logic,
  agent coordination, or complex control flow needed. Direct Python script structure with
  clear functions is most maintainable approach. Can be run as standalone script or embedded
  in agent context.

  **How:** Three main functions with clear responsibilities:
  - `create_file()` — check existence, create with pathlib, return path
  - `validate_file()` — regex/sentence/size/encoding validation, raise on failure
  - `git_operations()` — add, commit, push via subprocess, handle errors

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation & File Creation)** comes first because it's the core task. Must
  succeed before validation and git operations can proceed.

  **Phase 2 (Validation & Error Handling)** follows immediately. Validation runs on the
  created file pre-commit, preventing malformed markdown from entering the repository.
  Defensive programming pattern.

  **Phase 3 (Git Integration & Workflow)** comes after validation. Once file is verified
  correct, stage and commit it. Git operations are deterministic and well-understood.

  **Phase 4 (End-to-End Execution & Verification)** is final. Run complete workflow start
  to finish, verify all steps succeeded. Report success with file path, commit hash, branch name.

  ### Why This Order Matters

  1. **Foundation first (Phase 1):** Can't validate or commit what doesn't exist
  2. **Validation before staging (Phase 2→3):** Ensures only well-formed markdown enters repo
  3. **Git operations last (Phase 3):** After file and validation are ready
  4. **Verification (Phase 4):** Final confirmation all steps worked

  This order ensures defensive, sequential workflow: create → validate → stage → commit → push.
  No rework needed; each phase builds on previous.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists when script runs | Low | High (data loss if overwrite) | Defensive `Path.exists()` check before creation, raise `FileExistsError` (FR-5, NFR-6) |
  | Malformed markdown reaches repo | Low | Low (test file only, easy cleanup) | Pre-commit validation before git add (FR-7) — catches missing heading, wrong sentence count |
  | Git credentials not configured | Very Low | High (push fails) | Assume git user.name/user.email pre-configured (NFR-9 requirement) |
  | Line ending inconsistency (CRLF on Windows) | Low | Low (git diff noise) | Explicit `newline='\n'` parameter enforces LF (FR-4, FR-6) |
  | UTF-8 encoding with BOM | Very Low | Very Low (test file, easily fixed) | Use `encoding='utf-8'` (not 'utf-8-sig'), validate no BOM bytes (FR-6) |
  | External dependencies creep in | Very Low | High (violates NFR-5) | Use only pathlib, subprocess, re (all stdlib) — no GitPython, markdown library, etc. |
  | Subprocess command injection | Very Low | High (security) | Use subprocess.run() with list of args (not shell=True), no user input in command strings |

  **Confidence level:** Very High — pattern well-established with 210+ successful precedents,
  all requirements resolved, no novel risks identified.

  ---

  _Planning phase complete — ready for implementation_
