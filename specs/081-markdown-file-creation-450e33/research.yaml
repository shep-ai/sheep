# Structured technology decisions
decisions:
  - title: 'File I/O Implementation: pathlib vs alternatives'
    chosen: 'Python pathlib.Path'
    rejected:
      - 'open()/close() - older approach is more verbose, requires manual file handle management, less intuitive for path operations'
      - 'os.path + open() - lower-level, requires more boilerplate, less cross-platform friendly, not idiomatic Python 3'
    rationale: >
      pathlib.Path is the modern, idiomatic Python 3 approach for file I/O. It provides intuitive
      object-oriented API, automatic resource management via write_text() context handling, and
      built-in cross-platform path handling. The Path.write_text(content, encoding='utf-8') method
      is perfect for this use case: creates the file, writes content in one atomic operation,
      and guarantees UTF-8 encoding. Explicitly required by NFR-5 in the spec. Available in all
      Python 3.11+ versions (project requirement per pyproject.toml) with zero external dependencies.

  - title: 'Text Encoding Strategy'
    chosen: 'UTF-8 without BOM, explicit encoding parameter'
    rejected:
      - 'Default system encoding - may not be UTF-8 on all systems (especially Windows), risks encoding mismatch, violates NFR-1'
      - 'UTF-8 with BOM - adds 3 extra bytes, unnecessary for UTF-8 plain text, violates NFR-1, causes issues in some tools'
    rationale: >
      Explicit UTF-8 encoding without BOM is required by NFR-1. Using Path.write_text(content, encoding='utf-8')
      ensures consistent encoding across all platforms (Windows, Linux, macOS). The encoding parameter
      forces UTF-8 regardless of system defaults. No BOM means cleaner files compatible with all
      CommonMark parsers and text editors. Size remains within 300-600 byte guideline.

  - title: 'Line Ending Management'
    chosen: 'Native Python \n handling with git core.autocrlf=false'
    rejected:
      - 'Manual CRLF conversion - adds unnecessary complexity, error-prone, violates principle of simplicity'
      - 'os.linesep platform detection - creates platform-specific files, violates NFR-2 requirement for consistent LF'
    rationale: >
      Python strings using \n naturally represent Unix LF line endings in the string representation.
      When Path.write_text() writes with encoding='utf-8', it preserves \n as LF bytes (0x0A) in the file,
      exactly as required by NFR-2. Git with core.autocrlf=false (or newline=LF in .gitattributes)
      ensures no CRLF conversion on Windows. This approach is idiomatic Python, requires no special
      handling, and produces correct files on all platforms. Verified against 80+ existing test files
      which all follow this pattern.

  - title: 'Content Generation Approach'
    chosen: 'Simple string concatenation with literal prose'
    rejected:
      - 'Template system (Jinja2, f-strings with complex logic) - adds unnecessary dependency or complexity for trivial task'
      - 'Content generator class/function - over-engineering for 2-3 prose sentences, violates simplicity principle'
    rationale: >
      A straightforward string with H1 heading + prose is clearest and simplest. The content string
      is just three parts: heading line, blank line, prose sentences. No logic or templating needed.
      String literal approach requires zero dependencies, minimal code, and is immediately readable.
      Matches the pattern of all 80+ existing test files which use simple string content. Prose topic
      is flexible (implementer choice) so no need for any selection logic.

  - title: 'Git Workflow Implementation'
    chosen: 'Python subprocess or GitPython library for git operations'
    rejected:
      - 'Shell script invocation - not idiomatic in Python, harder to test, less portable (Windows compatibility issues)'
      - 'Manual git command construction - error-prone, requires proper escaping, difficult to handle edge cases'
    rationale: >
      Per the project dependencies (pyproject.toml), GitPython 3.1.0+ is already available and listed
      as a core dependency. Using GitPython provides programmatic git control (Repo object, index.add(),
      commit()) with proper error handling. Alternatively, subprocess with git commands is simple and
      straightforward. Both approaches are valid; GitPython slightly preferred for consistency with
      project stack. However, git CLI commands via subprocess are equally viable and simpler for this
      minimal use case. Either approach works; git CLI is simplest (requires no additional Python code
      beyond what PathLib already provides).

  - title: 'Validation and Error Handling'
    chosen: 'Basic error handling for file creation; no defensive validation'
    rejected:
      - 'Comprehensive validation (file exists checks, encoding verification, git status checks) - over-engineering for guaranteed-success scenario'
      - 'Silent failure with logging only - makes debugging harder, violates user expectation of clear errors'
    rationale: >
      File creation in a fresh feature branch is a guaranteed-success operation. The feature branch
      is clean, the filename is unique (not used before), and the repository root is always writable.
      Comprehensive error handling adds unnecessary code. A simple try/except for FileNotFoundError or
      PermissionError is sufficient. This matches the pattern of existing implementations. Per NFR-7,
      no source code modifications are made, and the implementation is isolated to one file creation,
      so error scenarios are minimal and predictable.

