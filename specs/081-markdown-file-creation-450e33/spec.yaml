# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-y1vl67.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 80+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 063-080, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-y1vl67.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content, separated from heading by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 300-600 bytes (as a consequence of proper structure)
  - [ ] File is staged in git using `git add test-y1vl67.md`
  - [ ] Git commit with exact message exists: `feat(081): Create markdown file test-y1vl67.md with prose content`
  - [ ] Commit is created on the feature branch `feat/081-markdown-file-creation-450e33`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-y1vl67.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-y1vl67.md`
  - **FR-7**: File must be committed with the exact message: `feat(081): Create markdown file test-y1vl67.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/081-markdown-file-creation-450e33`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 300-600 bytes (guideline, not strict limit)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 80+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (explicitly flexible per user query "about anything")
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Requirements Summary

  **Functional scope** (9 requirements): File creation and git workflow
  - Create markdown file with exact filename in repo root (**FR-1, FR-2**)
  - Structure file with H1 heading + 2-3 prose sentences (**FR-3, FR-4, FR-5**)
  - Integrate with git: stage, commit with conventional message, push (**FR-6, FR-7, FR-8, FR-9**)

  **Non-functional scope** (9 requirements): Encoding, formatting, patterns, isolation
  - Encoding and line endings: UTF-8 without BOM, LF line endings (**NFR-1, NFR-2**)
  - Content validation: Valid CommonMark syntax, 300-600 bytes typical (**NFR-3, NFR-4**)
  - Implementation constraints: pathlib for I/O, no source code changes, no new dependencies (**NFR-5, NFR-7, NFR-9**)
  - Pattern alignment: Follow 80+ precedent files, flexible prose topic (**NFR-6, NFR-8**)

  **Measurability**: All requirements are testable via automated file validation and git history inspection.

  ## Product Decisions & AI Recommendations

  **Summary**: Three core product decisions have been made and are resolved (no blocking questions remain):

  1. **File naming**: Use exact filename from user request (`test-y1vl67.md`)
     - Aligns with user expectation and established pattern from 80+ test files (features 063-080)
     - Each feature creates one uniquely-named file

  2. **Content structure**: H1 heading + 2-3 prose sentences (not title-only)
     - Follows the established pattern of all 80+ precedent files
     - Provides meaningful test content while keeping implementation simple
     - Predictable output size (300-600 bytes)

  3. **Prose topic selection**: Allow implementer flexibility (any topic)
     - Explicitly matches user query "about anything"
     - Reduces decision friction during implementation
     - Topic irrelevance has zero impact on functionality

  All decisions are documented in openQuestions with structured options and recommendations. Specification is complete and ready for implementation.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 80+ test markdown files (test-*.md) following a consistent pattern, plus configuration and documentation files
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability) implementing the CrewAI-based automated implementation platform
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/081-markdown-file-creation-450e33/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with dependencies and build tools
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation describing the Sheep platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern (features 063-080+) and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (80+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 300-600 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/081-markdown-file-creation-450e33`
  - Create/modify files in working directory
  - Stage with `git add test-y1vl67.md`
  - Commit with conventional commit format: `feat(081): Create markdown file test-y1vl67.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 063-080):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-y1vl67.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content
  - **CrewAI**: Framework used in the Sheep platform (not directly involved in this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-y1vl67.md) to existing collection of 80+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-080; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/081-markdown-file-creation-450e33` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 80+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 300-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 80+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (063-080) demonstrate efficient implementation of identical features in 10-15 minutes

