content: |
  ## Problem Statement

  Create a markdown file named `test-wpab4m.md` containing:
  - An H1 markdown heading with a title about any topic
  - A blank line separator
  - 2-3 sentences of coherent prose content

  The file must follow the established pattern from 163 preceding features and integrate seamlessly with the existing markdown creation infrastructure. The feature will generate content dynamically using Claude API, validate output against strict format requirements, write to the repository root with UTF-8 encoding and LF line endings, then commit and push via Git.

  ## Success Criteria

  - [ ] File `test-wpab4m.md` is created in repository root
  - [ ] File contains exactly one H1 heading (e.g., `# Some Title`)
  - [ ] File contains a blank line after the H1 heading
  - [ ] File contains 2-3 sentences of prose content after the blank line
  - [ ] Prose content is coherent and grammatically correct
  - [ ] File is encoded in UTF-8 with Unix LF line endings
  - [ ] File passes format validation (enforces all structure requirements)
  - [ ] File is staged and committed with message format `feat(164): Create markdown file test-wpab4m.md with prose content`
  - [ ] Commit is pushed to remote feature branch with upstream tracking
  - [ ] Implementation follows established pattern from Feature 163 and prior features
  - [ ] No errors occur during content generation, file writing, validation, commit, or push
  - [ ] Feature function is exported from `src/sheep/features/__init__.py` as `create_feature_164_markdown_file()`

  ## Functional Requirements

  - **FR-1**: Feature must create a file named `test-wpab4m.md` at the repository root
  - **FR-2**: File must contain exactly one H1 markdown heading (`# Title`)
  - **FR-3**: File must contain a blank line separating the H1 heading from prose content
  - **FR-4**: File must contain 2-3 sentences of prose content
  - **FR-5**: Prose content must be coherent and grammatically correct
  - **FR-6**: Content must be generated using Claude API via `content_generators.generate_markdown_content()`
  - **FR-7**: File must be written to disk using `content_generators.write_markdown_file()` with UTF-8 encoding
  - **FR-8**: File must be validated using `content_generators.validate_markdown_file()` before commit (strict format requirements)
  - **FR-9**: File must be staged and committed using `content_generators.commit_markdown_file()` with conventional message `feat(164): Create markdown file test-wpab4m.md with prose content`
  - **FR-10**: File must be pushed to remote using `content_generators.push_markdown_file()` with upstream tracking
  - **FR-11**: Function must return a result dictionary containing filepath, content, commit message, and push result
  - **FR-12**: Feature implementation must be located at `src/sheep/features/feature_164_markdown_file_creation.py`
  - **FR-13**: Feature must be exported from `src/sheep/features/__init__.py` as `create_feature_164_markdown_file()`
  - **FR-14**: Function must accept optional parameters for content customization (e.g., topic, length) matching Feature 163 interface

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding with no BOM
  - **NFR-2**: File must use Unix LF (`\n`) line endings, not Windows CRLF (`\r\n`)
  - **NFR-3**: Implementation must follow the architectural pattern established by Feature 163 and prior features
  - **NFR-4**: Code must leverage existing helper functions from `content_generators.py` (no custom implementation, no code duplication)
  - **NFR-5**: Feature must include structured logging via `sheep.observability.logging.get_logger()` for content generation, file write, validation, commit, and push steps
  - **NFR-6**: Feature must include comprehensive docstring explaining purpose, parameters, return value, and possible exceptions
  - **NFR-7**: Implementation must fail fast: if validation fails, return error status without attempting recovery or fallback logic
  - **NFR-8**: Execution must complete within 1-2 hours (established size estimate of S for 15-30 minute implementation)
  - **NFR-9**: Git operations must use existing GitPython abstractions in `git_tools.py` and `content_generators.py` (no direct repository manipulation)
  - **NFR-10**: No new dependencies required; must use only CrewAI, Claude API, GitPython, Pydantic (already installed)
  - **NFR-11**: Error handling must distinguish between validation failures (output format violation), API failures (content generation), and git failures (commit/push) with specific error codes
  - **NFR-12**: Feature must be idempotent when called on same branch (detect existing file and handle gracefully)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the feature use existing helper functions from content_generators.py or implement custom logic? | Use existing helpers | Maintains consistency with 163 prior features, eliminates code duplication, leverages proven infrastructure, follows established architectural pattern |
  | 2 | Should markdown content be generated dynamically by Claude API or use a pre-written static template? | Generate via Claude API | Leverages LLM capabilities, provides content variety, consistent with established pattern, already fully implemented in helper functions |
  | 3 | Should validation be strict (exact format requirements) or flexible/lenient? | Strict validation | Ensures output quality, catches errors before commit, matches existing infrastructure design, prevents bad commits, aligns with 163 prior features |
  | 4 | Should the feature fail immediately on validation error or attempt recovery? | Fail fast on error | Prevents invalid commits, provides clear error signals, keeps logic simple, allows informed decisions on retry, established pattern |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Repository root**: Contains 164+ test markdown files (test-*.md) that are artifacts of feature implementations
  - **src/sheep/**: Application source code containing agents, config, flows, tools, and observability modules
  - **src/sheep/features/**: Feature implementations directory with files like feature_163_markdown_file_creation.py (163 prior features, with this being feature 164)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/164-markdown-file-creation-dad326/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform

  The markdown file creation features form a well-established pattern demonstrating the platform's ability to execute isolated, repeatable tasks with consistent quality and structure.

  ### Architecture Patterns

  **Established File Creation Pattern** (163 precedents):
  - Leverages existing helper functions from `content_generators.py` for all operations
  - Each markdown file follows strict format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 300-600 bytes
  - Implementation follows structured orchestration pattern with clear task separation and error handling

  **Feature Implementation Pattern** (observed in features 001-163):
  - Feature modules located at `src/sheep/features/feature_<N>_markdown_file_creation.py`
  - Each feature module implements a single function: `create_feature_<N>_markdown_file()`
  - Functions exported from `src/sheep/features/__init__.py`
  - Follows structured logging, docstring conventions, and fail-fast error handling patterns
  - Uses helper functions from content_generators.py rather than implementing custom logic

  **Git Workflow Pattern**:
  - Create feature branch (pre-created as feat/164-markdown-file-creation-dad326)
  - Generate/modify content via helper functions
  - Stage with git add via helper abstraction
  - Commit with conventional commit format: `feat(164): Create markdown file test-wpab4m.md with prose content`
  - Push to feature branch with upstream tracking
  - No modifications to source code or configuration files (only test artifacts)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **CrewAI**: Multi-agent orchestration framework providing LLM management and tool integration
  - **Claude API**: LLM used via CrewAI's LLM interface for dynamic content generation (model determined by config)
  - **GitPython**: Python library for git operations; abstracted through content_generators.py and git_tools.py
  - **Pydantic**: Data validation library (already in project dependencies)
  - **pathlib (Python standard library)**: Used for file I/O operations in content_generators.py
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content validated per CommonMark spec and custom validation rules

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/` | High | Must create `feature_164_markdown_file_creation.py` implementing the feature function |
  | `src/sheep/features/__init__.py` | Medium | Add import/export for `create_feature_164_markdown_file()` function |
  | `src/sheep/content_generators.py` | None | Already provides all needed functions; no changes required |
  | Repository root | Medium | New file `test-wpab4m.md` will be created and committed |
  | Git history | Low | New commit with conventional message `feat(164): Create markdown file test-wpab4m.md with prose content` |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies required):

  - **content_generators.py**: Provides all required functions:
    - `generate_markdown_content()`: Calls Claude API to create H1 heading + 2-3 sentences of unique prose
    - `write_markdown_file(content, filename)`: Writes to repo root with UTF-8 encoding (no BOM) and LF line endings
    - `validate_markdown_file(filepath)`: Enforces strict format requirements (H1 heading, blank line, 2-3 sentences)
    - `commit_markdown_file()`: Stages and commits with conventional message `feat(N): Create markdown file ...`
    - `push_markdown_file()`: Pushes changes to remote with upstream tracking (`-u` flag)
  - **config/llm.py**: Provides `get_reasoning_llm()` for LLM access via CrewAI configuration
  - **observability/logging.py**: Provides `get_logger()` for structured logging with appropriate log levels
  - **tools/git_tools.py**: GitPython abstractions for git operations (branch, add, commit, push)
  - **Feature branch**: `feat/164-markdown-file-creation-dad326` (pre-created and ready for work)
  - **Git configuration**: User name and email must be configured in git (handled by CI/CD environment)

  ## Size Estimate

  **S** (Small — approximately 15-30 minutes) — This is a minimal-effort, single-file creation feature:

  - **Feature file creation**: ~5-10 minutes (adapt template from feature 163; update feature number, filename, commit message)
  - **Module export**: ~2-3 minutes (add import/export to features/__init__.py)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Testing/validation**: ~2-3 minutes (verify file creation, git commit, remote push, confirm exports)
  - **Total estimate**: 15-30 minutes of actual work

  **Justification**:
  - Well-established pattern with 163 identical test files providing clear precedent and proven implementation path
  - Existing helper infrastructure fully supports the feature with no custom logic needed or required
  - Feature file can be created by adapting the feature 163 template (minimal changes to 4-5 lines)
  - No architectural decisions, design work, or testing infrastructure changes required
  - Recent feature implementations (160-163) demonstrate efficient implementation of identical features in 15-30 minutes
  - All dependencies already installed and configured; no setup or installation time needed

