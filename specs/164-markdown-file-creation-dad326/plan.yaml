content: |
  ## Architecture Overview

  Feature 164 integrates seamlessly with the existing markdown file creation infrastructure
  established by Features 157-163. The feature follows these architectural principles:

  ### Layered Orchestration Pattern

  The implementation uses a five-step orchestration pattern, delegating each operation to proven
  helper functions in content_generators.py:

  1. **Content Generation** (generate_markdown_content) — Calls Claude API via CrewAI's LLM interface
  2. **File I/O** (write_markdown_file) — Writes to repository root with UTF-8 encoding and LF line endings
  3. **Validation** (validate_markdown_file) — Enforces strict format requirements before commit
  4. **Git Commit** (commit_markdown_file) — Stages file and commits with conventional message
  5. **Git Push** (push_markdown_file) — Pushes to remote with upstream tracking

  This approach eliminates code duplication, leverages tested infrastructure, and maintains
  consistency across all 164 features. The feature module is stateless and side-effect-free
  except for the intentional operations (file creation, git staging).

  ### Module Placement & Organization

  - **Location:** `src/sheep/features/feature_164_markdown_file_creation.py`
  - **Export:** `from sheep.features import create_feature_164_markdown_file`
  - **Pattern:** One module per feature, one public function per module, explicit exports
  - **Metadata:** Feature number, filename, commit message as module-level constants
  - **Signature:** `create_feature_164_markdown_file(repo_path: str | None = None) -> dict[str, str]`

  ### Integration Points

  The feature integrates at these existing touchpoints (no modifications required):

  - **content_generators.py** — Five helper functions already exist and are proven
  - **observability/logging.py** — Structured logging via `get_logger(__name__)`
  - **config/llm.py** — LLM configuration accessed by helpers (feature transparent to this)
  - **features/__init__.py** — Import and export location (one line addition per feature)
  - **git infrastructure** — Uses CrewAI tools indirectly through helpers (no direct GitPython calls)

  ### Error Handling & Resilience

  The implementation uses fail-fast error handling as mandated by specification NFR-7:
  - All operations wrapped in try-except at the function level
  - Exceptions logged with full context (ERROR level, exception message)
  - Exceptions re-raised immediately (no recovery attempts)
  - Caller has visibility to all error states and can make informed decisions on retry

  This approach is simpler than retry logic, prevents masking of root causes, and aligns
  with the established pattern from Feature 163.

  ### Logging Strategy

  Structured logging via `sheep.observability.logging.get_logger()` provides:
  - **INFO level** for orchestration milestones (5 task completions, final success)
  - **DEBUG level** for operational details (content size, filepath, commit message, push result)
  - **ERROR level** with exception context when operations fail
  - **Integration** with platform observability infrastructure (indexed, searchable logs)

  This pattern matches Feature 163 exactly and enables debugging without modifying code.

  ## Key Design Decisions

  ### Decision 1: Leverage Existing Helper Functions (vs. Custom Implementation)

  **Chosen:** Use all five helpers from content_generators.py

  **Rationale:**
  - Specification FR-6 requires Claude API for content generation; helpers already call it
  - Specification FR-7 through FR-10 require specific behavior that helpers implement
  - Features 157-163 demonstrate this pattern works reliably across 163+ features
  - Code reuse eliminates duplication and simplifies maintenance
  - Testing helpers once proves 164+ features will work correctly
  - Helpers enforce platform conventions (UTF-8 encoding, LF endings, path validation)

  This decision keeps implementation focused on orchestration, not reimplementation.

  ### Decision 2: Dynamic Content Generation via Claude API (vs. Static Template)

  **Chosen:** Use content_generators.generate_markdown_content() which calls Claude API

  **Rationale:**
  - Specification FR-6 mandates Claude API usage explicitly
  - Claude API provides content variety across features (unique prose per execution)
  - Helper function already implements this with proven prompt and LLM integration
  - Feature 163 establishes this as the baseline approach
  - LLM capabilities are core value of the platform; static templates would underuse them

  Dynamic generation aligns the feature with specification and platform intent.

  ### Decision 3: Strict Validation Before Commit (vs. Lenient or No Validation)

  **Chosen:** Use content_generators.validate_markdown_file() with strict format enforcement

  **Rationale:**
  - Specification FR-8 explicitly requires validation before commit
  - Strict validation prevents invalid files from reaching the repository
  - Helper function enforces all format requirements (H1 heading, blank line, 2-3 sentences, encoding, line endings)
  - Feature 163 uses this approach successfully
  - Validation failures are detected early (fail-fast) rather than discovered later

  Strict validation ensures quality and prevents bad commits.

  ### Decision 4: Fail-Fast Error Handling (vs. Recovery Attempts)

  **Chosen:** Raise exceptions immediately on any error without recovery logic

  **Rationale:**
  - Specification NFR-7 explicitly requires fail-fast approach
  - Simpler error handling logic (no retry loops, no backoff, no state recovery)
  - Allows caller to make informed retry decisions at a higher level
  - Prevents masking of root causes (why did content generation fail?)
  - Feature 163 uses this approach successfully

  Fail-fast keeps implementation simple and maintainable.

  ### Decision 5: Synchronous Sequential Orchestration (vs. Async or Parallel)

  **Chosen:** Execute five operations synchronously in sequence: generate → write → validate → commit → push

  **Rationale:**
  - Each operation depends on output of the previous one (content must exist before write, file must exist before commit)
  - Sequential execution is simple and eliminates state management complexity
  - Total execution time is still fast (~3-7 seconds including API call)
  - Feature 163 uses this approach successfully
  - No benefit to asynchronous execution for a single file creation

  Sequential execution matches the logical workflow and keeps code straightforward.

  ### Decision 6: Module per Feature Pattern (vs. Shared Utility or Generic Factory)

  **Chosen:** One module per feature: feature_164_markdown_file_creation.py with one function

  **Rationale:**
  - Establishes clear separation of concerns across 164+ features
  - Makes code discovery straightforward (feature N lives in feature_N_*.py)
  - Allows independent testing and execution of each feature
  - Scales to Feature 165, 166, ... N without architectural changes
  - Feature 163 and preceding features follow this pattern

  The pattern is proven, clear, and infinitely scalable.

  ### Decision 7: Comprehensive Docstrings (vs. Minimal or None)

  **Chosen:** Include module docstring, function docstring with Args/Returns/Raises sections, log statements

  **Rationale:**
  - Specification NFR-6 explicitly requires docstring
  - Docstrings enable IDE help(), automatic documentation generation, type checking
  - Feature 163 provides exact template that satisfies all requirements
  - Professional Python convention (PEP 257)

  Documentation improves maintainability and debuggability.

  ## Implementation Strategy

  The three-phase approach aligns with the feature's small size (S = 15-30 minutes estimated):

  **Phase 1 (Module Scaffolding):** Establish structural foundation by creating the feature module
  with proper imports, metadata constants, and function signature. This phase takes ~5-10 minutes
  and produces a template-ready module that mirrors Feature 163.

  **Phase 2 (Orchestration Implementation):** Fill in the function body with the five orchestration
  steps, each calling an appropriate helper. Add structured logging at each step. This phase takes
  ~10-15 minutes and produces a working, loggable feature implementation.

  **Phase 3 (Integration & Testing):** Create unit tests, export the function from __init__.py,
  run end-to-end integration test, and verify all success criteria. This phase takes ~5-10 minutes
  and produces a fully integrated, tested, verified feature ready for production.

  Total estimated time: 25-35 minutes, fitting within the S size estimate of 15-30 minutes for
  the implementation itself (excluding research and specification phases).

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Claude API call fails (timeout, quota, auth) | Low | High | Fail-fast logging catches error immediately; caller can retry at higher level; timeout is typically seconds not minutes |
  | File system issues (disk full, permission denied) | Very Low | Medium | write_markdown_file helper validates file was created and contains content; errors logged and re-raised |
  | Git configuration missing (user.name, user.email) | Very Low | Medium | Git operations fail with clear error message; CI/CD environment has this configured; manual retry can set it |
  | Validation rejects valid content | Very Low | High | Validation helper is proven across 163+ features; same prompt and LLM produce same format; retesting would reveal this immediately |
  | Import/export errors in features/__init__.py | Low | Low | Single line addition; mirror Feature 163 pattern exactly; circular imports unlikely (no mutual dependencies) |
  | Race condition on file creation | Very Low | Low | File creation is atomic (single write operation); no parallel execution of features on same branch |

  All risks are mitigated by existing infrastructure, proven patterns, and conservative fail-fast error handling.
