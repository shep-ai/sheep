content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete - All technical decisions documented; ready for implementation

  ## Technology Stack Overview

  Feature 164 uses the exact same technology stack as Features 157-163:

  - **Python 3.11+:** Type hints, pathlib.Path, standard library utilities
  - **CrewAI:** LLM orchestration framework (already installed)
  - **Claude API:** Content generation via CrewAI's LLM interface
  - **GitPython:** Git operations (used indirectly via CrewAI tools)
  - **Pydantic:** Data validation models (used in CrewAI tools)
  - **sheep.observability.logging:** Structured logging infrastructure
  - **sheep.content_generators:** Reusable helper functions (5 functions needed)
  - **sheep.config.llm:** LLM configuration and factory functions

  **No new dependencies required.** All technologies are already installed and proven across 163+ preceding features.

  ---

  ## Technology Decisions

  ### Decision 1: Content Generation Approach

  **Chosen:** Use `content_generators.generate_markdown_content()` which calls Claude API via CrewAI's LLM interface.

  **Rejected:**
  - Hard-coded prose content — Contradicts specification FR-6; eliminates LLM capability
  - External content APIs — Adds complexity and dependencies; contradicts mandate

  **Rationale:** The specification explicitly requires Claude API (FR-6). Feature 163 establishes this as the pattern. The helper function is already implemented, tested, and proven across 163+ features. It generates H1 heading + 2-3 sentences via MARKDOWN_GENERATION_PROMPT template in content_generators.py.

  ### Decision 2: File I/O Strategy

  **Chosen:** Use `content_generators.write_markdown_file()` for all file operations.

  **Rejected:**
  - Direct Python `open()` with manual encoding — Duplicates existing code; risks encoding errors
  - Pathlib.Path.write_text() — Similar duplication; no added value

  **Rationale:** The helper function provides:
  - Repository root location via Path.cwd()
  - UTF-8 encoding with no BOM
  - Unix LF line endings (NFR-2 requirement)
  - File existence and content validation
  - Tested across Features 157-163 with proven reliability

  ### Decision 3: Validation Strategy

  **Chosen:** Use `content_generators.validate_markdown_file()` with strict format enforcement.

  **Rejected:**
  - Lightweight validation (file exists check) — Risks invalid markdown; violates FR-8
  - No validation — Allows bad files into repository; violates specification

  **Rationale:** Specification FR-8 mandates validation before commit. The function enforces:
  - H1 heading (# prefix check)
  - Blank line separator
  - 2-3 sentence prose (period count validation)
  - UTF-8 encoding with no BOM (NFR-1)
  - Unix LF line endings (NFR-2)
  - Trailing newline

  ### Decision 4: Error Handling

  **Chosen:** Fail fast on any error; let exceptions propagate without recovery.

  **Rejected:**
  - Retry on failure — More complex; masks root causes; contradicts NFR-7
  - Silent failures — Corrupts state; produces invalid output

  **Rationale:** Specification NFR-7 mandates fail-fast. It allows:
  - Caller to decide on retry vs. fix
  - Prevention of masking underlying issues
  - Simplified error handling logic
  - Clear all-or-nothing execution contract

  ### Decision 5: Git Operations

  **Chosen:** Use existing helpers: `commit_markdown_file()` and `push_markdown_file()`.

  **Rejected:**
  - Direct GitPython implementation — Duplicates existing code; risks drift
  - Direct CrewAI GitCommitTool/GitPushTool — Bypasses abstractions; increases complexity

  **Rationale:** The helpers provide:
  - Commit: stage, custom message support, GitCommitTool integration, logging
  - Push: origin remote, set_upstream=True for feature branch tracking, GitPushTool integration
  - Both tested across 163+ features with proven reliability

  ### Decision 6: Module Organization

  **Chosen:** Create `feature_164_markdown_file_creation.py` with function `create_feature_164_markdown_file()`.

  **Rejected:**
  - Inline in __init__.py or shared utility — Breaks modularity; scales poorly
  - Feature factory/registry — Unnecessary complexity; contradicts established pattern

  **Rationale:** The one-module-per-feature pattern is established and optimal:
  - Each module contains: docstring, metadata constants, one public function
  - Return type: `dict[str, str]` with keys: filepath, content, commit_message, push_result
  - Exported from `features/__init__.py` for public API
  - Clear, scalable, maintainable across 164+ features

  ### Decision 7: Logging Strategy

  **Chosen:** Use `sheep.observability.logging.get_logger()` with INFO for steps, DEBUG for details.

  **Rejected:**
  - print() statements — Loses structured context; doesn't integrate with observability
  - No logging — Reduces debuggability; violates NFR-5 requirement

  **Rationale:** NFR-5 requires structured logging. The pattern:
  - `_logger = get_logger(__name__)` at module top
  - INFO level: major steps (generating, writing, validating, committing, pushing)
  - DEBUG level: operational details (content size, filepath, commit message, push result)
  - ERROR level with exception context on failure
  - Integrates with platform's centralized logging

  ### Decision 8: Documentation

  **Chosen:** Include module docstring, function docstring with Args/Returns/Raises, log statements.

  **Rejected:**
  - No docstrings — Violates NFR-6 requirement
  - Over-documentation — Clutters code; reduces documentation signal-to-noise

  **Rationale:** NFR-6 requires docstring. Feature 163 provides exact template:
  - Module docstring: purpose + workflow steps
  - Function docstring: Args, Returns, Raises sections
  - Log statements document execution flow
  - Follows PEP 257 Python convention

  ---

  ## Library Analysis & Dependency Review

  | Library | Purpose | Decision | Rationale |
  | ------- | ------- | -------- | --------- |
  | CrewAI | LLM orchestration framework | **Use** (already installed) | Provides LLM abstraction layer; used for content generation; no new installation needed |
  | Claude API | Content generation via CrewAI | **Use** (via CrewAI) | Required by specification FR-6; accessed via get_reasoning_llm(); creates coherent prose |
  | GitPython | Git operations wrapper | **Use** (via CrewAI tools) | Underlying implementation for GitCommitTool/GitPushTool; already integrated in helpers |
  | Pydantic | Data validation models | **Use** (already installed) | Used in CrewAI tools for parameter validation; no new usage in feature code itself |
  | pathlib.Path | File system operations (stdlib) | **Use** | Standard library; cross-platform file paths; used in write_markdown_file() |
  | sheep.observability.logging | Structured logging infrastructure | **Use** (required) | Required by NFR-5; provides get_logger(); integrates with platform observability |
  | sheep.content_generators | Helper functions for content/file/git ops | **Use** (required) | Provides all needed functions; already tested across 163+ features |
  | sheep.config.llm | LLM factory functions | **Use** (required) | Provides get_reasoning_llm() for Claude API access; already configured |

  **Conclusion:** No new dependencies required. All needed libraries are already installed and proven.

  ---

  ## Security Analysis

  ### API Key Management
  - Claude API keys managed by CrewAI and sheep.config.llm modules
  - API keys read from environment variables via Pydantic SecretStr (prevents accidental logging)
  - Feature code does not handle API keys directly
  - No credentials stored in code or committed to repository

  ### File Path Security
  - `write_markdown_file()` validates filename against path traversal attacks
  - Checks: "/" and "\\" not in filename, filename doesn't start with "."
  - Files created only in repository root (Path.cwd()), not arbitrary locations
  - Path validated before all file operations (existence checks, permission checks)

  ### Content Injection Prevention
  - Markdown content generated by Claude API; no user input in feature code
  - File content validated before commit (structure validation, encoding checks)
  - Git commit message is hardcoded constant COMMIT_MESSAGE, not generated from user input
  - Git operations use CrewAI tools which use subprocess.run() with list args (no shell=True)

  ### Encoding Security
  - UTF-8 encoding enforced (no BOM, no other encodings)
  - LF line endings enforced (no CRLF which can cause version control issues)
  - Validation ensures file bytes match expected encoding before accepting file
  - Prevents binary files or malformed encodings from being committed

  ### Reproducibility and Auditability
  - All operations logged with timestamps and structured context
  - Git commits follow conventional commit format (feat(164): ...)
  - File creation is reproducible: same input = same output structure
  - All operations are idempotent if file exists and is valid

  ---

  ## Performance Analysis

  ### Execution Time Breakdown
  - **Content Generation:** ~2-5 seconds (Claude API call via CrewAI, temperature 0.2)
  - **File I/O:** ~100-200 ms (write to disk, validation by reading back)
  - **Git Operations:** ~500 ms - 1 second (commit + push to remote)
  - **Total Expected Time:** 3-7 seconds for full feature execution

  ### Memory Usage
  - Minimal footprint: ~300-600 bytes for generated markdown content
  - No data structures or caching beyond what helpers provide
  - No streaming or batch operations needed

  ### API Usage
  - One Claude API call for content generation
  - Temperature 0.2 (reasoning model) = lower token usage than default
  - Typical prompt + response: ~200-500 tokens (~0.01-0.05 cents)

  ### Git Operations
  - One git add (stages single file)
  - One git commit (one file, one message)
  - One git push (one commit to remote)
  - No rebasing, merging, or conflict resolution

  ### Optimization Notes
  - No optimization needed; performance is not a constraint
  - Helpers already implement efficient operations (no redundant reads)
  - Validation uses efficient binary reads for encoding/line ending checks
  - Git operations use subprocess.run() with capture_output (no pipes overhead)

  ---

  ## Architecture & Integration Notes

  ### Content Generation Pipeline
  - Feature uses `sheep.content_generators.generate_markdown_content()`
  - Which calls `get_reasoning_llm()` from `sheep.config.llm`
  - Which creates a CrewAI LLM instance configured for Claude API
  - Integration is clean: feature doesn't know about LLM implementation details
  - Pattern proven across Features 157-163

  ### File System Integration
  - Files always created at `Path.cwd()` (repository root)
  - Enforced by `write_markdown_file()`
  - No configuration needed; respects current working directory
  - Ensures files appear where tests and git operations expect them

  ### Git Integration
  - Uses CrewAI GitCommitTool and GitPushTool via content_generators helpers
  - No direct GitPython calls in feature code
  - Commit message follows conventional format: `feat(164): Create markdown file test-wpab4m.md with prose content`
  - Push uses `set_upstream=True` for feature branch tracking
  - Integration transparent to feature code

  ### Observability Integration
  - Structured logging via `sheep.observability.logging.get_logger()`
  - Logs can be filtered by feature number
  - Log levels allow filtering: INFO for steps, DEBUG for details
  - Errors include full exception context and stack trace

  ### Consistency with Preceding Features

  Feature 164 follows the exact pattern of Features 157-163:

  1. **Module Structure:**
     - File: `src/sheep/features/feature_164_markdown_file_creation.py`
     - Constants: FEATURE_NUMBER (164), MARKDOWN_FILENAME (test-wpab4m.md), COMMIT_MESSAGE
     - Function: `create_feature_164_markdown_file(repo_path: str | None = None)`

  2. **Orchestration Pattern:**
     - Task 1: Content generation
     - Task 2: File writing
     - Task 3: Validation
     - Task 4: Commit with custom message
     - Task 5: Push with upstream tracking

  3. **Return Value:**
     - `dict[str, str]` with keys: filepath, content, commit_message, push_result

  4. **Error Handling:**
     - Try-catch wrapping all tasks
     - Errors logged at ERROR level with exception message
     - Exception re-raised for caller to handle

  5. **Logging Pattern:**
     - INFO level: major steps and success
     - DEBUG level: operational details
     - ERROR level: exceptions with context

  ### No Architectural Changes Required

  - Feature 164 requires NO changes to existing infrastructure
  - All helpers (content_generators functions, git tools, logging, LLM config) already exist
  - No new modules, classes, or dependencies required
  - Only new file: `feature_164_markdown_file_creation.py`
  - Only module change: add import/export in `features/__init__.py`
  - Consistent with how Features 157-163 were added

  ### Scalability to Feature 165+

  The pattern is infinitely scalable:
  - Each feature gets its own module
  - Each module is ~110 lines (mostly boilerplate)
  - Helpers remain unchanged and reusable
  - Infrastructure doesn't degrade with feature count
  - Testing pattern is identical for all features

  ---

  ## Implementation Template & Reference

  ### Reference Implementation: Feature 163
  - Provides exact structure for Feature 164
  - Uses Claude API for content generation (matches specification FR-6)
  - File: `src/sheep/features/feature_163_markdown_file_creation.py`
