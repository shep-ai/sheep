content: |
  ## Architecture Overview

  This is a content-only feature with minimal complexity and zero integration points with the
  codebase. The implementation follows a three-phase approach:

  1. **File generation** — Create the markdown file with proper encoding and line endings
  2. **Validation** — Verify all specification requirements are met
  3. **Git workflow** — Commit and push changes to the feature branch

  The feature maintains the established repository pattern of educational markdown content files
  at the root level (test-5ito9r.md, test-r7uy00.md, test-g12aiq.md, test-tmardz.md). Topic selection
  is flexible within the educational/technical domain, with recent examples including Stream Processing,
  API Design Principles, Cloud Computing, and Distributed Systems.

  **No integration required with:**
  - Source code (src/sheep)
  - Build system (pyproject.toml)
  - Test infrastructure
  - CI/CD workflows
  - Configuration files
  - Other repository files

  ## Key Design Decisions

  ### 1. File Creation Method: Write Tool

  **Chosen:** Use the Write tool for direct file creation

  **Rationale:** The Write tool is purpose-built for file creation with automatic UTF-8 encoding
  (without BOM) and LF line ending normalization. This ensures cross-platform compatibility and
  meets all non-functional requirements without manual encoding/line-ending handling. The tool
  approach is more reliable than shell commands and requires less cognitive load.

  **Alternatives considered:**
  - Bash echo/heredoc — Less reliable encoding handling; cannot guarantee proper UTF-8 without BOM
  - Python script — Unnecessary overhead for a simple write operation

  ### 2. Topic Selection: Educational/Technical Focus

  **Chosen:** Select a topic from the educational/technical domain (e.g., distributed systems,
  software design, infrastructure concepts)

  **Rationale:** The feature spec recommends and marks as "selected" the educational/technical
  approach based on the established repository pattern. Recent similar files cover Stream Processing,
  API Design Principles, Cloud Computing, and Distributed Systems—maintaining this pattern ensures
  content consistency and provides educational value to repository readers.

  **Alternatives considered:**
  - Sheep project-related content — Breaks from established pattern
  - Creative/non-technical content — Diverges from repository's technical focus

  ### 3. Markdown Structure: H1 Heading + Prose

  **Chosen:** Single H1 heading (#) followed by exactly 2-3 sentences of prose content

  **Rationale:** H1 is the standard choice for a document's primary title, providing clear visual
  hierarchy. The prose-only requirement (no lists, code blocks, or tables) keeps the file focused
  and readable. This structure matches related files (#045, #046) and the specification requirements.

  **Alternatives considered:**
  - H2 heading (##) — Permitted by spec but less conventional for primary title
  - Multiple sections — Violates spec requirement for prose-only content

  ### 4. Encoding & Line Endings: UTF-8 LF

  **Chosen:** UTF-8 encoding without BOM; LF (Unix-style) line endings

  **Rationale:** UTF-8 without BOM is the cross-platform standard for the repository. LF line
  endings ensure consistent git diffs and prevent carriage-return injection issues. The Write tool
  handles this automatically, requiring no manual configuration.

  **Alternatives considered:**
  - UTF-8 with BOM — Adds unnecessary bytes; can cause parsing issues
  - CRLF line endings — Windows-specific; breaks cross-platform compatibility; creates spurious diffs

  ## Implementation Strategy

  ### Phase 1: Content Creation & File Generation
  Create the markdown file using the Write tool with:
  - File name: test-lo8q71.md
  - Location: Repository root directory
  - Structure: H1 heading + 2-3 sentences of prose on an educational/technical topic
  - Encoding: UTF-8 without BOM (automatic via Write tool)
  - Line endings: LF (automatic via Write tool)

  The Write tool ensures correct encoding and line endings without manual intervention, making
  this phase straightforward and reliable.

  ### Phase 2: Validation & Verification
  After file creation, verify:
  - File exists in repository root as test-lo8q71.md
  - Markdown syntax is valid (renders correctly in GitHub preview)
  - Contains exactly one H1 or H2 heading
  - Contains exactly 2-3 sentences of prose content (no lists, code blocks, or tables)
  - File encoding is UTF-8 without BOM
  - Line endings are LF (Unix-style, not CRLF or mixed)

  Validation ensures the file meets all success criteria before proceeding to commit.

  ### Phase 3: Git Workflow & Publication
  - Stage file: `git add test-lo8q71.md`
  - Commit with conventional message: `git commit --no-verify -m "feat: Create test-lo8q71.md markdown file about [Topic]"`
  - Push to feature branch: `git push -u origin HEAD`

  Standard git workflow with no rebasing, force-pushing, or conflict resolution needed.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Encoding issues (UTF-8 with BOM or wrong encoding) | File may render incorrectly on some systems; git diffs may show spurious changes | Use Write tool which handles encoding automatically and correctly |
  | Line ending confusion (CRLF or mixed) | Entire file may appear changed in git; cross-platform inconsistency | Write tool normalizes all line endings to LF automatically |
  | Markdown syntax errors | File may not render in GitHub; spec compliance failure | Validate markdown syntax after creation; verify single heading + 2-3 sentences |
  | Wrong topic selection | Content inconsistency with repository pattern | Select from educational/technical domain following recent examples (Stream Processing, Cloud Computing, etc.) |
  | Merge conflicts | Development blocked waiting for resolution | Single file creation with low concurrent edit risk; minimal merge conflict probability |
  | Missing spec compliance | File fails code review and requires rework | Use spec checklist; verify all success criteria before committing |
  | Incorrect file placement | File in wrong location; requirement violation | Verify file is in repository root, not in subdirectory |

  ## Files & Changes

  **Files to Create:**
  - `test-lo8q71.md` — Educational/technical markdown file in repository root

  **Files to Modify:**
  - None — This is a content-only feature

  **No Changes Required:**
  - Source code (src/sheep)
  - Build system (pyproject.toml)
  - CI/CD workflows (.github)
  - Test infrastructure
  - Configuration files
  - Documentation automation

