      Specification requires UTF-8 without BOM and Unix LF line endings (NFR-3, NFR-4).
      pathlib.Path.write_text() with no explicit encoding parameter defaults to UTF-8.
      The newline parameter must be explicitly set: newline='\n' or use binary mode write.
