# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 140 follows the Pipeline Pattern established by features 124-139. The implementation is a thin orchestration layer that combines five existing functions:

  1. **Generation** — `generate_markdown_content()` (content_generators.py)
     - Calls Claude API via CrewAI abstraction (get_reasoning_llm)
     - Returns markdown string with H1 header + 2-3 sentences
     - Built-in validation for format requirements

  2. **Persistence** — `write_markdown_file()` (content_generators.py)
     - Writes to repository root with safe filename validation
     - UTF-8 encoding with Unix LF line endings
     - Verifies file creation and non-zero size

  3. **Quality Assurance** — `validate_markdown_file()` (content_generators.py)
     - Validates UTF-8 encoding and line endings
     - Verifies H1 header, blank line separator, prose content
     - Counts periods to validate 2-3 sentence requirement
     - Verifies trailing newline

  4. **Version Control** — `commit_markdown_file()` and `push_markdown_file()` (content_generators.py)
     - Uses GitCommitTool to stage and commit with conventional message
     - Uses GitPushTool to push with upstream tracking
     - Encapsulates subprocess error handling and logging

  5. **Orchestration** — `create_feature_140_markdown_file()` (new module)
     - Coordinates all five steps in sequence
     - Returns dict with filepath, content, commit_message, push_result
     - Comprehensive error handling and logging

  The feature module is ~60 lines of orchestration code with no new logic — similar to feature 138.

  ## Key Design Decisions

  ### Decision 1: Reuse Existing Infrastructure
  **Chosen:** Use functions from content_generators.py
  **Rationale:** All 139 prior features use this same infrastructure. It's proven, tested, and maintained. Research shows no new libraries are needed — the platform provides everything required. Reusing code ensures consistency and reduces maintenance burden.

  ### Decision 2: AI-Generated Content vs Static
  **Chosen:** AI-generated content via Claude API
  **Rationale:** Spec explicitly recommends this for variety across executions and to demonstrate platform capabilities. Prior features 124-139 all use this approach. Generate_markdown_content() is already implemented and tested.

  ### Decision 3: Commit Message Format
  **Chosen:** Minimal conventional format — `feat(140): Create markdown file test-66cdt5.md`
  **Rationale:** Spec recommends minimal format to keep commit history lean. Prior features use this pattern. Message is self-evident from filename; no body text needed.

  ### Decision 4: Validation Strategy
  **Chosen:** Comprehensive validation at each step (content → file → format)
  **Rationale:** Spec requires validation. Early detection enables clear error messages. Existing validate_markdown_file() checks encoding, line endings, H1, blank line, sentence count, and trailing newline. Lightweight overhead for high confidence.

  ### Decision 5: Feature Module Location
  **Chosen:** `src/sheep/features/feature_140_markdown_file_creation.py`
  **Rationale:** Consistent with all 140 features. Enables individual testing and tracking. Follows established project structure and naming convention.

  ### Decision 6: LLM Access Pattern
  **Chosen:** Use `sheep.config.llm.get_reasoning_llm()`
  **Rationale:** Platform abstraction that supports multiple providers (Anthropic, OpenAI, Google, Cursor). Configured via settings. Temperature=0.2 optimized for reasoning tasks. Already used by generate_markdown_content().

  ## Implementation Strategy

  ### Phase 1: Setup (15 minutes)
  - Create feature module scaffold with docstring and metadata (FEATURE_NUMBER=140, MARKDOWN_FILENAME=test-66cdt5.md)
  - Create test file with import and basic structure
  - Both files follow the exact pattern from feature 138

  ### Phase 2: Orchestration (30 minutes)
  - Implement `create_feature_140_markdown_file()` function
  - Call generate_markdown_content() to get content
  - Call write_markdown_file() to persist to disk
  - Call validate_markdown_file() to verify quality
  - Call commit_markdown_file() with custom message
  - Call push_markdown_file() to push to remote
  - Comprehensive logging at each step
  - Proper error handling with descriptive messages

  ### Phase 3: Testing & Validation (45 minutes)
  - Unit tests: Mock underlying functions, verify orchestration
  - Integration tests: Real implementations, verify end-to-end
  - Edge case tests: Error scenarios, malformed input
  - Verify acceptance criteria

  ### Why This Order
  Phase 1 establishes the structure so tests can pass. Phase 2 implements the orchestration logic using existing, tested functions. Phase 3 validates the implementation works correctly. Early testing enables rapid iteration if issues arise.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API call fails | Handle in generate_markdown_content(); propagate with clear error message. Existing function has try-catch. |
  | Content doesn't meet format (wrong sentence count) | Validation in generate_markdown_content() before returning. Validate_markdown_file() double-checks. Early detection prevents bad data. |
  | File write fails (permissions, disk full) | write_markdown_file() has try-catch. Returns filepath on success or raises OSError. Checks file exists and has content. |
  | Git operations fail (uncommitted changes, push conflict) | GitCommitTool and GitPushTool handle errors. Feature logs each step. Failed push is caught and logged. |
  | Test environment issues (no git config, no repo) | Use temporary test directories with git init. Mock git operations in unit tests. Integration tests use real repo. |
  | Filename collision (test-66cdt5.md already exists) | write_markdown_file() will overwrite. Feature is deterministic (same filename each execution). File is committed after write. |

  ## Success Criteria

  - Feature module created following pattern from feature 138
  - Test module created with comprehensive test coverage
  - Function signature matches: `create_feature_140_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  - Returns dict with keys: filepath, content, commit_message, push_result
  - Markdown file test-66cdt5.md created in repository root
  - File contains H1 header + 2-3 sentences of prose (AI-generated)
  - File passes all markdown validation checks
  - File is staged with `git add`
  - Commit message is exactly: `feat(140): Create markdown file test-66cdt5.md`
  - Commit is pushed to remote on feature branch
  - No errors in content generation, file I/O, validation, or git operations
  - All tests pass with >90% code coverage
