# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 140 implementation follows a straightforward orchestration pattern across three phases:

  **Phase 1 (Setup):** Create the feature module scaffold and test infrastructure following the pattern from feature 138. Both files are minimal (~20-30 lines skeleton each).

  **Phase 2 (Implementation):** Implement the orchestration workflow by calling existing functions in sequence: generate → write → validate → commit → push. Total ~60 lines of new code with comprehensive logging and error handling at each step.

  **Phase 3 (Testing):** Write unit tests with mocks to verify orchestration logic and error scenarios, then write integration tests with real implementations to verify end-to-end functionality.

  **Why this order:** Phase 1 establishes the structure. Phase 2 implements the logic using proven infrastructure. Phase 3 validates correctness. Each phase builds on the previous, enabling incremental validation.

  ## Architecture

  The implementation reuses five functions from content_generators.py:
  - `generate_markdown_content()` — AI-generated content via Claude API
  - `write_markdown_file()` — Persist to disk with UTF-8 encoding
  - `validate_markdown_file()` — Verify format (H1, 2-3 sentences, encoding, line endings)
  - `commit_markdown_file()` — Stage and commit with conventional message
  - `push_markdown_file()` — Push to remote with upstream tracking

  No new functions or external dependencies needed. The feature module is a thin orchestration layer (~60 lines) that coordinates these existing, tested functions.

  ## Test Strategy

  **Unit Tests (with mocks):** Verify orchestration logic, error handling, and return values in isolation. Tests can run offline without LLM or git operations.

  **Integration Tests (real implementations):** Verify end-to-end workflow in a temporary git repository. Tests create real markdown files, commits, and git history.

  **Coverage Target:** >85% code coverage focusing on happy path and error scenarios.

  ## Estimated Breakdown

  - Phase 1: 15 minutes (scaffolding)
  - Phase 2: 45 minutes (implementation + error handling)
  - Phase 3: 45 minutes (unit + integration tests)
  - **Total: 2 hours**
