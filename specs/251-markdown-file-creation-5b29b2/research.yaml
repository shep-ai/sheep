content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-28
  - **Pattern:** Established (180+ prior test files)

  ## Technology Decisions

  ### 1. File Creation Method

  **Chosen:** Python `pathlib.Path.write_text()`

  **Rejected:**
  - `os.open()` + manual write — requires manual encoding and newline parameter handling
  - subprocess shell commands — cross-platform issues, escape complexity, security risks

  **Rationale:** pathlib is the modern, Pythonic standard library approach (Python 3.11+).
  The `write_text(encoding='utf-8', newline='\n')` method directly satisfies both encoding
  NFRs in a single call. This approach is already established in `src/create_markdown.py`
  and followed by 180+ test files. No external dependencies required.

  ### 2. Content Generation Approach

  **Chosen:** Hardcoded prose content (no API calls or templates)

  **Rejected:**
  - Claude API (AI-generated) — adds LLM dependency, increases complexity, slower execution
  - Jinja2 templates — adds external dependency for simple 2-3 sentence prose

  **Rationale:** The spec allows any topic and requires only 2-3 sentences. Hardcoding simple,
  coherent prose is the simplest approach that meets requirements. The size estimate (S = 10-15
  minutes) presumes simple file creation, not API-dependent workflows. This reduces risk of
  API failures and eliminates dependencies for a test file feature.

  ### 3. Git Integration Method

  **Chosen:** Python `subprocess` module

  **Rejected:**
  - GitPython library — external dependency, overkill for 3 simple commands
  - Shell script — security risk from command injection, less portable

  **Rationale:** `subprocess.run()` with `shell=False` is secure, part of standard library,
  and established in `src/create_markdown.py`. The feature requires only three straightforward
  commands (add, commit, push), which are simple enough that subprocess is appropriate without
  adding external dependencies.

  ### 4. Line Ending Handling

  **Chosen:** `pathlib.write_text()` with `newline='\n'` parameter

  **Rejected:**
  - Binary mode (`wb`) with explicit bytes — more complex, requires manual encoding
  - Text mode with default newline — would use CRLF on Windows, violating NFR-2

  **Rationale:** The `newline='\n'` parameter ensures LF line endings on all platforms
  (Windows, macOS, Linux) as documented in Python io module. This is the standard approach
  for cross-platform LF enforcement. It's already established in `src/create_markdown.py`.

  ### 5. Encoding Specification

  **Chosen:** Explicit `encoding='utf-8'` in `pathlib.write_text()`

  **Rejected:**
  - Python platform default encoding — OS-dependent, may not be UTF-8
  - Manual codec handling — unnecessarily complex for UTF-8 requirement

  **Rationale:** Explicitly passing `encoding='utf-8'` ensures UTF-8 on all platforms.
  Python's UTF-8 writer automatically excludes BOM by design (BOM only written for UTF-16/32).
  This satisfies NFR-1 (UTF-8 without BOM). Standard approach in `src/create_markdown.py`.

  ### 6. Markdown Validation Strategy

  **Chosen:** Lightweight post-creation structural validation

  **Rejected:**
  - No validation — could miss encoding or structure errors
  - Heavy validation with external parser library (markdown, pandoc) — adds dependency

  **Rationale:** Simple validation ensures CommonMark compliance and correct structure
  (H1 heading + blank line + 2-3 sentences). Can be implemented with regex and file reading
  without external dependencies. Validation can check: heading pattern, sentence count,
  file size within range, LF line endings, UTF-8 encoding.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O | Use | Part of Python 3.11+ standard library; modern, Pythonic, handles encoding + line endings |
  | subprocess | Git commands | Use | Part of standard library; secure with shell=False; no dependency overhead |
  | git (GitPython) | Git operations | Reject | External dependency; unnecessary overhead for 3 simple git commands |
  | claude-api | Content generation | Reject | Not required; spec allows hardcoded content; reduces dependency count |
  | jinja2 | Template system | Reject | Not required; hardcoded prose is simpler for 2-3 sentence content |
  | markdown parser | Validation | Reject | Can validate with regex + file reading; lighter weight approach |

  ## Security Considerations

  1. **Command Injection Risk (Mitigated):** Using `subprocess.run()` with `shell=False` and explicit
     argument lists prevents command injection. File paths and git commands are not shell-interpreted.

  2. **File Permissions:** `pathlib.write_text()` respects system umask. On Unix-like systems, files
     are created with default permissions (typically 644). Parent directories are created with
     `parents=True, exist_ok=True` which is safe.

  3. **Encoding Safety:** Explicit `encoding='utf-8'` prevents silent encoding errors. Python raises
     exceptions if encoding fails, allowing proper error handling.

  4. **Path Traversal (Low Risk):** File path is specified in feature spec (`test-xoqnko.md` in repo
     root). No user input is involved. Path is validated before creation.

  5. **Git Credentials:** Git authentication (SSH keys, tokens) are handled by system git configuration,
     not by Python code. No credentials are passed as arguments or environment variables.

  ## Performance Implications

  1. **File Creation:** O(1) operation. Writing ~400-600 bytes is negligible. No optimization needed.

  2. **Git Operations:** Subprocess calls add ~100-500ms overhead each:
     - `git add`: ~50-100ms (index update)
     - `git commit`: ~50-200ms (write commit object)
     - `git push`: ~500-2000ms (network dependent, may timeout)
     - Total: ~1-2 seconds end-to-end, which is acceptable for a test feature

  3. **Content Generation:** Hardcoded content is instant (no API latency). No performance concerns.

  4. **Memory:** All operations are streaming/single-file, no memory concerns even on constrained systems.

  5. **No Caching:** Feature is small and one-time; caching is not applicable.

  ## Architecture Notes

  1. **Modularity:** Feature fits into existing Sheep architecture as a standalone test file creator.
     No changes to `/src/sheep/` source code required. Pure file creation + git workflow.

  2. **Pattern Consistency:** Implementation follows the established pattern from features 069-250.
     180+ prior test files provide proven precedent for this exact approach.

  3. **No New Dependencies:** Implementation uses only Python standard library (pathlib, subprocess).
     Feature does not add any new external dependencies to the project.

  4. **Isolation:** Feature is isolated from application logic, agents, flows, or tools.
     Does not impact any other systems. Can be implemented and tested independently.

  5. **Git Workflow:** Uses standard git operations (add, commit, push). No custom merge logic,
     rebase, or destructive operations. Follows conventional commit format.

  ## Implementation Notes

  1. **File Naming:** Filename `test-xoqnko.md` is specified in feature spec. No naming decisions needed.

  2. **Prose Content:** Can be about any topic. Suggested themes: technology, productivity, testing,
     software engineering, or other domains. Must be 2-3 complete sentences (validated via punctuation).

  3. **Title (H1 Heading):** Should be descriptive and match prose content. Example: \"The Power of
     Continuous Testing\" for prose about testing benefits.

  4. **Git Branch:** Feature branch `feat/251-markdown-file-creation-5b29b2` is pre-created.
     Commit and push operations target this branch via `git push -u origin <branch>`.

  5. **Commit Message Format:** Must follow conventional commit: `feat(251): create markdown file
     test-xoqnko.md with prose content`. Number (251) matches feature number in spec.

