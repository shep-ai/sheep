# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-xoqnko.md`)
  at the repository root with a markdown title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This feature is a continuation of the markdown-file-creation pattern established in features 069-250,
  which have created 180+ identical test files following the same specifications and implementation approach.

  ## Success Criteria

  - [ ] File `test-xoqnko.md` is created at the repository root
  - [ ] File contains a single markdown heading (`#`) serving as the title
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File is encoded in UTF-8 without byte order mark (BOM)
  - [ ] File uses Unix-style line endings (LF, not CRLF)
  - [ ] File size is approximately 400-600 bytes as natural result of proper formatting
  - [ ] Markdown syntax conforms to CommonMark specification
  - [ ] File is staged in git with `git add test-xoqnko.md`
  - [ ] File is committed with conventional commit message: `feat(251): create markdown file test-xoqnko.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/251-markdown-file-creation-5b29b2`
  - [ ] No source code files are modified
  - [ ] No existing files are modified

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-xoqnko.md` in the repository root directory
  - **FR-2**: File must contain a markdown heading (single `#` prefix) serving as the title
  - **FR-3**: File must contain 2-3 sentences of prose content positioned after the heading, separated by a blank line
  - **FR-4**: Stage the file in git using standard `git add` workflow
  - **FR-5**: Commit the file with a conventional commit message following format: `feat(<number>): create markdown file <filename> with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/251-markdown-file-creation-5b29b2`

  ## Non-Functional Requirements

  - **NFR-1 (Encoding)**: File must be UTF-8 encoded without byte order mark (BOM)
  - **NFR-2 (Line Endings)**: File must use Unix-style line endings (LF), not Windows-style (CRLF)
  - **NFR-3 (File Size)**: File size should naturally result in 400-600 bytes from proper formatting of heading plus prose
  - **NFR-4 (Markdown Syntax)**: Markdown syntax must conform to CommonMark specification
  - **NFR-5 (Conventional Commits)**: Commit message must follow conventional commit format: `feat(<number>): <description>`
  - **NFR-6 (Code Isolation)**: Implementation must not modify source code in `/src/sheep/` or elsewhere
  - **NFR-7 (File Integrity)**: Implementation must not modify any existing files in the repository
  - **NFR-8 (No Dependencies)**: Implementation must not introduce new dependencies or configuration changes

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-xoqnko.md) to existing collection of 180+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-250; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/251-markdown-file-creation-5b29b2` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **Established pattern**: 180+ test files provide precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename `test-xoqnko.md` is specified in the feature spec

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 180+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations demonstrate efficient implementation of identical features
  - File naming is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 180+ prior implementations
