# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature creates a single markdown file (`test-xoqnko.md`) at the repository root and commits it to
  the feature branch, demonstrating automated file creation and git integration.

  **Phase 1: File Creation and Structural Validation (Tasks 1-3)**
  - Create test-xoqnko.md using Python pathlib with explicit UTF-8 encoding and LF line endings
  - Validate file structure: H1 heading, blank line separator, 2-3 sentences of prose
  - Validate file encoding: UTF-8 without BOM, LF line endings (no CRLF)

  **Phase 2: Git Integration and Push (Tasks 4-6)**
  - Stage file with `git add` via subprocess
  - Commit file with conventional commit message: `feat(251): create markdown file test-xoqnko.md with prose content`
  - Push commit to feature branch `feat/251-markdown-file-creation-5b29b2` via subprocess

  **Total Effort:** 20 minutes (slightly longer than spec estimate of 10-15 minutes due to
  comprehensive validation and testing approach with full TDD cycles for each task).

  Each task follows test-driven development with RED-GREEN-REFACTOR cycles:
  - **RED:** Write assertions/checks that fail before implementation
  - **GREEN:** Implement minimal code to pass the tests
  - **REFACTOR:** Clean up, extract constants, add docstrings

  Tasks are ordered by dependency: file creation (1-3) must complete before git operations (4-6)
  can proceed. Within each phase, tasks build on each other: validation tasks (2-3) depend on
  file creation (1), and git operations (4-6) have sequential dependencies.
