# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature demonstrates automated file creation and git integration within the Sheep project,
  following the established pattern from 180+ prior markdown file creation features (features 069-250).

  The implementation is straightforward and self-contained:
  1. **File Creation**: Use Python `pathlib.Path.write_text()` to create the markdown file at
     the repository root, specifying `encoding='utf-8'` and `newline='\n'` to satisfy both
     encoding and line-ending non-functional requirements in a single operation.
  2. **Content Generation**: Hardcoded prose content (2-3 sentences about any topic) requires
     no external dependencies or API calls. Simplest approach that meets spec requirements.
  3. **Validation**: Lightweight post-creation checks verify CommonMark compliance and structure
     (H1 heading, blank line separator, 2-3 sentence prose) without adding external parser
     dependencies.
  4. **Git Integration**: Python `subprocess.run()` with `shell=False` provides secure execution
     of three git commands (add, commit, push). Part of standard library, no external
     dependency overhead.

  This approach is **isolated** from application source code (`/src/sheep/`), requires **no
  modifications** to existing code, and fits the established pattern used by 180+ prior test
  files. The implementation is **mechanical** and **deterministic** — no complex logic or
  conditional branches.

  ## Key Design Decisions

  ### 1. File Creation Method: `pathlib.Path.write_text()`

  **Decision:** Use Python's `pathlib.Path.write_text()` with explicit `encoding='utf-8'` and
  `newline='\n'` parameters.

  **Why:** This is the modern, Pythonic approach in Python 3.11+ standard library. It directly
  addresses both file encoding (NFR-1) and line ending requirements (NFR-2) in a single call:
  - `encoding='utf-8'` ensures UTF-8 on all platforms; Python's UTF-8 writer automatically
    excludes BOM by design (BOM only for UTF-16/32)
  - `newline='\n'` forces LF line endings on all platforms (Windows, macOS, Linux) as documented
    in Python's io module

  This approach is already established in `src/create_markdown.py` and proven across 180+ test
  files.

  **Alternatives Considered:**
  - `os.open()` + manual write: More verbose, requires manual encoding and newline handling
  - subprocess shell commands: Cross-platform issues, escape complexity, security risks

  ### 2. Content Generation: Hardcoded Prose

  **Decision:** Use hardcoded prose content (2-3 sentences) with no API calls or templates.

  **Why:** The spec allows "any topic" with no constraint on content source. Hardcoding simple,
  coherent prose is the simplest solution meeting all functional requirements:
  - Eliminates dependency on Claude API or external content generation services
  - No risk of API failures or latency in a test file creation feature
  - The size estimate (S = 10-15 minutes) presumes simple file creation, not API-dependent workflows
  - 180+ prior test files use various content strategies; this feature can use the simplest approach

  **Alternatives Considered:**
  - Claude API (AI-generated): Adds LLM dependency, increases complexity, slower execution
  - Jinja2 templates: Adds external dependency for simple 2-3 sentence content

  ### 3. Markdown Validation Strategy: Lightweight Structural Check

  **Decision:** Implement simple post-creation validation checking structure (H1 heading, blank line,
  2-3 sentences), file size (400-600 bytes), encoding (UTF-8), and line endings (LF) without external
  parser libraries.

  **Why:** Catches obvious formatting errors and encoding issues without adding dependencies:
  - Check heading with regex: `^# .+$` on first line
  - Count sentences via regex: `[.!?]+` to verify 2-3 punctuation marks
  - File size check: read file bytes and verify range
  - Encoding check: attempt read as UTF-8 and verify success
  - Line endings check: read in binary mode and verify `\n` only (no `\r\n`)

  This validates CommonMark compliance without external markdown parser libraries.

  **Alternatives Considered:**
  - No validation: Could miss encoding or structure errors
  - Heavy validation with markdown parser library: Adds external dependency; unnecessary for
    simple structural check

  ### 4. Git Integration: Python `subprocess` Module

  **Decision:** Use Python's `subprocess.run()` with `shell=False` for three straightforward
  git operations: `add`, `commit`, `push`.

  **Why:** Secure, reliable, part of Python standard library:
  - `shell=False` prevents command injection attacks
  - Simple enough that external GitPython library is overkill for 3 operations
  - Established approach in `src/create_markdown.py`
  - No external dependencies for a test feature

  **Alternatives Considered:**
  - GitPython library: External dependency; unnecessary overhead for 3 simple commands
  - Manual git command in shell script: Security risk from command injection; less portable

  ### 5. Line Ending Handling: Platform-Independent LF Enforcement

  **Decision:** Use `pathlib.write_text(newline='\n')` to enforce LF line endings on all
  platforms.

  **Why:** Python's io module documents that `newline='\n'` converts all line endings to LF
  regardless of platform, satisfying NFR-2 (Unix line endings).

  **Alternatives Considered:**
  - Binary mode (`wb`) with explicit bytes: More complex, requires manual encoding to bytes
  - Text mode with default newline (None): Would use CRLF on Windows, violating NFR-2

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Validation)** comes first because:
  - Must create the deliverable file before git operations
  - Validation ensures file is correct before committing
  - Fails fast if content, encoding, or structure are wrong
  - Allows debugging and iteration before permanent git commit

  **Phase 2 (Git Integration)** comes second because:
  - Depends on Phase 1 creating a valid file
  - Commits and pushes the validated result
  - Is mechanical and straightforward once file is correct
  - Cannot be undone if Phase 1 had errors

  ### Validation Gates

  File passes Phase 1 only if it satisfies ALL acceptance criteria:
  - File exists at repository root
  - Contains single H1 heading (line 1: `# Title`)
  - Blank line separates heading from content (line 2)
  - Contains 2-3 sentences of prose (lines 3+)
  - File size is 400-600 bytes
  - Encoding is UTF-8 without BOM
  - Line endings are LF only (no CRLF)

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | **Encoding errors on platform with non-UTF-8 default** | Medium | Explicit `encoding='utf-8'` parameter to pathlib prevents silent encoding errors; Python raises exception if encoding fails |
  | **Line ending mismatches on Windows** | Medium | Explicit `newline='\n'` parameter to pathlib enforces LF on all platforms (Windows, macOS, Linux) as documented in Python io module |
  | **Git authentication failure during push** | Low | SSH keys/tokens are handled by system git configuration, not Python code. Feature branch is pre-created and user is already authenticated |
  | **File already exists at repository root** | Low | Validation checks for file existence before creation; implementation can overwrite with explicit flag if needed |
  | **Subprocess command injection via git arguments** | Low | Using `subprocess.run()` with `shell=False` and explicit argument lists (not string concatenation) prevents injection |
  | **Validation regex fails to catch formatting errors** | Low | Multiple validation checks (heading, sentence count, file size, encoding, line endings) provide defense in depth |
