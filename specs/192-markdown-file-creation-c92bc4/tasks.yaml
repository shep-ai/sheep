content: |
  ## Implementation Flow

  The 9 tasks build the feature in a logical sequence:

  **Phase 1 (Tasks 1-2):** Foundation is established by defining content constants and implementing file creation.
  The created file becomes the artifact that subsequent phases validate and integrate into git.

  **Phase 2 (Tasks 3-6):** Validation system is built incrementally. Each validation check is implemented independently
  and testable in isolation. Then all checks are wired into a fail-fast orchestration that ensures complete validation
  before git operations proceed.

  **Phase 3 (Tasks 7-8):** Git integration connects validation to repository operations. Individual git operations
  are implemented first, then wired into a complete sequence in main() that respects the fail-fast principle.

  **Phase 4 (Task 9):** End-to-end integration verifies the complete workflow and ensures all success criteria are met.

  ## Validation Sequence (Core Design)

  All validation executes before any git operations (fail-fast principle):
  1. **UTF-8 Encoding:** Detect BOM, validate UTF-8 decode succeeds
  2. **Line Endings:** Reject CRLF and CR, require LF only
  3. **Markdown Structure:** Verify H1 heading present, count 2-3 sentences
  4. **File Size:** Verify 450-550 byte range
  5. **Git Operations:** Only proceed if all validation passed

  This ordering optimizes for early error detection and data integrity.

  ## Testing Strategy

  Each task includes TDD cycles (RED → GREEN → REFACTOR):
  - **RED:** Write test asserting desired behavior
  - **GREEN:** Implement minimal code to pass test
  - **REFACTOR:** Clean up, improve error messages, extract helpers if needed

  Integration tests verify components work together; unit tests verify individual functions.
  Mocking is used for subprocess calls to avoid actual git operations during testing.
