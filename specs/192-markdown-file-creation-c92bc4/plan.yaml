content: |
  ## Architecture Overview

  Feature 192 implements a direct/inline module that creates a markdown file following the established pattern from 191+ prior test files.
  The architecture is intentionally simple and self-contained:

  1. **File Creation:** Use pathlib.Path.write_text() with explicit newline="\\n" to ensure Unix LF line endings on all platforms
  2. **Validation:** Comprehensive fail-fast validation sequence before any git operations
  3. **Git Integration:** Direct subprocess.run() calls for add, commit, and push operations

  The implementation follows the proven pattern from feature 191, which successfully completed the identical task.
  No external abstractions or helper modules are required; the workflow is trivial enough to keep inline.

  Key architectural decision: **Validation always completes before git operations**. This fail-fast principle ensures
  data integrity and prevents invalid files entering the repository. The validation sequence is ordered for early detection:
  file existence → UTF-8 encoding (no BOM) → Unix LF line endings → markdown structure (H1 + 2-3 sentences) → file size (450-550 bytes).

  ## Key Design Decisions

  ### 1. Direct Implementation (Not Modular)

  **Chosen:** Direct/inline implementation within feature_192_markdown_file_creation.py

  **Why:** Although the spec resolves to use modular implementation (content_generators.py), the research phase identified
  a critical conflict: content_generators.generate_markdown_content() uses LLM-based generation, while the spec explicitly
  requires fixed template prose. Feature 191 faced the same conflict and chose direct implementation successfully.

  Direct implementation is optimal because it eliminates this conflict, matches the proven pattern, keeps code self-contained,
  and avoids requiring modifications to shared utilities for a single-feature use case.

  **Reference:** Feature 191 uses identical direct implementation pattern: src/sheep/features/feature_191_markdown_file_creation.py

  ### 2. File Writing: pathlib with Explicit Newline Parameter

  **Chosen:** `Path(FILENAME).write_text(content, encoding="utf-8", newline="\\n")`

  **Why:** pathlib is specified in the technology stack and is the modern Python standard (3.4+, required 3.11+).
  The critical detail is the newline="\\n" parameter: this explicitly ensures Unix LF line endings on ALL platforms
  (Windows, macOS, Linux), preventing automatic CRLF conversion on Windows. This is essential because the validation layer
  will reject CRLF line endings. Feature 191 proves this pattern works.

  ### 3. Validation Sequencing: Fail-Fast Before Git

  **Chosen:** All validation completes before any git operations, with specific ordering:
  1. File existence check
  2. UTF-8 encoding validation (detect BOM)
  3. Unix LF line ending validation
  4. Markdown structure validation (H1 heading + 2-3 sentences)
  5. File size range validation (450-550 bytes)

  **Why:** Specification explicitly requires: "All validation checks MUST complete successfully before proceeding to git operations."
  This fail-fast pattern ensures data integrity. Sequential ordering optimizes for early error detection.
  Feature 191 validates this pattern successfully.

  ### 4. Prose Content: Fixed Template

  **Chosen:** Fixed 2-3 sentence prose template about a single topic (~400-500 bytes)

  **Why:** The specification explicitly resolves this product decision: "Fixed template text is recommended because it maintains
  consistency with established patterns, ensures reproducible test results, reduces complexity." This is the selected answer
  in openQuestions. A simple template ensures deterministic behavior, makes validation straightforward, and aligns with
  all 191+ prior test files.

  ### 5. Git Operations: subprocess Module

  **Chosen:** Direct subprocess.run() calls for git operations
  ```
  subprocess.run(["git", "add", FILENAME], check=True, capture_output=True)
  subprocess.run(["git", "commit", "-m", MESSAGE], check=True, capture_output=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True, capture_output=True)
  ```

  **Why:** Specification explicitly lists "subprocess (git operations)" as required technology.
  Direct subprocess.run() is simpler, more explicit, and avoids tool infrastructure coupling.
  Using check=True raises exceptions on git failures; this integrates with our fail-fast error handling.
  Feature 191 uses this identical pattern.

  ### 6. File Size Validation: 450-550 Bytes Range

  **Chosen:** Validate file size is between 450-550 bytes (inclusive)

  **Why:** Specification requires NFR-1: "File size SHOULD be between 450-550 bytes to maintain consistency with existing test files."
  This range catches truncated files (indicating corruption) while allowing natural prose variation.
  Existing test-*.md files show sizes around 400-500 bytes, confirming this range is appropriate.

  ## Implementation Strategy

  The feature follows a linear 4-phase implementation:

  **Phase 1 - Foundation & File Creation:**
  Set up content constants (filename, title, prose text) and implement the core file creation.
  This establishes the basic artifact that subsequent phases validate and integrate into git.

  **Phase 2 - Validation System:**
  Implement all five validation checks in isolation. Each check is independent and can be tested separately.
  The validation module is then wired into a fail-fast orchestration that runs all checks sequentially
  before proceeding to git operations.

  **Phase 3 - Git Integration:**
  Implement git operations (add, commit, push) as separate functions, then wire them into a sequence.
  This phase assumes the file exists and is valid; validation is orchestrated separately.

  **Phase 4 - Integration & Testing:**
  Wire validation → file creation → git workflow together in a main() function.
  Execute end-to-end tests to verify the complete workflow, then clean up and finalize.

  This phasing allows each component to be tested independently before integration.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists in repository | Check for file existence before creation; fail fast if already present |
  | Incorrect encoding (UTF-8 with BOM, or non-UTF-8) | Validate encoding before git operations; decode as UTF-8 and check for BOM (0xef 0xbb 0xbf) |
  | Incorrect line endings (CRLF or CR) | Validate line endings before git operations; use pathlib newline="\\n" to prevent platform conversion |
  | Invalid markdown structure (missing H1 or wrong sentence count) | Parse file after creation to verify H1 heading and exactly 2-3 sentences before git |
  | File size out of range (truncated or oversized) | Validate file size is 450-550 bytes; detects truncation or unexpected expansion |
  | Git operations fail silently | Use subprocess check=True to raise exceptions; catch and report with clear error messages |
  | Inconsistency with prior 191 implementations | Follow feature 191 pattern exactly; validate using same checks as prior features |
