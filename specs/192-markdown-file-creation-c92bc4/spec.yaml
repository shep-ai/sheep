content: |
  ## Problem Statement

  Create a single markdown file named test-3ellld.md in the repository root containing an H1 heading and 2-3 sentences of prose content about any topic. The file must follow the established pattern used by 191+ existing test files in the repository: UTF-8 encoding, Unix LF line endings, proper markdown structure, comprehensive validation, and be committed and pushed to git.

  This feature is part of a systematic pattern (features 1-192) that creates test markdown files within the Sheep agentic platform. Proven implementations exist across 191 preceding features, with recent examples (features 189-191) demonstrating the exact workflow.

  ## Success Criteria

  - [ ] File test-3ellld.md is created in the repository root directory
  - [ ] File contains exactly one H1 heading (single # followed by title text)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without BOM (byte order mark)
  - [ ] File uses Unix LF line endings (\\n, not \\r\\n or \\r)
  - [ ] File structure validation passes (proper markdown format)
  - [ ] File is staged with git add
  - [ ] File is committed with conventional commit message: "feat(192): create markdown file test-3ellld.md"
  - [ ] Commit is pushed to remote repository
  - [ ] No validation warnings or errors during execution
  - [ ] File size is approximately 450-550 bytes (consistent with pattern)
  - [ ] File is readable as UTF-8 text without corruption

  ## Functional Requirements

  - **FR-1**: The system MUST create a markdown file named "test-3ellld.md" in the repository root directory
  - **FR-2**: The file MUST contain exactly one H1 heading (single # followed by title text)
  - **FR-3**: The file MUST contain 2-3 sentences of prose content following the heading
  - **FR-4**: The file MUST be encoded in UTF-8 without BOM
  - **FR-5**: The file MUST use Unix LF (\\n) line endings exclusively
  - **FR-6**: The file MUST be validated for proper markdown structure before git operations
  - **FR-7**: The file MUST be validated for UTF-8 encoding before git operations
  - **FR-8**: The file MUST be validated for Unix LF line endings before git operations
  - **FR-9**: The file MUST be added to git staging area using git add
  - **FR-10**: The file MUST be committed with the message "feat(192): create markdown file test-3ellld.md"
  - **FR-11**: The commit MUST be pushed to the remote repository
  - **FR-12**: All validation checks MUST complete successfully before proceeding to git operations

  ## Non-Functional Requirements

  - **NFR-1**: File size SHOULD be between 450-550 bytes to maintain consistency with existing test files
  - **NFR-2**: Validation checks MUST execute completely before any git operations begin
  - **NFR-3**: Encoding validation MUST detect and reject non-UTF-8 content with clear error messages
  - **NFR-4**: Line ending validation MUST detect and reject CRLF or CR-only line endings with clear error messages
  - **NFR-5**: Markdown structure validation MUST verify H1 heading presence and prose sentence count
  - **NFR-6**: Implementation MUST use pathlib for cross-platform file I/O operations
  - **NFR-7**: Git operations MUST use subprocess module to execute git commands
  - **NFR-8**: Implementation SHOULD follow the established patterns from reference implementations (features 186-191)
  - **NFR-9**: Error messages SHOULD provide specific details about validation failures
  - **NFR-10**: Implementation SHOULD be deterministic and produce identical output across runs

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Creates single new file (test-3ellld.md) following established pattern of 191+ existing test-*.md files |
  | Git repository | Low | Standard git workflow (add, commit, push) using subprocess to execute git commands |
  | File system | Low | Simple file write operation (~450-550 bytes) with UTF-8 encoding and LF line endings |
  | Validation layer | Low | File structure, encoding, and line ending validation reusing patterns from existing implementations |
  | src/sheep/features/ | Low | May add new feature_192_markdown_file_creation.py following established patterns from features 188-191 |

  ## Dependencies

  **External Dependencies:**
  - Git (version control system) — must be available in PATH for subprocess calls

  **Internal Dependencies:**
  - Established markdown file patterns from existing 191+ test files (test-xgtwtq.md, test-ir293z.md, test-khrvcn.md, etc.)
  - Repository must be a valid git repository with remote configured
  - Python 3.11+ with standard library modules (pathlib, subprocess, sys, os)
  - sheep.content_generators module with helper functions (for modular implementation approach)
  - sheep.config.llm for LLM-based prose generation (optional, if using content_generators approach)

  **Known Working Examples:**
  - 191+ similar test markdown files already exist in repository root
  - Reference implementations: feature_191_markdown_file_creation.py (inline) and feature_188_markdown_file_creation.py (modular) demonstrate both patterns
  - Features 189-191 all completed identical tasks successfully
  - Commit history shows consistent successful pattern with features 186-191

  ## Implementation Approaches

  Two proven implementation patterns exist in the codebase:

  **Approach 1: Inline Implementation (Features 191, 116, 148)**
  - Self-contained module with all functions defined inline
  - Pros: Single file, no external module dependencies, clear flow
  - Cons: Code duplication across features
  - Reference: src/sheep/features/feature_191_markdown_file_creation.py

  **Approach 2: Modular Implementation (Features 188+)**
  - Uses helper functions from content_generators.py module
  - Pros: DRY principle, reusable components, less code per feature
  - Cons: Requires understanding of helper module API
  - Reference: src/sheep/features/feature_188_markdown_file_creation.py

  **Recommended Approach (per openQuestions):** Modular implementation using content_generators.py helpers, following the DRY principle and reducing code duplication across the feature series.

  ## Size Estimate

  **S** — 1-2 hours of work

  **Justification:**
  - Trivial complexity: Single file creation following an established, well-documented pattern with 191 prior implementations
  - No new code paths or logic required: Copy pattern from proven reference implementations (features 186-191)
  - Clear success criteria: H1 heading + 2-3 sentences, proper encoding/line endings, git workflow
  - Expected file size: ~450-550 bytes (consistent with similar test files)
  - No new architectural decisions required: Pattern is fully established and validated
  - Validation is straightforward: File existence, encoding, line endings, markdown syntax checks
  - Reference implementations readily available and tested across 191 prior features
  - Git operations well-tested and reliable across 191+ features
