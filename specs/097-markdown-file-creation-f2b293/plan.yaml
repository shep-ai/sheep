# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single test markdown file following the established pattern from 96+ prior
  features (069-096). The implementation is purely additive: create one file at repository root,
  validate its structure, and push via standard git workflow. No modifications to existing code,
  configuration, or infrastructure are required.

  The implementation integrates seamlessly with the existing codebase:
  - **File I/O**: Uses pathlib (standard library in Python 3.11+), following patterns in src/sheep/tools/file_tools.py
  - **Git Operations**: Uses subprocess.run() with explicit command lists, following patterns in src/sheep/tools/git_tools.py
  - **Logging**: Can integrate with src/sheep/observability/logging.get_logger() for debug output
  - **Deterministic Execution**: No external API dependencies or randomness; execution is fast and reproducible

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** `Path("test-mixait.md").write_text(content, encoding="utf-8")`

  **Why:** Functional requirement FR-4 explicitly mandates this method. Pathlib is idiomatic in Python 3.11+,
  cross-platform, and already used throughout the codebase (file_tools.py). write_text() handles encoding
  automatically and creates the file if missing. Consistent with 96+ prior test files.

  **Alternatives Considered:**
  - os.path + open(): Lower-level, less convenient, less Pythonic
  - GitPython: Unnecessary abstraction; subprocess is the codebase pattern (git_tools.py)

  ### 2. Git Workflow: subprocess.run() with Explicit Commands

  **Chosen:** subprocess.run() with explicit command lists (["git", "add", "test-mixait.md"], etc.)

  **Why:** Established pattern in git_tools.py ensures consistency with 96+ prior features. Subprocess
  with explicit command lists is safe (no shell injection risk), enables output capture, and integrates
  with codebase logging. No external git library (GitPython) is required or used in the codebase.

  **Alternatives Considered:**
  - GitPython: Not in project dependencies; adds unnecessary abstraction
  - Shell execution (os.system or shell=True): Less safe, harder to debug, not portable

  ### 3. Prose Content: Hardcoded with Feature-Based Topic Selection

  **Chosen:** Deterministic prose from pre-written topic pool; topic selected via feature number modulo

  **Why:** Analysis of 96+ existing test files shows hardcoded prose on universal topics (adaptability,
  persistence, resilience, etc.). This ensures: (1) guaranteed grammatical correctness (spec NFR-2),
  (2) fast, deterministic execution with zero external dependencies, (3) consistency with established
  test pattern. Feature-based topic selection provides variety (different topics for different features)
  while remaining deterministic and reproducible.

  **Alternatives Considered:**
  - Dynamic prose generation (NLP, templates): Unnecessary complexity, not required by spec
  - AI-generated prose (Claude/OpenAI API): Adds latency, cost, external dependency for trivial task
  - Random topic selection: Non-deterministic makes reproduction harder

  ### 4. Markdown Validation: Manual Structure Verification

  **Chosen:** Post-creation validation via string checks and file inspection

  **Why:** Deterministic, hardcoded content makes validation straightforward (simple string operations).
  No external markdown parsing library needed. Validation confirms: (a) file starts with `# ` (H1 heading),
  (b) blank line separates heading from prose, (c) prose is exactly 2-3 sentences, (d) file size is
  320-600 bytes, (e) UTF-8 encoding without BOM, (f) LF line endings only. Aligns with test patterns
  in 96+ prior features.

  **Alternatives Considered:**
  - markdown Python library: External dependency not required for fixed, deterministic content
  - No validation: Risks undetected format errors; spec success criteria explicitly list format requirements

  ### 5. Encoding & Line Endings: UTF-8 without BOM, Unix LF

  **Chosen:** Explicit UTF-8 encoding via pathlib; careful handling to ensure LF line endings on all platforms

  **Why:** Spec explicitly requires (NFR-3, NFR-4): UTF-8 without BOM and Unix LF line endings only.
  Using `Path.write_text(content, encoding="utf-8")` automatically produces UTF-8 without BOM (standard
  Python behavior). Ensures cross-platform reproducibility, clean git diffs, and tool compatibility.
  Matches 96+ existing test files.

  ## Implementation Strategy

  The implementation follows a phased approach:

  **Phase 1: File Creation & Validation** — Create the markdown file with appropriate prose content,
  then validate structure and encoding against all success criteria. This ensures the file is correct
  before any git operations.

  **Phase 2: Git Workflow & Push** — Stage the file, commit with conventional message format, and
  push to the feature branch. Standard git workflow following 96+ prior features.

  **Why This Ordering:** File creation and validation must come first to ensure a correct artifact.
  Only after validation should we stage and commit. This separation allows early detection of errors
  (e.g., encoding issues) before git operations.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Prose content is grammatically incorrect or incoherent | Use pre-written, verified prose from established topic pool. Each topic has been used in prior features and validated for quality. |
  | File encoding is not UTF-8 or has BOM | Explicitly specify encoding="utf-8" in Path.write_text(). Verify via `file test-mixait.md` command. |
  | File has CRLF line endings instead of LF | Use pathlib with explicit newline handling. Verify via `od -c test-mixait.md` or `file test-mixait.md`. |
  | File size is outside 320-600 byte range | Hardcode prose length to ensure size falls within range. Verify size post-creation. |
  | File doesn't start with H1 markdown syntax | Prose template is fixed; first line is always "# Title". Validation confirms this. |
  | Git operations fail (e.g., nothing to commit) | Handle subprocess.CalledProcessError gracefully. Verify file exists and has content before staging. |
  | Feature branch doesn't exist | Feature branch is pre-created per spec dependency. Verify branch exists before push. |
  | Commit message doesn't match conventional format | Message format is hardcoded: `feat(097): create markdown file test-mixait.md with prose content`. No user input. |
