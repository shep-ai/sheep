content: |
  ## Summary

  Implementation follows a straightforward, two-phase approach aligned with 96+ prior test-file-creation
  features:

  **Phase 1: File Creation & Validation**
  - Task 1 creates test-mixait.md using pathlib with hardcoded prose content from the established
    topic pool (topic selected deterministically via feature number). Prose is validated at creation
    to ensure grammatical correctness and appropriate tone.
  - Task 2 performs comprehensive post-creation validation: verifies H1 prefix, blank-line separator,
    sentence count (2-3), file size (320-600 bytes), UTF-8 encoding without BOM, and LF line endings
    only. This ensures all success criteria are met before proceeding to git operations.

  **Phase 2: Git Workflow & Push**
  - Task 3 stages the file via `git add test-mixait.md`.
  - Task 4 commits via conventional commit message: `feat(097): create markdown file test-mixait.md with prose content`.
  - Task 5 pushes to the feature branch via `git push -u origin HEAD`.

  **Why This Approach:**
  - Separating file creation/validation (Phase 1) from git operations (Phase 2) allows early error detection
  - Tasks within each phase are sequential and ordered by dependency
  - TDD cycles are applied to file creation and validation (the code-bearing tasks)
  - Git operations (stage, commit, push) are straightforward shell commands with no TDD needed
  - Total effort ~15-20 minutes matches size estimate (S: 10-15 minutes) with buffer for verification

  **Key Design Principles:**
  - Consistency: Prose topic and file structure follow established patterns from 96+ prior features
  - Determinism: Feature-based topic selection ensures reproducibility (feature 097 always uses same topic)
  - Safety: Hardcoded prose and fixed file structure eliminate risk of runtime errors or format issues
  - Simplicity: No external dependencies, AI calls, or complex logic; pure sequential execution
