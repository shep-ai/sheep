content: |
  ## Summary

  The feature is implemented across two phases with four concrete tasks:

  **Phase 1: File Creation & Validation**
  - Task 1 creates the markdown file (test-tzrao0.md) with proper H1 heading, blank line, and 2-3 sentences of prose. This task ensures structural correctness, UTF-8 encoding without BOM, Unix LF line endings, and appropriate file size (400-600 bytes).

  **Phase 2: Git Integration**
  - Task 2 stages the file using `git add test-tzrao0.md`
  - Task 3 creates a commit with the exact conventional message: `feat(245): create markdown file test-tzrao0.md with prose content`
  - Task 4 pushes the commit to remote origin on the feature branch

  Each task includes explicit TDD cycles (RED-GREEN-REFACTOR) and clear acceptance criteria. Tasks are ordered by dependency: file creation must complete before git operations, staging must precede committing, and committing must precede pushing.

  **Total Estimated Effort:** 15 minutes
  - File creation & validation: ~8 minutes
  - Git add: ~2 minutes
  - Git commit: ~3 minutes
  - Git push: ~2 minutes

  This timeline aligns with the feature size estimate (S — Small) and matches the efficiency observed in 240+ identical prior implementations (features 069-244).
