    chosen: "Use Python pathlib.Path.write_text() with explicit UTF-8 encoding, no BOM, LF line endings"
    rejected:
      - "Built-in open() function — more boilerplate code, requires manual encoding/line ending configuration, less idiomatic for Python 3.11+"
      - "Shell commands (echo/cat) — difficult to ensure consistent encoding and line endings across platforms, defeats automation system design"
    rationale: >
      "pathlib is the modern standard library approach for file I/O in Python 3.11+, used consistently across all 240+ existing test files. The write_text() method with encoding='utf-8' parameter provides explicit control over encoding (no BOM) and writing '\\n' directly ensures LF line endings. This approach is idiomatic, reliable, and aligns with established codebase patterns."

  - title: "Prose Content Generation Strategy"
    chosen: "Human-selected prose content written directly, with flexible topic choice following quality guidance"
    rejected:
      - "Template-based generation — unnecessary complexity for a single file; templates are useful for repeated structures, not one-time tasks"
      - "Content reuse/copying from existing files — violates implicit uniqueness expectations and adds coupling to existing content"
    rationale: >
      "The feature spec requires 'thematically coherent' prose in 'proper English with correct grammar and punctuation' (NFR-3). Direct prose composition best ensures quality. The topic is intentionally open-ended to allow any area of interest. The 400-600 byte target size (NFR-4) is naturally achieved through 2-3 coherent sentences, not engineered. This approach is simplest, most transparent, and matches the 240+ existing test files which display diverse, well-written topics."

  - title: "Git Workflow Automation"
    chosen: "Use Python subprocess module to execute git commands sequentially"
    rejected:
      - "GitPython library — adds external dependency when subprocess (stdlib) is sufficient for mechanical git operations; subprocess is more transparent"
      - "Direct shell execution — less portable, harder to handle error codes reliably, defeats Python-native automation system design"
    rationale: >
      "Sheep is a Python-based automated implementation system. Using subprocess keeps implementation in Python, adds zero external dependencies (subprocess is stdlib), and provides sufficient transparency for debugging. The workflow is straightforward: create file, 'git add', commit with exact message, push to branch. Subprocess is sufficient for this mechanical workflow and matches the established pattern."

  - title: "Markdown Syntax and File Structure"
    chosen: "Strict adherence to minimal format: single H1 heading, blank line, 2-3 sentences of prose"
    rejected:
      - "Alternative heading levels (##, ###) — feature spec (FR-2) explicitly requires exactly one H1; violations break consistency with 240+ files"
      - "Multiple sections or complex markdown — introduces unnecessary complexity; violates established minimal pattern"
    rationale: >
      "Feature spec mandates exactly one H1 heading (FR-2) and 2-3 sentences (FR-3). This minimal structure is validated across all 240+ existing test files. Deviation breaks consistency and testing assumptions. The format naturally produces the expected 400-600 byte file size without additional engineering."

  - title: "Error Handling and Robustness"
    chosen: "Minimal error handling — assume operations succeed, fail explicitly if any operation fails"
    rejected:
      - "Extensive error checking and retries — over-engineering for isolated task with no external flaky dependencies"
      - "Silent/graceful degradation — makes debugging harder; automated system needs visibility into failures"
    rationale: >
      "This feature involves only local file I/O and git operations on a pre-existing feature branch in a clean repository. All operations are deterministic and reliable: write file, stage and commit locally, push to known remote. No external dependencies, network calls, or race conditions. Over-engineering error handling adds complexity without corresponding benefit. Explicit failures make issues visible to the automated system."

