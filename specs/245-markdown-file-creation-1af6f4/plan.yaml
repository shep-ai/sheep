content: |
  ## Architecture Overview

  This feature follows the well-established markdown-file-creation pattern that has been successfully implemented 170+ times across features 069-244. The implementation is deliberately minimal and isolated:

  - **Scope:** Single markdown file creation at repository root
  - **No source code changes:** Feature does not modify `/src/sheep/` or any application logic
  - **No configuration changes:** No modifications to pyproject.toml, .env, Dockerfile, or test suites
  - **Pure file I/O + git workflow:** Straightforward imperative approach with deterministic operations
  - **Zero external dependencies:** Uses only Python 3.11+ standard library (pathlib, subprocess) and git CLI

  The feature fits seamlessly into Sheep's automated implementation architecture as a minimal, verifiable unit of work. The established pattern from 240+ prior implementations provides strong precedent for both the markdown format and the git workflow.

  ## Key Design Decisions

  ### 1. File Creation Approach: pathlib.Path.write_text()

  **Chosen:** Python `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF line endings

  **Rationale:**
  - Modern, idiomatic approach for Python 3.11+ (standard library recommendation)
  - Explicit `encoding="utf-8"` parameter ensures no BOM is added
  - String literals with `\n` ensure Unix LF line endings across all platforms
  - Matches established pattern from all 240+ prior test files in this repository
  - Simpler and more Pythonic than `open()` with manual file handle management

  **Implementation pattern:**
  ```python
  from pathlib import Path

  content = "# Title\n\nSentence 1. Sentence 2. Sentence 3."
  Path("test-tzrao0.md").write_text(content, encoding="utf-8")
  ```

  This approach guarantees correct encoding and line endings without manual configuration.

  ### 2. Prose Content: Direct Composition

  **Chosen:** Direct human-composed prose with flexible topic and quality focus

  **Rationale:**
  - Feature spec (NFR-3) explicitly requires "thematically coherent" prose in "proper English with correct grammar and punctuation"
  - Direct composition best ensures quality; templates add unnecessary complexity for a one-time task
  - Topic is intentionally open-ended ("about anything") — any topic is acceptable
  - 2-3 coherent sentences naturally produce the expected 400-600 byte file size (NFR-4)
  - This approach matches the diverse, well-written topics in 240+ existing test files

  **Content characteristics:**
  - Clear topic focus with coherent sentences
  - Proper grammar, spelling, and punctuation
  - Appropriate sentence length and flow
  - Natural file size outcome (no artificial padding)

  ### 3. Git Workflow: Python subprocess Module

  **Chosen:** Python `subprocess` module to execute git commands sequentially

  **Rationale:**
  - Sheep is Python-based; subprocess keeps implementation in Python
  - Zero additional external dependencies — subprocess is Python standard library
  - Sufficient for straightforward sequential git operations (add → commit → push)
  - Transparent and portable across all platforms
  - Matches established pattern from 240+ prior identical features

  **Workflow sequence:**
  1. Create markdown file with write_text()
  2. Execute `git add test-tzrao0.md`
  3. Execute `git commit -m "feat(245): create markdown file test-tzrao0.md with prose content"`
  4. Execute `git push -u origin HEAD`

  All operations are deterministic local operations with no flaky external dependencies.

  ### 4. Markdown Format: Strict Minimal Structure

  **Chosen:** Exactly one H1 heading, blank line separator, 2-3 sentences

  **Format specification:**
  ```markdown
  # Title

  Sentence one. Sentence two. Sentence three (optional).
  ```

  **Rationale:**
  - Feature spec (FR-2, FR-3) explicitly mandates "exactly one H1 heading" and "exactly 2-3 sentences"
  - This minimal format is validated across all 240+ test files in the repository
  - Strict adherence ensures consistency with testing assumptions and precedent
  - Format naturally produces the expected 400-600 byte file size without additional engineering

  Deviations (multiple heading levels, additional sections, complex markdown) would violate spec requirements and break consistency.

  ### 5. Error Handling: Fail Fast, No Overengineering

  **Chosen:** Minimal error handling — assume operations succeed, fail explicitly on any error

  **Rationale:**
  - This feature involves only local file I/O and git operations on a pre-existing feature branch
  - All operations are deterministic and reliable: write file, stage locally, commit locally, push to known remote
  - No external dependencies, network calls, or race conditions
  - No flaky operations that would benefit from retries or fallback strategies
  - Explicit failures make issues visible to the automated system (better for debugging)
  - Over-engineering error handling adds complexity without corresponding benefit

  **Approach:**
  - No retry logic
  - No fallback strategies
  - Exceptions propagate naturally (fail fast)
  - Assume git is properly configured (user.name, user.email, credentials)

  ## Implementation Strategy

  **Two-phase sequential approach:**

  **Phase 1: File Creation & Validation**
  - Create markdown file with correct structure using pathlib
  - Compose 2-3 sentences of thematically coherent prose
  - Verify file meets all structural requirements (H1 heading, blank line, sentence count)
  - Verify encoding (UTF-8 without BOM) and line endings (LF only)
  - Confirm file size falls within expected 400-600 byte range

  **Phase 2: Git Integration**
  - Stage created file with `git add test-tzrao0.md`
  - Create commit with exact conventional message: `feat(245): create markdown file test-tzrao0.md with prose content`
  - Push commit to remote on feature branch: `git push -u origin HEAD`
  - Verify working directory is clean and remote is updated

  **Why this ordering:**
  - File must exist and be valid before git operations
  - Validation in Phase 1 prevents committing malformed files
  - Sequential phases are required (Phase 2 depends on Phase 1 completion)
  - Total estimated effort: ~15 minutes (5 min file creation, 3 min validation, 7 min git workflow)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect markdown structure | Strict adherence to spec: exactly one H1, blank line, 2-3 sentences. Validation step verifies structure before committing. |
  | Wrong file encoding (UTF-8 with BOM or non-UTF-8) | Use pathlib.Path.write_text() with explicit `encoding="utf-8"` parameter. Test file encoding before committing. |
  | Wrong line endings (CRLF instead of LF) | Write string literals with `\n` directly in Python code (platform-independent). Verify with git or file inspection. |
  | Git configuration missing | Assume developer has git properly configured (user.name, user.email). Feature is automated only after environment setup. |
  | Wrong commit message or branch | Use subprocess to execute exact git commands. Double-check commit message matches spec exactly before git push. |
  | File size out of expected range | 2-3 coherent sentences naturally produce 400-600 bytes. If size is significantly off, review prose length and coherence. |
  | Push fails due to network/permissions | Feature assumes write access to origin repository (pre-existing feature branch). If push fails, investigate git credentials and permissions. |

  ## Summary

  This feature follows a proven, minimal architectural pattern from 240+ prior implementations. The implementation approach leverages Python standard library (pathlib, subprocess) with zero external dependencies, ensuring reliability and portability. The two-phase strategy (file creation followed by git integration) maintains clear separation of concerns while enabling efficient validation. Risk mitigation focuses on structural compliance and encoding correctness — both low-impact areas with strong precedent.
