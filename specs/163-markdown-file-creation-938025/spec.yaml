content: |
  ## Problem Statement

  Create a markdown file named `test-i7ts4s.md` containing:
  - An H1 markdown heading with a title about any topic
  - A blank line separator
  - 2-3 sentences of coherent prose content

  The file must follow the established pattern from 162 preceding features and integrate with the existing
  markdown creation infrastructure.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation. Key directories:

  - `src/sheep/` - Main package directory
    - `content_generators.py` - Content generation and file validation utilities
    - `features/` - Individual feature implementations (e.g., `feature_157_markdown_file_creation.py`)
    - `tools/` - Git tools (`git_tools.py`), file tools (`file_tools.py`)
    - `config/` - LLM configuration and settings
    - `observability/` - Logging and tracing
    - `cli.py` - Command-line interface
  - `specs/` - Feature specifications (each feature gets a numbered directory)
  - `tests/` - Test suite

  Repository root contains generated markdown test files (`test-*.md`, 160+ files) from previous features.

  ### Architecture Patterns

  1. **Feature Implementation Pattern** - Each feature follows a consistent structure:
     - Feature module in `src/sheep/features/feature_NNN_markdown_file_creation.py`
     - Orchestrates workflow using pre-built helper functions
     - Returns result dictionary with filepath, content, commit message, and push result

  2. **Content Generation Pipeline** - A five-step workflow:
     1. Generate markdown content using Claude API
     2. Write file to repository root with UTF-8 encoding
     3. Validate file meets format requirements
     4. Stage and commit with conventional message
     5. Push to remote with upstream tracking

  3. **Helper Function Library** - `content_generators.py` provides:
     - `generate_markdown_content()` - Uses Claude to generate markdown with H1 + prose
     - `write_markdown_file()` - Writes with UTF-8, Unix LF line endings
     - `validate_markdown_file()` - Validates structure and format requirements
     - `commit_markdown_file()` - Git commit with conventional message
     - `push_markdown_file()` - Git push with upstream tracking

  4. **Layered Dependency** - Clear separation:
     - Business logic (feature implementations) depends on content generators
     - Content generators depend on tools (git, file I/O)
     - Tools depend on GitPython and standard library

  ### Relevant Technologies

  - **CrewAI**: Framework for agent orchestration (used in flows for research/implementation)
  - **Claude API**: LLM for generating markdown prose via `get_reasoning_llm()`
  - **GitPython**: Git operations (staging, committing, pushing)
  - **Pydantic**: Settings and data validation
  - **Python pathlib**: Cross-platform file path handling
  - **Langfuse**: Optional observability (tracing agent decisions)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/` | High | Must create `feature_163_markdown_file_creation.py` implementing the feature |
  | `src/sheep/features/__init__.py` | Medium | Add import/export for `create_feature_163_markdown_file()` function |
  | `src/sheep/content_generators.py` | None | Already provides all needed functions; no changes required |
  | Repository root | Medium | New file `test-i7ts4s.md` will be created and committed |
  | Git history | Low | New commit with conventional message `feat(163): Create markdown file test-i7ts4s.md with prose content` |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies required):

  - `content_generators.generate_markdown_content()` - Generate H1 + prose via Claude
  - `content_generators.write_markdown_file()` - Write to disk with proper encoding
  - `content_generators.validate_markdown_file()` - Validate structure
  - `content_generators.commit_markdown_file()` - Stage and commit
  - `content_generators.push_markdown_file()` - Push to remote
  - `sheep.observability.logging.get_logger()` - Structured logging
  - CrewAI LLM framework (already installed)
  - GitPython (already installed)

  **Pattern Reference**: Feature 157 (`feature_157_markdown_file_creation.py`) provides the exact implementation pattern.

  ## Size Estimate

  **S** (hours, 1-2 hour effort) — Here's the justification:

  - **Established pattern**: 162 preceding features follow identical structure; pattern is well-proven
  - **Reusable infrastructure**: All content generation, validation, git operations provided by `content_generators.py`
  - **Minimal code**: Feature implementation is ~110 lines (mostly boilerplate + docstrings); can copy/adapt from Feature 157
  - **No complexity**: No architectural decisions, no new technologies, no conditional logic
  - **No testing overhead**: Integration test via actual file creation and git operations
  - **No research needed**: Pattern is clear from recent features; question of "what to write about" is already solved by Claude

  ### Implementation Steps (for reference):
  1. Create `src/sheep/features/feature_163_markdown_file_creation.py` (~15 min)
  2. Update `src/sheep/features/__init__.py` with import (~5 min)
  3. Execute feature to create the markdown file (~1 min, includes validation and git operations)
  4. Verify file and git commit (~2 min)
  5. Push to remote (~1 min)

  Total: ~25 minutes of actual implementation work.
