content: |
  ## Problem Statement

  Create a markdown file named `test-i7ts4s.md` containing:
  - An H1 markdown heading with a title about any topic
  - A blank line separator
  - 2-3 sentences of coherent prose content

  The file must follow the established pattern from 162 preceding features and integrate with the existing markdown creation infrastructure.

  ## Success Criteria

  - [ ] File `test-i7ts4s.md` is created in repository root
  - [ ] File contains exactly one H1 heading (e.g., `# Some Title`)
  - [ ] File contains a blank line after the H1 heading
  - [ ] File contains 2-3 sentences of prose content after the blank line
  - [ ] Prose content is coherent and grammatically correct
  - [ ] File is encoded in UTF-8 with Unix LF line endings
  - [ ] File passes format validation (enforces all structure requirements)
  - [ ] File is staged and committed with message format `feat(163): Create markdown file test-i7ts4s.md with prose content`
  - [ ] Commit is pushed to remote feature branch with upstream tracking
  - [ ] Implementation follows established pattern from Feature 157 and prior features
  - [ ] No errors occur during content generation, file writing, validation, commit, or push

  ## Functional Requirements

  - **FR-1**: Feature must create a file named `test-i7ts4s.md` at the repository root
  - **FR-2**: File must contain exactly one H1 markdown heading (`# Title`)
  - **FR-3**: File must contain a blank line separating the H1 heading from prose content
  - **FR-4**: File must contain 2-3 sentences of prose content
  - **FR-5**: Prose content must be coherent and grammatically correct
  - **FR-6**: Content must be generated using Claude API (via `content_generators.generate_markdown_content()`)
  - **FR-7**: File must be written to disk using `content_generators.write_markdown_file()`
  - **FR-8**: File must be validated using `content_generators.validate_markdown_file()` before commit
  - **FR-9**: File must be staged and committed using `content_generators.commit_markdown_file()` with conventional message
  - **FR-10**: File must be pushed to remote using `content_generators.push_markdown_file()` with upstream tracking
  - **FR-11**: Function must return a result dictionary containing filepath, content, commit message, and push result
  - **FR-12**: Feature implementation must be located at `src/sheep/features/feature_163_markdown_file_creation.py`
  - **FR-13**: Feature must be exported from `src/sheep/features/__init__.py` as `create_feature_163_markdown_file()`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding
  - **NFR-2**: File must use Unix LF (`\n`) line endings, not Windows CRLF
  - **NFR-3**: Implementation must follow the architectural pattern established by Feature 157 and prior features
  - **NFR-4**: Code must leverage existing helper functions from `content_generators.py` (no duplication)
  - **NFR-5**: Feature must include structured logging via `sheep.observability.logging.get_logger()`
  - **NFR-6**: Feature must include docstring explaining purpose, parameters, return value, and exceptions
  - **NFR-7**: Implementation must fail fast: if validation fails, return error status without attempting recovery
  - **NFR-8**: Execution must complete within 1-2 hours (established size estimate of S)
  - **NFR-9**: Git operations must use existing GitPython abstractions in `git_tools.py` and `content_generators.py`
  - **NFR-10**: No new dependencies required; must use only CrewAI, Claude API, GitPython, Pydantic (already installed)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the feature use existing helper functions from content_generators.py or implement custom logic? | Use existing helpers | Maintains consistency with 162 prior features, eliminates code duplication, leverages proven infrastructure |
  | 2 | Should markdown content be generated dynamically by Claude API or use a pre-written static template? | Generate via Claude API | Leverages LLM capabilities, provides content variety, consistent with established pattern, already implemented in helper functions |
  | 3 | Should validation be strict (exact format requirements) or flexible/lenient? | Strict validation | Ensures output quality, catches errors before commit, matches existing infrastructure design, prevents bad commits |
  | 4 | Should the feature fail immediately on validation error or attempt recovery? | Fail fast on error | Prevents invalid commits, provides clear error signals, keeps logic simple, allows informed decisions on retry |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/` | High | Must create `feature_163_markdown_file_creation.py` implementing the feature |
  | `src/sheep/features/__init__.py` | Medium | Add import/export for `create_feature_163_markdown_file()` function |
  | `src/sheep/content_generators.py` | None | Already provides all needed functions; no changes required |
  | Repository root | Medium | New file `test-i7ts4s.md` will be created and committed |
  | Git history | Low | New commit with conventional message `feat(163): Create markdown file test-i7ts4s.md with prose content` |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies required):

  - `content_generators.generate_markdown_content()` - Generate H1 + prose via Claude
  - `content_generators.write_markdown_file()` - Write to disk with proper encoding
  - `content_generators.validate_markdown_file()` - Validate structure
  - `content_generators.commit_markdown_file()` - Stage and commit
  - `content_generators.push_markdown_file()` - Push to remote
  - `sheep.observability.logging.get_logger()` - Structured logging
  - CrewAI LLM framework (already installed)
  - GitPython (already installed)

  **Pattern Reference**: Feature 157 (`feature_157_markdown_file_creation.py`) provides the exact implementation pattern.

  ## Size Estimate

  **S** (1-2 hours) — Justification:

  - **Established pattern**: 162 preceding features follow identical structure; pattern is well-proven
  - **Reusable infrastructure**: All content generation, validation, git operations provided by `content_generators.py`
  - **Minimal code**: Feature implementation is ~110 lines (mostly boilerplate + docstrings); can copy/adapt from Feature 157
  - **No complexity**: No architectural decisions, no new technologies, no conditional logic
  - **No testing overhead**: Integration test via actual file creation and git operations
  - **No research needed**: Pattern is clear from recent features; question of "what to write about" is already solved by Claude

  ### Implementation Steps (for reference):
  1. Create `src/sheep/features/feature_163_markdown_file_creation.py` (~15 min)
  2. Update `src/sheep/features/__init__.py` with import (~5 min)
  3. Execute feature to create the markdown file (~1 min, includes validation and git operations)
  4. Verify file and git commit (~2 min)
  5. Push to remote (~1 min)

  Total: ~25 minutes of actual implementation work.
