# Markdown content (the full tasks document)
content: |
  ## Implementation Narrative

  Feature 163 is implemented in four phases over six tasks:

  ### Phase 1: Module Creation (Task 1, 5 min)
  Create the feature module file with skeleton structure. Define constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE), set up logger, and establish function signature. This foundation is required for phase 2 implementation.

  ### Phase 2: Orchestration & Logging (Tasks 2-3, 15 min)
  Implement the five-step pipeline by calling helpers in sequence: generate content, write file, validate format, commit with message, push to remote. Add structured logging at INFO level for major steps, DEBUG level for details, and ERROR level on exceptions. Error handling uses fail-fast: catch any exception, log, re-raise.

  ### Phase 3: Module Export & Testing (Tasks 4-5, 10 min)
  Update features/__init__.py to export the new function for public API access. Create comprehensive unit tests with all five helpers mocked, verifying orchestration order, return value structure, and error propagation. Test structure mirrors Feature 157 for consistency.

  ### Phase 4: Integration Verification (Task 6, 5 min)
  Execute feature end-to-end in a test environment. Verify complete workflow: file created at repo root with correct content (H1 + blank + 2-3 sentences), UTF-8 encoding, Unix LF line endings, git commit with correct message, git push to remote, and return dict populated.

  ## Why This Ordering

  1. **Module skeleton first** (task-1): Lowest risk, fastest foundation. Required before orchestration.
  2. **Orchestration logic** (task-2): Core feature implementation. Wires all five helpers. Depends on module structure.
  3. **Add logging** (task-3): Cross-cutting concern. Builds on orchestration. Could be integrated into task-2 but separated for clarity.
  4. **Export function** (task-4): Makes API public. Depends on tasks 2-3 being complete and working.
  5. **Unit tests** (task-5): Validates tasks 1-4 work correctly. Uses mocks to test logic in isolation. Depends on export working.
  6. **Integration test** (task-6): Final verification. Runs end-to-end with real helpers. Depends on all prior tasks complete and passing.

  ## TDD Approach

  Each code task includes RED-GREEN-REFACTOR cycles:
  - **RED:** Write test that fails (asserts required behavior)
  - **GREEN:** Implement minimal code to pass test
  - **REFACTOR:** Clean up, improve naming, add docstrings

  The integration test (task-6) is execution-focused, not test-driven, since it runs the feature as-is against real infrastructure.

  ## Success Criteria

  Feature 163 is complete when:
  - All 6 tasks marked complete
  - File test-i7ts4s.md exists at repo root with correct content structure
  - Git commit with message \"feat(163): Create markdown file test-i7ts4s.md with prose content\" created
  - Git push to remote succeeded
  - All unit tests passing
  - Function importable from sheep.features module
  - Total implementation time: ~35 minutes
