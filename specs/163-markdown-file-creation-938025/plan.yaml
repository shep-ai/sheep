# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 163 integrates seamlessly into the existing markdown creation pipeline. The architecture mirrors Features 157-161 exactly:

  - **Module Location:** `src/sheep/features/feature_163_markdown_file_creation.py`
  - **Public API:** Function `create_feature_163_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  - **Orchestration:** Five sequential helper calls from `sheep.content_generators`
  - **Return Value:** `dict[str, str]` with keys: filepath, content, commit_message, push_result
  - **Error Handling:** Fail-fast with exception propagation
  - **Logging:** Structured logging via `sheep.observability.logging.get_logger()`

  ### Five-Step Orchestration Pipeline

  1. **Content Generation:** Call `content_generators.generate_markdown_content()` → Claude API generates H1 + prose
  2. **File Writing:** Call `content_generators.write_markdown_file()` → Write test-i7ts4s.md with UTF-8 + LF
  3. **Validation:** Call `content_generators.validate_markdown_file()` → Strict format validation
  4. **Git Commit:** Call `content_generators.commit_markdown_file()` → Stage and commit with conventional message
  5. **Git Push:** Call `content_generators.push_markdown_file()` → Push to origin with upstream tracking

  ## Key Design Decisions

  ### Decision 1: Use Existing Infrastructure Helpers

  **Chosen:** Orchestrate five proven helpers from `content_generators.py`

  **Rationale:** Features 157-161 establish this pattern. All helpers are tested and provide exactly what Feature 163 needs. Using them ensures consistency, eliminates duplication, reduces implementation time, and maintains architectural coherence.

  ### Decision 2: Fail-Fast Error Handling

  **Chosen:** Let exceptions propagate without recovery attempts

  **Rationale:** Specification NFR-7 mandates fail-fast behavior. This simplifies error handling, prevents masking root causes, and allows the caller to decide on retry vs. fix.

  ### Decision 3: Module-Per-Feature Pattern

  **Chosen:** Create `feature_163_markdown_file_creation.py` with one public function

  **Rationale:** Every feature (157, 158, 161) uses this pattern: one file per feature, one public function, exported from `features/__init__.py`. This pattern is scalable, maintainable, and consistent.

  ### Decision 4: Structured Logging

  **Chosen:** INFO for orchestration steps, DEBUG for details, ERROR for exceptions

  **Rationale:** Specification NFR-5 requires structured logging. This pattern matches Feature 157 and integrates with platform observability infrastructure.

  ## Implementation Strategy

  ### Phase 1: Module Creation (5 min)
  Create skeleton module with docstring, imports, constants, and function signature. Establishes foundation for phases 2-3.

  ### Phase 2: Orchestration Implementation (15 min)
  Wire five helpers in sequence with error handling and structured logging at each step.

  ### Phase 3: Export & Unit Testing (10 min)
  Update `features/__init__.py` to export function. Create unit tests mirroring Feature 157's structure with mocked helpers.

  ### Phase 4: Integration Testing (5 min)
  Execute end-to-end: verify file creation, content structure, git commit, and push. Confirm all success criteria met.

  ### Why This Ordering
  1. Module structure first (lowest risk, fast foundation)
  2. Core orchestration logic (builds on phase 1)
  3. Exports and unit tests (validates phases 1-2, demonstrates quality)
  4. Integration test (confirms everything works end-to-end)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Helper functions changed | Review content_generators.py before implementation; unit tests will catch signature mismatches |
  | Claude API/GitPython fails | Existing Features 157-161 tests validate infrastructure; fail-fast means errors surface immediately |
  | Commit message format wrong | Hardcode COMMIT_MESSAGE constant exactly as spec requires; unit test verifies |
  | File encoding/line endings wrong | Helper functions enforce UTF-8 + LF; validation catches any errors |
  | Git push fails | Expected behavior per NFR-7 fail-fast design; depends on remote configuration |
  | Function naming/export wrong | Mirror Feature 157 structure exactly; unit test catches import errors |
