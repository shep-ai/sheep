content: |
  ## Task Breakdown & Implementation Flow

  The implementation is structured in two logical phases with 7 tasks total (6 code/validation tasks + 1 manual review task).

  ### Phase 1: File Creation & Validation (5 tasks, 40 minutes)

  **Task 1: Generate Prose Content (10m)**
  - Use the codebase LLM facility to generate 2-3 sentences on a generic topic
  - Topics might include: "Why Coffee Shops Are Great for Work", "The Importance of Regular Breaks", "Learning New Skills", etc.
  - Prose must be grammatically correct and coherent
  - TDD: Define expected structure (2-3 sentences), implement LLM call, capture content

  **Task 2: Create Markdown File (10m)**
  - Use pathlib.Path.write_text() with explicit UTF-8 encoding
  - Format: H1 markdown heading (# Title) + blank line + prose content
  - Ensure LF line ending normalization through newline parameter or preprocessing
  - Verify file can be read back with correct encoding
  - TDD: Test file existence, encoding verification, structure validation

  **Task 3: Validate File Requirements (10m)**
  - Automated checks for UTF-8 encoding (no BOM), LF-only line endings, file size 320-600 bytes
  - Verify markdown H1 format and sentence count
  - All checks use Python stdlib (os.path, file I/O, string operations)
  - TDD: Test each validation criterion (size, encoding, line endings, format)

  **Task 4: Manual Prose Review (5m)**
  - Human review of prose for grammatical correctness, coherence, appropriateness
  - Spec recommends manual review for prose quality (subjective, automated tools error-prone)
  - Compare quality against existing test files from features 069-087
  - No TDD for subjective human review

  ### Phase 2: Git Integration (2 tasks, 10 minutes)

  **Task 5: Stage File in Git (5m)**
  - Execute: `git add test-l20qnc.md`
  - Verify file is staged via git status
  - No TDD for standard git operations

  **Task 6: Create Conventional Commit (5m)**
  - Execute: `git commit -m "feat(088): create markdown file test-l20qnc.md with prose content"`
  - Verify commit exists with correct message
  - Verify commit is on feature branch feat/088-markdown-file-creation-8d62fc

  **Task 7: Push to Feature Branch (5m)**
  - Execute: `git push` (to feat/088-markdown-file-creation-8d62fc)
  - Verify commit is on remote branch
  - No TDD for standard git operations

  ## Task Dependencies & Ordering

  Linear dependency chain ensures sequential execution:
  - Task 1 (prose generation) has no dependencies, starts Phase 1
  - Task 2 (file creation) depends on Task 1 (needs prose content)
  - Task 3 (validation) depends on Task 2 (needs file to exist)
  - Task 4 (manual review) depends on Task 3 (file must pass validation)
  - Task 5 (git add) depends on Task 4 (file approved before staging)
  - Task 6 (commit) depends on Task 5 (file must be staged)
  - Task 7 (push) depends on Task 6 (commit must exist)

  No tasks can run in parallel due to linear dependencies. Total serial effort: ~50 minutes.

  ## TDD Approach for Code Tasks

  Given that this feature creates a file artifact (not modifying existing application code):
  - **RED phase**: Define expected file properties (structure, encoding, line endings, size, content quality)
  - **GREEN phase**: Implement file creation code and validation logic to produce artifact meeting those properties
  - **REFACTOR phase**: Clean up validation logic, improve error messages, extract helper functions, ensure robustness

  Non-code tasks (manual prose review, git operations) use TDD: null and follow standard operational procedures.
