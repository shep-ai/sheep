content: |
  ## Architecture Overview

  This feature creates a single markdown test file at the repository root, following an established pattern demonstrated across 87+ prior features (069-087). The implementation is minimal and straightforward with no dependencies on application source code.

  **Architecture fit**: The implementation is purely a file creation operation at the repository root. It does not modify any source code in /src/sheep/, configuration files, or project metadata. It follows the exact pattern established in the Sheep codebase for test file artifacts.

  **Key components**:
  1. **Content generation**: LLM-based prose generation with manual quality review
  2. **File I/O**: Pathlib-based file creation with explicit encoding/line ending control
  3. **Validation**: Lightweight automated checks for format compliance
  4. **Git workflow**: Standard add/commit/push operations

  ## Key Design Decisions

  ### 1. File I/O with pathlib.Path.write_text()

  **Decision**: Use Python pathlib.Path.write_text(encoding="utf-8") for file creation.

  **Rationale (from research)**:
  - Modern, Pythonic standard library approach (PEP 3151, Python 3.4+)
  - Automatically handles file closing and resource management
  - Explicit encoding parameter ensures UTF-8 compliance
  - Most maintainable and readable for simple file writes
  - Guaranteed availability in Python 3.11+ (project requirement)

  **Alternatives considered**:
  - `open()` with manual context management — More verbose, error-prone for encoding specification
  - Subprocess shell commands — Not idiomatic Python, harder to control encoding/line endings
  - `os.open()` with low-level operations — Verbose and unnecessary complexity

  ### 2. LLM-Based Prose Generation

  **Decision**: Generate prose content using existing codebase LLM facility (multi-LLM support: Anthropic, OpenAI, Google).

  **Rationale (from research)**:
  - Aligns with codebase agentic architecture designed for LLM-driven content generation
  - Enables flexible topic selection (spec permits "completely unrestricted" topics)
  - Manual quality review per spec recommendation (prose is subjective, automated tools produce false positives)
  - Proven approach across 87+ prior features

  **Alternatives considered**:
  - Hardcoded template collection — Inflexible, limited variety, requires maintenance
  - Static random selection — Limited variety, conflicts with agentic architecture

  ### 3. Encoding and Line Ending Normalization

  **Decision**: Explicit UTF-8 with newline="\n" parameter to suppress platform-specific line ending translation.

  **Rationale (from research)**:
  - Success criteria explicitly require UTF-8 without BOM (NFR-1) and Unix LF line endings (NFR-2)
  - `Path.write_text(encoding="utf-8")` ensures UTF-8 without BOM
  - `newline="\n"` parameter prevents Windows automatic CRLF translation
  - Ensures cross-platform consistency per Python documentation

  ### 4. Validation Strategy

  **Decision**: Lightweight automated checks for file format (encoding, line endings, size) + manual prose quality review.

  **Rationale (from research)**:
  - Spec explicitly recommends manual review for prose quality (inherently subjective, automated tools error-prone)
  - Automated checks focus on objective, deterministic file format requirements
  - Simple Python stdlib checks suffice (os.path.getsize, byte prefix checks for BOM, etc.)
  - Aligns with validation approach across 87+ prior features

  ### 5. Standard Git Operations

  **Decision**: Use standard git commands (git add, git commit, git push) via existing codebase git tooling or subprocess.run().

  **Rationale (from research)**:
  - Feature spec requires standard git commands with no force flags or destructive operations (NFR-7)
  - Codebase documentation mentions "dedicated tool modules" for git operations
  - No external dependencies required (standard git CLI universally available)
  - Most secure approach when using subprocess.run() with argument lists (no shell=True)
  - Feature branch pre-exists, so only add/commit/push operations needed

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Validation) before Phase 2 (Git Integration)**:
  - File must exist and meet all technical requirements before staging in git
  - Validation ensures quality gate is passed before any version control operations
  - Prose quality must be confirmed via manual review before committing
  - Logical separation: create and validate artifact, then integrate to version control

  ### Phase 1: File Creation & Validation

  1. Generate prose content (2-3 sentences) on appropriate, generic topic using LLM facility
  2. Create markdown file (test-l20qnc.md) at repository root using pathlib with explicit UTF-8 and LF normalization
  3. Validate file meets all technical requirements (encoding, line endings, size, markdown format)
  4. Manually review prose for grammatical correctness and coherence per spec recommendation

  **Success criteria for Phase 1**: File exists on disk, passes all automated validation checks, prose is manually approved.

  ### Phase 2: Git Integration

  1. Stage file using `git add test-l20qnc.md`
  2. Create commit with conventional message: `feat(088): create markdown file test-l20qnc.md with prose content`
  3. Push commit to remote feature branch `feat/088-markdown-file-creation-8d62fc`

  **Success criteria for Phase 2**: Commit is on remote feature branch, ready for review.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Prose content is low quality or incoherent | Manual review during implementation per spec. LLM generation enables varied, contextually appropriate content. Regenerate if quality unsatisfactory. |
  | File encoding is not UTF-8 or has BOM | Explicit `encoding="utf-8"` parameter in pathlib.write_text() prevents BOM. Validation step checks for BOM byte prefix (EF BB BF). |
  | Line endings are CRLF on Windows instead of LF | `newline="\n"` parameter suppresses platform-specific translation. Validation explicitly checks for no `\r\n` sequences. |
  | File size outside 320-600 byte range | Validation step checks file size in bytes. Adjust prose length if needed (currently 2-3 sentences typically yields 320-600 bytes). |
  | Git operations fail (wrong branch, auth) | Feature branch pre-exists per spec. Standard git CLI used. Verify branch context before pushing. Standard development environment has auth configured. |
  | File already exists or is accidentally overwritten | Check for existing file before creation. Pathlib operations are atomic. Repository is clean per git status at start. |
  | Validation tools/dependencies missing | All validation uses Python stdlib (os.path, file I/O, string operations). No external dependencies required. |
