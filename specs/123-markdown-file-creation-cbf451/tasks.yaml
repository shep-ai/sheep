content: |
  ## Implementation Flow

  This feature is implemented in three sequential tasks across two logical phases:

  **Phase 1: Local File Creation**
  - Task 1 (task-content): Define the markdown content with H1 heading and 2-3 sentences of prose.
    The implementer chooses the prose topic from any subject area. This task is about content
    generation and structure validation.
  - Task 2 (task-file-write): Write the content to disk using pathlib.Path.write_text() with
    explicit UTF-8 encoding and Unix LF line endings. Validate the file meets all requirements:
    correct size (300-500 bytes), proper encoding, proper line endings, and correct content.

  **Phase 2: Git Integration**
  - Task 3 (task-git): Execute the git workflow in sequence: add the file, create a commit with
    the conventional message, and push to remote. Proper error handling ensures clear feedback
    if any step fails.

  ## Design Rationale

  **Sequential phases:** Phase 1 creates and validates the file locally. This is independent
  of git and can be tested without network access. Phase 2 depends on Phase 1 completion
  and integrates the file into version control.

  **TDD approach:** Each task follows RED-GREEN-REFACTOR:
  - RED: Write assertions about the desired outcome
  - GREEN: Implement minimal code to satisfy assertions
  - REFACTOR: Add error handling and improve code quality

  **Task granularity:** Three tasks provide clear separation of concerns:
  - Content generation (logical, independent of I/O)
  - File I/O and validation (system-level, platform-dependent)
  - Git operations (external commands, potential auth/network issues)

  This granularity enables parallel development of different parts and makes debugging easier
  if any step fails.

  ## Effort Breakdown

  - Content definition: 5 minutes (defining 2-3 sentences of prose)
  - File writing and validation: 5 minutes (pathlib usage and basic error handling)
  - Git workflow: 5-10 minutes (subprocess calls with proper error handling and messaging)
  - **Total: 15-20 minutes** (aligns with spec estimate of S = 10-15 minutes; higher estimate
    accounts for thorough error handling and validation)

  The tight estimate reflects the established pattern from features 120-122, which all
  completed similar tasks in this time range.
