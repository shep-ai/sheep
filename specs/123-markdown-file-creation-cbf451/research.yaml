# Structured technology decisions
decisions:
  - title: "File I/O Implementation"
    chosen: "pathlib.Path.write_text() with explicit UTF-8 encoding and newline='\\n'"
    rejected:
      - "Using open() with manual encoding: More verbose, requires manual context manager, more error-prone encoding handling"
      - "Using os.write(): Low-level API, requires manual encoding and binary mode handling, less readable code"
    rationale: >
      pathlib is the modern Python way to handle file I/O (available in Python 3.4+, standard since 3.11).
      Path.write_text() provides clean, readable syntax while handling encoding automatically.
      Explicit encoding='utf-8' ensures UTF-8 encoding without BOM as required by NFR-1.
      The newline='\\n' parameter ensures Unix LF line endings regardless of platform (Windows uses CRLF by default).
      This approach matches spec requirement NFR-6 to use pathlib for file I/O operations.
      This pattern is consistent with existing Sheep project conventions.

  - title: "Git Operations Execution Method"
    chosen: "subprocess.run() with individual git commands (add, commit, push)"
    rejected:
      - "GitPython library: Adds external dependency, increases complexity, overkill for simple sequential git operations"
      - "Direct os.system() or shell execution: Platform-dependent, security risks from command injection, less portable"
    rationale: >
      subprocess is part of Python standard library, no additional dependencies required.
      Git operations (add, commit, push) are straightforward sequential calls with no complex state management.
      subprocess.run() allows proper error handling and output capture without complexity.
      Using git CLI directly avoids Python library dependency, follows Unix principle of composable tools.
      The check=True parameter ensures errors are raised as exceptions, enabling proper error handling.
      Matches established pattern from similar test automation in the Sheep project.

  - title: "Content Generation and Topic Selection"
    chosen: "Implementer selects prose topic from any subject (flexible content)"
    rejected:
      - "Random topic generator: Adds unnecessary complexity, requires topic library or hardcoded topic list"
      - "Fixed topic: Reduces implementer creativity and flexibility, contradicts spec's 'about anything' guidance"
    rationale: >
      Feature spec explicitly resolves this (openQuestions #2): implementer's choice is recommended.
      This approach matches how 120+ existing test files were created by different implementers.
      Flexible topic selection provides appropriate creative freedom for a straightforward task.
      No research or architectural decisions needed for topic generation, keeping implementation simple.
      Reduces implementation complexity and aligns with established test file patterns.

  - title: "Encoding and Line Ending Assurance Strategy"
    chosen: "Explicit parameters in write_text() at creation time with runtime file verification"
    rejected:
      - "Pre-validation framework: Unnecessary for single file creation, adds complexity"
      - "Post-commit git inspection: Requires git inspection tooling, adds latency, overcomplicated"
    rationale: >
      Using write_text() with encoding='utf-8' and newline='\\n' guarantees correct encoding and line endings at write time.
      Python's text mode file operations handle encoding correctly when parameters are explicit.
      Runtime verification (reading file back to check size, content structure) is simple and sufficient.
      No need for elaborate validation framework for single small file.
      Matches requirements NFR-1 (UTF-8 without BOM) and NFR-2 (Unix LF line endings).
      Simple approach reduces potential points of failure.

  - title: "Error Handling Strategy"
    chosen: "Explicit exception handling for file I/O and git operations with descriptive error messages"
    rejected:
      - "No error handling: Risky, silent failures could occur, unclear debugging if something fails"
      - "Generic exception catching: Masks underlying issues, makes debugging harder for users"
    rationale: >
      File operations can fail (permissions, disk space, path issues) and git can fail (authentication, branch state).
      Explicit error handling for FileNotFoundError, PermissionError, and subprocess.CalledProcessError allows clear debugging.
      Descriptive error messages help users understand what went wrong and how to fix it.
      Keep implementation simple while being robust and user-friendly.
      Matches quality standards of recent features (120-122).

