content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-aibs55.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 120+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 102-122, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-aibs55.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`# Title`) as the title on the first line
  - [ ] File contains a blank line after the heading
  - [ ] File contains exactly 2-3 sentences of prose content after the blank line
  - [ ] File is encoded as UTF-8 without Byte Order Mark (BOM)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is between 300-500 bytes (consistent with 120+ existing test files)
  - [ ] File is staged in git using `git add test-aibs55.md`
  - [ ] A git commit exists on the current branch with the exact message: `feat(123): create markdown file test-aibs55.md with prose content`
  - [ ] Commit is on the feature branch `feat/123-markdown-file-creation-cbf451`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-aibs55.md` in the repository root directory (no subdirectories)
  - **FR-2**: The file must contain exactly one markdown H1 heading (`# Title Text`) on the first line as the title
  - **FR-3**: The file must contain a blank line immediately after the H1 heading
  - **FR-4**: The file must contain exactly 2-3 sentences of prose content following the blank line (implementer selects topic)
  - **FR-5**: Stage the created file in git using the command `git add test-aibs55.md`
  - **FR-6**: Create a git commit on the current branch with the exact message: `feat(123): create markdown file test-aibs55.md with prose content`
  - **FR-7**: Push the commit to remote origin on the feature branch `feat/123-markdown-file-creation-cbf451`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without Byte Order Mark (BOM) — no encoding declaration or special byte sequences
  - **NFR-2**: File line endings must use Unix-style LF (`\n`), not Windows CRLF (`\r\n`) or old Mac CR (`\r`)
  - **NFR-3**: File size should be in the typical range of 300-500 bytes, consistent with 120+ existing test files
  - **NFR-4**: Implementation must follow the established pattern from features 102-122 for consistency with the existing test file collection
  - **NFR-5**: Implementation must be straightforward and isolated, affecting only the repository root directory with no side effects on source code, configuration, or tests
  - **NFR-6**: Implementation should use Python pathlib for file I/O operations (e.g., `Path.write_text()`) following established patterns

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementation strictly follow the established 120+ file pattern? | Strict adherence to pattern | 120+ existing files use consistent format, recent features (120-122) validated this approach, consistency ensures compatibility with automated tooling |
  | 2 | Who should select the prose topic? | Implementer's choice | Spec explicitly allows "anything", 120+ files were created with implementer-selected topics, provides appropriate creative flexibility |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-aibs55.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-500 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 102-122; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/123-markdown-file-creation-cbf451` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 120+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with implementer-selected topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 300-500 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 120+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (102-122) demonstrate efficient implementation of identical features in 10-15 minutes

  ---

  _Requirements phase complete — ready for implementation_
