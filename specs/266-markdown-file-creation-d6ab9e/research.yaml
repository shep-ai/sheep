decisions:
  - title: "File I/O Method"
    chosen: "pathlib.Path.write_bytes() with explicit UTF-8 encoding"
    rejected:
      - "pathlib.Path.write_text() — does not guarantee LF line endings on Windows; uses platform newline convention (CRLF on Windows, LF on Unix)"
      - "open() with text mode — requires manual newline parameter handling and does not guarantee consistent behavior across platforms"
      - "os.path module — older, less Pythonic, no advantage over pathlib for this use case"
    rationale: >
      write_bytes() with explicit encoding gives complete control over byte-level representation,
      ensuring UTF-8 encoding without BOM and Unix LF line endings across all platforms (Windows, macOS, Linux).
      This is the proven pattern in 175+ existing implementations in the codebase. The specification explicitly
      requires UTF-8 encoding and LF line endings (NFR-5), and prior bug fix (commit c1399a98) confirms that
      naive write_text() fails on Windows. Using write_bytes(content.encode('utf-8')) with explicit '\n'
      characters in the content string ensures deterministic byte output.

  - title: "Line Ending Handling"
    chosen: "Explicit '\n' characters in content string, written via write_bytes()"
    rejected:
      - "pathlib.Path.write_text() with newline parameter — write_text() does not accept a newline parameter; would require open()"
      - "os.linesep or platform detection — introduces platform-specific branching; violates NFR-2 (cross-platform compatibility)"
      - "Universal newlines mode with post-processing — adds complexity; proven approach exists"
    rationale: >
      The content string is constructed with explicit '\n' line feed characters (e.g., f\"# Title\n\nProse\n\").
      When written via write_bytes(content.encode('utf-8')), these literal '\n' bytes (0x0a) are preserved
      as-is in the file output. This guarantees Unix LF line endings on all platforms without any conversion
      or platform detection. All 260+ test files in the repository follow this pattern and validate correctly.
      Git repository history (commit c1399a98) confirms this was the solution to line ending issues.

  - title: "UTF-8 Encoding Approach"
    chosen: "Explicit encoding='utf-8' in encode() call with no BOM"
    rejected:
      - "Default platform encoding — would vary by OS; not deterministic; violates project conventions"
      - "Use of codecs.open() — no advantage over standard encode(); adds unnecessary import"
      - "UTF-8 with BOM — violates project convention; test files use UTF-8 without BOM"
    rationale: >
      Python's str.encode('utf-8') produces UTF-8 bytes without a Byte Order Mark (BOM) by default.
      This matches the project convention visible in all 260+ existing test files (file type: ASCII text).
      Explicit encoding ensures consistent output across all platforms and Python versions.
      No BOM is required for UTF-8 and adding one would violate project conventions.

  - title: "Prose Content Generation"
    chosen: "Static string literal with meaningful, topic-specific prose"
    rejected:
      - "User input / interactive prompt — violates NFR-4 (no side effects); contradicts established pattern (260+ files)"
      - "LLM API call (OpenAI, Anthropic, etc.) — adds external dependency; violates NFR-1 (standard library only); introduces latency"
      - "Lorem ipsum or placeholder text — violates NFR-6 (prose should be understandable and relevant, not nonsense)"
    rationale: >
      Review of 260+ existing test files shows topic diversity (Art of Meaningful Communication, Joy of Discovery,
      Power of Collaboration, Power of Iteration, etc.) with all content written as static strings at development time.
      No feature implementation uses LLM generation; the specification explicitly states \"about anything\" (user has freedom
      to choose topic). Static strings meet requirements (2-3 complete sentences, coherent, grammatically correct).
      Feature 265 implementation (test_feature_265_execution.py) confirms this pattern: MOCK_MARKDOWN_CONTENT as a static string.

  - title: "Git Operations Execution"
    chosen: "subprocess.run() with check=True for strict error handling"
    rejected:
      - "GitPython or PyGit2 library — external dependency; violates NFR-1 (standard library only)"
      - "Subprocess with check=False and manual error inspection — less robust; ignores failures silently"
      - "Subshell execution (e.g., os.system) — deprecated; poor error handling; allows shell injection"
    rationale: >
      subprocess.run() is part of Python standard library (since 3.5) and provides reliable git integration.
      check=True ensures CalledProcessError is raised immediately if any git command fails, preventing silent failures.
      Git operations (add, commit, push) are simple enough that subprocess is more appropriate than a library.
      All 175+ existing implementations use subprocess for git operations, confirming the established pattern.

  - title: "Validation Approach"
    chosen: "File existence, size, structure checks with assertions and read_text() for content validation"
    rejected:
      - "No validation — risk of undetected errors; inconsistent with established practices"
      - "External validation tools (e.g., shell scripts with grep/sed) — adds complexity; reduces portability"
      - "Try/except without assertion — unclear intent; harder to debug"
    rationale: >
      Validate in this order: (1) file exists, (2) file size in reasonable range (300-800 bytes for structure),
      (3) starts with '# ' (H1 heading), (4) contains '\\n\\n' (blank line), (5) has prose content after blank line.
      Assertions with clear messages provide fail-fast behavior and explicit validation intent. Size check detects
      truncation or encoding errors early. Content checks verify structure compliance. Pattern validated in 175+ implementations.

