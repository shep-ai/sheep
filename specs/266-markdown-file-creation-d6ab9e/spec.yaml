  ## Problem Statement

  The Sheep automated implementation platform has established a pattern of creating simple test markdown files
  for validating the core implementation workflow. This feature creates a single markdown file (`test-0mmy12.md`)
  at the repository root with a markdown heading as title and 2-3 sentences of prose content.

  This is a straightforward, well-precedented file creation task. The repository contains 260+ test files
  following this identical pattern (test-*.md files), providing clear reference implementations and
  demonstrating the routine nature of this operation.

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a Python package with the following key structure:

  ```
  /
  ├── src/sheep/                 # Main package (agents, flows, config, tools)
  ├── specs/                     # Feature specifications (numbered directories)
  ├── test-*.md                  # 260+ test markdown files (repository root)
  ├── .github/                   # GitHub workflows and configuration
  ├── Dockerfile                 # Container definition
  ├── README.md                  # Main project documentation
  └── [other documentation]      # ABOUT_ME.md, DESIGN_PATTERN.md, etc.
  ```

  Test markdown files are stored at the repository root as untracked content artifacts.
  Each file follows a simple, consistent structure: H1 heading + 2-3 sentences of prose.

  ### Architecture Patterns

  The Sheep project implements an agentic architecture using CrewAI:
  - **Flows**: Orchestrate execution steps and control flow (code_implementation.py)
  - **Agents**: Autonomous AI units with specialized roles (research, implementation, review)
  - **Tools**: Integrate with external systems (git_tools.py, file_tools.py)
  - **Configuration**: Centralized LLM and settings management (config/)
  - **Observability**: Langfuse integration for execution tracing

  The codebase follows Python conventions with:
  - Standard library usage (pathlib for file I/O)
  - Pydantic for configuration and validation
  - Git integration via subprocess or GitPython
  - Structured logging and tracing

  ### Relevant Technologies

  **File I/O**: The project uses Python's standard `pathlib` library for cross-platform file operations.
  The established pattern uses simple file write operations with UTF-8 encoding:
  ```python
  from pathlib import Path
  Path(filename).write_text(content, encoding='utf-8')
  ```

  **Git Integration**: Features are committed and pushed to remote branches. Commits follow
  conventional commit format: `feat(number): Description`. Git operations are standard: add, commit, push.

  **Content Format**: Markdown files use UTF-8 encoding with LF line endings. All test files
  in the repository follow this convention and end with a single newline.

