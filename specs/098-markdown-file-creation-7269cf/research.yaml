# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-18
  - **Decision Status:** All 6 technology decisions documented with clear rationale and rejected alternatives

  ## Technology Decisions

  ### 1. File I/O Method

  **Chosen:** Use Python pathlib.Path.write_text() with UTF-8 encoding

  **Rejected:**
  - Use open()/write() directly — less Pythonic, requires manual encoding specification, lacks cross-platform path handling
  - Use os.open() — lower-level interface, more error-prone, breaks cross-platform compatibility

  **Rationale:** pathlib.Path is idiomatic Python 3.11+ standard library, provides automatic UTF-8
  encoding (default), handles cross-platform paths transparently, and matches existing codebase
  patterns (see src/sheep/tools/file_tools.py). It's the recommended modern approach for file I/O.

  ```python
  from pathlib import Path
  Path("test-ncto5f.md").write_text(markdown_content)
  ```

  ### 2. Git Operations Implementation

  **Chosen:** Use subprocess.run() with git CLI commands

  **Rejected:**
  - Use GitPython library — adds unnecessary external dependency, codebase already has subprocess pattern
  - Use os.system() — insecure, platform-specific, deprecated

  **Rationale:** Codebase git_tools.py already establishes subprocess-based git operations with
  _run_git() helper. This provides reliable error handling, output capture, and logging integration.
  Avoids adding new dependencies when subprocess is proven in production code.

  Workflow operations needed:
  ```bash
  git add test-ncto5f.md
  git commit -m "feat(098): create markdown file test-ncto5f.md with prose content"
  git push -u origin HEAD
  ```

  ### 3. Prose Content Generation

  **Chosen:** Use predefined selection of appropriate prose topics with 2-3 sentences each

  **Rejected:**
  - Generate random prose using LLM — introduces latency, requires API calls, unnecessary complexity
  - Use placeholder text — fails to meet quality requirements for grammatically correct prose

  **Rationale:** Features 069-097 demonstrated successful implementation using curated content.
  This ensures consistent quality, deterministic output, and fast execution. Established pattern
  provides proven prose that passes all validation checks without requiring external services.

  Example topics that work well:
  - "The Strength of Community"
  - "The Gift of Change"
  - "The Power of Persistence"
  - "The Art of Problem Solving"

  ### 4. File Encoding and Line Endings

  **Chosen:** UTF-8 without BOM, Unix LF line endings

  **Rejected:**
  - UTF-16 with BOM — unnecessary for markdown, causes compatibility issues
  - ANSI with Windows CRLF — platform-specific, breaks cross-platform compatibility

  **Rationale:** Python's Path.write_text() defaults to UTF-8 without BOM. Unix LF line endings
  are enforced by default in Python text mode on all platforms (including Windows in Python 3+).
  This matches all 97+ existing test files in the repository and is the universal standard.

  Verification commands:
  ```bash
  file test-ncto5f.md  # Should show UTF-8
  wc -c test-ncto5f.md  # Should show 320-600 bytes
  od -c test-ncto5f.md | grep -v "\\n"  # Verify no CRLF
  ```

  ### 5. File Validation Approach

  **Chosen:** Implement straightforward file creation without programmatic validation

  **Rejected:**
  - Add validation checks in code — adds complexity, pattern proven across 97+ files
  - Use markdown parser library — unnecessary dependency, format is simple enough

  **Rationale:** Single markdown file creation is straightforward: write H1 heading + blank line + 2-3
  sentences. Success criteria are measurable and testable via standard Unix tools (ls, file, wc).
  Features 069-097 followed this pattern successfully without code-level validation.

  Success is verified via spec criteria (testable with standard tools).

  ### 6. Git Commit Workflow

  **Chosen:** Use standard workflow: add → commit → push

  **Rejected:**
  - Use `git commit -a` to auto-stage — loses explicit control, risk of staging unwanted changes
  - Merge to main immediately — violates project workflow

  **Rationale:** Explicit `git add` before `git commit` provides safety and clarity. Conventional
  Commits format is required by project standards and enables automated tooling. Push to feature
  branch (not main) matches workflow from all 97+ prior features.

  Workflow:
  ```bash
  git add test-ncto5f.md
  git commit -m "feat(098): create markdown file test-ncto5f.md with prose content"
  git push -u origin HEAD  # Push to feature branch
  ```

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | **Use** | Standard library, cross-platform, automatic UTF-8, proven in codebase |
  | subprocess (stdlib) | Git CLI execution | **Use** | Standard library, matches codebase git_tools.py pattern, reliable |
  | GitPython | Git operations library | **Reject** | Unnecessary external dependency, subprocess already established |
  | Markdown parser library | Markdown validation | **Reject** | Unnecessary for simple single-heading structure, validation via tools |
  | LLM API (OpenAI/Anthropic) | Content generation | **Reject** | Introduces latency, unnecessary complexity, curated content sufficient |

  ## Security Considerations

  **1. File Path Validation**
  - Risk: Directory traversal via crafted filenames
  - Mitigation: Feature spec defines exact filename (`test-ncto5f.md`). Implementation uses hardcoded
    filename, not user input. No path construction or concatenation needed.
  - Implementation: `Path("test-ncto5f.md").write_text(content)` is safe (no path variables)

  **2. File Content Injection**
  - Risk: Malicious content in markdown file (though limited risk for prose text)
  - Mitigation: Content is predefined, not derived from untrusted input
  - Implementation: All prose is curated and grammatically verified before implementation

  **3. Git Command Injection**
  - Risk: Unsafe shell execution of git commands
  - Mitigation: Codebase uses subprocess.run() with list arguments (not shell=True), matching
    git_tools.py pattern. Message is hardcoded per conventional format.
  - Implementation: Uses subprocess with explicit argument list, not string interpolation

  **4. File System Permissions**
  - Risk: Insufficient write permissions to repository root
  - Mitigation: Standard development environment has write access to repository root
  - Assumption: Valid per project dependency on "write access to repository root directory"

  ## Performance Implications

  **1. File Creation**
  - Single file write operation: ~320-600 bytes
  - Expected time: <10ms (I/O bound, negligible)
  - No optimization needed

  **2. Git Operations**
  - `git add`: Single file staging, negligible overhead
  - `git commit`: Creates single commit object, negligible overhead
  - `git push`: Network operation, typically 1-3 seconds (depends on network/server)
  - Expected total git time: 2-5 seconds

  **3. Overall Performance**
  - Total feature implementation time: 10-15 minutes (matching estimate)
  - No performance bottlenecks identified
  - No caching, optimization, or parallelization needed

