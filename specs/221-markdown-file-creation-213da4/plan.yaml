content: |
  ## Architecture Overview

  This feature is a minimal, standalone implementation that creates a single markdown file
  and integrates it with git version control. The implementation requires no complex architecture
  or platform integration — it is a self-contained Python script that executes a deterministic
  sequence of file and git operations.

  **Key characteristics:**
  - Single executable script (create_markdown_file_221.py)
  - No dependencies on Sheep platform components (agents, crews, tasks)
  - Standard library only (pathlib for file I/O, subprocess for git)
  - Sequential, non-parallel workflow (file creation → git add → commit → push)
  - Minimal validation (subprocess return codes + exception handling)
  - Pattern matches 200+ precedent implementations (features 160-220)

  **File Layout:**
  ```
  repository-root/
  ├── test-ye16lc.md (created by this feature)
  └── create_markdown_file_221.py (implementation script)
  ```

  The created file follows the established naming convention (test-*.md) and content format
  (H1 heading + prose) used across all 200+ existing test files in the repository.

  ## Key Design Decisions

  ### 1. Implementation Language: Python 3.11+ Standard Library

  **Decision:** Use pathlib (file I/O) and subprocess (git operations) from Python standard library.

  **Rationale:**
  - NFR-3 explicitly requires standard library only (no external dependencies)
  - pathlib.Path provides modern, Pythonic file operations with control over line endings
  - subprocess.run() offers robust error code handling for git commands
  - Matches established pattern from features 216-220 and preceding implementations
  - Simplifies execution environment (no pip install, no dependency resolution)
  - Zero additional complexity compared to shell commands, with better error handling

  **Alternatives rejected:**
  - GitPython library: External dependency violates NFR-3
  - Direct shell commands: Harder error handling, less maintainable, inconsistent with codebase
  - Other languages: Unnecessary runtime dependency, inconsistent with platform

  ### 2. Prose Content Strategy: Hard-Coded, Fixed Content

  **Decision:** Use hard-coded, deterministic prose content (2-3 sentences on a single topic).

  **Rationale:**
  - User query explicitly states \"about anything\" (unconstrained topic)
  - Hard-coded content is fastest and simplest
  - Supports 15-minute execution target (NFR-1)
  - 200+ existing test files use fixed content — establishes precedent
  - No dynamic generation, templating, or file I/O needed
  - Content is simple, generic prose that requires no research or decision-making

  **Alternatives rejected:**
  - Random/dynamic content: Unnecessary complexity, non-determinism adds debugging difficulty
  - Template system: Premature abstraction, adds I/O overhead
  - External content sourcing: Adds dependencies, network latency, complexity

  ### 3. Git Workflow: Sequential subprocess.run() Calls

  **Decision:** Execute git add → git commit → git push as separate subprocess.run() calls.

  **Rationale:**
  - Sequential (non-piped) execution allows independent error handling for each step
  - subprocess.run() provides explicit return code checking (0 = success, non-zero = failure)
  - Avoids shell=True (prevents shell injection vulnerabilities)
  - Matches pattern established in features 216-220
  - Each step can fail independently with clear error messages

  **Alternatives rejected:**
  - GitPython: External dependency violates standard library constraint
  - Shell piping (&&): Less robust, harder to identify which step failed
  - Manual Git protocol: Unnecessary reimplementation of existing tool

  ### 4. Line Ending Handling: Explicit newline Parameter

  **Decision:** Use pathlib.Path.write_text(newline='\\n') to ensure Unix LF line endings.

  **Rationale:**
  - NFR-4 mandates Unix line endings for consistency with repository conventions
  - newline parameter ensures consistent output across Windows/macOS/Linux
  - All 200+ existing test files use LF; this feature must match
  - Prevents platform-specific line ending issues (CRLF on Windows)
  - Explicit parameter is clearer than relying on OS defaults

  **Alternatives rejected:**
  - OS default line endings: May produce CRLF on Windows, violates NFR-4
  - Post-creation conversion: Extra processing step, more error-prone
  - Binary mode: Less readable, harder to work with

  ### 5. Validation Strategy: Minimal, Critical-Only Validation

  **Decision:** Use subprocess return codes and Python exception handling; skip extensive validation.

  **Rationale:**
  - Subprocess return codes (0 = success, non-zero = failure) catch git operation failures
  - Python exceptions (FileNotFoundError, PermissionError, CalledProcessError) catch critical errors
  - Minimal validation fits 15-minute execution window (NFR-1)
  - Precedent from features 216-220 shows this approach is reliable
  - Complex validation (file size checks, content hashes, git status verification) adds unnecessary overhead

  **Alternatives rejected:**
  - Extensive validation: Over-engineering for simple, deterministic task
  - No validation: Silent failures make debugging impossible
  - External validation tools: Adds dependency complexity

  ### 6. Error Handling: Specific Exceptions + User-Friendly Messages

  **Decision:** Catch specific exception types, print descriptive messages, exit(1) on failure.

  **Rationale:**
  - Specific exception handling identifies failure source (file I/O vs git vs other)
  - Clear error messages aid manual troubleshooting
  - Non-zero exit code signals failure to parent process/CI
  - Matches error handling patterns from features 216-220
  - Appropriate level of detail for simple deterministic operation

  **Alternatives rejected:**
  - No error handling: Stack traces not user-friendly, doesn't diagnose root cause
  - Verbose logging: Unnecessary complexity, clutters output
  - Retry logic: Doesn't fix underlying issues, adds complexity

  ## Implementation Strategy

  **Phase ordering rationale:**

  1. **Phase 1 (Script Foundation):** Creates the script skeleton with imports and configuration.
     This must come first as all subsequent phases depend on the basic script structure.

  2. **Phase 2 (File Creation & Git Integration):** Implements the core feature (file creation) and
     git workflow (add, commit, push). These operations are sequential and tightly coupled.
     File creation must complete before git operations can succeed.

  3. **Phase 3 (Error Handling & Robustness):** Adds error handling around all file I/O and git
     operations. This phase wraps the core implementation with defensive programming patterns.

  4. **Phase 4 (Validation & Testing):** Verifies all success criteria through end-to-end testing.
     This final phase ensures the implementation meets all requirements before integration.

  **Why this order:**
  - Foundation first (Phase 1) ensures basic structure is in place
  - Core feature implementation (Phase 2) follows immediately after
  - Error handling (Phase 3) wraps the core operations once they're working
  - Validation (Phase 4) confirms everything works together
  - This follows the standard TDD pattern: make it work → make it robust → verify

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists (test-ye16lc.md) | Low | High (overwrite/conflict) | Check if file exists before writing; fail with clear error message |
  | Git configuration missing (user.name/email) | Low | High (commit fails) | Git operations fail with clear error; user must configure git before running |
  | Unix line ending issue on Windows | Medium | Medium (consistency) | Use explicit newline='\\n' parameter in pathlib; all existing test files confirm this works |
  | Git push fails (network, permissions) | Low | Medium (feature incomplete) | Subprocess return code checking catches push failure; error message guides troubleshooting |
  | File permissions prevent write | Very Low | High (silent failure) | Python exception handling catches PermissionError |
  | Branch doesn't exist or wrong branch checked out | Low | High (push to wrong location) | Verify feature branch exists and is checked out before script execution (prerequisite) |
  | Conventional commit message format error | Very Low | Low (commit succeeds but non-standard) | Hard-code exact message format; no user input in commit message |

  All risks are either very unlikely (proper git configuration assumed) or mitigated by
  exception handling and explicit error messages. The straightforward nature of the feature
  (single file, no complex logic) minimizes failure modes.
