content: |
  ## Summary

  This 3-task breakdown implements the feature in a single coherent phase (File Creation & Git Integration).
  Tasks are ordered by dependency: file must exist before staging, staging must complete before committing
  and pushing.

  **Task 1** creates the markdown file with the spec-compliant structure: H1 header + blank line + 3-sentence
  prose + trailing blank line, following the established pattern from features 136-138.

  **Task 2** stages the file in git using `git add`, preparing it for commit.

  **Task 3** commits the staged file with the conventional commit message format and pushes to the remote
  repository, completing the git workflow.

  Total estimated effort: **15 minutes** (aligned with S-sized feature estimate of 5-10 minutes; includes
  verification and quality checks).

  ## TDD Approach

  For this utility feature (file creation + git operations), TDD cycles use verification steps rather than
  traditional unit tests:

  - **RED:** Verify preconditions (file doesn't exist, file not staged, etc.)
  - **GREEN:** Execute the operational task (create file, git add, git commit, git push)
  - **REFACTOR:** Verify postconditions and quality (correct syntax, proper format, remote reflects changes)

  This approach ensures deterministic success criteria are met at each step.
