content: |
  ## Problem Statement

  Create a single markdown file named `test-kv0y7e.md` in the repository root directory. The file must contain:

  1. A markdown header (title) at the beginning
  2. 2-3 sentences of prose content about any topic

  This feature is part of a validated pattern used across 139+ features in the Sheep platform for validating automated file creation capabilities. The file will be created, staged, committed with a conventional commit message, and pushed to the remote repository.

  ## Success Criteria

  - [ ] Markdown file `test-kv0y7e.md` exists in the repository root directory
  - [ ] File contains a valid markdown header (title) as the first element
  - [ ] File contains exactly the required number of sentences of prose content (per product decision)
  - [ ] File contains valid markdown syntax with no formatting errors
  - [ ] Prose content is coherent and follows English language conventions
  - [ ] File is staged in git with `git add`
  - [ ] Changes are committed with a conventional commit message (feat(139): Create markdown file...)
  - [ ] Commit is pushed to the remote repository on the feature branch
  - [ ] All git operations complete successfully without errors

  ## Functional Requirements

  - **FR-1**: File named `test-kv0y7e.md` must be created in the repository root directory
  - **FR-2**: File must contain a markdown header (title) using the appropriate heading level (per product decision)
  - **FR-3**: File must contain 2-3 sentences of prose content after the header (exact count per product decision)
  - **FR-4**: Prose content must be about any topic (no thematic constraints)
  - **FR-5**: All markdown syntax must be valid and follow markdown conventions
  - **FR-6**: File changes must be staged in git using `git add test-kv0y7e.md`
  - **FR-7**: Changes must be committed with message format: `feat(139): Create markdown file test-kv0y7e.md`
  - **FR-8**: Commit must be pushed to the remote repository on the feature branch

  ## Non-Functional Requirements

  - **NFR-1**: Feature implementation must follow established patterns from features 124-138 (similar markdown file creation)
  - **NFR-2**: Commit message must follow conventional commit format (feat, commit scope, descriptive message)
  - **NFR-3**: File creation and git operations must complete without errors
  - **NFR-4**: Implementation must be straightforward with no complex logic or dependencies
  - **NFR-5**: File should be ready for immediate merge after implementation and testing phases

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Exactly 2 or 3 sentences? | Exactly 3 sentences | Tests upper bound of requirement, provides better content validation |
  | 2 | Header level (H1 or H2)? | H1 (#) | Follows markdown convention for document titles |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New markdown file `test-kv0y7e.md` will be created here, following the established pattern of 139+ similar files |
  | Git workflow | Medium | Requires staging, committing with conventional commit message, and pushing to remote |
  | Specs directory | Low | Feature spec in `specs/139-markdown-content-file-8d7c3e/spec.yaml` will be updated during analysis and implementation phases |

  ## Dependencies

  - **No external dependencies**: This feature requires no libraries, frameworks, or external code
  - **No code dependencies**: Does not depend on any existing source code or platform features
  - **Git only**: Requires only basic git commands for staging, committing, and pushing
  - **Pattern dependency**: Follows established pattern from features 124-138 for markdown file creation

  ## Size Estimate

  **S** — This is a trivial feature requiring only a few minutes of work. Specific reasoning:

  - Single file creation with no code generation or transformation needed
  - Content is freeform prose (any topic, 2-3 sentences)
  - No validation, testing, or infrastructure required
  - Follows an established, well-known pattern from 15+ prior similar features
  - Only tasks: create file with markdown header + 2-3 sentences + git operations
  - Effort: estimated 5-10 minutes total (file creation + git operations)
