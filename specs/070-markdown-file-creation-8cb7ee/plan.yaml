# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-17
  - **Status:** Ready for implementation

  ## Architecture Overview

  This feature creates a single markdown test file following the well-established pattern from
  49+ existing test files in the repository (test-*.md at root). The implementation is minimal
  and isolated, affecting only the repository root directory with no dependencies on source
  code, tests, or configuration.

  **Key characteristics:**
  - Single file creation in repository root (test-esahpp.md)
  - Fixed content format: H1 markdown heading + blank line + 2-3 sentences of prose
  - Flexible topic selection (any topic chosen by implementer)
  - Deterministic output via hardcoded prose content
  - Standard git workflow: add → commit → push with conventional commit message
  - Zero dependencies on application source code (/src/sheep/) or configuration
  - Python standard library only (pathlib, subprocess)

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** pathlib.Path (Python 3.11+ standard library)

  **Why:**
  - NFR-5 mandates use of pathlib.Path for file I/O operations
  - Modern, idiomatic Python 3 filesystem API
  - Path.write_text() encapsulates file creation, writing, closing, and encoding in one call
  - Automatically handles UTF-8 encoding (without BOM) by default
  - Consistent with pattern from 49+ existing test files

  **Rationale from research:**
  - os.open()/os.write() is lower-level and more verbose, requiring manual file descriptor management
  - open() built-in requires manual context manager; pathlib is more explicit and modern
  - Project standards and Python 3.11+ best practices favor pathlib

  ### 2. Git Integration: subprocess.run()

  **Chosen:** subprocess.run() with git CLI commands

  **Why:**
  - Part of Python standard library (no external dependencies per NFR-9)
  - Clear, explicit command semantics familiar to developers
  - Proper error handling via CalledProcessError exception
  - No abstraction overhead for straightforward linear operations (add → commit → push)
  - Consistent with implementation approach in features 067-069

  **Rationale from research:**
  - GitPython library is unnecessary for three simple sequential operations
  - Direct shell invocation has portability and security concerns
  - subprocess.run() is sufficient and more transparent than higher-level abstractions

  ### 3. Prose Content: Hardcoded String

  **Chosen:** Hardcoded prose content embedded in source code

  **Why:**
  - Content format is fixed and small (~400-600 bytes)
  - Hardcoding guarantees format compliance without needing runtime validation
  - Implementer chooses topic at authoring time (not runtime)
  - Follows the established pattern from all 49+ existing test files
  - Eliminates need for templates, external files, or dynamic generation

  **Rationale from research:**
  - Template-based generation adds unnecessary complexity
  - External file loading adds deployment complexity and I/O overhead
  - Fixed format with no dynamic parts means hardcoding is appropriate
  - Product decision resolves topic selection as "fully flexible — any topic"

  ### 4. Sentence Count & Quality Validation

  **Chosen:** No validation logic; hardcoded content guarantees compliance

  **Why:**
  - By authoring prose with exactly 2-3 sentences upfront, compliance is guaranteed at creation time
  - Runtime validation adds unnecessary code complexity
  - Product decision resolves quality validation as "expected standard — implementer responsibility"
  - This approach aligns with features 067-069 and all 49+ existing test files

  **Rationale from research:**
  - Regex-based sentence counting is non-trivial and error-prone
  - External validation tools would violate NFR-9 (no new dependencies)
  - Hardcoding eliminates need for any validation logic

  ### 5. File Encoding & Line Endings

  **Chosen:** pathlib.Path.write_text() with UTF-8 encoding and explicit LF line endings

  **Why:**
  - NFR-1 requires UTF-8 without BOM; NFR-2 requires Unix-style LF line endings
  - pathlib.Path.write_text() uses UTF-8 by default (without BOM)
  - Prose string contains explicit '\n' characters for consistent LF across all platforms
  - Ensures consistent output regardless of OS (no platform-native line ending conversion)

  **Rationale from research:**
  - Platform-native line endings would violate NFR-2 on Windows (CRLF vs LF)
  - This approach ensures LF output on all platforms

  ### 6. Topic Selection: Fully Flexible

  **Chosen:** Any topic chosen by implementer

  **Why:**
  - User query explicitly states "about anything"
  - Feature spec (NFR-8) explicitly permits any topic
  - Product decision from requirements phase confirms "fully flexible — any topic"
  - 49+ existing test files demonstrate topic diversity without consistency concerns
  - No validation overhead or implementer autonomy constraints

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1: File Creation & Content Composition** comes first because:
  - It produces the artifact (test-esahpp.md) that subsequent phases depend on
  - Simple and well-defined; no external dependencies
  - Must complete before git operations can stage the file

  **Phase 2: Git Integration & Push** comes second because:
  - Depends on the file existing and being properly formatted
  - Git operations (add, commit, push) are straightforward sequential steps
  - No parallel work possible; each step depends on the previous one

  ### Implementation Approach

  1. **Create markdown file** using pathlib.Path.write_text()
     - Hardcode prose content (topic of choice)
     - Ensure proper format: H1 heading + blank line + 2-3 sentences
     - UTF-8 encoding, LF line endings

  2. **Stage file in git** using subprocess.run(['git', 'add', 'test-esahpp.md'])
     - Verify git add succeeds (CalledProcessError on failure)

  3. **Commit with conventional message** using subprocess.run(['git', 'commit', ...])
     - Message format: `feat(070): create markdown file test-esahpp.md with prose content`
     - Ensure commit is created on feature branch feat/070-markdown-file-creation-8cb7ee

  4. **Push to remote origin** using subprocess.run(['git', 'push', 'origin', 'HEAD'])
     - Push current branch HEAD to remote origin
     - Verify push succeeds

  ### File Organization

  **File to Create:**
  - `test-esahpp.md` - Markdown file at repository root with title and prose content

  **Files to Modify:**
  - None. This feature is purely additive; no existing files are modified.

  **Files to NOT Modify:**
  - Source code in /src/sheep/
  - Test suite in tests/
  - Configuration files (pyproject.toml, etc.)
  - Existing test files (test-*.md)

  ## Risk Mitigation

  | Risk | Mitigation | Impact |
  | ---- | ---------- | ------ |
  | **File already exists** | Feature branch is fresh (created for this task); no conflict | Negligible |
  | **Git config missing (user.name, user.email)** | Assume standard development environment setup; git already configured for other features | Low |
  | **Git push fails due to network or permissions** | Use standard error handling; document failure for investigation | Low |
  | **Prose quality concerns** | Implementer chooses topic; manual review of 2-3 sentences is simple | Low |
  | **File encoding issues on Windows** | Hardcode '\n' in prose string; pathlib handles UTF-8 correctly on all platforms | Low |
  | **Accidental modifications to source code** | Feature scope is clearly defined (repository root only); no source code operations | Negligible |

  ## Success Criteria (from Feature Spec)

  - [x] File `test-esahpp.md` exists in the repository root directory
  - [x] File contains exactly one markdown H1 heading (`#`) as the title
  - [x] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [x] File is encoded as UTF-8 without BOM
  - [x] File uses Unix-style LF line endings (`\n`)
  - [x] File size is between 400-600 bytes (typical range for this pattern)
  - [x] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [x] File is staged in git (`git add test-esahpp.md`)
  - [x] Git commit exists on the current branch with message: `feat(070): create markdown file test-esahpp.md with prose content`
  - [x] Commit is on the feature branch `feat/070-markdown-file-creation-8cb7ee`
  - [x] Changes have been pushed to remote origin

  ## Effort Estimate

  **Total: ~30-45 minutes**

  - Phase 1 (File Creation): ~15 minutes
  - Phase 2 (Git Integration): ~15-30 minutes (includes testing and validation)

  This aligns with the "S" (Small) size estimate from the feature spec and the pattern established
  by features 067-069.

