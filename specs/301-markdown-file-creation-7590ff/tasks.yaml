# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature comprises 4 ordered tasks across 2 phases:

  **Phase 1: File Creation (1 task, 5-7 minutes)**
  Create test-p4t702.md with proper markdown structure (H1 title, blank line, 2-3 topically coherent sentences)
  using pathlib.Path.write_text() with explicit UTF-8 encoding and Unix LF line endings. TDD cycle validates
  structure, content coherence, encoding, and line endings.

  **Phase 2: Git Integration (3 tasks, 7-11 minutes)**
  Stage the file, commit with conventional message (feat(301):...), and push to remote. Each git operation uses
  subprocess.run(check=True) for proper error handling and exit code verification.

  **Why This Order:**
  Phase 1 must complete first because git operations in Phase 2 depend on the file existing. Phase 2 tasks are
  sequential: staging must happen before commit, commit must happen before push. Each task includes specific
  acceptance criteria and TDD cycles (RED test that fails initially, GREEN implementation, REFACTOR as needed).
