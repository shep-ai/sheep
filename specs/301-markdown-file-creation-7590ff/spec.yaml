content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-p4t702.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 300+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 006-300, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository uses a modular, organized structure focused on agent-based automation:

  - **Root directory**: Contains 300+ test markdown files (test-*.md) created as test artifacts for the implementation system. These serve as validation evidence and demonstrate the file-creation pattern this feature follows.
  - **/specs/**: Contains feature specifications organized by number (006-markdown-file-creation through 301-markdown-file-creation-7590ff). Each spec directory includes feature.yaml, plan.yaml, research.yaml, spec.yaml, and tasks.yaml files documenting the feature lifecycle.
  - **/src/sheep/**: Application source code (not modified by this feature):
    - `/agents/`: Agent definitions for research, implementation, and review
    - `/config/`: Configuration and LLM factory
    - `/flows/`: Flow definitions and orchestration logic
    - `/tools/`: Git and file operation tools
  - **/.github/workflows/**: CI/CD pipeline definitions (not modified)
  - **/docs/**: Documentation (not modified)

  ### Architecture Patterns

  1. **File Creation Pattern**: Repository root serves as the location for test markdown files. Simple file creation via Python pathlib.Path.write_text().
  2. **Git Workflow**: Features use conventional commits (`feat(number): description`), branching for isolation, and push to remote.
  3. **Separation of Concerns**: Source code in `/src/sheep/` is isolated from test artifacts in root directory. Test files do not import or depend on application code.
  4. **Established Precedent**: 300+ identical test files demonstrate the exact pattern required—no design decisions needed.

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment with standard library pathlib module available
  - **Markdown (CommonMark specification)**: File format for test artifact
  - **Git**: Version control system with conventional commit messages
  - **File System**: Basic file I/O operations (write, stage, commit, push)

  ## Functional Requirements

  - **FR-1: File Creation** — Create a new file named `test-p4t702.md` in the repository root directory using Python pathlib.Path.write_text() or equivalent file I/O operation
  - **FR-2: Markdown Title** — File must contain exactly one markdown H1 heading (`# <title>`) on the first line as the document title
  - **FR-3: Prose Content** — File must contain exactly 2-3 grammatically correct sentences of prose content following a blank line after the H1 heading
  - **FR-4: Content Coherence** — Prose content should be topically coherent with the H1 title
  - **FR-5: Document Structure** — File structure must follow the pattern: `# Heading\n\n<2-3 sentences>` with no additional markup or content
  - **FR-6: Git Staging** — Stage the created file in git using `git add test-p4t702.md`
  - **FR-7: Git Commit** — Create a git commit with the exact message: `feat(301): create markdown file test-p4t702.md with prose content`
  - **FR-8: Feature Branch** — Commit must be created on the feature branch `feat/301-markdown-file-creation-7590ff`
  - **FR-9: Git Push** — Push the commit to the remote origin repository on the feature branch

  ## Non-Functional Requirements

  - **NFR-1: File Encoding** — File must be encoded as UTF-8 without Byte Order Mark (BOM)
  - **NFR-2: Line Endings** — File must use Unix-style LF (`\n`) line endings, not Windows CRLF (`\r\n`)
  - **NFR-3: File Size** — File size should naturally fall within the 400-600 byte range as a natural outcome of proper structure and 2-3 sentences of typical prose length
  - **NFR-4: Markdown Compliance** — Markdown syntax must comply with CommonMark specification for H1 headings and basic prose structure
  - **NFR-5: Content Quality** — Prose must be grammatically correct, properly punctuated, and coherent
  - **NFR-6: Git Workflow Consistency** — Implementation must follow established git workflow patterns from 300+ precedent features
  - **NFR-7: Implementation Efficiency** — Feature should be completed efficiently following the established "identical implementation" pattern

  ## Success Criteria

  - [ ] File `test-p4t702.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] Prose content is grammatically correct and properly punctuated
  - [ ] H1 title is topically relevant to the prose content
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-p4t702.md`
  - [ ] Git commit with exact message exists: `feat(301): create markdown file test-p4t702.md with prose content`
  - [ ] Commit is created on the feature branch `feat/301-markdown-file-creation-7590ff`
  - [ ] Changes are pushed to remote origin repository

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementer have complete freedom on topic? | Complete creative freedom | Spec explicitly states "any topic", 300+ test files use diverse topics without restriction, maximizes implementation speed |
  | 2 | Should prose be validated for grammar and quality? | Structural validation only | Test files are validation artifacts with no production impact, minimal validation aligns with 300+ precedents |
  | 3 | Must title be topically relevant to prose? | Title should be relevant | Creates coherent documents, aligns with observed test file pattern, minimal additional constraint |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-p4t702.md) to existing collection of 300+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 006-300; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/301-markdown-file-creation-7590ff` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 300+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-p4t702.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — 5-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~3-5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-3 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 5-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 300+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (290-300) demonstrate efficient implementation of identical features in 5-15 minutes
  - File naming (test-p4t702.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 300+ prior implementations
  - No code generation, no complex logic, purely file system operations

  ---

  _Analysis phase complete — codebase structure understood, architecture patterns identified, affected areas assessed, complexity estimated as S (Small)_
