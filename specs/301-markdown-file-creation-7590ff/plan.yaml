# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single test markdown file following the well-established pattern used across
  300+ test files in the Sheep platform. The implementation is self-contained with no dependencies on
  application code, build systems, or configuration changes.

  **File System Impact:**
  - Adds one new file (test-p4t702.md) to the repository root
  - File is a simple markdown document (~400-600 bytes)
  - No modifications to existing files or directories
  - No impact on application source code (/src/sheep/)

  **Git Workflow:**
  - Feature branch pre-created: feat/301-markdown-file-creation-7590ff
  - Single commit with conventional message: feat(301): create markdown file test-p4t702.md with prose content
  - Push to remote origin on feature branch
  - Standard workflow used by all 300+ precedent implementations

  ## Key Design Decisions

  ### Decision 1: File Creation Method
  **Chosen:** pathlib.Path.write_text() with explicit UTF-8 encoding and newline=\"\\n\"

  **Why:** pathlib is the modern Python standard for text file I/O. The newline parameter ensures
  Unix LF line endings on all platforms (Windows, Linux, macOS), which is critical for reproducible
  test artifacts and consistent git diffs. All 300+ precedent test files use this exact approach.

  **Alternatives rejected:**
  - subprocess with echo command — requires shell escaping, platform-specific behavior
  - os.open() with manual encoding — verbose, low-level, no benefit over pathlib
  - open() context manager — more boilerplate, pathlib is the modern standard

  ### Decision 2: Content Source and Coherence
  **Chosen:** Hardcoded prose content, topically coherent with the H1 title

  **Why:** Test markdown files are validation artifacts with no production impact. Hardcoded content
  is fully deterministic, reproducible, and easy to debug. The feature spec grants complete creative
  freedom on topic selection, so the implementer chooses a coherent topic and writes 2-3 sentences.
  This keeps implementation simple while maintaining quality. All 300+ precedent test files use this
  approach.

  **Alternatives rejected:**
  - AI-generated content at runtime — adds non-determinism, latency, unnecessary complexity
  - Template system — unnecessary abstraction for simple content
  - Random generators — violates determinism requirement for test artifacts

  ### Decision 3: Git Integration Approach
  **Chosen:** subprocess.run() with git CLI commands (add, commit, push)

  **Why:** git CLI is universally available. subprocess.run() is lightweight, requires no external
  dependencies, and provides proper exit code handling and error reporting via check=True. This
  raises CalledProcessError on non-zero exit, enabling clear error handling. All 300+ precedent
  implementations use this approach.

  **Alternatives rejected:**
  - GitPython library — adds external dependency, overkill for simple operations
  - os.system() or shell=True — deprecated, security risk (command injection)
  - Direct git API manipulation — unnecessary complexity

  ### Decision 4: Validation Strategy
  **Chosen:** Structural validation only — no programmatic grammar/quality checks

  **Why:** The feature spec explicitly recommends structural validation only. Test files are validation
  artifacts with no production impact. Code review provides the quality gate. Adding programmatic
  validation would add 5-10 minutes to implementation for minimal benefit. All 300+ precedent test
  files use no programmatic validation.

  **Alternatives rejected:**
  - No validation — would allow obviously malformed files to be committed
  - Comprehensive validation with grammar checking — adds significant complexity and latency

  ## Implementation Strategy

  **Phase 1: File Creation**
  Create test-p4t702.md with the following structure:
  - H1 markdown heading on line 1 (e.g., "# Automation and Efficiency")
  - Blank line on line 2
  - 2-3 sentences of prose on lines 3-5, topically relevant to the title

  Use pathlib.Path.write_text() with encoding=\"utf-8\" and newline=\"\\n\" to ensure proper
  encoding and Unix LF line endings across all platforms.

  **Phase 2: Git Integration**
  - Stage file: git add test-p4t702.md
  - Commit: git commit -m \"feat(301): create markdown file test-p4t702.md with prose content\"
  - Push: git push -u origin HEAD

  The -u flag in git push sets upstream tracking, which is standard for feature branch workflow.

  **Why This Order:**
  Phase 1 must complete first because Phase 2 depends on the file existing. Once the file is
  created with proper content, git operations are straightforward and mechanical.

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File already exists at test-p4t702.md | Low | Blocks feature, creates conflict | Check if file exists before writing; report error if it does and exit cleanly |
  | Incorrect file encoding (Windows BOM or CRLF) | Low | Fails validation, inconsistent git diffs | Use explicit encoding=\"utf-8\" and newline=\"\\n\" parameters in pathlib.Path.write_text() |
  | Prose is not topically coherent with title | Medium | Violates spec requirement FR-4 | Implementer chooses coherent topic (e.g., title=\"Automation\" with prose discussing automation) |
  | Git commit fails (not on feature branch, git user not configured) | Low | Blocks push, manual troubleshooting required | Error handling in subprocess.run(check=True) will raise CalledProcessError with git stderr output |
  | Git push fails (network issues, permissions) | Low | Requires investigation | Error handling in subprocess.run(check=True) will raise CalledProcessError; implementer can investigate git output |
  | File size exceeds expected range (> 600 bytes) | Low | Violates NFR-3, might indicate over-documentation | Document size naturally falls within range for 2-3 sentences; keep prose concise (~50-70 words per sentence) |

  ## Success Criteria

  ✅ File test-p4t702.md exists in repository root with proper structure
  ✅ File contains exactly one H1 heading (# Title) on the first line
  ✅ File contains exactly 2-3 sentences of prose following a blank line
  ✅ Prose is topically relevant to the H1 title
  ✅ File is UTF-8 encoded without BOM
  ✅ File uses Unix LF line endings (not Windows CRLF)
  ✅ File size naturally falls within 400-600 byte range
  ✅ File is staged in git (git add successful)
  ✅ Git commit with exact message exists on feature branch
  ✅ Changes are pushed to remote origin
