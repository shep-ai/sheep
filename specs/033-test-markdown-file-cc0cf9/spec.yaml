content: |
  ## Problem Statement

  The task is to create a simple markdown file as a test/example artifact in the repository.
  This follows the established pattern seen in similar test files (test-gsul5o.md, test-mf05k4.md, test-xa3rxn.md, etc.)
  which demonstrate the Sheep system's ability to create and manage content files.

  ## Success Criteria

  - [ ] File `test-u6624u.md` is created in the repository root directory
  - [ ] File contains exactly one markdown heading (# recommended based on product decision)
  - [ ] File contains between 2-3 sentences of prose content below the heading
  - [ ] File uses valid markdown syntax with no syntax errors
  - [ ] File content is human-readable and follows English language conventions
  - [ ] File follows the established naming and content pattern of similar test files in the repository
  - [ ] Changes are committed with a conventional commit message in format: `feat(content): Add test-u6624u.md markdown file`

  ## Functional Requirements

  - **FR-1**: The file must be created with the exact filename `test-u6624u.md` in the repository root directory
  - **FR-2**: The file must contain a markdown heading as the first content element (using # as the recommended level from product decisions)
  - **FR-3**: The file must contain between 2-3 sentences of prose content immediately following the heading
  - **FR-4**: All content must use valid markdown syntax that renders correctly in markdown processors

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 text format to ensure compatibility across systems and editors
  - **NFR-2**: File should follow the established pattern and style of existing test markdown files (test-gsul5o.md, test-mf05k4.md, test-xa3rxn.md, test-an5dun.md) for consistency
  - **NFR-3**: Content should be clear, coherent English prose that is readable and meaningful
  - **NFR-4**: File path should conform to repository structure convention (placement in root directory)
  - **NFR-5**: File must be tracked in git history with a proper conventional commit message

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Heading level: H1 (#) or H2 (##)? | H1 Heading | Standard markdown convention for document titles. Most prominent and creates clear visual hierarchy. Consistent with how standalone markdown documents are typically structured. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Root directory**: Contains multiple markdown files including documentation, design patterns, and test examples
  - **src/sheep/**: Python source code for the agentic platform
  - **specs/**: Feature specifications directory with 57+ feature directories
  - **tests/**: Test suite for the platform
  - **pyproject.toml**: Python project configuration (Python 3.11+, uses CrewAI framework)

  The repository already contains numerous test markdown files (test-gsul5o.md, test-mf05k4.md, test-xa3rxn.md, test-an5dun.md, test-idm3s2.md, test-quk4of.md)
  that follow a consistent pattern: a markdown heading (# Title) followed by 2-3 sentences of content.

  ### Architecture Patterns

  This is a content-only feature with no architectural implications. The repository follows a simple pattern for test files:
  - Files are created in the repository root
  - Files use markdown format with .md extension
  - Content is human-readable example text
  - Recent commits follow the conventional commit format: `feat(content): Add [filename] markdown file`

  ### Relevant Technologies

  - **Markdown**: The file format for the new content

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | Low | Adding a new .md file in the root directory |
  | Git repository | Low | Simple addition of new file, no impact on existing code or structure |

  ## Dependencies

  None identified. This feature has no dependencies on existing code, libraries, or infrastructure.
  The markdown file is a standalone artifact that does not interact with any system code.

  ## Size Estimate

  **S** — This is a trivial task requiring only file creation with simple text content.
  No code changes, no architectural decisions, no dependencies to manage.
  Estimated effort: < 1 hour (likely < 15 minutes for actual implementation).
