content: |
  ## Architecture Overview

  Feature 248 follows the **established orchestration pattern** proven across 247 prior
  implementations (features 101–247). The architecture is remarkably simple:

  ```
  create_feature_248_markdown_file()
    ├── generate_markdown_content()      [Returns H1 + 2-3 sentences]
    ├── write_markdown_file()            [Persists with UTF-8, LF encoding]
    ├── validate_markdown_file()         [Checks format, encoding, line endings]
    ├── commit_markdown_file()           [Stages file, creates conventional commit]
    └── push_markdown_file()             [Pushes with -u upstream tracking]
  ```

  **Key architectural characteristics:**
  - **Pure orchestration**: No new abstractions, business logic, or architectural patterns
  - **Sequential workflow**: Each step depends on the output of the previous step
  - **Error handling at top level**: Try/catch wraps the entire workflow; utilities handle internal errors
  - **Structured logging**: All steps logged via get_logger() for observability
  - **No state machine**: Linear flow with clear success/failure semantics

  The module structure follows the pattern established in features 101–247:
  - Feature metadata constants (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Single public function: create_feature_248_markdown_file(repo_path=None)
  - Module-level logger instance
  - if __name__ == \"__main__\" block for direct execution
  - Comprehensive docstrings for clarity

  **Integration with existing codebase:**
  - Utilities: All functions called already exist in sheep.content_generators (verified)
  - Logging: Uses existing sheep.observability.logging.get_logger() infrastructure
  - Configuration: LLM, encoding, retry logic all configured in existing utilities (no changes needed)
  - No new dependencies, no modifications to existing modules

  ## Key Design Decisions

  ### 1. Reuse Existing Utilities (No New Code Patterns)

  **Decision**: Call proven existing functions from sheep.content_generators without modification.

  **Alternatives considered**:
  - Create new unified function combining all steps (DRY principle) — Rejected: Would complicate 247+ existing features; individual files are better for git history
  - Implement utilities inline in feature file — Rejected: Duplicates proven code; increases maintenance burden

  **Rationale**: The utilities (generate, write, validate, commit, push) have been battle-tested
  across 247 prior features. They handle all edge cases (retry logic, encoding validation,
  error reporting) internally. Reusing them:
  - Reduces implementation time from ~4 hours to ~2 hours
  - Eliminates code duplication and maintenance risk
  - Ensures consistency with all prior features
  - Allows fixing bugs once in the utilities; all features inherit the fix

  **Implementation**: Direct import and sequential call pattern, exactly as in feature 238.

  ### 2. Follow Established Pattern from Features 101–247

  **Decision**: Match module structure, naming conventions, and orchestration style
  precisely with features 101–247.

  **Alternatives considered**:
  - Create parameterized generic function — Rejected: 248+ iterations is unmaintainable; individual files provide clear git history
  - Use inheritance or composition — Rejected: Over-engineered for orchestration; simple function is sufficient

  **Rationale**: Consistency enables:
  - Easy discoverability: developers know where feature 248 implementation is located
  - Predictable code structure: reviewers can quickly validate correctness
  - Simple testing: feature can be run as script or imported and called
  - Clear git history: each feature is one commit, easy to bisect or revert

  **Implementation**: Structure mirrors feature_238_markdown_file_creation.py exactly.

  ### 3. Simple Orchestration with Top-Level Error Handling

  **Decision**: Wrap the entire workflow in a try/except block; let utilities raise exceptions
  on validation/git failures.

  **Rationale**: The spec and research findings confirm:
  - Retry logic is built into generate_markdown_content() (retry up to 3 times)
  - Validation happens before commit (prevents invalid content from entering git)
  - Git operations (commit, push) have clear success/failure semantics

  Therefore, the orchestration function can be simple: call each utility in sequence, catch
  any exception at the top level, log it, and re-raise.

  ## Implementation Strategy

  **Phase 1 (Module Setup)** comes first because it establishes file structure and imports
  before any implementation, allowing early testing of import statements.

  **Phase 2 (Core Implementation)** builds on Phase 1 by implementing the orchestration
  function, testing each utility call individually via TDD cycles.

  **Phase 3 (Execution & Verification)** validates Phases 1-2 by running the complete
  workflow end-to-end and confirming all specification requirements are met.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates invalid content (wrong sentence count) | Retry logic already built into generate_markdown_content(); handles up to 3 attempts |
  | File encoding incorrect on Windows | write_markdown_file() uses encoding=\"utf-8\" explicitly; Python handles platform differences |
  | Git push fails due to network | Error is caught and logged; specification allows graceful failure with actionable error message |
  | Upstream tracking not set | FR-8 requires verification via git branch -vv; GitPushTool uses -u flag |
  | Utilities missing or changed signature | All functions verified to exist in sheep.content_generators; signatures match feature 238 |

  ## Specification Alignment

  ✅ **FR-1**: LLM prose generation with random topic
  ✅ **FR-2**: File write with UTF-8 without BOM and Unix LF line endings
  ✅ **FR-3**: Format validation (H1, blank line, sentence count, encoding, line endings)
  ✅ **FR-4**: Retry logic on validation failure (up to 3 times)
  ✅ **FR-5**: Git staging via git add command
  ✅ **FR-6**: Conventional commit message format
  ✅ **FR-7**: Push with upstream tracking (-u flag)
  ✅ **FR-8**: Verify upstream tracking is established post-push
  ✅ **NFR-1 through NFR-9**: All performance, reliability, encoding, logging, and compatibility requirements met
