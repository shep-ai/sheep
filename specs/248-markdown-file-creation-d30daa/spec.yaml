content: |
  ## Problem Statement

  Create a single markdown file called `test-0v8cee.md` in the repository root with a valid
  markdown structure (H1 heading + 2-3 sentences of prose). The file must meet strict encoding
  and line-ending specifications: UTF-8 without BOM, Unix LF line endings, and a trailing newline.
  After creation and validation, the file must be staged, committed with a conventional commit
  message, and pushed to the remote repository with upstream tracking.

  This is the 248th iteration of a repeated, well-established pattern used throughout this repository.

  ## Success Criteria

  - [ ] File `test-0v8cee.md` exists in repository root
  - [ ] File contains valid H1 heading as first line (format: `# Heading Text`)
  - [ ] File contains exactly 2-3 sentences of prose after blank line following H1
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix LF line endings (no CRLF)
  - [ ] File has trailing newline character
  - [ ] File is staged in git (verified via `git status`)
  - [ ] Commit message follows conventional format: `feat(248): create markdown file test-0v8cee.md with prose content`
  - [ ] Commit is successfully pushed to remote origin
  - [ ] Upstream tracking is established (verified via `git branch -vv` or equivalent)
  - [ ] All validation checks pass before commit
  - [ ] Structured logs record each step: generation, write, validation, commit, push

  ## Functional Requirements

  - **FR-1**: Generate markdown content via LLM with an H1 heading and 2-3 sentences of prose about a random topic
  - **FR-2**: Write the generated content to file `test-0v8cee.md` in the repository root with UTF-8 encoding and Unix LF line endings
  - **FR-3**: Validate the written file for format compliance (H1 heading present, blank line after heading, 2-3 sentences in prose section, UTF-8 without BOM, no CRLF, trailing newline)
  - **FR-4**: If validation fails, automatically retry markdown generation up to 3 times before failing with error
  - **FR-5**: Stage the validated file in git repository using `git add` command
  - **FR-6**: Create a git commit with message following conventional commit format: `feat(248): create markdown file test-0v8cee.md with prose content`
  - **FR-7**: Push the commit to remote origin with upstream tracking enabled (using `-u` or `--set-upstream` flag)
  - **FR-8**: Verify upstream tracking is established after push completes (confirm branch is tracking remote)

  ## Non-Functional Requirements

  - **NFR-1**: Performance — Execution should complete within 60 seconds (including LLM latency which typically dominates)
  - **NFR-2**: Reliability — Handle transient network failures gracefully with clear, actionable error messages
  - **NFR-3**: Encoding — File must be UTF-8 without BOM, enforced by pathlib with explicit encoding parameter
  - **NFR-4**: Line Endings — File must use Unix LF line endings (\\n), not CRLF (\\r\\n), enforced at write-time with newline control
  - **NFR-5**: Logging — Use structured logging via `sheep.observability.logging.get_logger()` for all major steps, errors, and retries
  - **NFR-6**: Cross-Platform Compatibility — Use pathlib for all file path operations to ensure compatibility across Windows/macOS/Linux
  - **NFR-7**: Traceability — Log LLM generation attempts (including retry count), validation results, and git operations for observability
  - **NFR-8**: Idempotency — If file already exists, overwrite it rather than failing (supports safe re-runs)
  - **NFR-9**: Observability — All errors and warnings should be logged with context sufficient for debugging

  ## Product Decisions

  | # | Question | Decision | Rationale |
  | - | -------- | -------- | --------- |
  | 1 | Retry strategy for validation failures | Retry up to 3 times | Balances robustness against LLM randomness with implementation simplicity; established pattern across 247 prior features; prevents both premature failure and resource waste |
  | 2 | Content topic selection | Completely random topic | Simplest approach; aligns with established pattern across 247 features; no configuration overhead; maintains consistency with existing behavior |
  | 3 | Upstream tracking verification | Verify tracking is set | Provides explicit confirmation; supports observability and debugging; aligns with step-by-step validation pattern throughout workflow |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | **Low** | Existing functions are reused; no modifications needed. All required utilities (generate, write, validate, commit, push) are already implemented and tested across 247 prior features. |
  | Repository root | **Low** | New file `test-0v8cee.md` is created here. This is expected and part of the established pattern. |
  | Git repository | **Low** | One commit and push operation. Standard workflow; no changes to git configuration or history structure. |
  | `src/sheep/features/feature_248_markdown_file_creation.py` | **Optional** | Pattern suggests creating a new feature file in this directory, but implementation can also be done directly in `src/create_markdown.py` or inline per project practice. |
  | CI/CD / Tests | **None** | No code changes; markdown files are content artifacts. No test suite modifications required. |

  ## Dependencies

  **Internal (within this repository)**:
  - `sheep.content_generators.generate_markdown_content()` — LLM-based prose generation with retry logic
  - `sheep.content_generators.write_markdown_file()` — Safe file I/O with UTF-8 encoding and Unix LF line endings
  - `sheep.content_generators.validate_markdown_file()` — Format validation (H1 heading, sentence count, encoding, line endings, trailing newline)
  - `sheep.content_generators.commit_markdown_file()` — Git staging and conventional commit
  - `sheep.content_generators.push_markdown_file()` — Git push with upstream tracking and verification
  - `sheep.config.llm.get_reasoning_llm()` — LLM factory for content generation
  - `sheep.tools.GitCommitTool` — Git commit wrapper
  - `sheep.tools.GitPushTool` — Git push wrapper
  - `sheep.observability.logging.get_logger()` — Structured logging

  **External**:
  - **CrewAI (≥0.86.0)** — Agent framework and LLM integration
  - **Anthropic Claude API** — LLM for prose generation (configured via `get_reasoning_llm()`)
  - **GitPython (≥3.1.0)** — Git command execution
  - **Python pathlib (≥3.11)** — Cross-platform file path handling

  ## Implementation Approach

  The implementation will **reuse the established pattern** from features 101–247:

  1. **Generate Content** — Call `generate_markdown_content()` with retry logic (up to 3 attempts) to generate an H1 heading and 2-3 sentences of prose about a random topic.
  2. **Write File** — Call `write_markdown_file(content, "test-0v8cee.md")` to persist to disk with UTF-8 encoding and Unix LF line endings.
  3. **Validate** — Call `validate_markdown_file(filepath)` to ensure format compliance (H1 heading, blank line separator, 2-3 sentences, UTF-8 without BOM, no CRLF, trailing newline).
  4. **Commit** — Call `commit_markdown_file(filepath, content, repo_path)` to stage the file and commit with message: `feat(248): create markdown file test-0v8cee.md with prose content`
  5. **Push** — Call `push_markdown_file(repo_path)` to push the commit to remote origin with upstream tracking verification.

  **No new code patterns or architectural decisions are required.** The implementation is straightforward application of existing, well-tested utilities.

  ## Size Estimate

  **S** — (2–4 hours of implementation time)

  **Justification**:
  - **Established Pattern**: This is feature 248 of a repeated, well-proven pattern. The workflow is identical to features 101–247.
  - **Existing Utilities**: All required functions already exist in `content_generators.py`, tested across 247+ prior features. No new code needs to be written.
  - **Minimal Scope**: The task is purely orchestrative — call five sequential helper functions and handle success/error paths. No complex logic, no new architecture, no design decisions.
  - **No Testing Burden**: Content validation is built into the helpers. No custom test suite needed.
  - **Git Operations**: Simple, standard git workflow (stage, commit, push). No merge conflicts or branch complexity expected.

  **Risk/Complexity Factors**: None identified.
  - LLM generation may occasionally produce prose outside the 2-3 sentence range (handled by `generate_markdown_content()` with 3-attempt retry).
  - Git push may fail if network is unavailable (standard external dependency, not project risk; handled by error reporting).
