content: |
  ## Problem Statement

  Create a single markdown file called `test-0v8cee.md` in the repository root with a valid
  markdown structure (H1 heading + 2-3 sentences of prose). The file must meet strict encoding
  and line-ending specifications: UTF-8 without BOM, Unix LF line endings, and a trailing newline.
  After creation and validation, the file must be staged, committed with a conventional commit
  message, and pushed to the remote repository with upstream tracking.

  This is the 248th iteration of a repeated, well-established pattern used throughout this repository.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository
  contains:

  - `src/sheep/agents/` — Agent definitions (code_agents.py, general_agents.py)
  - `src/sheep/config/` — Configuration (LLM factory, settings management)
  - `src/sheep/flows/` — Flow orchestration (coordinate agent execution)
  - `src/sheep/tools/` — Tool implementations (git_tools.py, file_tools.py, web_tools.py)
  - `src/sheep/observability/` — Logging and tracing (Langfuse integration, structured logging)
  - `src/sheep/features/` — Feature implementations (numbered feature files for each task)
  - `src/sheep/content_generators.py` — **[CRITICAL]** Reusable utilities for markdown generation,
    validation, and git operations
  - `src/create_markdown.py` — Top-level orchestration module
  - `specs/` — Feature specification directories (one per feature, containing spec.yaml, plan.yaml, etc.)
  - Repository root — Destination for all created markdown files (test-*.md)

  ### Architecture Patterns

  The project follows a **modular, observable flow-based architecture**:

  1. **Flows** — Define orchestration structure and control flow (in `src/sheep/flows/`)
  2. **Agents** — Specialized intelligence units with focused roles, goals, and tools
  3. **Tools** — Reusable utilities (git, file, web operations)
  4. **Content Generators** — Helper functions in `content_generators.py` that encapsulate
     the markdown workflow (generate, write, validate, commit, push)

  **Dependency Flow**:
  ```
  Feature Implementation
    ↓
  create_markdown_file() [orchestrator]
    ↓
  1. generate_markdown_content() → LLM API call
  2. write_markdown_file() → File I/O (Path)
  3. validate_markdown_file() → Format validation
  4. commit_markdown_file() → GitCommitTool
  5. push_markdown_file() → GitPushTool
  ```

  **Conventions Observed**:
  - **File Organization**: Features are numbered sequentially; each gets a dedicated spec directory
    (e.g., `specs/248-markdown-file-creation-d30daa/`)
  - **Git Commits**: Conventional commit format: `feat(NUMBER): create markdown file FILENAME with prose content`
  - **Markdown Format**: H1 heading + blank line + 2-3 sentence prose + trailing newline
  - **Encoding**: UTF-8 without BOM; Unix LF line endings (not CRLF)
  - **Logging**: Structured logging via `get_logger(__name__)` from `observability.logging`

  ### Relevant Technologies

  - **CrewAI (≥0.86.0)**: Agent framework providing LLM orchestration and tool integration
  - **Anthropic Claude API**: LLM for generating coherent markdown prose (via `get_reasoning_llm()`)
  - **Pydantic (≥2.0.0)**: Data validation and configuration management
  - **GitPython (≥3.1.0)**: Git repository operations (commit, push, branch management)
  - **Python (≥3.11)**: Pathlib for cross-platform file handling; f-strings; type hints
  - **Langfuse (≥2.0.0)**: Observability platform for tracing agent execution

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | **Low** | Existing functions are reused; no modifications needed. All required utilities (generate, write, validate, commit, push) are already implemented and tested across 247 prior features. |
  | Repository root | **Low** | New file `test-0v8cee.md` is created here. This is expected and part of the established pattern. |
  | Git repository | **Low** | One commit and push operation. Standard workflow; no changes to git configuration or history structure. |
  | `src/sheep/features/feature_248_markdown_file_creation.py` | **Optional** | Pattern suggests creating a new feature file in this directory, but implementation can also be done directly in `src/create_markdown.py` or inline per project practice. |
  | CI/CD / Tests | **None** | No code changes; markdown files are content artifacts. No test suite modifications required. |

  ## Dependencies

  **Internal (within this repository)**:
  - `sheep.content_generators.generate_markdown_content()` — LLM-based prose generation
  - `sheep.content_generators.write_markdown_file()` — Safe file I/O with UTF-8 encoding
  - `sheep.content_generators.validate_markdown_file()` — Format validation (H1 heading, sentence count, encoding, line endings)
  - `sheep.content_generators.commit_markdown_file()` — Git staging and conventional commit
  - `sheep.content_generators.push_markdown_file()` — Git push with upstream tracking
  - `sheep.config.llm.get_reasoning_llm()` — LLM factory for content generation
  - `sheep.tools.GitCommitTool` — Git commit wrapper
  - `sheep.tools.GitPushTool` — Git push wrapper
  - `sheep.observability.logging.get_logger()` — Structured logging

  **External**:
  - **CrewAI** — Agent framework and LLM integration
  - **Anthropic Claude API** — LLM for prose generation (configured via `get_reasoning_llm()`)
  - **GitPython** — Git command execution
  - **Python pathlib** — Cross-platform file path handling

  ## Implementation Approach

  The implementation will **reuse the established pattern** from features 101–247:

  1. **Generate Content** — Call `generate_markdown_content()` which invokes the LLM with a prompt
     requesting an H1 heading and 2-3 sentences of prose about any topic.
  2. **Write File** — Call `write_markdown_file(content, "test-0v8cee.md")` to persist to disk with
     UTF-8 encoding and Unix LF line endings.
  3. **Validate** — Call `validate_markdown_file(filepath)` to ensure format compliance:
     - H1 heading present at start
     - Blank line separator after heading
     - 2-3 sentences in prose section
     - No UTF-8 BOM
     - No CRLF line endings
     - Trailing newline present
  4. **Commit** — Call `commit_markdown_file(filepath, content, repo_path)` which stages the file
     and commits with message: `feat(248): create markdown file test-0v8cee.md with prose content`
  5. **Push** — Call `push_markdown_file(repo_path)` to push the commit to the remote origin with
     upstream tracking (`-u` flag).

  **No new code patterns or architectural decisions are required.** The implementation is
  straightforward application of existing, well-tested utilities.

  ## Size Estimate

  **S** — (2–4 hours of implementation time)

  **Justification**:
  - **Established Pattern**: This is feature 248 of a repeated, well-proven pattern. The workflow
    is identical to features 101–247.
  - **Existing Utilities**: All required functions already exist in `content_generators.py`,
    tested across 147+ prior features. No new code needs to be written.
  - **Minimal Scope**: The task is purely orchestrative — call five sequential helper functions
    and handle success/error paths. No complex logic, no new architecture, no design decisions.
  - **No Testing Burden**: Content validation is built into the helpers. No custom test suite needed.
  - **Git Operations**: Simple, standard git workflow (stage, commit, push). No merge conflicts or
    branch complexity expected.

  **Risk/Complexity Factors**: None identified.
  - LLM generation may occasionally produce prose outside the 2-3 sentence range (handled by
    `generate_markdown_content()` validation).
  - Git push may fail if network is unavailable (standard external dependency, not project risk).

