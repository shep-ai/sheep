content: |
  ## Problem Statement

  Create a single markdown file named `test-8mb1a0.md` at the repository root containing a markdown h1 title and 2-3 sentences describing any topic. This feature is part of the Sheep agentic platform test suite, which validates the system's ability to perform simple, well-defined implementation tasks with appropriate file handling and version control workflows.

  The task is intentionally minimal to validate the agentic system's ability to:
  - Create files in correct locations following naming conventions
  - Write coherent, properly formatted markdown content
  - Execute standard git workflows (commit, push)
  - Complete well-scoped tasks without requiring external dependencies or API calls

  ## Success Criteria

  - [ ] File `test-8mb1a0.md` exists at repository root (not in any subdirectory)
  - [ ] File contains exactly one h1 markdown heading using the syntax `# [Title]`
  - [ ] File contains 2-3 sentences of prose content following the h1 heading, separated by a blank line
  - [ ] Content is coherent, grammatically correct, and follows markdown formatting standards
  - [ ] File uses UTF-8 encoding (consistent with repository standards)
  - [ ] File follows the `test-{code}.md` naming convention pattern matching existing test files
  - [ ] Changes are committed to the feature branch with a descriptive, conventional commit message
  - [ ] Changes are pushed to the remote repository on the feature branch `feat/052-markdown-test-file-116bd9`

  ## Functional Requirements

  - **FR-1**: Create a new markdown file with the exact filename `test-8mb1a0.md` in the repository root directory (not in subdirectories)
  - **FR-2**: File must contain exactly one h1 markdown heading (syntax: `# [Title]`) as the first content line, with no leading whitespace
  - **FR-3**: File must contain 2-3 sentences of descriptive prose following the h1 heading, separated by a blank line from the heading
  - **FR-4**: Prose must describe a coherent, well-defined topic and be grammatically correct with proper punctuation
  - **FR-5**: File must be valid markdown with proper formatting, no syntax errors, and correct line breaks (no trailing whitespace)
  - **FR-6**: File must be committed to the feature branch using a descriptive conventional commit message (e.g., `feat(052): Create test-8mb1a0.md with [topic]`)
  - **FR-7**: Committed changes must be pushed to the remote repository on the feature branch `feat/052-markdown-test-file-116bd9`
  - **FR-8**: Topic selection is unrestricted; any topic is acceptable (technical, scientific, creative, general knowledge, etc.)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (consistent with repository standards and markdown best practices)
  - **NFR-2**: Content quality should match or exceed the clarity and informativeness of existing test files (test-*.md files) in the repository root
  - **NFR-3**: Implementation must follow the established test file pattern (`test-{randomCode}.md`) without deviation from naming conventions
  - **NFR-4**: Task completion must require no external dependencies, API calls, or build system invocations
  - **NFR-5**: Implementation must complete within the S (small) size estimate of 30 minutes, including topic selection, writing, and git operations
  - **NFR-6**: File must be committed with a message that follows conventional commits format (e.g., `feat(052)`, `docs(test)`)
  - **NFR-7**: No review or approval is required beyond automated format validation; content quality is self-evident from the markdown file

  ## Acceptance Criteria

  The feature is complete when:
  1. All success criteria checkboxes above are verified as passing
  2. The file `test-8mb1a0.md` is visible at the repository root in both local and remote (origin) states
  3. Git history shows the conventional commit message on the feature branch
  4. The markdown file can be opened and rendered correctly by standard markdown viewers
  5. No merge conflicts are introduced to the main branch

