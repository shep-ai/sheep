# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-25
  - **Ready for:** Implementation

  ## Architecture Overview

  Feature 211 follows the well-established markdown file creation pattern from feature 208 and 200+ existing test files in the repository. The implementation is straightforward and deterministic:

  **Pattern Structure:**
  1. **File Creation** — Use Python pathlib.Path.write_text() to create markdown file with hard-coded content
  2. **Content Format** — H1 heading (# Title), blank line, 2-3 sentences of prose
  3. **Validation** — Comprehensive checks for encoding (UTF-8 no BOM), line endings (LF only), format, size, sentence count
  4. **Git Workflow** — Stage with git add, commit with conventional message, push to feature branch
  5. **Logging** — Structured logging via sheep.observability.logging throughout
  6. **Error Handling** — Fail-fast with try/except blocks, returning 0 (success) or 1 (failure)

  **Why This Approach:**
  - Deterministic output (no randomization, no API calls, identical on repeated execution)
  - Transparent and auditable (all content is in source code, no hidden dependencies)
  - Fast execution (no network latency, no external API calls)
  - Matches 200+ existing test files and feature 208 reference implementation
  - Requires only Python standard library (pathlib, subprocess) — no external dependencies

  **Fit with Sheep Platform:**
  - Feature module exports `main()` function returning 0/1 exit codes
  - Integrates with sheep.observability.logging for structured logging
  - Uses git CLI via subprocess for version control operations
  - No modifications to src/sheep/ source code beyond adding this feature module
  - No database, configuration, or infrastructure changes required

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text() with UTF-8 Encoding

  **Decision:** Use `pathlib.Path.write_text(content, encoding="utf-8")` for file creation.

  **Rationale:**
  - Python 3.11+ standard library (no external dependencies)
  - Automatically handles UTF-8 encoding without BOM
  - Automatically uses LF (Unix) line endings on all platforms (Linux, macOS, Windows)
  - Simple, Pythonic API
  - Matches feature 208 reference implementation
  - Proven pattern across 200+ existing test markdown files

  **Alternative Rejected:** Direct open()/write() operations would require manual encoding specification and line ending conversion.

  ### 2. Git Integration: subprocess.run() with shell=False

  **Decision:** Use `subprocess.run(["git", "add/commit/push"], check=True, shell=False)` for git operations.

  **Rationale:**
  - Secure (shell=False prevents command injection)
  - Transparent (standard git CLI commands visible and auditable)
  - Fail-fast behavior (check=True raises CalledProcessError on failure)
  - Matches feature 208 pattern
  - Simple for sequential git add → commit → push workflow
  - Works across all platforms

  **Alternative Rejected:** GitPython library would add unnecessary abstraction layer for 3 sequential git commands.

  ### 3. Content Generation: Hard-Coded Deterministic Prose

  **Decision:** Hard-code all markdown content with specific title and prose text.

  **Rationale:**
  - Deterministic output (identical on every execution)
  - No external dependencies (no API calls, no network latency)
  - Transparent and auditable (source code is the content)
  - Requirement allows free-form arbitrary topic selection
  - Matches all 200+ existing test files and feature 208
  - Faster than any generative approach

  **Alternative Rejected:** API-based content generation (GPT, Anthropic API) would violate NFR-4 (no external dependencies beyond standard library).

  ### 4. Validation Strategy: Comprehensive Multi-Check Approach

  **Decision:** Implement 6 sequential validation checks with fail-fast semantics:
  1. File exists
  2. Markdown format (H1 heading, blank line, single H1 only)
  3. Sentence count (exactly 2-3 sentences)
  4. UTF-8 encoding without BOM
  5. Unix LF line endings only (no CRLF or CR)
  6. File size between 300-800 bytes

  **Rationale:**
  - Comprehensive validation matches feature 208 reference implementation
  - Requirement NFR-8 specifies comprehensive validation scope
  - High confidence in file correctness before git operations
  - Fail-fast catches errors early with clear error messages
  - Minimal time overhead (~2-3 minutes) with high confidence gain
  - Matches established pattern from feature 208

  **Alternative Rejected:** Minimal validation (file exists only) would reduce quality assurance and confidence in correctness.

  ### 5. Logging: sheep.observability.logging Integration

  **Decision:** Use `sheep.observability.logging.get_logger(__name__)` for all logging.

  **Rationale:**
  - Project standard infrastructure
  - Integrates with LangFuse observability and OpenInference instrumentation
  - Structured logging for better debugging and audit trails
  - Configurable log levels
  - Matches feature 208 pattern

  **Alternative Rejected:** Plain print() statements lack structure and project integration.

  ### 6. Error Handling: Fail-Fast with Proper Exception Management

  **Decision:** Try/except blocks catching specific exceptions (FileNotFoundError, ValueError, subprocess.CalledProcessError) with main() returning 0 (success) or 1 (failure).

  **Rationale:**
  - Fail-fast stops immediately on error
  - Specific exception handling enables targeted error messages
  - Exit codes (0/1) integrate with automation platform
  - Matches feature 208 pattern
  - All errors logged with context for debugging

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation & File Creation)** comes first because:
  - File must exist before validation can occur
  - Validation framework uses the created file as input
  - File I/O is prerequisite for all downstream operations

  **Phase 2 (Git Integration)** comes second because:
  - File must be validated before git operations
  - Git operations depend on validated file existing and being correct
  - This ordering ensures fail-fast on validation errors, preventing bad commits

  ### Work Sequence Within Phases

  **Phase 1:**
  1. Create feature module with constants and imports
  2. Implement file creation function (create_markdown_file)
  3. Implement validation functions (verify_file_exists, validate_markdown_format, validate_sentence_count, validate_encoding, validate_line_endings, validate_file_size)
  4. Implement orchestration function (validate_markdown_file) that runs all checks sequentially
  5. Integrate file creation + validation in main()

  **Phase 2:**
  1. Implement git operations (git_add_file, git_commit, git_push)
  2. Integrate into main() workflow after validation
  3. Add error handling for git failures
  4. Test complete workflow end-to-end

  ### Key Implementation Details

  **File Name:** `test-fm1m1t.md` (fixed in constants)

  **Prose Topic:** Free-form arbitrary selection (spec allows "about anything")

  **Prose Strategy:** Select meaningful topic with 2-3 complete sentences naturally falling into 350-450 byte range (precedent test files)

  **Branch Name:** `feat/211-markdown-file-creation-c18032` (pre-created by system)

  **Commit Message Format:** `feat(211): Create markdown file test-fm1m1t.md`

  **Module Structure:** Copy structure from feature 208, update constants and content

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists in repository | Validation will fail at file creation step; error message guides user |
  | Git user.name/user.email not configured | git commit will fail with clear error; user must configure git before running |
  | File size out of range (too small/large) | Validation check (task 3) catches this; prose content composition targets 350-450 bytes |
  | Prose has wrong sentence count | Validation counts periods to verify exactly 2-3 sentences |
  | File created with wrong encoding (UTF-8 BOM) | Validation check explicitly detects and rejects UTF-8 BOM |
  | File has Windows (CRLF) or Mac (CR) line endings | pathlib.Path.write_text() uses LF automatically; validation checks line endings |
  | Git push fails (network, permissions) | subprocess CalledProcessError caught and logged; main() returns 1 with error details |
  | Validation too strict, prevents valid content | Feature 208 demonstrates these checks are appropriate for all 200+ existing test files |

