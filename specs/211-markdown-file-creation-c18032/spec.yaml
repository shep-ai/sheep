content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-fm1m1t.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-210,
  with 200+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-fm1m1t.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\\n), not CRLF
  - [ ] File is between 300-800 bytes in size (consistent with precedent test files)
  - [ ] File contains grammatically correct and coherent prose (no gibberish or nonsensical sentences)
  - [ ] File is staged with `git add test-fm1m1t.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(211): Create markdown file test-fm1m1t.md`
  - [ ] Commit is pushed to the feature branch `feat/211-markdown-file-creation-c18032`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-fm1m1t.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\\n) line endings throughout
  - **FR-7**: The file SHALL be added to git staging area using `git add test-fm1m1t.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(211): Create markdown file test-fm1m1t.md`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/211-markdown-file-creation-c18032`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-800 bytes, consistent with existing test markdown files in the repository
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or nonsensical sentences)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git CLI
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 151-210 for consistency and maintainability
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)
  - **NFR-8**: The implementation SHALL provide comprehensive validation of file properties (encoding, line endings, size, format, git status)

  ## Product Decisions & AI Recommendations

  All significant product decisions for this feature have been predetermined by 200+ existing test markdown files
  that follow the identical pattern. The following decisions have been made with rationale:

  | Decision | Resolution | Rationale |
  | -------- | ---------- | --------- |
  | Prose topic | Free-form (arbitrary) | User query specifies \"about anything\"; all 200+ precedent files use arbitrary topics; no constraint required |
  | File name | `test-fm1m1t.md` | Fixed by user query; follows `test-<id>.md` pattern from 200+ precedent files |
  | File location | Repository root | Established pattern; all 200+ test files stored at root level; verified in codebase |
  | File format | H1 heading + blank line + 2-3 sentences | Defined by 200+ precedent files in CommonMark format; no variation permitted |
  | File size range | 300-800 bytes | Measured from existing test files; consistent with precedents; enables quality validation |
  | Encoding | UTF-8 without BOM | Python 3 standard; matches all existing files; pathlib.write_text() default behavior |
  | Line endings | LF (\\n) | Unix convention; matches repository standards; pathlib handles automatically cross-platform |
  | Validation scope | Comprehensive | Feature 208 reference implementation demonstrates full validation; aligns with established pattern |
  | Git workflow | Conventional commits on feature branch | Established pattern from features 151-210; feature branch pre-created by system |

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 200+ test markdown files following pattern `test-*.md`
  - Examples: `test-xgtwtq.md`, `test-khrvcn.md`, `test-wqo87w.md`, `test-fm1m1t.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`, `Dockerfile`
  - Spec documentation: 210+ feature specs in `specs/` directory

  **Spec Directory Structure:**
  - `specs/` contains 210+ feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Example: `specs/210-markdown-file-creation-vgprsq/spec.yaml`
  - This spec is located at: `specs/211-markdown-file-creation-c18032/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions for CrewAI-based automation
  - `src/sheep/flows/` contains flow orchestration and control logic
  - `src/sheep/config/` contains configuration management and LLM setup
  - `src/sheep/cli.py` contains CLI entry point
  - `src/sheep/features/` contains 200+ feature implementation modules (feature_XXX_markdown_file_creation.py)
  - `src/sheep/observability/` contains logging and tracing utilities

  **Test File Pattern (200+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-800 bytes
  - Example from existing test file:
    ```markdown
    # Machine Learning in Practice

    Machine learning has become an essential tool for solving complex problems across various domains,
    from computer vision and natural language processing to recommendation systems and autonomous vehicles.
    By leveraging statistical patterns in data, machine learning models can make accurate predictions and
    automate decision-making processes that would be difficult or impossible to program explicitly.
    ```

  ### Architecture Patterns

  **File Creation Pattern:**
  - Uses Python `pathlib.Path.write_text()` for cross-platform file creation
  - Automatic UTF-8 encoding without BOM (Python 3 default)
  - Automatic LF line endings on all platforms when using pathlib
  - Simple, deterministic content (no randomization or external dependencies)

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-fm1m1t.md`
  - All test files follow identical naming scheme for consistency

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename>`
  - Changes are pushed to feature branch `feat/###-<feature-name>`
  - No branch creation needed (feature branch pre-created by system)

  **Feature Implementation Pattern:**
  - Each feature has a corresponding Python module in `src/sheep/features/`
  - Modules export a `main()` function returning 0 on success, 1 on failure
  - Comprehensive validation of file properties (encoding, line endings, size, format)
  - Structured logging via `sheep.observability.logging.get_logger()`
  - Full git integration via subprocess with proper error handling

  ### Relevant Technologies

  **File I/O (Python pathlib):**
  - Standard library module available in Python 3.11+ (no external dependencies)
  - `pathlib.Path.write_text()` handles UTF-8 encoding and LF line endings automatically
  - Cross-platform file operations (works on Linux, macOS, Windows identically)
  - Simple, Pythonic API for file operations

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, footnotes, etc.)
  - Well-supported by all markdown renderers and systems

  **Git Integration:**
  - Standard git CLI commands: `git add`, `git commit`, `git push`
  - Executed via Python subprocess.run() with shell=False (secure)
  - Feature branch already created: `feat/211-markdown-file-creation-c18032`
  - Conventional Commits specification for message format
  - No specialized libraries required (git CLI sufficient)

  **Project Infrastructure:**
  - CrewAI-based agentic platform (version 0.86.0+)
  - LangFuse integration for observability (optional)
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  **Build & Configuration:**
  - Python 3.11+ required (pyproject.toml specifies minimum)
  - Package management via pip with pyproject.toml
  - Testing via pytest
  - Linting via ruff
  - Type checking via mypy (optional for simple features)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-800 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-210; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`, `subprocess`, `pathlib`) and git CLI; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Documentation | Low | No changes to README or other documentation needed; feature follows established precedent |
  | Build Process | None | No impact on build, CI/CD, or deployment pipelines |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/211-markdown-file-creation-c18032` (pre-created by system)
  - Write access to repository root directory (available in standard development environment)
  - Python 3.11+ with `pathlib` module (standard library, no external packages needed)
  - Python `subprocess` module (standard library)
  - Git CLI with user.name and user.email configured for commits

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) in repository root provide clear pattern to follow
  - Previous feature implementations (features 151-210) demonstrate successful execution of identical pattern
  - Features 151-210 specs provide exact templates and precedent structure
  - Feature 208 implementation provides detailed reference with comprehensive validation code

  **Not Required:**
  - No source code dependencies on src/sheep/ modules
  - No new external package dependencies
  - No modifications to configuration files (pyproject.toml, etc.)
  - No changes to src/sheep/ directory or production code
  - No API calls or external service dependencies
  - No randomization or non-deterministic content generation

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection (free-form) with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-210) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 208 implementation available as detailed reference with working code and validation logic
  - Zero architectural decisions needed (all predetermined by 200+ precedent files)
  - Comprehensive validation can be implemented efficiently using pathlib and git subprocess calls

  ---

  _Requirements phase complete — ready for implementation_
