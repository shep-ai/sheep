# Markdown content (the full tasks document)
content: |
  ## Summary

  Eight tasks across four implementation phases create and validate the markdown file.
  Phase 1 composes the prose content (5 min). Phase 2 implements file creation using pathlib
  with TDD cycle: write test (RED, 2 min) → implement with pathlib.write_text() (GREEN, 2 min) →
  verify file properties (REFACTOR, 3 min). Phase 3 implements git workflow with TDD cycle:
  write test for git operations (RED, 2 min) → implement with subprocess (GREEN, 2 min) →
  verify git state (REFACTOR, 2 min). Phase 4 runs end-to-end integration test (2 min).

  All tasks follow TDD methodology with explicit RED/GREEN/REFACTOR steps.
  Total estimated effort: 18 minutes (fits within S-sized 10-15 minute estimate with buffer for verification).
  Dependencies are linear per phases: task-1 → task-2 → task-3 → task-4 (Phase 2),
  task-3 → task-5 → task-6 → task-7 (Phase 3), task-4 + task-7 → task-8 (Phase 4).

  ## Implementation Notes

  **Content Composition (Task 1):**
  Choose an arbitrary prose topic (e.g., nature, philosophy, technology, creativity, etc.).
  Compose exactly 2-3 coherent sentences that are grammatically correct and meaningful.
  Target ~300-400 characters so final file (with H1 heading and newlines) is 300-600 bytes.

  **File Creation (Tasks 2-4):**
  Use pathlib.Path.write_text() which automatically handles UTF-8 encoding and LF line endings on Unix.
  No explicit encoding or newline parameters needed — Python defaults are correct for this use case.
  Verification step checks size is within range (300-600 bytes) and structure is correct.

  **Git Integration (Tasks 5-7):**
  Use subprocess.run() with list-based argument passing for security (no shell injection).
  Include check=True to raise exception on command failure.
  Conventional commit format: `feat(165): Create markdown file test-wqo87w.md with prose content`
  Push command: `git push -u origin HEAD` to push to feature branch.

  **Integration Testing (Task 8):**
  Run all verification tests together to ensure complete workflow functions.
  Log file properties and git state for visibility.
  Confirm all 10 functional requirements (FR-1 through FR-10) are satisfied.
