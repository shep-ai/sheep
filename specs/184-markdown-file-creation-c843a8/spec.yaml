content: |
  ## Problem Statement

  Create a single markdown test file named `test-aikonw.md` in the repository root containing an H1 heading as title and 2-3 sentences of coherent, grammatically correct prose content. The file must be written with UTF-8 encoding and Unix LF line endings. The file must then be staged, committed with a conventional commit message, and pushed to the feature branch.

  This feature executes the well-established pattern from 183+ identical preceding markdown file creation features in the Sheep project (features 1-183). No architectural decisions or research is required; the pattern, tooling, and reusable components are fully proven and documented.

  ## Success Criteria

  - [ ] File `test-aikonw.md` exists in the repository root directory
  - [ ] File contains exactly one H1 (markdown `#`) heading as the title
  - [ ] File contains exactly 2-3 complete, coherent sentences of prose content
  - [ ] File is encoded in UTF-8 with Unix LF line endings (not CRLF)
  - [ ] File passes markdown structure validation (proper H1 syntax, sentence count verified)
  - [ ] Git index contains exactly one new file commit with the new markdown file
  - [ ] Commit message follows Conventional Commits specification (e.g., `feat(184): Create markdown file test-aikonw.md with prose content`)
  - [ ] Feature branch is updated and commit is pushed to remote
  - [ ] No existing files are modified or deleted
  - [ ] No additional files or directories are created

  ## Functional Requirements

  - **FR-1**: The system must create a markdown file named exactly `test-aikonw.md` in the repository root directory
  - **FR-2**: The file must contain exactly one H1 heading (using `#` syntax) that serves as the title
  - **FR-3**: The file must contain exactly 2-3 sentences of coherent, grammatically correct prose after the H1 heading
  - **FR-4**: The file must use UTF-8 encoding and Unix LF line endings for all content
  - **FR-5**: The file must be added to the git staging area
  - **FR-6**: A git commit must be created with a message following the Conventional Commits format (e.g., `feat(184): Create markdown file test-aikonw.md with prose content`)
  - **FR-7**: The commit must be pushed to the feature branch `feat/markdown-file-creation-c843a8`
  - **FR-8**: The file must be validated for correct markdown structure and encoding before commit

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow the established pattern and approach from features 1-183 for consistency and maintainability
  - **NFR-2**: File size should be between 300-600 bytes (consistent with prior test markdown files)
  - **NFR-3**: Prose content must be contextually appropriate, coherent, and free of grammatical errors
  - **NFR-4**: Git commit message must comply with the Conventional Commits specification (descriptive, using feat/docs prefix)
  - **NFR-5**: The implementation must not modify any existing files, configuration, or source code
  - **NFR-6**: The feature must execute successfully on Linux/Unix systems with standard Python 3.11+ and git

  ## Product Decisions

  | # | Question | Recommendation | Rationale |
  | - | -------- | --------------- | --------- |
  | 1 | Should implementation use existing reusable components or custom code? | Use existing reusable components from `content_generators.py` (generate_markdown_content, write_markdown_file, validate_markdown_content) | Ensures consistency with 183+ prior features, reduces code duplication, leverages tested and validated utility functions, follows DRY principle |
  | 2 | How comprehensive should validation be? | Comprehensive validation (file existence, encoding, line endings, markdown structure, sentence count) | Ensures all acceptance criteria are met, catches errors early, prevents invalid commits, low performance cost, utilities already exist in codebase |
  | 3 | How should prose content be generated? | Use CrewAI LLM with `generate_markdown_content()` function | Aligns with agentic philosophy of Sheep platform, creates unique and varied prose, existing reusable function available, more interesting test files than hardcoded alternatives |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 183+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-183; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (pathlib) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/markdown-file-creation-c843a8` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - CrewAI framework and LLM configuration (already available in Sheep platform)

  **Reference/Precedent:**
  - 183+ existing test markdown files (test-*.md) provide clear pattern and examples
  - Previous feature implementations (1-183) demonstrate successful execution of identical pattern
  - Features 181-183 specs provide exact templates and working examples
  - src/sheep/content_generators.py provides reusable utilities (generate_markdown_content, write_markdown_file, _validate_markdown_content, validate_file_properties)
  - src/sheep/tools/ contains git integration utilities for commit and push operations

  **Not Required:**
  - No source code dependencies beyond existing imports
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes)**

  Minimal-effort, single-file creation with well-established precedent:

  - **Content generation**: ~3-5 minutes (generate H1 heading + 2-3 coherent sentences via CrewAI)
  - **File creation and validation**: ~2-3 minutes (write file with UTF-8 encoding, verify structure and properties)
  - **Git workflow**: ~2-3 minutes (stage file, commit with conventional message, push)
  - **Total estimate**: 10-15 minutes

  **Justification:**
  - Well-established pattern with 183+ identical test files providing clear precedent and reusable components
  - No architectural decisions, research, or complex logic required
  - Single file with simple, well-understood format (H1 + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent features (180-183) demonstrate efficient execution in this time range
  - Standard git workflow with no merge conflicts or branch complexity
  - Reusable components in content_generators.py and git tools available for implementation
