# Markdown content (the full tasks document)
content: |
  ## Task Workflow Summary

  The 5 tasks implement a straightforward orchestration of existing reusable components:

  **Phase 1 (Module Setup):** Task 1 creates the feature module skeleton with imports and constants.
  This establishes the pattern-consistent foundation and takes ~15 minutes.

  **Phase 2 (Content & File):** Tasks 2-3 implement the core content creation workflow.
  Task 2 calls generate_markdown_content() to create unique H1+prose via CrewAI LLM (~12 min,
  dominated by API latency). Task 3 calls write_markdown_file() and validate_markdown_file() to
  persist and validate (~10 min).

  **Phase 3 (Git Integration):** Tasks 4-5 add git integration and complete the feature.
  Task 4 commits the file with conventional format (~8 min). Task 5 pushes to remote and
  orchestrates the complete workflow (~10 min, dominated by network I/O).

  **Total:** ~55 minutes, dominated by LLM API latency (3-5 min) and git push network time (1-3 min).
  The actual implementation code work is minimal (~30 min) since we're primarily calling existing
  functions and orchestrating their results.

  ## TDD Approach

  Each task follows the RED-GREEN-REFACTOR cycle:

  - **RED:** Write a test that asserts the desired behavior. Test fails because the feature isn't implemented yet.
  - **GREEN:** Implement the minimal code necessary to pass the test. Test now passes.
  - **REFACTOR:** Clean up, add docstrings, error handling, logging. Test still passes.

  This approach ensures each piece of functionality is validated before moving to the next task.
  The tests can be integration tests (calling the full function) since we're mostly orchestrating
  existing tested components rather than implementing core logic.

  ## Implementation Notes

  - All tasks reuse functions from `sheep.content_generators` and `sheep.tools.git_tools`
  - No modifications to existing source code (only new feature module)
  - Error handling strategy: propagate exceptions to caller (no retry logic in content_generators)
  - Logging at DEBUG level for content generation, INFO level for git operations
  - Return value is a dict with keys: content, file_path, commit_hash, pushed_to_remote, remote_branch
