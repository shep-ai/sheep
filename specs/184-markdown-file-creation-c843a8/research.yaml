decisions:
  - title: "Reuse existing components from content_generators.py"
    chosen: "Use existing reusable functions: generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file"
    rejected:
      - "Implement custom file creation code — duplicates logic from 180+ features, breaks DRY principle, misses tested code paths"
      - "Copy implementation from feature 180 — creates code duplication instead of leveraging shared utilities, reduces maintainability"
    rationale: >
      The Sheep platform is built on component reuse across 184+ features. The content_generators.py
      module provides battle-tested utilities that have successfully created 180+ identical markdown
      files. Using these components ensures consistency, reduces duplication, and leverages proven
      code paths that handle all edge cases (encoding, line endings, validation, commit formatting).

  - title: "CrewAI LLM for markdown content generation"
    chosen: "Use CrewAI's get_reasoning_llm() via generate_markdown_content() function"
    rejected:
      - "Hardcoded content based on filename pattern — loses agentic philosophy, creates repetitive content, reduces test diversity"
      - "Template-based content with rotation — adds template management overhead, limited uniqueness, adds storage burden"
    rationale: >
      The Sheep platform adopts an agentic framework philosophy using CrewAI LLM for content
      generation. The generate_markdown_content() function creates unique, coherent prose for each
      file, aligning with platform design goals. Non-deterministic output ensures test file variety.
      API latency is acceptable for S-sized feature (10-15 minutes total). Infrastructure is already
      in place and proven across features 1-183.

  - title: "Comprehensive markdown and file validation"
    chosen: "Validate file existence, encoding, line endings, markdown structure, and trailing newline"
    rejected:
      - "Basic validation only — misses content errors, allows invalid commits, catches errors late"
      - "No validation — highest risk, commits invalid files, violates acceptance criteria"
    rationale: >
      The validate_markdown_file() utility provides comprehensive validation including structure,
      sentence count, and line ending checks. Performance cost is negligible (binary read and checks).
      Comprehensive validation prevents invalid files from being committed and ensures all acceptance
      criteria are met before pushing. This is standard practice across features 1-183.

  - title: "File I/O approach using pathlib"
    chosen: "Use Python pathlib.Path for file operations (consistent with existing codebase)"
    rejected:
      - "Use os module with string paths — less safe, prone to path traversal issues, inconsistent with codebase"
      - "Use f-strings and direct file open() — bypasses safety checks, no validation of path structure"
    rationale: >
      pathlib.Path is the modern Python standard (3.4+) with cross-platform handling and inherent
      protection against path traversal attacks. The existing codebase uses pathlib exclusively in
      content_generators.py and git_tools.py. The write_markdown_file() function explicitly validates
      filenames for safety before creating paths, establishing the established pattern.

  - title: "Git operations via subprocess"
    chosen: "Use subprocess.run() for git operations via GitCommitTool and GitPushTool (existing approach)"
    rejected:
      - "Use GitPython library — adds external dependency, larger attack surface, overkill for simple operations"
      - "Shell script wrapper with shell=True — security risk from shell injection, less portable"
    rationale: >
      The project uses subprocess.run() with captured output in git_tools.py. This approach is simple,
      auditable (direct command visibility), and requires no external dependencies beyond git itself.
      GitCommitTool and GitPushTool are already tested across features 1-183. Adding external libraries
      would increase complexity and dependency management burden without meaningful benefits.

  - title: "Conventional Commits format for git messages"
    chosen: "Use format 'feat(184): Create markdown file test-aikonw.md with prose content'"
    rejected:
      - "Simplified format — loses semantic information, harder to categorize in logs, violates project conventions"
      - "Long-form message with body — unnecessary verbosity for simple file creation"
    rationale: >
      Conventional Commits is the established standard across the Sheep project (features 1-183).
      The 'feat(N)' prefix indicates feature type, the number enables correlation with feature tracking,
      and the message clearly describes what was created. The commit_markdown_file() function supports
      custom_message parameter. This enables automated changelog generation and structured log analysis.

