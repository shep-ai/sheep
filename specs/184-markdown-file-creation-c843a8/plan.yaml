# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 184 follows the established modular pattern from features 1-183. No new architectural
  patterns or technologies are introduced.

  **Component Structure:**
  - Feature module: `src/sheep/features/feature_184_markdown_file_creation.py`
  - Reuses: `sheep.content_generators` (generate_markdown_content, write_markdown_file, validate_markdown_file)
  - Reuses: `sheep.tools.git_tools` (GitCommitTool, GitPushTool)
  - Reuses: `sheep.config.llm` (get_reasoning_llm via CrewAI)

  **Workflow Pattern:**
  ```
  1. Define constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
  2. Import reusable components
  3. Generate content via LLM
  4. Write and validate file
  5. Commit with conventional message
  6. Push to remote branch
  7. Return result dict
  ```

  This pattern is proven across 180+ identical features. No modifications to core libraries or
  infrastructure required.

  ## Key Design Decisions

  **Decision 1: Reuse Component Functions**
  - Chosen: Leverage existing `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - Alternatives: Implement custom code, copy from feature 183
  - Rationale: Consistency with 1-183, eliminates duplication, leverages tested code paths that handle edge cases (encoding, validation, formatting)

  **Decision 2: CrewAI LLM for Content Generation**
  - Chosen: Use `get_reasoning_llm()` via existing `generate_markdown_content()` function
  - Alternatives: Hardcoded content, template-based rotation
  - Rationale: Aligns with platform's agentic philosophy, creates unique prose for each file, infrastructure already configured and proven

  **Decision 3: Comprehensive Validation**
  - Chosen: Validate file existence, UTF-8 encoding, LF line endings, markdown structure (H1), sentence count (2-3), trailing newline
  - Alternatives: Basic validation, no validation
  - Rationale: Ensures all acceptance criteria met, prevents invalid commits, catches errors early, performance cost negligible

  **Decision 4: Feature Module Pattern**
  - Chosen: Create `src/sheep/features/feature_184_markdown_file_creation.py` with module constants and orchestration function
  - Alternatives: Inline script, direct content_generators calls
  - Rationale: Consistency with 180+ features, enables standalone testing, clear documentation, separable logic

  **Decision 5: Git Operations via Subprocess**
  - Chosen: Use `GitCommitTool` and `GitPushTool` from `git_tools.py`
  - Alternatives: GitPython library, shell scripts
  - Rationale: Simple, auditable (direct command visibility), no external dependencies, proven across features 1-183

  **Decision 6: Conventional Commits Format**
  - Chosen: Use format `feat(184): Create markdown file test-aikonw.md with prose content`
  - Alternatives: Simplified format, long-form body
  - Rationale: Established project standard, semantic information preserved, enables automated changelog generation

  ## Implementation Strategy

  **Phase 1: Feature Module Setup** (minimal)
  - Create `src/sheep/features/feature_184_markdown_file_creation.py`
  - Define constants: FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE
  - Import reusable components from content_generators and git_tools
  - Create orchestration function signature
  - Rationale: Establishes pattern-consistent structure, separates feature logic

  **Phase 2: Content Generation & File Creation** (core workflow)
  - Implement generate_markdown_content() call to create H1 + prose
  - Implement write_markdown_file() call to persist with UTF-8 and LF
  - Implement validate_markdown_file() call to verify structure
  - Rationale: Executes the primary feature requirement with validation guardrails

  **Phase 3: Git Integration & Workflow** (finalization)
  - Implement commit_markdown_file() call with conventional format
  - Implement push_markdown_file() call to remote
  - Return result dict with status and metadata
  - Rationale: Completes the feature delivery cycle with proven git integration

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API failure | Propagate exceptions to caller; implementation phase can add retry logic if needed |
  | Invalid markdown content | Comprehensive validation (validate_markdown_file) catches errors before commit |
  | File encoding/line ending issues | pathlib and UTF-8 with explicit LF validation ensure consistency |
  | Accidental modification of existing files | Workflow only writes one new file; validation checks git status |
  | Git push failure | GitPushTool handles authentication; feature branch pre-exists |
  | Module import errors | Component functions already proven across 180+ features |

