# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 100+ times. This feature creates a single
  test markdown file (`test-w2a3c4.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 100+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 001-100.

  ## Success Criteria

  - [ ] File `test-w2a3c4.md` exists at repository root
  - [ ] File contains exactly one H1 markdown heading as title (first non-empty line starts with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading (separated by blank line)
  - [ ] Markdown syntax is valid (parseable by standard markdown processors without warnings)
  - [ ] Prose content is grammatically correct and coherent
  - [ ] File uses UTF-8 encoding without BOM (byte order mark)
  - [ ] File uses Unix-style line endings (LF: `\n` only, not CRLF: `\r\n`)
  - [ ] File size is within 320-600 bytes (observed range from prior test files)
  - [ ] File is staged in git (appears in `git status` staging area)
  - [ ] Commit message follows conventional format: `feat(101): create markdown file test-w2a3c4.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/101-markdown-file-creation-dd776c`
  - [ ] Repository shows no uncommitted changes after implementation

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with filename exactly `test-w2a3c4.md`
  - **FR-2**: File must contain one H1 markdown heading (using `#` syntax) as the title/first line
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading, separated by blank line
  - **FR-4**: File must be created using standard Python pathlib module: `Path("test-w2a3c4.md").write_text(content)`
  - **FR-5**: Stage file with git using standard git command: `git add test-w2a3c4.md`
  - **FR-6**: Commit file with conventional commit message: `feat(101): create markdown file test-w2a3c4.md with prose content`
  - **FR-7**: Push commit to feature branch using git command: `git push` or `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: Markdown syntax must be valid — file must parse correctly in standard markdown processors without errors or warnings
  - **NFR-2**: Prose content must be grammatically correct, coherent, contextually appropriate, and professional in tone
  - **NFR-3**: File encoding must be UTF-8 without byte order mark (BOM)
  - **NFR-4**: Line endings must be Unix-style (LF: `\n` only, not CRLF: `\r\n`)
  - **NFR-5**: File size should fall within 320-600 bytes (observed range from prior test files 001-100)
  - **NFR-6**: Implementation must follow established pattern from features 001-100 without deviation
  - **NFR-7**: No modifications to existing files; implementation is purely additive (new file only, no overwrites)
  - **NFR-8**: Implementation should complete in approximately 10-15 minutes of actual work
  - **NFR-9**: Prose topic can be any appropriate subject; generic/universal topics are preferred for consistency with prior test files

  ## Product Questions & Decisions

  **Analysis**: No ambiguous product decisions identified. Feature requirements are fully determined by the established pattern from 100+ prior identical implementations (features 001-100). All functional, non-functional, and success criteria are clearly defined with no alternative approaches under consideration.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 100+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/101-markdown-file-creation-dd776c/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile** and **docker-compose.yml**: Container configuration for the platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as a collection of proof-of-concept
  test cases for the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (100+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/101-markdown-file-creation-dd776c`
  - Create/modify files in working directory
  - Stage with `git add test-w2a3c4.md`
  - Commit with conventional commit format: `feat(101): create markdown file test-w2a3c4.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 001-100):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-w2a3c4.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content
  - **CrewAI**: Underlying agentic platform (from README and dependencies) — not directly involved in this feature

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-w2a3c4.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites of existing content |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact application code or modules |
  | Configuration Files | None | No modifications to pyproject.toml, .env, Dockerfile, or other configuration files |
  | Specifications Directory | None | No modifications to existing specs; this spec file itself is the only spec updated |
  | Documentation | None | No changes to README.md, ABOUT_ME.md, or other documentation files |
  | Test Suite | None | No modifications to test infrastructure or test files |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/101-markdown-file-creation-dd776c` must already exist
  - **File system permissions**: Write access to repository root directory (standard in development environments)
  - **Established pattern**: 100+ test files (features 001-100) provide clear precedent for content structure and format
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits to succeed
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown H1 heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size within bounds)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 100+ prior features (001-100) with identical requirements
  - Flexible topic selection with no research, architectural decisions, or design choices required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 001-100 demonstrate efficient implementation of identical tasks within 10-15 minute window
  - Pattern is simple enough to implement without external libraries or complex logic

