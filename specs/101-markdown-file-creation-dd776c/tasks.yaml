content: |
  ## Summary

  Feature 101 implementation comprises 4 focused tasks across 2 sequential phases, each task in the
  TDD cycle (RED → GREEN → REFACTOR).

  **Phase 1: File Creation** establishes the core deliverable — a markdown file with H1 heading,
  prose content, proper encoding (UTF-8 without BOM), Unix line endings (LF only), and size within
  the 320-600 byte range. The single task in this phase validates all functional and non-functional
  requirements for the file itself.

  **Phase 2: Git Integration** executes the workflow from the staged file through final push,
  implementing FR-5 (git add), FR-6 (conventional commit), and FR-7 (git push to feature branch).
  Three sequential tasks handle staging, committing, and pushing, with each task depending on
  successful completion of the previous one.

  Total estimated effort is ~16 minutes: 10 minutes for file creation and validation, 2 minutes each
  for staging, committing, and pushing. This aligns with the feature's S (Small) size estimate and
  follows the established pattern from 100+ identical prior features.

  No parallelization is possible — all tasks are sequential due to natural dependencies (file must
  exist before staging, staged changes must be committed before pushing, etc.). Implementation
  follows straightforward TDD cycles: verify preconditions (RED), perform core action (GREEN),
  validate postconditions (REFACTOR).
