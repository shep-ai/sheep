content: |
  ## Architecture Overview

  Feature 101 is an isolated, pattern-based implementation with 100+ established precedents (features 001-100).
  The architecture is minimal and straightforward:

  - **Repository Root**: Single new markdown file (test-w2a3c4.md) created alongside existing 100+ test files
  - **No Source Code Impact**: Feature does not depend on or modify `/src/sheep/` application code
  - **No Configuration Changes**: No modifications to pyproject.toml, environment files, or build configuration
  - **No Test Suite Impact**: Feature is purely additive; no test code or test infrastructure changes required
  - **Isolated Git Workflow**: Single commit to pre-existing feature branch with no merge conflicts or branch complexity

  The feature replicates the established pattern from features 001-100 exactly: use Python pathlib for file I/O,
  ensure proper encoding and line endings, add prose content about a generic topic, then follow standard git
  workflow (add, commit, push). No architectural decisions, no cross-cutting concerns, no integration complexity.

  ## Key Design Decisions

  ### 1. File Creation Method: Python pathlib with Explicit UTF-8 Encoding

  **Decision**: Use `Path("test-w2a3c4.md").write_text(content, encoding='utf-8')` for file creation.

  **Alternatives Rejected**:
  - `open()` with context manager — more verbose, not specified in FR-4
  - Shell subprocess — adds process overhead, violates FR-4 requirement for pathlib
  - Third-party libraries — unnecessary when pathlib is part of Python 3.11+ stdlib

  **Rationale** (from research):
  - FR-4 explicitly requires pathlib: "File must be created using standard Python pathlib module"
  - `write_text(encoding='utf-8')` provides atomic operations and handles UTF-8 without BOM correctly
  - Matches established pattern from 100+ prior test files
  - No external dependencies required — uses only Python stdlib
  - Platform-independent: works consistently on Windows, macOS, Linux

  ### 2. Prose Content: Hand-Written Grammatically Correct Text

  **Decision**: Generate hand-written prose (2-3 sentences) about a generic/universal topic (e.g., "The Power of Continuous Learning").

  **Alternatives Rejected**:
  - Lorem Ipsum placeholder text — violates NFR-2 (must be grammatically correct and contextually appropriate)
  - Randomized or AI-generated content — risks inconsistency in quality and tone
  - Minimal or template text — while acceptable, hand-written prose better ensures NFR-2 standards

  **Rationale** (from research):
  - NFR-2 requires prose to be "grammatically correct, coherent, contextually appropriate, and professional in tone"
  - NFR-9 specifies "generic/universal topics are preferred for consistency with prior test files"
  - Topics like education, communication, innovation, professional development align with features 001-100
  - Hand-written prose ensures quality control and consistency
  - 2-3 complete sentences about a single coherent idea naturally achieves 320-600 byte target

  ### 3. Git Integration: Standard Bash Commands

  **Decision**: Use standard bash/shell git commands for add, commit, and push operations.

  **Alternatives Rejected**:
  - GitPython library — adds external dependency when bash commands are simpler
  - pygit2 — adds C dependency and external package
  - Python subprocess wrapper — more complex and fragile than bash

  **Rationale** (from research):
  - FR-5, FR-6, FR-7 explicitly specify using "standard git command"
  - Bash is available in all development environments
  - No external dependencies required
  - Matches established pattern from features 001-100
  - Conventional commit message enforced by hardcoded message string

  ### 4. Encoding and Line Endings: UTF-8 without BOM, LF Only

  **Decision**: Use `Path.write_text(content, encoding='utf-8')` with explicit `\n` line endings in content string.

  **Alternatives Rejected**:
  - Binary mode with manual encoding — error-prone; `write_text()` handles correctly
  - Platform-default line endings — violates NFR-4 requirement for LF only (risks CRLF on Windows)
  - Low-level `.encode()` and `write_bytes()` — unnecessarily complex when `write_text()` works correctly

  **Rationale** (from research):
  - NFR-3: File encoding must be UTF-8 without BOM — pathlib defaults to UTF-8 without BOM on all platforms
  - NFR-4: Unix-style line endings (LF: `\n` only) — explicit `\n` characters in content ensure platform-independent LF encoding
  - `write_text(encoding='utf-8')` is portable, correct, and handles encoding atomically
  - Approach works consistently on Windows, macOS, and Linux

  ## Implementation Strategy

  The implementation follows two sequential phases corresponding to the two major aspects of the feature:

  **Phase 1: File Creation** (first priority)
  - Create markdown content with H1 heading and 2-3 sentences of prose
  - Use pathlib to write file with UTF-8 encoding and explicit LF line endings
  - Validate file meets all requirements: encoding, line endings, file size, markdown syntax

  **Phase 2: Git Integration** (depends on Phase 1)
  - Stage file in git (FR-5)
  - Create commit with conventional message (FR-6)
  - Push to feature branch (FR-7)
  - Verify no uncommitted changes remain

  **Phase Ordering Rationale**:
  - File must exist before git operations can stage/commit it
  - File must be completely valid (encoding, size, syntax) before staging to avoid re-staging
  - Sequential phases align with natural workflow order and spec dependencies
  - No parallelization opportunities — each phase depends on previous phase completion

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Incorrect encoding (CRLF on Windows) | Low | Explicit `\n` characters in content string + `write_text(encoding='utf-8')` ensures platform-independent LF encoding |
  | File size outside 320-600 bytes | Very Low | Simple prose naturally achieves size range; heading ~30-50 bytes + 3 sentences ~250-400 bytes = total ~300-450 bytes |
  | Invalid markdown syntax | Very Low | Simple format (H1 + prose) is trivial; hand-written prose avoids parsing issues |
  | Git authentication/configuration failures | Very Low | Feature branch already exists; standard git configuration (user.name, user.email) is prerequisite |
  | Uncommitted changes remain after push | Very Low | Follow sequential workflow: create → validate → stage → commit → push → verify git status clean |
  | File already exists | Very Low | New feature; test-w2a3c4.md should not exist yet; verify before creation if needed |

