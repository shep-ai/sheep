  ## Codebase Analysis

  ### Project Structure
  ```
  src/sheep/                  # Main package
  ├── __init__.py             # Package init, version
  ├── cli.py                  # Typer CLI with commands: implement, chat, config, init
  ├── config/
  │   ├── settings.py         # Pydantic Settings (LLM, Langfuse, Git config)
  │   └── llm.py              # LLM factory functions
  ├── agents/
  │   ├── code_agents.py      # CrewAI agents: researcher, implementer, reviewer
  │   └── general_agents.py   # General-purpose agents
  ├── flows/
  │   ├── code_implementation.py  # Main Flow: setup → research → implement → review → commit
  │   └── chat.py             # Chat flow
  ├── tools/
  │   ├── file_tools.py       # FileRead, FileWrite, FileSearch, DirectoryTree tools
  │   ├── git_tools.py        # Git operation tools (branch, commit, push, worktree, etc.)
  │   └── web_tools.py        # Web search tools
  └── observability/
      ├── logging.py          # Structured logging with structlog
      └── langfuse_client.py  # Langfuse integration
  tests/                      # Pytest test suite
  specs/                      # Feature specifications
  ```

  ### Architecture Patterns
  - **Agentic architecture**: Uses CrewAI framework with specialized agents (researcher, implementer, reviewer)
  - **Flow-based orchestration**: `Flow[State]` pattern with `@start`, `@listen`, `@router` decorators for multi-step workflows
  - **Pydantic everywhere**: Settings, state, tool inputs all use Pydantic models
  - **Tool abstraction**: Custom tools extend `crewai.tools.BaseTool` with typed input schemas
  - **CLI layer**: Typer-based CLI that invokes flows
  - **Observability**: Langfuse + OpenTelemetry/OpenInference for tracing agent execution

  ### Relevant Technologies
  - **CrewAI** (>=0.86.0): Core agent framework, provides Agent, Task, Crew, Flow primitives
  - **Pydantic Settings**: Environment-based configuration with `.env` file support
  - **Typer + Rich**: CLI interface with formatted terminal output
  - **GitPython**: Git operations for branch management, commits, pushes
  - **Langfuse**: Observability platform for tracing LLM calls and agent flows

