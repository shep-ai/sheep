content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-lvd4vq.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  235+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is continuation 238 of the markdown-file-creation pattern established in features
  069-237, with identical requirements and implementation approach. All architectural and design
  decisions have been pre-determined through these precedents.

  ## Success Criteria

  - [ ] Markdown file named `test-lvd4vq.md` created at repository root
  - [ ] File contains a valid markdown H1 heading as the title (format: `# Title`)
  - [ ] File contains blank line after heading
  - [ ] File contains exactly 2-3 sentences of prose content on any topic
  - [ ] File uses UTF-8 encoding and LF line endings
  - [ ] File is staged in git using `git add test-lvd4vq.md`
  - [ ] Commit created with conventional commit message matching established pattern
  - [ ] All commits pushed to feature branch `feat/238-markdown-file-creation-23f4ef` without conflicts
  - [ ] Markdown syntax is valid per CommonMark specification
  - [ ] File size is between 300-700 bytes (typical for established pattern)

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly `test-lvd4vq.md` in the repository root directory
  - **FR-2**: File must contain markdown H1 heading (`# Title`) as the first content line
  - **FR-3**: H1 heading must be followed by exactly one blank line
  - **FR-4**: File must contain 2-3 sentences of coherent prose content on any topic chosen by the implementer
  - **FR-5**: Stage the created file using git add command
  - **FR-6**: Create git commit with message following conventional commit format: `feat(238): Create markdown file test-lvd4vq.md with prose content`
  - **FR-7**: Push all commits to feature branch `feat/238-markdown-file-creation-23f4ef`
  - **FR-8**: Implementation must not modify any existing files or directory structure

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (no BOM)
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF (Windows-style)
  - **NFR-3**: Markdown syntax must conform to CommonMark specification
  - **NFR-4**: Conventional commit message must follow established repository pattern (type(scope): description)
  - **NFR-5**: Implementation must complete within estimated 10-15 minutes
  - **NFR-6**: File must be readable and properly formatted with no syntax errors
  - **NFR-7**: Git operations must complete without merge conflicts or push failures

  ## Product Decisions

  No open product questions. All architectural and design decisions have been determined by precedent from
  features 069-237, which follow the identical markdown-file-creation pattern. The implementation approach,
  file format, content requirements, and git workflow are fully specified and proven through 170+ successful
  implementations.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (`test-lvd4vq.md`) to existing collection of 235+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (300-700 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-237; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in `/src/sheep/` or elsewhere |
  | Specs Directory | Low | Updates only this `spec.yaml` file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git Repository**: Feature branch `feat/238-markdown-file-creation-23f4ef` must exist and be checked out (pre-created)
  - **File System**: Write access to repository root directory (already available)
  - **Git Configuration**: Standard git configuration (`user.name`, `user.email`) must be set up for commits
  - **Python Runtime**: Python 3.11+ with `pathlib` module (available in standard library; no external dependencies)
  - **Established Pattern**: 235+ test files provide clear, proven precedent for content format and structure
  - **File Naming**: Filename `test-lvd4vq.md` is specified in feature requirement and must be used exactly as provided

  ## Size Estimate

  **S (Small)** — Estimated 10-15 minutes of implementation time:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose on a chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 235+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-237) demonstrate consistent 10-15 minute implementation time
  - File naming is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 200+ prior implementations
  - All technical decisions pre-determined; implementation is straightforward execution
