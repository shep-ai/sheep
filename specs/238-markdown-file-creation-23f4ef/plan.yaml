content: |
  ## Architecture Overview

  Feature 238 follows the well-established pattern from 200+ identical implementations (features 069-237),
  requiring no new architectural decisions or code patterns. The implementation is a single Python script
  that creates a markdown file and executes the standard git workflow.

  ### Key Characteristics
  - **Scope:** Single file creation at repository root (test-lvd4vq.md)
  - **Content Format:** Markdown H1 heading + blank line + 2-3 sentences of prose
  - **No Source Code Impact:** Feature does not modify /src/sheep/ or any application logic
  - **No Schema Changes:** No database, configuration, or dependency modifications
  - **Pattern Match:** Identical to features 235, 236, 237 (verified from git log and existing test files)
  - **Integration:** Standalone script at repository root; no integration with build system or application code

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path("test-lvd4vq.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:**
  - Modern Python standard approach (PEP 3151, standard since 3.4)
  - Explicit `encoding="utf-8"` ensures UTF-8 without BOM (requirement NFR-1)
  - `newline="\n"` forces Unix LF line endings on all platforms including Windows (requirement NFR-2)
  - Automatic resource cleanup (no manual file handle management)
  - Matches proven pattern from 200+ prior implementations
  - No external dependencies; standard library only

  **Alternatives Rejected:**
  - Low-level `open()/write()`: less readable, requires manual resource cleanup, more error-prone
  - `os.open()`: requires manual mode specification, not recommended modern approach
  - Shell scripting (`echo`/`cat`): command injection risk, platform-dependent line ending handling

  ### 2. Git Integration: subprocess.run() with list-based arguments

  **Decision:** Use `subprocess.run(["git", "add", filename], check=True)` for all git operations

  **Rationale:**
  - Secure standard library approach (eliminates command injection by avoiding shell interpretation)
  - `check=True` raises CalledProcessError on non-zero exit, enabling proper error diagnosis
  - Matches established pattern from features 069-237 (verified from feature 231 implementation)
  - Avoids external dependencies (GitPython library not needed for simple operations)
  - Clear control over command execution, stderr capture, and error handling

  **Alternatives Rejected:**
  - `shell=True` with string commands: command injection vulnerability risk if any input involved
  - `os.system()`: deprecated, poor error handling, less portable
  - GitPython library: adds external dependency when standard library suffices

  ### 3. Content Format: H1 Heading + Blank Line + Prose

  **Decision:** Format file as:
  ```
  # Title

  2-3 sentences of prose content on any topic.
  ```

  **Rationale:**
  - H1 is semantic markdown standard for document titles (CommonMark specification)
  - Blank line after heading improves readability and matches all 235+ existing test files
  - 2-3 sentences provides coherent content while staying within 300-700 byte target (NFR requirement)
  - Flexible topic selection per spec ("anything" / "any topic") — implementer chooses meaningful topic at creation time
  - Content format verified against existing test files (test-08hm34.md, test-0qakgw.md, test-wxtr9o.md)

  **Alternatives Rejected:**
  - H2/H3 headings: reduces semantic clarity and document hierarchy per CommonMark spec
  - No blank line after heading: violates established 235+ test file pattern, reduces readability
  - Single long paragraph: lacks structure; 2-3 sentences provides better balance

  ### 4. Commit Message: Conventional Commit Format

  **Decision:** Use `feat(238): Create markdown file test-lvd4vq.md with prose content`

  **Rationale:**
  - Conventional Commit format (type(scope): description) is repository standard
  - Verified by git log: features 237, 236, 235, 234, 233 all use identical format
  - Enables automated changelog generation and semantic versioning tooling
  - Scope number (238) clearly identifies feature; description states action and filename
  - Feature number in scope matches established pattern across 200+ implementations

  **Alternatives Rejected:**
  - Generic messages like "Add file": lose semantic information, harder to parse
  - Detailed multi-paragraph messages: unnecessary verbosity for simple file creation
  - Different scoping conventions: would be inconsistent with repository standard

  ### 5. Error Handling: Specific Exception Types with stderr Output

  **Decision:** Catch FileExistsError, OSError, subprocess.CalledProcessError with descriptive stderr messages

  **Rationale:**
  - Specific exception handling enables clear diagnosis of three failure categories:
    * File system issues (OSError: permission denied, disk full, etc.)
    * File existence conflicts (FileExistsError: prevents silent overwrites)
    * Git command failures (CalledProcessError: git add/commit/push failures)
  - Matches established pattern from feature 231 implementation (precedent documented in research)
  - Error messages logged to stderr are appropriate for operational observability
  - Exit with code 1 on failure enables reliable automation and pipeline integration
  - Defensive check for file existence prevents accidental overwrites

  **Alternatives Rejected:**
  - No error handling: fails to diagnose problems, makes debugging difficult for operators
  - Broad Exception catch: masks programming errors, less useful error messages
  - Silent failures: operators have no visibility into what went wrong

  ## Implementation Strategy

  ### Phase 1: Script Development
  Create create_markdown_file_238.py with complete implementation logic:
  - File creation with pathlib using explicit UTF-8 encoding and LF line endings
  - Defensive FileExistsError check to prevent accidental overwrites
  - Git add, commit, push operations using subprocess with list-based arguments
  - Specific error handling for file system and git command failures with stderr output
  - Exit code 0 on success, 1 on failure for pipeline integration

  This phase produces a reusable, auditable script that can be version-controlled and used for testing
  or future re-runs. The implementation will match the style and structure of create_markdown_file_237.py
  (or most recent feature script) to ensure consistency with the proven pattern.

  ### Phase 2: Execution & Verification
  Execute the script to create the markdown file and verify all success criteria:
  - File exists at repository root with correct filename (test-lvd4vq.md)
  - File contains valid H1 heading, blank line, and 2-3 sentences of prose
  - File uses UTF-8 encoding without BOM
  - File uses Unix LF line endings (not Windows CRLF)
  - File size is within 300-700 byte target (typical for established pattern)
  - Git status shows file staged (in git index)
  - Git commit log contains conventional commit message with feature number
  - Git push succeeds with no conflicts
  - Feature branch contains the new commit

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | File already exists | Low | FileExistsError check prevents silent overwrite; operator sees clear error message |
  | Git push fails (network/auth) | Medium | CalledProcessError caught with stderr output; operator can diagnose and retry |
  | Wrong encoding on Windows | Very Low | `encoding="utf-8"` parameter enforces UTF-8 explicitly regardless of platform default |
  | CRLF line endings on Windows | Very Low | `newline="\n"` forces LF on all platforms including Windows per Python spec |
  | Git credentials not configured | Low | Standard git error message to stderr; operator must configure git before running |
  | Permission denied (repo write access) | Very Low | OSError caught; likely environmental issue caught during testing |
  | Filename conflict with existing test file | Low | Spec provides exact filename (test-lvd4vq.md); low risk in automated context |

  ## Testing & Validation

  Per spec requirement "No validation layer per spec" — implementation creates file without post-hoc
  validation checks. Validation of markdown syntax, file size, encoding, and git operations will be
  performed by:
  - Manual inspection of created file (readable content, correct structure)
  - Git log inspection (conventional commit message present and correct)
  - Git status check (file successfully staged and pushed)
  - Subsequent CI/CD pipeline validation (if enabled)

  This aligns with feature 231 design choice documented in research: "No validation, create only".

  ## Success Criteria Mapping

  Implementation addresses all functional and non-functional requirements:

  | Requirement | Implementation Approach |
  | ----------- | ----------------------- |
  | FR-1: Markdown file named test-lvd4vq.md | pathlib.Path("test-lvd4vq.md").write_text() |
  | FR-2: H1 heading as first content line | Content format: "# Title\n\n..." |
  | FR-3: Blank line after H1 heading | Content format includes explicit blank line |
  | FR-4: 2-3 sentences of prose | Flexible topic selection with meaningful prose sentences |
  | FR-5: git add command | subprocess.run(["git", "add", "test-lvd4vq.md"], check=True) |
  | FR-6: Conventional commit message | "feat(238): Create markdown file test-lvd4vq.md with prose content" |
  | FR-7: Push to feature branch | subprocess.run(["git", "push"], check=True) |
  | FR-8: Don't modify existing files | Script creates only new file; no modifications |
  | NFR-1: UTF-8 no BOM | encoding="utf-8" parameter in pathlib.write_text() |
  | NFR-2: LF line endings | newline="\n" parameter in pathlib.write_text() |
  | NFR-3: CommonMark compliance | H1 heading + blank line + prose format matches CommonMark spec |
  | NFR-4: Conventional commit format | Matches established pattern from features 069-237 |
  | NFR-5: Complete within 10-15 minutes | Script development + execution estimated at 30-45 min (includes TDD) |
  | NFR-6: Readable, no syntax errors | Manual verification after execution |
  | NFR-7: No merge conflicts | Standard push to feature branch; no conflicts expected |

  ## Technical Dependencies

  - **Python 3.11+** with pathlib, subprocess, sys (all in standard library)
  - **Git CLI** pre-installed and configured (`user.name`, `user.email` set)
  - **Feature branch** `feat/238-markdown-file-creation-23f4ef` must be checked out (pre-created)
  - **Write access** to repository root directory (available in normal working environment)
  - **Established precedent:** 235+ existing test files in repository demonstrating successful pattern
