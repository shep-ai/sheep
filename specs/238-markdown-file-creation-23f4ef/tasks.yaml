content: |
  ## Summary

  Feature 238 implementation consists of 2 ordered tasks across 2 implementation phases:

  **Phase 1: Script Development (Task 1)**
  Create the create_markdown_file_238.py script that implements the file creation and git workflow.
  The script uses Python pathlib for file I/O (explicit UTF-8 encoding and LF line endings) and
  subprocess for safe git command execution (list-based args, no shell interpretation). The script
  includes defensive file existence checks and specific error handling for file system and git
  command failures.

  **Phase 2: Execution & Verification (Task 2)**
  Execute the script to create the markdown file and complete the full git workflow (add, commit,
  push). Verify that the file is created with correct format (H1 heading, blank line, 2-3 sentences
  of prose), uses UTF-8 encoding and LF line endings, and that all git operations complete
  successfully (file staged, committed with conventional message, pushed to feature branch).

  Total estimated effort: 45-65 minutes including TDD cycles (red/green/refactor for each task).

  ## Task Breakdown Rationale

  **Why 2 tasks (not 1 monolithic task)?**
  - Task 1 (script creation) separates implementation logic from execution/verification
  - This allows code review of the script before execution
  - Enables reusability and re-runs if needed
  - Matches pattern from features 069-237 (all created standalone scripts)

  **Why this order (script first, then execute)?**
  - Script must exist before it can be executed
  - Logical dependency: Task 2 depends on Task 1
  - Enables parallel code review and script refinement before commit
  - Standard development workflow: implement → test → verify

  **TDD Cycle Per Task:**
  - **Task 1 RED:** Script doesn't exist yet; can't import or run
  - **Task 1 GREEN:** Create script with complete implementation (file creation + git workflow)
  - **Task 1 REFACTOR:** Match style of feature 237 script; verify error handling; clean up code
  - **Task 2 RED:** File doesn't exist; git operations not completed yet
  - **Task 2 GREEN:** Execute script; verify file created and git operations complete
  - **Task 2 REFACTOR:** Verify encoding, line endings, markdown syntax, commit message format, all spec requirements

  ## Integration with Feature 237 Pattern

  Both Task 1 and Task 2 acceptance criteria explicitly reference feature 237 as the pattern source:
  - Script structure and style should match create_markdown_file_237.py
  - Content format matches existing test files (H1 + blank line + prose)
  - Git workflow (add → commit → push) follows established pattern
  - Error handling approach matches feature 231 (documented in research)
  - Commit message format verified against git log of features 237, 236, 235, 234, 233

  This ensures consistency with 200+ prior implementations and reduces risk of deviations from
  established, proven patterns.

  ## Success Metrics

  Implementation is complete when:
  1. Script exists and executes without errors
  2. File test-lvd4vq.md exists at repository root with correct content
  3. File uses UTF-8 encoding with LF line endings (verified via file inspection)
  4. File is staged in git index (git status shows staged)
  5. Git commit log contains feature 238 conventional commit message
  6. Git push completes successfully with no merge conflicts
  7. Feature branch contains the new commit
  8. All spec success criteria are met (all checkboxes in spec.yaml marked complete)

  ## Rollback Plan

  If execution fails or results are incorrect:
  1. Delete created file: `git rm test-lvd4vq.md`
  2. Revert commit: `git reset --soft HEAD~1` or `git revert HEAD`
  3. Fix script issues in Task 1 and re-execute Task 2
  4. No other files or git history affected by simple revert
  5. Feature is atomic and easy to undo

  ## Dependencies

  - Feature branch `feat/238-markdown-file-creation-23f4ef` must be checked out
  - Git must be configured (`git config user.name` and `git config user.email` must be set)
  - Python 3.11+ with pathlib and subprocess (standard library)
  - Write access to repository root directory
