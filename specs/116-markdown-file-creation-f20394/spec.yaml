content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern that has been repeated 115+ times in the current repository. This feature creates a single test markdown file (`test-45ndys.md`) at the repository root with a markdown heading as title and 2-3 sentences of prose content.

  This is a continuation of the markdown-file-creation pattern established in features 069-115, with identical requirements and implementation approach. The pattern serves as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-45ndys.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains blank line separating the heading from prose content
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] File size is between 400-600 bytes
  - [ ] File is staged in git (`git add test-45ndys.md` succeeds)
  - [ ] Git commit exists with message: `feat(116): Create markdown file test-45ndys.md with prose content`
  - [ ] Commit includes only the markdown file (no extraneous changes)
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-45ndys.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (`#`) serving as the title
  - **FR-3**: A blank line must separate the heading from the prose content
  - **FR-4**: File must contain exactly 2-3 sentences of prose content after the heading
  - **FR-5**: Stage the created file using `git add test-45ndys.md`
  - **FR-6**: Create a git commit with the message: `feat(116): Create markdown file test-45ndys.md with prose content`
  - **FR-7**: Push the commit to remote origin on the feature branch `feat/116-markdown-file-creation-f20394`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (byte order mark) to maintain consistency with existing test files
  - **NFR-2**: Line endings must be Unix-style LF (`\n`) to maintain consistency across platforms and with existing files
  - **NFR-3**: File size should be between 400-600 bytes (typical range for files following this pattern)
  - **NFR-4**: Implementation must follow the established pattern from features 069-115 to ensure consistency and predictability
  - **NFR-5**: Implementation should complete in approximately 10-15 minutes, consistent with prior markdown-file-creation features
  - **NFR-6**: Code must be compatible with Python 3.11+ (using only standard library features like pathlib.Path)
  - **NFR-7**: Markdown content must follow CommonMark specification for valid syntax

  ## Product Questions & AI Recommendations

  ### Decision: Prose Content Topic

  **Question**: Should the prose content cover a specific topic or allow implementer flexibility?

  **Resolved**: Yes — AI default applies

  **Options**:
  - **Option A** (Selected): Implementer chooses any topic
    - Description: Full flexibility to select prose topic; implementer decides what the file is "about"
    - Rationale: Aligns with original "about anything" requirement; maintains consistency with 100+ prior implementations; reduces specification overhead; allows creative expression
  - **Option B**: Prescribe specific topic
    - Description: Feature specification defines a required topic (e.g., "about software engineering" or "about markdown")
    - Rationale: Removes ambiguity; may aid in automated content generation; adds specificity
    - Trade-off: Reduces flexibility; requires topic definition for each feature; more rigid implementation

  **AI Recommendation**: Implementer chooses any topic (Option A)

  **Rationale**: The requirement "about anything" explicitly grants flexibility. This approach (1) matches the original user query and all 100+ prior implementations, (2) reduces specification overhead, (3) enables creative freedom, and (4) has proven effective across the established pattern. Prescribing a topic would add unnecessary constraint without clear benefit.

  ---

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Repository root**: Contains 100+ test markdown files (test-*.md) and reference markdown files (DESIGN_PATTERN.md, STATE_MACHINE.md, etc.) following a consistent pattern
  - **src/sheep/**: Application source code organized into modules (agents, config, flows, tools, observability, CLI)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/116-markdown-file-creation-f20394/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with dependencies and build configuration
  - **.github/workflows/**: GitHub Actions CI/CD workflows
  - **Dockerfile**: Container configuration for deployment
  - **README.md**: Project documentation describing Sheep as an agentic platform using CrewAI

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature pattern (features 069-116) and do not form part of the core application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (100+ precedents in features 069-115):
  - Simple file creation using Python `pathlib.Path` for I/O operations
  - Each markdown file follows consistent format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, LF line endings (Unix style)
  - File size typically 400-600 bytes
  - Prose topics are flexible ("about anything") allowing implementer creativity
  - Implementation follows straightforward imperative code (compose content string, write to file)

  **Git Workflow Pattern** (observed in all markdown-file-creation features):
  - Feature branch pre-created by system (e.g., feat/116-markdown-file-creation-f20394)
  - Single markdown file created in repository root
  - File staged with `git add test-45ndys.md`
  - Commit with conventional commit format: `feat(116): Create markdown file test-45ndys.md with prose content`
  - Push to feature branch origin
  - No modifications to source code, tests, or configuration files

  **Feature Implementation Pattern** (verified across features 069-115):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Predictable execution time: 10-15 minutes per feature

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml); `pathlib.Path` from standard library used for file I/O
  - **Markdown (CommonMark)**: Simple format with H1 heading (`# Title`) and prose content; valid syntax required
  - **Git**: Version control system for file staging (`git add`), committing (conventional commit format), and pushing to remote
  - **File system**: Read/write access to repository root directory for file creation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-45ndys.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-115; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on, call, or impact any source code |
  | Tests | None | No test modifications or test execution required; feature is self-validating through file existence and structure |
  | Configuration | None | No changes to pyproject.toml, .env, or other configuration files |
  | Specs Directory | Low | This analysis updates only the current spec.yaml file; no impact on other feature specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/116-markdown-file-creation-f20394` must exist (pre-created by system)
  - **File system**: Write access to repository root directory (standard in development environments)
  - **Established pattern**: 100+ test files (features 069-115) provide clear precedent for content format, structure, and git workflow
  - **Git configuration**: Standard git user.name and user.email configuration must be available for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes total)

  **Breakdown**:
  - **File creation**: ~5 minutes (compose markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~2 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size ~400-600 bytes)
  - **Git workflow**: ~3-8 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification**:
  - Well-established and repeated pattern with 100+ identical implementations (features 069-115)
  - Flexible topic selection with no research, architectural decisions, or investigation needed
  - Single file creation with minimal, well-understood content format (one H1 heading + 2-3 sentences of prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (features 112-115) demonstrate efficient execution of identical features in 10-15 minutes
  - No source code dependencies or architectural complexity
  - Straightforward file I/O using Python standard library (pathlib.Path)

