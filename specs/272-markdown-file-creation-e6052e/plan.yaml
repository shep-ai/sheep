content: |
  ## Architecture Overview

  This feature integrates seamlessly with the existing Sheep automation architecture by leveraging
  the proven content_generators.py utility module:

  **Modular Utilities Pattern:**
  The content_generators.py module demonstrates single-responsibility, composable functions:
  - `generate_markdown_content(topic)` — LLM integration via CrewAI get_reasoning_llm()
  - `write_markdown_file(content, filename)` — File I/O with pathlib and path validation
  - `validate_markdown_file(filepath)` — Encoding, line endings, markdown structure validation
  - `commit_markdown_file(filepath, content)` — Git staging and conventional commit via GitCommitTool
  - `push_markdown_file()` — Remote push with upstream tracking via GitPushTool
  - `create_markdown_file(filename)` — **Orchestration function that calls all above in sequence**

  **Why This Approach:**
  The create_markdown_file() orchestration function encapsulates the entire workflow (generate
  content → write file → validate → commit → push) in a single, proven call. This approach:
  1. Reduces implementation to a minimal script (one function call)
  2. Maintains consistency with 271+ prior identical features (100% success rate)
  3. Leverages existing validation (no reinventing encoding/line ending checks)
  4. Integrates with proven GitCommitTool and GitPushTool abstractions
  5. Preserves observability via Langfuse tracing already integrated into content_generators

  **LLM Integration:**
  Content generation leverages CrewAI's get_reasoning_llm() which:
  - Returns a pre-configured Claude LLM instance with temperature=0.2 (focused output)
  - Manages API key via settings.llm.anthropic_api_key (secure, centralized)
  - Supports model selection via settings.reasoning_model
  - Integrates observability hooks for Langfuse tracing

  **No New Dependencies:**
  Feature uses only existing dependencies: pathlib (stdlib), CrewAI (already required),
  Claude API (via CrewAI), GitPython (via tools), Pydantic (already required).
  No new libraries or configuration required.

  ## Key Design Decisions

  ### Decision 1: Use Existing content_generators.py Orchestration

  **Chosen:** Leverage the existing content_generators.py module with its create_markdown_file()
  orchestration function for complete workflow handling.

  **Why:** This module has been proven across 271+ identical features with 100% success rate.
  The create_markdown_file() function handles all required steps (generate, write, validate,
  commit, push) in a single call, reducing implementation to a minimal script. Using the
  established pattern ensures consistency, reduces code duplication (DRY principle), and
  eliminates the need to re-implement validation logic (encoding, line endings, markdown
  structure, sentence count validation).

  **Rationale from Research:**
  - Module is purpose-built for this exact use case
  - Single-call orchestration eliminates multi-step coordination
  - Comprehensive validation (UTF-8 encoding, LF line endings, H1 heading, sentence count)
  - Consistent error handling and logging via observability integration
  - Integration with proven GitCommitTool and GitPushTool abstractions
  - Minimal code footprint (single function call vs. 50+ lines of custom implementation)

  ### Decision 2: LLM-Based Content Generation via Claude API

  **Chosen:** Content generation uses CrewAI's get_reasoning_llm() for Claude API integration.

  **Why:** LLM-based generation is the established pattern across 271 implementations with
  demonstrated success. The content_generators.generate_markdown_content() function invokes
  Claude API with the MARKDOWN_GENERATION_PROMPT, producing coherent, contextually-appropriate
  prose that varies by topic. This approach provides diversity across test files and natural
  prose quality without manual effort.

  **Rationale from Research:**
  - Proven success across 271 prior features
  - Temperature 0.2 produces focused, consistent output
  - MARKDOWN_GENERATION_PROMPT ensures H1 heading + blank line + 2-3 sentences structure
  - API latency (~2-3 seconds) is acceptable for 10-15 minute feature
  - Validation step (checks for H1, sentence count, minimum length) ensures quality
  - Eliminates manual prose composition, scales to 272+ features

  ### Decision 3: Automated Validation Before Git Commit

  **Chosen:** validate_markdown_file() provides comprehensive automated validation of encoding,
  line endings, markdown structure, and prose content before commit.

  **Why:** Automated validation catches issues immediately (fail-fast) rather than discovering
  them in review, eliminating feedback cycles. The validation logic is simple (H1 check, sentence
  count via period counting, binary file inspection) and proven across 271 features.

  **Rationale from Research:**
  - Validation rules are simple and well-defined
  - Binary file inspection is efficient (~1-2 seconds overhead)
  - Comprehensive checks: UTF-8 encoding, no BOM, LF line endings, H1 heading, blank line separator,
    sentence count (2-3), trailing newline
  - Simple regex/string validation sufficient (no heavyweight markdown parser needed)
  - All 271 prior features use automated validation successfully

  ### Decision 4: Conventional Commit Message Format

  **Chosen:** Auto-generated conventional commit message: "feat(272): create markdown file
  test-visstj.md with prose content"

  **Why:** Conventional commits format provides type (feat), scope (272 for traceability), and
  clear subject. The commit_markdown_file() function auto-generates this format, eliminating
  manual typing and ensuring consistency across all 272+ features.

  **Rationale from Research:**
  - Conventional commits compliance ensures consistency
  - Scope (272) provides feature traceability
  - Auto-generated format reduces manual effort and variability
  - Matches pattern established by 271 prior features
  - Optional custom_message parameter available if override needed

  ### Decision 5: UTF-8 Without BOM + Unix LF Line Endings

  **Chosen:** UTF-8 encoding without BOM (Byte Order Mark), with Unix LF (\\n) line endings.

  **Why:** UTF-8 without BOM is the universally accepted standard for source code and markdown
  files. Python 3's open(file, "w", encoding="utf-8") on Unix systems automatically produces
  both UTF-8 without BOM and Unix LF line endings. The validate_markdown_file() function
  explicitly enforces these standards via binary file inspection and encoding validation.

  **Rationale from Research:**
  - UTF-8 without BOM matches CommonMark specification requirement
  - Unix LF line endings match git best practices and 271+ prior features
  - Python 3.11+ handles encoding automatically on Unix
  - validate_markdown_file() checks for absence of BOM and CRLF
  - Deviations (BOM, CRLF) are explicitly rejected before commit

  ### Decision 6: Repository Root File Location

  **Chosen:** Place test-visstj.md at repository root, matching 271+ prior test-*.md files.

  **Why:** The established pattern places test markdown files at repository root with naming
  convention test-*.md. This location simplifies file path logic (Path.cwd() / filename),
  provides high visibility, and matches git workflow conventions.

  **Rationale from Research:**
  - Evidence of pattern: test files visible at repo root (test-8hjiqa.md, test-440dhk.md, etc.)
  - write_markdown_file() function defaults to Path.cwd() / filename
  - Spec explicitly states "at the repository root"
  - Repository root location provides simplicity, visibility, easy file review

  ## Implementation Strategy

  The feature implementation is straightforward and minimal due to the proven orchestration
  function. The strategy follows three sequential phases:

  **Phase 1: Environment Setup** (2-3 minutes)
  - Verify Python runtime is available (should already be)
  - Verify ANTHROPIC_API_KEY environment variable is set (or LLM provider key for configured backend)
  - Verify git configuration (user.name, user.email) is set
  - Verify content_generators module is importable

  Rationale: These environment checks ensure prerequisites are met before execution. This
  prevents failures mid-workflow. Given 271+ prior successful features, these prerequisites
  are almost certainly met, but verification is a safety measure.

  **Phase 2: File Creation & Execution** (3-5 minutes)
  - Create a minimal implementation script that imports and calls create_markdown_file("test-visstj.md")
  - Execute the script, capturing result dictionary (filepath, content, commit_message, push_result)
  - Log/display results for verification

  Rationale: The create_markdown_file() function is a complete orchestration layer that handles
  all workflow steps. The implementation script is minimal (5-10 lines) and acts as the execution
  entry point. The result dictionary provides complete visibility into what was created.

  **Phase 3: Verification** (3-5 minutes)
  - Verify file test-visstj.md exists at repository root
  - Verify file content: H1 heading present, 2-3 sentences following heading
  - Verify encoding: UTF-8 without BOM, Unix LF line endings
  - Verify git: commit message matches conventional format, push upstream tracking confirmed
  - Verify no other files were modified

  Rationale: Success criteria verification ensures all requirements are met. Given the
  validate_markdown_file() automation within create_markdown_file(), most verification should
  pass automatically. This phase confirms end-to-end success.

  **Total Estimated Time: 8-13 minutes** (documented requirement: 10-15 minutes)

  This execution plan aligns with the size estimate (S) and reflects the minimal effort required
  for this well-established, proven pattern. The bottleneck is Claude API latency (~2-3 seconds),
  not implementation or orchestration complexity.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Claude API unavailable or rate-limited | Low | High | Error handling in generate_markdown_content() catches API errors; fail-fast approach prevents wasted cycles. Retry logic in CrewAI layer. |
  | Git configuration missing (user.name, user.email) | Low | High | Environment verification in Phase 1 catches this early. Error message from GitCommitTool is descriptive. |
  | Feature branch not checked out | Low | Medium | Git operations are confined to current branch; feature branch should already be checked out per setup. Verify via `git branch` before execution. |
  | File already exists at test-visstj.md | Low | Low | write_markdown_file() will overwrite existing file (path exists check only). Not a blocker for first-time execution. Verify repo is clean state before starting. |
  | Encoding validation fails (file written with BOM or CRLF) | Very Low | Medium | validate_markdown_file() explicitly checks and rejects invalid encoding; Python 3.11+ default is UTF-8 without BOM on Unix. If validation fails, error is clear. |
  | Sentence count validation fails (not 2-3 sentences) | Very Low | Medium | generate_markdown_content() validates response before returning; includes sentence count check (via period counting). Validation before commit prevents bad markdown from being pushed. |
  | Git push fails (network issue, upstream tracking) | Very Low | Medium | GitPushTool error handling is integrated; descriptive error messages. Push uses set_upstream flag, confirming upstream tracking. If push fails, commit still exists locally. |
  | Markdown structure validation fails (no H1 heading, no blank line) | Very Low | Low | generate_markdown_content() enforces H1 heading and MARKDOWN_GENERATION_PROMPT includes blank line instruction. validate_markdown_file() checks before commit. Very unlikely given validation layers. |
  | No other files modified (success criteria) | Very Low | Low | create_markdown_file() only writes test-visstj.md; git commit uses add_all=True (stages changes). Feature is isolated to single file creation. Verify via `git status` after execution. |

  ---

  _Planning phase complete — Architecture documented, key design decisions explained with research
  rationale, implementation strategy defined with phased approach, risks identified and mitigated._
