content: |
  ## Task Execution Summary

  This task breakdown implements markdown file creation for feature 272 across three sequential phases:

  ### Phase 1: Environment & Orchestration Setup (2-3 minutes)

  **Task 1: Verify Environment Prerequisites**

  Before executing the file creation workflow, this task ensures all prerequisite configurations are
  met: Python runtime, API credentials, git configuration, and module importability. This is a
  validation/verification task (no code changes) with straightforward checks.

  Verification approach:
  - Check Python version via `python --version` (expect 3.11+)
  - Verify ANTHROPIC_API_KEY is set via `echo $ANTHROPIC_API_KEY` (should produce output, not error)
  - Verify git config via `git config user.name` and `git config user.email` (both should return values)
  - Verify module import via Python: `from src.sheep.content_generators import create_markdown_file`
  - Verify branch via `git branch --show-current` (should be feat/272-markdown-file-creation-e6052e or similar)

  This task has no code changes, no TDD cycle needed (tdd: null).

  ### Phase 2: File Creation & Execution (3-5 minutes)

  **Task 2: Create and Execute Implementation Script**

  This task creates a minimal Python script that orchestrates the entire workflow by calling the
  proven create_markdown_file() function. The script is the implementation entry point.

  TDD Cycle:

  *RED Phase:* Write a test that verifies the script returns a result dictionary with expected
  keys (filepath, content, commit_message, push_result). Test should fail initially (no implementation).

  *GREEN Phase:* Create implementation script (5-10 lines):
  ```python
  from src.sheep.content_generators import create_markdown_file

  result = create_markdown_file("test-visstj.md")
  print(f"File created at: {result['filepath']}")
  print(f"Content length: {len(result['content'])} bytes")
  print(f"Commit message: {result['commit_message']}")
  print(f"Push result: {result['push_result']}")
  ```

  Execute the script and capture output. Run test; verify it passes.

  *REFACTOR Phase:* Add error handling for API failures or git issues (display clear error messages).
  Add logging to show filename, content summary, commit message, and push status. The script should
  be clean, readable, and provide clear visibility into what happened during execution.

  The create_markdown_file() function orchestrates everything: content generation via Claude API,
  file write with UTF-8 encoding and LF line endings, validation of markdown structure, git commit
  with conventional message format, and remote push with upstream tracking.

  ### Phase 3: Verification & Validation (5-7 minutes)

  **Task 3: Verify File Content and Encoding**

  This task verifies the created file meets all content and encoding requirements from the spec:
  - File exists at repository root (test-visstj.md)
  - Contains exactly one H1 heading
  - Contains exactly 2-3 sentences of prose
  - Valid markdown syntax
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - File size in expected range (250-600 bytes)

  TDD Cycle:

  *RED Phase:* Write comprehensive tests for each requirement. Tests should read the file, inspect
  encoding, count sentences, verify structure. Tests should fail if file is missing or has incorrect content.

  *GREEN Phase:* Implement file verification logic:
  - Check file existence via Path.cwd() / "test-visstj.md"
  - Read file, verify first line matches "^# " pattern (H1 heading)
  - Count sentences (period characters) in prose content, verify 2-3
  - Read file in binary mode, verify no UTF-8 BOM at start (no 0xEF 0xBB 0xBF)
  - Verify no CRLF sequences (0x0D 0x0A) in binary content
  - Verify file ends with newline (last byte is 0x0A)
  - Verify file size is within 250-600 byte range

  Run all tests; they should pass given the validation already performed by create_markdown_file().

  *REFACTOR Phase:* Extract verification logic into helper functions (separate concerns: encoding
  checks, structure checks, size checks). Improve error messages to show actual values. Consider
  using pathlib methods for cleaner code.

  **Task 4: Verify Git Commit and Push**

  This task verifies the git workflow completed successfully:
  - Commit exists with conventional format message
  - Only test-visstj.md was modified/staged
  - Commit is on the feature branch
  - Push succeeded with upstream tracking

  TDD Cycle:

  *RED Phase:* Write tests that query git state and verify expected conditions. Tests should check
  commit message format, files in commit, current branch, upstream tracking. Tests should fail if
  commit is missing or message doesn't match pattern.

  *GREEN Phase:* Implement git verification:
  - Query git log for most recent commit message, verify matches "feat(272): create markdown file test-visstj.md*"
  - Run `git show --name-only` to verify only test-visstj.md appears in commit
  - Run `git rev-parse --abbrev-ref HEAD` to verify feature branch is current
  - Run `git branch -vv` to verify upstream tracking is set to origin/feat/272-*

  Run all tests; they should pass given the orchestration in create_markdown_file().

  *REFACTOR Phase:* Extract git verification into helper functions (separate: commit check, file
  list check, branch check). Improve error messages showing actual git output. Add logging showing
  commit hash, message, and upstream tracking status.

  ## Execution Flow

  1. Task 1 validates prerequisites (2-3 min)
  2. Task 2 executes the orchestration function and captures results (3-5 min)
  3. Tasks 3 & 4 verify results in parallel or sequence (5-7 min)
  4. **Total time: 10-15 minutes** (estimated effort aligns with size S estimate)

  The implementation is minimal because the create_markdown_file() orchestration function handles
  the entire workflow. The task breakdown focuses on verification that all success criteria are met.

  ---

  _Task breakdown complete — 4 concrete tasks with TDD cycles, phased execution, and clear
  acceptance criteria. Ready for implementation phase._
