content: |
  ## Status

  - **Phase:** Research (COMPLETED)
  - **Updated:** 2026-03-27
  - **Analyzed:** Feature 231 markdown file creation following 230+ established test file precedents

  ## Technology Decisions

  ### 1. File Creation Method with Explicit Binary Mode

  **Chosen:** Python pathlib.Path().write_bytes() with UTF-8 encoded content and explicit b'\\n' line endings

  **Rejected:**
  - pathlib.Path().write_text() with text mode — relies on platform defaults and git config (core.autocrlf) to guarantee LF; less reliable on Windows where text mode defaults to CRLF
  - Python open() in binary mode — functionally equivalent but more verbose; pathlib is more modern and idiomatic
  - Shell echo command — platform-dependent, difficult to control encoding and line endings

  **Rationale:**
  The explicit binary mode approach provides maximum reliability for spec requirement FR-6 (LF line
  endings) across all platforms. By encoding content to UTF-8 bytes and explicitly writing b'\\n',
  we guarantee LF in the file regardless of operating system or git configuration state. This
  eliminates dependency on git core.autocrlf settings which may vary across development environments.
  While feature 230 used pathlib.write_text() successfully, the explicit binary approach is more
  robust for cross-platform Windows support where text mode could produce CRLF. This refinement
  implements the product decision \"Explicit binary mode write\" from the spec. Implementation adds
  one encoding step: `Path(filename).write_bytes(content.encode('utf-8'))`.

  ### 2. Content Composition Strategy

  **Chosen:** Manual composition of unique, meaningful prose (2-3 sentences on free-form topic)

  **Rejected:**
  - Programmatic generation (templated text, random libraries) — adds complexity, risks grammatical errors, reduces quality
  - Template reuse from existing files — violates uniqueness, reduces value of test fixture collection
  - AI/external content APIs — introduces external dependency, non-deterministic output

  **Rationale:**
  All 230+ existing test markdown files contain manually composed, unique prose on diverse topics.
  This establishes the expected pattern and quality standard. Manual composition ensures: (1)
  grammatical correctness (required by NFR-2), (2) meaningful, coherent content, (3) test corpus
  diversity, (4) minimal overhead (3-5 minutes). Free-form topic selection per NFR-7 adds no
  implementation complexity. Quality matters because these files serve as repository documentation
  and test examples. Composition time is well within the S (small) size estimate of 10-15 total minutes.

  ### 3. Git Workflow Automation

  **Chosen:** Python subprocess module with explicit git commands (git add, git commit, git push)

  **Rejected:**
  - GitPython library — external dependency violating NFR-4, unnecessary abstraction for simple CLI
  - Shell invocation (os.system or shell=True) — security risk, less portable, harder to debug
  - Manual operations — not automated, requires human execution

  **Rationale:**
  subprocess module is part of Python standard library (no external dependencies per NFR-4). It
  provides secure execution with explicit command lists (prevents shell injection), output capture,
  error handling, and cross-platform compatibility. Feature requires conventional commit format per
  FR-8 and push per FR-9. subprocess cleanly orchestrates: (1) git add test-5v39cp.md, (2) git
  commit -m \"feat(231): Create markdown file test-5v39cp.md with prose content\", (3) git push
  -u origin HEAD. This matches the pattern established in features 151-230.

  ### 4. Implementation as Standalone Python Script

  **Chosen:** Standalone Python script (executable file) for automated file creation and git workflow

  **Rejected:**
  - Integration into Sheep CrewAI agent system — unnecessary complexity for deterministic file creation with no decision points
  - Shell script (.sh/.cmd) — less portable, harder to control encoding reliably
  - Manual invocation — not automated

  **Rationale:**
  Feature is simple deterministic file creation with fixed requirements and no complex logic.
  Standalone Python script is: (1) simplest implementation, (2) fully portable across platforms,
  (3) easiest to test and verify, (4) matches all 230+ preceding features, (5) requires only Python
  3.11+ (project minimum). No integration into src/sheep/ production code needed per NFR-5. Script
  can be executed by CI/CD, test runner, or human operator.

  ### 5. File Encoding and Size Validation

  **Chosen:** UTF-8 encoding without BOM, file size validation (hard boundary 300-600 bytes)

  **Rejected:**
  - Platform-dependent encoding — risks mismatch, violates FR-5 requirement
  - No size validation — allows deviations, breaks consistency with 230+ precedent
  - Soft validation (warning only) — violates NFR-1 (hard boundary requirement)

  **Rationale:**
  UTF-8 without BOM is ensured via Python 3's default encoding (no BOM added to UTF-8 bytes).
  File size validation is mandatory per FR-5 and NFR-1. All 230+ existing test files fall within
  300-600 byte range. Validation approach: after content generation, verify file size and raise
  clear error if outside range. This ensures consistency, reproducibility, and automated success
  validation. Typical file size: title (~20-40 bytes) + blank line (1 byte) + 2-3 sentences
  (~250-500 bytes) = 350-550 bytes total.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib (stdlib) | Cross-platform file path and I/O operations | Use (write_bytes with explicit encoding) | Modern, idiomatic Python 3.11+, part of standard library, zero dependencies |
  | subprocess (stdlib) | Secure subprocess execution for git commands | Use | Standard library, prevents shell injection, output capture, cross-platform |
  | UTF-8 encoding (stdlib) | Text encoding without BOM | Use (explicit via .encode('utf-8')) | Python default, no BOM added, meets FR-5 requirement |
  | GitPython (external) | High-level git API wrapper | REJECT | External dependency violates NFR-4; subprocess is sufficient |
  | pygit2 (external) | Low-level git library | REJECT | External dependency violates NFR-4; unnecessary for simple CLI operations |
  | requests/httpx (external) | HTTP client for external APIs | REJECT | Not needed; content is manually composed, no external data sources |
  | faker/randomgen (external) | Content generation | REJECT | External dependency, adds complexity, reduces content quality and determinism |

  ## Security Considerations

  **Risk Level:** Low

  **Identified Risks:**
  1. **Command injection via git commands** — Mitigated by using subprocess with explicit command lists (not shell=True)
  2. **File encoding issues (BOM, encoding mismatches)** — Mitigated by explicit UTF-8 encoding without BOM
  3. **Unreliable line endings across platforms** — Mitigated by explicit binary mode write with b'\\n'
  4. **Git authentication/credentials** — Not a risk; using local git (no remote auth needed initially)

  **Mitigations:**
  - Use subprocess.run() with list-based commands, never shell=True
  - Explicit UTF-8 encoding via .encode('utf-8') ensures deterministic byte representation
  - Binary mode write (pathlib.write_bytes()) guarantees LF regardless of platform
  - No external APIs, no user input beyond prose composition, no authentication needed
  - File created in repository root with no access to sensitive directories
  - No modifications to source code or configuration per NFR-5

  **Compliance:**
  - No OWASP top 10 vulnerabilities introduced
  - No credential storage or authentication issues
  - No external API dependencies with associated risks
  - Complies with NFR-4 (no external dependencies beyond stdlib and git)

  ## Performance Implications

  **Risk Level:** Negligible

  **Performance Characteristics:**
  - File creation: < 1ms (single write operation, ~350-550 bytes)
  - Prose composition: 3-5 minutes (human time, not runtime)
  - Git add/commit/push: 100-500ms (local operations, depends on filesystem and git config)
  - Total runtime: < 1 second (automated execution)
  - Total wall-clock time: 10-15 minutes including manual composition per NFR-3

  **Optimizations:**
  - No caching needed (single-run operation)
  - No batch processing (one file per feature)
  - subprocess overhead negligible for simple git commands
  - No database queries or external API calls

  **Scalability:**
  - Pattern proven across 230+ existing test files
  - No database or external dependencies to bottleneck
  - Linear time complexity (O(1) per file)
  - No performance degradation over time

  ## Architecture and Codebase Integration

  **Integration Points:**
  - Repository root directory (file creation location)
  - Feature branch feat/231-markdown-file-creation-744aa9 (git operations)
  - No integration into src/sheep/ (complies with NFR-5)
  - No modification to existing files or configurations

  **Codebase Patterns:**
  - Matches implementation pattern from features 151-230
  - Consistent with established test file naming convention (test-*.md)
  - Aligns with project's Python 3.11+ standard library constraint
  - Uses conventional commit message format (feat(231): ...)
  - Standalone Python script follows precedent

  **Dependencies:**
  - Python 3.11+ (project minimum, already required)
  - Git 2.x+ (project requirement, already available)
  - No additional external packages

  **Maintenance:**
  - No code to maintain beyond the single script file
  - No configuration files to update
  - Pattern is proven, well-documented, and widely used in project

  ## Conclusion

  Feature 231 markdown file creation follows an established, well-proven pattern from 230+ existing
  test files. Technical research confirms the approach is sound: Python pathlib with explicit binary
  mode writing guarantees platform-independent LF line endings, manual prose composition ensures
  quality, and subprocess automation provides secure, dependency-free git workflow. All technology
  choices are fully justified, with clear alternatives evaluated and rejected. Implementation is
  straightforward (estimated 10-15 minutes), and the feature carries minimal security and performance
  risk. The refined approach (explicit binary mode) improves robustness compared to feature 230,
  specifically addressing Windows platform compatibility. No architectural concerns, no external
  dependencies, and full alignment with project constraints and established patterns.

