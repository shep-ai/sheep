content: |
  ## Architecture Overview

  The implementation is a standalone Python script (`create_test_markdown.py`) that automates the entire workflow: prose composition, file creation with explicit binary-mode encoding, validation, and git integration. This approach aligns with the established pattern from 230+ existing test files in the Sheep project.

  The script is designed for clarity and simplicity:
  - **Content layer**: Composes markdown content (title + blank line + 2-3 sentences)
  - **File I/O layer**: Writes file using pathlib with explicit UTF-8 bytes and b'\n' line endings
  - **Validation layer**: Validates file encoding (no BOM) and size (300-600 byte hard boundary)
  - **Git layer**: Automates staging, conventional commit, and push via subprocess module

  No integration into src/sheep/ or CrewAI system is required per NFR-5. The script is standalone, portable, and requires only Python 3.11+ standard library and git.

  ## Key Design Decisions

  ### 1. Explicit Binary Mode File Writing

  **Decision**: Use `pathlib.Path().write_bytes(content.encode('utf-8'))` with explicit b'\n' line endings.

  **Why**: This guarantees LF line endings regardless of operating system or git configuration (core.autocrlf), fulfilling spec requirement FR-6 and design decision from research findings. Binary mode eliminates platform-default behavior (CRLF on Windows in text mode) and provides maximum robustness.

  **Alternative rejected**: pathlib.write_text() with text mode would rely on git core.autocrlf configuration, which is less reliable across development environments.

  ### 2. Manual Prose Composition

  **Decision**: Implement prose content as part of the script (title + 2-3 sentences on free-form topic).

  **Why**: All 230+ existing test files use manually composed, unique prose. This ensures grammatical correctness (NFR-2), variety, and meaningful test fixtures. Composition is simple (3-5 minutes) and fits within the S (small) size estimate of 10-15 total minutes.

  **Alternative rejected**: Programmatic generation (templates, random libraries) would add complexity, risk grammatical errors, and reduce test corpus quality.

  ### 3. Subprocess for Git Automation

  **Decision**: Use Python subprocess module with explicit git commands (no shell=True).

  **Why**: subprocess is part of Python standard library (no external dependencies per NFR-4), provides secure execution preventing shell injection, enables output capture, and is cross-platform. This aligns with features 151-230 and project constraints.

  **Alternative rejected**: GitPython introduces external dependency violating NFR-4; shell invocation creates security risks.

  ### 4. Standalone Script Structure

  **Decision**: Implement as standalone executable Python script, not integrated into CrewAI system.

  **Why**: Feature is simple deterministic file creation with no complex logic or decision points. Standalone script is simplest, most portable, easiest to test, and matches pattern from all 230+ preceding features. No orchestration framework needed per NFR-5.

  ### 5. Hard Boundary File Size Validation

  **Decision**: Validate file size is within 300-600 bytes (hard boundary), with error if outside range.

  **Why**: All 230+ existing test files fall within this range. Hard boundary per NFR-1 ensures consistency and enables automated validation. Typical file size is 350-550 bytes (title ~20-40 bytes + blank line 1 byte + prose ~250-500 bytes). Size is deterministic and predictable.

  ## Implementation Strategy

  The implementation proceeds in three ordered phases:

  **Phase 1: Script Foundation & Content Design**
  Create the Python script file and implement the content composition logic. This establishes the overall structure and produces the markdown content that will be written to the file.

  **Phase 2: File I/O & Encoding Validation**
  Implement the file writing mechanism using pathlib with explicit binary mode and UTF-8 encoding. Add validation to ensure file size is within 300-600 byte boundary and encoding is correct.

  **Phase 3: Git Workflow Automation**
  Implement the git workflow: staging the file, committing with the conventional message format (feat(231): Create markdown file test-5v39cp.md with prose content), and pushing to the feature branch (feat/231-markdown-file-creation-744aa9).

  This ordering makes sense because:
  1. We need content before we can write a file
  2. We need a valid file before we can commit it
  3. We commit the file once it's correct

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (CRLF on Windows) | Use explicit binary mode write with b'\n' to guarantee LF regardless of OS or git config |
  | File size outside 300-600 bytes | Implement validation that checks final file size and raises error if outside range |
  | Git operations fail | Use subprocess with explicit error handling; catch CalledProcessError and provide clear error messages |
  | Prose content grammatically incorrect | Implement prose directly in code as a string constant; review for correctness before committing |
  | File already exists | Check if file exists before creating; raise error if it does (fail-safe) |
  | Git branch doesn't exist | Verify branch exists before attempting push; provide clear error message if missing |

