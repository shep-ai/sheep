content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-5v39cp.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-230,
  with 230+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-5v39cp.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\\n), not CRLF
  - [ ] File is between 300-600 bytes in size (strict boundary)
  - [ ] File is staged with `git add test-5v39cp.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(231): Create markdown file test-5v39cp.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/231-markdown-file-creation-744aa9`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-5v39cp.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\\n) line endings throughout, achieved via explicit binary mode writing
  - **FR-7**: The file SHALL be added to git staging area using `git add test-5v39cp.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(231): Create markdown file test-5v39cp.md with prose content`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/231-markdown-file-creation-744aa9`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes (hard boundary), consistent with all 230+ existing test markdown files
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent; acceptable styles include technical, casual, conversational, or educational
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of actual work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 151-230 for consistency and maintainability
  - **NFR-7**: Prose topic selection SHALL be free-form and unconstrained (no predefined topic list or category restrictions)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose topic selection: free-form or constrained? | Free-form selection | Matches 230+ existing test files; no overhead; maximizes variety and implementer flexibility |
  | 2 | File size: hard boundary or soft guideline? | Hard boundary (300-600 bytes) | Ensures consistency with test corpus; enables automated validation; all 230+ precedents confirm this range |
  | 3 | LF line ending enforcement method? | Explicit binary mode write | Platform-independent; guarantees LF regardless of OS; most reliable approach |
  | 4 | Prose content style: any or specific? | Any coherent style | Matches diversity of 230+ test files; maximizes flexibility while maintaining quality (grammatical correctness) |

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 230+ test markdown files following pattern `test-*.md`
  - Examples: `test-xekj8s.md`, `test-3zdw9d.md`, `acoustic-engineering-590ixe.md`
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`, `Dockerfile`

  **Spec Directory Structure:**
  - `specs/` contains 231 feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Each spec includes: `feature.yaml`, `plan.yaml`, `research.yaml`, `tasks.yaml`
  - This spec is located at: `specs/231-markdown-file-creation-744aa9/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions for CrewAI integration
  - `src/sheep/flows/` contains flow orchestration
  - `src/sheep/config/` contains configuration management
  - `src/sheep/cli.py` contains CLI entry point

  ### Architecture Patterns

  **Test File Format (230+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-600 bytes
  - Example from `cloud-computing-xwbxsh.md`:
    ```markdown
    # Cloud Computing Timeline

    Cloud computing emerged in the 2000s as companies like AWS, Microsoft Azure, and Google Cloud Platform began offering on-demand computing resources and storage services. Major milestones include the launch of AWS EC2 in 2006, the rise of containerization with Docker in 2013, and the widespread adoption of serverless computing throughout the 2010s. Today, cloud infrastructure powers most of the internet and has become essential for digital transformation across industries.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-5v39cp.md`
  - Matches existing test file naming pattern (e.g., `test-xekj8s.md`, `test-3zdw9d.md`)

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with prose content`
  - Changes are pushed to feature branch `feat/###-<feature-name>`
  - Branch already pre-created: `feat/231-markdown-file-creation-744aa9`

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Binary mode file writing to guarantee LF line endings on all platforms
  - Standard library, available in Python 3.11+ (no external dependencies)
  - UTF-8 encoding (explicit in binary mode or via text mode default)

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/231-markdown-file-creation-744aa9`
  - No specialized libraries required, uses git CLI

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 230+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-230; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/231-markdown-file-creation-744aa9` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 230+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-230) demonstrate successful execution of identical pattern
  - Features 151-230 specs provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **Prose composition**: ~3-5 minutes (compose one markdown heading + 2-3 sentences of prose)
  - **File creation and encoding**: ~2-3 minutes (write file with UTF-8 encoding and explicit LF line endings in binary mode)
  - **Size validation**: ~1-2 minutes (verify file is 300-600 bytes)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 230+ identical test files providing clear precedent
  - Free-form topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-230) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Product decisions formalized and settled; no ambiguity remaining

  ---

  _Requirements phase complete — specification ready for planning and implementation_
