# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository uses markdown files as test artifacts to validate the automated feature implementation
  system. This feature creates a new test markdown file (test-hb86hb.md) following the established naming
  convention and structure of existing test files in the repository. This is a minimal, additive change with
  no code dependencies.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is structured as follows:

  - **Repository Root**: Contains multiple markdown files including:
    - `README.md` — Main project documentation
    - `test-*.md` — Test markdown files (varying content and topics)
    - `*_STATE_MACHINE.md` — Illustrative state machine diagrams (e.g., ELEVATOR_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md)
  - **specs/ directory**: Contains feature specifications organized by feature number and name
    - Each feature has a subdirectory with spec.yaml, research.yaml, feature.yaml, tasks.yaml, and plan.yaml files
  - **No source code directory**: This is primarily a specification and artifact repository for testing the Sheep implementation agent

  ### Architecture Patterns

  - **Specification-Driven Design**: Features are defined through detailed YAML specifications with problem statements, success criteria, and requirements
  - **Incremental Feature Implementation**: Each numbered feature builds on previous ones, testing different aspects of the system
  - **Standalone Artifacts**: Markdown test files are independent, self-contained documents with no cross-dependencies
  - **Established Naming Conventions**: Test files follow the pattern `test-<random_id>.md` with varied prose content

  ### Relevant Technologies

  - **Markdown**: Standard GitHub Flavored Markdown (GFM) syntax
  - **YAML**: For specification and configuration files
  - **Git**: Version control with branch-per-feature workflow

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (new .md file) | Low | Adds one standalone markdown file with no code changes, no modifications to existing files |

  ## Success Criteria

  - [ ] File `test-hb86hb.md` exists at the repository root
  - [ ] File contains exactly one markdown heading (H1 or H2) as the title
  - [ ] File contains exactly 2-3 sentences of prose content on any topic
  - [ ] File uses valid GitHub Flavored Markdown syntax
  - [ ] No existing files are modified
  - [ ] File uses UTF-8 encoding with LF line endings (consistent with repo convention)

  ## Functional Requirements

  - **FR-1**: Create a new file named `test-hb86hb.md` at the repository root
  - **FR-2**: The file MUST contain a markdown heading (H1 `#` or H2 `##`) serving as the title
  - **FR-3**: The file MUST contain exactly 2-3 sentences of prose content on any topic (fiction, facts, technical, philosophical, etc.)
  - **FR-4**: No other files in the repository MAY be modified
  - **FR-5**: The file MUST be syntactically valid Markdown

  ## Non-Functional Requirements

  - **NFR-1**: File MUST use UTF-8 encoding with LF line endings
  - **NFR-2**: File SHOULD be human-readable when rendered as Markdown on GitHub
  - **NFR-3**: Total file size SHOULD be under 500 bytes (consistent with existing test-*.md files)
  - **NFR-4**: Prose content SHOULD be original or well-known; no placeholder text like "TBD" or "Lorem ipsum"

  ## Dependencies

  None. This is a standalone markdown file with no dependencies on existing code, features, or infrastructure.

  ## Size Estimate

  **S** — Single markdown file creation (~100-200 bytes), no code, no tests, no configuration. Follows the exact pattern of dozens of existing test-*.md files in the repository. Implementation should take minutes.
