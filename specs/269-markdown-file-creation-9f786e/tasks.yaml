content: |
  ## Task Workflow Summary

  Feature 269 implements markdown file creation with five ordered tasks across two phases:

  ### Phase 1: Content Generation & File Creation (Tasks 1-2, ~50 minutes)
  Establishes the LLM-based foundation by setting up Claude API integration and implementing file creation with proper markdown structure. Task 1 generates intelligent title + prose from Claude API. Task 2 writes this content to test-hb8tyt.md with H1 heading, blank line separator, and proper UTF-8 + Unix LF formatting using pathlib.

  ### Phase 2: Validation & Git Integration (Tasks 3-5, ~75 minutes)
  Completes the workflow with validation and git operations. Task 3 validates file structure, encoding, and size to ensure quality before committing. Task 4 implements comprehensive git workflow (add, commit, push) with detailed error handling for CrewAI observability. Task 5 integrates all components into a complete end-to-end workflow with orchestration, error handling, and integration testing.

  ### Why This Ordering

  1. **Content generation first** — Foundation for everything that follows; all downstream tasks depend on having valid content
  2. **File creation second** — Once content is ready, create the actual file using proper formatting
  3. **Validation third** — Before committing to git, validate the file is correct and complete
  4. **Git operations fourth** — Only after validation, proceed with version control operations
  5. **Integration last** — Wire all components together and test the complete workflow

  Each task has TDD cycles (RED → GREEN → REFACTOR) ensuring high test coverage and quality. Tasks are ordered by dependency; no task depends on a later task. Total effort: 2 hours 25 minutes.

  ## Implementation Notes

  **Architectural Pattern**: Follow the proven pattern from features 266-268 (3 core functions + main orchestration) but upgrade content generation from hard-coded to LLM-based using Anthropic Claude API.

  **Error Handling Philosophy**: Comprehensive error handling at each step provides clear success/failure feedback for CrewAI agents. Each function has try-except with descriptive error messages including context (what failed, why, what to check).

  **Testing Strategy**: Unit tests for each function (mocking external dependencies like Claude API and git), integration tests for complete workflow using real pathlib/subprocess where safe.

  **Logging for Observability**: Progress messages at each phase, error logging with context, success/failure summary. Enables CrewAI agents to understand execution flow and diagnose issues.

  **No External Dependencies**: Uses only Python standard library (pathlib, subprocess, sys, os) plus Anthropic SDK (assumed available in Sheep platform). No GitPython, no markdown parsing, no extra libraries.

  **Conventional Commits**: Commit message follows spec format: `feat(269): create markdown file test-hb8tyt.md with title and prose content`

  **File Specifications**: test-hb8tyt.md, UTF-8 encoding, Unix LF line endings, 400-600 bytes (naturally achieved by H1 + blank line + 2-3 sentences), staged/committed/pushed to feature branch.
