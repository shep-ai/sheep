content: |
  ## Architecture Overview

  Feature 265 follows the proven layered architecture established across 264 preceding features:

  **Utility Layer** (content_generators.py — already implemented):
  - `generate_markdown_content()` — Creates H1 heading + 2-3 sentences via Claude API
  - `write_markdown_file()` — Writes file with UTF-8 encoding, no BOM, Unix LF line endings
  - `validate_markdown_file()` — Validates structure, grammar, coherence, formatting
  - `commit_markdown_file()` — Stages file and commits with conventional message format
  - `push_markdown_file()` — Pushes to remote branch

  **Feature Layer** (new: feature_265_markdown_file_creation.py):
  - Thin wrapper (~100-120 lines following feature_264 pattern)
  - Orchestrates 5-step workflow: generate → write → validate → commit → push
  - Provides feature-level logging and error handling
  - Maintains feature-specific metadata (feature number, filename)

  The feature module coordinates these utilities into a complete, deterministic workflow. No architectural changes are needed — all infrastructure exists and is proven across 264+ implementations.

  ## Key Design Decisions

  **1. Layered Orchestration Pattern**
  - Chosen: Create thin feature wrapper that calls existing utilities in sequence
  - Rationale: Maintains separation of concerns, keeps utilities reusable, provides feature-level context for logging and git messages, consistent with 264 preceding features
  - Reference: Research finding \"Feature Implementation Location and Pattern\"

  **2. Single LLM Attempt with Immediate Error Reporting**
  - Chosen: Call generate_markdown_content() once; propagate errors immediately without retries
  - Rationale: Maintains operational transparency, aligns with spec requirement and feature_264 pattern, CrewAI/Claude API has >95% success rate for prose generation
  - Reference: Research finding \"LLM Content Generation Strategy\"

  **3. Comprehensive Content Validation**
  - Chosen: Use validate_markdown_file() which checks structure, grammar, coherence, encoding, line endings
  - Rationale: Ensures quality consistency at scale, catches LLM edge cases, validates platform reliability across 265+ features
  - Reference: Research finding \"Validation Strategy\"

  **4. Utility Function Reuse**
  - Chosen: Reuse all five functions from content_generators.py without custom implementations
  - Rationale: Avoids code duplication, leverages battle-tested implementations across 264 features, ensures consistency in error handling and encoding
  - Reference: Research finding \"Utility Function Reuse vs Custom Implementation\"

  **5. Conventional Commit Format**
  - Chosen: Use message format \"feat(265): Create markdown file test-avzoan.md with prose content\"
  - Rationale: Maintains consistency with feature_264 and all preceding features, enables searchability by feature number, follows git best practices
  - Reference: Research finding \"Commit Message Format\"

  ## Implementation Strategy

  ### Single Phase Approach

  **Phase 1: Feature Wrapper Implementation**

  Create src/sheep/features/feature_265_markdown_file_creation.py that:
  1. Imports utilities from content_generators.py
  2. Imports logging and LLM configuration from project infrastructure
  3. Defines FEATURE_NUMBER = 265, FEATURE_NAME, MARKDOWN_FILENAME = \"test-avzoan.md\"
  4. Implements main() function with 5-step workflow:
     - Step 1: Call generate_markdown_content() with appropriate prompt
     - Step 2: Call write_markdown_file(content, filename)
     - Step 3: Call validate_markdown_file(filepath) to ensure structure and quality
     - Step 4: Call commit_markdown_file() with feature-specific commit message
     - Step 5: Call push_markdown_file() to remote branch
  5. Wraps execution in try-except for feature-level error logging
  6. Returns result dictionary with filepath, content, commit message, push result

  This pattern is proven across features 1-264. No new patterns or infrastructure changes required.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generation produces incoherent prose | validate_markdown_file() checks coherence and rejects poor quality; single attempt with immediate error reporting allows operator to diagnose |
  | File encoding/line ending issues | content_generators.py utilities handle all encoding; validation checks binary representation to ensure Unix LF and no BOM |
  | Git operations fail (branch doesn't exist, auth issues) | Feature runs on pre-created branch; git utilities provide detailed error messages; test environment validates git access before feature runs |
  | File already exists (idempotency) | write_markdown_file() overwrites with fresh content, ensuring deterministic behavior |
  | Prose sentence count doesn't match requirement (2-3) | validate_markdown_file() counts sentences exactly and rejects if count is not 2 or 3 |

  ## Implementation Notes

  - Feature module will be ~110 lines following feature_264 as reference
  - All error handling is explicit with detailed logging for troubleshooting
  - No changes to existing utilities or configuration needed
  - Feature runs isolated on pre-created branch (feat/markdown-file-creation-5d08db)
  - Full end-to-end testing validates all success criteria before commit
