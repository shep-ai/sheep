content: |
  ## Summary

  Feature 265 requires a single implementation task: create the feature_265 module that orchestrates
  existing utilities into the complete markdown file creation workflow.

  The task is straightforward because all required utilities already exist and are proven across 264+
  preceding features. The feature module is thin orchestration code (~110 lines) that:
  1. Generates markdown content with H1 heading + 2-3 sentences via Claude API
  2. Writes file to disk with UTF-8 encoding, no BOM, Unix LF line endings, trailing newline
  3. Validates markdown structure, grammar, and coherence
  4. Commits file with conventional message format and feature number
  5. Pushes to remote branch

  All heavy lifting is handled by content_generators.py utilities. The feature module just
  coordinates these in the right sequence with feature-level logging and error handling.

  Testing follows TDD: write tests that verify end-to-end behavior (file exists, has correct
  content, is committed and pushed), implement minimal feature code to pass tests, then refactor
  to match feature_264 style and quality.

  Estimated effort: 1.5 hours including testing and refactoring.
