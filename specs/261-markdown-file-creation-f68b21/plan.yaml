# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown test file following the established pattern from
  260+ identical test files already in the repository. The implementation is minimal and
  isolated: no modifications to application code, no dependencies beyond Python standard
  library and git, no impact on existing architecture or systems.

  The feature fits within the test artifact pattern observed in the repository root,
  where test-*.md files serve as validation artifacts for the Sheep automated implementation
  platform. Each file is independent, following the same structure: H1 heading + blank line
  + 2-3 sentences of coherent prose.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `Path('test-hkb9oa.md').write_text(content, encoding='utf-8', newline='\n')`

  **Rationale:**
  - Modern Python 3.11+ standard for file I/O
  - Explicit encoding and newline parameters provide precise control required by spec
  - Clean, readable syntax compared to open() or os module
  - Used successfully across 260+ existing test files in repository
  - No external dependencies required (standard library)

  **Alternatives considered:**
  - `open()` function: more verbose, requires context management
  - `os` module: legacy approach, less safe
  - Raw string operations: less maintainable

  ### 2. Encoding: UTF-8 without Byte Order Mark

  **Chosen:** `encoding='utf-8'` parameter (not 'utf-8-sig')

  **Rationale:**
  - Explicitly required by FR-5: "UTF-8 without Byte Order Mark"
  - Using 'utf-8' (not 'utf-8-sig') ensures no BOM is added
  - Matches encoding used in 260+ existing test files
  - Standard for modern text files and markdown

  **Alternatives considered:**
  - 'utf-8-sig': would add BOM, violates requirement
  - Default system encoding: platform-dependent, violates requirement
  - Manual BOM stripping: unnecessary complexity

  ### 3. Line Endings: Unix LF

  **Chosen:** `newline='\n'` parameter in Path.write_text()

  **Rationale:**
  - Explicitly required by FR-6: "Unix LF line endings (\n)"
  - Using `newline='\n'` forces LF across all platforms (Windows uses \r\n by default)
  - Most direct and efficient approach
  - Matches line endings in 260+ existing test files
  - Ensures consistent line endings regardless of where code runs

  **Alternatives considered:**
  - `os.linesep`: platform-dependent, would use CRLF on Windows
  - Default behavior: platform-dependent, unclear
  - Post-write replacement: adds complexity, less efficient

  ### 4. Git Command Execution: subprocess module

  **Chosen:** `subprocess.run()` for git add, commit, and push operations

  **Rationale:**
  - Part of Python standard library (no external dependencies, satisfies NFR-4)
  - Safe command execution without shell injection risk
  - Proper error handling and output capture
  - Established pattern across 260+ prior feature implementations

  **Alternatives considered:**
  - GitPython library: introduces external dependency (violates NFR-4)
  - os.system(): less safe, harder error handling
  - os.popen(): less portable, not recommended

  ### 5. Content Generation: Hardcoded prose

  **Chosen:** Single hardcoded string with H1 title + blank line + 2-3 sentences

  **Rationale:**
  - This is a single-file creation with one-time content requirement
  - Hardcoded prose is simplest, most readable, most maintainable
  - No variation or reuse case justifies template system or generation
  - Matches approach across 260+ existing test files in repository
  - Allows arbitrary topic selection with no constraints (per NFR-7)

  **Alternatives considered:**
  - Template system (Jinja2): unnecessary complexity, adds dependency
  - Randomized generation: adds complexity, no variation requirement
  - External content files: unnecessary I/O, no reuse case

  ## Implementation Strategy

  ### Phase 1: File Content Creation

  The first phase creates the markdown file with correct structure and encoding. This is
  sequenced first because the file must exist before git operations can stage it.

  Steps:
  1. Define prose content: H1 heading and 2-3 coherent sentences
  2. Write file using pathlib.Path with UTF-8 encoding and LF line endings
  3. Verify file encoding, line endings, and size meet spec requirements

  ### Phase 2: Git Integration

  The second phase stages, commits, and pushes the file. This is sequenced after Phase 1
  because the file must exist before git can track it.

  Steps:
  1. Stage file with `git add test-hkb9oa.md`
  2. Commit with conventional message: `feat(261): Create markdown file test-hkb9oa.md with prose content`
  3. Push to feature branch: `git push -u origin HEAD`

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding issues (CRLF instead of LF, BOM added) | High | Use explicit `newline='\n'` and `encoding='utf-8'` (not utf-8-sig) in Path.write_text() — verified in Phase 1 |
  | Git command failure (network issues, permission denied) | Medium | Use subprocess.run() with error checking; verify commit exists before pushing |
  | File size outside 300-600 byte range | Low | Verify size in Phase 1; typical prose content naturally falls within range |
  | Incorrect commit message format | Low | Use exact conventional commit message from spec: `feat(261): Create markdown file test-hkb9oa.md with prose content` |
  | File not staged for commit | Low | Verify file is staged with `git status` before running commit command |
