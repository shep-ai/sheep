# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 302 implements markdown file creation across 5 ordered tasks in 3 phases.

  **Phase 1 (File Creation)**: Task 1 creates the Python script and implements file writing with hardcoded prose. The foundation for all subsequent work.

  **Phase 2 (Validation)**: Tasks 2-3 add comprehensive pre-commit validation. Task 2 checks encoding (UTF-8 without BOM) and line endings (Unix LF). Task 3 validates file structure (H1 heading, blank line, 2-3 sentences) and file size (300-800 bytes). These checks run before any git operations to prevent silent failures.

  **Phase 3 (Git Integration & Testing)**: Task 4 implements git operations (add, commit, push) with fail-fast error handling using subprocess. Task 5 integrates all three phases in main(), adds top-level error handling, and includes end-to-end integration testing to verify the entire workflow succeeds.

  Each task includes RED-GREEN-REFACTOR TDD cycles:
  - **RED**: Write test first, verify it fails
  - **GREEN**: Implement minimal code to pass test
  - **REFACTOR**: Clean up, extract helpers, improve clarity

  Dependencies flow sequentially: file creation → encoding validation → structure validation → git operations → integration. No task begins before its dependencies complete.

  **Total Effort**: 1.5-2 hours including all TDD cycles, error handling, and integration testing. Aligned with S-size estimate from feature specification.

  ## Architecture Notes

  - Single Python script: create_file_302.py
  - Functions: create_file(), validate_encoding(), validate_structure(), run_git_operations(), main()
  - All standard library (pathlib, subprocess, sys)
  - Fail-fast semantics: any error exits immediately with clear message
  - Comprehensive validation before git operations prevents corrupt state
  - Exit code 0 for success, non-zero for failure (CI/CD compatible)

  ## Test Strategy

  - Unit tests for each function (encoding, structure, git operations)
  - Integration test runs full workflow end-to-end
  - Tests verify file content, encoding, git state after operations
  - Test cleanup ensures repeatability (remove created file/git history)
