content: |
  ## Problem Statement

  Feature 302 requires creating a single markdown file named test-94uqvv.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose content
  - Exactly 2-3 sentences of coherent prose content
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 302nd iteration of a well-established feature pattern successfully executed 301+ times in the Sheep codebase. The implementation directly follows the proven approach from features 297-301 with no architectural deviation.

  ## Success Criteria

  - [ ] File test-94uqvv.md created at repository root (no subdirectories)
  - [ ] File content starts with H1 heading on first line (matches pattern: # <Title>)
  - [ ] Blank line present between H1 heading and prose content (line 2 is empty)
  - [ ] Prose content contains exactly 2-3 sentences (lines 3+)
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are Unix LF (not CRLF)
  - [ ] File size is between 300-800 bytes (validates reasonable content length)
  - [ ] File staged with `git add test-94uqvv.md`
  - [ ] File committed with message matching pattern: `feat(302): create markdown file test-94uqvv.md with prose content`
  - [ ] Commit pushed to remote successfully
  - [ ] Script exits with code 0 (success)
  - [ ] All validation steps complete without errors

  ## Functional Requirements

  - **FR-1**: Create a markdown file at repository root with filename test-94uqvv.md
  - **FR-2**: File content must start with an H1 heading (# <Title>) on line 1
  - **FR-3**: File content must have a blank line (line 2) separating heading from prose
  - **FR-4**: File content must contain exactly 2-3 sentences of coherent prose after the blank line
  - **FR-5**: Write file using UTF-8 encoding without BOM and Unix LF line endings
  - **FR-6**: Validate file size is between 300-800 bytes before git operations
  - **FR-7**: Validate H1 heading exists in first line before git operations
  - **FR-8**: Validate blank line separator exists at line 2 before git operations
  - **FR-9**: Validate prose content exists (2-3 sentences) before git operations
  - **FR-10**: Stage file with `git add test-94uqvv.md`
  - **FR-11**: Commit file with message: `feat(302): create markdown file test-94uqvv.md with prose content`
  - **FR-12**: Push commit to remote with `git push`
  - **FR-13**: Script returns exit code 0 on successful completion
  - **FR-14**: Script returns non-zero exit code with error message if any step fails

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (ensures cross-platform compatibility)
  - **NFR-2**: Line endings must be Unix LF, not CRLF (maintains git consistency across Windows/Unix)
  - **NFR-3**: Implementation must follow established pattern from features 297-301 (consistency, maintainability)
  - **NFR-4**: Error messages must be clear and actionable (aid debugging and incident response)
  - **NFR-5**: Validation must fail-fast on any error to prevent partial/inconsistent state
  - **NFR-6**: Python implementation must use pathlib.Path for cross-platform file operations
  - **NFR-7**: Git operations must use subprocess with check=True for strict error handling
  - **NFR-8**: Code must be maintainable and similar in structure to features 297-301 for consistency
  - **NFR-9**: Execution time must be <5 minutes including file creation, validation, and git push
  - **NFR-10**: No external dependencies beyond Python standard library and Git CLI

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be hardcoded or randomly selected? | Hardcode meaningful text | Matches established pattern (features 297-301 each have own content), ensures reproducibility, simplifies testing |
  | 2 | Should validation be comprehensive or minimal? | Comprehensive validation | Proven pattern across 300+ features, catches encoding/size issues early, negligible performance impact |
  | 3 | Should script fail immediately on error or attempt recovery? | Fail fast with clear errors | Established pattern, prevents inconsistent state, makes debugging easier, maintains system reliability |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | test-94uqvv.md will be created at root directory following established convention |
  | .git/ directory | Medium | Git staging, commit, and push operations will modify commit history and update remote tracking |
  | spec directory | Low | No changes needed to codebase; specification file describes the feature |

  ## Dependencies

  **Internal Dependencies**:
  - Python pathlib.Path for cross-platform file operations
  - Python subprocess module for git command execution
  - Python sys module for exit codes

  **External Dependencies**:
  - **Git CLI**: Executable for staging, committing, pushing (subprocess integration)
  - **Python Standard Library**: pathlib, subprocess, sys (all included in Python 3.x)

  **No New Dependencies Required**: All required infrastructure is already in place and proven across 301+ prior features.

  ## Size Estimate

  **S** (1-2 hours including testing)

  **Rationale**:
  - The implementation follows an established pattern with 301 prior implementations as direct reference
  - Core tasks: (1) create Python script with file I/O (~20 lines), (2) validate file structure/encoding/size (~20 lines), (3) execute git operations (~10 lines)
  - No architectural changes, no dependency updates, no complex logic
  - Validation logic is straightforward assertions (file exists, size range, H1 heading check, blank line check, sentence count)
  - Risk is minimal due to proven pattern across 300+ iterations
  - Typical execution time: <5 minutes including file creation, validation, and git push
