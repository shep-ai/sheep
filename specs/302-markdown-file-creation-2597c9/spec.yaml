content: |
  ## Problem Statement

  Feature 302 requires creating a single markdown file named test-94uqvv.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 302nd iteration of a well-established feature pattern successfully executed 301+ times in the Sheep codebase. The implementation directly follows the proven approach from features 297-301 with no architectural deviation.

  ## Codebase Analysis

  ### Project Structure
  The repository is the "Sheep" agentic platform with multiple test features creating markdown files:
  - **Root directory**: Contains markdown files (test-*.md) created by each feature
  - **specs/**: Each feature has a numbered subdirectory (e.g., 302-markdown-file-creation-2597c9) containing YAML spec files
  - **Python scripts**: Multiple create_markdown_file_*.py scripts demonstrating the pattern (features 282-301+)
  - **.git/**: Git repository for version control with 300+ feature commits

  ### Architecture Patterns
  The codebase uses a simple, repetitive pattern proven across 300+ features:

  1. **File Creation**: Python script using pathlib.Path.write_bytes() for explicit encoding control
  2. **Validation**: Simple assertions checking file existence, size, H1 heading, blank line, and prose content
  3. **Git Integration**: Three-step subprocess workflow (git add → git commit → git push)
  4. **Error Handling**: Try-except blocks with clear error messages and exit codes

  The pattern is standardized:
  - All files follow identical structure: H1 heading + blank line + 2-3 sentences
  - All commits use conventional format: `feat(N): create markdown file ...`
  - All validations check the same criteria: size (300-800 bytes), structure (H1 + blank line + prose), encoding (UTF-8)
  - All git operations use identical subprocess calls with check=True for strict error handling

  ### Relevant Technologies
  - **Python 3.x**: Core implementation language with pathlib and subprocess modules
  - **pathlib.Path**: Cross-platform file operations with explicit UTF-8 encoding
  - **subprocess**: Git command execution (add, commit, push)
  - **Git CLI**: Version control operations

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | test-94uqvv.md will be created at root directory following established convention |
  | .git/ directory | Medium | Git staging, commit, and push operations will modify commit history and update remote tracking |
  | spec directory | Low | No changes needed to codebase; specification file describes the feature |

  ## Dependencies

  **Internal Dependencies**:
  - Python pathlib.Path for cross-platform file operations
  - Python subprocess module for git command execution

  **External Dependencies**:
  - **Git CLI**: Executable for staging, committing, pushing (subprocess integration)
  - **Python Standard Library**: pathlib, subprocess, sys

  **No New Dependencies Required**: All required infrastructure is already in place and proven across 301+ prior features.

  ## Size Estimate

  **S** (hours, 1-2 hours including testing)

  **Rationale**:
  - The implementation follows an established pattern with 301 prior implementations as direct reference
  - Core tasks: (1) create Python script with file I/O, (2) validate file structure/encoding/size, (3) execute git operations
  - No architectural changes, no dependency updates, no complex logic
  - Validation logic is straightforward assertions (file exists, size range, H1 heading check, blank line check)
  - Main implementation: ~50 lines of Python (create_file, validate_file, git_operations, main functions)
  - Risk is minimal due to proven pattern across 300+ iterations
  - Typical execution time: <5 minutes including file creation, validation, and git push

