# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-28

  ## Technology Decisions

  ### 1. File Writing Method

  **Chosen:** Use pathlib.Path.write_text() with explicit UTF-8 encoding

  **Rejected:**
  - Built-in open() function — less elegant, requires explicit file handle management
  - os module approaches — outdated; pathlib is the modern standard since Python 3.4
  - Third-party libraries — unnecessary; Python standard library is sufficient

  **Rationale:** pathlib is explicitly required by NFR-5 and is the Python standard for file I/O. Provides clean interface: `Path('test-b8svdl.md').write_text(content, encoding='utf-8')`. Matches pattern across all 180+ existing test files.

  ### 2. Git Integration Method

  **Chosen:** Use subprocess.run() with list-based command syntax (safe, no shell injection)

  **Rejected:**
  - GitPython library — adds external dependency not needed for simple commands
  - Shell command strings — vulnerable to injection; platform-specific path issues
  - Programmatic git APIs — overkill; overly complex for straightforward operations

  **Rationale:** subprocess.run() is Python standard library, supports safe list-based syntax, integrates well with error handling (check=True). Usage: `subprocess.run(['git', 'add', 'test-b8svdl.md'], check=True)`. No new dependencies introduced.

  ### 3. Content Generation

  **Chosen:** Hardcoded prose content with implementer-selected topic

  **Rejected:**
  - Template-based system — unnecessary complexity for single-file creation
  - Random/procedural generation — adds complexity; contradicts product decision #2 (free-form topic)
  - Content service/library — over-engineered for test artifacts

  **Rationale:** Hardcoded content matches pattern of 180+ existing test files, each with unique, meaningful prose. Product decision #2 specifies free-form topic selection. Implementer manual selection ensures quality and readability (FR-5). No automation or templates used in existing files.

  ### 4. File Validation

  **Chosen:** Post-creation validation: check structure, encoding, and size

  **Rejected:**
  - Pre-creation validation — not applicable; must validate actual output
  - No validation — insufficient; success criteria require measurable verification
  - External tools — unnecessary; simple Python checks suffice

  **Rationale:** Simple Python checks verify: file existence, markdown structure (H1 + blank line + prose), UTF-8 encoding, file size (~400-600 bytes natural outcome per product decision #1). No external tools or dependencies needed.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O operations | Use (required by NFR-5) | Standard library, modern Python standard since 3.4, explicitly required in spec |
  | subprocess | Git command execution | Use (standard library) | Safe subprocess execution with list-based syntax, prevents shell injection, no external dependencies |
  | GitPython | Git programmatic API | Reject | Adds external dependency; subprocess suffices for simple git add/commit/push operations |
  | os module | File/path operations | Reject | pathlib is preferred modern standard; os module is legacy approach |
  | No external dependencies | Content generation, validation | Use | Python standard library sufficient for file creation, validation, and git workflow |

  ## Security Considerations

  **File I/O Security:**
  - Use pathlib.Path.write_text(encoding='utf-8') to ensure UTF-8 encoding without BOM
  - File is created at repository root with no privilege escalation or permission issues
  - File content is deterministic and controlled; no user input injection risk
  - No sensitive data in file content; test artifact only

  **Git Integration Security:**
  - Use subprocess.run() with list-based command syntax (not shell=True) prevents shell injection
  - Git commands are fixed strings, not derived from user input
  - Commits use conventional message format; no variable interpolation
  - Feature branch is pre-created; no branch manipulation attacks possible

  **No Authentication/Authorization Issues:**
  - Git operations use default local configuration (user.name, user.email)
  - File creation has no access control implications
  - No secrets or credentials in file or git operations

  **Encoding Safety:**
  - Explicit UTF-8 encoding specification prevents BOM or other encoding issues
  - All 180+ existing test files use UTF-8 without BOM; approach is proven safe
  - No multi-byte character handling risks; ASCII/UTF-8 is well-defined

  ## Performance Implications

  **Minimal Performance Impact:**
  - Single file creation: negligible I/O overhead (~400-600 bytes)
  - Subprocess calls are lightweight for simple git commands
  - No loops, batch processing, or optimization needed
  - Size estimate: 10-15 minutes (per spec) includes file creation, validation, and git workflow

  **No Performance Optimizations Needed:**
  - Single file creation is inherently fast
  - Git operations are standard workflow, no optimization possible
  - No caching, batching, or parallelization applicable
  - File validation is post-hoc and lightweight (simple Python string checks)

  **Scalability:**
  - Approach scales across 180+ existing test files (proven pattern)
  - No architectural limitations
  - No performance degradation as repository grows

  ## Architecture Notes

  **Established Pattern (180+ Precedents):**
  - Test markdown files at repository root are validation artifacts, not application code
  - No dependencies on /src/sheep/ or application source code
  - Isolated file creation with standard git workflow
  - Each test file is independent; no cross-file interactions

  **Integration Points:**
  - Feature branch: pre-created as `feat/250-markdown-file-creation-5a4396`
  - Repository root: location for test-b8svdl.md (per FR-2)
  - Git workflow: standard add/commit/push (per FR-6 through FR-9)
  - No application code modifications; no impact on /src/sheep/, /tests/, or configuration

  **Codebase Patterns:**
  - Python pathlib: standard in modern Python projects (3.4+)
  - subprocess: standard for external command execution
  - Git workflow: conventional commit messages (per existing pattern)
  - No new conventions or patterns introduced

  ## Implementation Summary

  **Steps:**
  1. Create markdown content: `# <Title>\n\n<2-3 sentences of prose>`
  2. Write file using pathlib: `Path('test-b8svdl.md').write_text(content, encoding='utf-8')`
  3. Validate: check file exists, size ~400-600 bytes, UTF-8 encoding, markdown structure
  4. Stage file: `subprocess.run(['git', 'add', 'test-b8svdl.md'], check=True)`
  5. Commit: `subprocess.run(['git', 'commit', '-m', 'feat(250): create markdown file test-b8svdl.md with prose content'], check=True)`
  6. Push: `subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)`

  **Resources Required:**
  - Python 3.11+ (runtime)
  - File system access (write to repository root)
  - Git configuration (user.name, user.email for commits)
  - Feature branch: `feat/250-markdown-file-creation-5a4396` (pre-created)

  **Risks:**
  - None identified. Well-established pattern across 180+ test files; proven approach.
  - Minor: Git operations depend on repository connectivity; assumed to be available.

