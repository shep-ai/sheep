content: |
  ## Summary

  This feature implements a simple, single-file creation task in 5 concrete tasks across 2 phases.

  **Phase 1: File Creation & Validation (3 tasks, ~11 minutes)**
  - Task 1: Create markdown file with H1 heading and 2-3 sentences of prose using pathlib (5 min)
  - Task 2: Validate file encoding (UTF-8 without BOM) and line endings (LF only) (3 min)
  - Task 3: Validate file structure matches requirements, check file size is in expected range (3 min)

  **Phase 2: Git Integration & Verification (2 tasks, ~4 minutes)**
  - Task 4: Stage and commit file with exact conventional commit message, verify git operations (2 min)
  - Task 5: Push to remote origin, run comprehensive validation of all success criteria (2 min)

  **TDD Approach Throughout:**
  Each task follows RED-GREEN-REFACTOR: write tests first (RED), implement minimal code to pass (GREEN), clean up and improve (REFACTOR).
  Tests validate structure, encoding, git operations, and final success criteria. No task implements without test coverage.

  **Key Implementation Details:**
  - Use `pathlib.Path.write_text(content, encoding='utf-8')` for file creation (per NFR-5)
  - Use `subprocess.run(['git', ...], check=True)` for git operations (safe, standard library)
  - Hardcode markdown content with meaningful, implementer-selected topic (product decision #2)
  - Post-creation validation verifies structure, encoding, line endings, and size
  - All 10 success criteria from spec are validated by task 5

  **Effort Breakdown:**
  - Task 1 (Create file): 5 minutes
  - Task 2 (Validate encoding): 3 minutes
  - Task 3 (Validate structure): 3 minutes
  - Task 4 (Git add/commit): 2 minutes
  - Task 5 (Git push + final validation): 2 minutes
  - **Total: 15 minutes** (consistent with S size estimate in spec)

  ---

  _Task breakdown complete. Ready for implementation._
