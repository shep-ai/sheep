# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-25
  - **Decision Status:** All technical decisions finalized with reference to feature 212 and 200+ precedent files
  - **Dependencies:** None — standard library only (pathlib, subprocess)

  ## Overview

  Feature 213 follows the well-established markdown file creation pattern from features 151-212. This research validates the technical approach for implementing a deterministic feature that creates a markdown test file with hard-coded content and git integration.

  All major architectural decisions have been predetermined by the extensive precedent of 200+ existing test markdown files and the reference implementations in features 212 and 211. This feature requires no new technical approaches or external dependencies.

  ## Technology Decisions

  ### 1. File I/O Mechanism: pathlib.Path.write_text()

  **Chosen:** Python `pathlib.Path.write_text()` with default UTF-8 encoding

  **Rejected Alternatives:**
  - **open() with manual file writing** — More verbose, requires explicit `encoding='utf-8'` and `newline=''` parameters, harder to get right across platforms
  - **Third-party file libraries** — Adds external dependencies and deployment complexity for a simple operation
  - **Subprocess-based file creation** — Less Pythonic, harder to control encoding, potential shell injection risks

  **Rationale:** pathlib.Path.write_text() is the standard, Pythonic approach in Python 3.11+. It automatically handles UTF-8 encoding as the default and ensures LF line endings on all platforms — this is a critical cross-platform requirement. The method signature is simple: `Path(filename).write_text(content)`. This approach follows the proven pattern from feature 212 and all 200+ existing test files in the repository.

  Python's documentation guarantees that text mode write operations produce LF (\\n) on all platforms including Windows, which satisfies the NFR-2 requirement for Unix-style line endings. No configuration needed; using it as-is meets all requirements.

  ### 2. Git Integration: subprocess.run() with shell=False

  **Chosen:** Python `subprocess.run()` with shell=False and explicit command lists

  **Rejected Alternatives:**
  - **GitPython library** — External dependency that violates NFR-6; adds unnecessary abstraction for simple sequential operations
  - **os.system()** — Inherent command injection risk; violates security best practices; deprecated for new code
  - **Direct git internals or plumbing commands** — Unnecessary complexity; standard git CLI is reliable and auditable

  **Rationale:** subprocess.run() with shell=False is the secure, recommended approach per Python security documentation. The shell=False parameter is critical — it executes commands directly without shell interpretation, preventing command injection attacks. Using a list of arguments prevents accidental shell expansion.

  Example usage pattern:
  ```python
  import subprocess
  subprocess.run(["git", "add", "test-lyi2gl.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(213): Create markdown file test-lyi2gl.md"], check=True)
  subprocess.run(["git", "push"], check=True)
  ```

  The `check=True` parameter causes subprocess to raise CalledProcessError if any command returns a non-zero exit code, enabling fail-fast error handling. This pattern matches features 211-212 and is the standard approach for secure git execution.

  ### 3. Content Generation: Hard-Coded Deterministic Prose

  **Chosen:** Hard-coded, deterministic prose content with no randomization

  **Rejected Alternatives:**
  - **API-based generation** — Would require external API calls (Claude, GPT, etc.), introduce network latency and non-determinism, violate NFR-6 and NFR-7
  - **Template or procedural generation** — Unnecessary complexity; reduces transparency and testability
  - **Dynamic content from external sources** — Violates determinism requirement; introduces dependencies and brittleness

  **Rationale:** Hard-coded content provides deterministic, reproducible, fully-auditable output. The requirement allows free-form topic selection, so any topic is valid. This approach is proven by features 209-212 and all 200+ existing test files.

  The prose must follow the structure:
  - H1 markdown heading (`# Title`)
  - Blank line
  - 2-3 sentences of prose (300-800 bytes total)

  Example content structure:
  ```markdown
  # Title Text Here

  First sentence explaining the topic. Second sentence providing more detail and context. Third sentence concluding the thought with additional insight.
  ```

  ### 4. Encoding and Line Ending Handling

  **Chosen:** Rely on pathlib.Path.write_text() defaults (UTF-8, no BOM, LF)

  **Rejected Alternatives:**
  - **Explicit parameters to write_text()** — Duplicates defaults, introduces unnecessary complexity
  - **Post-creation line ending conversion** — Error-prone, unnecessary overhead
  - **Platform-specific conditional logic** — Unnecessary complexity; pathlib handles all platforms identically

  **Rationale:** Python 3's pathlib.Path.write_text() is designed to handle encoding and line endings correctly:
  - **Encoding:** Default is UTF-8 (per Python 3 specification) — no BOM is produced
  - **Line Endings:** Text mode automatically produces LF (\\n) on all platforms, including Windows

  This behavior is codified in Python's specification and tested across billions of deployments. Using the method as-is (without parameters) ensures maximum clarity and correctness. No explicit configuration is needed.

  Verification can be done post-creation:
  - Check that file opens and encodes/decodes as UTF-8
  - Verify `\\r\\n` (CRLF) does not appear in the file (only `\\n`)

  ### 5. Error Handling Strategy

  **Chosen:** Fail-fast with specific exception handling and clear error reporting

  **Rejected Alternatives:**
  - **No error handling** — Would hide failures and break integration with Sheep automation
  - **Broad catch-all exceptions** — Masks specific problems; hides bugs; makes debugging difficult
  - **Retry logic** — Unnecessary for deterministic operations; can hide underlying issues

  **Rationale:** Specific exception handling enables proper debugging and integration:
  - `FileNotFoundError` — If repository root doesn't exist or isn't writable
  - `ValueError` — If content validation fails (missing H1, blank line, etc.)
  - `subprocess.CalledProcessError` — If git commands fail (not in a repo, not configured, etc.)
  - Generic `Exception` — Catch-all for unexpected issues with clear logging

  This approach provides transparency and enables the Sheep automation platform to diagnose failures accurately.

  ### 6. File Naming and Path Strategy

  **Chosen:** Hard-coded filename 'test-lyi2gl.md' in repository root via pathlib.Path.cwd()

  **Rejected Alternatives:**
  - **Environment variables for path** — Introduces external dependencies; harder to test
  - **Command-line arguments** — Unnecessary complexity for a fixed filename
  - **Relative path calculations** — Less reliable and harder to understand

  **Rationale:** The specification provides the exact target filename and location. Using a hard-coded path is appropriate, transparent, and deterministic. pathlib.Path.cwd() reliably resolves the repository root in the standard workflow. This matches the established pattern and requires no external parameters.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O for markdown file creation | **Use (stdlib)** | Part of Python standard library since 3.4; provides cross-platform file creation with automatic UTF-8 and LF handling; zero configuration needed |
  | subprocess | Execute git commands (add, commit, push) | **Use (stdlib)** | Part of Python standard library; shell=False prevents command injection; transparent and secure; matches established pattern in Sheep project |
  | GitPython | Alternative git integration | **Reject** | External dependency violates NFR-6 (stdlib only); unnecessary wrapper for simple sequential git operations; adds deployment complexity |
  | markdown / commonmark | Markdown validation/parsing | **Reject** | External dependencies; unnecessary for this simple, well-structured markdown format; static validation is sufficient |
  | random / uuid | Content generation | **Reject** | Violates NFR-7 (deterministic behavior); hard-coded content is appropriate and matches precedent |
  | requests / urllib | Content from external sources | **Reject** | Violates NFR-6 (stdlib only) and NFR-7 (deterministic); content must be hard-coded |

  ## Security Considerations

  ### Command Injection Prevention
  **Risk:** Using os.system(), shell=True, or unvalidated strings in git commands could enable command injection.

  **Mitigation:** Use subprocess.run() with shell=False and explicit argument list:
  ```python
  subprocess.run(["git", "add", "test-lyi2gl.md"], check=True)  # Safe
  # NOT: subprocess.run("git add test-lyi2gl.md", shell=True)  # Dangerous
  ```

  **Status:** ✅ Mitigated by design — shell=False is enforced; hard-coded filename prevents injection vectors

  ### File System Security
  **Risk:** File creation could be exploited via path traversal or unsafe file operations.

  **Mitigation:** Hard-coded filename with no user input; pathlib handles file operations safely; standard file permissions.

  **Status:** ✅ Mitigated — no user input in path; hard-coded filename prevents traversal attacks

  ### Dependency Supply Chain
  **Risk:** External dependencies could introduce vulnerabilities or unexpected behavior changes.

  **Mitigation:** NFR-6 requires standard library only; no external packages.

  **Status:** ✅ No external dependencies — Python standard library only

  ### Content Integrity
  **Risk:** Hard-coded content could contain unexpected special characters or markdown that breaks parsing.

  **Mitigation:** Content is reviewed and controlled; simple prose with no special characters, code blocks, or complex markdown syntax.

  **Status:** ✅ Mitigated — content is pre-reviewed and intentionally simple

  ## Performance Implications

  ### Runtime Performance
  - **File I/O:** Single pathlib.write_text() call — negligible (<1ms)
  - **File read-back for validation:** Single read_text() call — negligible (<1ms)
  - **Git operations:** Sequential subprocess calls for add/commit/push — typically 1-5 seconds depending on network latency (I/O-bound, not CPU-bound)
  - **Total runtime:** Expected 1-6 seconds, dominated by network latency of git push

  ### Resource Usage
  - **Memory:** Minimal — one small file content (~400 bytes) + git command overhead
  - **Disk:** Adds ~400 bytes + git metadata; negligible compared to repository size
  - **Network:** Single git push generates minimal traffic (metadata-only push if using shallow clone)

  ### Optimization Opportunities
  - **No optimization needed** — this feature has no performance-critical path
  - Sequential git operations (add → commit → push) are correct and optimal for this use case
  - No parallelization benefits for 3 simple sequential operations

  ## Architecture Notes

  ### Fit with Sheep Project Architecture

  **Self-Testing via File Creation:** The Sheep project is an automated implementation platform that tests itself by creating markdown test files. This demonstrates end-to-end functionality: code generation → file creation → git integration → branch management. Feature 213 continues this pattern, adding the 213th test file to the repository.

  **Precedent from 200+ Test Files:** Features 151-212 created 200+ similar markdown files following identical patterns:
  - Same file structure (H1 + blank line + 2-3 sentences)
  - Same technology (Python pathlib, subprocess, git CLI)
  - Same workflow (feature branch, conventional commits, push)
  - Same success rates and reliability

  **Technology Stack Consistency:** Feature 213 uses only Python stdlib (pathlib, subprocess) and git CLI — consistent with all prior features. No external dependencies simplifies deployment, testing, and reliability.

  **Git Workflow Compatibility:** The feature branch `feat/213-markdown-file-creation-bc059e` is pre-created by the Sheep platform. Git operations follow conventional commits (`feat(213): Create markdown file test-lyi2gl.md`) and standard push-to-branch workflow established across all prior features.

  **Deterministic, Testable Implementation:** Hard-coded content, no randomization, deterministic file paths, and sequential git operations make this feature predictable and suitable for automated testing.

  ### Implementation Sequence

  The implementation will follow this order:
  1. Create prose content (H1 heading + 2-3 sentences, 300-800 bytes)
  2. Write file using pathlib.Path.write_text() with deterministic content
  3. Validate file creation:
     - File exists and is readable
     - Content matches expected structure
     - Encoding is UTF-8 (no BOM)
     - Line endings are LF only
     - File size is 300-800 bytes
  4. Execute git operations sequentially:
     - `git add test-lyi2gl.md`
     - `git commit -m "feat(213): Create markdown file test-lyi2gl.md"`
     - `git push`
  5. Verify all operations succeeded

  ### No Code Changes Required

  This is purely a file creation and git workflow feature:
  - No source code modifications
  - No configuration changes
  - No build system updates
  - No dependency upgrades
  - Only new markdown file in repository root

