# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown test file following the established pattern from 200+ precedent
  files in the Sheep project (features 151-212). The Sheep platform is a self-testing automation system
  that validates its code generation and git integration capabilities by creating markdown files as test
  artifacts.

  Feature 213 continues this pattern with no architectural innovation:
  - **File Creation:** Python pathlib.Path.write_text() handles cross-platform UTF-8 encoding and LF
    line endings automatically
  - **Content:** Hard-coded, deterministic prose (no randomization, no external dependencies)
  - **Git Integration:** subprocess.run() with shell=False for secure sequential operations
  - **Validation:** File existence + content structure checks before git operations

  The implementation is deterministic, testable, and transparent — no external APIs, no conditional
  logic, no platform-specific handling needed.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()
  **Chosen:** Python pathlib.Path.write_text() with default UTF-8 encoding and automatic LF handling

  **Rationale:** This is the idiomatic, standard approach in Python 3.11+. pathlib automatically:
  - Encodes content as UTF-8 (standard Python 3 default, no BOM)
  - Produces LF (\\n) line endings on all platforms including Windows
  - Handles cross-platform file paths safely without path separator concerns

  No configuration or parameters needed — using the method as-is satisfies all requirements.
  This approach has been proven across 200+ existing test files and is consistent with features
  211-212. See research.yaml for rejected alternatives (manual file operations, third-party libraries).

  ### 2. Content Generation: Hard-Coded Deterministic Prose
  **Chosen:** Static, hard-coded markdown content with no randomization or external dependencies

  **Rationale:** Provides deterministic, reproducible, fully-auditable output suitable for
  automated testing. The specification allows free-form topic selection (no domain constraints),
  so any topic is valid. Hard-coded content:
  - Requires zero external dependencies (no API calls, no databases)
  - Executes instantly with predictable output
  - Is transparent and auditable
  - Enables test reproducibility and debugging

  This approach follows features 209-212 and is validated by 200+ precedent files. See research.yaml
  for rejection of API-based generation and procedural approaches.

  ### 3. Git Integration: subprocess.run() with shell=False
  **Chosen:** Python subprocess.run() with shell=False and explicit command argument lists

  **Rationale:** Secure, standard approach per Python security guidelines:
  - shell=False prevents command injection by executing commands directly without shell interpretation
  - Explicit argument lists prevent accidental shell expansion
  - check=True raises CalledProcessError on non-zero exit codes (fail-fast error handling)
  - Transparent, auditable command execution with clear output

  Usage pattern (matching features 211-212):
  ```python
  subprocess.run(["git", "add", "test-lyi2gl.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(213): Create markdown file test-lyi2gl.md"], check=True)
  subprocess.run(["git", "push"], check=True)
  ```

  Rejected alternatives (GitPython library adds unnecessary dependency; os.system() is insecure).
  See research.yaml for detailed security analysis.

  ### 4. Error Handling: Fail-Fast with Specific Exception Catching
  **Chosen:** Specific exception handling with clear error reporting and proper exit codes

  **Rationale:** Enables transparent debugging and integration with Sheep automation platform:
  - FileNotFoundError: Repository root not accessible
  - ValueError: Content validation fails (missing H1 heading, wrong structure, etc.)
  - subprocess.CalledProcessError: Git command fails (not in repo, not configured, etc.)
  - Generic Exception: Unexpected errors with clear logging

  Early validation of content structure (H1 heading, blank line, prose sentences) catches errors
  before git operations attempt. Fail-fast approach prevents partial state (e.g., file created but
  not committed).

  ### 5. File Validation Before Git Operations
  **Chosen:** Explicit validation step between file creation and git workflow

  **Rationale:** Ensures correctness before irreversible git operations:
  - File exists and is readable
  - Content matches structure: H1 heading + blank line + 2-3 sentences
  - UTF-8 encoding with no BOM
  - LF line endings only (no CRLF)
  - File size 300-800 bytes (consistent with precedent)

  This validation step (covered in phase-1 task-2) provides defense-in-depth and clear error
  reporting if anything is wrong before attempting git operations.

  ## Implementation Strategy

  **Phase 1: File Creation & Validation** comes first to establish the artifact and validate
  correctness before any irreversible git operations:
  - Task 1: Create markdown file with hard-coded content using pathlib.write_text()
  - Task 2: Validate file properties (encoding, line endings, structure, size)

  **Phase 2: Git Integration** follows only after validation succeeds:
  - Task 3: Execute git add, commit, push in sequence with fail-fast error handling

  This ordering ensures that any file creation errors are caught and reported clearly without
  polluting git history. Sequential git operations (not parallel) are correct because each depends
  on the previous (add must precede commit, commit must precede push).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding wrong (CRLF instead of LF, UTF-16 instead of UTF-8) | Rely on pathlib.Path.write_text() documented behavior; explicit validation in phase-1 task-2 checks line endings and encoding before git operations |
  | File content structure invalid (missing H1, wrong number of sentences) | Explicit content validation in phase-1 task-2 before git operations; fail-fast on validation errors |
  | Git not configured or not in repository | subprocess.CalledProcessError caught and reported clearly; enables proper error diagnosis |
  | File already exists and gets overwritten | Hard-coded filename test-lyi2gl.md is unique per feature; feature branch is clean per spec; minimal risk of conflicts |
  | Git push fails due to network or permissions | subprocess error handling provides clear error message; can be retried at automation platform level |
  | Content too long or too short | Validation step checks file size 300-800 bytes; enforced before git operations |
  | Cross-platform line ending issues (Windows CRLF vs Linux LF) | pathlib.Path.write_text() automatically produces LF on all platforms; validation checks for no CRLF |

  ## Phase Dependencies

  - Phase 1 (File Creation & Validation) has no dependencies — can start immediately
  - Phase 2 (Git Integration) depends on Phase 1 success — only proceeds after validation passes
