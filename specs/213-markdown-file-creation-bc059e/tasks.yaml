# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 213 implements a straightforward markdown file creation following the proven pattern from 200+ precedent
  files (features 151-212). The implementation consists of three sequential tasks across two phases:

  **Phase 1: File Creation & Validation** (tasks 1-2, ~8 min)
  - Create test-lyi2gl.md using pathlib.Path.write_text() with hard-coded deterministic prose
  - Validate file properties: UTF-8 encoding, LF line endings, size 300-800 bytes, content structure (H1 + blank line + 2-3 sentences)

  **Phase 2: Git Integration** (task 3, ~4 min)
  - Execute git add, commit (conventional format), push sequentially using subprocess.run(shell=False)

  All tasks use standard Python library only (pathlib, subprocess); no external dependencies. Tasks are ordered
  sequentially with explicit dependencies (task-2 depends on task-1 success, task-3 depends on task-2 success).
  Each task includes TDD cycle: write assertions first (RED), implement minimal code (GREEN), refactor (REFACTOR).

  ## Task Flow

  1. **task-1 (5 min):** Create file with hard-coded content using pathlib
  2. **task-2 (3 min):** Validate encoding, line endings, file size, content structure
  3. **task-3 (4 min):** Git add → commit (conventional message) → push

  Total: **12 minutes** (matches spec estimate of S/10-15 min)

  The sequential ordering ensures that file creation errors are caught before git operations (fail-fast),
  preventing git history pollution or partial state. Each task is independently testable and provides clear
  error reporting if validation fails.
