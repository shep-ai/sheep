content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-30
  - **Status:** Plan Complete

  ## Architecture Overview

  This feature creates a single markdown test file following an established pattern
  replicated 280+ times in the Sheep project. The implementation is straightforward
  with no architectural complexity or codebase modifications:

  - **No source code changes** — feature is purely artifact creation
  - **No external dependencies** — uses Python standard library (pathlib) and system git
  - **Isolated scope** — creates one file in repository root, no impact on existing code
  - **Proven pattern** — direct precedent from features 69-283, confirming correctness

  The feature fits naturally into the existing codebase's test artifact organization
  without requiring any architectural decisions or integration points.

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Decision:** Use `pathlib.Path.write_text()` from Python standard library

  **Alternatives Considered:**
  - `os.path` — Older API, more verbose, less readable
  - Manual `open()` with context manager — More boilerplate, no advantages
  - Subprocess to shell commands — Unnecessary overhead, harder to debug

  **Rationale:** pathlib is explicitly required in NFR-4 and is idiomatic Python 3.11+.
  The `write_text()` method automatically handles UTF-8 encoding (NFR-1) and produces
  Unix line endings (NFR-2) by default on Linux systems. This eliminates special
  configuration and aligns with Python best practices. The 280+ existing test files
  in the codebase implicitly validate this approach.

  ### 2. Content Composition: Direct F-String

  **Decision:** Compose content using Python f-strings

  **Alternatives Considered:**
  - Jinja2 templating — Adds external dependency (violates NFR-5), excessive complexity
  - `string.format()` method — Less readable than f-strings
  - Pre-defined content templates — Unnecessary abstraction for simple static content

  **Rationale:** The content format is deterministic and simple: one markdown H1 heading
  followed by 2-3 sentences of prose. Direct f-string composition is most readable,
  maintainable, and requires no additional dependencies. The 280+ existing test files
  demonstrate this pattern works consistently.

  ### 3. Topic Selection: Single Chosen Topic

  **Decision:** Select a meaningful, single topic for the prose content

  **Alternatives Considered:**
  - Randomized topic generation — Adds complexity, requires seed management, harder to verify
  - Topic list selection — Adds decision overhead and list maintenance
  - Template-driven generation — Unnecessary complexity for static content

  **Rationale:** The specification states "Prose topic may be any subject (no constraints)".
  The 280+ existing test files each use specific, meaningful topics (e.g., "The Power of
  Collaboration", "The Art of Problem Solving") proving this pattern works. A single
  chosen topic is simplest, most maintainable, and consistent with established practice.

  ### 4. Git Operations: CLI via subprocess

  **Decision:** Use git CLI commands (git add, git commit, git push) via subprocess.run()

  **Alternatives Considered:**
  - GitPython library — Adds external dependency (violates NFR-5)
  - Pygit2 library — Adds external dependency, more complex than needed
  - Shell script wrapper — Same as CLI but with less control

  **Rationale:** Git operations are simple, mechanical three-step workflow:
  1. `git add test-3b9lxg.md`
  2. `git commit -m "feat(284): create markdown file test-3b9lxg.md with title and prose content"`
  3. `git push -u origin HEAD`

  Using subprocess.run() with list arguments (no shell=True) requires no external
  dependencies and is as simple as the operations warrant. This approach matches all
  280+ prior implementations seen in git history.

  ### 5. File Encoding & Line Endings: UTF-8 + LF

  **Decision:** UTF-8 encoding (no BOM) with Unix line endings (LF only)

  **Rationale:** Explicit in NFR-1 and NFR-2. Python's pathlib.Path.write_text()
  produces UTF-8/LF by default on Unix systems without special configuration. The
  280+ existing test files confirm UTF-8/LF is the standard. No special handling needed.

  ### 6. Commit Message Format: Conventional Commits

  **Decision:** Use conventional commit format: `feat(284): create markdown file test-3b9lxg.md with title and prose content`

  **Rationale:** Explicit in the requirements (NFR-8) and established pattern across
  all 280+ prior implementations (visible in commit history). This format enables
  automated changelog generation and maintains project consistency.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (File Creation) comes first** because:
     - Must create the artifact before it can be added to version control
     - File I/O is independent of git state
     - Allows verification of file properties (encoding, size, content) before git workflow
     - Follows logical dependency: artifact → version control

  2. **Phase 2 (Version Control)** follows because:
     - Depends on file existing and being ready
     - Standard git workflow (add → commit → push) is sequential
     - Each step depends on the previous one (push requires committed file)

  **Implementation Approach:**
  1. Write Python script using pathlib.Path.write_text()
  2. Compose markdown content as f-string: H1 heading + 2-3 sentences
  3. Execute git add, git commit, git push commands sequentially
  4. Verify success at each step

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File encoding wrong (UTF-16 or CRLF line endings) | Low | High | pathlib.Path.write_text() defaults to UTF-8/LF on Unix; validate in acceptance criteria |
  | File size outside 400-600 bytes | Low | Medium | Title + 2-3 sentences naturally falls in range; test verifies bounds |
  | Commit message format wrong | Low | Low | Commit message specified exactly in requirements; copy-paste from spec |
  | File already exists | Very Low | Low | Using exact filename from spec; check does not exist before creation |
  | Git push fails | Very Low | Low | Feature branch already created; verify git config (user.name, user.email) exists |
  | Unrelated file changes sneak in | Very Low | Low | Feature is isolated; use explicit `git add test-3b9lxg.md` with filename |

  **Overall Risk Assessment:** Minimal. This is a simple, isolated file creation with
  no complex logic, no external dependencies, and clear established precedents.

