content: |
  ## Problem Statement

  Create a single markdown file called test-3b9lxg.md with a title (markdown H1 heading) and
  2-3 sentences of prose content about any topic. This file will be created in the repository
  root, staged, committed with a conventional commit message, and pushed to the feature branch.
  This is part of a systematic test file creation workflow in the Sheep project, extending the
  established pattern of 280+ similar test files already present in the repository.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Repository root**: Contains 280+ test markdown files (test-*.md) following a consistent pattern, serving as validation artifacts for the automated implementation system
  - **src/sheep/**: Application source code with modular architecture including agents, config, flows, tools, and observability
  - **specs/**: Feature specification directory containing subdirectories for each feature (specs/NN-markdown-file-creation-SUFFIX/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration specifying Python 3.11+ requirement, dependencies (CrewAI, Langfuse, Pydantic, GitPython, Rich, Typer), and project metadata
  - **.github/**: GitHub workflows and CI/CD configuration
  - **Dockerfile**: Container configuration for the Sheep platform
  - **README.md**: Project documentation describing Sheep as a CrewAI-based agentic platform

  The test markdown files at the repository root are purely test artifacts and do not form part of the application source code. They serve as validation artifacts demonstrating automated file creation, git integration, and conventional commit workflows.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (280+ precedents):
  - Simple file creation using Python pathlib for I/O operations (e.g., `Path(filename).write_text(content)`)
  - Consistent structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), Unix-style LF line endings
  - File size naturally falls in the range of 400-600 bytes as a consequence of proper structure
  - Implementation uses straightforward imperative code (compose content string, write to file)
  - Files are isolated test artifacts with zero dependencies on application source code
  - No topic constraints—diverse subjects observed across 280+ existing files (nature, technology, science, history, culture, philosophy, etc.)

  **Git Workflow Pattern** (observed across features 069-283):
  - Feature branch already created as `feat/284-markdown-file-creation-202bd3`
  - Create file in working directory
  - Stage with `git add test-3b9lxg.md`
  - Commit with conventional commit format: `feat(284): create markdown file test-3b9lxg.md with title and prose content`
  - Push to feature branch
  - No modifications to source code (/src/sheep/), test files, or configuration
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (features 069-283):
  - Minimal, isolated changes affecting only repository root directory
  - Single-file operations with straightforward file I/O
  - No testing, configuration, or documentation changes required
  - No dependencies on application source code
  - Each feature is structurally identical with repeated implementation pattern
  - Recent features (265-283) demonstrate efficient implementation in 10-15 minutes

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **pathlib (Python standard library)**: Provides `Path` class for file I/O operations; no external dependency
  - **Git**: Version control for file staging, commits, and branch operations; integration via GitPython (version 3.1.0+)
  - **Markdown**: Simple text format with H1 heading syntax (#) and prose content per CommonMark specification
  - **Conventional Commits**: Standard commit message format `feat(<number>): description`
  - **CrewAI**: Framework used by Sheep platform for agent-based automation (not directly relevant to file creation task)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-3b9lxg.md) to existing collection of 280+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-283; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely test file creation; does not depend on or impact any source code in application modules |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs |
  | Tests | None | Feature does not require test modifications; no testing logic needed for test artifact creation |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/284-markdown-file-creation-202bd3` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available in working tree)
  - **Established pattern**: 280+ test files provide clear, proven precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies needed)
  - **File naming**: Filename test-3b9lxg.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (compose one markdown heading with 2-3 sentences of prose on any topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 280+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (265-283) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-3b9lxg.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 215+ prior implementations
  - No external dependencies or package changes needed

