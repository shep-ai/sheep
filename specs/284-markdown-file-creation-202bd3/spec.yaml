content: |
  ## Problem Statement

  Create a single markdown file called test-3b9lxg.md in the repository root with a markdown H1 heading as the title and 2-3 sentences of prose content about any topic. This file will be created using Python file I/O, staged in git, committed with a conventional commit message, and pushed to the feature branch. This continues the established pattern of 280+ similar test files in the Sheep project.

  ## Success Criteria

  - [ ] File test-3b9lxg.md exists in repository root
  - [ ] File contains exactly one markdown H1 heading (# Title format)
  - [ ] File contains 2-3 sentences of prose content about any topic
  - [ ] File is UTF-8 encoded with no BOM
  - [ ] File uses Unix-style line endings (LF only, no CRLF)
  - [ ] File size is approximately 400-600 bytes
  - [ ] File structure matches established pattern from 280+ existing test files
  - [ ] File is staged using git add test-3b9lxg.md
  - [ ] File is committed with conventional commit message: "feat(284): create markdown file test-3b9lxg.md with title and prose content"
  - [ ] Commit is pushed to feature branch feat/284-markdown-file-creation-202bd3
  - [ ] No other files are modified (no changes to src/, tests/, or configuration)

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with exact filename test-3b9lxg.md
  - **FR-2**: File must contain exactly one markdown H1 heading as the title
  - **FR-3**: File must contain 2-3 sentences of prose content (approximately 50-150 words)
  - **FR-4**: Prose topic may be any subject (no constraints)
  - **FR-5**: Stage the file using git add with the specified filename
  - **FR-6**: Commit the staged file with conventional commit message format
  - **FR-7**: Push the commit to the feature branch feat/284-markdown-file-creation-202bd3

  ## Non-Functional Requirements

  - **NFR-1**: File must be UTF-8 encoded (no BOM)
  - **NFR-2**: Line endings must be Unix-style (LF only)
  - **NFR-3**: File size must naturally fall in the 400-600 byte range as a consequence of correct structure
  - **NFR-4**: Implementation must use Python pathlib for file I/O (pathlib.Path from standard library)
  - **NFR-5**: Implementation must not introduce any external dependencies beyond Python standard library
  - **NFR-6**: Structure and format must follow the established pattern from 280+ existing test files
  - **NFR-7**: No modifications to source code (src/sheep/), test suite, configuration, or documentation
  - **NFR-8**: Commit message must follow conventional commit format: feat(<number>): <description>

  ## Product Questions & AI Recommendations

  No ambiguous product decisions identified. The specification is well-defined with clear, established patterns for:
  - File location and naming (pre-specified as test-3b9lxg.md in repository root)
  - Content format (H1 heading + 2-3 sentences)
  - Topic selection (unconstrained — any topic is valid)
  - Git workflow (established conventional commit pattern with 280+ precedents)
  - File encoding and line endings (implicitly correct via established pattern)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-3b9lxg.md) to existing collection of 280+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-283; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely test file creation; does not depend on or impact any source code in application modules |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs |
  | Tests | None | Feature does not require test modifications; no testing logic needed for test artifact creation |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/284-markdown-file-creation-202bd3` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (already available in working tree)
  - **Established pattern**: 280+ test files provide clear, proven precedent for content format, structure, and file organization
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies needed)
  - **File naming**: Filename test-3b9lxg.md is provided in the feature spec and must be used exactly as specified
  - **Conventional Commits**: Git commit message format must follow established pattern with feat(284) prefix

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (compose one markdown heading with 2-3 sentences of prose on any topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 280+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (265-283) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-3b9lxg.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 215+ prior implementations
  - No external dependencies or package changes needed

