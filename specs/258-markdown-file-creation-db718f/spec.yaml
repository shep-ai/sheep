content: |
  ## Problem Statement

  Create a single markdown file named `test-w4ahgr.md` in the repository root containing an H1 heading (title) and 2-3 sentences of prose content. The implementation must follow the established patterns used across 257 prior identical features, including proper UTF-8 encoding without BOM, Unix LF line endings, file validation, and git integration (add, commit with conventional message format, and push).

  ## Success Criteria

  - [ ] File `test-w4ahgr.md` exists in repository root directory
  - [ ] File contains valid UTF-8 encoding without BOM (byte order mark)
  - [ ] File uses Unix LF line endings (`\n`) exclusively, no CRLF
  - [ ] First line contains H1 markdown heading (format: `# Title`)
  - [ ] Second line is blank (empty line after heading)
  - [ ] Content lines contain exactly 2-3 sentences of prose (periods mark sentence endings)
  - [ ] File ends with a newline character
  - [ ] File size is between 400-600 bytes
  - [ ] File is staged in git index (`git add test-w4ahgr.md` applied)
  - [ ] File is committed with conventional commit message: `feat(258): create markdown file test-w4ahgr.md with prose content`
  - [ ] Changes are pushed to remote origin (`git push -u origin HEAD`)
  - [ ] Implementation uses only Python standard library modules
  - [ ] Script exits with code 0 on success, code 1 on any failure

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly `test-w4ahgr.md` in repository root directory
  - **FR-2**: File must contain H1 heading on first line (markdown syntax: `# Title`)
  - **FR-3**: File must contain blank line on second line (empty line after H1 heading)
  - **FR-4**: File must contain 2-3 sentences of prose content starting from line 3
  - **FR-5**: File must use UTF-8 character encoding without byte order mark (BOM)
  - **FR-6**: File must use Unix LF line endings (`\n`) instead of CRLF across all platforms
  - **FR-7**: File must end with a newline character after final content
  - **FR-8**: Stage file in git using `git add test-w4ahgr.md` command
  - **FR-9**: Commit file with conventional commit message format: `feat(258): create markdown file test-w4ahgr.md with prose content`
  - **FR-10**: Push committed changes to remote origin using `git push -u origin HEAD` with `--no-verify` flag

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 400-600 bytes (excludes git metadata)
  - **NFR-2**: Implementation must follow established patterns from features 174-257 (proven template available)
  - **NFR-3**: Implementation must use only Python standard library (pathlib, subprocess, sys modules)
  - **NFR-4**: Script must exit with code 0 on complete success, exit code 1 on any failure scenario
  - **NFR-5**: Script must provide clear, descriptive error messages for all failure cases
  - **NFR-6**: Implementation must be cross-platform compatible (Windows, macOS, Linux)
  - **NFR-7**: Implementation must be purely additive—no modifications to existing code or files
  - **NFR-8**: Python version requirement: 3.7 or higher (for pathlib.Path.write_text and subprocess support)
  - **NFR-9**: Comprehensive file validation covering structure, encoding, line endings, size, and content

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content topic: any topic or specific topic? | Any topic | Spec explicitly states "about anything"; provides flexibility while keeping focus on file creation mechanics not content domain |
  | 2 | Implementation: template reuse or fresh? | Template reuse from prior feature | 257 prior identical features validate the pattern; minimizes risk, ensures consistency, leverages proven code |
  | 3 | Validation: comprehensive or minimal? | Comprehensive validation | Established pattern includes 450+ lines of proven validation code; ensures quality and cross-platform compatibility |
  | 4 | Git hooks: bypass with --no-verify or run full? | Use --no-verify flag | All 257 prior features use this approach; maintains consistency with established project workflow |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | Low | File will be created in root directory alongside 250+ other test markdown files |
  | Git workflow | Low | Standard git operations (add, commit, push) using established patterns |
  | File I/O system | Low | Simple UTF-8 text file creation using pathlib |
  | No code changes | None | Implementation is purely additive - no modifications to existing code |

  ## Dependencies

  - **Git**: Required for staging, committing, and pushing changes
  - **Python 3.7+**: pathlib.Path and subprocess modules (standard library)
  - **No external packages**: Implementation uses only Python standard library
  - **Established patterns**: Can reference any of 257 preceding features as implementation templates (e.g., feature 257, 256, 255)

  ## Size Estimate

  **S** — This is a straightforward, low-complexity task requiring 1-2 hours:

  - **Template reuse**: Copy structure from existing `create_markdown.py` or `create_markdown_file.py` scripts (pattern is established and proven across 257 prior features)
  - **Content generation**: Simple task - create 2-3 sentence prose about any topic (no domain expertise required)
  - **File creation**: Single Python script using pathlib.Path.write_text() with UTF-8 encoding
  - **Validation**: Existing validation logic can be copied directly (450+ lines of proven code)
  - **Git integration**: Standard subprocess calls to git add, commit, and push (unchanged pattern)
  - **No research needed**: Architecture, patterns, and validation rules are well-established
  - **Confidence high**: 257 identical prior implementations provide strong reference material
