content: |
  ## Problem Statement

  Create a single markdown file named `test-w4ahgr.md` containing an H1 heading (title) and 2-3 sentences of prose content about any topic. The file must follow the established patterns in the codebase for markdown file creation, including proper encoding, file structure, and git integration.

  ## Codebase Analysis

  ### Project Structure

  This is the **Sheep** repository - an agentic platform for automated code implementation using CrewAI. The repository structure includes:

  - **Root directory**: Contains numerous markdown files (both generated test files and documentation)
  - **specs/**: Contains feature specifications with each feature in its own subdirectory (e.g., `specs/258-markdown-file-creation-db718f/`)
  - **Python scripts**: Multiple `create_markdown*.py` scripts demonstrating the implementation pattern
  - **.github/**: GitHub workflows and CI/CD configuration
  - **Docker support**: Dockerfile and .dockerignore for containerization

  The repository currently contains 250+ test markdown files (test-*.md), demonstrating repeated execution of this same feature pattern across features 174-258.

  ### Architecture Patterns

  The codebase follows a consistent, well-established pattern for markdown file creation:

  1. **File Creation Pattern**:
     - Create markdown file using `pathlib.Path.write_text()` with explicit UTF-8 encoding
     - Structure: H1 heading → blank line → prose content (2-3 sentences)
     - Unix LF line endings (no CRLF) across all platforms
     - File size typically 400-600 bytes

  2. **Validation Pattern**:
     - Verify file exists and has non-zero size
     - Validate UTF-8 encoding without BOM
     - Confirm Unix-style LF line endings (not CRLF)
     - Verify H1 heading on first line, blank line on second
     - Count sentences (periods) to ensure 2-3 sentences
     - Verify file ends with newline
     - Check file size is within 400-600 byte range

  3. **Git Integration Pattern**:
     - `git add FILENAME` to stage the file
     - `git commit -m "feat(NUMBER): create markdown file FILENAME.md with prose content"` with conventional commits
     - `git push -u origin HEAD` to push to remote
     - Use `--no-verify` flag to skip pre-commit hooks

  4. **Implementation Approach**:
     - Python scripts handle all operations: file I/O, validation, and git commands
     - Use subprocess module to execute git commands
     - Comprehensive error handling with descriptive messages
     - Exit codes: 0 for success, 1 for failure

  ### Relevant Technologies

  **Python Libraries**:
  - `pathlib.Path`: Modern file I/O operations with context manager support
  - `subprocess`: Execute git commands and capture output
  - `sys`: Standard input/output for messaging

  **File Encoding & Line Endings**:
  - UTF-8 encoding without BOM (byte order mark)
  - Unix LF line endings (`\n`) regardless of platform
  - Explicit newline handling via Path.write_text() and subprocess calls

  **Git Integration**:
  - `git add`: Stage file for commit
  - `git commit`: Create conventional commit message
  - `git push`: Push to remote origin with branch tracking

  **Markdown Structure**:
  - Markdown H1 heading: `# Title`
  - Followed by blank line
  - Followed by 2-3 sentences of prose

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | Low | File will be created in root directory alongside 250+ other test markdown files |
  | Git workflow | Low | Standard git operations (add, commit, push) using established patterns |
  | File I/O system | Low | Simple UTF-8 text file creation using pathlib |
  | No code changes | None | Implementation is purely additive - no modifications to existing code |

  ## Dependencies

  - **Git**: Required for staging, committing, and pushing changes
  - **Python 3.7+**: pathlib.Path and subprocess modules (standard library)
  - **No external packages**: Implementation uses only Python standard library
  - **Established patterns**: Can reference any of 257 preceding features as implementation templates (e.g., feature 257, 256, 255)

  ## Size Estimate

  **S** — This is a straightforward, low-complexity task requiring 1-2 hours:

  - **Template reuse**: Copy structure from existing `create_markdown.py` or `create_markdown_file.py` scripts (pattern is established and proven across 257 prior features)
  - **Content generation**: Simple task - create 2-3 sentence prose about any topic (no domain expertise required)
  - **File creation**: Single Python script using pathlib.Path.write_text() with UTF-8 encoding
  - **Validation**: Existing validation logic can be copied directly (450+ lines of proven code)
  - **Git integration**: Standard subprocess calls to git add, commit, and push (unchanged pattern)
  - **No research needed**: Architecture, patterns, and validation rules are well-established
  - **Confidence high**: 257 identical prior implementations provide strong reference material
