content: |
  ## Problem Statement

  The Sheep platform is an agentic system for automated code implementation. This feature continues a series of validation tests (features 101-137+) that demonstrate the platform's core capability to reliably create markdown files with specific content requirements. Feature 138 creates a markdown file called test-ubgyho.md containing a title and 2-3 sentences of prose content, validating content generation, file I/O, and git workflow integration for the 138th consecutive time. This feature provides concrete evidence that the platform's file creation pipeline is working correctly end-to-end.

  ## Success Criteria

  - [ ] File test-ubgyho.md is created at repository root
  - [ ] File contains exactly one H1 heading (single `#` at start)
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses Unix LF line endings (no CRLF)
  - [ ] File has a trailing newline at the end
  - [ ] File is staged in git (git status shows "Changes to be committed")
  - [ ] File is committed with message matching pattern "feat(138): Create test-ubgyho.md with markdown content"
  - [ ] Commit is pushed to origin (remote HEAD reflects new commit)
  - [ ] Feature module follows established pattern from feature_137

  ## Functional Requirements

  - **FR-1: File Creation**: Generate and write markdown file named test-ubgyho.md to the repository root
  - **FR-2: Content Structure**: File must contain an H1 heading followed by 2-3 sentences of prose
  - **FR-3: Content Generation**: Use Anthropic Claude API via get_reasoning_llm() to generate valid markdown content
  - **FR-4: File Validation**: Validate file encoding, line endings, heading structure, sentence count, and trailing newline before committing
  - **FR-5: Git Staging**: Stage the created file in the git index (git add)
  - **FR-6: Git Commit**: Commit the file with a conventional commit message (format: "feat(138): Create test-ubgyho.md with markdown content")
  - **FR-7: Remote Push**: Push the commit to the remote repository's current branch with upstream tracking
  - **FR-8: Error Reporting**: Provide clear, actionable error messages if any step fails (content generation, validation, git operations)

  ## Non-Functional Requirements

  - **NFR-1: File Encoding**: File must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2: Line Endings**: File must use Unix LF line endings (\n), not Windows CRLF (\r\n) or old Mac CR (\r)
  - **NFR-3: Trailing Newline**: File must end with a single newline character
  - **NFR-4: File Size**: Typical output should be 400-600 bytes (validated by prose length constraints)
  - **NFR-5: Execution Time**: Feature should complete end-to-end within 30 seconds (including API latency)
  - **NFR-6: Logging**: Use structured logging (observability.logging.get_logger()) for all major steps and failures
  - **NFR-7: Code Pattern Compliance**: Feature module must follow the established pattern from feature_127/137 (50-60 lines, modular design, proper imports)
  - **NFR-8: API Reliability**: Single attempt to Claude API; fail with clear diagnostic if generation fails
  - **NFR-9: Idempotency**: Feature should be executable in isolation; git state after execution should be clean with the new file committed

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content topic constraint? | Any topic (unconstrained) | Validates file mechanics, not content specificity; simpler and aligns with 101-137 series focus |
  | 2 | Validation strictness? | Strict (reject on any error) | Ensures reproducible, compliant output and loud failure signals for debugging |
  | 3 | API failure handling? | Fail immediately | Single-operation testing; retries obscure root causes |
  | 4 | Commit message format? | Strict fixed pattern | Ensures consistency across automated test sequence |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | High | A new feature module (feature_138_markdown_file_creation.py or similar) must be created following the established pattern |
  | src/sheep/content_generators.py | Low | Existing utilities (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) are already implemented and tested |
  | Repository root | High | The file test-ubgyho.md will be created at the repository root; git state will change with new untracked file → staged → committed file |
  | Git state | High | Will add one new commit to the current branch with subject "feat(138): Create test-ubgyho.md with markdown content" and push upstream |
  | tests/ | Low | Existing test patterns can be reused; no new test infrastructure needed |

  ## Dependencies

  **Existing Code Dependencies:**
  - `sheep.content_generators`: Already implemented with all necessary functions
    - `generate_markdown_content()`: Uses Claude API to generate H1 title + 2-3 sentences
    - `write_markdown_file(content, filename)`: Writes to repo root with UTF-8 encoding
    - `validate_markdown_file(filepath)`: Validates encoding, line endings, structure, sentence count
    - `commit_markdown_file(filepath, content, repo_path)`: Git add + commit with conventional message
    - `push_markdown_file(repo_path)`: Git push with upstream tracking
  - `sheep.config.llm.get_reasoning_llm()`: Provides configured LLM instance
  - `sheep.observability.logging.get_logger()`: Structured logging
  - `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool`: Git operations

  **External Dependencies:**
  - CrewAI (anthropic, google-genai, tools extras)
  - GitPython 3.1.0+
  - Anthropic API key in environment

  ## Implementation Surface Area

  **Files to Create:**
  - `src/sheep/features/feature_138_markdown_file_creation.py` (~50-60 lines following feature_137 pattern)

  **Files Modified:**
  - None (all dependencies already exist)

  **Files Touched by Git:**
  - test-ubgyho.md (created, staged, committed)

  ## Size Estimate

  **S** — This is a small, 1-2 hour task:

  - **Content Generation** (already implemented): The `generate_markdown_content()` function uses Claude to generate valid markdown. Takes ~2-5 seconds per invocation.
  - **File I/O** (already implemented): `write_markdown_file()` handles Path.write_text() with UTF-8 encoding. Takes ~10-50ms.
  - **Validation** (already implemented): `validate_markdown_file()` checks encoding, line endings, H1 heading, sentence count, trailing newline. Takes ~10-50ms.
  - **Git Operations** (already implemented): `commit_markdown_file()` and `push_markdown_file()` use GitPython. Takes ~1-5 seconds total.
  - **Feature Module** (need to create): Boilerplate orchestration following feature_127/137 pattern. ~30-50 lines, 15-20 minutes.
  - **Execution** (including API latency): ~10-15 seconds end-to-end.
  - **Testing**: Can reuse existing test patterns from test_feature_127, test_feature_136.

  No complex architectural decisions, no new technologies, no infrastructure changes. This is a repetition of a proven pattern for the 38th consecutive time. Estimated total effort: **30-45 minutes** (1-2 hours including buffer).

  ---

  _Requirements phase complete — ready for implementation planning_
