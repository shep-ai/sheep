content: |
  ## Problem Statement

  The Sheep platform is an agentic system for automated code implementation. This feature continues a series of validation tests (features 101-137+) that demonstrate the platform's core capability to reliably create markdown files with specific content requirements. Feature 138 creates a markdown file called test-ubgyho.md containing a title and 2-3 sentences of prose content, validating content generation, file I/O, and git workflow integration for the 138th consecutive time.

  ## Codebase Analysis

  ### Project Structure

  - **src/sheep/**: Main package containing all platform code
    - **agents/**: CrewAI agent definitions (general_agents.py, code_agents.py)
    - **config/**: Configuration management (settings.py, llm.py factory)
    - **features/**: Feature implementation modules (feature_101 through feature_127+)
    - **flows/**: Orchestration workflows (code_implementation.py)
    - **observability/**: Logging and Langfuse integration
    - **tools/**: Git operations (git_tools.py) and file operations (file_tools.py)
    - **content_generators.py**: Reusable utilities for markdown creation
  - **tests/**: Test suite with markdown creation and git integration tests
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies)
  - **Repository root**: Where all generated markdown files are stored

  ### Architecture Patterns

  The platform follows these key patterns:

  1. **Separation of Concerns**: Infrastructure code (content generators) is separate from feature orchestration (feature modules)
  2. **LLM Integration**: Uses get_reasoning_llm() from config.llm for content generation via CrewAI
  3. **Validation Pipeline**: Generated content is validated before file write; files are validated before commit
  4. **Git Workflow**: Complete integration with GitPython for staging, committing, and pushing
  5. **Logging**: Structured logging via observability.logging module for debugging and tracing
  6. **Modular Features**: Each feature is an independent module that can be executed in isolation

  ### Relevant Technologies

  - **CrewAI**: Framework for orchestrating autonomous agents; handles LLM integration
  - **GitPython**: Git repository operations (stage, commit, push)
  - **Anthropic Claude API**: Content generation via claude-reasoning model for high-quality markdown
  - **Pydantic**: Type validation and settings management
  - **pathlib.Path**: Cross-platform file I/O (required per non-functional requirements)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | High | A new feature module (feature_138_markdown_file_creation.py or similar) must be created following the established pattern |
  | src/sheep/content_generators.py | Low | Existing utilities (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) are already implemented and tested |
  | Repository root | High | The file test-ubgyho.md will be created at the repository root; git state will change with new untracked file → staged → committed file |
  | Git state | High | Will add one new commit to the current branch with subject "feat: Create test-ubgyho.md markdown file with [topic] content" and push upstream |
  | tests/ | Low | Existing test patterns can be reused; no new test infrastructure needed |

  ## Dependencies

  **Existing Code Dependencies:**
  - `sheep.content_generators`: Already implemented with all necessary functions
    - `generate_markdown_content()`: Uses Claude API to generate H1 title + 2-3 sentences
    - `write_markdown_file(content, filename)`: Writes to repo root with UTF-8 encoding
    - `validate_markdown_file(filepath)`: Validates encoding, line endings, structure, sentence count
    - `commit_markdown_file(filepath, content, repo_path)`: Git add + commit with conventional message
    - `push_markdown_file(repo_path)`: Git push with upstream tracking
  - `sheep.config.llm.get_reasoning_llm()`: Provides configured LLM instance
  - `sheep.observability.logging.get_logger()`: Structured logging
  - `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool`: Git operations

  **External Dependencies:**
  - CrewAI (anthropic, google-genai, tools extras)
  - GitPython 3.1.0+
  - Anthropic API key in environment

  **Non-Functional Requirements:**
  - File must be UTF-8 encoded without BOM
  - File must use Unix LF line endings (not CRLF)
  - File must have trailing newline
  - Prose content must have exactly 2-3 sentences (validated by sentence count)
  - File size typically 400-600 bytes

  ## Implementation Surface Area

  **Files to Create:**
  - `src/sheep/features/feature_138_markdown_file_creation.py` (~50-60 lines following feature_137 pattern)

  **Files Modified:**
  - None (all dependencies already exist)

  **Files Touched by Git:**
  - test-ubgyho.md (created, staged, committed)

  ## Size Estimate

  **S** — This is a small, 1-2 hour task:

  - **Content Generation** (already implemented): The `generate_markdown_content()` function uses Claude to generate valid markdown. Takes ~2-5 seconds per invocation.
  - **File I/O** (already implemented): `write_markdown_file()` handles Path.write_text() with UTF-8 encoding. Takes ~10-50ms.
  - **Validation** (already implemented): `validate_markdown_file()` checks encoding, line endings, H1 heading, sentence count, trailing newline. Takes ~10-50ms.
  - **Git Operations** (already implemented): `commit_markdown_file()` and `push_markdown_file()` use GitPython. Takes ~1-5 seconds total.
  - **Feature Module** (need to create): Boilerplate orchestration following feature_127/137 pattern. ~30-50 lines, 15-20 minutes.
  - **Execution** (including API latency): ~10-15 seconds end-to-end.
  - **Testing**: Can reuse existing test patterns from test_feature_127, test_feature_136.

  No complex architectural decisions, no new technologies, no infrastructure changes. This is a repetition of a proven pattern for the 38th consecutive time. Estimated total effort: **30-45 minutes** (1-2 hours including buffer).

