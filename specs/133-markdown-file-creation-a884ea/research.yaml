# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-20
  - **Pattern:** Established (features 125-132)
  - **Complexity:** Minimal (orchestration only)
  - **Risk Level:** Low (follows proven pattern)

  ## Executive Summary

  Feature 133 is a straightforward markdown file creation task following an established pattern from
  features 125-132. The implementation reuses existing utilities from content_generators.py which
  handle all complexity: LLM integration, file I/O, encoding validation, and git operations. No new
  dependencies, architecture changes, or code patterns required. Estimated implementation time: 1-2 hours.

  ## Technology Decisions

  ### 1. Implementation Approach: Reuse Existing Utilities

  **Chosen:** Import and orchestrate existing functions from content_generators.py

  **Rationale:** Features 125-132 demonstrate this pattern works reliably. Content_generators.py provides
  six key functions: generate_markdown_content(), write_markdown_file(), validate_markdown_file(),
  commit_markdown_file(), push_markdown_file(), and create_markdown_file() (orchestration). These
  functions encapsulate all complexity and have been validated across 113+ markdown files.

  **Implementation Pattern:**
  - Create src/sheep/features/feature_133_markdown_file_creation.py
  - Import create_markdown_file() from content_generators
  - Define FEATURE_NUMBER=133, FEATURE_NAME, MARKDOWN_FILENAME=\"test-mdvgli.md\"
  - Implement create_feature_133_markdown_file() wrapper function
  - Return orchestration result

  ### 2. LLM Integration: Anthropic Claude via CrewAI

  **Chosen:** Use get_reasoning_llm() from src/sheep/config/llm.py

  **Implementation:**
  - Call llm.call([{\"role\": \"user\", \"content\": MARKDOWN_GENERATION_PROMPT}])
  - Prompt template requires H1 heading + 2-3 sentences
  - Temperature=0.2 for deterministic output
  - Provider: Anthropic API (configured in settings)

  **Why:** Platform standardization, proven across existing features, proper error handling and logging

  ### 3. File Encoding: UTF-8 without BOM

  **Chosen:** Python's built-in open(path, 'w', encoding='utf-8')

  **Details:**
  - UTF-8 encoding: explicit encoding parameter
  - No BOM: Python doesn't write BOM by default
  - Validated by: validate_markdown_file() checks for b'\\xef\\xbb\\xbf' prefix

  **Why:** Cross-platform, idiomatic Python, proven across features 125-132

  ### 4. Line Endings: Unix LF (not Windows CRLF)

  **Chosen:** Automatic LF on Unix systems (Python handles this)

  **Details:**
  - Python automatically uses LF on Unix/Linux systems
  - No explicit newline parameter needed (text mode default)
  - Validated by: validate_markdown_file() checks for b'\\r\\n' and raises error

  **Why:** Environment is Unix-based, Python automatic handling is correct, validation ensures compliance

  ### 5. Markdown Content Validation

  **Chosen:** Use validate_markdown_file() from content_generators.py

  **Validation Checks:**
  1. File exists and is readable
  2. No UTF-8 BOM (absence of b'\\xef\\xbb\\xbf')
  3. Valid UTF-8 encoding (UnicodeDecodeError handling)
  4. No CRLF line endings (absence of b'\\r\\n')
  5. First line is H1 heading (\"# \" prefix)
  6. Second line is blank (separator)
  7. Prose content present after blank line
  8. Exactly 2-3 sentences (period count)
  9. Trailing newline present (\"\\n\" at end)

  **Error Handling:** Raises ValueError with descriptive message for each failure

  **Why:** Comprehensive, proven across 113+ files, catches all format issues before commit

  ### 6. Git Workflow: Staging, Commit, and Push

  **Chosen:** Use existing git tools from src/sheep/tools/git_tools.py

  **Tools Used:**
  - GitCommitTool: stages file with git add and creates commit
  - GitPushTool: pushes with upstream tracking (-u origin)

  **Wrapped By:** commit_markdown_file() and push_markdown_file() in content_generators.py

  **Workflow:**
  1. Call commit_markdown_file(filepath, content, repo_path, custom_message)
     - Uses GitCommitTool._run(repo_path, message, add_all=True)
     - Creates commit: \"feat(133): Create markdown file test-mdvgli.md\"
  2. Call push_markdown_file(repo_path)
     - Uses GitPushTool._run(repo_path, remote='origin', set_upstream=True)
     - Pushes with upstream tracking

  **Why:** Platform standard, proper error handling, comprehensive logging

  ### 7. Commit Message Format

  **Chosen:** \"feat(133): Create markdown file test-mdvgli.md\"

  **Format Specification:**
  - Type: \"feat\" (feature creation)
  - Scope: \"133\" (feature number)
  - Description: \"Create markdown file test-mdvgli.md\" (action + filename)
  - Follows: Conventional Commits specification

  **Why:** Requirement FR-8, follows conventional commits, provides traceability and clarity

  ## Library Analysis

  | Library/Module | Purpose | Decision | Rationale |
  | --- | --- | --- | --- |
  | pathlib.Path | Cross-platform file paths | Use (existing) | Used in content_generators.py, safe path operations |
  | subprocess | Execute git commands | Use (existing) | Wrapped by GitCommitTool and GitPushTool |
  | CrewAI | Agentic LLM framework | Use (existing) | Platform standard for LLM orchestration |
  | Anthropic SDK | Claude API access | Use (existing) | Integrated via CrewAI, configured in settings |
  | Pydantic | Configuration validation | Use (existing) | Used for LLM config and tool schemas |
  | sheep.observability.logging | Structured logging | Use (existing) | Platform standard for all logging |
  | sheep.config.llm | LLM configuration | Use (existing) | Provides get_reasoning_llm() factory |
  | sheep.tools.git_tools | Git command wrappers | Use (existing) | Provides GitCommitTool and GitPushTool |

  **No new external dependencies required.** All libraries already integrated into sheep platform
  and successfully used by features 125-132.

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** Prevent directory traversal (no \"/\", \"\\\", or leading \".\")
  - **Content validation:** Ensure format compliance and encoding correctness
  - **URL handling:** N/A for this feature

  **Implementation:** Already handled by write_markdown_file() and validate_markdown_file()

  ### Encoding Security
  - **UTF-8 without BOM:** Prevents encoding-related attacks
  - **LF line endings:** Unix standard, prevents Windows-specific issues
  - **Validation:** Comprehensive checks ensure no encoding issues slip through

  ### Error Handling
  - **No information leakage:** Error messages don't expose system paths
  - **Exception handling:** All exceptions caught and logged appropriately
  - **No silent failures:** All errors raised and logged

  ### LLM Security
  - **API key management:** Encrypted in settings, not hardcoded
  - **No prompt injection:** Structured prompt template, not user-controlled
  - **Rate limiting:** Handled by CrewAI framework

  ## Performance Considerations

  ### Bottleneck Analysis

  | Operation | Time | Notes |
  | --- | --- | --- |
  | LLM generation | 1-2 seconds | Main bottleneck; depends on model latency |
  | File write | <10ms | Negligible; local I/O |
  | File validation | <5ms | Negligible; small file (~400-600 bytes) |
  | Git commit | <100ms | Local operation |
  | Git push | 500ms-2s | Network-dependent |
  | **Total** | **2-4 seconds** | Almost entirely LLM-bound |

  ### Optimization Notes
  - **LLM is bottleneck:** Only optimization would be response caching, but inappropriate for test suite
  - **No optimization needed:** Performance acceptable for validation suite
  - **File/git ops:** Already optimal using native libraries

  ## Architecture Notes

  ### Platform Integration
  - **LLM framework:** CrewAI with get_reasoning_llm()
  - **Logging:** sheep.observability.logging (structured)
  - **Tools:** BaseTool subclasses from CrewAI
  - **Configuration:** Pydantic-based settings
  - **Git:** Custom subprocess-based tools

  ### Code Organization
  - **Content generators:** src/sheep/content_generators.py (reusable utilities)
  - **Feature module:** src/sheep/features/feature_133_markdown_file_creation.py (orchestration)
  - **Git tools:** src/sheep/tools/git_tools.py (git operations)
  - **LLM config:** src/sheep/config/llm.py (factory functions)

  ### Code Reuse Analysis
  - **Total utilities in content_generators.py:** 440 lines
  - **Feature module code:** Estimated 20-30 lines (constants + function call)
  - **Duplication:** 0% (all logic reused)

  This is optimal code reuse while maintaining feature structure for discoverability.

  ## Success Metrics

  Implementation will be successful when:
  1. ✓ File test-mdvgli.md exists in repository root
  2. ✓ File contains H1 heading (e.g., \"# Title\")
  3. ✓ File contains 2-3 sentences of prose
  4. ✓ File has UTF-8 encoding without BOM
  5. ✓ File has LF line endings (not CRLF)
  6. ✓ File passes validate_markdown_file()
  7. ✓ File is staged with git add
  8. ✓ Commit message is \"feat(133): Create markdown file test-mdvgli.md\"
  9. ✓ Commit is pushed to feature branch
  10. ✓ No errors logged during execution

  All metrics verified by existing validation functions.

