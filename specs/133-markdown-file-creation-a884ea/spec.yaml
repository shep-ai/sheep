content: |
  ## Problem Statement

  Create a single markdown file named test-mdvgli.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content, then execute the complete git workflow (add/commit/push) to integrate this file into the feature branch. This is test iteration 133 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks.

  ## Success Criteria

  - [ ] File `test-mdvgli.md` is created and exists in the repository root
  - [ ] File contains a valid markdown H1 heading (format: `# Title`)
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File is encoded in UTF-8 (no BOM)
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File passes all validation checks (format, encoding, structure)
  - [ ] File is staged to git with `git add test-mdvgli.md`
  - [ ] File is committed with conventional commit message: `"feat(133): Create markdown file test-mdvgli.md"`
  - [ ] Commit is successfully pushed to the feature branch
  - [ ] No errors or validation warnings are logged during execution

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-mdvgli.md` in the repository root directory
  - **FR-2**: File must contain an H1 markdown heading (e.g., `# Title`) as the first content line
  - **FR-3**: File must contain exactly 2-3 sentences of prose content immediately following the heading, separated by a blank line
  - **FR-4**: File must be written with UTF-8 character encoding without BOM (Byte Order Mark)
  - **FR-5**: File must use LF (Unix) line endings (0x0A), not CRLF (Windows) or CR (Mac)
  - **FR-6**: Content must be generated using CrewAI LLM framework with Anthropic Claude via `get_reasoning_llm()`
  - **FR-7**: Stage the new file using `git add test-mdvgli.md`
  - **FR-8**: Create a git commit with message following conventional commits: `"feat(133): Create markdown file test-mdvgli.md"`
  - **FR-9**: Push the commit to the feature branch (`feat/133-markdown-file-creation-a884ea`)
  - **FR-10**: Validate markdown file structure before committing (must pass format and encoding checks)

  ## Non-Functional Requirements

  - **NFR-1**: All file I/O operations must complete without unhandled exceptions or errors
  - **NFR-2**: Markdown content validation must enforce format compliance (H1 heading + 2-3 sentences)
  - **NFR-3**: All operations must be logged via structured logging using `sheep.observability.logging`
  - **NFR-4**: Git operations must follow conventional commits specification (https://www.conventionalcommits.org/)
  - **NFR-5**: No new external dependencies required; implementation uses existing Sheep platform capabilities
  - **NFR-6**: Implementation must follow architectural patterns established in features 125-132
  - **NFR-7**: Code reuse must be maximized; no duplication of existing functions in `content_generators.py`
  - **NFR-8**: File creation and git workflow must be atomic; either fully complete or fully rollback on failure

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Create new feature module vs. reuse existing utilities? | **Reuse existing content_generators utilities** | Features 125-132 follow this pattern; eliminates duplication, aligns with Utility Centralization architecture, faster implementation, easier maintenance. |

  ## Codebase Analysis

  ### Project Structure

  The repository is organized into the following key directories:

  - **src/sheep/** - Core Sheep platform source code
    - **agents/** - Agent definitions for research, implementation, and review
    - **config/** - Configuration management (LLM settings, environment variables)
    - **flows/** - Flow orchestration for multi-step workflows
    - **features/** - Individual feature implementations (125+ markdown file creation features)
    - **tools/** - Reusable tools for git operations, file I/O, and web interaction
    - **observability/** - Logging and tracing infrastructure (Langfuse integration)
    - **content_generators.py** - Centralized utilities for markdown generation, file writing, validation, and git operations
  - **specs/** - Feature specifications and requirements (per-feature YAML files)
  - **tests/** - Test suite
  - Repository root - Contains 130+ existing test-*.md files from features 001-132

  ### Architecture Patterns

  1. **Feature Module Pattern**: Each feature has a corresponding Python module in `src/sheep/features/` that orchestrates the complete workflow
  2. **Utility Centralization**: Common functions (markdown generation, file writing, git operations) are centralized in `content_generators.py` to avoid duplication
  3. **LLM Integration**: Content generation uses CrewAI LLM framework with Anthropic Claude for prose generation
  4. **Structured Logging**: All operations use structured logging via `sheep.observability.logging`
  5. **Error Handling**: Comprehensive validation at each stage (content format, file encoding, line endings)

  ### Relevant Technologies

  1. **Python** - Implementation language
  2. **Git** - Version control and workflow execution (add, commit, push operations)
  3. **Markdown** - File format with structured H1 heading + prose content pattern
  4. **CrewAI** - Agentic framework for LLM-based task execution
  5. **Anthropic Claude** - LLM used for content generation (via get_reasoning_llm())
  6. **Pydantic** - Configuration management and validation
  7. **Pathlib** - Cross-platform file path handling

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | A new markdown file (test-mdvgli.md) will be created in the repository root, following the pattern of 132+ existing test files |
  | src/sheep/features/ | Low | May add feature_133_markdown_file_creation.py module following the established pattern, or reuse existing content_generators utilities without modification |
  | src/sheep/content_generators.py | None | No changes required; existing functions (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) already support this feature |
  | Git workflow operations | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O modules
  2. **Markdown Generation** - CrewAI LLM framework with Anthropic Claude (already configured in src/sheep/config/llm.py)
  3. **Content Generation** - Existing generate_markdown_content() function in content_generators.py generates H1 heading + 2-3 sentences
  4. **File Writing** - Existing write_markdown_file() function handles UTF-8 encoding, LF line endings, and validation
  5. **Git Integration** - Existing GitCommitTool and GitPushTool in src/sheep/tools/git_tools.py
  6. **Validation** - Existing validate_markdown_file() function ensures format compliance

  The feature follows an established pattern used in features 125-132, so no new dependencies, libraries, or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 8+ times in preceding features (125-132)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, content generation, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → validate → stage → commit → push
  - Based on git history, similar features (125-132) were completed in a single PR with minimal complexity
  - Estimated effort: 1-3 hours total (primarily implementation, minimal review/testing needed)

