content: |
  ## Summary

  Feature 133 implementation follows a straightforward 5-task, 4-phase approach that reuses
  proven utilities from content_generators.py (used in features 125-132). No duplication,
  no architecture changes, minimal code (20-30 lines).

  **Phase 1 (Task 1):** Create the feature module skeleton with constants and imports.
  This provides the entry point and structure (30min).

  **Phase 2 (Task 2):** Implement the orchestration function that calls create_markdown_file()
  with correct parameters. This is the actual feature logic (45min).

  **Phase 3 (Tasks 3-4):** Write integration tests and execute the feature end-to-end.
  Generate test-mdvgli.md with LLM content, validate format/encoding/line endings, verify
  all success criteria (75min).

  **Phase 4 (Task 5):** Verify git workflow. Confirm file is staged, committed with
  conventional message, and pushed to feature branch (15min).

  **Why this ordering:**
  - Must create module (task 1) before implementing function (task 2)
  - Must implement function (task 2) before testing it (task 3)
  - Must run tests (task 3) before executing feature (task 4)
  - Must execute feature (task 4) before verifying git workflow (task 5)
  - Each phase builds on previous phase's completion

  **Why this approach:**
  - **Maximum code reuse:** Calls create_markdown_file() rather than duplicating its 100+ lines
  - **Proven pattern:** Features 127 and 121 demonstrate this exact pattern successfully
  - **DRY principle:** 0% code duplication vs. other features
  - **Minimal effort:** ~3 hours total for small feature that orchestrates existing capabilities
  - **Low risk:** Follows established pattern with comprehensive validation at each step

  **Success metrics:**
  All tasks complete → Feature 133 complete. Success defined by:
  1. Feature module created and imports work
  2. Orchestration function calls existing utilities
  3. Integration tests pass
  4. Feature execution creates valid markdown file
  5. Git workflow shows file staged, committed, pushed

  Each task's acceptance criteria ensure completion of that phase.
