content: |
  ## Architecture Overview

  This feature implements the 99th iteration of an established pattern repeated across 98+ prior features (069-098). The implementation is straightforward and follows proven conventions:

  1. **File Creation via pathlib** — Create test-3ulhtl.md using `Path("test-3ulhtl.md").write_text(content, encoding='utf-8', newline='\n')` to ensure correct encoding and line endings across all platforms.

  2. **Content Structure** — H1 markdown heading (`# Title`) as first line, blank line separator, then exactly 3 sentences of inspirational prose matching the pattern from features 096-098 (test-ar046u.md, test-mixait.md, test-rzmpu1.md).

  3. **Format Validation** — Verify UTF-8 encoding without BOM, Unix LF line endings only, and file size within 320-600 byte range (observed from prior test files).

  4. **Standard Git Workflow** — Stage with `git add`, commit with conventional message format `feat(099): create markdown file test-3ulhtl.md with prose content`, and push to feature branch.

  The feature is purely additive (new file only, no modifications to existing files) and fits the Sheep platform's design: deterministic, pattern-based, automated task implementation.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text() with explicit encoding and line endings

  **Decision:** Use `Path("test-3ulhtl.md").write_text(content, encoding='utf-8', newline='\n')`

  **Rationale:**
  - Feature specification (FR-4) explicitly requires pathlib.Path().write_text()
  - Modern Python best practice for Python 3.11+; automatically manages file closing
  - Explicit `newline='\n'` parameter is critical: ensures Unix LF line endings on all platforms (Windows, macOS, Linux), satisfying NFR-4
  - Default UTF-8 encoding without BOM combined with explicit newline parameter satisfies NFR-3 and NFR-4
  - All 98+ prior test files follow this pattern, establishing consistency

  ### 2. Content: Hardcoded inspirational prose (3 sentences)

  **Decision:** Use hardcoded 3 sentences of inspirational prose matching established pattern

  **Alternatives Considered:**
  - Dynamic/generated content — rejected: adds unnecessary complexity, introduces randomness, violates simplicity principle
  - User input/interactive prompt — rejected: not specified, adds complexity, reduces determinism, conflicts with automated implementation model

  **Rationale:**
  - Analysis of test files from features 096-098 confirms all contain exactly 3 sentences of universal inspirational topics (no technical/domain subjects)
  - Hardcoded content ensures deterministic, reproducible output matching established convention
  - Single markdown file creation doesn't justify a content generation system; overkill for this use case
  - Pattern is proven across 98+ successful implementations

  ### 3. Git Operations: Standard CLI commands via Python subprocess

  **Decision:** Use `subprocess.run()` to invoke standard git commands (add, commit, push)

  **Alternatives Considered:**
  - GitPython library — rejected: external dependency, adds complexity, specification explicitly requires "standard git commands"
  - Direct shell scripting — rejected: less portable, harder to integrate with Python codebase

  **Rationale:**
  - Specification (FR-5, FR-6, FR-7) explicitly requires "standard git commands"
  - Python subprocess module is standard library; avoids external dependency
  - Clear, readable syntax; directly expresses intent; matches specification requirements
  - Matches pattern used in prior features (069-098)

  ### 4. File Format Validation: UTF-8 without BOM, LF line endings, 320-600 byte range

  **Decision:** Validate file encoding, line endings, and size during implementation phase

  **Rationale:**
  - UTF-8 without BOM: specification NFR-3 requires this; Python pathlib defaults correctly, so verification confirms compliance
  - Unix LF only: specification NFR-4 requires this; explicit `newline='\n'` parameter ensures compliance, but verification confirms correct behavior across platforms
  - File size 320-600 bytes: specification NFR-5 targets this range observed from prior test files; pattern of H1 title (~20-30 bytes) + 3 sentences of ~50-70 words each produces files in this range consistently
  - These checks are quality assurance steps ensuring output matches specification and prior pattern

  ## Implementation Strategy

  **Phase 1: File Creation & Format Validation** (5-8 minutes)
  - Create markdown file with H1 heading and 3 sentences of inspirational prose using pathlib
  - Verify encoding is UTF-8 without BOM (inspect byte content)
  - Verify line endings are Unix LF only (no CRLF sequences)
  - Verify file size is within 320-600 byte range
  - Confirms file artifact is production-ready and matches prior files

  **Phase 2: Git Workflow & Delivery** (2-5 minutes)
  - Stage file with `git add test-3ulhtl.md`
  - Create commit with conventional message format: `feat(099): create markdown file test-3ulhtl.md with prose content`
  - Push to feature branch `feat/099-test-markdown-file-55d3ab` using `git push`
  - Verifies no uncommitted changes remain after push

  **Phase Ordering Rationale:**
  - Phase 1 must complete before Phase 2: git operations depend on file existing with correct properties
  - Both phases are sequential; no parallelization possible due to linear dependency chain
  - Phase 1 emphasis is on file quality (format validation); Phase 2 is on delivery (version control)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding incorrect (missing UTF-8, includes BOM) | Explicitly specify `encoding='utf-8'` in write_text(); pathlib defaults to UTF-8 without BOM on all platforms; verify with binary inspection during validation phase |
  | Line endings incorrect (CRLF instead of LF) | Explicitly specify `newline='\n'` in write_text() call; this parameter forces Unix LF across all platforms; verify by inspecting for CRLF byte sequences |
  | File size outside range (too small/large) | Design prose to ~50-70 words per sentence; validate file size after creation; if outside range, adjust prose length slightly and revalidate |
  | Git operations fail (user.name/email not configured) | Standard git configuration is user environment responsibility; task will fail clearly if missing, prompting user to configure git |
  | Markdown syntax invalid | Use simple, standard markdown (single H1 + plain prose sentences); no complex syntax; visually verify heading and sentences are correctly formatted |
  | File test-3ulhtl.md already exists | Feature branch is pre-created and clean; filename is unlikely to collide with existing files in repo; if collision occurs, delete and recreate |
  | Commit message format incorrect | Use literal string constant for message; no string interpolation or variable substitution; verify message in git log after commit |
