# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 98+ times. This feature creates a single
  test markdown file (`test-3ulhtl.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 98+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-098.

  ## Success Criteria

  - [ ] File `test-3ulhtl.md` exists at repository root
  - [ ] File contains exactly one H1 markdown heading as title (first non-empty line starts with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading (separated by blank line)
  - [ ] Markdown syntax is valid (parseable by standard markdown processors without warnings)
  - [ ] Prose content is grammatically correct and coherent
  - [ ] File uses UTF-8 encoding without BOM (byte order mark)
  - [ ] File uses Unix-style line endings (LF: `\n` only, not CRLF: `\r\n`)
  - [ ] File size is within 320-600 bytes (observed range from prior test files)
  - [ ] File is staged in git (appears in `git status` staging area)
  - [ ] Commit message follows conventional format: `feat(099): create markdown file test-3ulhtl.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/099-test-markdown-file-55d3ab`
  - [ ] Repository shows no uncommitted changes after implementation

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with filename exactly `test-3ulhtl.md`
  - **FR-2**: File must contain one H1 markdown heading (using `#` syntax) as the title/first line
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading, separated by blank line
  - **FR-4**: File must be created using standard Python pathlib module: `Path("test-3ulhtl.md").write_text(content)`
  - **FR-5**: Stage file with git using standard git command: `git add test-3ulhtl.md`
  - **FR-6**: Commit file with conventional commit message: `feat(099): create markdown file test-3ulhtl.md with prose content`
  - **FR-7**: Push commit to feature branch using git command: `git push` or `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: Markdown syntax must be valid — file must parse correctly in standard markdown processors without errors or warnings
  - **NFR-2**: Prose content must be grammatically correct, coherent, contextually appropriate, and professional in tone
  - **NFR-3**: File encoding must be UTF-8 without byte order mark (BOM)
  - **NFR-4**: Line endings must be Unix-style (LF: `\n` only, not CRLF: `\r\n`)
  - **NFR-5**: File size should fall within 320-600 bytes (observed range from prior test files 069-098)
  - **NFR-6**: Implementation must follow established pattern from features 069-098 without deviation
  - **NFR-7**: No modifications to existing files; implementation is purely additive (new file only, no overwrites)
  - **NFR-8**: Implementation should complete in approximately 10-15 minutes of actual work
  - **NFR-9**: Prose topic can be any appropriate subject; generic/universal topics are preferred for consistency with prior test files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-3ulhtl.md) to existing collection of 98+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites of existing content |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact application code or modules |
  | Configuration Files | None | No modifications to pyproject.toml, .env, Dockerfile, or other configuration files |
  | Specifications Directory | None | No modifications to existing specs; this spec file itself is the only spec updated |
  | Documentation | None | No changes to README.md, ABOUT_ME.md, or other documentation files |
  | Test Suite | None | No modifications to test infrastructure or test files |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/099-test-markdown-file-55d3ab` must already exist
  - **File system permissions**: Write access to repository root directory (standard in development environments)
  - **Established pattern**: 98+ test files (features 069-098) provide clear precedent for content structure and format
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits to succeed
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown H1 heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size within bounds)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 98+ prior features (069-098) with identical requirements
  - Flexible topic selection with no research, architectural decisions, or design choices required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-098 demonstrate efficient implementation of identical tasks within 10-15 minute window
  - Pattern is simple enough to implement without external libraries or complex logic

