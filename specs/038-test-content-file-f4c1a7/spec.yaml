  ## Codebase Analysis

  ### Project Structure

  This is the Sheep project, an agentic platform for automated code implementation using CrewAI. The repository
  has a simple structure with markdown files organized at the root level:

  - **Root directory**: Contains feature-related markdown files (test-*.md, JOKE.md, STATE_MACHINE.md, etc.)
  - **specs/ directory**: Contains feature specifications organized by feature number
  - **src/sheep/**: Contains the Python source code for the agentic platform (not relevant to this feature)
  - **.github/**: Contains GitHub configuration (not relevant to this feature)

  ### Architecture Patterns

  The repository follows a simple content-first pattern:
  - Test markdown files are created at the repository root following a naming convention: `test-<random-id>.md`
  - Each file is completely standalone and independent
  - Files follow a consistent internal structure: H1 heading followed by 2-3 sentences of content
  - No special build process, testing framework, or infrastructure changes are required

  ### Relevant Technologies

  - **Markdown**: The only technology involved; basic UTF-8 text files with markdown formatting
  - **Git**: For version control (commit and push the new file)

