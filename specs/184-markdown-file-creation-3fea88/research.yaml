# Structured technology decisions
decisions:
  - title: "File I/O Library: pathlib.Path"
    chosen: "Python pathlib.Path.write_text() with explicit encoding='utf-8'"
    rejected:
      - "open() context manager — more verbose, less modern Python idiom, manual close() handling"
      - "os.open() with os.write() — low-level, requires manual encoding/decoding, cross-platform complexity"
      - "pathlib.Path.write_bytes() — requires manual UTF-8 encoding, less readable than write_text()"
    rationale: >
      pathlib.Path is the modern Python 3.11+ standard for file I/O (PEP 20 \"Explicit is Better\").
      The write_text() method provides a clean, readable API with automatic encoding handling.
      This approach is consistent with all 183+ existing test files in the repository.
      pathlib provides cross-platform path handling (though this feature only runs on Linux).
      No external dependencies required — entire stdlib, available in Python 3.11+.

  - title: "Text Encoding: UTF-8 without BOM"
    chosen: "Python pathlib.write_text() default UTF-8 encoding (no Byte Order Mark)"
    rejected:
      - "ASCII encoding — overly restrictive, incompatible with Unicode content, obsolete for modern text files"
      - "UTF-16 encoding — wasteful (2+ bytes per character), uncommon for markdown, large file size"
      - "Latin-1 encoding — single-byte limitation, obsolete, incompatible with modern standards"
      - "UTF-8 with BOM — pathlib.write_text() never emits BOM, explicit BOM would require write_bytes()"
    rationale: >
      UTF-8 is the universal standard for markdown and web content (RFC 3629).
      Python 3 defaults to UTF-8 encoding in text mode — no explicit parameter needed.
      All 183+ existing test markdown files use UTF-8 without BOM (verified by examination).
      UTF-8 is efficient: ASCII characters are single-byte, Unicode available when needed.
      pathlib.write_text() never emits Byte Order Mark on simple writes with default encoding.

  - title: "Line Endings: LF (Unix/Linux style)"
    chosen: "Python text mode default newline='\\n' (LF) on Linux environment"
    rejected:
      - "CRLF (Windows style \\r\\n) — specification explicitly requires LF; incompatible with Unix conventions"
      - "System default (os.linesep) — OS-dependent, violates explicit LF requirement, non-portable"
      - "Binary mode with manual line ending handling — error-prone, verbose, unnecessary complexity"
      - "CR only (\\r, old Mac) — obsolete, incompatible with modern systems"
    rationale: >
      Specification explicitly requires LF (\\n) Unix-style line endings (NFR-2).
      Execution environment is Linux — Python text mode defaults to LF on Unix/Linux systems.
      All 183+ existing test files use LF line endings (verified by git config and file inspection).
      Consistent with git best practices and repository conventions (likely uses git LF normalization).
      pathlib.write_text() uses LF by default on Unix/Linux without explicit parameter.

  - title: "Content Generation: Manual Prose"
    chosen: "Manually written, coherent 2-3 prose sentences following established pattern"
    rejected:
      - "Template-based generation — unnecessary complexity, introduces templating dependency, harder to maintain"
      - "Algorithmic/random generation — non-deterministic, unpredictable output, low quality prose"
      - "AI model API calls — external dependency, violates determinism requirement, adds latency and cost"
      - "Lorem ipsum placeholder — violates requirement for 'coherent, meaningful prose content' (NFR-4)"
    rationale: >
      Proven approach across all 183+ existing test files — human-written prose ensures grammatical
      correctness and coherence. Minimal effort required (< 5 minutes to compose 2-3 sentences).
      Deterministic output is reviewable and auditable. No external dependencies or infrastructure.
      Specification explicitly requires 'meaningful prose content' — lorem ipsum or generated text fails this.
      Manual approach aligns with simplicity principle and avoids over-engineering.

  - title: "Git Workflow: CLI Commands via subprocess"
    chosen: "Standard git CLI commands (git add, commit, push) executed via subprocess/Bash"
    rejected:
      - "GitPython library — external dependency, overkill for 3 simple commands, adds maintenance burden"
      - "pygit2 bindings — requires C library compilation, platform-dependent, not portable"
      - "Manual git object parsing — extremely complex, error-prone, unmaintainable"
      - "CrewAI agentic framework — listed in feature spec but unnecessary overhead for deterministic file operations"
    rationale: >
      Git CLI is already required by specification ('Git (version control and commits)' in technologies).
      Three commands (add, commit, push) are simple and well-defined — no library overhead needed.
      Subprocess approach is transparent and debuggable for operations teams.
      Zero additional external dependencies beyond git itself (already required).
      Consistent with existing deployment automation patterns in the repository (verified by git log).

