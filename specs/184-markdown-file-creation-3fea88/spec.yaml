content: |
  ## Problem Statement

  Create a single markdown test file (`test-2uxhe8.md`) at the repository root containing an H1 heading as title and 2-3 sentences of coherent prose content. This feature demonstrates automated file creation, git integration, and conventional commit workflows following the well-established pattern of 183 preceding test markdown files already present in the repository.

  The feature follows an identical, proven pattern executed 183 times successfully in features 1-183. All format specifications, naming conventions, git workflows, and content structure are fully validated through precedent. No architectural decisions or research is required.

  ## Success Criteria

  - [ ] File `test-2uxhe8.md` is created in the repository root directory
  - [ ] File contains exactly one H1 heading (using `# ` markdown syntax)
  - [ ] H1 heading is followed by 2-3 sentences of coherent prose content
  - [ ] File uses UTF-8 character encoding
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File content is valid markdown (proper syntax and formatting)
  - [ ] File is staged with `git add test-2uxhe8.md`
  - [ ] File is committed with conventional commit message: `feat(184): Create markdown file test-2uxhe8.md with prose content`
  - [ ] Commit is pushed to remote branch `feat/184-markdown-file-creation-3fea88`
  - [ ] Prose content is grammatically correct and coherent
  - [ ] File size is approximately 300-600 bytes (consistent with established test file pattern)

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named `test-2uxhe8.md` at repository root
  - **FR-2**: Include an H1 heading using markdown syntax (`# Heading Text`)
  - **FR-3**: Include 2-3 sentences of prose content immediately following the H1 heading
  - **FR-4**: Save file with UTF-8 encoding
  - **FR-5**: Use LF (Unix) line endings throughout the file
  - **FR-6**: Stage the file using `git add test-2uxhe8.md`
  - **FR-7**: Create a commit with conventional commit format: `feat(184): Create markdown file test-2uxhe8.md with prose content`
  - **FR-8**: Push the commit to the feature branch `feat/184-markdown-file-creation-3fea88`

  ## Non-Functional Requirements

  - **NFR-1**: File must be valid markdown (passes markdown syntax standards)
  - **NFR-2**: Prose content must be grammatically correct and coherent
  - **NFR-3**: File size should be 300-600 bytes to match established test file convention
  - **NFR-4**: Content should be meaningful and on-topic (not randomly generated gibberish)
  - **NFR-5**: Implementation should follow the proven pattern established by features 1-183
  - **NFR-6**: No dependencies required beyond Python standard library (`pathlib`) and git
  - **NFR-7**: Implementation should complete in approximately 10-15 minutes

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose content be on a specific topic, or can it be about any topic? | Any topic allowed | User query specifies "about anything", previous 183 implementations use varied topics, maximizes flexibility |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is a CrewAI-based agentic platform for automated code implementation. The project structure is:

  ```
  sheep/
  ├── src/sheep/           # Main application source code
  │   ├── agents/          # Agent definitions (research, implementation, review)
  │   ├── config/          # Configuration management
  │   ├── flows/           # Flow definitions (orchestration)
  │   ├── observability/   # Logging and tracing via Langfuse
  │   ├── tools/           # Agent tools (git_tools.py, file_tools.py)
  │   └── cli.py           # CLI entry point
  ├── specs/               # Feature specification directory (184+ specs)
  ├── .github/             # GitHub Actions workflows
  ├── Dockerfile           # Container configuration
  ├── README.md            # Project documentation
  └── [test-*.md files]    # 183+ test markdown files (one per completed feature)
  ```

  ### Architecture Patterns

  **Separation of Structure and Intelligence:**
  - Flows define execution structure and control paths
  - Crews provide autonomous AI decision-making
  - Each crew is specialized for specific flow steps

  **Task-First Design:**
  - Well-designed tasks drive agent performance
  - Simple, focused tasks achieve higher quality outcomes
  - This feature demonstrates a minimal, well-understood task

  **Established Test File Convention:**
  - Repository contains 183+ test markdown files (`test-*.md`) created by features 1-183
  - Each file follows identical structure: H1 heading + 2-3 sentences of prose
  - Files are committed with conventional message format: `feat(N): Create markdown file test-XXXXX.md with prose content`
  - Pattern is fully validated through 183 successful implementations

  ### Relevant Technologies

  **1. Markdown (file format)**
  - Simple, human-readable text format
  - H1 heading syntax: `# Heading Text`
  - All test files use UTF-8 encoding with LF line endings
  - Typical file size: 300-600 bytes

  **2. Git (version control)**
  - Feature branch: `feat/184-markdown-file-creation-3fea88` (pre-created)
  - Workflow: create file → stage with `git add` → commit → push
  - Conventional commit format: `feat(184): Create markdown file test-2uxhe8.md with prose content`
  - No merge conflicts or complex branch operations

  **3. Python 3.11+ (standard library)**
  - `pathlib.Path` for file operations (no external dependencies)
  - File creation, encoding handling, validation
  - Subprocess for git operations

  **4. CrewAI (agentic framework)**
  - Orchestrates the implementation flow
  - Agents leverage LLM APIs for prose content generation
  - Logging and observability integration

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 183 test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-183; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/184-markdown-file-creation-3fea88` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 183 existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (1-183) demonstrate successful execution of identical pattern
  - Features 180-183 specs provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes)**

  Minimal-effort, single-file creation with well-established precedent:

  - **File creation**: ~5 minutes (compose H1 heading + 2-3 coherent sentences)
  - **Validation**: ~2-3 minutes (verify UTF-8 encoding, LF line endings, markdown format)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push)
  - **Total estimate**: 10-15 minutes

  Justification:
  - Well-established pattern with 183 identical test files providing clear precedent
  - No architectural decisions, research, or complex logic required
  - Single file with simple, well-understood format (H1 + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent features (180-183) demonstrate efficient execution in this time range
  - Standard git workflow with no merge conflicts or branch complexity
