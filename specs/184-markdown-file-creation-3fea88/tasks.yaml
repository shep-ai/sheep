content: |
  ## Task Breakdown Summary

  Implementation proceeds through 3 focused tasks across 2 sequential phases:

  **Phase 1: File Creation & Validation (5 minutes)**
  - Task 1 (3 min): Create test-2uxhe8.md using pathlib with proper H1 heading and prose
  - Task 2 (2 min): Validate file encoding (UTF-8, no BOM), line endings (LF only), and format

  **Phase 2: Git Integration (5 minutes)**
  - Task 3 (5 min): Stage, commit with conventional message, and push to feature branch

  All tasks follow TDD cycle: RED (verify precondition), GREEN (implement), REFACTOR (verify result).
  Task ordering respects dependencies (Task 2 depends on Task 1, Task 3 depends on Task 2).
  Total estimated effort: 10-15 minutes (S-sized feature).

  ## Implementation Notes

  - Prose content should match the pattern of 183+ preceding test files: substantive but brief
  - H1 heading should be 5-7 words (typical pattern from features 181-183)
  - File size target 300-600 bytes ensures consistency with precedent
  - Git commit message must use exact format (feature number 184, file name, \"with prose content\")
  - Feature branch feat/184-markdown-file-creation-3fea88 is pre-created per specification
