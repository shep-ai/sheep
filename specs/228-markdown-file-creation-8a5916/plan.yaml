# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows an established pattern from 150+ identical implementations (features 069-227).
  The implementation is mechanically straightforward and requires no architectural decisions:

  1. **File Creation**: Create a markdown file at the repository root with a specific filename,
     H1 heading, blank line, and 2-3 sentences of prose content.
  2. **Encoding & Format**: Ensure UTF-8 without BOM and Unix-style LF line endings through
     explicit encoding parameters in pathlib.
  3. **Git Integration**: Stage the file, commit with a pre-specified message, and push to
     the feature branch.

  The feature is completely isolated from application code in `/src/sheep/` and does not modify
  any source code, configuration, tests, or documentation. It is purely additive: creates one
  new markdown file in the repository root alongside 90+ existing test files that follow identical
  patterns.

  ## Key Design Decisions

  ### 1. File I/O Using Python pathlib.Path

  **Chosen:** Python `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF line ending enforcement

  **Why this approach:**
  - Feature specification explicitly requires pathlib per NFR-5 (research validated)
  - `encoding='utf-8'` ensures UTF-8 without BOM (Python's utf-8 codec does not write BOM by default)
  - `newline='\n'` enforces Unix-style LF line endings, overriding platform defaults (Windows CRLF)
  - This combination satisfies all encoding and line ending requirements (NFR-1, NFR-2)
  - Proven across all 150+ existing test files in the repository
  - Part of Python standard library (no external dependencies per NFR-9)

  **Alternatives rejected:**
  - `open()/write()` functions — older Python pattern; pathlib is the modern standard (Python 3.4+)
  - External file libraries — violate NFR-9 (no new dependencies); unnecessary complexity

  ### 2. Git Integration via subprocess Module

  **Chosen:** System git CLI commands executed via Python `subprocess.run()`

  **Why this approach:**
  - Feature specification prohibits new external dependencies (NFR-9)
  - Three operations are mechanical and straightforward: add, commit, push
  - subprocess.run(check=True) provides sufficient error handling
  - Established pattern across all features 069-227 (research validated)
  - Avoids abstraction overhead for simple operations

  **Alternatives rejected:**
  - GitPython library — violates NFR-9; unnecessary complexity for three simple commands
  - Custom git wrapper — premature abstraction; subprocess is clear and proven

  ### 3. Markdown Content Format

  **Chosen:** Follow established pattern: single H1 heading, blank line, 2-3 sentences of prose

  **Why this approach:**
  - Validated across 90+ existing test files with diverse topics (research confirmed)
  - Natural format produces 400-600 byte files (per NFR-3) without additional effort
  - Free-form topic selection per NFR-8; any topic works as demonstrated by existing files
  - No templating or content generation needed; natural prose quality is highest
  - Specification example: `# Heading\n\nSentence 1. Sentence 2. Sentence 3.`

  **Alternatives rejected:**
  - Templated content — adds unnecessary complexity; proven that natural prose works
  - Predefined topic list — limits quality; empirical evidence shows any topic works equally well

  ### 4. Encoding and Line Ending Standards

  **Chosen:** UTF-8 without BOM via `encoding='utf-8'`; Unix LF via `newline='\n'`

  **Why this approach:**
  - UTF-8 without BOM: Python's utf-8 codec does not write BOM by default (only utf-8-sig does)
  - Unix LF: The newline parameter overrides platform-specific defaults (Windows CRLF, Unix LF)
  - Cross-platform consistency: explicit parameters ensure correct behavior on all platforms
  - Validated across all 150+ existing test files in the repository
  - Per specifications NFR-1 (UTF-8 without BOM) and NFR-2 (Unix LF line endings)

  **Alternatives rejected:**
  - System default encoding — unpredictable across platforms; spec requires explicit UTF-8 without BOM
  - CRLF line endings — violates NFR-2; all existing files use LF; spec explicitly requires Unix
  - utf-8-sig codec — writes BOM, violating NFR-1; standard utf-8 is the correct choice

  ## Implementation Strategy

  **Phase 1: Markdown File Creation**

  The implementation creates the file with Python pathlib, ensuring proper encoding and line endings
  from the start. No intermediate steps or validation utilities are needed. The format is simple:
  one H1 heading on the first line, a blank line, then 2-3 sentences of prose content. Topic selection
  is free-form; any topic following the observation from 90+ existing files works equally well.

  **Phase 2: Git Integration**

  Once the file is created and validated, the implementation stages it with `git add`, commits
  with the exact pre-specified message, and pushes to the feature branch. These operations are
  mechanical and follow the established pattern from features 069-227. No conditional logic or
  error handling beyond subprocess.run(check=True) is needed.

  **Why this ordering:**

  File creation must precede git operations. Once the file is created and verified correct, the
  git workflow can proceed. The two phases are sequential and separate concerns: file system
  (phase 1) then version control (phase 2).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect file encoding (BOM or wrong codec) | Use explicit `encoding='utf-8'` parameter in pathlib.write_text(); Python's utf-8 codec does not write BOM by default |
  | Platform-specific line endings (CRLF on Windows) | Use explicit `newline='\n'` parameter to override platform defaults and enforce Unix LF across all systems |
  | Prose content quality or length | Free-form topic selection; 90+ existing files prove any topic works; prose quality is naturally high in all existing files |
  | Git commit message incorrect | Pre-specify exact message in code; no user input or templating variability; validate message after commit |
  | File not staged or pushed | Use subprocess.run(check=True) to catch git operation failures; verify status after each operation |
  | Feature branch does not exist | Feature branch is pre-created as documented in dependencies; verify branch exists before pushing |
