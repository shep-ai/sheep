  - title: "Content Generation via Claude API"
    chosen: "Use Anthropic Claude 3.5 Sonnet via CrewAI's get_reasoning_llm() wrapper in content_generators.py::generate_markdown_content(); let the wrapper handle API calls, retries, and response parsing"
    rejected:
      - "Call Claude API directly using anthropic Python SDK — adds dependency management burden; duplicates error handling logic already in wrappers; violates NFR-7 (reuse existing utilities unchanged)"
      - "Use claude-3-opus or claude-4 models — Claude 3.5 Sonnet is explicitly specified in spec and proven across 256+ implementations; switching models introduces validation risk"
    rationale: "The content_generators.py wrapper already manages Claude API integration with proper error handling, retry logic, and response validation. CrewAI's get_reasoning_llm() is configured in sheep.config.llm and handles authentication via ANTHROPIC_API_KEY environment variable. This approach is proven across all 256 prior features and requires no additional configuration."

  - title: "File Encoding and Line Endings"
    chosen: "Write file using pathlib.Path.write_text(content, encoding='utf-8'); Python 3 text mode automatically uses LF on Unix systems and CRLF on Windows; validate using validate_markdown_file() which checks for UTF-8 validity, rejects BOM, and rejects CRLF"
    rejected:
      - "Manually encode to bytes and use write_bytes() with explicit LF injection — adds complexity; binary mode operations are error-prone; pathlib's text mode is the standard Python idiom for cross-platform text I/O"
      - "Use codecs module with BOM stripping — unnecessary extra dependency; Python's open() with encoding='utf-8' never produces BOM in write mode; adds maintenance burden"
    rationale: "Python 3.11+ pathlib.Path.write_text() with encoding='utf-8' is the standard, idiomatic approach for cross-platform text file creation. UTF-8 without BOM is guaranteed because Python 3 never writes BOM for UTF-8 in text mode. Unix LF line endings are enforced by the validate_markdown_file() check which rejects any CRLF found in the file. This approach is used across 256 prior implementations."

  - title: "Markdown Content Validation"
    chosen: "Reuse validate_markdown_file() from content_generators.py which validates: H1 heading presence, 2-3 sentence count, UTF-8 encoding with no BOM, LF line endings only, trailing newline, 250-600 byte size, valid markdown syntax"
    rejected:
      - "Write custom validation logic in the feature module — violates NFR-7 (reuse utilities unchanged); duplicates logic already mature and tested across 256 implementations; increases code complexity"
      - "Use a markdown parser library (markdown-it-py, mdformat) — adds external dependency; validate_markdown_file() already handles all required validation checks using regex and string operations"
    rationale: "The validate_markdown_file() wrapper in content_generators.py is comprehensive, tested, and handles all success criteria validation (H1 structure, sentence count, character bounds, encoding, line endings). Using it directly satisfies FR-7 (reuse validation utilities) and reduces the feature module to 30-50 lines."

