content: |
  ## Task Breakdown Summary

  This task breakdown covers 4 concrete, ordered tasks across 3 phases, totaling ~90 minutes
  of implementation work. All tasks follow TDD methodology with explicit RED-GREEN-REFACTOR cycles.

  ### Phase 1: Foundation (Task 1 — 15 min)

  **Create the feature module scaffold**: Imports, constants, docstring, and logging initialization.
  This establishes the structure that all subsequent tasks depend on. TDD approach: write test
  for module existence and importability first, then create the file with correct structure,
  then refactor for clarity and consistency.

  **Why this comes first**: The feature module must exist before any implementation work can happen.
  This task establishes the foundation.

  ### Phase 2: Workflow (Task 2 — 30 min)

  **Implement the core 5-step orchestration**: Call wrapper functions from content_generators.py
  in sequence: generate → write → validate → commit → push. Each step depends on the previous
  step's completion. Logging at major milestones provides observability and debugging support.

  TDD approach: write test that expects successful feature execution and artifact creation,
  then implement function calling wrappers in sequence, then add comprehensive logging at each step.

  **Why this comes after Task 1**: The feature module must exist before we can implement its
  core logic.

  ### Phase 3: Robustness (Tasks 3-4 — 45 min)

  **Task 3 (20 min)**: Add error handling wrapper, result composition, and CLI execution.
  - Wrap workflow in try/except for structured error handling
  - Compose and return structured result dict
  - Add if __name__ == '__main__' block for standalone CLI execution

  **Task 4 (25 min)**: Verify end-to-end behavior and all success criteria.
  - Run complete feature execution
  - Verify all file properties (existence, structure, encoding, line endings, size)
  - Verify all git operations (commit message, branch, push status)
  - Verify function return value and exception handling

  **Why this order**: Error handling must be implemented before comprehensive integration testing.
  Task 3 ensures robustness, Task 4 verifies that all success criteria are met.

  ## Task Dependencies

  Tasks must be completed in order:
  - **Task 1 → Task 2**: Module must exist before implementing core logic
  - **Task 2 → Task 3**: Core logic must work before adding error handling
  - **Task 3 → Task 4**: Error handling must be complete before integration testing

  All dependencies are sequential (no parallel execution possible).

  ## TDD Methodology

  All code tasks use explicit TDD cycles:

  - **RED**: Write tests that specify expected behavior (tests fail because code doesn't exist)
  - **GREEN**: Implement minimal code to make tests pass (no over-engineering)
  - **REFACTOR**: Clean up code (extract helpers, improve naming, add logging, etc.) while keeping tests green

  Tasks are small enough that each TDD cycle is quick (15-30 min per task), reducing feedback latency.

  ## Success Criteria Summary

  By the end of Task 4, the feature will have achieved:

  1. **File Creation**: test-fl139g.md exists in repository root with proper structure
  2. **Content Quality**: H1 heading + 2-3 sentences of meaningful prose
  3. **Encoding Standards**: UTF-8 without BOM, Unix LF line endings only
  4. **File Validation**: Size 250-600 bytes, valid markdown syntax
  5. **Git Integration**: File staged, committed with exact conventional message, pushed to remote
  6. **Orchestration**: 5-step workflow calling content_generators.py wrappers in sequence
  7. **Error Handling**: Fail-fast approach with structured logging at each step
  8. **Structured Result**: Return dict with filepath, content, commit_message, push_result
  9. **Code Quality**: Feature module ~40 lines of clean, well-documented orchestration code
  10. **Observability**: Structured logging via structlog at major milestones

  All success criteria from the feature specification will be verifiable via the Task 4 integration tests.
