content: |
  ## Architecture Overview

  This feature implements the well-established pattern from features 001-256, creating a single
  markdown file artifact in the repository root. The implementation is thin orchestration:
  call 5 existing wrapper functions from `content_generators.py` in sequence, with structured
  logging and error handling.

  ### Module Design

  **File:** `src/sheep/features/feature_257_markdown_file_creation.py`

  The feature module follows the standard pattern observed across all 256 prior implementations:

  - **Imports**: pathlib, content_generators wrappers, structlog
  - **Module constants**: FEATURE_NUMBER=257, MARKDOWN_FILENAME="test-fl139g.md"
  - **Main orchestration function**: execute_feature_257()
  - **Structured logging**: get_logger(__name__) for observability
  - **Return structure**: dict with filepath, content, commit_message, push_result keys
  - **CLI execution**: if __name__ == "__main__" block for standalone execution

  ### Call Sequence

  The feature function orchestrates 5 sequential steps from content_generators.py:

  1. **Generate Content** → Call generate_markdown_content()
     - Returns H1 title + 2-3 sentences via Claude 3.5 Sonnet API
     - Handles authentication via ANTHROPIC_API_KEY
     - Implements 30-second timeout (NFR-4)

  2. **Write File** → Call write_markdown_file(filepath, content)
     - Writes test-fl139g.md to repository root
     - Ensures UTF-8 encoding without BOM
     - Enforces Unix LF line endings (\n only)

  3. **Validate File** → Call validate_markdown_file(filepath)
     - Checks H1 structure (# Title format)
     - Verifies sentence count (2-3 sentences)
     - Confirms character bounds (250-600 bytes)
     - Validates encoding (UTF-8, no BOM)
     - Confirms line endings (LF only, no CRLF)
     - Validates markdown syntax

  4. **Commit** → Call commit_markdown_file(filepath, content, custom_message=...)
     - Git add test-fl139g.md
     - Create commit with exact message: "feat(257): create markdown file test-fl139g.md with prose content"
     - Uses conventional commit format

  5. **Push** → Call push_markdown_file(repo_path)
     - Git push to remote feat/257-markdown-file-creation-ef4e6e branch
     - Verifies upstream tracking is configured

  Each step depends on successful completion of the previous step. Exceptions propagate
  immediately (fail-fast) and are logged with context at the feature level.

  ### Integration with Existing Codebase

  - **No new utilities**: Feature reuses mature wrappers from content_generators.py (proven across 256+ features)
  - **No configuration changes**: Operates within existing CrewAI framework setup
  - **No test modifications**: Feature is artifact creation, not testable application code
  - **No source code impact**: Pure additive feature, zero changes to application logic
  - **Follows 256+ precedent**: Every technology decision is constrained by prior implementations

  ### File System Impact

  **New artifacts created**:
  - test-fl139g.md (250-600 bytes) in repository root
  - src/sheep/features/feature_257_markdown_file_creation.py (~40 lines of orchestration code)

  **Git state changes**:
  - Feature branch: feat/257-markdown-file-creation-ef4e6e
  - New commit: "feat(257): create markdown file test-fl139g.md with prose content"
  - Branch pushed to origin with upstream tracking

  **No modifications** to existing files per NFR-9 (feature is purely additive)

  ## Key Design Decisions

  ### 1. High-Level Wrapper Architecture (FR-12, NFR-7)

  **Decision**: Use high-level wrappers from content_generators.py exclusively.

  **Rationale**: All 256 prior implementations use this pattern. Wrappers abstract away
  encoding, validation, git, and API complexity, keeping the feature module to 30-50 lines.
  This satisfies FR-12 requirement to use high-level wrappers and NFR-7 requirement to
  reuse existing utilities unchanged without modification.

  **Alternatives Rejected**:
  - Low-level utilities from create_markdown.py would require manual validation and error handling
  - Building custom utilities would duplicate logic already tested across 256 features

  **Evidence from research**: All 256+ prior features follow this pattern with consistent success.
  Wrappers provide clean separation of concerns and reduce maintenance burden.

  ### 2. Content Generation via Claude 3.5 Sonnet (FR-3, NFR-4)

  **Decision**: Call generate_markdown_content() wrapper, which handles Claude API integration.

  **Rationale**: CrewAI framework manages authentication via ANTHROPIC_API_KEY, model selection
  (claude-3-5-sonnet), API timeouts (30s per NFR-4), and response parsing. The wrapper is
  proven across all 256 prior features and requires no additional configuration.

  **Alternatives Rejected**:
  - Direct Anthropic SDK usage would duplicate error handling logic and add configuration burden
  - Different models not specified in requirements; Claude 3.5 Sonnet is explicit requirement

  ### 3. File Encoding & Line Endings (FR-4, FR-5)

  **Decision**: Use pathlib.Path.write_text() with encoding='utf-8'; validate with
  validate_markdown_file() which checks for BOM-free UTF-8 and Unix LF-only line endings.

  **Rationale**: Python 3 pathlib is the standard idiom for cross-platform text I/O.
  UTF-8 without BOM is guaranteed by Python 3 (never writes BOM in text mode). Line ending
  validation is handled post-write by the wrapper's comprehensive validation function.

  **Alternatives Rejected**:
  - Binary mode with explicit LF injection adds complexity without benefit
  - codecs module adds unnecessary dependency; Python 3 handles this correctly by default

  ### 4. Validation Strategy (FR-6, FR-7)

  **Decision**: Reuse validate_markdown_file() from content_generators.py, which validates:
  - H1 heading presence and structure
  - Sentence count (2-3 sentences)
  - Character bounds (250-600 bytes)
  - UTF-8 encoding without BOM
  - Unix LF line endings only
  - Trailing newline
  - Valid markdown syntax

  **Rationale**: Comprehensive, tested utility already implements all success criteria checks.
  Using it satisfies FR-6/FR-7 and keeps feature module slim (30-50 lines as required by NFR-2).

  **Alternatives Rejected**:
  - Custom validation logic would duplicate mature utility code
  - External markdown parser adds unnecessary dependency

  ### 5. Git Operations (FR-8, FR-9, FR-10)

  **Decision**: Use commit_markdown_file() and push_markdown_file() wrappers with custom
  commit message parameter.

  **Rationale**: Wrappers abstract git complexity, handle conventional commit formatting,
  integrate with CrewAI GitCommitTool and GitPushTool. Proven across 256+ features
  without failures or modifications needed.

  **Alternatives Rejected**:
  - subprocess.run() would duplicate error handling and bypass CrewAI tool integration
  - Direct GitPython usage is lower-level than existing wrappers

  ### 6. Error Handling (NFR-5, NFR-6)

  **Decision**: Fail-fast approach: let wrapper exceptions propagate; wrap entire workflow
  in try/except at feature level; log detailed error context at each step before re-raising.

  **Rationale**: Exceptions from wrappers already include context (API failures, file I/O errors,
  git failures). Feature-level try/except provides structured logging and allows callers to
  handle failures. Satisfies NFR-5 (fail-fast) and NFR-6 (clear error messages).

  **Alternatives Rejected**:
  - Custom error recovery adds complexity and contradicts fail-fast principle
  - Silent error swallowing prevents debugging and violates NFR-6

  ### 7. Structured Logging (NFR-3)

  **Decision**: Use structlog.get_logger(__name__) at module level; call _logger.info()
  at major workflow steps, _logger.debug() for details.

  **Rationale**: structlog is project dependency, pre-configured in sheep.observability.logging,
  used across all 256+ features. Provides structured, queryable logging for observability
  and integrates with CrewAI observability infrastructure.

  **Alternatives Rejected**:
  - Standard logging module less integrated with CrewAI observability
  - Custom formatting contradicts established patterns

  ### 8. Result Structure (Success Criteria)

  **Decision**: Return dict[str, str] with keys: filepath, content, commit_message, push_result

  **Rationale**: Matches all 256 prior implementations. Enables caller composition and
  easy serialization for logging. Provides rich result information for orchestration.

  **Alternatives Rejected**:
  - Dataclass adds complexity without benefit over dict
  - Partial results (just filepath) would lose information needed by callers

  ## Implementation Strategy

  **Phase 1 (Foundation — 15 min)**: Create module scaffold with correct structure, imports,
  and setup. This is prerequisite for all subsequent work. Establishes the foundation that
  all remaining phases depend on.

  **Phase 2 (Workflow — 30 min)**: Implement the 5-step orchestration. Each step depends on
  the previous one completing successfully. Implementation is straightforward function calls
  with structured logging at major milestones.

  **Phase 3 (Robustness — 45 min)**: Add error handling wrapper, result composition, and
  verify end-to-end behavior matches all success criteria. Tasks 3 and 4 run in sequence
  to ensure error handling is tested before final integration validation.

  **Rationale for Ordering**: This ordering allows earlier phases to establish the foundation,
  middle phase to implement core logic, and final phase to add robustness and comprehensive
  validation. Each phase is prerequisite for the next.

  **Total Estimated Effort**: 90 minutes for experienced developer; matches size estimate "S"
  (small, <2 hours) from spec.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | API call fails (network, rate limit, invalid credentials) | Wrapper functions from content_generators.py implement retry logic and timeout handling (30s per NFR-4). Exceptions propagate with clear messages. Feature logs context at each step. |
  | File already exists or cannot be written | pathlib operations raise IOError/OSError if file exists or permissions missing. Wrappers catch and log these with context. Feature-level try/except provides final safety net. |
  | Git operations fail (not on feature branch, uncommitted changes, push permission) | CrewAI git tool wrappers implement proper git state checks. Commit and push operations verify branch and upstream tracking. Clear error messages identify failure point. |
  | Generated content is invalid (no H1, wrong sentence count) | validate_markdown_file() explicitly checks all structural requirements. Invalid content raises ValueError with details. Feature logs validation failure and stops (fail-fast). |
  | Line ending or encoding issues | validate_markdown_file() explicitly rejects CRLF and checks UTF-8 decodability. Python 3 pathlib guarantees LF on Unix and proper encoding without BOM in text mode. Post-write validation confirms correct state. |
  | Feature module has syntax errors | Python import will fail immediately, caught during initialization. TDD red phase writes test that imports module, catching import errors early. |
  | Wrapper functions not available in content_generators.py | Research confirms all 5 required wrappers exist and are documented in analysis. No risk of missing dependencies. |
  | Feature branch not pre-created | Feature branch feat/257-markdown-file-creation-ef4e6e is pre-created per spec (verified in git status). No branch creation logic needed. |

  ---

  _Planning complete — all decisions documented with rationale and precedent. Ready for task breakdown and implementation._
