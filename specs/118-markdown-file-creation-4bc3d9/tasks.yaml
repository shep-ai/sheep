content: |
  ## Task Flow Overview

  This feature follows a standard implementation pattern proven across 100+ prior features:

  **Phase 1 — Implementation** (Task 1)
  Create the feature module that orchestrates file creation. The module is minimal
  and focused: import content_generators, call create_markdown_file(), return results.
  All complexity is delegated to the orchestrator which has been proven at scale.

  **Phase 2 — Validation Testing** (Tasks 2-4)
  Write targeted tests for each success criterion:
  - Task 2 validates file structure (markdown format, H1 title, 2-3 sentences)
  - Task 3 validates file properties (UTF-8 encoding, LF line endings, size)
  - Task 4 validates git operations (commit message format, push to branch)

  These tests are written *after* implementation so they can verify specific outputs.
  Each test is focused on one aspect of the spec for clarity and maintainability.

  **Phase 3 — Integration Test** (Task 5)
  Create comprehensive end-to-end test that combines all validations and verifies
  the complete feature workflow. This test serves as the final verification that all
  success criteria are met and the feature works as a complete unit.

  ## Why This Structure

  This task structure mirrors features 116-117 which successfully implemented identical
  patterns. The approach is proven to:

  1. **Enable Rapid Development** — Minimal feature code + focused tests
  2. **Ensure Quality** — Comprehensive test coverage of all success criteria
  3. **Maintain Consistency** — Follows established pattern from 100+ prior features
  4. **Simplify Debugging** — Small, focused tests make failures easy to diagnose

  ## Test Strategy

  All tests use TDD (Test-Driven Development) cycles:

  - **RED:** Write test that asserts expected behavior
  - **GREEN:** Implement minimal code to pass the test
  - **REFACTOR:** Clean up, extract helpers, improve naming

  This cycle ensures tests drive the implementation and validations are comprehensive.

  ## Success Criteria Integration

  Each test maps to specific success criteria from the spec:

  - Task 2 → File creation, H1 heading, 2-3 sentences, readable prose
  - Task 3 → UTF-8 encoding, LF line endings, file size, CommonMark validation
  - Task 4 → Git staging, commit message format, conventional commits, push
  - Task 5 → Structured logging, no errors/warnings, pattern consistency

  By organizing tests this way, we can verify each success criterion is met and
  trace failures back to specific requirements.
