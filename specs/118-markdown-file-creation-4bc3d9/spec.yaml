content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (test-zscez5.md)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  117+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is a continuation of the markdown-file-creation pattern established in features 069-117,
  with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File test-zscez5.md is created at repository root
  - [ ] File contains H1 markdown heading as title (format: `# Title`)
  - [ ] File contains 2-3 sentences of prose content after blank line
  - [ ] File uses UTF-8 encoding with no BOM (Byte Order Mark)
  - [ ] File uses LF line endings (not CRLF or mixed line endings)
  - [ ] File size is between 300-800 bytes (typical range 400-600 bytes)
  - [ ] File validates against CommonMark markdown specification
  - [ ] File content is grammatically correct and human-readable prose
  - [ ] File is staged in git with git add command
  - [ ] Git commit is created with conventional commits format
  - [ ] Commit message is exactly: "feat(118): create markdown file test-zscez5.md with prose content"
  - [ ] Changes are pushed to feat/118-markdown-file-creation-4bc3d9 branch with upstream tracking
  - [ ] Structured logging captures all operations (generation, validation, staging, commit, push)
  - [ ] All execution completes without errors or warnings
  - [ ] Output matches established pattern from features 069-117 (117+ existing test files serve as reference)

  ## Functional Requirements

  - **FR-1: Content Generation** — System must generate markdown content using LLM via CrewAI framework with H1 heading as title and 2-3 sentences of prose content; topic is flexible per user query ("about anything")

  - **FR-2: File Creation** — System must write generated markdown content to file named test-zscez5.md at repository root using pathlib.Path.write_text() with UTF-8 encoding

  - **FR-3: Markdown Structure Validation** — System must validate: (a) H1 heading is present and properly formatted, (b) blank line separates heading from prose, (c) exactly 2-3 sentences of prose content exist, (d) no other content beyond heading and prose

  - **FR-4: File Encoding and Line Ending Validation** — System must verify UTF-8 encoding without BOM, verify LF line endings (not CRLF or mixed), confirm file size is reasonable (300-800 bytes)

  - **FR-5: Git Staging** — System must stage file in git using git add command via GitCommitTool, preparing file for commit operation

  - **FR-6: Git Commit** — System must create git commit with conventional commits format; commit message must be exactly: "feat(118): create markdown file test-zscez5.md with prose content"

  - **FR-7: Git Push** — System must push committed changes to feat/118-markdown-file-creation-4bc3d9 branch with upstream tracking enabled using GitPushTool

  ## Non-Functional Requirements

  - **NFR-1: Encoding and Line Endings** — All file I/O must use UTF-8 encoding without BOM; all text files must use LF line endings (Unix standard, not CRLF or mixed); confirmed by pathlib.Path.write_text() with encoding='utf-8' and newline='\n'

  - **NFR-2: Structured Logging and Observability** — All operations must be logged using structlog with module-level logger; logs must include: (a) function entry points, (b) debug steps during generation/validation/git operations, (c) completion status for each operation, (d) error details with descriptive messages; execution must be traceable via Langfuse if configured

  - **NFR-3: Performance** — Content generation must complete within 30 seconds; file I/O operations must complete within 5 seconds; git operations (add/commit/push) must complete within 10 seconds; total feature execution must complete within 1 minute

  - **NFR-4: Security and Data Integrity** — File operations must validate write success using pathlib.Path.stat() after writing; file permissions must be readable by all users (standard repository permissions); no sensitive data should be logged or stored in files; git operations must use authenticated credentials (already configured in environment)

  - **NFR-5: Python Compatibility** — Implementation must work with Python 3.11+ per project requirement; must support multiple LLM providers via CrewAI (OpenAI, Anthropic Claude, Google Gemini); must use only standard library (pathlib) and existing project dependencies

  - **NFR-6: Pattern Consistency** — Implementation must strictly follow established pattern from features 069-117; output markdown format must match existing test-*.md files in repository; git workflow (commit message format, push strategy) must match established conventions; no deviations from precedent

  ## Product Questions & AI Recommendations

  **Status: No open product questions.** This feature has zero ambiguous decisions and requires no stakeholder input:

  - **Prose topic selection**: User query explicitly states "about anything" — topic is entirely flexible; content_generators LLM generates appropriate content based on its training
  - **Sentence count**: Explicitly defined as "2-3 sentences" in user query — validation enforces this constraint via content_generators.validate_markdown_file()
  - **File location**: Repository root only — established as safe by design in content_generators.py with built-in path validation
  - **Commit message format**: Established from 117+ identical features (069-117) — format is "feat(118): create markdown file test-zscez5.md with prose content" with no variation
  - **Implementation method**: content_generators module provides complete, proven orchestration — no alternative approaches needed

  The feature follows an established, battle-tested pattern with 117+ successful implementations (features 069-117).
  All technical and product requirements are clearly specified and measurable. All decisions are resolved.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zscez5.md) to existing collection of 117+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-117; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or modify any source code beyond importing existing helper functions from content_generators |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Tests Directory | None | No changes to existing tests; no new test files required for this feature |
  | Dependencies | None | Uses only existing sheep.content_generators module and Python standard library (pathlib); no new external dependencies |

  ## Dependencies

  - **Git repository**: Feature branch feat/118-markdown-file-creation-4bc3d9 must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Python modules**: pathlib (standard library), sheep.content_generators, structlog (all existing)
  - **Content generators module**: sheep.content_generators must be importable with functions: generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - **Established pattern**: 117+ test files provide clear precedent for content format and file structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits to work
  - **LLM provider**: CrewAI must be configured with valid API key for selected LLM provider (OpenAI, Anthropic, Google, etc.)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~5 minutes (call content_generators.generate_markdown_content() and write_markdown_file())
  - **Validation**: ~2-3 minutes (verify markdown structure, UTF-8 encoding, LF line endings using validate_markdown_file())
  - **Git workflow**: ~2-5 minutes (stage file using commit_markdown_file(), push using push_markdown_file())
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 117+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences prose)
  - Helper functions in sheep.content_generators.py handle all complexity (content generation, validation, git operations)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-117) demonstrate efficient implementation of identical features in 10-15 minutes
  - Minimal integration risk: isolated file creation, no cross-module dependencies beyond content_generators

  ---

  _Requirements phase complete — ready for implementation_
