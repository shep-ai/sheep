content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (test-zscez5.md)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  117+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is a continuation of the markdown-file-creation pattern established in features 069-117,
  with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 117+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into modules:
    - agents/: CrewAI agent definitions (general_agents.py, code_agents.py)
    - features/: Feature implementation modules (feature_101_markdown_file_creation.py, etc.)
    - flows/: Workflow orchestration (code_implementation.py, chat.py)
    - config/: Configuration management (settings.py, llm.py)
    - observability/: Logging and monitoring (langfuse_client.py, logging.py)
    - content_generators.py: Utilities for content generation and git operations
    - tools/: Git integration tools (GitCommitTool, GitPushTool)
  - **specs/**: Feature specification directory with subdirectories for each feature (specs/118-markdown-file-creation-4bc3d9/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies, build tools)
  - **.github/**: GitHub workflows and CI/CD configuration
  - **docker-compose.yml, Dockerfile**: Container configuration for deployment

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as demonstration output.

  ### Architecture Patterns

  **Established File Creation Pattern** (117+ precedents):
  - Content generation using sheep.content_generators.generate_markdown_content() (calls LLM via CrewAI)
  - File writing using sheep.content_generators.write_markdown_file() (uses pathlib.Path)
  - File validation using sheep.content_generators.validate_markdown_file()
  - Git operations using GitCommitTool and GitPushTool from sheep.tools
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings, file size typically 400-600 bytes

  **Git Workflow Pattern**:
  - Create feature branch (pre-created as feat/118-markdown-file-creation-4bc3d9)
  - Generate/create content and write to file
  - Stage with git add using GitCommitTool
  - Commit with conventional commit format: `feat(118): create markdown file test-zscez5.md with prose content`
  - Push to feature branch using GitPushTool with upstream tracking
  - No modifications to source code or configuration files

  **Logging and Observability Pattern**:
  - Structured logging using structlog with module-level loggers
  - Each function logs entry, debug steps, and completion
  - Error logging with descriptive messages
  - Integration with Langfuse for execution tracing (optional)

  **LLM Content Generation Pattern**:
  - Uses CrewAI LLM framework (configured in config/llm.py)
  - Prompts specify format requirements (H1 heading, blank line, 2-3 sentences)
  - Response validation checks for minimum content, H1 prefix, sentence count
  - Supports multiple LLM providers (OpenAI, Anthropic Claude, Google Gemini)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for safe file I/O (Path.write_text(), Path.exists(), Path.stat())
  - **structlog**: Structured logging library for observable execution (see observability/logging.py)
  - **CrewAI**: LLM orchestration framework enabling multi-model support
  - **Git**: Version control with subprocess-based git command execution
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zscez5.md) to existing collection of 117+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-117; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or modify any source code beyond importing existing helper functions from content_generators |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Tests Directory | None | No changes to existing tests; no new test files required for this feature |
  | Dependencies | None | Uses only existing sheep.content_generators module and Python standard library (pathlib); no new external dependencies |

  ## Dependencies

  - **Git repository**: Feature branch feat/118-markdown-file-creation-4bc3d9 must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Python modules**: pathlib (standard library), sheep.content_generators, structlog
  - **Content generators**: sheep.content_generators module must be importable (provides: generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file)
  - **Established pattern**: 117+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **LLM provider**: CrewAI must be configured with valid API key for selected LLM provider (OpenAI, Anthropic, Google, etc.)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File generation**: ~5 minutes (call content_generators.generate_markdown_content() and write_markdown_file())
  - **Validation**: ~2-3 minutes (verify markdown structure, UTF-8 encoding, LF line endings using validate_markdown_file())
  - **Git workflow**: ~2-5 minutes (stage file using commit_markdown_file(), push using push_markdown_file())
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 117+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences prose)
  - Helper functions in sheep.content_generators.py handle all complexity (content generation, validation, git operations)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-117) demonstrate efficient implementation of identical features in 10-15 minutes
  - Minimal integration risk: isolated file creation, no cross-module dependencies beyond content_generators

  ## Product Questions & Decisions

  **Status: No open product questions.** This feature has zero ambiguous decisions:

  - **Prose topic**: Explicitly flexible per user query (\"about anything\") — LLM generates appropriate content
  - **Sentence count**: Defined as \"2-3 sentences\" — content_generators validates this constraint
  - **Prose tone/style**: Not constrained — LLM generation handles variety
  - **Implementation method**: Flexible — content_generators module provides complete orchestration
  - **File location**: Repository root only (safe by design in content_generators.py with path validation)

  The feature follows an established, proven pattern from 117+ identical test files (features 069-117).
  All requirements are clearly specified and measurable. No stakeholder input needed before implementation.

