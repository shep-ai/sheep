content: |
  ## Architecture Overview

  Feature 118 is a minimal wrapper around the existing `content_generators.create_markdown_file()`
  orchestrator function. This function has been battle-tested across 100+ prior features (69-117)
  and encapsulates the complete workflow:

  1. **Content Generation** — Uses CrewAI to generate markdown H1 title + 2-3 sentences prose
  2. **File Writing** — Writes to disk with UTF-8 encoding, no BOM, LF line endings via pathlib
  3. **Validation** — Verifies markdown structure, encoding, line endings, and file size
  4. **Git Staging** — Stages file using git add command
  5. **Git Commit** — Creates commit with conventional format message
  6. **Git Push** — Pushes to feature branch with upstream tracking enabled
  7. **Structured Logging** — Logs all operations via structlog for observability

  The feature module is intentionally minimal: import content_generators, call
  create_markdown_file() with filename and topic, return results dict. This approach
  eliminates code duplication and ensures consistency across all similar features.

  ## Key Design Decisions

  ### 1. Reuse content_generators Orchestrator

  **Chosen:** Call `create_markdown_file()` function

  **Why:** This function has been proven across 100+ identical features. It encapsulates
  all required functionality (content generation, file I/O, validation, git operations,
  logging) in a single tested interface. Reusing it ensures consistency, reduces risk,
  and eliminates code duplication.

  **Alternatives Rejected:**
  - Custom implementation: would duplicate validated code, diverge from established pattern
  - Manual orchestration of individual functions: more error-prone, harder to maintain consistency

  ### 2. CrewAI for Content Generation

  **Chosen:** CrewAI framework with Claude (Anthropic) as primary provider

  **Why:** Already integrated project-wide (core dependency in pyproject.toml). Provides
  abstraction over multiple LLM providers, built-in retry logic, integration with Langfuse.
  Framework is configured via get_reasoning_llm() which content_generators uses.

  **Alternatives Rejected:**
  - Direct anthropic API calls: loses abstraction, harder to switch providers
  - Simple local prompt engineering: unreliable for prose generation

  ### 3. pathlib for File I/O

  **Chosen:** `pathlib.Path.write_text()` with UTF-8 encoding

  **Why:** Idiomatic Python standard library, safe encoding handling, automatic platform-appropriate
  newline conversion (LF on Unix). Consistent with content_generators implementation.

  **Alternatives Rejected:**
  - open() with manual encoding: more verbose, higher risk of encoding bugs

  ### 4. Conventional Commit Format

  **Chosen:** Exact format: "feat(118): create markdown file test-zscez5.md with prose content"

  **Why:** Consistent with 100+ prior features (69-117), follows Conventional Commits spec,
  parseable and predictable, includes feature number for traceability. Message is generated
  by content_generators.commit_markdown_file().

  **Alternatives Rejected:**
  - Topic-based or auto-generated format: less predictable, harder to standardize

  ### 5. Git Workflow: Staged Commit and Push

  **Chosen:** git add (staging) → commit with conventional message → push with upstream tracking

  **Why:** Follows git best practices, maintains explicit staging phase, enables CI/CD branch
  tracking. Consistent workflow across features 100-117.

  **Alternatives Rejected:**
  - Direct commit without staging: loses explicit staging phase
  - Push without upstream tracking: loses branch tracking for CI/CD

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Implementation)** executes first because:
  - Feature module is minimal (one orchestrator call) with zero dependencies
  - Rapid development cycle enables quick testing in Phase 2
  - Module is concrete before tests are written

  **Phase 2 (Testing & Validation)** follows implementation because:
  - Tests verify specific outputs from Phase 1 implementation
  - Tests are faster to write once implementation is concrete
  - Validation tests leverage utilities from content_generators (already tested)

  **Phase 3 (Integration)** comes last because:
  - Requires both implementation and test infrastructure from earlier phases
  - End-to-end test provides final verification of complete workflow
  - Captures full feature execution for debugging and traceability

  ### Why This Approach Succeeds

  This pattern is proven across 100+ prior features: minimal feature code (10-15 lines) +
  comprehensive test suite (validates all success criteria) + integration test (verifies
  end-to-end workflow). This approach ensures:

  1. **High Confidence** — Tests verify every success criterion from spec
  2. **Clear Traceability** — Tests map directly to requirements
  3. **Rapid Iteration** — Small feature module enables fast development cycles
  4. **Maintainability** — Reusing content_generators reduces code surface to maintain

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates off-topic or invalid content | Tests validate sentence count and structure; content_generators includes validation; fallback LLM providers available via CrewAI |
  | Git operations fail (auth, permissions) | Git pre-configured in CI environment; GitCommitTool/GitPushTool handle auth; tests verify git state after operations |
  | File encoding issues (BOM, CRLF) | pathlib.Path.write_text() handles encoding safely; tests verify UTF-8 without BOM; tests verify LF line endings |
  | File size outside spec range (300-800 bytes) | Tests verify file size; content_generators validates constraints |
  | Markdown structure invalid | content_generators.validate_markdown_file() is comprehensive; tests verify structure; CommonMark validation available |
  | Feature branch doesn't exist | Branch pre-created by test harness; git push with set_upstream=True handles tracking |
  | Logging/observability missing | Tests verify structured logging; CrewAI integrates with Langfuse for LLM tracing |

  ## Pattern Consistency

  This implementation strictly follows the established pattern from features 69-117:

  - **Import Pattern** — matches feature_116_markdown_file_creation.py
  - **Function Structure** — single main() or run() function that calls orchestrator
  - **Return Value** — dict with filepath, content, commit_message, push_result
  - **Logging** — structlog via _logger = get_logger(__name__)
  - **Error Handling** — propagates exceptions from content_generators
  - **Git Commit Message** — conventional format: "feat(XXX): create markdown file test-*.md with prose content"
  - **Test Organization** — separate file creation, encoding, git operation, and integration tests

  This consistency ensures the feature integrates seamlessly with existing codebase and
  CI/CD infrastructure.
