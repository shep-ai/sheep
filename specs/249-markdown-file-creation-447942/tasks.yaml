content: |
  ## Summary

  This feature implementation is broken into six tasks across two phases:

  **Phase 1: File Creation (Tasks 1-4)**
  - Verify environment and git configuration
  - Define prose content and markdown structure
  - Create file using pathlib with correct encoding/line endings
  - Validate markdown structure before pushing to git

  **Phase 2: Git Integration (Tasks 5-6)**
  - Stage and commit file with conventional commit message
  - Push commit to feature branch

  Each task includes TDD cycles (red/green/refactor) to ensure correctness and prevent regressions.
  Total estimated effort: 1.5 hours, aligned with the 'S' (small) size estimate of 10-15 minutes
  for actual implementation plus validation overhead.

  The implementation is straightforward and isolated, following the established pattern from
  200+ existing test files (features 069-248). No application logic dependencies, no external
  packages beyond Python standard library, and minimal complexity.

  ## Task Execution Order

  Tasks must be executed in dependency order:
  1. Task 1: Verify environment (no dependencies)
  2. Task 2: Define content (no dependencies, can run parallel with Task 1)
  3. Task 3: Create file (depends on Task 2)
  4. Task 4: Validate structure (depends on Task 3)
  5. Task 5: Stage and commit (depends on Task 4)
  6. Task 6: Push to remote (depends on Task 5)

  Critical path: Task 1 → Task 2 → Task 3 → Task 4 → Task 5 → Task 6 (sequential execution required)
