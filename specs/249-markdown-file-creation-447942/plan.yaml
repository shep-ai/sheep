content: |
  ## Architecture Overview

  This feature creates a test markdown file following the established pattern used in 200+ existing
  test files at the repository root. The implementation is straightforward and isolated:

  - **No application logic dependencies**: This is a test artifact generator, not an application feature.
  - **Standalone execution**: The feature operates independently without requiring Sheep framework infrastructure.
  - **Pattern consistency**: Implementation mirrors features 069-248, using identical techniques and structure.
  - **Minimal scope**: Single file creation (~500 bytes) with deterministic, well-understood content format.

  The codebase already contains 200+ test-*.md files at the repository root, providing clear precedent
  for content structure, formatting, and file organization. This feature adds one more test file following
  the exact same pattern.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path

  **Chosen:** `pathlib.Path` for file operations

  **Why:** pathlib is the modern Python standard (3.4+), automatically handles UTF-8 encoding and LF
  line endings on all platforms, already proven in 200+ existing test files, requires no external
  dependencies, and provides cleaner syntax than open() boilerplate. The Path.write_text() method
  handles encoding and line endings correctly by default.

  **Alternative rejected:** subprocess shell execution (security risk, slower) and open() with manual
  handling (requires boilerplate, less Pythonic).

  ### 2. Git Operations: subprocess.run() with shell=False

  **Chosen:** subprocess.run() with command as list and shell=False

  **Why:** Prevents command injection vulnerabilities, provides fail-fast behavior with check=True,
  offers transparent command execution for security auditing, requires no external dependencies beyond
  Python standard library, and is already used in prior feature implementations (e.g., feature 211).

  **Alternative rejected:** GitPython library (adds unnecessary external dependency, overkill for
  simple add/commit/push) and shell execution (security risk, less reliable error handling).

  ### 3. Error Handling: Basic try/except for git operations

  **Chosen:** Minimal error handling focused only on git operations with fail-fast principle

  **Why:** File creation via pathlib has near-zero failure probability and requires no recovery logic.
  Git operations (add, commit, push) can fail from external causes (authentication, network, branch
  issues) and must report failures clearly for operator debugging. Fail-fast principle (stop at first
  error, don't retry) is appropriate because no graceful fallback exists for git push failures.

  **Alternative rejected:** No error handling (provides no debugging information, unacceptable for
  automation) and comprehensive error handling with retries (over-engineers a 'small' feature, masks
  root causes that should fail visibly).

  ### 4. Content: Hardcoded Prose

  **Chosen:** Hardcoded prose content with human-selected topic

  **Why:** All 200+ existing test files contain fixed, specific prose rather than templates or generated
  content. Features 069-248 follow this pattern. Hardcoded content is deterministic, requires no external
  dependencies, and is trivial to implement. The implementer chooses any coherent topic and writes 2-3
  sentences.

  **Alternative rejected:** Templated or generated content (rejected by specification after analysis
  of existing 200+ files which all use fixed prose).

  ### 5. Implementation Scope: Standalone Python Script

  **Chosen:** Standalone Python script executable from command line

  **Why:** This feature is a test artifact with no dependencies on application source code (/src/sheep/).
  It needs to be portable and executable without Sheep framework infrastructure (logging, config,
  dependency injection). Existing features (248, 247, 246) are standalone implementations. No need for
  application framework overhead.

  **Alternative rejected:** Integrated Sheep feature module (adds coupling, unnecessary infrastructure)
  and shell scripts (less portable, harder to version control).

  ## Implementation Strategy

  **Phase 1: File Creation**
  - Verify feature branch and git configuration
  - Define prose content (topic and 2-3 sentences) and markdown title
  - Create file at repository root (test-lwvxya.md) using pathlib.Path.write_text()
  - Validate basic markdown structure (H1 heading present, blank line, prose exists)

  **Phase 2: Git Integration**
  - Stage file with git add using subprocess.run()
  - Commit file with conventional commit message using subprocess.run()
  - Push commit to feature branch using subprocess.run() with -u origin HEAD
  - Handle any git operation errors with clear failure reporting

  **Rationale for phase ordering:**
  1. Environment verification (Phase 1, Task 1) prevents later git operation failures
  2. File creation comes before git operations because git operations depend on the file existing
  3. Validation after file creation ensures structure is correct before git integration
  4. Git integration (stage → commit → push) must happen in order; later operations depend on earlier ones

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists at test-lwvxya.md | Filename is unique per spec; pathlib will overwrite if file exists (idempotent). No risk of data loss since this is a test artifact. |
  | Git credentials not configured | Feature assumes git credentials/SSH keys are already set up at system level (GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, ssh-agent). Document this assumption in task 1. |
  | Incorrect line endings on Windows | pathlib.Path.write_text() uses LF by default on all platforms (Python 3.11+). No platform-specific handling needed. |
  | Git push fails due to network issues | subprocess.run() with check=True will raise CalledProcessError; catch and report with clear error message. Operator can retry manually. |
  | Encoding issues with prose content | Using pathlib.Path.write_text(..., encoding=\"utf-8\") guarantees UTF-8 encoding. No BOM added by pathlib. |
  | Branch does not exist or is wrong branch | Feature assumes feat/249-markdown-file-creation-447942 already exists and is checked out. Verify in Task 1. |
