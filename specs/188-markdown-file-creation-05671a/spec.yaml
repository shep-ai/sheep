content: |
  ## Problem Statement

  Create a markdown file named test-66bea4.md at the repository root with a title (H1 heading) and 2-3 sentences of prose content about any topic.
  This feature is part of a recurring pattern (features 1-188) that tests the ability to systematically create and manage markdown files within
  the Sheep agentic platform using established conventions.

  Implement as a feature module (feature_188_markdown_file_creation.py) that follows the pattern established by features 101-187,
  including structured logging, type hints, error handling, and standalone execution support.

  ## Success Criteria

  - [ ] File test-66bea4.md exists at repository root
  - [ ] File contains an H1 heading (markdown format: # Title)
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File uses UTF-8 encoding (verified via validation)
  - [ ] File uses Unix LF line endings, not CRLF (verified via validation)
  - [ ] File passes all validation checks from content_generators.validate_markdown_file()
  - [ ] File is staged and committed to git with conventional commit message
  - [ ] Commit message follows conventional commits format (e.g., "feat: create test-66bea4.md")
  - [ ] File is pushed to remote origin on the feature branch
  - [ ] Module feature_188_markdown_file_creation.py exists at src/sheep/features/
  - [ ] Module exports function create_feature_188_markdown_file(repo_path=None) -> dict
  - [ ] Function returns dict with keys: filepath, content, commit_message, push_result
  - [ ] Function can be executed standalone via python -m sheep.features.feature_188_markdown_file_creation
  - [ ] Structured logs are generated for all major orchestration steps (generation, write, validation, commit, push)
  - [ ] Module approximately 100 lines of code (following feature 101-187 pattern)
  - [ ] All code passes ruff linter and mypy type checking
  - [ ] Function accepts optional repo_path parameter (defaults to current working directory)

  ## Functional Requirements

  - **FR-1**: Create markdown file at path {repo_root}/test-66bea4.md
  - **FR-2**: File must contain H1 heading generated via Claude API that is thematically related to prose content
  - **FR-3**: File must contain 2-3 sentences of prose content generated via Claude API
  - **FR-4**: Use content_generators.generate_markdown_content() to generate H1 + prose
  - **FR-5**: Use content_generators.write_markdown_file() to write content to disk with UTF-8 encoding and Unix LF line endings
  - **FR-6**: Use content_generators.validate_markdown_file() to verify file structure, encoding, and line endings
  - **FR-7**: Use content_generators.commit_markdown_file() to stage and commit with conventional commit message
  - **FR-8**: Use content_generators.push_markdown_file() to push file to remote origin branch
  - **FR-9**: Create feature module src/sheep/features/feature_188_markdown_file_creation.py
  - **FR-10**: Export function create_feature_188_markdown_file(repo_path: str | None = None) -> dict
  - **FR-11**: Return dict containing keys: filepath (str), content (str), commit_message (str), push_result (dict)
  - **FR-12**: Function must accept optional repo_path parameter; if None, use current working directory
  - **FR-13**: Include __main__ block to allow standalone execution: python -m sheep.features.feature_188_markdown_file_creation
  - **FR-14**: Use structured logging via sheep.observability.logging.get_logger(__name__)
  - **FR-15**: Log INFO-level messages for major orchestration steps: generation start/complete, write complete, validation complete, commit complete, push complete
  - **FR-16**: Log DEBUG-level messages for detailed information (e.g., file paths, validation details, commit hashes)
  - **FR-17**: Log error context and exceptions if any step fails

  ## Non-Functional Requirements

  - **NFR-1**: Code Quality - Follow feature module pattern established by features 101-187 (file location, function signature, return format, structure)
  - **NFR-2**: Code Size - Approximately 100 lines of code for feature module (following 101-187 baseline)
  - **NFR-3**: Code Reuse - Use 100% of existing content_generators.py utilities; no duplicate implementation
  - **NFR-4**: Type Hints - All function parameters and return values must have type annotations compatible with mypy
  - **NFR-5**: Logging - Use structlog for structured logging; support both console output (INFO+) and structured log capture
  - **NFR-6**: Error Handling - Return error details in response dict rather than raising exceptions; allow graceful degradation
  - **NFR-7**: Performance - Complete full pipeline (generate + write + validate + commit + push) in under 30 seconds
  - **NFR-8**: Git Operations - Assume authenticated git repo with configured remote origin; handle git errors gracefully
  - **NFR-9**: Dependencies - Use only libraries already listed in pyproject.toml; no new external dependencies
  - **NFR-10**: Formatting - Code must pass ruff linter (formatting and import sorting) without modifications
  - **NFR-11**: Observability - Langfuse integration for LLM call tracking (automatic via content_generators.py)
  - **NFR-12**: Cross-Platform - Use pathlib.Path for all file operations (cross-platform compatibility)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | --- | --------- | ------------------- | ----------- |
  | 1 | Should the H1 heading be thematically related to the prose content? | **Yes, thematically related** | Produces more professional, coherent output. Matches pattern established in features 101-187. Content generators already support coordinated generation via Claude API. |
  | 2 | Should console logging output INFO-level messages during standalone execution? | **Yes, output INFO and above** | Provides user feedback during testing, aids debugging, follows standard CLI practice. Structured logs still captured in observability system. Consistent with best practices. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | File test-66bea4.md will be created at /repo/test-66bea4.md (alongside 187 existing test-*.md files) |
  | src/sheep/features/ | Medium | New feature module feature_188_markdown_file_creation.py will be added following feature_101-187 pattern |
  | Git history | High | Will create new commit and push, adding to feature branch history |
  | File system I/O | Low | Uses existing pathlib utilities; no new infrastructure needed |
  | Content generation | Low | Reuses existing generate_markdown_content() function from content_generators.py |
  | Git operations | Low | Reuses existing commit/push utilities from content_generators.py |
  | Observability | Low | Uses existing structlog logger; no new observability infrastructure needed |

  ## Dependencies

  **Code Dependencies:**
  - `sheep.content_generators`: Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.observability.logging`: get_logger() for structured logging
  - `pathlib.Path`: Standard library for cross-platform file operations
  - `typing`: Standard library for type hints (dict, str, Optional)

  **External Dependencies:**
  - CrewAI LLM framework (>=0.86.0) and Claude API (for content generation)
  - GitPython library (>=3.1.0, already present as dependency)
  - Git command-line tool (required by GitPython for git operations)

  **Infrastructure Dependencies:**
  - Authenticated git repository with configured remote origin
  - Claude API credentials (via ANTHROPIC_API_KEY in environment)
  - Langfuse integration (optional, configured via LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY)

  **No New Dependencies Required**
  - All required libraries already listed in pyproject.toml
  - All utilities already exist and are tested in content_generators.py
  - Pattern established by 187 prior features provides proven reference implementations

  ## Size Estimate

  **S** — 30-60 minutes of work

  **Justification:**
  - Established pattern with 187 prior implementations to reference (lowest friction path)
  - Reusable infrastructure (content_generators.py utilities already exist, tested, and documented)
  - Minimal code: ~100 lines for feature module following established pattern
  - No new dependencies, architecture changes, or complex logic required
  - Git operations well-tested and reliable across all prior features
  - Validation logic pre-built in content_generators.py
  - No edge cases or special handling needed (follows standard pattern)
  - Product questions resolved and documented for implementer guidance

  **Task Breakdown (estimated 40-50 minutes):**
  - 10 min: Review feature_186-187 implementations and understand established pattern
  - 15 min: Implement feature_188_markdown_file_creation.py module with logging and type hints
  - 10 min: Test locally (execute function, verify file properties, validate output)
  - 10 min: Verify code quality (ruff, mypy) and commit to feature branch
  - 5 min: Push to remote and verify branch state

  ---

  _Requirements phase completed with functional/non-functional requirements, success criteria, and product questions resolved_
