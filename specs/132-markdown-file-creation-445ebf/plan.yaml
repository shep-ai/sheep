content: |
  ## Architecture Overview

  Feature 132 is a straightforward file creation and git workflow automation task that follows
  the established pattern used in features 125-131. All previous features in this series have been
  successfully completed and merged, confirming the pattern's viability and reliability.

  The implementation consists of three core components:
  1. **File Creation** - Using Python's pathlib.Path.write_text() with explicit UTF-8 encoding and Unix LF line endings
  2. **File Validation** - Comprehensive validation of encoding, structure, line endings, and file size
  3. **Git Integration** - Sequential git operations (add → commit → push) using subprocess.run()

  No architectural changes or code modifications are required. The feature creates a single markdown
  file in the repository root and executes standard git commands. All implementation uses Python's
  built-in standard library (pathlib, subprocess) with no external dependencies.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()
  **Decision:** Use pathlib.Path().write_text() with explicit encoding and newline parameters.

  **Alternatives considered:**
  - Built-in open() function - more verbose, requires context managers
  - os.path with low-level file I/O - lower-level abstraction, more error-prone
  - Template or external library - unnecessary dependency

  **Rationale:** pathlib is the modern Python 3 standard (PEP 519) and provides a clean, object-oriented
  API. The write_text(content, encoding="utf-8", newline="\n") method directly satisfies requirements:
  - encoding="utf-8" ensures UTF-8 without BOM (Python 3's UTF-8 implementation adds no BOM when explicitly specified)
  - newline="\n" forces Unix LF line endings regardless of platform
  - This approach is used consistently in features 070, 089, 105, confirming it's the established codebase pattern

  ### 2. Content Generation: Hardcoded Prose
  **Decision:** Use hardcoded prose content about generic topics (e.g., "The Power of Persistence").

  **Alternatives considered:**
  - Random text generation library (faker, lorem-ipsum) - introduces external dependency
  - LLM-based generation - excessive complexity, external API dependency
  - Template system with variables - unnecessary abstraction

  **Rationale:** This is explicitly a "platform validation test" focused on automation capability, not
  content generation quality. Features 125-131 all use simple, hardcoded prose. This approach has zero
  external dependencies and allows each test file to have unique, human-readable prose. The existing
  130+ test files in the repository all follow this pattern, confirming it's the established convention.

  ### 3. Git Operations: subprocess.run()
  **Decision:** Use subprocess.run() with check=True and capture_output=True for git commands.

  **Alternatives considered:**
  - GitPython library - introduces external dependency, unnecessary complexity
  - os.system() with shell=True - security risk (command injection), less reliable
  - Heavy porcelain libraries - overkill for simple linear workflow

  **Rationale:** The git workflow is simple and linear: add → commit → push. subprocess.run() provides
  reliable error handling without external dependencies. Using list-style arguments (not shell=True)
  prevents command injection. This matches existing implementations in the codebase and provides clear
  error messages when git operations fail.

  ### 4. Encoding and Line Endings: Explicit Parameters
  **Decision:** Use encoding="utf-8" and newline="\n" parameters in write_text().

  **Rationale:** Explicit parameters ensure UTF-8 without BOM (Python 3 default) and Unix LF line endings
  (not CRLF). This is the cleanest approach and matches all existing implementations in the codebase.
  No additional libraries or validation logic is needed; pathlib handles this automatically.

  ### 5. Commit Message Format: Conventional Commits
  **Decision:** Use conventional commit format: feat(132): Create markdown file test-fz0c6t.md

  **Rationale:** Conventional Commits is the established standard across the Sheep codebase. All related
  features (131, 130, 129, etc.) follow this pattern. The format provides semantic versioning information
  and clear association with feature number, enabling automated tooling and clear commit history navigation.

  ### 6. File Validation: Comprehensive Multi-Layer Approach
  **Decision:** Validate structure, encoding, line endings, and file size after creation.

  **Rationale:** Comprehensive validation (used in features 070, 089, 105) ensures the created file meets
  all requirements and catches issues early. Validation checks:
  - UTF-8 encoding and no BOM via binary read
  - Unix LF line endings (not CRLF)
  - Markdown structure (H1 heading, blank line, prose)
  - File size in reasonable range (400-600 bytes guideline)

  The overhead is minimal (read file twice) for significant reliability gain.

  ## Implementation Strategy

  The implementation follows a linear, sequential approach with two main phases:

  **Phase 1: File Creation & Validation**
  - Create the markdown file with proper structure (H1 heading + blank line + prose)
  - Use pathlib.Path.write_text() with explicit UTF-8 encoding and Unix LF line endings
  - Validate the created file meets all requirements (encoding, structure, line endings, size)
  - Exit with error if file creation or validation fails

  **Phase 2: Git Workflow Integration**
  - Stage the file: git add test-fz0c6t.md
  - Create commit: git commit -m "feat(132): Create markdown file test-fz0c6t.md"
  - Push to remote: git push -u origin HEAD
  - Exit with error if any git operation fails

  No parallelization is possible; operations must be sequential (file must exist before validation,
  file must be created before staging, staging must complete before committing, etc.).

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File already exists | Low | High | Check with path.exists() before creating; raise clear error if file exists |
  | Permission denied | Low | High | Catch PermissionError and provide descriptive error message with full context |
  | UTF-8 encoding fails | Very Low | High | Explicit encoding="utf-8" parameter ensures UTF-8; validate with binary read |
  | CRLF line endings | Low | Medium | Explicit newline="\n" parameter forces Unix LF; validate after creation |
  | Git not in PATH | Low | High | subprocess.CalledProcessError with clear message indicating git is missing |
  | Git push fails | Medium | High | Capture return code and error output; provide specific error context to user |
  | Branch tracking not set | Low | Medium | Use -u flag with git push to establish upstream tracking |
  | File size invalid | Low | Low | Validate file size is in expected range (400-600 bytes); alert if outside range |
