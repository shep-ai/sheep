content: |
  ## Task Breakdown Summary

  Feature 132 is implemented across 7 tasks in 2 phases:

  **Phase 1: File Creation & Validation (Tasks 1-4)**
  - Task 1 creates the markdown file with proper structure (H1 + blank line + prose)
  - Tasks 2-4 validate the file meets all requirements (encoding, structure, line endings, size)
  - Each validation task is independent and can be implemented in parallel, but all depend on Task 1

  **Phase 2: Git Workflow Integration (Tasks 5-7)**
  - Task 5 stages the file with git add
  - Task 6 creates a conventional commit
  - Task 7 pushes to remote with upstream tracking
  - These tasks are strictly sequential: each depends on the previous

  **Total Effort:** 2 hours 35 minutes

  ## TDD Approach

  Each task follows the red-green-refactor cycle:
  1. **RED** — Write test assertions that fail initially
  2. **GREEN** — Implement minimal code to make tests pass
  3. **REFACTOR** — Clean up, extract helpers, improve naming and error messages

  File creation tasks (1-4) test file content, encoding, structure, and properties.
  Git workflow tasks (5-7) test subprocess execution and git command success.
  All error handling is explicit with descriptive messages to aid debugging.

  ## Implementation Notes

  - All code uses Python standard library only (pathlib, subprocess, no external dependencies)
  - File operations use explicit encoding="utf-8" and newline="\n" parameters
  - Git operations use subprocess.run() with list-style arguments (safe from injection)
  - Validation is comprehensive but lightweight (minimal performance overhead)
  - Error messages are descriptive and provide context for debugging
  - No changes to existing code or architecture required
