content: |
  ## Problem Statement

  Create a single markdown file named test-fz0c6t.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as test iteration 132 of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root directory**: Contains the main README.md, 130+ test markdown files (test-*.md pattern), state machine diagrams, design pattern documentation, and utility scripts
  - **specs/**: Contains 131+ feature specifications in YAML format, organized by feature number (specs/006-*, specs/007-*, ... specs/132-*)
  - **src/sheep/**: Core platform code with agents, flows, configuration, and tools (referenced in README)
  - **.github/workflows/**: CI/CD pipelines with dummy build and test steps
  - **Dockerfile**: Container definition for the platform
  - **.claude/**: Claude Code configuration directory

  The repository follows a spec-first development model where each feature is defined in a YAML specification file before implementation begins.

  ### Architecture Patterns

  1. **Spec-First Development**: Features are defined in `specs/{number}-{name}/spec.yaml` before implementation
  2. **Test-Driven Approach**: Features 125-132 are identical file creation tasks used to validate platform reliability and consistency
  3. **Modular Agent Architecture**: The Sheep platform uses specialized agents for distinct phases (Research, Implementation, Review)
  4. **Git Workflow**: All changes follow conventional commits (feat(#): description) and are pushed to feature branches
  5. **File Pattern Consistency**: Existing test-*.md files demonstrate a consistent format: H1 heading followed by blank line, then 2-3 sentences of prose

  ### Relevant Technologies

  - **Python**: File I/O and utility scripting (pathlib, built-in file operations)
  - **Git**: Version control, branching, committing, and pushing
  - **Markdown**: Simple structured text format for documentation
  - **GitHub Actions**: CI/CD automation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-fz0c6t.md) will be created in the repository root, following the pattern of 131+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting and encoding |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git commands (add, commit, push)
  4. **Content Generation** - Simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-131, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 7+ times in preceding features (125-131)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-131) were completed in a single commit with minimal complexity
