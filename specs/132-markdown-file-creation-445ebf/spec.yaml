content: |
  ## Problem Statement

  Create a single markdown file named test-fz0c6t.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content, then execute the complete git workflow (add/commit/push) to integrate this file into the feature branch. This is test iteration 132 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks.

  ## Success Criteria

  - [ ] File test-fz0c6t.md exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (single `#` prefix) as the title
  - [ ] File contains 2-3 sentences of prose content separated from the heading by a blank line
  - [ ] File follows the established format: `# Title\n\nSentence 1. Sentence 2. Sentence 3.`
  - [ ] File is encoded in UTF-8 with no BOM
  - [ ] File has been staged with `git add test-fz0c6t.md`
  - [ ] Git commit created with conventional commit message format: `feat(132): Create markdown file test-fz0c6t.md`
  - [ ] Changes pushed to the feature branch feat/132-markdown-file-creation-445ebf
  - [ ] No other files have been modified or created
  - [ ] Pull request created and merged (or in progress) following the pattern of related features 131-127

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-fz0c6t.md` in the repository root (same directory level as README.md and other test-*.md files)
  - **FR-2**: File must contain an H1 markdown heading as the primary title (using `#` syntax)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading
  - **FR-4**: Prose content must be separated from the heading by a single blank line
  - **FR-5**: Stage the new file with `git add test-fz0c6t.md`
  - **FR-6**: Create a git commit with a conventional commit message following the pattern `feat(132): Create markdown file test-fz0c6t.md`
  - **FR-7**: Push the commit to the remote feature branch `feat/132-markdown-file-creation-445ebf` with `git push -u origin feat/132-markdown-file-creation-445ebf` (or equivalent if already tracking)
  - **FR-8**: File content must not be empty and must contain readable prose (no null bytes, invalid UTF-8, or binary data)

  ## Non-Functional Requirements

  - **NFR-1**: File must be valid UTF-8 encoded text without a byte order mark (BOM)
  - **NFR-2**: File formatting must match the established pattern used in existing test-*.md files (130+ existing test files in repository root)
  - **NFR-3**: Git workflow must follow Sheep platform conventions for conventional commits (feat(#): description format)
  - **NFR-4**: Implementation must not introduce changes to any other files or directories (no side effects)
  - **NFR-5**: Git operations must complete successfully without merge conflicts or authentication errors
  - **NFR-6**: File should be created and committed within a single feature branch lifecycle (no additional branches or rebases needed)
  - **NFR-7**: No code, configuration, or architecture changes required; task is purely file creation and git workflow execution

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What content should the prose sentences describe? | Random/generic placeholder text | Test focus is platform automation validation, not content quality. Matches pattern of features 125-131. |
  | 2 | Should git workflow (add/commit/push) be included? | Complete workflow including push to remote | Spec explicitly mentions "standard git workflows"; related features show merged PRs. Consistent with established series pattern. |
  | 3 | What markdown formatting structure should be used? | Structured format (heading + blank line + content) | Matches 130+ existing test-*.md files in codebase. Ensures consistency and readability. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-fz0c6t.md) will be created in the repository root, following the pattern of 131+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting and encoding |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git commands (add, commit, push)
  4. **Content Generation** - Simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-131, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 7+ times in preceding features (125-131)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-131) were completed in a single commit with minimal complexity
