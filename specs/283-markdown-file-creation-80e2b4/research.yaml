# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research — Complete
  - **Updated:** 2026-03-30
  - **Conclusion:** Implementation ready to proceed with established pattern from 280+ prior features

  ## Executive Summary

  Feature 283 creates a single markdown file (`test-gqvdp6.md`) with an H1 heading and 2-3 sentences of
  auto-generated prose. This is a straightforward feature that follows the established pattern used by
  280+ prior features in the repository. All required functionality exists in the proven orchestration
  function `create_markdown_file()` in `src/sheep/content_generators.py`.

  **Key Findings:**
  1. Orchestration function is feature-complete and battle-tested across 280+ features
  2. No core module modifications needed
  3. Simple wrapper script + comprehensive tests required
  4. All technical decisions are already resolved in the spec
  5. Estimated implementation time: 30-60 minutes

  ## Technology Decisions

  ### 1. Content Generation — Orchestration Function

  **Decision:** Use existing `generate_markdown_content()` from `src/sheep/content_generators.py`

  **Why this approach:**
  The orchestration function provides:
  - Proven generation pipeline used by 280+ features
  - Built-in validation for H1 heading, 2-3 sentence count, minimum length
  - Proper error handling and descriptive error messages
  - Integration with CrewAI LLM framework and Claude API
  - Temperature control (0.2 for reasoning mode)

  **Validation included in orchestration:**
  - Checks content starts with `# ` (H1 heading)
  - Counts periods to validate 2-3 sentences
  - Enforces minimum 50-character content length
  - Adds trailing newline if missing

  **Why not alternatives:**
  - Custom implementation duplicates proven code (violates DRY principle)
  - Direct API calls skip validation and error handling
  - Less maintainable and inconsistent with 280+ features

  ### 2. File I/O and Encoding

  **Decision:** Use `write_markdown_file()` with UTF-8 encoding (no BOM, Unix LF)

  **Why this approach:**
  - pathlib for cross-platform path handling
  - UTF-8 encoding with no BOM (enforces NFR-1)
  - Unix LF line endings on all platforms (enforces NFR-2)
  - Validates filename for path traversal prevention
  - Verifies file creation and non-empty status

  **File size achieved:** Automatically 400-600 bytes through:
  - H1 heading: ~20-30 bytes
  - Blank line: 1 byte
  - 2-3 sentences: ~350-550 bytes
  - Total with newlines: ~400-600 bytes (validated by orchestration)

  **Why not alternatives:**
  - Platform-default encoding causes CRLF on Windows (breaks NFR-2)
  - Manual encoding handling duplicates existing code
  - Standard Python open() less maintainable than pathlib

  ### 3. File Validation Strategy

  **Decision:** Use comprehensive `validate_markdown_file()` function

  **Validation layers:**
  1. **Encoding:** Checks UTF-8 without BOM
  2. **Line endings:** Rejects CRLF, requires LF
  3. **Structure:** H1 heading on line 1, blank line on line 2
  4. **Content:** Exactly 2-3 sentences (period-delimited)
  5. **Trailing newline:** File must end with \n
  6. **Implicit file size:** Sentence count ensures 400-600 byte range

  **Error messages are clear:**
  - "File has UTF-8 BOM (should not be present)"
  - "File uses CRLF line endings (should use LF)"
  - "Content must have 2-3 sentences, found X"

  **Why not alternatives:**
  - No validation risks corrupted files entering repository
  - Basic checks miss encoding and line ending issues
  - Custom validation duplicates and maintains existing code

  ### 4. Git Integration

  **Decision:** Use `GitCommitTool` and `GitPushTool` with conventional commits

  **Conventional commit format:**
  ```
  feat(283): create markdown file test-gqvdp6.md with prose content
  ```

  **Git operations:**
  1. GitCommitTool: Stages and commits with add_all=True
  2. GitPushTool: Pushes with set_upstream=True for tracking
  3. Feature number (283) in scope ensures consistent history

  **Why not alternatives:**
  - Manual git commands duplicate existing tools
  - Simplified messages violate conventional commits convention
  - Existing tools provide robust error handling

  ### 5. Implementation Architecture

  **Wrapper script location:** `specs/283-markdown-file-creation-80e2b4/create_markdown_file.py`

  **Script structure:**
  ```python
  from sheep.content_generators import create_markdown_file

  def main():
      filename = "test-gqvdp6.md"
      feature_number = 283
      result = create_markdown_file(filename, feature_number=feature_number)
      # Display results
      return result
  ```

  **Why this approach:**
  - Minimal wrapper following established pattern
  - Feature-specific entry point
  - All actual logic in shared orchestration function
  - Used successfully by 280+ prior features

  **Why not alternatives:**
  - Inline implementation duplicates core logic
  - Complex wrappers add unnecessary maintenance burden
  - Existing orchestration is already feature-complete

  ### 6. Testing Strategy

  **Test structure (from prior features 282, 281, 280):**

  1. **Wrapper Script Tests**
     - Imports orchestration function correctly
     - Calls create_markdown_file with correct filename
     - Calls with correct feature_number=283
     - Returns result dictionary on success
     - Handles exceptions gracefully

  2. **Integration Tests**
     - create_markdown_file returns correct dictionary structure
     - File created at repository root
     - Commit message includes feature number and filename
     - Push result included in response

  3. **File Property Tests**
     - File uses UTF-8 encoding without BOM
     - File uses Unix LF line endings (no CRLF)
     - File has blank line separator
     - File ends with newline
     - File size 400-600 bytes (implicit through sentence count)

  4. **Content Tests**
     - H1 heading present on line 1
     - Blank line on line 2
     - Prose contains 2-3 sentences

  5. **Git Integration Tests**
     - GitCommitTool called with correct parameters
     - GitPushTool called with correct parameters
     - Commit message follows conventional format
     - Push result captured in response

  **Test implementation:**
  - Uses pytest fixtures for temp directories
  - Mocks LLM and git tools for isolation
  - Follows pattern from prior features

