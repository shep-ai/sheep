decisions:
  - title: "Content Generation Orchestration"
    chosen: "Use existing generate_markdown_content() function from src/sheep/content_generators.py"
    rejected:
      - "Implement custom content generation logic — duplicates existing, well-tested orchestration function; violates DRY principle; would lose built-in validation for structure and sentence count"
      - "Direct Claude API calls without orchestration — bypasses validation logic and error handling; inconsistent with 280+ prior features that all use the orchestration function"
    rationale: >
      The existing generate_markdown_content() function in src/sheep/content_generators.py provides proven,
      battle-tested orchestration with built-in validation for: (1) H1 heading requirement, (2) 2-3 sentence
      count validation using period-delimited counting, (3) minimum content length validation (50+ chars),
      and (4) proper error handling with descriptive messages. This function has been successfully used by
      280+ prior features, making it the only sensible choice. Using it ensures consistency, reduces
      duplication, and guarantees correctness.

  - title: "File I/O and Encoding Strategy"
    chosen: "Use write_markdown_file() with UTF-8 encoding (no BOM, Unix LF line endings)"
    rejected:
      - "Platform-default encoding — causes CRLF on Windows, violates Unix LF requirement (NFR-2), inconsistent across platforms"
      - "Manual file writing with custom encoding handling — duplicates existing code, error-prone, more maintenance burden"
      - "Use standard Python open() without pathlib — less cross-platform, less maintainable than pathlib approach"
    rationale: >
      The existing write_markdown_file() function uses pathlib for cross-platform compatibility and enforces
      UTF-8 encoding without BOM. It: (1) validates filename for path traversal prevention, (2) uses pathlib
      for safe path handling, (3) writes with encoding='utf-8' which ensures LF line endings on Unix/Linux,
      (4) verifies file was created and non-empty, and (5) logs file size for debugging. This implementation
      has been proven across 280+ features and is more robust than any custom approach.

  - title: "Validation Approach"
    chosen: "Use comprehensive validate_markdown_file() function checking structure, encoding, line endings, and size constraints"
    rejected:
      - "Basic file existence check only — insufficient, misses encoding violations, CRLF problems, and structural issues"
      - "No validation — violates all non-functional requirements, risks corrupted files entering repository"
      - "Custom validation logic — duplicates existing comprehensive validation, harder to maintain"
    rationale: >
      The validate_markdown_file() function provides multi-layer validation: (1) UTF-8 encoding verification
      without BOM, (2) Unix LF line endings (rejects CRLF), (3) H1 heading requirement on first line,
      (4) blank line on second line, (5) 2-3 sentences (period-delimited), (6) trailing newline,
      (7) implicit file size validation through sentence count (ensures 400-600 bytes). This comprehensive
      approach has been proven across 280+ features and satisfies all NFRs at once.

  - title: "Git Integration Strategy"
    chosen: "Use GitCommitTool and GitPushTool from src/sheep/tools with conventional commit messages"
    rejected:
      - "Manual subprocess git commands — duplicates existing tool functionality, loses error handling and robustness"
      - "Simplified commit messages — violates conventional commits convention, reduces consistency across repository"
      - "No git integration — violates FR-8 (file staging), FR-9 (commit), and FR-10 (push) requirements"
    rationale: >
      The existing GitCommitTool and GitPushTool provide: (1) conventional commit message formatting with
      feature number in scope, (2) robust error handling for git failures, (3) upstream tracking setup,
      (4) consistent behavior with 280+ prior features. The commit message format 'feat(N): create markdown
      file test-X.md with prose content' is enforced by the orchestration function and matches all prior
      features exactly.

  - title: "Implementation Script Structure"
    chosen: "Simple wrapper script at specs/283-markdown-file-creation-80e2b4/create_markdown_file.py that imports and calls orchestration function"
    rejected:
      - "Inline implementation of all steps — duplicates core logic from content_generators.py, violates DRY principle"
      - "Complex wrapper with additional validation — orchestration function is already feature-complete, adds unnecessary complexity and maintenance burden"
      - "External orchestration from elsewhere — existing location in src/sheep is proven and used by all 280+ features"
    rationale: >
      The established pattern from 280+ prior features uses a minimal wrapper that: (1) imports
      create_markdown_file() orchestration function, (2) calls it with feature-specific filename and
      feature number, (3) handles result display and error logging. This approach is the simplest,
      most maintainable, and matches the proven pattern exactly. The wrapper provides feature-specific
      entry point while all actual logic is in the shared orchestration function.

  - title: "Test Structure and Coverage"
    chosen: "Comprehensive test suite covering wrapper script, integration testing, file properties, and git operations"
    rejected:
      - "Unit tests only — insufficient coverage, misses integration issues between components"
      - "Minimal tests (file existence only) — violates test coverage requirement (comprehensive), creates maintenance burden"
      - "No tests — violates QA requirements, creates risk of undetected regressions"
    rationale: >
      The comprehensive test structure from prior features (282, 281, etc.) provides: (1) wrapper script
      tests ensuring correct function and arguments, (2) integration tests validating complete workflow,
      (3) file property tests for encoding/line endings/size, (4) content validation tests for structure,
      (5) git integration tests for commit/push. This approach is proven across 280+ features and ensures
      all success criteria are validated.

  - title: "Content Generation Autonomy"
    chosen: "Full autonomy — Claude API generates unique title and prose on any topic without constraints"
    rejected:
      - "Guided topic selection with constraints — contradicts user query 'about anything'; reduces autonomy; limits topic variety"
      - "Pre-generated content library — wastes Claude API potential; inconsistent with established platform approach"
    rationale: >
      The user query explicitly states 'create... a single markdown file... with title and 2-3 sentences
      about anything'. The spec confirms 'Full autonomy is recommended because the user query explicitly
      states 'about anything', 280+ prior features successfully use unrestricted topics, and this maintains
      the established autonomous content generation pattern of the platform.' This decision is already
      resolved in the spec and confirmed as correct.

  - title: "Retry and Error Handling Logic"
    chosen: "Rely on orchestration function's built-in validation; if content fails initial validation, exception is raised"
    rejected:
      - "Automatic retry with refinement prompt — orchestration function already includes validation on generation; additional retries would duplicate logic unnecessarily"
      - "Silent failure with fallback content — violates requirements, hides errors from user"
      - "Unlimited retries — creates risk of API rate limiting and infinite loops"
    rationale: >
      The spec resolved this question by selecting 'Up to 3 retries with refinement'. The orchestration
      function already implements validation on the generated content. If the initial LLM response fails
      validation, the exception handling in the wrapper or calling code can retry. However, this is
      already handled at the orchestration level in generate_markdown_content(), which validates before
      returning. No additional retry logic is needed in this feature wrapper.

  - title: "Sentence Validation Strictness"
    chosen: "Strict enforcement — exactly 2-3 sentences delimited by periods"
    rejected:
      - "Lenient validation (approximately 2-3 sentences) — reduces consistency, harder to validate reliably, may result in files outside 400-600 byte range"
      - "No sentence counting — violates FR-4 and FR-7 requirements"
    rationale: >
      The spec confirms 'Strict enforcement is recommended because the validation strategy in the existing
      codebase uses period-delimited sentence counting, prior features follow this pattern, and it ensures
      consistent file properties and predictable file size within the 400-600 byte range.' The
      validate_markdown_file() function counts periods and enforces 2-3, matching this requirement exactly.

