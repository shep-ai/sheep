content: |
  ## Problem Statement

  Create a single markdown file called `test-gqvdp6.md` in the repository root with an H1 heading as title and 2-3 sentences of prose content. This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established pattern and convention used throughout 280+ previous iterations in this repository.

  The file must conform to established markdown conventions and file requirements:
  - H1 heading as title (e.g., `# A Meaningful Title`)
  - Blank line separator between heading and prose
  - 2-3 sentences of prose content (counted by periods)
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - File size 400-600 bytes
  - Staged, committed, and pushed via Git with conventional commit format
  - Generated via Claude API for content autonomy

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is an agentic system for automated code implementation. The current branch focuses on a repetitive markdown file creation workflow. The repository is organized as follows:

  ```
  ├── src/sheep/
  │   ├── content_generators.py      # Core module with create_markdown_file() orchestration function
  │   ├── config/llm.py              # LLM configuration for Claude API access
  │   ├── tools/                     # Git and file operation tools
  │   ├── observability/logging.py   # Structured logging
  │   └── features/                  # Individual feature implementations
  ├── specs/                         # Feature specifications (280+ directories)
  │   ├── {number}-markdown-file-creation-{hash}/
  │   │   ├── spec.yaml              # Specification (this file)
  │   │   ├── create_markdown_file.py # Implementation script
  │   │   └── test_create_markdown_file.py # Test suite
  ├── [root markdown files]          # Target files created by features (test-*.md, etc.)
  ├── .github/                       # GitHub Actions workflows
  ├── README.md                      # Project documentation
  └── Dockerfile                     # Docker configuration
  ```

  ### Architecture Patterns

  1. **Content Generation Pipeline**: `content_generators.py` provides a unified workflow:
     - `generate_markdown_content()` - Claude API call to generate H1 title + 2-3 sentences
     - `write_markdown_file()` - Write to disk with UTF-8 encoding and Unix LF line endings
     - `validate_markdown_file()` - Comprehensive validation of structure and properties
     - `commit_markdown_file()` - Stage with git and commit with conventional message
     - `push_markdown_file()` - Push to remote with upstream tracking
     - `create_markdown_file()` - Main orchestration function combining all steps

  2. **Validation Strategy**: Multi-layer validation ensures file integrity:
     - Content validation: H1 heading required, blank line separator, 2-3 sentences (period-delimited)
     - Property validation: UTF-8 without BOM, Unix LF line endings, trailing newline
     - Size validation: 400-600 bytes (inclusive)
     - Git validation: File staged, committed, pushed successfully

  3. **Established Markdown Format**:
     ```
     # Title (H1 heading on line 1)
                                   (blank line on line 2)
     First sentence. Second sentence. Third sentence.  (lines 3+)
     ```

  4. **Conventional Commit Pattern**:
     - Message format: `feat(N): create markdown file test-X.md with title and prose content`
     - Example: `feat(283): create markdown file test-gqvdp6.md with title and prose content`
     - Enforces consistent git history across 280+ prior features

  5. **Content Generation Autonomy**:
     - Claude API generates unique title and prose on any topic ("about anything")
     - No human override of topic selection
     - Aligns with user query and 280+ prior features showing topic variance is acceptable

  ### Relevant Technologies

  1. **Python 3.6+**: Core implementation language with pathlib for path operations
  2. **Claude API (Anthropic SDK)**: LLM for autonomous content generation
  3. **Git**: Version control with conventional commit format and upstream tracking
  4. **Markdown**: Target format with H1 heading + blank line + prose structure
  5. **UTF-8 Encoding**: Character encoding requirement (no BOM, Unix LF line endings)
  6. **pytest**: Testing framework for validation and integration tests
  7. **GitHub Actions**: CI/CD pipeline that validates file structure, encoding, and git operations

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (new file) | High | Creation of test-gqvdp6.md file in repository root following established naming convention and markdown structure from 280+ prior features |
  | specs/283-markdown-file-creation-80e2b4/ | Medium | Implementation scripts (create_markdown_file.py, test_create_markdown_file.py) must be created following established pattern from 280+ prior features |
  | Git history | High | New commit will be added with conventional commit message feat(283): create test-gqvdp6.md... |
  | Remote repository | High | New file and commit will be pushed to origin, affecting remote branch state |
  | src/sheep/content_generators.py | None | Shared module already exists and supports this task; no modifications needed |
  | Project patterns | None | No changes to existing infrastructure; strictly follows established pattern from 280+ prior features |

  ## Dependencies

  **External Dependencies**:
  - Python 3.6+ (for pathlib and subprocess modules)
  - Git (for version control operations)
  - GitHub (for remote repository and CI/CD)
  - Anthropic SDK (for Claude API access)
  - pytest (for test execution)

  **Internal Dependencies**:
  - `src/sheep/content_generators.py` - Core orchestration module with `create_markdown_file()` function
  - Established markdown file pattern and conventions (proven across 280+ prior features)
  - Conventional commit message format already in use throughout repository
  - File structure template: H1 heading + blank line + prose content
  - UTF-8 encoding and LF line endings requirements

  **No Application Code Dependencies**:
  - This feature does not depend on any application source code changes
  - Uses only existing utilities and established patterns
  - No modifications needed to core Sheep platform

  ## Size Estimate

  **S** (Small - implementable in hours) — The implementation is straightforward because:

  1. **Established Pattern**: 280+ prior features follow an identical implementation pattern. The Python script structure is proven and repeatable.
  2. **Simple File Creation**: Core task is creating a single markdown file with ~400-600 bytes of content (H1 title + 2-3 sentences).
  3. **Known Workflow**: Validation and git operations follow the exact same sequence as all prior features (specs/*/create_markdown_file.py).
  4. **No Complexity**: Unlike features that involve code changes, architecture decisions, or infrastructure setup, this is purely file creation and git operations.
  5. **Minimal Testing**: Validation is straightforward (file exists, has H1 heading, has prose content, proper encoding).
  6. **Shared Infrastructure**: All heavy lifting is handled by `src/sheep/content_generators.py`, which is mature and well-tested.

  Implementation effort: ~30-60 minutes including file creation, validation, testing, and git operations.
