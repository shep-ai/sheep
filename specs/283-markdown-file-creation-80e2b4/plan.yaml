content: |
  ## Architecture Overview

  This feature follows a **thin-wrapper orchestration pattern** used consistently across 280+ prior
  features in the repository. The architecture is:

  ```
  create_markdown_file.py (wrapper script)
      └── create_markdown_file() (orchestration function from src/sheep/content_generators.py)
          ├── generate_markdown_content() — Claude API + validation
          ├── write_markdown_file() — file I/O with UTF-8 encoding, Unix LF
          ├── validate_markdown_file() — comprehensive validation (encoding, line endings, structure, size)
          ├── commit_markdown_file() — GitCommitTool with conventional message
          └── push_markdown_file() — GitPushTool with upstream tracking
  ```

  **Why This Design:**
  The orchestration function is battle-tested across 280+ features and provides all required
  functionality: Claude API integration, proper file encoding (UTF-8 no BOM, Unix LF line endings),
  multi-layer validation, and git operations with conventional commits. The wrapper script is a
  simple entry point that imports and calls this proven function with feature-specific parameters.
  This approach eliminates duplication, ensures consistency, and guarantees correctness through
  reuse of well-tested infrastructure.

  ## Key Design Decisions

  ### 1. Use Existing Orchestration Function (Not Custom Implementation)

  **Decision:** Import and call `create_markdown_file()` from `src/sheep/content_generators.py`

  **Why This Approach:**
  - **Proven:** Used successfully by 280+ prior features, battle-tested in production
  - **Feature-Complete:** Handles generation, I/O, validation, git — nothing missing
  - **Consistent:** All prior features follow this exact pattern, ensuring project-wide consistency
  - **Maintainable:** Updates to orchestration benefit all features automatically
  - **Correct:** All validation (encoding, line endings, structure, size) built-in

  **What the Function Provides:**
  - Claude API integration with CrewAI framework
  - H1 heading requirement validation
  - Period-delimited sentence count (2-3 validation)
  - UTF-8 encoding without BOM, Unix LF line endings
  - File size validation (400-600 bytes, implicit through sentence count)
  - Git staging, conventional commit message, remote push
  - Comprehensive error handling and logging

  **Rejected Alternatives:**
  - Custom implementation duplicates proven code, violates DRY principle
  - Direct API calls skip validation and error handling, inconsistent with 280+ features

  ### 2. Minimal Wrapper Script

  **Decision:** Simple 10-15 line wrapper that imports and calls orchestration function

  **Why This Approach:**
  - **Clear Separation:** Wrapper = feature-specific entry point; orchestration = shared logic
  - **Maintainability:** Minimal code means fewer bugs and easier updates
  - **Consistency:** Matches pattern from all 280+ prior features exactly
  - **Testability:** Small, focused module is easy to unit test

  **Rejected Alternatives:**
  - Inline implementation duplicates orchestration logic
  - Complex wrapper with custom validation adds unnecessary burden

  ### 3. Test-Driven Development with Comprehensive Coverage

  **Decision:** Write tests first (RED), implement to pass (GREEN), then refactor (REFACTOR)

  **Why This Approach:**
  - **Correctness:** Tests verify wrapper calls orchestration with correct arguments
  - **Regression Prevention:** Comprehensive tests catch issues early
  - **Documentation:** Tests serve as executable specification of expected behavior
  - **Confidence:** Green tests = confident the feature works as intended

  **Test Coverage Areas:**
  1. **Wrapper Functionality:** Imports orchestration, calls with correct parameters
  2. **File Properties:** Encoding, line endings, structure, size constraints
  3. **Content Validation:** H1 heading, blank line separator, 2-3 sentences
  4. **Git Operations:** Conventional commit message, push with tracking
  5. **Integration:** Complete workflow produces expected output

  **Rejected Alternatives:**
  - No tests = high risk of undetected issues
  - Minimal tests miss encoding/line ending/structure problems
  - Manual verification = unreliable and not repeatable

  ### 4. No Core Module Modifications

  **Decision:** Use existing code in `src/sheep/content_generators.py` as-is, no changes

  **Why This Approach:**
  - **Safety:** Avoid risk of breaking other 280+ features
  - **Simplicity:** Already feature-complete, no gaps to fill
  - **Consistency:** Prove the pattern works through reuse
  - **Separation of Concerns:** Feature-specific code in specs/; shared code in src/

  **What This Means:**
  - No changes to `src/sheep/content_generators.py`
  - No changes to `src/sheep/config/llm.py`
  - No changes to `src/sheep/tools`
  - No changes to any core infrastructure

  **Rejected Alternatives:**
  - Modifying core modules adds risk and maintenance burden

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3 → Phase 4** proceeds from foundation to execution:

  1. **Phase 1 (Foundation):** Establish test infrastructure and wrapper skeleton so both are ready
  2. **Phase 2 (Implementation):** Build wrapper through TDD, adding functionality incrementally
  3. **Phase 3 (Validation):** Write comprehensive tests to validate all requirements
  4. **Phase 4 (Execution):** Run wrapper and tests to verify success criteria

  This ordering ensures:
  - Tests are ready before implementation starts (true TDD)
  - Infrastructure is solid before adding functionality
  - Comprehensive validation happens before claiming success
  - Execution is the final step, not the first

  ### What Gets Built, in Order

  1. **Test file infrastructure** (Phase 1)
     - Imports, fixtures, test class structure
     - Ready for writing tests in Phase 2

  2. **Wrapper script skeleton** (Phase 1)
     - Main function, imports
     - Ready to be filled in Phase 2

  3. **Wrapper implementation** (Phase 2)
     - Import orchestration function
     - Call with filename, feature_number
     - Handle results and errors
     - Tested incrementally through TDD cycles

  4. **Integration tests** (Phase 3)
     - File property validation
     - Git operation validation
     - Content structure validation
     - Size and encoding checks

  5. **Execution and verification** (Phase 4)
     - Run wrapper to create markdown file
     - Execute tests to verify all criteria
     - Confirm file exists with correct properties
     - Verify git commit and push

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Orchestration function signature changed | Very Low | High | Always verify function signature in src/sheep/content_generators.py before calling; if changed, update wrapper accordingly |
  | Claude API rate limiting or failures | Low | Medium | Orchestration function handles retries (up to 3); wrapper catches exceptions and reports clearly |
  | File encoding issues (BOM or CRLF on Windows) | Very Low | High | Use existing write_markdown_file() which enforces UTF-8 no-BOM and Unix LF; tests verify encoding |
  | Git operations fail (auth, remote unavailable) | Low | Medium | Existing GitCommitTool and GitPushTool handle errors; wrapper catches and reports |
  | Tests don't match actual validation | Low | High | Tests mimic validation logic from validate_markdown_file(); both check same criteria |
  | File not in correct location | Very Low | High | Wrapper passes exact filename "test-gqvdp6.md"; orchestration writes to repository root |
  | Commit message format incorrect | Very Low | High | Orchestration function builds message in conventional format; tests verify message includes feature number |
  | Integration tests overlap with orchestration tests | Medium | Low | Tests focus on wrapper behavior and integration; orchestration tests are separate; minimize duplication |
