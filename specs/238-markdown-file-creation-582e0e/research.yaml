      Pattern established across all 237 preceding features. `GitCommitTool._run(add_all=True)` stages all
      changes and commits with custom message. `GitPushTool._run(set_upstream=True)` handles upstream tracking.

  - title: "Markdown Content Validation"
    chosen: "Comprehensive validation via validate_markdown_file() function"
    rejected:
      - "No validation — rejected because validation ensures content meets specification requirements"
      - "Minimal validation (only check H1 heading exists) — rejected because incomplete validation allows invalid output"
      - "External markdown parser library (markdown, commonmark) — rejected because validation requirements are simple and built-in validation is sufficient"
    rationale: >
      `validate_markdown_file()` from `content_generators.py` validates: (1) File exists and is readable,
      (2) UTF-8 encoding without BOM via binary read, (3) No CRLF line endings, (4) H1 heading at start,
      (5) Blank line separator after heading, (6) 2-3 sentences in prose content (by counting periods),
      (7) Trailing newline. This approach is lightweight, deterministic, and proven across all preceding features.
      Avoids external dependencies for simple validation.

  - title: "Logging and Observability"
    chosen: "Structured logging via get_logger(__name__) from sheep.observability.logging"
    rejected:
      - "print() statements — rejected because unstructured output cannot be filtered, aggregated, or parsed"
      - "No logging — rejected because feature requires observability for debugging and monitoring"
      - "Third-party logging libraries (loguru, structlog) — rejected because project standardizes on sheep.observability.logging"
    rationale: >
      All file I/O, validation, and git operations are logged at appropriate levels (info for major steps,
      debug for implementation details, error for failures). This enables observability, debugging, and monitoring.
      Established pattern in `feature_227_markdown_file_creation.py` and throughout codebase.
      `get_logger(__name__)` provides module-scoped logger from project's logging infrastructure.

  - title: "Feature Module Pattern"
    chosen: "Create feature_238_markdown_file_creation.py matching feature_227_markdown_file_creation.py pattern"
    rejected:
      - "Generic handler module — rejected because feature-specific modules enable independent testing and versioning"
      - "Standalone script (no module) — rejected because module structure enables import, testing, and integration"
      - "Merged into content_generators.py — rejected because feature-specific module maintains separation of concerns"
    rationale: >
      Feature 227 shows the exact pattern: feature-specific module with `FEATURE_NUMBER`, `MARKDOWN_FILENAME`,
      and `create_feature_238_markdown_file()` function. This pattern enables individual testing, clear feature
      attribution, and follows 90+ established precedents. Module orchestrates the workflow: generate content,
      write file, validate, commit with custom message, push. Simple, proven, maintainable.

