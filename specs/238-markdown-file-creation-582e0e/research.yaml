      - "CRLF or CR line endings — rejected because codebase standardizes on Unix LF; CRLF causes cross-platform issues"
    rationale: >
      UTF-8 without BOM is the CommonMark standard and Unix convention. Python's `open(file, 'w', encoding='utf-8')`
      automatically uses platform-specific line endings; on Unix systems this is LF. Validation function checks for
      and rejects CRLF (b'\r\n') and UTF-8 BOM (b'\xef\xbb\xbf'). All 90+ preceding features use this standard.
      Git repositories normalize to LF on Unix systems.

  - title: "Git Integration Approach"
    chosen: "Internal GitCommitTool and GitPushTool from sheep.tools"
    rejected:
      - "Direct subprocess.run('git') calls — rejected because internal tools provide abstraction, error handling, and logging"
      - "GitPython library — rejected because project standardizes on custom internal tools with CrewAI integration"
      - "Shell scripts — rejected because Python tools provide better observability and type safety"
    rationale: >
      The `GitCommitTool` and `GitPushTool` from `src/sheep/tools` are project-standard tools exported from
      `src/sheep/tools/__init__.py`. These tools provide structured integration with CrewAI framework, handle
