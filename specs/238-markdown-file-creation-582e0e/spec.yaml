content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-mcfudw.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  90+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is a continuation of the markdown-file-creation pattern established in features
  069-237, with identical requirements and implementation approach. All architectural and design
  decisions have been pre-determined through these precedents; no new decisions are needed.

  ## Success Criteria

  - [ ] File `test-mcfudw.md` created at repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# Title`) as the first line
  - [ ] Heading is followed by a blank line (standard markdown spacing)
  - [ ] File contains 2-3 sentences of coherent prose content following the blank line
  - [ ] File uses UTF-8 encoding without byte order mark (BOM)
  - [ ] File uses Unix-style LF line endings (`\n`), not CRLF or CR
  - [ ] File content passes CommonMark markdown validation with no syntax errors
  - [ ] File size is 300-700 bytes (natural result of proper formatting)
  - [ ] File is staged in git (verified via `git status` showing the file as staged)
  - [ ] Commit message follows conventional format: `feat(238): Create markdown file test-mcfudw.md with prose content`
  - [ ] Commit is created and changes are pushed to remote feature branch `feat/238-markdown-file-creation-582e0e`
  - [ ] No other files are modified, created, or deleted (working directory is clean after push)
  - [ ] File exists on remote repository on the feature branch

  ## Functional Requirements

  - **FR-1**: The system SHALL create a markdown file named `test-mcfudw.md` at the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading using the syntax `# <Title>` as the first non-empty line
  - **FR-3**: The file SHALL contain a blank line immediately following the H1 heading (standard markdown spacing)
  - **FR-4**: The file SHALL contain 2-3 sentences of coherent prose content following the blank line
  - **FR-5**: The file SHALL be staged in the git index after creation (ready for commit)
  - **FR-6**: The file SHALL be committed with a conventional commit message in the format: `feat(238): Create markdown file test-mcfudw.md with prose content`
  - **FR-7**: The commit SHALL be pushed to the remote feature branch `feat/238-markdown-file-creation-582e0e`
  - **FR-8**: Content generation SHALL use the existing `content_generators.py` utilities via CrewAI LLM framework
  - **FR-9**: File creation SHALL use Python `pathlib.Path` for file I/O operations
  - **FR-10**: Git operations SHALL use standard git commands (`git add`, `git commit`, `git push`)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding MUST be UTF-8 without byte order mark (BOM); validated against UTF-8 specification
  - **NFR-2**: Line endings MUST use Unix-style LF (`\n`) only; no CRLF or CR line endings
  - **NFR-3**: File content MUST validate as valid CommonMark markdown (per https://spec.commonmark.org/)
  - **NFR-4**: File size SHOULD be 300-700 bytes, which is the natural result of proper H1 heading + 2-3 sentence formatting
  - **NFR-5**: Implementation MUST follow the established pattern from features 069-237 for consistency and maintainability
  - **NFR-6**: All file I/O operations MUST include structured logging via `get_logger(__name__)` for observability
  - **NFR-7**: No files other than `test-mcfudw.md` SHALL be modified, created, or deleted by this feature
  - **NFR-8**: The implementation MUST NOT modify any source code files in `/src/sheep/` or other directories
  - **NFR-9**: Git operations MUST respect pre-configured git user identity (`user.name`, `user.email`)
  - **NFR-10**: All error conditions SHALL be logged with appropriate severity and gracefully propagated to the caller

  ## Product Questions & AI Recommendations

  No open product questions — all architectural and design decisions have been pre-determined by the 90+
  precedent implementations (features 069-237). The feature specification is complete and ready for
  implementation.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (`test-mcfudw.md`) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (300-700 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-237; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in `/src/sheep/` or elsewhere |
  | Specs Directory | Low | Updates only this `spec.yaml` file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |
  | Markdown Test Files | Low | Adds to established collection; follows identical pattern to 90+ preceding test files |

  ## Dependencies

  **External Dependencies**:
  - **Git Repository** — Feature branch `feat/238-markdown-file-creation-582e0e` must exist and be checked out (pre-created)
  - **File System** — Write access to repository root directory (already available)
  - **Git Configuration** — Standard git configuration (`user.name`, `user.email`) must be set up for commits
  - **Python Runtime** — Python 3.11+ with `pathlib` module (available in standard library)
  - **LLM Access** — Claude API credentials configured via .env (ANTHROPIC_API_KEY) for content generation

  **Internal Dependencies**:
  - **src/sheep/content_generators.py** — Provides functions for content generation, file I/O, and validation
  - **src/sheep/tools/GitCommitTool, GitPushTool** — Git operations
  - **src/sheep/config/llm.py** — `get_reasoning_llm()` for LLM access
  - **src/sheep/observability/logging.py** — `get_logger()` for structured logging

  **Established Patterns**:
  - 90+ test files provide clear, proven precedent for content format and structure
  - Features 069-237 demonstrate consistent implementation approach

  ## Size Estimate

  **S (Small)** — Estimated 10-15 minutes of implementation time:

  - **File creation** — ~5 minutes (generate markdown heading + 2-3 sentences of prose on chosen topic)
  - **Validation** — ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow** — ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total** — 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-237) demonstrate consistent 10-15 minute implementation time
  - File naming is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 150+ prior implementations
  - All technical decisions pre-determined; implementation is straightforward execution
  - Existing content generation utilities (`sheep.content_generators`) handle heavy lifting

  ## Implementation Strategy

  **Approach**: Use existing content generation utilities from `src/sheep/content_generators.py` to orchestrate the workflow:

  1. **Content Generation** — Call `generate_markdown_content()` to create H1 heading + 2-3 sentences via LLM
  2. **File Writing** — Call `write_markdown_file(content, "test-mcfudw.md")` to write file with UTF-8 encoding
  3. **Validation** — Call `validate_markdown_file(filepath)` to verify encoding, line endings, and markdown format
  4. **Git Commit** — Call `commit_markdown_file(filepath, content, repo_path, custom_message=...)` with conventional message
  5. **Git Push** — Call `push_markdown_file(repo_path)` to push to remote feature branch

  **Feature Module**: Create `src/sheep/features/feature_238_markdown_file_creation.py` following the pattern
  established in features 069-237 (e.g., feature_227_markdown_file_creation.py).

  **Metadata**:
  - FEATURE_NUMBER = 238
  - MARKDOWN_FILENAME = "test-mcfudw.md"
  - Commit message format: `"feat(238): Create markdown file test-mcfudw.md with prose content"`

