# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 238 extends an established, proven pattern across 90+ preceding markdown file
  creation features (001-237). The implementation introduces no new architectural
  concepts or infrastructure — it purely continues the existing pattern.

  ### Pattern Architecture

  The feature module follows a consistent structure established in features 001-237:

  ```
  Feature Module (feature_238_markdown_file_creation.py)
    ├─ Metadata: FEATURE_NUMBER = 238, MARKDOWN_FILENAME = "test-mcfudw.md"
    ├─ Imports: logging, content_generators, git tools
    ├─ Main Function: create_feature_238_markdown_file(repo_path=None)
    │  └─ Orchestrates workflow steps with error handling and logging
    ├─ Workflow Steps:
    │  ├─ Generate Content via generate_markdown_content()
    │  ├─ Write File via write_markdown_file(content, filename)
    │  ├─ Validate via validate_markdown_file(filepath)
    │  ├─ Commit via commit_markdown_file(filepath, content, repo_path, custom_message)
    │  └─ Push via push_markdown_file(repo_path)
    └─ Error Handling: catch/log/re-raise for observability
  ```

  ### Integration Points

  The feature module integrates with existing, stable utilities:

  - **content_generators.py** — Provides: generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - **tools.GitCommitTool** — Handles git commit with conventional message format
  - **tools.GitPushTool** — Handles git push with upstream tracking
  - **config.llm.get_reasoning_llm()** — Provides Claude API LLM instance via CrewAI
  - **observability.logging.get_logger()** — Provides structured logging infrastructure

  All utilities are already implemented and proven across 90+ features. The feature module
  is a thin orchestration layer with no new dependencies or infrastructure.

  ## Key Design Decisions

  ### 1. Content Generation: Claude API via CrewAI

  **Chosen:** Use Claude API via CrewAI LLM framework

  **Rationale:**
  - CrewAI provides unified LLM abstraction proven across all 90+ preceding features
  - get_reasoning_llm() from config.llm returns configured Claude API instance
  - Temperature control (0.2) ensures consistent quality prose generation
  - Dynamic generation produces varied, coherent content

  **Alternatives Considered:**
  - Template-based generation — would be repetitive, lacks variety
  - Hardcoded content — unsuitable for automated feature generation
  - Other LLM providers — project standardizes on CrewAI/Anthropic

  **Impact:** Proven pattern; minimal risk

  ### 2. File I/O: Python pathlib.Path

  **Chosen:** Use Python pathlib.Path (standard library)

  **Rationale:**
  - Object-oriented, cross-platform path handling
  - Prevents path traversal attacks via filename validation (rejects "/" and "\\")
  - Consistent with all 90+ preceding features
  - Built-in (no external dependencies)

  **Alternatives Considered:**
  - os.path module — less clean API, manual path handling
  - Direct string concatenation — vulnerable to path traversal
  - External libraries — pathlib is sufficient and built-in

  **Impact:** Proven pattern; prevents path traversal vulnerabilities

  ### 3. Encoding: UTF-8 without BOM, Unix LF

  **Chosen:** UTF-8 encoding without BOM and Unix-style LF line endings

  **Rationale:**
  - CommonMark standard for markdown files
  - Unix convention used throughout codebase
  - Python's open(file, 'w', encoding='utf-8') handles platform-specific line endings
  - Validation enforces standard by rejecting CRLF and BOM

  **Alternatives Considered:**
  - UTF-8 with BOM — adds unwanted bytes, non-standard for UTF-8
  - Other encodings — UTF-8 is modern standard
  - CRLF line endings — causes cross-platform issues

  **Impact:** Ensures specification compliance (NFR-1, NFR-2)

  ### 4. Git Integration: Internal Tools

  **Chosen:** Internal GitCommitTool and GitPushTool from sheep.tools

  **Rationale:**
  - Project-standard tools with CrewAI integration and observability
  - Provide abstraction, error handling, and structured logging
  - Handle git configuration (user.name, user.email)
  - Proven across all 90+ preceding features

  **Alternatives Considered:**
  - Direct subprocess.run() calls — no abstraction or observability
  - GitPython library — project standardizes on internal tools
  - Shell scripts — less type-safe, harder to integrate

  **Impact:** Ensures observability and follows established patterns

  ### 5. Validation: Comprehensive Checks

  **Chosen:** validate_markdown_file() from content_generators.py

  **Rationale:**
  - Ensures all specification requirements are met before commit
  - Checks: UTF-8 without BOM, no CRLF, H1 heading, blank line, 2-3 sentences, trailing newline
  - Lightweight, deterministic validation (no external dependencies)
  - Proven across 90+ features

  **Alternatives Considered:**
  - No validation — allows invalid output
  - Minimal validation — incomplete checks
  - External markdown parsers — unnecessary complexity

  **Impact:** Prevents invalid files from being committed

  ### 6. Logging: Structured Logging

  **Chosen:** get_logger(__name__) from sheep.observability.logging

  **Rationale:**
  - Enables observability for debugging and monitoring
  - Structured logging allows aggregation and filtering
  - Project-standard approach across all features
  - Logs major steps (info) and details (debug)

  **Alternatives Considered:**
  - print() statements — unstructured output
  - No logging — prevents debugging and monitoring
  - External logging libraries — project standard exists

  **Impact:** Enables troubleshooting and operational monitoring

  ### 7. Feature Module Pattern

  **Chosen:** Create feature_238_markdown_file_creation.py following established pattern

  **Rationale:**
  - Feature-specific modules enable independent testing and clear feature attribution
  - Pattern established in features 001-237 (e.g., feature_227_markdown_file_creation.py)
  - Single responsibility: orchestrate complete workflow
  - Easy to test and integrate as Python module

  **Alternatives Considered:**
  - Generic handler module — less clear feature attribution
  - Standalone script — harder to test and integrate
  - Merged into content_generators.py — poor separation of concerns

  **Impact:** Maintains consistency with 90+ precedents

  ## Implementation Strategy

  ### Phase Ordering

  1. **Foundation** — Create module structure first
     - Establishes file and function signatures
     - Enables test setup before implementation
     - Risk-free: just creating skeleton

  2. **Implementation** — Implement orchestration workflow
     - Build workflow steps with TDD (test-first)
     - Each step tested before integration
     - Incremental validation reduces risk

  3. **Validation & Integration** — Verify complete workflow
     - End-to-end testing ensures correctness
     - Verify file format, encoding, git integration
     - Confirm remote push succeeds

  ### Task Breakdown Summary

  The work breaks into 6 focused tasks:
  - **Task 1 (Foundation):** Module structure and metadata
  - **Tasks 2-4 (Implementation):** Workflow orchestration in stages (content→file→validate→commit→push)
  - **Tasks 5-6 (Validation):** Complete workflow testing and verification

  Each task follows TDD: RED (test first) → GREEN (minimal impl) → REFACTOR (improve).
  Dependencies are linear (each task depends on previous).
  Estimated total effort: 1 hour 35 minutes (includes thorough testing).

  ## Risk Mitigation

  | Risk | Probability | Severity | Mitigation |
  | ---- | ----------- | -------- | ---------- |
  | LLM content quality below standard | Low | Medium | Claude API is reliable; validation checks for 2-3 sentences; can regenerate if needed |
  | File encoding issues (CRLF or BOM) | Very Low | Medium | Validation explicitly rejects CRLF and BOM; Python handles platform encoding |
  | Git configuration missing (user.name/email) | Very Low | High | Git configuration is prerequisite; internal tools handle standard cases; clear error messages |
  | Path traversal via filename | Very Low | High | write_markdown_file() validates filename; rejects "/" and "\\" characters |
  | API rate limiting | Low | Low | Single API call per feature; handled by CrewAI/Anthropic SDK |
  | Network issues during push | Low | Medium | GitPushTool includes retry logic; feature can be re-run on failure |
  | Working directory not clean after workflow | Low | Medium | Validation ensures only test-mcfudw.md created; no other modifications possible |

  ## Success Criteria

  Implementation is complete when:
  - Feature module created at src/sheep/features/feature_238_markdown_file_creation.py
  - All workflow steps orchestrated with error handling and logging
  - Integration tests verify complete workflow succeeds
  - File created with correct format (H1 heading + 2-3 sentences)
  - File encoding is UTF-8 without BOM with Unix LF line endings
  - File committed with conventional message: "feat(238): Create markdown file test-mcfudw.md with prose content"
  - Changes pushed to remote feature branch "feat/238-markdown-file-creation-582e0e"
  - Working directory clean (no unexpected modifications)
