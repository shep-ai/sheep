# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research Complete
  - **Updated:** 2026-03-31
  - **Architecture:** Minimal — uses proven orchestration function
  - **Implementation Approach:** Standalone script calling `create_markdown_file()` utility

  ## Technology Decisions

  ### 1. Content Generation via Claude API (LLM)

  **Chosen:** Use `generate_markdown_content()` function from content_generators.py, which calls Claude API via CrewAI LLM framework

  **Rejected:**
  - Manual hardcoded content — inconsistent across 291 files, defeats test purpose, requires constant updates
  - Template-based approach — reduces creativity, limits topic diversity, not aligned with preceding 290+ features

  **Rationale:**
  The `generate_markdown_content()` function leverages CrewAI's LLM integration to call Claude API via `sheep.config.llm.get_reasoning_llm()`. Uses structured prompt `MARKDOWN_GENERATION_PROMPT` specifying:
  - H1 heading (markdown `#`) with any topic
  - Blank line separator
  - Exactly 2-3 sentences of coherent prose

  Ensures each of the 291 files has unique, contextually appropriate content. Flexible topic selection ("about anything") matches feature specification exactly. Proven across 290+ preceding features.

  ### 2. File Creation and Writing

  **Chosen:** Use `write_markdown_file(content, filename)` utility function

  **Rejected:**
  - Manual `pathlib.Path.write_text()` — requires reimplementing validation and path safety checks
  - Direct file handle operations — lower-level, more error-prone, loses proven patterns

  **Rationale:**
  The `write_markdown_file()` function encapsulates all file creation logic:
  - Validates filename safety (prevents path traversal attacks)
  - Resolves repository root via `Path.cwd()`
  - Writes with UTF-8 encoding (standard for markdown)
  - Verifies file was created and has non-zero size
  - Returns full file path for downstream operations

  Already proven and tested across 290+ features. Prevents security vulnerabilities through filename validation.

  ### 3. File Validation (Structure, Encoding, Line Endings)

  **Chosen:** Use `validate_markdown_file(filepath)` function with strict validation

  **Rejected:**
  - Manual validation logic — duplicates existing code, risks missing edge cases
  - Lenient validation — risks accepting malformed content, inconsistent with quality baseline

  **Rationale:**
  The `validate_markdown_file()` function implements comprehensive strict validation:

  | Criterion | Check | Method |
  | --------- | ----- | ------ |
  | H1 heading presence | First line starts with `# ` | Regex pattern `^# ` |
  | Blank line separator | Second line is empty string | String comparison |
  | Prose content | 2-3 sentences | Count periods in content |
  | UTF-8 encoding | No BOM (Byte Order Mark) | Check for `b"\xef\xbb\xbf"` bytes |
  | Line endings | Unix LF only (no CRLF) | Check for absence of `b"\r\n"` |
  | Trailing newline | File ends with `\n` | Check `text_content.endswith("\n")` |

  Binary read optimizes encoding/line-ending checks. Structured error messages aid debugging. Proven pattern across 290+ features ensures consistency.

  ### 4. Git Staging and Commit

  **Chosen:** Use `commit_markdown_file(filepath, content, feature_number=291)` utility function

  **Rejected:**
  - Manual subprocess execution — requires reimplementing error handling and logging
  - Manual commit message formatting — risks inconsistency with conventional format

  **Rationale:**
  The `commit_markdown_file()` function uses `GitCommitTool` internally to:
  - Stage changes with `git add -A`
  - Generate conventional commit message: `feat(291): create markdown file test-sdxefr.md with prose content`
  - Handle errors transparently (git errors, nothing-to-commit scenarios)

  Automatic feature number substitution ensures correct commit scope. Structured logging tracks all operations. Proven pattern ensures consistency with project's git history across 290+ features.

  ### 5. Remote Push with Upstream Tracking

  **Chosen:** Use `push_markdown_file(repo_path)` utility function with upstream tracking

  **Rejected:**
  - Manual git push — requires subprocess calls, error handling, tracking setup
  - Skip push operation — leaves commit on local branch, requires manual push

  **Rationale:**
  The `push_markdown_file()` function uses `GitPushTool` to:
  - Automatically determine current branch (`feat/291-markdown-file-creation-420f73`)
  - Execute `git push -u origin <branch>` with upstream tracking
  - Handle error cases transparently (auth failures, branch conflicts)

  Upstream tracking enables future `git pull` operations without specifying remote/branch. Matches established workflow from 290+ preceding features. Completes full end-to-end automation.

  ### 6. Orchestration Approach

  **Chosen:** Use `create_markdown_file(filename, repo_path, feature_number)` high-level orchestration function

  **Rejected:**
  - Manual step-by-step workflow — requires caller to handle all error cases, duplicate logging
  - Individual function calls scattered in implementation — reduces maintainability

  **Rationale:**
  The `create_markdown_file()` function in content_generators.py orchestrates all five steps:

  ```
  1. generate_markdown_content() → markdown string
  2. write_markdown_file(content, filename) → filepath
  3. validate_markdown_file(filepath) → validation result
  4. commit_markdown_file(filepath, content, feature_number) → commit result
  5. push_markdown_file(repo_path) → push result
  ```

  Single entry point minimizes caller complexity. Handles error propagation transparently. Logs all progress checkpoints. Returns dictionary containing filepath, content, commit_message, and push_result for inspection. Exactly what this feature requires.

  ## Library Analysis

  | Library | Purpose | Use? | Reasoning |
  | ------- | ------- | ---- | --------- |
  | CrewAI | LLM framework, agent orchestration | **USE** | Already integrated in codebase via `sheep.config.llm`. Provides structured LLM calls and error handling. Used by `generate_markdown_content()`. |
  | Claude API | Content generation | **USE** | Via `sheep.config.llm.get_reasoning_llm()`. Proven across 290+ features. Generates unique, contextually appropriate content. |
  | pathlib | Cross-platform file I/O | **USE** | Standard library, used throughout content_generators.py. Path.cwd() resolves repo root. Handles Windows/Unix path differences transparently. |
  | structlog | Structured logging | **USE** | Already integrated via `sheep.observability.logging.get_logger()`. All utilities use consistent logging. Required for NFR-5 (structured logging). |
  | GitCommitTool | Staging and committing | **USE** | From `sheep.tools.GitCommitTool`. Wraps subprocess git calls with error handling. Used by `commit_markdown_file()`. |
  | GitPushTool | Remote push operations | **USE** | From `sheep.tools.GitPushTool`. Handles upstream tracking setup. Used by `push_markdown_file()`. |
  | regex (re module) | Pattern matching for validation | **USE** | Standard library. Used for H1 heading validation (`^# `) and sentence counting (periods). Already proven in validation functions. |
  | subprocess | External command execution | **INDIRECT USE** | Used internally by GitCommitTool and GitPushTool for git commands. Not called directly by feature implementation. |

  ## Security Considerations

  ### Path Traversal Prevention
  - **Risk:** Filename parameter could contain `../` or absolute paths, allowing file writes outside repository root
  - **Mitigation:** `write_markdown_file()` validates filename, rejecting any containing `/`, `\`, or starting with `.`
  - **Status:** Implemented ✓

  ### UTF-8 Encoding Validation
  - **Risk:** File could contain invalid UTF-8 sequences or unexpected BOM, breaking downstream tooling
  - **Mitigation:** `validate_markdown_file()` checks for UTF-8 validity and rejects BOM
  - **Status:** Implemented ✓

  ### Git Command Injection
  - **Risk:** Commit message could contain shell metacharacters, potentially executing arbitrary commands
  - **Mitigation:** `GitCommitTool` passes message as argument (not shell-evaluated). Message is auto-generated from feature_number and filename, not user input
  - **Status:** Implemented ✓

  ### Content Validation
  - **Risk:** Generated LLM content could be malformed, breaking downstream processing
  - **Mitigation:** `validate_markdown_file()` enforces strict structure validation. Catches generation errors before push
  - **Status:** Implemented ✓

  ## Performance Implications

  | Operation | Duration | Notes |
  | --------- | -------- | ----- |
  | LLM API call (`generate_markdown_content`) | ~2-3 minutes | External API latency, network bound |
  | File I/O (write + validation) | <100ms | Local disk operations, minimal |
  | Git stage + commit | <100ms | Local repository operations |
  | Git push | <1-2 seconds | Network bound, typically fast |
  | **Total execution time** | **~3-5 minutes** | Network latency dominates |

  **Optimization notes:**
  - LLM call is the performance bottleneck (external API)
  - No optimization available for API latency (inherent constraint)
  - All local operations are negligible (<500ms combined)
  - Feature size estimate of 15-20 minutes (NFR-3) is conservative

