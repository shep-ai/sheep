  ### Fit into Existing Codebase

  This feature leverages the established architecture for markdown file creation:

  1. **LLM Integration:** Uses existing CrewAI framework via `sheep.config.llm.get_reasoning_llm()`. No new LLM configuration needed.
  2. **File Operations:** Builds on `pathlib` abstractions already used throughout codebase. No new file handling patterns.
  3. **Git Integration:** Uses `GitCommitTool` and `GitPushTool` from `sheep.tools`. No new git abstractions.
  4. **Logging:** Uses `sheep.observability.logging.get_logger()` for structured logging. Consistent with project standards.
  5. **Orchestration:** Uses existing `create_markdown_file()` function. No new orchestration framework needed.

  ### Pattern Consistency

  This feature follows the identical pattern from 290 preceding features:
  - **Same workflow:** Generate → Write → Validate → Commit → Push
  - **Same utilities:** All functions in content_generators.py
  - **Same file structure:** H1 heading + blank line + 2-3 sentences
  - **Same commit message format:** `feat(NNN): create markdown file <filename> with prose content`
  - **Same git workflow:** Commit + push to feature branch with upstream tracking

  ### No Architectural Changes Required

  - No new modules or packages
  - No new dependencies (all already installed)
  - No configuration changes (uses existing sheep.config.llm)
  - No modifications to existing files
  - No testing framework changes

  The implementation is purely additive: a simple feature handler calling existing utilities.

  ## Implementation Strategy

  ### Minimal Viable Implementation

  Create a simple Python script that:

  ```python
  from sheep.content_generators import create_markdown_file

  result = create_markdown_file(
      filename="test-sdxefr.md",
      feature_number=291
  )

  print(f"Created: {result['filepath']}")
  print(f"Commit: {result['commit_message']}")
  ```

  This single function call handles:
  1. ✓ Generate markdown content via Claude API
  2. ✓ Write file to repository root
  3. ✓ Validate file structure and encoding
  4. ✓ Stage and commit with conventional message
  5. ✓ Push to feature branch with upstream tracking

  ### Validation Checklist

  After execution, verify:
  - [ ] File `test-sdxefr.md` exists in repository root
  - [ ] File contains H1 heading and 2-3 sentences
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix LF line endings
  - [ ] File size is 250-600 bytes (natural outcome of structure)
  - [ ] `git log` shows commit `feat(291): create markdown file test-sdxefr.md with prose content`
  - [ ] Feature branch has upstream tracking (`git branch -vv` shows tracking info)

  ## Conclusion

  Feature 291 requires minimal technical research because it follows an extensively-established pattern from 290 identical preceding features. All technical decisions are proven and resolved:

  - **Content generation:** LLM via Claude API (CrewAI framework)
