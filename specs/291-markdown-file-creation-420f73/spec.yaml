content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 291 creates a single test markdown file
  (`test-sdxefr.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-290.
  With 290 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations.

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is organized as follows:

  - **Root directory**: Contains markdown test files (test-*.md) from all preceding features (001-290+)
    and repository configuration files (pyproject.toml, .env.example, docker-compose.yml, etc.)
  - **src/sheep/**: Core platform code organized into modules
    - `content_generators.py`: Utility functions for markdown generation, validation, and git operations
    - `config/`: Configuration management including LLM configuration
    - `observability/`: Logging infrastructure using structlog
    - `tools/`: Git tools for commit and push operations
    - `agents/`, `flows/`, `features/`: CrewAI agents, flows, and feature implementations
  - **specs/**: Feature specifications stored as YAML (006-291 directories), each containing:
    - `spec.yaml`: Complete feature specification and analysis
    - `feature.yaml`, `plan.yaml`, `research.yaml`, `tasks.yaml`: Phase-specific artifacts
  - **tests/**: Test suite for platform functionality
  - **Dockerfile, docker-compose.yml**: Container configuration for deployment

  ### Architecture Patterns

  **Content Generation Pipeline**:
  1. Utilize Claude API via `sheep.config.llm.get_reasoning_llm()` for LLM calls
  2. Call with markdown-specific prompt to generate H1 heading + 2-3 sentences of prose
  3. Validate generated content against requirements (heading present, sentence count, encoding)
  4. Write to file using `pathlib.Path.write_text(encoding='utf-8')`

  **Git Workflow Pattern** (established across 290+ features):
  1. Generate markdown content using Claude API
  2. Write file to repository root with `Path.write_text()`
  3. Stage file using `git add <filename>`
  4. Create conventional commit: `feat(NNN): create markdown file <filename> with prose content`
  5. Push to feature branch with upstream tracking: `git push -u origin HEAD`

  **Validation Pattern**:
  - Check for H1 heading presence (regex: `^# `)
  - Verify sentence count using simple regex boundary detection
  - Confirm UTF-8 encoding without BOM
  - Verify Unix LF line endings (no CRLF)
  - Ensure file doesn't already exist (prevent silent overwrite)

  **Dependency Injection**:
  - LLM obtained via `sheep.config.llm.get_reasoning_llm()`
  - Logging obtained via `sheep.observability.logging.get_logger(__name__)`
  - Git tools available from `sheep.tools` module

  ### Relevant Technologies

  **Python Standard Library**:
  - `pathlib.Path`: File I/O with cross-platform compatibility
  - `re` (regex): Sentence boundary and structure validation

  **CrewAI Ecosystem**:
  - `sheep.config.llm`: LLM configuration and access to Claude API
  - `sheep.observability.logging`: Structured logging via structlog

  **Git**:
  - `git add`: Stage file for commit
  - `git commit`: Create conventional commit
  - `git push`: Push to feature branch with upstream tracking

  **Encoding Standards**:
  - UTF-8 without BOM (enforced by pathlib.Path.write_text with encoding='utf-8')
  - Unix LF line endings (\n, not \r\n or \r)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-sdxefr.md) to existing collection of 290+ test files; no modifications to existing files or configuration |
  | File System | Low | Single file creation (~300-600 bytes expected); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from 290+ preceding features; no branch/merge complexity, no rebase |
  | src/sheep/content_generators.py | None | Feature reuses existing utility functions; no modifications to source code required |
  | src/sheep/config/ | None | Feature uses existing LLM configuration; no changes to config files |
  | Tests | None | Feature is itself a test artifact; no test modifications needed |
  | Documentation | None | Feature spec only; no documentation changes required |
  | CI/CD | None | Feature does not interact with CI/CD pipeline; standard git push workflow |

  ## Dependencies

  **Git Repository State**:
  - Feature branch `feat/291-markdown-file-creation-420f73` must exist (pre-created as per git status)
  - Standard git user configuration (user.name, user.email) must be set for commits

  **File System**:
  - Write access to repository root directory (standard)
  - Ability to read/validate files after creation

  **Runtime Environment**:
  - Python 3.11+ with pathlib module available
  - Access to Claude API via ANTHROPIC_API_KEY or equivalent in environment
  - CrewAI framework and dependencies installed

  **Established Patterns**:
  - 290 preceding test files (test-*.md) provide clear precedent for content format and validation
  - `src/sheep/content_generators.py` provides core utilities: markdown generation, validation, file write, git operations
  - Conventional commit message format: `feat(NNN): create markdown file <filename> with prose content`
  - File naming convention: `test-<random-id>.md` with specified filename `test-sdxefr.md`

  **Platform Infrastructure**:
  - LLM access via `sheep.config.llm.get_reasoning_llm()`
  - Logging via `sheep.observability.logging.get_logger()`
  - Git integration via `sheep.tools` (GitCommitTool, GitPushTool)

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation**: ~3 minutes (write file using pathlib, validate structure/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate**: 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 290 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences of prose)
  - No testing, documentation, or configuration changes required
  - File naming (test-sdxefr.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 290+ prior implementations
  - Recent implementations (features 284-290) demonstrate efficient execution of identical features

  ## Success Criteria

  - [ ] File `test-sdxefr.md` is created in repository root
  - [ ] File contains exactly one H1 heading (CommonMark `#`) serving as the title
  - [ ] File contains exactly 2-3 sentences of coherent prose content after the heading
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\n) exclusively, no CRLF or CR
  - [ ] File structure validation passes (H1 heading present, sentence count verified, encoding confirmed)
  - [ ] File is properly staged in git working directory
  - [ ] Commit message follows conventional format: `feat(291): create markdown file test-sdxefr.md with prose content`
  - [ ] Commit is successfully pushed to feature branch `feat/291-markdown-file-creation-420f73` with upstream tracking
  - [ ] Content is generated via Claude API using `sheep.config.llm.get_reasoning_llm()`
  - [ ] Implementation uses established utility functions from `src/sheep/content_generators.py`
  - [ ] No source code, test files, or configuration files are modified
  - [ ] File size falls within expected range (250-600 bytes, natural outcome of proper structure)

  ## Implementation Notes

  **Recommended Approach**:
  Use the established utility pattern from `src/sheep/content_generators.py`:
  1. Call `generate_markdown_content()` to obtain H1 heading + prose via Claude API
  2. Call `write_markdown_file(filename, content)` to write file with UTF-8 encoding and validation
  3. Call `validate_markdown_file(filename)` to verify structure and encoding
  4. Call `commit_markdown_file(filename, feature_number)` to stage and commit
  5. Call `push_markdown_file()` to push to feature branch

  **Alternative Approaches** (if utilities unavailable):
  - Manual implementation using pathlib.Path for file I/O
  - Manual git operations via subprocess.run() with git commands
  - Manual validation via regex patterns for heading and sentence detection

  **Key Implementation Details**:
  - Filename must be exactly `test-sdxefr.md` (specified in feature request)
  - Content generated non-deterministically by Claude API (different from all 290+ existing files)
  - File must not exist before creation (check and fail if exists)
  - Commit message must follow conventional format with feature number 291
  - Git push must include upstream tracking (`-u origin HEAD`)

