content: |
  ## Architecture Overview

  Feature 291 leverages the **established markdown file creation architecture** proven across 290+ identical preceding features. The implementation uses the **`create_markdown_file()` orchestration function** from `src/sheep/content_generators.py`, which encapsulates the entire workflow:

  ### 1. Content Generation
  - Calls `generate_markdown_content()` which uses CrewAI LLM framework
  - Invokes Claude API via `sheep.config.llm.get_reasoning_llm()`
  - Generates H1 heading + 2-3 sentences of prose content on flexible topic ("about anything")
  - Ensures each file is unique and contextually appropriate

  ### 2. File Creation & Writing
  - Calls `write_markdown_file(content, filename)` which uses pathlib
  - Creates file in repository root with UTF-8 encoding (no BOM)
  - Validates filename safety (prevents path traversal attacks)
  - Checks file existence and fails explicitly if already present
  - Verifies file size is within expected range (250-600 bytes)

  ### 3. Strict Validation
  - Calls `validate_markdown_file(filepath)` which enforces all success criteria:
    - H1 heading present (regex pattern `^# `)
    - Blank line separator after heading
    - Exactly 2-3 sentences (period counting)
    - UTF-8 encoding without BOM (Byte Order Mark)
    - Unix LF line endings only (no CRLF or CR)
    - Trailing newline present
  - Binary file read optimizes encoding and line-ending checks
  - Structured error messages aid debugging if validation fails

  ### 4. Git Staging & Commit
  - Calls `commit_markdown_file(filepath, content, feature_number=291)`
  - Uses `GitCommitTool` from `sheep.tools` module
  - Stages file with `git add -A`
  - Generates conventional commit message: `feat(291): create markdown file test-sdxefr.md with prose content`
  - Feature number substitution ensures correct scope

  ### 5. Remote Push with Upstream Tracking
  - Calls `push_markdown_file(repo_path)`
  - Uses `GitPushTool` from `sheep.tools` module
  - Determines current branch automatically (`feat/291-markdown-file-creation-420f73`)
  - Executes `git push -u origin <branch>` with upstream tracking enabled
  - Enables future pulls without specifying remote/branch
  - Handles error cases transparently (auth failures, branch conflicts)

  **All complexity is encapsulated in proven utilities.** The feature handler is minimal: a simple Python module that calls `create_markdown_file('test-sdxefr.md', feature_number=291)`.

  ## Key Design Decisions

  ### Decision 1: Use Orchestration Function vs. Manual Implementation

  **Chosen**: Use `create_markdown_file()` orchestration function from content_generators.py

  **Alternatives Considered**:
  - Manual step-by-step implementation: requires sequencing 5 operations, duplicating error handling, less maintainable
  - Custom agent-based approach: unnecessary complexity for straightforward, proven workflow
  - Inline implementation in feature handler: risks losing proven validation patterns

  **Rationale**: The orchestration function is purpose-built for exactly this workflow. Research found it has been validated across 290+ identical preceding features. A single function call minimizes caller complexity, handles all error cases transparently, logs all operations, and returns validation data. This approach matches the established pattern from features 289 and 290, ensuring consistency across the entire feature collection.

  ### Decision 2: Content Generation via LLM vs. Static/Template Approach

  **Chosen**: Use Claude API for LLM-based content generation

  **Alternatives Considered**:
  - Hardcoded static content: inconsistent across 291 files, defeats test artifact purpose, requires constant updates
  - Template-based generation: reduces topic diversity, constrains creativity, not aligned with preceding features
  - Random content selection: unpredictable, potentially incoherent

  **Rationale**: Feature specification explicitly states "about anything", requiring flexible topic selection. LLM generation via Claude API ensures each file is unique and contextually appropriate. CrewAI framework is already integrated in the codebase and proven across 290+ features. This approach maintains diversity across the file collection while ensuring quality.

  ### Decision 3: Strict Validation vs. Lenient Acceptance

  **Chosen**: Strict validation of all success criteria

  **Alternatives Considered**:
  - Lenient validation (accept approximations): risks accepting malformed content, inconsistent quality
  - Skip validation entirely: dangerous, catches generation errors too late

  **Rationale**: Strict validation is required by NFR-2 in the specification. All criteria are clearly defined and achievable. The `validate_markdown_file()` function enforces exact requirements: H1 heading (regex `^# `), blank line separator, exactly 2-3 sentences (period counting), UTF-8 without BOM, Unix LF line endings exclusively, trailing newline, correct file size. Binary file read optimizes encoding/line-ending checks. Catches generation errors before commit, preventing bad data from reaching the repository.

  ### Decision 4: Automatic Push vs. Manual Staging

  **Chosen**: Automatic commit + push via utility functions

  **Alternatives Considered**:
  - Manual git commands: requires subprocess calls, error handling, message formatting, more complex caller code
  - Leave file staged for review: incomplete workflow, requires manual push later, doesn't match established pattern

  **Rationale**: Using `commit_markdown_file()` and `push_markdown_file()` utilities ensures consistency with 290+ preceding features. Automatic conventional commit message formatting prevents errors and maintains standard format across all features. Upstream tracking setup enables future pulls without specifying remote/branch explicitly. GitCommitTool and GitPushTool handle error cases transparently with detailed logging.

  ### Decision 5: Feature Handler Location & Execution Model

  **Chosen**: Create a simple Python module `src/sheep/features/feature_291.py` that calls the orchestration function

  **Alternatives Considered**:
  - Inline handler in test artifacts: mixes concerns, harder to maintain
  - Complex agent-based execution: over-engineered for straightforward workflow
  - No handler (direct API calls): loses encapsulation and error handling

  **Rationale**: A dedicated feature module maintains separation of concerns, is easy to test independently, and follows established patterns from preceding features. The handler is minimal (~10-20 lines) because all complexity is delegated to proven orchestration functions. Clean entry point for feature execution.

  ## Implementation Strategy

  ### Phase 1: Foundation & Utility Verification

  Examine `src/sheep/content_generators.py` to:
  - Confirm `create_markdown_file()` exists with correct signature
  - Verify all dependent utilities exist: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - Understand return values and error handling behavior
  - Document any relevant logging patterns observed

  **Why first**: This phase confirms research findings are accurate. If any utility is missing or differs from research, we discover it before writing implementation code.

  ### Phase 2: Feature Handler Implementation

  Create `src/sheep/features/feature_291.py` that:
  - Imports `create_markdown_file` from `src.sheep.content_generators`
  - Calls `create_markdown_file(filename='test-sdxefr.md', feature_number=291)`
  - Logs the result (filepath, commit message, push details)
  - Returns success status or raises exception on failure

  **Minimal implementation**: Handler is ~15 lines because orchestration function handles all complexity. No duplication of validation, git operations, or error handling.

  ### Phase 3: Execution & Validation

  Execute the feature handler and verify all success criteria:
  - [ ] File `test-sdxefr.md` exists in repository root
  - [ ] File contains H1 heading followed by blank line and 2-3 sentences
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix LF line endings only (verified with hex dump if needed)
  - [ ] File size is 250-600 bytes
  - [ ] `git log --oneline` shows commit: `feat(291): create markdown file test-sdxefr.md with prose content`
  - [ ] Feature branch has upstream tracking: `git branch -vv` shows tracking reference
  - [ ] File is properly tracked by git: `git ls-files` shows the file

  **Parallel checks**: Most validation can occur in parallel after execution completes.

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | `content_generators.py` utilities missing or changed | HIGH | Phase 1 explicitly verifies all required functions exist and confirms signatures. If missing, we have traceback before implementation. Research findings become invalid and require investigation. |
  | Content generation fails (LLM error, API down) | MEDIUM | `validate_markdown_file()` has strict validation that catches formatting errors. LLM failures caught before commit. Structured error messages from CrewAI aid debugging. |
  | File already exists from previous run | LOW | `write_markdown_file()` checks file existence and raises explicit error. Feature is designed to be run once or only if file is removed first. |
  | Git push fails (auth, network, branch conflicts) | MEDIUM | `GitPushTool` handles error cases transparently. Commit will exist in git, but push may fail. Logs detailed error. Can be retried manually or push attempted separately. |
  | Encoding/line-ending issues (CRLF on Windows) | MEDIUM | `validate_markdown_file()` enforces strict UTF-8 + LF validation. Catches issues before commit. pathlib.Path handles OS differences. Binary read prevents encoding issues. |
  | Feature number in commit message wrong | LOW | Feature number (291) is hardcoded in handler, not derived from environment. Phase 3 validation checks git log for correct message scope. |
  | File size out of expected range | LOW | `validate_markdown_file()` checks file size (250-600 bytes). Catches generation errors that produce too little or too much content. |
  | Sentence count validation fails | LOW | Validation counts periods in content. If LLM generates incorrect number of sentences, validation fails before commit. Clear error message indicates sentence count issue. |

  ## Files Impacted

  ### Files to Create
  - **`src/sheep/features/feature_291.py`** — Feature handler that calls orchestration function (minimal, ~15 lines)

  ### Files to Modify
  - None — Feature reuses all existing utilities, makes no changes to source code

  ### Files Created by Feature Execution
  - **`test-sdxefr.md`** — The markdown test artifact (created by `create_markdown_file()`, not by hand)

  ### Git Repository Changes
  - New commit on feature branch `feat/291-markdown-file-creation-420f73` with message `feat(291): create markdown file test-sdxefr.md with prose content`
  - Upstream tracking configured on feature branch
  - File tracked in git after push

  ## No Breaking Changes

  - Implementation does not modify any existing source code
  - No changes to configuration, dependencies, or environment
  - No impact on other features (execution is isolated)
  - Follows established pattern from 290+ preceding features
  - Integrates seamlessly with existing infrastructure

