content: |
  ## Task Execution Flow

  ### Phase 1: Foundation & Utility Verification

  **Purpose**: Confirm all required utilities exist and match research findings.

  1. **task-1** (20min): Read content_generators.py and verify all utilities exist
     - Confirms create_markdown_file() exists
     - Confirms supporting functions exist
     - No surprises that would invalidate research

  2. **task-2** (15min): Deep review of utility signatures and behavior
     - Understand function signatures and return types
     - Understand error handling and logging
     - Trace through orchestration steps

  **Phase 1 Outcome**: Confidence that utilities are available and work as researched.

  ### Phase 2: Feature Handler Implementation

  **Purpose**: Create the minimal handler that calls the orchestration function.

  3. **task-3** (20min): Create src/sheep/features/feature_291.py
     - Import create_markdown_file
     - Call with filename='test-sdxefr.md' and feature_number=291
     - Log and return result
     - ~15-20 lines of code

  4. **task-4** (10min): Verify handler can be imported and called
     - Smoke test to catch any syntax or import errors
     - Confirms handler is callable

  **Phase 2 Outcome**: Feature handler is ready for execution.

  ### Phase 3: Execution & Validation

  **Purpose**: Run the feature and verify all success criteria are met.

  5. **task-5** (10min): Execute handler and verify file creation
     - Run the handler
     - Verify test-sdxefr.md exists
     - Verify file has content

  6. **task-6** (15min): Validate file structure, encoding, line endings
     - Strict validation of all file properties
     - H1 heading, sentences, UTF-8, LF, BOM checks
     - Ensures quality per NFR-2

  7. **task-7** (10min): Verify git commit and push operations
     - Check git log for correct commit message
     - Verify upstream tracking
     - Confirm file is tracked by git
     - Confirm push succeeded

  **Phase 3 Outcome**: Feature is complete and all success criteria verified.

  ## Task Dependencies

  ```
  task-1 (20m) ─┐
                ├─→ task-2 (15m) ─┐
                                   ├─→ task-3 (20m) ─┐
                                                      ├─→ task-4 (10m) ─┐
                                                                        ├─→ task-5 (10m) ─┐
                                                                                          ├─→ task-6 (15m)
                                                                        ├─→ task-7 (10m) ┘
  ```

  Tasks 6 and 7 can run in parallel after task 5 completes (both validate task 5's output).

  ## Time Budget

  | Task | Phase | Effort | Notes |
  | ---- | ----- | ------ | ----- |
  | task-1 | Foundation | 20min | Read and verify utilities |
  | task-2 | Foundation | 15min | Understand utility behavior |
  | task-3 | Implementation | 20min | Create handler (minimal code) |
  | task-4 | Implementation | 10min | Smoke test import and call |
  | task-5 | Execution | 10min | Run handler and verify file exists |
  | task-6 | Execution | 15min | Validate file structure/encoding |
  | task-7 | Execution | 10min | Verify git operations |
  | **LLM API Wait Time** | (task-5) | **3-5 min** | External API, network bound |
  | **Total** | — | **1h 40min** | Includes all verification and validation |

  **Note**: The 3-5 minute LLM API call (in task-5) is included in the total estimate. It is the performance bottleneck but unavoidable (external service latency).

  ## Success Criteria Summary

  All tasks must pass before feature is considered complete:

  ✓ **Phase 1**: Utilities verified to exist and match research
  ✓ **Phase 2**: Feature handler created and importable
  ✓ **Phase 3**: File created, validated, and pushed to git

  Final validation checklist:
  - [ ] test-sdxefr.md exists in repository root
  - [ ] File contains H1 heading + 2-3 sentences
  - [ ] File is UTF-8 without BOM
  - [ ] File uses Unix LF line endings
  - [ ] File size is 250-600 bytes
  - [ ] git log shows `feat(291): create markdown file test-sdxefr.md with prose content`
  - [ ] Feature branch has upstream tracking
  - [ ] File is tracked by git
  - [ ] All tests pass (no failures or warnings)

  ---

  _Task breakdown complete. Ready for implementation phase._
