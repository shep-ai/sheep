# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature implements a minimal markdown file creation following the
  well-established pattern from 210+ test features (100-214) in the Sheep
  platform. The implementation is straightforward: create a single markdown
  file with a fixed structure (H1 heading + blank line + 2-3 sentences of
  generic prose), validate the structure against CommonMark specification,
  and integrate it into version control through a conventional git commit
  and push to remote.

  The feature fits the existing Sheep platform architecture as a simple,
  deterministic file creation task with no code modifications or business
  logic. All required tools (pathlib, GitPython, markdown) are already
  available in the project dependency stack or are part of Python's standard
  library.

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib.Path (Required by NFR-4)

  **Choice:** Use Python standard library pathlib.Path for file creation and path operations.

  **Rationale:** pathlib.Path is the modern, idiomatic Python approach for
  file I/O (Python 3.11+) and is explicitly required by NFR-4. Provides clean
  object-oriented API, readable method calls, cross-platform path handling,
  and is part of standard library. Critical: Path.write_text() with encoding
  and newline parameters handles both UTF-8 encoding (no BOM) and LF line
  endings in a single call, meeting NFR-1 and NFR-2 requirements.

  ### 2. Git Integration: GitPython >= 3.1.0 (Required by NFR-5)

  **Choice:** Use GitPython >= 3.1.0 for git operations (add, commit, push).

  **Rationale:** NFR-5 explicitly requires GitPython >= 3.1.0 and confirms it
  is already in project dependencies. Provides clean Python API for git operations,
  automatic git configuration handling (user.name/user.email), and safe repository
  state management. More robust than subprocess for git workflows.

  ### 3. Markdown Validation: markdown Library (Required by FR-6)

  **Choice:** Use markdown library for pre-commit CommonMark validation.

  **Rationale:** FR-6 explicitly requires validation against CommonMark
  specification before staging the file. markdown library provides standard,
  reliable CommonMark validation. Pre-commit validation (before git add)
  follows defensive best practices: immediate error feedback, prevents invalid
  commits, and is implemented in Python without subprocess overhead.

  ### 4. File Existence Error Handling (Required by FR-5)

  **Choice:** Defensive file-exists check with FileExistsError before creation.

  **Rationale:** FR-5 requires failing with clear error if file already exists.
  Defensive approach prevents accidental overwrites and follows defensive
  programming best practices. Check path.exists() before write_text(), raise
  FileExistsError with descriptive message if file exists.

  ### 5. Encoding Strategy: UTF-8 without BOM (Required by NFR-1)

  **Choice:** Use encoding='utf-8' in pathlib.write_text(), no BOM.

  **Rationale:** NFR-1 requires UTF-8 without BOM. pathlib.write_text(encoding='utf-8')
  creates clean UTF-8 file without BOM (unlike utf-8-sig). Python 3.11+ default
  text encoding is UTF-8. Validation verifies file bytes don't start with BOM
  marker (EF BB BF in hex).

  ### 6. Line Ending Strategy: LF Only (Required by NFR-2)

  **Choice:** Use newline='\n' parameter in pathlib.write_text() to force LF.

  **Rationale:** NFR-2 requires consistent LF (\n) line endings. pathlib.write_text()
  with newline='\n' forces Unix-style line endings regardless of platform,
  ensuring deterministic behavior on Windows/Linux/Mac.

  ### 7. Prose Content: Generic Hardcoded

  **Choice:** Generic placeholder prose consistent with 210+ precedent features.

  **Rationale:** Generic prose maintains consistency with 100-214 precedents,
  ensures deterministic and reproducible output for testing, and avoids unnecessary
  complexity. Generic, topic-agnostic, grammatically correct prose of ~300-350
  bytes fits the 300-500 byte size target.

  ## Implementation Strategy

  The implementation proceeds through two logical phases:

  **Phase 1: File Creation & Validation** — Create the markdown file with proper
  structure, encoding, and line endings, then validate the structure against
  CommonMark specification. This phase ensures the file is well-formed and ready
  for version control.

  **Phase 2: Git Integration & Remote Push** — Stage the file, create a conventional
  commit, and push to remote. This phase integrates the file into version control
  following the established pattern.

  **Why This Order:**
  - Phase 1 establishes the file artifact before committing to version control
  - Validation happens before staging, preventing invalid commits
  - Phase 2 leverages Phase 1 outputs to complete the git workflow
  - This sequence matches the pattern from features 212-214

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists on system | Implement defensive path.exists() check; raise FileExistsError with clear message |
  | Invalid markdown structure | Pre-commit validation using markdown library ensures CommonMark compliance before staging |
  | Incorrect encoding or line endings | Use pathlib.write_text(encoding='utf-8', newline='\\n') explicitly; validate no BOM and LF only |
  | Git push fails | Use GitPython exception handling to catch push errors; report to user |
  | Missing dependencies | Both GitPython and markdown are already in project dependencies |
  | Incorrect commit message format | Use hardcoded message template matching conventional commit format |
  | File not persisted in remote | Verify push operation completes successfully and report status to user |
