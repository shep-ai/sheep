content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple markdown test files following an established pattern. This feature creates a single markdown file (`test-7100re.md`) at the repository root with a title (H1 heading) and 2-3 sentences of prose content. This is a minimal, testable unit that demonstrates file creation, format validation, and git integration workflows.

  This feature is part of the markdown-file-creation pattern established across 210+ test features (features 100-214) in the Sheep project repository. The pattern is straightforward, well-precedented, and serves as a basic building block for testing the automated implementation system.

  ## Success Criteria

  - [ ] File `test-7100re.md` is created in the repository root directory
  - [ ] File contains exactly one H1 heading (single `#` followed by space and title)
  - [ ] File contains exactly one blank line immediately after the H1 heading
  - [ ] File contains 2-3 complete sentences of prose content after the blank line
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF (\n) line endings consistently
  - [ ] File size is between 300-500 bytes (typical for this pattern)
  - [ ] File is not created if it already exists (operation fails with error)
  - [ ] File validates against CommonMark markdown specification before commit
  - [ ] File is staged with `git add test-7100re.md`
  - [ ] Commit is created with conventional commit message: `feat(215): Create markdown file test-7100re.md`
  - [ ] Commit is pushed to remote origin repository
  - [ ] File persists in remote repository after successful push

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named exactly `test-7100re.md` in the repository root directory
  - **FR-2**: File must contain an H1 heading (format: `# Title Text`) as the first line
  - **FR-3**: File must contain exactly one blank line immediately following the H1 heading
  - **FR-4**: File must contain 2-3 complete sentences of prose content after the blank line, separated by newlines
  - **FR-5**: Fail with clear error message if `test-7100re.md` already exists, preventing accidental overwrites
  - **FR-6**: Validate file structure against CommonMark markdown specification before staging
  - **FR-7**: Stage the created file using `git add test-7100re.md`
  - **FR-8**: Create a commit with conventional commit message format: `feat(215): Create markdown file test-7100re.md`
  - **FR-9**: Push the commit to the remote origin repository branch
  - **FR-10**: Return confirmation that file creation and git integration completed successfully

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without Byte Order Mark (BOM)
  - **NFR-2**: File must use LF (\n) line endings consistently throughout (not CRLF or CR)
  - **NFR-3**: File size must be between 300-500 bytes to match the established pattern
  - **NFR-4**: Implementation must use Python pathlib (pathlib.Path) for cross-platform file operations
  - **NFR-5**: Git operations must use GitPython >= 3.1.0 (existing project dependency)
  - **NFR-6**: Git commit must use configured repository user.name and user.email
  - **NFR-7**: Implementation must follow the established pattern from 210+ precedent markdown-file-creation features
  - **NFR-8**: Implementation must not modify any files in `src/`, `tests/`, or other source code directories
  - **NFR-9**: Implementation must not depend on any new external packages beyond existing project dependencies
  - **NFR-10**: Implementation execution time should complete within 60 seconds from start to successful push

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 210+ test markdown files following pattern `test-*.md`
  - Examples: `test-x1h34c.md`, `test-0tyide.md`, `test-k8kqxb.md`, and target file `test-7100re.md`
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`, `Dockerfile`

  **Spec Directory Structure:**
  - `specs/` contains 215+ feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Example: `specs/214-markdown-file-creation-41320b/spec.yaml`
  - This spec is located at: `specs/215-markdown-file-creation-7f44b3/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions for research, implementation, and review
  - `src/sheep/flows/` contains flow orchestration and control logic
  - `src/sheep/config/` contains configuration management (LLM settings, environment)
  - `src/sheep/cli.py` contains CLI entry point

  ### Architecture Patterns

  **Test File Format (210+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-500 bytes
  - Example from existing test file:
    ```markdown
    # The Art of Storytelling

    Storytelling has been a fundamental part of human culture for thousands of years, allowing us to share experiences and wisdom. It provides a powerful mechanism for communicating complex ideas through narrative, making abstract concepts tangible and memorable. Through effective storytelling, we create meaningful bonds with audiences and inspire them to think and feel.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-7100re.md`
  - All files stored in repository root directory

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename>`
  - Changes are pushed to feature branch `feat/###-<feature-name>`
  - All 210+ preceding features follow this exact pattern successfully

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default)
  - Supports Path.open() for controlled encoding and line ending handling

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)
  - Validates easily with markdown parsers (e.g., markdown library)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/215-markdown-file-creation-7f44b3`
  - GitPython library (already in project dependencies) simplifies git operations
  - No specialized libraries or complex git workflows required

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components to implement)
  - Follows the CrewAI agent/task/tool paradigm for implementation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new markdown file to existing collection of 210+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-450 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-214; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Python 3.11+ standard library (pathlib for file operations)
  - Git executable (for staging, committing, pushing changes)
  - GitPython >= 3.1.0 (already in project dependencies for git operations)
  - Git repository with feature branch `feat/215-markdown-file-creation-7f44b3` (pre-created)

  **Existing Infrastructure:**
  - Git repository with configured user.name and user.email (already set in project)
  - Remote origin repository configured for pushing changes
  - Write access to repository root directory (already available)
  - Conventional commit workflow (established pattern in project)

  **Reference/Precedent:**
  - 210+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-214) demonstrate successful execution of identical pattern
  - Features 151-214 specs provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small)** — This is a minimal feature with straightforward scope:

  **Justification:**
  Creating a single markdown file with fixed structure (H1 + blank line + 2-3 sentences) is trivial file creation. With 210+ precedent features (100-214) already completed, the pattern is well-established and requires no architectural decisions. Implementation involves: (1) Create file with pathlib, (2) Write markdown content (generic prose), (3) Validate against CommonMark, (4) Git add/commit/push using existing tools. Estimated effort: 30-60 minutes including validation and testing. No complex logic, no dependency changes, no architectural impact.

  **Effort Breakdown:**
  - **File creation and content composition**: 5-10 minutes
  - **Markdown validation**: 2-3 minutes
  - **Git workflow (add/commit/push)**: 5-10 minutes
  - **Testing and verification**: 5-10 minutes
  - **Total**: 30-60 minutes of actual work

  ---

  _Requirements phase complete — comprehensive functional and non-functional requirements defined, all product decisions resolved with AI-recommended answers structured for user review, implementation approach clear from precedent features_
