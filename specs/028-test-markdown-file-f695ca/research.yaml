    rationale: >
      Counting '. ' (period-space) in the content below the H1 heading provides a
      reasonable approximation of sentence count for the 2-3 sentence requirement.
      This avoids complex NLP and stays true to the established pattern in the repository
      which validates basic structure without heavy dependencies. For content written by
