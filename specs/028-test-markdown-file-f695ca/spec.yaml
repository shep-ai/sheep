  ## Codebase Analysis

  ### Project Structure

  The repository is part of the "Sheep" agentic platform project with the following key directories:

  - **Repository Root**: Contains markdown files created as features (e.g., `test-quk4of.md`, `weather-forecasting-vhiwx5.md`, `cloud-computing-xwbxsh.md`)
