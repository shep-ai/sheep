  ### Architecture Patterns

  The repository demonstrates a simple feature implementation pattern:

  1. **Feature-Driven Development**: Each feature creates a markdown file with minimal content
  2. **Test-First Validation**: Every feature has corresponding pytest tests that validate:
     - File existence in the repository root
     - Presence of H1 heading (markdown title starting with `# `)
     - Content relevance (tests check for domain-specific keywords)
     - File quality (under 80 lines, ends with newline)
  3. **Specification-Driven**: Each feature has a spec.yaml file that documents requirements
  4. **Git Workflow**: Features use conventional branch naming (`feat/<number>-<feature-name>`)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pytest**: Testing framework with async support (pytest-asyncio)
  - **pathlib**: Standard library for file path operations and validation
  - **ruff**: Code linter configured in pyproject.toml with specific rules (line length 100)
  - **pydantic**: For configuration management (listed in dependencies)

