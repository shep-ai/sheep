# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file named `test-o3vbhn.md` in the repository root containing:
  - An H1 heading (markdown title with `# `)
  - 2-3 sentences of descriptive content

  Additionally, create a comprehensive pytest test file that validates the markdown file meets all requirements. This feature follows the established pattern in the repository for simple markdown file creation with accompanying validation tests.

  ## Success Criteria

  - [ ] Markdown file `test-o3vbhn.md` exists at repository root (same level as `test-quk4of.md`, `weather-forecasting-vhiwx5.md`)
  - [ ] File contains exactly one H1 heading (line starting with `# `)
  - [ ] File contains 2-3 sentences of textual content below the heading
  - [ ] File ends with a single newline character (no trailing whitespace)
  - [ ] File is under 80 lines (code quality constraint)
  - [ ] Pytest test file `test_test_markdown_file.py` exists in `/tests` directory
  - [ ] All test functions pass without errors (minimum 5 test functions covering: file existence, H1 presence, sentence count, content quality, line count)
  - [ ] All code passes ruff linting with no errors or warnings
  - [ ] Changes are committed with conventional commit message following `feat(content): add test-o3vbhn.md markdown file` pattern
  - [ ] All existing tests continue to pass (no regression)

  ## Functional Requirements

  - **FR-1**: Create markdown file `test-o3vbhn.md` in repository root
  - **FR-2**: File must contain an H1 heading (markdown title with single `#`)
  - **FR-3**: File must contain 2-3 sentences of content describing the chosen topic
  - **FR-4**: Create pytest test file `test_test_markdown_file.py` in `/tests` directory
  - **FR-5**: Test file must validate markdown file existence using `pathlib.Path`
  - **FR-6**: Test file must validate presence of H1 heading by checking file content
  - **FR-7**: Test file must validate sentence count (2-3 sentences below the heading)
  - **FR-8**: Test file must validate file ends with newline character
  - **FR-9**: Test file must validate file is under 80 lines
  - **FR-10**: All tests must pass without errors

  ## Non-Functional Requirements

  - **NFR-1**: Code Style — File must end with newline and have no trailing whitespace (Unix convention)
  - **NFR-2**: Linting Compliance — All code must pass ruff linting with line length limit of 100 characters
  - **NFR-3**: Test Coverage — Tests must cover all critical file properties (existence, structure, content, quality)
  - **NFR-4**: Consistency — Implementation must follow the exact pattern used in features 026 (weather-forecasting) and test-quk4of
  - **NFR-5**: Maintainability — Test function names must be descriptive and follow `test_<feature>_<property>` naming pattern
  - **NFR-6**: Performance — No performance requirements; this is a content-only feature with negligible impact
  - **NFR-7**: Documentation — Test functions should have docstrings explaining what they validate (following pytest conventions)
  - **NFR-8**: Git Workflow — Changes must be committed to the `feat/028-test-markdown-file-f695ca` branch with conventional commit message

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the markdown content address? | Technical topic (Python, testing, software) | Maintains consistency with repository focus (Sheep agentic platform, Python testing). Aligns with related features. Reduces implementation uncertainty. |
  | 2 | Should test assertions be comprehensive or minimal? | Comprehensive assertions (multiple checks per test) | Follows established pattern from features 026 and test-quk4of. Catches more potential issues while maintaining reasonable code complexity. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | Primary artifact - new markdown file `test-o3vbhn.md` will be created here alongside existing feature markdown files |
  | `/tests` Directory | Medium | Test file `test_test_markdown_file.py` will be created following the established testing pattern |
  | `/specs/028-test-markdown-file-f695ca/` | Low | This requirements specification will be documented here (spec.yaml) |
  | Git History | Low | A single commit will be added with the new files |

  ## Dependencies

  **External Dependencies**:
  - pytest (already in dev dependencies under `[project.optional-dependencies]`)
  - Python 3.11+ (project requirement, from pyproject.toml)
  - pathlib (standard library, no installation needed)

  **Related Code Patterns**:
  - Test pattern from `tests/test_cloud_computing_timeline.py` and `tests/test_weather_forecasting_guide.py`
  - Markdown file examples: `weather-forecasting-vhiwx5.md`, `cloud-computing-xwbxsh.md`, `test-quk4of.md`
  - Test naming convention: `test_<feature_name>.py` with functions like `test_file_exists()`, `test_has_heading()`, etc.

  **File Size Context**:
  - Markdown file: approximately 5-10 lines (H1 + 2-3 sentences)
  - Test file: approximately 30-40 lines (5+ test functions with docstrings)

  ## Size Estimate

  **S** — A few hours maximum. This is a trivial feature requiring only:
  - Creation of one markdown file with a title and 2-3 sentences (~5-10 lines)
  - Creation of one pytest test file with 5-6 test functions (~30-40 lines including docstrings)
  - No code changes to the application or build system
  - Tests are straightforward file validation checks following established patterns
  - Full implementation complexity: low; pattern-driven development with clear success criteria

