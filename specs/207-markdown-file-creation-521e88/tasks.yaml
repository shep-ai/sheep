content: |
  ## Summary

  Feature 207 implementation consists of 16 tasks across 4 phases totaling 3h 15min of effort.

  **Phase 1 (Foundation & Content Generation — 4 tasks, ~1h 15min):**
  Sets up the feature module with proper structure, imports, and constants, then implements Claude API integration for title generation, prose generation with sentence validation, and markdown file creation with proper encoding and line endings.

  **Phase 2 (Comprehensive Validation — 6 tasks, ~55min):**
  Implements six dedicated validation functions following the heuristic validation pattern: markdown format (H1 and blank line checks), UTF-8 encoding validation (BOM rejection), line-ending validation (CRLF/CR rejection), sentence count validation (2-3 sentences via period counting), file size validation (soft warnings), and orchestration function that calls all validators in sequence for comprehensive failure reporting.

  **Phase 3 (Git Integration & Orchestration — 4 tasks, ~45min):**
  Implements git add, commit, and push operations via secure subprocess calls, then creates the main() orchestration function that coordinates complete workflow: generation → validation → git operations with comprehensive error handling and logging.

  **Phase 4 (Testing & Verification — 2 tasks, ~35min):**
  Writes integration tests for complete workflow and determinism tests to verify that temperature=0 produces identical output across repeated invocations.

  **Key Design Patterns:**
  - Each validation function is independent (single responsibility principle)
  - All validators called in sequence with fail-fast behavior (first failure stops execution)
  - Git operations preserve error context via CalledProcessError
  - Comprehensive logging at each step enables rapid debugging
  - TDD approach: RED (test first), GREEN (minimal implementation), REFACTOR (improve)
