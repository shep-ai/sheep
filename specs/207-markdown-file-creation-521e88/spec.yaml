content: |
  ## Problem Statement

  Create a single markdown file named `test-5q8o2a.md` in the repository root directory containing a markdown H1 title and exactly 2 or 3 grammatically complete sentences of prose content on any topic. The file must be committed with a conventional commit message following the format `feat(207): [short description]` and pushed to the remote branch `feat/207-markdown-file-creation-521e88`. This task continues the series of similar file creation workflows implemented in features 200-206, demonstrating the Sheep platform's capability to execute deterministic file creation operations following established patterns and conventions.

  ## Success Criteria

  - [ ] File `test-5q8o2a.md` exists at repository root after execution
  - [ ] File contains exactly one H1 markdown title (pattern: `# [Title Text]`)
  - [ ] File contains exactly 2 or exactly 3 grammatically complete sentences after the title
  - [ ] Each sentence ends with a period (.) and sentences are separated by spaces or newlines
  - [ ] Title and prose content are separated by a blank line
  - [ ] No markdown syntax errors detected by heuristic validation
  - [ ] File is staged to Git with `git add test-5q8o2a.md`
  - [ ] File is committed with message matching pattern `feat(207): [description]` (verified by `git log`)
  - [ ] Commit is pushed to remote branch `feat/207-markdown-file-creation-521e88` (verified by `git branch -r`)
  - [ ] File encoding is UTF-8 (without BOM)
  - [ ] Line endings are LF (Unix-style, not CRLF)
  - [ ] File size is within expected range 200-700 bytes (soft validation; warnings logged if outside)
  - [ ] Content topic is freely chosen by Claude (any topic is acceptable)
  - [ ] Implementation follows the feature module pattern from features 200-206
  - [ ] All functions use proper logging via `sheep.observability.logging.get_logger()`
  - [ ] Implementation includes dedicated validation functions (not inline checks)

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-5q8o2a.md` in the repository root directory (verified by pathlib.Path)
  - **FR-2**: File must contain exactly one valid markdown H1 title (single `#` followed by title text and newline)
  - **FR-3**: File must contain exactly 2 or exactly 3 grammatically complete sentences (each ending with a period)
  - **FR-4**: Sentences must be separated from the title by a blank line; sentences separated from each other by single spaces or newlines
  - **FR-5**: All file content must follow markdown syntax conventions (valid UTF-8, proper spacing, no syntax errors)
  - **FR-6**: Stage the new file in Git using `git add test-5q8o2a.md` with proper error handling
  - **FR-7**: Create a commit with a conventional commit message following the format: `feat(207): [short description]` per conventional commits specification
  - **FR-8**: Push the commit to the remote branch `feat/207-markdown-file-creation-521e88` using `git push -u origin HEAD` with error handling
  - **FR-9**: Generate prose content using Claude API with temperature=0 for deterministic output
  - **FR-10**: Validate file existence, format, encoding, and line endings before committing; fail fast on validation errors

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors (GitHub, CommonMark)
  - **NFR-4**: Git commit message must follow conventional commits specification (feat scope, lowercase description, imperative mood)
  - **NFR-5**: Implementation must follow feature module pattern and conventions from features 200-206 (dedicated module, organized functions, error handling)
  - **NFR-6**: No external dependencies required beyond existing project infrastructure (Git, Python pathlib, Claude API via sheep.config.llm)
  - **NFR-7**: Content generation must use Claude API with temperature=0 for deterministic and consistent output
  - **NFR-8**: File size should be in range 200-700 bytes; log warnings if outside but allow commit to proceed
  - **NFR-9**: Implementation must include comprehensive validation functions with clear error messages on failure
  - **NFR-10**: All functions must have proper logging via `sheep.observability.logging.get_logger()` per project standards
  - **NFR-11**: Validation failures must be reported with clear, actionable error messages to aid debugging

  ## Product Decisions Made

  | # | Question | Decision | Rationale |
  | - | -------- | -------- | --------- |
  | 1 | Content topic selection | Freely chosen by Claude | Matches spec requirement of \"any topic\", provides natural variety, simpler to implement, maintains determinism via temperature=0 |
  | 2 | Validation failure handling | Fail fast and require manual intervention | Aligns with feature module pattern from 200-206, easier to debug, makes failures transparent, avoids hidden content modifications |
  | 3 | File size validation approach | Soft validation (warn but allow) | Provides observability without blocking, aligns with estimate nature of size constraints, maintains logging standards |
  | 4 | Markdown format validation | Heuristic validation (regex/pattern matching) | No external dependencies, simple to implement, catches formatting errors, maintains established patterns |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | This feature creates a markdown file (test-5q8o2a.md) directly in the repository root, following the pattern established by features 200-206 |
  | src/sheep/features/ | High | New feature module (feature_207_markdown_file_creation.py) will be created following the established pattern, with generation, validation, and git operation functions |
  | Git Workflow | Medium | New file must be staged, committed with conventional message format, and pushed to remote branch feat/207-markdown-file-creation-521e88 |
  | specs/ | Low | Specification already documented; no code changes required |

  ## Dependencies

  **No external dependencies required beyond existing project infrastructure.** This feature depends on:

  1. **Git** - For staging, committing, and pushing the new file via subprocess
  2. **File I/O** - Standard file creation and encoding via `pathlib.Path` (Python built-in)
  3. **Markdown format** - Plain text markdown, no special libraries needed
  4. **Claude API** - Via existing `sheep.config.llm.create_llm()` with temperature=0 for deterministic content generation
  5. **Existing repository structure** - Uses established root directory convention and feature module pattern
  6. **Logging infrastructure** - Via `sheep.observability.logging.get_logger()` per NFR-10
  7. **Subprocess module** - For git command execution with proper error handling

  ## Size Estimate

  **S** (1-2 hours) — This is a straightforward file creation task requiring minimal effort.
  The implementation involves:

  1. Create feature module (feature_207_markdown_file_creation.py) following patterns from features 200-206
  2. Implement prose content generation using Claude API with temperature=0
  3. Implement validation functions (file existence, markdown format via heuristic validation, sentence count, encoding, line endings, file size with soft validation)
  4. Implement git operations (add, commit with conventional message, push with error handling)
  5. Create main orchestration function coordinating all steps with proper logging and error handling

  No code modification to existing files, no new external dependencies, straightforward integration. Estimated effort: 1-2 hours including testing and validation, following established patterns.

  ---

  _Requirements phase completed — ready for implementation phase_
