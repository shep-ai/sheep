name: "markdown-file-create"
summary: >
  Technical implementation uses Python pathlib for safe file I/O with UTF-8 encoding, subprocess for git workflows,
  and hardcoded prose content matching the established pattern from 100+ existing test files. No external dependencies
  required; all operations use Python 3.11+ standard library. File format is strictly replicated from features 121-124:
  markdown H1 heading + blank line + exactly 2-3 sentences, 400-600 bytes, Unix LF line endings.

