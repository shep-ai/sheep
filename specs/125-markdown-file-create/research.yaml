decisions:
  - title: "File I/O Library and Approach"
    chosen: "Python pathlib.Path.write_text() with UTF-8 encoding"
    rejected:
      - "open() built-in function — less elegant, requires manual resource management, more verbose for simple write operations"
      - "os.path for file operations — deprecated in favor of pathlib, less object-oriented, requires additional modules"
      - "Third-party libraries (e.g., fs) — introduces external dependency, unnecessary complexity for simple file creation"
    rationale: >
      pathlib.Path.write_text() is the modern, recommended approach for simple file writing in Python 3.11+.
      It automatically handles file creation, closing, and encoding, provides a clean object-oriented API,
      and is safer than string-based paths against path traversal attacks. All existing features 121-124 use this
      exact approach, establishing a clear codebase pattern. No external dependencies are required, keeping the
      implementation pure Python standard library.

  - title: "Content Generation Strategy"
    chosen: "Hardcoded prose content matching established pattern"
    rejected:
      - "Algorithmic/template-based generation — adds complexity, harder to maintain consistency with 100+ existing files"
      - "External APIs for content (GPT, etc.) — introduces external dependencies, network latency, API costs, unreliability"
      - "Random permutations of sentence templates — may produce less coherent prose, harder to validate"
    rationale: >
      Each existing test file (121-124 and 100+ others) contains a single, carefully crafted prose string that is
      coherent, grammatically correct, and topically appropriate. Hardcoding the prose for test-g4d3am.md matches
      this established pattern, ensures content quality without external dependencies, and is consistent with the
      product decision to use auto-generated content (which in this context means pre-written, structured content
      rather than runtime generation). This approach is proven effective across existing implementations.

  - title: "Topic and Title Selection"
    chosen: "Single topic selected during implementation phase"
    rejected:
      - "Random topic selection at runtime — adds complexity, requires topic list maintenance, harder to validate"
      - "User input/configuration — violates requirement of self-contained file creation, introduces input validation"
      - "Topic list from external source — introduces external dependency, network calls, maintenance burden"
    rationale: >
      The spec allows any topic unrestricted. Looking at features 121-124, each file covers a distinct topic
      (Sleep, AI/ML, Debugging, Patience) with no apparent constraint or randomization. The simplest approach is
      to select a meaningful topic during implementation planning and hardcode the corresponding prose. This matches
      the established pattern where each feature creates one file with one topic. Topic selection flexibility is
      preserved by allowing any topic choice during implementation.

  - title: "Git Workflow Implementation"
    chosen: "subprocess.run() with explicit git commands (shell=False)"
    rejected:
      - "GitPython library — external dependency, adds abstraction layer, unnecessary for simple operations"
      - "Shell execution (shell=True) — security risk for injection, harder to debug, not portable"
      - "Manual git plumbing — overly low-level, error-prone, no benefit over subprocess"
    rationale: >
      subprocess.run() with explicit command array (shell=False) is the secure, standard Python approach for
      executing git commands. It avoids shell injection vulnerabilities, provides clear error handling via
      returncode and stderr, and requires no external dependencies. All existing features 121-124 use this exact
      pattern (confirmed in git_workflow_089.py and similar implementations). Three operations are required:
      git add, git commit, git push.

  - title: "Content Validation Approach"
    chosen: "Post-write validation of structure, encoding, line endings, and file size"
    rejected:
      - "No validation — risks non-conformant files, makes debugging harder, violates non-functional requirements"
      - "Complex pre-write validation — unnecessary complexity, validation is simpler after file creation"
      - "External validation tool — adds dependency, slower than in-process validation"
    rationale: >
      After writing the file with pathlib.Path.write_text(), validate: (1) structure (H1 heading, blank line,
      2-3 sentences), (2) encoding (UTF-8, no BOM), (3) line endings (LF only), (4) file size (400-600 bytes).
      This matches the validation pattern in existing test files (e.g., create_test_2ak324.py). Python string
      operations verify structure, binary operations verify encoding/line endings, len() validates size. All
      validation is performed locally without external tools.

  - title: "Markdown Validation"
    chosen: "Structural validation (H1 heading, blank line, sentence count)"
    rejected:
      - "Full CommonMark parser library — overkill for simple validation, adds external dependency"
      - "No markdown validation — risks invalid markdown, difficult to debug"
      - "Regex-based validation — fragile, harder to maintain than direct string operations"
    rationale: >
      The markdown format is simple: line 1 is H1 heading (starts with '# '), line 2 is blank, lines 3+ are prose.
      Validation checks: (1) lines[0].startswith('# '), (2) lines[1] == '', (3) count periods in prose section to
      verify 2-3 sentences. This straightforward string-based approach is used in all existing implementations and
      is sufficient for the constrained markdown format. No external parser library is needed.

  - title: "Error Handling Strategy"
    chosen: "Explicit exception raising with descriptive messages"
    rejected:
      - "Silent failures — makes debugging impossible, violates non-functional requirement of clean state validation"
      - "Generic Exception types — harder to distinguish between types of failures"
      - "sys.exit() without messages — poor user feedback"
    rationale: >
      All operations (file creation, validation, git commands) should raise descriptive ValueError, RuntimeError,
      or OSError exceptions with specific details (e.g., 'Expected 2-3 sentences, found 4'). This allows the caller
      to distinguish failures and provides clear diagnostics. The main() function catches exceptions and returns
      non-zero exit code on failure. This pattern is used consistently in existing feature implementations.

