content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files following an established pattern. This feature creates a single test markdown file
  (test-g4d3am.md) at the repository root with a title and prose content, demonstrating
  automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 121-124, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File test-g4d3am.md is created in repository root directory
  - [ ] File contains a markdown level-1 heading (# format) with a meaningful title
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF (Unix) line endings
  - [ ] File size is 400-600 bytes (consistent with features 121-124)
  - [ ] Blank line exists between heading and prose content
  - [ ] File is staged in git via `git add test-g4d3am.md`
  - [ ] Git commit created with exact message: "feat(125): create markdown file test-g4d3am.md with prose content"
  - [ ] Commit is pushed to remote on feature branch feat/125-markdown-file-create
  - [ ] Repository shows clean working tree after push
  - [ ] Prose content is coherent and grammatically correct
  - [ ] Markdown syntax is valid and parseable

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly "test-g4d3am.md" in repository root directory
  - **FR-2**: File must begin with markdown level-1 heading (# Title) containing a meaningful, topic-appropriate title
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading
  - **FR-4**: Insert blank line between heading and prose content
  - **FR-5**: Stage created file using `git add test-g4d3am.md`
  - **FR-6**: Create commit with conventional commit format: "feat(125): create markdown file test-g4d3am.md with prose content"
  - **FR-7**: Push commit to remote on feature branch feat/125-markdown-file-create
  - **FR-8**: Verify successful push and clean repository state after completion

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without byte-order mark (BOM)
  - **NFR-2**: File must use LF (Unix) line endings, not CRLF
  - **NFR-3**: File size must be 400-600 bytes, consistent with established pattern from features 121-124
  - **NFR-4**: Markdown syntax must be valid and parseable by standard markdown parsers
  - **NFR-5**: Prose content must be coherent, grammatically correct, and semantically meaningful
  - **NFR-6**: Implementation must follow established pattern conventions from features 121-124 (format, structure, naming)
  - **NFR-7**: Git operations must follow conventional commit specification (scope, type, message)
  - **NFR-8**: Implementation must not modify any files other than test-g4d3am.md
  - **NFR-9**: No dependencies on application source code (/src/sheep/) or configuration files

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose be auto-generated or manually written? | Auto-generated content | Aligns with automated implementation system purpose, ensures consistency with features 121-124, and scales efficiently |
  | 2 | Should topic selection be constrained or unrestricted? | Any topic unrestricted | Specification explicitly states "about any topic", maximizes flexibility, and established pattern demonstrates successful topic variability |
  | 3 | Should implementation strictly replicate features 121-124? | Strict pattern replication | 100+ test files establish clear convention, consistency critical for test suite integrity, specification explicitly references identical pattern |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-g4d3am.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-124; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/125-markdown-file-create` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (121-124) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria specified, product decisions documented with AI recommendations_
