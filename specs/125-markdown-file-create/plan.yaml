# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the proven pattern established by features 121-124, which already created 100+ test markdown
  files in the repository using an identical approach. The implementation is deliberately simple and self-contained:

  1. **File Creation:** Use Python pathlib.Path.write_text() to create test-g4d3am.md with UTF-8 encoding
  2. **Content:** Hardcoded prose (H1 title + blank line + 2-3 sentences) matching established pattern
  3. **Validation:** Post-write verification of structure, encoding, line-endings, and file size
  4. **Git Integration:** Use subprocess.run() for git add/commit/push operations
  5. **Error Handling:** Raise descriptive exceptions on validation or git failures

  This approach requires zero external dependencies and is consistent with all prior implementations.

  ## Key Design Decisions

  ### 1. File I/O Approach: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-g4d3am.md').write_text(content, encoding='utf-8')`

  **Why:**
  - Modern Python idiom (built-in since 3.4)
  - Automatically handles file creation, closing, and encoding
  - Safer than string-based paths (prevents path traversal)
  - All features 121-124 use this exact pattern
  - Zero external dependencies

  **Alternatives considered:**
  - open() function: More verbose, requires manual resource management
  - os.path: Deprecated in favor of pathlib, less object-oriented
  - Third-party libraries: Unnecessary complexity

  ### 2. Content Strategy: Hardcoded Prose

  **Chosen:** Single, pre-written prose string matching established 100+ file pattern

  **Why:**
  - Each of 100+ existing test files contains carefully-crafted, coherent prose
  - Guarantees consistent quality without external APIs or generation complexity
  - No runtime dependencies (no GPT/algorithmic generation)
  - Exactly matches product decision from spec: "auto-generated content" interpreted as pre-written, structured content
  - Proven effective across features 121-124

  **Content format:**
  ```
  # Title Here

  Sentence one. Sentence two. Sentence three.
  ```

  **Characteristics:**
  - Exactly 2-3 sentences (count periods)
  - Meaningful, topically appropriate title
  - Grammatically correct, coherent prose
  - Total file size 400-600 bytes (fits requirement)
  - No trailing blank line

  ### 3. Git Workflow: subprocess.run() with shell=False

  **Chosen:** Three-step subprocess.run() with explicit command arrays

  ```python
  subprocess.run(["git", "add", "test-g4d3am.md"])
  subprocess.run(["git", "commit", "-m", "feat(125): create markdown file test-g4d3am.md with prose content"])
  subprocess.run(["git", "push", "-u", "origin", "HEAD"])
  ```

  **Why:**
  - Standard library, no external dependencies
  - shell=False prevents shell injection vulnerabilities
  - Explicit command arrays are portable and clear
  - All features 121-124 use this exact pattern
  - Error handling via returncode checks

  **Alternatives considered:**
  - GitPython: Unnecessary abstraction, adds external dependency
  - Shell execution (shell=True): Security risk, harder to debug
  - Manual git plumbing: Too low-level, no benefit

  ### 4. Validation Approach: Modular Post-Write Checks

  **Chosen:** Validate after writing using separate functions for each concern

  **Structure validation** (string operations):
  - H1 heading: `lines[0].startswith('# ')`
  - Blank separator: `lines[1] == ''`
  - Sentence count: Count periods (should be 2-3)

  **Encoding validation** (binary operations):
  - UTF-8 without BOM: Check file doesn't start with `b'\xef\xbb\xbf'`
  - Unix LF line-endings: Check file contains no `b'\r\n'`

  **Size validation**:
  - Range check: `400 <= len(bytes) <= 600`

  **Why this approach:**
  - Clear separation of concerns
  - Simple logic for constrained markdown format
  - No external parsing libraries needed
  - Fast and deterministic
  - Used in all existing implementations

  **Alternatives considered:**
  - Full CommonMark parser: Overkill for simple H1 + blank + prose format
  - No validation: Violates non-functional requirements, makes debugging harder
  - Regex validation: Fragile and harder to maintain

  ### 5. Error Handling: Explicit Exceptions with Context

  **Chosen:** Raise descriptive exceptions immediately on failure

  **Examples:**
  - `ValueError("Expected 2-3 sentences, found 4")`
  - `ValueError("File uses CRLF line endings, expected LF")`
  - `RuntimeError("git commit failed: <stderr>")`

  **Why:**
  - Clear diagnostics for troubleshooting
  - Allows caller to distinguish failure types
  - Follows Python exception conventions
  - Used in all existing implementations

  ## Implementation Strategy

  ### Phase 1: File Creation & Content Validation (2 tasks)

  1. **Create test-g4d3am.md** with hardcoded prose content
     - Use pathlib.Path.write_text() with UTF-8 encoding
     - Write H1 title + blank line + 2-3 sentences
     - No trailing blank line

  2. **Validate file meets all requirements**
     - Structure: H1 heading, blank line, exactly 2-3 sentences
     - Encoding: UTF-8 without BOM
     - Line endings: Unix LF only
     - Size: 400-600 bytes

  ### Phase 2: Git Integration & Verification (1 task)

  3. **Commit and push to remote**
     - Stage file with `git add test-g4d3am.md`
     - Commit with message: `"feat(125): create markdown file test-g4d3am.md with prose content"`
     - Push to feature branch
     - Verify clean working tree

  ### Why This Order

  - Phase 1 must complete first: Creates and validates file before git integration
  - Phase 2 depends on Phase 1: File must exist and be valid before staging/committing
  - Clear separation: Content validation separate from git workflow
  - Mirrors features 121-124 structure and proves pattern

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | File already exists at target path | Low | Check that test-g4d3am.md does not exist before writing; feature branch is fresh for this feature |
  | Prose content too long (>600 bytes) | Very low | Pre-write content calculation; validate size post-write; established pattern provides reference range |
  | Git operations fail (user.name not set, no network) | Low | Validation assumes git is configured and accessible; match environment assumptions from features 121-124 |
  | Encoding mismatch (CRLF on Windows) | Low | Explicitly write with UTF-8, validate for LF; Python pathlib handles platform differences |
  | Markdown structure invalid | Very low | Simple structure (3 lines, 2-3 sentences); extensive validation catches issues immediately |
  | Prose contains non-UTF-8 characters | Very low | Use ASCII/Unicode characters in pre-written prose; validated at write time |

