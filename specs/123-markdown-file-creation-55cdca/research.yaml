content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-20

  ## Technology Decisions

  ### 1. Module Architecture: Dedicated Feature Module

  **Chosen:** Create `feature_123_markdown_file_creation.py` in `src/sheep/` following established pattern

  **Architecture Pattern:**
  The codebase establishes a clear module pattern with 122+ examples (features 001-122). Each markdown-file-creation feature:
  - Creates a dedicated module (e.g., `feature_116_markdown_file_creation.py`)
  - Defines `FEATURE_NUMBER` and `FILENAME` as module constants
  - Implements task functions: `task_2_generate_markdown_content()` and `task_3_write_markdown_file_to_disk()`
  - Provides a `main()` function that orchestrates the workflow
  - Imports from `sheep.content_generators` to reuse proven functions
  - Uses structured logging via `sheep.observability.logging.get_logger()`

  **Reference Implementation:** See `src/sheep/feature_116_markdown_file_creation.py` (lines 1-135) — shows exact structure to replicate for feature 123.

  **Module Configuration:**
  ```python
  FEATURE_NUMBER = 123
  FILENAME = "test-b3x0s1.md"
  ```

  ### 2. Content Generation: LLM-Based Random Topic

  **Chosen:** Use `generate_markdown_content()` from content_generators module (random topic)

  **How It Works:**
  The existing function (`content_generators.py` lines 27-68) uses CrewAI's LLM framework to:
  - Call Claude API via `get_reasoning_llm()` (configured in `config/llm.py`)
  - Send a flexible prompt that encourages any-topic generation (MARKDOWN_GENERATION_PROMPT, lines 13-24)
  - Return markdown string: `# Heading\n\n<sentences>`
  - Automatically add trailing newline (line 57-58)
  - Validate format via `_validate_markdown_content()` (lines 71-98)

  **Why Not Constrain Topic:** The user query says "about anything", spec endorses random generation, and 122+ existing test files likely already validate diverse topics. Adding constraints reduces test coverage.

  ### 3. Sentence Validation: Validate Before File Creation

  **Chosen:** Validate sentence count before calling `write_markdown_file()`

  **Validation Approach:**
  The existing `_validate_markdown_content()` function (lines 71-98) counts periods to verify 2-3 sentences. Implementation should:
  1. Call `generate_markdown_content()` (includes internal validation)
  2. Verify the returned content is valid
  3. Only then call `write_markdown_file(content, filename)`
  4. If validation fails, raise exception with clear message

  **Rationale:** Sentence count is a hard requirement (FR-4, success criterion). Early validation prevents invalid files. The existing module functions already implement this correctly.

  ### 4. File Conflict Handling: Fail if File Exists

  **Chosen:** Raise exception if `test-b3x0s1.md` already exists before creation

  **Implementation:**
  The existing `write_markdown_file()` function doesn't check for pre-existing files. Feature implementation should add a check (2 lines):
  ```python
  if (repo_root / filename).exists():
      raise ValueError(f"File already exists: {filename}")
  ```
  Place this check in feature_123 orchestration (in task_3) before calling write_markdown_file().

  **Why Fail:** Each feature creates exactly one unique test file. If file exists, something is wrong (duplicate run, branch conflict, manual creation). Failing fast makes this visible.

  ### 5. Git Workflow: Use Existing Git Tools

  **Chosen:** Use `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`

  **Git Workflow:**
  The existing `commit_markdown_file()` and `push_markdown_file()` functions handle all git operations:
  - Stage with `git add -A` (via GitCommitTool, line 232)
  - Commit with provided message (line 234)
  - Push with upstream tracking (via GitPushTool, line 281)

  **Commit Message Format:**
  Use exactly: `feat(123): Create markdown file test-b3x0s1.md with prose content (#192)`
  - Follows conventional commits convention
  - Feature number in scope: `feat(123)`
  - Exact filename: `test-b3x0s1.md`
  - PR/issue reference: `#192`

  **Feature Implementation Options:**
  - Option A: Call `create_markdown_file(filename, repo_path)` (content_generators.py line 363) — orchestrates all steps in one call
  - Option B: Call tasks individually (generate, write, validate, commit, push) — more explicit, matches feature_116 pattern

  **Recommendation:** Option B (individual tasks) follows established feature_116 pattern and provides clearer control flow, though Option A (create_markdown_file) is simpler. For consistency with 122+ features, use Option B.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | CrewAI 0.86.0+ | LLM orchestration & Claude API integration | **Use existing** | Already in pyproject.toml dependencies; generate_markdown_content() uses CrewAI's LLM framework; no new version needed |
  | Anthropic Claude API | LLM for content generation | **Use existing** | Accessed via CrewAI provider; ANTHROPIC_API_KEY in .env; no direct SDK needed |
  | pathlib (stdlib) | File I/O and path operations | **Use existing** | Already used in content_generators.py (line 4); Python 3.11+ standard library; no new dependency |
  | GitPython 3.1.0+ | Git operations library | **Use existing** | In pyproject.toml; used indirectly via git_tools.py subprocess calls; adequate for feature |
  | structlog 24.0.0+ | Structured logging | **Use existing** | In pyproject.toml; already configured in observability.logging module; provides get_logger() |
  | Python 3.11+ | Language runtime | **Requirement** | Specified in pyproject.toml (line 6: requires-python = ">=3.11"); feature uses standard f-strings, type hints, pathlib |

  **No new dependencies needed.** Implementation reuses all existing libraries already in the project.

  ## Security Considerations

  ### 1. File Path Validation (Path Traversal Prevention)

  **Status:** ✅ Already implemented in content_generators.py (line 117-118)
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```
  Feature 123 uses constant `FILENAME = "test-b3x0s1.md"` (no user input), so no additional path traversal risk.

  ### 2. File Encoding Security (No BOM)

  **Status:** ✅ Spec enforces UTF-8 without BOM (NFR-1)
  - Python's `open(file, 'w', encoding='utf-8')` produces UTF-8 without BOM
  - Prevents encoding-based attacks (BOM can be misinterpreted by some parsers)
  - Already validated in content_generators.validate_markdown_file() (line 187-188)

  ### 3. LLM Output Validation (Prompt Injection & Content Validation)

  **Status:** ⚠️ Partially implemented
  - ✅ `generate_markdown_content()` validates format (H1 heading, sentence count)
  - ✅ Content validated before file creation prevents invalid content
  - ⚠️ No explicit prompt injection prevention, but risk is low because:
    - Prompt is static (MARKDOWN_GENERATION_PROMPT, lines 13-24)
    - No user input in prompt
    - Output is only file creation (low-privilege operation)
    - Output is validated before use

  **Recommendation:** No additional security measures needed. Static prompt + output validation is sufficient.

  ### 4. Git Operations Security

  **Status:** ✅ Standard git operations
  - Using subprocess.run() with standard git commands (git_tools.py)
  - No shell=True (prevents shell injection)
  - Message is constant (no user input): `feat(123): Create markdown file test-b3x0s1.md with prose content (#192)`
  - Credentials: uses git config (user.name, user.email) — no secrets hardcoded

  ### 5. File Permissions & Ownership

  **Status:** ✅ Default permissions
  - File created with default umask (typically 0644 on Unix)
  - Readable by user and group, not world-writable
  - Standard for version control artifacts
  - No sensitive data in markdown files (prose content only)

  ## Performance Considerations

  ### 1. LLM API Latency (Dominant Cost)

  **Bottleneck:** Content generation via Claude API is slowest operation
  - Typical latency: 2-5 seconds per API call
  - Dominates overall feature execution time
  - No optimization possible without caching (out of scope)

  **Optimization:** None needed — feature latency is acceptable for a single LLM call.

  ### 2. File I/O (Negligible)

  **Performance:** Fast
  - File size: 400-600 bytes (small)
  - Write time: < 5ms
  - Validation (read + parse): < 5ms
  - Total I/O: < 20ms (< 1% of total time)

  **Optimization:** None needed.

  ### 3. Git Operations (Fast)

  **Performance:**
  - `git add -A`: ~50ms
  - `git commit`: ~100ms
  - `git push`: ~200-500ms (depends on network, branch complexity)
  - Total: < 1 second (typical)

  **Optimization:** None needed. Push latency is network-bound, not implementable.

  ### 4. Memory Usage (Trivial)

  **Estimate:**
  - Generated content: ~500 bytes
  - Module imports: ~5-10 MB (CrewAI, structlog, etc.)
  - Runtime: < 50 MB total

  **Optimization:** None needed. Memory is not a constraint.

  ### 5. Sentence Validation Overhead

  **Cost:** One regex or period-count operation
  - Already performed by generate_markdown_content() internally
  - Re-validating adds negligible cost (< 1ms)

  **Decision:** Validate once after generation (no retry loop).

  ## Architecture Notes

  ### How Feature 123 Fits Into Sheep Platform

  **Overall Architecture:** The Sheep platform is a CrewAI-based automated implementation system with a clear layered architecture:

  1. **CLI Layer** (sheep.cli) — Entry point for feature execution
  2. **Orchestration Layer** (flows/) — Task workflows and execution pipelines
  3. **Implementation Layer** (feature_*.py modules) — Feature-specific logic
  4. **Service Layer** (content_generators, git_tools, etc.) — Reusable utilities
  5. **Configuration Layer** (config/, .env) — Settings and secrets

  **Feature 123's Role:**
  - **Tier:** Implementation layer (feature_123_markdown_file_creation.py)
  - **Dependencies:** Reuses service layer (content_generators.py, git_tools.py)
  - **Pattern:** Identical to 122+ prior features (replication, not innovation)
  - **Integration:** Called via flows (not directly) or CLI invocation

  ### Reusable Functions (No Code Duplication)

  Feature 123 leverages existing module functions:
  1. `generate_markdown_content()` — Creates H1 + 2-3 sentences
  2. `write_markdown_file()` — Persists to disk with UTF-8 + LF
  3. `validate_markdown_file()` — Validates format requirements
  4. `commit_markdown_file()` — Git add + commit with message
  5. `push_markdown_file()` — Git push with upstream tracking

  **Alternative:** Use `create_markdown_file()` (lines 363-440) — single function that orchestrates all steps. Simpler implementation but less flexible control flow.

  ### Git Workflow Integration

  **Pre-requisite:** Feature branch pre-created: `feat/123-markdown-file-creation-55cdca`
  **Implementation Must:**
  1. Be on correct branch (assume already checked out by orchestration)
  2. Create file in repository root (Path.cwd())
  3. Stage with git add
  4. Commit with exact message format
  5. Push to origin with upstream tracking

  **Implementation Uses:**
  - `GitCommitTool` (git_tools.py lines 213-239) — handles add + commit
  - `GitPushTool` (git_tools.py lines 255-288) — handles push with -u flag

  ### Observability & Logging

  **Logging Pattern:** Use structured logging via `sheep.observability.logging.get_logger(__name__)`
  - Info level: Task progress (e.g., "Feature 123 - Task 2: Generating markdown content")
  - Debug level: Detailed output (e.g., "Generated 455 bytes of content")
  - Error level: Exceptions with context

  **Integration:** Logs flow to configured Langfuse (if enabled in .env) for distributed tracing.

