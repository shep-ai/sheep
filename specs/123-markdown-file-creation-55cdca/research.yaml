  ## Rejected Alternatives Summary

  1. **Generic factory function** — Complexity and codebase divergence outweigh DRY benefits
  2. **Topic-constrained generation** — Reduces test diversity; contradicts user query
  3. **Trust LLM without validation** — Silent failures violate hard requirement for 2-3 sentences
  4. **Overwrite existing files** — Data loss risk and masks configuration errors
  5. **Retry loop with backoff** — Adds complexity; single attempt sufficient for well-tuned prompt
  6. **Platform-specific encoding** — Portability and CI/CD consistency require UTF-8 + LF

