# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-20

  ## Architecture Overview

  Feature 123 follows the well-established markdown-file-creation pattern with 122+ identical implementations
  (features 001-122). The implementation is minimal and reuses proven abstractions from the content_generators
  and git_tools modules, requiring no new dependencies or code patterns.

  ### Module Structure

  The feature creates a single module (feature_123_markdown_file_creation.py) that:
  - Defines constants: FEATURE_NUMBER = 123, FILENAME = "test-b3x0s1.md"
  - Implements task functions: task_2_generate_markdown_content(), task_3_write_markdown_file_to_disk()
  - Provides main() orchestration function that coordinates all steps
  - Uses structured logging via sheep.observability.logging.get_logger()
  - Imports proven functions: generate_markdown_content(), write_markdown_file(), commit_markdown_file(), push_markdown_file()

  This mirrors the reference implementation (feature_116_markdown_file_creation.py) to ensure consistency
  with established codebase conventions and developer expectations.

  ### How Feature 123 Fits the Sheep Architecture

  The Sheep platform has a layered architecture:
  1. **CLI Layer** — Entry point for feature execution
  2. **Orchestration Layer** — Task workflows and execution pipelines
  3. **Implementation Layer** — Feature-specific modules (where feature_123 resides)
  4. **Service Layer** — Reusable utilities (content_generators, git_tools)
  5. **Configuration Layer** — Settings and secrets

  Feature 123 sits in the Implementation layer, reusing Service layer functions without modifying any
  source code in /src/sheep/ modules. This follows the separation-of-concerns pattern that all 122+
  prior markdown-file-creation features employ.

  ## Key Design Decisions

  ### 1. Dedicated Feature Module (vs Generic Factory Function)

  **Chosen:** Create feature_123_markdown_file_creation.py following established pattern from 122+ precedents.

  **Rationale:**
  - Consistency is critical: 122 identical features establish this pattern across the codebase
  - Minimal overhead: Adding a new file (~120 lines) is negligible cost
  - Easier debugging: Each feature is uniform, making issues immediately obvious
  - Clear separation of concerns: Feature logic is isolated, not mixed into utilities
  - Developer expectations: Codebase has established that each feature gets its own module

  **Alternatives Considered:**
  - Generic parameterized factory function — adds abstraction complexity, diverges from established pattern, harder to extend
  - Inline script within content_generators.py — violates separation of concerns, couples content generation with orchestration

  ### 2. LLM-Based Random Topic Generation (vs Constrained Topics)

  **Chosen:** Use generate_markdown_content() with flexible prompt (no topic constraints).

  **Rationale:**
  - User query explicitly says "about anything" — no constraints intended
  - Test diversity increases coverage: 122+ existing files likely have varied topics
  - Simplest implementation: No prompt engineering or category parameterization needed
  - Function already implements this: generate_markdown_content() uses flexible prompt (MARKDOWN_GENERATION_PROMPT)

  **Alternatives Considered:**
  - Constrain topic to specific category — reduces diversity, requires additional prompt engineering
  - Use static templated content — no diversity, cannot validate LLM quality

  ### 3. Validate Sentence Count Before File Creation (vs Trust LLM)

  **Chosen:** Validate 2-3 sentence requirement before calling write_markdown_file().

  **Rationale:**
  - Sentence count is a hard requirement (not guideline): Listed in FR-4 and success criteria
  - Early validation prevents invalid file creation: Invalid content never reaches disk
  - Minimal overhead: One function call, leverages existing validate_markdown_file()
  - Fail-fast principle: Catch issues before persisting to disk, prevents cleanup logic later

  **Alternatives Considered:**
  - Trust LLM output without validation — silent failures violate hard requirement
  - Validate post-implementation — file written before checking, requires cleanup logic

  ### 4. Fail Fast on File Conflicts (vs Overwrite or Skip)

  **Chosen:** Raise exception if test-b3x0s1.md already exists before creation.

  **Rationale:**
  - Unique file per feature: Each feature creates exactly one test file with unique name
  - Indicates configuration error: If file exists, something is wrong (duplicate run, branch conflict, manual creation)
  - Immediate visibility: Exception surface issue to implementer for investigation
  - Prevents silent data loss: Overwriting would hide the error; skipping leaves feature incomplete

  **Alternatives Considered:**
  - Overwrite silently — risks data loss, masks configuration errors
  - Skip with warning — incomplete feature implementation, obscures root cause

  ### 5. Conventional Commit Message with Feature Number

  **Chosen:** Use format "feat(123): Create markdown file test-b3x0s1.md with prose content (#192)"

  **Rationale:**
  - Conventional commits convention: feat(scope) format is standard in the codebase
  - Traceability: Feature number in scope links commit to feature spec
  - Searchability: Fixed format makes git history greppable (feat(123))
  - PR reference: #192 links commit to pull request for context

  **Specification:** This exact message is required per the spec's success criteria (no variation).

  ## Implementation Strategy

  ### Execution Order Rationale

  1. **Foundation First (Phase 1):** Module setup before any implementation — establishes correct imports and constants
  2. **Content Generation (Phase 2):** Generate content early; if generation fails, fail fast without wasting file I/O
  3. **File Persistence (Phase 3):** Write only after content is validated — prevents invalid files on disk
  4. **Git Operations (Phase 4):** Stage, commit, push in sequence — dependencies are strict (must add before commit)
  5. **Orchestration (Phase 5):** main() function coordinates all steps, ensuring proper error handling and logging

  ### No Code Duplication — Leverage Existing Functions

  Implementation reuses these proven functions:
  - `generate_markdown_content()` (content_generators.py lines 27-68) — Creates H1 + 2-3 sentences
  - `write_markdown_file()` (content_generators.py lines 101-131) — Persists to disk with UTF-8 + LF
  - `validate_markdown_file()` (content_generators.py lines 134-163) — Validates format requirements
  - `commit_markdown_file()` (git_tools.py) — Git add + commit with message
  - `push_markdown_file()` (git_tools.py) — Git push with upstream tracking

  No new helper functions, utility classes, or abstractions are created — feature implementation is orchestration
  of existing, proven components.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **LLM generates invalid content (< 2 or > 3 sentences)** | Validate sentence count before write_markdown_file(); validate_markdown_content() counts periods and enforces 2-3 |
  | **File already exists on disk** | Check existence before write; raise ValueError with clear message; fail fast prevents overwrites |
  | **Encoding issues (BOM or CRLF)** | Leverage existing write_markdown_file() which uses pathlib.write_text(encoding='utf-8'); tested and proven in features 001-122 |
  | **Git commit fails (missing name/email config)** | Use existing commit_markdown_file() which handles standard git configuration; assumes prereq git setup |
  | **Git push fails (network or auth)** | Use existing push_markdown_file() with error handling; feature implementation catches and logs exceptions |
  | **Module imports fail** | Validate all imports during Phase 1; all functions are available in content_generators and git_tools (existing modules) |
  | **Sentence validation too strict** | Research confirms generate_markdown_content() is tuned for 2-3 sentences; 122+ existing files validate approach |
  | **File size outside expected range (400-600 bytes)** | Size varies naturally based on topic length (guideline, not strict requirement); validate during testing but don't enforce |

