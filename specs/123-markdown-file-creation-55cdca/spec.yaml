# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-b3x0s1.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 122+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 063-122, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-b3x0s1.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] File size is between 400-600 bytes (typical range for this pattern)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-b3x0s1.md`)
  - [ ] Git commit exists on the current branch with message: `feat(123): Create markdown file test-b3x0s1.md with prose content (#192)`
  - [ ] Commit is on the feature branch `feat/123-markdown-file-creation-55cdca`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-b3x0s1.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-b3x0s1.md`
  - **FR-7**: File must be committed with message: `feat(123): Create markdown file test-b3x0s1.md with prose content (#192)`
  - **FR-8**: Commit must be created on the current branch `feat/123-markdown-file-creation-55cdca`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes (guideline, not strict limit)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use existing content_generators module functions (generate_markdown_content, write_markdown_file)
  - **NFR-6**: Implementation must follow the established pattern from 122+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/` source modules, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the LLM, explicitly flexible per user query "about anything"
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages
  - **NFR-10**: Generated content must be diverse and suitable for test validation purposes

  ## Product Decisions (Resolved)

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Topic selection strategy? | Random topic generation | User query says "about anything"; diversity increases test coverage; simplest implementation aligns with established pattern |
  | 2 | Validate sentence count? | Yes, with retry on invalid | Sentence count is a hard requirement; early validation prevents invalid file creation; minimal overhead for small content |
  | 3 | File overwrite handling? | Fail with error | Feature creation (not update) semantics; unique file per feature; failing fast catches bugs; prevents silent data loss |
  | 4 | Implementation architecture? | Create dedicated feature_123 module | 122+ precedents establish this pattern; consistency is critical; minimal overhead; easier to debug |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an automated code implementation platform built with CrewAI. It consists of:

  - **Repository root**: Contains 122+ test markdown files (test-*.md) following a consistent pattern, plus configuration files (pyproject.toml, docker-compose.yml, .env.example)
  - **src/sheep/**: Application source code organized into modules:
    - `agents/`: Agent definitions for research, implementation, and review
    - `config/`: LLM configuration and settings management
    - `flows/`: Flow definitions for orchestration and execution
    - `tools/`: Git operations and file manipulation tools
    - `observability/`: Structured logging and Langfuse tracing
    - `content_generators.py`: Centralized module for markdown and content generation
    - `cli.py`: Command-line interface entry point
  - **specs/**: Feature specification directories (one per feature number, e.g., specs/123-markdown-file-creation-55cdca/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with dependencies, build system, tool configuration

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern (features 063-122 and continuing with 123) and serve as validation of the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (122+ precedents):
  - Markdown content generation via `generate_markdown_content()` function using CrewAI LLM framework
  - File writing via `write_markdown_file()` function from content_generators module
  - Consistent format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix LF line endings
  - File size typically 400-600 bytes (natural variation acceptable)
  - Implementation via Python script module in src/sheep/ (e.g., feature_116_markdown_file_creation.py)

  **Content Generation Pattern**:
  - Uses Claude LLM via CrewAI framework (get_reasoning_llm())
  - Prompt-based generation with structured output requirements
  - Validation of output format (H1 heading, 2-3 sentences, length checks)
  - Automatic trailing newline addition for Unix convention
  - Error handling and logging via structured logging module

  **Git Workflow Pattern**:
  - Feature branch pre-created: `feat/123-markdown-file-creation-55cdca`
  - Create/modify files in working directory
  - Stage with `git add test-b3x0s1.md`
  - Commit with conventional commit format: `feat(123): Create markdown file test-b3x0s1.md with prose content (#192)`
  - Push to feature branch and remote origin
  - No complex merging, rebasing, or branch management

  **Observability Pattern**:
  - Structured logging using `get_logger(__name__)` from sheep.observability.logging
  - Debug-level logging for content generation
  - Info-level logging for task execution
  - Error-level logging for exceptions
  - Integration with Langfuse for distributed tracing (optional, configured in .env)

  ### Relevant Technologies

  - **Python 3.11+**: Project minimum requirement (specified in pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (Path.write_text())
  - **Git 2.0+**: Version control system for staging, commits, and pushes
  - **CrewAI 0.86.0+**: Multi-agent orchestration framework for LLM-based automation
  - **Claude LLM API**: Accessed via Anthropic provider in CrewAI (requires ANTHROPIC_API_KEY in .env)
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content
  - **Pydantic 2.0+**: Data validation and settings management
  - **Python standard library modules**: logging, re (regex), pathlib

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-b3x0s1.md) to existing collection of 122+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-122; no branch/merge complexity, no destructive operations |
  | src/sheep/ Modules | None | Feature reuses existing content_generators functions; no modifications to source code required |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs |
  | Dependencies | None | Implementation uses only existing dependencies (CrewAI, pathlib); no new packages required |
  | Testing | None | Feature is pure file creation; no test modifications or new test files required |

  ## Dependencies

  - **Git repository**: Feature branch `feat/123-markdown-file-creation-55cdca` must exist (pre-created)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **File system**: Write access to repository root directory (standard for development)
  - **CrewAI and LLM**: CrewAI framework installed with Anthropic provider; ANTHROPIC_API_KEY must be set in .env
  - **Established pattern**: 122+ test files provide clear precedent for content format and structure
  - **content_generators module**: Existing functions generate_markdown_content() and write_markdown_file() available for use
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Architecture Decisions

  1. **Reuse existing content_generators functions**: The codebase already includes generate_markdown_content() and write_markdown_file() functions that encapsulate LLM-based content generation and file I/O. These will be reused to maintain consistency with features 116-122.

  2. **Single Python module per feature**: Follow the established pattern of creating a dedicated module (e.g., feature_123_markdown_file_creation.py) that orchestrates the workflow via task functions (task_2_generate_markdown_content, task_3_write_markdown_file_to_disk).

  3. **LLM-based content generation**: Use the CrewAI LLM framework rather than static or templated content, allowing for diverse, coherent prose while maintaining format consistency.

  4. **No application code modifications**: The feature creates a file in the repository root and performs git operations; it does not modify src/sheep/ modules, tools, configs, or flows.

  5. **Fail-fast on conflicts**: Implementation will check for existing test-b3x0s1.md and raise an exception rather than silently overwriting, catching issues early.

  6. **Sentence count validation**: Implementation will validate that generated content contains exactly 2-3 sentences before writing the file, with retry logic to handle edge cases from the LLM.

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Module creation and setup**: ~3 minutes (create feature_123_markdown_file_creation.py, import functions, configure FILENAME)
  - **Content generation with validation**: ~5 minutes (call generate_markdown_content(), validate sentence count with retry logic)
  - **File writing**: ~2 minutes (call write_markdown_file(), verify output)
  - **Git operations**: ~3 minutes (git add, git commit with conventional message, git push)
  - **Validation**: ~2 minutes (verify file content, encoding, line endings, byte size)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 122+ identical test files providing clear precedent
  - Random topic selection requires no research or architectural decisions
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - Reuses existing functions (generate_markdown_content, write_markdown_file) — no new code patterns
  - Sentence validation adds minimal complexity (~2 lines for sentence counting)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (116-122) demonstrate efficient implementation of identical features in 10-15 minutes
  - No complex dependencies, edge cases, or error handling scenarios beyond standard validation

