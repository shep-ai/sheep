# Markdown content (the full tasks document)
content: |
  ## Implementation Summary

  Feature 257 is implemented as 10 tasks organized across 6 phases:

  **Phase 1 (Foundation):** Create the feature module file, imports, constants, and logger setup.
  This foundation unblocks all subsequent work and takes ~15 minutes.

  **Phase 2 (Core Workflow):** Implement the first three orchestration steps: generate markdown
  content via Claude API, write file with UTF-8 encoding and LF line endings, validate file
  structure and properties. Each step calls a high-level wrapper from content_generators.py
  and logs at INFO level. Takes ~30 minutes.

  **Phase 3 (Git Integration):** Implement git operations: commit with conventional message
  format and push to remote feature branch. Reuses existing GitCommitTool and GitPushTool
  from sheep.tools. Takes ~20 minutes.

  **Phase 4 (Resilience):** Add comprehensive error handling and cleanup. Wraps entire workflow
  in try-except, catches any exception, cleans up partial artifacts (deletes incomplete files,
  reverts uncommitted changes), logs error at ERROR level, and re-raises to caller. Implements
  fail-fast principle per NFR-5 with clean error messages per NFR-6. Takes ~15 minutes.

  **Phase 5 (Results & Execution):** Implement structured return value (dict with filepath,
  content, commit_message, push_result) and __main__ block for standalone script execution.
  Return value allows calling code to verify operation results. __main__ enables testing as
  standalone script. Takes ~15 minutes.

  **Phase 6 (Verification):** Execute feature end-to-end and verify all success criteria are met.
  Confirm markdown file exists with correct structure, encoding, line endings, and size;
  git commit and push succeeded; returned result dict is complete. Takes ~20 minutes.

  **Total estimated effort: 1.5 hours** (aligns with S size estimate)

  ## Task Dependency Graph

  ```
  task-1 (Foundation)
    ↓
  task-2 (Generate)
    ↓
  task-3 (Write)
    ↓
  task-4 (Validate)
    ↓
  task-5 (Commit)
    ↓
  task-6 (Push)
    ↓
  task-7 (Error Handling)
    ↓
  task-8 (Return Value)
    ↓
  task-9 (Main Block)
    ↓
  task-10 (Verification)
  ```

  All tasks are sequential — each depends on previous task(s).
  No parallelization possible (workflow must complete in order).

  ## TDD Approach

  Each task follows TDD cycle (RED-GREEN-REFACTOR) where applicable:

  **RED:** Write test or verification that asserts expected behavior (test fails, feature not yet implemented)
  **GREEN:** Implement minimal code to make test pass (feature now works)
  **REFACTOR:** Clean up, improve naming, add logging, extract helpers (maintain quality while preserving functionality)

  Non-code tasks (like verification) use RED-GREEN-REFACTOR conceptually:
  - RED: Feature doesn't work yet
  - GREEN: Feature works end-to-end
  - REFACTOR: Polish, document, optimize

  ## Acceptance Criteria Verification

  After completing all 10 tasks, verify these acceptance criteria across the entire feature:

  ✓ File test-oxy715.md exists in repository root
  ✓ File contains one H1 heading followed by 2-3 sentences of prose
  ✓ File encoding is UTF-8 without BOM
  ✓ File uses Unix LF line endings only
  ✓ File size is 250-600 bytes (natural outcome of structure)
  ✓ Commit message is exactly: \"feat(257): create markdown file test-oxy715.md with prose content\"
  ✓ Changes are pushed to remote feature branch
  ✓ Feature module is 30-50 lines of code
  ✓ Feature module uses high-level wrappers from content_generators.py
  ✓ Feature module includes structlog logging at INFO level
  ✓ Feature module implements fail-fast error handling with cleanup
  ✓ Feature module returns structured result dict
  ✓ Feature module can be executed as standalone script

  ## Implementation Notes

  - Follow patterns from features 256 and 255 (use them as templates)
  - Import only from content_generators.py, not create_markdown.py directly (NFR-7)
  - Use pathlib.Path for all file operations (already used in wrapper functions)
  - Use structlog.get_logger(__name__) for logging (already integrated)
  - Keep feature module focused on orchestration (30-50 lines), not reimplementing utilities
  - Test with intentional failures (API error, file permission, git error) to verify cleanup works
  - On success: git commit and push should complete without error
  - On failure: partial files should be deleted, git should be reverted, exception should propagate

