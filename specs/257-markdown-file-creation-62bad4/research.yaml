content: |
  ## Research Summary

  Feature 257 is a straightforward, low-complexity feature following an identical pattern to 256+ prior markdown file creation features (001-256). All required utilities exist in mature, production-tested form. No architectural changes, new dependencies, or novel functionality is needed.

  ### Technology Stack

  #### Core Technologies (Proven)
  - **Python 3.11+**: Mature, stable, used across entire codebase
  - **Anthropic Claude 3.5 Sonnet API**: Selected by spec as content generation model; accessed via CrewAI LLM wrapper for consistency with platform architecture
  - **CrewAI Framework**: Already integrated (v0.86.0+); provides LLM abstraction, error handling, and parameter management
  - **structlog**: Already integrated for structured logging; feature uses `get_logger(__name__)` pattern from src/sheep/observability/logging.py
  - **Git**: System-level tool; orchestrated via existing GitCommitTool and GitPushTool from src/sheep/tools
  - **pathlib**: Python standard library; used for file I/O (already used across codebase)

  #### High-level Wrapper Functions (src/sheep/content_generators.py)
  These are the recommended entry points per NFR-7 and validated by features 256-255:

  | Function | Purpose | Input | Output | Error Handling |
  |----------|---------|-------|--------|----------------|
  | `generate_markdown_content()` | Generate H1 + 2-3 sentence prose via Claude API | None (prompt is templated) | `str` with complete markdown | ValueError if format requirements unmet; Exception if API fails |
  | `write_markdown_file(content, filename)` | Write file with UTF-8 encoding, LF line endings | markdown content, filename | file path as string | ValueError if filename unsafe; IOError if write fails; validates file created and non-empty |
  | `validate_markdown_file(filepath)` | Comprehensive validation (H1, sentences, encoding, line endings, trailing newline) | file path | bool (True on pass) | ValueError for all validation failures with descriptive messages |
  | `commit_markdown_file(filepath, content, repo_path, custom_message)` | Stage file and create git commit | file path, content, repo path, optional message | commit result string | Exception if git fails; logs all steps |
  | `push_markdown_file(repo_path, remote)` | Push committed changes to remote with upstream tracking | repo path, remote name (default "origin") | push result string | Exception if git push fails |

  #### Alternative: Low-level Utilities (src/create_markdown.py)
  **Not recommended for feature 257.** Contains lower-level functions like `validate_content()`, `validate_file_encoding()`, `validate_file_structure()`, `stage_and_commit_file()`. Using these directly would require 80-100 lines of orchestration code to sequence operations, validate transitions, and handle errors. The high-level wrappers in content_generators.py provide the right abstraction layer for feature modules (NFR-7: reuse without modifications).

  ### Architecture Pattern

  Feature 257 follows the established pattern from 256+ prior features:

  ```
  Feature Module (30-50 lines)
    ↓
  High-level Wrappers (content_generators.py)
    ↓
  Low-level Utilities (create_markdown.py)
    ↓
  System APIs (pathlib, subprocess, git, Claude API)
  ```

  **Rationale for this layering:**
  - Feature modules are thin orchestrators — they call high-level functions in sequence
  - High-level functions encapsulate business logic (validation sequencing, error recovery)
  - Low-level utilities handle system details (file encoding, git command formatting)
  - This separation makes features easy to understand and modify

  ### Workflow Sequence

  The feature execution follows this proven sequence (same as features 256, 255):

  1. **Generate**: `generate_markdown_content()` → Claude API → H1 + 2-3 sentences
  2. **Write**: `write_markdown_file(content, "test-oxy715.md")` → UTF-8 file in repository root
  3. **Validate**: `validate_markdown_file(filepath)` → comprehensive structure and encoding checks
  4. **Commit**: `commit_markdown_file(filepath, content, repo_path, custom_message)` → git staging + commit with conventional message
  5. **Push**: `push_markdown_file(repo_path)` → git push to remote with upstream tracking

  Each step logs at INFO level and raises exceptions on failure (fail-fast per NFR-5). No intermediate state cleanup needed between steps because all operations are atomic (file write succeeds or fails completely, git operations are transactional).

  ### Logging Strategy

  **Standard INFO-level logging** (spec decision PD-2):

  ```python
  _logger.info("Task 1: Generating markdown content")
  _logger.debug(f"Generated {len(content)} bytes of content")
  _logger.info("Task 2: Writing markdown file to disk")
  _logger.info("Task 3: Validating markdown file")
  _logger.info("File validation passed")
  _logger.info("Task 4: Staging and committing file")
  _logger.info("Task 5: Pushing to remote repository")
  _logger.error(f"Failed to create feature {FEATURE_NUMBER}: {e}")  # on exceptions
  ```

  This provides:
  - **Observability**: Major operational steps are visible in logs
  - **Debugging**: INFO messages show which step completed successfully
  - **Error context**: Exceptions logged with full traceback
  - **No data exposure**: Logging shows step names and operation status, not sensitive content
  - **Consistency**: Matches logging pattern used in content_generators.py

  ### Error Handling Strategy

  **Fail-fast with cleanup** (spec decision PD-4):

  ```python
  try:
    # Execute workflow steps
    content = generate_markdown_content()  # Raises Exception on API error
    filepath = write_markdown_file(content, MARKDOWN_FILENAME)  # Raises IOError on write failure
    validate_markdown_file(filepath)  # Raises ValueError on validation failure
    # ... remaining steps
  except Exception as e:
    _logger.error(f"Failed: {e}")
    # Cleanup partial artifacts if they exist
    if filepath and Path(filepath).exists():
        Path(filepath).unlink()  # Remove incomplete file
    # Note: uncommitted files are automatically cleaned by git reset in failure cases
    raise  # Re-raise to propagate error to caller
  ```

  **Rationale:**
  - Fail-fast aligns with NFR-5 explicit requirement
  - Clean error messages per NFR-6
  - Artifact cleanup maintains repository integrity
  - 256+ precedents show this approach is stable

  ### File Encoding and Line Endings

  **Handled by content_generators.py automatically:**

  - `write_markdown_file()` uses `open(path, "w", encoding="utf-8")` (implicit UTF-8)
  - Python 3 on Unix automatically writes LF line endings (not CRLF)
  - `validate_markdown_file()` verifies no BOM and no CRLF
  - Content is ensured to end with trailing newline in `generate_markdown_content()`

  **No additional encoding logic needed in feature module** — wrappers handle all encoding concerns per NFR-7.

  ### Git Integration

  **Handled by content_generators.py wrappers:**

  - `commit_markdown_file()` uses existing GitCommitTool from src/sheep/tools
  - `push_markdown_file()` uses existing GitPushTool with `set_upstream=True`
  - Conventional commit message format: `feat(257): create markdown file test-oxy715.md with prose content`
  - No direct git command execution needed in feature module

  ### API Failure Behavior

  Per NFR-5 (fail-fast) and spec decision PD-1:

  - **Network timeout**: Claude API raises exception → feature module catches → raises to caller → user can manually retry
  - **API error response**: Claude API raises exception → same flow
  - **Invalid response format**: `_validate_markdown_content()` in `generate_markdown_content()` raises ValueError → same flow
  - **No automatic retries**: Simpler implementation, 256+ precedents show API is stable

  **Why no automatic retries:**
  - Single API call is low-latency (typically <5 seconds)
  - Transient errors are extremely rare with Claude 3.5 Sonnet
  - Manual retry is user-driven and transparent
  - Keeps feature module code simple (30-50 line target)
  - Clear error message tells user exactly what failed

  ### Security Considerations

  **API Credentials:**
  - ANTHROPIC_API_KEY environment variable accessed by CrewAI wrapper (not feature module)
  - No credential storage or management in feature module
  - Safe per existing platform security model

  **File System Safety:**
  - Repository root is safe location (already writable for feature modules)
  - Filename validation in `write_markdown_file()` prevents path traversal (`"/" or ".." checks)
  - File permissions: created with default umask (world-readable by default, appropriate for repository artifacts)

  **Input Validation:**
  - Filename validated by wrapper (no path separators, no dot-prefix)
  - Generated content validated structurally (H1 heading, sentence count, encoding)
  - Git operations use subprocess with proper argument passing (no shell injection risk)

  **Data Exposure:**
  - No sensitive data in logs (only step names and operation status)
  - File content is markdown prose (no secrets)
  - Commit messages are conventional and non-sensitive

  ### Performance Considerations

  **Expected Timing:**
  - Content generation: 2-5 seconds (Claude API latency)
  - File write: <100ms (local disk)
  - File validation: <10ms (small file)
  - Git commit: 100-500ms (subprocess overhead)
  - Git push: 1-3 seconds (network latency)
  - **Total: 5-10 seconds end-to-end**

  **Scaling Notes:**
  - No loops or repeated operations (linear workflow)
  - Single API call (not batched or streamed)
  - Single file created (not bulk operations)
  - Feature is O(1) complexity

  **Optimization Potential:**
  - Could parallelize file write and git operations (not worth complexity)
  - Could cache markdown template (not needed, generation time is dominated by API)
  - No caching needed — each feature creates unique file

  ### Dependencies and Imports

  **Feature module imports (minimal):**

  ```python
  from pathlib import Path
  from sheep.content_generators import (
      commit_markdown_file,
      generate_markdown_content,
      push_markdown_file,
      validate_markdown_file,
      write_markdown_file,
  )
  from sheep.observability.logging import get_logger
  ```

  **Transitive dependencies (already configured):**
  - CrewAI framework (src/sheep/config/llm.py for get_reasoning_llm)
  - Anthropic Claude API (via CrewAI)
  - Git executable (system-level)
  - structlog (for logging)
  - pathlib (Python standard library)

  **No new dependencies required** — all utilities exist and are production-tested.

  ### Implementation Checklist

  The feature implementation will:

  ✓ Create `src/sheep/features/feature_257_markdown_file_creation.py` (~50 lines)
  ✓ Define `FEATURE_NUMBER = 257`, `FEATURE_NAME = "markdown-file-creation-62bad4"`, `MARKDOWN_FILENAME = "test-oxy715.md"`
  ✓ Implement `create_feature_257_markdown_file(repo_path=None)` function
  ✓ Call wrapper functions in sequence: generate → write → validate → commit → push
  ✓ Use structlog `get_logger(__name__)` for INFO/DEBUG/ERROR logging
  ✓ Return dict with filepath, content, commit_message, push_result
  ✓ Implement try-except with cleanup on failure
  ✓ Support module execution as `__main__` for standalone testing
  ✓ Use exact commit message: `feat(257): create markdown file test-oxy715.md with prose content`
  ✓ Push to remote feature branch `feat/257-markdown-file-creation-62bad4` (pre-created)

  No changes to:
  - src/create_markdown.py (low-level utilities)
  - src/sheep/content_generators.py (wrappers)
  - src/sheep/tools (git tools)
  - src/sheep/config (LLM config)
  - src/sheep/observability (logging)

  ## Conclusion

  Feature 257 is a straightforward implementation of an established pattern. The technology stack is mature and proven across 256+ prior features. The high-level wrapper architecture in content_generators.py provides the right abstraction for feature modules. No architectural risks, no new dependencies, no integration challenges. Ready for implementation phase.

  ---

  **Research completed:** 2026-03-28
  **Next phase:** Implementation (create feature module, test, commit, push)
