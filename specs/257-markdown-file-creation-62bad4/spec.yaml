  - question: "What structured logging level should be used for observability — minimal, standard (info), or detailed?"
    resolved: true
    options:
      - option: "Minimal logging"
        description: "Log only errors and final result. Reduces log noise, fastest execution. Limits debugging visibility if issues occur."
        selected: false
      - option: "Standard info-level logging"
        description: "Log major steps (API call started, file created, git commit, push completed) at INFO level. Standard operational logging, good observability without excessive noise. Industry best practice for feature modules."
        selected: true
      - option: "Detailed debug logging"
        description: "Log all steps including generated content, file properties, git details at DEBUG level. Maximum observability but verbose, slower, more sensitive to data exposure."
