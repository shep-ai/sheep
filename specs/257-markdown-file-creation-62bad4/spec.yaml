content: |
  ## Problem Statement

  Create a single markdown file called test-oxy715.md in the repository root with a clear H1 title and 2-3 sentences of prose content on any topic. The file must follow established patterns from 256 prior similar features, including UTF-8 encoding without BOM, Unix LF line endings, and proper Git integration (stage, commit with conventional message, push to feature branch).

  The feature is fully constrained by:
  - Explicit user query (filename, structure, topic flexibility)
  - 256+ precedent implementations establishing identical patterns
  - Existing, mature utility functions in src/create_markdown.py and src/sheep/content_generators.py
  - Established technology stack (Claude API, CrewAI, structlog, pathlib, Git)

  ## Success Criteria

  - [ ] File test-oxy715.md exists in repository root with correct filename
  - [ ] File contains exactly one H1 markdown heading at the beginning
  - [ ] File contains 2-3 sentences of meaningful, coherent prose content (not gibberish or placeholder text)
  - [ ] File size is between 250-600 bytes (natural outcome of proper structure, not enforced)
  - [ ] File encoding is UTF-8 without BOM (validated by encode/decode check)
  - [ ] File uses Unix LF line endings only (no CRLF, no mixed line endings)
  - [ ] Content validation passes: H1 structure, sentence count, and character bounds checks
  - [ ] File validation passes: size, encoding, syntax, and markdown structure checks
  - [ ] Feature module feature_257_markdown_file_creation.py created in src/sheep/features/
  - [ ] Feature module is 30-50 lines of code and uses high-level wrappers from content_generators.py
  - [ ] Feature module includes structlog logging via get_logger(__name__)
  - [ ] Feature module returns structured result with filepath, content, commit hash, and push status
  - [ ] File is staged in git working directory (git add test-oxy715.md)
  - [ ] Commit message exactly matches: "feat(257): create markdown file test-oxy715.md with prose content"
  - [ ] Commit is created and exists on current branch
  - [ ] Changes are pushed to remote feature branch feat/257-markdown-file-creation-62bad4
  - [ ] All git operations (add, commit, push) complete without error
  - [ ] Content is generated using Anthropic Claude API (claude-3-5-sonnet or later)
  - [ ] Implementation follows fail-fast approach with clear error messages for API failures, file I/O issues, and git errors
  - [ ] Partial artifacts cleaned up on any operation failure (file removal, uncommitted change cleanup)

  ## Functional Requirements

  - **FR-1**: Create markdown file named test-oxy715.md in the repository root directory
  - **FR-2**: File must contain one H1 heading (# syntax) followed by a blank line and 2-3 sentences of prose
  - **FR-3**: Generate meaningful prose content using Anthropic Claude API with Claude 3.5 Sonnet or later model
  - **FR-4**: Encode file as UTF-8 without BOM (use pathlib.Path.write_text() with encoding='utf-8')
  - **FR-5**: Use Unix LF line endings (\n) exclusively throughout the file
  - **FR-6**: Validate generated content structure: verify H1 presence, sentence count (2-3), and character bounds
  - **FR-7**: Validate file properties: size (250-600 bytes), encoding (UTF-8 no BOM), line endings (LF only), markdown syntax
  - **FR-8**: Stage file using git add test-oxy715.md
  - **FR-9**: Commit file with conventional commit message: "feat(257): create markdown file test-oxy715.md with prose content"
  - **FR-10**: Push commit to remote feature branch feat/257-markdown-file-creation-62bad4
  - **FR-11**: Implement feature as a feature module at src/sheep/features/feature_257_markdown_file_creation.py
  - **FR-12**: Feature module must import and use high-level wrapper functions from src/sheep/content_generators.py (not low-level utilities from create_markdown.py directly)
  - **FR-13**: Feature module must call wrapper functions in sequence: generate_markdown_content() → write_markdown_file() → commit_markdown_file() → push_markdown_file()
  - **FR-14**: Return structured result object containing filepath, generated content, commit hash, and push status

  ## Non-Functional Requirements

  - **NFR-1**: Code must follow established patterns from 256+ prior markdown file creation features (01-256)
  - **NFR-2**: Feature module implementation must be 30-50 lines of code when using high-level wrappers
  - **NFR-3**: Include structured logging at INFO level using structlog.get_logger(__name__) for observability and debugging
  - **NFR-4**: Content generation via Claude API must complete within standard API timeout (30 seconds)
  - **NFR-5**: Implement fail-fast error handling: stop execution and report error on any operation failure (API error, file write failure, git failure)
  - **NFR-6**: Provide clear, actionable error messages that identify the failure point (e.g., "API call failed", "File encoding validation failed", "Git push failed")
  - **NFR-7**: Reuse existing utility functions from src/create_markdown.py and src/sheep/content_generators.py without modifications or extensions
  - **NFR-8**: File size must naturally result in 250-600 bytes as a consequence of proper H1 + 2-3 sentences structure (not enforced, not artificially padded or truncated)
  - **NFR-9**: No modifications to application source code, configuration files, or tests; feature is purely additive artifact creation
  - **NFR-10**: Feature must operate within existing CrewAI framework and Anthropic API integration without configuration changes
  - **NFR-11**: On any operation failure, clean up partial artifacts (delete created files, revert uncommitted changes) to maintain repository cleanliness

  ## Product Decisions

  | # | Decision | Resolved Answer | Rationale |
  | - | -------- | --------------- | --------- |
  | 1 | API retry strategy on transient failures | Fail-fast on first error (no retries) | Aligns with NFR-5, keeps implementation in 30-50 line target, 256+ precedents show stable API behavior, clear error reporting enables manual retry |
  | 2 | Structured logging level | Standard INFO-level logging | Provides necessary observability per NFR-3, industry best practice for feature modules, sufficient debugging context without noise or data exposure |
  | 3 | Byte range tolerance (250-600) | Natural tolerance (accept well-formed content) | NFR-8 requires content result naturally from structure, not be constrained; simpler implementation, one API call, 256+ precedents confirm this works |
  | 4 | Artifact cleanup on failure | Clean up all partial artifacts | Prevents incomplete files in repository, maintains cleanliness, aligns with fail-fast principle, clear error messages provide debugging context |
  | 5 | Content quality validation | Structural validation only (H1, sentence count, encoding) | Existing utilities handle structure validation, Claude API responsible for prose quality per FR-3, semantic validation exceeds 30-50 line target, 256+ precedents use this approach |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Creates single file test-oxy715.md alongside 256 existing test-*.md files; no modifications to existing files |
  | src/sheep/features/ | Low | Adds new feature module feature_257_markdown_file_creation.py following established pattern; no modifications to existing modules |
  | src/create_markdown.py | None | Existing utilities are reused unchanged; no modifications required |
  | src/sheep/content_generators.py | None | Existing wrapper functions are reused unchanged; no modifications required |
  | Git repository | Low | Creates one commit and push operation to feature branch; no merge conflicts, no branch complexity |
  | Application logic | None | Feature is purely file creation artifact; zero impact on application behavior, agents, flows, or tools |
  | Configuration | None | No configuration files modified; feature operates within existing framework setup |
  | Tests | None | No test modifications required; feature produces artifact output, not testable application code |

  ## Dependencies

  This feature depends on:

  - **Existing utilities in src/create_markdown.py**:
    - `generate_markdown_content()` — Generates H1 heading + prose via Claude API
    - `validate_content()` — Validates generated content structure (H1, sentence count, character bounds)
    - `create_markdown_file()` — Writes file with UTF-8 encoding and LF line endings
    - `validate_markdown_file()` — Comprehensive file validation (size, encoding, syntax)
    - `stage_and_commit_file()` — Git staging and conventional commit workflow
    - `push_to_remote()` — Git push to feature branch

  - **Existing utilities in src/sheep/content_generators.py** (high-level wrappers):
    - `generate_markdown_content()` — Higher-level abstraction for content generation
    - `write_markdown_file()` — File writing with built-in validation
    - `commit_markdown_file()` — Commit wrapper with conventional message formatting
    - `push_markdown_file()` — Push wrapper with error handling

  - **External dependencies** (already configured):
    - Anthropic Claude API (credentials via ANTHROPIC_API_KEY environment variable)
    - Git executable (system-level, required across repo)
    - Python 3.11+ standard library (pathlib, subprocess, logging)
    - CrewAI framework (version ≥0.86.0, already integrated)

  - **Pre-requisites**:
    - Feature branch `feat/257-markdown-file-creation-62bad4` must exist (pre-created)
    - Write permissions to repository root directory (already available)
    - Git configuration (user.name, user.email) set up for commits
    - ANTHROPIC_API_KEY environment variable configured (required for content generation)

  ## Size Estimate

  **S** (Small — <2 hours) — This is a straightforward, low-complexity feature:

  - Content generation logic is fully implemented and tested across 256 prior features
  - File creation, validation, and git utilities are mature and reusable
  - Feature module structure is standardized (copy-paste-customize pattern from recent features)
  - Git integration is already proven and stable
  - No architectural changes, new dependencies, or novel functionality required
  - Implementation breakdown:
    - Create feature_257_markdown_file_creation.py (~30-40 lines using high-level wrappers)
    - Call existing utility functions in sequence (generate → write → commit → push)
    - Single markdown file test-oxy715.md created and validated
  - Estimated implementation effort: <1 hour for experienced developer, <2 hours for new team member
  - Estimated testing/validation effort: <30 minutes (validation functions already exist)

  **Justification**:
  - Identical feature structure as features 001-256 (256+ precedents showing ~1 hour implementation time)
  - All required utilities exist in mature state across src/create_markdown.py and src/sheep/content_generators.py
  - No discovery, architectural design, or experimentation needed
  - Simple file creation with no complex logic or state management
  - Git workflow is mechanical and follows exact precedent from 256 implementations
  - User query is unambiguous: specific filename (test-oxy715.md), clear content requirements (H1 + 2-3 sentences), flexible topic ("about anything")

  ---

  **Requirements phase complete** — All functional and non-functional requirements specified, product decisions resolved with structured options and rationale, ready for implementation planning
