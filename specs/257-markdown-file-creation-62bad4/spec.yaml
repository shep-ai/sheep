        description: "Verify H1 presence, sentence count (2-3), file encoding, line endings, size. Depends on Claude API to generate coherent content, validate structure after generation. Simpler, faster, one validation pass."
        selected: true
      - option: "Semantic coherence checks"
        description: "In addition to structure, validate prose for coherence, logical flow, topic relevance. More rigorous but requires additional validation logic, potential API calls to check semantic quality. Significantly increases complexity beyond 30-50 lines."
