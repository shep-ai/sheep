content: |
  ## Problem Statement

  Create a single markdown file named test-0j9m9t.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as test iteration 132 of the Sheep agentic platform's ability to execute simple file creation and git workflow automation reliably and consistently.

  ## Success Criteria

  - [ ] File "test-0j9m9t.md" is created in the repository root directory
  - [ ] File contains valid markdown syntax with no formatting errors
  - [ ] File includes an H1 heading (prefixed with `# `) as the first element
  - [ ] H1 heading is followed by exactly one blank line (standard markdown formatting)
  - [ ] File contains exactly 2-3 complete, coherent sentences of prose content
  - [ ] File is encoded as UTF-8 with UNIX line endings (LF, not CRLF)
  - [ ] File ends with a trailing newline character (POSIX convention)
  - [ ] File is committed with conventional commit message: "feat(132): create markdown file test-0j9m9t.md with prose content"
  - [ ] Changes are pushed to feature branch (feat/132-markdown-file-creation-3e26a2)
  - [ ] No errors or warnings during file creation or git operations
  - [ ] File structure and formatting are consistent with existing test-*.md files (features 101-131)

  ## Functional Requirements

  - **FR-1**: System must create a new file named exactly "test-0j9m9t.md" in the repository root directory
  - **FR-2**: File must contain an H1 markdown heading (prefixed with `# `) as the first line of content
  - **FR-3**: There must be exactly one blank line between the H1 heading and the prose content
  - **FR-4**: File must contain exactly 2-3 complete sentences of coherent prose content
  - **FR-5**: All content must use valid markdown syntax with no broken formatting
  - **FR-6**: File must use UTF-8 encoding with UNIX line endings (LF, not CRLF)
  - **FR-7**: File must end with a trailing newline character
  - **FR-8**: System must stage the file to git using `git add test-0j9m9t.md`
  - **FR-9**: System must create a git commit with conventional commit message: "feat(132): create markdown file test-0j9m9t.md with prose content"
  - **FR-10**: System must push the commit to the remote feature branch (feat/132-markdown-file-creation-3e26a2)
  - **FR-11**: File content must be generated using Claude LLM via existing `generate_markdown_content()` function
  - **FR-12**: Content generation must produce an H1 heading and exactly 2-3 sentences, parsed and validated before file writing

  ## Non-Functional Requirements

  - **NFR-1**: File creation and git operations must complete without errors or exceptions
  - **NFR-2**: File must be immediately readable as valid UTF-8 encoded markdown
  - **NFR-3**: Markdown formatting must be consistent with existing test-*.md files in the repository (established pattern from features 101-131)
  - **NFR-4**: Prose content must be semantically coherent and avoid placeholder/Lorem Ipsum style text
  - **NFR-5**: Git commit message must follow conventional commit standards (feat(#): description)
  - **NFR-6**: Implementation must use only existing Sheep platform capabilities (no new dependencies)
  - **NFR-7**: Implementation must be completable in a single commit with minimal complexity (< 50 lines of new code)
  - **NFR-8**: File size should be approximately 400-600 bytes (consistent with similar test files)
  - **NFR-9**: Implementation must follow the same feature module pattern as features 101-131 (if dedicated module approach is selected)
  - **NFR-10**: Content generation must respect API rate limits and timeout constraints (via CrewAI framework)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | -------- | --------- |
  | 1 | Dedicated module or direct orchestration? | Dedicated feature module | Maintains consistency with 100+ preceding features; enables testing and code organization. |
  | 2 | How to handle content validation failures? | Retry with backoff | Improves reliability; transient LLM formatting issues benefit from retry logic. |

  ## Codebase Architecture & Context

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root directory**: Contains main README.md, 130+ test markdown files (test-*.md pattern), state machine diagrams, and Python utility scripts
  - **specs/**: Feature specifications in YAML format (specs/001-*, ... specs/132-*)
  - **src/sheep/**: Core platform code:
    - `content_generators.py` - Markdown generation, file I/O, validation, git operations
    - `features/` - Feature implementations (feature_127_markdown_file_creation.py, etc.)
    - `agents/` - CrewAI agents for research, implementation, review
    - `config/` - LLM configuration
    - `tools/` - Git and file tools
  - **.github/workflows/**: CI/CD pipelines (ci.yml)

  ### Architecture Patterns

  1. **Spec-First Development**: Features defined in `specs/{number}-{name}/spec.yaml` before implementation
  2. **Modular Content Generation**: `content_generators.py` provides orchestration functions:
     - `generate_markdown_content(topic)` - Uses Claude LLM to generate H1 + 2-3 sentences
     - `write_markdown_file(filename, content)` - Creates file with UTF-8/LF
     - `validate_markdown_file(filepath)` - Validates structure, encoding, line endings
     - `commit_markdown_file(filepath, message)` - Stages and commits
     - `push_markdown_file(filepath)` - Pushes to remote
     - `create_markdown_file(filename)` - Orchestrates complete workflow
  3. **CrewAI LLM Integration**: Uses `get_reasoning_llm()` from config for Claude API calls
  4. **Git Workflow**: Conventional commits (feat(#): description) pushed to feature branches
  5. **Validation Layer**: Strict validation (UTF-8, LF endings, H1, 2-3 sentences)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | New markdown file (test-0j9m9t.md) created in repo root, following pattern of 131+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations: staging, conventional commit, pushing to feature branch |
  | File system I/O | High | Python file operations required for creation and writing with proper formatting |
  | src/sheep/content_generators.py | Low | Existing reusable functions used (no modifications needed) |
  | src/sheep/features/ | Medium | New or modified feature module to orchestrate the creation workflow |

  ## Dependencies

  **No new external dependencies** — This feature uses existing Sheep platform capabilities:

  1. **Content Generation** - `src/sheep/content_generators.py::generate_markdown_content()` (Claude LLM)
  2. **File Creation** - `src/sheep/content_generators.py::write_markdown_file()` (pathlib, file I/O)
  3. **File Validation** - `src/sheep/content_generators.py::validate_markdown_file()` (UTF-8, LF, markdown structure)
  4. **Git Integration** - `src/sheep/content_generators.py::commit_markdown_file()`, `push_markdown_file()`
  5. **LLM Configuration** - `src/sheep/config/llm.py::get_reasoning_llm()` (Claude API client)

  The feature follows the established pattern from features 101-131 using existing `create_markdown_file()` orchestration or a new dedicated feature module following the same pattern.

  ## Size Estimate

  **S** (Small) — A few hours of work.

  **Justification:**
  - Simple, repetitive task following established pattern
  - Repeated 30+ times in preceding features (101-131)
  - No code changes or architectural modifications needed
  - Existing infrastructure handles heavy lifting
  - Straightforward implementation: generate → write → validate → stage → commit → push
  - Based on git history, similar features (127-131) completed in single commit with minimal complexity
  - Implementation can be 30-50 lines of Python code for dedicated module approach
