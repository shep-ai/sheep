content: |
  ## Problem Statement

  Create a single markdown file named test-0j9m9t.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (132) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root directory**: Contains the main README.md, 130+ test markdown files (test-*.md pattern), state machine diagrams, and Python utility scripts for feature creation
  - **specs/**: Contains 132+ feature specifications in YAML format, organized by feature number (specs/001-*, specs/002-*, ... specs/132-*)
  - **src/sheep/**: Core platform code including:
    - `content_generators.py` - Markdown generation, file I/O, validation, git operations
    - `features/` - Feature implementations (feature_127_markdown_file_creation.py, etc.)
    - `agents/` - CrewAI agents for research, implementation, review
    - `config/` - LLM configuration and settings
    - `tools/` - Git tools and file tools
  - **.github/workflows/**: CI/CD pipelines (ci.yml with build and test steps)
  - **Dockerfile**: Container definition for the platform
  - **.claude/**: Claude Code configuration directory

  The repository follows a spec-first development model where each feature is defined in a YAML specification file before implementation begins.

  ### Architecture Patterns

  1. **Spec-First Development**: Features are defined in `specs/{number}-{name}/spec.yaml` before implementation
  2. **Modular Content Generation**: The `content_generators.py` module provides reusable functions:
     - `generate_markdown_content()` - Uses Claude LLM to generate H1 heading + 2-3 sentences
     - `write_markdown_file()` - Creates file with UTF-8 encoding at repo root
     - `validate_markdown_file()` - Validates file structure, encoding, line endings
     - `commit_markdown_file()` - Stages and commits with conventional message
     - `push_markdown_file()` - Pushes to remote with upstream tracking
     - `create_markdown_file()` - Orchestrates complete workflow
  3. **CrewAI LLM Integration**: Uses `get_reasoning_llm()` from config to call Claude API for content generation
  4. **Git Workflow**: All changes follow conventional commits (feat(#): description) and are pushed to feature branches
  5. **Validation Layer**: Ensures all files meet strict requirements (UTF-8, LF endings, H1 heading, 2-3 sentences)

  ### Relevant Technologies

  - **Python 3**: File I/O (pathlib), string manipulation, script orchestration
  - **CrewAI Framework**: LLM orchestration and agent execution
  - **Claude API**: Content generation via LLM (via get_reasoning_llm())
  - **Git**: Version control, staging, committing, and pushing to remote
  - **Markdown**: Simple structured text format for documentation

  ## Success Criteria

  - [ ] File \"test-0j9m9t.md\" is created in the repository root directory
  - [ ] File contains valid markdown syntax with no formatting errors
  - [ ] File includes an H1 heading (prefixed with `# `) as the first element
  - [ ] H1 heading is followed by a blank line (standard markdown formatting)
  - [ ] File contains exactly 2-3 complete, coherent sentences of prose content
  - [ ] File is encoded as UTF-8 with UNIX line endings (LF, not CRLF)
  - [ ] File ends with a trailing newline (POSIX convention)
  - [ ] File is committed with conventional commit message: \"feat(132): create markdown file test-0j9m9t.md with prose content\"
  - [ ] Changes are pushed to feature branch (feat/132-markdown-file-creation-3e26a2)
  - [ ] No errors or warnings during file creation or git operations
  - [ ] File structure and formatting are consistent with existing test-*.md files (131 and prior)

  ## Functional Requirements

  - **FR-1**: System must create a new file named exactly \"test-0j9m9t.md\" in the repository root directory
  - **FR-2**: File must contain an H1 markdown heading (prefixed with `# `) as the first line of content
  - **FR-3**: There must be a blank line between the H1 heading and the prose content
  - **FR-4**: File must contain exactly 2-3 complete sentences of coherent prose content
  - **FR-5**: All content must use valid markdown syntax with no broken formatting
  - **FR-6**: File must use UTF-8 encoding with UNIX line endings (LF, not CRLF)
  - **FR-7**: File must end with a trailing newline character
  - **FR-8**: System must stage the file to git using `git add test-0j9m9t.md`
  - **FR-9**: System must create a git commit with appropriate conventional message
  - **FR-10**: System must push the commit to the remote feature branch

  ## Non-Functional Requirements

  - **NFR-1**: File creation and git operations must complete without errors or exceptions
  - **NFR-2**: File must be immediately readable as valid UTF-8 encoded markdown
  - **NFR-3**: Markdown formatting must be consistent with existing test-*.md files in the repository (established pattern from features 101-131)
  - **NFR-4**: Prose content must be semantically coherent and avoid placeholder/Lorem Ipsum style text
  - **NFR-5**: Git commit message must follow conventional commit standards (feat(#): description)
  - **NFR-6**: Implementation must use only existing Sheep platform capabilities (no new dependencies)
  - **NFR-7**: Implementation must be completable in a single commit with minimal complexity
  - **NFR-8**: File size should be approximately 400-600 bytes (consistent with similar test files)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-0j9m9t.md) will be created in the repository root, following the pattern of 131+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | src/sheep/content_generators.py | Low | Existing reusable functions will be used for content generation, validation, and git operations (no modifications needed) |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **Content Generation** - `src/sheep/content_generators.py::generate_markdown_content()` uses Claude LLM to generate H1 heading + 2-3 sentences prose
  2. **File Creation** - `src/sheep/content_generators.py::write_markdown_file()` uses Python's pathlib and file I/O
  3. **File Validation** - `src/sheep/content_generators.py::validate_markdown_file()` validates UTF-8 encoding, LF line endings, markdown structure
  4. **Git Integration** - `src/sheep/content_generators.py::commit_markdown_file()` and `push_markdown_file()` handle staging, committing, and pushing
  5. **LLM Configuration** - `src/sheep/config/llm.py::get_reasoning_llm()` provides Claude API client

  The feature follows an established pattern used in features 101-131, so no new dependencies or utilities need to be created. The implementation can use the existing `create_markdown_file()` orchestration function.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 30+ times in preceding features (101-131)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (content_generators.py functions) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → validate → stage → commit → push
  - Based on git history, similar features (127-131) were completed in a single commit with minimal complexity
  - Can be implemented by directly calling `create_markdown_file(\"test-0j9m9t.md\")` function or by creating a new feature module that follows the pattern of feature_127_markdown_file_creation.py

