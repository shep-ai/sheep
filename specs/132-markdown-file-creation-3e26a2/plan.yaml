content: |
  ## Architecture Overview

  Feature 132 follows the canonical pattern established by features 101-131. The implementation consists of a single Python module that orchestrates the complete workflow using existing infrastructure from content_generators.py.

  ### Module Structure

  ```
  src/sheep/features/feature_132_markdown_file_creation.py
    ├── Module docstring (feature overview)
    ├── Imports from content_generators (5 functions)
    ├── Imports from observability.logging (get_logger)
    ├── Module constants:
    │   ├── FEATURE_NUMBER = 132
    │   ├── FEATURE_NAME = "markdown-file-creation-3e26a2"
    │   └── MARKDOWN_FILENAME = "test-0j9m9t.md"
    ├── Main function: create_feature_132_markdown_file(repo_path=None) -> dict[str, str]
    └── __main__ block for CLI execution
  ```

  ### Workflow Orchestration (5 Steps)

  The implementation orchestrates the exact sequence validated across 131 preceding features:

  1. **Generate Content** -> Call generate_markdown_content() -> Claude LLM with temperature=0.2
     - Returns: markdown string with H1 heading + blank line + 2-3 sentences
     - Validation: format checking happens inside generate_markdown_content()

  2. **Write File** -> Call write_markdown_file(content, "test-0j9m9t.md")
     - Writes to repo root with UTF-8 encoding, no BOM
     - Python handles LF line endings on Unix systems
     - Returns: filepath as string

  3. **Validate** -> Call validate_markdown_file(filepath)
     - Post-write comprehensive validation: UTF-8, LF, H1, blank line, 2-3 sentences, trailing newline
     - Raises ValueError if any check fails

  4. **Commit** -> Call commit_markdown_file(filepath, content, repo_path, custom_message=...)
     - Uses exact commit message: "feat(132): create markdown file test-0j9m9t.md with prose content"
     - custom_message parameter allows explicit format control (feature_127 pattern)
     - Stages file and commits

  5. **Push** -> Call push_markdown_file(repo_path)
     - Pushes to origin with upstream tracking (-u flag)
     - Pushes to current feature branch (feat/132-markdown-file-creation-3e26a2)

  ## Key Design Decisions

  ### Decision 1: Dedicated Feature Module (vs Direct Orchestration)

  **Chosen:** Create dedicated module at src/sheep/features/feature_132_markdown_file_creation.py

  **Rationale:**
  - All 131 preceding features (101-131) use this exact pattern
  - Provides consistent interface across the platform
  - Enables testing and code organization
  - Established architectural standard in the codebase
  - Feature_127 demonstrates the exact pattern to follow

  **Alternative Rejected:**
  - Direct call to create_markdown_file() from content_generators.py
  - Would break consistency with 130+ existing features
  - Harder to test and customize per feature

  ### Decision 2: Claude 3.5 Sonnet via CrewAI (LLM Provider)

  **Chosen:** Claude 3.5 Sonnet via get_reasoning_llm() with temperature=0.2

  **Rationale:**
  - Existing infrastructure in config/llm.py
  - All 131 prior features use this exact configuration
  - Temperature=0.2 ensures consistent, high-quality output
  - MARKDOWN_GENERATION_PROMPT template proven to work
  - Satisfies specification requirement FR-11 (Claude generation)

  **Alternative Rejected:**
  - GPT-4o or other LLM providers would require separate API setup, breaking platform standardization
  - Hardcoded content would violate FR-11 requirement

  ### Decision 3: Content Validation Strategy

  **Chosen:** Validate LLM response in generate_markdown_content(); propagate exceptions to caller

  **Rationale:**
  - generate_markdown_content() includes _validate_markdown_content() (checks H1, sentence count, length)
  - validate_markdown_file() performs post-write comprehensive validation
  - Two-stage validation ensures correctness without retry logic needed in feature module
  - Simple exception propagation keeps feature module lightweight
  - Caller (test runner) handles failures via exception handling
  - Research findings note that generate_markdown_content() validates before returning

  **Alternative Rejected:**
  - Implementing explicit retry logic in feature module (unnecessary complexity)
  - Silent fallback to hardcoded content (violates spec requirement FR-11)

  ### Decision 4: File Encoding and Line Endings

  **Chosen:** UTF-8 encoding without BOM; Unix LF line endings; trailing newline

  **Rationale:**
  - write_markdown_file() uses open(encoding="utf-8") which handles LF on Unix systems
  - validate_markdown_file() explicitly rejects CRLF (line 195-197 in content_generators.py)
  - generate_markdown_content() ensures trailing newline (lines 56-57 in content_generators.py)
  - validate_markdown_file() verifies trailing newline presence (line 233-234)
  - POSIX convention standard across the platform
  - All 131 existing test-*.md files use this format
  - Satisfies specification requirements FR-6, FR-7, NFR-3

  **Alternative Rejected:**
  - CRLF line endings (Windows format) would fail validate_markdown_file() checks
  - UTF-8 with BOM adds unnecessary overhead

  ### Decision 5: Git Commit Message Format

  **Chosen:** Conventional commits with explicit format: "feat(132): create markdown file test-0j9m9t.md with prose content"

  **Rationale:**
  - Specification explicitly requires this exact message format (FR-9)
  - Feature_127 demonstrates the pattern: custom_message parameter with explicit format (lines 84-86)
  - Provides clear traceability to feature number (132) and specific filename
  - Follows conventional commit standards (type: feat, scope: (132), subject: description)
  - All prior features use this explicit format

  **Alternative Rejected:**
  - Auto-extracted topic format (less explicit, varies by feature)
  - Minimal format (loses traceability to feature number)

  ## Implementation Strategy

  ### Phase 1: Foundation & Reference Study (Minimal Task)
  - Read feature_127_markdown_file_creation.py to understand exact pattern
  - Review content_generators.py functions to understand orchestration
  - Verify imports and module structure

  ### Phase 2: Feature Module Implementation
  - Create src/sheep/features/feature_132_markdown_file_creation.py
  - Add module docstring, imports, constants
  - Implement create_feature_132_markdown_file(repo_path=None) function with 5-step workflow
  - Add logging at each step (following feature_127 pattern)
  - Add error handling with exception propagation
  - Add __main__ block for CLI execution

  ### Phase 3: Unit & Integration Testing
  - Test each of 5 workflow steps individually
  - Test with both mocks (for speed) and real operations (for correctness)
  - Verify error handling and logging
  - Test integration across all 5 steps

  ### Phase 4: Verification & Final Commit
  - Run full end-to-end integration test
  - Verify file structure: H1 heading, blank line, 2-3 sentences, encoding, line endings, trailing newline
  - Verify git commit message exact format
  - Verify file appears on feature branch (feat/132-markdown-file-creation-3e26a2)
  - Commit plan and implementation with conventional commit message

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM API call fails | Low | High | generate_markdown_content() raises exception which propagates; caller handles via try-catch |
  | Generated content fails validation | Low | Medium | _validate_markdown_content() in generate_markdown_content() catches format errors before file write |
  | File write fails | Very Low | High | write_markdown_file() raises IOError; propagates to caller |
  | Git operations fail | Low | Medium | commit_markdown_file() and push_markdown_file() raise exceptions on subprocess failure |
  | File does not match spec after write | Very Low | High | validate_markdown_file() comprehensive check catches any discrepancies (encoding, line endings, format) |
  | Module imports fail | Very Low | Medium | Imports from existing modules (content_generators, observability.logging) which are proven working |
  | Inconsistency with feature_127 pattern | Very Low | Medium | Exact pattern matching from feature_127 prevents deviations; code review ensures consistency |

  ## Success Criteria

  The implementation is complete and correct when:

  1. ✅ File src/sheep/features/feature_132_markdown_file_creation.py is created
  2. ✅ Module follows exact structure and pattern of feature_127
  3. ✅ create_feature_132_markdown_file() orchestrates all 5 steps with logging
  4. ✅ Test file test-0j9m9t.md is created at repository root
  5. ✅ File contains valid H1 heading + blank line + 2-3 sentences
  6. ✅ File uses UTF-8 encoding, LF line endings, trailing newline
  7. ✅ Git commit message is exactly: "feat(132): create markdown file test-0j9m9t.md with prose content"
  8. ✅ File is pushed to feature branch feat/132-markdown-file-creation-3e26a2
  9. ✅ All workflow steps pass validation
  10. ✅ Implementation complete in single commit
