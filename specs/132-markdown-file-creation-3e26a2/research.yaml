  | FR-3: Blank line separator | generate_markdown_content() adds blank line | validate_markdown_file() checks lines[1] == "" |
  | FR-4: 2-3 sentences | _validate_markdown_content() counts periods | validate_markdown_file() recounts periods |
  | FR-5: Valid markdown | Template + validation | validate_markdown_file() comprehensive check |
