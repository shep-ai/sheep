content: |
  ## Research Summary

  Feature 132 is a straightforward markdown file creation task, the 32nd iteration of an identical feature pattern
  established across features 101-131. This research evaluates the technical decisions required to implement the feature
  using the Sheep platform's existing infrastructure.

  **Key Findings:**
  - No novel architectural challenges; follows established pattern from 130 preceding features
  - All required infrastructure already exists in content_generators.py
  - No new dependencies required
  - All technology decisions validated by prior feature implementations

  ## Architecture Overview

  ### Module Structure

  Feature 132 follows the canonical pattern established by features 101-131:

  ```
  src/sheep/features/feature_132_markdown_file_creation.py
    ├── Import from content_generators:
    │   ├── generate_markdown_content()
    │   ├── write_markdown_file()
    │   ├── validate_markdown_file()
    │   ├── commit_markdown_file()
    │   └── push_markdown_file()
    ├── Module constants:
    │   ├── FEATURE_NUMBER = 132
    │   ├── FEATURE_NAME = "markdown-file-creation-3e26a2"
    │   └── MARKDOWN_FILENAME = "test-0j9m9t.md"
    └── Function:
        └── create_feature_132_markdown_file(repo_path=None) -> dict[str, str]
  ```

  ### Workflow Orchestration

  ```
  create_feature_132_markdown_file(repo_path)
    │
    ├─→ Step 1: generate_markdown_content()
    │   └─→ Claude 3.5 Sonnet LLM call
    │   └─→ Returns: "# Title\n\nSentence 1. Sentence 2. Sentence 3.\n"
    │   └─→ Validates: H1 heading, sentence count, minimum length
    │
    ├─→ Step 2: write_markdown_file(content, "test-0j9m9t.md")
    │   └─→ Path: {repo_root}/test-0j9m9t.md
    │   └─→ Encoding: UTF-8 (no BOM)
    │   └─→ Validates: filename safety, file creation, non-empty
    │
    ├─→ Step 3: validate_markdown_file(filepath)
    │   └─→ UTF-8 encoding check, LF line endings, H1 heading
    │   └─→ Blank line separator, sentence count (2-3)
    │   └─→ Trailing newline (POSIX convention)
    │
    ├─→ Step 4: commit_markdown_file(filepath, content, custom_message)
    │   └─→ Message: "feat(132): create markdown file test-0j9m9t.md with prose content"
    │   └─→ Command: git add test-0j9m9t.md
    │   └─→ Command: git commit -m "<message>"
    │
    └─→ Step 5: push_markdown_file(repo_path)
        └─→ Command: git push -u origin feat/132-markdown-file-creation-3e26a2
        └─→ Returns: push result summary
  ```

  ## Technical Decisions

  ### 1. Dedicated Feature Module Architecture

  **Decision:** Create src/sheep/features/feature_132_markdown_file_creation.py as a dedicated module.

  **Justification:**
  - Feature 127 and all preceding features (101-131) use this exact pattern
  - Provides consistent interface across platform
  - Enables testing and code reuse
  - Established architectural standard in codebase

  **Implementation Pattern:**
  ```python
  # feature_132_markdown_file_creation.py
  from sheep.content_generators import (
      generate_markdown_content,
      write_markdown_file,
      validate_markdown_file,
      commit_markdown_file,
      push_markdown_file,
  )

  FEATURE_NUMBER = 132
  MARKDOWN_FILENAME = "test-0j9m9t.md"

  def create_feature_132_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """Orchestrate markdown file creation workflow."""
      # 5 steps: generate → write → validate → commit → push
  ```

  ### 2. Claude LLM via CrewAI

  **Decision:** Use Claude 3.5 Sonnet via get_reasoning_llm() with temperature=0.2.

  **Justification:**
  - Existing infrastructure in config/llm.py
  - All 130 prior features use this exact configuration
  - Temperature 0.2 ensures consistent, high-quality output
  - MARKDOWN_GENERATION_PROMPT template proven to work

  **Configuration Chain:**
  - Feature module → generate_markdown_content() → get_reasoning_llm() → CrewAI LLM → Anthropic API

  **Prompt Template:**
  ```
  Generate a markdown document with the following structure:
  1. An H1 heading (using #) with a title about any topic you choose
  2. A blank line
  3. Exactly 2-3 sentences of coherent prose about that topic

  Return ONLY the markdown content, no additional text or explanation.
  ```

  ### 3. Content Validation and Error Handling

  **Decision:** Validate LLM response in generate_markdown_content(); propagate exceptions to caller.

  **Validation Checks in generate_markdown_content():**
  - Content is non-empty
  - Starts with H1 heading ("# ")
  - Minimum length (50+ characters)
  - Sentence count is 2-3 (count periods)
  - Ensures trailing newline

  **Post-Write Validation in validate_markdown_file():**
  - UTF-8 encoding (no BOM)
  - LF line endings only (no CRLF)
  - H1 heading at start
  - Blank line separator
  - 2-3 sentence prose content
  - Trailing newline

  **Error Strategy:**
  - ValueError raised if validation fails
  - Feature module lets exception propagate
  - Caller (test runner) handles failure
  - No silent fallbacks or retries in feature module

  ### 4. File Encoding and Line Endings

  **Decision:** UTF-8 encoding without BOM; Unix LF line endings; trailing newline.

  **Technical Details:**
  - Python open(path, "w", encoding="utf-8") uses system default line endings
  - On Unix systems (Linux, macOS), this means LF ("\n")
  - Windows systems would use CRLF, but validate_markdown_file() rejects CRLF
  - generate_markdown_content() ensures trailing newline (line 56-57)
  - validate_markdown_file() verifies UTF-8 decoding, LF usage, and trailing newline

  **POSIX Compliance:**
  - Trailing newline is POSIX convention for text files
  - LF line endings are standard on Unix systems
  - Required by specification (FR-7, NFR-3)

  ### 5. Git Workflow and Conventional Commits

  **Decision:** Use explicit conventional commit message with feature number and filename.

  **Commit Message Format:**
  ```
  feat(132): create markdown file test-0j9m9t.md with prose content
  ```

  **Message Components:**
  - Type: "feat" (new feature)
  - Scope: "(132)" (feature number for traceability)
  - Subject: "create markdown file test-0j9m9t.md with prose content"

  **Git Operations:**
  ```bash
  git add test-0j9m9t.md
  git commit -m "feat(132): create markdown file test-0j9m9t.md with prose content"
  git push -u origin feat/132-markdown-file-creation-3e26a2
  ```

  **Feature 127 Implementation Reference:**
  Feature 127 shows this exact pattern at lines 84-86:
  ```python
  commit_message = f"feat({FEATURE_NUMBER}): create markdown file {MARKDOWN_FILENAME} with prose content"
  commit_markdown_file(filepath, content, repo_path, custom_message=commit_message)
  ```

  ### 6. File Location and Naming

  **Decision:** Repository root directory; exact filename test-0j9m9t.md.

  **Technical Implementation:**
  - Path resolution: repo_root = Path.cwd() (from write_markdown_file line 120)
  - Filename validation: reject "/" "\\" and "." prefixes (line 116)
  - Result: {repo_root}/test-0j9m9t.md

  **Consistency:**
  - All 130 existing test-*.md files in repository root
  - Matches specification requirements (FR-1, NFR-3)

  ## Library Analysis

  | Library/Tool | Purpose | Status | Rationale |
  | ------------ | ------- | ------ | --------- |
  | pathlib | File path handling | Use | Python standard library; safer than strings; already used throughout |
  | CrewAI | LLM framework & tools | Use | Unified LLM interface; Git tools already integrated; platform standard |
  | Anthropic Claude API | LLM provider | Use | Industry-leading model; platform standard; proven in 130+ features |
  | subprocess | Git command execution | Use | Standard library; GitTools wrap it; enables version control integration |
  | logging | Observability | Use | Platform standard logging via get_logger(); consistent throughout |

  **Rejected Libraries:**
  - OpenAI API (GPT-4o) - breaks platform standard, requires different API setup
  - Dulwich/GitPython - unnecessary abstraction, subprocess works fine
  - Custom retry logic - validation in content_generators sufficient

  ## Security Analysis

  ### Input Validation
  - **Filename validation:** write_markdown_file() rejects "/" "\\" and "." prefixes (line 116)
  - **Path traversal prevention:** No directory separators allowed in filename
  - **Assessment:** SECURE - prevents malicious filename injection

  ### API Integration
  - **No prompt injection:** LLM prompt is static; no user input flows to prompt
  - **API key security:** Managed via SecretStr in settings.py; not exposed in logs
  - **Assessment:** SECURE - standard API key management practices

  ### Git Integration
  - **Command injection prevention:** subprocess uses list format, not shell=True (git_tools.py line 22-27)
  - **Message format:** Pre-constructed message, no user input in git commands
  - **Assessment:** SECURE - proper subprocess usage prevents injection

  ### File System
  - **File permissions:** Python creates files with standard umask (typically 0o644)
  - **UTF-8 validation:** File validated for proper encoding on read
  - **Assessment:** ACCEPTABLE - standard Unix file permissions appropriate for repo

  ## Performance Considerations

  ### API Costs
  - **LLM call:** ~1 API call per feature execution (~$0.003 typical cost)
  - **Total for 132 features:** ~$0.40 USD; acceptable for test suite
  - **Mitigation:** No caching needed; costs are reasonable

  ### Execution Time
  - **LLM generation:** ~0.5-2 seconds per API call
  - **File I/O:** <100ms (write ~500 bytes)
  - **Git operations:** ~100-500ms per (add, commit, push)
  - **Total per feature:** ~2-4 seconds
  - **Assessment:** ACCEPTABLE - appropriate for test suite

  ### Memory Usage
  - **Per feature:** ~500 bytes content + overhead = <10KB
  - **Total for 132 features:** <2MB
  - **Assessment:** NEGLIGIBLE

  ### Network I/O
  - **git push:** Creates 132 remote branches (~200-500ms each)
  - **Justification:** Required by specification (FR-10, push to feature branch)
  - **Assessment:** ACCEPTABLE - expected for test suite

  ## Integration Points

  ### content_generators.py Functions
  - **generate_markdown_content()** → LLM + validation
  - **write_markdown_file()** → File I/O + encoding
  - **validate_markdown_file()** → Structure + format validation
  - **commit_markdown_file()** → Git staging + commit
  - **push_markdown_file()** → Git push + upstream tracking

  ### config/llm.py
  - **get_reasoning_llm()** → Returns configured Claude LLM instance
  - **Temperature:** 0.2 (consistent, high-quality output)

  ### tools/git_tools.py
  - **GitCommitTool** → Used by commit_markdown_file()
  - **GitPushTool** → Used by push_markdown_file()
  - **Error handling:** Subprocess-based, raises exceptions on failure

  ### observability/logging.py
  - **get_logger()** → INFO/DEBUG/ERROR structured logging
  - **Used by:** All content_generators functions

  ## Open Questions Resolved

  ### Q1: Dedicated Module vs Direct Orchestration?
  **Resolution:** Dedicated feature module
  - All 130 prior features use dedicated modules
  - Enables testing, code organization, reuse
  - Minimal overhead; established pattern

  ### Q2: Handle Validation Failures?
  **Resolution:** Raise exceptions; let caller handle
  - Validation in generate_markdown_content() catches format errors
  - Post-write validation in validate_markdown_file() ensures correctness
  - No silent fallbacks; fail fast principle

  ### Q3: Cache Generated Content?
  **Resolution:** No caching; generate fresh content per execution
  - Test suite requires unique, fresh content per run
  - Non-deterministic results harm auditability
  - API costs acceptable (~$0.003 per feature)

  ## Success Criteria Mapping

  | Requirement | Implementation | Validation |
  | ----------- | -------------- | ---------- |
  | FR-1: File created at root | write_markdown_file(content, "test-0j9m9t.md") | File exists at repo root |
