content: |
  ## Problem Statement

  Create a single markdown file called `test-eyqdut.md` in the repository root with a title and 2-3 sentences of prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established
  pattern and convention used throughout 295+ previous iterations in this repository (features 001-295).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-eyqdut.md`
  - Committed with conventional commit message: `feat(296): create markdown file test-eyqdut.md with prose content`
  - Pushed to the feature branch `feat/296-markdown-file-creation-272c45`

  ## Success Criteria

  - [ ] File `test-eyqdut.md` created in repository root directory
  - [ ] File begins with H1 heading using `# Title` format on first line
  - [ ] H1 heading is followed by exactly one blank line (no more, no less)
  - [ ] File contains 2-3 sentences of readable, coherent prose content after the blank line
  - [ ] File is UTF-8 encoded without byte-order mark (BOM)
  - [ ] File uses Unix LF line endings exclusively (never Windows CRLF or mixed)
  - [ ] File size is between 400-600 bytes (natural consequence of proper structure)
  - [ ] File is staged using `git add test-eyqdut.md`
  - [ ] Git commit created with exact message: `feat(296): create markdown file test-eyqdut.md with prose content`
  - [ ] Commit exists on feature branch `feat/296-markdown-file-creation-272c45`
  - [ ] All changes are pushed to remote origin repository
  - [ ] No modifications to existing files, source code, tests, or configuration

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-eyqdut.md` in the repository root directory using Python pathlib `Path.write_text()` method
  - **FR-2**: File structure must be: H1 heading (line 1) + blank line (line 2) + prose content (lines 3+) with no additional blank lines or formatting
  - **FR-3**: H1 heading must use CommonMark-compliant syntax: `# ` followed by descriptive title text (minimum 2 words, maximum 50 characters)
  - **FR-4**: Prose content must consist of exactly 2 or 3 complete sentences per established pattern
  - **FR-5**: Stage the newly created file using `git add test-eyqdut.md` command
  - **FR-6**: Create a git commit with conventional commit message: `feat(296): create markdown file test-eyqdut.md with prose content` (exact text required)
  - **FR-7**: Push all changes to the remote origin using `git push origin feat/296-markdown-file-creation-272c45`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without byte-order mark (BOM); pathlib `write_text(encoding='utf-8')` ensures this
  - **NFR-2**: File line endings must be Unix LF (`\n`) exclusively; must not contain Windows CRLF (`\r\n`) or mixed line endings
  - **NFR-3**: File size should naturally fall within 400-600 bytes as a consequence of H1 heading (~20-40 bytes) + blank line (1 byte) + 2-3 sentences (~350-550 bytes)
  - **NFR-4**: Implementation must follow established pattern from features 001-295; file structure and git workflow must be identical to prior 295 implementations
  - **NFR-5**: Code must be compatible with Python 3.11+ as specified in project pyproject.toml; must use only standard library modules (pathlib, subprocess/os for git)
  - **NFR-6**: Implementation must not modify existing files, configuration, tests, or source code; changes are limited to file creation and git operations
  - **NFR-7**: Prose content must be original, coherent, and grammatically correct

  ## Product Decisions & AI Recommendations

  This feature is exceptionally well-defined by 295+ prior implementations. All significant product-level decisions have been locked in by established precedent and are clearly specified in the requirements above. **No ambiguous product decisions require input at this stage.**

  Decisions already established and locked in:
  - **File location**: Repository root (consistent across all 295+ prior implementations)
  - **File naming**: `test-eyqdut.md` (pre-specified in the feature specification)
  - **Content structure**: H1 heading + blank line + 2-3 prose sentences (pattern established and proven across 295+ features)
  - **Prose content topic**: Free choice by implementer (user query explicitly states "about anything" for flexibility)
  - **Prose quality requirements**: Original, coherent, grammatically correct (NFR-7)
  - **Git workflow**: Conventional commits, feature branch, push to origin (standard practice established across entire repository)
  - **Encoding and line endings**: UTF-8 without BOM, Unix LF only (established pattern, NFR-1 and NFR-2)

  The specification is complete and ready to move forward.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-eyqdut.md) to existing collection of 295+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-295; no branch/merge complexity, no destructive operations |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or infrastructure |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests (/tests/) | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/296-markdown-file-creation-272c45` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 295+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<random-string>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes of actual implementation work)

  **Breakdown**:
  - File creation with prose content generation: ~5-7 minutes
  - Basic validation (file exists, format correct): ~2-3 minutes
  - Git operations (stage, commit, push): ~3-5 minutes
  - **Total**: 10-15 minutes of active implementation

  **Justification**:
  - Well-established pattern with 295+ identical test files providing clear, proven precedent
  - No architectural decisions, design choices, or research required
  - Flexible topic selection with no constraints; implementer chooses freely
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - File naming (test-eyqdut.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 295+ prior implementations
  - Recent feature implementations (290-295) demonstrate efficient execution in 10-20 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern

  ---

  _Requirements phase complete — all functional and non-functional requirements specified, no ambiguous product decisions identified, feature ready for research and planning phases_
