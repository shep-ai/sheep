content: |
  ## Architecture Overview

  Feature 296 follows the established thin wrapper pattern proven across 295+ prior markdown file implementations. The architecture has three layers:

  1. **Feature Module Layer** (feature_296_markdown_file_creation.py)
     - Entry point for the feature
     - Contains feature metadata (FEATURE_NUMBER, MARKDOWN_FILENAME)
     - Thin wrapper that orchestrates by calling sheep.content_generators.create_markdown_file()
     - Provides main() for CLI integration
     - Handles logging and result reporting

  2. **Orchestration Layer** (sheep.content_generators.create_markdown_file())
     - Core logic that coordinates the entire workflow
     - Generates markdown content via Claude API (sheep.config.llm.get_reasoning_llm())
     - Writes file using pathlib.Path.write_text() with UTF-8 encoding
     - Validates at three stages: content generation, file properties, markdown structure
     - Stages file with git add
     - Creates conventional commit with exact message format
     - Pushes to remote origin using sheep.tools.GitPushTool

  3. **Supporting Libraries**
     - **pathlib**: Atomic file creation with guaranteed UTF-8 encoding and Unix LF line endings
     - **CrewAI/Claude API**: Coherent, original prose generation meeting NFR-7 quality requirements
     - **sheep.tools**: Abstracted git operations (GitCommitTool, GitPushTool) with error handling
     - **sheep.config.llm**: LLM configuration with exponential backoff retry logic

  This architecture ensures **100% code reuse** — no duplication with prior 295+ implementations.

  ## Key Design Decisions

  ### 1. Thin Wrapper Pattern (Feature Module)
  **Chosen:** Create feature_296_markdown_file_creation.py as a thin wrapper calling sheep.content_generators.create_markdown_file()

  **Rationale:** This pattern is proven across all 295+ prior implementations. It provides:
  - Consistency with established feature structure
  - Clear separation: feature metadata in module, orchestration logic in sheep.content_generators
  - Reuse of tested, reliable orchestration code (no duplication)
  - Integration with sheep CLI and package structure
  - Centralized error handling at the orchestration layer

  **Alternative Rejected:** Implementing orchestration directly in feature module — would duplicate logic across 296 features and create maintenance burden.

  ### 2. Content Generation via Claude API + CrewAI
  **Chosen:** Use sheep.config.llm.get_reasoning_llm() to generate original prose via Claude API

  **Rationale:** Research findings confirm this approach is proven across all 295+ implementations:
  - Generates coherent, original prose meeting NFR-7 (must be original, coherent, grammatically correct)
  - CrewAI framework abstracts multi-provider support (OpenAI, Anthropic, Google, Cursor)
  - Built-in exponential backoff retry logic makes feature resilient to API transients
  - ~2-3 second latency per feature is acceptable for automated execution
  - Ensures all 296 files have unique, natural content (no repetition)

  **Alternatives Rejected:**
  - Hardcoded prose templates: lacks originality, not appropriate for 296+ unique test files
  - Content library/caching: violates uniqueness requirement, causes visible repetition
  - Random prose generators: produces low-quality, syntactically inconsistent content

  ### 3. File I/O via pathlib.Path.write_text()
  **Chosen:** Use pathlib.Path.write_text(content, encoding='utf-8') for atomic file creation

  **Rationale:** Modern Python standard with important guarantees:
  - Atomic write: file is either fully written or not at all (no partial files)
  - encoding='utf-8' guarantees UTF-8 without BOM (byte-order mark)
  - Native Unix LF line endings on Linux/Mac (no CRLF on Windows when encoding='utf-8')
  - Portable across platforms
  - Proven across the codebase in sheep.content_generators.write_markdown_file()

  **Alternatives Rejected:**
  - open() context manager: more verbose, requires manual encoding handling
  - subprocess with shell commands: introduces shell injection risk, cross-platform issues

  ### 4. Multi-Stage Validation
  **Chosen:** Three validation checkpoints — content generation, file properties, markdown structure

  **Rationale:** Catches errors at appropriate layers:
  - **Content Validation** (sheep.content_generators._validate_markdown_content()): Detects LLM API failures or invalid output format
  - **File Properties Validation** (validate_file_properties()): Detects encoding/line-ending issues after file I/O
  - **Markdown Structure Validation** (validate_markdown_file()): Confirms H1 heading, blank line, sentence count before commit

  Prevents invalid files from reaching git. Validation failures surface as clear errors before commit, preventing corrupted data.

  **Alternative Rejected:** Single validation or post-commit validation — too late to prevent bad data from being pushed.

  ### 5. Git Workflow via sheep.tools Abstractions
  **Chosen:** Use sheep.tools.GitCommitTool and sheep.tools.GitPushTool wrappers around subprocess

  **Rationale:** Established abstractions across 295+ implementations:
  - Eliminates code duplication (git logic centralized)
  - Consistent error handling and logging
  - Single point of change for git behavior
  - Provides configurable repo paths, custom messages, upstream tracking
  - Safe subprocess invocation with proper argument quoting

  **Alternative Rejected:** Direct subprocess or GitPython library — would duplicate logic or add external dependency.

  ## Implementation Strategy

  The implementation proceeds in four sequential phases:

  **Phase 1 (Feature Module Creation):** Create the module file with proper structure, imports, and metadata. This establishes the entry point and follows conventions from prior features. No complex logic at this stage — just setup.

  **Phase 2 (Function Implementation):** Implement the thin wrapper functions that call the orchestration layer. This is straightforward — most logic lives in sheep.content_generators, the feature module just coordinates. Error handling is delegated to the orchestration layer.

  **Phase 3 (Feature Execution):** Run the feature module to create test-eyqdut.md. The orchestration layer handles all complexity:
  - Generates prose via Claude API (~2-3 seconds)
  - Validates content and file properties
  - Writes file with proper encoding/line-endings
  - Stages, commits, and pushes via git

  **Phase 4 (Verification):** Confirm the file was created correctly and git operations succeeded. Verify file structure (H1 heading, blank line, prose), encoding, line endings, size, and that commit/push are reflected in git history.

  This ordering makes sense because:
  1. Module setup must precede implementation
  2. Implementation must precede execution (can't run code that doesn't exist)
  3. Execution must precede verification (can't verify before running)
  4. Each phase builds on the previous one

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API unavailability during content generation | Exponential backoff retry logic in sheep.config.llm.get_reasoning_llm() (built-in to CrewAI framework). Feature will retry with increasing delays before failing. |
  | File I/O permissions or disk space issues | pathlib.Path.write_text() raises clear exceptions if write fails. Validation layer detects incomplete writes. Error propagates to caller for recovery. |
  | Invalid LLM output (malformed prose) | Content validation (sheep.content_generators._validate_markdown_content()) checks format before file creation. Invalid output is rejected with clear error message. |
  | Git operations fail (commit, push) | sheep.tools.GitCommitTool/GitPushTool wrappers handle git errors and propagate them. Feature fails fast with clear error if git fails. |
  | File encoding issues (CRLF on Windows, BOM) | pathlib.Path.write_text(encoding='utf-8') guarantees proper encoding. Validation layer checks file properties after creation. |
  | Network issues during push to remote | git push is a network operation that can timeout. Retry logic in sheep.tools handles transient failures. Long outages will cause feature to fail — acceptable for this automated use case. |
  | Feature module structure doesn't match prior implementations | Reference feature_295, feature_294, etc. as templates. Follow established import, metadata, and function signature patterns exactly. |

  ## No Breaking Changes

  - Feature creates new file (test-eyqdut.md) — no modifications to existing code
  - No changes to sheep package public API
  - No modifications to tests, configuration, or CI/CD
  - Purely additive: adds one file and one commit to git history
  - Backward compatible with all existing features
