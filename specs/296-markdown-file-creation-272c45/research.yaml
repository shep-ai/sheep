content: |
  ## Status

  - **Phase:** Research — Complete
  - **Updated:** 2026-03-31
  - **Technology Stack Validated:** Yes
  - **Architectural Decisions:** None required — established patterns apply

  ## Summary

  Feature 296 is a continuation of the well-established markdown file creation pattern that spans 295+ prior
  implementations in this codebase. All architectural decisions have been made and proven across prior features.
  The implementation approach is clear, tested, and ready for planning.

  **Key Findings:**
  - Established orchestration pattern in `sheep.content_generators.create_markdown_file()` handles all steps
  - Claude API via CrewAI provides coherent, original prose generation
  - Python pathlib with UTF-8 encoding ensures proper file format
  - Comprehensive multi-stage validation prevents invalid files
  - Git tools wrappers (GitCommitTool, GitPushTool) provide consistent automation
  - Feature module pattern in `src/sheep/features/` is proven across 295+ implementations

  ## Technology Decisions

  ### 1. Content Generation: Claude API via CrewAI LLM Framework

  **Chosen:** `sheep.config.llm.get_reasoning_llm()` with `MARKDOWN_GENERATION_PROMPT`

  **Rejected:**
  - Hardcoded prose templates — lacks originality and coherence for 296+ unique files
  - Random prose generators — produces syntactically inconsistent, low-quality content
  - User input prompts — conflicts with autonomous feature requirement

  **Rationale:** The Claude API provides coherent, original prose that meets all quality requirements
  (NFR-7: must be original, coherent, grammatically correct). CrewAI framework abstracts provider complexity
  and supports multiple LLM providers (OpenAI, Anthropic, Google, Cursor) through the sheep.config.llm module.
  This approach is proven across all 295+ prior markdown file implementations. The get_reasoning_llm() function
  returns a properly configured LLM instance with built-in retry logic and error handling.

  **Implementation Location:** sheep.content_generators.generate_markdown_content()

  ### 2. File I/O: Python pathlib.Path.write_text()

  **Chosen:** `Path(filename).write_text(content, encoding='utf-8')`

  **Rejected:**
  - open() context manager — more verbose and error-prone than pathlib
  - subprocess with shell commands — introduces shell injection risks and cross-platform issues
  - File-like objects and streaming — unnecessary complexity for small 400-600 byte files

  **Rationale:** pathlib.Path.write_text() is the modern Python standard for file I/O. It atomically creates
  or overwrites files with specified encoding. Using encoding='utf-8' guarantees UTF-8 without BOM and uses
  native Unix LF line endings on Linux/Mac systems. This approach is portable, secure, and is the standard
  used across the codebase in sheep.content_generators.write_markdown_file() and all 295+ prior implementations.

  **Implementation Location:** sheep.content_generators.write_markdown_file()

  ### 3. File Validation: Multi-Stage Validation Pipeline

  **Chosen:** Three validation stages — content generation, file properties, markdown structure

  **Rejected:**
  - No validation — trusts content generation; risks invalid files reaching git
  - Single-pass validation — misses failures at different stages
  - Post-commit validation — too late to prevent invalid files from being pushed

  **Rationale:** Comprehensive validation at each stage ensures only valid files reach git:
  - `_validate_markdown_content()` — checks generated content format before writing
  - `validate_file_properties()` — checks encoding/line endings after file I/O
  - `validate_markdown_file()` — checks complete markdown structure before commit

  This catches LLM API failures, file I/O errors, encoding problems, and markdown structure issues early.
  Validation failures surface as clear errors before commit, preventing invalid files from being pushed.
  This approach is proven across all prior implementations and is essential for data quality.

  **Implementation Location:** sheep.content_generators (multiple functions)

  ### 4. Git Workflow: Orchestrated Tool Wrappers

  **Chosen:** `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool` wrappers around subprocess

  **Rejected:**
  - Direct subprocess calls — no abstraction; duplicated across features; no error centralization
  - GitPython library — adds external dependency; increases attack surface
  - Manual shell scripts — not portable; hard to test; prone to quoting errors

  **Rationale:** The sheep.tools module provides abstraction wrappers that eliminate code duplication and
  centralize error handling. These tools support configurable repository paths, custom commit messages, and
  upstream tracking. The wrapper approach is proven across all 295+ implementations and provides a single
  point of change for git behavior. Using established tools ensures consistency and maintainability across
  the codebase.

  **Implementation Location:** sheep.content_generators.commit_markdown_file() and push_markdown_file()

  ### 5. Feature Implementation Pattern: sheep.features Module

  **Chosen:** Create `src/sheep/features/feature_296_markdown_file_creation.py` following established pattern

  **Pattern Structure:**
  ```python
  from sheep.content_generators import create_markdown_file

  FEATURE_NUMBER = 296
  MARKDOWN_FILENAME = "test-eyqdut.md"

  def create_test_eyqdut_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      # Orchestrate creation using create_markdown_file()
      result = create_markdown_file(
          filename=MARKDOWN_FILENAME,
          repo_path=repo_path,
          feature_number=FEATURE_NUMBER,
      )
      return result

  def main() -> int:
      # Entry point for CLI execution
      try:
          result = create_test_eyqdut_markdown_file()
          return 0
      except Exception as e:
          return 1
  ```

  **Rationale:** This thin wrapper pattern is proven across all 295+ implementations. It provides:
  - Consistency with established feature module structure
  - Integration with sheep package and CLI
  - Reuse of core orchestration logic from sheep.content_generators
  - Clear separation of concerns (feature metadata vs. orchestration logic)
  - Ability to test and run features independently
  - Centralized logging and error handling at the orchestration layer

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O | **Use** | Standard library, modern Python file operations. Provides atomic write_text() with encoding support. |
  | Claude API (via CrewAI) | Content generation | **Use** | Provides coherent, original prose. CrewAI framework abstracts multi-provider support. |
  | CrewAI | LLM orchestration | **Use** | Handles provider selection, retry logic, error handling, configuration. Already in project. |
  | subprocess | Git command execution | **Use** | Standard library. Used by sheep.tools wrappers for git operations. Safe when properly quoted. |
  | sheep.tools | Git abstractions | **Use** | Provides GitCommitTool and GitPushTool wrappers. Eliminates duplication. Proven across 295+ features. |
  | sheep.config.llm | LLM configuration | **Use** | Provides get_reasoning_llm() with multi-provider support and retry logic. Central point for LLM config. |
  | GitPython | Git library | **Reject** | External dependency not needed; subprocess + wrappers sufficient and already in use |
  | Pydantic | Data validation | **Consider** — Optional | Used in sheep.tools for field definitions; not strictly necessary for this feature |

  ## Security Considerations

  **Encoding & Line Endings:**
  - UTF-8 without BOM prevents encoding-related vulnerabilities and binary format attacks
  - Unix LF line endings prevent CRLF injection attacks on git operations
  - pathlib.Path.write_text() guarantees these properties when encoding='utf-8' is specified

  **File Path Validation:**
  - write_markdown_file() validates filename to prevent directory traversal (no "/" or "\" characters)
  - Filename is pre-specified in the feature spec (test-eyqdut.md); no user input involved

  **Git Command Injection:**
  - git operations use subprocess with properly quoted arguments (via sheep.tools wrappers)
  - Commit message is constructed from feature number and filename (no user input)
  - No shell interpolation; safe from command injection

  **API & Authentication:**
  - LLM API calls use credentials from sheep.config.settings (environment variables or secrets)
  - CrewAI framework handles OAuth/API key management
  - Network operations are standard (HTTPS to Claude API)

  **Data Quality:**
  - Multi-stage validation prevents malformed files from reaching git
  - LLM-generated content is validated for structure and completeness
  - File encoding/line endings are verified before commit

  ## Performance Implications

  **Execution Timeline (estimated):**
  - LLM API call (content generation): ~2-3 seconds (typical round-trip latency)
  - File I/O (write): ~10-50 ms (very fast; ~500 bytes written)
  - Validation (multi-stage): ~50-100 ms (binary file reads; regex pattern matching)
  - Git operations (add + commit + push): ~200-500 ms (local operations + network I/O)
  - **Total end-to-end**: ~3-4 seconds per feature

  **Optimization Opportunities (not needed for this feature):**
  - Batch multiple features into single git commit — would save 200-300 ms per feature
  - Cache prose and reuse — would eliminate ~2-3 seconds per feature (not recommended — violates NFR-7)
  - Parallel API calls — not applicable to single-file feature
  - Lazy validation — not recommended — could allow invalid files through

  **Scalability Notes:**
  - Single sequential feature execution is fine for individual features
  - If batch processing many features, latency is dominated by LLM API round-trips (~2-3s per feature)
  - Git operations scale well; no performance degradation as repository size grows

  ## Architecture Notes

  **Integration with sheep package:**
  - Follows established feature module pattern (`src/sheep/features/feature_N_*.py`)
  - Reuses sheep.content_generators orchestration (no code duplication)
  - Integrates with sheep.config for LLM and settings management
  - Uses sheep.tools for git operations
  - Uses sheep.observability for logging

  **Dependency Graph:**
  ```
  feature_296_markdown_file_creation.py
    └─ sheep.content_generators.create_markdown_file()
       ├─ sheep.config.llm.get_reasoning_llm()
       │  └─ CrewAI LLM framework
       ├─ pathlib.Path.write_text()
       ├─ sheep.content_generators validation functions
       ├─ sheep.tools.GitCommitTool
       ├─ sheep.tools.GitPushTool
       └─ sheep.observability.logging
  ```

  **No Breaking Changes:**
  - Feature is purely additive (new file creation)
  - No modifications to existing code, tests, or configuration
  - No changes to sheep package public API
  - No impact on CI/CD pipeline (placeholder jobs only)

  **Code Reuse:**
  - 100% reuse of sheep.content_generators orchestration
  - No duplication with prior 295+ implementations
  - Single point of change for markdown file creation logic

  ## Conclusion

  Feature 296 is ready for planning and implementation. All technical decisions are clear, with established
  precedent from 295+ prior implementations. The orchestration pattern in sheep.content_generators is proven,
  well-tested, and comprehensive. The feature involves no architectural changes, no new dependencies, and
  no modifications to existing code. Implementation should follow the established thin wrapper pattern in
  `src/sheep/features/feature_296_markdown_file_creation.py` and reuse the orchestration function.

  **Recommendation:** Proceed to planning phase with confidence. The technical path is clear and proven.
