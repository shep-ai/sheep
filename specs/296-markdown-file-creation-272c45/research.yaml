      calls ensures consistency and maintainability.

  - title: "Prose Content Quality and Uniqueness"
    chosen: "Claude API generates original prose per prompt; no caching or reuse"
    rejected:
      - "Template-based prose with variable substitution — repetitive, lacks coherence"
      - "Cached/reused prose from prior features — violates uniqueness requirement"
      - "Generic Lorem Ipsum — violates quality requirements (NFR-7: must be original and coherent)"
    rationale: >
      The feature spec requires original, coherent, grammatically correct prose (NFR-7). Claude API generates
      unique content for each invocation via MARKDOWN_GENERATION_PROMPT, ensuring all 296+ files have distinct
      prose. The prompt template in sheep.content_generators encourages varied topics (\"topic of your choice\")
