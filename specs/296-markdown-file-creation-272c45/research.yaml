    rejected:
      - "No validation — trusts content generation; risks invalid or malformed files reaching git"
      - "Single-pass validation only — misses content generation failures or file I/O issues"
      - "Validation after commit — too late to catch errors; would require rollback/cleanup"
    rationale: >
      Comprehensive validation at each stage (sheep.content_generators._validate_markdown_content(),
      validate_file_properties(), validate_markdown_file()) ensures only valid files reach git. This catches:
      LLM API failures or invalid output, file I/O errors, encoding/line-ending problems, markdown structure issues
      (H1 heading, blank line, sentence count). Validation failures surface as clear errors before commit,
      preventing invalid files from being pushed to the repository. This approach is proven across all prior
      implementations and is essential for maintaining data quality.

  - title: "Git Workflow Automation"
    chosen: "Orchestrated sheep.tools.GitCommitTool and GitPushTool wrappers around subprocess"
    rejected:
      - "Direct subprocess calls (os.system, subprocess.run) — no abstraction, repeated in each feature"
      - "GitPython library — adds external dependency, increases attack surface"
      - "Manual shell scripts — not portable, hard to test, prone to escaping errors"
    rationale: >
      The sheep.tools module provides abstraction wrappers (GitCommitTool, GitPushTool) around subprocess calls,
