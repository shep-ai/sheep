    rationale: >
      Claude API provides coherent, original prose that meets all quality requirements (NFR-7: original, coherent,
      grammatically correct). The CrewAI framework abstracts provider complexity and supports hot-swappable LLM
      providers (OpenAI, Anthropic, Google, Cursor) via sheep.config.llm module. This approach is proven across all
      295+ prior markdown file implementations. get_reasoning_llm() returns a configured LLM instance with proper
      retry logic and error handling built-in.

  - title: "File I/O Implementation"
    chosen: "Python pathlib.Path.write_text(encoding='utf-8')"
    rejected:
      - "open() context manager with manual encoding — more verbose, error-prone; pathlib is modern standard"
      - "subprocess with shell commands (echo, tee) — introduces shell injection risk, cross-platform issues"
      - "File-like objects and streaming — unnecessary complexity for small files (400-600 bytes)"
    rationale: >
      pathlib.Path.write_text() is the modern Python standard for file I/O. It atomically creates/overwrites files
      with specified encoding, guarantees UTF-8 without BOM when encoding='utf-8' is used, uses native Unix LF line
      endings on Linux/Mac, and is portable across platforms. This approach is established across the codebase in
      sheep.content_generators.write_markdown_file() and is used in all prior 295+ implementations. It's simple,
      secure, and reliable.

