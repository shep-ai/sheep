content: |
  ## Summary

  Feature 296 implementation follows a simple 4-phase workflow:

  **Phase 1: Module Setup** (Task 1, 10 min)
  Create the feature module file with proper imports, constants, and function signatures. This establishes the entry point following established patterns.

  **Phase 2: Function Implementation** (Tasks 2-3, 15 min)
  Implement two wrapper functions: create_test_eyqdut_markdown_file() calls the orchestration layer, main() provides CLI integration. Most complexity lives in sheep.content_generators — feature module is intentionally thin.

  **Phase 3: Feature Execution** (Task 4, 5 min)
  Run the feature module. The orchestration layer orchestrates everything: Claude API prose generation (~2-3 sec), pathlib file creation, multi-stage validation, and git operations. Feature completes in ~3-4 seconds.

  **Phase 4: Verification** (Task 5, 15 min)
  Verify the created file meets specification: H1 heading, blank line, 2-3 sentences, UTF-8 encoding, LF line endings, 400-600 bytes. Verify git commit and push succeeded. This validation ensures data quality and confirms the feature works end-to-end.

  ## TDD Approach

  All code tasks use TDD: write a test that fails (RED), implement minimal code to pass (GREEN), then clean up (REFACTOR).

  - **Task 1** tests module import and symbol presence
  - **Task 2** tests function returns expected dict structure
  - **Task 3** tests main() returns correct exit codes
  - **Task 4** tests file is created (integration test)
  - **Task 5** validates file structure and git operations

  This approach ensures each task produces verifiable output and reduces risk of silent failures.

  ## Dependencies & Ordering

  Tasks depend sequentially:
  - Task 1 (module creation) must precede all others
  - Task 2 (creation function) depends on Task 1
  - Task 3 (main entry point) depends on Task 2
  - Task 4 (execution) depends on Task 3
  - Task 5 (verification) depends on Task 4

  This ordering ensures code exists before running it, and execution completes before verification.

  ## Effort Breakdown

  | Phase | Task | Effort | Rationale |
  | ----- | ---- | ------ | --------- |
  | 1 | Module setup | 10 min | Simple file creation + imports; template from prior features |
  | 2 | Creation function | 8 min | Thin wrapper calling orchestration layer; no complex logic |
  | 2 | Main entry point | 7 min | Error handling and logging; straightforward CLI pattern |
  | 3 | Execution | 5 min | Feature runs automatically; orchestration handles complexity |
  | 4 | Verification | 15 min | Multiple validation checks; file structure + git state verification |
  | **Total** | | **45 min** | ~12 min implementation, ~30 min execution+verification |

  ## Risk Factors & Mitigations

  **Implementation Risks (minimal):**
  - Wrong function signature → mitigated by referencing features 295, 294, 293 as templates
  - Import errors → mitigated by running tests immediately after creation

  **Execution Risks (handled by orchestration layer):**
  - LLM API timeout → exponential backoff retry logic in sheep.config.llm
  - File I/O errors → pathlib.Path.write_text() with validation
  - Git operation failures → sheep.tools wrappers with error propagation

  **Verification Risks (non-blocking):**
  - File doesn't exist → indicates failure in task 4; investigate and retry
  - File format incorrect → indicates bug in sheep.content_generators; escalate to research phase
