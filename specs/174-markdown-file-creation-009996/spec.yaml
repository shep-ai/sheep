content: |
  ## Problem Statement

  Add a new markdown file called test-2kb5i9.md to the repository root with a coherent, auto-generated title and 2-3 sentences of prose content. This continues the pattern established across 170+ existing test files in the Sheep repository. The implementation must enforce strict formatting requirements (UTF-8 encoding without BOM, Unix LF line endings), validate the file structure before git operations, and then stage, commit, and push the file using conventional commit messaging.

  ## Success Criteria

  - [ ] File test-2kb5i9.md is created in the repository root directory
  - [ ] File contains an H1 heading on line 1 (format: `# [Title]`)
  - [ ] File contains exactly one blank line on line 2
  - [ ] File contains 2-3 sentences of coherent prose content starting on line 3
  - [ ] File contains a trailing newline character at the end (no text after final \\n)
  - [ ] File is UTF-8 encoded without Byte Order Mark (BOM)
  - [ ] File uses Unix LF line endings (\\n) exclusively, not Windows CRLF (\\r\\n)
  - [ ] File size is within 300-800 byte range
  - [ ] File validation passes before any git operations are attempted
  - [ ] File is staged to git using `git add test-2kb5i9.md`
  - [ ] File is committed with conventional commit message: "feat(174): create markdown file test-2kb5i9.md with prose content"
  - [ ] File is pushed to origin remote on the current branch
  - [ ] Implementation completes successfully or provides clear error messages with no side effects

  ## Functional Requirements

  - **FR-1**: Create a markdown file named test-2kb5i9.md in the repository root directory using pathlib.Path
  - **FR-2**: File must contain an H1 heading on line 1 with meaningful, auto-generated title text (format: `# Title`)
  - **FR-3**: File must contain exactly one blank line on line 2
  - **FR-4**: File must contain 2-3 sentences of coherent prose content starting on line 3, generated using deterministic LLM-based approach (seeded with feature number 174)
  - **FR-5**: File must end with a trailing newline character (final byte is \\n, no content after it)
  - **FR-6**: File must be encoded in UTF-8 without Byte Order Mark (BOM), using pathlib.Path.write_text() with explicit encoding specification
  - **FR-7**: File must use Unix LF line endings (\\n) exclusively, never Windows CRLF (\\r\\n)
  - **FR-8**: Implementation must validate complete file structure and size BEFORE performing any git operations; validation must include: line count (3+ lines), structure (H1, blank, prose, trailing newline), and size (300-800 bytes)
  - **FR-9**: Implementation must use the existing `sheep.content_generators` module for prose generation, file writing, validation, and git operations to ensure consistency with prior features
  - **FR-10**: Implementation must add the file to git staging area using `git add test-2kb5i9.md`
  - **FR-11**: Implementation must commit the file with conventional commit message: `feat(174): create markdown file test-2kb5i9.md with prose content` using `git commit -m`
  - **FR-12**: Implementation must push the commit to origin remote on the current branch using `git push origin [current-branch]`
  - **FR-13**: If any validation fails, implementation must report the error without modifying the file or git state

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 300-800 bytes to ensure reasonable prose content length while preventing bloat and maintaining consistency with existing test files
  - **NFR-2**: Implementation must follow the established pattern used in features 165-173 for consistency, maintainability, and code reusability
  - **NFR-3**: Implementation must complete within 1-2 hours (size: S) from start to full git push completion
  - **NFR-4**: Code must be simple, readable, and maintainable with minimal complexity—avoid unnecessary abstractions or error handling for non-critical paths
  - **NFR-5**: Implementation must use Python 3.11+ standard library modules (pathlib, subprocess, sys) as established in prior features, avoiding external dependencies beyond CrewAI
  - **NFR-6**: All file I/O must be performed using pathlib.Path with explicit UTF-8 encoding specified (`encoding="utf-8"`), never using bytes mode or implicit encoding
  - **NFR-7**: Prose content generation must be deterministic when run multiple times with the same seed (feature number 174), enabling reproducible testing and debugging
  - **NFR-8**: Git operations must use subprocess.run() with check=True to catch and report failures; no silent failures or exception suppression
  - **NFR-9**: Implementation must produce zero platform-specific behavior on Windows and Unix systems (LF line endings enforced, UTF-8 encoding explicit, path separators via pathlib)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | CrewAI LLM generation vs. template-based prose? | **CrewAI LLM-based generation** | Matches established pattern from features 165-173, produces realistic content, infrastructure already in place |
  | 2 | Auto-generated titles vs. simple naming scheme? | **Auto-generated creative titles** | All 170+ existing test files use varied titles, not generic numbering—consistency requires creative titles |
  | 3 | Minimal vs. comprehensive validation? | **Comprehensive validation** | Ensures all success criteria met, catches errors before git operations, provides confidence in output quality |
  | 4 | Rollback on git failure vs. report error? | **Report error only** | Matches prior patterns, simpler implementation, users expect to handle git failures manually |
  | 5 | Deterministic seeded content vs. random? | **Deterministic with seed** | Enables repeatable testing, easier debugging, ensures consistency across test runs |
  | 6 | Use content_generators module vs. self-contained script? | **Use content_generators module** | 170+ features use this, ensures consistency, reduces duplication, module is stable and tested |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Adds new file test-2kb5i9.md to root directory |
  | Git history | High | Creates new commit on current branch (feat/174-markdown-file-creation-009996); commits to remote origin |
  | src/sheep/content_generators.py | Medium | Uses existing module for file generation, validation, and git operations—no code changes to module, only usage |
  | Test fixtures | Low | Adds one more test markdown file to the 170+ existing test fixtures |

  ## Dependencies

  - **Python Standard Library**: pathlib (file I/O), subprocess (git commands), sys (exit codes)
  - **Git**: Version control operations (add, commit, push)—must be configured and available on PATH
  - **Sheep module**: sheep.content_generators (required for prose generation, validation, git operations)
  - **CrewAI**: Framework used by content_generators for LLM-based prose generation
  - **Existing test pattern**: References 170+ existing test markdown files as templates and validation baselines (no runtime dependency, conceptual reference only)

  ## Implementation Notes

  ### Content Generation Strategy (Deterministic LLM)

  The implementation should seed the LLM or random number generator with the feature number (174) to ensure deterministic prose generation. This allows:
  - Reproducible test results across multiple runs
  - Easier debugging and issue tracking
  - Consistent validation of content quality
  - Predictable file size and line counts

  Example approach: `generate_markdown_content(feature_number=174)` should always produce the same title and prose.

  ### Validation Order

  1. Generate prose and title
  2. Write file to disk
  3. Validate file structure: line count, H1 heading format, blank line, trailing newline
  4. Validate encoding: UTF-8, no BOM
  5. Validate line endings: LF only
  6. Validate size: 300-800 bytes
  7. If all validations pass, proceed to git operations
  8. If any validation fails, report error and do not proceed to git

  ### Git Operations Sequence

  1. `git add test-2kb5i9.md`
  2. `git commit -m "feat(174): create markdown file test-2kb5i9.md with prose content"`
  3. `git push origin [current-branch-name]`

  All operations use subprocess.run() with check=True to raise exceptions on failure.

  ## Size Estimate

  **S** (1-2 hours) — This is a straightforward, short-duration task because:
  - Pattern is well-established and repeated across 170+ prior features (features 006-173)
  - No new architectural decisions; all decisions have recommended defaults above
  - Simple file creation: LLM prose generation, file write, validation checks, 3 git operations
  - Comprehensive reference implementations available (features 165, 166, 170, 171, 172, 173)
  - No code complexity, dependency conflicts, or integration challenges
  - content_generators module provides stable, tested utilities
  - File validation is straightforward (line count, encoding, size checks)

  ### Effort Breakdown

  - Prose generation via CrewAI: 10-15 minutes (existing infrastructure)
  - File creation and validation: 10-15 minutes (simple pathlib and string validation)
  - Git operations: 5 minutes (subprocess calls)
  - Testing and verification: 5-10 minutes
  - **Total**: 30-55 minutes of implementation work, well within the 1-2 hour S estimate

  ---

  _Requirements phase complete — ready for planning and implementation_
