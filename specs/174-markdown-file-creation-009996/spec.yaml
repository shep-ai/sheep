content: |
  ## Problem Statement

  Add a new markdown file called test-2kb5i9.md to the repository root with a coherent title and 2-3 sentences of prose content. This continues the pattern established across 170+ existing test files in the Sheep repository. The file should follow strict formatting requirements: UTF-8 encoding without BOM, Unix LF line endings, and be staged/committed/pushed to git with a conventional commit message.

  ## Success Criteria

  - [ ] File test-2kb5i9.md is created in the repository root directory
  - [ ] File contains an H1 heading on line 1 (format: `# [Title]`)
  - [ ] File contains a blank line on line 2
  - [ ] File contains 2-3 sentences of coherent prose content starting on line 3
  - [ ] File contains a trailing newline at the end
  - [ ] File is UTF-8 encoded without Byte Order Mark (BOM)
  - [ ] File uses Unix LF line endings (\\n), not Windows CRLF (\\r\\n)
  - [ ] File size is within 300-800 byte range
  - [ ] File is staged to git using `git add`
  - [ ] File is committed with conventional commit message: \"feat(174): create markdown file test-2kb5i9.md with prose content\"
  - [ ] File is pushed to origin remote on the current branch

  ## Functional Requirements

  - **FR-1**: Create a markdown file named test-2kb5i9.md in the repository root directory
  - **FR-2**: File must contain an H1 heading on line 1 with meaningful title text
  - **FR-3**: File must contain exactly one blank line on line 2
  - **FR-4**: File must contain 2-3 sentences of coherent prose content starting on line 3
  - **FR-5**: File must end with a trailing newline character (no content after the final \\n)
  - **FR-6**: File must be encoded in UTF-8 without Byte Order Mark (BOM)
  - **FR-7**: File must use Unix LF line endings (\\n) exclusively, never Windows CRLF (\\r\\n)
  - **FR-8**: Implementation must validate file structure and size before performing git operations
  - **FR-9**: Implementation must add the file to git staging area using `git add`
  - **FR-10**: Implementation must commit the file with a conventional commit message: \"feat(174): create markdown file test-2kb5i9.md with prose content\"
  - **FR-11**: Implementation must push the commit to the origin remote using `git push`

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 300-800 bytes to ensure reasonable prose content length while preventing bloat
  - **NFR-2**: Implementation must follow the established pattern used in features 162-173 for consistency and maintainability
  - **NFR-3**: Implementation must complete within 1-2 hours (size: S)
  - **NFR-4**: Code must be simple, readable, and maintainable with minimal complexity
  - **NFR-5**: Implementation must use Python 3 standard library modules (pathlib, subprocess) as established in prior features
  - **NFR-6**: All file I/O must be performed using pathlib.Path with explicit UTF-8 encoding specified

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **Root directory**: Contains 100+ test markdown files (test-*.md) that serve as test fixtures for the feature implementation workflow
  - **specs/**: Contains subdirectories for each feature numbered 006+ (e.g., specs/174-markdown-file-creation-009996/)
  - **src/sheep/**: Main source code directory containing:
    - `content_generators.py`: Reusable utilities for markdown file creation (generate, write, validate, commit, push)
    - `features/`: Feature implementation modules (feature_101_*, feature_102_*, etc.)
    - `agents/`: CrewAI agent definitions for code research, implementation, and review
    - `flows/`: Orchestration logic for feature execution
    - `tools/`: Git integration tools
  - **tests/**: Test suite directory for validation

  ### Architecture Patterns

  The project follows a well-established pattern for markdown file creation features:

  1. **File Structure**: All test markdown files follow identical format:
     - H1 heading on line 1 (e.g., `# The Power of Creativity`)
     - Blank line on line 2
     - 2-3 sentences of prose content (lines 3+)
     - Trailing newline
     - Total file size: typically 300-800 bytes

  2. **Encoding Standards**: All files strictly enforce:
     - UTF-8 encoding without Byte Order Mark (BOM)
     - Unix LF line endings (\\n), never Windows CRLF (\\r\\n)
     - Written using pathlib.Path with explicit UTF-8 encoding

  3. **Implementation Pattern**: Each markdown file creation feature:
     - Uses reusable utilities from `sheep.content_generators` module
     - Key functions: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
     - Performs file structure and size validation before git operations
     - Uses subprocess.run() with check=True for git operations

  4. **Git Workflow**: Standard conventional commit format:
     - Message: \"feat(NUMBER): create markdown file FILENAME with prose content\"
     - Example: \"feat(174): create markdown file test-2kb5i9.md with prose content\"
     - Operations: git add, git commit, git push

  ### Relevant Technologies

  - **Python 3.11+**: pathlib module for cross-platform file operations, subprocess for git integration, structlog for logging
  - **Git**: Version control operations (add, commit, push)
  - **Markdown**: Standard markdown format with H1 heading level
  - **CrewAI**: Agent framework (used by content_generators for LLM-based prose generation)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Adds new file test-2kb5i9.md to root directory |
  | Git history | High | Creates new commit in current branch; adds git operations workflow |
  | src/sheep/features/ | Medium | May add new feature module (feature_174_markdown_file_creation.py) if following src-based pattern, though root directory creation is the primary deliverable |

  ## Dependencies

  - **Python Standard Library**: pathlib (file I/O), subprocess (git commands), sys (exit codes)
  - **Git**: Required for add, commit, and push operations
  - **Sheep module**: `sheep.content_generators` (optional, for reusable utilities)
  - **Existing test pattern**: References 170+ existing test markdown files as templates (no runtime dependency)

  ## Size Estimate

  **S** — This is a straightforward, short-duration task (1-2 hours maximum) because:
  - Pattern is well-established and repeated across 170+ prior features (features 006-173)
  - No architectural decisions needed; follows existing conventions exactly
  - Simple file creation: write H1 heading + prose, validate structure, perform 3 git operations
  - Comprehensive reference implementations available (features 165, 166, 170, 171, 172, 173)
  - No code complexity, dependencies, or integration challenges
  - File size validation is simple (check 300-800 byte range)
  - Can reuse `sheep.content_generators` utilities or implement inline (both straightforward)

  ### Effort Breakdown

  - Implementation: 15-30 minutes (simple file write, validate, git ops)
  - File validation: 5 minutes (structure and encoding checks)
  - Git operations: 5 minutes (add, commit, push)
  - Verification: 5-10 minutes
  - **Total**: 30-60 minutes

