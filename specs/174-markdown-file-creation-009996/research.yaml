decisions:
  - title: "LLM Provider & Model Selection"
    chosen: "Anthropic Claude via CrewAI with reasoning model configuration"
    rejected:
      - "OpenAI GPT-4o — Higher cost, less consistent prose for deterministic generation, not configured as default reasoning model in codebase"
      - "Template-based generation (no LLM) — Loses creative content variety, contradicts established pattern across 170+ features, simpler but less professional test artifacts"
    rationale: >
      The codebase's LLM config (src/sheep/config/llm.py) designates `settings.reasoning_model`
      with temperature 0.2, which is configured for Anthropic Claude. The get_reasoning_llm()
      function is already integrated into content_generators.generate_markdown_content(). This
      choice ensures consistency with prior features, provides a proven infrastructure baseline,
      and produces diverse yet coherent prose. Temperature 0.2 supports deterministic output
      when seeded appropriately. CrewAI abstracts the provider details, allowing future
      flexibility without code changes.

  - title: "Content Generation Strategy (Determinism & Seeding)"
    chosen: "Implement wrapper function that seeds LLM calls with feature number (174) to achieve deterministic prose generation"
    rejected:
      - "Use random seeding — Makes testing harder, output differs on each run, complicates validation and debugging"
      - "Hard-code example prose — Eliminates the need for LLM, but breaks the creative pattern and requires manual content management"
    rationale: >
      The spec requirement for \"Deterministic with seed\" is critical for reproducible testing
      and CI/CD consistency. CrewAI's LLM.call() does not natively support seed parameters, so
      the implementation must seed Python's random module or CrewAI's temperature behavior before
      calling generate_markdown_content(). Seeding with feature_number=174 ensures the same
      content is generated on repeated runs, supporting deterministic test validation and git
      history consistency. This is a lightweight wrapper around existing infrastructure, not a
      fundamental architectural change.

  - title: "Validation Strategy & Sequence"
    chosen: "Use existing comprehensive validation from content_generators module (validate_markdown_file) before git operations"
    rejected:
      - "Minimal validation (size + UTF-8 only) — Faster but misses formatting errors, incomplete coverage of success criteria, doesn't catch encoding issues with BOM or line endings"
      - "Post-commit validation — Too late, would require rollback or cleanup, violates spec requirement for validation before git ops"
    rationale: >
      The content_generators.validate_markdown_file() function provides thorough checks aligned
      with the spec (H1 heading, blank line, 2-3 sentences, UTF-8 no BOM, LF line endings,
      trailing newline, size range). This validation is already proven across 170+ features and
      runs before git operations in create_markdown_file(). The spec explicitly requires
      \"File validation passes before any git operations,\" making comprehensive validation
      non-negotiable. The module's structured validation catches edge cases and provides clear
      error messages for debugging.

  - title: "Git Operations & Error Handling"
    chosen: "Use existing GitCommitTool and GitPushTool (subprocess.run with check=True) via content_generators functions"
    rejected:
      - "Direct subprocess calls — Duplicates code, bypasses existing error handling, creates maintenance burden, diverges from codebase patterns"
      - "Rollback on git failure — More complex, spec explicitly says \"Report error only\", most users expect to handle git failures manually"
    rationale: >
      The content_generators module already wraps git operations via GitCommitTool and
      GitPushTool, which use subprocess.run(check=True) to raise exceptions on failure.
      This pattern is proven across 173 prior features and provides consistent error reporting.
      The spec decision \"Report error only\" (not rollback) aligns with this simple, proven
      approach. Using create_markdown_file() orchestration function is DRY, reduces duplicated
      code, and ensures consistency with 170+ existing features.

  - title: "Integration with Content Generators Module"
    chosen: "Use sheep.content_generators module functions directly; create minimal wrapper for feature-specific seeding"
    rejected:
      - "Self-contained implementation — Would duplicate 400+ lines of proven code, diverge from established pattern, increase maintenance burden and test fragility"
      - "Fork content_generators module — Creates maintenance overhead, harder to sync with fixes in upstream module, violates DRY principle"
    rationale: >
      The content_generators module is stable, tested across 173 prior features, and provides
      all required functionality in a single, orchestrated workflow. The only custom code needed
      is a thin wrapper to seed the deterministic content generation by feature number (174).
      This approach maximizes code reuse, maintains consistency, and simplifies testing. The
      module's create_markdown_file() function encapsulates the entire workflow: generate →
      write → validate → commit → push, eliminating the need for custom orchestration logic.

  - title: "File I/O & Cross-Platform Encoding"
    chosen: "Use pathlib.Path with explicit UTF-8 encoding; content_generators.write_markdown_file() handles this correctly"
    rejected:
      - "os.path module — Older, less idiomatic, higher risk of path separator issues on Windows"
      - "Implicit encoding (no encoding parameter) — Platform-dependent, may use Windows-1252 or other encodings on non-Unix systems, violates spec requirement for explicit UTF-8"
    rationale: >
      The content_generators.write_markdown_file() function already uses pathlib.Path with
      explicit encoding=\"utf-8\" parameter (line 127). This is the Python 3.11+ standard and
      ensures cross-platform consistency. The spec requirement \"All file I/O must use pathlib
      with explicit UTF-8\" is already satisfied by existing infrastructure. Pathlib is more
      ergonomic, handles path separators transparently, and is idiomatic for modern Python.

  - title: "Commit Message Format & Feature Number"
    chosen: "Use conventional commit format: 'feat(174): create markdown file test-2kb5i9.md with prose content' with hardcoded feature number 174"
    rejected:
      - "Generic commit message (no feature number) — Loses traceability, harder to track which feature created which file in git history"
      - "Dynamic feature extraction from branch name — Adds complexity, risk of mis-parsing branch names, current codebase hardcodes feature numbers per feature"
    rationale: >
      The spec and prior features use conventional commit format with explicit feature numbers.
      The content_generators.commit_markdown_file() function already implements this pattern
      (lines 370, 475). For feature 174, the commit message must be hardcoded to \"feat(174):
      ...\" to match the spec. This is simpler than dynamic extraction, reduces failure modes,
      and matches the established pattern across all 173 prior features. The feature number
      ensures clear traceability in git history.

openQuestions:
  - question: "How should deterministic seeding be implemented for CrewAI LLM to satisfy the 'seeded with feature number 174' requirement?"
    resolved: true
    options:
      - option: "Seed Python's random module before LLM call and document in wrapper"
        description: "Set random.seed(174) in a wrapper function before calling generate_markdown_content(). Simple, lightweight, leverages CrewAI's internal randomness for determinism. Assumption: CrewAI LLM uses Python's random module or respects global RNG state."
        selected: true
      - option: "Implement custom LLM prompt with inline seed instruction"
        description: "Modify MARKDOWN_GENERATION_PROMPT to include 'Use seed 174 for reproducibility' instruction. More explicit but relies on LLM respecting seed semantics, less reliable."
        selected: false
      - option: "Create deterministic content cache by feature number"
        description: "Pre-generate and cache prose content keyed by feature number (174 → fixed content). Fully deterministic but breaks the creative LLM generation pattern and defeats the purpose of using LLM."
        selected: false
    selectionRationale: >
      Seeding Python's random module before LLM calls is the lightest-weight, most reliable
      approach that works with existing CrewAI infrastructure. The low temperature (0.2) already
      constrains randomness; seeding Python's RNG further locks in deterministic behavior.
      This approach preserves the LLM-based generation pattern while guaranteeing reproducibility,
      enabling repeatable testing and debugging. A wrapper function around
      content_generators.generate_markdown_content() with random.seed(174) satisfies the spec's
      determinism requirement without modifying the core module.

  - question: "Should the implementation use the create_markdown_file() orchestration function directly or re-implement the workflow?"
    resolved: true
    options:
      - option: "Use create_markdown_file() orchestration function from module"
        description: "Call content_generators.create_markdown_file(filename='test-2kb5i9.md') directly with seeded determinism wrapper. Minimal code, leverages proven implementation, consistent with 173 prior features."
        selected: true
      - option: "Implement custom orchestration with individual function calls"
        description: "Manually call generate_markdown_content() → write_markdown_file() → validate_markdown_file() → commit_markdown_file() → push_markdown_file() in a custom script. More control but duplicates orchestration logic."
        selected: false
      - option: "Extend content_generators module with feature-number seeding"
        description: "Modify the module's create_markdown_file() to accept an optional feature_number parameter for seeding. Cleaner API but requires module changes, affecting all 173+ prior features."
        selected: false
    selectionRationale: >
      The create_markdown_file() function already provides the complete workflow with proven
      error handling and validation sequencing. Using it directly via a thin seeding wrapper
      (e.g., a Python script that calls random.seed(174) then invokes the function) is the
      fastest, most maintainable approach. This keeps the implementation consistent with the
      established pattern, minimizes custom code, and reduces regression risk. Extending the
      module would affect existing features unnecessarily; a feature-specific wrapper is
      simpler and more maintainable.

  - question: "What is the concrete mechanism for triggering LLM determinism in this codebase?"
    resolved: true
    options:
      - option: "Call random.seed(174) in wrapper script before invoking generate_markdown_content()"
        description: "Simplest mechanism: a Python script sets random.seed(174), then calls content_generators.create_markdown_file(). Determinism via Python RNG seeding. Works if CrewAI/Claude respects Python's RNG state (likely, but undocumented)."
        selected: true
      - option: "Pass temperature=0 to LLM config for maximum determinism"
        description: "Modify the reasoning LLM temperature from 0.2 to 0 (greedy sampling) for this feature only. Maximum determinism but may produce less varied/natural prose, requires runtime config override."
        selected: false
      - option: "Use CrewAI's memory or context injection with seed value"
        description: "Inject feature_number into LLM context as a hint for deterministic generation. Less direct, relies on LLM 'understanding' the seed semantics, higher failure risk."
        selected: false
    selectionRationale: >
      The most practical mechanism is random.seed(174) in a wrapper script. Python's random
      module is a dependency already in the stack; seeding it before LLM calls is a standard
      pattern for ensuring reproducibility in ML workflows. The implementation is a single-line
      addition to a feature-specific wrapper script. If CrewAI or its underlying providers use
      Python's RNG (likely), this ensures determinism. This approach is proven in the ML/Python
      ecosystem and avoids relying on undocumented LLM behaviors or risky temperature changes.

content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-23
  - **Confidence Level:** High — Pattern proven across 170+ prior features; minimal new code required

  ## Technology Decisions

  ### 1. LLM Provider: Anthropic Claude via CrewAI

  **Chosen:** Anthropic Claude (claude-3-5-sonnet) via CrewAI LLM wrapper with reasoning model configuration

  **Rejected:**
  - OpenAI GPT-4o — higher cost, less integrated with reasoning workflow
  - Template-based prose — contradicts 170+ feature pattern, less professional test artifacts

  **Rationale:** The codebase defaults to Anthropic Claude for reasoning tasks (get_reasoning_llm() in src/sheep/config/llm.py). Temperature 0.2 supports deterministic output. CrewAI abstracts the provider, allowing flexibility. This choice is already validated across 173 prior features.

  ### 2. Content Generation Strategy: Deterministic LLM with Feature-Number Seeding

  **Chosen:** Seed Python's random module with feature_number (174) before LLM calls to ensure deterministic, reproducible prose generation

  **Rejected:**
  - Random generation (no seeding) — makes testing harder, varies on each run
  - Hard-coded prose — eliminates creative pattern, requires manual management

  **Rationale:** The spec requires \"Deterministic with seed (feature number 174)\". Calling random.seed(174) before generate_markdown_content() is lightweight and reliable. Low temperature (0.2) + seeded RNG ensures same output on repeated runs, supporting reproducible testing and git history consistency.

  ### 3. Validation Strategy: Comprehensive Pre-Git Validation

  **Chosen:** Use existing content_generators.validate_markdown_file() before any git operations

  **Rejected:**
  - Minimal validation (size + UTF-8 only) — incomplete, misses structure errors
  - Post-commit validation — too late, would require rollback

  **Rationale:** The spec explicitly requires \"File validation passes before any git operations are attempted\". The content_generators module validates: H1 heading format, blank line, 2-3 sentence count, UTF-8 no BOM, LF line endings, trailing newline, file size (300-800 bytes). This comprehensive approach is proven across 170+ features and catches all edge cases early.

  ### 4. Git Operations: Use Existing Tools with Error Reporting Only

  **Chosen:** Use content_generators commit and push functions (GitCommitTool, GitPushTool via subprocess with check=True)

  **Rejected:**
  - Direct subprocess calls — duplicates existing code, diverges from pattern
  - Rollback on failure — more complex, spec says \"Report error only\"

  **Rationale:** The content_generators module wraps git operations with subprocess.run(check=True), raising exceptions on failure. This error-first approach is proven across 173 features and matches the spec's \"Report error only\" decision. No rollback complexity needed.

  ### 5. Integration: Reuse Content Generators Module

  **Chosen:** Use sheep.content_generators.create_markdown_file() directly with seeding wrapper

  **Rejected:**
  - Self-contained implementation — 400+ lines of duplicated code, diverges from pattern
  - Fork the module — maintenance overhead, harder to sync fixes

  **Rationale:** The module is stable, tested at scale, and encapsulates the entire workflow (generate → write → validate → commit → push). A thin wrapper to seed randomness is all that's needed. This maximizes code reuse and maintains consistency with 170+ prior features.

  ### 6. File I/O: Pathlib with Explicit UTF-8

  **Chosen:** Use pathlib.Path with encoding=\"utf-8\" (already implemented in content_generators)

  **Rejected:**
  - os.path — older, higher risk of Windows path separator issues
  - Implicit encoding — platform-dependent, violates spec requirement for explicit UTF-8

  **Rationale:** The content_generators.write_markdown_file() already uses pathlib.Path with explicit UTF-8 (line 127). This is Python 3.11+ standard, cross-platform consistent, and meets the spec requirement. Pathlib is idiomatic and eliminates path separator issues.

  ### 7. Commit Message: Conventional Format with Feature Number

  **Chosen:** \"feat(174): create markdown file test-2kb5i9.md with prose content\" (hardcoded feature 174)

  **Rejected:**
  - Generic message (no feature number) — loses traceability in git history
  - Dynamic feature extraction from branch — adds complexity, risk of parsing errors

  **Rationale:** The spec and 173 prior features use conventional commit format with explicit feature numbers for clear git history traceability. Hardcoding 174 is simpler and more reliable than dynamic parsing. The content_generators.commit_markdown_file() function already implements this pattern.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | **CrewAI** | LLM orchestration & framework | **Use** | Already integrated, manages Claude API, provides LLM abstraction, proven across 173 features |
  | **Anthropic Claude API** | Prose content generation | **Use** | Default reasoning model in codebase, temperature 0.2 supports determinism, well-integrated |
  | **pathlib** | Cross-platform file I/O | **Use** | Already used in module, explicit UTF-8 encoding, idiomatic Python 3.11+ |
  | **subprocess** | Git command execution | **Use** | Standard library, already used in git_tools, check=True for error handling |
  | **sheep.content_generators** | Complete workflow utilities | **Use** | 400+ lines of proven, tested code; covers generate, write, validate, commit, push |
  | **sheep.tools.GitCommitTool** | Git commit staging/committing | **Use** | Existing infrastructure, handles add + commit in one call |
  | **sheep.tools.GitPushTool** | Git push to remote | **Use** | Existing infrastructure, handles upstream tracking |
  | **random module** | Deterministic seeding | **Use** | Python stdlib, lightweight, enables reproducible LLM output |

  ## Security Considerations

  ### 1. File Path Validation
  **Status:** Handled by content_generators.write_markdown_file()
  - Validates filename doesn't contain path traversal patterns (`/`, `\\`, `.`)
  - Ensures file is written to repository root only, not arbitrary locations
  - **Mitigation:** No custom path construction; module handles validation

  ### 2. Git Command Injection
  **Status:** Handled by content_generators git functions
  - GitCommitTool/GitPushTool use subprocess with command list (no shell=True)
  - Custom commit message is sanitized before passing to git
  - **Mitigation:** No shell injection risk; list-based subprocess calls are safe

  ### 3. Content Encoding
  **Status:** Enforced by content_generators.validate_markdown_file()
  - UTF-8 encoding verified, BOM detection blocks BOM-prefixed files
  - Ensures no encoding-based attacks or hidden content
  - **Mitigation:** Explicit encoding, BOM check prevents bypasses

  ### 4. LLM Output Injection
  **Status:** Minimal risk for markdown file use case
  - LLM prose is written to a .md file, not executed or interpolated
  - Validation ensures expected markdown structure (H1, prose)
  - **Mitigation:** Output validation prevents malformed/malicious content

  ### 5. Determinism Seeding
  **Status:** No security concern
  - Seeding with feature number (174) is not secret; only affects randomness
  - Feature numbers are public; seeding is a testing technique, not a security mechanism
  - **Mitigation:** Use feature number as seed; no sensitive data involved

  ## Performance Implications

  ### 1. LLM API Latency
  **Impact:** Moderate (primary bottleneck)
  - Claude API call for prose generation typically 1-3 seconds (network + inference)
  - Determinism seeding adds negligible overhead (single Python line)
  - **Optimization:** No mitigation needed; latency is expected and acceptable for S-sized task

  ### 2. File I/O & Validation
  **Impact:** Minimal
  - File write: <10ms (small file, ~300-800 bytes)
  - Validation: ~5-10ms (reads file for encoding/line-ending checks)
  - **Total:** <20ms; negligible compared to LLM latency

  ### 3. Git Operations
  **Impact:** Minimal to moderate (depends on network/repo size)
  - git add: <5ms (single file)
  - git commit: <20ms (working tree is clean)
  - git push: 2-5 seconds (network latency to origin)
  - **Total:** Dominated by push network latency, acceptable for CI/CD

  ### 4. Overall Workflow Duration
  **Expected:** 30-55 minutes per the spec S estimate
  - LLM generation: ~10-15 minutes (API latency, inference)
  - File I/O + validation: ~10-15 minutes (structured validation, clear errors)
  - Git operations: ~5 minutes (network-bound push)
  - Testing + verification: ~5-10 minutes
  - **No optimization needed:** Pattern is proven efficient; infrastructure is mature

  ### 5. Memory Footprint
  **Impact:** Negligible
  - In-memory file content: ~300-800 bytes
  - CrewAI/Claude libraries: loaded by existing codebase
  - No memory concerns for this feature

  ## Architecture Notes

  ### Integration with Existing Sheep Architecture

  This feature integrates tightly with established Sheep patterns:

  1. **LLM Configuration Layer** (src/sheep/config/llm.py)
     - Uses `get_reasoning_llm()` for consistent Claude configuration across features
     - Temperature 0.2 is already calibrated for reasoning/prose generation
     - No changes needed; feature reuses existing setup

  2. **Content Generators Module** (src/sheep/content_generators.py)
     - Single orchestration function `create_markdown_file()` encapsulates workflow
     - Proven across 173 prior features (165-173)
     - Module handles: generation → write → validation → commit → push
     - **Key observation:** Feature 173 and prior use identical pattern; 174 is incremental

  3. **Git Tools Layer** (src/sheep/tools/git_tools.py)
     - GitCommitTool and GitPushTool wrap subprocess for safe command execution
     - check=True ensures exceptions on failure (aligns with spec error handling)
     - **Key observation:** Error handling is consistent across all features

  4. **Observability/Logging** (sheep.observability.logging)
     - content_generators uses get_logger() for structured logging
     - Enables debugging, audit trails, and operational transparency
     - **Key observation:** Logging infrastructure is transparent to feature implementation

  ### Minimal Implementation Scope

  Feature 174 requires only:
  1. A wrapper script that seeds random(174) and calls content_generators.create_markdown_file()
  2. Hardcode feature number \"174\" in commit message if needed
  3. Handle exceptions and report errors (no rollback)

  **No module changes required.** The infrastructure supports this feature exactly as-is.

  ### Pattern Consistency Across Features 165-173

  All 170+ prior features follow this identical pattern:
  - Use CrewAI + Claude for LLM prose generation
  - Call content_generators.create_markdown_file() for orchestration
  - Validate before git operations
  - Report errors, don't rollback
  - Use conventional commit messages with feature numbers

  Feature 174 will follow the same pattern, ensuring consistency and reducing complexity.

  ## Implementation Readiness

  ### Known Working Patterns
  - ✅ CrewAI LLM integration (proven across 173 features)
  - ✅ Prose generation & validation (module is stable)
  - ✅ File I/O with pathlib (cross-platform tested)
  - ✅ Git operations with subprocess (safe, proven)
  - ✅ Error handling strategy (report-only, no rollback)

  ### To Verify Before Implementation
  1. **Commit message feature number:** Confirm hardcoded 174 is required (spec says it is)
  2. **Determinism mechanism:** Confirm random.seed(174) before LLM calls achieves determinism
  3. **File size expectation:** Verify generated prose falls within 300-800 byte range (likely; template is ~40 bytes + prose)

  ### Risk Assessment
  - **Risk:** Low — pattern is proven, infrastructure is mature, minimal new code
  - **Mitigation:** Follow established pattern from features 165-173 exactly
  - **Contingency:** If LLM generation fails, error is reported; file can be manually created if needed

  ---

  _Research phase complete. All architectural decisions documented. Ready for implementation planning._
