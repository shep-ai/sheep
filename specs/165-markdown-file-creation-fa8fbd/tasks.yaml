content: |
  ## Task Summary

  **Phase 1: File Creation (task-1, ~10 minutes)**

  Create the markdown file test-ewmber.md at repository root with proper H1 heading, blank line,
  and 2-3 sentences of prose content. Ensure UTF-8 encoding without BOM and LF line endings.
  This is straightforward file creation using pathlib.Path.write_text().

  Key implementation detail: explicitly embed \\n characters in the prose content string to
  ensure LF line endings on all platforms (Windows/Linux/Mac). Python's text mode would produce
  CRLF on Windows, which violates the spec requirement for LF.

  **Phase 2: Git Integration (task-2, ~5 minutes)**

  Stage the file with git add, commit with the conventional commit message, and push to the
  feature branch. Depends on task-1 (file must exist before git integration).

  Use subprocess.run() with check=True to ensure commands succeed; if any git command fails,
  the exception will halt execution and provide error details.

  **Overall Approach**

  Simple sequential workflow with no parallel work possible. File creation is a prerequisite
  for git integration. Total estimated effort: 15 minutes.

  Both tasks are straightforward implementations of well-established patterns from 170+ preceding
  test files (features 151-164). No architectural decisions, no edge cases, no complex logic.
