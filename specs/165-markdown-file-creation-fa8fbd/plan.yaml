content: |
  ## Architecture Overview

  This feature is a simple, self-contained file creation task that follows the established pattern
  from 170+ existing test markdown files in the repository. No integration with Sheep platform code,
  no source code modifications, no architectural complexity.

  **File Location:** Repository root (consistent with all 170+ test files)
  **File Format:** H1 heading + blank line + 2-3 sentences of prose
  **File Size:** 300-600 bytes (measured from existing precedents)

  The implementation uses only Python standard library (pathlib for file I/O) and standard git CLI,
  maintaining the zero-external-dependencies constraint specified in NFR-4.

  **Precedent Pattern:** All 170+ existing test files (test-*.md) follow identical structure:
  - Example file: test-yx4an9.md with H1 heading "Mountain Ecosystems" and three sentences
  - Pattern matches requirements exactly: one H1, blank line, 2-3 sentences, 300-600 bytes
  - Feature 164 (completed 2026-03-21) used identical pattern successfully

  ## Key Design Decisions

  All design decisions have been predetermined by 170+ existing test files and documented in research
  findings. Implementation will follow these established patterns:

  ### 1. File I/O: Use Python pathlib.Path

  **Chosen:** pathlib.Path from Python standard library

  **Rationale:** Modern, cross-platform, standard for Python 3.11+. No external dependencies.
  All 170+ test files were created with pathlib or equivalent. Handles platform path separators
  automatically. Python default UTF-8 encoding matches repository standard.

  **Reference:** Research findings, "File I/O Implementation" section

  ### 2. Text Encoding: UTF-8 without Byte Order Mark

  **Chosen:** UTF-8 encoding (Python default)

  **Rationale:** Repository standard for all 170+ test files. Python's pathlib.write_text()
  defaults to UTF-8 without BOM. No special handling required. Meets NFR-1 (file consistency).

  **Reference:** Research findings, "Text Encoding" section

  ### 3. Line Endings: Explicit LF via \\n in Strings

  **Chosen:** Embed \\n characters explicitly in prose content string

  **Rationale:** Specification requires LF line endings (not CRLF). Python text mode on Windows
  produces CRLF by default. Solution: write prose string with explicit \\n newlines. This ensures
  correct line endings regardless of OS (Windows/Linux/Mac). All 170+ test files use LF;
  this maintains consistency.

  **Critical Detail:** When composing prose in Python, use:
  ```python
  content = "# Title\n\nSentence one. Sentence two. Sentence three."
  path.write_text(content, encoding='utf-8')
  ```
  The \\n characters ensure LF in the written file, even on Windows.

  **Reference:** Research findings, "Line Ending Strategy" section

  ### 4. Prose Content: Hard-coded Topic-Specific Content

  **Chosen:** Hand-written prose about a specific topic, 2-3 sentences, 300-600 bytes total

  **Rationale:** All 170+ existing test files contain specific prose about coherent topics
  (e.g., "Mountain Ecosystems", "Quantum Computing"). Hard-coded content is:
  - Predictable and easy to validate
  - Grammatically correct and meaningful
  - Consistent with established pattern
  - No randomization or generation logic needed

  Topic is arbitrary (user query says "about anything"), so any coherent subject works.

  **Reference:** Research findings, "Prose Content Definition" section

  ### 5. Git Integration: subprocess CLI Commands

  **Chosen:** Use subprocess.run() to invoke standard git CLI

  **Rationale:** Only three simple operations needed: git add, git commit, git push.
  subprocess.run() provides a straightforward way to invoke these without external dependencies.
  Maintains NFR-4 (no external dependencies beyond Python 3.11+ stdlib and git).

  Alternative (GitPython library) would add external dependency and maintenance overhead.
  CLI approach is proven in features 151-164 (all completed successfully).

  **Reference:** Research findings, "Git Integration Implementation" section

  ### 6. Commit Message: Conventional Commits Format

  **Chosen:** "feat(165): Create markdown file test-ewmber.md with prose content"

  **Rationale:** Follows conventional commits standard (https://www.conventionalcommits.org/)
  established in recent commits: feat(164), feat(163), feat(162) all use same pattern.
  Format: feat(feature-number): description. Feature number (165) clearly links commit to this work.

  **Reference:** Research findings, "Commit Message Format" section

  ## Implementation Strategy

  **Phase 1 (File Creation):** Use pathlib.Path to create test-ewmber.md at repository root.
  Compose prose content as single string with explicit \\n newlines (not relying on Python's
  text mode, which would produce CRLF on Windows). Write file with UTF-8 encoding using
  path.write_text(content, encoding='utf-8'). Validate: file exists, has correct size,
  proper H1 heading, 2-3 sentences, UTF-8 encoding, LF line endings.

  **Phase 2 (Git Integration):** Run three subprocess.run() commands sequentially:
  1. git add test-ewmber.md
  2. git commit -m "feat(165): Create markdown file test-ewmber.md with prose content"
  3. git push origin feat/165-markdown-file-creation-fa8fbd

  Verify each succeeds before proceeding (check=True will raise CalledProcessError on failure).

  Both phases are sequential with hard dependency: git integration requires file to exist.
  No parallel work possible. No complex orchestration or interactions with other systems.

  **Total Effort:** ~15 minutes (10 min file creation + validation, 5 min git workflow)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Line ending mismatch (CRLF on Windows instead of LF) | Medium | Low | Explicitly use \\n in Python strings; test validates file uses LF; verify with hexdump or git diff |
  | UTF-8 encoding with BOM instead of without | Low | Low | Python pathlib.write_text() defaults to UTF-8 without BOM; test validates encoding |
  | Incomplete prose or wrong sentence count | Low | Low | Test verifies exactly 2-3 sentences; hand-code prose instead of generating |
  | File size out of range (not 300-600 bytes) | Low | Low | Test validates file size; count characters during implementation; existing examples range 350-550 bytes |
  | Git commands fail (branch doesn't exist, no credentials) | Low | Medium | Feature branch pre-created and verified; assume git configured with credentials; subprocess.run(..., check=True) raises on failure |
  | Commit message format incorrect | Very Low | Very Low | Use hardcoded message string; verify with git log after push |
  | Directory structure changed between planning and implementation | Very Low | Low | Repository root is stable; no concurrent changes expected |

  ## Notes

  - No new dependencies required (pathlib and subprocess are in Python stdlib)
  - No changes to existing files or source code in src/sheep/
  - No tests to update or create (feature is pure file creation, not application logic)
  - No documentation or configuration changes needed
  - Feature branch (feat/165-markdown-file-creation-fa8fbd) pre-created and ready
  - Implementation follows proven pattern from features 151-164 (14 preceding files created successfully)
