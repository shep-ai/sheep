decisions:
  - title: "File I/O Implementation"
    chosen: "Use Python's pathlib.Path from standard library"
    rejected:
      - "os.path module — older API, more verbose for modern Python (3.11+)"
      - "External file handling library — unnecessary complexity and adds dependencies"
    rationale: >
      pathlib.Path is the modern, cross-platform standard for file operations in Python 3.11+.
      It handles platform-specific path separators automatically, is already available in the
      standard library, and aligns with contemporary Python best practices. The feature requires
      no external dependencies, so using pathlib avoids introducing new package requirements.

  - title: "Text Encoding"
    chosen: "UTF-8 without Byte Order Mark (Python default)"
    rejected:
      - "ASCII encoding — too restrictive, limited character support"
      - "UTF-8 with BOM — adds unnecessary bytes, not the repository standard"
    rationale: >
      UTF-8 without BOM is the modern standard for web and Unix text files, Python's default
      encoding, and explicitly required in the spec. All 170+ existing test markdown files use
      UTF-8 encoding, ensuring consistency. Python's text mode file I/O automatically handles
      UTF-8 encoding/decoding without requiring explicit codec specification.

  - title: "Line Ending Strategy"
    chosen: "Explicitly use LF (\\n) in Python strings; rely on pathlib's text mode"
    rejected:
      - "Use OS-dependent line endings — would produce CRLF on Windows, inconsistent with spec"
      - "Post-process file to normalize line endings — unnecessary complexity, error-prone"
    rationale: >
      The spec explicitly requires LF (Unix-style) line endings per NFR-6. In Python text mode
      (which pathlib uses by default), the platform's line ending convention is applied during
      writing. On Windows, this would produce CRLF. Solution: explicitly embed \\n characters
      in the prose content string. This ensures the final file has LF endings regardless of OS.
      All 170+ existing test files use LF, reinforcing this as the repository standard.

  - title: "Prose Content Definition"
    chosen: "Hard-coded prose content about a specific topic (no randomization)"
    rejected:
      - "Randomly generated or templated content — unpredictable, difficult to validate, inconsistent with precedents"
      - "User input or dynamic selection — overengineering for a test file feature"
    rationale: >
      All 170+ existing test markdown files contain specific, hand-written prose about coherent
      topics (e.g., 'Mountain Ecosystems', 'Quantum Computing'). This allows for validation that
      content is grammatically correct and meaningful. Hard-coded content is predictable, easy to
      verify in tests, and maintains consistency with the established pattern. The spec permits
      arbitrary topic selection, so any coherent prose meeting the 300-600 byte and 2-3 sentence
      requirements is acceptable.

  - title: "Git Integration Implementation"
    chosen: "Use Python subprocess module to invoke standard git CLI commands"
    rejected:
      - "GitPython library — adds external dependency, overkill for three simple operations (add, commit, push)"
      - "Direct git protocol/libgit2 — introduces complexity and fragility; subprocess is simpler"
    rationale: >
      The feature requires only three basic git operations: git add, git commit, and git push.
      subprocess.run() provides a straightforward way to invoke these without external
      dependencies. The feature maintains NFR-4 (no external dependencies beyond Python 3.11+
      stdlib and git). GitPython would require installation and maintenance; subprocess is
      universally available and aligns with the minimal dependency approach.

  - title: "Commit Message Format"
    chosen: "Conventional Commits format: \"feat(165): Create markdown file test-ewmber.md with prose content\""
    rejected:
      - "Free-form commit messages — inconsistent with codebase pattern, poor history readability"
      - "Detailed multi-line commit messages — unnecessary for simple file creation"
    rationale: >
      The spec and features 151-164 follow Conventional Commits (https://www.conventionalcommits.org/),
      a structured format that enables automated changelog generation and semantic versioning.
      The format is: feat(scope): description. Using feat(165) as scope clearly links the commit
      to this feature number. This approach is already established in recent commits
      (e.g., \"feat(164): ...\", \"feat(163): ...\") and must be maintained.

