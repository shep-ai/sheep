content: |
  ## Architecture Overview

  This feature follows the established pattern from 300+ identical test files (features 1-302) in the Sheep repository.
  The implementation is a minimal, isolated test artifact with no dependencies on application source code.

  The file creation uses Python's pathlib standard library (required by specification) with explicit encoding
  control to ensure UTF-8 encoding without BOM and Unix-style LF line endings. Git integration uses subprocess
  with the native git CLI for staging, committing, and pushing.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text() with explicit encoding and newline control

  **Chosen:** `pathlib.Path('test-uvsl4f.md').write_text(content, encoding='utf-8', newline='')`

  **Rationale (from research):**
  - Specification explicitly mandates pathlib for file I/O operations
  - pathlib is idiomatic in Python 3.11+
  - encoding='utf-8' ensures UTF-8 without BOM (Python 3 default behavior)
  - newline='' disables universal newlines, preserving LF line endings on all platforms
  - On Windows, text mode defaults to CRLF conversion; newline='' prevents this critical issue
  - Clean API with automatic file handle management (no resource leaks)

  ### 2. Content Generation: Hard-coded prose with implementer-chosen topic

  **Chosen:** Write 2-3 sentences of unique prose on a topic chosen by the implementer during implementation

  **Rationale (from research):**
  - Specification states \"Prose topic may be any topic chosen by the implementer (free-form)\"
  - Examining 300+ existing test files shows consistent pattern: unique, hand-written prose on diverse topics
  - Hard-coded approach is simplest, most transparent, and easiest to validate
  - No external dependencies, no template complexity
  - Natural file size of 400-600 bytes as consequence of proper structure
  - All 300+ prior implementations use this same approach

  ### 3. Git Integration: subprocess.run() with native git CLI

  **Chosen:** Use `subprocess.run()` with explicit command arrays for git add, commit, and push operations

  **Rationale (from research):**
  - Specification prohibits new external dependencies
  - subprocess with shell=False prevents command injection
  - Git CLI is available in all environments (required for git-based projects)
  - subprocess.run() provides clean error handling via check=True parameter
  - Pattern proven across 300+ prior feature implementations

  ### 4. Commit Message: Exact conventional commit format

  **Chosen:** `feat(303): create markdown file test-uvsl4f.md with prose content`

  **Rationale (from research):**
  - Specification explicitly requires this exact message as non-negotiable hard constraint
  - Follows conventional commit format (feat type, scope 303, description)
  - Matches project conventions and all 300+ prior implementations

  ## Implementation Strategy

  **Phase 1: File Creation and Validation**
  - Create markdown file with H1 heading as title (implementer chooses title)
  - Add blank line after heading
  - Add 2-3 sentences of prose content following blank line
  - Use pathlib.Path.write_text() with encoding='utf-8' and newline='' to ensure UTF-8 without BOM and LF line endings
  - Validate file meets success criteria: exists in correct location, correct size, correct encoding, correct line endings

  **Phase 2: Git Integration and Push**
  - Stage file with `git add test-uvsl4f.md` (subprocess.run with shell=False)
  - Commit with exact message via `git commit -m \"feat(303): create markdown file test-uvsl4f.md with prose content\"`
  - Push to feature branch via `git push -u origin HEAD`
  - Verify commit is on correct branch and exists at remote

  **Rationale for Phase Ordering:**
  Phase 1 creates the file and ensures it meets all structural requirements before git operations.
  Phase 2 integrates the completed file into version control. This ordering ensures the file is
  valid before committing, reducing the risk of invalid commits. Phases are sequential (not parallel)
  because Phase 2 depends on Phase 1 completion.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect encoding (UTF-8 vs default system encoding) | Use explicit encoding='utf-8' in pathlib.write_text() — eliminates environment-dependent behavior |
  | Incorrect line endings (CRLF on Windows instead of LF) | Use newline='' parameter to disable universal newlines mode — critical for cross-platform consistency |
  | File not created in correct location | Hardcode filename as 'test-uvsl4f.md' in repository root; no variable paths |
  | Invalid git commit message (typo, missing scope) | Copy exact message from specification; validate with git log after commit |
  | Git push fails (authentication, branch issues) | Feature branch already pre-created; git configuration already in place; no auth changes needed |
  | File size out of range (wrong structure) | Validate file size after creation (target 400-600 bytes as natural outcome of proper structure) |
  | Prose not readable or grammatically correct | Implementer manually writes 2-3 clear, grammatically correct sentences during Task 1 |
  | subprocess command fails | Use check=True parameter to raise CalledProcessError; git will output error details |
