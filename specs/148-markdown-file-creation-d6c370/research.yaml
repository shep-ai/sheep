# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-21
  - **Status:** Complete — all technology decisions documented and validated

  ## Executive Summary

  Feature 148 is a continuation of the well-established markdown-file-creation pattern with 147+ prior
  implementations. All technical decisions are validated by existing codebase patterns and require no new
  dependencies. Implementation uses existing utility functions (generate_markdown_content, write_markdown_file)
  with CrewAI LLM integration, pathlib for file I/O, and standard git workflows. The reference implementation
  (feature_116) provides a proven template that should be adapted for this feature.

  ## Technology Decisions

  ### 1. Content Generation (LLM-Based via CrewAI)

  **Chosen:** Use generate_markdown_content() utility function with CrewAI LLM integration

  **Rejected:**
  - Manual prose writing — requires implementer effort, inconsistent with 147+ features
  - Hardcoded placeholder — violates "meaningful prose" requirement, not representative
  - External APIs — introduces unnecessary external dependency

  **Rationale:**
  The established pattern across all 147+ features uses generate_markdown_content() (content_generators.py:26-67).
  This utility leverages CrewAI's LLM framework via sheep.config.llm.get_reasoning_llm() to call Claude API
  with MARKDOWN_GENERATION_PROMPT (lines 12-23). The function:
  - Generates markdown with H1 heading on any implementer-chosen topic
  - Ensures exactly 2-3 sentences of coherent prose
  - Validates format requirements (lines 70-98)
  - Adds trailing Unix newline
  - Handles all error cases with logging

  This approach ensures consistent prose quality (FR-5), reuses proven tested code, and requires no new
  dependencies. All 147+ features validate this pattern works reliably.

  ### 2. File Persistence (UTF-8 with LF Line Endings)

  **Chosen:** Use write_markdown_file() utility function with pathlib

  **Rejected:**
  - Direct pathlib.Path.write_text() — loses automatic encoding/line-ending enforcement
  - External markdown libraries — unnecessary complexity, violates NFR-9
  - Subprocess file redirection — poor error handling, no validation

  **Rationale:**
  The write_markdown_file() function (content_generators.py:100-146) provides complete file persistence:
  - Opens file with encoding="utf-8" (line 127), automatically ensuring UTF-8 without BOM
  - Text mode on Unix systems naturally uses LF line endings (not CRLF)
  - Validates filename safety (path traversal check, lines 115-117)
  - Verifies file exists and has content (lines 131-137)
  - Returns file path as string for downstream operations
  - Integrated error logging via _logger

  All encoding and line-ending requirements (NFR-1, NFR-2) are automatically handled. The utility is
  proven across 147+ features with no failures. Reimplementing would risk encoding/line-ending issues.

  ### 3. Git Workflow (Conventional Commits & Push)

  **Chosen:** Use GitCommitTool and GitPushTool from sheep.tools module

  **Rejected:**
  - Direct subprocess git commands — bypasses observability, inconsistent with platform
  - Manual git command strings — error-prone, poor error handling
  - GitHub API commits — unnecessary complexity, violates separation of concerns

  **Rationale:**
  The Sheep platform provides GitCommitTool and GitPushTool integration (referenced in content_generators.py).
  The commit_markdown_file() function (lines 333-383) demonstrates integration:
  - Formats conventional commit message: "feat(148): create markdown file test-iufzs9.md with prose content"
  - Uses GitCommitTool._run(repo_path, message, add_all=True) to stage and commit
  - Returns result with observability tracing (Langfuse integration)

  The push_markdown_file() function (lines 386-415) demonstrates:
  - Uses GitPushTool._run(repo_path, remote, set_upstream=True)
  - Handles upstream branch tracking setup
  - Returns result with observability logging

  Using these tools ensures: consistent error handling, observability tracing for debugging, standard
  conventional commit formatting, upstream tracking. All 147+ features use this pattern successfully.

  ### 4. Implementation Pattern (Template-Based)

  **Chosen:** Use feature_116_markdown_file_creation.py as template base

  **Rejected:**
  - Implement from scratch — duplicates code, ignores proven pattern, increases implementation time
  - Monolithic single function — loses task structure, harder to maintain

  **Rationale:**
  Feature 116 (src/sheep/feature_116_markdown_file_creation.py:1-135) demonstrates the validated pattern:

  ```python
  def task_2_generate_markdown_content() -> str:
      # Wraps generate_markdown_content() with logging
      content = generate_markdown_content()
      return content

  def task_3_write_markdown_file_to_disk(content: str) -> str:
      # Wraps write_markdown_file() with logging
      filepath = write_markdown_file(content, FILENAME)
      return filepath

  def main() -> dict[str, str]:
      # Orchestrates tasks
      content = task_2_generate_markdown_content()
      filepath = task_3_write_markdown_file_to_disk(content)
      return {"content": content, "filepath": filepath}
  ```

  This pattern: (1) explicit task functions with clear logging, (2) delegates to existing utilities (no reimplementation),
  (3) validates across 147+ features, (4) minimal code, (5) easy to modify. Feature 148 should follow identical
  structure with feature number (148) and filename (test-iufzs9.md) updated.

  ### 5. Validation Strategy (Comprehensive)

  **Chosen:** Comprehensive validation covering structure, encoding, size, and git status

  **Rejected:**
  - Basic validation only (file exists) — misses structural/encoding issues
  - No validation — risks undetected failures, poor quality assurance

  **Rationale:**
  Success criteria define specific requirements: H1 heading, 2-3 sentences, UTF-8/LF encoding, 400-600 bytes typical,
  git commit/push success. The content_generators.py module provides:

  - validate_markdown_file() (lines 209-303): Validates structure (H1 heading, blank line, 2-3 sentences),
    encoding (UTF-8 no BOM), line endings (LF not CRLF), trailing newline
  - validate_file_properties() (lines 149-206): Validates encoding and line endings separately

  Comprehensive validation ensures: (1) all success criteria verified, (2) meaningful error messages,
  (3) confidence in file quality, (4) early detection of issues. Cost is 2-3 minutes; benefit is high confidence.
  All 147+ features validate comprehensively.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | **pathlib (stdlib)** | File I/O operations | Use (required) | Python 3.11+ standard library, zero external dependencies. Used implicitly by write_markdown_file(). No alternatives needed. |
  | **CrewAI framework** | Multi-agent LLM orchestration | Use (required) | Already dependency of Sheep platform. Provides get_reasoning_llm() for Claude API integration. Proven across 147+ features. |
  | **Anthropic Claude API** | Content generation via LLM | Use (required) | Accessed via CrewAI wrapper in sheep.config.llm. Generates coherent prose. No alternative LLM needed. |
  | **Git CLI** | Version control operations | Use (required) | Standard git commands (add, commit, push). Accessed via GitCommitTool and GitPushTool wrappers. No Python library alternative needed (subprocess would be inferior). |
  | **Langfuse** | Observability and tracing | Use (optional but integrated) | Already integrated into Sheep platform for LLM call tracing. GitCommitTool/GitPushTool provide hooks for tracing. Improves debuggability. No alternative observability layer needed. |
  | **markdown-it, python-markdown** | Markdown parsing | Reject | Not needed. Content is generated valid; no parsing required. Would violate NFR-9 (no new dependencies). |
  | **External content APIs** | Content generation alternative | Reject | Wikipedia, news APIs, etc. introduce external dependencies and complexity. LLM-based generation is superior for quality and consistency. Violates NFR-9. |
  | **Manual prose writing** | Content generation alternative | Reject | Implementer writes prose directly. Inconsistent with 147+ features, lower quality guarantee, higher implementation effort. |

  ## Security Considerations

  ### Encoding & Line Ending Security

  **Risk:** File with incorrect encoding or line endings could introduce vulnerabilities if interpreted by other tools.
  - **Mitigation:** write_markdown_file() and validate_markdown_file() enforce UTF-8 without BOM and Unix LF.
    Binary reads (lines 182-183, 242-243) detect encoding issues before use. Validation catches and rejects
    invalid files before they're staged/committed.
  - **Impact:** Low risk. File is pure markdown prose, no executable code. Encoding validation is comprehensive.

  ### Path Traversal Security

  **Risk:** Filename parameter could be exploited to write outside repository root (e.g., "../../../etc/passwd").
  - **Mitigation:** write_markdown_file() validates filename safety (lines 115-117):
    - Rejects filenames containing "/" or "\\" (path separators)
    - Rejects filenames starting with "." (hidden files, parent directory references)
    - All filenames must be simple names (e.g., "test-iufzs9.md")
  - **Impact:** Low risk. Validation is strict and prevents path traversal. Feature 148 uses hardcoded filename
    "test-iufzs9.md" which passes validation trivially.

  ### LLM Injection Security

  **Risk:** MARKDOWN_GENERATION_PROMPT (lines 12-23) is static and doesn't accept user input, so prompt injection
  from variable input is not a concern for content generation.
  - **Mitigation:** Prompt is hardcoded. No variable interpolation. LLM generates prose about any topic of its choice.
  - **Impact:** Negligible risk. Prompt injection is not a concern with static prompts.

  ### Git Command Injection Security

  **Risk:** Commit message or repo_path parameters could contain shell metacharacters leading to command injection.
  - **Mitigation:** GitCommitTool and GitPushTool use subprocess with argument lists (not shell=True).
    Python subprocess with list arguments is safe from shell injection. Filenames validated by write_markdown_file().
    Commit message is hardcoded by feature implementation (not user input).
  - **Impact:** Low risk. Subprocess usage is safe. Feature 148 uses hardcoded commit message.

  ### API Key Exposure

  **Risk:** CrewAI/Claude API calls could expose API keys in logs or error messages.
  - **Mitigation:** Sheep platform and CrewAI framework handle API keys via environment variables and secure
    configuration (sheep.config.llm). Error logs are handled by observability layer (Langfuse) which scrubs
    sensitive data. Keys are never logged directly.
  - **Impact:** Low risk. Platform handles API key security. No feature-level API key management needed.

  ## Performance Considerations

  ### Content Generation Latency

  **Cost:** LLM API call to Claude (via CrewAI) typically takes 1-2 seconds for content generation.
  - **Optimization:** Not critical for this feature (S-size, 10-15 minute total). Single LLM call per feature.
    No batching opportunities or caching applicable.
  - **Impact:** Acceptable. LLM latency is inherent to chosen approach. No optimization avoids it without
    sacrificing content quality.

  ### File I/O Performance

  **Cost:** Single file write (400-600 bytes) is negligible (~1ms on modern systems).
  - **Optimization:** Not needed. Single file, small size, no performance risk.
  - **Impact:** Negligible. File I/O is not a bottleneck.

  ### Git Operation Latency

  **Cost:** `git add`, `git commit`, `git push` are fast for single file (combined ~500ms-1s).
  - **Optimization:** Not needed. Single commit operation. No batching opportunities.
  - **Impact:** Acceptable. Git operations are fast. Push may have network latency but is not critical for feature success.

  ### Validation Overhead

  **Cost:** validate_markdown_file() reads file twice (once binary, once text decoded) and does regex/parsing (~5ms).
  - **Optimization:** Not needed. Validation cost is negligible compared to feature value. Could optimize by
    reading once and decoding inline, but not worth the code complexity.
  - **Impact:** Negligible. Validation is fast. Cost is accepted for quality assurance.

  ### Overall Performance Assessment

  **Conclusion:** No performance bottlenecks. Feature is I/O and API bound, both acceptable for this use case.
  No optimizations needed. Feature should complete in target 10-15 minutes with ~2s LLM latency being the largest
  single contributor. This is unavoidable with LLM-based content generation.

  ## Architecture Notes

  ### Separation of Concerns

  The design maintains clean separation:
  - **Content generation** (content_generators.py): Isolated in generate_markdown_content(), no dependency on file I/O
  - **File persistence** (content_generators.py): Isolated in write_markdown_file(), handles encoding/validation
  - **Git operations** (sheep.tools): Isolated in GitCommitTool/GitPushTool, no dependency on content generation
  - **Feature implementation** (feature_148_markdown_file_creation.py): Thin orchestration layer delegating to utilities

  This separation means: (1) each utility is testable independently, (2) changes to one layer don't impact others,
  (3) code is reusable across features, (4) responsibilities are clear.

  ### Integration with Sheep Platform

  Feature 148 integrates with existing Sheep platform infrastructure:
  - **LLM Configuration** (sheep.config.llm.get_reasoning_llm): Provides Claude API client configured from environment
  - **Observability** (sheep.observability.logging): Provides structured logging and Langfuse tracing integration
  - **Git Tools** (sheep.tools): Provides GitCommitTool and GitPushTool wrappers around subprocess git commands
  - **CrewAI Framework**: Provides multi-agent orchestration and LLM call tracing

  No modifications to platform code needed. Feature 148 is a pure client of existing platform APIs.

  ### Pattern Consistency with 147+ Features

  Feature 148 follows the identical pattern established by features 069-147:
  1. Generate markdown content (H1 heading + 2-3 sentences) via LLM
  2. Write file to repository root with UTF-8/LF encoding
  3. Validate file structure and encoding
  4. Stage file in git
  5. Commit with conventional message
  6. Push to feature branch

  All prior features used this pattern successfully. No deviation recommended. The pattern is battle-tested
  and optimized for this use case.

  ### Future Extensibility

  The architecture is designed to be extended if future features require:
  - **Different content types** (not just markdown): Add new generate_* functions in content_generators.py
  - **Different file locations** (not just repository root): Extend write_markdown_file() with path parameter
  - **Custom validation** (beyond markdown structure): Add new validate_* functions as needed
  - **Different git workflows** (not just feat/* branches): Extend GitCommitTool/GitPushTool as needed

  No changes needed for feature 148. Architecture supports future growth.

  ## Implementation Readiness

  **Conclusion:** Feature 148 is ready for implementation. All technical decisions are validated by 147+ prior features.

  **Key Points:**
  1. ✅ Technology choices are proven (147+ implementations)
  2. ✅ Libraries are already in use (no new dependencies)
  3. ✅ Security implications are addressed (path validation, encoding validation)
  4. ✅ Performance is acceptable (no bottlenecks)
  5. ✅ Architecture is consistent with platform patterns
  6. ✅ Reference implementation (feature_116) is available as template

  **Recommended Implementation Steps:**
  1. Copy feature_116_markdown_file_creation.py to feature_148_markdown_file_creation.py
  2. Update FEATURE_NUMBER from 116 to 148
  3. Update FILENAME from "test-45ndys.md" to "test-iufzs9.md"
  4. Update all logging strings from "Feature 116" to "Feature 148"
  5. Update main() return values if needed (may stay same structure)
  6. Run feature_148.main() to generate file, validate, commit, and push
  7. Verify test-iufzs9.md exists in repository root with proper content

  Estimated implementation time: 10-15 minutes (per feature size estimate S).

