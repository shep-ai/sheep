# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text() with explicit encoding='utf-8'

  **Rejected:**
  - os.open() with manual file handling — More verbose, error-prone with encoding, requires explicit close() calls in try-finally blocks
  - open() with context manager — Requires more complex syntax, manual newline handling, less modern style
  - External file I/O libraries — Unnecessary dependency; pathlib is built-in

  **Rationale:** pathlib is the modern Python standard (available since 3.4). It provides atomic writes, automatic UTF-8 encoding without BOM, and automatic LF line endings across all platforms (Windows, macOS, Linux). The approach is established in features 200-206, concise, readable, and idiomatic. Explicitly passing encoding='utf-8' ensures no BOM is inserted (default behavior), and newline handling is automatic.

  **Implementation:**
  ```python
  markdown_content = f\"# {TITLE_TEXT}\\n\\n{PROSE_CONTENT}\\n\"
  file_path = Path(FILENAME)
  file_path.write_text(markdown_content, encoding=\"utf-8\")
  ```

  ### 2. Content Generation: Hard-Coded Strings

  **Chosen:** Hard-coded module constants (TITLE_TEXT and PROSE_CONTENT)

  **Rejected:**
  - Claude API for dynamic generation — Adds network dependency, introduces latency, makes output non-deterministic, harder to review
  - Random/procedural generation — Non-deterministic output, may produce grammatically incorrect content, violates NFR-7
  - External file reading — Additional file I/O complexity, harder to verify inclusion in repository

  **Rationale:** Hard-coded content ensures deterministic output (identical file every run), transparent auditable content, simplified error handling (no network failures), faster execution, and reliable testing/review. Matches established pattern from features 200-206. Content is defined as module-level constants, making it explicit and reviewable. Specification requires grammatically correct content, which hard-coded prose guarantees.

  **Implementation:**
  ```python
  TITLE_TEXT = \"An interesting title about a topic\"
  PROSE_CONTENT = (
      \"First sentence of prose content. \"
      \"Second sentence of prose content. \"
      \"Optional third sentence of prose content.\"
  )
  ```

  ### 3. Git Command Execution: subprocess.run()

  **Chosen:** subprocess.run() with shell=False and array argument format

  **Rejected:**
  - GitPython library — Adds external dependency, slower than subprocess, unnecessary abstraction for simple commands
  - Shell command strings (shell=True) — Security vulnerability (shell injection risk), platform-dependent, harder to test
  - os.system() — Deprecated, poor error handling, only returns exit code

  **Rationale:** subprocess.run() with shell=False is the secure Python standard. Array format prevents shell injection attacks (security critical), allows easy stdout/stderr capture for logging, provides clear error codes, and is efficient. No external dependencies required. Matches feature 206 pattern and existing codebase conventions.

  **Implementation:**
  ```python
  subprocess.run(
      [\"git\", \"add\", filename],
      check=True,
      capture_output=True,
      text=True,
  )
  ```

  ### 4. Validation Architecture: Dedicated Functions

  **Chosen:** Separate validation function for each concern, orchestrated by central validate_markdown_file()

  **Rejected:**
  - Single monolithic validation function — Hard to identify which check failed, verbose error handling, difficult to test individual concerns
  - Inline validation in main() — Scatters logic throughout orchestration, reduces reusability, violates pattern
  - No validation — Violates specification requirements, unsafe

  **Rationale:** Separate functions enable clear responsibility separation, testability, and fail-fast error detection. Central orchestrator provides comprehensive validation with logging. Matches feature 206 pattern and NFR-5 (pattern matching). Each function is self-contained and reusable.

  **Validation Functions:**
  - verify_file_exists() — Checks file exists at specified path
  - validate_markdown_format() — Ensures H1 heading, blank line separator, single H1 only
  - validate_sentence_count() — Verifies 2-3 sentences using period counting
  - validate_encoding() — Checks UTF-8 encoding, no BOM
  - validate_line_endings() — Verifies LF only, no CRLF or CR
  - validate_file_size() — Ensures 200-700 byte range
  - Helper functions: extract_prose_content(), count_sentences()

  ### 5. Line Ending Handling: Platform-Agnostic Automatic

  **Chosen:** Rely on pathlib.Path.write_text() automatic LF handling on all platforms

  **Rejected:**
  - Manual line ending conversion post-write — Adds complexity, requires re-writing file, error-prone
  - Platform-specific conditional logic — Complex branching for Windows/Unix/Mac, harder to test
  - open() with custom newline parameter — More verbose, no benefits over pathlib

  **Rationale:** pathlib.Path.write_text() automatically ensures LF line endings on all platforms (Windows, macOS, Linux) when writing text. This is documented Python behavior. Validation function validate_line_endings() verifies no CRLF or CR sequences exist, providing assurance. Simple, reliable, and matches feature 206 pattern.

  ### 6. Error Handling: Specific Exception Types

  **Chosen:** Specific exception handling (FileNotFoundError, ValueError, subprocess.CalledProcessError) with try-catch blocks

  **Rejected:**
  - Bare except clauses — Catches KeyboardInterrupt, SystemExit; masks unexpected errors
  - Generic Exception only — Doesn't distinguish error types, harder debugging, harder recovery
  - No error handling — Violates specification, cryptic error messages

  **Rationale:** Specific exceptions enable targeted recovery and clear error messages. FileNotFoundError catches missing files, ValueError catches validation failures, subprocess.CalledProcessError catches git failures. Matches feature 206 pattern. Fail-fast semantics: first error stops execution with clear message.

  **Implementation:**
  ```python
  try:
      validate_markdown_file()
      git_add_file()
      git_commit()
      git_push()
  except (FileNotFoundError, ValueError, subprocess.CalledProcessError) as e:
      _logger.error(f\"Workflow failed: {e}\")
      return 1
  ```

  ### 7. Logging Strategy: Structured Platform Logging

  **Chosen:** sheep.observability.logging.get_logger(__name__) with appropriate log levels (debug, info, warning, error)

  **Rejected:**
  - print() statements — Not structured, no levels, doesn't integrate with platform infrastructure
  - Python logging module directly — Duplicates existing platform infrastructure
  - No logging — Violates NFR-10, no visibility into execution

  **Rationale:** sheep.observability.logging.get_logger() is the established platform infrastructure (used in features 200-206). Provides structured logging, integrates with platform monitoring, allows dynamic log level configuration. Satisfies NFR-10 (comprehensive logging) and matches established pattern.

  **Log Levels Used:**
  - info: Major workflow phases (starting feature, creating file, committing, pushing)
  - debug: Detailed operation steps (file operations, git commands, validation checks)
  - error: Exceptions and failures with context

  ---

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  |---------|---------|----------|-----------|
  | pathlib | File I/O (creation, reading, validation) | Use (built-in) | Standard Python library, no external dependency, provides atomic writes, automatic UTF-8 + LF handling |
  | subprocess | Git command execution | Use (built-in) | Standard Python library, secure (shell=False), allows output capture, clear error handling |
  | sheep.observability.logging | Structured logging | Use (existing infrastructure) | Platform standard, integrates with monitoring, no new dependency |
  | os | File and process operations | Use sparingly (built-in) | Only used for standard library imports; pathlib preferred for file ops |
  | GitPython | Git operations wrapper | Reject | External dependency not justified, subprocess is simpler for basic commands |
  | Markdown | Markdown parsing/validation | Reject | No parsing needed; plain text markdown is sufficient for specification |
  | nltk / spacy | NLP sentence parsing | Reject | Over-engineered; simple period counting sufficient for requirement |

  ---

  ## Security Considerations

  1. **Shell Injection Prevention:** subprocess.run() uses shell=False with array arguments, preventing shell injection attacks. Git commands are constructed as arrays, not strings. Critical for security when executing external processes.

  2. **File Permissions:** pathlib.Path.write_text() creates files with default permissions (typically 0o644 on Unix). Specification doesn't require specific permissions; default is acceptable for non-sensitive content.

  3. **UTF-8 Encoding:** Explicit encoding='utf-8' prevents BOM injection and ensures portable text files. Validation function validate_encoding() verifies no BOM exists, providing defense-in-depth.

  4. **Content Integrity:** Hard-coded content is immutable at runtime. No external inputs (user, API) means no injection vectors. Content is reviewed during implementation, reducing attack surface.

  5. **Git Authentication:** Uses local git configuration (no credentials in code). Assumes repository already authenticated; feature pushes to configured remote without explicit credentials.

  ---

  ## Performance Considerations

  1. **File I/O:** Single file write operation (pathlib atomic write) is fast. File size 200-700 bytes is tiny; no performance concerns.

  2. **Validation:** Six separate validation functions, each O(n) where n = file size (bytes/lines). With 200-700 byte files, all validations complete in microseconds. No performance bottleneck.

  3. **Git Operations:** Three subprocess calls (add, commit, push). subprocess.run() is efficient. Network latency on push is dominant factor (external). No optimization needed for local operations.

  4. **Logging:** Structured logging is efficient. Log levels allow runtime filtering (debug logs skipped if not enabled). No performance concern.

  5. **Memory Usage:** Hard-coded strings in module scope; loaded once on import. File content (700 bytes max) fits easily in memory. No memory concerns.

  **Conclusion:** Feature is performance-optimal. No caching, parallelization, or async needed. Simple synchronous workflow is appropriate for straightforward file creation task.

  ---

  ## Architecture Notes

  ### How This Fits into Existing Codebase

  1. **Feature Module Pattern:** Implementation follows established pattern from features 200-206. Module structure:
     - Module docstring explaining purpose and approach
     - Import statements (subprocess, pathlib, logging)
     - Constants (FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT)
     - File creation function (create_markdown_file)
     - Validation functions (verify_file_exists, validate_markdown_format, validate_sentence_count, etc.)
     - Git operation functions (git_add_file, git_commit, git_push)
     - Orchestration function (main)
     - if __name__ == \"__main__\" block

  2. **Integration Points:**
     - Uses established logging infrastructure (sheep.observability.logging)
     - Creates file in repository root (standard location for test-*.md files)
     - Uses Git commands via subprocess (standard platform approach)
     - Returns exit codes (0 for success, 1 for failure) for scripting
     - No new dependencies; uses only built-in Python libraries + existing platform infrastructure

  3. **Consistency with Predecessors:** Directly mirrors features 206 and 205 structure, variable naming, error handling patterns, and workflow orchestration. Enables easy code review and maintenance.

  4. **Modularity:** Each function has single responsibility, enabling unit testing and reuse. Central validate_markdown_file() orchestrator coordinates validation steps in sequence.

  ### Data Flow

  ```
  Module Load
    ↓
  Import logging, subprocess, pathlib
    ↓
  Define constants (filename, feature number, branch, commit message, content)
    ↓
  main() orchestration
    ├─ Phase 1: create_markdown_file()
    │   └─ Path.write_text() → File created
    ├─ Phase 2: validate_markdown_file()
    │   ├─ verify_file_exists()
    │   ├─ validate_markdown_format()
    │   ├─ validate_sentence_count()
    │   ├─ validate_encoding()
    │   ├─ validate_line_endings()
    │   └─ validate_file_size()
    └─ Phase 3: Git operations
        ├─ git_add_file() → subprocess git add
        ├─ git_commit() → subprocess git commit
        └─ git_push() → subprocess git push
    ↓
  Return exit code (0 = success, 1 = failure)
  ```

