content: |
  ## Implementation Summary

  This task breakdown implements feature 207 across 6 phases following the established pattern from features 200-206.

  ### Phase 1: Foundation (Task 1 — 20 min)

  Create the feature module with all necessary constants and structure. This is the prerequisite for all subsequent work.

  **Task 1** — Create module file with constants:
  - Create src/sheep/features/feature_207_markdown_file_creation.py
  - Import required libraries (pathlib, subprocess, logging)
  - Define constants (filename, feature number, branch, commit message, content)
  - Set up logging and function stubs

  ### Phase 2: File Creation (Task 2 — 25 min)

  Implement the core file generation functionality.

  **Task 2** — Implement create_markdown_file():
  - Create markdown file using pathlib.Path.write_text()
  - Format content: H1 title, blank line, prose content
  - Ensure UTF-8 encoding and LF line endings
  - Add appropriate logging

  ### Phase 3: Helper Functions (Task 3 — 20 min)

  Implement utility functions that support validation.

  **Task 3** — Implement count_sentences() and extract_prose_content():
  - count_sentences(text) counts periods to determine sentence count
  - extract_prose_content(file_path) extracts prose from file
  - Both support validation logic in next phase

  ### Phase 4: Validation (Task 4 — 45 min)

  Implement comprehensive validation framework.

  **Task 4** — Implement 6 validation functions + orchestrator:
  - verify_file_exists() — Check file exists
  - validate_markdown_format() — Check H1 format and structure
  - validate_sentence_count() — Check 2-3 sentences
  - validate_encoding() — Check UTF-8 without BOM
  - validate_line_endings() — Check LF only
  - validate_file_size() — Check 200-700 bytes
  - validate_markdown_file() — Central orchestrator

  All validators raise ValueError on failure, return True on success.
  Central orchestrator calls all in sequence with fail-fast semantics.

  ### Phase 5: Git Integration (Task 5 — 30 min)

  Implement version control operations.

  **Task 5** — Implement git operation functions:
  - git_add_file(file_path) — Stage file with git add
  - git_commit(file_path, message) — Create commit with conventional message
  - git_push() — Push to remote branch

  All use subprocess.run() with secure array format.

  ### Phase 6: Integration (Task 6 — 35 min)

  Wire everything together and test end-to-end.

  **Task 6** — Implement main() and integration testing:
  - Orchestrate complete workflow (create → validate → stage → commit → push)
  - Handle exceptions gracefully
  - Return appropriate exit codes
  - Test complete workflow locally
  - Verify all specification success criteria met

  ## Total Effort

  **3 hours** across 6 phases:
  - Phase 1: 20 min (foundation)
  - Phase 2: 25 min (file creation)
  - Phase 3: 20 min (helpers)
  - Phase 4: 45 min (validation)
  - Phase 5: 30 min (git)
  - Phase 6: 35 min (integration)

  **Total: ~3 hours** (aligns with "S" (Small) size estimate from specification)

  ## Task Execution Order

  Tasks must be executed in order due to dependencies:

  1. **Task 1** — Create module (prerequisite for all)
  2. **Task 2** — File creation (prerequisite for validation)
  3. **Task 3** — Helper functions (prerequisite for validation)
  4. **Task 4** — Validation (prerequisite for main orchestrator)
  5. **Task 5** — Git operations (prerequisite for main orchestrator)
  6. **Task 6** — Integration (final assembly and testing)

  Each task follows TDD: RED → GREEN → REFACTOR

  ## Success Criteria

  Implementation is complete when all tasks are done and:
  ✓ Module src/sheep/features/feature_207_markdown_file_creation.py exists
  ✓ All functions implemented and tested
  ✓ File test-ylivjf.md created in repository root
  ✓ File contains valid markdown with H1 title and 2-3 sentences
  ✓ File meets all encoding, line ending, and size requirements
  ✓ File is staged, committed, and pushed to feat/207-markdown-file-creation-cebbe6
  ✓ Commit message follows conventional commits format
  ✓ All validation checks pass
  ✓ Full workflow executes successfully and returns 0
