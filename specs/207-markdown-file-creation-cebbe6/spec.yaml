content: |
  ## Problem Statement

  Create a single markdown file named `test-ylivjf.md` in the repository root directory
  containing a markdown H1 title and either 2 or 3 sentences of grammatically correct content
  on any topic. This continues the series of similar file creation tasks implemented in features 200-206,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic file creation
  workflows following established patterns and conventions.

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-ylivjf.md` in the repository root directory
  - **FR-2**: File must contain exactly one valid markdown H1 title (single `#` followed by title text and newline)
  - **FR-3**: File must contain exactly 2 or exactly 3 grammatically complete sentences (each ending with a period)
  - **FR-4**: Sentences must be separated from the title by a blank line and from each other by single spaces or newlines
  - **FR-5**: All file content must follow markdown syntax conventions (valid UTF-8, proper spacing, no syntax errors)
  - **FR-6**: Stage the new file in Git using `git add` with the correct file path
  - **FR-7**: Create a commit with a conventional commit message following the format: `feat(207): [short description]`
  - **FR-8**: Push the commit to the remote branch `feat/207-markdown-file-creation-cebbe6` using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors (e.g., GitHub, CommonMark)
  - **NFR-4**: Git commit message must follow conventional commits specification (feat scope, lowercase body)
  - **NFR-5**: Implementation must follow patterns and conventions established in features 200-206 (feature module, validation functions, proper error handling)
  - **NFR-6**: No external dependencies or build steps required beyond existing project infrastructure (Git, file I/O)
  - **NFR-7**: Implementation should be deterministic; content should be hard-coded for consistency
  - **NFR-8**: File size must be within reasonable range (approximately 250-600 bytes, allowing for variation in sentence length)
  - **NFR-9**: Implementation must include comprehensive validation with clear error messages on failure
  - **NFR-10**: All functions must have proper logging via `sheep.observability.logging.get_logger()`

  ## Success Criteria

  - [ ] File `test-ylivjf.md` exists at repository root after execution
  - [ ] File contains exactly one H1 markdown title at the beginning (pattern: `# [Title Text]`)
  - [ ] File contains exactly 2 or exactly 3 grammatically complete sentences after the title
  - [ ] Each sentence ends with a period and is separated from others by space or newline
  - [ ] No markdown syntax errors in file
  - [ ] File renders correctly when processed by standard markdown tools
  - [ ] File is staged and committed with conventional commit message `feat(207): [description]` (verified by `git log`)
  - [ ] Commit is pushed to remote branch `feat/207-markdown-file-creation-cebbe6` (verified by `git branch -r`)
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are LF (no CRLF)
  - [ ] File size is between 200-700 bytes
  - [ ] Implementation uses feature module pattern matching features 200-206
  - [ ] Implementation includes dedicated validation functions (not inline checks)

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root Directory** - Contains markdown files created by feature tasks (200+ test-*.md files plus topic markdown files like ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **src/sheep/** - Main Python package with:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management for LLM providers
    - `flows/` - Flow orchestration for the code implementation pipeline
    - `observability/` - Logging and Langfuse integration
    - `tools/` - Git and file operation tools
    - `cli.py` - CLI entry point
  - **src/sheep/features/** - Feature-specific implementation modules (200+ feature modules)
  - **specs/** - Feature specifications in YAML format (207+ specs with markdown auto-generation)
  - **tests/** - Python test files
  - **.github/** - GitHub workflows and CI/CD configuration
  - **Dockerfile** - Docker configuration for containerized execution

  ### Architecture Patterns

  The Sheep platform uses a **Feature-based modular architecture** with established conventions:

  1. **Feature Module Pattern**
     - Each feature has a dedicated Python module (e.g., `feature_207_markdown_file_creation.py`)
     - Modules implement complete workflow: generation, validation, git operations
     - Functions are organized by responsibility: generation, validation, git operations
     - Comprehensive error handling and logging throughout

  2. **File Creation Workflow**
     - Create file with hard-coded content for deterministic output
     - Validate file structure (markdown format, sentence count, encoding, line endings)
     - Stage file in Git using `git add`
     - Create commit with conventional commit message
     - Push to remote branch

  3. **Git-Integrated Workflows**
     - Automatic branch management based on feature number
     - Support for git worktrees for isolated development
     - Full commit/push automation with conventional commit messages
     - Branch naming: `feat/[feature-number]-markdown-file-creation-[suffix]`

  4. **Validation Framework**
     - Dedicated validation functions for each concern (file existence, format, encoding, line endings, file size)
     - Clear error messages on validation failure
     - Logging at appropriate levels (debug, info, warning, error)

  ### Relevant Technologies

  - **Python** - Primary implementation language (3.10+)
  - **Pathlib** - Modern file operations with proper encoding/line-ending handling
  - **Subprocess** - Git command execution with error handling
  - **UTF-8 Encoding** - Standard text file encoding without BOM
  - **Markdown** - Plain text markdown syntax for file content
  - **Git** - Version control for file staging, commits, and pushes

  ### Implementation Infrastructure

  - **Logging** - Structured logging via `sheep.observability.logging.get_logger()`
  - **File I/O** - Using pathlib.Path with explicit encoding=\"utf-8\"
  - **Git Commands** - Using subprocess with proper error handling and logging
  - **Constants** - Feature number, filename, branch name, commit message stored as module constants

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | Feature creates a markdown file (test-ylivjf.md) directly in the repository root, following the pattern established by previous 206 test markdown files |
  | src/sheep/features/ | High | New feature module (feature_207_markdown_file_creation.py) will be created following the established pattern from features 200-206 with file creation, validation, and git operations |
  | Git Workflow | Medium | New file must be committed with conventional commit message (feat(207): ...) and pushed to remote branch feat/207-markdown-file-creation-cebbe6 |
  | specs/ | Low | Spec documentation already created; no code changes needed beyond this analysis phase |

  ## Dependencies

  **No external dependencies required beyond existing project infrastructure.** This feature depends on:

  1. **Git** - For staging files, committing changes, and pushing to remote
  2. **File I/O** - Standard file creation via pathlib.Path (built-in Python library)
  3. **Markdown Format** - Plain text markdown, no special libraries needed
  4. **Existing Repository Structure** - Uses established root directory convention for test markdown files
  5. **Logging Infrastructure** - Via `sheep.observability.logging` module
  6. **Existing Branch** - Uses pre-configured feature branch `feat/207-markdown-file-creation-cebbe6`

  ## Size Estimate

  **S** (Small — a few hours) — This is a straightforward file creation task requiring minimal effort.
  The implementation involves:

  1. Create feature module (feature_207_markdown_file_creation.py) following the established pattern from features 200-206
  2. Define constants (filename, feature number, branch name, commit message)
  3. Implement file generation function with hard-coded content (title + 2-3 sentences)
  4. Implement validation functions (file existence, markdown format, sentence count, encoding, line endings, file size)
  5. Implement git operations (add, commit, push) with proper error handling
  6. Create main orchestration function coordinating all steps
  7. Add comprehensive logging throughout

  No code modification to existing files, no new dependencies, no complex integration.
  The pattern is well-established from features 200-206, enabling rapid implementation.
  Estimated effort: 1-2 hours including testing and validation.

