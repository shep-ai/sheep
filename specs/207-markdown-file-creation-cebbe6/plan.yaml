content: |
  ## Architecture Overview

  ### Module Structure

  Implementation follows the established feature module pattern from features 200-206:

  ```
  feature_207_markdown_file_creation.py
  ├── Module docstring (purpose, approach, usage)
  ├── Imports (pathlib, subprocess, logging)
  ├── Constants (filename, feature number, branch, commit message, content)
  ├── Helper functions (extract_prose_content, count_sentences)
  ├── File creation function (create_markdown_file)
  ├── Validation functions (verify_file_exists, validate_markdown_format, etc.)
  ├── Git operation functions (git_add_file, git_commit, git_push)
  ├── Orchestration function (main)
  └── if __name__ == "__main__" block
  ```

  This structure provides clear separation of concerns, testable individual functions, reusable validation logic, and fail-fast error handling with logging.

  ### Integration with Existing Codebase

  - **Logging**: Uses sheep.observability.logging.get_logger(__name__) for structured integration
  - **File Location**: Creates test-ylivjf.md in repository root (matches features 200-206 convention)
  - **Git Integration**: Uses subprocess.run() with shell=False (secure, no external dependencies)
  - **Error Handling**: Specific exception types (FileNotFoundError, ValueError, subprocess.CalledProcessError)
  - **No External Dependencies**: Only Python built-in libraries + existing platform infrastructure

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Decision**: Use pathlib.Path.write_text() with explicit encoding=\"utf-8\"

  **Rationale**:
  - Modern Python standard (since 3.4), atomic writes, automatic UTF-8 without BOM
  - Automatic LF line endings on all platforms (Windows, macOS, Linux)
  - Concise and idiomatic Python; matches features 200-206 pattern
  - Encoding=\"utf-8\" explicitly prevents BOM insertion

  ### 2. Content Generation: Hard-Coded Strings

  **Decision**: Define TITLE_TEXT and PROSE_CONTENT as module-level constants

  **Rationale**:
  - Ensures deterministic output (identical file every run)
  - Content is transparent and auditable (included in source code)
  - Simplified error handling (no network failures, no API dependencies)
  - Matches established pattern from features 200-206
  - Specification requires grammatically correct content, which hard-coded prose guarantees

  ### 3. Git Operations: subprocess.run() with shell=False

  **Decision**: Execute git commands using subprocess.run(['git', ...]) with shell=False

  **Rationale**:
  - Secure: array format prevents shell injection attacks (security critical)
  - Efficient: no subprocess overhead from shell, clear error handling via check=True
  - No external dependencies: subprocess is built-in Python library
  - Matches feature 206 pattern and existing codebase conventions

  ### 4. Validation Architecture: Dedicated Functions

  **Decision**: Separate validation function for each concern, orchestrated by central validate_markdown_file()

  **Rationale**:
  - Clear responsibility separation: each function validates one aspect
  - Testable: individual functions can be unit tested independently
  - Maintainable: easy to identify which check failed
  - Fail-fast: central orchestrator stops on first validation error
  - Matches pattern from features 200-206

  **Validation Functions**:
  - verify_file_exists() — Check file exists at path
  - validate_markdown_format() — Ensure H1 heading, blank line separator, single H1
  - validate_sentence_count() — Verify 2-3 sentences using period counting
  - validate_encoding() — Check UTF-8 encoding, no BOM
  - validate_line_endings() — Verify LF only, no CRLF or CR
  - validate_file_size() — Ensure 200-700 byte range

  ### 5. Logging: Platform Infrastructure

  **Decision**: Use sheep.observability.logging.get_logger(__name__) throughout

  **Rationale**:
  - Integrates with platform observability infrastructure
  - Supports dynamic log level configuration
  - Provides structured logging for monitoring/alerting
  - Established pattern in features 200-206

  **Log Levels**:
  - info: Major workflow phases
  - debug: Detailed operation steps
  - error: Exceptions with context

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (Foundation)**: Create module with constants first—establishes foundation for subsequent phases
  2. **Phase 2 (File Creation)**: Implement file creation next—core functionality; subsequent phases depend on file existing
  3. **Phase 3 (Helpers)**: Implement helper functions—support validation logic in phase 4
  4. **Phase 4 (Validation)**: Implement validation framework—verifies file meets requirements; done after file creation
  5. **Phase 5 (Git)**: Implement git operations—come after validation, as we only commit validated files
  6. **Phase 6 (Integration)**: Wire everything together and perform end-to-end testing

  ### Data Flow

  ```
  main() orchestrator
    │
    ├─→ create_markdown_file()
    │   └─ pathlib.Path.write_text()
    │
    ├─→ validate_markdown_file()
    │   ├─ verify_file_exists()
    │   ├─ validate_markdown_format()
    │   ├─ validate_sentence_count()
    │   │  └─ count_sentences()
    │   ├─ validate_encoding()
    │   ├─ validate_line_endings()
    │   └─ validate_file_size()
    │
    └─→ Git operations (only if validation passes)
        ├─ git_add_file()
        ├─ git_commit()
        └─ git_push()
  ```

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | **Git push fails** | Medium | High | Error handling in git_push(); log helpful messages about remote configuration |
  | **File encoding issues on Windows** | Low | Medium | pathlib.Path.write_text(encoding=\"utf-8\") prevents BOM; validate_encoding() checks for BOM |
  | **Line ending issues (CRLF vs LF)** | Low | Medium | pathlib.Path.write_text() automatically uses LF; validate_line_endings() checks for CRLF |
  | **Git command not found** | Low | High | subprocess.run() raises FileNotFoundError if git not in PATH; catch and log with helpful message |
  | **File already exists** | Very Low | Low | create_markdown_file() overwrites file (idempotent behavior acceptable for test file) |
  | **Validation false positive** | Low | High | Test each validation function independently with valid and invalid inputs |
  | **Insufficient disk space** | Very Low | Low | pathlib.Path.write_text() raises OSError; catch and log (file size is only 200-700 bytes) |

  ## Testing Strategy

  ### Unit Testing

  - Test each validation function independently with valid and invalid inputs
  - Test count_sentences() with various sentence counts
  - Test extract_prose_content() with different file structures
  - Mock subprocess for git operation tests to avoid actual git commands

  ### Integration Testing

  - Run complete workflow on test file
  - Verify file created, validated, staged, committed, and pushed
  - Check git log shows correct commit message
  - Verify file matches all specification requirements

  ### Local Testing

  - Create test file in isolated environment
  - Verify all validation checks pass
  - Check file encoding and line endings
  - Verify git operations work in test branch

