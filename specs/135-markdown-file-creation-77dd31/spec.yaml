content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-0h8m0m.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 134+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 063-134, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-0h8m0m.md` exists at repository root
  - [ ] File contains exactly one H1 markdown heading (#) as the first element
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses LF (Unix) line endings
  - [ ] File size is between 400-600 bytes (measured after line ending normalization)
  - [ ] File is staged in git with `git add test-0h8m0m.md`
  - [ ] File is committed with conventional commit message: `feat(135): Create markdown file test-0h8m0m.md`
  - [ ] Commit is pushed to feature branch `feat/135-markdown-file-creation-77dd31`
  - [ ] No modifications to source code files in /src/sheep/
  - [ ] No modifications to configuration files
  - [ ] No modifications to existing test files
  - [ ] Feature branch state matches pattern established by features 063-134

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-0h8m0m.md` at repository root
  - **FR-2**: File must contain a markdown H1 heading (#) as the first line, followed by a blank line
  - **FR-3**: File must contain 2-3 sentences of prose content describing any topic
  - **FR-4**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **FR-5**: File must use LF (Unix-style) line endings, not CRLF or CR
  - **FR-6**: Stage the file in git using `git add test-0h8m0m.md`
  - **FR-7**: Commit the file with message format: `feat(135): Create markdown file test-0h8m0m.md`
  - **FR-8**: Push the commit to remote feature branch `feat/135-markdown-file-creation-77dd31`
  - **FR-9**: Implement without modifying any source code in /src/sheep/ or other source directories

  ## Non-Functional Requirements

  - **NFR-1**: File size must be 400-600 bytes (typical for established pattern; measured after final encoding)
  - **NFR-2**: Implementation must not modify any files outside repository root directory
  - **NFR-3**: Implementation must not create any dependencies on /src/sheep/ source code
  - **NFR-4**: Implementation execution time must be < 1 minute (simple file I/O operation)
  - **NFR-5**: Implementation must follow the exact pattern established by 134+ existing test-*.md files
  - **NFR-6**: Git commit message must follow conventional commit format (feat/fix/docs/etc)
  - **NFR-7**: No modifications to application configuration, testing, or build systems
  - **NFR-8**: File validation must be automated to verify size, encoding, line endings, and markdown structure compliance

  ## Product Decisions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Include programmatic validation of file compliance? | Full validation (size, encoding, line endings, structure) | Automated QA ensures consistency with detailed spec criteria; prevents human error; lightweight to implement |
  | 2 | Topic scope for prose content? | Freely chosen (any topic) | Matches user requirement ("about anything"); 134+ test files prove varied topics work; maximizes implementation flexibility |
  | 3 | Prose content approach? | Manually written meaningful text | Ensures quality and readability matching existing 134+ files; minimal effort required (2-3 sentences) |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 134+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/135-markdown-file-creation-77dd31/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **.env.example**: Environment configuration template
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile & docker-compose.yml**: Container orchestration for deployment

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature pattern
  and do not form part of the application source code. They demonstrate the platform's ability to perform
  automated file creation operations.

  ### Architecture Patterns

  **Established File Creation Pattern** (134+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)
  - Topics are varied and freely chosen (no constraints, aligned with "about anything" user query)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/135-markdown-file-creation-77dd31`
  - Create/modify files in working directory
  - Stage with `git add test-0h8m0m.md`
  - Commit with conventional commit format: `feat(135): Create markdown file test-0h8m0m.md`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 063-134):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Can be implemented in ~10-15 minutes using established patterns

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-0h8m0m.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-0h8m0m.md) to existing collection of 134+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-134; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/135-markdown-file-creation-77dd31` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 134+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 134+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (063-134) demonstrate efficient implementation of identical features in 10-15 minutes
