# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows a minimal, isolated implementation pattern proven across 134+ existing
  test files in the Sheep automated implementation platform:

  **Architecture Pattern:**
  - **Isolation:** Feature affects only repository root directory; zero dependencies on /src/sheep/ or other subsystems
  - **Simplicity:** Single-file creation with straightforward I/O operations (no loops, no external APIs)
  - **Validation:** Programmatic verification ensures specification compliance (size, encoding, line endings, markdown structure)
  - **Git Workflow:** Standard Sheep feature workflow (add → commit → push) using subprocess for safety and portability

  **Integration with Existing Codebase:**
  - No modifications to source code in /src/sheep/
  - No modifications to tests, configuration, or build systems
  - No dependencies on application source code
  - Feature branch `feat/135-markdown-file-creation-77dd31` pre-created and ready
  - Implementation creates file in working directory, validates, then commits to git

  ## Key Design Decisions

  ### 1. File I/O Library: pathlib (Python Standard Library)

  **Chosen:** `pathlib.Path` for file creation

  **Alternatives Considered:**
  - os module — more verbose, lower-level, less Pythonic
  - Third-party libraries (pathspec, pyfilesystem2) — unnecessary complexity for single file operation

  **Rationale:**
  - pathlib is the modern, recommended approach for Python 3.11+ file operations
  - Provides clean API: `Path.write_text()` vs os.open/write
  - Part of Python standard library — zero external dependencies
  - Project targets Python 3.11+; pathlib fully supported

  **Implementation:**
  ```python
  Path("test-0h8m0m.md").write_text(
    content,
    encoding='utf-8',
    newline='\n'  # Forces LF across all platforms
  )
  ```

  ### 2. Encoding and Line Endings: UTF-8 + LF (Explicit)

  **Chosen:** UTF-8 without BOM, LF line endings with explicit parameters

  **Alternatives Considered:**
  - Default encoding (platform-dependent) — fails on Windows (UTF-16, cp1252 defaults)
  - CRLF line endings — violates spec, breaks 134+ existing test files pattern

  **Rationale:**
  - Specification explicitly requires UTF-8 (no BOM) and LF line endings
  - Windows defaults differ from specification without explicit encoding
  - newline parameter forces LF across all platforms (Windows, Linux, macOS)
  - Critical for cross-platform development and git consistency
  - Matches all 134+ existing test files in repository

  ### 3. Content Validation: Full Programmatic Validation

  **Chosen:** Comprehensive validation of all specification criteria

  **Alternatives Considered:**
  - No validation — relies on manual code review, risks non-compliance
  - Minimal validation (file exists only) — misses encoding, size, structure issues

  **Rationale:**
  - Specification defines measurable criteria (size, encoding, structure)
  - Programmatic validation enables automated testing and CI/CD
  - Lightweight checks (file size, regex matching) with high reliability benefit
  - Aligns with automated implementation systems where QA is built-in

  **Validation Checks:**
  - File exists at correct path
  - File size is 400-600 bytes
  - Content is readable as UTF-8
  - First line is markdown H1 (starts with "# ")
  - Contains exactly 2-3 sentences after heading
  - Line endings are LF only (no \r)

  ### 4. Git Operations: subprocess (Safe CLI Execution)

  **Chosen:** `subprocess.run()` with explicit argument lists

  **Alternatives Considered:**
  - GitPython library — available as project dependency but adds abstraction overhead
  - shell=True with subprocess — introduces command injection risk

  **Rationale:**
  - subprocess is safe (explicit arguments prevent shell injection)
  - Portable (Windows, Linux, macOS)
  - Part of Python standard library
  - Simple for straightforward git operations (add, commit, push)
  - Alternative (GitPython) adds overhead for minimal use case

  **Implementation:**
  ```python
  subprocess.run(["git", "add", "test-0h8m0m.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(135): Create markdown file test-0h8m0m.md"], check=True)
  subprocess.run(["git", "push", "origin", "feat/135-markdown-file-creation-77dd31"], check=True)
  ```

  ### 5. Content Generation: Manually Written Prose

  **Chosen:** Write custom 2-3 sentences of meaningful prose

  **Alternatives Considered:**
  - Programmatically generated from templates — adds complexity, may lack naturalness
  - Random selection from pre-written pool — infrastructure overhead

  **Rationale:**
  - User request allows "about anything" — maximum flexibility
  - Manual prose ensures quality and readability matching 134+ existing files
  - Minimal effort (2-3 sentences) produces professional results
  - Human-written content demonstrates higher platform capability

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 must come first:** File creation and validation
  - File must exist and be valid before git operations
  - Early validation detects issues (encoding, structure) before git tracking
  - Prevents git pollution with non-compliant files
  - Ensures specification compliance

  **Phase 2 depends on Phase 1:** Git integration and verification
  - Only executes git operations after file validation passes
  - Confirms file is production-ready before version control
  - Follows standard Sheep feature workflow (create → validate → commit → push)

  ### Why This Approach Works

  1. **Proven Pattern:** 134+ identical features completed successfully
  2. **Minimal Complexity:** Single file, straightforward I/O, no architectural decisions
  3. **Built-in QA:** Programmatic validation prevents defects
  4. **Safe Operations:** subprocess with explicit arguments avoids injection risks
  5. **Portable:** Standard library only (pathlib, subprocess, re)
  6. **Fast:** 10-15 minute implementation time

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | File line endings are CRLF instead of LF | Medium | Explicit newline='\n' parameter in pathlib.write_text() |
  | UTF-8 encoding fails on Windows | Low | Explicit encoding='utf-8' parameter; pathlib handles correctly |
  | Prose doesn't meet sentence count requirement | Low | Validation counts sentences via regex; test verifies 2-3 requirement |
  | Git operations fail (missing config, permissions) | Low | subprocess.run() with check=True raises exception; explicit error handling |
  | File not created at correct path | Low | Validation checks file exists before proceeding; hardcoded path "test-0h8m0m.md" |
  | Git concurrent operations cause conflicts | Low | Feature branch isolated; single developer per branch |
  | File size validation fails due to newlines | Low | Validation measures size after encoding; accounts for line ending variations |

  ## Success Criteria

  Implementation will verify all specification success criteria programmatically:
  ✅ File `test-0h8m0m.md` exists at repository root
  ✅ File contains H1 markdown heading followed by 2-3 prose sentences
  ✅ File is encoded as UTF-8 without BOM
  ✅ File uses LF (Unix) line endings
  ✅ File size is between 400-600 bytes
  ✅ File is staged and committed with conventional message
  ✅ Commit is pushed to feature branch `feat/135-markdown-file-creation-77dd31`
  ✅ No modifications to source code, configuration, or existing files
