name: add-unit-test
summary: >
  1 task in 1 phase. Create tests/test_git_tools.py with TestGitStatusTool
  covering the three reachable branches of GitStatusTool._run().

relatedFeatures: []
technologies:
  - Python 3.11+
  - pytest 8+
  - unittest.mock (stdlib)
  - tempfile (stdlib)
relatedLinks: []

tasks:
  - id: task-1
    phaseId: phase-1
    title: Create tests/test_git_tools.py with TestGitStatusTool
    description: >
      Write the new test file containing TestGitStatusTool with three test
      methods. The file follows the code style of test_tools.py: plain pytest
      class (no unittest.TestCase), tempfile.TemporaryDirectory for on-disk
      paths, and unittest.mock.patch targeting subprocess.run at the module
      boundary. No production code or configuration is modified.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - tests/test_git_tools.py exists and is importable
      - TestGitStatusTool class present with exactly 3 test methods
      - test_path_not_found passes without any subprocess mock (early return path)
      - test_clean_working_tree passes with subprocess.run mocked to return empty stdout
      - test_dirty_working_tree passes with subprocess.run mocked to return non-empty stdout
      - pytest tests/test_git_tools.py exits 0 with all 3 tests passing
      - pytest (full suite) exits 0 with no regressions
      - No real git subprocess is invoked during the test run
      - ruff check passes on the new file (isort import ordering, style)
      - No changes to pyproject.toml, conftest.py, or any source file
    tdd:
      red:
        - Create tests/test_git_tools.py with the import block and an empty
          TestGitStatusTool class body (pass). Run pytest tests/test_git_tools.py
          and confirm collection succeeds but zero tests are found.
        - Add stub test methods (test_path_not_found, test_clean_working_tree,
          test_dirty_working_tree) that each call assert False. Run pytest and
          confirm all three fail (RED).
      green:
        - Implement test_path_not_found — instantiate GitStatusTool, call
          _run() with a guaranteed-nonexistent path (e.g. "/nonexistent/repo"),
          assert "Error" in result and "does not exist" in result.
          No mock needed; path check fires before _run_git is called.
        - Implement test_clean_working_tree — use tempfile.TemporaryDirectory
          to get an existing path, patch sheep.tools.git_tools.subprocess.run
          with a MagicMock whose .stdout is "", call _run(), assert
          "Working tree is clean" in result.
        - Implement test_dirty_working_tree — same tempdir pattern, patch
          subprocess.run so .stdout is "M  README.md\n", call _run(), assert
          "M  README.md" in result.
        - Run pytest tests/test_git_tools.py and confirm all three pass (GREEN).
      refactor:
        - Run the full test suite (pytest) and confirm no regressions.
        - Run ruff check tests/test_git_tools.py and fix any import ordering
          or style issues.
        - Verify docstrings are present on the class and each method.
        - Confirm no type annotations exist on test function signatures.
    estimatedEffort: 30min

totalEstimate: 30min
openQuestions: []

content: |
  ## Summary

  A single task creates tests/test_git_tools.py. The TDD cycle starts by
  stubbing the class with failing assertions to establish the RED baseline,
  then fills in each of the three test methods to reach GREEN, and finishes
  with a full-suite run and ruff check as the REFACTOR/verify step.

  No prerequisite setup tasks exist — all tooling (pytest, unittest.mock,
  tempfile) is already configured. The task is strictly additive: one file,
  one class, three methods.
