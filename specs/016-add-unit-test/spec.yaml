name: add-unit-test
number: 16
branch: feat/016-add-unit-test
oneLiner: Add a single new unit test to improve coverage of an untested module
summary: >
  This feature adds one new unit test to the existing pytest test suite. The
  codebase already has tests for config, file tools, and generated content
  files, but several modules (git_tools, agents, flows, observability) have zero
  test coverage. The task is to write one focused, passing unit test targeting a
  currently uncovered area — specifically GitStatusTool from git_tools.py, using
  mocked subprocess output to avoid real git dependency.
phase: Requirements
sizeEstimate: S
relatedFeatures: []
technologies:
  - Python 3.11+
  - pytest
  - pytest-asyncio
  - unittest.mock
  - pathlib
  - subprocess (mocked)
relatedLinks: []
openQuestions:
  - question: Which module should the new unit test target?
    resolved: true
    options:
      - option: git_tools.py (GitStatusTool)
        description: >
          Test GitStatusTool._run() using unittest.mock.patch to mock
          subprocess.run. This covers the most complex untested module, follows
          the existing BaseTool pattern already established in test_tools.py,
          and requires no external dependencies. Mocking subprocess output makes
          tests fully deterministic.
        selected: true
      - option: observability/logging.py (get_logger)
        description: >
          Test get_logger() to verify it returns a structlog BoundLogger
          instance. Simpler to test (pure function, no I/O), but lower value
          since it just wraps structlog with no project-specific logic. Less
          representative of the patterns needed for future coverage expansion.
        selected: false
    selectionRationale: >
      GitStatusTool is the highest-value target: it has real business logic
      (path existence checks, clean-tree detection, error formatting), follows
      the BaseTool pattern already tested in test_tools.py, and demonstrates the
      subprocess-mocking pattern needed to eventually cover all git tools.
    answer: git_tools.py (GitStatusTool)
  - question: Should the test live in an existing file or a new test file?
    resolved: true
    options:
      - option: 'New file: tests/test_git_tools.py'
        description: >
          Creates a dedicated test module for git_tools, matching the project's
          one-module-one-test-file convention (test_tools.py for file_tools.py,
          test_config.py for config). Keeps git tool tests isolated and easy to
          extend. Preferred for maintainability.
        selected: true
      - option: Add to existing tests/test_tools.py
        description: >
          Appends a new class to the existing test_tools.py. Avoids creating a
          new file but conflates file tools and git tools in one module,
          breaking the 1:1 convention. Makes future expansion harder to
          discover.
        selected: false
    selectionRationale: >
      A dedicated tests/test_git_tools.py matches the project's established
      convention (one test file per source module) and makes it obvious where to
      add future git tool tests. It also keeps test_tools.py focused on file
      tools.
    answer: 'New file: tests/test_git_tools.py'
  - question: How many test cases should the single unit test cover?
    resolved: true
    options:
      - option: One focused test method
        description: >
          Write exactly one test function testing a single behaviour (e.g.
          "clean working tree returns clean message"). Strictly satisfies the
          spec ("one unit test"), fastest to implement, lowest risk of scope
          creep.
        selected: false
      - option: One test class with 2-3 methods
        description: >
          Write a TestGitStatusTool class with 2-3 test methods covering the
          main branches: path-not-found error, clean tree, and changes present.
          Same file, same effort level (S), but far more useful coverage and a
          better pattern for contributors to follow. Still unambiguously "one
          unit test class" per the spec intent.
        selected: true
    selectionRationale: >
      A class with 2-3 methods covering the key code paths (missing path, clean
      tree, dirty tree) is still S-sized work and provides substantially more
      value than a single assertion. The spec says "one unit test" in the sense
      of one logical test addition, not literally one assert. This approach also
      demonstrates the mocking pattern completely, making it easy for
      contributors to add more tests.
    answer: One test class with 2-3 methods
content: >
  ## Problem Statement


  The project has a growing test suite under `tests/` but coverage is
  incomplete.

  Modules such as `sheep/tools/git_tools.py`, `sheep/agents/`, `sheep/flows/`,
  and

  `sheep/observability/` have zero test coverage. Adding a focused unit test for

  `GitStatusTool` improves the baseline, demonstrates the subprocess-mocking

  pattern, and establishes a model for future git-tool coverage expansion.


  ## Success Criteria


  - [ ] A new file `tests/test_git_tools.py` exists in the repository

  - [ ] The file contains a `TestGitStatusTool` class with at least 2 test
  methods

  - [ ] All new tests pass when running `pytest tests/test_git_tools.py`

  - [ ] All pre-existing tests continue to pass (`pytest` exits 0 with no
  regressions)

  - [ ] No real git subprocess is invoked during the tests (subprocess.run is
  mocked)

  - [ ] No new production code is added or modified

  - [ ] No new dependencies are added to `pyproject.toml`


  ## Functional Requirements


  - **FR-1**: A new test file `tests/test_git_tools.py` must be created
  containing
    a `TestGitStatusTool` class that tests `sheep.tools.git_tools.GitStatusTool`.
  - **FR-2**: The test class must include a test verifying that
  `GitStatusTool._run()`
    returns an error string when given a path that does not exist.
  - **FR-3**: The test class must include a test verifying that
  `GitStatusTool._run()`
    returns "Working tree is clean" (or equivalent) when `git status --porcelain`
    produces empty output.
  - **FR-4**: The test class must include a test verifying that
  `GitStatusTool._run()`
    returns the raw porcelain status output when git reports changes.
  - **FR-5**: All subprocess calls must be intercepted via `unittest.mock.patch`
    targeting `sheep.tools.git_tools.subprocess.run`, so tests are fully
    deterministic and require no git installation at test time.
  - **FR-6**: Tests must use `tempfile.TemporaryDirectory` (or `tmp_path`
  fixture)
    for any path that must exist on disk, following the pattern in `test_tools.py`.

  ## Non-Functional Requirements


  - **NFR-1**: Tests must complete in under 1 second total — no real I/O or
  network.

  - **NFR-2**: The test file must be discoverable by pytest with zero
  configuration
    changes (file named `test_*.py`, classes named `Test*`, methods named `test_*`).
  - **NFR-3**: The test file must follow the same code style as existing test
  files:
    no type annotations on test functions, docstrings on each test method, and
    imports grouped as stdlib → third-party → project.
  - **NFR-4**: The mock setup must be minimal — patch only `subprocess.run`, not
    internal helpers — to avoid coupling tests to implementation details.
  - **NFR-5**: The new test must not require any changes to `pyproject.toml`,
    `conftest.py`, or any source file.

  ## Product Questions & AI Recommendations


  | # | Question | AI Recommendation | Rationale |

  | - | -------- | ----------------- | --------- |

  | 1 | Which module to target? | git_tools.py (GitStatusTool) | Highest-value:
  real branching logic, follows BaseTool pattern, shows subprocess-mock
  technique |

  | 2 | New file or append to existing? | New file: tests/test_git_tools.py |
  Matches 1:1 module-to-test-file convention; keeps test_tools.py focused |

  | 3 | One method or a small class? | One test class with 2-3 methods | Covers
  all code branches, still S-sized, better pattern for contributors |


  ## Affected Areas


  | Area | Impact | Reasoning |

  | ---- | ------ | --------- |

  | `tests/` | High | New file `test_git_tools.py` added here |

  | `src/sheep/tools/git_tools.py` | Read-only | Target module; no changes to
  source code |

  | `src/sheep/observability/logging.py` | None | Not targeted; `get_logger`
  import pulled transitively but not tested here |

  | `pyproject.toml` | None | No changes needed; pytest config already correct |


  ## Dependencies


  - `pytest>=8.0.0` — already a dev dependency

  - `pytest-asyncio>=0.24.0` — already a dev dependency (asyncio_mode = auto)

  - `unittest.mock` — stdlib, no installation needed

  - `tempfile` — stdlib, no installation needed

  - `sheep.tools.git_tools` must be importable from the test environment (it is,
    via the `src/` layout already configured in `pyproject.toml`)

  ## Size Estimate


  **S** — One new test file with one test class and 2-3 test methods. All

  infrastructure (pytest, mocking, tempfile isolation) is already in place.

  No source code changes. Estimated effort: under 1 hour.
