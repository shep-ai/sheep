content: |
  ## Architecture Overview

  Feature 226 is a **test artifact creation** feature, not an application feature.
  It creates a markdown file that serves as validation of the automated implementation system's
  ability to execute file I/O and git operations correctly.

  The feature fits the existing codebase as follows:

  - **No integration with application code** — The file lives at the repository root alongside
    90+ identical test files (test-*.md); it does not integrate with /src/sheep/ or any application logic
  - **Established pattern** — Features 069-225 demonstrate this identical pattern: create markdown file,
    stage in git, commit with conventional message, push to feature branch
  - **Isolated scope** — Changes are completely isolated to repository root; no source code,
    tests, configuration, or dependencies are affected
  - **Deterministic workflow** — Implementation is mechanical and requires no architectural decisions;
    pattern is proven by 90+ precedents

  The file follows the structure established across all existing test files:
  ```
  # Heading\n
  \n
  <2-3 sentences of prose>\n
  ```

  This structure ensures:
  - Valid CommonMark markdown syntax
  - Typical file size of 400-600 bytes
  - UTF-8 encoding without BOM
  - Unix LF line endings

  ## Key Design Decisions

  ### 1. File I/O Approach: pathlib.Path

  **Decision:** Use `pathlib.Path.write_text(content, encoding="utf-8")` for file creation.

  **Rationale:**
  - **Explicitly required by NFR-5:** Specification mandates "Implementation must use Python
    `pathlib.Path` for file I/O operations"
  - **Modern Python standard:** pathlib is the recommended approach since Python 3.4+
  - **Ergonomic API:** Single call handles both file creation and UTF-8 encoding
  - **No external dependencies:** pathlib is built-in to Python 3.11+ standard library
  - **Proven pattern:** All 90+ existing test files use pathlib or equivalent approach

  **Rejected alternatives:**
  - `open()` builtin: Functional but less ergonomic; pathlib is the modern standard
  - `os.path`: Older API; pathlib is preferred in modern Python
  - External libraries: Violates NFR-9 (no new dependencies)

  ### 2. Git Operations: subprocess.run()

  **Decision:** Use `subprocess.run()` with native git commands for add/commit/push operations.

  **Rationale:**
  - **Simplicity:** Straightforward sequential operations (add → commit → push); subprocess is simpler
    than abstraction layers
  - **Safety:** Using list arguments (not shell strings) prevents shell injection vulnerabilities
  - **Transparency:** Direct git commands are easy to understand and debug
  - **Standard library:** subprocess is built-in; no external dependencies
  - **Proven pattern:** Similar features (225, 224, 223) use this approach

  **Rejected alternatives:**
  - GitPython library: Adds abstraction layer; subprocess is simpler for sequential operations
  - `os.system()`: Less safe (shell injection risks); subprocess.run() is more secure
  - Custom shell scripts: Unnecessary; git operations are simple enough for direct calls

  ### 3. Encoding and Line Endings: Explicit UTF-8 and LF

  **Decision:** Use explicit `encoding="utf-8"` parameter with hardcoded `\n` characters in content.

  **Rationale:**
  - **NFR-1 requirement:** Specification mandates "UTF-8 without BOM (Byte Order Mark)"
  - **NFR-2 requirement:** Specification mandates "Unix-style LF line endings (`\n`), not Windows CRLF"
  - **Platform independence:** Explicit `\n` guarantees LF on all platforms (Windows, Linux, macOS)
  - **Deterministic behavior:** Using explicit encoding avoids platform-specific defaults
  - **Principle of explicit:** "Explicit is better than implicit" (Zen of Python)

  **Rejected alternatives:**
  - Platform-default encoding: Creates risk of CRLF on Windows; violates NFR-2
  - `os.linesep` abstraction: Unnecessarily platform-specific; violates requirement
  - Binary mode with manual encoding: Adds complexity; text mode with explicit encoding is clearer

  ### 4. Prose Content: Hardcoded String

  **Decision:** Create prose content as a hardcoded string (2-3 sentences) on a freely chosen topic.

  **Rationale:**
  - **NFR-8 permits free-form topics:** Specification states "Prose topic may be any topic chosen
    by the implementer (free-form)"
  - **Simplicity:** Direct prose authoring is simpler than templates, generation, or APIs
  - **No dependencies:** Avoids external APIs, LLMs, or data sources
  - **Established pattern:** All 90+ existing test files use hand-written prose with diverse topics
  - **Minimal effort:** Creating correct 2-3 sentences directly is trivial compared to over-engineering

  **Rejected alternatives:**
  - Template system: Unnecessary complexity for single-file feature
  - LLM generation: Introduces external API dependency and latency
  - Random/algorithmic generation: Over-engineered; doesn't match established pattern

  ### 5. Validation: Basic Post-Creation Checks

  **Decision:** Validate file creation with lightweight assertions (existence, size, encoding).

  **Rationale:**
  - **Failure detection:** Basic checks catch real problems (permission errors, encoding issues,
    filesystem errors)
  - **Appropriate scope:** For simple, deterministic file creation, basic validation is sufficient
  - **No over-engineering:** Full CommonMark parsing or byte-level inspection would be unnecessary
  - **Fast feedback:** Simple assertions fail fast and clearly

  **Rejected alternatives:**
  - No validation: Risky; skips helpful error detection
  - Comprehensive parsing: Over-engineered for controlled, simple content

  ### 6. Zero New Dependencies

  **Decision:** Implement entirely with Python standard library (pathlib, subprocess).

  **Rationale:**
  - **NFR-9 constraint:** Specification explicitly prohibits "new dependencies or external packages"
  - **Sufficient tools:** pathlib and subprocess are all that's needed for file I/O and git operations
  - **Maintenance burden:** Avoids adding to the project's dependency graph
  - **Portability:** Standard library modules are available on all Python 3.11+ installations

  **Rejected alternatives:**
  - Markdown validation libraries: Violates NFR-9; unnecessary for simple format
  - Specialized file I/O: Standard pathlib is sufficient
  - External tools: Unnecessary when standard library solves the problem

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: File Creation and Validation** comes first because:
  - It produces the primary artifact (test-ttapg5.md)
  - Validation ensures all requirements are met before committing to git
  - Failure detection happens early, avoiding incomplete commits
  - Self-contained phase with no external dependencies

  **Phase 2: Git Integration** comes after because:
  - File must exist and be validated before staging
  - Git operations are mechanical and follow once file is ready
  - No complexity; straightforward add → commit → push sequence

  ### Implementation Approach

  1. **Create content string** with structure: `# Heading\n\n<sentence 1>. <sentence 2>. <sentence 3>.\n`
  2. **Write file** using `Path("test-ttapg5.md").write_text(content, encoding="utf-8")`
  3. **Validate file** with assertions: existence, size (400-600 bytes), UTF-8 readability
  4. **Stage in git** using `subprocess.run(["git", "add", "test-ttapg5.md"])`
  5. **Commit** using `subprocess.run(["git", "commit", "-m", "feat(226): ..."])`
  6. **Push** using `subprocess.run(["git", "push", "origin", "feat/226-..."])`

  This approach mirrors the pattern across 90+ existing identical features (069-225).

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Encoding errors (BOM or CRLF) | Low | Medium | Explicit encoding="utf-8" and hardcoded \n; validation checks readability |
  | File permission errors | Very Low | Medium | Validation assertions fail fast; file inherits repo permissions |
  | Git operation failure (credential issues) | Low | High | Pre-existing git config assumed; error output visible in subprocess calls |
  | Incorrect file structure | Very Low | Low | Simple, deterministic content; validation checks structure |
  | Merge conflicts on push | Very Low | Low | Feature branch pre-created; standard git workflow handles conflicts |

  **Overall risk assessment:** Low. Feature is simple, well-specified, and has 90+ proven precedents.
  Primary risk mitigation is validation of file structure and encoding before git operations.

