# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-23

  ## Technology Decisions

  ### 1. Content Generation Strategy

  **Chosen:** Use existing `generate_markdown_content()` helper function from `src/sheep/content_generators.py`

  **Rejected:**
  - Implement custom LLM content generation inline — duplicates well-tested code
  - Use hard-coded prose templates — reduces flexibility, doesn't follow established pattern

  **Rationale:**
  The helper function encapsulates all content generation concerns:
  - Calls `get_reasoning_llm()` for coherent prose generation (temperature=0.2 for consistency)
  - Uses pre-engineered MARKDOWN_GENERATION_PROMPT
  - Validates format (H1 heading, 2-3 sentences, appropriate length)
  - Ensures trailing newline (Unix convention)
  - Comprehensive error handling and logging

  This maintains consistency with 180+ preceding features and eliminates the need to re-engineer the prompt
  or LLM interaction. The function handles edge cases that custom implementation might miss.

  ### 2. File Writing and Encoding

  **Chosen:** Use `write_markdown_file()` helper ensuring UTF-8 encoding without BOM and Unix line endings

  **Rejected:**
  - Direct pathlib.Path operations — loses validation and error handling
  - Manual open() calls — duplicates validation logic

  **Rationale:**
  The helper provides:
  - **Filename validation:** Checks for path traversal attacks (rejects "/" and "\\" in filename)
  - **Repository root resolution:** Uses Path.cwd() correctly
  - **UTF-8 encoding:** Writes with encoding='utf-8' (produces LF on Linux)
  - **Verification:** Checks file existence and validates non-zero file size
  - **Comprehensive logging:** Provides debugging information and success confirmation

  NFR-5 and NFR-6 requirements (UTF-8, LF line endings) are met through Python's default text mode behavior
  on Linux systems and verified by the validation function.

  ### 3. File Validation

  **Chosen:** Use `validate_markdown_file()` for comprehensive validation before commit

  **Rejected:**
  - Skip validation — violates specification requirements
  - Implement custom checks — misses edge cases and duplicates logic

  **Rationale:**
  The helper validates:
  - **UTF-8 encoding:** Binary read and decode verification
  - **BOM detection:** Rejects if UTF-8 BOM is present
  - **Line ending validation:** Rejects files with CRLF (should use LF only)
  - **Markdown format:** Verifies H1 heading on first line, blank line separator
  - **Prose content:** Validates 2-3 sentences (counts periods)
  - **Trailing newline:** Ensures Unix convention is followed

  This comprehensive approach catches issues before commit and ensures spec compliance.

  ### 4. Git Staging and Committing

  **Chosen:** Use `commit_markdown_file()` helper with custom message parameter

  **Rejected:**
  - Call GitCommitTool directly — less maintainable, doesn't abstract commit logic
  - Use subprocess for git commands — inconsistent with tool-based approach

  **Rationale:**
  The helper:
  - Accepts custom_message parameter (feature_180 demonstrates this)
  - Uses GitCommitTool internally with add_all=True
  - Provides proper error handling and logging
  - Extracts filename for commit message clarity
  - Returns commit result for caller

  Passing custom_message="feat(184): Create markdown file test-twysls.md with prose content" ensures the correct
  feature number is used in the conventional commit message.

  ### 5. Git Push and Upstream Tracking

  **Chosen:** Use `push_markdown_file()` helper with upstream tracking enabled

  **Rejected:**
  - Call GitPushTool directly — loses abstraction and logging
  - Skip upstream tracking — makes branch tracking explicit in follow-up work

  **Rationale:**
  The helper:
  - Uses GitPushTool with set_upstream=True (git push -u origin)
  - Detects current branch automatically
  - Provides comprehensive error handling
  - Enables future pulls without explicit branch specification

  Upstream tracking is important for CI/CD workflows and follows established pattern from features 001-183.

  ### 6. Feature Module Organization

  **Chosen:** Create `src/sheep/features/feature_184_markdown_file_creation.py` with feature_180 as template

  **Rejected:**
  - Implement in CLI entry point — loses modularity and testability
  - Create standalone script — inconsistent with established architecture

  **Rationale:**
  Feature_180 establishes the pattern:
  - Module metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
  - Main orchestration function: `create_feature_184_markdown_file(repo_path=None)`
  - Optional if __name__ block for standalone execution
  - Returns dictionary with filepath, content, commit_message, push_result
  - Proper error handling and logging throughout

  This structure is consistent with all 180 preceding features and enables:
  - Independent testing
  - Import for programmatic use
  - Script execution for direct invocation
  - Clear separation of concerns

  ### 7. Commit Message Format and Feature Number

  **Chosen:** Use exact conventional commit format: `feat(184): Create markdown file test-twysls.md with prose content`

  **Rejected:**
  - Use default from `commit_markdown_file()` helper — helper defaults to feat(145)
  - Auto-generate based on LLM — spec explicitly specifies exact format

  **Rationale:**
  Specification requirement FR-8 mandates: "Commit message follows conventional format: `feat(###): Create markdown file <filename> with prose content`"

  Implementation:
  1. Define COMMIT_MESSAGE constant in feature module: "feat(184): Create markdown file test-twysls.md with prose content"
  2. Pass to commit_markdown_file() as custom_message parameter
  3. This overrides the helper's default and ensures correct feature number

  Feature_180 demonstrates this exact pattern with custom_message=COMMIT_MESSAGE.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | Python pathlib | Cross-platform file operations | Use (via helpers) | Standard library, proven for file path handling, encapsulated in write_markdown_file() |
  | CrewAI LLM | LLM abstraction and prompting | Use (existing) | Already used in content_generators.py, handles multiple providers, temperature control for consistency |
  | Git (subprocess) | Version control operations | Use (via tools) | Encapsulated in GitCommitTool and GitPushTool, proper error handling and logging |
  | UTF-8 encoding | Text file encoding | Use (Python default) | Python's default encoding mode, no BOM added, validates via validate_markdown_file() |
  | Markdown (CommonMark) | File format | Use (simple subset) | Only requires H1 heading and plain text, no complex markdown features needed |
  | Python logging | Observability | Use (via get_logger) | Consistent with codebase, encapsulated in helpers |

  **No new dependencies required.** All functionality uses existing libraries and helpers.

  ## Security Considerations

  ### Path Traversal Prevention
  The `write_markdown_file()` helper validates filenames:
  - Rejects filenames containing "/" or "\\" (directory separators)
  - Rejects filenames starting with "." (hidden files, relative paths)
  - Filename must be exactly "test-twysls.md" (alphanumeric + dash + .md)

  ### Content Injection
  - LLM-generated content is validated before commit
  - Markdown format is simple (no code blocks, no embedded HTML, no executable content)
  - Content is plain prose with H1 heading, safe for version control

  ### Encoding Security
  - UTF-8 encoding without BOM prevents encoding-based attacks
  - Validation checks for and rejects UTF-8 BOM
  - File is readable by all tools (standard UTF-8 support)
  - No special characters or encoding tricks needed

  ### Line Ending Safety
  - Unix LF line endings prevent CRLF injection attacks
  - Validation checks for and rejects CRLF
  - Consistent line endings prevent cross-platform issues

  ### Git Security
  - Standard git operations (add, commit, push) use subprocess with proper escaping
  - Conventional commit message format prevents shell injection
  - Feature number and filename are hardcoded constants, not user input
  - All operations execute in controlled git repository context

  ## Performance Implications

  ### LLM Call (Primary Bottleneck)
  - `generate_markdown_content()` makes one LLM API call
  - Estimated latency: 1-5 seconds depending on API responsiveness
  - Temperature=0.2 (consistent output) vs higher temperatures
  - No retries or fallbacks — relies on LLM reliability
  - Can be optimized later with caching if repeated

  ### File I/O Operations
  - `write_markdown_file()`: Single write operation ~350-550 bytes
  - File size is tiny (300-600 bytes) — negligible I/O cost
  - Validation: Binary read + decode — still sub-millisecond for this size

  ### Git Operations
  - `git add -A`: Scans repository (cached, fast for small repos)
  - `git commit -m`: Single commit operation
  - `git push -u`: Network-dependent (typically 1-3 seconds)
  - Sequential operations (cannot parallelize) due to dependencies

  ### Overall Workflow
  - Total estimated time: 5-15 seconds (LLM + git push dominates)
  - No parallelization opportunities (each step depends on prior)
  - No caching or optimization needed for single-file creation

  ## Architecture Notes

  ### Integration with Existing Codebase

  **Pattern Consistency:**
  This feature follows the exact same pattern as features 001-183:
  - Located in `src/sheep/features/feature_N_markdown_file_creation.py`
  - Uses helpers from `src/sheep/content_generators.py`
  - Orchestrates workflow: generate → write → validate → commit → push
  - Returns results dictionary for caller use

  **No New Dependencies:**
  - Uses only Python standard library (pathlib)
  - Uses existing CrewAI integration via get_reasoning_llm()
  - Uses existing git tools (GitCommitTool, GitPushTool)
  - No new package dependencies required
  - No architectural changes needed

  **No Code Modifications:**
  - Does not modify src/sheep/ source code (except adding new feature module)
  - Does not modify existing helper functions
  - Does not change configuration or build system
  - Purely additive: new feature module uses existing abstractions

  ### Error Handling Strategy

  **Cascade Validation:**
  1. LLM generation validates format during response processing
  2. File writing validates filename and file creation
  3. File validation checks encoding, structure, and content
  4. Each step logs errors and raises exceptions
  5. Caller can catch and handle errors appropriately

  **No Silent Failures:**
  - All errors propagate as exceptions
  - Logging provides debugging context
  - Helpers use try/except with detailed error messages
  - Validation ensures no partial/invalid files are committed

  ### Testing Strategy

  **Unit Test Pattern (from existing tests):**
  - Mock LLM content generation
  - Mock git operations
  - Verify file creation with correct properties
  - Verify commit message format
  - Verify validation behavior

  **Integration Test Pattern:**
  - Use real LLM for content generation
  - Use real file system (temp directory)
  - Use real git operations (test repository)
  - Verify end-to-end workflow

