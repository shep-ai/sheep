# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern (features 001-183 with 180+ completed examples). This feature creates
  a single test markdown file (`test-twysls.md`) at the repository root with a title and prose content,
  demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  continuing a well-established pattern that has been successfully executed 183 times with consistent
  results and conventions.

  ## Success Criteria

  - [ ] File `test-twysls.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\\n), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-twysls.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(184): Create markdown file test-twysls.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/184-markdown-file-creation-6a6fef`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-twysls.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\\n) line endings throughout
  - **FR-7**: The file SHALL be added to git staging area using `git add test-twysls.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(184): Create markdown file test-twysls.md with prose content`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/184-markdown-file-creation-6a6fef`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or nonsensical sentences)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 001-183 for consistency
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 180+ test markdown files following pattern `test-*.md` (e.g., `test-cyktqk.md`, `test-7jjfmd.md`)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`

  **Spec Directory Structure:**
  - `specs/` contains 184 feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - This spec is located at: `specs/184-markdown-file-creation-6a6fef/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code (agents, flows, config, tools, observability)
  - `src/sheep/features/` contains individual feature implementation modules
  - `src/sheep/content_generators.py` provides reusable utilities for markdown file creation
  - `src/sheep/cli.py` contains CLI entry point

  ### Architecture Patterns

  **Test File Format (180+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-600 bytes
  - Example from existing file `test-cyktqk.md`:
    ```markdown
    # The Importance of Continuous Learning

    Continuous learning is essential for personal and professional growth in an ever-changing world.
    By embracing new knowledge and skills, we enhance our ability to adapt to challenges and seize opportunities.
    Through dedication to lifelong learning, we unlock our potential and contribute meaningfully to society.
    ```

  **Feature Implementation Pattern:**
  - Each feature has a module in `src/sheep/features/feature_NNN_markdown_file_creation.py`
  - Example: `src/sheep/features/feature_180_markdown_file_creation.py` shows the pattern
  - Functions orchestrate: generate content → write file → validate → commit → push
  - Uses helper functions from `src/sheep/content_generators.py`:
    - `generate_markdown_content()`: Generates H1 + 2-3 sentences using LLM
    - `write_markdown_file()`: Writes with UTF-8 encoding, LF line endings
    - `validate_markdown_file()`: Verifies format and encoding
    - `commit_markdown_file()`: Stages and commits with conventional message
    - `push_markdown_file()`: Pushes to remote feature branch

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-twysls.md`

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with prose content`
  - Changes are pushed to feature branch `feat/###-markdown-file-creation-<hash>`

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default)

  **Content Generation:**
  - CrewAI LLM framework calls via `get_reasoning_llm()` function
  - Generates markdown with H1 heading and 2-3 sentences of prose
  - Configured with validation to ensure format requirements met

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/184-markdown-file-creation-6a6fef`
  - GitCommitTool and GitPushTool from `src/sheep/tools/git_tools.py`

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 180+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-183; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (pathlib) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/184-markdown-file-creation-6a6fef` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Helper functions from `src/sheep/content_generators.py` (already implemented)

  **Reference/Precedent:**
  - 180+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Feature implementations 001-183 demonstrate successful execution of identical pattern
  - Feature 180 (`feature_180_markdown_file_creation.py`) provides exact template for feature structure

  **Not Required:**
  - No source code modifications beyond feature module creation
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directories (except adding feature module)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **Create feature module**: ~3-5 minutes (copy pattern from feature 180, update feature number and filename)
  - **File creation and content generation**: ~2-3 minutes (use existing helper functions to generate markdown)
  - **Validation**: ~1-2 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-3 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 180+ identical test files and implementations providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Reusable helper functions in `src/sheep/content_generators.py` handle all heavy lifting
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (181-183) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature module follows exact pattern from 183 preceding features

  ---

