content: |
  ## Architecture Overview

  Feature 184 follows the established pattern from 180+ preceding features in the Sheep automated
  implementation platform. The implementation is purely orchestrational — it coordinates existing,
  well-tested helper functions rather than introducing new abstractions or dependencies.

  ### Architectural Pattern

  **Module Location & Structure:**
  - New module: `src/sheep/features/feature_184_markdown_file_creation.py`
  - Follows identical structure to feature_180 (template reference)
  - Contains metadata constants and main orchestration function
  - Optional standalone execution via if __name__ block

  **Dependency Graph:**
  ```
  feature_184_markdown_file_creation.py
    ├─ generate_markdown_content() [src/sheep/content_generators.py]
    ├─ write_markdown_file() [src/sheep/content_generators.py]
    ├─ validate_markdown_file() [src/sheep/content_generators.py]
    ├─ commit_markdown_file() [src/sheep/content_generators.py]
    └─ push_markdown_file() [src/sheep/content_generators.py]
  ```

  All helper functions already exist and are proven through 180+ feature implementations. No new code
  is added to the codebase except the feature module itself.

  ### Integration Points

  **With Content Generators:**
  - Uses `generate_markdown_content()` to create LLM-generated markdown with H1 heading + 2-3 sentences
  - Uses `write_markdown_file()` to write with UTF-8 encoding and proper line endings
  - Uses `validate_markdown_file()` to verify format before commit
  - Uses `commit_markdown_file()` with custom message parameter for conventional commits
  - Uses `push_markdown_file()` to push with upstream tracking

  **With Git Tools:**
  - Helpers internally use GitCommitTool and GitPushTool
  - Commit message follows conventional commit format with feature number 184
  - Upstream tracking enabled via git push -u

  **With LLM Framework:**
  - Helpers use `get_reasoning_llm()` configured for prose generation
  - Temperature=0.2 for consistent output
  - Pre-engineered MARKDOWN_GENERATION_PROMPT used by helpers

  ## Key Design Decisions

  ### 1. Leverage Existing Helpers (vs. Custom Implementation)

  **Chosen:** Use existing helpers from `src/sheep/content_generators.py`

  **Rationale:**
  - Helpers are production-tested through 180+ feature implementations
  - Eliminates code duplication and maintenance burden
  - Ensures consistency with established pattern
  - Comprehensive error handling and validation already encapsulated
  - Reduces implementation to pure orchestration

  **Impact:** Feature module is lightweight orchestration layer (~60-80 lines of code)

  ### 2. Feature Module Structure (vs. Inline Implementation or CLI Entry)

  **Chosen:** Create dedicated `src/sheep/features/feature_184_markdown_file_creation.py` module

  **Rationale:**
  - Follows established pattern from all 180+ preceding features
  - Provides modularity, testability, and discoverability
  - Enables both import-based and CLI-based execution
  - Clear separation of concerns within codebase
  - Supports future introspection and tooling

  **Impact:** Feature is discoverable and reusable; not bound to any single execution context

  ### 3. Commit Message with Custom Parameter (vs. Helper Default)

  **Chosen:** Define COMMIT_MESSAGE constant and pass to `commit_markdown_file()` with custom_message parameter

  **Rationale:**
  - Specification requirement FR-8 mandates exact message format
  - Helper defaults to feat(145), incorrect for feature 184
  - Feature 180 demonstrates this pattern with custom_message parameter
  - Ensures conventional commit history accuracy with correct feature number

  **Impact:** Commit message explicitly includes feature number 184 as required

  ### 4. File Validation Before Commit (vs. Trust and Verify)

  **Chosen:** Call `validate_markdown_file()` before commit

  **Rationale:**
  - Specification includes validation requirement
  - Validates encoding (UTF-8, no BOM), line endings (LF only), format (H1 + blank line + prose)
  - Catches LLM generation edge cases before committed to repository
  - Two-layer approach: correct generation + verification

  **Impact:** High confidence that committed file meets all specification requirements

  ### 5. Line Ending Handling (vs. Explicit newline Parameter)

  **Chosen:** Rely on Python's default text mode (encoding='utf-8') on Linux systems

  **Rationale:**
  - Linux systems produce Unix LF line endings by default
  - write_markdown_file() helper uses this approach
  - validate_markdown_file() explicitly checks for and rejects CRLF
  - No need for explicit newline='' parameter (would disable universal newlines)

  **Impact:** Simple, clean implementation without platform-specific complexity

  ## Implementation Strategy

  ### Phase Sequencing Rationale

  **Phase 1 → Phase 2 → Phase 3 → Phase 4 is strictly sequential:**
  - Phase 1 establishes module foundation; Phase 2 depends on having the module structure
  - Phase 2 (content generation) must complete before Phase 3 (git workflow) can stage the file
  - Phase 3 (commit/push) depends on Phase 2 producing a valid file
  - Phase 4 (testing) verifies all prior phases work together end-to-end

  ### Core Workflow

  The implementation orchestrates five helper functions in sequence:

  ```
  1. generate_markdown_content()  → Returns (title, content) tuple
  2. write_markdown_file()         → Returns filepath
  3. validate_markdown_file()      → Raises exception if invalid (returns None if valid)
  4. commit_markdown_file()        → Returns commit result
  5. push_markdown_file()          → Returns push result
  ```

  Each step depends on the prior step's success. Errors propagate as exceptions, caught by caller.

  ### No Parallel Opportunities

  Unlike some features with independent components, this feature is strictly sequential:
  - Cannot generate content before determining file path
  - Cannot validate before writing
  - Cannot commit before validation
  - Cannot push before commit
  - Each step builds on the prior step's output

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates invalid prose format | validate_markdown_file() catches format violations; will raise exception before commit |
  | File written with wrong encoding | Python's default UTF-8 mode + validation function catches BOM or non-UTF-8 |
  | CRLF line endings committed on Windows | Feature runs on Linux; validation explicitly rejects CRLF |
  | Commit message has wrong feature number | COMMIT_MESSAGE constant is hardcoded; no dynamic generation |
  | File not pushed to remote | push_markdown_file() with set_upstream=True ensures branch tracking; error raised if push fails |
  | File not staged correctly | GitCommitTool with add_all=True ensures staging; validation occurs before commit |
  | Path traversal vulnerability in filename | write_markdown_file() validates filename (rejects "/" and "\\"); hardcoded filename "test-twysls.md" is safe |
  | Content generation API failure | CrewAI LLM errors propagate as exceptions; caller can retry or handle gracefully |
  | Repository not in correct branch | Feature assumes branch already exists (created by platform); validation confirms working directory state |
