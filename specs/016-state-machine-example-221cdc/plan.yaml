# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature is a pure documentation addition. The repo already contains a set of
  standalone state machine markdown files at the root level:

  - STATE_MACHINE.md (traffic light)
  - DOOR_LOCK_STATE_MACHINE.md
  - ELEVATOR_STATE_MACHINE.md
  - TURNSTILE_STATE_MACHINE.md
  - VENDING_MACHINE_STATE_MACHINE.md

  ORDER_LIFECYCLE_STATE_MACHINE.md follows the identical pattern and sits alongside
  these files. No source code, configuration, build system, or existing markdown
  file is touched.

  ## Key Design Decisions

  ### File Naming
  SCREAMING_SNAKE_CASE with `.md` extension, consistent with every existing peer file.
  kebab-case and PascalCase were rejected as they have no precedent in the repo.

  ### Diagram Dialect
  `stateDiagram-v2` — the current Mermaid standard (v10+), used by all existing diagrams.
  Legacy `stateDiagram` (v1) is deprecated; `flowchart LR` is the wrong diagram type.

  ### Diagram Subject
  Order lifecycle (Pending → Processing → Shipped → Delivered, with a Cancelled branch).
  Introduces a business-domain example distinct from the existing physical-device machines.
  Demonstrates both a linear happy path and a branching cancellation path.

  ### Prose Length
  One sentence above the diagram, matching TURNSTILE_STATE_MACHINE.md and peers.
  Diagram-only would be inconsistent; a full breakdown contradicts the "super fast" intent.

  ## Implementation Strategy

  Single phase, single task: write the file. No dependencies, no setup, no teardown.
  The entire implementation is the content of one ~15-line markdown file.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Invalid Mermaid syntax causes render failure | Validate stateDiagram-v2 syntax against spec before committing; use [*] pseudo-states as required |
  | File naming inconsistency | Follow SCREAMING_SNAKE_CASE exactly as confirmed by examining existing files |
  | Accidentally modifying existing files | Touch only the new file; FR-6 explicitly forbids modifications |
