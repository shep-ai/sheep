content: |
  ## Problem Statement

  The repo already contains several state machine markdown files (traffic light,
  door lock, vending machine, turnstile, elevator). A new standalone example file
  is needed — a simple, self-contained state machine diagram unrelated to any of
  those existing examples, added as quickly as possible.

  ## Success Criteria

  - [ ] A new `.md` file exists at the repo root level
  - [ ] The file is not named after any existing example (traffic light, door lock, vending machine, turnstile, elevator)
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` block with at least 3 states and at least 3 transitions
  - [ ] The diagram renders without errors in a standard Mermaid renderer
  - [ ] The file includes at least one sentence of prose description
  - [ ] No existing files are modified

  ## Functional Requirements

  - **FR-1**: A new markdown file SHALL be created at the repository root.
  - **FR-2**: The file SHALL contain a Mermaid `stateDiagram-v2` fenced code block.
  - **FR-3**: The diagram SHALL depict a subject not already covered by existing state machine files in the repo.
  - **FR-4**: The diagram SHALL include an initial state (`[*]`), at least 3 named states, at least 3 labelled transitions, and a terminal state (`[*]`).
  - **FR-5**: The file SHALL include a short prose description (minimum one sentence) explaining what the diagram represents.
  - **FR-6**: No existing source files, markdown files, or specs SHALL be modified.

  ## Non-Functional Requirements

  - **NFR-1**: The Mermaid syntax MUST be valid and renderable by standard Mermaid v10+ (stateDiagram-v2 dialect).
  - **NFR-2**: The file MUST follow the same heading and code-fence style conventions used in existing state machine markdown files.
  - **NFR-3**: File name MUST use SCREAMING_SNAKE_CASE with a `.md` extension, consistent with existing root-level markdown files.
  - **NFR-4**: Total file length SHOULD be under 40 lines to honour the "super fast / short" intent of the user request.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which state machine subject should the new example use? | Order lifecycle | Universally recognisable, demonstrates branching (Cancelled path), absent from existing examples |
  | 2 | Where should the new file be placed? | Root level | Matches convention of all existing state machine markdown files |
  | 3 | How much prose description should accompany the diagram? | One-sentence intro + diagram | Fastest delivery; consistent with existing files; honours user's "super fast" request |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | / (root) | Low | One new `.md` file added at root level |

  ## Dependencies

  None. Plain markdown file, no code changes required.

  ## Size Estimate

  **S** — Single markdown file with a short Mermaid diagram; trivial to create.
