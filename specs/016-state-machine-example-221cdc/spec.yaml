  ## Problem Statement

  The repo already contains several state machine markdown files (traffic light,
  door lock, vending machine, turnstile, elevator). A new standalone example file
  is needed — a simple, self-contained state machine diagram unrelated to any of
  those existing examples.

  ## Codebase Analysis

  ### Project Structure

  - Root-level `.md` files hold all content (STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, etc.)
  - `specs/` holds per-feature spec YAML files
  - `src/` contains Python source; `tests/` contains tests
  - No build step required for plain markdown files

  ### Architecture Patterns

  Content lives as standalone root-level markdown files. Each file is independent
  with a Mermaid `stateDiagram-v2` block and a short prose description.

  ### Relevant Technologies

  - Markdown for file format
  - Mermaid `stateDiagram-v2` syntax for diagrams (used in all existing state machine files)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | / (root) | Low | One new `.md` file added at root level |

  ## Dependencies

  None. Plain markdown file, no code changes required.

  ## Size Estimate

  **S** — Single markdown file with a short Mermaid diagram; trivial to create.
