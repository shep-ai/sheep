name: state-machine-example-221cdc
summary: >
  This feature requires only a single new markdown file at the repo root containing
  a Mermaid stateDiagram-v2 block. No libraries, build changes, or code modifications
  are needed. All decisions centre on file naming, diagram subject, and prose conventions
  consistent with existing root-level markdown files.

relatedFeatures: []

technologies:
  - Markdown
  - Mermaid stateDiagram-v2

relatedLinks:
  - https://mermaid.js.org/syntax/stateDiagram.html

decisions:
  - title: 'File Naming Convention'
    chosen: 'ORDER_LIFECYCLE_STATE_MACHINE.md (SCREAMING_SNAKE_CASE)'
    rejected:
      - 'order-lifecycle-state-machine.md (kebab-case) — inconsistent with existing files (STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md) which all use SCREAMING_SNAKE_CASE'
      - 'OrderLifecycle.md (PascalCase) — no precedent in this repo; diverges from established convention'
    rationale: >
      Every existing state machine markdown at the repo root uses SCREAMING_SNAKE_CASE
      with a .md extension. Following that pattern ensures consistency and makes the file
      immediately recognisable alongside its peers without any README update needed.

  - title: 'Mermaid Diagram Dialect'
    chosen: 'stateDiagram-v2'
    rejected:
      - 'stateDiagram (v1) — deprecated; v2 is the current standard and required by NFR-1 (Mermaid v10+)'
      - 'flowchart LR — wrong diagram type for a state machine; lacks first-class state/transition semantics'
    rationale: >
      All existing diagrams in the repo use stateDiagram-v2. It is the current Mermaid
      standard, supports [*] initial/terminal pseudo-states natively, and renders
      correctly in GitHub and all major Mermaid v10+ renderers.

  - title: 'Diagram Subject Selection'
    chosen: 'Order lifecycle (Pending → Processing → Shipped → Delivered / Cancelled)'
    rejected:
      - 'Washing machine — mechanical/physical device; repo already has three physical-device examples (vending machine, elevator, turnstile); less pedagogical variety'
      - 'Phone call — telecom-domain; narrower audience familiarity than e-commerce order lifecycle'
    rationale: >
      An order lifecycle is universally recognisable across technical and non-technical
      audiences, demonstrates a branching path (Cancelled) in addition to the happy path,
      and introduces a business-domain state machine distinct from all existing physical-
      device examples in the repo.

  - title: 'Prose Description Length'
    chosen: 'One-sentence intro above the diagram'
    rejected:
      - 'Diagram only — inconsistent with every existing file which includes at least a short description; would feel incomplete'
      - 'Full state-by-state breakdown — contradicts the user''s explicit "super fast / short" request and NFR-4 (<40 lines)'
    rationale: >
      Existing files (e.g. TURNSTILE_STATE_MACHINE.md) pair a single descriptive sentence
      with the diagram. This provides just enough context without inflating file length,
      honours the user''s speed request, and stays well within the 40-line NFR-4 budget.

openQuestions: []

content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-04

  ## Technology Decisions

  ### 1. File Naming Convention

  **Chosen:** `ORDER_LIFECYCLE_STATE_MACHINE.md` (SCREAMING_SNAKE_CASE)

  **Rejected:**
  - `order-lifecycle-state-machine.md` (kebab-case) — inconsistent with all existing root-level MD files
  - `OrderLifecycle.md` (PascalCase) — no precedent in the repo

  **Rationale:** Every existing state machine file uses SCREAMING_SNAKE_CASE. Following
  the convention makes the file immediately recognisable alongside its peers.

  ### 2. Mermaid Diagram Dialect

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — deprecated; v2 is required by NFR-1
  - `flowchart LR` — wrong type; lacks native state/transition semantics

  **Rationale:** All existing diagrams use `stateDiagram-v2`; it is the Mermaid v10+ standard.

  ### 3. Diagram Subject

  **Chosen:** Order lifecycle

  **Rejected:**
  - Washing machine — another physical device; less variety
  - Phone call — narrower audience familiarity

  **Rationale:** Universally recognisable, demonstrates branching (Cancelled path), absent
  from existing examples, and adds business-domain variety.

  ### 4. Prose Description Length

  **Chosen:** One-sentence intro

  **Rejected:**
  - Diagram only — inconsistent with existing files
  - Full breakdown — contradicts "super fast" user intent and NFR-4

  **Rationale:** Matches the pattern in TURNSTILE_STATE_MACHINE.md and peers; concise and sufficient.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State machine diagram rendering | Use | Already used by all existing state machine files; no new dependency required |

  ## Security Considerations

  None. This is a static markdown file with no executable code, user input, or network
  interaction. No authentication, authorization, or data-safety concerns apply.

  ## Performance Implications

  None. A single small markdown file has negligible impact on repo size or CI performance.

  ## Architecture Notes

  The file is a standalone documentation artifact placed at the repo root, consistent
  with all existing state machine markdown files. No source code, configuration, or
  build system is touched. The implementation is trivially isolated and carries zero
  regression risk.
