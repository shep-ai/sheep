content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files following an established pattern. This feature creates a single test markdown file
  (test-ppqzc5.md) at the repository root with a title and prose content, demonstrating
  automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 101-129, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File test-ppqzc5.md is created in the repository root directory
  - [ ] File contains exactly one level-1 markdown heading (# Title) at the start
  - [ ] Heading is followed by exactly one blank line before prose content
  - [ ] File contains exactly 2-3 complete sentences of readable prose
  - [ ] Prose content covers any topic (free-form selection)
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File size is between 400-600 bytes (consistent with 100+ test files)
  - [ ] File is staged in git (git add)
  - [ ] Commit message follows conventional commit format: "feat(130): Create markdown file test-ppqzc5.md with prose content"
  - [ ] Commit is successfully pushed to feat/130-markdown-file-create-e66f69 branch
  - [ ] File structure matches the pattern of existing test-*.md files in the repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file at the repository root named "test-ppqzc5.md"
  - **FR-2**: File content must start with exactly one level-1 heading in markdown syntax (# followed by heading text)
  - **FR-3**: Heading must be followed by a blank line before prose content begins
  - **FR-4**: File must contain exactly 2-3 complete sentences of prose text on any chosen topic
  - **FR-5**: Stage the created file in git using `git add`
  - **FR-6**: Commit the file with message: "feat(130): Create markdown file test-ppqzc5.md with prose content"
  - **FR-7**: Push the commit to the feature branch (feat/130-markdown-file-create-e66f69)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be LF (Unix style 0x0A), not CRLF (Windows style 0x0D 0x0A)
  - **NFR-3**: File size must be between 400-600 bytes to maintain consistency with 100+ existing test files
  - **NFR-4**: Prose content must be coherent, readable, and use complete grammatical sentences (no fragments, gibberish, or truncated text)
  - **NFR-5**: Implementation must follow the established pattern from features 101-129 for consistency and predictability
  - **NFR-6**: Commit must succeed without errors and be verifiable via `git log`
  - **NFR-7**: Push must complete successfully to the remote repository on the feature branch

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Topic freedom vs. guidelines | Free-form any topic | Matches spec language, aligns with 100+ precedent files using diverse topics, maximizes flexibility |
  | 2 | Prose quality criteria | Basic readability | Maintains quality parity with existing files, prevents obvious defects without over-engineering |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-ppqzc5.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 101-129; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/130-markdown-file-create-e66f69` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files (features 101-129) providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (126-129) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library
  - Clear encoding and formatting standards (UTF-8, LF line endings) simplify validation

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product questions resolved with AI recommendations_
