# Structured technology decisions
decisions:
  - title: "File I/O Method"
    chosen: "pathlib.Path.write_text() with encoding='utf-8' and newline='\\n'"
    rejected:
      - "os.open() with manual newline handling — lower-level API, requires explicit file descriptor management and manual EOF handling; pathlib is more modern and safer"
      - "open() with context manager — verbose compared to pathlib.write_text(); less Pythonic for simple write operations"
      - "io module with explicit buffering — unnecessary complexity for simple text file creation"
    rationale: >
      pathlib.Path.write_text() is the recommended approach for simple text file creation
      in Python 3.11+. It handles encoding, newline normalization, and file closure
      automatically. By specifying encoding='utf-8' and newline='\\n', we ensure UTF-8
      without BOM and Unix-style LF line endings across all platforms (Windows, macOS, Linux).
      This matches the spec's NFR-1 and NFR-2 requirements and is the modern Python standard.

  - title: "Line Ending Handling"
    chosen: "Specify newline='\\n' parameter in pathlib.write_text()"
    rejected:
      - "Rely on git config (core.autocrlf=true) — system-dependent, not guaranteed to work on all developer machines; explicit in code is more reliable"
      - "Post-process with dos2unix or sed — adds extra step, requires additional tooling not in spec"
      - "Use .gitattributes normalization — creates additional files in repo, adds complexity without direct control over file encoding"
    rationale: >
      Python's write_text() supports explicit newline control via the newline parameter.
      Setting newline='\\n' ensures that all text is written with Unix-style LF endings
      (0x0A) rather than platform-dependent CRLF (0x0D 0x0A) on Windows. This is the
      only method that guarantees LF line endings independent of platform or git configuration.
      Aligns with NFR-2 requirement.

  - title: "Encoding Strategy"
    chosen: "UTF-8 encoding (default for pathlib.write_text(), no BOM)"
    rejected:
      - "codecs.open() with explicit UTF-8 — functionally equivalent but more verbose than pathlib; adds unnecessary abstraction"
      - "UTF-8-SIG codec (with BOM) — violates NFR-1 requirement; BOM is only needed for Windows Notepad compatibility, not relevant for test files"
      - "Locale-dependent encoding — unreliable across platforms; UTF-8 is modern standard and explicitly required in spec"
    rationale: >
      pathlib.Path.write_text() defaults to UTF-8 encoding without BOM. Python's UTF-8
      codec does not add a BOM by default (unlike UTF-8-SIG). This matches NFR-1
      requirement for UTF-8 without BOM. No additional configuration or codec handling needed.

  - title: "Content Generation Method"
    chosen: "Hardcoded human-written prose matching established pattern"
    rejected:
      - "LLM-generated content via Claude API — adds external API dependency, complexity, and cost; spec does not call for automation; existing 100+ files use human-written content"
      - "Template-based content (Lorem Ipsum) — creates machine-generated text that differs from human-written prose in precedent files; fails NFR-4 readability requirement"
      - "Procedural topic selection — no topic generation system exists; free-form selection in spec allows simple hardcoding"
    rationale: >
      Examining existing test files reveals that all 100+ precedent files contain
      human-written, readable prose on diverse topics. The spec explicitly permits
      free-form any topic. Hardcoding simple, readable prose is the simplest approach
      consistent with precedent and requires no external dependencies.

  - title: "Prose Content Topic Selection"
    chosen: "Free-form topic selected from established pattern"
    rejected:
      - "Domain-specific constraint (only Sheep/technical topics) — violates spec's 'any topic' language; existing test files use diverse topics"
      - "Random topic generator — adds unnecessary complexity; simple hardcoded topic meets requirements"
      - "Programmatic topic selection from external API — adds dependencies and cost; free-form approach is simpler"
    rationale: >
      The spec's oneLiner explicitly states 'about any topic'. Examination of existing
      test files confirms this pattern — files cover curiosity, markdown, AI/ML, and
      other non-Sheep-specific topics. Free-form hardcoded topic is simplest, matches
      precedent, and requires no external validation.

  - title: "Git Integration Method"
    chosen: "subprocess.run() for git add, commit, and push operations"
    rejected:
      - "GitPython library — adds external dependency not listed in spec; subprocess is built-in, simpler for small number of commands"
      - "os.system() or shell commands — less secure (shell injection risk), harder to capture return codes and verify success"
      - "Libgit2 bindings (pygit2) — unnecessary complexity for simple git operations; subprocess is sufficient"
    rationale: >
      subprocess.run() provides safe, platform-independent execution of git commands
      with proper error handling and return code verification. This is the standard
      Python approach for external command invocation. GitPython adds a dependency not
      called out in the spec, and subprocess is simpler for the small number of git
      commands needed (add, commit, push). Aligns with spec's use of Python standard library.

  - title: "File Size Validation"
    chosen: "Verify file size after creation; validate it falls within 400-600 byte range"
    rejected:
      - "Pre-calculate content length and adjust before writing — complex, error-prone; validation after creation is simpler and catches encoding variations"
      - "Skip validation entirely — risks missing format issues (encoding, line endings, prose length) until integration testing"
      - "Use word count instead of byte size — less precise; byte size directly maps to encoding and line ending impacts"
    rationale: >
      Examining existing files confirms they fall within the 400-600 byte range specified
      in NFR-3. Writing the file first, then validating its actual byte size, catches
      any encoding or line ending issues that might cause size divergence. This approach
      is testable and provides clear failure diagnostics. File size validation ensures
      the created file matches the structural requirements of existing test files.

  - title: "Error Handling and Verification"
    chosen: "Check subprocess return codes for git operations; raise exceptions on failure; verify file exists with stat()"
    rejected:
      - "Ignore subprocess return codes — risks silent failures; commit/push could fail without detection"
      - "Log errors but continue — integration tests would catch failures, but slower feedback; fail fast is better"
      - "Use os.path.exists() for existence checks — works but pathlib.stat() is more modern and provides additional file metadata"
    rationale: >
      Checking subprocess return codes ensures git operations succeed before proceeding.
      pathlib.stat() is the modern way to verify file existence and gather file metadata
      (size for validation). This approach catches errors early with clear diagnostics,
      making debugging faster. Aligns with best practices for process execution and
      error handling in Python.

