content: |
  ## Architecture Overview

  Feature 130 creates a single test markdown file in the repository root, following
  the identical pattern established by features 101-129. The implementation is
  stateless: write one file, validate it, commit it, and push to the branch.

  **Integration Points:**
  - **Repository Root**: File creation at repository root directory (matching 100+ existing test files)
  - **Git Repository**: Standard staging, committing, and pushing to feature branch (no merge/branch complexity)
  - **No Dependencies**: Uses only Python 3.11+ standard library; no external packages needed

  **Pattern Consistency:**
  The implementation exactly replicates the validated approach from features 101-129:
  - pathlib for file I/O (modern Python standard)
  - Explicit encoding and line ending control (portable across platforms)
  - Hardcoded human-written prose (matches precedent files)
  - subprocess for git integration (safe, standard approach)
  - File size validation (400-600 bytes, consistent with existing files)

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text() with Explicit Parameters

  **Chosen:** `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Why:** Modern Python standard for text file creation. Specifying encoding='utf-8'
  ensures UTF-8 without BOM (Byte Order Mark). Setting newline='\n' guarantees
  Unix-style LF line endings (0x0A) on all platforms, including Windows where the
  default is CRLF (0x0D 0x0A). This satisfies NFR-1 and NFR-2 without additional
  post-processing.

  **Alternatives Rejected:**
  - `open()` with context manager: more verbose; pathlib.write_text() is more Pythonic
  - `os.open()` with manual file descriptor management: lower-level, more error-prone
  - Git configuration (`core.autocrlf`): system-dependent, not guaranteed portable

  ### 2. Content Generation: Hardcoded Human-Written Prose

  **Chosen:** Hardcoded, human-written prose on a free-form topic

  **Why:** Examination of 100+ existing test files shows all use human-written,
  readable prose on diverse topics (curiosity, markdown, AI/ML, etc.). The spec
  explicitly permits "any topic." Hardcoding is the simplest approach with no
  external dependencies, matches established precedent, and requires no API calls
  or content validation beyond basic readability.

  **Alternatives Rejected:**
  - LLM-generated content (Claude API): adds external dependency, cost, complexity
  - Lorem Ipsum templates: machine-generated, differs from precedent human prose
  - Procedural topic selection: no topic generation system exists; free-form is simpler

  ### 3. Git Integration: subprocess.run() for Safe Command Execution

  **Chosen:** `subprocess.run()` for `git add`, `git commit`, and `git push`

  **Why:** Standard Python approach for external command execution. Uses argument
  lists (not shell=True), preventing command injection. Allows return code checking
  to verify success. Built-in to Python; no external dependencies like GitPython.
  Safe and sufficient for the small number of git commands needed.

  **Alternatives Rejected:**
  - GitPython: external dependency not listed in spec; subprocess sufficient
  - `os.system()`: less secure (shell injection risk), harder to verify success
  - Libgit2 bindings (pygit2): unnecessary complexity for simple operations

  ### 4. File Validation: Post-Creation Size and Structure Checks

  **Chosen:** After writing the file, validate: (1) file exists, (2) size is
  400-600 bytes, (3) content structure is correct (one # heading + blank line + 2-3 sentences)

  **Why:** Writing the file first, then validating actual byte size, catches encoding
  and line ending variations that might cause size divergence. File size validation
  is objective and directly testable. Structure validation ensures prose quality
  meets basic readability criteria (no gibberish, truncated text, or malformed
  markdown).

  **Alternatives Rejected:**
  - Pre-calculate content length and adjust: complex, error-prone
  - Skip validation: risks missing encoding/line ending issues until integration testing
  - Use word count instead of byte size: less precise; byte size directly maps to effects of encoding/line endings

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (File Creation)** comes first: Must create the file before validating
     or pushing it. This is the foundation all downstream work depends on.

  2. **Phase 2 (Validation)** comes second: After file creation, validate structure,
     encoding, line endings, and size. This catches issues early and prevents invalid
     files from being committed.

  3. **Phase 3 (Git)** comes last: After validation confirms the file is correct,
     stage, commit, and push. This ensures only valid files enter the git history.

  **Technical Implementation Flow:**
  1. Construct markdown content: `# Title\n\nProse sentence 1. Prose sentence 2. Prose sentence 3.`
  2. Write to file using pathlib.write_text() with encoding and newline parameters
  3. Validate file exists, size is 400-600 bytes, contains correct markdown structure
  4. Run `git add test-ppqzc5.md`
  5. Run `git commit -m "feat(130): Create markdown file test-ppqzc5.md with prose content"`
  6. Run `git push origin feat/130-markdown-file-create-e66f69`
  7. Verify all operations succeeded via return codes

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding differs from UTF-8 on some platforms** | Explicitly specify `encoding='utf-8'` in pathlib.write_text(). Validate UTF-8 encoding after file creation via byte inspection (BOM check). |
  | **Line endings become CRLF on Windows** | Explicitly specify `newline='\n'` in pathlib.write_text(). This overrides platform-dependent defaults. Validate LF line endings by checking for 0x0A (not 0x0D 0x0A) after creation. |
  | **File size diverges from 400-600 byte range** | Calculate actual prose content to ~250-350 characters (matching precedent files). Validate actual file size after creation and fail if outside range. |
  | **Prose content quality is poor (gibberish, truncated text)** | Use hardcoded human-written prose from established pattern. Validate during code review that sentences are complete, coherent, and grammatically sound. |
  | **Git commit or push fails silently** | Check subprocess return codes for all git operations. Raise exceptions if return code is non-zero. Verify commits in git log. |
  | **Feature branch does not exist** | Feature branch `feat/130-markdown-file-create-e66f69` is pre-created before implementation. Verify it exists before attempting push. |
  | **Markdown syntax is incorrect** | Validate file structure: exactly one `# ` heading at start, blank line after heading, 2-3 complete sentences following. Fail if structure is invalid. |

