content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-rtj7cz.md`) at the repository root with a title and prose content, demonstrating automated file creation and git integration.

  This is a continuation of the markdown-file-creation pattern established in features 001-144, with 144 identical test files already existing in the repository. The pattern is foundational to the Sheep project's test suite and serves as a minimal unit of work for validating the automated implementation system.

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-rtj7cz.md` at the repository root directory
  - **FR-2**: Generate a markdown H1 heading using Claude LLM via the content_generators.generate_markdown_content() utility
  - **FR-3**: Generate exactly 2-3 sentences of prose content using Claude LLM via the content_generators.generate_markdown_content() utility
  - **FR-4**: Write generated content to disk with UTF-8 encoding and no Byte Order Mark (BOM) using content_generators.write_markdown_file()
  - **FR-5**: Validate generated markdown file format, encoding, and line endings using content_generators.validate_markdown_file()
  - **FR-6**: Stage the created file in git using content_generators.commit_markdown_file() (internally calls git add)
  - **FR-7**: Create a git commit with conventional commit message format: "feat(145): create markdown file test-rtj7cz.md with prose content" using content_generators.commit_markdown_file()
  - **FR-8**: Push changes to remote origin with upstream tracking using content_generators.push_markdown_file()

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without Byte Order Mark (BOM)
  - **NFR-2**: File line endings must use Unix-style LF (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: Implementation must reuse proven utilities from the `sheep.content_generators` module without creating custom logic
  - **NFR-4**: Implementation must follow the established pattern from features 001-144 to maintain consistency with prior test files
  - **NFR-5**: File size should be approximately 400-600 bytes, consistent with prior test files
  - **NFR-6**: All operations must be fully automated with no manual steps required after invocation
  - **NFR-7**: Implementation must complete within 10-15 minutes of actual development work
  - **NFR-8**: Feature must have zero impact on application source code, agents, or existing functionality
  - **NFR-9**: Errors must include descriptive messages that enable quick diagnosis and fix
  - **NFR-10**: Generated prose content must be coherent, grammatically correct, and substantive (no placeholder or generic text)

  ## Success Criteria

  - [ ] File `test-rtj7cz.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is within the guideline range of 400-600 bytes
  - [ ] Prose content follows the exact format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (verified via `git status`)
  - [ ] Git commit exists with exact message: `feat(145): create markdown file test-rtj7cz.md with prose content`
  - [ ] Commit is on the feature branch `feat/145-markdown-file-creation-adecc5`
  - [ ] Changes have been pushed to remote origin (verified via `git log origin/feat/145-markdown-file-creation-adecc5`)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementation reuse existing content_generators utilities? | Reuse existing utilities | Proven across 144+ features, 2-3 min implementation time, maintains consistency, reduces risk |
  | 2 | Should file validation be comprehensive or minimal? | Comprehensive validation | Catches all errors, ensures consistency with 144+ prior files, adds only 1-2 min, catch-early reduces debugging |
  | 3 | How should errors be handled? | Fail fast with descriptive messages | Simple to implement, prevents partial/corrupted state, enables quick diagnosis, matches established pattern |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a Python package with the following key directories:

  - **`src/sheep/`** — Main application code
    - **`agents/`** — Agent definitions (code_agents.py, general_agents.py)
    - **`config/`** — Configuration management (settings.py, llm.py for LLM factory)
    - **`content_generators.py`** — Content generation utilities (primary dependency for this feature)
    - **`features/`** — Feature implementations (feature_001 through feature_144 existing)
    - **`tools/`** — Git and file operation tools (GitCommitTool, GitPushTool)
    - **`observability/`** — Logging via structlog

  - **`tests/`** — Test suite

  - **`specs/`** — Feature specifications directory (001-145 subdirectories)

  - **Repository root** — Markdown test files (test-*.md) and Python feature scripts

  ### Architecture Patterns

  The project follows a modular agentic architecture:

  1. **Content Generation Pattern**: The `content_generators.py` module provides a complete workflow orchestration:
     - `generate_markdown_content()` — Calls Claude LLM via CrewAI to generate H1 heading + 2-3 sentences
     - `write_markdown_file()` — Writes file to repository root with UTF-8 encoding
     - `validate_markdown_file()` — Validates format, encoding, and line endings
     - `commit_markdown_file()` — Stages and commits with conventional message
     - `push_markdown_file()` — Pushes to remote with upstream tracking

  2. **Feature Implementation Pattern**: Each feature has a dedicated module in `src/sheep/features/` (e.g., `feature_144_markdown_file_creation.py`) that:
     - Imports content generation utilities
     - Defines feature metadata (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
     - Implements a feature function that orchestrates the workflow

  3. **Git Integration**: Uses GitPython via CrewAI tools for standard git operations (add, commit, push)

  4. **Observability**: Structured logging via `sheep.observability.logging` module with contextual debug and info messages

  ### Relevant Technologies

  **CrewAI Framework**:
  - Version: >=0.86.0 (from pyproject.toml)
  - Provides LLM abstraction and orchestration
  - The `get_reasoning_llm()` function from `sheep.config.llm` returns an LLM instance for content generation

  **Anthropic Claude API**:
  - Called via CrewAI's LLM interface in `generate_markdown_content()`
  - Uses system prompt: "Generate a markdown document with H1 heading + 2-3 sentences of prose"
  - Validated to ensure format compliance (H1 heading, 2-3 sentences, trailing newline)

  **Python Standard Library**:
  - `pathlib.Path` — File system operations (Path.cwd() for repo root, file creation/validation)
  - Text encoding — UTF-8 without BOM, Unix LF line endings

  **Git Integration**:
  - `GitCommitTool` — Stages files and creates commits
  - `GitPushTool` — Pushes to remote with upstream tracking

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-rtj7cz.md) to existing collection of 144+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~400-600 bytes based on 144 prior features); no directory structure changes, no deletions |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-144; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep) | None | Feature is purely file creation at repository root; does not depend on or impact source code, agents, flows, or tools beyond the existing content_generators module |
  | Content Generators Module | None | Uses existing functions from `sheep.content_generators` without modifications; established APIs are stable across 144+ features |
  | Specs Directory | Low | Adds/updates spec.yaml for feature 145; no impact on other specs or configurations |
  | Test Suite | None | No modifications to test infrastructure or test files |

  ## Dependencies

  - **Git Repository**: Feature branch `feat/145-markdown-file-creation-adecc5` must exist (pre-created in current worktree)
  - **File System**: Write access to repository root directory (already available)
  - **Established Pattern**: 144+ test files in features 001-144 provide clear precedent for content format and structure
  - **Git Configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **CrewAI and LLM**: CrewAI framework and at least one configured LLM provider (Anthropic Claude in this case)
  - **Content Generators Module**: Stable `sheep.content_generators` module with tested functions:
    - `generate_markdown_content()` — Uses Claude API to generate valid markdown
    - `write_markdown_file()` — Writes to disk with proper encoding
    - `validate_markdown_file()` — Validates format and properties
    - `commit_markdown_file()` — Git staging and committing
    - `push_markdown_file()` — Git push operation
  - **Python 3.11+**: Required by pyproject.toml and uses pathlib from standard library

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content Generation**: ~2-3 minutes (use existing `generate_markdown_content()` utility, which calls Claude via CrewAI LLM interface)
  - **File Writing and Validation**: ~2-3 minutes (use existing `write_markdown_file()` and `validate_markdown_file()` utilities)
  - **Git Workflow**: ~2-3 minutes (use existing `commit_markdown_file()` and `push_markdown_file()` utilities)
  - **Module Setup and Integration**: ~2-3 minutes (create feature_145_markdown_file_creation.py module following feature_144 pattern)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 144 identical test files in features 001-144 providing clear precedent
  - Proven content generators in `sheep.content_generators` module available for reuse (tested in 144+ features)
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (142-144) demonstrate consistent 10-15 minute implementation of identical features
  - Zero impact on application source code or architecture
  - All required utilities already exist and are stable

  ---

  _Requirements phase complete — specification ready for implementation_
