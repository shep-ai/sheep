decisions:
  - title: "Content Generation Architecture"
    chosen: "Use CrewAI-orchestrated Claude API via existing content_generators module"
    rejected:
      - "Implement custom LLM integration — duplicates existing utilities, increases development time, risks API call inconsistency with 144 prior features"
      - "Use alternative LLM providers (OpenAI, Google Gemini) — breaks pattern established in features 001-144, requires configuration changes, adds unnecessary complexity"
      - "Use deterministic template-based generation — cannot produce varied, coherent prose content; violates specification requirement for genuine prose"
    rationale: >
      The existing `sheep.content_generators.generate_markdown_content()` function
      provides proven, tested content generation that works across 144+ features.
      It uses CrewAI's LLM abstraction with `get_reasoning_llm()` from `sheep.config.llm`,
      which returns a configured Anthropic Claude instance. This approach: (1) avoids
      code duplication, (2) maintains consistency with established pattern, (3) ensures
      all content passes the same validation rules, (4) provides structured logging via
      sheep.observability.logging, (5) handles edge cases (empty content, missing H1,
      sentence count validation) in proven code.

  - title: "File Operations and Path Handling"
    chosen: "Use pathlib.Path for all file operations; restrict to repository root only"
    rejected:
      - "Use os.path module — older API, less safe, string-based paths prone to traversal vulnerabilities"
      - "Use absolute paths without validation — enables path traversal attacks; pathlib provides safer Path objects"
      - "Create files in subdirectories — violates specification (repository root only), breaks consistency with 144+ prior test files"
    rationale: >
      Python 3.11+ pathlib provides a modern, object-oriented API for path operations.
      The existing `write_markdown_file()` function: (1) validates filename to prevent
      path traversal (`/`, `\`, `.` prefixes rejected), (2) uses `Path.cwd()` to get
      repository root reliably across platforms, (3) writes with `encoding="utf-8"`,
      which automatically handles LF line endings on Unix/Windows, (4) verifies file
      creation with `file_path.exists()` and `st_size` checks, (5) integrates cleanly
      with pathlib's type safety. No custom path handling is needed.

  - title: "Git Integration Strategy"
    chosen: "Use existing GitCommitTool and GitPushTool from sheep.tools; subprocess-based git commands"
    rejected:
      - "Use GitPython library directly — adds extra dependency layer, sheep.tools already wraps it, duplicates existing integration"
      - "Use git CLI subshell directly (no tools) — loses structured error handling, logging context, lacks reusability across features"
      - "Implement custom git operations — reimplements staging/committing/pushing logic already proven in 144+ features"
    rationale: >
      The existing tools in `sheep.tools` (GitCommitTool, GitPushTool) wrap GitPython
      and provide standardized git operations. Feature 144 demonstrates the pattern:
      `commit_markdown_file(filepath, content, repo_path, custom_message=COMMIT_MESSAGE)`
      passes a fixed commit message to GitCommitTool._run(), which internally calls git add
      and git commit. The `push_markdown_file()` function calls GitPushTool._run() with
      `set_upstream=True` to establish branch tracking. This approach: (1) maintains
      consistency across all 144+ features, (2) provides structured logging, (3) ensures
      error messages are descriptive and actionable, (4) avoids duplicating battle-tested code.

  - title: "Validation Strategy"
    chosen: "Comprehensive multi-stage validation: content format, file encoding, line endings, file size"
    rejected:
      - "Minimal validation (file exists only) — misses malformed markdown, encoding issues; no early feedback on problems"
      - "No validation (trust generation) — loses safety net if LLM output or file write fails; provides no confidence in file integrity"
      - "Validation-by-test — defer all checks to test phase; slows feedback loop, harder to debug root cause of failures"
    rationale: >
      The existing `validate_markdown_file(filepath)` function checks: (1) H1 heading
      format (must be at line 1, must have space after #), (2) blank line separator
      (line 2 must be empty), (3) prose sentence count (exactly 2-3 periods), (4) UTF-8
      encoding via binary read and decode, (5) no UTF-8 BOM (0xEF 0xBB 0xBF), (6) Unix
      LF only (no CRLF bytes), (7) trailing newline. Validation is called immediately
      after file write, catching errors early. This matches validation in 144+ prior
      features and ensures consistency across the test file suite.

  - title: "Error Handling Approach"
    chosen: "Fail-fast with descriptive error messages; no retries, no fallbacks"
    rejected:
      - "Automatic retry on transient failures — adds complexity, may mask persistent issues, network errors unlikely in local git operations"
      - "Silent fallback behavior — hides real problems, unpredictable for automation, breaks observability"
      - "Continue-on-error — creates partial/corrupted state (file written but not committed), difficult to recover from"
    rationale: >
      The pattern from features 001-144 uses fail-fast error handling. All exceptions
      are caught with descriptive messages and logged via structlog at ERROR level. Each
      step (content generation, file write, validation, git commit, git push) can raise
      exceptions that are allowed to propagate. Feature 144 implementation: `try/except`
      blocks log the error and re-raise, allowing calling code to handle failure. This
      approach: (1) prevents partial state (all-or-nothing semantics), (2) provides clear
      error messages for debugging, (3) is simple to understand and test, (4) matches
      established pattern in production code, (5) requires manual review/retry if failure
      occurs, which is appropriate for automated features.

