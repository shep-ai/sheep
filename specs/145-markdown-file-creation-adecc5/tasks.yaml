content: |
  ## Summary

  Feature 145 implementation follows the established pattern from features 001-144.
  The work is organized into 3 phases with 5 concrete tasks:

  **Phase 1: Module Creation and Foundation (1 task, 10 min)**
  - Task 1: Create feature module with metadata and imports
    - Establish module structure matching feature_144 exactly
    - Define feature constants (number, filename, commit message)
    - Import all required utilities from content_generators, logging, pathlib

  **Phase 2: Orchestration Implementation (2 tasks, 20 min)**
  - Task 2: Implement the main orchestration function
    - Execute 5-step workflow: generate → write → validate → commit → push
    - Add error handling with descriptive logging at each step
    - Follow fail-fast pattern from existing features
  - Task 3: Add __main__ block for standalone execution
    - Enable execution via `python -m sheep.features.feature_145_markdown_file_creation`
    - Include try/except with helpful error messages

  **Phase 3: Execution and Validation (2 tasks, 15 min)**
  - Task 4: Execute feature and verify core functionality
    - Run the feature and verify test-rtj7cz.md is created correctly
    - Confirm file has H1 heading + 2-3 sentences, UTF-8 encoding, Unix LF
    - Verify git staging and commit
  - Task 5: Verify all success criteria and git push
    - Confirm commit message is exact and on correct branch
    - Verify push to remote was successful
    - Validate all 11 success criteria from feature spec

  ## Implementation Flow

  1. **Task 1** creates the module structure — this is the foundation for all work
  2. **Task 2** implements the workflow orchestration — the core business logic
  3. **Task 3** adds execution capability — enables testing and validation
  4. **Task 4** runs the feature — practical validation of output
  5. **Task 5** verifies git state — confirms push and branch correctness

  Each task builds on previous work, with clear dependencies. All tasks follow
  TDD cycles: RED (write test), GREEN (implement), REFACTOR (improve).

  The entire feature is implemented using existing utilities from `sheep.content_generators`,
  avoiding code duplication and ensuring consistency with the 144+ prior features.
  Total effort is 45 minutes of actual development work.

  ---

