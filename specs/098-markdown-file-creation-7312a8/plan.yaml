content: |
  ## Status

  - **Phase:** Planning (Complete)
  - **Updated:** 2026-03-18
  - **Conclusion:** Architecture and implementation strategy finalized. All technical decisions
    from research phase are incorporated. Ready for implementation.

  ## Architecture Overview

  Feature 098 is implemented as a **standalone Python script** (`create_test_nh2svx.md.py`)
  that follows the established pattern from 97+ prior test file creation features (069-097).

  **Why this approach:**
  - Feature is intentionally simple: linear sequence of operations (compose → create → validate → commit)
  - No decision-making, reasoning, or multi-step complexity requiring LLM assistance
  - Deterministic, repeatable test case validating basic platform capabilities
  - CrewAI agent framework is designed for complex, multi-phase features; feature 098 tests
    foundational capabilities (file I/O, git workflow, conventional commits)
  - Established pattern proven successful across 97+ prior features with identical requirements

  **How it fits:**
  - Sheep platform uses agentic orchestration for complex features; simple features use scripts
  - Test markdown files at repository root are artifacts from feature implementation phases,
    not part of application source code (src/sheep/)
  - Feature has zero impact on application code, configuration, or test infrastructure
  - Purely additive: creates one new file, stages/commits/pushes it, no modifications to
    existing files

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path("test-nh2svx.md").write_text(content, encoding='utf-8')`

  **Why:**
  - FR-4 explicitly specifies pathlib as required method
  - Platform-independent API with automatic file handle management
  - Explicit encoding='utf-8' ensures UTF-8 without BOM (Python's utf-8 codec does not add BOM)
  - Python string newlines (\n) are converted to LF on all platforms (Unix, macOS, Windows)
  - Proven in create_markdown.py and all prior features (069-097)

  **Alternatives considered:**
  - open()/write() directly: More verbose, requires explicit encoding specification and handle closing
  - shutil module: Designed for copying/moving files, not text creation

  ### 2. Git Operations: subprocess.run() with explicit argument lists

  **Chosen:** Direct subprocess.run() calls to git CLI (no shell=True)

  **Why:**
  - Transparent, explicit execution of git commands
  - No unnecessary abstraction layer (GitPython adds indirection without benefit for simple ops)
  - Proven pattern in create_markdown.py and all prior features
  - Error handling via check=True and CalledProcessError is straightforward
  - Secure: explicit argument lists prevent shell injection (no shell=True)

  **Alternatives considered:**
  - GitPython library: Available as dependency but adds unnecessary abstraction
  - CrewAI tools (GitCommitTool, GitPushTool): Themselves wrappers around subprocess; adds indirection

  ### 3. Prose Content: Manual composition with flexible topic selection

  **Chosen:** Implementation-directed topic selection per NFR-9

  **Why:**
  - Product spec (resolved open question) mandates implementation-directed approach
  - Analysis of prior test files shows diverse topics ("The Power of Persistence", "Black Holes
    Exhibition Guide", "Acoustic Engineering Symptom Checker") — intentional flexibility
  - Ensures originality (not copy-pasting from prior files)
  - Content requirements are minimal: grammatically correct, coherent, 2-3 sentences, ~320-600 bytes
  - Topic selection is quick (< 5 minutes per feature, proven across 069-097)

  **Alternatives considered:**
  - LLM-based generation: Adds API calls, latency, cost, and complexity for straightforward task
  - Template-based with placeholders: Reduces flexibility and still requires topic selection
  - Reuse from prior files: Violates originality expectation

  ### 4. Validation: Post-creation, before git operations (fail-fast)

  **Chosen:** Comprehensive validation using Path methods and string operations

  **Why:**
  - Validation occurs immediately after file creation, before git operations
  - If validation fails, file remains uncommitted at repository root (clean state)
  - Success criteria explicitly require testable checkpoints: file size, encoding, line endings, structure
  - Simple validation is sufficient and proven in create_markdown.py
  - No external dependencies (no markdown parser library needed)

  **Validation checks:**
  - File exists and is readable
  - H1 heading on line 1 (starts with "# ")
  - Blank line separator on line 2
  - 2-3 sentences of prose (counted by periods)
  - UTF-8 encoding without BOM (read_bytes(), check no \xef\xbb\xbf)
  - LF line endings only (no \r\n present)
  - File size is 320-600 bytes (hard constraint per NFR-5)
  - Markdown syntax is valid (no special characters causing issues)
  - Prose is grammatically correct and coherent (visual inspection)

  **Alternatives considered:**
  - Markdown parser library: Unnecessary for simple structural checks; adds dependency
  - External validation tool: Adds complexity without benefit for straightforward checks
  - No validation: Risks committing files that don't meet criteria

  ### 5. Encoding and Line Ending Handling: Automatic via pathlib

  **Chosen:** pathlib.write_text(encoding='utf-8') handles encoding and line endings automatically

  **Why:**
  - pathlib.write_text(content, encoding='utf-8') produces UTF-8 without BOM
  - Python strings use \n for newlines; pathlib.write_text() produces LF on all platforms
  - No need for manual byte-level encoding or explicit newline handling
  - Success criteria explicitly test for UTF-8 without BOM and LF-only line endings; pathlib
    meets both automatically

  **Alternatives considered:**
  - Manual byte-level encoding: Unnecessary complexity; pathlib handles automatically
  - No explicit encoding: System default is unreliable (might be UTF-8-sig or other encoding)
  - Explicit CRLF handling: Would violate NFR-4 requirement for LF-only

  ## Implementation Strategy

  **Three-phase sequential approach** (no parallelization needed for simple linear task):

  1. **Phase 1: Prose Composition & File Creation (5 minutes)**
     - Select appropriate topic (generic/universal per NFR-9)
     - Write 2-3 sentences of grammatically correct prose
     - Format content: "# Heading\n\nsentence1. sentence2. sentence3.\n"
     - Create file using pathlib.Path.write_text(content, encoding='utf-8')
     - Ensure prose length targets ~320-600 bytes

  2. **Phase 2: Validation & Verification (3 minutes)**
     - Verify file exists and is readable
     - Check H1 heading format, blank line separator, sentence count
     - Validate file size (320-600 bytes, hard constraint)
     - Verify UTF-8 encoding without BOM (no \xef\xbb\xbf prefix)
     - Verify LF line endings only (no \r\n)
     - Verify markdown syntax is valid and prose is coherent
     - **If validation fails:** Report error, do NOT proceed to git operations
     - **If validation passes:** Proceed to Phase 3

  3. **Phase 3: Git Integration & Push (2-5 minutes)**
     - Stage file: subprocess.run(['git', 'add', 'test-nh2svx.md'], check=True)
     - Commit with conventional message: subprocess.run(['git', 'commit', '-m', 'feat(098): ...'], check=True)
     - Push to feature branch: subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
     - Verify git status shows clean working tree

  **Why this order:**
  - Prose composition first: Content is small, quick, and non-dependent
  - File creation second: Must happen before validation
  - Validation third: Must succeed before committing (fail-fast ensures clean commits)
  - Git operations last: Only if validation passes, ensuring every commit is guaranteed valid

  ## Files to Create

  **create_test_nh2svx.md.py** — Main implementation script
  - Standalone Python script, no external imports beyond stdlib
  - Sequential execution: compose → create → validate → git add/commit/push
  - Error handling and status reporting
  - Entry point: `python create_test_nh2svx.md.py`

  ## Files to Modify

  None. Feature is purely additive (creates one new markdown file).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Prose content is outside 320-600 byte range | Validation enforces hard constraint before git commit; if out of range, script reports error and does NOT commit. Implementation can adjust topic or sentence count. |
  | File encoding is not UTF-8 without BOM | pathlib.write_text(encoding='utf-8') automatically produces UTF-8 without BOM; validation checks this with read_bytes(). Explicit encoding parameter eliminates this risk. |
  | Line endings are CRLF instead of LF | pathlib.write_text() uses LF for Python strings (\n) on all platforms; no CRLF conversion occurs. Validation checks for absence of \r\n. This is consistent across prior features. |
  | File structure is incorrect (missing blank line, wrong heading format) | Validation explicitly checks H1 heading format and blank line separator before commit. If incorrect, validation fails and script reports error. |
  | Git operations fail (user not configured, branch doesn't exist) | subprocess.run() with check=True raises CalledProcessError if git command fails. Script will report error clearly and exit. Feature branch is pre-created before implementation begins. |
  | Prose is not grammatically correct or coherent | Implementation carefully composes prose and visual inspection confirms quality. Validation includes grammatical verification step. |
  | File already exists from prior failed attempt | Implementation is idempotent: if file exists, write_text() overwrites it. New content is written and validated before commit. |

