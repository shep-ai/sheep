# Markdown content (the full tasks document)
content: |
  ## Status

  - **Phase:** Task Breakdown (Complete)
  - **Updated:** 2026-03-18
  - **Ready:** Implementation can begin immediately

  ## Summary

  Feature 098 implementation consists of **5 tasks across 3 phases**:

  **Phase 1: Prose Composition & File Creation** (25-30 min)
  - Select appropriate topic and compose 2-3 sentences of prose (task-1)
  - Implement file creation using pathlib.write_text() with UTF-8 encoding (task-2)

  **Phase 2: Validation & Verification** (10-15 min)
  - Implement comprehensive validation checks for all success criteria (task-3)

  **Phase 3: Git Integration & Execution** (15-20 min)
  - Implement git workflow: add, commit with conventional message, push (task-4)
  - Execute complete script and verify all criteria are satisfied (task-5)

  **Total effort:** 50-60 minutes (including TDD red/green/refactor cycles)

  The implementation follows a sequential, fail-fast approach: prose → file creation → validation
  (with abort if invalid) → git operations → final verification. Each task builds on the previous
  one and includes clear acceptance criteria and TDD cycles.

  ### Task Ordering Rationale

  - **task-1 before task-2:** Content must be composed before file is created
  - **task-2 before task-3:** File must exist before validation can run
  - **task-3 before task-4:** Validation must pass before git operations proceed
  - **task-4 before task-5:** All operations must be implemented before final execution
  - **No parallelization:** All tasks are sequential due to data dependencies

  ### TDD Cycles

  Each task includes explicit RED-GREEN-REFACTOR cycles:

  - **RED:** Write assertions/tests that fail initially (define the contract)
  - **GREEN:** Implement minimal code to pass the tests (achieve functionality)
  - **REFACTOR:** Clean up, organize, improve code quality (maintain standards)

  For simple file I/O and git operations, TDD cycles remain quick even though code is minimal.
  Each cycle ensures correctness before proceeding to the next task.

  ### Success Criteria Completeness

  All success criteria from the feature spec (FR-1 through FR-7, NFR-1 through NFR-9) are
  addressed across the 5 tasks:

  - **FR-1 (file creation):** task-2
  - **FR-2 (H1 heading):** task-1, task-2, task-3
  - **FR-3 (prose content):** task-1, task-2, task-3
  - **FR-4 (pathlib):** task-2
  - **FR-5 (git add):** task-4
  - **FR-6 (conventional commit):** task-4
  - **FR-7 (git push):** task-4
  - **NFR-1 through NFR-9 (encoding, size, quality, etc.):** task-2, task-3

  ## Risk Mitigation

  Risks and mitigations are fully documented in plan.yaml. Key risk management:

  - **Prose out of range:** Validation enforces hard constraint (320-600 bytes); if failed, abort before commit
  - **Encoding/line ending issues:** pathlib handles automatically; validation verifies with read_bytes()
  - **Git operations failure:** subprocess.run() with check=True raises exception; script reports clearly
  - **File structure errors:** Validation checks all structural requirements before commit
  - **Idempotency:** If file exists from prior attempt, write_text() overwrites with new content

  ---

  **Task breakdown complete** — All 5 tasks defined with clear acceptance criteria, TDD cycles,
  dependencies, and effort estimates. Ready for implementation to begin.
