# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 97+ times. This feature creates a single
  test markdown file (`test-nh2svx.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 97+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-097.

  ## Success Criteria

  - [ ] File `test-nh2svx.md` exists at repository root (testable: `ls -la test-nh2svx.md`)
  - [ ] File contains exactly one H1 markdown heading as title (first non-empty line starts with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading (separated by blank line)
  - [ ] Markdown syntax is valid (parseable by standard markdown processors without warnings)
  - [ ] Prose content is grammatically correct and coherent
  - [ ] File uses UTF-8 encoding without BOM (testable: `file test-nh2svx.md` returns UTF-8)
  - [ ] File uses Unix-style line endings (LF: `\n` only, not CRLF: `\r\n`)
  - [ ] File size is 320-600 bytes (testable: `wc -c test-nh2svx.md`)
  - [ ] File is staged in git and appears in `git status` staging area
  - [ ] Commit message follows conventional format: `feat(098): create markdown file test-nh2svx.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/098-markdown-file-creation-7312a8` (testable: `git log --oneline`)
  - [ ] Repository shows no uncommitted changes after implementation (testable: `git status` shows clean working tree)

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with filename exactly `test-nh2svx.md`
  - **FR-2**: File must contain one H1 markdown heading (using `#` syntax) as the title/first line
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading, separated by blank line
  - **FR-4**: File must be created using standard Python pathlib methods: `Path("test-nh2svx.md").write_text(content)`
  - **FR-5**: Stage file with git using `git add test-nh2svx.md` command
  - **FR-6**: Commit file with conventional commit message: `feat(098): create markdown file test-nh2svx.md with prose content`
  - **FR-7**: Push commit to feature branch using `git push` or `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: Markdown syntax must be valid — file must parse correctly in standard markdown processors
  - **NFR-2**: Prose content must be grammatically correct, coherent, and appropriate in tone
  - **NFR-3**: File encoding must be UTF-8 without byte order mark (BOM)
  - **NFR-4**: Line endings must be Unix-style (LF: `\n` only, not CRLF: `\r\n`)
  - **NFR-5**: File size should fall within 320-600 bytes (observed range from prior test files)
  - **NFR-6**: Implementation must follow established pattern from features 069-097 without deviation
  - **NFR-7**: No modifications to existing files; implementation is purely additive (new file only)
  - **NFR-8**: Implementation should complete in approximately 10-15 minutes
  - **NFR-9**: Prose topic can be any appropriate subject (generic/universal topics are preferred)

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 97+ test markdown files (test-*.md) following a consistent pattern, created by features 069-097
  - **src/sheep/**: Application source code with modular architecture:
    - `agents/`: Agent definitions for research, implementation, and review phases
    - `config/`: Configuration management (settings.py, llm.py) for multi-LLM support
    - `flows/`: Flow definitions orchestrating agent execution
    - `tools/`: Agent tools (git_tools.py, file_tools.py, web_tools.py) for file and git operations
    - `observability/`: Logging and tracing (logging.py, langfuse_client.py) for execution monitoring
    - `content_generators.py`: Content generation utilities
    - `cli.py`: Command-line interface entry point
  - **specs/**: Feature specification directory with subdirectories for each feature numbered 006+
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (requires Python 3.11+) with dependencies and build metadata
  - **.env.example / .env**: Environment configuration for API keys (OpenAI, Anthropic, Google, Langfuse)
  - **README.md**: Project documentation describing the CrewAI-based agentic platform
  - **Documentation files**: DESIGN_PATTERN.md, ABOUT_ME.md, TOPIC.md, and other artifacts from prior feature implementations
  - **Docker**: Dockerfile and docker-compose.yml for containerized deployment
  - **Python scripts**: create_markdown.py and create_test_*.py scripts used for test file generation

  The test markdown files at repository root are artifacts created during feature implementation phases
  and do not form part of the application source code. They serve as simple, repeatable test cases
  for the Sheep automated implementation system.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (97+ precedents):
  - Simple file creation using Python pathlib: `Path("test-nh2svx.md").write_text(content)`
  - Standard markdown format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix-style LF line endings (\n)
  - File size typically 320-600 bytes (observed range across existing test files)
  - Topic selection is flexible (generic/universal topics like "The Power of Persistence", "Black Holes Exhibition Guide", "Acoustic Engineering Symptom Checker")
  - Prose content must be grammatically correct and coherent, typically 2-3 sentences

  **Git Workflow Pattern** (consistently applied across features 069-097):
  - Feature branch pre-created with naming convention: `feat/{number}-markdown-file-creation-{slug}`
  - Files created at repository root (no subdirectories)
  - Standard git workflow: `git add <file>` → `git commit -m "feat({number}): ..."` → `git push`
  - Conventional commit format: `feat({number}): create markdown file {filename} with prose content`
  - Commits pushed to feature branch (not merged to main during implementation phase)

  **Modular Application Architecture**:
  - Separation of flows (control structure) and crews (LLM intelligence)
  - Multi-LLM support with factory pattern (OpenAI, Anthropic, Google APIs)
  - Observable execution via Langfuse integration
  - Specialized agents for research, implementation, and review phases
  - File I/O and git operations via dedicated tool modules

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); supports 3.11-3.12
  - **pathlib (Python standard library)**: Cross-platform file I/O operations for markdown file creation
  - **Git**: Version control system for file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content blocks
  - **CrewAI**: Multi-agent framework used by the Sheep platform (from dependencies in pyproject.toml)

