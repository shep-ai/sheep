content: |
  ## Problem Statement

  Create a single markdown file named `test-mahrz4.md` in the repository root containing:
  - An H1 markdown heading (with `# ` prefix) serving as the title
  - 2-3 sentences of coherent prose content about any topic

  The file must be UTF-8 encoded with Unix (LF) line endings. This feature is part of an ongoing series of markdown file creation features (001-182) that validate the markdown generation and git workflow capabilities of the Sheep agentic platform.

  ## Success Criteria

  - [ ] File `test-mahrz4.md` is created in the repository root
  - [ ] File contains exactly one H1 heading (line starting with `# `)
  - [ ] File contains exactly 2-3 sentences after the heading
  - [ ] File is UTF-8 encoded
  - [ ] File uses Unix (LF) line endings
  - [ ] File passes validation via `validate_markdown_file()`
  - [ ] Git commit is created with message format: `feat(182): Create markdown file test-mahrz4.md with prose content`
  - [ ] Commit follows Conventional Commits specification
  - [ ] Changes are pushed to the feature branch
  - [ ] Git history shows the new commit and file creation

  ## Functional Requirements

  - **FR-1**: Generate H1 markdown heading using the existing `generate_markdown_content()` utility function from `sheep.content_generators`
  - **FR-2**: Generate 2-3 sentences of coherent, meaningful prose content via Claude API
  - **FR-3**: Write the complete markdown content (heading + prose) to file `test-mahrz4.md` in the repository root using `write_markdown_file()` helper
  - **FR-4**: Validate the written file using `validate_markdown_file()` to ensure it meets specification requirements
  - **FR-5**: Stage the file in git using `commit_markdown_file()` helper function
  - **FR-6**: Create a git commit with conventional commit message format: `feat(182): Create markdown file test-mahrz4.md with prose content`
  - **FR-7**: Push the commit to the remote feature branch using `push_markdown_file()` helper
  - **FR-8**: Return success status and confirmation of file creation, commit, and push operations

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (as enforced by `write_markdown_file()`)
  - **NFR-2**: Line endings must be Unix-style LF, not Windows CRLF
  - **NFR-3**: Execution must complete within 30 seconds (typical LLM response time + file I/O + git operations)
  - **NFR-4**: All operations must use existing helper functions from `sheep.content_generators` to maintain code reuse and consistency with the 181 preceding features
  - **NFR-5**: Must use structured logging via `sheep.observability.logging.get_logger()` for all operations (generation, file write, validation, git operations)
  - **NFR-6**: Error messages must be clear and actionable, enabling diagnosis of failure causes
  - **NFR-7**: Implementation must follow the same pattern as features 001-181 to ensure consistency
  - **NFR-8**: No modifications to build system, dependencies, or CI/CD pipelines required

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Use existing utility function or custom generation logic? | Use existing `generate_markdown_content()` utility | Proven across 181 features, ensures consistency, reduces risk, saves implementation time |
  | 2 | Error handling on LLM generation failure? | Fail-fast with error logging | Clear feedback, prevents silent failures, consistent with established pattern, enables quick debugging |
  | 3 | Sentence count validation strictness? | Strict (exactly 2-3 sentences) | Matches specification requirement precisely, ensures consistent output quality across all files |
  | 4 | Behavior if file already exists? | Error and refuse to overwrite | Safety-first approach, prevents accidental data loss, consistent with defensive programming practices |

  ## Codebase Analysis (from Analysis phase)

  ### Project Structure

  This is the **Sheep** repository - an agentic platform for automated code implementation using CrewAI. The relevant project structure:

  ```
  ├── src/sheep/
  │   ├── content_generators.py       # Core markdown generation utilities
  │   ├── features/                   # Feature implementations (182+ files)
  │   │   ├── feature_XXX_markdown_file_creation.py  # Per-feature modules
  │   │   └── __init__.py
  │   ├── config/                     # Configuration (LLM setup, settings)
  │   ├── observability/              # Logging and tracing
  │   ├── tools/                      # Git and file operation tools
  │   └── cli.py                      # CLI entry point
  ├── specs/                          # Specification files for each feature
  ├── .github/                        # GitHub workflows (CI/CD)
  └── root .md files                  # Generated markdown files
  ```

  ### Architecture Patterns

  1. **Feature Module Pattern**: Each feature is implemented as a separate Python module (feature_XXX_markdown_file_creation.py) that orchestrates the workflow:
     - Generates markdown content
     - Writes to disk with proper encoding
     - Validates file meets specification
     - Commits with conventional message
     - Pushes to remote

  2. **Content Generation**: Uses Claude API via CrewAI LLM framework:
     - `generate_markdown_content()` - Uses LLM with a prompt template to generate H1 heading + 2-3 sentences
     - Validates output format (starts with "# ", has 2-3 periods for sentence count)
     - Ensures UTF-8 encoding and Unix LF line endings

  3. **File Operations**: Helper functions in content_generators.py:
     - `write_markdown_file(content, filename)` - Writes to repo root
     - `validate_markdown_file(filepath)` - Validates format requirements
     - `commit_markdown_file(filepath, content, repo_path, custom_message)` - Git staging and commit
     - `push_markdown_file(repo_path)` - Git push to remote

  4. **Git Workflow**: Uses conventional commit messages and automatic push:
     - Format: `feat(XXX): Create markdown file test-XXX.md with prose content`
     - All commits follow Conventional Commits specification
     - Automatic push to feature branch after commit

  ### Relevant Technologies

  - **Python 3.8+**: Core implementation language
  - **CrewAI**: Agentic workflow orchestration framework
  - **Claude API (Anthropic)**: LLM for content generation (via get_reasoning_llm())
  - **Git**: Version control (staging, committing, pushing)
  - **Markdown**: Content format (H1 heading + prose)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | New markdown file test-mahrz4.md will be created in root directory alongside 180+ existing markdown files |
  | content_generators.py | None | Uses existing helper functions (no modifications needed) |
  | Feature Modules | Low | No existing feature module changes; architecture supports this pattern already |
  | Git History | High | New commit will be added to feature branch with conventional commit message |
  | CI/CD Workflows | None | No .github/workflows changes needed (existing workflows handle markdown files) |

  ## Dependencies

  **Existing Infrastructure (No New Dependencies Required):**
  - `sheep.content_generators.generate_markdown_content()` - LLM-based content generation
  - `sheep.content_generators.write_markdown_file()` - File I/O with proper encoding
  - `sheep.content_generators.validate_markdown_file()` - Format validation
  - `sheep.content_generators.commit_markdown_file()` - Git operations
  - `sheep.content_generators.push_markdown_file()` - Remote push
  - `sheep.config.llm.get_reasoning_llm()` - LLM configuration
  - `sheep.observability.logging.get_logger()` - Structured logging

  ## Size Estimate

  **S (Small - Hours)** — This is a straightforward single-file creation task:

  - **Content Generation**: Already implemented in `content_generators.py` - use existing `generate_markdown_content()` function to generate H1 heading + 2-3 sentences via Claude API
  - **File Creation**: Use existing `write_markdown_file(content, "test-mahrz4.md")` helper - writes to repository root with UTF-8 encoding and Unix LF line endings
  - **Validation**: Use existing `validate_markdown_file(filepath)` - ensures H1 heading, 2-3 sentence count, proper encoding
  - **Git Operations**: Use existing `commit_markdown_file()` and `push_markdown_file()` helpers - stages, commits with conventional message, and pushes to remote
  - **No Infrastructure Changes**: No modifications to build system, dependencies, configuration, or CI/CD needed

  **Effort Justification**: Can be implemented in <2 hours by calling 5 existing helper functions in correct sequence. Follows exact pattern from 181 preceding features, with only the filename (`test-mahrz4.md`) and feature number (182) changing.
