content: |
  ## Summary

  This task breakdown implements Feature 182 (markdown-file-creation-c23705) through 10 ordered tasks across 3 phases.

  **Phase 1: Module Setup (30 minutes, Task 1)**
  - Create feature module file with constants and imports
  - Establish foundation for orchestration function

  **Phase 2: Implementation (2 hours 30 minutes, Tasks 2-8)**
  - Task 2: File existence check (20 min) — prevents overwrites
  - Task 3: Content generation (20 min) — calls LLM via helper
  - Task 4: File write (20 min) — persists with UTF-8 + Unix LF
  - Task 5: Validation (20 min) — verifies specification compliance
  - Task 6: Git commit (20 min) — stages and commits
  - Task 7: Git push (20 min) — pushes to remote
  - Task 8: Main orchestration (30 min) — integrates all 5 steps

  **Phase 3: Testing & Validation (1 hour 15 minutes, Tasks 9-10)**
  - Task 9: Integration test (45 min) — validates end-to-end feature
  - Task 10: Specification verification (30 min) — checks all requirements

  ## Implementation Flow

  Each task follows TDD (RED-GREEN-REFACTOR):
  1. Write test first (RED) — test fails because code doesn't exist
  2. Implement minimum code to pass test (GREEN) — code is simple, test passes
  3. Clean up and improve (REFACTOR) — add logging, error handling, documentation

  Tasks have clear dependencies:
  - Task 1 (module setup) is prerequisite for all others
  - Task 2 (file check) comes before generation (prevent useless LLM calls)
  - Tasks 3-7 execute in sequence (generate → write → validate → commit → push)
  - Task 8 integrates all steps into main function
  - Tasks 9-10 test and verify the completed implementation

  ## Key Implementation Details

  **File Existence Check (Task 2):**
  - Only custom logic needed beyond existing helpers
  - Uses `Path(MARKDOWN_FILENAME).exists()` from pathlib
  - Raises `ValueError` with helpful message if file exists
  - Executes before expensive LLM call for fail-fast behavior

  **Content Generation (Task 3):**
  - Calls existing `generate_markdown_content()` helper
  - No custom LLM prompts or response parsing needed
  - Helper handles Claude API integration, validation, error handling
  - Logs content details at DEBUG level for observability

  **File Write (Task 4):**
  - Calls existing `write_markdown_file()` helper
  - Helper enforces UTF-8 encoding and Unix LF line endings
  - Helper validates filename for safety (path traversal prevention)
  - No manual encoding/line ending handling needed

  **Validation (Task 5):**
  - Calls existing `validate_markdown_file()` helper
  - Validates all specification requirements (H1, sentences, encoding, line endings)
  - Strict validation: exactly 2-3 sentences (not "at least 2")
  - Rejects CRLF, BOM, non-UTF-8 content

  **Git Operations (Tasks 6-7):**
  - Calls existing `commit_markdown_file()` and `push_markdown_file()` helpers
  - Conventional commit message: `feat(182): Create markdown file test-mahrz4.md with prose content`
  - Helpers handle git add, commit, push with proper error handling
  - Upstream tracking (-u flag) set automatically for first push

  **Orchestration (Task 8):**
  - Main function integrates all 5 steps in sequence
  - Early failure prevents subsequent steps (fail-fast)
  - Comprehensive logging at INFO/DEBUG/ERROR levels
  - Return dictionary with all operation results

  ## Estimated Effort

  - Phase 1: 30 minutes (module setup)
  - Phase 2: 2 hours 30 minutes (5-step orchestration)
  - Phase 3: 1 hour 15 minutes (testing + verification)
  - **Total: 4 hours**

  The estimate accounts for:
  - Writing code with proper error handling and logging
  - Writing comprehensive integration tests
  - Manual verification against specification
  - Refactoring for code quality and clarity
  - Troubleshooting any issues found during testing
