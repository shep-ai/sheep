content: |
  ## Architecture Overview

  This feature follows the established pattern used across features 001-181. The architecture consists of:

  **Module Structure:**
  - Single feature module: `feature_182_markdown_file_creation.py` in `src/sheep/features/`
  - Module constants at the top: `FEATURE_NUMBER = 182`, `MARKDOWN_FILENAME = "test-mahrz4.md"`, `COMMIT_MESSAGE = "feat(182): Create markdown file test-mahrz4.md with prose content"`
  - Main orchestration function: `create_feature_182_markdown_file(repo_path=None) -> dict[str, str]`
  - Structured logging via `sheep.observability.logging.get_logger()` at INFO/DEBUG/ERROR levels
  - Return value: Dictionary with `filepath`, `content`, `commit_message`, `push_result`

  **Orchestration Pattern (5-Step Workflow):**
  1. **Generate** — Call `generate_markdown_content()` to create H1 heading + 2-3 sentences via Claude API
  2. **Write** — Call `write_markdown_file(content, MARKDOWN_FILENAME)` to persist to disk with UTF-8 encoding and Unix LF line endings
  3. **Validate** — Call `validate_markdown_file(filepath)` to verify all specification requirements (H1 format, sentence count, encoding, line endings)
  4. **Commit** — Call `commit_markdown_file(filepath, content, repo_path, COMMIT_MESSAGE)` to stage and commit with conventional message
  5. **Push** — Call `push_markdown_file(repo_path)` to push to remote feature branch

  **Integration Points:**
  - `sheep.content_generators.generate_markdown_content()` — LLM-based content generation
  - `sheep.content_generators.write_markdown_file()` — UTF-8 file I/O with safety checks
  - `sheep.content_generators.validate_markdown_file()` — Comprehensive format validation
  - `sheep.content_generators.commit_markdown_file()` — Git staging and commit
  - `sheep.content_generators.push_markdown_file()` — Git push to remote
  - `sheep.observability.logging.get_logger()` — Structured logging
  - `pathlib.Path` — Cross-platform file path operations

  **Custom Logic Required:**
  Only one piece of custom logic is needed beyond orchestrating existing helpers:
  - **File Existence Check** — Before calling `generate_markdown_content()`, check if `test-mahrz4.md` already exists using `Path(MARKDOWN_FILENAME).exists()`. Raise `ValueError` with clear message if the file exists, preventing accidental overwrites and satisfying the "Error and refuse to overwrite" requirement.

  This approach provides defensive programming, clear diagnostics, and consistency with the specification requirement.

  ## Key Design Decisions

  All design decisions have been validated through research findings from the codebase analysis. This section summarizes the rationale:

  ### 1. Content Generation via Existing Helper Function

  **Chosen:** Use `generate_markdown_content()` from `sheep.content_generators`

  **Rationale:**
  - Proven across 181 preceding features with validated, tested implementation
  - Correctly integrates with CrewAI LLM framework using Claude reasoning model at temperature 0.2
  - Handles response parsing, format validation (H1 heading + 2-3 sentences), and error handling
  - Ensures consistency across the entire feature series and reduces implementation risk
  - Alternative of custom generation logic would duplicate proven code and violate DRY principles

  ### 2. File I/O with UTF-8 Encoding & Unix Line Endings

  **Chosen:** Use `write_markdown_file(content, filename)` from `sheep.content_generators`

  **Rationale:**
  - Enforces UTF-8 encoding at the file handle level: `open(file_path, "w", encoding="utf-8")`
  - Maintains Unix LF line endings across all platforms through Python's text mode (no CRLF translation)
  - Validates filename for safety (rejects path traversal attempts)
  - Includes post-write verification to ensure file creation success
  - Integrated structured logging for observability
  - Tested and proven across 181 prior features

  ### 3. Strict Validation (Exactly 2-3 Sentences)

  **Chosen:** Use `validate_markdown_file()` with strict sentence count validation

  **Rationale:**
  - Validates all specification requirements: UTF-8 encoding, Unix LF line endings, H1 heading format, blank line separator, exactly 2-3 sentences
  - Detects and rejects CRLF line endings, BOM markers, and non-UTF-8 encoding
  - Provides clear, actionable error messages for debugging
  - Ensures consistent output quality across all 182+ generated files
  - Strict adherence (exactly 2-3 sentences, not "at least 2") maintains specification integrity

  ### 4. Git Workflow with Conventional Commits

  **Chosen:** Use `commit_markdown_file()` and `push_markdown_file()` helpers with conventional commit format

  **Rationale:**
  - Leverages CrewAI's BaseTool framework with proper input validation and error handling
  - Conventional commit format: `feat(182): Create markdown file test-mahrz4.md with prose content` ensures consistency with Sheep ecosystem
  - `GitCommitTool` handles `git add -A` before commit for atomic staging
  - `GitPushTool` auto-detects current branch and sets upstream tracking (`-u` flag)
  - Both tools use subprocess with `check=True` for proper exception propagation
  - Proven pattern across 181 prior features

  ### 5. Fail-Fast Error Handling with Structured Logging

  **Chosen:** Fail immediately on any operation failure with structured error logging

  **Rationale:**
  - Appropriate for this deterministic task (failures indicate systematic issues, not transient conditions)
  - Structured logging via `get_logger()` provides rich context for debugging (function name, operation description, error details)
  - Exception propagation allows the feature module to handle and report errors appropriately
  - Clear, immediate failure signals enable faster diagnosis and resolution
  - Consistent with error handling pattern across 181 prior features

  ### 6. File Existence Check (Custom Logic)

  **Chosen:** Add explicit check before content generation using `Path(MARKDOWN_FILENAME).exists()`

  **Rationale:**
  - Prevents accidental data loss or unintended overwrites (safety-first approach)
  - Fails early in the workflow before expensive LLM call
  - Clear error message directs user to investigate existing state
  - Defensive programming practice consistent with specification requirement "Error and refuse to overwrite"
  - Research noted that existing `write_markdown_file()` helper doesn't include this check, so feature module adds it

  ### 7. Module Organization and Naming

  **Chosen:** Create `feature_182_markdown_file_creation.py` following pattern from features 001-181

  **Rationale:**
  - Consistency with established naming convention across entire feature series
  - Provides clarity and modularity (each feature is independent, testable module)
  - Allows for parallel feature development without merge conflicts
  - Enables pattern reuse across 180+ features demonstrates robustness of approach
  - Clear namespace organization (`src/sheep/features/`) separates feature implementations from core library code

  ## Implementation Strategy

  **Phase 1: Module Setup & Foundation (30 minutes)**
  - Create `src/sheep/features/feature_182_markdown_file_creation.py`
  - Add module-level constants: `FEATURE_NUMBER`, `MARKDOWN_FILENAME`, `COMMIT_MESSAGE`
  - Add imports from existing helpers and logging infrastructure
  - Add module docstring describing the feature and orchestration pattern
  - Establish skeleton for main function

  **Phase 2: Implementation & Orchestration (1 hour 15 minutes)**
  - Implement file existence check with clear error message
  - Implement main `create_feature_182_markdown_file(repo_path=None)` function
  - Wire up all five steps (generate → write → validate → commit → push)
  - Add structured logging at INFO level for each step (operation start, completion, duration)
  - Add DEBUG level logging for intermediate state (content length, file paths, git output)
  - Add comprehensive error handling with try-except blocks
  - Return dictionary with required fields: `filepath`, `content`, `commit_message`, `push_result`

  **Phase 3: Testing & Validation (45 minutes)**
  - Write integration test validating the feature end-to-end
  - Test successful file creation, git commit, and push workflow
  - Test error cases (file already exists, LLM timeout, git failure)
  - Verify against all specification acceptance criteria
  - Manual validation: check file encoding, line endings, content structure
  - Verify git commit message follows conventional format
  - Verify file was pushed to feature branch

  **Why This Order:**
  1. Module setup first to establish foundation and structure
  2. Implementation second to build core orchestration logic
  3. Testing last to validate completed implementation against specification

  This ordering ensures:
  - Clear foundation before implementation complexity
  - Implementation is complete before testing
  - Tests serve as specification verification
  - Issues found in testing can be addressed in implementation without reorganization

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | LLM API timeout or failure | High | Fail-fast error handling with structured logging provides clear diagnostics. Caller can retry or investigate API status. This is consistent with 181 prior features. |
  | File already exists at target path | Medium | Explicit file existence check before content generation. Raises clear ValueError with filename. User must explicitly clean up before retry. Prevents silent data loss. |
  | Git operation failure (commit/push) | Medium | Both `commit_markdown_file()` and `push_markdown_file()` are proven helpers with proper error handling. subprocess.run() uses check=True for exception propagation. Clear git error messages in logs. |
  | UTF-8 encoding or line ending issues | Low | Both `write_markdown_file()` and `validate_markdown_file()` enforce and verify encoding/line endings. Validation catches any issues before git commit. Proven across 181 prior features. |
  | Incorrect sentence count in generated content | Low | `validate_markdown_file()` uses strict validation (exactly 2-3 sentences). Rejects content that doesn't meet specification. Validation failure causes feature to fail fast. |
  | Pattern divergence from features 001-181 | Medium | Implementation follows exact pattern from established features (same module location, naming, function signature, constants, logging, return format). Code review against prior features before merge. |
  | Module import issues or missing dependencies | Low | All dependencies (CrewAI, pathlib, logging, git tools) are existing, proven infrastructure. No new packages or configuration required. Import errors would surface immediately in testing phase. |

  ## Success Criteria

  Implementation is complete and ready for review when:
  - [ ] Feature module `feature_182_markdown_file_creation.py` exists in `src/sheep/features/`
  - [ ] Module has required constants: `FEATURE_NUMBER = 182`, `MARKDOWN_FILENAME = "test-mahrz4.md"`, `COMMIT_MESSAGE` with conventional format
  - [ ] Main function `create_feature_182_markdown_file(repo_path=None)` is implemented
  - [ ] File existence check prevents overwrite and raises clear ValueError
  - [ ] All five orchestration steps are implemented with structured logging
  - [ ] Integration tests validate end-to-end workflow and error cases
  - [ ] Generated file `test-mahrz4.md` meets all specification requirements:
    - Exists in repository root
    - Contains exactly one H1 heading (line starting with `# `)
    - Contains exactly 2-3 sentences after heading
    - UTF-8 encoded with Unix (LF) line endings
    - Passes `validate_markdown_file()` validation
  - [ ] Git commit created with correct conventional message
  - [ ] Changes pushed to feature branch
  - [ ] All tests pass
  - [ ] Code follows established pattern from features 001-181
