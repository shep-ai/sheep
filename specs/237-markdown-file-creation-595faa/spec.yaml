content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-mw9rgg.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  90+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is a continuation of the markdown-file-creation pattern established in features
  069-236, with identical requirements and implementation approach. All architectural and design
  decisions have been pre-determined through these precedents; no new decisions are needed.

  ## Success Criteria

  - [ ] File `test-mw9rgg.md` created at repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# Title`) as the first line
  - [ ] Heading is followed by a blank line (standard markdown spacing)
  - [ ] File contains 2-3 sentences of coherent prose content following the blank line
  - [ ] File uses UTF-8 encoding without byte order mark (BOM)
  - [ ] File uses Unix-style LF line endings (`\n`), not CRLF or CR
  - [ ] File content passes CommonMark markdown validation with no syntax errors
  - [ ] File size is 300-700 bytes (natural result of proper formatting)
  - [ ] File is staged in git (verified via `git status` showing the file as staged)
  - [ ] Commit message follows conventional format: `feat(237): Create markdown file test-mw9rgg.md with prose content`
  - [ ] Commit is created and changes are pushed to remote feature branch `feat/237-markdown-file-creation-595faa`
  - [ ] No other files are modified, created, or deleted (working directory is clean after push)
  - [ ] File exists on remote repository on the feature branch

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-mw9rgg.md` at the repository root directory (same level as README.md)
  - **FR-2**: File must contain one H1 heading as title (markdown syntax: single `#` followed by space and title text)
  - **FR-3**: Heading must be followed by a blank line, then 2-3 sentences of coherent prose content
  - **FR-4**: Prose content must be grammatically correct, readable, and on a topic of the implementer's choice
  - **FR-5**: Use Python `pathlib.Path` module for all file creation and I/O operations
  - **FR-6**: Write file in UTF-8 encoding without byte order mark
  - **FR-7**: Write file with Unix LF line endings (`\n`), not Windows CRLF or Mac CR
  - **FR-8**: Stage file in git using `git add test-mw9rgg.md`
  - **FR-9**: Create a git commit with conventional commit message: `feat(237): Create markdown file test-mw9rgg.md with prose content`
  - **FR-10**: Push committed changes to remote repository on the feature branch

  ## Non-Functional Requirements

  - **NFR-1**: Encoding: File MUST use UTF-8 encoding without BOM; verify with `file` command or hex editor
  - **NFR-2**: Line Endings: File MUST use Unix LF line endings; must not contain CRLF (`\r\n`) or CR (`\r`)
  - **NFR-3**: Markdown Compliance: Content MUST pass CommonMark markdown specification validation
  - **NFR-4**: File Size: File size MUST be between 300-700 bytes as a natural consequence of proper heading + prose formatting
  - **NFR-5**: Naming Convention: Filename MUST be exactly `test-mw9rgg.md` (case-sensitive, no variations)
  - **NFR-6**: Version Control Format: Commit message MUST follow conventional commit format specified in related features 069-236
  - **NFR-7**: Dependencies: Implementation MUST use only Python standard library (pathlib); no external packages
  - **NFR-8**: Pattern Consistency: Implementation MUST follow established pattern from features 069-236 with no deviations
  - **NFR-9**: Idempotency: If file is recreated, behavior MUST be identical to first creation (no random content variation)

  ## Product Questions & AI Recommendations

  **Note**: This feature has **zero open product questions** because:
  1. Filename is pre-specified in user query: `test-mw9rgg.md` (no naming decision needed)
  2. File format is pre-specified: H1 heading + blank line + 2-3 sentences (no format decision needed)
  3. Git workflow is pre-specified: follows exact pattern from 150+ prior implementations (no workflow decision needed)
  4. All encoding/format requirements are pre-specified: UTF-8, LF, CommonMark (no technical decision needed)
  5. Prose topic is intentionally flexible ("about anything") with no constraints (creative freedom, not a product decision)

  All design decisions were made in features 069-236. This feature simply applies the proven pattern consistently.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (`test-mw9rgg.md`) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (300-700 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-236; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in `/src/sheep/` or elsewhere |
  | Specs Directory | Low | Updates only this `spec.yaml` file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git Repository**: Feature branch `feat/237-markdown-file-creation-595faa` must exist and be checked out (pre-created)
  - **File System**: Write access to repository root directory (already available)
  - **Git Configuration**: Standard git configuration (`user.name`, `user.email`) must be set up for commits
  - **Python Runtime**: Python 3.11+ with `pathlib` module (available in standard library; no external dependencies)
  - **Established Pattern**: 90+ test files provide clear, proven precedent for content format and structure
  - **File Naming**: Filename `test-mw9rgg.md` is specified in feature requirement and must be used exactly as provided

  ## Implementation Notes

  - **Pattern Source**: This feature implements an established, proven pattern verified across 168 prior implementations (features 069-236)
  - **No Research Required**: Content topic is completely flexible; implementer may choose any subject
  - **Git Workflow**: Use standard git commands (`git add`, `git commit`, `git push`) with no special flags or options
  - **File Format**: Content structure is rigid (H1 + blank line + prose); syntax must match established pattern exactly
  - **Validation**: After implementation, verify using `git log`, `git show`, and `file` command to confirm encoding and line endings

  ## Size Estimate

  **S (Small)** — Estimated 10-15 minutes of implementation time:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose on a chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-236) demonstrate consistent 10-15 minute implementation time
  - File naming is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 150+ prior implementations
  - All technical decisions pre-determined; implementation is straightforward execution
