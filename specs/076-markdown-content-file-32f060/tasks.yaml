content: |
  ## Status

  - **Phase:** Task Breakdown (Complete)
  - **Updated:** 2026-03-17

  ## Implementation Workflow

  ### Phase 1: File Creation & Content Preparation (10-15 min)

  **Task 1** creates the markdown file with hardcoded prose content. Implementer chooses prose topic
  freely (any topic acceptable). Content is written with pathlib.Path.write_text() using explicit
  UTF-8 encoding and Unix-style LF line endings.

  ### Phase 2: Comprehensive Validation (50-60 min total, ~8-10 min per task)

  **Tasks 2-6** validate file properties before git operations:
  - **Task 2:** Verify UTF-8 encoding without BOM
  - **Task 3:** Verify Unix LF line endings (no CRLF)
  - **Task 4:** Verify markdown structure (H1 + blank line)
  - **Task 5:** Verify prose content (2-3 sentences via punctuation)
  - **Task 6:** Verify file size (300-650 bytes)

  Validation functions can be implemented separately then combined into a master validate_file()
  function that performs all checks in sequence. Each check is simple and deterministic;
  combined overhead is negligible (<10ms for ~400 byte file).

  ### Phase 3: Git Integration (24-30 min total, ~8 min per task)

  **Tasks 7-9** implement standard git workflow:
  - **Task 7:** Stage file with `git add test-3nslmx.md`
  - **Task 8:** Commit with `git commit --no-verify -m "feat(076): ..."`
  - **Task 9:** Push with `git push -u origin HEAD`

  Each git operation uses subprocess.run() with check=True for transparent execution and
  exception on failure. Operations can be combined into a unified git_workflow() function
  that orchestrates all three sequentially.

  ## Dependency Graph

  ```
  Task 1 (File Creation)
      ↓
  Task 2 (Encoding Validation)
      ↓
  Task 3 (Line Ending Validation)
      ↓
  Task 4 (Structure Validation)
      ↓
  Task 5 (Sentence Count Validation)
      ↓
  Task 6 (File Size Validation)
      ↓
  Task 7 (Git Add)
      ↓
  Task 8 (Git Commit)
      ↓
  Task 9 (Git Push)
  ```

  All tasks are sequential. Each task depends on the previous; no parallel work possible.

  ## TDD Cycle Pattern

  Each task follows RED-GREEN-REFACTOR:

  1. **RED:** Write a test assertion that fails (e.g., "Assert file exists")
  2. **GREEN:** Implement minimal code to pass the test
  3. **REFACTOR:** Clean up code — extract constants, improve naming, combine related logic

  Example:
  - **RED:** `assert Path("test-3nslmx.md").exists()`
  - **GREEN:** `Path("test-3nslmx.md").write_text(CONTENT, encoding="utf-8")`
  - **REFACTOR:** Define FILENAME constant, add comments explaining prose content choice

  ## Effort Breakdown

  | Phase | Tasks | Time |
  | ----- | ----- | ---- |
  | Phase 1: File Creation | Task 1 | 10-15 min |
  | Phase 2: Validation | Tasks 2-6 | 40-50 min (8-10 min each) |
  | Phase 3: Git Integration | Tasks 7-9 | 24-30 min (8 min each) |
  | **Total** | **9 tasks** | **45-60 min** |

  Effort aligns with spec size estimate of **S** (simple content creation with minimal logic).

  ## Implementation Notes

  ### Reusable Validation Functions

  Validation functions (Tasks 2-6) can be combined into a reusable validation module:

  ```python
  def validate_markdown(filename):
      """Validate markdown file structure, encoding, and content."""
      validate_encoding(filename)
      validate_line_endings(filename)
      validate_structure(filename)
      validate_sentence_count(filename)
      validate_file_size(filename)
  ```

  This pattern matches feature 069's validate_markdown.py module and can be reused or adapted
  for future similar features.

  ### Git Workflow Integration

  Git operations (Tasks 7-9) can be combined into orchestration function:

  ```python
  def git_workflow(filename, message):
      """Stage, commit, and push file with given message."""
      stage_file(filename)
      commit_file(filename, message)
      push_commit()
  ```

  This follows the pattern: create → validate → git_workflow(file, conventional_message).

  ## Success Criteria

  Feature is complete when:
  - All 9 tasks are in state: Completed
  - File test-3nslmx.md exists at repository root
  - File passes all validation checks (encoding, line endings, structure, sentence count, size)
  - File is committed with conventional message in git log
  - Commit is pushed to remote origin (visible on GitHub/origin)

