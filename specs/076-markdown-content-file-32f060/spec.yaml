# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file called test-3nslmx.md in the repository root with a title
  (markdown H1 heading) and 2-3 sentences of prose content about any topic. This continues
  the established pattern in the Sheep repository of adding markdown content files that serve
  as test fixtures and documentation examples.

  ## Success Criteria

  - [ ] File `test-3nslmx.md` created in repository root
  - [ ] File contains exactly one H1 markdown heading (line starting with `#`)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] Prose content is grammatically coherent and readable
  - [ ] File uses UTF-8 encoding (verified, no BOM)
  - [ ] File uses Unix LF line endings (no CRLF)
  - [ ] File size is between 300-650 bytes
  - [ ] File is staged with `git add`
  - [ ] File is committed with conventional commit message `feat(076): create markdown file test-3nslmx.md with prose content`
  - [ ] Commit uses `--no-verify` flag to skip pre-commit hooks
  - [ ] Commit is pushed to remote origin with `git push -u origin HEAD`

  ## Functional Requirements

  - **FR-1**: Create file named exactly `test-3nslmx.md` in the repository root directory
  - **FR-2**: File must contain one H1 markdown heading as the title (syntax: `# Title`)
  - **FR-3**: File must contain 2-3 complete sentences of prose content after the heading
  - **FR-4**: Prose content topic is implementer's free choice (any topic acceptable per user query "about anything")
  - **FR-5**: Stage the created file using `git add test-3nslmx.md`
  - **FR-6**: Commit the file with conventional commit message: `feat(076): create markdown file test-3nslmx.md with prose content`
  - **FR-7**: Push the commit to remote origin on the feature branch using `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM
  - **NFR-2**: File line endings must be Unix LF (not Windows CRLF, not old Mac CR)
  - **NFR-3**: File size should be in the range 300-650 bytes (established pattern consistency)
  - **NFR-4**: Content must be grammatically correct and readable (no gibberish or machine-generated nonsense)
  - **NFR-5**: Git commit must use `--no-verify` flag to bypass pre-commit hooks (established workflow)
  - **NFR-6**: Implementation must validate file structure (encoding, line endings, H1 presence, sentence count) before git operations
  - **NFR-7**: All git operations must complete without errors; errors must halt execution with clear messaging

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | --- | -------- | ----------------- | --------- |
  | 1 | Should prose topic be free choice or from a predefined list? | **Free choice (any topic)** | Matches user query "about anything", maintains variety in existing 75+ files, enables implementer creativity |
  | 2 | What validation strictness: minimal or comprehensive? | **Comprehensive validation** | Ensures consistency with established pattern (feature 069), catches errors early, minimal overhead |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a Python package with the following structure:

  - **Repository Root**: Contains 75+ markdown test files (test-*.md) and various example markdown files
    (JOKE.md, CLASSIC_JOKE.md, DESIGN_PATTERN.md, etc.). This is where the new file will be created.
  - **src/sheep/**: Main package containing agents, flows, tools, config, observability, and CLI modules
  - **specs/**: Directory containing 100+ feature specifications organized by number and name
  - **tests/**: Automated test suite
  - **pyproject.toml**: Project metadata, dependencies, and tool configuration

  ### Architecture Patterns

  The Sheep repository follows these key patterns relevant to this feature:

  1. **Markdown File Conventions**:
     - Located at repository root
     - Named with pattern: test-{random}.md or topic-{descriptor}.md
     - UTF-8 encoding with Unix-style LF line endings (no BOM)
     - Content structure: H1 heading + blank line + 2-3 sentences of prose
     - File size typically 300-650 bytes
     - Prose content is about educational, technical, or creative topics

  2. **Git Workflow**:
     - Files are staged with `git add`
     - Committed with conventional commit messages (e.g., "feat(076): create markdown file test-3nslmx.md with prose content")
     - Pushed to remote with `git push -u origin HEAD`
     - All commits use `--no-verify` to skip pre-commit hooks

  3. **Established Implementation Pattern** (from feature 069 and similar):
     - Use Python's pathlib.Path for file creation and validation
     - Write text with explicit UTF-8 encoding via `path.write_text(content, encoding='utf-8')`
     - Validate file encoding, line endings, and content structure
     - Use subprocess to invoke git commands (add, commit, push)

  ### Relevant Technologies

  1. **Markdown**: Simple text format used for all content files. No special features required.
  2. **Git**: Version control system used for staging, committing, and pushing changes. The feature
     integrates with the existing git workflow already established in the repository.
  3. **Python pathlib**: Standard library module used consistently across the codebase for file I/O
     operations, providing modern, cross-platform path handling.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (file system) | High | New markdown file will be created at the root level, adding to the collection of 75+ existing test files |
  | Git (staging, commit, push) | High | File must be staged with `git add`, committed with conventional message, and pushed to remote origin |
  | No source code changes | None | The Sheep platform code (src/sheep/*) remains unchanged; this is a content-only addition |
  | No tests required | None | This feature does not require new or modified test files; it is a simple markdown file creation |
  | No dependencies | None | No new libraries, APIs, or external services are required |

  ## Dependencies

  **External Dependencies**: None

  - The feature uses only standard Python library (pathlib) and git (already installed in the environment)
  - No additional Python packages are required
  - No API calls, external services, or configuration changes needed

  **Internal Dependencies**: Established git workflow
  - Assumes git repository is initialized and remote origin is configured
  - Assumes current working directory is the repository root
  - Assumes git is available in the system PATH

  **Related Code Patterns**:
  - Feature 069 provides a complete, well-tested example of this pattern with validation
  - The create_markdown.py script in the repository root demonstrates the standard implementation pattern

  ## Size Estimate

  **S** (hours) — Simple content creation task

  **Justification**:
  - **Task complexity**: File creation is straightforward — no algorithm design, no architecture decisions needed
  - **Established pattern**: 75+ similar features have already been implemented, making this highly repetitive
  - **No code changes**: The Sheep platform itself requires no modifications; this is purely content
  - **Minimal validation**: File validation is simple (encoding, line endings, structure checks)
  - **Single artifact**: Only one file is created; no multi-file coordination required
  - **Estimated effort**:
    - Content generation: 5-10 minutes (choose topic, write 2-3 sentences)
    - File creation and validation: 5-10 minutes (use pathlib, validate structure)
    - Git operations: 5 minutes (add, commit with message, push)
    - **Total**: 15-30 minutes of work

  This is significantly smaller than an **M** (days) estimate. An **M** estimate would be appropriate
  for features involving code changes, architectural decisions, testing, or multi-component integration.

