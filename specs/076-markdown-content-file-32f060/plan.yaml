# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning (Complete)
  - **Updated:** 2026-03-17

  ## Architecture Overview

  ### Pattern Consistency

  Feature 076 follows the established markdown-file-creation pattern confirmed across 75+ existing
  test files in the Sheep repository:

  1. **Single file creation** at repository root with fixed naming (test-{random}.md)
  2. **Fixed content format**: H1 heading + blank line + 2-3 sentences of prose
  3. **Hardcoded prose** (~300-650 bytes) with implementer-chosen topic
  4. **Comprehensive validation** before git operations ensures format compliance
  5. **Standard git workflow**: add → commit (--no-verify) → push (HEAD)
  6. **Zero platform source code impact** — purely artifact creation

  ### Reference Implementation

  Feature 069 (markdown-file-creation) provides well-tested precedent:
  - pathlib.Path.write_text() for file creation with explicit UTF-8 encoding
  - Binary read + text read for comprehensive encoding/line-ending validation
  - Sentence counting via punctuation (., ?, !)
  - subprocess.run() for transparent git command execution
  - Validation before git operations per spec NFR-6

  Feature 076 directly follows this proven pattern, adapted for prose content of free choice.

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib.Path

  **Chosen:** pathlib.Path.write_text(encoding='utf-8')

  **Rationale:**
  - Mandated by spec (NFR-1) and confirmed in feature 069
  - Modern, idiomatic Python 3.11+ API
  - Single method encapsulates file creation, writing, closing, encoding
  - Cross-platform path handling
  - Explicit encoding parameter ensures UTF-8 compliance

  **Alternatives Rejected:**
  - os.open() / os.write(): Verbose, requires manual file descriptor management
  - open() built-in: Requires context manager or explicit close(); less modern than pathlib

  ### 2. Git Integration: subprocess.run()

  **Chosen:** subprocess.run() for hardcoded git commands (add, commit, push)

  **Rationale:**
  - Python standard library (zero new dependencies)
  - Simple, transparent execution of three sequential git commands
  - Proper error handling via CalledProcessError with check=True
  - No abstraction overhead; subprocess is sufficient and idiomatic for simple operations
  - Proven in feature 069

  **Alternatives Rejected:**
  - GitPython library: Unnecessary abstraction for straightforward sequential operations
  - Shell invocation: Less portable, harder error handling, requires escaping

  ### 3. Content Strategy: Hardcoded Prose with Comprehensive Validation

  **Chosen:** Hardcoded prose string (~300-650 bytes) + comprehensive validation before git ops

  **Rationale:**
  - Format is fixed and small; hardcoding is simpler than generation
  - Guarantees format compliance (H1 + blank line + N sentences)
  - Matches all 75+ existing test files (all hardcoded content)
  - Aligns with feature 069's validated approach
  - Comprehensive validation (per spec NFR-6) catches structural errors early
  - Validation overhead is negligible (~10ms for ~400 byte file)
  - Implementer chooses prose topic freely (spec resolves to "free choice")

  **Alternatives Rejected:**
  - Template-based generation: Adds complexity for fixed-format content
  - Minimal validation (encoding only): Contradicts spec NFR-6, risks format non-compliance
  - External prose generation: Adds file I/O complexity; contradicts established pattern

  ### 4. Sentence Counting: Punctuation-Based Method

  **Chosen:** Simple count of sentence-ending punctuation (., ?, !)

  **Rationale:**
  - Reliable for well-formed, manually-authored prose
  - Fast and deterministic (no NLP dependencies)
  - Proven in feature 069 and validate_markdown.py module
  - Sufficient for hardcoded, carefully-crafted content
  - Catches common authoring errors (missing punctuation, too many sentences)

  **Alternatives Rejected:**
  - No sentence validation: Risks format non-compliance
  - Complex NLP (NLTK, spaCy): Overkill for simple prose; adds external dependencies

  ### 5. Line Ending Handling: Explicit Unix LF

  **Chosen:** Hardcode '\n' in prose string; verify with binary read after write

  **Rationale:**
  - Spec NFR-2 requires Unix LF line endings (not CRLF)
  - pathlib.Path.write_text() preserves newlines in source string
  - Python string literals use '\n' for Unix line endings by default
  - Binary validation reads file as bytes, checks for absence of '\r\n' (CRLF)
  - Ensures consistent output across Windows/macOS/Linux

  **Alternatives Rejected:**
  - Platform-native line endings: Violates spec NFR-2
  - Post-write normalization with .replace(): Unnecessary; proper write handles this

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 → Phase 2 → Phase 3** follows logical progression:

  1. **Phase 1 (File Creation):** Create artifact first. File must exist before validation or git operations.
  2. **Phase 2 (Validation):** Validate before git operations. Catches errors early; prevents invalid commits.
  3. **Phase 3 (Git):** Git operations last. By this point, file is guaranteed valid per spec requirements.

  This ordering aligns with TDD principles: create artifact → test all properties → commit validated result.

  ### Validation Scope (Phase 2)

  Comprehensive validation checks include:
  - **Encoding:** Read file as binary; verify no BOM byte sequence; re-read as text UTF-8
  - **Line Endings:** Scan binary for CRLF ('\r\n'); assert only LF ('\n')
  - **Structure:** First line must start with '# ' (H1); second line must be blank
  - **Sentence Count:** Count '.', '?', '!' in prose section; assert count in [2, 3]
  - **File Size:** Assert file size in range 300-650 bytes (established pattern)

  These checks ensure consistency with 75+ existing files and catch errors before commit.

  ### Git Workflow (Phase 3)

  Three subprocess.run() calls in sequence:
  1. `git add test-3nslmx.md` — stage the file
  2. `git commit --no-verify -m "feat(076): create markdown file test-3nslmx.md with prose content"` — commit
  3. `git push -u origin HEAD` — push to remote

  All commands use check=True for exception on failure; errors halt execution with clear messaging.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding not UTF-8 | Explicit encoding='utf-8' in write_text(); binary validation confirms no BOM |
  | Line ending inconsistency (CRLF on Windows) | Use explicit '\n' in prose string; binary validation confirms no CRLF |
  | Prose content violates structure (missing H1, wrong sentence count) | Hardcoded content + comprehensive validation before git ops ensures format compliance |
  | Git operations fail (remote unreachable, permission denied) | subprocess.run(..., check=True) raises exception; implementation halts with clear error message |
  | File already exists (name collision) | Feature spec uses exact name test-3nslmx.md; verify file doesn't exist before creation or overwrite intentionally |
  | Pre-commit hooks reject file | Use --no-verify flag per established workflow; bypasses hook validation |

  ## Effort Breakdown

  - **Phase 1 (File Creation):** 10-15 minutes (define prose, write to disk, implement pathlib logic)
  - **Phase 2 (Validation):** 20-30 minutes (implement 5-6 validation checks with test assertions)
  - **Phase 3 (Git Integration):** 10-15 minutes (subprocess calls, error handling, test assertions)
  - **Total estimate:** 40-60 minutes (consistent with spec "S" size estimate)

