# Structured technology decisions
decisions:
  - title: 'File I/O Library Selection'
    chosen: 'pathlib.Path (Python standard library)'
    rejected:
      - 'os module (os.open/os.write) — lower-level, more verbose, less idiomatic Python 3 compared to pathlib'
      - 'open() built-in function — requires manual file closing or context manager; pathlib.write_text() is cleaner'
    rationale: >
      NFR-1 (from feature spec) mandates use of pathlib for file I/O. pathlib provides a modern,
      object-oriented API that is idiomatic in Python 3.11+. Path.write_text() encapsulates
      file creation, writing, closing, and encoding in a single method call. This aligns with
      the established pattern confirmed in feature 069 and 75+ existing test files. Write with
      explicit encoding='utf-8' parameter ensures UTF-8 compliance across platforms.

  - title: 'Git Integration Method'
    chosen: 'subprocess.run() with git command-line interface'
    rejected:
      - 'GitPython library — adds abstraction overhead for simple sequential operations; subprocess is cleaner and built-in'
      - 'Direct shell invocation — less portable, harder error handling, requires shell escaping'
    rationale: >
      subprocess.run() is ideal for simple, sequential git operations (add, commit, push).
      It is part of Python standard library (zero new dependencies), provides transparent command
      execution with proper error handling via CalledProcessError, and requires no abstraction
      learning curve. Feature 069 validates this approach. For three straightforward git commands
      with no piping or conditionals, subprocess is sufficient and more explicit than abstractions.

  - title: 'Content Generation and Validation Strategy'
    chosen: 'Hardcoded prose content with comprehensive validation'
    rejected:
      - 'Template-based content generation — adds unnecessary complexity; format is fixed (H1 + 2-3 sentences)'
      - 'Minimal validation (encoding only) — comprehensive validation per NFR-6 catches errors early and ensures format compliance'
    rationale: >
      Hardcoding prose content (~300-650 bytes) ensures format compliance. Comprehensive validation
      (per NFR-6 in spec) includes: UTF-8 encoding verification, LF line ending verification,
      H1 heading presence, sentence count (2-3), and file size range. This approach:
      (1) Matches feature 069's validated pattern, (2) Ensures consistency with 75+ existing files,
      (3) Catches structural errors before git operations, (4) Has negligible overhead for simple
      format. The validate_markdown.py module in the repository provides reusable validation logic.

  - title: 'Sentence Count Validation Method'
    chosen: 'Simple sentence counting by punctuation (periods, question marks, exclamation marks)'
    rejected:
      - 'No validation — risks non-compliance if content is authored incorrectly'
      - 'Complex NLP-based sentence detection — overkill for simple prose; heuristic counting is sufficient'
    rationale: >
      Simple punctuation-based counting (count '.', '?', '!') provides reliable validation for
      well-formed prose. This approach: (1) Avoids complex NLP, (2) Is fast and deterministic,
      (3) Matches the validation pattern in validate_markdown.py and feature 069,
      (4) Catches common authoring errors (missing punctuation, too many sentences).
      Given hardcoded, carefully-authored content, this validation is conservative and reliable.

  - title: 'Line Ending Handling'
    chosen: 'Explicit UTF-8 with LF via pathlib.Path.write_text() using Unix-style newlines'
    rejected:
      - 'Platform-native line endings — violates NFR-2 requirement for Unix-style LF across all platforms'
      - 'Post-write normalization with .replace() — adds unnecessary processing; proper write mode handles this'
    rationale: >
      NFR-2 requires Unix-style LF line endings. pathlib.Path.write_text() with default encoding
      (UTF-8) and proper newline semantics ensures consistent output. Implementation approach:
      (1) Write prose string using explicit '\n' newlines in Python string, (2) Use Path.write_text()
      which honors the newlines in the string content, (3) Verify with binary read to confirm no
      CRLF conversion occurred (as in validate_markdown.py). This matches feature 069's approach.

  - title: 'Topic Selection for Prose Content'
    chosen: 'Flexible topic (implementer chooses any topic per spec resolution)'
    rejected:
      - 'Predefined topic list — reduces implementer autonomy; spec explicitly resolves to free choice'
    rationale: >
      Feature spec (openQuestions section) explicitly resolves prose topic to "Free choice (any topic)"
      with rationale: matches user query "about anything", maintains variety in 75+ existing files,
      enables implementer creativity. This design respects implementer preference while maintaining
      format rigor (H1 + 2-3 sentences). Format compliance is validated; topic choice is orthogonal
      to feature requirements.

