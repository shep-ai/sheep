content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-17
  - **Outcome:** All technical decisions finalized; architecture aligns with feature 069 precedent

  ## Technology Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** pathlib.Path (Python standard library)

  **Why:** Mandated in spec (NFR-1 per design). pathlib provides modern Python 3 API with
  Path.write_text() method that encapsulates file creation, writing, encoding, and closing.
  This is cleaner and more idiomatic than os module or open() built-in.

  **Alternatives Rejected:**
  - os.open() / os.write(): Lower-level, verbose, requires manual file descriptor management
  - open() built-in: Requires explicit close() or context manager; less modern than pathlib
  - pathlib was chosen in feature 069 (reference example) and validates across 75+ test files

  ### 2. Git Integration: subprocess.run()

  **Chosen:** subprocess.run() for git add/commit/push operations

  **Why:** subprocess is built-in (no new dependencies), transparent for simple operations,
  and provides proper error handling via CalledProcessError. For three straightforward git
  commands (add, commit, push) with no piping or conditionals, subprocess is ideal.

  **Alternatives Rejected:**
  - GitPython: While available in project dependencies, adds unnecessary abstraction; subprocess
    is sufficient and more transparent
  - Shell invocation: Less portable, harder error handling, requires careful escaping
  - subprocess was validated in feature 069

  ### 3. Content Generation: Hardcoded Prose String

  **Chosen:** Hardcoded prose content in source code (one H1 heading + 2-3 sentences)

  **Why:** Format is fixed and small (~300-650 bytes). Hardcoding: (1) Guarantees format compliance
  without needing complex validation, (2) Matches all 75+ existing test files (all hardcoded prose),
  (3) Eliminates runtime content generation complexity, (4) Aligns with feature 069 approach.

  **Alternatives Rejected:**
  - Template-based generation: Adds complexity (template engine, placeholders) for fixed-format content
  - External file loading: Adds file I/O and deployment complexity; contradicts established pattern
  - hardcoded approach was validated in feature 069

  ### 4. Validation Strategy: Comprehensive Checks

  **Chosen:** Comprehensive validation per NFR-6 — verify encoding, line endings, structure, sentence count, file size

  **Why:** NFR-6 explicitly requires validation before git operations. Comprehensive validation:
  (1) Catches structural errors early, (2) Ensures consistency with 75+ existing files,
  (3) Provides confidence in compliance before committing, (4) Overhead is negligible for ~400 byte file,
  (5) Matches feature 069's validated pattern.

  **Implementation approach:** Reuse or adapt validate_markdown.py module from repository:
  - UTF-8 encoding verification (no BOM)
  - LF line ending verification (no CRLF)
  - H1 heading presence on first line
  - Blank line after heading
  - Sentence count via punctuation (2-3 periods/question marks/exclamation marks)
  - File size range (350-650 bytes, typical 400-600)

  **Alternatives Rejected:**
  - Minimal validation (encoding only): Risks format non-compliance; violates NFR-6
  - No validation: Contradicts established pattern and spec requirements

  ### 5. Sentence Counting Method

  **Chosen:** Simple punctuation-based counting (count '.', '?', '!')

  **Why:** (1) Reliable for well-formed prose, (2) Fast and deterministic, (3) Matches validate_markdown.py
  module, (4) Avoids NLP complexity, (5) Works well with hardcoded, carefully-authored content.

  **Alternatives Rejected:**
  - No sentence counting: Risks format non-compliance
  - Complex NLP: Overkill for simple prose; heuristic is sufficient and was used in feature 069

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O | Use (mandatory) | Standard library, modern Python 3 API, specified in feature requirements (NFR-1) |
  | subprocess | Git integration | Use | Standard library, simple error handling, transparent command execution |
  | validate_markdown (local) | Validation logic | Use (adapt/reuse) | Module exists in repository; provides reusable validation functions for encoding, line endings, structure, sentences |
  | GitPython | Git abstraction | Don't use | Unnecessary abstraction for simple operations; subprocess is sufficient and has no external dependency cost |
  | External prose template engine | Content generation | Don't use | Hardcoding is simpler, matches established pattern; no external dependencies per spec |
  | NLP libraries (NLTK, spaCy) | Sentence detection | Don't use | Overkill for simple prose; punctuation-based counting is sufficient and matches established approach |

  ## Security Considerations

  **Threat Assessment: Negligible Risk**

  1. **File Creation Location:** test-3nslmx.md is created in repository root, a trusted location
     containing 75+ similar test files. File creation has no security risk.

  2. **Hardcoded Content:** All prose content is hardcoded in source; no user input is accepted,
     processed, or interpolated. This eliminates injection attacks, encoding issues, and
     malformed input concerns. Content is authored and reviewed before deployment.

  3. **File Path Handling:** Filename is hardcoded (test-3nslmx.md) and location is hardcoded
     (repository root via pathlib.Path()). No path traversal or directory escape possible.
     File creation is isolated within the repository.

  4. **Git Operations:** subprocess.run() executes hardcoded git commands (add, commit, push)
     with no user input interpolated. Commands are constructed as list arguments (avoiding
     shell interpolation). Minimal risk.

  5. **File Permissions:** File is created with default permissions (typically 644 on Unix,
     readable but not world-writable). Appropriate for a test file in a repository. No
     permission-based security concern.

  6. **Encoding Safety:** UTF-8 without BOM is a standard, safe encoding for text files.
     No endianness, byte-order, or transcoding concerns. BOM-free UTF-8 is expected for
     source files across POSIX and Windows systems.

  7. **Subprocess Injection:** No risk of command injection; commands and arguments are
     hardcoded with no variable interpolation. subprocess.run(list) invocation avoids
     shell interpretation.

  **Conclusion:** No security vulnerabilities identified. The feature is simple, hardcoded,
  isolated from user input, and uses only standard library functions.

  ## Performance Implications

  **Impact Assessment: Negligible**

  1. **File I/O:** Single write of ~300-650 bytes to disk. Execution time: <1ms on any
     modern system. No performance concern.

  2. **Validation Overhead:**
     - Encoding check: Single read_bytes() + read_text() call, <1ms
     - Line ending check: Binary scan for CRLF, <1ms
     - Structure check: String split and line indexing, <1ms
     - Sentence count: String count() for punctuation, <1ms
     - File size check: Single file stat, <1ms
     - Total validation: <10ms, negligible overhead

  3. **Subprocess Overhead:** Three subprocess.run() calls (git add, commit, push):
     - Each git command: ~10-50ms depending on system and git config
     - Network overhead (push): ~100-500ms depending on network latency
     - Total subprocess: ~150-600ms, expected and acceptable for git operations
     - No performance regression; this is intrinsic cost of git operations

  4. **Memory Usage:** O(1) constant memory:
     - One prose string: ~400 bytes
     - One Path object: minimal overhead
     - Validation state: minimal
     - No loops, recursion, or unbounded allocations
     - No memory leaks or performance degradation

  5. **Caching/Optimization:** Not applicable. Feature is one-time execution with no
     caching or optimization opportunities.

  **Conclusion:** Performance is not a concern. Feature is I/O-bound (file write + git network)
  and has negligible CPU cost.

  ## Architecture Notes

  ### Pattern Consistency with 75+ Existing Files

  This feature follows the well-established pattern observed in features 073-075 and
  the 75+ existing test files in the repository:

  1. **Single file creation at repository root** — no subdirectories, no complex structure
  2. **Fixed format:** H1 heading + blank line + 2-3 sentences of prose
  3. **Hardcoded, carefully-authored content** — deterministic, no runtime generation
  4. **Comprehensive validation before git operations** — ensures format compliance
  5. **Minimal git workflow** — add, commit with conventional message, push
  6. **No source code modifications** — purely file artifact creation
  7. **No external dependencies** — Python standard library only (pathlib, subprocess)
  8. **Flexible prose topic** — implementer chooses any topic maintaining format consistency

  ### Integration with Codebase

  - **Zero impact on /src/sheep/:** Feature does not depend on or modify application source
  - **Zero impact on tests/:** Feature does not modify or depend on test suite
  - **Zero impact on configuration:** Feature does not modify pyproject.toml, settings, or CI/CD
  - **Isolated artifact creation:** Feature produces single markdown file; no side effects
  - **Git-native workflow:** Uses standard git for staging and commits; no custom tooling
  - **Validation module:** May reuse validate_markdown.py from repository for consistency

  ### Reference Implementation: Feature 069

  Feature 069 (markdown-file-creation) provides a complete, well-tested reference implementation
  with established patterns. Feature 076 can follow this precedent directly:
  - File I/O with pathlib.Path.write_text()
  - Comprehensive validation using subprocess and standard library
  - Git integration via subprocess.run()
  - Hardcoded prose with explicit UTF-8 encoding
  - Unix-style LF line endings in source string

  ### Detailed Implementation Outline

  ```
  1. Define PROSE_CONTENT string with H1 heading + 2-3 sentences (implementer chooses topic)
  2. Define FILENAME = "test-3nslmx.md"
  3. Create markdown file: Path(FILENAME).write_text(PROSE_CONTENT, encoding='utf-8')
  4. Validate file:
     - Check UTF-8 encoding (no BOM)
     - Check LF line endings (no CRLF)
     - Check H1 heading on first line
     - Check blank line after heading
     - Count sentences via punctuation (2-3 required)
     - Check file size (350-650 bytes expected range)
  5. Stage file: subprocess.run(['git', 'add', FILENAME], check=True)
  6. Commit: subprocess.run(['git', 'commit', '--no-verify', '-m', msg], check=True)
  7. Push: subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  8. Exit with success message or raise exception with clear error message on failure
  ```

  ## Conclusion

  All technical decisions are straightforward and well-supported by the established pattern from
  feature 069 (reference example) and 75+ existing test files. Implementation requires only
  Python standard library (pathlib, subprocess) and standard git operations. No external
  libraries, no complex logic, no security or performance concerns. The feature is ready for
  design and implementation phases.

