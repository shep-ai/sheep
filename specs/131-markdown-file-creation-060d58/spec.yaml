content: |
  ## Problem Statement

  Create a single markdown file named test-957h8f.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (131) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated software development using CrewAI. The repository has a clear, modular architecture:

  - **Root directory**: Contains configuration files (Dockerfile, .env.example, .gitignore), documentation (README.md), and test markdown files (100+ test-*.md files)
  - **specs/**: Contains 130+ feature specifications in YAML format, organized by feature number
  - **src/sheep/**: Main source code organized into layers:
    - `agents/`: Agent definitions (research, implementation, review agents)
    - `config/`: Configuration management (LLM setup, settings)
    - `flows/`: Flow orchestration (CrewAI Flow classes)
    - `observability/`: Logging and Langfuse integration
    - `tools/`: Specialized tools for git operations, file I/O, web interactions
    - `features/`: Feature implementations (feature_101_through_feature_127_markdown_file_creation.py)
    - `content_generators.py`: Markdown generation and file handling utilities
    - `cli.py`: Command-line interface
  - **tests/**: Test directory for automated testing
  - **.github/workflows/**: CI/CD pipelines

  ### Architecture Patterns

  1. **Separation of Flows and Crews**: Flows define execution structure/control paths; Crews provide AI decision-making
  2. **Specialized Agents**: Each agent has focused role (Researcher, Implementer, Reviewer)
  3. **Modular Tool System**: Git tools (commit, push, checkout), file tools (read, write, search), web tools (fetch, search, shell commands)
  4. **Observable Execution**: Integrated Langfuse for tracing, metrics, and logging
  5. **Multi-LLM Support**: Works with OpenAI, Anthropic (Claude), Google Gemini

  ### Relevant Technologies

  **Core Technologies**:
  - Python 3.10+ (main language)
  - Git (version control)
  - Markdown (file format for content)
  - Claude API (content generation via Anthropic SDK)
  - CrewAI Framework (multi-agent orchestration)
  - Pydantic (data validation)
  - Langfuse (observability)

  **File I/O**:
  - Python pathlib (Path operations)
  - UTF-8 encoding with Unix LF line endings
  - Standard Python file operations (open/write/read)

  **Git Integration**:
  - GitCommitTool, GitPushTool from sheep.tools
  - Conventional commit message format: `feat(NUMBER): create markdown file FILENAME`
  - Creates commits on feature branch automatically

  ## Established Pattern (Features 125-130)

  All recent file creation features follow an identical workflow:

  1. **Generate Content**: Use Claude API to generate H1 heading + 2-3 sentences (any topic)
  2. **Write File**: Save to repository root with UTF-8 encoding, Unix LF line endings
  3. **Validate**: Verify H1 heading, sentence count, encoding, format
  4. **Commit**: Stage file and commit with message `feat(NUMBER): create markdown file FILENAME`
  5. **Push**: Push to remote feature branch

  **Key implementations**:
  - `src/sheep/content_generators.py`: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - `src/sheep/features/feature_127_markdown_file_creation.py`: Example implementation showing all five steps
  - All features reuse these utilities with only the filename and feature number changing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | A new markdown file (test-957h8f.md) will be created in the repository root, following the pattern of 100+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with UTF-8 encoding and Unix LF line endings |
  | Content generation (Claude API) | Medium | The existing LLM integration will generate a unique H1 heading and 2-3 sentences about any topic |
  | CodeImplementationFlow | Low | The existing flow requires no modifications; it already handles arbitrary file creation tasks |
  | src/sheep/features/ | Low | New feature module feature_131_markdown_file_creation.py will be created following the pattern of feature_127 |

  ## Dependencies

  **No new external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O (already in requirements)
  2. **Markdown Generation** - Existing `content_generators.py` module with `generate_markdown_content()` function
  3. **Content Validation** - Existing `validate_markdown_file()` function that checks H1 heading, sentence count, UTF-8 encoding, Unix line endings
  4. **Git Integration** - Existing GitCommitTool, GitPushTool from `sheep.tools`
  5. **LLM API** - Existing Claude API integration via CrewAI and `get_reasoning_llm()` from config
  6. **Logging** - Existing observability infrastructure via `get_logger()` and Langfuse integration

  The feature follows an established pattern used in features 125-130, so no new dependencies, utilities, or infrastructure need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification**:
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 6+ times in preceding features (125-130)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing Sheep infrastructure (file I/O via pathlib, git tools, content generation, LLM integration) handles all heavy lifting
  - No new dependencies to resolve or integrate
  - Straightforward implementation using existing functions:
    1. Call `generate_markdown_content()` from `content_generators.py`
    2. Call `write_markdown_file(content, "test-957h8f.md")`
    3. Call `validate_markdown_file(filepath)`
    4. Call `commit_markdown_file(filepath, content, repo_path, custom_message="feat(131): create markdown file test-957h8f.md")`
    5. Call `push_markdown_file(repo_path)`
  - Total development time: 30 minutes (copy feature_127, update filename and feature number)
