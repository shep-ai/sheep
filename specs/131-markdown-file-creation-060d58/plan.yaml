# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 131 follows the established pattern from features 125-130. The implementation consists of a single Python
  module (`feature_131_markdown_file_creation.py`) that orchestrates five existing utility functions from
  `content_generators.py`:

  1. **generate_markdown_content()** — Generate H1 heading + 2-3 sentences via Claude API
  2. **write_markdown_file()** — Write content to test-957h8f.md with UTF-8 encoding and Unix LF
  3. **validate_markdown_file()** — Strict validation: H1 present, 2-3 sentences, UTF-8, no BOM, Unix LF, correct format
  4. **commit_markdown_file()** — Create git commit with message "feat(131): create markdown file test-957h8f.md"
  5. **push_markdown_file()** — Push to feature branch with upstream tracking

  The module exports a single entry point: `create_feature_131_markdown_file(repo_path=None)`, which returns a
  dictionary containing the filepath, generated content, commit message, and push result.

  This orchestration pattern requires no modifications to existing utilities, no new dependencies, and no changes to
  the Sheep architecture. The feature integrates seamlessly into the established test workflow.

  ## Key Design Decisions

  ### 1. Reuse Existing Utilities Instead of Reimplementing

  **Decision:** Call `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`,
  `commit_markdown_file()`, and `push_markdown_file()` from `content_generators.py`.

  **Rationale:**
  - These utilities are already implemented, tested, and proven across features 125-130
  - Reimplementing would introduce unnecessary code duplication and maintenance burden
  - The utilities provide security checks (filename validation), encoding guarantees (UTF-8), and comprehensive logging
  - Maintains a single source of truth for file operations and validation logic

  **Reference:** Research findings, Technology Decisions sections 1-4

  ### 2. Manual Orchestration in Feature Module (Not Generic Function Call)

  **Decision:** Create a feature-specific module that manually calls utilities in sequence with feature-specific metadata.

  **Rationale:**
  - Provides explicit control over commit message format (required for feature number)
  - Allows feature-specific logging ("Creating feature 131 markdown file...")
  - Consistent with feature_127 pattern used across 125-130 series
  - Clearer error handling and debugging for feature-specific failures
  - More maintainable than a generic `create_markdown_file(filename, feature_number)` function

  **Reference:** Research findings, Open Questions section

  ### 3. Strict Validation with Fail-Immediately Semantics

  **Decision:** Use `validate_markdown_file()` with no retries; fail immediately if any requirement is not met.

  **Rationale:**
  - Feature 131 is a platform reliability test (part of series 125+)
  - Strict validation catches platform issues that should be investigated, not masked by retries
  - Validation checks: H1 heading presence, 2-3 sentence count, UTF-8 encoding without BOM, Unix LF (no CRLF),
    blank line separator, trailing newline
  - Test failures are diagnostic signals; retries would obscure root causes
  - Matches the established pattern and resolved open questions in spec

  **Reference:** Spec requirements, Open Question 2, Research findings

  ### 4. Content Topic: Allow Any Topic

  **Decision:** Allow Claude API to generate content about any subject; no topic restrictions.

  **Rationale:**
  - Spec explicitly states: "create markdown file... with a title and 2-3 sentences about anything"
  - Tests platform flexibility and generality
  - Provides content diversity across 125+ feature instances
  - Matches the pattern established in features 125-130
  - Same LLM call cost regardless of topic

  **Reference:** Spec requirements, Open Question 3, Research findings

  ### 5. Git Integration: Use Wrapped Utilities with Custom Message Support

  **Decision:** Use `commit_markdown_file()` and `push_markdown_file()` utilities with custom message parameter.

  **Rationale:**
  - Utilities abstract git complexity and provide appropriate conventions
  - `commit_markdown_file()` accepts custom_message parameter for feature-specific format
  - Commit message format: "feat(131): create markdown file test-957h8f.md" (conventional commit with feature scope)
  - Utilities handle auto-staging, upstream tracking, and comprehensive logging

  **Reference:** Research findings, Technology Decisions section

  ### 6. Module Location and Structure

  **Decision:** Create `src/sheep/features/feature_131_markdown_file_creation.py` following the feature_127 pattern.

  **Rationale:**
  - Consistent with existing feature module structure
  - Provides feature metadata (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Clear entry point: `create_feature_131_markdown_file(repo_path=None)`
  - Feature-specific logging and error handling
  - Enables standalone execution from CLI or flow orchestration

  **Reference:** Research findings, Technology Decisions section

  ## Implementation Strategy

  ### Phase 1: Implementation (Create Module & Implement Orchestration)

  Create `src/sheep/features/feature_131_markdown_file_creation.py` with a single function that orchestrates
  the five-step workflow:

  1. Generate unique markdown content via Claude API
  2. Write content to test-957h8f.md in repository root
  3. Validate that all requirements are met (H1, 2-3 sentences, encoding, line endings)
  4. Create git commit with conventional message
  5. Push to feature branch

  The module should follow the exact structure of feature_127, with:
  - Feature metadata constants (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Single entry point function accepting optional repo_path parameter
  - Comprehensive logging at each step using get_logger()
  - Exception handling that propagates errors (fail fast)
  - Return dictionary with execution results

  Implementation time: ~20 minutes (copy feature_127 template, replace feature number/filename, implement).

  ### Phase 2: Validation & Verification (Test & Verify Output)

  Execute the feature end-to-end and verify all success criteria:

  1. Verify file exists at repository root with correct name
  2. Verify file contains H1 heading
  3. Verify file contains 2-3 sentences (not more, not less)
  4. Verify UTF-8 encoding without BOM
  5. Verify Unix LF line endings (not CRLF)
  6. Verify git commit exists with correct message on feature branch
  7. Verify changes are pushed to remote

  This involves running the feature function locally, inspecting the file and git history, and confirming all
  criteria are met.

  Verification time: ~10 minutes (run feature, check file, check git log, confirm push).

  **Total implementation time: ~30 minutes** (matches size estimate S).

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Claude API call fails or times out | HIGH | Error propagates immediately (fail fast). Operator can retry. Retry logic belongs at orchestration level, not here. |
  | File already exists at test-957h8f.md | MEDIUM | write_markdown_file() will overwrite (standard Python behavior). This is acceptable for test features. |
  | Git commit fails (dirty working directory, permissions) | MEDIUM | commit_markdown_file() will fail with clear error message. Feature branch should be clean before execution. |
  | Git push fails (network, permissions, upstream not set) | MEDIUM | push_markdown_file() handles upstream tracking. Network failures are temporary and can be retried at operator level. |
  | Validation fails unexpectedly | MEDIUM-HIGH | Validation function provides descriptive error message. Inspect file and error message to diagnose. |
  | Encoding/line ending issues on Windows | LOW | Implementation uses Python text mode with explicit UTF-8 encoding. Validation explicitly rejects CRLF. |
  | Module import fails (missing dependency) | LOW | Implementation uses only Python stdlib and existing Sheep modules. All dependencies already in requirements. |

