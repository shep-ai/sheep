# Markdown content (the full tasks document)
content: |
  ## Implementation Workflow

  ### Phase 1: Implementation (Task 1)

  Create the feature module `src/sheep/features/feature_131_markdown_file_creation.py` by:

  1. Copying the structure of `feature_127_markdown_file_creation.py` as a template
  2. Updating feature metadata: FEATURE_NUMBER=131, MARKDOWN_FILENAME=\"test-957h8f.md\"
  3. Implementing the create_feature_131_markdown_file() function that:
     - Calls generate_markdown_content() from content_generators to create H1 heading + 2-3 sentences
     - Calls write_markdown_file(content, \"test-957h8f.md\") to write with UTF-8 encoding and Unix LF
     - Calls validate_markdown_file(filepath) to verify H1, sentence count, encoding, line endings
     - Calls commit_markdown_file(filepath, content, repo_path, custom_message=\"feat(131): create markdown file test-957h8f.md\")
     - Calls push_markdown_file(repo_path) to push to remote
     - Returns dictionary with filepath, content, commit_message, push_result
  4. Adding comprehensive logging at each step using get_logger()
  5. Ensuring proper error handling (let exceptions propagate; fail fast on any error)

  The TDD approach:
  - RED: Write tests that verify the function exists, is callable, and returns expected structure
  - GREEN: Implement the function calling all utilities in sequence
  - REFACTOR: Improve logging, add docstrings, verify pattern consistency

  Expected time: ~20 minutes (mostly copying feature_127 template and updating filenames/numbers).

  ### Phase 2: Validation (Task 2)

  Execute the feature end-to-end and verify all success criteria:

  1. Call create_feature_131_markdown_file() from the repository root
  2. Verify file test-957h8f.md exists and is readable
  3. Verify file content:
     - Contains exactly one H1 heading
     - Contains 2-3 sentences (not more, not less)
     - Uses UTF-8 encoding without BOM
     - Uses Unix LF line endings (not CRLF)
     - Has trailing newline
  4. Verify git commit:
     - Message is \"feat(131): create markdown file test-957h8f.md\"
     - Is on feature branch feat/131-markdown-file-creation-060d58
     - Is pushed to remote (appears in origin/feat/131-...)
  5. Verify content uniqueness (not copy-pasted from features 125-130)

  The TDD approach:
  - RED: Write tests that call the feature and assert on file/git state
  - GREEN: Execute feature and verify all assertions pass
  - REFACTOR: Clean up test code, improve clarity

  Expected time: ~10 minutes (run feature, inspect results, verify all criteria).

  ## Why This Task Breakdown

  - **Task 1 is focused on implementation:** Creates the module and implements the orchestration logic
  - **Task 2 is focused on verification:** Ensures the implementation actually produces the correct output
  - **Dependencies are clear:** Task 2 depends on Task 1 (module must exist before testing)
  - **Both tasks follow TDD:** Red-green-refactor cycle for each
  - **Size is appropriate:** Task 1 = 20 min, Task 2 = 10 min, total = 30 min (matches size estimate)
  - **Mirrors established pattern:** Follows feature_127 approach across both implementation and verification

  ## Why No Additional Tasks

  - Feature is simple: No complex configuration, no architectural decisions, no multi-step integration
  - Utilities are proven: generate_markdown_content, write_markdown_file, validate_markdown_file,
    commit_markdown_file, push_markdown_file are all tested and working across features 125-130
  - No dependencies to install: All requirements already in repository
  - No new code beyond the module: Only creating one new file; no modifications to existing modules
  - Task 1 (implementation) + Task 2 (verification) = Complete feature

  Further granularity would add overhead without benefit for a straightforward orchestration feature.
