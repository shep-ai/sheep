content: |
  ## Summary

  This feature creates a single markdown file in the repository root following the established pattern
  from 65+ existing test files. The implementation proceeds in two sequential phases:

  **Phase 1: File Creation** creates test-50rmt9.md with proper markdown format (H1 heading, blank line,
  2-3 sentences of prose), UTF-8 encoding, and LF line endings. The implementer chooses the prose topic
  freely, ensuring basic readability and grammar.

  **Phase 2: Git Integration** stages the file, commits it with the conventional commit message
  `feat(122): Create markdown file test-50rmt9.md with prose content`, and pushes the commit to the
  remote feature branch. This workflow matches the pattern from recent features (069-121).

  All four tasks are straightforward, have clear sequential dependencies, and follow the established pattern.
  The total estimated effort is approximately 11 minutes of actual work.
