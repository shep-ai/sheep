content: |
  ## Problem Statement

  Create a markdown file named `test-ewmy5y.md` in the repository root containing a title and 2-3 sentences of content about any topic. This feature continues the established pattern of the Sheep project, which maintains a collection of markdown content files at the repository root for demonstration and testing purposes.

  The feature is straightforward and follows the identical pattern to recently completed features #044, #059, and #119. No code changes, configuration, testing framework integration, or infrastructure modifications are required.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository contains:

  - **Repository Root**: Contains numerous markdown test files (test-*.md) following a consistent pattern of title + prose content
  - **src/sheep/**: Python source code implementing the core platform (agents, flows, tools, config)
  - **specs/**: Feature specifications organized by number, each containing spec.yaml, feature.yaml, plan.yaml, research.yaml, and tasks.yaml
  - **tests/**: Test suite for the platform
  - **Docs**: README.md and supporting documentation

  ### Architecture Patterns

  This repository follows a specification-driven development pattern where:

  1. Features are defined in YAML specs (spec.yaml files)
  2. Each feature goes through phases: Analysis → Requirements → Design → Implementation → Review
  3. The repository root accumulates markdown test files demonstrating content creation capabilities
  4. Features follow a conventional git workflow with feature branches and commits

  The Sheep platform itself uses CrewAI for orchestrating autonomous agents that implement features through research, implementation, and review phases.

  ### Relevant Technologies

  - **Markdown**: Standard format for content files in the repository
  - **Git**: Version control with feature branches and conventional commits
  - **YAML**: Specification format for feature definitions
  - **Python 3.x**: Core platform language (not required for this feature)
  - **CrewAI**: Agent orchestration framework used by Sheep (not required for this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added to root directory; no modifications to existing files, no deletions |
  | Specs Directory | None | Feature specification already created; analysis phase updates only this spec.yaml file |
  | Source Code (`/src/sheep`) | None | No Python code, platform logic, or module changes affected |
  | Tests (`/tests`) | None | No test files created, modified, or deleted; this is a content-only feature |
  | CI/CD (`.github`) | None | No workflows or automation changes required; standard git workflow applies |
  | Build System (`pyproject.toml`) | None | No dependencies, configuration, or build settings modified |
  | Git History | Low | Single commit added with standardized conventional commit message; no force pushes or rebases |

  ## Dependencies

  - **Git repository**: Feature branch `feat/120-markdown-file-creation-ae92fa` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Related features**: Features #044, #059, and #119 establish the precedent pattern (no technical dependency, only reference)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature with clear, straightforward requirements:

  - **File creation**: ~5 minutes (write one heading + 2-3 sentences of prose content)
  - **Validation**: ~3 minutes (verify markdown syntax is valid, file encoding is UTF-8, line endings are LF)
  - **Git workflow**: ~2-5 minutes (stage file, create commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with identical, recently completed features (#044, #059, #119) providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing framework integration, CI/CD changes, or documentation updates required

