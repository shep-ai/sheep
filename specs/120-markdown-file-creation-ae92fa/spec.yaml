openQuestions:
  - question: "Should the file title use a markdown H1 (#) heading or H2 (##) heading?"
    resolved: true
    options:
      - option: "Use H1 heading (#)"
        description: "H1 is the standard for document titles in standalone markdown files. Single-file documents conventionally use H1 for the main title. Aligns with markdown best practices for document structure."
        selected: true
      - option: "Use H2 heading (##)"
        description: "H2 could indicate a subsection if the file were part of a larger document structure. Less common for standalone files; would suggest hierarchical structure."
        selected: false
    selectionRationale: "H1 is recommended because this is a standalone markdown document, and H1 is the markdown convention for document titles. The feature should follow standard markdown structure patterns."
    answer: "Use H1 heading (#)"
  - question: "Should the 2-3 sentence requirement be enforced strictly or interpreted flexibly?"
    resolved: true
    options:
      - option: "Strictly enforce exactly 2 or 3 sentences"
        description: "Count validation ensures compliance to exact specification. Useful if precise content measurement is important. Requires sentence-boundary detection."
        selected: false
      - option: "Interpret flexibly—approximately 2-3 sentences"
        description: "Allows for natural prose variation without strict counting. Recognizes that sentence boundary detection is ambiguous and that order-of-magnitude matters more than exact count. More practical and focuses on intent (brief, readable content)."
        selected: true
    selectionRationale: "Flexible interpretation is recommended because the specification intent is brief, readable content—not exact sentence counting. Enforcing strict counts would be fragile (e.g., abbreviations, compound sentences create ambiguity). The spirit of the requirement is ~2-3 sentences of reasonable prose, not mathematical precision."
    answer: "Interpret flexibly—approximately 2-3 sentences"
  - question: "What additional content elements are allowed beyond the title and sentences?"
    resolved: true
    options:
      - option: "Minimal only—title + sentences, no extra formatting"
        description: "File contains only a markdown heading and paragraph text. No lists, code blocks, links, images, or other markdown elements. Simplest implementation, aligns with the S estimate and established pattern."
        selected: true
      - option: "Flexible—allow any reasonable markdown elements"
        description: "Title + sentences can be accompanied by lists, code blocks, blockquotes, links, etc. More expressive but adds complexity and scope creep."
        selected: false
    selectionRationale: "Minimal formatting is recommended because the specification explicitly requests only 'a title and 2-3 sentences.' The S (Small) size estimate assumes straightforward content. The established pattern in related features (#044, #059, #119) suggests minimal, focused files. Adding markdown elements would expand scope without additional user request."
    answer: "Minimal only—title + sentences, no extra formatting"

content: |
  ## Problem Statement

  Create a single markdown file named `test-ewmy5y.md` in the repository root directory containing:
  1. A markdown-formatted title (heading)
  2. Approximately 2-3 sentences of prose content about any topic

  This feature continues the established pattern of the Sheep project, which maintains a collection of minimal markdown content files at the repository root for demonstration and testing purposes.

  No code changes, configuration, testing framework integration, or infrastructure modifications are required.

  ## Success Criteria

  - [ ] File `test-ewmy5y.md` is created in the repository root directory
  - [ ] File contains exactly one markdown heading (H1 format: `# Title`)
  - [ ] File contains approximately 2-3 sentences of readable prose content
  - [ ] File contains no additional markdown elements (lists, code blocks, etc.)
  - [ ] File is valid markdown (no syntax errors)
  - [ ] File uses UTF-8 character encoding
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File content can be successfully staged and committed to git
  - [ ] Git commit message follows conventional commits format (e.g., `feat(120): Create markdown file test-ewmy5y.md`)

  ## Functional Requirements

  - **FR-1**: File must be created at the repository root with the exact name `test-ewmy5y.md`
  - **FR-2**: File must contain a markdown heading (H1) serving as the document title
  - **FR-3**: File must contain prose content consisting of approximately 2-3 sentences after the heading
  - **FR-4**: Markdown syntax must be valid and well-formed (no unclosed tags, syntax errors, or malformed elements)
  - **FR-5**: File content must be human-readable with clear, coherent prose (topic and style are unrestricted)

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 character encoding (no other encodings)
  - **NFR-2**: File must use LF (Unix-style) line endings exclusively (not CRLF or mixed)
  - **NFR-3**: File size should be minimal (target: under 500 bytes) to reflect the S (Small) scope estimate
  - **NFR-4**: Git commit must follow conventional commits specification (format: `<type>(<scope>): <subject>`)
  - **NFR-5**: Implementation time should not exceed 15 minutes (aligns with S estimate)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----- | --------- |
  | 1 | What markdown heading level should the title use? | H1 (#) | Standard convention for standalone markdown document titles. Aligns with document structure best practices. |
  | 2 | Should "2-3 sentences" be a strict or flexible requirement? | Flexible (approximately 2-3) | Sentence boundary detection is ambiguous; order-of-magnitude is the intent. Strict counting would be fragile and impractical. |
  | 3 | What additional content elements (lists, code, links) are allowed? | None—title + sentences only | Specification explicitly requests only title + sentences. S estimate assumes minimal scope. Matches pattern of related features. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added to root directory; no modifications to existing files, no deletions |
  | Specs Directory | None | Feature specification already created; requirements phase updates only this spec.yaml file |
  | Source Code (`/src/sheep`) | None | No Python code, platform logic, or module changes affected |
  | Tests (`/tests`) | None | No test files created, modified, or deleted; this is a content-only feature |
  | CI/CD (`.github`) | None | No workflows or automation changes required; standard git workflow applies |
  | Build System (`pyproject.toml`) | None | No dependencies, configuration, or build settings modified |
  | Git History | Low | Single commit added with standardized conventional commit message; no force pushes or rebases |

  ## Dependencies

  - **Git repository**: Feature branch `feat/120-markdown-file-creation-ae92fa` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Related features**: Features #044, #059, and #119 establish the precedent pattern (no technical dependency, only reference for consistency)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature with clear, straightforward requirements:

  - **File creation**: ~5 minutes (write one H1 heading + approximately 2-3 sentences of prose content)
  - **Validation**: ~3 minutes (verify markdown syntax is valid, file encoding is UTF-8, line endings are LF)
  - **Git workflow**: ~2-5 minutes (stage file, create commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with identical, recently completed features (#044, #059, #119) providing clear precedent
  - Flexible topic and content style selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + prose)
  - No testing framework integration, CI/CD changes, or documentation updates required
  - No sentence-counting or style validation overhead due to flexible interpretation of "2-3 sentences"

  ---

  _Requirements phase complete — ready for design specification_
