# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 235 is a minimal orchestration layer that calls existing, proven helper functions.
  The architecture is:

  ```
  feature_235_markdown_file_creation.py (new module)
    └─ Calls existing helpers from content_generators.py:
       ├─ generate_markdown_content() → creates markdown content via LLM
       ├─ write_markdown_file() → writes file with UTF-8 encoding
       ├─ validate_markdown_file() → validates structure/encoding/line-endings
       ├─ commit_markdown_file() → stages and commits
       └─ push_markdown_file() → pushes to remote
  ```

  This follows the exact pattern established by features 116, 148, 232, 233, 234 and
  230+ prior implementations. Each feature module is a thin wrapper around the existing
  content creation workflow.

  ### Why This Architecture Works

  1. **Proven at Scale**: The helper functions in content_generators.py are used by 230+
     test files currently in the repository. They are well-tested and reliable.

  2. **No Duplication**: Reusing helpers prevents code duplication and ensures consistency.
     Any improvements to the helpers benefit all features automatically.

  3. **Clean Separation**: Feature modules stay focused on orchestration; utility functions
     stay focused on implementation details. Easy to test and maintain.

  4. **Established Pattern**: Features 116, 148, 232-234 demonstrate this exact pattern works.
     We're not innovating; we're following proven precedent.

  ### Integration Points

  - **content_generators.py**: Source of truth for markdown creation workflow. Already
    contains all functions needed for this feature.
  - **sheep.tools**: Provides GitCommitTool and GitPushTool (wrapped by helpers).
  - **observability**: Logging via existing get_logger() infrastructure.
  - **CrewAI**: LLM framework for content generation (accessed via helpers).

  ## Key Design Decisions

  ### 1. Orchestration via New Feature Module (Not Direct Inline)

  **Decision**: Create src/sheep/feature_235_markdown_file_creation.py that calls existing helpers.

  **Why**: Features 116, 148, 232-234 establish this pattern. Feature modules are:
  - Traceable and testable by name
  - Callable by agents and automation frameworks
  - Isolated from utility modules (clean separation)
  - Consistent with 230+ prior implementations

  **Alternative Rejected**: Inline implementation directly in content_generators.py would add
  clutter to the utility module and break the established pattern.

  ### 2. Reuse All Existing Helpers (No Reimplementation)

  **Decision**: Use generate_markdown_content(), write_markdown_file(), validate_markdown_file(),
  commit_markdown_file(), and push_markdown_file() directly from content_generators.py.

  **Why** (from research findings):
  - These functions are already implemented, tested, and proven across 230+ features
  - No reimplementation risk; no new bugs to introduce
  - Any improvements to helpers apply to all features
  - Maintenance burden is eliminated
  - Complete consistency with 230+ prior features

  **Alternative Rejected**: Implementing custom logic would require testing, error handling,
  git integration, and validation logic that already exists and works.

  ### 3. LLM-Based Content Generation

  **Decision**: Use generate_markdown_content() which leverages CrewAI and Claude API to
  generate markdown with H1 heading and 2-3 sentences.

  **Why** (from research findings):
  - Demonstrates Sheep platform's automation capability (core purpose of the platform)
  - Ensures high-quality, coherent prose (LLM > hardcoded or random text)
  - Maintains consistency with 230+ prior features (all used LLM generation)
  - Supports free-form topic selection (no domain constraints)
  - Already implemented in content_generators.py

  **Alternative Rejected**: Hardcoded prose would be simpler but inconsistent with platform
  design and 230+ precedent implementations.

  ### 4. Comprehensive Validation Before Git Commit

  **Decision**: Use validate_markdown_file() to check encoding, line endings, structure,
  and sentence count before committing.

  **Why** (from research findings):
  - Prevents invalid content from being committed
  - Catches encoding/line-ending issues early (especially Windows CRLF vs Unix LF)
  - Validates UTF-8 encoding and rejects BOM
  - Confirms markdown structure matches requirements
  - Already implemented and proven

  **Alternative Rejected**: Skipping validation would save ~1 line of code but risk
  committing invalid files.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3 → Phase 4** (strict sequence)

  1. **Create module first** (Phase 1): Establish the entry point before writing tests.
     This prevents test import errors and establishes the contract.

  2. **Test & implement together** (Phase 2): Write tests that verify the feature creates
     the correct file, implement the orchestration logic, run tests to verify.

  3. **Execute feature** (Phase 3): Run the feature function to create the actual markdown
     file. At this point, all code is tested and ready.

  4. **Git operations last** (Phase 4): Stage, commit, and push the file. Git operations
     are mechanical and depend on the file existing.

  ### No Parallel Work

  All phases must be sequential because:
  - Phase 2 requires Phase 1 (can't test without the module)
  - Phase 3 requires Phase 2 (need tested code before executing)
  - Phase 4 requires Phase 3 (need file to exist before committing)

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Helper functions missing or changed | High | Research confirms helpers exist in content_generators.py; features 232-234 use them successfully. Verify imports during Phase 2. |
  | Git operations fail (user.name/email not set) | Medium | GitCommitTool and GitPushTool have error handling. Test git config before Phase 4; clear error messages if credentials missing. |
  | LLM content generation fails or times out | Medium | CrewAI has built-in retries and error handling. If fails, helpers raise descriptive errors. Logged via observability framework. |
  | File encoding issues on Windows | Low | Helper uses explicit UTF-8 encoding with validation. Tests on Windows will catch CRLF issues via validate_markdown_file(). |
  | File already exists (previous run?) | Low | write_markdown_file() overwrites existing files. If this is a problem, add existence check in feature module. |
  | Import path errors | Low | Features 116, 148, 232-234 use same import paths. Copy their imports; follow established conventions. |

  ## Summary

  This feature requires no architectural innovation. The implementation is pure orchestration
  of existing, proven helper functions. The research findings are unambiguous: existing helpers
  exist, work at scale (230+ uses), and require only proper invocation. The feature module
  simply calls them in sequence with appropriate error handling and logging.

  Total implementation effort: ~45 minutes (3 short modules/tests, 1 execution, 1 git operation).
  Risk is minimal due to reliance on proven, tested components.
