# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 235 implementation follows a strict 4-phase sequence with 5 concrete tasks:

  **Phase 1 (Task 1)**: Create the feature module that serves as the orchestration layer.
  The module imports existing helpers from content_generators.py and defines the entry point
  function.

  **Phase 2 (Tasks 2-3)**: Write tests first (task-2), then implement the function (task-3)
  to call existing helpers in sequence. No new business logic; pure orchestration of
  proven components.

  **Phase 3 (Task 4)**: Execute the feature function to create the actual markdown file.
  All the work (LLM content generation, file I/O, validation, git staging) happens in the
  helper functions. We verify the file exists and meets all requirements.

  **Phase 4 (Task 5)**: Verify git operations completed successfully. The commit and push
  operations were already executed by helpers called in task-4; we just verify the state.

  ### Key Points

  - **No reimplementation**: All feature logic is orchestration of existing helpers
  - **TDD throughout**: Write tests first, implement to pass tests, refactor for quality
  - **Minimal code**: Feature module is ~20-30 lines (just function calls with error handling)
  - **Proven pattern**: Identical structure to features 116, 148, 232-234
  - **Zero risk**: Helpers are tested across 230+ uses; we're adding no new logic

  ### Total Effort: 48 minutes

  - Task 1 (module creation): 10 min
  - Task 2 (write tests): 15 min
  - Task 3 (implement function): 10 min
  - Task 4 (execute feature): 8 min
  - Task 5 (verify git): 5 min
