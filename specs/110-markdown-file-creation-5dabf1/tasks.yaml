tasks:
  - id: task-1-1
    phaseId: phase-1
    title: "Create markdown file with proper structure, encoding, and line endings"
    description: "Write test-caiv5r.md to repository root with H1 heading and 2-3 sentences of prose. Ensure UTF-8 encoding without BOM and Unix LF line endings."
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - "File test-caiv5r.md exists in repository root directory"
      - "File contains exactly one markdown H1 heading on line 1 (format: # Title)"
      - "File contains exactly one blank line on line 2"
      - "File contains exactly 2-3 sentences of prose content on lines 3+ (no trailing blank lines)"
      - "Prose content is readable and grammatically correct"
      - "File is encoded as UTF-8 without BOM (Byte Order Mark)"
      - "File uses Unix-style LF line endings (\\n), not Windows CRLF"
      - "File size is in typical range of 350-600 bytes (natural outcome of proper structure)"
      - "Markdown syntax is valid per CommonMark specification"
    tdd:
      red:
        - "Write Python script with assertions that verify all acceptance criteria (file exists, content structure, encoding, line endings)"
        - "Script should fail before file is created (RED state)"
      green:
        - "Create file using: pathlib.Path(\"test-caiv5r.md\").write_text(content_string, encoding=\"utf-8\", newline=\"\\n\")"
        - "Content must follow format: # Title\\n\\n<2-3 sentences>"
        - "Choose any topic for prose (e.g., resilience, learning, communication) — must be readable and grammatically correct"
        - "Run validation script — all assertions should pass (GREEN state)"
      refactor:
        - "Verify file meets all acceptance criteria"
        - "Verify file is exactly as expected: correct structure, encoding, line endings"
        - "Remove or document validation script for reference"
    estimatedEffort: "30min"

  - id: task-2-1
    phaseId: phase-2
    title: "Stage file in git"
    description: "Add test-caiv5r.md to git staging area using git add command."
    state: Todo
    dependencies:
      - task-1-1
    acceptanceCriteria:
      - "File test-caiv5r.md appears in git staging area"
      - "git status shows file under \"Changes to be committed\" section"
      - "git add command succeeds without errors"
    tdd:
      red:
        - "Run git status before staging — file should not be in staging area"
      green:
        - "Run: git add test-caiv5r.md"
      refactor:
        - "Run git status — verify file appears under \"Changes to be committed\""
        - "Verify no other files are staged"
    estimatedEffort: "5min"

  - id: task-2-2
    phaseId: phase-2
    title: "Commit with conventional commit message"
    description: "Create git commit with exact conventional message format on feature branch."
    state: Todo
    dependencies:
      - task-2-1
    acceptanceCriteria:
      - "Commit message is exactly: feat(110): create markdown file test-caiv5r.md with prose content"
      - "Commit appears in git log"
      - "Commit is on branch feat/110-markdown-file-creation-5dabf1"
      - "Commit author and date are recorded correctly"
    tdd:
      red:
        - "Assert commit with exact message does not yet exist in git log"
      green:
        - "Run: git commit -m \"feat(110): create markdown file test-caiv5r.md with prose content\""
      refactor:
        - "Verify commit appears in git log with exact message: git log --oneline | head -1"
        - "Verify current branch: git rev-parse --abbrev-ref HEAD"
        - "Verify commit contains test-caiv5r.md: git show --name-only HEAD"
    estimatedEffort: "5min"

  - id: task-2-3
    phaseId: phase-2
    title: "Push changes to remote repository"
    description: "Push commit to remote origin on feature branch feat/110-markdown-file-creation-5dabf1."
    state: Todo
    dependencies:
      - task-2-2
    acceptanceCriteria:
      - "Commit is pushed to origin/feat/110-markdown-file-creation-5dabf1"
      - "Remote and local branches are synchronized"
      - "git push command completes successfully"
      - "No merge conflicts or push rejections"
    tdd:
      red:
        - "Assert local commit does not yet exist on remote branch"
      green:
        - "Run: git push origin feat/110-markdown-file-creation-5dabf1"
      refactor:
        - "Verify commit is on remote: git branch -vv"
        - "Verify remote tracking shows up-to-date: git status"
        - "Optionally verify on GitHub: remote branch should show latest commit"
    estimatedEffort: "5min"

totalEstimate: "45min"

openQuestions: []

content: |
  ## Summary

  Implementation follows the established pattern from 65+ test files in features 063-109.
  Work is organized into 2 phases:

  **Phase 1: File Creation (Task 1-1)**
  Create the markdown file with proper structure (H1 heading + blank line + 2-3 sentences),
  ensure UTF-8 encoding without BOM, ensure Unix LF line endings. TDD approach: write validation
  assertions (RED), create file (GREEN), verify all criteria pass (REFACTOR).

  **Phase 2: Git Integration (Tasks 2-1, 2-2, 2-3)**
  Standard 3-step git workflow: stage file with `git add`, commit with conventional message format,
  push to remote. Each step depends on the previous one. Verification at each step confirms
  operation succeeded.

  Total effort: 45 minutes. No external dependencies needed (pathlib and subprocess are Python stdlib).
