decisions:
  - title: "File I/O Method"
    chosen: "pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\\n'"
    rejected:
      - "Using open() function — more verbose, requires manual newline and encoding parameters, less idiomatic for single-operation writes"
      - "Using subprocess to invoke shell echo/cat — overkill complexity, unmaintainable, inconsistent with Python approach"
    rationale: >
      Spec explicitly requires pathlib (NFR-5). pathlib.Path.write_text() is modern Python idiom for
      file writing, provides clean API for encoding/newline control, atomic operation. The newline='\\n'
      parameter forces Unix-style LF line endings regardless of platform (meeting NFR-2), and encoding='utf-8'
      with default Python behavior prevents BOM (meeting NFR-1). Aligns with all 65+ existing test files.

  - title: "Line Ending Handling Strategy"
    chosen: "Explicit newline='\\n' parameter in pathlib.Path.write_text() to force LF on Windows"
    rejected:
      - "Rely on git autocrlf normalization — unreliable (depends on user config, repo .gitattributes), violates explicit control requirement"
      - "Use binary mode with manual bytes encoding — unnecessary complexity, error-prone, harder to maintain"
    rationale: >
      Windows platform uses CRLF by default, but spec requires Unix LF (NFR-2). The newline='\\n' parameter
      is the direct, explicit way to force LF line endings in Python's text mode. This ensures compliance
      regardless of platform or git configuration. Safer than relying on post-commit normalization which
      can fail or be overridden by user config.

  - title: "UTF-8 Encoding without BOM"
    chosen: "Use encoding='utf-8' in pathlib.Path.write_text() — Python 3's default behavior excludes BOM"
    rejected:
      - "Encoding 'utf-8-sig' — adds BOM, violates NFR-1 requirement"
      - "Using codecs.open() with explicit encoding handling — unnecessary complexity"
    rationale: >
      Python 3's utf-8 encoding (the default) writes UTF-8 without Byte Order Mark (BOM). This is
      the correct behavior for modern text files and web standards. The 'utf-8-sig' variant adds a BOM,
      which is explicitly forbidden by NFR-1. Codecs module adds complexity without benefit.

  - title: "Prose Content Generation"
    chosen: "Free-form prose selection (implementer chooses topic) with requirement for readable, grammatically correct sentences"
    rejected:
      - "Template/parameterized prose ('Heading: {topic}\\n\\nSentence about {topic}...') — over-engineered, reduces readability quality"
      - "Generated via ML/Lorem ipsum — does not meet 'readable and grammatically correct' requirement (spec FR-5)"
    rationale: >
      Spec allows flexible topic selection (NFR-8) and requires prose to be readable and grammatically
      correct (FR-5). Free-form selection allows implementer judgment, ensures natural language quality,
      maintains consistency with existing 65+ test files which all contain natural, topic-specific prose.
      Simpler than generation or parameterization, better quality outcomes.

  - title: "Git Workflow Implementation"
    chosen: "Use subprocess.run() to invoke git CLI commands (git add, git commit, git push)"
    rejected:
      - "GitPython library — unnecessary dependency (spec NFR-9), complexity overhead, requires import/initialization"
      - "Manual git plumbing via subprocess with low-level commands — error-prone, harder to debug"
    rationale: >
      Spec explicitly forbids new dependencies (NFR-9) and establishes git CLI workflow pattern. subprocess.run()
      is lightweight, built-in, directly invokes git (transparent, debuggable). Feature branch already exists
      (feat/110-markdown-file-creation-5dabf1), so workflow is: write file, stage, commit with conventional
      message, push. GitPython adds overhead and maintenance burden for simple operations already well-handled
      by CLI.

