content: |
  ## Architecture Overview

  This feature implements a minimal, isolated file creation operation with standard git workflow.
  The implementation follows the established pattern from 65+ existing test files in the repository:

  1. **File Creation**: Use Python's `pathlib.Path.write_text()` with explicit encoding and line ending parameters
  2. **Git Workflow**: Use subprocess to invoke git CLI commands (add, commit, push)
  3. **No Integration**: Feature is purely file/git operations with no dependency on source code in `/src/sheep/`

  The established pattern provides clear guidance with minimal architectural complexity. All 65+ test
  files in features 063-109 follow identical structure:

  ```
  # Title Heading

  Sentence 1. Sentence 2. Sentence 3.
  ```

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Decision**: Use `pathlib.Path("test-caiv5r.md").write_text(content, encoding='utf-8', newline='\n')`

  **Rationale**:
  - Explicitly required by spec (NFR-5: "Implementation must use Python pathlib.Path for file I/O operations")
  - Modern Python idiom for single-operation file writes
  - Clean API for encoding and newline control
  - Atomic operation (write succeeds or fails completely)
  - All 65+ existing test files use this approach

  **Alternatives Considered**:
  - `open()` function: More verbose, requires context manager and manual encoding/newline handling
  - Shell subprocess with `echo`/`cat`: Unnecessary complexity, harder to maintain, inconsistent

  ### 2. Line Ending Control: Explicit newline Parameter

  **Decision**: Use `newline='\n'` parameter in pathlib.Path.write_text() to force Unix LF line endings

  **Rationale**:
  - Spec explicitly requires LF line endings on Windows (NFR-2: "File must use Unix-style LF line endings")
  - Windows platform uses CRLF by default, so explicit control is necessary
  - Python's newline parameter in text mode directly controls platform line ending behavior
  - More reliable than post-commit git normalization (depends on user config, can be overridden)
  - Platform-independent guarantee

  **Alternatives Considered**:
  - Rely on git autocrlf or .gitattributes: Unreliable, depends on user configuration
  - Use binary mode with manual byte encoding: Unnecessary complexity, error-prone

  ### 3. UTF-8 Encoding without BOM

  **Decision**: Use `encoding='utf-8'` in pathlib (Python 3 default behavior, no BOM)

  **Rationale**:
  - Spec explicitly forbids BOM (NFR-1: "File must be encoded as UTF-8 without BOM")
  - Python 3's utf-8 encoding writes UTF-8 without BOM (the modern standard)
  - Using 'utf-8-sig' variant would add BOM (wrong)
  - No additional complexity needed — Python default is correct

  ### 4. Prose Content Selection: Free-Form

  **Decision**: Implementer selects any readable, grammatically correct topic (2-3 sentences)

  **Rationale**:
  - Spec allows flexible topic selection (NFR-8: "Prose topic may be any topic chosen by the implementer")
  - Ensures natural language quality (spec requires: FR-5 "Prose content must be readable and grammatically correct")
  - Consistent with existing 65+ test files which all contain natural, topically-coherent prose
  - Simpler than parameterized templates or AI generation
  - Examples: "The Art of Resilience", "Continuous Learning", "Effective Communication"

  ### 5. Git Workflow: subprocess CLI Invocation

  **Decision**: Use `subprocess.run()` to invoke git CLI commands (git add, commit, push)

  **Rationale**:
  - Spec explicitly forbids new dependencies (NFR-9)
  - subprocess is Python standard library (no imports needed)
  - Direct, transparent invocation of git commands (easy to debug)
  - Feature branch already exists (`feat/110-markdown-file-creation-5dabf1`)
  - Workflow is straightforward: 3-step sequence (add → commit → push)

  **Alternatives Considered**:
  - GitPython library: Adds unnecessary dependency, import/initialization overhead
  - Git plumbing commands: More error-prone than high-level CLI

  ## Implementation Strategy

  ### Phase 1: File Creation & Content Structure
  Create the markdown file with proper structure, encoding, and line endings. This phase is the foundation
  for all subsequent work. The file must meet all acceptance criteria before git integration:

  - File exists in repository root with exact filename `test-caiv5r.md`
  - Content structure: H1 heading + blank line + 2-3 sentences
  - Encoding: UTF-8 without BOM
  - Line endings: Unix LF (not CRLF)
  - Prose: Readable, grammatically correct (any topic)

  Testing approach: Write validation script that asserts all acceptance criteria, then implement file
  creation, then verify all criteria pass before moving to Phase 2.

  ### Phase 2: Git Integration
  Stage, commit, and push the file using standard git workflow:

  1. Stage file with `git add test-caiv5r.md`
  2. Commit with conventional message: `feat(110): create markdown file test-caiv5r.md with prose content`
  3. Push to feature branch: `git push origin feat/110-markdown-file-creation-5dabf1`

  Each step depends on the previous one. Verify at each stage that the operation succeeded.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (BOM added or wrong encoding) | Explicitly use encoding='utf-8' and verify no BOM in binary read |
  | Line ending issues (CRLF on Windows instead of LF) | Explicitly use newline='\n' parameter to force LF |
  | File not created in repository root | Use relative path "test-caiv5r.md" with pathlib.Path() |
  | Git configuration missing (user.name, user.email) | Git will fail with clear error; prerequisite assumption in spec |
  | Wrong commit message format | Use exact string from spec; verify in git log after commit |
  | Push fails due to network or permissions | Git will fail with clear error; feature branch is pre-created |
  | File already exists from prior attempt | File creation will overwrite (idempotent operation) |
