content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files as minimal units of work. This feature creates a single test markdown file
  (test-c0wzgm.md) in the repository root with a markdown heading and 2-3 sentences of prose
  content, demonstrating automated file creation and conventional git workflow integration.

  This feature continues the well-established markdown-file-creation pattern from features 121-127,
  with 100+ similar test files already existing as reference implementations in the repository root.
  The feature requires straightforward file I/O, LLM-driven content generation, and standard git
  staging/commit/push operations following conventional commit conventions.

  ## Success Criteria

  - [ ] File test-c0wzgm.md is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (# Title syntax)
  - [ ] File contains 2-3 complete, coherent sentences of prose content
  - [ ] File is encoded in UTF-8 with LF (Unix-style) line endings
  - [ ] File size is between 400-600 bytes
  - [ ] Generated content passes comprehensive markdown validation
  - [ ] File is staged in git and appears in git status output
  - [ ] Commit is created with conventional commit format (feat(128): description)
  - [ ] Commit is successfully pushed to feat/128-markdown-file-create-2d9f0a branch
  - [ ] No existing repository files were modified or overwritten during feature execution

  ## Functional Requirements

  - **FR-1**: System must create a markdown file with filename "test-c0wzgm.md" in the repository root directory
  - **FR-2**: System must generate an H1 markdown heading using proper markdown syntax (# Title)
  - **FR-3**: System must generate 2-3 sentences of coherent, meaningful prose content below the heading
  - **FR-4**: System must validate the generated markdown content against specification requirements before persisting to disk
  - **FR-5**: System must write the file to disk with UTF-8 character encoding
  - **FR-6**: System must ensure file uses LF (Unix-style, \n) line endings, not CRLF or CR
  - **FR-7**: System must stage the created file in git using git add command
  - **FR-8**: System must create a git commit with a message following conventional commit format (type(scope): description)
  - **FR-9**: System must push the commit to the remote feature branch (feat/128-markdown-file-create-2d9f0a)
  - **FR-10**: System must reuse existing content_generators.py utility functions for markdown generation, validation, and git operations

  ## Non-Functional Requirements

  - **NFR-1**: Generated file must be between 400-600 bytes in size (typical for 1 heading + 2-3 sentences)
  - **NFR-2**: Generated markdown content must be syntactically valid with proper H1 heading syntax
  - **NFR-3**: Generated prose content must be coherent, grammatically correct, and meaningful
  - **NFR-4**: Feature implementation must complete within 15 minutes of execution
  - **NFR-5**: Conventional commit message must follow format: feat(128): description (exact type and scope as specified)
  - **NFR-6**: System must not modify, overwrite, or delete any existing repository files
  - **NFR-7**: Generated content topics and wording must be diverse across multiple test file executions (no repetition)
  - **NFR-8**: Implementation must reuse existing utilities and patterns from features 121-127 without code duplication
  - **NFR-9**: All generated content must be in English language
  - **NFR-10**: File operations must not be interrupted or partially written (atomic writes preferred)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content topic be auto-selected or user-specified? | Auto-select topic | Matches features 121-127 pattern, simplifies implementation, LLM can reliably generate diverse topics |
  | 2 | What tone/style should prose content use? | Neutral/balanced | Broad appeal, consistent with existing 100+ test files, professional tone suits documentation context |
  | 3 | What conventional commit type should be used? | feat: | Semantically correct for new functionality, matches related features pattern, aligns with semantic versioning |
  | 4 | How strict should validation be? | Comprehensive validation | Ensures consistency with existing files, catches all requirement violations early, reduces rework |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository Root**: Contains 100+ markdown test files (*.md) documenting various topics, plus Python utility scripts and configuration files
  - **src/sheep/**: Main package containing:
    - **agents/**: CrewAI agent definitions (code_agents.py, general_agents.py)
    - **config/**: Configuration modules (llm.py for LLM setup, settings.py for application settings)
    - **features/**: Feature implementation modules (feature_N_markdown_file_creation.py for each numbered feature)
    - **tools/**: Reusable tool implementations (git_tools.py, file_tools.py, web_tools.py)
    - **flows/**: Workflow orchestration (code_implementation.py, chat.py)
    - **observability/**: Logging and tracing infrastructure
    - **content_generators.py**: Core utilities for markdown generation, validation, and git operations
  - **specs/**: Feature specifications organized by feature number (specs/NNN-feature-name/)
  - **.github/workflows/**: CI/CD configuration
  - **.env.example**: Environment variable template

  ### Architecture Patterns

  - **Modular Feature Implementation**: Each feature has its own Python module (feature_N_*.py) that orchestrates the complete workflow
  - **Reusable Utilities**: Common operations (content generation, validation, git ops) are centralized in content_generators.py and tools/*
  - **LLM Integration**: Uses CrewAI framework with Claude API for intelligent content generation
  - **Git Workflow**: Standard git operations (add, commit, push) wrapped in helper functions from git_tools.py
  - **Observable Execution**: Logging infrastructure via get_logger() provides tracing and debugging capability
  - **Validation-First Approach**: Generated content is validated against specification before being committed to git

  ### Relevant Technologies

  - **Python 3.11+**: Application language with standard pathlib for file I/O
  - **CrewAI**: Multi-agent orchestration framework that provides LLM integration
  - **Claude API (Anthropic)**: LLM provider for content generation via get_reasoning_llm()
  - **Git**: Version control system with subprocess-based integration (via git_tools.py)
  - **Markdown**: Plain-text file format with simple syntax (H1 heading: # Title)
  - **YAML**: Spec format for feature definitions

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-c0wzgm.md) to existing collection of 100+ test files; no modifications to existing files or directory structure beyond single file creation |
  | File System | Low | Single file creation operation (~400-600 bytes of UTF-8 text); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-127; no branch/merge complexity, no destructive operations, uses conventional commit format |
  | src/sheep/content_generators.py | None | Existing module provides reusable content generation; no modifications required—existing functionality supports this feature |
  | src/sheep/features/ | Low | Adds new file feature_128_markdown_file_creation.py; follows existing pattern from features 121-127 with no architecture changes |
  | Source Code & Architecture | None | Feature is purely file creation; does not depend on or impact application source code, architecture, or design patterns |
  | Specs Directory | Low | Updates only this spec.yaml file (128-markdown-file-create-2d9f0a/spec.yaml) during requirements phase; no impact on other specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/128-markdown-file-create-2d9f0a` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory required for file creation
  - **Content generation**: Existing `content_generators.py` utilities with generate_markdown_content() function for creating markdown content with H1 heading + 2-3 sentences
  - **Validation**: Existing `content_generators.py` with validate_markdown_file() function for format compliance (H1 syntax, sentence count, file size, encoding, line endings)
  - **File writing**: Existing `content_generators.py` with write_markdown_file() function for UTF-8 encoding with LF line endings
  - **Git operations**: Existing content_generators.py functions commit_markdown_file() and push_markdown_file() for staging, committing, and pushing
  - **LLM access**: API keys configured for Claude via .env file and config/llm.py (calls get_reasoning_llm())
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library**: pathlib module available in Python 3.11+ for file I/O operations
  - **Established pattern**: 100+ existing test files (test-*.md) provide clear precedent for file format, content structure, and encoding/line-ending conventions

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes of implementation work)

  **Justification**:

  - **Content generation**: ~5 minutes — Generate H1 heading and 2-3 sentences using LLM with auto-selected topic via existing content_generators.py function
  - **File creation**: ~1 minute — Write to disk with UTF-8 encoding and LF line endings using existing write_markdown_file()
  - **Validation**: ~2 minutes — Verify H1 format, sentence count, encoding, line endings, and file size (400-600 bytes) using existing validate_markdown_file()
  - **Git workflow**: ~3-5 minutes — Stage file, create conventional commit with message, and push to remote feature branch using existing git helpers
  - **Total**: 10-15 minutes

  **Supporting factors**:

  - Well-established pattern with 100+ identical test files providing clear precedent and reference implementations
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - Existing content_generators.py module provides proven LLM integration and file operations for markdown generation
  - Existing feature modules (feature_121-127_*.py) demonstrate consistent 10-15 minute implementation pattern
  - No testing, documentation, configuration changes, or architectural decisions required
  - Git operations follow straightforward conventional commit workflow with no merge or conflict complexity
  - No external dependencies or special environment setup required beyond what Sheep already provides
  - Simple feature implementation module (feature_128_markdown_file_creation.py) can be modeled directly from feature_127

  ---

  _Requirements phase complete — comprehensive requirements documented, success criteria defined, product decisions made with rationale_
