content: |
  ## Summary

  Feature 128 implementation breaks into 4 focused tasks across 4 phases:

  **Phase 1: Foundation (Task 1, 5 min)**
  Create module structure with imports, metadata, and function signature.
  This establishes the container for workflow orchestration.

  **Phase 2: Workflow (Task 2, 5 min)**
  Implement the core workflow by calling content_generators utilities in sequence:
  generate content → write file → validate file. This produces a valid markdown
  file on disk with comprehensive validation gates.

  **Phase 3: Git Integration (Task 3, 3 min)**
  Complete the workflow by adding git commit and push operations with conventional
  commit message format (feat(128): ...). This integrates the feature into git.

  **Phase 4: Validation (Task 4, 2 min)**
  Write comprehensive tests and perform manual validation to verify all success
  criteria are met. Confirm the complete workflow functions correctly.

  **Total: ~15 minutes** (matches S size estimate)

  ## Implementation Pattern

  All tasks follow the established pattern from features 121-127:

  1. **Orchestration Module**: Single feature_128_markdown_file_creation.py
  2. **Utility Reuse**: All functions imported from content_generators.py
  3. **Structured Logging**: Info/debug/error levels at each step
  4. **Fail-Fast Pattern**: Validate output, propagate exceptions, log context
  5. **Conventional Commits**: feat(128): ... message format with feature scope
  6. **Comprehensive Validation**: Check H1, sentences, encoding, line endings before commit

  ## Why This Task Breakdown Works

  - **Linear Dependencies**: Each task builds on outputs of previous task
  - **Focused Scope**: Each task has single, clear responsibility
  - **TDD Discipline**: RED (test) → GREEN (implement) → REFACTOR (improve)
  - **Minimal Complexity**: No parallel work; feature is small enough to sequence linearly
  - **Validation Gates**: Each task validates before proceeding to next task
  - **Risk Mitigation**: Early detection of issues (content gen, file write, validation, git ops)
  - **Pattern Consistency**: Identical structure to feature_127 for familiarity and confidence

  ## Testing Strategy

  Tests are implicit through module execution:
  - **Unit testing**: content_generators functions are pre-tested across 127+ features
  - **Integration testing**: Feature module orchestrates these functions; tests verify orchestration
  - **Acceptance testing**: Verify all success criteria from feature spec (Task 4)
  - **Error scenarios**: Exceptions propagate naturally; error handling is fail-fast

  No separate test file needed; feature is pure orchestration of proven utilities.

  ## Success Criteria Summary

  Upon completion of all tasks, feature 128 will have:
  - ✓ Created file test-c0wzgm.md in repository root
  - ✓ File contains H1 heading and 2-3 sentences
  - ✓ File is UTF-8 with LF line endings (400-600 bytes)
  - ✓ File is staged and committed with feat(128): message
  - ✓ Commit is pushed to remote feat/128-markdown-file-create-2d9f0a branch
  - ✓ No existing files modified or overwritten
  - ✓ Complete workflow executes in ~15 minutes (within estimate)
  - ✓ Implementation follows established patterns from features 121-127
  - ✓ Comprehensive logging provides audit trail and debugging capability
  - ✓ Comprehensive validation catches all requirement violations before commit
