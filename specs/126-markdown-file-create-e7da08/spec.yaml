# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file called `test-trd8nx.md` with an H1 heading as a title and 2-3 sentences of coherent prose about any topic. The file must follow the established pattern used in 125 prior features, with proper UTF-8 encoding, Unix line endings, git staging, conventional commit message, and push to remote.

  ## Success Criteria

  - [ ] File `test-trd8nx.md` exists in repository root directory
  - [ ] File contains exactly one H1 heading (starting with `# `) as the title
  - [ ] File contains 2-3 sentences of coherent prose content after the heading
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses LF line endings exclusively (no CRLF)
  - [ ] File ends with a trailing newline character
  - [ ] File size is at least 50 bytes (ensuring meaningful content)
  - [ ] File passes all validation checks (encoding, structure, content, format)
  - [ ] File is staged in git index via `git add`
  - [ ] Commit exists on feature branch with conventional commit message
  - [ ] Commit message follows format: `feat(126): Create test-trd8nx.md markdown file with [topic] content`
  - [ ] Changes are successfully pushed to remote repository (origin)
  - [ ] Remote branch reflects the pushed changes and commit history

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-trd8nx.md` in the repository root directory
  - **FR-2**: Generate markdown content with H1 heading using Claude API via `generate_markdown_content()` function
  - **FR-3**: Include exactly one H1 heading at the start of the file (using `# ` syntax)
  - **FR-4**: Include a blank line separator between the H1 heading and prose content
  - **FR-5**: Include 2-3 sentences of coherent prose content (counted by period delimiters)
  - **FR-6**: Write the complete file to disk using the `write_markdown_file()` function
  - **FR-7**: Validate the written file against all requirements using `validate_markdown_file()`
  - **FR-8**: Stage the file in git index using GitCommitTool with `git add`
  - **FR-9**: Create a git commit with conventional commit message using `commit_markdown_file()`
  - **FR-10**: Push committed changes to remote repository using `push_markdown_file()` with upstream tracking

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 format with no BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix line endings (LF only, `\n`), never CRLF (`\r\n`)
  - **NFR-3**: File must end with a trailing newline character (Unix convention)
  - **NFR-4**: File must be at least 50 bytes in size (ensures content is meaningful, not empty)
  - **NFR-5**: Commit message must follow conventional commits format: `feat(NUMBER): description`
  - **NFR-6**: Filename validation must prevent path traversal attacks (no `/`, `\`, or leading `.`)
  - **NFR-7**: Structured logging via `get_logger()` should instrument all workflow steps
  - **NFR-8**: File validation must complete successfully before staging and committing
  - **NFR-9**: Implementation must follow established patterns from feature 125 and prior iterations
  - **NFR-10**: All git operations must use the feature branch as target (no modifications to main)
  - **NFR-11**: Content generation should use Claude API for variety and quality (not templates)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should commit message include feature number scope? | Yes: `feat(126): ...` | Spec requirement for traceability; enables filtering commits by feature number; aligns with conventional commits best practices |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | New file `test-trd8nx.md` will be created here. No modification to existing files. |
  | Git History | Low | One new commit will be added to the feature branch with conventional message format. |
  | Remote Repository | Low | Changes pushed to `origin` on the feature branch. No impact to main branch. |
  | Testing Requirements | None | Existing test utilities can validate file; no new test infrastructure needed. |
  | Source Code | None | No modifications to src/sheep/ or any other source files. |
  | Dependencies | None | All required dependencies (content_generators, git tools, logging) already present. |

  ## Dependencies

  **Runtime Dependencies:**
  1. `sheep.content_generators` module:
     - `generate_markdown_content()`: LLM-based content generation
     - `write_markdown_file()`: Safe file writing with encoding
     - `validate_markdown_file()`: Strict format validation
     - `commit_markdown_file()`: Git staging and committing
     - `push_markdown_file()`: Git push with upstream
     - `create_markdown_file()`: Main entry point orchestrating the entire workflow

  2. `sheep.tools`:
     - `GitCommitTool`: For git add and commit operations
     - `GitPushTool`: For pushing to remote with `-u` flag

  3. `sheep.config.llm`:
     - `get_reasoning_llm()`: Provides LLM instance for content generation

  4. `sheep.observability.logging`:
     - `get_logger()`: Structured logger for workflow instrumentation

  **External Dependencies (already in pyproject.toml):**
  - crewai[anthropic,google-genai,tools]>=0.86.0
  - pydantic>=2.0.0
  - gitpython>=3.1.0
  - python-dotenv>=1.0.0 (for .env configuration)

  **Git Requirements:**
  - Current git repository with remote `origin` configured
  - Feature branch `feat/126-markdown-file-create-e7da08` (or current HEAD)
  - Git command-line available in PATH

  ## Implementation Notes

  ### Key Functions to Use

  The feature implements a complete orchestration workflow:

  **Main Entry Point:**
  ```python
  from sheep.content_generators import create_markdown_file

  result = create_markdown_file("test-trd8nx.md")
  # Returns: {
  #     "filepath": "/path/to/test-trd8nx.md",
  #     "content": "# Title\n\nSentence 1. Sentence 2. Sentence 3.\n",
  #     "commit_message": "feat(126): Create test-trd8nx.md markdown file with [topic] content",
  #     "push_result": "..."
  # }
  ```

  This single function handles all required workflow steps:
  1. Content generation via Claude API
  2. File writing with proper encoding
  3. File validation (encoding, structure, format)
  4. Git staging and committing
  5. Push to remote with upstream tracking

  ### Validation Checks

  All validation is performed by `validate_markdown_file()` and includes:
  - UTF-8 encoding verification (no BOM)
  - No CRLF line endings (Unix LF only)
  - H1 heading at file start
  - Blank line separator after heading
  - Exactly 2-3 sentences in prose (by period count)
  - File ends with newline
  - File size at least 50 bytes

  ### Content Generation

  Content is generated via `generate_markdown_content()` which:
  - Uses Claude API with MARKDOWN_GENERATION_PROMPT
  - Returns markdown with H1 heading and 2-3 sentences
  - Auto-adds trailing newline
  - Validates format before returning

  ## Size Estimate

  **S (Small)** — Estimated 30-60 minutes of total effort

  ### Justification:

  1. **Simplicity of Task**: Create a single file with minimal content structure
  2. **Well-Established Pattern**: 125 prior features follow identical workflow; infrastructure is mature and proven
  3. **No Code Changes Needed**: Task is file creation only; no modifications to source code
  4. **Reusable Infrastructure**: All supporting functions already exist and are well-tested:
     - `create_markdown_file()` in content_generators.py is the main entry point
     - Validation, git operations, and logging already implemented
  5. **Clear Success Criteria**: File exists, proper format, committed, and pushed
  6. **No Architectural Decisions**: Pattern is fully determined by feature 125 and prior iterations

  ### Time Breakdown:
  - **Understanding & Planning** (5 min): Review spec and prior features
  - **Implementation** (5-10 min): Call `create_markdown_file("test-trd8nx.md")` from content_generators
  - **Validation & Testing** (10-20 min): Verify file format, encoding, git history
  - **Commit & Push** (5 min): Stage, commit with proper message, push to remote

  ### Complexity Drivers (Low):
  - No complex business logic
  - No multi-file dependencies
  - No architectural decisions needed
  - Infrastructure fully mature from 125 prior iterations

