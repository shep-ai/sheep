# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file called `test-trd8nx.md` with an H1 heading as a title and 2-3 sentences of coherent prose about any topic. The file must follow the established pattern used in 125 prior features, with proper UTF-8 encoding, Unix line endings, git staging, conventional commit message, and push to remote.

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as follows:

  ```
  sheep/
  ├── src/sheep/
  │   ├── content_generators.py     # Core module for markdown generation, writing, validation
  │   ├── cli.py                     # CLI entry point
  │   ├── features/                  # Feature implementations (101-125 currently)
  │   │   ├── feature_121_markdown_file_creation.py
  │   │   └── ...
  │   ├── agents/                    # CrewAI agent definitions
  │   ├── config/                    # LLM and settings configuration
  │   ├── flows/                     # Flow orchestration
  │   ├── observability/             # Logging and tracing
  │   └── tools/                     # Git, file, and other tools
  ├── specs/                         # Feature specifications (currently 155 directories)
  │   └── 126-markdown-file-create-e7da08/
  ├── tests/                         # Test suite
  └── pyproject.toml                 # Project metadata and dependencies
  ```

  The repository also contains 125+ test markdown files already created (test-*.md pattern) as evidence of prior features following this exact pattern.

  ### Architecture Patterns

  **1. Content Generation Pipeline**
  - Input: File name and topic (or auto-generated by LLM)
  - Generation: `content_generators.generate_markdown_content()` uses LLM to create H1 heading + 2-3 sentences
  - Output: Valid markdown string with proper structure and encoding

  **2. File Operations**
  - Uses `pathlib.Path` for safe, cross-platform file I/O
  - UTF-8 encoding with no BOM (Byte Order Mark)
  - Unix-style LF line endings (not Windows CRLF)
  - File placement: Repository root directory
  - Safety checks: Path traversal prevention, file existence validation

  **3. Git Integration**
  - Staging: `GitCommitTool` stages file(s) with `git add`
  - Committing: Conventional commit format `feat(NUMBER): message`
  - Pushing: `GitPushTool` with upstream tracking (`-u origin HEAD`)
  - Tools located in `sheep.tools` module

  **4. Validation Framework**
  - Strict validation in `validate_markdown_file()` checks:
    - UTF-8 encoding (no BOM)
    - No CRLF line endings
    - H1 heading structure (starts with `# `)
    - Blank line separator after heading
    - 2-3 sentences in prose content
    - Trailing newline for Unix convention
    - File size reasonable (50+ bytes minimum)

  **5. Logging & Observability**
  - Structured logging via `sheep.observability.logging.get_logger()`
  - Info-level logs for workflow steps
  - Debug-level logs for detailed state
  - Error logs with context on failures

  ### Relevant Technologies

  **Core Technologies:**
  - **Python 3.11+**: Required minimum version per pyproject.toml
  - **CrewAI 0.86.0+**: Agentic orchestration framework (used for flow structure, though this feature is simpler)
  - **Pydantic 2.0+**: Data validation and settings management
  - **pathlib**: Modern, safe file path handling (preferred over os.path)
  - **GitPython 3.1.0+**: Git operations programmatically

  **LLM Backend:**
  - Claude API (via `sheep.config.llm.get_reasoning_llm()`)
  - Anthropic SDK integration
  - Supports fallback to OpenAI/Google if configured

  **Testing Infrastructure:**
  - pytest 8.0.0+: Test runner
  - pytest-asyncio: For async test support
  - pytest-cov: Coverage reporting

  **Development Tools:**
  - ruff: Fast Python linting and formatting
  - mypy: Static type checking
  - pre-commit: Git hooks for quality gates

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | New file `test-trd8nx.md` will be created here. No modification to existing files. |
  | Git History | Low | One new commit will be added to the feature branch with conventional message format. |
  | Remote Repository | Low | Changes pushed to `origin` on the feature branch. No impact to main branch. |
  | Testing Requirements | None | Existing test utilities can validate file; no new test infrastructure needed. |
  | Source Code | None | No modifications to src/sheep/ or any other source files. |
  | Dependencies | None | All required dependencies (content_generators, git tools, logging) already present. |

  ## Dependencies

  **Runtime Dependencies:**
  1. `sheep.content_generators` module:
     - `generate_markdown_content()`: LLM-based content generation
     - `write_markdown_file()`: Safe file writing with encoding
     - `validate_markdown_file()`: Strict format validation
     - `commit_markdown_file()`: Git staging and committing
     - `push_markdown_file()`: Git push with upstream

  2. `sheep.tools`:
     - `GitCommitTool`: For git add and commit operations
     - `GitPushTool`: For pushing to remote with `-u` flag

  3. `sheep.config.llm`:
     - `get_reasoning_llm()`: Provides LLM instance for content generation

  4. `sheep.observability.logging`:
     - `get_logger()`: Structured logger for workflow instrumentation

  **External Dependencies (already in pyproject.toml):**
  - crewai[anthropic,google-genai,tools]>=0.86.0
  - pydantic>=2.0.0
  - gitpython>=3.1.0
  - python-dotenv>=1.0.0 (for .env configuration)

  **Git Requirements:**
  - Current git repository with remote `origin` configured
  - Feature branch `feat/126-markdown-file-create-e7da08` (or current HEAD)
  - Git command-line available in PATH

  ## Size Estimate

  **S (Small)** — Estimated 30-60 minutes of total effort

  ### Justification:

  1. **Simplicity of Task**: Create a single file with minimal content structure
  2. **Well-Established Pattern**: 125 prior features follow identical workflow; infrastructure is mature and proven
  3. **No Code Changes Needed**: Task is file creation only; no modifications to source code
  4. **Reusable Infrastructure**: All supporting functions already exist and are well-tested:
     - `create_markdown_file()` in content_generators.py is the main entry point
     - Validation, git operations, and logging already implemented
  5. **Clear Success Criteria**: File exists, proper format, committed, and pushed
  6. **No Architectural Decisions**: Pattern is fully determined by feature 125 and prior iterations

  ### Time Breakdown:
  - **Understanding & Planning** (5 min): Review spec and prior features
  - **Implementation** (5-10 min): Call `create_markdown_file("test-trd8nx.md")` from content_generators
  - **Validation & Testing** (10-20 min): Verify file format, encoding, git history
  - **Commit & Push** (5 min): Stage, commit with proper message, push to remote

  ### Complexity Drivers (Low):
  - No complex business logic
  - No multi-file dependencies
  - No architectural decisions needed
  - Infrastructure fully mature from 125 prior iterations

