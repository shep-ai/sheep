# Markdown content (the full tasks document)
content: |
  ## Task Summary

  Feature 226 is broken down into 13 concrete tasks across 5 phases:

  1. **Phase 1 (Foundation):** Create module skeleton with constants and imports
  2. **Phase 2 (File Creation):** Implement markdown file creation using pathlib
  3. **Phase 3 (Validation):** Implement 6 independent validation functions
  4. **Phase 4 (Git Integration):** Implement 3 git operations (add, commit, push)
  5. **Phase 5 (Orchestration):** Implement main() function and end-to-end testing

  Each task follows TDD methodology:
  - **RED:** Write test that asserts desired behavior
  - **GREEN:** Implement minimal code to pass test
  - **REFACTOR:** Clean up, add logging, improve error messages

  Task dependencies ensure correct ordering:
  - Phase 1 (task-1) is prerequisite for all other tasks
  - Phase 2 (task-2) must complete before Phase 3 validation tasks
  - Phases 3 & 4 tasks can run in parallel once Phase 2 completes
  - Phase 5 (tasks-12, task-13) depends on all previous phases

  Total effort: ~50 minutes including implementation, tests, and validation. This aligns with the S (10-15 minute) feature estimate, as the estimate reflects implementer effort writing prose content, not total code execution time.

  ## Implementation Notes

  ### Copy from Precedent

  Implementation should follow features 208-211 as exact templates. The module structure, function signatures, validation approach, error handling, and logging are all standardized. Only update:

  - FILENAME = "test-zicq4v.md"
  - FEATURE_NUMBER = 226
  - BRANCH_NAME = "feat/226-markdown-file-creation-4dd4be"
  - COMMIT_MESSAGE = "feat(226): create markdown file test-zicq4v.md with prose content"
  - TITLE_TEXT = "Your chosen title"
  - PROSE_CONTENT = "2-3 sentences of your chosen prose"

  ### TDD Approach

  Each task includes specific RED tests, GREEN implementations, and REFACTOR steps. The tests should be isolated and independently runnable:
  - Validation function tests should mock file I/O to avoid creating real files
  - Git operation tests should mock subprocess.run() to avoid real git commands
  - Integration tests (task-13) run the actual module on the real repository

  ### Error Handling

  Use specific exception types throughout:
  - **FileNotFoundError:** When expected file doesn't exist
  - **ValueError:** For validation failures (format, sentence count, encoding, line endings)
  - **CalledProcessError:** When git commands fail
  - Each exception is caught and logged with context before returning exit code 1

  ### Validation Order

  Validations are performed in this order:
  1. File exists
  2. Markdown format (structure)
  3. Sentence count (content)
  4. UTF-8 encoding
  5. Unix LF line endings
  6. File size (informational)

  This ordering ensures:
  - Early exit if file doesn't exist (prerequisite for all others)
  - Structure check before content checks
  - Encoding/line ending checks after content (to avoid encoding errors during reading)
  - Size check last (no impact on validation)

  ---

  _Task breakdown complete — 13 concrete tasks with TDD cycles, dependencies, acceptance criteria, and effort estimates._
