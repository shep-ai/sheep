content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create test markdown files following an established, repeatable pattern. Feature 226 creates a single test markdown file (`test-zicq4v.md`) at the repository root with a markdown H1 heading as title and exactly 2-3 sentences of prose content.

  This feature is part of the markdown-file-creation pattern (features 069-225), which generates test artifacts demonstrating file creation, git integration, and conventional commit workflows. The 150+ existing test files in the repository root provide clear precedent for file format, structure, and implementation approach.

  The feature is intentionally minimal: it creates one file, stages it with git, commits with a conventional message, and pushes to the feature branch. No source code, tests, or configuration files are modified.

  ## Success Criteria

  - [ ] File `test-zicq4v.md` exists in the repository root directory (no subdirectories)
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content (strictly 2 or 3, not 1 or 4)
  - [ ] Content follows the structure: blank line after heading, then prose sentences
  - [ ] Prose is readable and grammatically correct
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size falls in the typical 400-600 byte range (natural outcome of proper structure)
  - [ ] File is staged in git with `git add test-zicq4v.md`
  - [ ] Git commit exists with message: `feat(226): create markdown file test-zicq4v.md with prose content`
  - [ ] Commit is on the feature branch `feat/226-markdown-file-creation-4dd4be`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-zicq4v.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories, no src/specs/etc.)
  - **FR-3**: File must contain exactly one markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content, on separate lines following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct (validated by implementer during creation)
  - **FR-6**: File must be staged in git using `git add test-zicq4v.md`
  - **FR-7**: File must be committed with the exact message: `feat(226): create markdown file test-zicq4v.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/226-markdown-file-creation-4dd4be`
  - **FR-9**: Changes must be pushed to the remote origin repository (typically origin/feat/226-markdown-file-creation-4dd4be)

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF line endings
  - **NFR-3**: File size should fall in the typical 400-600 byte range as a natural outcome of proper structure (soft guideline, not strict requirement)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 150+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (free-form selection)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages beyond Python standard library

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should sentence count be strictly 2-3 or allow flexibility? | Strictly 2-3 sentences | "Exactly" language signals strict bounds. 150+ existing test files all follow this constraint. Implementation and testing rely on this predictability. |
  | 2 | Is the 400-600 byte file size a hard requirement or soft guideline? | Soft guideline | File size naturally emerges from proper structure. Treating as informational keeps validation focused on structure and content, not byte counts. Matches 150+ precedents. |
  | 3 | How should prose quality be validated—who checks and to what standard? | Implementer self-validation during creation | 150+ existing test files demonstrate this approach works without formal editorial review. Code review validates structure/format. This maintains the ~10-15 minute implementation estimate. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zicq4v.md) to existing collection of 150+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-225; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/226-markdown-file-creation-4dd4be` must exist (pre-created)
  - **File system**: Write access to repository root directory (required)
  - **Established pattern**: 150+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **File naming**: Filename `test-zicq4v.md` is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — 10-15 minutes) — Minimal-effort, single-file creation feature based on 150+ established precedents:

  - **File creation**: ~5 minutes (write H1 heading + 2-3 sentences of prose)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes

  **Justification**: Well-established pattern with identical structure across 150+ existing test files; flexible topic selection with no research needed; single file with straightforward format; no testing/documentation/configuration changes; file naming pre-specified; git workflow is mechanical and directly precedented.

  ---

  _Requirements phase complete — functional and non-functional requirements defined, product decisions documented with structured options and AI recommendations, success criteria specified as measurable checkboxes._
