# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 226 fits into the established Sheep platform architecture as a test artifact feature—one of 200+ similar features (101-225) that demonstrate core platform patterns without modifying source code. The implementation follows the exact structure and patterns established by features 208-211, which serve as templates.

  ### Module Structure

  The feature is implemented as a standalone Python module in `src/sheep/features/feature_226_markdown_file_creation.py`:

  - **Constants:** Define filename, feature number, branch name, commit message, and prose content
  - **Core Functions:** create_markdown_file(), validate_*() functions, git_*() functions
  - **Orchestration:** main() function chains all operations with error handling
  - **Platform Integration:** Uses sheep.observability.logging for structured logging

  The module is independent—it does NOT modify any existing source code in `/src/sheep/` and follows the test artifact philosophy: demonstrating file creation, validation, and git workflows without impact on application behavior.

  ### Design Principles from Research

  1. **Determinism:** Hard-coded prose content ensures identical output on every execution, enabling deterministic testing and auditability.

  2. **No External Dependencies:** Feature uses only Python standard library (pathlib, subprocess, sys) plus platform logger, aligning with NFR-9 and avoiding supply chain risks.

  3. **Comprehensive Validation:** Post-creation validation checks all success criteria before git operations. Fail-fast error handling stops at first error.

  4. **Secure Git Integration:** subprocess.run() with list-based command arguments prevents command injection. Error handling via check=True enables exception-based flow control.

  5. **Platform Pattern Consistency:** Implementation mirrors features 208-211 exactly: same function signatures, validation approach, error handling, and logging.

  ## Key Design Decisions

  ### Decision 1: File Creation Method — pathlib.Path.write_text()

  **Chosen:** `pathlib.Path.write_text(content, encoding=\"utf-8\")`

  **Why:**
  - Modern, Pythonic approach (Python 3.4+)
  - Combines path construction and file I/O cleanly
  - Automatically ensures UTF-8 without BOM and Unix LF line endings on all platforms
  - Implicit file handle management (no context manager needed)
  - Used consistently across all 200+ existing features

  **Rejected Alternatives:**
  - `os.path` module: verbose, split path/I/O responsibility
  - `open()` function: more boilerplate, explicit exception handling

  ### Decision 2: Prose Content — Hard-Coded Deterministic

  **Chosen:** Implementer selects topic and writes 2-3 sentences; content is hard-coded in the module

  **Why:**
  - Ensures determinism: identical file content on every execution
  - Enables auditability: reviewers see exact prose
  - No external dependencies: aligns with NFR-9
  - High reliability: no API failures or external services
  - Matches pattern of 200+ existing features

  **Rejected Alternatives:**
  - Dynamic generation: introduces non-determinism, unpredictable output
  - API-generated: violates NFR-9, adds network latency

  ### Decision 3: Sentence Count Validation — Strict 2-3 with Period Counting

  **Chosen:** Validate exactly 2 or 3 sentences by counting periods (.) in prose content

  **Why:**
  - Spec explicitly requires \"exactly 2-3 sentences\" (strict language)
  - All 200+ existing features validate this constraint precisely
  - Simple period counting is deterministic and robust
  - Maintains consistency across feature family
  - Catches structural mistakes early

  **Rejected Alternatives:**
  - Flexible range (2-4, 2-5): reduces consistency, introduces ambiguity
  - No sentence count validation: reduces mistake detection

  ### Decision 4: Git Integration — subprocess.run() with List Arguments

  **Chosen:** `subprocess.run([\"git\", \"add\"/"commit"/"push\"], check=True, capture_output=True, text=True)`

  **Why:**
  - Security: list-based arguments prevent command injection
  - Error handling: check=True raises CalledProcessError on non-zero exit
  - Output capture: enables logging of stdout/stderr
  - Standard library: no external dependencies
  - Cross-platform: consistent behavior across Windows/Linux/macOS

  **Rejected Alternatives:**
  - GitPython library: external dependency, violates NFR-9
  - `os.system()`: security risk, harder error handling

  ### Decision 5: Encoding & Line Endings — UTF-8 + Default Newline Handling

  **Chosen:** `pathlib.Path.write_text(encoding=\"utf-8\")` without explicit newline parameter

  **Why:**
  - UTF-8 without BOM: encoding=\"utf-8\" ensures no BOM marker
  - Unix LF only: default newline behavior writes LF on all platforms
  - Cross-platform: Python handles platform normalization automatically
  - Simplicity: no need for manual CRLF→LF conversion

  **Rejected Alternatives:**
  - Explicit `newline=\"\"` parameter: adds unnecessary complexity
  - Binary mode: requires b\"\\n\" handling, duplicates work

  ### Decision 6: Validation Strategy — Comprehensive Post-Creation Checks

  **Chosen:** Six validation phases after file creation, before git operations:
  1. File exists
  2. Markdown format: H1 heading line 1, blank line 2
  3. Sentence count: exactly 2-3 periods
  4. UTF-8 encoding without BOM
  5. Unix LF line endings
  6. File size: informational check

  **Why:**
  - Catches all requirements before git operations (fail-fast)
  - Each validation is independently testable
  - Error messages are specific and actionable
  - Validation functions copied from features 208-211 (proven, tested)

  **Rejected Alternatives:**
  - Minimal validation (file exists only): misses structural errors
  - Pre-commit validation (git hooks): adds external tools

  ### Decision 7: Error Handling — Specific Exceptions + Structured Logging

  **Chosen:** Raise specific exception types with context, log at info/error levels, return exit codes

  **Why:**
  - FileNotFoundError: file validation failures
  - ValueError: validation check failures
  - CalledProcessError: git operation failures
  - Each exception logged with context
  - main() returns 0 (success) or 1 (failure)

  **Rejected Alternatives:**
  - Generic Exception catch: loses error details
  - Silent failures: callers can't distinguish success/failure

  ### Decision 8: Logging — Platform Infrastructure (sheep.observability.logging)

  **Chosen:** Use `sheep.observability.logging.get_logger(__name__)` for all logging

  **Why:**
  - Integrates with platform observability and monitoring
  - Provides structured, filterable logs at info/debug/error levels
  - Enables audit trails for feature execution
  - Consistent logging across all 200+ features

  **Rejected Alternatives:**
  - stdout/stderr via print(): not structured, harder to filter
  - No logging: harder debugging, no audit trail

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: Foundation & Module Setup** (prerequisite for all other phases)
  - Establish module structure, constants, imports
  - No dependencies; enables Phase 2+

  **Phase 2: File Creation & Content** (prerequisite for validation)
  - Implement core file creation logic
  - Must complete before Phase 3 (can't validate a non-existent file)

  **Phase 3 & 4: Validation & Git Operations** (can run in parallel once Phase 2 completes)
  - Validation functions are independent
  - Git operations are independent
  - Both depend on Phase 1 (imports, logging)

  **Phase 5: Orchestration & Integration** (final phase, depends on all previous phases)
  - main() function orchestrates all operations
  - Implements error handling and exit codes
  - Enables end-to-end testing

  ### Implementation Approach

  1. **Copy from Precedent:** Feature 208-211 provide exact templates. Implementation follows structure directly, updating constants.

  2. **TDD Approach:** Each function has RED (write test), GREEN (minimal implementation), REFACTOR (cleanup).

  3. **Incremental Validation:** Each validation function tested independently, then all validators tested together.

  4. **Git Workflow:** Git operations tested to ensure correct execution.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Encoding errors (BOM, CRLF on Windows) | Medium | High | Explicit encoding=\"utf-8\" without newline parameter; validation checks before git ops |
  | Sentence count off-by-one | Medium | Medium | Simple period counting; comprehensive validation; TDD with test cases |
  | Git operations fail | Low-Medium | High | Validation functions run before git ops; subprocess error handling via check=True |
  | Markdown format validation too strict | Low | Low | Validation mirrors 200+ existing features; implementation can adjust based on tests |
  | Copy-paste errors from precedent | Low | High | Use exact feature 208-211 as template; TDD validates correctness |
  | File overwrite silently succeeds | Low-Medium | Low | pathlib.write_text() overwrites by design; idempotent behavior is intended |
  | Prose quality issues | Medium | Low | Implementer self-validates; code review validates structure |

  ## Conclusion

  Feature 226 is a well-scoped, low-risk implementation following proven patterns from 200+ preceding features. The architecture is straightforward: single file creation, comprehensive validation, git integration. Key design decisions align with research findings and platform conventions. Implementation can be based directly on features 208-211 with systematic updates to constants and content. Total effort estimate: 10-15 minutes (S size).
