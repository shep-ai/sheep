decisions:
  - title: "File Creation Method: pathlib.Path vs os.path vs open()"
    chosen: "Python pathlib.Path.write_text() with encoding='utf-8'"
    rejected:
      - "os.path module — verbose, less Pythonic, split file path handling from I/O operations, not used in 200+ existing features"
      - "open() function with explicit mode/encoding — more boilerplate, requires exception handling for file handle closure, less readable for simple write operations"
    rationale: >
      pathlib.Path is the modern, Pythonic approach endorsed by Python 3.4+. It combines path construction and I/O operations cleanly, provides implicit file handle management, and is used consistently across all 200+ existing test file creation features (feature 101-211). The .write_text(encoding='utf-8') method automatically ensures UTF-8 encoding without BOM and Unix LF line endings by default on all platforms. This approach eliminates encoding-related bugs and provides clear intent.

  - title: "Content Generation: Hard-coded vs Dynamic vs API-Generated"
    chosen: "Hard-coded deterministic prose content"
    rejected:
      - "Dynamic generation (random topic, random prose) — introduces non-determinism, unpredictable file sizes and content, makes testing and review harder, not precedented in 200+ features"
      - "API-generated content (LLM, external service) — introduces external dependencies, network latency, API costs, failure modes, violates NFR-9 (no external packages), counter to feature philosophy"
    rationale: >
      All 200+ existing test files use hard-coded content for determinism, auditability, and reliability. This approach ensures identical file content on every execution, simplifies testing and code review (reviewers see exact prose), eliminates external dependencies, and aligns with the feature's purpose as a test artifact demonstrating straightforward file creation. The implementer selects a meaningful topic and writes 2-3 readable sentences.

  - title: "Prose Validation: Strict Sentence Count vs Flexible Count"
    chosen: "Strict 2-3 sentence validation using period counting"
    rejected:
      - "Flexible 2-4 or 2-5 sentences — reduces consistency with 200+ precedent files that all use exactly 2-3, introduces ambiguity, makes validation less predictable, conflicts with spec language 'exactly 2-3'"
      - "No sentence count validation — relies on implementer good faith, reduces detectability of mistakes, harder to enforce consistency across features"
    rationale: >
      The spec requires 'exactly 2-3 sentences' with strict language, and all 200+ existing features validate this constraint precisely. Simple period counting provides deterministic validation (periods equal sentences in properly punctuated prose). This maintains consistency across the feature family and catches structural mistakes early. The spec resolves this as a hard requirement.

  - title: "Git Integration: subprocess.run() vs GitPython vs os.system()"
    chosen: "subprocess.run() with list-based command arguments and check=True"
    rejected:
      - "GitPython library — external dependency that violates NFR-9 (no external packages beyond Python stdlib), adds abstraction layer, unnecessary for simple git operations"
      - "os.system() — security risk (command injection), harder to capture output and check errors, less portable across platforms, deprecated for new code"
    rationale: >
      subprocess.run() with list arguments provides secure command execution (no shell injection), clean error handling via check=True and CalledProcessError, output capture for logging, and is used across all 200+ existing features. The subprocess module is part of Python standard library (no external dependency), provides excellent cross-platform support, and enables precise control over git command execution. List-based arguments avoid shell-parsing vulnerabilities.

  - title: "File Encoding/Line Endings: Explicit newline Parameter vs Default Behavior"
    chosen: "Use pathlib.Path.write_text(encoding='utf-8') with default newline handling"
    rejected:
      - "Explicit newline='' parameter with manual CRLF→LF conversion — adds complexity, unnecessary (Python default newline handling already ensures LF on all platforms when using text mode with no newline parameter), harder to read"
      - "Binary mode with manual encoding — requires manual b'\\n' handling, encoding bytes to UTF-8, duplicates complexity, less readable"
    rationale: >
      Python's default behavior in text mode (no newline parameter) automatically uses universal newlines, writing LF on all platforms (Windows, Linux, macOS). When writing to a file with pathlib.write_text(), specifying encoding='utf-8' and omitting the newline parameter ensures UTF-8 encoding without BOM and Unix LF line endings across all platforms. This is the approach used in all 200+ existing features and is explicitly documented in feature 208-211 implementation code.

  - title: "Validation Strategy: Comprehensive Post-Creation vs Minimal vs Pre-Commit Checks"
    chosen: "Comprehensive post-creation validation with fail-fast error handling"
    rejected:
      - "Minimal validation (file exists only) — misses structural mistakes, encoding errors, line ending issues, sentence count violations, hard to debug failures"
      - "Pre-commit validation (git hooks, linting) — adds external tooling complexity, not precedented, moves validation away from feature code"
    rationale: >
      All 200+ existing features use comprehensive validation orchestrated by the feature module itself: file existence, markdown format (H1 heading + blank line + content), sentence count (2-3), UTF-8 encoding without BOM, Unix LF line endings, and file size (informational). Each validation function is testable independently, provides clear error messages, and stops at first error (fail-fast). This catches mistakes early, before git operations, and ensures consistent quality. All validation functions are copied from feature 208/211 precedent with no modifications.

  - title: "Error Handling: Exception Types vs Generic Catch vs Silent Failures"
    chosen: "Specific exception types (FileNotFoundError, ValueError, CalledProcessError) with logging"
    rejected:
      - "Generic Exception catch — hides error details, harder to debug, loses context about what operation failed"
      - "Silent failures (no exceptions, return error codes only) — callers can't distinguish success from failure, errors propagate silently"
    rationale: >
      Feature modules raise specific exceptions at each phase (file creation, validation, git operations), with structured logging at info/error levels. Callers can catch and handle specific errors. The main() function catches expected exceptions and returns exit codes (0 for success, 1 for any failure). This approach is used across all 200+ features and provides clear error semantics for the platform orchestrating the feature execution.

  - title: "Logging Strategy: Library Logger vs stdout/stderr vs No Logging"
    chosen: "Use sheep.observability.logging.get_logger() from established platform infrastructure"
    rejected:
      - "stdout/stderr directly via print() — not structured, harder to filter/search, doesn't integrate with platform observability"
      - "No logging — makes debugging failures harder, no audit trail, harder to understand execution flow"
    rationale: >
      The Sheep platform provides a centralized logging infrastructure (sheep.observability.logging.get_logger()). All 200+ existing features use this logger for structured, filterable logging at info/debug/error levels. This integrates with platform observability, enables audit trails, and provides consistent logging behavior across all features. Using the platform logger ensures consistency and eases operational visibility.

