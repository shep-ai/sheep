content: |
  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path

  **Chosen:** `pathlib.Path.write_text(markdown_content, encoding='utf-8')`

  **Rejected:**
  - `os.path` module — verbose multi-step approach (construct path, open file, write, close), not Pythonic, split responsibility between path and I/O
  - `open()` function — requires explicit mode/encoding parameters, exception handling for file handle closure, more boilerplate for simple write operation

  **Rationale:**
  pathlib is the modern Python standard for file path operations since Python 3.4. The `.write_text()` method:
  - Combines path construction and I/O in a single operation
  - Automatically handles file opening/closing (no context manager needed)
  - Accepts encoding parameter directly
  - On all platforms (Windows/Linux/macOS), when encoding='utf-8' is specified with no newline parameter, automatically writes:
    - UTF-8 without BOM (Byte Order Mark)
    - Unix LF line endings (\n)
  - Used consistently across all 200+ existing test file creation features (101-211)
  - Provides clear, readable code intent

  ### 2. Content Generation: Hard-Coded Prose

  **Chosen:** Hard-coded, deterministic title and prose content selected by implementer

  **Rejected:**
  - Dynamic generation (random topic/sentences) — introduces non-determinism, unpredictable output, makes testing and review harder
  - API-generated content (LLM, external service) — external dependency violates NFR-9, adds network latency and failure modes, not precedented

  **Rationale:**
  All 200+ existing test files use hard-coded content because:
  - **Determinism:** Identical file content on every execution
  - **Auditability:** Reviewers see exact prose and can validate quality
  - **No dependencies:** Aligns with NFR-9 (standard library only)
  - **Reliability:** No external API failures, no network latency
  - **Test artifact philosophy:** File is a synthetic test artifact, not user-facing content

  The implementer selects a meaningful topic (technical, scientific, or general interest) and writes 2-3 readable sentences. Prose validation occurs via code review for structural compliance and prose quality inspection.

  ### 3. Prose Validation: Strict 2-3 Sentence Count

  **Chosen:** Validate exactly 2 or 3 sentences using period counting

  **Rejected:**
  - Flexible range (2-4, 2-5 sentences) — reduces consistency with 200+ precedent files
  - No sentence count validation — increases likelihood of mistakes, harder to enforce across features

  **Rationale:**
  The spec uses explicit language "exactly 2-3 sentences" per FR-4 and resolves the open question in favor of strict bounds. Simple period counting provides deterministic validation that is robust for properly punctuated English prose. This maintains consistency across the feature family and catches structural mistakes before git operations.

  ### 4. Git Integration: subprocess.run()

  **Chosen:** `subprocess.run(["git", "add"/"commit"/"push"], check=True, capture_output=True, text=True)`

  **Rejected:**
  - GitPython library — external dependency violates NFR-9, adds abstraction layer
  - `os.system()` — security risk (command injection), harder error handling, deprecated

  **Rationale:**
  subprocess.run() with list-based arguments is the secure standard for subprocess execution:
  - **Security:** List arguments avoid shell command injection (unlike os.system() or subprocess with shell=True)
  - **Error handling:** check=True raises CalledProcessError on non-zero exit, enabling fail-fast behavior
  - **Output capture:** capture_output=True enables logging of stdout/stderr for debugging
  - **Standard library:** No external dependencies (aligns with NFR-9)
  - **Precedent:** Used in all 200+ existing features (101-211)
  - **Cross-platform:** Consistent behavior across Windows/Linux/macOS

  ### 5. Encoding/Line Endings: UTF-8 + Default Newline Handling

  **Chosen:** `pathlib.Path.write_text(encoding='utf-8')` without explicit newline parameter

  **Rejected:**
  - Explicit `newline=''` parameter — adds unnecessary complexity, Python's default already handles correctly
  - Binary mode with manual encoding — requires manual b'\n' handling, duplicates work, less readable

  **Rationale:**
  Python's text mode with `encoding='utf-8'` and default newline handling (no newline parameter):
  - **UTF-8 without BOM:** Specified encoding='utf-8' (not 'utf-8-sig') ensures no BOM marker
  - **Unix LF only:** Default newline behavior in text mode writes LF on all platforms
  - **Cross-platform:** Identical behavior on Windows, Linux, macOS (Python handles platform normalization)
  - **Simplicity:** No need for manual CRLF→LF conversion or binary mode handling
  - **Precedent:** This exact approach is used and documented in features 208-211

  ### 6. Validation Strategy: Comprehensive Post-Creation Checks

  **Chosen:** Comprehensive validation after file creation, before git operations. Validation phases:
  1. File exists (FileNotFoundError if not)
  2. Markdown format: exactly one H1 heading on line 1, blank line 2 (ValueError if not)
  3. Sentence count: exactly 2-3 periods in prose content (ValueError if not)
  4. UTF-8 encoding without BOM: reject files starting with bytes EF BB BF (ValueError if not)
  5. Unix LF line endings: reject CRLF (\r\n) and CR (\r) (ValueError if not)
  6. File size: informational check (300-800 bytes expected, logged if outside range)

  **Rejected:**
  - Minimal validation (file exists only) — misses structural, encoding, and line ending errors
  - Pre-commit validation (git hooks) — adds external tools, moves validation away from feature code

  **Rationale:**
  Comprehensive validation catches all requirements before git operations:
  - Each validation function is independently testable and can be run in isolation
  - Fail-fast behavior: stops at first error with clear error message
  - Error messages are specific (e.g., "File must contain exactly 2-3 sentences, found 4")
  - All validation functions are copied directly from features 208-211 (proven, tested pattern)
  - Ensures consistent quality across all features
  - Enables debugging: clear which requirement failed

  ### 7. Error Handling: Specific Exception Types + Logging

  **Chosen:** Raise specific exception types (FileNotFoundError, ValueError, CalledProcessError) with structured logging

  **Rejected:**
  - Generic Exception catch — loses error context
  - Silent failures (no exceptions) — callers can't distinguish success from failure

  **Rationale:**
  - **FileNotFoundError:** Raised by file validation when file doesn't exist
  - **ValueError:** Raised by validation checks (markdown format, sentence count, encoding, line endings)
  - **CalledProcessError:** Raised by git operations (add, commit, push) when git commands fail
  - Each exception is caught and logged with context (file name, expected vs actual)
  - main() function catches expected exceptions and returns exit code (0 for success, 1 for failure)
  - Platform orchestration layer can handle feature failures predictably based on exception type

  ### 8. Logging Infrastructure: sheep.observability.logging

  **Chosen:** Use `sheep.observability.logging.get_logger(__name__)` from platform infrastructure

  **Rejected:**
  - stdout/stderr via print() — not structured, harder to filter/aggregate, doesn't integrate with platform observability
  - No logging — harder debugging, no audit trail

  **Rationale:**
  The Sheep platform provides centralized logging infrastructure. Using the platform logger:
  - Integrates with platform observability and monitoring
  - Provides structured, filterable logs at info/debug/error levels
  - Enables audit trails for feature execution
  - Consistent logging behavior across all 200+ features
  - Logs include context (function name, operation, success/failure)

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File path construction and I/O | Use | Modern, Pythonic, built into Python 3.4+, used across all 200+ features, supports .write_text() with encoding parameter |
  | subprocess (stdlib) | Git command execution | Use | Secure (list-based args prevent injection), built-in, provides error handling and output capture |
  | sys (stdlib) | Exit code handling | Use | Standard way to return exit codes from main() function |
  | sheep.observability.logging | Structured logging | Use | Platform infrastructure, integrates with observability, consistent with all features |
  | GitPython | Git operations abstraction | Reject | External dependency, violates NFR-9 (no external packages), unnecessary abstraction for simple operations |
  | Any external LLM/content generation | Content generation | Reject | External dependency, violates NFR-9, introduces network latency and failure modes, not precedented |

  ## Security Considerations

  1. **Command Injection Prevention:** Git operations use subprocess.run() with list-based command arguments (["git", "add", filename]), not string-based shell commands. This prevents command injection attacks even if filename or other parameters contain special characters.

  2. **File Encoding:** UTF-8 encoding without BOM is explicitly specified, preventing encoding-based attacks or ambiguities. Validation confirms encoding is correct before git operations.

  3. **Path Traversal:** Filename is hard-coded (test-zicq4v.md) and created in current working directory (repo root). No dynamic path construction or user input in path, preventing directory traversal attacks.

  4. **Logging Safety:** Logs include filenames and error messages but not sensitive content. Validation failure messages are user-friendly and don't expose system internals.

  5. **No External Dependencies:** Restricting to Python standard library (pathlib, subprocess, sys) + platform infrastructure (logging) eliminates supply chain risks from external packages.

  ## Performance Implications

  1. **File Creation:** pathlib.Path.write_text() is optimized for single file write operations (150-400 bytes), completes in <1ms on modern file systems.

  2. **Validation:** All validation functions complete in <1ms (simple string/binary operations, no I/O loops). Fail-fast behavior ensures fastest failure detection.

  3. **Git Operations:** subprocess.run() adds ~100-500ms per command (git add, commit, push) depending on repository size and network latency (for push). These are network-bound, not CPU-bound. Expected total time: 1-3 seconds for all git operations combined.

  4. **Total Feature Execution:** Expected 10-15 minutes total per spec estimate (most time spent by implementer writing prose content, not by code execution). Code execution (file creation, validation, git ops) completes in <5 seconds.

  5. **Memory Usage:** Minimal — all operations are streaming/single-pass. File content is constructed once as a string (~400 bytes), validated once, committed. No batch operations or large data structures.

  6. **Validation Efficiency:** Each validation function reads the file once and performs targeted checks (format, encoding bytes, line ending bytes, sentence count). No redundant I/O or parsing.

  ## Architecture Notes

  ### Relationship to Existing Codebase

  Feature 226 follows the exact architecture established by 200+ preceding test file creation features (101-211):

  1. **Feature Module Structure:** Located in `src/sheep/features/feature_226_markdown_file_creation.py`
     - Defines constants: FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT
     - Implements functions: create_markdown_file(), validate_*(), git_*(), main()
     - Uses platform logger: sheep.observability.logging.get_logger()

  2. **No Source Code Modifications:** Feature 226 does NOT modify any files in src/sheep/ other than adding the new feature module. No changes to agents, flows, tools, or configuration.

  3. **Git Workflow Integration:** Feature fits into the Sheep workflow:
     - Pre-created feature branch: feat/226-markdown-file-creation-4dd4be
     - Feature module executes git add, commit, push operations
     - Conventional commit message: feat(226): create markdown file test-zicq4v.md
     - Integration with CI/CD pipeline via standard git operations

  4. **Testing and Validation:** Feature can be tested by:
     - Running feature module directly: `python -m src.sheep.features.feature_226_markdown_file_creation`
     - Checking git status and log after execution
     - Verifying file content with manual inspection or test harness

  5. **Precedent-Based Implementation:** This feature has identical structure to features 208-211. Implementation can be based directly on feature 208 with constant updates (filename, title, branch name, prose content).

  ### Dependencies

  - **Internal:** sheep.observability.logging (platform logger)
  - **External:** None (Python standard library only)
  - **System:** Git binary must be available in PATH, write access to repository root

  ### Integration Points

  - Git repository: Feature branch must exist (pre-created)
  - File system: Write access to repository root directory required
  - Platform logger: Uses standard sheep observability infrastructure
  - Git configuration: Standard git user.name/user.email must be configured (git prerequisite)

  ## Conclusion

  Feature 226 is a straightforward implementation following the established pattern from 200+ preceding features. The architecture is well-proven, low-risk, and tightly scoped to file creation + validation + git operations. No new dependencies, no source code modifications, and no architectural changes required. Implementation should follow features 208-211 as exact templates.

  ---

  _Research phase complete — all technical decisions documented with detailed rationale, library analysis completed, security and performance implications identified._
