# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-6i327u.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 230+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 001-228, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-6i327u.md` created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (line starting with `#`) as the title
  - [ ] Blank line separates the H1 heading from prose content (line 1: heading, line 2: empty, line 3+: prose)
  - [ ] File contains exactly 2-3 sentences of prose content in natural language
  - [ ] File is encoded in UTF-8 with Unix LF line endings (no CRLF)
  - [ ] File is valid CommonMark markdown with no syntax errors
  - [ ] File is staged in git with `git add test-6i327u.md` command
  - [ ] File is committed with exact message: `feat(229): create markdown file test-6i327u.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/229-markdown-file-creation-51acd6`
  - [ ] File size is approximately 400-600 bytes (consistent with test-kh6ey2.md and test-arvwkm.md precedents)
  - [ ] No existing files are modified, overwritten, or deleted
  - [ ] Implementation uses Python standard library only (pathlib module; no external dependencies)
  - [ ] Implementation is idempotent (running twice does not cause errors or duplicates)

  ## Functional Requirements

  - **FR-1: File Creation** — The system must create a markdown file named exactly `test-6i327u.md` in the repository root directory using Python `pathlib.Path.write_text()`
  - **FR-2: Heading Structure** — The file must contain exactly one H1 markdown heading (`# <title>`) on the first line of the file
  - **FR-3: Heading-Content Separation** — The file must contain exactly one blank line between the H1 heading (line 1) and the prose content (starting line 3)
  - **FR-4: Prose Content** — The file must contain between 2 and 3 complete sentences of prose content after the blank line separator
  - **FR-5: Text Encoding** — The file must be saved with UTF-8 character encoding and Unix LF (`\n`) line endings, not CRLF or other encodings
  - **FR-6: Markdown Validity** — The file structure must be valid CommonMark markdown with no syntax errors or malformed content
  - **FR-7: Git Staging** — The file must be staged in the git index using `git add test-6i327u.md` command
  - **FR-8: Git Commit** — The staged file must be committed with the exact conventional commit message: `feat(229): create markdown file test-6i327u.md with prose content`
  - **FR-9: Push to Branch** — The commit must be pushed to the remote feature branch `feat/229-markdown-file-creation-51acd6` using standard `git push` operations

  ## Non-Functional Requirements

  - **NFR-1: Performance** — File creation, validation, and git operations must complete in under 30 seconds total execution time
  - **NFR-2: Compatibility** — Implementation must work with Python 3.11+ using only the standard library (pathlib module); no external dependencies or pip packages required
  - **NFR-3: Consistency** — File structure, format, and content length must match the established pattern used in features 001-228 and the 230+ existing test markdown files (test-*.md)
  - **NFR-4: Reliability** — Git operations must succeed on standard GitHub configuration without requiring authentication workarounds, custom hooks, or special setup
  - **NFR-5: Maintainability** — Implementation code must be straightforward and simple enough to serve as a replicable template for the markdown-file-creation pattern
  - **NFR-6: Idempotency** — Running the implementation multiple times on the same repository state must not cause errors, file conflicts, or duplicate commits

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the prose content address? | Any topic (implementer's choice) | User query explicitly states "about anything"; establishes maximum flexibility. 228+ prior test files use diverse, arbitrary topics. No constraint needed. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as an agentic platform for automated code implementation:

  ```
  .
  ├── src/sheep/              # Core platform source code (not modified by this feature)
  │   ├── agents/             # Agent definitions
  │   ├── config/             # Configuration management
  │   ├── flows/              # Orchestration flows
  │   ├── tools/              # Agent tools
  │   └── observability/      # Logging and tracing
  ├── specs/                  # Feature specifications (001-229)
  ├── tests/                  # Test suite (not modified by this feature)
  ├── test-*.md               # 230+ test markdown files (this is where feature files are created)
  ├── *.py                    # Various automation and implementation scripts
  ├── README.md               # Project documentation
  ├── pyproject.toml          # Python package configuration
  └── docker-compose.yml      # Docker orchestration
  ```

  ### Architecture Patterns

  1. **File Creation Pattern**: 230+ identical features create test markdown files following a strict pattern:
     - Single H1 heading (`# Title`) as the first line
     - Blank line after heading
     - 2-3 sentences of prose content
     - UTF-8 encoding, Unix LF line endings
     - Typical file size 400-600 bytes

  2. **Git Workflow Pattern**: All test file features follow the same git process:
     - File created in repository root directory
     - File staged with `git add <filename>`
     - Committed with conventional message: `feat(<number>): create markdown file <filename> with prose content`
     - Pushed to feature branch (already created)

  3. **Implementation Pattern**: Proven approach across all 228 prior features:
     - Use Python `pathlib.Path` for file I/O
     - Write heading and prose content as single UTF-8 string
     - Stage file in git
     - Create conventional commit
     - Push to origin

  ### Relevant Technologies

  **Markdown**: CommonMark-compliant format used for all test files. Simple structure: `# Heading\n\n<prose>`

  **Git**: Version control integration. Feature branch pre-created at `feat/229-markdown-file-creation-51acd6`. Standard workflow: add, commit, push.

  **Python 3.11+**: Runtime for file I/O and git operations. `pathlib.Path` is standard library (no external dependencies).

  **File I/O**: Simple file write operation. No complex parsing, validation, or transformation needed.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-6i327u.md) to existing collection of 230+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-228; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/ or elsewhere |
  | Specs Directory | Low | Updates this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |
  | Configuration | None | No changes to pyproject.toml, .env, docker-compose.yml, or other config files |
  | Dependencies | None | No new dependencies; uses only Python standard library (pathlib) |

  ## Dependencies

  - **Git repository**: Feature branch `feat/229-markdown-file-creation-51acd6` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 230+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **File naming**: Filename `test-6i327u.md` is specified in the feature spec and must be used exactly
  - **Content structure**: Verified pattern from test-kh6ey2.md and test-arvwkm.md examples (H1 heading + blank line + 2-3 sentences)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature with well-established precedent:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure compliance with success criteria)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 230+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + blank line + prose)
  - No testing, documentation, configuration changes, or code modifications required
  - File naming (`test-6i327u.md`) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 228+ prior implementations
  - No dependencies on external APIs, databases, or complex business logic
  - Success criteria are objective and verifiable

  ---

  _Requirements phase complete — Feature 229 is fully specified with functional and non-functional requirements, measurable success criteria, and resolved product questions. Implementation approach is proven across 228 identical prior features. Ready for Implementation phase._
