content: |
  ## Architecture Overview

  This feature implements a simple, single-purpose script that creates a markdown file
  and performs git integration. The architecture follows the proven pattern from
  features 160-220 (60+ successful implementations):

  **Script Structure:**
  - Module-level constants: `FILENAME`, `TITLE`, `PROSE`, `COMMIT_MESSAGE`
  - Core functions: `create_file()`, `git_add()`, `git_commit()`, `git_push()`
  - Main orchestrator: `main()` with try/except error handling
  - Total scope: ~50 lines of code

  **No Dependencies:**
  - Standard library only (pathlib, subprocess, sys)
  - No external packages (violates NFR-3 if used)
  - No integration with Sheep platform (src/sheep/ untouched)
  - Compatible with Python 3.11+

  ## Key Design Decisions

  ### 1. Python pathlib for File Creation

  **Decision:** Use `Path.write_text()` with explicit UTF-8 encoding and LF line endings

  **Rationale:**
  - Modern, safe, cross-platform approach
  - Standard library only (no external deps)
  - Explicit `encoding="utf-8"` ensures UTF-8 without BOM
  - Explicit `newline="\n"` forces Unix LF on all platforms (Windows/macOS/Linux)
  - Proven pattern across features 219-220 and 60+ precedents
  - `FileExistsError` exception provides defensive check

  **Implementation Reference:**
  Feature 219 uses this exact pattern:
  ```python
  content = f"# {TITLE}\n\n{PROSE}\n"
  file_path = Path(FILENAME)
  file_path.write_text(content, encoding="utf-8", newline="\n")
  ```

  ### 2. Flexible/Generic Content (No Theme Constraint)

  **Decision:** Accept any topic for prose content; no thematic restriction

  **Rationale:**
  - User query explicitly states "about anything"
  - Minimizes decision overhead, enables fastest execution
  - Aligns with test file pattern (200+ files with varied topics)
  - Features 219-220 confirm this approach

  **Content Structure:**
  - H1 heading: Single line (e.g., "# The Importance of Clear Communication")
  - Blank line: Separates heading from prose (standard markdown)
  - 2-3 sentences: Single prose paragraph (~300-500 bytes total)
  - Final newline: Ensures proper file termination

  ### 3. Sequential subprocess for Git Operations

  **Decision:** Use subprocess.run() with check=True for each git command in order

  **Rationale:**
  - Established pattern across all 60+ features (160-220)
  - Provides safe error handling via CalledProcessError
  - Cross-platform compatible
  - Standard library only (no GitPython or pygit2 dependencies)
  - Clear separation of concerns (each operation independent)

  **Workflow:** add → commit → push (strict sequence, no parallelization)

  **Git Commands:**
  - `git add FILENAME` — stages file for commit
  - `git commit -m "feat(221): Create markdown file test-5vnehe.md"` — conventional commits format
  - `git push -u origin HEAD` — pushes to feature branch with upstream tracking

  ### 4. Minimal Error Handling (No Validation Layer)

  **Decision:** Catch specific exceptions only; no post-creation validation

  **Rationale:**
  - Spec explicitly requires "No validation, create only"
  - Feature 220 (immediate predecessor) uses this pattern
  - Keeps implementation lean (~50 lines vs 150+ with full validation)
  - Lightweight error handling provides meaningful diagnostics without over-complicating

  **Error Handling Strategy:**
  - `FileExistsError` — defensive check before write
  - `OSError` — file I/O problems (permissions, disk space, etc.)
  - `subprocess.CalledProcessError` — git command failures with exit code and command output

  **Explicitly NOT included:**
  - File encoding validation (pathlib with `encoding="utf-8"` guarantees correct encoding)
  - Line ending validation (pathlib with `newline="\n"` guarantees LF)
  - Markdown structure validation (spec says create only, no validation)
  - Sentence count validation (content is hardcoded, count guaranteed)

  ## Implementation Strategy

  **Phase Ordering & Rationale:**

  **Phase 1: Script Implementation** comes first because:
  - Foundation for all subsequent work
  - No dependencies on other phases
  - Clear, isolated scope (file creation only)
  - Allows rapid feedback on core logic

  **Phase 2: Git Integration & Execution** comes second because:
  - Depends on script from Phase 1
  - Includes execution (actual feature completion)
  - Verification confirms success criteria
  - Natural culmination of the work

  **Execution Time Estimate:** ~10-15 minutes total
  - Phase 1: ~5-7 minutes (script development)
  - Phase 2: ~5-8 minutes (git operations, execution, verification)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (e.g., from prior partial run) | `FileExistsError` exception on `Path.exists()` check. Script fails fast with clear error message. |
  | Incorrect file encoding or line endings | Explicit `encoding="utf-8"` and `newline="\n"` parameters in pathlib force correct format. No post-creation validation needed. |
  | Git configuration missing (user.name, user.email) | Pre-condition (NFR-8): assumes git is configured. subprocess.CalledProcessError provides clear error if git fails. |
  | Network failure during git push | subprocess.CalledProcessError on push failure. User can retry; script is idempotent (FileExistsError on second run). |
  | Typo in hardcoded values (filename, commit message) | Values are module-level constants, reviewed in code. No user input, no runtime variability. Cross-check against spec before finalizing. |
  | Cross-platform line ending issues | pathlib with `newline="\n"` ensures Unix LF on Windows/macOS/Linux. Tested pattern from features 219-220. |
  | Feature branch not checked out | Pre-condition: assumes branch is already current. git push fails with clear error if branch mismatch. |

  ## Success Criteria Mapping

  Implementation plan ensures all success criteria are met:

  | Criterion | Implementation Phase | How It's Met |
  | --------- | -------------------- | ------------ |
  | File test-5vnehe.md exists in repo root | Phase 1: File creation with pathlib | Path.write_text() creates file in CWD (repo root) |
  | Contains H1 heading as title | Phase 1: Content structure | `content = f"# {TITLE}\n\n..."` |
  | Contains 2-3 sentences of prose | Phase 1: Content structure | Hardcoded PROSE variable (3 sentences, 300-500 bytes) |
  | Unix line endings (LF) | Phase 1: File creation parameters | `newline="\n"` forces LF on all platforms |
  | File is staged in git | Phase 2: Git add operation | `subprocess.run(["git", "add", FILENAME])` |
  | Conventional commit message format | Phase 2: Git commit | `"feat(221): Create markdown file test-5vnehe.md"` |
  | Commit pushed to feature branch | Phase 2: Git push | `subprocess.run(["git", "push", "-u", "origin", "HEAD"])` |
  | Format consistent with existing test files | Phase 1: Content structure | Matches test-6ess1a.md structure exactly |
  | Feature branch HEAD points to new commit | Phase 2: Git push | Push updates branch HEAD to new commit |
