content: |
  ## Implementation Summary

  This task breakdown implements feature 221 across 2 phases following the proven pattern
  from features 219-220:

  **Phase 1: Script Implementation & File Creation (3-4 minutes)**

  Task 1 creates the core implementation script with file creation logic. This task
  establishes the foundation by defining constants (filename, title, prose, commit message)
  and implementing the create_file() function using pathlib with explicit UTF-8 encoding
  and Unix LF line endings. The implementation follows feature 219 style exactly.

  **Phase 2: Git Integration & Deployment (5-8 minutes)**

  Task 2 adds git integration to the script. This task implements three git functions
  (git_add, git_commit, git_push) using subprocess with check=True, plus a main()
  orchestrator function. Error handling includes specific exception types for clear
  user feedback. Task 3 executes the complete script and verifies all success criteria
  are met by checking file existence, content format, git commit, and remote push.

  **Workflow (Sequential Execution)**

  1. Task 1: Script created with file creation logic
  2. Task 2: Git functions added, error handling complete
  3. Task 3: Script executed, all criteria verified

  Each task depends only on prior tasks. Task 3 depends on Task 2 (requires complete
  script), Task 2 depends on Task 1 (requires base script structure).

  **TDD Cycles**

  Each task follows RED-GREEN-REFACTOR:
  - **RED:** Define behavior, acceptance criteria, what needs to happen
  - **GREEN:** Implement minimal code to satisfy acceptance criteria
  - **REFACTOR:** Ensure code matches established patterns from features 216-220

  Task 3 (verification) uses TDD to verify success rather than implement new code.

  **Success Criteria**

  All 9 success criteria from the feature spec are addressed:
  - ✓ File test-5vnehe.md exists in repository root (Task 1, Task 3)
  - ✓ File contains valid markdown with H1 heading (Task 1, Task 3)
  - ✓ File contains exactly 2-3 sentences of prose (Task 1, Task 3)
  - ✓ File uses Unix line endings (Task 1, Task 3)
  - ✓ File is staged in git (Task 2, Task 3)
  - ✓ Commit created with conventional message (Task 2, Task 3)
  - ✓ Commit pushed to feature branch (Task 2, Task 3)
  - ✓ Format consistent with existing test files (Task 1, Task 3)
  - ✓ Feature branch HEAD points to new commit (Task 2, Task 3)

  **Estimated Effort: 10-15 minutes**
  - Task 1: 3-4 minutes (script structure and file creation)
  - Task 2: 3-4 minutes (git functions and error handling)
  - Task 3: 2-3 minutes (execution and verification)

  This aligns with the feature's "S" (Small) size estimate and matches the execution
  time of features 219-220.
