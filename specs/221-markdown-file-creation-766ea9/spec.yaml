content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-5vnehe.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 200+ similar test files already existing in the repository as precedents. This feature demonstrates
  core capabilities: file creation, git staging, conventional commits, and push-to-remote
  operations—all essential building blocks in the Sheep automation platform.

  ## Success Criteria

  - [ ] File `test-5vnehe.md` exists in repository root
  - [ ] File contains valid markdown with H1 heading (# Title format) as title
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File uses Unix line endings (LF, not CRLF)
  - [ ] File is staged in git (git add successful)
  - [ ] Commit created with conventional commit message format: `feat(221): Create markdown file test-5vnehe.md`
  - [ ] Commit is pushed to feature branch `feat/221-markdown-file-creation-766ea9`
  - [ ] File format is consistent with existing test files (test-*.md) in repository
  - [ ] Feature branch HEAD points to the new commit with the created file

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly `test-5vnehe.md` in the repository root directory
  - **FR-2**: File must contain a valid markdown H1 heading (# syntax) as the title
  - **FR-3**: File must contain exactly 2-3 sentences of prose content after the heading
  - **FR-4**: Stage the created file in git using `git add test-5vnehe.md`
  - **FR-5**: Create a commit with message following conventional commits format: `feat(221): Create markdown file test-5vnehe.md`
  - **FR-6**: Push the commit to the feature branch `feat/221-markdown-file-creation-766ea9`
  - **FR-7**: File must be readable and contain no binary data

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must complete within 15 minutes of execution
  - **NFR-2**: File size must be minimal, between 300-500 bytes
  - **NFR-3**: Implementation must use only Python 3.11+ standard library (pathlib, subprocess) — no external package dependencies
  - **NFR-4**: File must use LF (Unix) line endings for consistency with repository conventions
  - **NFR-5**: Commit message must strictly follow conventional commits specification (feat(221): Create markdown file test-5vnehe.md)
  - **NFR-6**: Must be compatible with and follow the established patterns from features 160-220 (200+ precedent files)
  - **NFR-7**: Implementation must not modify, delete, or overwrite any existing files in the repository
  - **NFR-8**: Git configuration (user.name, user.email) must be available and properly set before execution

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose follow a specific theme or use flexible, generic text? | **Flexible/generic content** | User query explicitly states \"about anything\"; minimizes decision overhead; enables fastest execution; aligns with test file pattern |
  | 2 | Should implementation use Python script or direct shell commands? | **Python script with pathlib/subprocess** | Matches established pattern in features 216-220; uses standard library only; better error handling; consistent with codebase conventions |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation. Key directories:

  - **Root directory**: Contains 200+ test markdown files (test-*.md, *.md) serving as implementation targets and precedents
  - **specs/**: Structured feature specifications organized by feature number, each containing spec.yaml files
  - **src/sheep/**: Core platform code (agents, flows, configuration, tools) - NOT affected by this feature
  - **pyproject.toml**: Python project configuration
  - **.github/workflows/**: CI/CD pipeline (GitHub Actions)

  **Relevant files for this feature:**
  - Test files: ABOUT_ME.md, DESIGN_PATTERN.md, JOKE.md, RANDOM_JOKE.md, etc. (precedent examples)
  - Implementation scripts: create_markdown_file.py, create_markdown_file_220.py (pattern templates)
  - Git configuration: .gitignore, .github/workflows/ci.yml

  ### Architecture Patterns

  The Sheep platform uses a **modular, observable agentic architecture**:

  1. **Flows** (structure): Define execution steps and control paths
  2. **Crews** (intelligence): Specialized agents performing focused roles
  3. **Tasks**: Well-designed tasks that drive 80% of agent performance
  4. **Tools**: Reusable utilities for git, file operations, observability

  For this feature (markdown file creation):
  - No flow, crew, or agent integration required
  - Simple, sequential workflow: create file → validate (optional) → git add → git commit → git push
  - Uses standard library only (pathlib for file I/O, subprocess for git commands)
  - Follows the pattern established by features 160-220 (60+ identical features)

  ### Relevant Technologies

  - **Markdown**: Simple, universally supported format (H1 heading + prose)
  - **Git**: Version control; 200+ existing test commits demonstrate stability
  - **Python 3.11+**: Standard library (pathlib, subprocess) - no external packages needed
  - **Linux**: Target execution environment (repository is Linux-based, uses LF line endings)
  - **Conventional Commits**: Established format (feat(221): Create markdown file test-5vnehe.md)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-500 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 160-220; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in the Sheep platform |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or feature configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`, `subprocess`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic |
  | CI/CD Pipeline | None | Git push triggers existing CI, but no additional configuration or pipeline changes needed |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/221-markdown-file-creation-766ea9` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Unix-based environment (Linux, macOS) for consistent LF line endings

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md, *.md) provide clear pattern to follow
  - Previous feature implementations (features 160-220) demonstrate successful execution of identical pattern
  - Implementation scripts in repository root (create_markdown_file.py, create_markdown_file_220.py) show working patterns
  - Feature 220 spec and implementation provide exact template (https://github.com/jobnik/sheep)

  **Not Required:**
  - No source code dependencies (src/sheep/ remains untouched)
  - No external package dependencies
  - No modifications to configuration files (.env, pyproject.toml, etc.)
  - No integration with CrewAI or other Sheep platform components
  - No testing framework integration (feature has no tests)

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with 60+ identical successful precedents (features 160-220):

  - **File creation**: ~3 minutes (compose markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2 minutes (basic format checks optional; many recent features skip validation)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification:**
  - Extremely well-established pattern with 60+ identical features (160-220) providing proven precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or complex configuration changes required
  - Recent feature implementations (216-220) demonstrate efficient execution within estimated timeframe
  - No git merge conflicts or branch management complexity
  - Feature branch already created and checked out
  - Standard library only (no dependency resolution or build process)
