content: |
  ## Architecture Overview

  This feature creates a single test markdown file following an established pattern repeated 200+ times
  in the Sheep project (features 069-275). The implementation is purely file creation and git workflow—no
  modifications to application source code, configuration, or tests.

  ### How This Fits the Codebase

  **Repository Structure Context:**
  - **test-*.md files at root:** 200+ test markdown artifacts created by identical features (069-275)
  - **Not part of application code:** These files are validation artifacts for the automated implementation system,
    not part of /src/sheep/ application code
  - **Established precedent:** Each feature follows identical workflow: create file, validate structure/encoding,
    stage, commit, push

  **Integration Pattern:**
  - File creation: Local file I/O in repository root (standard user permissions)
  - Git workflow: Standard add/commit/push using existing feature branch (already created)
  - No runtime dependencies: File is not imported, executed, or referenced by application
  - Zero impact on application logic: This is a pure file artifact with no code dependencies

  ### Why This Approach is Right

  The 200+ existing test files demonstrate a proven pattern. Direct replication ensures:
  - Consistency with established conventions
  - Predictable, repeatable workflow
  - Minimal risk (no novel architectural decisions)
  - Clear precedent for validation and verification steps

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path('test-lriq1a.md').write_text(content, encoding='utf-8')`

  **Rationale:**
  - Built into Python 3.11+ standard library (no external dependencies)
  - Clean, Pythonic API: single operation creates file and writes content atomically
  - Explicit encoding parameter ensures UTF-8 without BOM (Python default behavior)
  - Already used throughout codebase (CrewAI framework uses pathlib internally)
  - Modern Python standard (pathlib is preferred over os module)

  **Alternatives Considered:**
  - `os.open()/os.write()`: Lower-level API requiring more boilerplate; pathlib is more Pythonic
  - `io.open()` with context managers: More verbose; pathlib is cleaner for simple writes
  - Third-party libraries: Unnecessary for simple local file creation

  ### 2. Encoding and Line Ending Strategy

  **Decision:** Compose content with explicit `\n` characters (Python escape sequence); write with `encoding='utf-8'`

  **Rationale:**
  - Python's `write_text(encoding='utf-8')` encodes content to UTF-8 without BOM
  - Literal `\n` in Python source (line feed, U+000A) becomes ASCII 0x0A (LF byte) in UTF-8 encoding
  - Guarantees: UTF-8 encoding without BOM, LF line endings (verifiable with `file -i` and `od -c`)
  - No post-processing required; content is exactly as specified at write time
  - Matches established pattern from 200+ prior implementations

  **Alternatives Considered:**
  - `newline='\n'` parameter with `io.open()`: More verbose; pathlib approach is simpler
  - Platform detection (`os.linesep`): Incorrect for spec which requires LF (Unix) line endings
  - Post-processing with `dos2unix`/`sed`: Fragile; adds subprocess calls and unnecessary I/O

  **Verification Method:**
  ```bash
  file -i test-lriq1a.md          # Confirms UTF-8 encoding: "charset=utf-8"
  od -c test-lriq1a.md | head -1  # Confirms LF (shows \n, not \r\n)
  ```

  ### 3. Prose Content: Hand-Composed with Flexible Topic

  **Decision:** Manually compose 2-3 sentences of coherent English prose with flexible topic selection

  **Rationale:**
  - Feature spec explicitly resolves this: "Flexible topic selection matches the diverse pattern of 200+ existing test files"
  - Hand-composing prose is faster than programmatic generation for 2-3 sentences
  - Produces natural prose quality matching the variation observed in existing files
  - Requires no additional dependencies, API calls, or configuration

  **Alternatives Considered:**
  - Random topic generation with templates: Adds complexity; spec prefers flexible selection
  - AI-generated prose via LLM API: Introduces latency, cost, and external dependency; unnecessary for test artifact
  - Programmatic generation: Over-engineered for 2-3 sentences

  **Observed Pattern in 200+ Existing Files:**
  - Topics: Nature, technology, science, history, culture, philosophy, etc.
  - Diversity: No constraint; natural variation observed
  - Quality: Natural English prose; no templating or artificiality

  ### 4. Git Integration: Subprocess Shell Execution

  **Decision:** Use `subprocess.run()` with direct git commands: `git add`, `git commit`, `git push`

  **Rationale:**
  - Transparent: Shell commands are visible in execution logs for auditing
  - Predictable: No abstraction layer or actor configuration needed
  - Already used throughout Sheep platform: CrewAI agents execute shell commands
  - Simpler than GitPython for mechanical operations (add/commit/push)

  **Alternatives Considered:**
  - GitPython library (Repo/Index APIs): While available, subprocess is more direct for simple operations
  - Programmatic git operations: Adds abstraction complexity without benefit

  **Implementation:**
  ```python
  import subprocess

  # Stage the file
  subprocess.run(['git', 'add', 'test-lriq1a.md'], check=True)

  # Commit with conventional message
  msg = 'feat(276): create markdown file test-lriq1a.md with prose content'
  subprocess.run(['git', 'commit', '-m', msg], check=True)

  # Push to feature branch
  subprocess.run(['git', 'push'], check=True)
  ```

  The `check=True` parameter ensures exceptions are raised if any command fails.

  ### 5. Error Handling: Fail Fast

  **Decision:** Let exceptions propagate; no retries or fallbacks

  **Rationale:**
  - File creation and git operations are deterministic in this context
  - If operations fail, the error is real and actionable:
    - File I/O failure → User lacks write permission or disk is full
    - Git failure → Authentication issue, network failure, or branch doesn't exist
  - Retries would only delay visibility of real problems
  - Fail-fast semantics appropriate for automated implementation: CI catches failures, operator investigates

  **Alternatives Considered:**
  - Retry logic: Masks underlying problems; user should see errors immediately
  - Silent fallback (skip push if fails): Violates spec which requires push
  - Custom error wrapping: Unnecessary; Python's built-in exceptions are sufficient

  ### 6. Validation: Manual Inspection

  **Decision:** Validate file structure, encoding, and line endings through manual inspection and standard file tools

  **Rationale:**
  - Feature spec explicitly resolves this: "Manual inspection is recommended because it aligns with the established pattern from features 069-275"
  - 200+ existing test files have been validated without automated tools
  - Markdown format is simple and transparent: one H1 heading, blank line, 2-3 sentences
  - File contents are immediately readable for verification
  - Avoids unnecessary tooling dependencies (no linters, validators, etc.)

  **Alternatives Considered:**
  - Markdown linters (markdownlint, pylint-markdown): Adds tool dependency; unnecessary for simple format
  - Programmatic validation: Over-engineered for simple H1 + prose structure

  **Validation Method:**
  - Visual inspection: Read file contents and confirm structure
  - Encoding check: `file -i test-lriq1a.md` → "charset=utf-8"
  - Line ending check: `od -c test-lriq1a.md` → shows \n, not \r\n
  - Size check: `wc -c test-lriq1a.md` → approximately 400-600 bytes

  ## Implementation Strategy

  ### Phase Ordering and Rationale

  **Phase 1: File Creation** comes first because:
  - Must exist before validation and git operations
  - Establishes the artifact that subsequent phases depend on
  - Uses pathlib (straightforward, no dependencies)

  **Phase 2: Verification** comes second because:
  - Confirms Phase 1 completed successfully
  - Validates encoding and line endings before committing to git
  - Uses standard file tools (file, od, wc) for inspection
  - Ensures spec compliance before integration

  **Phase 3: Git Integration** comes last because:
  - Depends on file existing and being validated
  - Commits verified, correct artifact to repository
  - Pushes to feature branch to complete workflow

  ### Why This Order Matters

  This ordering ensures:
  1. **Correctness:** File is validated before git integration
  2. **Fail-fast:** Encoding/structure errors caught early, before attempting push
  3. **Auditability:** Each phase has clear, testable criteria
  4. **Consistency:** Matches the proven workflow from 200+ prior implementations

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File encoding not UTF-8 | Low | Medium | Use `write_text(encoding='utf-8')` which guarantees UTF-8. Verify with `file -i` command. |
  | Line endings not LF | Low | Medium | Compose content with explicit `\n` characters. Verify with `od -c`. Python's write_text() preserves literal \n as LF byte. |
  | Git push fails | Low | High | Fail fast with exceptions. User sees error immediately and can investigate (auth, network, branch). |
  | File size incorrect | Low | Low | Natural outcome of proper structure (H1 + 2-3 sentences = 400-600 bytes). Verify with `wc -c`. |
  | Markdown syntax invalid | Low | Low | Simple format (H1 + prose). Manual inspection confirms CommonMark compliance. 200+ existing files validate this approach. |
  | File already exists | Very low | Low | `write_text()` atomically overwrites if file exists. This is acceptable per spec. |
  | Git config incomplete | Low | High | Assume standard git setup (user.name, user.email configured). Feature branch already created. |

  ## Testing Strategy

  Testing is implicit in the TDD task cycles:

  1. **RED:** Write assertions that file doesn't exist or has wrong content
  2. **GREEN:** Implement minimal code to create file with correct structure
  3. **REFACTOR:** Clean up (minimal for simple implementation)

  Each task has explicit acceptance criteria that serve as test conditions.

  ## Success Criteria Summary

  This plan is successful when all tasks complete and:
  - File `test-lriq1a.md` exists in repository root
  - File contains exactly one H1 heading and 2-3 sentences of prose
  - File is UTF-8 encoded without BOM and uses LF line endings
  - File is staged, committed, and pushed to feature branch
  - No existing files are modified or deleted
  - No changes made to source code, configuration, or test files

  ---

  _Implementation plan complete — ready for task breakdown and execution_
