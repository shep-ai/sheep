      GitCommitTool and GitPushTool are custom tools in src/sheep/tools/git_tools.py used by all 289
      preceding features. They handle git staging, conventional commit formatting, upstream tracking, error
      handling, and logging. Conventional commit format matches spec requirement: \"feat(290): create markdown
      file test-f7lgjt.md with prose content\". Using these tools ensures consistency, centralized git
      configuration, integrated error handling, and structured logging of git operations.

  - title: "File Encoding and Line Ending Enforcement"
    chosen: "UTF-8 without BOM; Unix LF line endings enforced at write-time and validated post-write"
    rejected:
      - "Allow flexible encodings/line endings — violates spec, creates inconsistency"
      - "Platform-dependent line endings — reduces portability"
    rationale: >
      Python's open(file, \"w\", encoding=\"utf-8\") on Unix systems naturally produces UTF-8 with LF line
      endings (no BOM, no CRLF). Post-write validation verifies no UTF-8 BOM, no CRLF, valid UTF-8 encoding,
