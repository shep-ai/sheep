content: |
  ## Summary

  Feature 290 implementation follows a straightforward orchestration pattern using existing, proven utility
  functions from src/sheep/content_generators.py and custom git tools. The work is organized into 7 concrete
  tasks across 3 phases:

  **Phase 1: Foundation & Pattern Analysis (1 task, 30 min)**
  - Analyze existing patterns from feature 289 and establish baseline understanding of all dependencies

  **Phase 2: Core Feature Implementation (4 tasks, 1h 45min)**
  - Create feature module skeleton with proper imports and structure
  - Implement content generation via Claude API with error handling
  - Implement file creation with validation (structure, encoding, line endings)
  - Integrate git workflow (staging, commit, push)

  **Phase 3: Integration & Validation Testing (2 tasks, 1h 15min)**
  - End-to-end testing of complete workflow with success and error scenarios
  - Final verification and preparation for commit

  **Total Estimated Effort:** 3 hours

  This estimate accounts for actual implementation, comprehensive testing, logging integration, and verification.
  The implementation minimizes new code by leveraging existing utilities and following established patterns from
  289 preceding features.

  Each task includes TDD cycles (RED-GREEN-REFACTOR) to ensure quality and reliability. Non-code tasks (research,
  verification) have tdd: null. All tasks have clear acceptance criteria and are ordered by dependency to ensure
  work can be executed sequentially without blockers.
