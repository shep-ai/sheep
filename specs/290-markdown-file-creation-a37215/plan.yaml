content: |
  ## Architecture Overview

  Feature 290 follows the identical architectural pattern established by 289 preceding markdown-file-creation
  features. The implementation creates a single feature module that orchestrates the complete workflow using
  existing utility functions and custom tools:

  ### Module Structure
  - **Location:** `src/sheep/features/feature_290_markdown_file_creation.py`
  - **Main Function:** `create_test_f7lgjt_markdown_file()` — orchestrates the complete workflow
  - **Logging:** Structured logging via `sheep.observability.logging.get_logger(__name__)`
  - **Dependencies:** Existing utilities from `src/sheep/content_generators.py` and custom git tools

  ### Orchestration Flow
  1. **Content Generation** → Call `generate_markdown_content()` via `sheep.config.llm.get_reasoning_llm()`
     - Generates H1 heading + 2-3 sentences of prose
     - Validates content structure before returning
     - Fails fast with clear error message on API failure (no retry, no fallback)

  2. **File Creation** → Call `write_markdown_file()`
     - Writes file to repository root with exact filename: `test-f7lgjt.md`
     - Enforces UTF-8 encoding without BOM
     - Enforces Unix LF line endings (no CRLF)
     - Fails if file already exists (prevents accidental overwrite)

  3. **Validation** → Call `validate_markdown_file()`
     - Validates structure (H1 heading, blank line separator, prose content)
     - Validates encoding (UTF-8 without BOM)
     - Validates line endings (Unix LF only)
     - Validates sentence count (exactly 2-3)
     - Provides clear, actionable error messages

  4. **Git Workflow** → Use `GitCommitTool` and `GitPushTool`
     - Stage file: `git add test-f7lgjt.md`
     - Commit: conventional format `feat(290): create markdown file test-f7lgjt.md with prose content`
     - Push: `git push -u origin HEAD` with upstream tracking

  ### Integration with Existing Codebase
  - **Config System:** Uses `sheep.config.llm.get_reasoning_llm()` for Claude API (no hardcoded keys)
  - **Logging:** Integrates with structlog for machine-readable, filterable logs
  - **Git Tools:** Uses `GitCommitTool` and `GitPushTool` from `src/sheep/tools/git_tools.py`
  - **Utilities:** Leverages proven, tested functions from `src/sheep/content_generators.py`
  - **No State Changes:** Reads-only with respect to config/settings; creates exactly one new file

  ## Key Design Decisions

  ### 1. Content Generation Strategy
  **Decision:** Use Claude API via CrewAI LLM abstraction (`sheep.config.llm.get_reasoning_llm()`)

  **Alternatives Considered:**
  - Hard-coded template content — reduces variety, diverges from established pattern
  - Random sentence generation — lower quality vs. trained LLM
  - External content API — adds complexity, diverges from sheep architecture

  **Rationale:**
  CrewAI LLM abstraction is the established pattern across all 289 preceding features. It provides consistent
  quality, flexible topic generation matching "about anything" requirement, centralized API key management,
  and minimal implementation complexity by reusing existing infrastructure.

  ### 2. File I/O with pathlib
  **Decision:** Use `pathlib.Path` for all file operations

  **Rationale:**
  pathlib is the modern Python standard (PEP 428), already used throughout the existing codebase
  (content_generators.py, git_tools.py). Provides cross-platform compatibility, safe path operations,
  built-in validation (exists(), is_file()), and clear, readable code.

  ### 3. Strict Validation Strategy
  **Decision:** Enforce exactly 2-3 sentences, UTF-8 without BOM, Unix LF line endings

  **Rationale:**
  Strict validation ensures 100% specification compliance and consistency with all 289 preceding features.
  Provides clear pass/fail criteria, prevents silent failures, catches issues before git operations,
  and delivers reliable test artifacts that meet exact requirements.

  ### 4. Error Handling: Fail-Fast with Clear Messages
  **Decision:** Fail with clear, descriptive error message on API failure (no retry, no fallback)

  **Rationale:**
  Fail-fast maintains quality standards, provides transparency, enables efficient troubleshooting of root
  causes (API key, quota, network, model availability), and aligns with sheep platform's explicit-over-implicit
  philosophy. Simple, maintainable implementation.

  ### 5. Pre-existing File Handling
  **Decision:** Fail with error message if file already exists

  **Rationale:**
  The one-file-per-feature pattern assumes each feature creates exactly one new file. Failing on existing
  file prevents accidental data loss, detects unexpected state, and requires explicit user intervention
  to resolve ambiguous situations.

  ### 6. Logging and Observability
  **Decision:** Use structlog with INFO/DEBUG levels (established pattern in content_generators.py)

  **Rationale:**
  structlog is the sheep platform standard. Provides structured, machine-readable logs, log filtering
  by severity, integration with CrewAI observability, context preservation across function calls,
  and consistent log format platform-wide.

  ### 7. Git Workflow with Conventional Commits
  **Decision:** Use existing `GitCommitTool` and `GitPushTool` with conventional commit format

  **Rationale:**
  These custom tools are used by all 289 preceding features, handle staging/commit/push with integrated
  error handling and logging, support conventional commit format, and ensure consistency across the platform.

  ### 8. File Encoding and Line Ending Enforcement
  **Decision:** UTF-8 without BOM; Unix LF line endings enforced at write-time and validated post-write

  **Rationale:**
  Python's `open(file, "w", encoding="utf-8")` on Unix systems naturally produces correct format (UTF-8, LF).
  Post-write validation confirms no BOM, no CRLF, valid encoding, and trailing newline. This approach is
  explicit and platform-aware, preventing silent failures on Windows systems.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: Foundation & Pattern Analysis** comes first to establish understanding of:
  - How feature 289 implemented the same pattern
  - Structure and usage of utility functions in content_generators.py
  - Integration points for logging, LLM API, and git operations
  - Error handling patterns established in preceding features

  **Phase 2: Core Feature Implementation** builds the orchestration module that:
  - Calls utility functions in correct sequence
  - Implements error handling and validation
  - Integrates structured logging at appropriate checkpoints
  - Handles edge cases (pre-existing file, API failures)

  **Phase 3: Integration & Validation Testing** ensures:
  - Complete workflow functions end-to-end
  - File structure, encoding, line endings are correct
  - Git operations (staging, commit, push) succeed
  - Error handling works for all documented failure modes

  ### Why This Approach

  This architecture minimizes new code by leveraging existing, proven utilities. The feature is essentially
  an orchestration layer that sequences established functions in the correct order. This approach:
  - Reduces implementation complexity and risk
  - Ensures consistency with 289 preceding features
  - Enables rapid execution (estimated 15-20 minutes)
  - Leverages battle-tested utility functions
  - Maintains code quality through code reuse

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API failure | Fail-fast with clear error message logged via structlog; no retry logic masks persistent issues |
  | Pre-existing file | Check file existence before writing; fail with clear error allowing user to decide on resolution |
  | Encoding/line ending issues | Strict validation catches CRLF or BOM on any platform; clear error messages guide resolution |
  | Git operation failure | Use proven GitCommitTool and GitPushTool; integrated error handling and logging |
  | Incomplete content validation | Use validate_markdown_file() from content_generators.py (proven, tested, used in 289 features) |
  | Logging failures | Use structlog which is platform standard; failures here are configuration issues, not feature issues |
  | File I/O errors | Use pathlib.Path which provides safe, cross-platform operations with built-in validation |
  | Missing dependencies | All dependencies (content_generators.py functions, git_tools.py, structlog, CrewAI) are already in use by 289 preceding features |
