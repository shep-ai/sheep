content: |
  ## Architecture Overview

  Feature 115 is an isolated, minimal-effort file creation task that follows the established pattern demonstrated by 115+ existing test markdown files in the repository root. The implementation has no dependencies on application source code in `/src/sheep/`, no configuration changes, and no test modifications (per NFR-7).

  The feature fits seamlessly into the codebase as a test artifact—one of many similar markdown files created as part of the markdown-file-creation pattern observed in features 101-114. The implementation is straightforward imperative code with no architectural complexity.

  ### Pattern Adherence

  The markdown file format follows a proven pattern across 115+ existing test files:
  ```
  # Heading Title

  <2-3 sentences of prose content with proper grammar and readability>
  ```

  This simple structure is valid CommonMark (NFR-4) and requires no complex markdown features or nested structures. The implementation can reference precedent files in the repository root (test-*.md) for validation and format confirmation.

  ### Technology Stack

  - **pathlib.Path()**: Modern Python standard library for file I/O (mandated by NFR-5). Using `.write_bytes()` with explicit `.encode('utf-8')` provides complete control over encoding and line endings without platform-specific translation.
  - **UTF-8 encoding**: Standard markdown encoding (RFC 3629). Python's `str.encode('utf-8')` produces UTF-8 without BOM by default (NFR-1). Alternative 'utf-8-sig' is explicitly NOT used to avoid BOM.
  - **LF line endings**: Unix-style line endings required by NFR-2. Using `.write_bytes()` bypasses platform-specific translation (CRLF on Windows) and ensures consistent LF output across all operating systems.
  - **Git**: Standard version control workflow using `git add`, `git commit`, and `git push` commands.

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path().write_bytes() with Explicit Encoding

  **Chosen approach:** Use `pathlib.Path("test-nljnpg.md").write_bytes(content.encode('utf-8'))` for complete control over encoding and line endings.

  **Rationale:**
  - NFR-5 explicitly mandates pathlib usage
  - `.write_bytes()` bypasses Python's platform-specific line ending translation, ensuring consistent LF output on all systems
  - Explicit `.encode('utf-8')` provides direct control over BOM-less UTF-8 encoding (NFR-1 and NFR-2)
  - This approach is cleaner and more reliable than `.write_text()` which translates line endings based on the platform

  **Rejected alternatives:**
  - `Path().write_text()`: Platform-dependent; uses CRLF on Windows, violating NFR-2
  - `open() with 'w' mode`: Less modern, requires more boilerplate, not aligned with NFR-5
  - Post-processing with line ending conversion: Adds unnecessary complexity and error surface

  **Research reference:** Research findings document this decision in detail with implementation patterns and technical notes.

  ### 2. Content Format: Single H1 Heading + 2-3 Prose Sentences

  **Chosen approach:** Strict adherence to `# Heading\n\n<2-3 sentences>` format with exactly one blank line separator.

  **Rationale:**
  - FR-3 and FR-4 define explicit requirements: one H1 heading on first line, blank line separator, exactly 2-3 prose sentences
  - This simple structure is proven across 115+ existing test files in the repository
  - No complex markdown features (lists, code blocks, emphasis) are needed or appropriate for this test artifact
  - Format validation is straightforward: parse heading, count sentences, verify quality per FR-5

  **Rejected alternatives:**
  - Multiple paragraphs or complex markdown: Spec explicitly requires 2-3 sentences, not flexible structure
  - H2/H3 headings: Spec explicitly requires H1 (`#`)
  - Content without heading: Violates FR-3

  ### 3. Topic Selection: Complete Implementer Discretion

  **Chosen approach:** No topic restrictions; prose may cover any subject matter chosen by the implementer.

  **Rationale:**
  - Open question #3 is definitively resolved in the feature spec: "Completely open topics"
  - User query explicitly states "about anything" with no topic restrictions
  - This maximizes implementer flexibility and enables natural prose creation without research or decision burden
  - Precedent from 115+ existing test files shows topic diversity
  - Only content requirement is FR-5: grammatically correct and readable prose

  **Rejected alternatives:**
  - Pre-defined topic list/whitelist: Adds unnecessary constraints with no value for test artifacts
  - Generated or randomized content: Adds complexity, reduces prose quality, distracts from focus

  ### 4. File Size Guideline: Flexible 300-500 Bytes (Prose Quality Takes Priority)

  **Chosen approach:** Target 300-500 bytes as a typical guideline, but allow variance to maintain prose quality and readability.

  **Rationale:**
  - Open question #2 is resolved: "Flexible guideline (300-500 bytes typical, variance allowed)"
  - Spec describes file size as a "typical range" not a strict requirement
  - Prose quality (FR-5) and grammatical correctness should take priority over exact byte counts
  - 2-3 well-crafted sentences naturally fit this range
  - Precedent files from 101-114 likely vary slightly in size

  **Rejected alternatives:**
  - Strict enforcement (300-500 bytes exactly): Forces awkward prose to fit constraints, violates principle of readability

  ### 5. Test Automation: No Automated Tests (Manual Verification Only)

  **Chosen approach:** Rely on specification compliance and manual verification against success criteria. No automated test code.

  **Rationale:**
  - Open question #1 is resolved: "No test automation"
  - Specification is straightforward with clear, testable success criteria
  - Precedent from 115+ existing features (101-114) shows manual verification is sufficient and reliable
  - NFR-7 forbids modifications to test files in `/tests/` directory; test automation would require test file changes
  - Manual verification against success criteria is appropriate for this isolated, low-complexity feature

  **Rejected alternatives:**
  - Create automated unit/integration tests: Adds overhead, requires test file modifications, contradicts NFR-7

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Validation) → Phase 2 (Git Integration)**

  The phases are sequenced to ensure the file is correct before committing it to version control:

  1. **Phase 1** creates the markdown file with proper formatting, encoding, and line endings, then validates that all requirements are met. This ensures the file is production-ready before touching git.
  2. **Phase 2** performs the git workflow (stage, commit, push). By this point, the file has been validated and is ready to integrate into the repository history.

  This ordering follows software engineering best practices: validate correctness locally before integrating into shared version control.

  ### Implementation Flow

  1. **Construct content**: Create a markdown string with one H1 heading and 2-3 sentences of prose (any topic, grammatically correct)
  2. **Write file**: Use `Path("test-nljnpg.md").write_bytes(content.encode('utf-8'))` to create the file with explicit UTF-8 encoding and LF line endings
  3. **Validate**: Verify the file meets all success criteria (content format, encoding, line endings, file size, grammar)
  4. **Stage file**: `git add test-nljnpg.md`
  5. **Commit**: `git commit -m "feat(115): create markdown file test-nljnpg.md with prose content"` with conventional commit format
  6. **Push**: `git push origin feat/115-markdown-content-file-595b08`

  ### Effort Allocation

  - **File creation**: ~5 minutes (write markdown content with heading + prose, use pathlib to create file)
  - **Validation**: ~3 minutes (verify encoding, line endings, content format, file size, grammar)
  - **Git workflow**: ~2-5 minutes (stage, commit, push)
  - **Total**: 10-15 minutes (consistent with spec size estimate **S**)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding error (UTF-8 with BOM or wrong encoding)** | Use explicit `.encode('utf-8')` (not 'utf-8-sig'). Verify encoding with `file` command or hexdump showing no BOM bytes. Reference research findings for correct encoding pattern. |
  | **Line ending error (CRLF instead of LF on Windows)** | Use `.write_bytes()` instead of `.write_text()` to bypass platform translation. Verify with `file` command or hexdump showing only `\n` bytes (0x0A), not `\r\n` (0x0D 0x0A). |
  | **Content format errors (wrong heading level, missing blank line, wrong sentence count)** | Follow the strict format: `# Heading\n\n<2-3 sentences>`. Validate by parsing file content and checking structure against success criteria. |
  | **File size out of range** | While 300-500 bytes is a flexible guideline, ensure prose is natural and readable. Avoid artificially padding or truncating content. Typical 2-3 sentences naturally fit this range. |
  | **Git workflow errors (wrong commit message, wrong branch, not pushed)** | Use exact conventional commit format: `feat(115): create markdown file test-nljnpg.md with prose content`. Verify branch with `git branch` and push destination with `git push origin feat/115-markdown-content-file-595b08`. |
  | **Precedent divergence (file format differs from existing test files)** | Existing test files use CRLF line endings; this feature intentionally uses LF per NFR-2 spec. This is correct per spec requirements, though it diverges from current pattern. Be aware of this intentional difference. |
  | **Premature git commit** | Complete all validation before running `git add`. Ensure file is correct before staging. Use `git status` to verify staging status. |

  ## Success Validation

  The feature is complete when:

  1. ✓ File `test-nljnpg.md` exists in repository root
  2. ✓ File contains exactly one H1 heading followed by blank line and 2-3 prose sentences
  3. ✓ File is UTF-8 encoded without BOM
  4. ✓ File uses LF line endings (not CRLF)
  5. ✓ File size is approximately 300-500 bytes (flexible guideline)
  6. ✓ Prose is grammatically correct and readable
  7. ✓ File is staged in git
  8. ✓ Commit exists with message: `feat(115): create markdown file test-nljnpg.md with prose content`
  9. ✓ Commit is on branch `feat/115-markdown-content-file-595b08`
  10. ✓ Changes are pushed to remote origin

  All success criteria from the feature spec must be satisfied.

