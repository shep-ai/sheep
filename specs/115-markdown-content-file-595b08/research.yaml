  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-19
  - **Ready for Implementation:** Yes — all technical decisions finalized with clear rationale

  ## Technology Decisions

  ### 1. File I/O Library Selection

  **Chosen:** pathlib.Path() with write_bytes() for explicit encoding control

  **Rejected:**
  - os.path and open() directly — Less modern, requires more boilerplate code, not aligned with NFR-5 mandate
  - Third-party file libraries — Unnecessary overhead; pathlib is standard library and sufficient

  **Rationale:** NFR-5 explicitly mandates pathlib usage for file I/O operations. pathlib.Path() is the modern standard library approach for Python 3.11+. Using write_bytes() with explicit .encode('utf-8') provides complete control over encoding and line endings, ensuring UTF-8 without BOM (NFR-1) and LF line endings (NFR-2). This approach bypasses platform-specific line ending translation, critical for cross-platform consistency.

  **Implementation Pattern:**
  ```python
  from pathlib import Path
  content = """# Heading Title

  First sentence about the topic. Second sentence with more detail. Optional third sentence to complete the thought."""
  Path("test-nljnpg.md").write_bytes(content.encode('utf-8'))
  ```

  ### 2. Line Ending Handling Strategy

  **Chosen:** Explicit \\n characters in content string, using Path().write_bytes() for direct control over output

  **Rejected:**
  - Path().write_text() with default behavior — Platform-dependent; uses CRLF on Windows, violating NFR-2 requirement for LF
  - Post-processing with line ending conversion — Adds unnecessary complexity, error-prone, violates principle of direct output

  **Rationale:** NFR-2 mandates Unix-style LF line endings. Python's write_text() method uses platform-specific line ending translation by default (CRLF on Windows, LF on Unix). Using write_bytes() with explicit .encode('utf-8') bypasses platform line ending translation entirely, ensuring consistent LF output on all operating systems. This is the most direct, reliable, and portable approach.

  **Technical Note:** The 115+ existing test files in the repository use CRLF line endings (observed via file command analysis of test-y1u0zg.md). This feature intentionally diverges from that pattern to comply with NFR-2 specification. The spec is the source of truth for this feature.

  ### 3. Encoding and BOM Handling

  **Chosen:** UTF-8 encoding without Byte Order Mark (BOM), using Python's default UTF-8 encoding

  **Rejected:**
  - UTF-8 with BOM — Explicitly violates NFR-1 requirement for \"UTF-8 without BOM\"
  - Alternative encodings (UTF-16, UTF-32, ASCII, Latin-1) — Not appropriate for markdown files, contradict NFR-1

  **Rationale:** NFR-1 requires UTF-8 without BOM. Python's str.encode('utf-8') produces standard UTF-8 without BOM by default. (Note: UTF-8 BOM is only generated when explicitly using 'utf-8-sig' encoding, which we must not use.) This is the standard encoding for markdown files across all platforms and aligns with CommonMark specification, which explicitly recommends UTF-8.

  ### 4. Content Format and Structure

  **Chosen:** Single H1 heading followed by blank line separator, then 2-3 prose sentences in natural paragraph format

  **Rejected:**
  - Multiple paragraphs or complex markdown structures — Spec requires exactly 2-3 sentences, not flexible structure
  - Content without heading — Violates FR-3 requirement for markdown H1 heading
  - Heading styles other than H1 — Spec explicitly requires H1 (`#`)

  **Rationale:** FR-3 and FR-4 define explicit format: one H1 heading on first line, blank line separator, then exactly 2-3 prose sentences. This simple structure is proven across 115+ existing test files. The format is: `# Heading\\n\\n<2-3 sentences>`. No complex markdown features are needed. Format validation is straightforward: parse heading, verify sentence count, check content quality per FR-5.

  ### 5. Topic Selection and Content Freedom

  **Chosen:** Complete implementer discretion with no topic restrictions; any subject matter is acceptable

  **Rejected:**
  - Pre-defined topic list or whitelist — Adds constraints with no value; contradicts resolved open question #3
  - Generated or randomized topic selection — Adds complexity, reduces prose quality, overkill for simple task

  **Rationale:** Open question #3 is resolved: \"Completely open topics — Prose may cover any topic chosen by the implementer with no restrictions. Maximizes flexibility and aligns with user query 'about anything.'\" User query explicitly states no restrictions. This enables natural prose creation. The only content requirement is FR-5: grammatically correct and readable prose.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (Python stdlib) | File I/O operations | **Use** | NFR-5 mandates pathlib; modern Python standard; Path().write_bytes() suitable for explicit encoding control |
  | Git (system command) | Version control operations | **Use** | Already integrated; file staging and commits via shell commands (git add, git commit, git push) |
  | No external dependencies | — | **N/A** | NFR-9 forbids new external dependencies; all functionality available in Python standard library |

  ## Security Considerations

  **User Input:** None. All content is hardcoded by the implementer; no external input is accepted or processed.

  **Code Injection:** No risk. File contains only prose markdown content; no code execution, templating, or dynamic evaluation.

  **File System Security:** Low risk. Single file creation in repository root directory (already writable by development environment). No directory traversal, no overwriting critical files, no privilege escalation concerns.

  **Data Privacy:** Not applicable. Test artifacts are not sensitive; stored in version control openly.

  **Encoding Attacks:** Mitigated. Explicit UTF-8 encoding without BOM prevents potential issues with BOM-based exploits or encoding confusion attacks.

  **Overall Assessment:** Minimal security surface. This is a simple file creation operation with no external dependencies, no user input, and straightforward data flow. No security vulnerabilities introduced.

  ## Performance Implications

  **File I/O:** Single write operation creating a ~300-500 byte file. Negligible performance impact on system.

  **Memory:** Entire file content held in string before writing. Approximately 400 bytes typical; inconsequential memory footprint.

  **CPU:** No computation; linear encoding operation (str.encode()). Negligible CPU usage.

  **I/O Optimization:** Not needed. Single file operation with trivial size requires no caching, buffering, or optimization strategy.

  **Scalability:** Not a concern. This is a one-time test file creation, not a repeated operation or service.

  **Overall Assessment:** No performance considerations or optimizations needed. Operation is I/O-bound but with negligible scale. File creation and git operations complete in seconds.

  ## Architecture Notes

  **Integration:** Feature is completely isolated. No integration with application code in /src/sheep/. This is a test artifact at the repository root, alongside 115+ similar test markdown files.

  **Dependencies:** No dependencies on application architecture, configuration, or code. Operates independently at the file system level.

  **Pattern Adherence:** Follows the established pattern from 115+ existing test files (features 101-114 and prior):
  - Simple file creation with pathlib
  - Markdown format with single H1 heading and prose
  - UTF-8 encoding (note: spec requires LF, existing files use CRLF)
  - Git workflow: stage → commit → push
  - No source code or configuration modifications

  **Git Workflow:** Standard git workflow:
  1. Create file in working directory with Path().write_bytes()
  2. Stage: `git add test-nljnpg.md`
  3. Commit: `git commit -m "feat(115): create markdown file test-nljnpg.md with prose content"`
  4. Push: `git push origin feat/115-markdown-content-file-595b08`

  **Codebase Impact:** Minimal. Adds one file to repository root; no changes to source code, configuration, or test suite (NFR-7). Isolated feature with no side effects.

