content: |
  ## Architecture Overview

  Feature 239 follows the 5-step orchestration pattern established in features 101-238. The implementation
  requires no new libraries, no architectural changes, and no novel approaches — all required components
  already exist in the Sheep codebase.

  ### Orchestration Workflow

  ```
  Generate → Write → Validate → Commit → Push
  ```

  Each step is distinct and testable:

  1. **Generate**: Use CrewAI to call Claude API with markdown generation prompt
     - Input: Feature number, filename, topic (auto-selected)
     - Output: Markdown string with H1 heading + 2-3 sentences
     - Tool: `sheep.config.llm.get_reasoning_llm()` for Claude API access
     - Logging: Log content size, generation time

  2. **Write**: Write content to disk using pathlib with UTF-8 encoding
     - Input: Markdown string, target filepath (`test-di4y4x.md` at repo root)
     - Output: File on disk with UTF-8 encoding, LF line endings
     - Tool: pathlib.Path().write_text(..., encoding="utf-8")
     - Logging: Log file path, size, verification of UTF-8 encoding

  3. **Validate**: Verify file meets all format requirements before proceeding
     - Checks: H1 heading exists, 2-3 sentences, UTF-8 encoding (no BOM), LF line endings, file size 300-700 bytes
     - Output: Boolean success or exception on failure
     - Behavior: Fail-fast — raise exception and halt on validation failure (prevents invalid files from reaching git)
     - Logging: Log each validation step, pass/fail status

  4. **Commit**: Stage file and create conventional commit using GitCommitTool
     - Input: Filepath, commit message template
     - Message format: `feat(239): Create markdown file test-di4y4x.md with prose content`
     - Output: Git commit with staged changes
     - Tool: `sheep.tools.GitCommitTool` (wraps git add + git commit)
     - Logging: Log commit message, commit hash

  5. **Push**: Push commit to remote feature branch using GitPushTool
     - Input: Feature branch name (`feat/239-markdown-file-creation-d63db3`)
     - Output: Changes pushed to remote with upstream tracking
     - Tool: `sheep.tools.GitPushTool` (wraps git push with --set-upstream)
     - Logging: Log push result, remote tracking status

  ### Module Structure

  Feature module at `src/sheep/features/feature_239_markdown_file_creation.py` exports:

  ```python
  def create_feature_239_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """
      Create markdown file test-di4y4x.md with H1 heading and prose content.

      Implements 5-step orchestration workflow:
      1. Generate markdown content via CrewAI + Claude API
      2. Write file to disk with UTF-8 encoding, LF line endings
      3. Validate CommonMark compliance (H1, 2-3 sentences, encoding, size)
      4. Stage and commit to git with conventional commit message
      5. Push to remote feature branch

      Args:
          repo_path: Optional repository root path. If None, uses current working directory.

      Returns:
          dict[str, str]: Result dictionary with keys:
              - "file_path": Absolute path to created markdown file
              - "content_summary": Brief description of generated content
              - "git_commit_hash": Hash of created commit
              - "git_branch": Target branch name

      Raises:
          ValidationError: If markdown content fails validation checks
          FileExistsError: If file already exists at target path
          RuntimeError: If git operations fail
      """
  ```

  ### Architecture Integration

  The feature integrates with existing Sheep infrastructure:

  **Content Generation**:
  - Uses `sheep.config.llm.get_reasoning_llm()` to get configured Claude instance
  - Reuses `sheep.content_generators.MARKDOWN_GENERATION_PROMPT` for consistent prompting
  - Response handling via CrewAI's standard response format

  **File Operations**:
  - Uses pathlib (Python stdlib) for cross-platform file I/O
  - UTF-8 encoding parameter automatically handles platform line ending differences
  - Validation logic uses sheep.content_generators utilities where available

  **Git Operations**:
  - Uses `sheep.tools.GitCommitTool` for staging and committing (replaces manual subprocess)
  - Uses `sheep.tools.GitPushTool` for pushing with upstream tracking
  - Tools handle error cases, git state validation, and output capture

  **Logging**:
  - Uses `sheep.observability.get_logger()` for structured logging
  - Logs each workflow step (generate, write, validate, commit, push)
  - Rich console rendering with context variables

  **No circular dependencies**:
  - content_generators.py doesn't import feature modules
  - Feature imports content_generators (one-way dependency)
  - Clean separation of concerns

  ## Key Design Decisions

  ### 1. CrewAI + Claude API (Not Direct API Calls)

  **Chosen**: Use CrewAI framework with Claude API via `sheep.config.llm.get_reasoning_llm()`

  **Alternatives considered**:
  - Direct Claude API calls without CrewAI wrapper (rejected)
  - SimplePromptTemplate or custom orchestration (rejected)

  **Rationale**:
  - CrewAI is the standard LLM orchestration framework used across all 238+ preceding features
  - Provides multi-agent support, integrated logging, structured prompting, observability
  - Framework already installed and configured in Sheep codebase
  - Using CrewAI ensures consistency, leverages existing infrastructure, aligns with established pattern
  - Direct API calls would break architectural precedent and lose framework benefits

  ### 2. pathlib for File I/O (Not os.path)

  **Chosen**: Python pathlib library with UTF-8 encoding and LF line endings

  **Alternatives considered**:
  - os.path module (rejected — older API, less Pythonic)
  - Hardcoded platform-specific paths (rejected — breaks portability)

  **Rationale**:
  - pathlib is modern Python standard, recommended for 3.11+
  - Provides cross-platform abstraction for path operations and file I/O
  - Writing with `encoding="utf-8"` automatically handles platform differences (CRLF on Windows becomes LF on Unix)
  - pathlib used throughout Sheep codebase (content_generators.py, all tools)
  - Ensures Windows, Linux, macOS all produce identical file encodings and line endings

  ### 3. Strict CommonMark Validation (Fail-Fast)

  **Chosen**: Validate content before writing to disk; fail immediately on validation error

  **Alternatives considered**:
  - Lenient validation with retry on failure (rejected — slower, higher API costs, adds complexity)
  - No validation (rejected — risks invalid files reaching git)

  **Rationale**:
  - Strict validation is established pattern from features 101-238, proven to work consistently
  - Validation checks (H1, 2-3 sentences, encoding, line endings, size) are minimal but sufficient
  - Fail-fast approach prevents invalid files from reaching git, ensures clean error handling
  - Validation is fast: O(n) file scan with minimal overhead
  - All 238+ features use this approach with consistent success

  ### 4. GitCommitTool & GitPushTool (Not Manual subprocess)

  **Chosen**: Use `sheep.tools.GitCommitTool` and `GitPushTool` for git operations

  **Alternatives considered**:
  - Manual subprocess.run() git commands (rejected — duplicates existing code)
  - GitPython library (rejected — adds external dependency, breaks pattern)

  **Rationale**:
  - GitCommitTool and GitPushTool already exist in Sheep codebase
  - Proven across 238+ features; fully tested and reliable
  - Tools handle error cases, git state validation, output capture
  - Maintains code reusability and DRY principle
  - Consistent with existing patterns and infrastructure

  ### 5. Comprehensive Structured Logging

  **Chosen**: Log each workflow step via `sheep.observability.get_logger()`

  **Alternatives considered**:
  - Python stdlib logging (rejected — less structured, harder to parse)
  - Minimal logging (errors only) (rejected — reduces debugging capability)

  **Rationale**:
  - sheep.observability integrates with Sheep observability infrastructure
  - Provides structured logging with rich console rendering, context variables
  - All 238+ features use comprehensive structured logging
  - Enables rapid troubleshooting, compliance auditing, observability visibility

  ### 6. Python 3.11+ with Modern Type Hints

  **Chosen**: Python 3.11+ with union type syntax (`X | Y`)

  **Alternatives considered**:
  - Python 3.9+ with `typing.Union` (rejected — broader compatibility but less modern)
  - No type hints (rejected — reduces clarity and IDE support)

  **Rationale**:
  - Sheep project standardizes on Python 3.11+ for consistency
  - Union syntax (`X | Y`) is cleaner than `typing.Union`, used throughout codebase
  - Type hints improve code clarity, enable IDE autocomplete, provide static type checking
  - Feature 238 uses 3.11+ syntax; must maintain consistency

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → 2 → 3 → 4 → 5** (sequential — each phase builds on previous)

  1. **Foundation & Module Setup (Phase 1)** comes first because:
     - Establishes module structure, imports, constants that all other work depends on
     - Creates logger and function signature that orchestrates entire workflow
     - Fast (30 min): copy template, update constants, add docstrings

  2. **Content Generation & File Operations (Phase 2)** comes next because:
     - Implements core 1-3 orchestration steps (Generate → Write → Validate)
     - File validation must complete before git operations can proceed
     - Depends on module structure from Phase 1
     - Fast (1 hour): integrate CrewAI, pathlib, validation logic

  3. **Git Integration (Phase 3)** comes after content/file work because:
     - Stages, commits, pushes only after file validation passes
     - Depends on validated file existing on disk (Phase 2 output)
     - Fail-fast approach means invalid files never reach git
     - Fast (30 min): wire up GitCommitTool and GitPushTool

  4. **Testing & Verification (Phase 4)** comes after implementation because:
     - Unit tests verify module structure and imports
     - Integration tests verify end-to-end workflow
     - Tests verify actual file creation, content structure, git operations
     - Can't test what doesn't exist yet (1 hour): comprehensive test suite

  5. **Documentation (Phase 5)** comes last because:
     - Documents completed implementation
     - Finalizes specs with actual results
     - Fast (15 min): complete documentation

  ### What Gets Built in Each Phase

  **Phase 1**: Feature module scaffold with correct structure and function signature
  **Phase 2**: Content generation, file writing, and validation logic
  **Phase 3**: Git staging, committing, and pushing
  **Phase 4**: Unit, integration, and verification tests
  **Phase 5**: Final documentation updates

  ### No Iterative Rework Needed

  Implementation follows established pattern from 238+ precedents. All design decisions are predetermined;
  no experimentation or iteration needed. Each phase produces working, complete functionality that doesn't
  require rework in later phases.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | **CrewAI/Claude API unavailable** | High | Feature branch continues; error caught by logging. Validate Claude API keys in .env before execution. Implement timeout handling (15s max). |
  | **File I/O permissions issue** | Medium | pathlib will raise PermissionError on write. Validate working directory is writable before generating content. Run tests in isolated directory. |
  | **Git operation fails (dirty index, branch mismatch)** | Medium | GitCommitTool/GitPushTool handle errors; exception raised halts execution. Validate feature branch exists and is clean before starting feature module. |
  | **Validation catches generated content as invalid** | Low | CrewAI consistently generates valid markdown. If validation fails, log full content and error details for debugging. Regenerate (not retry in feature module). |
  | **Test flakiness (git operations vary by environment)** | Low | Use feature branch isolation; don't run tests on main. Mock git commands in unit tests; use real git in integration tests only. |
  | **Windows line ending issues (CRLF vs LF)** | Low | pathlib with `encoding="utf-8"` handles platform differences automatically. Validation checks for CRLF explicitly; rejects if found. |
  | **Encoding issues (UTF-8 BOM, invalid characters)** | Low | Validation checks for UTF-8 BOM (b'\\xef\\xbb\\xbf'); rejects if found. Generated content is plain ASCII + basic UTF-8; no special characters. |
  | **Module import fails** | Medium | Add feature_239 to package __init__.py if needed. Validate imports in unit tests first (runs before integration tests). |

  ---

  _Planning phase complete — architecture documented, design decisions finalized, phase sequencing justified_
