content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. Feature 239 creates a single test markdown file (`test-di4y4x.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with
  240+ similar test files already existing in the repository as precedents (test-*.md files at the root
  directory). This is a continuation of the markdown-file-creation pattern established in features
  101-238, with identical requirements and implementation approach. All architectural and design
  decisions have been pre-determined through these precedents; no new decisions are needed.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as a Python package with the following key structure:

  ```
  .
  ├── src/sheep/
  │   ├── features/              # Feature implementations (240+ markdown creation modules)
  │   ├── content_generators.py  # Shared utilities for markdown creation
  │   ├── config/                # LLM configuration and factory
  │   ├── tools/                 # Git and file operation tools
  │   └── observability/         # Logging via structured logging
  ├── tests/                     # Test suite for features
  ├── specs/                     # Feature specification documentation
  └── <root markdown files>      # Generated test markdown files (test-*.md)
  ```

  The codebase demonstrates a **template pattern** where each feature (101-238+) follows identical structure,
  requirements, and implementation approach. Feature 239 will follow this exact pattern.

  ### Architecture Patterns

  1. **Content Generation Pipeline**
     - Markdown content is generated using Claude API via CrewAI LLM framework
     - Content validation ensures format compliance (H1 heading + 2-3 sentences)
     - File I/O uses Python pathlib for cross-platform compatibility
     - Git operations performed via subprocess or shell tools

  2. **Feature Module Pattern**
     - Each feature has a module at `src/sheep/features/feature_XXX_markdown_file_creation.py`
     - Module exports a function `create_feature_XXX_markdown_file(repo_path: str | None) -> dict[str, str]`
     - Function orchestrates 5-step workflow: generate → write → validate → commit → push
     - Module includes comprehensive docstrings and logging

  3. **Testing Pattern**
     - Unit tests verify module imports and function signatures
     - Integration tests verify file creation, content structure, git operations
     - Tests mock only the Claude API boundary; file I/O and git operations are real

  4. **Git Integration**
     - Feature branch created by user or automation
     - File staged with `git add` after creation
     - Commit message follows conventional format: `feat(XXX): Create markdown file test-XXXXX.md with prose content`
     - Changes pushed to remote feature branch
     - PR created and merged to main

  ### Relevant Technologies

  **CrewAI Framework**
  - Multi-agent orchestration platform
  - Integrated LLM support (OpenAI, Anthropic Claude, Google Gemini)
  - Task-first design philosophy

  **Claude API (via CrewAI)**
  - Language model for content generation
  - Configured via `sheep.config.llm.get_reasoning_llm()`
  - Uses structured prompt for markdown generation

  **Python Libraries**
  - `pathlib`: File path operations and I/O
  - `subprocess`: Git command execution
  - Standard library logging for observability

  **Git Workflow**
  - Feature branch isolation (`feat/239-markdown-file-creation-d63db3`)
  - Conventional commit messages (`feat(239): ...`)
  - Remote tracking and push operations

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Single markdown file created at repository root: `test-di4y4x.md` |
  | `src/sheep/features/` | High | Feature module created: `feature_239_markdown_file_creation.py` (~120 LOC) with 5-step orchestration workflow |
  | `src/sheep/content_generators.py` | None | Existing utilities reused; no modifications needed |
  | `tests/` | High | Test files created: unit tests, integration tests, verification tests (~500 LOC) |
  | `specs/239-markdown-file-creation-d63db3/` | High | Documentation: spec.yaml, plan.yaml, research.yaml, tasks.yaml, feature.yaml |
  | Git history | High | New commit on feature branch; PR to main |
  | Remote repository | High | Feature branch and commit pushed to remote; merged to main via PR |

  ## Dependencies

  ### Code Dependencies
  - **CrewAI**: For LLM orchestration (already installed)
  - **Claude API**: For content generation (API credentials required in .env)
  - **pathlib** (Python stdlib): File operations
  - **subprocess** (Python stdlib): Git operations
  - **sheep.content_generators**: Existing utilities for markdown validation and file writing
  - **sheep.tools**: GitCommitTool, GitPushTool for git operations
  - **sheep.config.llm**: LLM factory for getting configured Claude instance

  ### External Dependencies
  - **Git**: Required for staging, committing, pushing
  - **Claude API keys**: Required for content generation (must be in .env)
  - **Feature branch**: Must exist or be created before implementation

  ### Architectural Dependencies
  - **Established pattern from features 101-238**: All decisions (file format, naming, validation, git workflow) are predetermined
  - **No breaking changes**: Feature follows identical pattern; no architectural modifications needed

  ## Success Criteria

  - [ ] File `test-di4y4x.md` created at repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# Title`) as the first line
  - [ ] Heading is followed by a blank line (standard markdown spacing)
  - [ ] File contains 2-3 sentences of coherent prose content following the blank line
  - [ ] File uses UTF-8 encoding without byte order mark (BOM)
  - [ ] File uses Unix-style LF line endings (`\n`), not CRLF or CR
  - [ ] File content passes CommonMark markdown validation with no syntax errors
  - [ ] File size is 300-700 bytes (natural result of proper formatting)
  - [ ] File is staged in git (verified via `git status` showing the file as staged)
  - [ ] Commit message follows conventional format: `feat(239): Create markdown file test-di4y4x.md with prose content`
  - [ ] Commit is created and changes are pushed to remote feature branch `feat/239-markdown-file-creation-d63db3`
  - [ ] No other files are modified, created, or deleted (working directory is clean after push)
  - [ ] Feature module at `src/sheep/features/feature_239_markdown_file_creation.py` is created and functional
  - [ ] Comprehensive test suite covers all aspects of feature implementation
  - [ ] Feature is documented in specs directory with complete specification

  ## Implementation Approach

  The implementation follows the 5-step orchestration pattern used in features 101-238:

  1. **Content Generation**: Use CrewAI to call Claude API with markdown prompt
  2. **File Writing**: Write content to `test-di4y4x.md` with UTF-8 encoding, LF line endings
  3. **Validation**: Verify file meets all format requirements (H1, 2-3 sentences, size, encoding)
  4. **Git Operations**: Stage file, commit with conventional message, push to remote
  5. **Documentation**: Create feature module, tests, and specification files

  No new tools, utilities, or architectural components are needed. All required functionality exists
  in `src/sheep/content_generators.py` and existing git tools.

  ## Size Estimate

  **S (hours)** — This is a straightforward implementation following a proven pattern with 238+ precedents.

  **Justification:**
  - Feature module: Copy from feature 238, change filename from `test-mcfudw.md` to `test-di4y4x.md` and constant `239` (~10 minutes)
  - Markdown file: Generated automatically by content generator (~30 seconds)
  - Tests: Copy from feature 238, update filename and constants (~20 minutes)
  - Specification: Follow template from feature 238 (~15 minutes)
  - Git workflow: Staging, committing, pushing (~5 minutes)

  **Total estimated effort: 1-2 hours** for a human implementer following the established pattern.

  ---

  _Analysis phase complete — repository thoroughly explored and feature requirements documented_
