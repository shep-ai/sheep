content: |
  ## Technology Decisions & Architecture

  Feature 239 implements the proven markdown-file-creation pattern established in features 101-238.
  All architectural and technology decisions are predetermined by this extensive precedent. The
  implementation requires no new libraries, no architectural changes, and no novel approaches.

  ### 1. Content Generation Framework: CrewAI with Claude API

  **Chosen:** CrewAI LLM orchestration framework with Claude API via `sheep.config.llm.get_reasoning_llm()`

  **Why CrewAI and not direct Claude API?**
  - CrewAI provides multi-agent orchestration, integrated logging, and structured prompting
  - Framework integration with sheep.observability enables structured logging and monitoring
  - API key/provider abstraction (handles multiple LLM providers)
  - Proven pattern across all 238+ preceding features
  - Avoids duplicating infrastructure already in Sheep codebase

  **Implementation:**
  - Call `sheep.config.llm.get_reasoning_llm()` to get configured Claude instance
  - Temperature set to 0.2 (reasoning task, low variance)
  - Use standardized MARKDOWN_GENERATION_PROMPT from content_generators.py
  - Response handling via response.get("content") or str conversion

  ### 2. File I/O Strategy: pathlib with UTF-8 Encoding

  **Chosen:** Python pathlib library for file operations with UTF-8 encoding and LF line endings

  **Why pathlib and not os.path?**
  - Modern Python standard (recommended for 3.11+)
  - Cross-platform abstraction: path separators, line endings handled automatically
  - Pythonic API with convenience methods (.exists(), .stat(), .parent, etc.)
  - Used throughout sheep codebase (content_generators.py, all tools)
  - UTF-8 encoding parameter automatically handles Windows/Unix line ending differences

  **Implementation:**
  - Use `Path.cwd()` to resolve repository root
  - Write file with `open(filepath, "w", encoding="utf-8")` — handles all platform line endings
  - Verify file exists and has non-zero size after writing
  - Validate encoding by reading binary and checking for UTF-8 BOM (b'\xef\xbb\xbf')
  - Check for CRLF in binary content (b'\r\n') and reject if found

  ### 3. Content Validation: Strict Approach

  **Chosen:** Strict CommonMark validation before writing to disk (fail-fast on error)

  **Validation checks:**
  - H1 heading exists (`content.startswith("# ")`)
  - Blank line separator between heading and prose
  - Exactly 2-3 sentences (period count in prose section)
  - UTF-8 encoding with no byte order mark (BOM)
  - Unix LF line endings (not CRLF)
  - Trailing newline at end of file
  - File size 300-700 bytes (natural result of proper formatting)

  **Why strict validation?**
  - Catch all specification violations before they reach git
  - Prevents invalid files from polluting repository
  - Fail-fast (raise exception, don't proceed to git ops)
  - Consistent with features 101-238 pattern
  - Fast performance: O(n) file scan, minimal overhead

  ### 4. Git Operations: Use Existing Tools

  **Chosen:** sheep.tools.GitCommitTool and GitPushTool

  **Why not direct subprocess.run() git commands?**
  - GitCommitTool and GitPushTool already exist in codebase
  - Proven across 238+ features; fully tested
  - Handles error cases, git state validation, output capture
  - Maintains code reusability and DRY principle
  - Consistent with existing patterns

  **Workflow:**
  1. **Stage:** GitCommitTool with add_all=True stages all changes
  2. **Commit:** Same tool creates conventional commit
  3. **Push:** GitPushTool with set_upstream=True sets remote tracking

  **Commit message format:**
  ```
  feat(239): Create markdown file test-di4y4x.md with prose content
  ```

  ### 5. Logging: Structured Observability

  **Chosen:** Comprehensive structured logging via sheep.observability (structlog)

  **Logging points throughout workflow:**
  - Task 1: Starting content generation (info) + generated size (debug)
  - Task 2: Starting file write (info) + written file location (debug)
  - Task 3: Starting validation (info) + validation passed (info)
  - Task 4: Starting commit (info) + commit message (debug)
  - Task 5: Starting push (info) + push result (debug)
  - Final: Success or error with context (info or error)

  **Why structured logging?**
  - Integration with sheep.observability infrastructure
  - Rich console rendering with context variables
  - Queryable log output (structured fields)
  - Pattern from features 101-238
  - Enables debugging and compliance auditing

  ### 6. Python Version: 3.11+ with Modern Type Hints

  **Chosen:** Python 3.11+ with union type syntax (X | Y)

  **Type annotations:**
  ```python
  def create_feature_239_markdown_file(repo_path: str | None = None) -> dict[str, str]:
  ```

  **Why 3.11+ and not 3.9?**
  - Sheep project standardizes on 3.11+
  - Union syntax (X | Y) is cleaner than typing.Union
  - Used throughout codebase (content_generators.py, tools, etc.)
  - Better IDE support and static type checking
  - Feature 238 uses 3.11+ syntax; must maintain consistency

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | **CrewAI** | LLM orchestration | Use (already installed) | Standard framework in Sheep; multi-agent support; logging integration |
  | **Claude API** | Content generation | Use (via CrewAI) | Accessed through sheep.config.llm.get_reasoning_llm() |
  | **pathlib** | File I/O | Use (Python stdlib) | Modern, cross-platform; used throughout Sheep codebase |
  | **subprocess** | Git execution | Use via tools | GitCommitTool and GitPushTool wrap subprocess; no direct calls in feature |
  | **structlog** | Structured logging | Use (already installed) | Part of sheep.observability; rich console rendering |
  | **GitPython** | Git library | Reject | External dependency; Sheep uses GitCommitTool/GitPushTool instead |
  | **markdown** | Markdown parser | Reject | Custom validation in content_generators.py is sufficient |
  | **pydantic** | Data validation | Use (already installed) | Used by CrewAI and tools; no direct import in feature module |

  **No new dependencies required.** All libraries already integrated in Sheep project.

  ## Security Considerations

  ### 1. Path Traversal Prevention
  - Filename validation rejects "/" and "\" characters and paths starting with "."
  - pathlib.Path() resolves to repository root; directory traversal prevented
  - Example: `filename="../etc/passwd"` raises ValueError immediately

  ### 2. API Key Security
  - Claude API keys loaded via sheep.config.llm, never exposed in feature module
  - Keys stored in environment/settings, not logged or printed
  - CrewAI handles key management; no manual API calls in feature code

  ### 3. UTF-8 Encoding Validation
  - Files checked for UTF-8 BOM (b'\xef\xbb\xbf') — rejected if found
  - Content decoded as UTF-8 and validated (UnicodeDecodeError caught)
  - CRLF line endings detected and rejected (b'\r\n' check)

  ### 4. Git Operation Safety
  - Operations use current branch (no explicit branch switching)
  - Feature branch created before execution; prevents accidental main branch commits
  - Conventional commit messages make intention clear in git history

  ### 5. Content Safety
  - Strict validation ensures only expected markdown structure
  - No code execution, no shell injection, no interpreter abuse
  - Markdown stored as plain text; no dynamic evaluation

  ## Performance Considerations

  | Concern | Impact | Mitigation |
  | ------- | ------ | ---------- |
  | **LLM API latency** | 0.5-3s per request (dominant time) | Expected; no optimization needed for batch operations |
  | **File I/O** | ~10-50ms read/write for 300-700 byte file | Minimal; necessary for correctness |
  | **Validation** | O(n) file scan + line parsing | Fast; caching not useful for single-write files |
  | **Git operations** | ~100-500ms per command (add, commit, push) | Acceptable; batching via tools (add+commit in one call) |
  | **Memory usage** | <1MB (file content in string + binary read) | Negligible; no optimization needed |

  ## Architecture Integration

  ### Workflow Pattern
  Feature 239 follows the proven 5-step orchestration:
  ```
  Generate → Write → Validate → Commit → Push
  ```

  Each step is distinct and testable. Failure at any step raises exception and halts
  (no partial commits or pushes).

  ### Import Structure
  ```python
  from sheep.content_generators import (
      generate_markdown_content,
      write_markdown_file,
      validate_markdown_file,
      commit_markdown_file,
      push_markdown_file,
  )
  from sheep.config.llm import get_reasoning_llm
  from sheep.observability.logging import get_logger
  ```

  All these modules already exist; no new code needed in supporting infrastructure.

  ### No Circular Dependencies
  - content_generators.py doesn't import feature modules
  - Feature imports content_generators (one-way)
  - Clean separation of concerns

  ## Testing Strategy

  Testing follows patterns from features 101-238:

  **Unit Tests:**
  - Module imports and exports function
  - Function signature matches spec
  - Constants (FEATURE_NUMBER, MARKDOWN_FILENAME) defined
  - Logger created successfully

  **Integration Tests:**
  - Feature execution creates file at correct path
  - File contains H1 + 2-3 sentences
  - File has UTF-8 encoding, LF endings, trailing newline
  - File is staged in git (verified via git status)
  - Commit created with correct conventional message
  - Changes pushed to remote feature branch

  **Verification Tests:**
  - End-to-end feature execution succeeds
  - Cleanup and rollback work correctly
  - Repeated execution creates different content (randomness)

  ## Known Limitations

  ### Sentence Detection via Period Count
  - Simple: count periods in prose content
  - Not linguistically perfect: "U.S.A." counts as 3 periods, not 1 sentence
  - Trade-off: Simplicity vs. grammatical accuracy
  - Acceptable: Generated content typically uses simple punctuation

  ### No Response Caching
  - Each feature generation calls Claude API (no cache)
  - Trade-off: Fresh unique content vs. higher API costs
  - Justification: Feature files are test fixtures, not production; caching unnecessary

  ### Determinism
  - Feature generates different content each run (good for test variety)
  - Not deterministic/reproducible (expected behavior)

  ## Conclusion

  Feature 239 is a straightforward implementation of a proven pattern. All architectural
  decisions are predetermined by 238+ precedents. Implementation involves:

  1. Copy feature_238_markdown_file_creation.py
  2. Update FEATURE_NUMBER = 239
  3. Update MARKDOWN_FILENAME = "test-di4y4x.md"
  4. Update feature name/description comments
  5. No other code changes needed

  Estimated implementation time: **1-2 hours** including feature module, tests, and documentation.
