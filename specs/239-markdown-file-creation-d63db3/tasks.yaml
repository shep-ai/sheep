  5-step workflow (generate → write → validate → commit → push) using CrewAI, pathlib, GitCommitTool,
  and structured logging. Each task includes TDD cycle (RED-GREEN-REFACTOR) and acceptance criteria.
  Total estimated effort: 2-3 hours.

