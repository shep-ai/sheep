content: |
  ## Task Breakdown Overview

  Feature 239 implementation is broken into 8 concrete tasks across 5 phases, each with TDD cycles
  and acceptance criteria. Tasks are ordered by dependency — each phase builds on previous work.

  ### Phase 1: Foundation & Module Setup (1 task, 30 min)

  **Task 1-1** creates the feature module boilerplate: src/sheep/features/feature_239_markdown_file_creation.py
  with correct structure, imports, constants, function signature, docstring, and logger. This establishes
  the module that orchestrates the entire 5-step workflow.

  **Why first**: Module structure is prerequisite for all other work. All subsequent tasks depend on
  this module existing and having correct imports, constants, and function signature.

  ### Phase 2: Content Generation & File Operations (3 tasks, 80 min)

  **Task 2-1** implements content generation: use CrewAI to call Claude API and generate markdown
  with H1 heading and 2-3 sentences. This is the foundation — all subsequent steps work with content
  generated here.

  **Task 2-2** implements file writing: use pathlib to write content to test-di4y4x.md with UTF-8
  encoding and LF line endings. Depends on task 2-1 (needs generated content).

  **Task 2-3** implements validation logic: verify file meets all CommonMark format requirements
  before proceeding to git. Fail-fast: raise exception on violation to prevent invalid files from
  reaching git. Depends on task 2-2 (needs written file to validate).

  **Why this order**: Content generation → file writing → validation creates a clean separation.
  Validation must complete successfully before git operations proceed (task 3). Each step is testable
  independently.

  ### Phase 3: Git Integration (2 tasks, 30 min)

  **Task 3-1** implements git staging and committing: use GitCommitTool to stage file and create
  commit with conventional message. Only proceeds after validation passes (task 2-3).

  **Task 3-2** implements git push: use GitPushTool to push commit to remote feature branch with
  upstream tracking. Depends on task 3-1 (needs commit before pushing).

  **Why this order**: Must stage/commit before pushing. Must validate before committing (prevents
  invalid files from reaching git). Fail-fast validation ensures only good commits reach git.

  ### Phase 4: Testing & Verification (3 tasks, 80 min)

  **Task 4-1** creates unit tests: verify module structure, imports, function signature, constants,
  logger. Fast, focused tests that don't require file I/O or git operations.

  **Task 4-2** creates integration tests: verify end-to-end workflow from file creation through git
  push. Real file I/O and git operations; may mock CrewAI to control content.

  **Task 4-3** creates verification and edge case tests: validate failure paths, repeated execution,
  error handling, git state recovery.

  **Why in phase 4**: Tests verify completed implementation (tasks 1-3). Can't test what doesn't
  exist yet. Tests should be comprehensive to catch regressions.

  ### Phase 5: Documentation (1 task, 15 min)

  **Task 5-1** completes specification documentation and finalizes feature for PR/merge.

  **Why last**: Documentation describes completed implementation. No documentation needed until
  implementation is complete and tested.

  ## TDD Cycle Pattern

  Each code task follows TEST-DRIVEN DEVELOPMENT:

  1. **RED**: Write test that asserts desired behavior. Test fails because feature doesn't exist.
  2. **GREEN**: Write minimal code to pass the test. Keep it simple; don't optimize.
  3. **REFACTOR**: Clean up code while keeping tests passing. Extract helpers, improve naming,
     add docstrings, optimize logging.

  Example (Task 2-1):
  - RED: Write test that calls feature function, asserts returned content has H1 heading
  - GREEN: Implement CrewAI call that returns markdown with H1 heading
  - REFACTOR: Extract prompt, add error handling, optimize logging

  ## Dependency Graph

  ```
  task-1-1 (Module structure)
      ↓
  task-2-1 (Content generation)
      ↓
  task-2-2 (File writing)
      ↓
  task-2-3 (Validation)
      ↓
  task-3-1 (Git commit)
      ↓
  task-3-2 (Git push)
      ↓
  task-4-1 (Unit tests) ┐
  task-4-2 (Integration tests) ├→ task-5-1 (Documentation)
  task-4-3 (Verification tests) ┘
  ```

  Tests (4-1, 4-2, 4-3) can be written in parallel after implementation (3-2) is complete.

  ## Effort Breakdown

  | Phase | Task | Effort | Cumulative |
  | ----- | ---- | ------ | ---------- |
  | 1 | Module setup | 30m | 30m |
  | 2 | Content generation | 35m | 65m |
  | 2 | File writing | 25m | 90m |
  | 2 | Validation | 20m | 110m |
  | 3 | Git commit | 15m | 125m |
  | 3 | Git push | 15m | 140m |
  | 4 | Unit tests | 25m | 165m |
  | 4 | Integration tests | 35m | 200m |
  | 4 | Verification tests | 20m | 220m |
