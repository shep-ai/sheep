# Structured technology decisions
decisions:
  - title: 'File Format: Markdown vs. Other Documentation Formats'
    chosen: 'GitHub-Flavored Markdown (GFM)'
    rejected:
      - 'reStructuredText (.rst) — Not used in repository root; adds unnecessary complexity for simple prose; inconsistent with existing test file pattern'
      - 'AsciiDoc (.adoc) — Over-engineered for single heading + 2-3 sentences; no existing precedent in repository; different toolchain'
      - 'Plain text (.txt) — Would not render with heading styles on GitHub; violates established test-*.md naming and format convention'
    rationale: >
      The repository already contains 50+ markdown files at root level (test-*.md files, state machine docs, etc.).
      Features #045-048 successfully created markdown files with this exact format. GFM is GitHub's native format,
      renders properly in web UI, supports heading hierarchy, and requires no special tooling beyond a text editor.
      This choice aligns with repository conventions and proven precedent.

  - title: 'File Encoding: UTF-8 vs. Other Encodings'
    chosen: 'UTF-8 without BOM (Byte Order Mark)'
    rejected:
      - 'UTF-8 with BOM — Creates unnecessary 3-byte prefix; incompatible with shebang lines; violates Unix conventions'
      - 'ASCII — Insufficient for international characters; unnecessarily restrictive; inconsistent with modern web standards'
      - 'UTF-16 or UTF-32 — Overkill for simple text file; increases file size; breaks Unix text file assumptions'
    rationale: >
      The feature spec explicitly requires UTF-8 without BOM, matching repository-wide convention visible in existing files.
      This encoding is the Unix/Linux standard, GitHub-compatible, and universally supported. BOM exclusion is critical
      for compatibility with version control and text editors used by contributors. Features #045-048 all used this encoding.

  - title: 'Line Endings: LF vs. CRLF'
    chosen: 'LF (Unix-style line endings, `\n`)'
    rejected:
      - 'CRLF (Windows-style `\r\n`) — Creates platform-specific files; causes git diffs to show every line as changed; violates repository convention'
      - 'Mixed line endings — Results in unstable git history; unpredictable behavior across tools; difficult to review'
    rationale: >
      Feature spec explicitly requires LF line endings. Git repositories should use consistent line endings; the Sheep
      repository uses LF throughout. Using CRLF would flag the entire file as changed in diffs despite content being identical,
      creating noise in git history. LF is the Git standard and ensures cross-platform compatibility. Features #045-048 all used LF.

  - title: 'Heading Level: H1 (#) vs. H2 (##) for Title'
    chosen: 'H2 (##) heading'
    rejected:
      - 'H1 (#) — Creates only heading on page; inconsistent with some existing test files using H2'
      - 'No heading — Violates success criteria requiring "descriptive title"; not professional documentation'
      - 'H3 (###) or deeper — Excessive nesting; implies parent sections above it (which don''t exist); poor document structure'
    rationale: >
      GitHub-Flavored Markdown convention suggests H1 for page title. However, examination of existing test-*.md files
      shows some use H1 and some use H2. Both are valid. H2 is chosen for consistency with certain existing test files
      (e.g., test-sf7prc.md). A single, clear heading establishes document structure. Either level satisfies spec requirements
      ("exactly one markdown heading with a descriptive title").

  - title: 'Content Topic: Constrained vs. Free-Form'
    chosen: 'Free-form topic selection (author chooses any topic)'
    rejected:
      - 'Prescribed topic — Feature spec explicitly allows "about anything"; constraining topic wastes flexibility; adds decision overhead'
      - 'Topic template or formula — Unnecessary scaffolding; simple 2-3 sentences don''t require structure'
    rationale: >
      Feature spec and success criteria explicitly state flexibility: "about any topic" with no topic constraints.
      This reduces decision complexity and allows the implementation to proceed autonomously. Content quality matters
      (must be readable, grammatically correct, spell-checked), but topic selection is unrestricted.

  - title: 'Git Workflow: Direct Commit vs. Signed Commits'
    chosen: 'Conventional commit with standard Git signature (unsigned)'
    rejected:
      - 'GPG-signed commits — Adds unnecessary ceremony for a documentation-only change; not required by repository policy'
      - 'Multiple commits (one per step) — Unnecessary; single file creation warrants single commit; reduces noise in git log'
      - 'Merge commit — Explicitly forbidden by feature spec ("no merge commits"); not applicable for single branch workflow'
    rationale: >
      Feature spec requires conventional commit format: "feat: Create test-g6ru4c.md markdown file about <topic>".
      Repository does not mandate GPG signatures for all commits (optional enforcement only on certain workflows).
      A single, well-formatted commit is sufficient and cleaner than breaking into multiple commits.
      Features #045-048 all used single conventional commits.

