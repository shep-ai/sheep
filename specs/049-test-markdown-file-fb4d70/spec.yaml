# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository maintains a collection of markdown files at the repository root, including test files, educational content, design patterns, and state machine diagrams. A new markdown file named `test-g6ru4c.md` needs to be created with a title heading and 2-3 sentences of content about any topic.

  This feature follows the well-established pattern successfully executed in features #045-048, which all required identical tasks (creating a single markdown test file with a title and 2-3 sentences). No code modifications, configuration changes, or infrastructure updates are required.

  ## Success Criteria

  - [ ] File named `test-g6ru4c.md` exists in the repository root directory (not in any subdirectory)
  - [ ] File contains exactly one markdown heading with a descriptive title
  - [ ] File contains 2-3 sentences of prose content about any topic
  - [ ] Markdown syntax is valid and renders correctly
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are LF (Unix-style, `\n`), not CRLF or mixed
  - [ ] File size is between 200-600 bytes (consistent with similar test files)
  - [ ] File has been staged and committed to git with a conventional commit message
  - [ ] Commit message follows format: `feat: Create test-g6ru4c.md markdown file about <topic>`
  - [ ] Changes have been pushed to the `feat/049-test-markdown-file-fb4d70` branch
  - [ ] No modifications to any existing files in the repository

  ## Functional Requirements

  - **FR-1**: Create a new file named `test-g6ru4c.md` at the repository root (same directory level as other test-*.md files, not in subdirectories)
  - **FR-2**: File must contain a single markdown heading that clearly describes the content topic
  - **FR-3**: File must contain 2-3 sentences of prose content providing information or context about the chosen topic
  - **FR-4**: Content must use valid GitHub-Flavored Markdown (GFM) syntax with no syntax errors
  - **FR-5**: File must be committed to git with a conventional commit message in the format `feat: Create test-g6ru4c.md markdown file about <topic>`
  - **FR-6**: Changes must be pushed to the remote repository on the `feat/049-test-markdown-file-fb4d70` branch

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (matching repository-wide convention)
  - **NFR-2**: Line endings must be LF (Unix-style, `\n`), not CRLF or mixed line endings
  - **NFR-3**: File size should remain minimal, approximately 200-600 bytes including heading and content (consistent with historical test files)
  - **NFR-4**: Content must be readable and grammatically correct prose with no spelling errors
  - **NFR-5**: Markdown syntax must follow repository conventions and render correctly on GitHub
  - **NFR-6**: File must have no external dependencies, imports, or runtime requirements
  - **NFR-7**: Single commit should be created for this feature with no merge commits or rebases

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root level**: Contains 50+ markdown files including educational content (test-*.md files), state machine diagrams (ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, etc.), design pattern documentation, and diverse topics (kiln construction, nautical knots, beekeeping, embossing, etc.)
  - **specs/**: Feature specification directory containing 49+ subdirectories (specs/006 through specs/049), each holding YAML specifications for features using the defined structure
  - **src/sheep/**: Python source code for the agentic platform (agents, flows, tools, configuration, observability)
  - **.github/**: GitHub Actions workflows for CI/CD automation
  - **tests/**: Python test suite for the platform
  - **pyproject.toml, Dockerfile, docker-compose.yml**: Build and deployment configuration
  - **.env.example, .gitignore, .dockerignore**: Environment and repository configuration

  The platform (Sheep) is a CrewAI-based agent automation system for automating code implementation tasks. However, for this feature, only the repository root is affected.

  ### Architecture Patterns

  The repository follows these established conventions for markdown test files:

  1. **Naming Convention**: Files follow the pattern `test-<identifier>.md` where `<identifier>` is a 6-character alphanumeric string (e.g., test-sf7prc.md, test-lo8q71.md, test-tmardz.md, test-r7uy00.md, test-g12aiq.md)
  2. **Placement**: All test markdown files are stored at the repository root (no subdirectories)
  3. **Content Structure**: Simple structure with one markdown heading (H1 `#` or H2 `##`) followed by 2-3 sentences of prose content
  4. **Encoding & Line Endings**: UTF-8 encoding without BOM, LF (Unix-style) line endings (`\n`), not CRLF
  5. **Topic Selection**: Flexible—spec explicitly allows "about anything", providing complete creative freedom
  6. **Git Integration**: Added via conventional commit format (e.g., `feat: Create test-g6ru4c.md markdown file about <topic>`)
  7. **No Dependencies**: Pure documentation files with no code imports, external dependencies, or runtime requirements
  8. **File Size**: Minimal, typically 200-500 bytes including heading and content

  ### Relevant Technologies

  - **Markdown**: GitHub-Flavored Markdown (GFM) syntax for content authoring
  - **Git**: Version control system for file tracking and commit history
  - **File System**: Plain text files at repository root with UTF-8 encoding
  - **No Build/Test Infrastructure**: Unlike source code features, this requires no build tools, test runners, linters, or CI/CD pipeline modifications

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new `.md` file; no modifications, deletions, or renames to existing files |
  | Specs directory | None | Feature specification created beforehand; Analysis phase only updates this spec.yaml |
  | Source code (`/src/sheep`) | None | No Python code, platform logic, modules, or dependencies affected |
  | Tests (`/tests`) | None | No test files created, modified, or deleted; purely a content-only feature |
  | CI/CD (`.github/workflows`) | None | No workflow changes, pipeline modifications, or automation updates required |
  | Build system (`pyproject.toml`) | None | No dependencies, configuration, or project settings modified |
  | Git history | Low | Single commit added with standardized conventional commit message; no force pushes, rebases, or merge commits |

  ## Dependencies

  - **Git repository**: Feature branch `feat/049-test-markdown-file-fb4d70` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies, imports, or Python packages
  - **No code dependencies**: Feature does not depend on or impact any source code, configuration, or infrastructure
  - **No platform features**: Does not depend on CrewAI agents, tools, flows, or any Sheep platform components

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature with clear, straightforward requirements based on four identical recent features (#045-048):

  - **File creation**: ~5 minutes (write one heading + 2-3 sentences of prose content on any topic)
  - **Validation**: ~3 minutes (verify markdown syntax is valid, file encoding is UTF-8, line endings are LF)
  - **Git workflow**: ~2-5 minutes (stage file, create commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is justified by:
  - Well-established pattern with four identical, recently completed features (#045-048) providing proven precedent
  - Completely flexible topic selection ("about anything") with no research, architectural decisions, or complex analysis needed
  - Single file with minimal, well-understood content format (one heading + prose only)
  - No testing framework integration, CI/CD changes, documentation updates, or code modifications required
  - Clear success criteria that are easy to verify

