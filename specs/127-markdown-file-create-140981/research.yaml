content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-20
  - **Resolution:** All decisions made with clear rationale

  ## Technology Decisions Summary

  ### 1. Content Generation Approach

  **Chosen:** Use existing `content_generators.py` module with LLM-based generation via CrewAI

  **Rejected alternatives:**
  - Direct hardcoded prose — contradicts spec requirement for LLM auto-generated content with auto-selected topic
  - Alternative LLM libraries — unnecessary duplication; CrewAI already integrated

  **Rationale:** The spec explicitly requires "Auto-generated by LLM" content. The existing
  `generate_markdown_content()` function (src/sheep/content_generators.py, lines 27-68)
  implements this via Claude API through CrewAI. Benefits: satisfies spec exactly, follows
  established pattern from features 121-126 and 100+ test files, provides built-in validation,
  includes proper error handling, integrates logging, no new dependencies.

  ### 2. Markdown Validation Strategy

  **Chosen:** Comprehensive validation using `validate_markdown_file()` before committing

  **Rejected alternatives:**
  - Minimal validation — violates spec requirement and risks format inconsistencies
  - Post-commit validation — violates spec requirement to prevent invalid file creation

  **Rationale:** The spec explicitly requires "Comprehensive validation" (resolved product
  question). The `validate_markdown_file()` function checks: H1 heading format, 2-3 sentence
  count, UTF-8 encoding with no BOM, LF line endings (not CRLF), file size, trailing newline.
  This prevents invalid files from entering git history and provides specific error messages.

  ### 3. File I/O and Path Handling

  **Chosen:** Use `pathlib.Path` from Python standard library via `write_markdown_file()` wrapper

  **Rejected alternatives:**
  - Direct os.path manipulation — less Pythonic and error-prone
  - GitPython/subprocess for file ops — unnecessarily complex

  **Rationale:** The `write_markdown_file()` function uses pathlib.Path with: path traversal
  validation, UTF-8 encoding enforcement, cross-platform compatibility, file creation
  verification, integrated logging. Idiomatic Python 3.11+.

  ### 4. Git Workflow Integration

  **Chosen:** Use `GitCommitTool` and `GitPushTool` via `content_generators.py` orchestration

  **Rejected alternatives:**
  - Direct subprocess calls to git — duplicates logic in git_tools.py
  - GitPython library directly — less integrated with CrewAI tooling

  **Rationale:** Orchestrating existing CrewAI tools provides: leveraged existing integration,
  consistent error handling, integrated logging/observability, established patterns from
  features 121-126, graceful subprocess error handling.

  ### 5. LLM Error Handling

  **Chosen:** No retry logic; let API errors propagate with descriptive logging

  **Rejected alternatives:**
  - Exponential backoff retry — adds unnecessary complexity
  - Fallback to hardcoded content — violates spec requirement for LLM generation

  **Rationale:** Simple implementation with try-catch-log pattern. API errors visible via
  logging. Retry logic belongs in orchestration layer, not content generation.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | `content_generators.py` | Markdown generation, validation, git integration | **Use** | Existing module provides complete end-to-end workflow; validated across 125+ features |
  | `git_tools.py` | CrewAI-based git operations (commit, push) | **Use** | Already integrated; provides error handling and logging; consistent with patterns |
  | `pathlib` (stdlib) | Cross-platform file I/O and path handling | **Use** | Python 3.11+ standard library; Pythonic; safe path validation |
  | `CrewAI` | LLM framework for content generation | **Use** | Already in dependencies; integrates with Anthropic Claude API; used throughout |
  | `Anthropic Claude API` | LLM for markdown content generation | **Use** | Configured via config/llm.py; ANTHROPIC_API_KEY in .env; meets spec requirement |
  | `sheep.observability.logging` | Logging and tracing infrastructure | **Use** | Existing infrastructure; integrated throughout content_generators.py |
  | `subprocess` | Git operations via command line | **Use (indirectly)** | Wrapped by git_tools.py CrewAI tools with error handling |
  | `pytest` | Testing framework | **Not applicable** | Feature creates test artifact, not unit tests |
  | `GitPython` | Python git library wrapper | **Not required** | Functionality provided by git_tools.py subprocess wrappers |

  ## Security Considerations

  ### 1. File Path Validation
  - **Risk:** Path traversal attacks via malicious filename
  - **Mitigation:** `write_markdown_file()` validates filename prevents "/" "\\" ".." patterns
  - **Status:** ✓ Implemented

  ### 2. UTF-8 Encoding
  - **Risk:** Character encoding attacks or corruption
  - **Mitigation:** Explicit UTF-8 encoding in write_markdown_file(); validation in validate_markdown_file()
  - **Status:** ✓ Implemented

  ### 3. LLM Prompt Injection
  - **Risk:** Malicious prompts could cause harmful content generation
  - **Mitigation:** Hardcoded prompt template; no user input in prompt; LLM instructed to return only markdown
  - **Status:** ✓ Implemented

  ### 4. Git Operation Safety
  - **Risk:** Git errors or malicious git state
  - **Mitigation:** GitCommitTool uses controlled git add; GitPushTool specifies branch explicitly
  - **Status:** ✓ Implemented

  ### 5. File Overwrite Prevention
  - **Risk:** Creating file could overwrite existing work
  - **Mitigation:** Filename controlled (test-xkd1zo.md); validation confirms creation; git staging would show conflicts
  - **Status:** ✓ Implemented by specification (unique filename)

  ## Performance Implications

  ### Execution Time Estimate
  - Markdown generation: 3-5 seconds (LLM API latency)
  - File write: < 1ms
  - Validation: < 10ms
  - Git operations: 1-3 seconds
  - **Total: 5-10 seconds**
  - **Well within spec targets:** < 30 sec for generation (NFR-4), < 15 min total (NFR-5)

  ### No Performance Concerns
  - Single LLM API call with simple prompt
  - File I/O negligible for < 1KB files
  - Dual file reads for validation acceptable (filesystem caching)
  - Git operations typical for this workflow
  - Implementation is optimized for correctness, not speed (reasonable for test artifact)

  ## Architecture Notes

  ### Integration with Existing Infrastructure

  The feature orchestrates the established content generation pipeline:
  ```
  Prompt Template (hardcoded)
        ↓
  CrewAI LLM Framework
        ↓
  Anthropic Claude API
        ↓
  Markdown content (H1 + 2-3 sentences)
        ↓
  Comprehensive Validation
        ↓
  File I/O (pathlib, UTF-8, LF)
        ↓
  Git staging (GitCommitTool)
        ↓
  Git commit (conventional format)
        ↓
  Git push (upstream tracking)
  ```

  ### Logging and Observability
  - All major steps logged via `sheep.observability.logging` module
  - Detailed logging at each step for debugging
  - Error logging includes context for visibility
  - Integrated with potential Langfuse tracing if configured

  ### Error Handling Patterns
  - Try-except blocks wrap I/O and external calls
  - Specific exceptions: ValueError for validation, IOError for file ops
  - Exceptions propagate with logging, allowing caller to handle
  - No silent failures; all errors visible

  ### Consistency with Established Patterns
  - Follows structure from features 121-126
  - Uses same validation criteria as 100+ existing test files
  - Conventional commit format consistent with git history
  - File format (H1 + blank + 2-3 sentences) is codebase standard

  ### No Architecture Changes Required
  - ✓ Uses existing modules (content_generators.py, git_tools.py, config/llm.py, logging)
  - ✓ No new abstractions needed
  - ✓ No API changes
  - ✓ No database schema changes
  - ✓ No new configuration required
  - ✓ No CI/CD pipeline changes
  - ✓ Pure function orchestration of existing capabilities

  ### Implementation Entry Point
  The main entry point is `create_markdown_file()` in content_generators.py (lines 363-440):

  ```python
  def create_markdown_file(
      filename: str,
      repo_path: str | None = None
  ) -> dict[str, str]:
      """Orchestrate complete workflow: generate, write, validate, commit, push"""
  ```

  For this feature: `create_markdown_file("test-xkd1zo.md")`

  Returns:
  ```python
