content: |
  ## Task Breakdown Summary

  This feature requires a single focused task: execute the existing `create_markdown_file()`
  orchestration function and verify the result meets all success criteria.

  ### Why Single Task

  The spec requirements can be fully satisfied by calling a single, existing function that
  handles the complete workflow: content generation via LLM, file I/O, validation, and git
  integration. The function is production-tested across 100+ features (121-126 and existing
  test files), so the implementation is straightforward orchestration plus verification.

  The task combines execution and verification because they are tightly coupled: we execute
  the function and immediately verify the output matches all requirements. Separation would
  create artificial dependencies and split what is logically a single unit of work.

  ### Effort Breakdown

  - **Function import and call**: 5 min
  - **File existence and content verification**: 10 min
  - **Markdown format validation (H1, sentence count)**: 10 min
  - **File encoding and line-ending verification**: 10 min
  - **Git state verification (staging, commit, push)**: 10 min
  - **Test organization and helper function extraction**: 5 min
  - **Total**: 45 minutes

  ### Test-Driven Development Approach

  **RED phase**: Write comprehensive tests that assert all success criteria before executing
  the function. Tests should be independent, focused on single assertions, and executable
  against the actual file system and git repository (no mocking). Each test verifies one
  or more related aspects of the success criteria.

  **GREEN phase**: Call `create_markdown_file("test-xkd1zo.md")` and implement minimal
  verification logic to pass the tests. Use pathlib for safe file I/O, regex for markdown
  validation, subprocess for git state queries. Trust the orchestration function to handle
  content generation, file writing, and git operations correctly (per spec and research).

  **REFACTOR phase**: If tests become complex or repetitive, extract common validation
  patterns into helper functions. Ensure test code is readable, maintainable, and well-
  documented. Group related assertions into logical test methods for clarity.

  ### Success Criteria Traceability

  Each acceptance criterion maps directly to one or more test assertions:

  1. **File created** → test file existence via pathlib.Path.exists()
  2. **H1 heading format** → regex ^# to parse and validate heading
  3. **2-3 sentences** → sentence count via regex split on '. ' or '\\n'
  4. **UTF-8 encoding** → binary read, check for UTF-8 BOM (EF BB BF)
  5. **LF line endings** → binary read, search for \\n vs \\r\\n
  6. **400-600 bytes** → file size check via pathlib.Path.stat().st_size
  7. **Git staging** → git status --short output parsing
  8. **Conventional commit** → git log --oneline output parsing
  9. **Push to remote** → git rev-parse refs/remotes/origin/feat/127-... exit code
  10. **No modifications** → git status --porcelain shows no M (modified) lines

  All tests should be self-contained and not depend on external mocking or state
  management. They verify the actual file system and git repository state.

  ### Implementation Notes

  - All file I/O uses pathlib.Path for cross-platform compatibility
  - All git operations use subprocess.run() for simple, reliable execution
  - No GitPython or other git abstractions needed; subprocess is standard in tests
  - Sentence counting uses simple regex split; more sophisticated NLP is unnecessary
  - BOM detection checks for UTF-8 BOM bytes (EF BB BF); other encodings handled by UTF-8 validation
  - Tests are deterministic and repeatable; no timing dependencies or flakiness expected
