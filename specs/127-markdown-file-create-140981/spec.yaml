content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files as minimal units of work. This feature creates a single test markdown file
  (test-xkd1zo.md) in the repository root with a markdown heading and 2-3 sentences of prose
  content, demonstrating automated file creation and conventional git workflow integration.

  This feature continues the well-established markdown-file-creation pattern from features 121-126,
  with 100+ similar test files already existing as reference implementations in the repository root.
  The feature requires straightforward file I/O, LLM-driven content generation, and standard git
  staging/commit/push operations following conventional commit conventions.

  ## Success Criteria

  - [ ] File `test-xkd1zo.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (syntax: `# [Title]`)
  - [ ] File contains exactly 2-3 sentences of prose content following the H1 heading
  - [ ] File is UTF-8 encoded with no byte order mark (BOM)
  - [ ] File uses LF (Unix-style) line endings, not CRLF or CR
  - [ ] File size is between 400-600 bytes (consistent with existing test files)
  - [ ] File is staged to git index using `git add test-xkd1zo.md`
  - [ ] Conventional commit is created with message: `feat(127): create markdown file test-xkd1zo.md with prose content`
  - [ ] Commit is successfully pushed to remote branch `feat/127-markdown-file-create-140981`
  - [ ] All previously existing test files and repository structure remain unmodified
  - [ ] Content is generated using LLM with auto-selected topic (not from a predefined template)
  - [ ] Comprehensive validation passes before file is committed to git

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named `test-xkd1zo.md` in the repository root directory
  - **FR-2**: The markdown file must contain a single H1 heading in proper markdown syntax (`# Title`)
  - **FR-3**: The markdown file must contain 2-3 sentences of prose content following the H1 heading
  - **FR-4**: Use LLM-based content generation (via content_generators.py module or equivalent CrewAI integration) to create the prose content
  - **FR-5**: Generate the content topic automatically via LLM (not from a predefined template or hardcoded list)
  - **FR-6**: Validate that the generated markdown file meets format requirements before committing (H1 present, 2-3 sentences, encoding, line endings, file size)
  - **FR-7**: Stage the file to the git index using `git add test-xkd1zo.md`
  - **FR-8**: Create a conventional commit on the feature branch with the exact message: `feat(127): create markdown file test-xkd1zo.md with prose content`
  - **FR-9**: Push the commit to the remote feature branch `feat/127-markdown-file-create-140981`
  - **FR-10**: Do not create the file if any validation check fails; halt execution and report the specific validation error

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 with no byte order mark (BOM) present
  - **NFR-2**: Line endings must be LF (Unix/Linux style `\n`), not CRLF (`\r\n`) or CR (`\r`)
  - **NFR-3**: File size must be between 400-600 bytes when measured in bytes (UTF-8 encoded)
  - **NFR-4**: Content generation should complete in under 30 seconds
  - **NFR-5**: Total implementation from file creation through push should complete within 10-15 minutes, consistent with features 121-126
  - **NFR-6**: Git operations must follow conventional commit specification (semver style format)
  - **NFR-7**: No existing files, directories, or repository state should be modified or deleted
  - **NFR-8**: Implementation must integrate with existing Sheep infrastructure: content_generators.py for content generation and standard git tools for version control
  - **NFR-9**: Implementation should be idempotent where possible (running multiple times should not corrupt the repository)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  |---|----------|-------------------|-----------|
  | 1 | Should generated markdown be validated for format compliance? | Comprehensive validation | Ensures consistency with 100+ existing test files and catches formatting errors early |
  | 2 | Should prose topic be auto-generated or predefined? | Auto-generated by LLM | Provides content variety and leverages existing LLM infrastructure established in features 121-126 |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-xkd1zo.md) to existing collection of 100+ test files; no modifications to existing files or directory structure beyond single file creation |
  | File System | Low | Single file creation operation (~400-600 bytes of UTF-8 text); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-126; no branch/merge complexity, no destructive operations, uses conventional commit format |
  | src/sheep/content_generators.py | None | Existing module provides reusable content generation; no modifications required—existing functionality supports this feature |
  | Source Code & Architecture | None | Feature is purely file creation; does not depend on or impact application source code, architecture, or design patterns |
  | Specs Directory | Low | Updates only this spec.yaml file (127-markdown-file-create-140981/spec.yaml) during requirements phase; no impact on other specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/127-markdown-file-create-140981` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory required for file creation
  - **Content generation**: Existing `content_generators.py` utilities or equivalent LLM integration for creating markdown content with H1 heading + 2-3 sentences
  - **LLM access**: API keys configured for chosen LLM provider (Claude preferred per codebase analysis) through .env file and config/llm.py
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library**: pathlib module available in Python 3.11+ for file I/O operations
  - **Established pattern**: 100+ existing test files (test-*.md) provide clear precedent for file format, content structure, and encoding/line-ending conventions

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes of implementation work)

  **Justification**:

  - **Content generation**: ~5 minutes — Generate H1 heading and 2-3 sentences using LLM with auto-selected topic via existing content_generators.py
  - **Validation**: ~2 minutes — Verify H1 format, sentence count, UTF-8 encoding, LF line endings, and file size (400-600 bytes)
  - **Git workflow**: ~3-5 minutes — Stage file, create conventional commit, and push to remote feature branch
  - **Total**: 10-15 minutes

  **Supporting factors**:

  - Well-established pattern with 100+ identical test files providing clear precedent and reference implementation
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - Existing content_generators.py module provides proven LLM integration for markdown generation
  - No testing, documentation, configuration changes, or architectural decisions required
  - Features 121-126 demonstrate consistent 10-15 minute implementation time for identical pattern
  - Git operations follow straightforward conventional commit workflow with no merge or conflict complexity
  - No external dependencies or special environment setup required beyond what Sheep already provides

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product questions identified with AI-recommended defaults, and implementation approach documented_
