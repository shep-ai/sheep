content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-zlzcz0.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 125+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 001-125, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-zlzcz0.md` is created at repository root
  - [ ] File contains exactly one H1 heading (single `#` markdown syntax) as title
  - [ ] File contains 2-3 sentences of prose content about any topic
  - [ ] File is UTF-8 encoded with LF (Unix) line endings
  - [ ] File size is within expected range (300-600 bytes)
  - [ ] File is staged in git with `git add test-zlzcz0.md`
  - [ ] Commit created with conventional commit message format: `feat(126): Create markdown file test-zlzcz0.md with prose content`
  - [ ] Commit is pushed to remote origin on feature branch `feat/126-markdown-file-create-be7151`
  - [ ] No existing files are modified or deleted
  - [ ] No changes to source code in `src/sheep/` or elsewhere
  - [ ] Markdown content is CommonMark-compliant and properly formatted

  ## Functional Requirements

  - **FR-1**: Create a new file named `test-zlzcz0.md` at the repository root (same directory level as existing test-*.md files)
  - **FR-2**: File must contain an H1 markdown heading (single `#`) followed by one blank line, serving as the title
  - **FR-3**: File must contain 2-3 sentences of prose content describing any topic (content is flexible, no specific topic required)
  - **FR-4**: File must use UTF-8 character encoding
  - **FR-5**: File must use LF (Unix-style) line endings, not CRLF
  - **FR-6**: Stage the created file using `git add test-zlzcz0.md`
  - **FR-7**: Create a git commit with conventional commit message: `feat(126): Create markdown file test-zlzcz0.md with prose content`
  - **FR-8**: Push the commit to remote origin, establishing upstream tracking on feature branch `feat/126-markdown-file-create-be7151`
  - **FR-9**: Verify file does not overwrite or conflict with existing test-*.md files

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must complete within the S (Small) size estimate of 5-15 minutes of development work
  - **NFR-2**: Created file must follow the established markdown format pattern from 125+ preceding features for consistency
  - **NFR-3**: No performance optimization required; simple file I/O is acceptable for this test artifact
  - **NFR-4**: Implementation must not require modifications to source code, build configuration, or existing project files
  - **NFR-5**: File must be parseable and valid according to CommonMark markdown specification
  - **NFR-6**: Implementation should be straightforward enough to serve as a reproducible unit of work for the automated implementation platform
  - **NFR-7**: Changes must be isolated to feature branch; no impact on main branch or other features

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Implementation approach: hardcoded prose or LLM-generated content? | Direct approach with hardcoded content | Fastest implementation (2-3 minutes), eliminates LLM API dependency, aligns with S size estimate, sufficient for simple test artifact. Abstraction approach can be adopted in future if LLM-generated content becomes standard. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI:

  - **Repository root**: Contains 125+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into modules:
    - `agents/`: Agent definitions (code_agents.py, general_agents.py)
    - `config/`: Configuration management (settings.py, llm.py for LLM factory)
    - `flows/`: Flow definitions for orchestration (code_implementation.py, chat.py)
    - `tools/`: Agent tools (git_tools.py, file_tools.py)
    - `observability/`: Logging and tracing integration
    - `features/`: Feature implementations (feature_101_through_121_markdown_file_creation.py)
    - `content_generators.py`: Core utilities for markdown creation and file operations
  - **specs/**: Feature specification directory (specs/NNN-feature-name/spec.yaml)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with Python 3.11+ requirement
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (125+ precedents):

  The Sheep project has established a clear, repeatable pattern for markdown file creation, documented in src/sheep/content_generators.py:

  - `generate_markdown_content()`: Uses CrewAI LLM framework to generate valid markdown with H1 heading + 2-3 sentences
  - `write_markdown_file(content, filename)`: Writes content to repository root with UTF-8 encoding and LF line endings
  - `validate_markdown_file(filepath)`: Validates file meets all requirements (H1 heading, 2-3 sentences, UTF-8 encoding, LF line endings, proper format)
  - `commit_markdown_file(filepath, content, repo_path)`: Stages and commits file with conventional message format
  - `push_markdown_file(repo_path)`: Pushes to remote origin with upstream tracking

  Alternatively, individual feature implementations (feature_101_markdown_file_creation.py through feature_121_markdown_file_creation.py) can orchestrate these utilities directly.

  **Expected File Format**:
  ```
  # Title/Heading

  2-3 sentences of prose content about any topic.
  ```

  **Git Workflow Pattern**:
  - Feature branch: `feat/126-markdown-file-create-be7151` (pre-created)
  - Create/modify file (test-zlzcz0.md)
  - Stage with `git add`
  - Commit with conventional format: `feat(126): Create markdown file test-zlzcz0.md with prose content`
  - Push to feature branch origin

  **Feature Implementation Approach** (observed in features 101-125):

  Two implementation patterns exist:

  1. **Direct approach**: Create a simple Python script that:
     - Generates prose content directly (hardcoded or via LLM)
     - Uses pathlib.Path to write the file
     - Stages and commits using GitPython or subprocess
     - Pushes to remote

  2. **Abstraction approach**: Leverage the existing `content_generators.py` module which provides:
     - `generate_markdown_content()` for LLM-based prose generation
     - Pre-built validation and git integration utilities
     - Consistent logging via `sheep.observability.logging`

  Recent features (121-125) use the abstraction approach imported from content_generators.py.

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11+ (from pyproject.toml)
  - **pathlib**: Python standard library module for file I/O (used in content_generators.py)
  - **CrewAI**: Agentic framework for orchestrating AI agents (v0.86.0+, supports Anthropic/OpenAI/Google)
  - **Claude LLM**: Used via CrewAI for markdown content generation (ANTHROPIC_API_KEY in .env)
  - **GitPython (3.1.0+)**: Git integration library for staging, committing, pushing
  - **Langfuse (2.0.0+)**: Optional observability platform for tracing
  - **Markdown syntax**: CommonMark-compliant format with H1 heading and prose

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zlzcz0.md) to existing collection of 125+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-125; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file; no impact on other specs or configurations |
  | Tests | None | No test modifications required; feature creates a test artifact, not a test definition |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create-be7151` must exist (pre-created)
  - **File system**: Write access to repository root directory
  - **Established pattern**: 125+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be configured for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **Optional: LLM API**: If using `generate_markdown_content()` from content_generators.py, requires ANTHROPIC_API_KEY or OpenAI/Google equivalents configured in .env
  - **Optional: CrewAI/Langfuse**: If using abstraction approach with content_generators.py utilities, dependencies are already in pyproject.toml

  ## Size Estimate

  **S** (Small — approximately 5-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: 2-5 minutes (write one markdown heading + 2-3 sentences of prose; hardcoded string approach recommended)
  - **Validation**: 1-2 minutes (verify markdown syntax, proper format, file creation)
  - **Git workflow**: 2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 5-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 125+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (121-125) demonstrate efficient implementation of identical features in 5-15 minutes
  - Two implementation approaches available (direct or abstraction via content_generators.py)
  - Core utilities already exist and are production-tested across 125 prior features

  ---

  _Requirements phase complete — ready for implementation_
