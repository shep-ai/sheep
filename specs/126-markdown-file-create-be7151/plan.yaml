# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 126 follows the direct implementation approach recommended in the spec: a simple,
  minimal Python script that creates a markdown file with hardcoded prose content, validates
  format compliance, and performs git operations (stage, commit, push).

  **Why Direct Approach?**
  - **Simplicity**: Eliminates LLM API dependency and reduces implementation complexity
  - **Speed**: Aligns with S (Small) size estimate of 5-15 minutes
  - **Clarity**: Hardcoded prose is sufficient for a simple test artifact
  - **Pattern consistency**: Matches the approach documented in spec section on \"Feature Implementation Approach\"

  **File Format**:
  ```markdown
  # Title About Topic

  First sentence providing context and information. Second sentence extending the thought.
  Third sentence completing the idea about the chosen topic.
  ```

  **Implementation Flow**:
  1. Create markdown content string with H1 heading + 2-3 sentences prose
  2. Write to test-zlzcz0.md in repository root using pathlib.Path
  3. Validate file exists and has expected format (UTF-8, LF, CommonMark compliant)
  4. Stage file with `git add test-zlzcz0.md`
  5. Create commit with conventional message: `feat(126): Create markdown file test-zlzcz0.md with prose content`
  6. Push to remote origin with upstream tracking on feature branch

  ## Key Design Decisions

  ### 1. Content Generation Strategy: Direct Hardcoded Approach

  **Chosen**: Hardcoded prose content string in the implementation script

  **Rationale**:
  - The spec identifies this as the recommended approach for this minimal test artifact
  - Eliminates external dependencies (no LLM API calls, no ANTHROPIC_API_KEY required)
  - Reduces implementation time (2-3 minutes vs potential LLM latency)
  - Aligns with S size estimate and priority of simplicity over sophistication
  - Prose content is flexible with no specific topic requirement; hardcoded content meets all requirements

  **Alternatives Considered**:
  - LLM-based generation via content_generators.py abstraction (would add 5+ second latency)
  - Dynamic content selection from a pool (unnecessary complexity)

  ### 2. File I/O: pathlib.Path with Explicit Encoding

  **Chosen**: Use `pathlib.Path.write_text()` with `encoding='utf-8'` and Unix text mode

  **Rationale**:
  - `pathlib` is Python's modern standard library for file operations (cross-platform)
  - Text mode (`'w'`) automatically uses LF line endings on Unix systems per Python convention
  - UTF-8 encoding without BOM (not 'utf-8-sig') is the CommonMark standard
  - Error handling is built-in via exceptions
  - Code is readable and maintainable

  **Implementation Pattern**:
  ```python
  from pathlib import Path

  content = \"# My Title\\n\\nSentence one. Sentence two. Sentence three.\\n\"
  Path(\"test-zlzcz0.md\").write_text(content, encoding=\"utf-8\")
  ```

  ### 3. Git Integration: subprocess with Conventional Commit Format

  **Chosen**: Use subprocess module for `git add`, `git commit`, and `git push` operations

  **Rationale**:
  - subprocess.run() with list arguments is secure (no shell injection risk)
  - Provides fine-grained control over git operations
  - No additional dependencies (GitPython not required for simple operations)
  - Error handling via return codes and exception raising
  - Aligns with the established pattern in feature implementations

  **Conventional Commit Message**:
  - Scope: `feat` (indicates new feature/artifact creation)
  - Message: `feat(126): Create markdown file test-zlzcz0.md with prose content`
  - Follows https://www.conventionalcommits.org/ standard

  **Git Operations**:
  1. Stage: `git add test-zlzcz0.md`
  2. Commit: `git commit -m \"feat(126): Create markdown file test-zlzcz0.md with prose content\"`
  3. Push with upstream tracking: `git push -u origin feat/126-markdown-file-create-be7151`

  ### 4. Validation Strategy: Format Compliance Checks

  **Chosen**: Implement inline validation checks after file creation

  **Rationale**:
  - Verify file exists and is readable
  - Check file encoding is UTF-8 (can be decoded without errors)
  - Validate markdown structure (H1 heading present, blank line after heading)
  - Verify prose content format (2-3 sentences separated by periods)
  - Confirm file size is within expected range (300-600 bytes)

  **Validation Approach**:
  - Read file back and decode as UTF-8 (catches encoding issues)
  - Parse first line for `# ` H1 heading marker
  - Extract prose content after blank line
  - Count sentence-ending periods
  - Check for CRLF line endings and reject them

  ## Implementation Strategy

  **Phase 1: File Creation & Validation** (2-3 minutes)
  - Define markdown content string with H1 heading and 2-3 sentences
  - Use pathlib.Path to write content to test-zlzcz0.md in repository root
  - Validate file format compliance (encoding, line endings, structure, sentence count)
  - Success indicator: file exists with correct content and passes all validation checks

  **Phase 2: Git Integration & Completion** (2-5 minutes)
  - Stage file with `git add test-zlzcz0.md`
  - Commit using subprocess with conventional message format
  - Push to remote with upstream tracking (`git push -u origin HEAD`)
  - Verify commit was created and pushed successfully
  - Success indicator: commit visible in git log, pushed to remote origin

  **Total Execution Time**: 5-15 minutes (accommodates git network latency and CI/CD operations)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File path traversal attacks** | Hardcode filename as `test-zlzcz0.md`; do not accept user input for filenames. Use pathlib.Path which abstracts platform-specific path handling. |
  | **Encoding issues (CRLF vs LF)** | Python text mode (`'w'`) automatically uses LF on Unix. Validate after creation by reading file as UTF-8 and checking for CRLF markers. Reject files with CRLF. |
  | **Git authentication failures** | Feature branch already exists and is checked out. Standard git configuration (user.name, user.email) is assumed to be present. If push fails, it will be caught and reported in error message. |
  | **Concurrent file modifications** | File does not exist prior to creation. No risk of race conditions if feature runs in isolation. |
  | **File system permissions** | File created with default umask (typically rw-r--r-- on Unix). Markdown test files are intentionally public and readable. No sensitive content. |
  | **Markdown validation too strict** | Validation checks CommonMark compliance (H1 heading, prose structure). Flexible on topic and exact sentence content. Validation prevents invalid markdown from being committed. |
  | **Git push network latency** | Accounted for in S (Small) estimate of 5-15 minutes. Network operations are unavoidable; estimate provides buffer. |
  | **LLM API dependency (if reconsidered)** | Direct approach eliminates this risk entirely. No LLM calls, no API keys, no token limits, no rate limiting. |

  ## No Code Changes Required

  Per spec requirements (NFR-4 and success criteria):
  - No modifications to source code in `src/sheep/`
  - No changes to build configuration or project files
  - No updates to tests or documentation
  - No modifications to existing test-*.md files
  - Changes are isolated to feature branch and do not affect main branch

  The implementation is purely **additive**: create one new markdown file, commit, and push.
