content: |
  ## Technology Decisions

  ### 1. Content Generation Strategy

  **Chosen:** Abstraction approach using content_generators.py with LLM-based generation

  **Rejected:**
  - Direct approach with hardcoded content — simpler, faster (2-3 minutes), but inconsistent with features 101-125 which all use the abstraction
  - Alternative LLM providers — CrewAI+Anthropic is already configured; switching adds unnecessary complexity

  **Rationale:**
  The Sheep codebase has established a clear pattern across 125+ features: the abstraction approach
  using content_generators.py. This module provides production-tested utilities that:
  - Generate markdown content via CrewAI LLM framework
  - Validate format compliance (H1 heading, sentence count, encoding, line endings)
  - Handle file I/O with proper UTF-8 encoding and Unix line endings
  - Perform git staging, committing, and pushing with conventional commit messages

  Feature 121 (direct precedent) successfully uses this exact approach. While the spec recommended
  the direct approach for speed, the codebase architecture strongly justifies the abstraction.
  It centralizes validation logic, ensures consistency, and reduces maintenance burden across
  126+ similar features.

  ### 2. File I/O and Encoding

  **Chosen:** pathlib.Path with UTF-8 encoding and Unix LF line endings

  **Rejected:**
  - Raw open() API — lacks cross-platform abstraction
  - Manual line ending conversion — Python's text mode handles this automatically on Unix

  **Rationale:**
  The write_markdown_file() function in content_generators.py (line 128) uses:
  ```python
  with open(file_path, "w", encoding="utf-8") as f:
      f.write(content)
  ```
  This standard Python pattern automatically ensures:
  - UTF-8 encoding without BOM (encoding='utf-8', not 'utf-8-sig')
  - LF line endings on Unix systems (Python's universal newlines convention)
  - Cross-platform Path handling via pathlib

  The function then validates (lines 131-142) that the file was created with content.

  ### 3. Git Integration

  **Chosen:** Use GitCommitTool and GitPushTool via content_generators.py wrappers

  **Rejected:**
  - Direct subprocess calls — GitCommitTool already wraps subprocess
  - GitPython direct use (pygit2.Repository) — inconsistent with established pattern

  **Rationale:**
  The git_tools.py module provides GitCommitTool and GitPushTool that wrap subprocess calls
  with proper error handling and logging. The content_generators.py module uses these tools:
  - commit_markdown_file() calls GitCommitTool._run() with add_all=True (lines 320-321)
  - push_markdown_file() calls GitPushTool._run() with set_upstream=True (line 353)

  This approach maintains consistency with features 101-125 and centralizes git logic.

  ### 4. Validation Strategy

  **Chosen:** Comprehensive validation via validate_markdown_file() from content_generators.py

  **Rejected:**
  - External markdown libraries (mistletoe, markdown-it-py) — overkill; in-house validation is sufficient
  - Minimal validation — spec requires strict format compliance

  **Rationale:**
  The validate_markdown_file() function (content_generators.py, lines 150-244) implements
  all required checks per specification:
  - UTF-8 validation (lines 192-194) with BOM detection (lines 187-188)
  - LF line ending validation (lines 197-198) — rejects CRLF
  - H1 heading verification (lines 200-202, 206-208)
  - Sentence count validation (lines 227-231) — counts periods, requires 2-3
  - Prose content validation (lines 214-224) — extracts prose after heading and blank line
  - Trailing newline verification (line 234-235)

  These checks align perfectly with spec requirements and have been validated across 125+ features.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | Cross-platform file path handling | **Use** | Standard library, no dependencies, provides Path abstraction for write_text() and exists() operations |
  | CrewAI (0.86.0+) | LLM framework and agent orchestration | **Use** | Already in pyproject.toml; provides get_reasoning_llm() for markdown generation |
  | Anthropic SDK (via CrewAI) | Claude LLM API access | **Use** | Configured in CrewAI; used for generate_markdown_content() via llm.call() |
  | GitPython (3.1.0+) | Git integration | **Use (via wrapper)** | Used indirectly via git_tools.py subprocess wrapper; provides compatibility |
  | markdown-it-py | Markdown parsing | **Reject** | Unnecessary; validate_markdown_file() provides all required validation without external parsing |
  | mistletoe | Markdown AST parsing | **Reject** | Unnecessary; sentence counting and format validation don't require AST |
  | python-json-logger | JSON logging | **Reject** | sheep.observability.logging handles structured logging; external library adds unnecessary dependency |
  | loguru | Alternative logging | **Reject** | Inconsistent with established sheep.observability.logging pattern |
  | structlog (in pyproject) | Structured logging integration | **Use** | Already in dependencies; used by sheep.observability.logging for tracing |

  ## Security Considerations

  ### 1. Path Traversal Prevention
  **Status:** ✅ **Secured**

  The write_markdown_file() function (content_generators.py, lines 116-118) validates filenames:
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```
  This prevents:
  - Directory traversal attacks: `../../../etc/passwd`
  - Hidden file creation: `.hidden`
  - Absolute paths: `/tmp/file.md`

  **Risk Mitigation:** Validation occurs before file creation. The feature spec specifies
  filename `test-zlzcz0.md`, which passes validation.

  ### 2. Command Injection Prevention
  **Status:** ✅ **Secured**

  The git_tools.py _run_git() function (line 21-29) uses subprocess with list args, not shell:
  ```python
  subprocess.run(cmd, cwd=cwd, capture_output=True, text=True, check=check)
  ```
  This prevents shell injection attacks because the command is passed as a list, not a shell string.

  **Risk Mitigation:** No unsanitized user input is passed to git commands in this feature.

  ### 3. Encoding Validation
  **Status:** ✅ **Secured**

  The validate_markdown_file() function (line 192-194) validates UTF-8 decoding:
  ```python
  try:
      text_content = binary_content.decode("utf-8")
  except UnicodeDecodeError as e:
      raise ValueError(f"File is not valid UTF-8: {e}")
  ```

  **Risk Mitigation:** Prevents malformed UTF-8 sequences or encoding attacks.

  ### 4. BOM Detection
  **Status:** ✅ **Secured**

  The validate_markdown_file() function (lines 187-188) detects UTF-8 BOM:
  ```python
  if binary_content.startswith(b"\xef\xbb\xbf"):
      raise ValueError("File has UTF-8 BOM (should not be present)")
  ```

  **Risk Mitigation:** Prevents parsing issues caused by UTF-8 BOM in certain editors/tools.

  ### 5. File Permissions
  **Status:** ⚠️ **Default Inherited from Umask**

  The write_markdown_file() function creates files with Python's default permissions
  (inherited from process umask). On typical Unix systems, this results in:
  - Owner: read + write (rw-)
  - Group: read (r--)
  - Others: read (r--)

  **Risk Mitigation:** The spec does not require specific permissions, and markdown test files
  are intentionally public/readable for the repository. If sensitive content were stored,
  explicit chmod would be needed.

  ### 6. No Code Execution
  **Status:** ✅ **Secured**

  The feature:
  - Creates markdown files (text format, not executable)
  - Does not use eval(), exec(), or dynamic code execution
  - Does not deserialize untrusted data (JSON, pickle)

  **Risk Mitigation:** No code injection vectors.

  ## Performance Implications

  ### 1. LLM API Latency
  **Impact:** ~2-5 seconds per feature

  The generate_markdown_content() function (content_generators.py, lines 27-68) calls
  the Claude LLM via CrewAI:
  ```python
  response = llm.call([{"role": "user", "content": MARKDOWN_GENERATION_PROMPT}])
  ```

  This is the primary performance bottleneck. API round-trip time dominates the operation.

  **Optimization:** None required. The feature spec estimates S (Small) — 5-15 minutes,
  which accommodates typical LLM latency (1-5 seconds).

  ### 2. File I/O Performance
  **Impact:** <100ms

  File creation via pathlib.Path.write_text() is negligible (~10-50ms on modern systems).
  File size is small: spec requires 300-600 bytes.

  **Optimization:** None needed; operation is I/O-bound rather than CPU-bound.

  ### 3. Git Operations Performance
  **Impact:** ~2-5 seconds total (staging + commit + push)

  Git operations:
  - `git add test-zlzcz0.md`: ~500ms (filesystem operations)
  - `git commit`: ~500ms (object database writes)
  - `git push -u origin HEAD`: ~2-3 seconds (network round-trip to origin)

  **Optimization:** None required. Network latency (git push) is unavoidable.

  ### 4. Validation Performance
  **Impact:** <50ms

  The validate_markdown_file() function:
  - Reads file into memory (300-600 bytes)
  - Decodes UTF-8 (regex/string operations)
  - Counts periods (one pass)

  **Optimization:** None needed.

  ### Total Feature Execution Time
  **Estimate:** 5-15 minutes (matching spec estimate)

  - LLM generation: 2-5 seconds
  - File I/O: <100ms
  - Validation: <50ms
  - Git staging/commit: ~1 second
  - Git push (network): 2-3 seconds
  - **Total compute time:** ~6-10 seconds
  - **Total elapsed time:** 5-15 minutes (dominated by human actions, CI/CD if triggered)

  **Note:** The spec estimate of 5-15 minutes includes time for feature setup, review, and CI/CD
  execution. Actual feature code execution is <10 seconds.

  ## Architecture Notes

  ### 1. Design Pattern: Abstraction via Utility Module

  The Sheep codebase uses a utility abstraction pattern for markdown file creation:

  ```
  Feature Implementation (feature_126_markdown_file_creation.py)
      ↓ imports from
  content_generators.py
      ├── generate_markdown_content() → CrewAI LLM
      ├── write_markdown_file() → pathlib File I/O
      ├── validate_markdown_file() → format validation
      ├── commit_markdown_file() → GitCommitTool wrapper
      └── push_markdown_file() → GitPushTool wrapper
  ```

  This pattern is repeated across features 101-125, providing consistency and reducing
  code duplication.

  ### 2. Logging and Observability Integration

  All functions use structured logging via sheep.observability.logging:
  ```python
  _logger = get_logger(__name__)
  _logger.info(f"Creating markdown file: {filename}")
  ```

  This integrates with Langfuse (optional) for production observability and tracing.

  ### 3. Error Handling Strategy

  Functions raise specific exceptions with descriptive messages:
  - ValueError: Invalid input (filename, content format)
  - IOError: File system errors
  - Exception: Git operation failures

  Callers (feature implementation) can catch and handle these appropriately.

  ### 4. Testing Approach

  The 125+ existing test-*.md files in the repository root serve as artifacts of successful
  feature executions. Each file:
  - Demonstrates the implementation works end-to-end
  - Validates file format compliance
  - Serves as regression test (files remain in repo after feature completes)

  Feature implementations can verify success by:
  - Checking file exists and has content
  - Running validate_markdown_file()
  - Verifying git commit and push succeeded

  ### 5. Configuration and Secrets Management

  The implementation depends on:
  - **ANTHROPIC_API_KEY**: Required for LLM generation (loaded from .env via python-dotenv)
  - **Git configuration**: user.name and user.email (system git config)
  - **Repository state**: Must have origin remote configured (pre-existing)

  No changes to configuration are required for this feature.

  ## Conclusion

  Feature 126 follows the established abstraction pattern across 125+ preceding features,
  using content_generators.py for LLM-based markdown generation, file I/O with proper UTF-8/LF
  encoding, comprehensive format validation, and git integration. The approach is production-tested,
  secure, and performant. No additional libraries or architectural changes are required.

