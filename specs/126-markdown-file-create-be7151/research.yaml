decisions:
  - title: "Content Generation Strategy"
    chosen: "Abstraction approach using content_generators.py with LLM-based generation"
    rejected:
      - "Direct approach with hardcoded content — simpler and faster (2-3 minutes) but inconsistent with patterns established in features 101-125 (abstraction approach), would require reimplementation of validation and git logic, and does not leverage existing tested utilities"
      - "Alternative LLM provider (OpenAI/Google) — CrewAI integration with Anthropic is already configured in pyproject.toml and .env; switching providers adds unnecessary complexity and requires additional configuration"
    rationale: >
      The abstraction approach via content_generators.py is the established pattern across
      125+ preceding features (101-125). The module provides production-tested utilities for
      markdown generation, validation, file I/O, and git operations. Feature 121 (direct
      precedent) uses this exact approach and successfully creates properly formatted files.
      While the spec recommended the direct approach for speed, the codebase architecture
      and consistency across 125 features justify using the tested abstraction. LLM generation
      provides quality assurance (prose coherence, topic relevance) and reduces maintenance
      burden by centralizing validation logic.

  - title: "File I/O and Encoding Strategy"
    chosen: "Use pathlib.Path with explicit UTF-8 encoding and Unix LF line endings"
    rejected:
      - "File system APIs (open with 'w' mode) — pathlib provides cross-platform compatibility and cleaner error handling; raw open() lacks abstraction"
      - "Manual line ending conversion — Python's text mode on Unix systems automatically handles LF correctly; pathlib.Path.write_text() in 'w' mode ensures proper encoding without manual intervention"
    rationale: >
      pathlib.Path.write_text() with explicit encoding='utf-8' (used in write_markdown_file())
      is the standard pattern in modern Python. Text mode ('w') automatically uses LF on Unix
      systems per Python's universal newlines convention. The write_markdown_file() function
      in content_generators.py already implements this pattern with validation (checks file
      was created, has size > 0). No BOM is added when encoding='utf-8' (versus 'utf-8-sig').
      Cross-platform consistency is maintained via Path abstraction.

  - title: "Git Integration and Workflow"
    chosen: "Use GitCommitTool and GitPushTool from sheep.tools via content_generators.py wrapper functions"
    rejected:
      - "Direct subprocess calls with git CLI — GitCommitTool and GitPushTool already wrap subprocess for consistency; duplicating wrapper logic adds maintenance burden"
      - "GitPython library (pygit2.Repository) — GitCommitTool uses subprocess wrapper instead; adding GitPython direct use introduces dependency version conflicts and inconsistency with established pattern"
      - "Manual git state verification before commit/push — commit_markdown_file() and push_markdown_file() handle error cases; trust existing tools"
    rationale: >
      The established pattern (features 101-125) uses GitCommitTool and GitPushTool via the
      content_generators.py wrapper functions. These tools encapsulate subprocess calls with
      logging, error handling, and conventional commit message formatting. The git_tools.py
      module provides _run_git() helper for consistent subprocess invocation with capture_output
      and text mode. commit_markdown_file() handles staging (git add) and committing with
      conventional message format; push_markdown_file() handles upstream tracking (set_upstream=True).
      This approach reduces code duplication and maintains consistency across 125+ features.

  - title: "Validation and Format Verification"
    chosen: "Use validate_markdown_file() from content_generators.py for comprehensive format validation"
    rejected:
      - "External markdown validation library (markdown-it-py, mistletoe) — validate_markdown_file() provides all required checks (H1 heading, 2-3 sentences, UTF-8, LF, trailing newline); adding external library increases dependencies without benefit"
      - "Minimal validation (just check file exists) — the spec requires strict format compliance; validate_markdown_file() checks H1 syntax, sentence count (2-3 periods), encoding (no BOM), line endings (LF not CRLF), and file size; these checks catch format violations early"
    rationale: >
      validate_markdown_file() in content_generators.py (lines 150-244) implements all
      required validations: UTF-8 decoding with error handling, BOM detection, CRLF rejection,
      H1 heading verification, sentence count (periods count), trailing newline check, and
      prose content validation. These checks align exactly with spec requirements (FR-2 through
      FR-5, NFR-5). The function is tested across 125+ features. Adding external markdown
      parsing libraries (mistletoe, markdown-it) would overcomplicate validation for minimal
      additional benefit; sentence detection via period counting is sufficient for prose validation.

  - title: "Logging and Observability"
    chosen: "Use structured logging via sheep.observability.logging.get_logger(__name__)"
    rejected:
      - "Print statements for debugging — structured logging with log levels (info, debug, error) integrates with Langfuse observability and provides production-grade tracing; print() statements are not captured in observability"
      - "Alternative logging library (loguru, python-json-logger) — sheep.observability.logging is the established pattern across the codebase; switching providers breaks observability integration"
    rationale: >
      The codebase uses structured logging via sheep.observability.logging for integration with
      Langfuse (optional) observability and production tracing. The content_generators.py module
      uses get_logger(__name__) with debug, info, and error levels throughout. This pattern is
      consistent across all source modules. The feature implementation should follow the same
      logging pattern for observability and debugging.

