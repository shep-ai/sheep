content: |
  ## Architecture Overview

  This feature follows the identical architectural pattern established by 258+ preceding
  test markdown files (features 151-258) in the Sheep project. The implementation is
  purely additive—creates a single new file in the repository root with no modifications
  to existing code or configuration.

  **Key Characteristics:**
  - **Location:** Repository root (same as all 258+ test-*.md files)
  - **Format:** H1 markdown heading + blank line + 2-3 sentences of prose (established standard)
  - **Scope:** Single file creation, no code changes, no dependencies
  - **Pattern:** Identical to features 257, 258 (immediately preceding features)
  - **Risk:** Minimal — precedent is extensive and proven

  **Fits Seamlessly Into Existing Codebase:**
  - Repository structure accommodates markdown test files at root level
  - No impact on production code in `src/sheep/`
  - No changes to build, test, or CI/CD systems
  - Follows established git workflow (conventional commits on feature branch)
  - No new dependencies required (uses Python standard library only)

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and `newline="\\n"`

  **Why:** Modern Python standard for text file creation. Critically, it supports the
  `newline="\\n"` parameter, which enforces Unix line endings (LF) on all platforms
  (Windows, macOS, Linux). Without this parameter, Python uses platform defaults
  (CRLF on Windows), violating the FR-6 requirement for LF line endings. This approach:
  - Matches all 258+ precedent implementations
  - Guarantees cross-platform consistency
  - Requires no external dependencies
  - Automatically handles UTF-8 encoding without BOM

  **Alternative Rejected:** Built-in `open()` — more verbose, requires manual context
  managers, same end result; pathlib is the modern idiomatic choice.

  ### 2. Prose Content: Hardcoded Coherent Sentences

  **Chosen:** Hardcode 2-3 grammatically correct sentences on an arbitrary topic

  **Why:** The feature spec explicitly states prose topic is "free-form" and "arbitrary"
  (NFR-7). Hardcoding is the right choice because:
  - **Deterministic:** Identical output on every run (easier to test, debug, version control)
  - **No dependencies:** No template engines, APIs, or randomization libraries
  - **Matches precedent:** All 258+ existing test files use hardcoded prose
  - **Guaranteed correctness:** Human-written prose meets NFR-2 (grammatically correct)
  - **Simplest approach:** No research or generation complexity needed

  **Alternative Rejected:** Random generation or external content APIs — unnecessary
  complexity, non-deterministic output, no benefit since any coherent prose is acceptable.

  ### 3. Git Integration: subprocess.run() with shell=False

  **Chosen:** `subprocess.run()` with list-based arguments (shell=False) for git operations

  **Why:** The safe, standard Python approach for executing external commands:
  - **Secure:** shell=False (default) prevents shell injection vulnerability
  - **Standard library:** No external dependencies (GitPython library is overkill)
  - **Lightweight:** Minimal overhead for simple commands
  - **Matches precedent:** Implementation pattern from features 151-258
  - **Error handling:** `check=True` raises CalledProcessError on failure

  **Alternatives Rejected:**
  - `os.system()` — unsafe (shell injection risk), deprecated
  - GitPython library — adds external dependency with unnecessary overhead

  ### 4. Encoding and Line Endings: UTF-8 with Explicit LF

  **Chosen:** UTF-8 encoding with `newline="\\n"` parameter to enforce LF line endings

  **Why:** Meets FR-5 (UTF-8 without BOM) and FR-6 (LF line endings):
  - pathlib.write_text() uses UTF-8 by default without writing BOM
  - `newline="\\n"` parameter normalizes all line endings to \\n (Unix style) regardless
    of OS platform
  - Cross-platform consistent: Windows, macOS, and Linux all produce identical output
  - Matches file format requirements exactly

  **Critical Detail:** Without the `newline` parameter, Python uses platform defaults
  (CRLF on Windows, LF on Unix), risking inconsistency. The explicit parameter ensures
  requirements are met on all platforms.

  ### 5. Error Handling: Minimal Validation with Early Failure

  **Chosen:** Verify file exists after write, use subprocess `check=True` for git commands,
  let exceptions propagate for visibility

  **Why:** Appropriate for trusted environment where prerequisites are satisfied:
  - Write access to repository root is guaranteed (258+ prior features succeeded)
  - Git config (user.name, user.email) is pre-configured (prior commits succeeded)
  - Feature branch is pre-created and available
  - Minimal validation matches established pattern from features 151-258
  - Explicit failures (exceptions) are better than silent failures

  **Alternative Rejected:** Comprehensive pre-flight validation (disk space, permissions,
  git config) — unnecessary complexity in trusted development environment; prior
  precedent confirms these assumptions hold.

  ## Implementation Strategy

  ### Phase 1: File Creation & Validation (20 minutes)

  Create test-166w1g.md in repository root with proper markdown format, UTF-8 encoding,
  and LF line endings. Verify all content requirements are met before proceeding to git
  integration.

  **Key Steps:**
  1. Compose H1 heading and 2-3 sentences of coherent prose
  2. Build content string with correct formatting: `# {Title}\\n\\n{Prose}\\n`
  3. Write file using pathlib.Path.write_text() with UTF-8 and newline="\\n"
  4. Verify file exists, has correct encoding, uses LF line endings
  5. Validate file size is in 300-600 byte range
  6. Confirm content meets all formatting requirements

  **Why First:** File creation must complete before git operations. Validation before
  staging ensures requirements are met and prevents committing malformed content.

  ### Phase 2: Git Integration (15 minutes)

  Stage file, create conventional commit, and push to feature branch following established
  pattern from 258+ precedent implementations.

  **Key Steps:**
  1. Stage file with `git add test-166w1g.md`
  2. Create commit with message: `feat(259): Create markdown file test-166w1g.md with prose content`
  3. Verify commit exists in git log
  4. Push to feature branch: `git push -u origin HEAD`
  5. Verify remote branch is updated with new commit

  **Why After Phase 1:** Git operations depend on file existing and meeting all
  requirements. Conventional commit format follows established pattern.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding/line endings incorrect | Medium | Explicit `newline="\\n"` parameter in write_text() enforces requirements on all platforms |
  | File size out of 300-600 byte range | Medium | Validate byte size after write; verify requirements are met |
  | Git commands fail (missing config, no push access) | Medium | Feature branch pre-created; prior 258+ features succeeded with same approach; subprocess `check=True` provides error visibility |
  | File already exists and gets overwritten | Low | Feature branch is isolated; no pre-existing test-166w1g.md on this branch |
  | Commit message format incorrect | Low | Hardcode message: `feat(259): Create markdown file test-166w1g.md with prose content`; matches spec exactly |
  | Prose content is grammatically incorrect | Low | Use human-written sentences; verify before commit |

  ## Summary

  This is a straightforward file creation feature with well-established precedent (258+
  identical test files). All architectural decisions are predetermined by the established
  pattern. Implementation involves:

  1. **Create test-166w1g.md** in repository root with H1 heading and 2-3 sentences using
     pathlib.Path.write_text() with explicit UTF-8 and LF line endings
  2. **Validate** file meets all content, encoding, and size requirements
  3. **Stage and commit** using subprocess.run() with conventional commit message
  4. **Push** to feature branch

  Total estimated effort: 35 minutes (includes TDD cycles over raw work time)

  No source code modifications, no dependencies, no architectural changes needed. Purely
  additive file creation following established pattern.
