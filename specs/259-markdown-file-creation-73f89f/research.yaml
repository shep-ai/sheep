content: |
  ## Research Summary

  **Phase:** Research
  **Updated:** 2026-03-28
  **Status:** Complete — all technical decisions documented; ready for implementation

  This feature is heavily predetermined by 258+ precedent test files. All major technical decisions have been made by the established pattern. Research focuses on documenting the chosen approaches and rationale for engineering decisions.

  ---

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and `newline="\\n"` parameter

  **Rejected:**
  - Built-in `open()` function — requires manual context managers and file handle cleanup; more verbose for simple operations
  - External file I/O libraries — unnecessary dependencies for straightforward text file creation

  **Rationale:**

  pathlib.Path.write_text() is the modern, idiomatic Python approach for simple text file creation. This method:
  - Provides a clean, readable API that clearly expresses intent (create text file)
  - Supports the critical `newline="\\n"` parameter to enforce Unix line endings on all platforms
  - Uses UTF-8 by default (required by spec), without writing BOM (Byte Order Mark)
  - Matches implementation patterns from all 258+ precedent test files
  - Requires no external dependencies (standard library)
  - Automatically handles file descriptor management and cleanup

  **Critical Detail — Line Ending Control:**

  The `newline` parameter is essential for cross-platform consistency. Without it, Python uses platform-default line endings:
  - **Windows:** CRLF (`\\r\\n`) — violates FR-6 requirement
  - **Unix/Linux:** LF (`\\n`) — meets requirement
  - **macOS:** LF (`\\n`) — meets requirement

  By explicitly setting `newline="\\n"`, Python always outputs LF regardless of OS, ensuring the file meets FR-6 across all development environments.

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  title = "Sample Title"
  prose = "First sentence. Second sentence. Third sentence."
  content = f"# {title}\\n\\n{prose}\\n"

  Path("test-166w1g.md").write_text(content, encoding="utf-8", newline="\\n")
  ```

  ### 2. Prose Content Generation

  **Chosen:** Hardcode specific, coherent prose content (2-3 grammatically correct sentences on arbitrary topic)

  **Rejected:**
  - Random selection from a template bank — unnecessary complexity, non-deterministic output, harder to verify
  - Content generation from external API or service — adds network dependency, latency, failure points
  - Placeholder/dummy content — violates NFR-2 requirement for grammatically correct prose

  **Rationale:**

  All 258+ existing test markdown files use hardcoded prose content that is both grammatically correct and topically coherent. The feature spec explicitly states (NFR-7) that prose topic is \"arbitrary and unconstrained\" — meaning any coherent 2-3 sentence paragraph is valid.

  Hardcoding is the right choice because:
  - **Deterministic:** Produces identical output on every run (easier to test, debug, version control)
  - **No external dependencies:** No template engines, content APIs, or randomization libraries needed
  - **Matches established pattern:** All 258+ precedent implementations use hardcoding
  - **Requires no research:** User query says \"about anything\" — any coherent topic works
  - **Guaranteed correctness:** Human-written prose, not generated, meets NFR-2 automatically

  **Topic Selection:**

  Any coherent topic is acceptable per NFR-7. Examples from precedent files:
  - \"The Resilience of Innovation\" (test-t5rps2.md)
  - Technology, science, philosophy, history, nature, personal development — all valid
  - Only constraint: prose must be grammatically correct and make logical sense

  ### 3. Git Integration Method

  **Chosen:** `subprocess.run()` with list-based arguments (`shell=False`) for git add, git commit, git push

  **Rejected:**
  - GitPython library — adds external dependency, overkill for three trivial git commands, significant overhead
  - `os.system()` or shell=True — unsafe (shell injection vulnerability), deprecated, security anti-pattern

  **Rationale:**

  subprocess.run() with shell=False (the safe default) is the standard Python approach for executing external commands. This choice:
  - **Avoids shell injection vulnerabilities:** Commands passed as lists, not shell strings; no string interpolation attacks possible
  - **Requires no external dependencies:** subprocess is standard library
  - **Is lightweight:** Minimal overhead for simple command execution
  - **Matches precedent:** Implementation pattern from features 151-258 use subprocess
  - **Provides error feedback:** Return code checking and exceptions on failure

  **Safe Pattern Example:**
  ```python
  import subprocess

  # Safe: list-based arguments, no string interpolation
  subprocess.run(["git", "add", "test-166w1g.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(259): Create markdown file test-166w1g.md with prose content"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  Using `check=True` raises CalledProcessError if any command fails, providing immediate feedback and halting execution on errors.

  **Why Not os.system()?**
  ```python
  # UNSAFE: vulnerable to shell injection, deprecated
  os.system(f"git add {filename}")  # If filename contains shell metacharacters, injection possible
  ```

  ### 4. Encoding and Line Ending Enforcement

  **Chosen:** UTF-8 encoding with explicit `newline="\\n"` parameter to enforce LF line endings

  **Rejected:**
  - Platform-default line endings — risks CRLF on Windows, violates FR-6 requirement
  - Post-processing with sed/dos2unix — adds extra operations, introduces platform-dependent tool dependencies

  **Rationale:**

  The feature spec requires:
  - **FR-5:** UTF-8 encoding without Byte Order Mark
  - **FR-6:** LF (`\\n`) line endings throughout

  Python's pathlib.Path.write_text() handles both correctly:

  **Encoding:** By default uses UTF-8 and does not write a BOM (Byte Order Mark), meeting FR-5 automatically.

  **Line Endings:** The `newline="\\n"` parameter is the correct, portable way to enforce LF on all platforms. This parameter tells Python's text mode to normalize all newlines to `\\n` (Unix style) regardless of OS, meeting FR-6 across Windows, Mac, and Linux.

  **Why This Matters:**

  Without the `newline` parameter, text mode uses platform defaults:
  - **Windows:** Defaults to CRLF (`\\r\\n`) — fails FR-6, causes file to be 356-560 bytes instead of target 300-600 range
  - **Unix/Linux:** Defaults to LF (`\\n`) — passes FR-6, produces 350-500 bytes
  - **macOS:** Defaults to LF (`\\n`) — passes FR-6, produces 350-500 bytes

  By explicitly setting `newline="\\n"`, all platforms produce identical output meeting both FR-5 and FR-6.

  ### 5. Error Handling and Validation Strategy

  **Chosen:** Minimal validation with early failure: verify file exists after write, check git command exit codes via subprocess, let exceptions propagate

  **Rejected:**
  - Comprehensive pre-flight validation (disk space, permissions, git config) — unnecessary complexity in trusted environment
  - Silent failures with logging — violates transparency principle, harder to debug

  **Rationale:**

  This is a simple operation in a trusted development environment where prerequisites are already satisfied by prior implementations:
  - Write access to repository root is guaranteed (prior 258 features succeeded)
  - Git config (user.name, user.email) is already configured (prior features committed successfully)
  - Feature branch is pre-created and available
  - Python environment is correctly set up

  The established pattern from features 151-258 uses minimal error handling:

  1. **Verify file exists after write** — confirms file creation succeeded
  2. **Use subprocess `check=True`** — raises CalledProcessError on git command failure
  3. **Let exceptions propagate** — explicit failure visibility, halts execution immediately

  This approach balances error prevention with avoiding over-engineering:
  - **Pro:** Simple, focused, matches precedent
  - **Pro:** Explicit failures (better than silent failures)
  - **Pro:** No unnecessary complexity for trusted environment
  - **Con:** Doesn't pre-validate disk space or permissions (not needed here)

  **Example:**
  ```python
  import subprocess
  from pathlib import Path

  # Create file
  Path("test-166w1g.md").write_text(content, encoding="utf-8", newline="\\n")

  # Verify file exists
  assert Path("test-166w1g.md").exists(), "File creation failed"

  # Git operations with automatic error handling
  subprocess.run(["git", "add", "test-166w1g.md"], check=True)  # Raises on failure
  subprocess.run(["git", "commit", "-m", message], check=True)  # Raises on failure
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)  # Raises on failure
  ```

  ---

  ## Library Analysis

  | Library/Technology | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | `pathlib` | File I/O and path handling | **Use** (stdlib) | Modern, clean API for file operations; required for `newline` parameter to enforce LF line endings; standard library, no dependencies |
  | `subprocess` | Git command execution | **Use** (stdlib) | Standard library, safe default (shell=False), sufficient for simple git commands; matches precedent |
  | `open()` builtin | File I/O (alternative) | Don't use | More verbose than pathlib; requires manual context manager; same end result; pathlib is modern standard |
  | `GitPython` | Git integration (alternative) | Don't use | Overkill for three trivial git commands; adds external dependency and overhead; subprocess is lightweight alternative |
  | `os.system()` | Command execution (unsafe alternative) | **Don't use** | Unsafe (shell injection vulnerability); deprecated pattern; subprocess is modern replacement |
  | Template engines (Jinja2, etc.) | Content generation (alternative) | Don't use | Unnecessary for hardcoded prose; adds dependency; reduces determinism; spec allows arbitrary prose |
  | External content APIs | Prose generation (alternative) | Don't use | Adds network dependency, latency, failure points; no benefit since spec allows arbitrary content |
  | `pathspec` | Path handling (alternative) | Don't use | Unnecessary; pathlib covers all requirements; adds dependency |
  | `textwrap` | Text formatting (alternative) | Don't use | Prose content is simple (2-3 sentences); no wrapping or complex formatting needed |

  ---

  ## Security Considerations

  ### 1. Command Injection Prevention

  **Risk:** Git commands are executed via subprocess; improperly constructed commands could be vulnerable to injection attacks

  **Mitigation:** Use `shell=False` (subprocess default) with list-based arguments

  **Safe Pattern:**
  ```python
  # ✅ Safe: list-based arguments, no shell interpolation
  subprocess.run(["git", "add", "test-166w1g.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(259): Create markdown file test-166w1g.md with prose content"], check=True)
  ```

  **Unsafe Pattern:**
  ```python
  # ❌ Unsafe: shell=True with string interpolation
  os.system(f"git add {filename}")  # If filename contains shell metacharacters, injection possible
  ```

  **Status:** ✅ Low risk — feature passes hardcoded filename and commit message, no user input in git commands; subprocess with shell=False is safe by default

  ### 2. File Encoding and Line Ending Handling

  **Risk:** Incorrect line endings or encoding could cause security issues (malformed files, encoding attacks)

  **Mitigation:** Explicit UTF-8 encoding with `newline="\\n"` parameter enforces requirements
  - No BOM (Byte Order Mark) is written
  - LF line endings are enforced regardless of OS
  - Content is literal text, no dynamic execution risk

  **Status:** ✅ Mitigated — explicit encoding parameters ensure correct file format

  ### 3. File Overwrite Protection

  **Risk:** If test-166w1g.md already exists, write_text() will overwrite it silently without warning

  **Mitigation:** Not required — feature is designed for fresh feature branch where file doesn't exist
  - Feature spec states: \"No modifications are made to existing files\" (FR-10)
  - Feature branch is created fresh for this specific feature
  - 258+ precedent implementations work without overwrite protection

  **Status:** ✅ Low risk due to isolated feature branch context

  ### 4. Git Configuration and Credentials

  **Risk:** git commit requires user.name and user.email; git push requires authentication

  **Mitigation:** Assumed pre-configured in development environment (not our responsibility)
  - Prior implementations (features 151-258) succeeded, confirming git config is stable
  - Git credentials are managed by system, not by feature code
  - No hardcoded credentials or passwords in feature

  **Status:** ✅ Accepted environmental precondition; prior precedent confirms it works

  ### 5. Content Safety

  **Risk:** Prose content could theoretically contain malicious markup (code injection, XSS, etc.)

  **Mitigation:** Prose is human-written plain text, no dynamic evaluation
  - Markdown is purely a file format, not executable
  - Content is not processed by interpreters or code executors
  - File is stored in version control, not displayed unsanitized

  **Status:** ✅ No risk — plain text content, no execution surface

  ---

  ## Performance Implications

  ### File I/O Performance

  **File size:** ~350-500 bytes (target range: 300-600 bytes per NFR-1)

  **I/O characteristics:**
  - Single write_text() call: microseconds to complete
  - Negligible disk overhead for small file
  - No repeated I/O operations

  **Optimization needed:** No — file is small, single operation, no repeated I/O. Performance is not a constraint.

  ### Git Command Performance

  **Operations:** 3 subprocess calls (add, commit, push)

  **Latency breakdown:**
  - `git add` — near-instant (local operation, <100ms)
  - `git commit` — near-instant (local operation, <100ms)
  - `git push` — 1-2 seconds (network dependent, may vary)

  **Total time:** 10-15 minutes per NFR-3 (includes human time writing prose, not just technical operations)

  **Optimization strategy:** None needed — operations are sequential and unavoidable; no parallelization opportunity

  **Scalability:** Single file, single set of operations; no scaling concerns

  **User experience:** Total time matches size estimate (S — 10-15 minutes); acceptable performance

  ### No Performance Optimizations Required

  - Feature is I/O-bound (file write + git push), not CPU-bound
  - Single file, single set of operations — no parallelization opportunity
  - Precedent implementations (258+ features) confirm this timing is acceptable
  - No caching, lazy loading, or optimization strategies needed

  ---

  ## Architecture Notes

  ### Fits Established Pattern

  This feature follows the identical pattern from 258+ precedent test files:

  **Location:** Repository root (same as test-*.md files)
  - All 258+ test markdown files are stored at repository root
  - Consistent with project structure for test artifacts

  **Format:** H1 heading + blank line + 2-3 sentences (standard)
  - Established format from features 151-258
  - No variation from precedent

  **Git workflow:** Conventional commits on feature branch (established pattern)
  - Follows https://www.conventionalcommits.org/ specification
  - Message format: `feat(###): Create markdown file <filename> with prose content`
  - Identical to features 151-258

  **No architecture changes needed** — purely additive (single file creation, no code modifications)

  ### No Source Code Modifications

  - Feature does NOT touch `src/sheep/` directory or any production code
  - Feature does NOT modify any existing files
  - Feature does NOT add package dependencies
  - Feature does NOT change configuration files
  - Feature does NOT impact build, test, or deployment systems

  **Impact on codebase:** Minimal (one new test file in root directory)

  ### Integration Points

  - **Zero integration with existing code** — feature is isolated file creation
  - **No imports or dependencies** on source code
  - **No CI/CD changes needed** — feature branch will run standard checks as-is
  - **No documentation updates required** — specs directory is updated separately
  - **No build system impact** — markdown file is not compiled or processed

  ### Precedent Implementations

  258+ features (151-258) have successfully executed this identical pattern:
  - Features 257 and 258 are immediately preceding with identical requirements
  - Pattern is proven, low-risk, well-understood
  - No architectural unknowns or edge cases
  - Highest confidence in implementation approach

  ---

  ## Decisions Summary

  | Decision | Chosen Approach | Why This One |
  | --- | --- | --- |
  | **File I/O** | `pathlib.Path.write_text()` with `newline="\\n"` | Modern stdlib, supports line-ending control, matches 258+ precedents |
  | **Prose Content** | Hardcoded coherent 2-3 sentences | Deterministic, zero dependencies, matches all precedents |
  | **Git Integration** | `subprocess.run()` with `shell=False` | Safe, stdlib, lightweight, matches precedent implementations |
  | **Encoding & Line Endings** | UTF-8 + `newline="\\n"` parameter | Meets FR-5, FR-6 requirements, portable across all OS platforms |
  | **Error Handling** | Minimal with early failure on errors | Appropriate for trusted environment, matches established pattern |

  ---

  ## What's Already Decided (from 258+ Precedents)

  The feature spec explicitly states: \"All significant product decisions for this feature have been predetermined by 258+ existing test markdown files that follow the identical pattern. No open product questions require stakeholder input.\"

  **Predetermined by precedent:**
  - File name: `test-166w1g.md` (fixed by user query)
  - File location: Repository root (established pattern)
  - File format: H1 heading + blank line + 2-3 sentences (defined by 258+ files)
  - File size: 300-600 bytes (measured from existing files)
  - Prose topic: Free-form, arbitrary (user query says \"about anything\")
  - Encoding: UTF-8 without BOM (Python standard)
  - Line endings: LF (Unix convention)
  - Git workflow: Conventional commits on feature branch (established pattern)

  **What's NOT predetermined:**
  - Specific prose content (any coherent 2-3 sentences acceptable)
  - Technical implementation approach (researched and documented above)

  ---

  ## Open Questions

  **None.** All technical decisions are either:
  1. Predetermined by 258+ precedent files (pattern, format, location)
  2. Researched and resolved (file I/O, git integration, encoding)
  3. Flexible per spec (prose content topic — any coherent sentences acceptable)

  The feature spec explicitly states all significant product decisions are predetermined. No technical ambiguities remain.

