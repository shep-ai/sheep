content: |
  ## Summary

  This task breakdown implements the markdown file creation feature in three focused
  steps across two phases:

  **Phase 1: File Creation & Validation (25 minutes)**
  - Task 1 creates test-166w1g.md with proper markdown format (H1 heading + 2-3 prose
    sentences), validates UTF-8 encoding and LF line endings using pathlib.Path.write_text(),
    and confirms file size is in 300-600 byte range. This task must complete before any
    git operations.

  **Phase 2: Git Integration (15 minutes)**
  - Task 2 stages the file and creates a conventional commit with the message:
    \"feat(259): Create markdown file test-166w1g.md with prose content\"
  - Task 3 pushes the commit to remote feature branch (feat/259-markdown-file-creation-73f89f)
    and verifies the push succeeds.

  **Total Effort:** 40 minutes including TDD cycles (RED-GREEN-REFACTOR for each task)

  **No duplication:** plan.yaml covers architecture and design decisions; this file covers
  concrete implementation tasks only.

  **Why This Order:**
  1. File must exist and meet all requirements (task-1) before staging/committing (tasks 2-3)
  2. Staging and committing (task-2) must complete before pushing (task-3)
  3. Each task has clear dependencies ensuring proper sequencing

  **TDD Approach:**
  - Each task includes RED phase (write assertions), GREEN phase (implement minimal code),
    and REFACTOR phase (validate requirements and edge cases)
  - Assertions verify file format, encoding, line endings, size, and git state
  - Subprocess calls use check=True for explicit error handling

  **Key Technical Details:**
  - pathlib.Path.write_text() with newline=\"\\n\" parameter enforces LF on all platforms
  - subprocess.run() with shell=False (safe default) prevents injection vulnerabilities
  - Hardcoded prose content is deterministic and requires no external dependencies
  - No modifications to existing files; purely additive (single file creation)
