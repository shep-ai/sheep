content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-22

  ## Architecture Overview

  Feature 157 follows the established Sheep platform pattern for markdown file creation. The implementation
  is a single feature module that orchestrates existing, reusable helper functions from `content_generators.py`.

  ### Module Structure

  ```
  src/sheep/features/feature_157_markdown_file_creation.py
  ├── Imports (pathlib, helpers from content_generators)
  ├── Constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
  └── Main Function: create_feature_157_markdown_file()
      ├── Logging setup
      ├── Helper orchestration (generate → write → validate → commit → push)
      ├── Error handling with context
      └── Result structure for programmatic consumption
  ```

  ### Integration with Existing Code

  The feature module imports and calls these existing helpers from `content_generators.py`:

  1. **generate_markdown_content()** — LLM-based prose generation via Claude API
  2. **write_markdown_file(content, filename)** — UTF-8/LF-compliant file writing
  3. **validate_markdown_file(filepath)** — Comprehensive validation (structure, encoding, line endings, size)
  4. **commit_markdown_file(filepath, content, repo_path, custom_message)** — Git staging and committing
  5. **push_markdown_file(repo_path)** — Push to remote

  All helpers already exist and are proven across 147+ feature implementations. Feature 157 adds no new
  helper functions — it only orchestrates existing ones.

  ### Reuse from Precedent

  Feature 147 (and 148-156) demonstrate the exact pattern:
  - Feature module imports from content_generators
  - Main function calls helpers in sequence
  - Logging at each step
  - Error handling with context
  - Return structured result

  Feature 157 replicates this proven architecture exactly, ensuring consistency and minimizing risk.

  ## Key Design Decisions

  ### 1. Orchestration-Based Architecture (NOT Helper Duplication)

  **Decision:** Create a thin orchestration layer in feature_157_markdown_file_creation.py that calls
  existing helpers from content_generators.py.

  **Rationale (from research):**
  - All helper functions already exist and are proven across 147+ features
  - DRY principle: reusing helpers avoids duplicating file I/O, encoding logic, validation, git operations
  - Content generation, validation, and git workflow are identical across all 157 features
  - Reduces implementation complexity from "build complete workflow" to "call helpers in sequence"
  - Aligns with Sheep platform's scalable architecture (same pattern scales to 1000+ features)

  **Alternatives Considered:**
  - Inline all logic in feature module — Would duplicate 500+ lines of code from content_generators.py
  - Separate CLI command — Would break feature integration with Sheep agent orchestration system

  ### 2. Use Existing Claude API Integration via CrewAI

  **Decision:** Call generate_markdown_content() which internally uses Claude API via CrewAI.

  **Rationale (from research):**
  - CrewAI integration already exists in content_generators.py and is used by all 147 preceding features
  - Generates coherent, grammatically-correct prose automatically
  - No additional configuration or API setup required
  - Reduces feature implementation complexity (no need to manage LLM calls directly)

  **Alternatives Considered:**
  - Hardcoded prose — Each feature would need unique text, violates DRY, doesn't scale
  - Algorithmic text generation — Cannot produce semantically coherent prose (requires AI understanding)

  ### 3. Comprehensive Validation at Write Time (NOT Post-Hoc)

  **Decision:** Call validate_markdown_file() immediately after write_markdown_file() to ensure
  spec compliance before git operations.

  **Rationale (from research):**
  - Feature spec requires: H1 heading, 2-3 sentences, UTF-8 without BOM, LF line endings, 300-600 bytes
  - Validation checks all requirements with descriptive error messages
  - Early validation (before git) enables fast feedback and prevents incomplete commits
  - Aligns with Sheep pattern from features 147-156

  **Alternatives Considered:**
  - Skip validation, rely on CI — Delays error feedback; violates Sheep pattern of early validation
  - Post-commit validation — Would commit invalid files; violates spec requirements

  ### 4. Custom Git Tools for Orchestration

  **Decision:** Call commit_markdown_file() and push_markdown_file() from sheep.tools.git_tools.

  **Rationale (from research):**
  - Sheep provides custom GitCommitTool and GitPushTool with consistent error handling
  - Using existing tools maintains architectural consistency with 147 preceding implementations
  - Centralizes git command behavior (ensures consistent logging, error messages, credentials handling)

  **Alternatives Considered:**
  - GitPython directly — Adds indirection when custom tools already exist
  - subprocess with git CLI — Error-prone, platform-dependent, requires manual credential setup

  ### 5. Structured Logging for Observability

  **Decision:** Use sheep.observability.logging.get_logger() for structured logging at each step
  (generate, write, validate, commit, push, success).

  **Rationale (from research):**
  - Provides observability for debugging and audit trails
  - Structured logging integrates with Sheep platform's monitoring
  - Enables tracking of feature execution across the system
  - Aligns with patterns from features 147-156

  **Alternatives Considered:**
  - No logging — Unable to debug failures or track execution
  - Plain print() — Doesn't integrate with Sheep platform observability

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Module Creation)** comes first because it establishes the basic structure that
  subsequent phases build upon. The module must exist with imports before we can implement functions.

  **Phase 2 (Implementation & Logging)** comes second because it implements the core logic and adds
  observability. This phase completes the functional implementation.

  **Phase 3 (Testing & Verification)** comes last because it validates that the implementation
  meets requirements. Testing requires the implementation to already exist.

  ### Key Implementation Points

  1. **Function Signature:** `create_feature_157_markdown_file(repo_path: str | None = None) -> dict[str, str]`
     - Takes optional repo_path (defaults to current directory)
     - Returns dict with keys: filepath, content, commit_message, push_result

  2. **Helper Calls in Sequence:**
     ```
     content = generate_markdown_content()           # LLM-based prose
     filepath = write_markdown_file(content, ...)    # UTF-8/LF file writing
     validate_markdown_file(filepath)                # Spec compliance validation
     commit_result = commit_markdown_file(...)       # Git stage + commit
     push_result = push_markdown_file(...)           # Git push to remote
     ```

  3. **Error Handling:** Catch exceptions from helpers, add context, and re-raise with descriptive messages.
     Each helper provides error messages (e.g., "File uses CRLF line endings (should use LF)").

  4. **Constants:**
     - FEATURE_NUMBER = 157
     - MARKDOWN_FILENAME = "test-0tyide.md"
     - COMMIT_MESSAGE = "feat(157): Create markdown file test-0tyide.md with prose content"

  5. **Logging Levels:**
     - INFO: Feature start, validation passed, feature completed
     - DEBUG: Generated content size, file paths, helper results
     - ERROR: Any exceptions with context

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Helper functions missing from content_generators.py | Low | Research confirms all helpers exist and are used by features 147-156. Verify imports in Task 1. |
  | LLM content generation fails or produces invalid prose | Low | Claude API is reliable; content_generators.py validation catches invalid prose (sentence count, UTF-8, etc.). If LLM fails, error message from generate_markdown_content() provides clear feedback. |
  | File encoding/line ending issues | Low | Python's open(encoding='utf-8') prevents BOM; validation explicitly checks for CRLF. All 150+ existing test files use UTF-8+LF. |
  | Git operations fail (no user.name/email, no remote, etc.) | Medium | GitCommitTool/GitPushTool handle common git setup issues. If git config is missing, error from custom tool is descriptive. Feature runs in CI where git is pre-configured. |
  | Filesystem permissions issues | Very Low | Files created in repository root where git already has write access. Inherits directory permissions. |
  | Feature module import fails | Low | Follows exact pattern of feature_147_markdown_file_creation.py. Test in Task 1 catches import errors immediately. |

