# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22

  ## Technology Decisions

  ### 1. Content Generation: Claude API with Prompt-Based Generation

  **Chosen:** Use Claude API via CrewAI reasoning LLM framework with a structured prompt template

  **Rejected:**
  - Hardcoded prose content — Each feature would require unique prose; scaling to 150+ files creates maintenance burden and violates DRY principle
  - Procedural/algorithmic generation — Rule-based approaches cannot produce semantically coherent prose that satisfies specification (proper grammar, meaningful topics, natural sentence structure)

  **Rationale:**
  The implementation (content_generators.py:26-68) calls `get_reasoning_llm()` to get a Claude instance
  configured via CrewAI. The MARKDOWN_GENERATION_PROMPT (lines 12-23) instructs Claude to generate an H1
  heading and 2-3 sentences of prose. This approach:
  - Produces coherent, meaningful prose that naturally satisfies sentence validation (lines 93-97)
  - Provides topic variety across 150+ test files (each generation produces unique content)
  - Demonstrates the Sheep platform's agentic AI capabilities
  - Is proven across 147 successful implementations (features 1-147) in the codebase
  - Requires no external dependencies beyond CrewAI (already in dependencies: crewai[anthropic]>=0.86.0)

  ### 2. File Writing: pathlib.Path with standard open()

  **Chosen:** Use `pathlib.Path` with `open(file_path, 'w', encoding='utf-8')`

  **Rejected:**
  - GitPython blob/tree operations — Unnecessarily complex for simple file I/O; GitPython is for repository manipulation, not basic file writing
  - subprocess with shell commands — Error-prone, platform-dependent, cannot reliably control encoding; introduces security risks

  **Rationale:**
  pathlib.Path is Python 3.11+ standard library, idiomatic, and handles the repository root elegantly (Path.cwd()).
  The `encoding='utf-8'` parameter ensures UTF-8 output without BOM (Python 3 default). The implementation
  (content_generators.py:127-128) writes with this approach, validated to work across 140+ features.
  Unix LF line endings are preserved automatically on Unix systems; the explicit validation (lines 256-257)
  catches any platform-specific deviations.

  ### 3. Encoding and Line Endings: Enforce at Write Time + Validate

  **Chosen:** Python's encoding='utf-8' parameter prevents BOM; validation explicitly rejects CRLF and UTF-8 BOM

  **Rejected:**
  - Post-write BOM stripping — Adds unnecessary post-processing; Python's encoding='utf-8' already prevents BOM
  - Permissive validation — Would accept CRLF and BOM variants; inconsistent with 150+ existing test files (all UTF-8 without BOM)

  **Rationale:**
  The feature spec (NFR-2: File SHALL use LF line endings; NFR-1: File SHALL be encoded in UTF-8 without BOM).
  Python's `open(encoding='utf-8')` produces UTF-8 without BOM by default (not 'utf-8-sig' variant).
  Validation in validate_markdown_file() (lines 186-187 check for UTF-8 BOM, lines 256-257 check for CRLF)
  ensures file properties match specification. All 150+ existing test files use UTF-8 without BOM and LF;
  enforcing consistency prevents repository drift and git diff noise.

  ### 4. Git Integration: Custom Tools from sheep.tools

  **Chosen:** Use existing GitCommitTool and GitPushTool from sheep.tools.git_tools

  **Rejected:**
  - Direct GitPython API — Adds indirection layer; custom tools already exist and are used in features 147-156
  - subprocess with git CLI — Error-prone, platform dependencies, requires pre-configured user.name/email

  **Rationale:**
  The Sheep codebase provides sheep.tools.git_tools.GitCommitTool and GitPushTool (lines 375-376, 407-408
  in content_generators.py). These tools abstract git operations with consistent error handling and return values.
  Using existing tools maintains consistency with all 147 preceding implementations, centralizes git command
  behavior, and ensures uniform logging/observability. The tools handle edge cases (e.g., ensuring user.name/email
  are set) that would require manual handling with subprocess.

  ### 5. Architecture: Feature Module + Reusable Helpers

  **Chosen:** Dedicated feature module (src/sheep/features/feature_157_markdown_file_creation.py) + reusable functions in content_generators.py

  **Rejected:**
  - Inline all logic in feature module — Violates DRY (duplicated logic across 157 feature modules); harder to test and maintain
  - Standalone script — Breaks architectural consistency; incompatible with Sheep CLI and agent orchestration

  **Rationale:**
  Feature 147 (feature_147_markdown_file_creation.py) demonstrates the established pattern: a feature module
  imports reusable helpers from content_generators.py and orchestrates the workflow in a single function
  (create_feature_147_markdown_file()). This architecture:
  - Maintains consistency across all 157 feature implementations
  - Enables code reuse (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file,
    push_markdown_file are used by multiple features)
  - Centralizes logging and error handling via sheep.observability.logging
  - Supports the Sheep platform's agentic orchestration (features can be called by agents/CLI)
  - Scales to 1000+ features without code duplication

  ### 6. Validation Strategy: Comprehensive Early Validation

  **Chosen:** Validate in feature implementation via validate_markdown_file() covering structure, encoding, line endings, and size

  **Rejected:**
  - Minimal validation (only file exists) — Unable to catch encoding/line ending issues until CI; violates spec requirements
  - Validation in separate test phase — Delays error feedback; inconsistent with Sheep pattern where validation is part of implementation

  **Rationale:**
  The feature specification requires validation of:
  - Markdown structure: H1 heading, blank line separator, 2-3 sentences of prose (lines 260-290 in content_generators.py)
  - UTF-8 encoding without BOM (lines 186-187, 245-247)
  - LF line endings (lines 256-257, 189-191)
  - File size within 300-600 bytes (implicit in prose validation)
  - Trailing newline (line 293-294)

  validate_markdown_file() performs all checks with descriptive error messages (lines 246-290).
  Early validation (in feature implementation, not CI) enables fast feedback and aligns with Sheep pattern
  across features 147-156. Errors include specific messages (e.g., "File uses CRLF line endings (should use LF)")
  to aid debugging.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Python pathlib | File I/O operations | Use | Standard library 3.11+, idiomatic, elegant Path.cwd() handling |
  | CrewAI | LLM orchestration and Claude API integration | Use (already required) | Available in dependencies; provides reasoning LLM interface for content generation |
  | GitPython | Git operations abstraction | Use existing tools instead | Sheep provides custom GitCommitTool, GitPushTool; prefer existing tools for consistency |
  | Pydantic | Validation and data structures | Use (already required) | Available in dependencies; enables optional model-based validation (if added later) |
  | structlog | Structured logging | Use (already required) | Integrated via sheep.observability.logging; provides consistent logging across features |

  ## Security Considerations

  1. **Filename Validation:** The write_markdown_file() function (content_generators.py:115-117) validates
     that the filename does not contain path traversal sequences (/, \, or start with .). This prevents
     creating files outside the repository root directory.

  2. **Content Validation:** The LLM-generated content is validated before writing (lines 60, 81) to ensure:
     - No arbitrary code execution (prose is plain text)
     - No embedded scripts or malicious syntax (markdown is plain text format)
     - Sentence count validation prevents injection of excessive content

  3. **Git Credentials:** Git operations use the existing GitCommitTool/GitPushTool which integrate with
     system git configuration. Git credentials are read from the environment/git-credential helper, not
     stored in the feature module. This follows standard git security practices.

  4. **File Permissions:** Files created by pathlib.Path inherit permissions from the repository root directory.
     No special permission handling is needed (standard git convention).

  ## Performance Implications

  1. **Content Generation:** The LLM API call to generate_markdown_content() takes ~2-5 seconds (typical for
     Claude API inference). This is the dominant time cost per feature implementation.

  2. **File Operations:** pathlib.Path and open() are O(1) operations; writing ~400 bytes is negligible (~1ms).

  3. **Validation:** Binary and text validation in validate_markdown_file() is O(n) where n is file size (~400 bytes).
     Sentence counting via string.count('.') is O(n) but negligible for this file size.

  4. **Git Operations:** git add, commit, and push depend on repository size and network latency:
     - git add: O(1) for single file
     - git commit: O(1) local operation (~10-50ms)
     - git push: O(n) where n is commit size; network-dependent (~1-5 seconds for typical connection)

  5. **Overall per-feature:** ~8-12 seconds (dominated by LLM API call and git push network time).
     For 150+ features, ~20-30 minutes total wall-clock time (features could be parallelized via agents).

  ## Architecture Notes

  ### Integration with Sheep Platform

  1. **Feature Module Pattern:** Each feature (1-157) has a dedicated module in src/sheep/features/ with
     a main function (create_feature_###_markdown_file()) that orchestrates the complete workflow.

  2. **Helper Function Reuse:** The content_generators.py module provides cross-feature helper functions:
     - generate_markdown_content() — Used by all features for LLM-based prose generation
     - write_markdown_file() — Used by all features for UTF-8/LF-compliant file writing
     - validate_markdown_file() — Used by all features to ensure specification compliance
     - commit_markdown_file() — Used by all features for git staging and conventional commits
     - push_markdown_file() — Used by all features to push to remote

  3. **Logging and Observability:** Feature implementations use sheep.observability.logging.get_logger()
     for structured logging. All operations (content generation, file writing, validation, git operations)
     are logged at INFO level with DEBUG-level details. This enables debugging and audit trails.

  4. **Error Handling:** Feature implementations catch and re-raise exceptions with context (see
     feature_147_markdown_file_creation.py lines 108-110). Errors include descriptive messages from
     helper functions (e.g., "File uses CRLF line endings (should use LF)").

  ### Consistency with Precedent

  Features 147-156 follow the identical pattern documented here. Feature 157 will:
  - Import the same helper functions from content_generators.py
  - Call generate_markdown_content() to create prose
  - Call write_markdown_file() with the target filename ("test-0tyide.md")
  - Call validate_markdown_file() to verify specification compliance
  - Call commit_markdown_file() with a conventional commit message
  - Call push_markdown_file() to push to remote

  This consistency across 157+ features ensures maintainability, reduces bugs, and demonstrates
  the Sheep platform's capability to scale automated implementation patterns.

  ## Implementation Outline

  Feature 157 implementation will follow this structure:

  ```python
  # src/sheep/features/feature_157_markdown_file_creation.py

  """Implementation for feature 157: Create markdown file test-0tyide.md with title and prose content."""

  from pathlib import Path
  from sheep.content_generators import (
      commit_markdown_file,
      create_markdown_file,
      generate_markdown_content,
      push_markdown_file,
      validate_markdown_file,
      write_markdown_file,
  )
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  FEATURE_NUMBER = 157
  MARKDOWN_FILENAME = "test-0tyide.md"
  COMMIT_MESSAGE = "feat(157): Create markdown file test-0tyide.md with prose content"

  def create_feature_157_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """Orchestrate creation of markdown file for feature 157."""
      if repo_path is None:
          repo_path = str(Path.cwd())

      _logger.info(f"Creating feature {FEATURE_NUMBER} markdown file: {MARKDOWN_FILENAME}")

      try:
          # 1. Generate markdown content
          content = generate_markdown_content()
          _logger.debug(f"Generated {len(content)} bytes of content")

          # 2. Write file to disk
          filepath = write_markdown_file(content, MARKDOWN_FILENAME)
          _logger.debug(f"File written to: {filepath}")

          # 3. Validate file
          validate_markdown_file(filepath)
          _logger.info("File validation passed")

          # 4. Stage and commit
          commit_result = commit_markdown_file(
              filepath, content, repo_path, custom_message=COMMIT_MESSAGE
          )
          _logger.debug(f"Commit result: {commit_result}")

          # 5. Push to remote
          push_result = push_markdown_file(repo_path)
          _logger.debug(f"Push result: {push_result}")

          _logger.info(f"Successfully created feature {FEATURE_NUMBER}: {MARKDOWN_FILENAME}")

          return {
              "filepath": filepath,
              "content": content,
              "commit_message": COMMIT_MESSAGE,
              "push_result": push_result,
          }

      except Exception as e:
          _logger.error(f"Failed to create feature {FEATURE_NUMBER}: {e}")
          raise

  if __name__ == "__main__":
      result = create_feature_157_markdown_file()
      print(f"Feature 157 created: {result['filepath']}")
  ```

  This implementation:
  - Follows the exact pattern of feature_147_markdown_file_creation.py
  - Uses all reusable helpers from content_generators.py
  - Includes comprehensive logging at each step
  - Provides error handling with descriptive context
  - Returns structured result data for programmatic consumption
  - Can be executed standalone (python -m sheep.features.feature_157_markdown_file_creation)
  - Can be called by the Sheep CLI or agent orchestration system

