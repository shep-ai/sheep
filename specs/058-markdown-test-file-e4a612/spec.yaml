content: |
  ## Problem Statement

  Create a single markdown file named `test-epe5lc.md` at the repository root containing
  a markdown H1 or H2 title and 2-3 sentences of content about any topic. This is part of
  the Sheep repository's test file collection, which validates the system's ability to
  perform well-defined, straightforward file creation tasks with appropriate version control
  workflows.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is primarily a static content repository focused on markdown files.
  The root directory contains numerous markdown files organized by purpose:
  - **Test files**: Files like `test-*.md` (e.g., `test-oxui09.md`, `test-u6624u.md`, etc.)
    that contain simple content with titles and prose
  - **Example files**: State machine examples (`ELEVATOR_STATE_MACHINE.md`, `TURNSTILE_STATE_MACHINE.md`)
  - **Content files**: Topical markdown files on various subjects (`ABOUT_ME.md`, `SHEEP.md`)
  - **Configuration**: `README.md`, `.env.example`, `Dockerfile`
  - **Specs**: `/specs/` directory contains feature specifications organized by number and name

  ### Architecture Patterns

  The repository follows these patterns:
  - **Flat File Structure**: All markdown content is stored at the repository root with no
    subdirectories for content organization
  - **Naming Convention**: Test files follow the pattern `test-<random-id>.md` or
    `<topic>-<random-id>.md` for topic-specific files
  - **Content Pattern**: Each markdown file contains:
    - A single H1 or H2 heading (title)
    - 2-3 sentences of prose content
    - No additional structure or formatting beyond the title and paragraphs
  - **Version Control**: Each new file is committed to git with conventional commit messages

  ### Relevant Technologies

  - **Markdown**: Plain text markup language for content formatting
  - **Git**: Version control system for tracking file additions and changes
  - **No dependencies**: No build tools, compilers, or testing frameworks are involved

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single file addition to root; no structural impact |
  | Git history | Low | Single new commit added to repository history |
  | File system | Low | One new `.md` file created; no deletions or modifications to existing files |

  ## Dependencies

  - **Git**: Required for committing and pushing the new file to the repository
  - **Markdown syntax understanding**: Basic knowledge to create valid markdown content
  - **No code dependencies**: No external libraries, frameworks, or build tools required
  - **No impacts to existing code**: This is a content-only addition with zero code changes

  ## Size Estimate

  **S** (Single Sitting, 30 minutes) — This is a trivial implementation task:
  - File creation requires only writing a single markdown file (~100-200 bytes)
  - No code analysis, refactoring, or testing required
  - Content flexibility (any topic) removes decision-making overhead
  - Follows established patterns from 50+ preceding identical features
  - Git operations are minimal (add, commit, push)
  - Proven pattern from recent commits (features 054-057) showing ~1 hour per feature

  The only variable is topic selection, which can be chosen freely with no validation or
  approval required. This task has zero complexity and represents the simplest possible
  implementation work.

