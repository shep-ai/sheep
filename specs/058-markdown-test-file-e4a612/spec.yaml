content: |
  ## Problem Statement

  Create a single markdown file named `test-epe5lc.md` at the repository root containing
  a markdown H1 title and 3 sentences of content about any topic. This is part of
  the Sheep repository's test file collection, which validates the system's ability to
  perform well-defined, straightforward file creation tasks with appropriate version control
  workflows.

  ## Success Criteria

  - [ ] File named `test-epe5lc.md` exists at repository root
  - [ ] File contains a valid markdown H1 heading for the title
  - [ ] File contains exactly 3 sentences of prose content
  - [ ] All markdown syntax is valid (properly formatted)
  - [ ] Content is meaningful and complete (not placeholder text)
  - [ ] File is staged and committed to git with conventional commit message format
  - [ ] Commit message follows `feat(NNN): description` pattern
  - [ ] Changes are pushed to the remote branch
  - [ ] No existing files are modified or deleted
  - [ ] File size is approximately 100-200 bytes

  ## Functional Requirements

  - **FR-1**: Create and write markdown file named `test-epe5lc.md`
  - **FR-2**: File must be created at the repository root directory
  - **FR-3**: File must contain exactly one H1 markdown heading (single # symbol) as the title
  - **FR-4**: File must contain exactly 3 sentences of prose content
  - **FR-5**: Content may be about any topic at the author's discretion
  - **FR-6**: File must be added to git staging area
  - **FR-7**: File must be committed with a conventional commit message (`feat(058): description`)
  - **FR-8**: Changes must be pushed to the remote branch

  ## Non-Functional Requirements

  - **NFR-1**: File must use valid markdown syntax with no formatting errors
  - **NFR-2**: Content must be meaningful and complete (not placeholder, filler, or auto-generated text)
  - **NFR-3**: File follows the established naming convention pattern `test-<id>.md` used in features 054-057
  - **NFR-4**: Content should be natural, well-written, and appropriate for the chosen topic
  - **NFR-5**: Implementation must not modify any existing files in the repository
  - **NFR-6**: File formatting must match existing markdown files in the repository (blank line after title, single paragraph blocks)
  - **NFR-7**: Git commit message must accurately describe the addition following conventional commits specification
  - **NFR-8**: No side effects or unintended changes to repository state

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What markdown heading level for the title? | H1 heading (#) | H1 is the standard for document titles, more semantic for standalone files, and matches existing patterns |
  | 2 | How many sentences should content have? | Exactly 3 sentences | Provides adequate content development within the allowed 2-3 range; time cost is minimal; more engaging |
  | 3 | What style/topic constraints for content? | Any topic and style | User specified "about anything"; previous features show varied content; removes unnecessary overhead |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is primarily a static content repository focused on markdown files.
  The root directory contains numerous markdown files organized by purpose:
  - **Test files**: Files like `test-*.md` (e.g., `test-oxui09.md`, `test-u6624u.md`, etc.)
    that contain simple content with titles and prose
  - **Example files**: State machine examples (`ELEVATOR_STATE_MACHINE.md`, `TURNSTILE_STATE_MACHINE.md`)
  - **Content files**: Topical markdown files on various subjects (`ABOUT_ME.md`, `SHEEP.md`)
  - **Configuration**: `README.md`, `.env.example`, `Dockerfile`
  - **Specs**: `/specs/` directory contains feature specifications organized by number and name

  ### Architecture Patterns

  The repository follows these patterns:
  - **Flat File Structure**: All markdown content is stored at the repository root with no
    subdirectories for content organization
  - **Naming Convention**: Test files follow the pattern `test-<random-id>.md` or
    `<topic>-<random-id>.md` for topic-specific files
  - **Content Pattern**: Each markdown file contains:
    - A single H1 or H2 heading (title)
    - 2-3 sentences of prose content
    - No additional structure or formatting beyond the title and paragraphs
  - **Version Control**: Each new file is committed to git with conventional commit messages

  ### Relevant Technologies

  - **Markdown**: Plain text markup language for content formatting
  - **Git**: Version control system for tracking file additions and changes
  - **No dependencies**: No build tools, compilers, or testing frameworks are involved

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single file addition to root; no structural impact |
  | Git history | Low | Single new commit added to repository history |
  | File system | Low | One new `.md` file created; no deletions or modifications to existing files |

  ## Dependencies

  - **Git**: Required for committing and pushing the new file to the repository
  - **Markdown syntax understanding**: Basic knowledge to create valid markdown content
  - **No code dependencies**: No external libraries, frameworks, or build tools required
  - **No impacts to existing code**: This is a content-only addition with zero code changes
  - **File system access**: Write access to repository root directory (typically available in development environment)

  ## Size Estimate

  **S** (Single Sitting, <30 minutes) — Trivial implementation with zero complexity:
  - File creation: single markdown file (~150 bytes with 3-sentence content)
  - Requirements: none (8 FRs and 8 NFRs are straightforward, no ambiguity)
  - Content creation: free choice of topic, no approval cycle needed
  - Git workflow: standard add/commit/push sequence
  - Testing: none required; success criteria are objective and trivial to verify
  - Pattern validation: matches 4+ preceding identical features (054-057)

  This is the simplest possible implementation task. Requirements are fully resolved with
  no blocking decisions. Time is dominated by content authoring (1-2 minutes) and git
  operations (<1 minute).

  ---

