  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | `pathlib` (Python stdlib) | Cross-platform file path operations | **Use** | Modern, standard library, handles UTF-8 encoding automatically, object-oriented API |
  | `os.path` (Python stdlib) | Legacy file path operations | **Reject** | Older, less expressive API; pathlib is the modern replacement |
  | `open()` (Python builtin) | Low-level file I/O | **Reject** | Too low-level for this task; pathlib provides cleaner abstraction |
  | `markdown` library (external) | Markdown parsing/validation | **Reject** | Not needed; simple H1 heading + text requires no parsing or validation |
  | `frontmatter` library (external) | YAML frontmatter parsing | **Reject** | Not needed; files contain no frontmatter, only simple structure |
  | `faker` library (external) | Generate random prose | **Reject** | Unnecessary; human-composed coherent content is required (not random gibberish) |
  | Git (version control) | Commit and push | **Use** | Required by feature spec; project standard; no alternatives |

