  ### Encoding Safety

  **Status:** UTF-8 without BOM is secure

  **Reasoning:** UTF-8 is the standard, safe encoding. BOM is explicitly excluded per spec. No special
  encoding handling or validation is required. Python's pathlib handles encoding automatically.

  ### File Permissions

  **Status:** Standard (no special handling)

