  ## Risk Mitigation

  | Risk | Mitigation | Likelihood |
  | ---- | ---------- | ---------- |
  | File already exists | Check if file exists; if so, verify existing content matches spec | Low — file name is randomly generated per spec |
  | Encoding mismatch | Use pathlib with explicit `encoding=\"utf-8\"` parameter; verify after write | Low — Python defaults to UTF-8 |
  | Line ending mismatch | Write text with Python (which handles line endings correctly); verify with file inspection | Low — pathlib handles LF automatically |
  | File size out of range | Verify file is 300-600 bytes after writing; adjust prose if needed | Low — typical prose for 2-3 sentences is within range |
  | Git operation failure | Verify git is configured (user.name, user.email); verify feature branch exists | Low — feature branch is pre-created, git is pre-configured |
  | Incorrect commit message | Use provided commit message template exactly; verify message format | Low — straightforward string, can be copy-pasted |

