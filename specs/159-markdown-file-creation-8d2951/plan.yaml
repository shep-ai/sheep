content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-22
  - **Status:** Ready for implementation — all technical decisions predetermined

  ## Architecture Overview

  This feature is a minimal, self-contained file creation task with no architectural
  dependencies or complexity. The implementation pattern is entirely predetermined by
  170+ existing test markdown files in the repository root and the successful execution
  of features 151-158.

  ### File Creation Pattern (Established & Proven)

  All 170+ existing test markdown files (test-*.md) follow an identical structure:

  ```
  # Title (H1 Heading)

  Sentence 1. Sentence 2. Sentence 3.
  ```

  - **Line 1:** Single `#` followed by title text (H1 markdown heading)
  - **Line 2:** Blank line (empty)
  - **Lines 3-5:** Exactly 2-3 sentences of prose content
  - **File size:** Typically 300-600 bytes
  - **Encoding:** UTF-8 without Byte Order Mark (BOM)
  - **Line endings:** LF (Unix-style \\n), not CRLF

  This is not a suggested pattern — it is the mandatory, non-negotiable standard for
  this feature. Features 151-158 all used this exact pattern with 100% success.

  ### Git Workflow (Standard Pattern)

  The feature uses standard git commands following the project's established pattern:

  1. **Create file:** Use Python pathlib to write content to disk
  2. **Stage:** `git add test-rk485w.md`
  3. **Commit:** `git commit -m "feat(159): Create markdown file test-rk485w.md with prose content"`
  4. **Push:** `git push -u origin feat/159-markdown-file-creation-8d2951` (branch pre-created)

  This workflow matches features 151-158 exactly. No merge complexity, no branch
  management, no conflict resolution — just a simple linear commit and push.

  ### Integration with Existing Systems

  This feature has **zero integration points** with existing systems:

  - No modifications to `src/sheep/` or production code
  - No configuration changes
  - No API endpoint updates
  - No database operations
  - No external dependencies (uses only Python stdlib + git)
  - No test modifications or additions
  - Purely additive: one new file in the repository root alongside 170+ existing test files

  The feature is completely isolated and self-contained.

  ## Key Design Decisions

  All design decisions have been predetermined by the 170+ existing test files and
  features 151-158. These are not choices — they are established standards.

  ### 1. File I/O Library: Python pathlib.Path

  **Chosen:** `pathlib.Path` from Python standard library

  **Why:** Modern, object-oriented API for file operations. Clean syntax: `Path("test-rk485w.md").write_text(content, encoding="utf-8")`. Handles cross-platform path compatibility automatically. This is the project standard (all 170+ existing test files were created using Python).

  **Rejected Alternatives:**
  - `os.path` module — older API, less Pythonic
  - `open()` builtin — too low-level, requires manual encoding specification

  ### 2. Text Encoding & Line Endings

  **Chosen:** UTF-8 encoding without Byte Order Mark (BOM), LF (Unix-style) line endings

  **Why:** UTF-8 is the universal text standard and Python's default. BOM adds 3 unnecessary bytes. LF line endings match the repository's Unix convention (confirmed by examining all 170+ existing files). This ensures consistency and prevents linting errors.

  **Rejected Alternatives:**
  - Other encodings (UTF-16, ISO-8859-1) — unnecessary complexity
  - CRLF (Windows line endings) — breaks repository convention
  - UTF-8 with BOM — adds bytes, non-standard

  ### 3. Prose Content: Free-Form Composition

  **Chosen:** Free-form, human-composed prose on any topic (arbitrary subject)

  **Why:** The feature spec explicitly allows "about anything" — free-form composition is the simplest approach. Writing 2-3 coherent sentences requires no external tools, libraries, or templates. All 170+ existing test files use free-form content with varied topics (storytelling, distributed systems, technology, etc.), confirming this is the established pattern.

  **Rejected Alternatives:**
  - Template-based content — unnecessary complexity
  - Pre-generated prose library — introduces dependency with no benefit

  ### 4. File Location: Repository Root

  **Chosen:** Repository root directory (/)

  **Why:** All 170+ existing test markdown files are located at the repository root. This is the non-negotiable, established pattern. The feature spec explicitly states "in the repository root directory." Deviating would break consistency with prior implementations.

  **Rejected Alternatives:**
  - Subdirectories (tests/, data/, etc.) — violates established pattern
  - Temporary directory — files must be committed and tracked by git

  ### 5. Git Workflow: Standard add/commit/push

  **Chosen:** Standard git workflow with conventional commits:
  - Stage: `git add test-rk485w.md`
  - Commit: `git commit -m "feat(159): Create markdown file test-rk485w.md with prose content"`
  - Push: `git push -u origin feat/159-markdown-file-creation-8d2951`

  **Why:** Standard workflow is the project convention. Feature spec mandates conventional commit format. Feature branch is pre-created and ready. Identical to features 151-158. No merge complexity or branch management needed.

  **Rejected Alternatives:**
  - Direct push without commit — loses version control history
  - Interactive rebasing — unnecessary complexity for single-file creation

  ## Implementation Strategy

  The implementation follows a straightforward two-phase approach:

  ### Phase 1: Create Markdown File with Correct Structure

  Compose and write the markdown file to disk with proper structure and encoding:

  1. **Compose prose content:** Write 2-3 coherent sentences on any topic of interest
  2. **Build markdown structure:** Construct content as: H1 heading + blank line + prose
  3. **Write to disk:** Use pathlib.Path to write file with UTF-8 encoding, LF line endings
  4. **Verify encoding & size:** Confirm file is UTF-8, has no BOM, uses LF, is 300-600 bytes

  This phase is independent and has no git dependencies. The file exists locally before
  any git operations. Estimated effort: 5 minutes (compose content + write file).

  ### Phase 2: Git Integration (Stage, Commit, Push)

  Integrate the created file into git version control:

  1. **Stage file:** Run `git add test-rk485w.md` to move file to staging area
  2. **Commit:** Run `git commit -m "feat(159): Create markdown file test-rk485w.md with prose content"`
  3. **Push:** Run `git push -u origin feat/159-markdown-file-creation-8d2951` to push commit to feature branch

  This phase depends on Phase 1 (file must exist before git operations). Estimated effort: 2 minutes.

  **Total estimated effort:** 7 minutes (conservative estimate including verification and git operations).

