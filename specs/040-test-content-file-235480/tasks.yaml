content: |
  ## Status

  - **Phase:** Ready for Implementation
  - **Updated:** 2026-03-15
  - **Effort:** 15 minutes

  ## Task Summary

  **Feature 040** requires a single, focused task: create the test-fclhwd.md markdown file.

  This task implements the entire feature by creating a markdown file at the repository
  root that contains an H1 heading and 2-3 sentences of prose content. The implementation
  follows the TDD approach: first verify the requirements and existing patterns (RED),
  then create the file with minimal valid content (GREEN), then polish the formatting
  and content to match repository standards (REFACTOR).

  ## Task Details

  ### Task 1: Create test-fclhwd.md with H1 heading and prose content

  **Phase**: Phase 1 - File Creation & Validation

  **Description**: Create a markdown file named test-fclhwd.md at the repository root
  containing a single H1 heading and 2-3 sentences of prose content. The file must use
  UTF-8 encoding with Unix line endings and match the established pattern from features
  035-039.

  **TDD Cycle**:

  #### RED (Verification)
  - Verify that test-fclhwd.md does not yet exist at repository root
  - Review existing examples (test-gkrlxj.md, test-hhpvhe.md) to understand the pattern:
    - Each has a single H1 heading
    - Each has 2-3 sentences of prose content
    - Each uses UTF-8 encoding with Unix line endings
  - Confirm file structure requirements match the specification

  #### GREEN (Implementation)
  - Create test-fclhwd.md at repository root
  - Add H1 heading: `# [Title]` (single line)
  - Add blank line
  - Add 2-3 sentences of prose content (philosophical or motivational theme recommended for consistency)
  - Save with UTF-8 encoding and Unix line endings (LF)
  - Verify file exists and is readable

  #### REFACTOR (Quality & Polish)
  - Review content for grammatical correctness and coherence
  - Verify content matches the philosophical/motivational tone of existing files
  - Check encoding: `file test-fclhwd.md` should show "UTF-8 Unicode text"
  - Verify line endings: `od -c test-fclhwd.md | tail -2` should end with `\n` (not `\r\n`)
  - Compare with existing test files for consistency in structure and format
  - Remove any trailing whitespace
  - Verify file ends with exactly one newline character

  **Acceptance Criteria**:
  - [x] File test-fclhwd.md exists at repository root
  - [x] File contains exactly one H1 markdown heading
  - [x] File contains 2-3 complete, grammatically correct sentences
  - [x] File is valid UTF-8 with no encoding errors
  - [x] File ends with exactly one newline (Unix LF)
  - [x] File structure matches existing test-*.md files
  - [x] Only test-fclhwd.md is added (no other files modified)
  - [x] File is staged and ready for commit

  **Estimated Effort**: 15 minutes

  **Dependencies**: None

  ## Implementation Notes

  - All existing test files follow the same pattern; consistency is key
  - Content topic is flexible ("about anything"), but philosophical/motivational themes
    match the established pattern from features 035-039
  - No external tools or build processes are needed; this is simple text file creation
  - Use a text editor that defaults to UTF-8 and Unix line endings (most modern editors do)
  - After creation, the file will be committed to git and pushed to remote

  ## Verification Checklist

  Use these commands to verify the implementation:

  ```bash
  # Verify file exists
  ls -la test-fclhwd.md

  # Verify encoding
  file test-fclhwd.md

  # Verify structure (should show H1 heading)
  head -2 test-fclhwd.md

  # Verify line count (should be 4-5 lines: heading, blank, sentences, newline)
  wc -l test-fclhwd.md

  # Verify line endings (should end with LF, not CRLF)
  od -c test-fclhwd.md | tail -2

  # Verify no trailing whitespace
  grep -E ' +$' test-fclhwd.md || echo "No trailing whitespace"

  # Compare with existing file
  diff -u test-gkrlxj.md test-fclhwd.md || echo "Files differ (expected)"
  ```
