# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation proceeds in logical sequence across 2 phases:

  **Phase 1: File Creation & Content** (Tasks 1-2)
  - Task 1 creates the markdown file with proper structure (heading, blank line, prose)
  - Task 2 validates encoding, line endings, and file size requirements
  - Both tasks focus on the deliverable file itself

  **Phase 2: Git Integration & Push** (Task 3)
  - Task 3 stages the file with git add, commits with conventional message, and pushes to feature branch
  - Depends on Phase 1 completing (file must exist before git operations)

  **TDD Approach**
  Each task follows RED-GREEN-REFACTOR cycle:
  - **RED**: Write assertions/tests that verify success criteria before implementation
  - **GREEN**: Implement minimal code to make tests pass
  - **REFACTOR**: Clean up, improve code quality, verify best practices

  **Total Effort**: ~40 minutes (15 min file creation, 10 min validation, 15 min git workflow)

  **Risk**: Very low. Pattern proven across 60+ prior feature implementations with identical requirements.

  All tasks use only Python standard library (pathlib, subprocess) and git CLI (already available).
  No external dependencies or complex error handling required.
