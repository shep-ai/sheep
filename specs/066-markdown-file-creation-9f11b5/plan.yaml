# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature is a straightforward data file creation task that fits seamlessly into the
  established pattern demonstrated by 60+ existing test markdown files in the repository root
  (features #059-#065 and earlier implementations). The implementation requires no architectural
  changes, new infrastructure, or modifications to existing code.

  The approach is:
  1. **File Creation**: Use Python's pathlib.Path.write_text() with explicit UTF-8 encoding
  2. **Content**: Write meaningful, grammatically-correct prose (2-3 sentences on any topic)
  3. **Git Workflow**: Use subprocess.run() with argument lists (not shell commands) for secure git operations
  4. **Validation**: Test suite verifies file structure, encoding, line endings, and byte size

  No dependencies on platform code, test infrastructure, or external libraries beyond Python's
  standard library and Git CLI (already available in the environment).

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision**: Use `pathlib.Path('test-71fw91.md').write_text(content, encoding='utf-8')`

  **Rationale**:
  - Idiomatic Python for text file operations (endorsed by PEP 20)
  - Provides explicit control over UTF-8 encoding to prevent encoding surprises
  - Automatic LF line endings on Unix systems (target platform for this project)
  - No external dependencies required (Python standard library only)
  - **Proven approach**: Successfully used in 60+ identical test files already in the repository

  **Alternatives considered**:
  - Shell commands (echo > file): Cannot reliably control encoding and line endings across platforms
  - os.open() with manual buffering: Unnecessarily complex; pathlib provides same control with cleaner API

  ### 2. Git Operations: subprocess.run() with argument lists

  **Decision**: Use `subprocess.run(['git', 'add', 'test-71fw91.md'], check=True)` for all git operations

  **Rationale**:
  - Simple, linear approach for straightforward git commands (add → commit → push)
  - Argument list format (not shell=True) prevents shell injection attacks
  - Error handling via check=True parameter ensures failures are caught
  - No external dependencies (GitPython library adds unnecessary complexity for simple operations)
  - **Proven approach**: Used consistently across 60+ prior implementations in this project

  **Alternatives considered**:
  - GitPython library: External dependency introduces unnecessary overhead for these basic operations
  - Shell commands with shell=True: Security risk from command injection; platform inconsistencies

  ### 3. Prose Content: Static, human-written text

  **Decision**: Write meaningful, grammatically-correct prose on any topic (2-3 sentences)

  **Rationale**:
  - Meets specification requirement for "meaningful" content
  - Deterministic and consistent (no randomness or external dependencies)
  - Easy to achieve 400-600 byte target with 2-3 complete English sentences
  - Topic is flexible (technology, philosophy, nature, history—any subject works)
  - **Proven approach**: All 60+ existing test files use topic-specific meaningful content

  **Alternatives considered**:
  - AI/LLM generation: Requires external API (violates NFR-6: no external libraries); adds latency
  - Random/templated content: Likely produces incoherent output; fails "meaningful" requirement

  ### 4. Line Ending Handling

  **Decision**: Rely on pathlib.write_text() default LF behavior on Unix + explicit validation tests

  **Rationale**:
  - pathlib.write_text() defaults to platform-native line endings per PEP 3140
  - On Unix (this project's target platform), results in LF line endings automatically
  - Test suite explicitly validates absence of CRLF and presence of LF
  - Simple and reliable, proven across 60+ existing files

  **Alternatives considered**:
  - open(newline='') with manual newline parameter: Adds complexity; harder to reason about
  - Shell echo -n: Unreliable across platforms; difficult to control

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 (File Creation & Content)** comes first because it produces the actual deliverable file.
  This phase must complete before Phase 2 can proceed (git operations require the file to exist).

  **Phase 2 (Git Integration & Push)** follows Phase 1 and depends on the file being present in
  the working directory. It stages, commits, and pushes the file to the feature branch.

  This sequential approach is natural and matches the logical workflow: create content → save to version control.

  ### Implementation Approach

  1. **Create the file**: Write test-71fw91.md using pathlib.Path.write_text() with UTF-8 encoding
  2. **Verify structure**: Ensure file has H1 heading, blank line, 2-3 sentences of prose
  3. **Verify requirements**: Test suite checks encoding (UTF-8, no BOM), line endings (LF, no CRLF), byte size (400-600)
  4. **Stage the file**: Use subprocess.run(['git', 'add', 'test-71fw91.md']) to add to git index
  5. **Commit**: Use subprocess.run(['git', 'commit', ...]) with conventional commit message (feat: prefix)
  6. **Push**: Use subprocess.run(['git', 'push', ...]) to feature branch

  All operations are straightforward with minimal error cases (file I/O and git are well-behaved in this context).

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File creation fails | Very Low | Cannot complete feature | Use standard pathlib library; matches 60+ prior successes |
  | Git operations fail | Very Low | Cannot push to branch | Use subprocess with argument lists; matches 60+ prior successes |
  | Encoding issues (non-UTF-8) | Very Low | Test failures | Explicit encoding='utf-8' parameter in write_text(); tests validate |
  | Line ending issues (CRLF instead of LF) | Very Low | Test failures | pathlib defaults to LF on Unix; test suite validates |
  | Content too short (<2 sentences) | Very Low | Test failure | Write 2-3 complete sentences; 2-3 sentences naturally fit byte range |
  | File size out of range | Very Low | Test failure | 2-3 sentences of prose naturally fall in 400-600 byte range |
  | Incorrect filename | Very Low | Test failure | Hardcode exact filename 'test-71fw91.md'; no user input |
  | Commit message format wrong | Very Low | Test failure | Use template string with 'feat:' prefix; validate format in tests |

  **Overall Risk Assessment**: Very Low. This feature is a proven, well-established pattern with 60+ prior
  successful implementations in this repository. All technical decisions are supported by existing
  precedent, standard library best practices, and security guidelines.
