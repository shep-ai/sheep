# Structured technology decisions
decisions:
  - title: "Feature Module Architecture"
    chosen: "Implement as standalone Python module in src/sheep/features/feature_180_markdown_file_creation.py following Feature 101 pattern"
    rejected:
      - "Use create_markdown_file() from content_generators directly without a feature module wrapper — reduces orchestration clarity and feature observability, inconsistent with established 179+ feature pattern"
      - "Implement as a CrewAI Agent or Task — adds unnecessary framework overhead for simple file creation workflow, overengineering for straightforward orchestration"
    rationale: >
      The established pattern from features 001-179 uses a dedicated feature module that imports and orchestrates functions
      from content_generators.py. This approach provides: (1) Clear feature ownership and metadata (FEATURE_NUMBER, FEATURE_NAME constants),
      (2) Structured logging at each workflow step, (3) Consistent error handling with try/except blocks, (4) Testability and
      traceback clarity, (5) Maintainability — future developers can easily understand the 5-step workflow. Feature 101
      demonstrates this pattern clearly and should be used as the template. The wrapper is thin but important for observability
      and consistency across 180+ features.

  - title: "Content Generation Method"
    chosen: "Use existing generate_markdown_content() function from content_generators module with Claude LLM via CrewAI"
    rejected:
      - "Implement inline template-based prose generation — reduces content variety, violates DRY principle, inconsistent with 179+ prior features"
      - "Use hardcoded fixed prose strings — every file would have identical content, fails variety requirement, unmaintainable for 180+ features"
    rationale: >
      The content_generators module provides a purpose-built generate_markdown_content() function that calls Claude API via
      CrewAI's get_reasoning_llm(). This function: (1) Generates unique, varied prose for each file creation (required by FR-7),
      (2) Uses a well-tested prompt template ensuring H1 heading + 2-3 sentences format, (3) Includes validation logic to catch
      format errors early, (4) Has been validated successfully across 179+ prior features demonstrating its reliability,
      (5) Maintains consistent prose quality across all test files. Reimplementing would be redundant and introduce risk.

  - title: "File Writing and Encoding"
    chosen: "Use write_markdown_file() from content_generators module which handles UTF-8 encoding, LF line endings, and path safety"
    rejected:
      - "Direct file I/O with open() and manual encoding handling — error-prone, requires reimplementation of already-tested validation logic"
      - "Use subprocess to write file with shell redirection — introduces shell injection risk, loses structured error handling"
    rationale: >
      The write_markdown_file() function in content_generators provides: (1) Cross-platform file writing with proper UTF-8 encoding
      (pathlib.Path), (2) Path safety validation to prevent directory traversal attacks, (3) Post-write verification (file exists,
      has content), (4) Structured error logging, (5) Consistent file-size reporting. Using this tested utility reduces implementation
      risk and ensures encoding/line-ending correctness required by FR-5 and FR-6.

  - title: "File Validation Strategy"
    chosen: "Use comprehensive validate_markdown_file() from content_generators for syntax, encoding, line endings, and sentence count"
    rejected:
      - "Basic validation (only check file exists and is readable) — misses encoding issues, does not verify 2-3 sentence requirement, reduces confidence in correctness"
      - "Skip validation entirely and trust generation — introduces risk of silent failures, no observability into file quality"
    rationale: >
      validate_markdown_file() provides comprehensive checks: (1) UTF-8 encoding verification with BOM detection, (2) LF line ending
      validation, (3) Markdown syntax (H1 heading + blank line separator), (4) Sentence count validation (2-3 periods), (5) Trailing
      newline verification. This aligns with product question resolution: comprehensive validation ensures early detection of encoding
      and syntax issues. The function returns true/false with descriptive ValueError exceptions, providing clear failure messaging per
      NFR-9. The ~2-3 minute cost is acceptable within the 10-15 minute estimate (NFR-2).

  - title: "Git Commit and Push Operations"
    chosen: "Use commit_markdown_file() and push_markdown_file() from content_generators, which wrap GitCommitTool and GitPushTool"
    rejected:
      - "Direct subprocess calls to git command-line — loses structured logging, requires manual argument quoting, error handling becomes feature responsibility"
      - "Use GitPython library directly — bypasses established tool pattern, requires learning GitPython API, inconsistent with 179+ features using GitCommitTool/GitPushTool"
    rationale: >
      The content_generators module provides commit_markdown_file() and push_markdown_file() functions that wrap existing GitCommitTool
      and GitPushTool utilities. This approach: (1) Maintains consistency with 179+ prior features, (2) Provides structured logging at
      each git operation, (3) Abstracts away GitCommitTool/GitPushTool implementation details, (4) Handles conventional commit message
      formatting (feat(180): create markdown file test-315h6y.md with prose content), (5) Ensures proper error handling and fail-fast
      behavior per product question resolution. The feature module calls these functions and does not need to know git internals.

  - title: "Error Handling and Failure Recovery"
    chosen: "Fail fast with descriptive error messages — if any step fails (content generation, file I/O, validation, git operations), raise exception immediately"
    rejected:
      - "Retry git push with exponential backoff — masks root causes, adds complexity, transient network failures are rare with proper git pre-push validation"
      - "Partial success (return success if file created even if push fails) — leaves remote branch out of sync, incomplete feature completion"
    rationale: >
      This approach aligns with product question resolution and established pattern from 001-179: (1) Fails immediately with descriptive
      error messages when any step fails, (2) Prevents partial successes that could leave inconsistent state, (3) Simplifies error handling
      logic, (4) Provides clear signal to caller about what went wrong. All validation and git operations are built into content_generators
      functions which already handle errors this way. Feature 180 module simply lets exceptions propagate with added context logging.

  - title: "Logging and Observability"
    chosen: "Use structured logging via get_logger(__name__) at module and function level, logging each workflow step plus debug details"
    rejected:
      - "No logging — loses visibility into workflow execution, makes debugging failures difficult"
      - "Print statements instead of structured logging — loses structured format, less compatible with observability infrastructure"
    rationale: >
      The feature module imports get_logger from sheep.observability.logging and logs: (1) Start/end of feature creation with feature number
      and filename, (2) Each of the 5 workflow steps (content generation, file write, validation, commit, push), (3) Success/failure results,
      (4) Debug details (content length, file paths, commit messages). This aligns with NFR-10 and the pattern in Feature 101. Structured
      logging provides: audit trails, integration with observability infrastructure (structlog, Langfuse), debugging capability, and compliance
      with established patterns.

