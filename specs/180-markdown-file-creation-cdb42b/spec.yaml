content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-315h6y.md) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 179+ similar test files already existing in the repository as precedents (features 001-179, plus 100+ legacy test-*.md files at the root directory). This is a direct continuation of the markdown-file-creation pattern established in features 001+, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-315h6y.md` is created in the repository root directory
  - [ ] File contains a valid markdown level-1 heading (`#`) with title text
  - [ ] File contains exactly 2 or 3 sentences of prose content following the heading
  - [ ] File uses UTF-8 encoding with no byte order mark (BOM)
  - [ ] File uses LF (Unix-style) line endings, not CRLF or CR
  - [ ] File size is within 300-800 byte range (typical for established pattern)
  - [ ] File is staged in git (verified with `git status` or `git diff --cached`)
  - [ ] Commit message follows conventional format: `feat(180): create markdown file test-315h6y.md with prose content`
  - [ ] Commit is authored with proper git user configuration (user.name and user.email)
  - [ ] Changes are pushed to remote feature branch `feat/180-markdown-file-creation-cdb42b`
  - [ ] Markdown syntax is valid (heading followed by prose without syntax errors)
  - [ ] Prose is grammatically correct, coherent, and contextually appropriate

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-315h6y.md` at the repository root directory (same level as pyproject.toml, README.md, Dockerfile)
  - **FR-2**: File must contain a markdown level-1 heading (`# Heading Text`) as the title, on the first line
  - **FR-3**: File must contain exactly 2 or 3 sentences of prose content following the heading
  - **FR-4**: Implementation must use Python `pathlib.Path` for cross-platform file creation and writing
  - **FR-5**: File must be written with UTF-8 encoding (no BOM — byte order mark)
  - **FR-6**: File must use LF (line feed, `\n`) line endings, not CRLF (`\r\n`) or CR (`\r`)
  - **FR-7**: Prose content may be about any topic; generation should produce unique, varied topics across calls
  - **FR-8**: Stage the created file in git using standard `git add` workflow
  - **FR-9**: Create a git commit with message format: `feat(180): create markdown file test-315h6y.md with prose content`
  - **FR-10**: Push the commit to the remote feature branch `feat/180-markdown-file-creation-cdb42b` with upstream tracking
  - **FR-11**: No modifications to source code, tests, configuration files, or any files outside the repository root directory
  - **FR-12**: Implementation must use reusable utilities from src/sheep/content_generators.py (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file)

  ## Non-Functional Requirements

  - **NFR-1** — File Size: Target file size 300-800 bytes; typical range is 400-600 bytes based on prose length and topic
  - **NFR-2** — Implementation Time: Must complete within 10-15 minutes (small, focused task with no research needed)
  - **NFR-3** — Pattern Consistency: Implementation must follow established pattern from features 001-179 (same structure, same workflow, same approach)
  - **NFR-4** — Code Simplicity: Implementation must be straightforward orchestration code using existing reusable modules, with no unnecessary abstraction or new business logic
  - **NFR-5** — Scope Isolation: Feature touches only repository root; zero impact on `/src/sheep/` application code, `/tests/` test suite, or configuration files
  - **NFR-6** — Prose Quality: Generated content must be grammatically coherent, syntactically correct English, and contextually appropriate (avoid nonsense, irrelevant, or incoherent prose)
  - **NFR-7** — Git Hygiene: Commit must be clean (single file change, no merge conflicts, no unrelated changes staged)
  - **NFR-8** — Reproducibility: Implementation approach must be reproducible and match the 179+ test file precedents already in the repository
  - **NFR-9** — Error Handling: Clear, descriptive error messages on failure; no silent failures or partial success states
  - **NFR-10** — Observability: Feature must log creation, validation, commit, and push steps via structured logging (get_logger)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementation use the existing Claude LLM-based content generator module or implement simpler inline prose generation? | Use existing Claude LLM content_generators module | Maintains consistency with 179+ prior features, leverages validated infrastructure, ensures varied content, follows DRY principle |
  | 2 | How strict should markdown validation be after file creation? | Comprehensive validation (syntax, encoding, line endings, sentence count) | Catches encoding/syntax issues early, ensures 2-3 sentence requirement, provides observability, matches 179+ precedent pattern |
  | 3 | How should the feature handle git push failures? | Fail fast with clear error message | Provides immediate clear signal, avoids masking root causes, ensures complete success (created, committed, pushed), matches error handling in 001-179 |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 179+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~300-800 bytes); no directory structure changes |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch/merge complexity |
  | Source Code | None | Feature is purely file creation; does not impact any source code in /src/sheep/ or /tests/ |
  | Configuration | None | No changes to pyproject.toml, .env, docker-compose.yml, or other config files |

  ## Dependencies

  - **Git repository**: Feature branch `feat/180-markdown-file-creation-cdb42b` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory
  - **Established pattern**: 179+ test files from features 001-179 provide clear precedent and implementation reference
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib and subprocess available in Python 3.11+
  - **Content generator module**: src/sheep/content_generators.py with functions: generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - **Feature pattern**: src/sheep/features/ directory structure with feature module pattern (feature_180_markdown_file_creation.py)
  - **Shared tools**: GitCommitTool and GitPushTool available in src/sheep/tools/ (or subprocess git calls)
  - **LLM access**: Claude API configured via CrewAI config/llm.py for prose generation
  - **Logging**: get_logger utility available for structured logging and observability

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (leverage existing content_generators module with generate_markdown_content() and write_markdown_file())
  - **Validation**: ~2-3 minutes (verify markdown syntax, encoding, line endings, file size using validate_markdown_file())
  - **Git workflow**: ~3-5 minutes (stage, commit with conventional message, push to branch using commit_markdown_file() and push_markdown_file())
  - **Total estimate**: 10-15 minutes

  **Justification**:
  - Well-established pattern with 179+ identical test files providing clear precedent
  - No research or architectural decisions needed (all decisions made via product questions above)
  - Single file with minimal, well-understood content format
  - Reusable content_generators module and feature pattern eliminate boilerplate
  - No testing, documentation, or configuration changes required
  - Recent features (174-179) demonstrate efficient 10-15 minute implementation times
  - Pattern is fully validated and tested across 179+ prior features
  - Implementation can directly follow feature 179 as a template

  ---

  _Requirements phase complete — ready for design and implementation_
