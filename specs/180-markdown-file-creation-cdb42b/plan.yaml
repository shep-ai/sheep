# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 180 is implemented as a standalone Python module following the established pattern
  from features 001-179. The module is a thin orchestration layer that composes five existing,
  well-tested functions from `src/sheep/content_generators.py`:

  ```
  generate_markdown_content()  → Create H1 heading + 2-3 sentences via Claude LLM
  write_markdown_file()       → Write to disk with UTF-8 encoding, LF line endings
  validate_markdown_file()    → Verify encoding, syntax, sentence count
  commit_markdown_file()      → Stage file and create conventional commit
  push_markdown_file()        → Push to remote feature branch
  ```

  The feature module (`feature_180_markdown_file_creation.py`) orchestrates these functions
  with structured logging at each step, clear error handling with try/except, and a return
  dictionary containing filepath, content, commit_message, and push_result.

  This approach leverages 179+ prior successful uses of the same infrastructure, eliminating
  implementation risk and ensuring consistency across the feature set.

  ## Key Design Decisions

  ### 1. Reuse Existing content_generators Module (Not Reimplementation)

  **Chosen:** Call existing `generate_markdown_content()`, `write_markdown_file()`,
  `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()` functions.

  **Rationale:**
  - These functions are purpose-built and have been validated across 170+ prior features
  - Reimplementing would introduce unnecessary risk and violate DRY principle
  - Functions already handle UTF-8 encoding, LF line endings, path safety, and error logging
  - Ensures prose variety (Claude LLM generates unique content for each file)
  - Clear separation of concerns: feature module does orchestration, content_generators handles details

  ### 2. Single Feature Module with Public Function Interface

  **Chosen:** Create `src/sheep/features/feature_180_markdown_file_creation.py` with
  single public function `create_feature_180_markdown_file(repo_path: str | None = None) -> dict[str, str]`.

  **Rationale:**
  - Matches pattern established in features 101-170 (all identical structure)
  - Provides consistent interface for testing and CLI integration
  - Module constants (FEATURE_NUMBER, MARKDOWN_FILENAME) enable metadata and introspection
  - __main__ block allows script execution: `python -m sheep.features.feature_180_markdown_file_creation`
  - Clear module ownership and observability

  ### 3. Comprehensive Validation (Encoding, Syntax, Sentence Count)

  **Chosen:** Call `validate_markdown_file(filepath)` after file creation,
  which validates UTF-8 encoding (no BOM), LF line endings, H1 heading syntax, and 2-3 sentences.

  **Rationale:**
  - Matches validation approach in features 001-179 (comprehensive validation proven reliable)
  - Catches encoding and syntax issues early with clear error messages
  - Validates 2-3 sentence requirement explicitly per FR-3
  - Returns boolean True on success, raises ValueError with descriptive message on failure
  - Validation cost (~50ms) is negligible within 10-15 minute estimate

  ### 4. Structured Logging at Each Workflow Step

  **Chosen:** Use `get_logger(__name__)` to log at INFO level for each of 5 steps,
  DEBUG level for details (content length, file paths, commit messages).

  **Rationale:**
  - Matches pattern in features 101-170 (consistent observability)
  - Provides audit trail: creation start → each step → success/error
  - Integrates with sheep.observability.logging infrastructure (structlog, Langfuse)
  - Aids debugging if any step fails with descriptive error messages
  - No performance impact; logging is asynchronous

  ### 5. Fail-Fast Error Handling with Exception Propagation

  **Chosen:** If any step fails (content generation, file I/O, validation, git operations),
  immediately raise exception with `_logger.error()` context. No retries, no partial success.

  **Rationale:**
  - Matches error handling approach in features 001-179 (proven pattern)
  - Provides immediate, clear signal when something goes wrong
  - Prevents partial-success scenarios (e.g., file created but not pushed)
  - Simplifies error handling logic compared to retry loops or fallbacks
  - All validation and git operations in content_generators already include proper error handling

  ### 6. Use Conventional Commit Format with Feature Number

  **Chosen:** Commit message format: `feat(180): create markdown file test-315h6y.md with prose content`.
  Pass custom message to `commit_markdown_file()` via `custom_message` parameter.

  **Rationale:**
  - Matches conventional commit specification (feat scope)
  - Feature number (180) in scope enables tracing back to feature specification
  - Filename in message provides clarity on what file was created
  - Feature 170 demonstrates this pattern with custom_message parameter
  - Ensures consistency across 180+ features with similar commit messages

  ## Implementation Strategy

  ### Phase 1: Feature Module Setup (2-3 minutes)
  Create `src/sheep/features/feature_180_markdown_file_creation.py` with:
  - Module docstring explaining feature purpose
  - Imports from sheep.content_generators and sheep.observability.logging
  - Constants: FEATURE_NUMBER=180, MARKDOWN_FILENAME="test-315h6y.md"
  - Logger initialization: `_logger = get_logger(__name__)`
  - Function signature and docstring for `create_feature_180_markdown_file()`

  ### Phase 2: Workflow Orchestration (5-7 minutes)
  Implement the 5-step workflow inside `create_feature_180_markdown_file()`:
  1. Generate content with logging (Task 1: Generate markdown content)
  2. Write file to disk with logging (Task 2: Writing markdown file to disk)
  3. Validate file with logging (Task 3: Validating markdown file)
  4. Stage and commit with logging (Task 4: Staging and committing file)
  5. Push to remote with logging (Task 5: Pushing to remote repository)

  Each step includes try/except with error logging for debugging.

  ### Phase 3: Entry Point (1-2 minutes)
  Add __main__ block for script execution, print result summary to stdout.

  ### Phase 4: Integration Testing (2-3 minutes)
  Write integration test that:
  - Verifies module imports without errors
  - Calls `create_feature_180_markdown_file()` in test environment
  - Asserts returned dictionary has all expected keys
  - Verifies file was created at correct location
  - Checks file content is valid markdown

  ## Risk Mitigation

  | Risk | Mitigation | Status |
  | ---- | ---------- | ------ |
  | LLM API latency (Claude call fails) | Content_generators module already handles LLM errors with structured logging and clear exceptions. Feature simply propagates exceptions. | Mitigated by existing infrastructure |
  | File write fails (permissions, disk space) | write_markdown_file() validates file was created and has content. Feature logs and propagates errors. | Mitigated by existing validation |
  | Git operations fail (permissions, network) | GitCommitTool and GitPushTool handle git errors. Feature logs and propagates exceptions. | Mitigated by existing tools |
  | Validation fails (encoding, syntax) | validate_markdown_file() provides clear error messages. Feature logs error and fails fast. | Mitigated by comprehensive validation |
  | Inconsistency with 001-179 pattern | Implementation directly follows Feature 170 pattern as reference. Code review before merge validates alignment. | Mitigated by pattern adherence |

  ## Dependencies

  All dependencies are existing and validated:
  - `sheep.content_generators` — five functions (generate, write, validate, commit, push)
  - `sheep.observability.logging` — get_logger utility
  - `pathlib` — Python standard library (file path handling)
  - Python 3.11+ — required by pyproject.toml

