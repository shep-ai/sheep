content: |
  ## Architecture Overview

  Feature 121 follows the proven architecture established by 120+ identical markdown-file-creation
  features (099-120). The implementation is straightforward orchestration of existing, battle-tested
  helper functions rather than custom code:

  ### Architecture Layers

  1. **Content Generation Layer**: CrewAI reasoning LLM generates diverse prose via
     `generate_markdown_content()` helper
  2. **File I/O Layer**: `write_markdown_file()` handles pathlib-based writing with UTF-8 encoding
  3. **Validation Layer**: `validate_markdown_file()` ensures encoding, line endings, format,
     and file size compliance
  4. **Git Operations Layer**: `GitCommitTool` and `GitPushTool` handle staging, commits,
     and branch pushes with proper error handling

  ### Integration with Sheep Platform

  - **Logging**: All operations logged via `sheep.observability.logging.get_logger()`
    for observability and debugging
  - **Error Handling**: Comprehensive try/except blocks in all helpers with detailed error messages
  - **Tool Architecture**: Uses platform-integrated tools (GitCommitTool, GitPushTool) consistent
    with Sheep's pattern for abstracting external operations
  - **LLM Access**: Uses `sheep.config.llm.get_reasoning_llm()` for CrewAI LLM access

  ### Scope & Isolation

  - **File Creation**: Single test markdown file in repository root (test-a6pcqm.md)
  - **No Source Code Changes**: Feature does not modify `/src/sheep/` or any application code
  - **No Configuration Changes**: Feature does not modify pyproject.toml, settings, or CI/CD
  - **Isolated Impact**: Identical to 120+ existing test file features; follows proven pattern

  ## Key Design Decisions

  ### 1. Leverage Existing Helper Functions (Rather Than Write Custom Code)

  **Decision**: Use `content_generators.py` helpers: `generate_markdown_content()`,
  `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`,
  `push_markdown_file()`

  **Why This Approach**:
  - **DRY Principle**: 120+ features already use these helpers; writing custom code
    duplicates proven logic
  - **Consistency**: Ensures feature 121 follows exact pattern of features 099-120,
    maintaining codebase coherence
  - **Proven Reliability**: Helpers are battle-tested across 120+ features with comprehensive
    logging and error handling
  - **Reduced Risk**: Proven code with established error handling prevents silent failures
  - **Specification Alignment**: Research findings explicitly recommend this pattern

  **Alternatives Considered**:
  - Write custom implementation: Violates DRY, increases inconsistency risk, duplicates
    proven logic, diverges from 120+ precedent
  - Mix helpers with custom code: Creates hybrid complexity defeating abstraction purpose,
    harder to maintain

  ### 2. LLM-Based Content Generation (Rather Than Hardcoded Prose)

  **Decision**: Use `generate_markdown_content()` which calls CrewAI reasoning LLM to
  generate varied prose about random topics

  **Why This Approach**:
  - **Pattern Precedent**: All 120+ existing features use LLM generation (confirmed by
    examining diverse test file topics)
  - **Specification Alignment**: Spec requirement is "about any topic" — LLM generation
    fulfills this naturally
  - **Quality**: LLM naturally generates prose meeting 2-3 sentence requirement
  - **Maintainability**: Generating content is more scalable than manual hardcoding

  **Alternatives Considered**:
  - Hardcoded prose: Diverges from 120+ precedent, requires manual content per file,
    less scalable

  ### 3. Include Validation via Helper Functions (Rather Than Skip or Write Custom)

  **Decision**: Include `validate_markdown_file()` as part of workflow to ensure all
  NFRs are met

  **Why This Approach**:
  - **Practical Pattern**: Feature 118 (recent precedent) includes validation despite
    spec ambiguity
  - **Specification Interpretation**: NFR-4 "straightforward imperative code" means
    "no extra custom validation beyond helpers"
  - **Safety**: Validation ensures UTF-8 without BOM, LF line endings, H1 heading,
    2-3 sentences, trailing newline
  - **Quality Assurance**: Prevents silent failures; all 120+ features include validation
  - **Compliance**: Ensures feature meets all acceptance criteria

  **Alternatives Considered**:
  - Skip validation: Loses critical safety checks, diverges from 120+ precedent
  - Write custom validation: Duplicates logic already in helper, adds unnecessary complexity

  ### 4. Use pathlib.Path.write_text() for File I/O

  **Decision**: Use `pathlib.Path.write_text(encoding='utf-8')` as implemented in
  `write_markdown_file()` helper

  **Why This Approach**:
  - **Established Pattern**: All 120+ features use pathlib
  - **Correct Encoding**: `write_text(encoding='utf-8')` produces valid UTF-8 without BOM
  - **Line Endings**: Automatically uses LF (\\n) on Unix/Linux platforms
  - **Modern Python**: Recommended approach for Python 3.11+
  - **Simplicity**: Single method vs. open() context manager complexity

  **Alternatives Considered**:
  - Traditional open() with context manager: More verbose, requires manual encoding handling
  - Manual encoding with write_bytes(): Increases error risk for encoding edge cases

  ### 5. Use Platform Git Tool Classes

  **Decision**: Use `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`
  (or via `commit_markdown_file()` and `push_markdown_file()` helpers)

  **Why This Approach**:
  - **Architectural Alignment**: Sheep platform abstracts external operations via tool classes
  - **Error Handling**: Tools integrate with platform error handling and logging
  - **Consistency**: Same approach used across all 120+ features
  - **Message Formatting**: GitCommitTool handles conventional commit message format automatically

  **Alternatives Considered**:
  - subprocess.run() for direct git commands: Duplicates tool class logic, loses error handling
  - External GitPython library: Adds unnecessary dependency when tools already exist

  ## Implementation Strategy

  ### Overall Approach

  Feature 121 implementation is straightforward orchestration of existing proven helpers:

  1. **Content Generation Phase** (Phase 1, Tasks 1-2):
     - Call `generate_markdown_content()` to create prose via LLM
     - Call `write_markdown_file(content, "test-a6pcqm.md")` to write file with UTF-8 encoding
     - Call `validate_markdown_file(filepath)` to ensure all NFRs are met

  2. **Git Workflow Phase** (Phase 2, Tasks 3-4):
     - Call `commit_markdown_file(filepath, content, repo_path, message)` to stage and commit
     - Call `push_markdown_file(repo_path)` to push to feature branch

  ### Why This Order

  - **Content before git**: File must exist and be valid before git operations
  - **Validation before commit**: Ensures only correct files are committed
  - **Commit before push**: Ensures commit is created before attempting push
  - **Sequential operations**: Each step depends on previous step success

  ### Error Handling Strategy

  - **LLM Failure**: Helpers include retry logic and fallback mechanisms documented in
    content_generators.py
  - **File I/O Failure**: Validation catches encoding/format issues early; git tools
    provide detailed error messages
  - **Git Operations**: GitCommitTool and GitPushTool include comprehensive error handling
    and logging

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API unavailable or timeout | Helpers include retry logic and fallback mechanisms; see content_generators.py documentation |
  | File encoding incorrect (BOM or non-UTF-8) | validate_markdown_file() explicitly checks encoding and rejects BOM; tests verify correctness |
  | Git configuration missing (user.name/email) | GitCommitTool requires valid git config; error message is clear and actionable |
  | Feature branch does not exist | Feature branch pre-created; push operation fails with clear error if missing |
  | Disk space exhausted | File operation fails with clear disk-space error; validation catches early |
  | Network failure during push | GitPushTool includes retry logic; push can be retried manually |

  ---

  _Plan phase complete — ready for task breakdown in tasks.yaml_
