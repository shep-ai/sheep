# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository follows a pattern of creating simple test markdown files at the repository root.
  This feature extends that pattern by creating a new markdown file named `test-gkrlxj.md` containing
  a title (H1 heading) and 2-3 sentences of content about any topic. This is a straightforward content
  addition with no code changes required.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. The project
  structure includes:

  - **Root level**: Configuration files (.env, Docker setup, README) and content markdown files
  - **specs/**: Feature specifications organized by feature number and name
  - **src/sheep/**: Python source code for the platform (agents, flows, tools, configuration)
  - **.github/**: GitHub workflows and configuration
  - **.claude/**: Claude Code configuration and memory

  For this feature, the focus is on the root level where markdown content files reside.

  ### Architecture Patterns

  Content markdown files follow a consistent pattern:

  1. **Location**: All test markdown files are created at the repository root (not in subdirectories)
  2. **Naming**: Files follow the pattern `test-{randomstring}.md` (e.g., test-u6624u.md, test-xa3rxn.md)
  3. **Structure**: Each file contains:
     - An H1 heading (title) on the first line
     - 2-3 sentences of content below the heading
     - A blank line at the end of the file (standard markdown convention)
  4. **Content**: Files contain general educational or motivational content; topics vary (persistence,
     design patterns, forestry tips, etc.)

  ### Recent Examples

  Recent similar markdown files created in this repository:

  - `test-u6624u.md`: "The Power of Persistence" - 3 sentences about persistence
  - `test-xa3rxn.md`: "The Value of Persistence" - 3 sentences about persistence
  - `test-an5dun.md`, `test-idm3s2.md`, `test-mf05k4.md`, `test-gsul5o.md`: All follow the same pattern

  ### Git Conventions

  Commits for adding markdown files follow this convention:

  ```
  feat(content): Add test-{filename} markdown file
  ```

  or

  ```
  feat(content): Create test-{filename} markdown file (#PR_NUMBER)
  ```

  ## Functional Requirements

  - **FR-1**: File named `test-gkrlxj.md` MUST be created at the repository root
  - **FR-2**: File MUST contain an H1 markdown heading (`# Title`) on the first line as the title
  - **FR-3**: File MUST contain exactly 2 or 3 sentences of substantive content below the H1 heading
  - **FR-4**: Content MUST use valid Markdown syntax with no syntax errors
  - **FR-5**: Content is not restricted by topic; any topic is acceptable

  ## Non-Functional Requirements

  - **NFR-1**: File MUST be encoded in UTF-8
  - **NFR-2**: File MUST end with a newline character (Unix convention)
  - **NFR-3**: File path and name MUST follow the established pattern: repository root, format `test-{randomstring}.md`
  - **NFR-4**: MUST NOT modify any other files in the repository
  - **NFR-5**: Commit message MUST follow the established convention: `feat(content): Create test-gkrlxj.md markdown file`
  - **NFR-6**: No additional files or directories should be created

  ## Success Criteria

  - [ ] File `test-gkrlxj.md` exists at the repository root
  - [ ] File first line is an H1 heading starting with `# ` (e.g., `# My Title`)
  - [ ] File contains exactly 2 or 3 sentences of content below the heading
  - [ ] All content is valid Markdown syntax
  - [ ] File is UTF-8 encoded
  - [ ] File ends with a newline character
  - [ ] No other files in the repository are modified
  - [ ] Commit message follows the pattern: `feat(content): Create test-gkrlxj.md markdown file`
  - [ ] Git history shows a single commit for this feature
  - [ ] Only test-gkrlxj.md appears as a new file (git status shows no other changes)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `test-gkrlxj.md` (new file) | Low | New markdown file created at repository root following established pattern |
  | Repository root | Low | Single new file added, no modifications to existing files |

  ## Dependencies

  None. This feature has no dependencies on code, external libraries, or infrastructure. It is a
  standalone content addition using the standard Markdown format built into the repository.

  ## Size Estimate

  **S** — This is a minimal content addition requiring only the creation of a single markdown file
  with no code changes, configuration updates, or testing. Effort is limited to writing the content
  and committing the file.
