# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 249 follows the established pattern from 248 preceding markdown-file-creation features.
  The implementation consists of a single orchestration module that coordinates existing helper
  functions from the Sheep codebase:

  **Module Structure:**
  - Location: `src/sheep/features/feature_249_markdown_file_creation.py`
  - Pattern: Matches feature_238_markdown_file_creation.py and similar predecessors
  - Dependencies: Imports from content_generators.py and git_tools.py (no external packages)
  - Logging: Uses structlog for audit trail integration with Langfuse

  **Workflow Orchestration:**
  1. Generate markdown content via LLM (using existing generate_markdown_content helper)
  2. Write file to disk with explicit UTF-8 encoding and LF line endings (pathlib.Path.write_text)
  3. Validate file structure, encoding, and line endings (using existing validate_markdown_file helper)
  4. Stage file in git (using existing git helper functions)
  5. Create commit with conventional message format (feat(249): ...)
  6. Push to remote origin with upstream tracking

  **Integration with Existing Architecture:**
  - Reuses content_generators.py: generate_markdown_content(), validate_markdown_file()
  - Reuses git_tools.py: _run_git() helper for git operations
  - Integrates with observability stack: structlog for logging, no new dependencies
  - Follows feature module pattern: dedicated orchestration module with feature-specific concerns
  - No modifications to existing modules or test infrastructure

  ## Key Design Decisions

  ### 1. Feature Module Orchestration Pattern

  **Chosen:** Create dedicated feature_249_markdown_file_creation.py module

  **Rationale:**
  The established pattern (confirmed across features 238, 227, etc.) creates a dedicated module
  that orchestrates helper functions. This approach provides: (1) Clear feature ownership and
  auditability, (2) Feature-specific logging and error handling, (3) Isolated test artifacts,
  (4) Easy tracking of which feature created which file. All 248 prior implementations follow
  this pattern, and consistency is critical for codebase maintainability.

  ### 2. Content Generation via LLM

  **Chosen:** Use existing generate_markdown_content() function (CrewAI + Claude API)

  **Rationale:**
  The codebase has proven this approach across 248 implementations. CrewAI is already in
  pyproject.toml (crewai[anthropic,google-genai,tools]>=0.86.0), and the function produces
  natural, diverse prose with proper structure (H1 heading + 2-3 sentences). No additional
  dependencies required. Alternative (hand-written prose) was rejected because it doesn't scale
  across 249 features and contradicts the established automated pattern.

  ### 3. File I/O with Explicit Encoding Control

  **Chosen:** pathlib.Path.write_text() with encoding='utf-8' parameter

  **Rationale:**
  pathlib is the modern Python 3.11+ standard library approach. The encoding parameter ensures
  UTF-8 without BOM (critical for NFR-1). Content includes explicit '\n' characters, ensuring
  LF line endings across all platforms (Windows, Linux, Mac). pathlib is zero-dependency, safe,
  and matches the pattern from 248 prior implementations. Alternatives (os module, direct open()
  calls) lack encoding control and are less idiomatic.

  ### 4. Comprehensive Validation Before Commit

  **Chosen:** Use existing validate_markdown_file() helper with all checks enabled

  **Rationale:**
  Proactive validation (write → validate → commit) prevents committing invalid files. The
  existing function checks: file exists, UTF-8 without BOM, no CRLF, H1 heading on line 1,
  blank line separator, 2-3 sentences in prose, trailing newline. This matches the spec's
  success criteria and prevents silent failures. Validation happens before git commit, so
  invalid files never enter the repository.

  ### 5. Git Operations via Subprocess

  **Chosen:** Use existing _run_git() helper or git helper functions from git_tools.py

  **Rationale:**
  The established pattern uses subprocess with structured error handling. This provides:
  (1) Automatic CalledProcessError on failure (check=True), (2) Logging integration via structlog,
  (3) No additional dependencies (subprocess is stdlib), (4) Safe argument passing (list args,
  no shell injection). This matches the pattern from 248 prior implementations.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  Phase 1 (Module Setup) comes first because it establishes the module structure, imports,
  constants, and function signature that subsequent phases depend on. Without this foundation,
  later phases have nowhere to implement.

  Phase 2 (Content Generation & File I/O) comes second because it focuses on creating and
  validating the artifact. Once the file exists and is validated, Phase 3 can safely integrate
  it into git.

  Phase 3 (Git Integration) comes last because it depends on Phase 2 (file must exist and be
  valid before staging/committing). This ordering ensures the file is correct before it enters
  version control.

  **Why This Approach Works:**
  - Minimal scope (single file, straightforward workflow)
  - Reuses proven helpers from 248 prior implementations
  - No modifications to existing code
  - Clear separation of concerns (module setup → artifact creation → version control)
  - Each phase produces testable intermediate artifacts (file exists → file is valid → file is committed)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Content generation fails (LLM API error) | Catch exception at top level, log with context, provide clear error message. API failures are external, not implementation issues. |
  | File write fails (permissions, disk full) | IOError caught and logged. Validation catches file write failures (file won't exist). |
  | Invalid file structure (missing heading, wrong sentences) | validate_markdown_file() catches before commit. If validation fails, exception prevents git operations. |
  | Encoding issues (BOM, CRLF present) | pathlib.write_text(encoding='utf-8') ensures proper encoding. validate_markdown_file() verifies binary content. |
  | Git operations fail (no user config, no network) | subprocess CalledProcessError caught and logged. _run_git helper provides structured error context. |
  | Wrong branch or commit message | Feature operates on current branch (correct by CI setup). Commit message is hard-coded from constants. |
  | Path traversal vulnerability (filename attack) | Input validation: filename doesn't contain "/" or "\\" and doesn't start with ".". |
  | Dependency missing at runtime | All dependencies (pathlib, subprocess, structlog, CrewAI) already in pyproject.toml. No new packages. |

  ## Success Criteria for Implementation

  1. ✅ Module file exists at src/sheep/features/feature_249_markdown_file_creation.py
  2. ✅ File test-ey0s31.md created at repository root
  3. ✅ File contains exactly one H1 heading and 2-3 sentences
  4. ✅ File encoded as UTF-8 without BOM
  5. ✅ File uses Unix LF line endings
  6. ✅ File staged with `git add test-ey0s31.md`
  7. ✅ Commit created with exact message: `feat(249): create markdown file test-ey0s31.md with prose content`
  8. ✅ Changes pushed to remote origin on feature branch
  9. ✅ All operations logged via structlog with feature context
  10. ✅ Errors caught and logged with full context (no silent failures)

