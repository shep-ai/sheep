  | 3 | How should prose content be generated — programmatically or manually written? | **Write prose manually** — hand-written coherent sentences | Manual prose produces higher-quality, more natural content matching existing test files. Matches pattern from features 242-248. Minimal overhead (~2-3 minutes) with superior results. |
  | 4 | Should file encoding and line endings be strictly enforced? | **Strictly enforce UTF-8 (no BOM) and LF line endings** — ensure consistency | Maintains consistency with 90+ existing test files. Prevents encoding/line-ending issues across platforms. Required minimal additional effort, critical for pattern fidelity. |

