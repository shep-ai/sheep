content: |
  ## Architecture Overview

  Feature 151 integrates into the established markdown-file-creation pattern used across 150+ prior implementations.
  The architecture leverages existing infrastructure:

  - **content_generators.py**: Provides tested, reusable helper functions for all stages of the workflow
  - **GitCommitTool & GitPushTool**: CrewAI-integrated tools for version control operations with error handling
  - **sheep.config.llm**: Provides access to the reasoning LLM (Claude via Anthropic API)
  - **sheep.observability.logging**: Structured logging for debugging and audit trails

  The implementation creates a new module `src/sheep/features/feature_151_markdown_file_creation.py` that orchestrates
  the 5-step workflow by composing existing helpers. This pattern maintains consistency with Feature 146 (the reference
  implementation) and enables feature-specific customization (e.g., commit message with correct feature number).

  ### Module Structure

  ```
  feature_151_markdown_file_creation.py
  ├── Constants (FEATURE_NUMBER=151, MARKDOWN_FILENAME="test-co5v8p.md")
  ├── create_feature_151_markdown_file() orchestration function
  └── if __name__ == "__main__" block for direct execution
  ```

  The orchestration function follows this flow:
  1. Generate markdown content (H1 heading + 2-3 sentences) via generate_markdown_content()
  2. Write file with UTF-8 encoding (no BOM) via write_markdown_file()
  3. Validate all non-functional requirements via validate_markdown_file()
  4. Commit with feature-specific message via commit_markdown_file(custom_message="feat(151): ...")
  5. Push to remote origin via push_markdown_file()

  ## Key Design Decisions

  ### 1. Modular Helper Architecture (Chosen over end-to-end or custom implementations)

  **Rationale**: Feature 146 demonstrates this pattern; it provides explicit control over the feature-specific
  commit message (must use feat(151), not hardcoded feat(145)). The modular approach:
  - Reuses 150+ precedent implementations
  - Leverages tested helpers (no custom git/file logic)
  - Allows per-step validation and error handling
  - Maintains transparency about workflow stages

  **Alternatives Rejected**:
  - End-to-end `create_markdown_file()` function: Hardcodes feature number in message (requires override logic)
  - Custom implementation: Duplicates 150+ precedents, increases error risk, doesn't leverage patterns

  ### 2. LLM-Generated Prose Content (Chosen over hardcoded or templated content)

  **Rationale**: Proven across 150+ implementations. Uses existing CrewAI dependency (crewai>=0.86.0),
  ensures grammatically correct, unique prose, follows established pattern.

  **Alternatives Rejected**:
  - Hardcoded prose: Less flexible, doesn't leverage CrewAI integration
  - Templated content: May fail grammatical validation, lower quality

  ### 3. Helper Function Composition (Chosen over direct pathlib/subprocess calls)

  **Rationale**: Helpers encapsulate:
  - UTF-8 encoding without BOM (specification requirement)
  - File creation verification
  - Git error handling and status checking
  - Consistent error messages
  - Logging and observability

  **Example**: `write_markdown_file()` uses `open(file_path, "w", encoding="utf-8")` which correctly
  produces Unix LF line endings on all platforms (not CRLF). Using pathlib directly would require manual
  encoding/line-ending logic.

  ### 4. Comprehensive Validation Before Git Integration (Chosen over skip or minimal validation)

  **Rationale**: Validates all non-functional requirements:
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - H1 heading present
  - 2-3 sentence requirement
  - Trailing newline format
  - Performance cost negligible (~10-20ms)

  **Confidence**: Validation catches format errors early, preventing invalid commits

  ### 5. Custom Commit Message Parameter (Chosen over modifying helper or using default)

  **Rationale**: The `commit_markdown_file()` function accepts `custom_message` parameter specifically
  for feature-specific messages. Specification requires exact message: `feat(151): create markdown file test-co5v8p.md with prose content`.
  Passing custom message ensures correct feature number without modifying reusable helpers.

  **Alternatives Rejected**:
  - Modify helper function: Changes 150+ dependencies
  - Use default message: Would use hardcoded feature number (incorrect)

  ## Implementation Strategy

  ### Workflow Phases

  **Phase 1: Foundation & Content Generation**
  - Set up feature module with constants (FEATURE_NUMBER, MARKDOWN_FILENAME)
  - Import content_generators helpers and required modules
  - Implement orchestration function that calls generate_markdown_content()
  - Ensure content structure is valid before proceeding to file I/O

  **Phase 2: File Creation & Validation**
  - Call write_markdown_file() to create test-co5v8p.md with UTF-8 encoding
  - Call validate_markdown_file() to verify all NFRs are met
  - Ensure file exists at correct path before git integration

  **Phase 3: Git Integration**
  - Call commit_markdown_file() with custom_message parameter containing feat(151)
  - Call push_markdown_file() to push to origin
  - Verify commit and push complete successfully

  ### Phase Ordering Rationale

  1. **Content Generation first**: Produces data that will be written to disk. Fails fast if LLM is unavailable.
  2. **File Creation & Validation second**: Validates content before committing. Prevents invalid data in version control.
  3. **Git Integration last**: Only commits valid, tested content. Benefits from validation in Phase 2.

  This ordering minimizes rework: if validation fails, only re-run content generation, not git operations.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API unavailable | CrewAI already configured with Anthropic API; CI/CD environment has API key. Feature branch has no deadline; can retry. |
  | File write permission denied | Feature branch already checked out; write permissions to repo root verified through git operations. |
  | Invalid markdown content | `validate_markdown_file()` checks structure, encoding, line endings, sentence count before commit. |
  | Git configuration missing | All 150+ precedent features completed successfully; git user/email already configured. |
  | Feature branch missing | Feature branch `feat/151-markdown-file-creation-6a7aff` pre-created and checked out. |
  | Encoding issues (CRLF, BOM) | `write_markdown_file()` uses `open(..., encoding="utf-8")` which handles encoding correctly. `validate_markdown_file()` verifies LF line endings. |
  | Duplicate file (overwrite risk) | File `test-co5v8p.md` unique per feature; no existing file conflicts (feature numbering ensures uniqueness). |
  | Commit message error | Custom message passed as parameter, not shell string; no injection risk. Validation ensures exact format. |

  ## Success Metrics

  - File `test-co5v8p.md` created at repository root
  - File contains exactly one H1 heading and 2-3 sentences of prose
  - File validated: UTF-8 encoding, LF line endings, CommonMark compliance
  - Git commit exists with message: `feat(151): create markdown file test-co5v8p.md with prose content`
  - Commit on feature branch `feat/151-markdown-file-creation-6a7aff`
  - Changes pushed to remote origin
  - Total execution time: 10-15 minutes (typical for this pattern)
