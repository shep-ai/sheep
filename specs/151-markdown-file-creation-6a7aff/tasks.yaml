content: |
  ## Summary

  Feature 151 is implemented as a 6-task sequence across 3 phases, following the established pattern from
  150+ preceding implementations:

  **Phase 1: Foundation & Content Generation** (18 min)
  - Task 1: Create module skeleton with constants (FEATURE_NUMBER=151, MARKDOWN_FILENAME="test-co5v8p.md")
  - Task 2: Generate markdown content via LLM, producing H1 heading + 2-3 sentences of prose

  **Phase 2: File Creation & Validation** (13 min)
  - Task 3: Write file to disk with UTF-8 encoding (no BOM) and Unix LF line endings
  - Task 4: Validate all non-functional requirements (encoding, line endings, structure, sentence count)

  **Phase 3: Git Integration** (14 min)
  - Task 5: Commit with feature-specific message "feat(151): create markdown file test-co5v8p.md with prose content"
  - Task 6: Push to remote origin on feature branch

  Each task includes TDD cycles with clear RED (test assertion), GREEN (minimal implementation),
  and REFACTOR (cleanup) steps. Dependencies ensure tasks run in order: all content generation before
  file I/O, all file operations before git integration.

  **Total Effort**: 45 minutes (typical for this pattern; 150+ precedents validate this estimate)

  **Pattern Justification**: This sequence reflects the data flow of the feature—generate content, write to disk,
  validate format, commit, push—and ensures validation happens before irreversible git operations. Using existing
  helpers from content_generators.py eliminates custom implementation risk.

  **No Parallel Tasks**: All tasks have strict dependencies; parallelization not possible without helper refactoring.
  Sequential execution is standard for this feature pattern.
