content: |
  ## Problem Statement

  Create a single markdown file named `test-ywcbdk.md` in the repository root directory
  containing a markdown H1 title and 2-3 sentences of prose content on any topic.
  This continues the series of similar file creation tasks implemented in features 200-206,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic
  file creation workflows following established patterns and conventions.

  ## Success Criteria

  - [ ] File `test-ywcbdk.md` is created in the repository root directory
  - [ ] File contains exactly one H1 (Markdown `# Title`) heading on the first line
  - [ ] A blank line separates the title from prose content
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] All sentences are grammatically correct and properly punctuated
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File size is between 300-800 bytes (inclusive)
  - [ ] File is staged with `git add test-ywcbdk.md`
  - [ ] File is committed with a conventional commit message (format: `feat(207): Create markdown file test-ywcbdk.md`)
  - [ ] Commit is pushed to remote branch with `git push -u origin HEAD`
  - [ ] All validation checks pass without errors

  ## Functional Requirements

  - **FR-1**: Create markdown file in repository root directory named `test-ywcbdk.md`
  - **FR-2**: File must contain a single H1 heading (Markdown format: `# Title`) on the first line
  - **FR-3**: File must contain a blank line immediately following the H1 heading
  - **FR-4**: File must contain exactly 2 or 3 sentences of prose content after the blank line
  - **FR-5**: File content must be in English and be grammatically correct
  - **FR-6**: Stage the created file using `git add test-ywcbdk.md`
  - **FR-7**: Commit the file with a conventional commit message matching `feat(207): Create markdown file test-ywcbdk.md`
  - **FR-8**: Push the commit to the remote branch using `git push -u origin HEAD`
  - **FR-9**: Validate file format, encoding, size, and structure before committing

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use LF (Unix-style) line endings, not CRLF or mixed endings
  - **NFR-3**: File size must be between 300-800 bytes to ensure meaningful content
  - **NFR-4**: Implementation must use only Python standard library modules (pathlib, subprocess, sys, etc.)
  - **NFR-5**: Implementation must be cross-platform compatible (Windows, macOS, Linux)
  - **NFR-6**: Validation must complete in less than 1 second
  - **NFR-7**: Git operations must follow conventional commit standards (Commitizen/Angular format)
  - **NFR-8**: Feature implementation must follow the established pattern from features 200-206

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose content be human-written or AI-generated? | Human-written | Simpler implementation, no external API calls, aligns with deterministic platform philosophy |
  | 2 | Should there be constraints on the topic of the prose? | Any topic | Matches specification language of \"on any topic\", provides maximum flexibility |
  | 3 | Should sentence count validation be strict or lenient? | Strictly enforce 2-3 sentences | Matches specification precisely, maintains consistency with validation patterns in previous features |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-ywcbdk.md` will be created and committed here |
  | src/create_markdown.py (or equivalent) | Medium | May need to extend or create implementation module for file creation and validation |
  | Git repository | High | File will be staged, committed with conventional message, and pushed to remote |
  | specs/207-markdown-file-creation-94cf63/ | High | Spec documentation, implementation code, and feature tracking files created/updated |

  ## Dependencies

  - **Python standard library**: pathlib, subprocess, sys modules for file operations and git integration
  - **Git**: Available in environment for staging, committing, and pushing
  - **Established markdown creation pattern**: Based on 6+ previous features (200-206) providing proven implementation template
  - **Sentence parsing logic**: Simple parsing to count sentences using punctuation delimiters (period, exclamation mark, question mark)

  ## Size Estimate

  **S** (2-4 hours) — This feature is straightforward file creation following an established pattern:
  - Similar scope to features 200-206 (validated through recent commit history)
  - Core implementation requires 3 functions: file creation (~30 lines), validation (~50 lines), git operations (~20 lines)
  - File validation is well-understood: check existence, size (300-800 bytes), H1 format, blank line, sentence count, encoding, line endings
  - No complex business logic, external API calls, or architectural changes required
  - Effort breakdown: 2-3 hours implementation and testing, 1 hour validation and git operations
