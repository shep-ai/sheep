content: |
  ## Problem Statement

  Create a single markdown file named `test-ywcbdk.md` in the repository root directory
  containing a markdown H1 title and 2-3 sentences of prose content on any topic.
  This continues the series of similar file creation tasks implemented in features 200-206,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic
  file creation workflows following established patterns and conventions.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository follows a modular architecture with the following key directories:
  - **Root directory**: Contains markdown test files created by features (test-*.md)
  - **src/sheep/**: Core Sheep platform modules (agents, config, flows, observability, tools)
  - **src/create_markdown.py**: Main utility module for markdown file creation and validation
  - **specs/**: Directory containing feature specifications and implementations, organized by feature number

  ### Architecture Patterns

  The repository demonstrates the following patterns:
  1. **Feature-based structure**: Each feature gets a dedicated `specs/{number}-{name}-{hash}` directory
  2. **Separation of concerns**: File creation logic separated from validation logic
  3. **Git-integrated workflows**: Files created via Python modules that handle git staging, committing, and pushing
  4. **Standard library preference**: Implementation uses pathlib and subprocess rather than external dependencies
  5. **Validation framework**: Comprehensive file validation covering format, encoding, line endings, and size

  ### Relevant Technologies

  - **Python 3**: Primary implementation language using standard library modules
    - pathlib.Path for cross-platform file operations
    - subprocess for git command execution
    - str.encode() for UTF-8 encoding control
  - **Markdown**: File format (H1 heading + prose content)
  - **Git**: Version control (git add, git commit, git push)
  - **File I/O**: Reading/writing files with specific encoding and line-ending requirements

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-ywcbdk.md` will be created and committed here |
  | src/create_markdown.py (or equivalent) | Medium | May need to extend or create implementation module for file creation and validation |
  | Git repository | High | File will be staged, committed with conventional message, and pushed to remote |
  | specs/207-markdown-file-creation-94cf63/ | High | Spec documentation, implementation code, and feature tracking files created/updated |

  ## Dependencies

  - **Python standard library**: pathlib, subprocess, sys modules
  - **Git**: Available in environment for staging, committing, and pushing
  - **Established markdown creation pattern**: Based on 6+ previous features (200-206) providing proven implementation template
  - **Claude API (optional)**: Could be used for prose generation via sheep.config.llm.get_reasoning_llm() if AI-generated content is desired

  ## Size Estimate

  **S** (Hours) — This feature is straightforward file creation following an established pattern:
  - Similar scope to features 200-206 (validated through recent commit history)
  - Core implementation requires 3 functions: file creation (~30 lines), validation (~50 lines), git operations (~20 lines)
  - File validation is well-understood: check existence, size (300-800 bytes), H1 format, blank line, sentence count, encoding, line endings
  - No complex business logic, external API calls, or architectural changes required
  - Estimated effort: 2-4 hours for implementation, testing, and git operations
