content: |
  ## Architecture Overview

  Feature 207 follows the established pattern from features 200-206 with a modular,
  composable architecture:

  ### Module Structure
  ```
  feature_207_markdown_file_creation.py
  ├── Constants (FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT)
  ├── File Creation (create_markdown_file)
  ├── Validation Functions
  │   ├── verify_file_exists
  │   ├── validate_markdown_format
  │   ├── validate_sentence_count
  │   ├── validate_encoding
  │   ├── validate_line_endings
  │   ├── validate_file_size
  │   └── validate_markdown_file (orchestrator)
  ├── Helpers (extract_prose_content, count_sentences)
  ├── Git Operations (git_add_file, git_commit, git_push)
  └── Main Orchestration (main)
  ```

  ### Design Philosophy
  - **Deterministic**: Hard-coded content ensures identical output on repeated execution
  - **Auditable**: Human-written content is transparent and reviewable
  - **Modular**: Each function handles one responsibility, enabling independent testing
  - **Fail-Fast**: Validation stops at first error with clear error messages
  - **Standard Library Only**: No external dependencies; uses pathlib and subprocess
  - **Pythonic**: Modern Python 3.9+ idioms; follows PEP 8

  ## Key Design Decisions

  ### 1. Content Strategy: Hard-Coded Human-Written (Not AI-Generated)
  **Chosen**: Hard-coded, human-written content
  **Rationale**: Specification explicitly resolves toward human-written content for simplicity,
  determinism, and elimination of external API dependencies. No network failures, no API latency,
  transparent and auditable. Proven pattern in feature 206.

  ### 2. File I/O: pathlib.Path.write_text()
  **Chosen**: pathlib.Path.write_text() with default encoding and newline handling
  **Rejected Alternatives**:
  - open(newline='', encoding='utf-8') — More verbose, explicit parameter management
  - os.write() with binary mode — Requires manual byte encoding and BOM handling
  - Legacy codecs.open() — Deprecated

  **Rationale**: Modern Python 3.9+ standard library. Automatically handles UTF-8 encoding
  without BOM via Python's text codec. Default newline=None behavior correctly produces LF
  on all platforms (Windows, macOS, Linux). Single method call, clear Pythonic API. Proven
  pattern in features 204-206.

  ### 3. Sentence Counting: Simple Period Counting
  **Chosen**: Simple period (.) counting
  **Rejected Alternatives**:
  - Regex-based detection (r'[.!?]+') — Over-engineered, fails on edge cases like abbreviations
  - spaCy/NLTK NLP — External dependencies, violates standard library requirement

  **Rationale**: Content is human-written with proper punctuation by design. Deterministic,
  fast O(n) algorithm. Matches patterns in features 204-206. No external dependencies.
  Reliable for typical prose. Easy to understand and debug.

  ### 4. Validation Architecture: Modular Functions
  **Chosen**: Modular validation functions (one function per check)
  **Rejected Alternatives**:
  - Single monolithic validate_markdown_file() — Difficult to test, unclear which check failed
  - No validation — Errors caught only at review time, poor developer experience

  **Rationale**: Each function tests one aspect. Fail-fast with clear error identification.
  Independently testable and reusable. Matches proven pattern from features 204-206.
  Incremental validation. Clear logging aids debugging.

  ### 5. Git Integration: subprocess.run(shell=False)
  **Chosen**: subprocess.run() with shell=False
  **Rejected Alternatives**:
  - subprocess.run(shell=True) — Command injection vulnerability risk
  - GitPython library — External dependency, maintenance burden
  - os.system() — Deprecated, less secure, less controllable

  **Rationale**: Secure by default (no command injection risk). Standard library only.
  Platform-independent. Output capture enables robust error handling. check=True provides
  fail-fast behavior. Matches pattern from features 204-206.

  ### 6. File Size Range: 300-800 Bytes
  **Chosen**: 300-800 bytes per specification
  **Rejected Alternatives**:
  - 250-600 bytes (feature 206 range) — Spec explicitly requires 300-800
  - No size validation — Loses meaningful content constraint

  **Rationale**: Specification explicitly defines this range. 300 bytes minimum ensures
  meaningful content (~3-4 sentences). 800 bytes maximum prevents excessive verbosity.
  Different from earlier features due to stricter spec requirements.

  ## Implementation Strategy

  ### Phase Ordering Rationale
  1. **Phase 1 (File Creation)** comes first because subsequent phases depend on the file existing
  2. **Phase 2 (Validation)** comes second to ensure file meets specification before git operations
  3. **Phase 3 (Git Integration)** comes third after validation passes
  4. **Phase 4 (Integration & Polish)** comes last to wire everything together and polish

  ### High-Level Flow
  1. Create markdown file with hard-coded content
  2. Validate file structure, encoding, line endings, sentence count, and size
  3. Stage file with git add
  4. Commit file with conventional commit message
  5. Push to remote branch

  ### Error Handling Approach
  - Fail-fast: Stop execution at first error
  - Clear error messages: Identify exactly which validation failed
  - Exception chain: Preserve original exception for debugging
  - Logging: Log at each step for observability (info for major steps, debug for details)

  ### Testing Strategy
  Each phase has integrated test cases following TDD (RED-GREEN-REFACTOR):
  1. Write failing test (RED)
  2. Implement minimal code to pass (GREEN)
  3. Refactor and extract helpers (REFACTOR)

  ## Risk Mitigation

  | Risk | Mitigation Strategy |
  | ---- | ------------------- |
  | File encoding errors (BOM, non-UTF-8) | Explicit UTF-8 validation function with binary inspection; pathlib.write_text() ensures correct encoding |
  | Line ending platform differences | Explicit LF validation function scanning binary content; pathlib.write_text() with default newline=None ensures LF |
  | Git command not in PATH | CI/CD environment guarantees git availability; subprocess.run will raise clear error if missing |
  | Hard-coded content limitations | Content is controlled by author, transparent and reviewable; specification explicitly approves this approach |
  | File size edge cases | Clear specification range (300-800 bytes); validation ensures bounds are met |
  | Sentence counting edge cases | Simple period counting works reliably for human-written prose with proper punctuation; author controls content quality |
  | Git operations failures | subprocess.run(check=True) with fail-fast; clear error messages from stderr capture |
  | Validation function reuse | Modular design enables use in future features; each function has clear, documented contract |

  ## Success Criteria Alignment

  All specification success criteria are directly addressed:
  - ✓ File test-ywcbdk.md created in repository root (Phase 1)
  - ✓ Contains H1 heading (TITLE_TEXT constant)
  - ✓ Blank line separator (PROSE_CONTENT construction)
  - ✓ 2-3 sentences (validate_sentence_count function)
  - ✓ Grammatically correct (human-written content)
  - ✓ UTF-8 without BOM (validate_encoding function)
  - ✓ Unix LF line endings (validate_line_endings function)
  - ✓ File size 300-800 bytes (validate_file_size function with 300-800 range)
  - ✓ Git add (git_add_file function)
  - ✓ Git commit with conventional message (git_commit with COMMIT_MESSAGE constant)
  - ✓ Git push (git_push function)
  - ✓ All validations pass (validate_markdown_file orchestrator)

  ---

  **Plan Status:** Ready for Implementation
  **Updated:** 2026-03-25
  **Implementation Pattern:** Validated via features 200-206
  **Confidence Level:** High
