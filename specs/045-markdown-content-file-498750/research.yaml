    chosen: H1 heading + blank line + 2-3 sentences of prose
    rejected:
      - 'H2 heading (less conventional) — H1 is the standard pattern used in all ~50 existing .md files'
      - 'Structured markdown with lists/tables — excess complexity not required by spec'
      - 'Code blocks or examples — would exceed sentence limit and violate simplicity principle'
    rationale: >
      All existing test-*.md files and content files use exactly this structure: single
      top-level heading followed by prose paragraphs. This consistency is enforced by
      the success criteria and observed in test-r7uy00.md, test-g12aiq.md, test-509s35.md,
      and others. H1 headings are semantically correct for document titles in Markdown.

  - title: Character Encoding
    chosen: UTF-8 without BOM
    rejected:
      - 'UTF-16 — no project files use multi-byte encodings; UTF-8 is universal standard'
      - 'ASCII — would reject non-ASCII characters if content includes them'
      - 'Latin-1 — unnecessary; UTF-8 is backward-compatible with ASCII subset'
    rationale: >
      Requirement NFR-1 specifies UTF-8 without BOM. Git and the repository toolchain
      assume UTF-8. All existing .md files are UTF-8. This is the JavaScript/web standard
      and required by Git to handle diffs correctly.

  - title: Line Endings
    chosen: LF (Unix-style line endings)
    rejected:
      - 'CRLF (Windows-style) — violates requirement NFR-2 and breaks git diffs on mixed-OS teams'
      - 'CR (old Mac) — obsolete and unsupported by Git'
    rationale: >
      Requirement NFR-2 mandates LF line endings. Git will enforce this via .gitattributes
      or core.safecrlf. Linux/macOS developers and CI systems use LF. All existing .md
      files in the repository use LF. CRLF conversion happens at clone/commit time if
      configured; enforcing LF at source ensures clean diffs.

  - title: File Creation Method
    chosen: Direct text file write to repository root with git staging
    rejected:
      - 'Templating system (e.g., Jinja2) — overkill for static content; no templates exist in the codebase'
      - 'Markdown generation from code — would require Python/code; contradicts spec requirement of no code changes'
      - 'API-based file creation — no API exists; unnecessary complexity'
    rationale: >
      This is a pure file creation task with no code, no templates, and no dynamic content.
      The simplest and most maintainable approach is direct text file write. The Git
      workflow is standard: write file → git add → git commit → git push. No abstraction
      or tooling needed; this matches how all 50+ existing .md files were added to the repo.

