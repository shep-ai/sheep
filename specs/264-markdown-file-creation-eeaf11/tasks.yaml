content: |
  ## Summary

  Implementation is organized into 3 sequential tasks across 1 phase:

  **Task 1 (10 min):** Create the feature module file with module-level constants
  (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME) and import required utilities.
  Establishes the module structure and metadata following the feature_263 pattern.

  **Task 2 (20 min):** Implement the orchestration function create_feature_264_markdown_file()
  that wires together the 5-step workflow: generate content, write file, validate,
  commit, push. Each step logs its execution; errors are caught and re-raised with
  logging. Returns structured dict with filepath, commit_message, push_result.

  **Task 3 (15 min):** Write integration tests that verify successful execution,
  file properties, git operations, and error handling. Run tests to confirm
  implementation is correct. Verify code coverage >80%.

  ## Workflow Overview

  The implementation follows this linear workflow:

  1. **Content Generation** → Call generate_markdown_content() via Claude API
  2. **File Writing** → Call write_markdown_file() with UTF-8, Unix LF, trailing newline
  3. **Validation** → Call validate_markdown_file() to ensure H1 heading, 2-3 sentences, proper encoding
  4. **Git Commit** → Call commit_markdown_file() with conventional message format
  5. **Git Push** → Call push_markdown_file() to remote branch

  All utilities are proven (used successfully in 263 preceding features). The
  orchestration function is pure wrapper logic with minimal complexity.

  ## Testing Strategy

  - Unit tests verify each task's output independently
  - Integration tests verify full workflow end-to-end
  - Error scenario tests (mocked failures) verify exception handling and logging
  - Code coverage target: >80% for orchestration function
  - Manual verification: Run feature and confirm file is created, committed, pushed

  ## Success Criteria

  Implementation is complete when:
  - All tasks are completed with accepted criteria met
  - Integration tests pass
  - Code coverage >80%
  - Manual execution confirms file is created in repo root with correct content
  - Git history shows commit with correct message
  - Remote branch has pushed changes
