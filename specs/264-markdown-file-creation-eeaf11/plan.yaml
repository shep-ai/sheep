content: |
  ## Architecture Overview

  Feature 264 follows the established layered architecture pattern already proven by 263 preceding features:

  ```
  Feature Layer (feature_264_markdown_file_creation.py)
           ↓
  Utility Layer (content_generators.py)
           ↓
  LLM/Config Layer (llm.py, git_tools.py)
  ```

  The feature module acts as a thin orchestration layer that:
  1. Defines feature-specific metadata (FEATURE_NUMBER=264, MARKDOWN_FILENAME="test-4533e5.md")
  2. Imports 5 proven functions from content_generators.py
  3. Calls functions sequentially with proper error handling and logging
  4. Returns structured result dict

  All heavy lifting is delegated to existing utilities that have been validated across 263 prior features with >95% success rate (NFR-2).

  ## Key Design Decisions

  ### Decision 1: Reuse Existing Utilities vs Custom Implementation
  **Chosen:** Use existing generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file() from content_generators.py

  **Rationale:**
  - These functions are mature, tested, and proven across 263 preceding features
  - Each function encapsulates complex logic: LLM prompting, encoding validation, git error handling
  - Reusing eliminates code duplication and maintenance burden
  - Consistent behavior across feature series ensures predictable outcomes
  - Functions already integrate with project's structured logging and observability infrastructure

  **Why Not Alternatives:**
  - Direct Anthropic SDK: Would duplicate functionality, lose multi-provider support via CrewAI abstraction
  - Custom git commands: Less reliable error handling, no structured logging integration
  - Direct pathlib/subprocess: Loses encoding validation, line ending enforcement, and proven patterns

  ### Decision 2: Single Orchestration Function vs Agent-Based Approach
  **Chosen:** Create single orchestration function create_feature_264_markdown_file() that sequentially calls utilities

  **Rationale:**
  - Workflow is strictly sequential (cannot parallelize: git push requires prior commit)
  - Agent framework adds overhead without benefit for deterministic, linear operations
  - Simpler error handling: exceptions propagate immediately, no agent retry logic
  - Clear execution trace for debugging: step-by-step logging of each utility call
  - ~100 lines of code vs >300 with agents

  **Why Not Alternatives:**
  - CrewAI agents: Adds complexity for a straightforward sequential workflow
  - Script/subprocess wrapper: Loses structured logging integration and error context

  ### Decision 3: Error Handling Strategy
  **Chosen:** Single LLM attempt with immediate error reporting; no automatic retries

  **Rationale:**
  - Maintains operational transparency: failures are visible, not hidden by retries
  - Aligns with specification guidance (section "How should LLM content generation failures be handled?")
  - Supports 5-minute performance budget (NFR-1): no retries means consistent, predictable timing
  - Failures are rare (LLM success rate >95% per research); when they occur, operator intervention needed
  - Matches established pattern from 263 preceding features

  **Why Not Alternatives:**
  - Exponential backoff (up to 3 attempts): Masks transient API issues, adds variable latency, violates NFR-1
  - Silent fallback: Commits potentially nonsensical content, violates data integrity

  ### Decision 4: Validation Comprehensiveness
  **Chosen:** Use comprehensive validate_markdown_file() that checks heading presence, exact sentence count (2-3), encoding, line endings, trailing newline, grammar, and coherence

  **Rationale:**
  - At scale (264 identical features), comprehensive validation ensures consistency
  - Catches LLM edge cases: malformed output, encoding issues, coherence failures
  - Validates both structure (heading, sentence count) and quality (grammar, coherence)
  - Aligns with FR-7 (Markdown Validation) and NFR-2 (>95% success rate)
  - Small performance overhead (0.1-0.2s) well within 5-minute budget

  **Why Not Alternatives:**
  - Minimal validation (heading + count only): Misses grammar/coherence issues, quality regressions
  - No validation: No way to detect failures before committing corrupted files

  ### Decision 5: Feature Module Structure
  **Chosen:** Thin wrapper (~100 lines) in src/sheep/features/feature_264_markdown_file_creation.py following feature_263 pattern exactly

  **Rationale:**
  - Provides feature-specific metadata (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Enables feature tracking in observability systems (Langfuse execution graphs)
  - Clear entry point for testing and ad-hoc execution
  - Maintains consistency with 263 preceding features
  - Satisfies NFR-3 (Consistency) and NFR-6 (Code Quality)

  **Why Not Alternatives:**
  - Inline utilities call: Lacks feature metadata, no Langfuse tracing, inconsistent with established pattern
  - Custom agent: Adds unnecessary complexity for linear workflow

  ## Implementation Strategy

  ### Phase 1: Feature Module Implementation

  The entire feature is implemented in a single phase because the workflow is strictly sequential and all dependencies are satisfied (existing utilities are proven and available).

  **Step 1: Create Module with Metadata** (Task 1)
  - Create file src/sheep/features/feature_264_markdown_file_creation.py
  - Define constants: FEATURE_NUMBER (264), FEATURE_NAME, MARKDOWN_FILENAME
  - Import required utilities and logging infrastructure
  - Ensures module can be imported and feature metadata is accessible

  **Step 2: Implement Orchestration Function** (Task 2)
  - Implement create_feature_264_markdown_file(repo_path=None) function
  - Wire together 5-step workflow: generate → write → validate → commit → push
  - Each step logs start/completion with structured context (feature number, step name, result)
  - Comprehensive try/except blocks catch and re-raise errors with logging
  - Return structured dict with filepath, commit_message, push_result
  - Matches workflow pattern from feature_263 exactly

  **Step 3: Verify Integration** (Task 3)
  - Write integration tests that verify each step of the workflow
  - Test success case: full workflow completes, file created, content valid, pushed to remote
  - Test error cases: LLM failure, file write failure, git failure
  - Ensures orchestration correctly handles both success and error scenarios

  No additional phases needed. All dependencies are satisfied (utilities exist and are proven).

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM generation produces prose that doesn't meet sentence count requirement | Low | High (feature fails) | validate_markdown_file() enforces exact 2-3 sentence count via period detection (proven across 263 prior features with >95% success rate). If failure occurs, error is logged immediately. |
  | File write permission denied or filesystem error | Very Low | High (feature fails) | write_markdown_file() includes filesystem permission checks and path validation. Errors are caught and logged with path context. Repository is writable (established from prior 263 features). |
  | Git operations fail (commit, push) | Very Low | High (feature fails) | commit_markdown_file() and push_markdown_file() wrap GitCommitTool/GitPushTool with structured error handling. Remote branch exists (specified in git setup). Errors logged with full git output. |
  | UTF-8 encoding issues or line ending violations | Very Low | Medium (causes validation failure) | write_markdown_file() explicitly enforces UTF-8 encoding without BOM and Unix LF line endings. validate_markdown_file() verifies these constraints. Issues caught before commit. |
  | Prose is grammatically correct but incoherent/nonsensical | Very Low | Medium (reputational) | validate_markdown_file() includes coherence validation via grammar/spelling checks. Claude API with temperature 0.2 (reasoning model) produces focused output. Edge cases rare. |
  | Implementation deviates from feature_263 pattern | Low | Medium (inconsistency, maintenance) | Implementation strictly follows feature_263 structure. Pattern review before execution catches deviations. Testing validates conformance. |

  ## Implementation Confidence Assessment

  **Confidence Level: Very High**

  Justification:
  - All 5 utility functions proven across 263 preceding features (99.6% feature completion rate)
  - Pattern (feature_263) is immediately preceding and directly applicable
  - No new infrastructure, libraries, or architectural patterns required
  - Error scenarios understood and mitigated
  - Execution is deterministic and observable (structured logging)
  - Performance budget comfortable (typical 5s, budget 300s)
  - Feature scope is intentionally small (size: S)

  ## Success Criteria

  Implementation is complete when:
  1. File src/sheep/features/feature_264_markdown_file_creation.py created with module constants and orchestration function
  2. Function executes full 5-step workflow without errors
  3. File test-4533e5.md created in repository root with valid H1 heading and 2-3 sentences of coherent prose
  4. File properties verified: UTF-8 encoding, Unix LF line endings, trailing newline
  5. Staged to git, committed with message "feat(264): Create markdown file test-4533e5.md with prose content", and pushed
  6. All operations logged via structured logging (feature number, step, result)
  7. Integration tests pass

  Estimated total effort: < 1 hour (based on feature_263 experience and mature utility infrastructure).
