content: |
  ## Architecture Overview

  This feature creates a single test artifact in the repository root following the well-established markdown-file-creation pattern proven across 152+ precedent implementations (features 061-152). The implementation is completely isolated from application source code (/src/sheep/) and has no impact on the build system, test suite, or CI/CD pipeline.

  The feature adds one markdown file (test-saqbel.md) to an existing collection of 150+ test artifacts already present in the repository root. It follows a flat, predictable organization that aligns with the project's established conventions.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use Python's standard library pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings.

  **Rationale:**
  - Part of Python standard library (no external dependencies, satisfies NFR-9)
  - Correctly handles UTF-8 encoding without BOM (NFR-1)
  - Correctly handles Unix LF line endings via newline='\\n' parameter (NFR-2)
  - Proven across 152+ existing implementations with consistent results
  - Minimal code: one line vs. multiple lines with open() or shell commands
  - Explicitly satisfies requirement NFR-5 (use pathlib for file I/O)
  - Cross-platform and avoids shell/OS-specific issues
  - Research findings confirm this is the optimal approach

  **Alternative considered:** open() with manual encoding — more verbose (5+ lines), error-prone for newline parameter handling, no advantage over pathlib.

  ### 2. Content Structure: Flexible Topic with Fixed Format

  **Decision:** Implementer chooses prose topic; file must contain exactly H1 heading + blank line + 2-3 sentences.

  **Rationale:**
  - User query explicitly states \"about anything\", granting implementer autonomy
  - All 152+ existing implementations use flexible topics successfully
  - Requirement NFR-8 explicitly allows implementer choice
  - Increases engagement and content quality (people write better prose on self-chosen topics)
  - Verification is straightforward: grammar/sentence count are the only constraints
  - No need for predefined topic lists or random generation (keeps implementation simple)

  ### 3. Error Handling: None (Assume Proper Environment)

  **Decision:** No try-except blocks; assume file system and git are working preconditions.

  **Rationale:**
  - Feature runs in controlled development environment
  - File system and git working are preconditions for any feature
  - All 152+ precedent implementations use no error handling with 100% success
  - Minimal code is easier to understand and maintain than defensive programming
  - If unexpected errors occur, they surface immediately to the developer (preferable to silent failures)
  - Simple, linear code aligns with project conventions from precedent features

  ### 4. File Location: Repository Root

  **Decision:** Create test-saqbel.md in repository root (no subdirectories).

  **Rationale:**
  - Requirement FR-2 explicitly specifies repository root
  - Consistent with all 152+ existing test-*.md files
  - Provides single, predictable location for test artifacts
  - Natural location for test data in this project structure

  ### 5. Git Workflow: Single Conventional Commit

  **Decision:** Standard workflow: git add → commit with conventional message → push.

  **Rationale:**
  - One logical change (create markdown file) = one commit = clean history
  - Conventional commit format integrates with automated tooling (semantic versioning, release notes)
  - All 152+ existing implementations follow this pattern
  - Feature branch already pre-created; linear workflow is straightforward
  - Follows Conventional Commits specification for consistency

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**
  - Create markdown file with H1 heading and 2-3 prose sentences using pathlib.Path.write_text()
  - Use explicit UTF-8 encoding and LF newlines to satisfy encoding/format requirements
  - Verify content structure matches established pattern
  - Total effort: ~10 minutes

  **Phase 2: Git Integration & Push**
  - Stage file with git add test-saqbel.md
  - Commit with conventional message: feat(153): create markdown file test-saqbel.md with prose content
  - Push to remote origin on feature branch
  - Total effort: ~3 minutes

  **Why this ordering:** File must exist and be properly formatted before git operations. Git workflow is independent and can proceed once file is validated.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect encoding or line endings | Use pathlib.write_text() with explicit encoding='utf-8' and newline='\\n' parameters; no custom encoding logic needed |
  | File not created in repository root | Use Path(\"test-saqbel.md\") (relative path to CWD); framework ensures CWD is repository root |
  | Prose content fails sentence count requirement | Verify exactly 2-3 sentences during implementation; simple count check before committing |
  | Git push fails | Feature branch pre-created; standard git workflow; verify network connectivity if push fails |
  | Commit message format incorrect | Use exact format from specification: feat(153): create markdown file test-saqbel.md with prose content |
