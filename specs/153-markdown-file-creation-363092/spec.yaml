# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, repeatable pattern. This feature creates a single test markdown file (`test-saqbel.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git integration,
  and conventional commit workflows.

  This is feature #153 in the markdown-file-creation series (features 061-153+), with 152+ identical implementations
  providing clear precedent for content format, structure, and implementation approach. All features in this series
  follow the same pattern: create a markdown file with an H1 heading and 2-3 sentences of prose, validate format,
  and commit with a conventional message.

  ## Success Criteria

  - [ ] File `test-saqbel.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is approximately 400-600 bytes (typical range for this pattern, not strict)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-saqbel.md`)
  - [ ] Git commit exists on the current branch with message: `feat(153): create markdown file test-saqbel.md with prose content`
  - [ ] Commit is on the feature branch `feat/153-markdown-file-creation-363092`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-saqbel.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct (any topic acceptable per user query "about anything")
  - **FR-6**: File must be staged using `git add test-saqbel.md`
  - **FR-7**: File must be committed with the exact message: `feat(153): create markdown file test-saqbel.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/153-markdown-file-creation-363092`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes (guideline, not strict limit, accepts natural variation)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 152+ existing test files in the repository (features 061-152)
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (explicitly flexible per user query "about anything")
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Questions & AI Recommendations

  All product decisions for this feature have been resolved through the openQuestions field above. This feature
  follows an established, well-precedented pattern with clear requirements derived from the user query and 152+
  identical implementations across features 061-152.

  ### Decision Summary

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose topic selection | Flexible (implementer choice) | User query explicitly permits "about anything"; maximizes autonomy while maintaining quality |
  | 2 | File creation approach | Use `pathlib.Path.write_text()` | Standard library, proven approach across 152+ precedents, no external dependencies required |
  | 3 | Error handling scope | None (assume proper environment) | Consistent with all 152+ existing implementations; file system and git are working preconditions |
  | 4 | Commit message format | Exact conventional format | Follows Conventional Commits specification; consistent across all related features |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. The relevant structure:

  - **Repository root**: Contains 152+ test markdown files (test-*.md) following a consistent pattern, artifacts of markdown-file-creation features 061-152
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability); not affected by this feature
  - **specs/**: Feature specification directory with 180+ subdirectories for feature specifications
  - **tests/**: Test suite for the application; not affected by this feature
  - **.github/workflows/**: GitHub Actions CI/CD pipeline configuration
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile**: Container configuration for deployment
  - **.gitignore**: Git ignore rules

  Test markdown files (test-*.md) in the repository root are purely artifacts of feature implementations and do not form part of the application source code or test suite.

  ### Architecture Patterns

  **Established File Creation Pattern** (152+ precedents in features 061-152):

  - Simple file creation using Python pathlib for I/O operations (per NFR-5)
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM (NFR-1), LF line endings (NFR-2)
  - File size typically 400-600 bytes, treated as guideline not strict requirement (NFR-3)
  - Implementation follows straightforward imperative code (define content string, write to file)
  - Example from recent features:
    ```python
    from pathlib import Path
    CONTENT = """# Title\n\nSentence one. Sentence two. Sentence three."""
    Path("test-saqbel.md").write_text(CONTENT, encoding='utf-8', newline='\n')
    ```

  **Git Workflow Pattern** (consistent across all 152+ markdown-file-creation features):

  - Feature branch is pre-created as `feat/153-markdown-file-creation-363092`
  - Create or modify files
  - Stage with `git add <filename>`
  - Commit with conventional commit format: `feat(153): create markdown file test-saqbel.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files (NFR-7)

  **Feature Implementation Pattern** (observed across features 061-152):

  - Minimal, isolated changes affecting only repository root (one new markdown file)
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); pathlib available in all versions
  - **pathlib (Python standard library)**: Used for file I/O operations; example: `Path("test-saqbel.md").write_text(content, encoding='utf-8')`
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content; validated per CommonMark spec
  - **CrewAI**: Underlying framework for the automation platform (not directly relevant to this feature)

