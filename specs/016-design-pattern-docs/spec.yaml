    resolved: false
    options:
      - option: DESIGN_PATTERN_[NAME].md (pattern-specific)
        description: >
          Name the file after the chosen pattern (e.g., SINGLETON_PATTERN.md, ADAPTER_PATTERN.md).
          More discoverable if searching by pattern name; follows implicit naming precedent
          (DESIGN_PATTERN.md for Observer, even though file name doesn't encode "Observer").
      - option: DESIGN_PATTERN_3.md or DESIGN_PATTERN_DETAILED.md (generic variant)
        description: >
          Generic name that doesn't encode pattern choice, allowing flexibility if pattern
          selection changes. Consistent with incrementing or descriptor naming. Less discoverable
          by pattern name but cleaner file organization.
      - option: Follow the existing dual-file pattern (vary by pattern)
        description: >
          Observe that DESIGN_PATTERN.md documented Observer and DESIGN_PATTERN_SUMMARY.md
          documented Strategy. If treating this third pattern symmetrically, name could be
          DESIGN_PATTERN_DETAILS.md, DESIGN_PATTERN_PATTERNS.md, or use a pattern-specific
          name to avoid generic numbering.
    selectionRationale: >
      Recommend SINGLETON_PATTERN.md (or ADAPTER_PATTERN.md if Adapter is chosen).
      Following the implicit naming precedent of DESIGN_PATTERN.md (which documents Observer
      without naming it explicitly) and DESIGN_PATTERN_SUMMARY.md (which documents Strategy
