# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository has established a pattern of documenting software design patterns in
  markdown files at the repository root. Two patterns have been documented so far:

  1. **Observer pattern** (DESIGN_PATTERN.md, spec 008) — A behavioral GoF pattern
     covering event notification and dependency management.
  2. **Strategy pattern** (DESIGN_PATTERN_SUMMARY.md, spec 009) — A behavioral GoF pattern
     covering algorithm encapsulation and runtime selection.

  This feature extends that documentation by adding a **third design pattern file**
  (SINGLETON_PATTERN.md) documenting the Singleton pattern, a creational GoF pattern.
  This choice provides coverage across multiple pattern categories and ensures pedagogically
  valuable documentation of a commonly-used pattern.

  The documentation should follow the established template demonstrated by the first two
  patterns, maintaining consistency in structure and pedagogical approach while using
  a concise summary style (150-200 lines) similar to DESIGN_PATTERN_SUMMARY.md.

  ## Success Criteria

  - [ ] SINGLETON_PATTERN.md file created at repository root
  - [ ] File contains all required sections: Intent, Structure, When to Use, Trade-offs, Code Example
  - [ ] File is between 150-200 lines (matching DESIGN_PATTERN_SUMMARY.md length)
  - [ ] Contains 3+ real-world use case scenarios describing when to apply the pattern
  - [ ] Python code example is syntactically correct, executable, and demonstrates pattern clearly (20-40 lines)
  - [ ] Uses GitHub-flavored markdown syntax with proper formatting (headings, code fences, lists)
  - [ ] Content is pedagogically clear and accessible to developers new to the Singleton pattern
  - [ ] Peer review confirms the documentation is accurate, clear, and consistent with existing pattern files
  - [ ] File is committed with conventional commit message (feat(content): add SINGLETON_PATTERN.md)
  - [ ] `pnpm build`, `pnpm test`, and `pnpm lint` all pass without errors

  ## Functional Requirements

  - **FR-1**: Create a markdown file named SINGLETON_PATTERN.md at the repository root
  - **FR-2**: Document the Singleton pattern's intent — explain the problem it solves and design goal
  - **FR-3**: Explain the pattern's structure — describe key participants (Client, Singleton class) and their relationships
  - **FR-4**: Provide "When to Use" section with minimum 3 real-world scenarios where Singleton is appropriate
  - **FR-5**: Include "Trade-offs" section covering both advantages (e.g., controlled single instance, lazy initialization) and disadvantages (e.g., global state, testing challenges, concurrency concerns)
  - **FR-6**: Provide working Python code example (20-40 lines) demonstrating the Singleton pattern with thread-safe initialization
  - **FR-7**: Follow the established documentation template structure demonstrated by DESIGN_PATTERN.md and DESIGN_PATTERN_SUMMARY.md
  - **FR-8**: Use only text-based explanation and code examples (no diagrams)

  ## Non-Functional Requirements

  - **NFR-1**: File length shall be 150-200 lines to match DESIGN_PATTERN_SUMMARY.md style
  - **NFR-2**: Use standard GitHub-flavored markdown syntax (GFM) with UTF-8 encoding
  - **NFR-3**: Python code examples must be syntactically correct and runnable in Python 3.6+
  - **NFR-4**: Content must be clear and accessible to developers with intermediate Python knowledge
  - **NFR-5**: Documentation must be consistent in tone, style, and structure with existing pattern files
  - **NFR-6**: No external tools, diagrams, or dependencies required for rendering
  - **NFR-7**: File must be maintainable with no external references or broken links

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which design pattern should be documented? | Singleton pattern | Most commonly encountered in real codebases; provides creational category coverage; clear pedagogical value with practical examples |
  | 2 | What should the markdown file be named? | SINGLETON_PATTERN.md | Self-documenting and discoverable; aligns with repo root naming convention; improves searchability |
  | 3 | What should be the target length and structure? | Match DESIGN_PATTERN_SUMMARY.md (150-200 lines) | More maintainable; stylistic variety is acceptable; allows precedent for future patterns without bloat |
  | 4 | Should the documentation include visual diagrams? | Text-only | Maintains consistency with existing pattern files; diagrams less essential for behavioral/structural patterns |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Medium | Adding one new markdown documentation file (SINGLETON_PATTERN.md) |
  | specs/016-design-pattern-docs/ | Low | Spec YAML finalized during this requirements phase |
  | Documentation structure | Low | Extends existing documentation pattern; no architectural changes |
  | Git history | Low | One commit adding the new file with appropriate feat(content) message |

  ## Dependencies

  **None** — This is a standalone documentation file with no code dependencies, no imports,
  and no integration with the Python source code or CI/CD pipeline. The file is purely
  educational content that can be added independently.

  **Precedent Consistency**: The implementation should follow the established conventions
  demonstrated by specs 008 (DESIGN_PATTERN.md) and 009 (DESIGN_PATTERN_SUMMARY.md).

  ## Size Estimate

  **M** — Medium effort during analysis phase (research, pattern evaluation, requirements definition).
  **S** — Small effort during implementation phase (2-4 hours of content authoring for 150-200 line file).

  The analysis phase involved researching candidate patterns, evaluating each for pedagogical value
  and real-world relevance, and making clear recommendations with rationale. Now that the pattern
  choice is finalized in the requirements phase, the implementation effort is straightforward content
  creation following an established template.
