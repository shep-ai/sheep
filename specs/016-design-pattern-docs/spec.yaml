# Product Decisions (resolved with AI recommendations)
openQuestions:
  - question: Which design pattern should be documented?
    resolved: true
    options:
      - option: Singleton pattern
        description: >
          Creational GoF pattern. Ensures only one instance of a class exists. Common in
          logging, configuration, database connections. Clear, teachable example with
          practical relevance. Provides creational category coverage (neither Observer nor
          Strategy are creational). Risk: often misused or controversial in discussions.
        selected: true
      - option: Adapter pattern
        description: >
          Structural GoF pattern. Converts an interface to match client expectations.
          Common in legacy system integration, third-party library integration. Clear real-world
          scenarios. Provides structural category coverage. More abstract than Observer/Strategy.
        selected: false
      - option: Command pattern
        description: >
          Behavioral GoF pattern (like Observer/Strategy). Encapsulates a request as an object.
          Essential for undo/redo, queuing, deferred execution. Rich example possibilities.
          More complex to demonstrate concisely but pedagogically valuable.
        selected: false
      - option: Facade pattern
        description: >
          Structural pattern. Provides simplified interface to complex subsystem. Highly practical
          in real codebases (common in libraries and frameworks). Clear motivation, simple to
          explain. Provides structural category coverage.
        selected: false
    selectionRationale: >
      Singleton pattern is recommended as the most commonly encountered pattern in real codebases.
      It provides creational category coverage (unlike Observer and Strategy which are behavioral),
      offering pedagogical balance across pattern types. While somewhat controversial in discussions,
      documenting it correctly alongside its limitations is valuable. It enables clear, concise
      Python examples with practical relevance to logging, configuration, and database connections.
      Alternative: Adapter pattern for structural coverage if the reviewer prefers avoiding the
      Singleton discussion.
    answer: Singleton pattern

