# Structured technology decisions
decisions:
  - title: Singleton Implementation Approach for Code Example
    chosen: Decorator-based singleton (modern Pythonic approach)
    rejected:
      - 'Classic eager initialization (instantiate at module load) — Simple but inflexible; wastes resources for singleton objects that may not be used; does not demonstrate lazy initialization pattern.'
      - 'Double-checked locking pattern (explicit __new__) — Traditional approach from Java/C++; verbose for Python; harder to understand for developers new to the pattern; requires manual lock management.'
      - 'Module-level singleton (single module-level instance) — Pure Pythonic approach; excellent for simple cases but does not clearly demonstrate the design pattern itself or allow multiple singleton instances; less educational for pattern understanding.'
    rationale: >
      The decorator-based singleton approach (using a wrapper function with __call__) is the most
      modern and Pythonic implementation. It provides: (1) clear pedagogical value showing how
      decorators work in Python; (2) easy thread-safe implementation using threading.Lock;
      (3) clean client code where @singleton decorator makes intent explicit; (4) educational
      value for developers unfamiliar with the pattern in other languages (Java, C++). This
      approach is documented in popular Python books (e.g., Python Design Patterns) and used in
      real codebases. The code example will be 25-35 lines, fitting the target range, with clear
      demonstration of instance creation, access, and thread-safety.

  - title: Thread-Safety Mechanism
    chosen: threading.Lock with explicit acquire/release in singleton decorator
    rejected:
      - 'No thread-safety (naive singleton) — Suitable for single-threaded applications but incomplete documentation since Singleton is often used in multi-threaded contexts (logging, database connections). Omits a critical real-world consideration.'
      - 'Metaclass-based thread-safety (use __new__ with lock) — Traditional approach but more complex; adds metaclass machinery that obscures the pattern for educational purposes; harder for intermediate Python developers to understand.'
    rationale: >
      Explicit threading.Lock in the decorator provides clear thread-safety with minimal complexity.
      This approach: (1) demonstrates thread-safety concern directly; (2) is easy to explain in
      comments; (3) handles the real-world requirement of thread-safe singletons in logging,
      database connections, and configuration managers; (4) follows the same simplicity principle
      as the existing pattern documentation. Trade-offs section will discuss performance implications
      of lock contention for high-throughput scenarios.

  - title: Documentation Structure and Scope
    chosen: Follow DESIGN_PATTERN_SUMMARY.md template (150-200 lines, no Related Patterns section)
    rejected:
      - 'Match DESIGN_PATTERN.md (comprehensive, 239 lines) — More detailed but increases maintenance burden; introduces stylistic inconsistency with the summary format; the concise format is equally pedagogically effective.'
      - 'Create custom hybrid structure — Mix elements from both existing patterns; risks inconsistency in repository documentation standards; adds subjective design decisions.'
    rationale: >
      Following DESIGN_PATTERN_SUMMARY.md template ensures: (1) consistency with established
      documentation patterns in the repository; (2) maintainability at reasonable scope; (3) same
      pedagogical depth as existing pattern files with proven structure (overview, structure,
      when-to-use, trade-offs, code example). The spec explicitly recommends this approach. The
      concise format (150-200 lines) is appropriate because Singleton is simpler to explain than
      some behavioral patterns.

