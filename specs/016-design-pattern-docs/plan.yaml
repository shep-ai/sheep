# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature adds a third design pattern documentation file to the repository, extending
  the established pattern documentation approach demonstrated by DESIGN_PATTERN.md (Observer)
  and DESIGN_PATTERN_SUMMARY.md (Strategy). SINGLETON_PATTERN.md is a standalone markdown
  file at the repository root with no code dependencies, no imports, and no integration with
  the Python source code or CI/CD pipeline. It is purely educational content.

  The implementation respects the existing documentation structure and naming conventions:
  - All pattern files are at the repository root (consistent placement)
  - File name is pattern-specific (SINGLETON_PATTERN.md, self-documenting)
  - Structure follows the DESIGN_PATTERN_SUMMARY.md template proven effective for pattern docs
  - Code examples use standard Python (no special dependencies or frameworks)
  - No diagrams or external tools required (consistent with existing pattern files)

  ## Key Design Decisions

  ### 1. Singleton Implementation Approach: Decorator-Based Pattern

  **Chosen:** Decorator-based singleton function with explicit @singleton decorator usage.

  **Rationale:**
  - Most Pythonic and modern approach compared to classical __new__ or module-level approaches
  - Provides strong pedagogical value: demonstrates decorator mechanics and intent clarity
  - Clean client code where @singleton decorator makes the pattern explicit to readers
  - Enables easy thread-safe implementation via threading.Lock with minimal complexity
  - Documented in popular Python design pattern references and used in real codebases
  - Code example fits the 25-35 line target with clear demonstration of instance creation,
    access control, and thread-safety mechanism

  **Rejected alternatives:**
  - Classic eager initialization: Resource wasteful, no lazy initialization
  - Double-checked locking (__new__ based): Verbose for Python, harder to understand
  - Module-level singleton: Less educational for pattern understanding, doesn't demonstrate design mechanism

  ### 2. Thread-Safety Mechanism: threading.Lock with Explicit Acquire/Release

  **Chosen:** threading.Lock deployed in the singleton decorator with clear acquire/release pattern.

  **Rationale:**
  - Direct, easy-to-explain thread-safety mechanism suitable for documentation
  - Addresses real-world requirement since Singleton is commonly used in logging, database
    connections, and configuration managers which operate in multi-threaded contexts
  - Minimal complexity appropriate for 150-200 line documentation format
  - Trade-offs section will explicitly discuss lock contention costs and design alternatives
  - Makes thread-safety concern visible and understandable to developers new to the pattern

  **Rejected alternatives:**
  - No thread-safety: Incomplete documentation since multi-threading is a primary real-world concern
  - Metaclass-based approach: Adds machinery that obscures the pattern for educational purposes

  ### 3. Documentation Template: DESIGN_PATTERN_SUMMARY.md Style

  **Chosen:** Follow DESIGN_PATTERN_SUMMARY.md structure (150-200 lines, concise summary format).

  **Rationale:**
  - Ensures consistency with established documentation patterns in the repository
  - Proven template that balances depth with maintainability
  - Appropriate scope for Singleton which is simpler to explain than some behavioral patterns
  - Maintains stylistic flexibility (DESIGN_PATTERN.md and DESIGN_PATTERN_SUMMARY.md demonstrate
    acceptable variation while remaining consistent in core structure)
  - Explicitly recommended in the feature specification

  ### 4. Use Cases: Three Core Real-World Scenarios

  **Chosen:** Focus on logging systems, configuration managers, and database connections.

  **Rationale:**
  - Most commonly encountered in real production codebases (immediately relevant to developers)
  - Easy to illustrate concisely within the 150-200 line constraint
  - Cover different concern areas: cross-application visibility (logging), application startup
    (configuration), and resource efficiency (database connections)
  - All three clearly demonstrate why a single, shared instance is necessary
  - Align with product specification recommendation

  **Rejected alternatives:**
  - Expanded use case list (5-6 scenarios): Would risk exceeding line target and reduce conciseness
  - Generic use cases: Less practical, harder for developers to map to real problems

  ### 5. Trade-offs: Comprehensive Discussion of Global State Impact

  **Chosen:** Include substantial coverage of hidden global state, testing challenges, and dependency issues.

  **Rationale:**
  - Global state and testing challenges are the primary real-world criticisms of Singleton
  - Many experienced developers avoid Singleton specifically due to hidden dependencies and testing costs
  - Balanced documentation requires acknowledging both advantages and limitations
  - Aligns with the pattern demonstrated in existing pattern files (Observer, Strategy)
  - Helps developers make informed architectural decisions rather than blindly applying the pattern

  ## Implementation Strategy

  **Phase 1: Content Authoring** creates the complete SINGLETON_PATTERN.md file in a single task:
  - File includes all required sections: opening summary, Overview, Structure, When to Use,
    Trade-offs (advantages and disadvantages), and Code Example
  - Content follows the proven DESIGN_PATTERN_SUMMARY.md template structure adapted for Singleton
  - Code example demonstrates decorator-based singleton with threading.Lock for thread-safety
  - All real-world use cases (logging, configuration, database connections) are clearly explained
  - Trade-offs section emphasizes both benefits and limitations

  **Phase 2: Validation & Commit** verifies the output meets acceptance criteria:
  - Line count validation (target: 150-200 lines)
  - Markdown syntax validation (GitHub-flavored markdown, proper formatting)
  - Python code example validation (syntactically correct, runnable, demonstrates pattern)
  - Content accuracy and pedagogical clarity check
  - Git commit with conventional commit message (feat(content): add SINGLETON_PATTERN.md)
  - Pipeline verification (pnpm build, pnpm test, pnpm lint all pass)

  The sequential phase ordering is appropriate since validation only occurs after content
  is complete. No parallelization is needed for this straightforward, focused documentation task.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Code example has syntax errors or doesn't demonstrate the pattern clearly | Include detailed comments in the code example explaining the decorator mechanics and thread-safety lock. Test example locally during authoring to ensure correctness. |
  | Documentation exceeds 200 line limit | Use concise language, prioritize essential explanations. Reserve detailed expansion for future documentation enhancements. Validate line count during authoring. |
  | Trade-offs discussion is incomplete or one-sided | Explicitly balance advantages against disadvantages. Use structured sections (### Advantages / ### Disadvantages) to ensure both are covered. Reference the comprehensive discussion guideline in research findings. |
  | Markdown formatting or syntax issues | Use the DESIGN_PATTERN_SUMMARY.md template as direct reference, maintaining identical formatting structure. Validate markdown rendering before commit. |
  | Content is inconsistent with existing pattern files | Follow DESIGN_PATTERN_SUMMARY.md structure precisely. Review both existing files to understand tone, depth, and terminology. Maintain parallel language and explanation style. |
  | Line count falls below 150 lines | Ensure all required sections are comprehensive but concise. Singleton pattern is simpler than some behavioral patterns, so reaching 150 lines is the minimum bar; ensure nothing essential is omitted. |
