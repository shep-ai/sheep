content: |
  ## Summary

  Implementation of the Singleton pattern documentation consists of three focused tasks:

  First, **content authoring** creates the complete SINGLETON_PATTERN.md file following the
  proven DESIGN_PATTERN_SUMMARY.md template. The file includes all required sections (Overview,
  Structure, When to Use, Trade-offs, Code Example) adapted for the Singleton pattern, with a
  decorator-based implementation using threading.Lock for thread-safety. The code example
  demonstrates the pattern with practical context, and the trade-offs section provides balanced
  coverage of both benefits and the pattern's real-world criticisms.

  Second, **validation** ensures the file meets all acceptance criteria: correct line count
  (150-200), valid GitHub-flavored markdown, runnable Python code, content clarity and
  consistency with existing pattern files, and complete coverage of required sections. This
  task verifies the output is production-ready before commit.

  Third, **commit and pipeline verification** stages the file, creates a conventional commit
  message (feat(content): add SINGLETON_PATTERN.md), and confirms the build/test/lint
  pipeline passes without errors. This completes the feature delivery.

  The sequential task ordering respects dependencies: content must be written before validation,
  and validation must pass before commit. Total estimated effort: 3.5 hours.
