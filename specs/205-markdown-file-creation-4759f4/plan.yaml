content: |
  ## Architecture Overview

  This feature implements a single markdown file creation workflow within the Sheep automated implementation
  platform, following the established pattern from features 150-204. The architecture uses a single Python
  module with focused functions that handle content generation, validation, file persistence, and git
  integration, orchestrated by a main() entry point.

  ### Module Design

  **File:** `src/sheep/features/feature_205_markdown_file_creation.py`

  **Module Structure:**

  The implementation is organized into logical function groups:

  **Content Generation (Phase 1):**
  - `generate_title()` — Generate markdown H1 heading (e.g., "# My Great Title") via Claude API with temperature=0
  - `generate_prose()` — Generate 2-3 prose sentences via Claude API with temperature=0
  - Single LLM prompt produces both title and prose together, parsed from response text

  **Validation Pipeline (Phase 2):**
  - `validate_markdown_format()` — Verify first line is H1 heading, second line is blank, rest is prose
  - `validate_sentence_count()` — Count periods to ensure exactly 2-3 sentences (with clear error message)
  - `validate_encoding()` — Verify UTF-8 encoding without byte order mark (BOM)
  - `validate_line_endings()` — Ensure Unix LF (0x0A) only, no CRLF or CR
  - `validate_file_size()` — Check file is 100-600 bytes (reasonable markdown range)
  - `validate_all()` — Orchestrate all validation checks in sequence with fail-fast behavior

  **File & Git Operations (Phase 3):**
  - `create_file(title, prose)` — Write markdown file to disk using pathlib.Path with UTF-8 encoding
  - `run_git_command(args)` — Execute git operations (add, commit, push) via subprocess.run(check=True)
  - `main()` — Orchestrate complete workflow: generate → validate → create → git operations

  **Constants:**
  ```
  FILENAME = "test-grk9g8.md"
  FEATURE_NUMBER = 205
  BRANCH_NAME = "feat/205-markdown-file-creation-4759f4"
  COMMIT_MESSAGE = "feat(205): add test-grk9g8.md markdown file"
  ```

  ### Integration with Sheep Platform

  **LLM Integration:**
  - Uses `sheep.config.llm.create_llm(temperature=0)` factory for Claude API access
  - Central configuration point handles authentication, model selection, temperature parameter
  - Temperature=0 ensures deterministic output—same feature number always generates identical prose
  - Matches explicit specification requirement: "Content is generated via Claude API with deterministic settings (temperature=0)"

  **Observability & Logging:**
  - Uses `sheep.observability.logging.get_logger(__name__)` for structured logging with Langfuse integration
  - Debug level: internal state (raw LLM response, parsed content, validation details)
  - Info level: workflow progress (LLM call completed, file created, validation passed, git operations)
  - Error level: failures with specific, actionable error messages (e.g., "Expected 2-3 sentences, found 4")
  - Enables engineers to diagnose issues without code access

  **Module Pattern:**
  - Follows identical pattern from features 150-204 (200+ test files)
  - Module placement: `src/sheep/features/feature_N_markdown_file_creation.py`
  - Single-file implementation with focused functions—easy to understand, test, maintain, and debug
  - Precedent from features 202-204 demonstrates this pattern works reliably

  ### Determinism & Reproducibility

  Temperature=0 setting ensures that identical prompts with identical models produce identical output across
  runs. For automated test systems, this is critical—each feature number generates exactly the same prose,
  enabling regression testing, debugging, and audit trails.

  The generation prompt includes explicit format specification (H1 heading on first line, blank line on
  second, then exactly 2-3 sentences) ensuring consistent parsing and validation. Features 202-204 confirm
  this approach produces correctly-formatted content on the first attempt with no formatting errors.

  ### Error Handling & Observability

  Fail-fast approach with specific, actionable error messages:
  - File creation fails immediately if file exists (prevents accidental overwrite)
  - Validation fails with specific error (e.g., "Expected 2-3 sentences, found 4 periods")
  - Git operations fail with git stderr message (enables quick diagnosis)
  - All errors logged with context for debugging and audit

  No retry logic—most failures are not transient (file exists, API error, disk full, permission denied).
  Immediate feedback enables engineers to fix root causes quickly.

  ## Key Design Decisions

  ### Decision 1: Claude API Integration with Temperature=0

  **Chosen:** Use `sheep.config.llm.create_llm(temperature=0)` for deterministic prose generation

  **Rationale:**
  - `sheep.config.llm` is the central integration point, handling API keys, model selection, parameter config
  - Temperature=0 ensures reproducible output (same feature number = same content across runs)
  - Matches specification requirement for "temperature=0 parameter to ensure deterministic, reproducible output"
  - Features 202-204 demonstrate this approach produces consistent, high-quality prose (~2-3 sec latency)
  - Already integrated with Sheep platform, no additional configuration needed

  **Rejected Alternatives:**
  - Direct anthropic SDK calls — adds unnecessary dependency, loses CrewAI integration, complicates credential management
  - Embedding prose as code constants — loses flexibility, doesn't match established pattern from 200+ prior features
  - External AI services (OpenAI, Google) — violates specification, increases latency and cost

  ### Decision 2: Single API Call with Structured Prompt

  **Chosen:** Generate title and prose together in one Claude API call, parse from response text

  **Rationale:**
  - Features 203-204 prove a single, well-crafted prompt reliably produces correctly-formatted markdown
  - Response parsing uses simple string operations (split lines, count periods)
  - Efficient: one API call (~2-3 seconds total), deterministic with temperature=0, matches pattern exactly
  - Simpler than multiple calls while ensuring thematic consistency between title and prose

  **Rejected Alternatives:**
  - Multiple API calls (title + prose separately) — doubles latency (4-6 sec), doubles cost, harder to verify consistency
  - Streaming response parsing — adds async complexity without benefit for simple prose generation
  - Template-based generation — loses natural language quality, difficult to validate format

  ### Decision 3: Manual Pattern-Based Markdown Validation

  **Chosen:** Comprehensive validation without external markdown parser library

  **Rationale:**
  - Test files have known, simple structure: H1 heading, blank line, 2-3 sentences
  - Manual validation catches all critical issues immediately with specific error messages
  - Requires only Python standard library (pathlib, str methods, file I/O)
  - CommonMark parser library not in pyproject.toml—avoids adding external dependency
  - Matches established patterns from features 150-204 (200+ files using same approach)
  - Provides clear validation failure messages for debugging

  **Validation Functions:**
  - Format: First line is "# {Title}", second line is blank, rest is prose
  - Sentence count: Count periods in prose (simple and deterministic for Claude-generated content)
  - Encoding: Binary file read checks for UTF-8 BOM and invalid UTF-8 sequences
  - Line endings: Binary file read verifies Unix LF only (no CRLF or CR)
  - File size: Check file is 100-600 bytes (appropriate for short markdown)

  **Rejected Alternatives:**
  - CommonMark parser library — adds external dependency, overkill for simple known structure, slower
  - Minimal validation (file exists only) — fails to catch formatting issues early, inconsistent with prior features
  - Regex-based validation — harder to maintain and debug than explicit string parsing

  ### Decision 4: pathlib.Path for File I/O

  **Chosen:** Use `pathlib.Path.write_text(encoding='utf-8')` with post-creation binary validation

  **Rationale:**
  - `pathlib.Path` is standard Python file I/O (recommended since 3.4, standard in 3.11+)
  - `write_text()` method handles UTF-8 encoding directly and uses Unix LF on deployment platform
  - Validation uses binary file reads to verify UTF-8 encoding (no BOM) and confirm no CRLF/CR line endings
  - Separating file creation from validation allows clear error messages and simplifies debugging
  - Matches exact pattern from features 202-204

  **Rejected Alternatives:**
  - `io.open()` with manual encoding — more verbose, requires explicit newline handling
  - `codecs` module — overly complex for simple UTF-8 file creation
  - Skip validation — fails to meet comprehensive validation requirement

  ### Decision 5: subprocess for Git Operations

  **Chosen:** Use `subprocess.run()` with `check=True` for git add, commit, and push

  **Rationale:**
  - `subprocess.run(check=True)` provides fail-fast: raises CalledProcessError on git failure
  - Git stderr output visible for debugging ("branch not found", "nothing to commit", etc.)
  - Requires only Python standard library, no abstraction layer
  - Matches features 150-204 exactly, enabling consistent behavior across all 200+ features
  - Feature branch pre-created, so push completes full workflow without merge complexity

  **Rejected Alternatives:**
  - GitPython library — available in pyproject.toml but adds abstraction layer, harder to debug failures
  - Shell scripts or bash wrapper — harder to test cross-platform, less Pythonic
  - Skip push operation — doesn't match specification or established pattern

  ### Decision 6: Fail-Fast Error Handling

  **Chosen:** Raise exception immediately on any error with specific, actionable error message

  **Rationale:**
  - In automated systems, immediate failure with clear error enables quick diagnosis and resolution
  - Features 150-204 implement fail-fast with specific messages: "File already exists", "Expected 2-3 sentences, found 4"
  - No retry logic—most failures are not transient (file exists, API error, disk full, no git user config)
  - Retrying delays feedback without solving root causes; immediate feedback enables faster fixes

  **Rejected Alternatives:**
  - Automatic retry logic (exponential backoff) — adds complexity, masks underlying problems, delays feedback
  - Graceful degradation (continue if optional step fails) — inappropriate for critical steps like file creation
  - Silent error suppression — violates specification, makes debugging impossible in production

  ### Decision 7: Single Module with Focused Functions

  **Chosen:** Organize as single module `feature_205_markdown_file_creation.py` with focused functions

  **Rationale:**
  - Single module is easy to understand, maintain, test, and debug
  - Each function has single responsibility and can be tested independently
  - Follows identical pattern from features 150-204 (proven across 200+ features)
  - Parameters with defaults enable customization without code changes
  - No global state or side effects beyond file system and git repository

  **Rejected Alternatives:**
  - Monolithic script with inline logic — harder to test, reuse, and debug
  - Multiple modules (generation.py, validation.py, git.py) — overkill for small feature, harder to maintain
  - Class-based OOP design — unnecessary for stateless operations, adds boilerplate

  ### Decision 8: Structured Logging with Langfuse Integration

  **Chosen:** Use `sheep.observability.logging.get_logger(__name__)` for all logging

  **Rationale:**
  - Central logging configuration via Sheep infrastructure
  - Langfuse integration enables observability, debugging, and audit trails
  - Using `__name__` provides feature-level filtering and context
  - Matches pattern from features 150-204, enabling consistent observability across platform

  **Log Levels:**
  - Debug: Internal state (raw LLM response, parsed content, validation checks)
  - Info: Workflow progress (LLM called, file created, validation passed, git operations)
  - Error: Failures with specific context (enables debugging without code access)

  **Rejected Alternatives:**
  - Python `print()` statements — loses structured logging, doesn't integrate with Langfuse
  - System logging (syslog) — unnecessary complexity, loses feature-level context
  - No logging — violates NFR-6 observability requirement

  ## Implementation Strategy

  ### Phase Ordering Rationale

  The four-phase approach progresses logically from foundation to completion:

  **Phase 1: Module Setup & Content Generation (30 min)**
  - Establish module structure, constants, logger
  - Initialize LLM client with temperature=0
  - Implement title and prose generation via Claude API
  - Produces raw content for validation and persistence

  **Phase 2: Validation Pipeline (20 min)**
  - Implement focused validation functions (format, sentence count, encoding, line endings, file size)
  - Each validator independent and testable in isolation
  - Functions raise specific exceptions on failure for clear error messages
  - Run before file creation to ensure only correct content persists

  **Phase 3: File Creation & Git Integration (15 min)**
  - Implement file creation with pathlib and proper encoding
  - Implement git operations (add, commit, push) via subprocess
  - Implement main() orchestration: generate → validate → create → git
  - Complete full workflow from generated content to pushed commit

  **Phase 4: Integration Testing & Verification (10 min)**
  - Execute complete end-to-end workflow
  - Verify test-grk9g8.md created and meets all success criteria
  - Confirm git history shows correct commit on feature branch
  - Validate file format and content

  ### Why This Ordering

  Content generation first produces real prose for validation testing. Validation before file creation
  ensures only correct content reaches disk (fail-fast principle). Git operations last ensure repository
  contains only validated changes. This ordering enables early error detection with minimal wasted effort.

  ## Risk Mitigation

  | Risk | Mitigation | Priority |
  | ---- | ---------- | -------- |
  | Claude API timeout or authentication failure | Fail immediately with specific API error; set appropriate timeout (~10 sec); implement with error logging | High |
  | Generated prose has wrong sentence count | Comprehensive sentence validation via period counting; test with sample content; temperature=0 ensures consistent format | High |
  | File encoding issues (BOM on some systems, CRLF on Windows) | Post-creation binary validation verifies UTF-8 without BOM, Unix LF only; pathlib handles encoding correctly | High |
  | Git repository in inconsistent state | Pre-created feature branch eliminates merge complexity; fail-fast prevents partial commits; validate git user config exists | High |
  | File test-grk9g8.md already exists | Explicit file existence check before creation, raise clear FileExistsError; prevents accidental overwrites | Medium |
  | Invalid markdown format from LLM | Comprehensive format validation before file creation catches issues early with specific error messages | Medium |
  | Insufficient Claude API quota or invalid credentials | Fail immediately with API error; verify credentials and quota before attempting feature | Medium |
  | Validation logic bugs causing false positives/negatives | Comprehensive unit test coverage for each validator; test boundary conditions (0, 1, 2, 3, 4+ sentences; empty prose) | Low |

  ## Technical Notes

  **Encoding Handling:**
  - pathlib.Path.write_text(encoding='utf-8') automatically uses Unix LF on Linux/Mac
  - Post-creation validation checks for UTF-8 BOM (EF BB BF) and verifies no CRLF (0D 0A) or CR (0D)
  - This ensures consistent encoding across all platforms

  **Determinism:**
  - temperature=0 with Claude API produces consistent output for identical inputs
  - Same feature number (205) generates identical title and prose across runs
  - Critical for automated systems where reproducibility enables regression testing

  **Performance:**
  - Single Claude API call: ~2-3 seconds typical
  - File creation and validation: <1 second
  - Git operations (add/commit): <1 second local
  - Git push: ~1-2 seconds network latency
  - Total: ~5-8 seconds execution time (well within NFR-1 requirement of 1 minute)

  **Testing Strategy:**
  - Unit tests for each validation function with valid/invalid inputs
  - Mock LLM responses for deterministic testing without API calls
  - Integration test for complete workflow using temporary feature branch
  - Edge case tests: empty prose, no periods, multiple H1 headings, boundary file sizes

  ---

  _Planning phase complete — architecture is clear, all design decisions documented and validated by
  features 202-204, implementation pattern established across 200+ prior features._
