content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-grk9g8.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-204, with 200+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system, proving the platform can consistently produce high-quality files that match established patterns.

  ## Success Criteria

  - [ ] File `test-grk9g8.md` is created at repository root (not in subdirectory)
  - [ ] File contains valid CommonMark markdown syntax with no parse errors
  - [ ] File starts with an H1 heading (title) on first line
  - [ ] File contains exactly 2-3 prose sentences after the title
  - [ ] File is encoded in UTF-8 with Unix LF line endings (0x0A, not CRLF)
  - [ ] File size is between 100-600 bytes (reasonable markdown file size range)
  - [ ] Content is generated via Claude API with deterministic settings (temperature=0)
  - [ ] File is staged in git index with no uncommitted changes
  - [ ] Git commit message follows Conventional Commits format (type: description)
  - [ ] Commit is pushed to `feat/205-markdown-file-creation-4759f4` branch
  - [ ] Git history shows single commit for this feature with no merge commits
  - [ ] No existing files in repository are modified or deleted
  - [ ] All validation checks pass with clear error messages on any failure

  ## Functional Requirements

  - **FR-1**: System must create a file with the exact filename "test-grk9g8.md" at the repository root directory (same level as README, .github/, src/, specs/, etc.)
  - **FR-2**: File content must be valid CommonMark markdown (parseable without syntax errors per CommonMark specification)
  - **FR-3**: File must begin with a single H1 heading on the first line using markdown syntax (format: "# {Title}")
  - **FR-4**: File must contain exactly 2-3 complete, grammatically correct prose sentences after the H1 heading
  - **FR-5**: Prose content must be generated using Claude API with temperature=0 parameter to ensure deterministic, reproducible output
  - **FR-6**: File must be persisted to disk with UTF-8 character encoding
  - **FR-7**: File must use Unix LF (line feed, 0x0A) line endings exclusively — no CRLF (0x0D0x0A) or other line ending formats
  - **FR-8**: File must be staged in the git index via `git add` with no uncommitted changes before push
  - **FR-9**: System must create a git commit with a message following Conventional Commits format (e.g., "feat: add test-grk9g8.md markdown file")
  - **FR-10**: Commit must be pushed to the feature branch "feat/205-markdown-file-creation-4759f4" on the remote repository
  - **FR-11**: Implementation must not modify, delete, or overwrite any existing files in the repository
  - **FR-12**: All validation failures must produce clear, actionable error messages that identify the specific validation criterion that failed

  ## Non-Functional Requirements

  - **NFR-1 Performance**: File creation, validation, and git operations (add, commit, push) must complete within 1 minute total elapsed time
  - **NFR-2 File Size**: Output markdown file must be between 100 and 600 bytes (ensuring reasonable prose length without padding)
  - **NFR-3 Clarity**: All error messages must clearly identify the validation step that failed and suggest corrective action if applicable
  - **NFR-4 Consistency**: Implementation must follow the established architectural and code patterns used in features 150-204, including module structure, import patterns, and git workflow
  - **NFR-5 Reversibility**: Implementation must not affect any repository state or configuration beyond the feature branch; all changes must be localized to the single feature branch
  - **NFR-6 Observability**: All significant operations (Claude API calls, file creation, git commands, validation checks) must be logged with sufficient detail for debugging and audit purposes
  - **NFR-7 Determinism**: Content generation must be reproducible and deterministic (via temperature=0) to support consistent test file creation across multiple runs

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content topic/style be free or constrained? | Complete freedom (user said "about anything"; established pattern shows diverse topics across 200+ features) | Flexibility matches user intent, reduces implementation complexity, and aligns with proven pattern from features 150-204 |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-204; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/features/) | Low | Creates one new feature module feature_205_markdown_file_creation.py following established pattern from 200+ prior features; no modifications to existing code |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/205-markdown-file-creation-4759f4` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Claude API access with valid authentication credentials (for LLM prose generation)
  - Target filename: `test-grk9g8.md` (specified in user query)

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-204) demonstrate successful execution of identical pattern
  - Recent commits (201-204) show exact templates and working examples
  - Feature 204 implementation provides direct code precedent for implementation approach

  **Not Required:**
  - No source code modifications to existing files
  - No changes to core platform logic in agents, flows, or tools
  - No modification of configuration files
  - No test framework integration
  - No documentation updates beyond spec files

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 200+ existing test files:

  - **Content generation**: ~3-5 minutes (generate title and 2-3 sentences via Claude API with deterministic settings)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings using pathlib)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, line endings, file size, prose quality)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (201-204) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 204 implementation serves as direct working precedent for all implementation patterns
  - File creation and git operations use only Python standard library (pathlib, subprocess) and standard git commands
  - Claude API for prose generation reduces content creation time and ensures quality

  ---

  _Requirements phase complete — ready for implementation phase_
