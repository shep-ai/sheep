content: |
  ## Summary

  This 8-task implementation progresses from foundation to completion across four phases:

  **Phase 1: Module Setup & Content Generation (15 minutes)**
  - Task 1 creates module skeleton with constants and logger (5 min)
  - Task 2 implements Claude API integration with temperature=0 for deterministic title and prose generation (10 min)
  - Foundation is established for all downstream tasks

  **Phase 2: Validation Pipeline (13 minutes)**
  - Task 3 implements markdown format validation (H1 + blank line + prose structure) (5 min)
  - Task 4 implements four focused validators: sentence count (period counting), encoding (UTF-8 without BOM), line endings (Unix LF only), file size (100-600 bytes) (8 min)
  - Comprehensive validation ensures only correct content persists to disk

  **Phase 3: File Creation & Git Integration (24 minutes)**
  - Task 5 implements file creation with pathlib and integrates complete validation pipeline (8 min)
  - Task 6 implements git operations (add, commit, push) via subprocess with fail-fast behavior (8 min)
  - Task 7 implements main() orchestration that calls all functions in correct order with comprehensive error handling and logging (8 min)
  - Complete workflow from generated content to pushed commit

  **Phase 4: Integration Testing & Verification (5 minutes)**
  - Task 8 executes end-to-end workflow, verifies all success criteria met, confirms deterministic behavior and git history (5 min)
  - Validation that implementation matches specification exactly

  **Design Principles:**
  - **Fail-fast with specific error messages:** Each task raises clear, actionable exceptions on failure
  - **Comprehensive logging:** info level for progress, debug level for troubleshooting, error level for failures
  - **Deterministic generation:** temperature=0 ensures identical content across runs for reproducibility
  - **Standard library only:** No external dependencies beyond existing Sheep infrastructure (pathlib, subprocess, logging)
  - **Pattern precedent:** All decisions validated by features 202-204, following 200+ prior features

  **TDD Approach:**
  - RED phase: Write tests that fail before implementation exists
  - GREEN phase: Implement minimal code to pass tests
  - REFACTOR phase: Improve code quality, add error handling, enhance logging

  **Effort Estimates Rationale:**
  - Small feature (S size): 10-15 minutes actual runtime
  - Implementation includes: module setup (5m), LLM integration (10m), validation (13m), file ops (8m), git ops (8m), orchestration (8m), testing (5m)
  - Buffer for error handling, logging, edge cases, and testing coverage included
  - Total: 65 minutes for complete, production-ready implementation

  ---

  _Task breakdown complete — ready for implementation phase using TDD cycles._
