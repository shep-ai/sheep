# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 212 follows the well-established markdown file creation pattern from 200+ existing test files
  and features 151-211. The implementation uses three sequential phases: file creation, comprehensive validation,
  and git integration.

  **File Creation:** Uses Python pathlib.Path.write_text() to create test-e6mp6y.md with deterministic,
  hard-coded prose content. This approach automatically handles UTF-8 encoding (no BOM) and LF line endings
  on all platforms, eliminating cross-platform compatibility issues.

  **Validation:** Implements comprehensive checks on file properties before git operations:
  - Markdown format: H1 heading on first line, blank line on second line, 2-3 sentences of prose
  - Encoding: UTF-8 without Byte Order Mark
  - Line endings: Unix-style LF (\\n) only, no CRLF or CR
  - File size: 300-800 bytes (consistent with 200+ precedent files)

  **Git Integration:** Uses subprocess.run() with shell=False to safely execute standard git commands:
  - git add test-e6mp6y.md (stage file)
  - git commit -m "feat(212): Create markdown file test-e6mp6y.md" (conventional commit)
  - git push -u origin HEAD (push to feature branch)

  ## Key Design Decisions

  **1. File I/O: pathlib.Path.write_text() with explicit UTF-8 encoding**

  Chosen approach: Python pathlib.Path.write_text() with "utf-8" encoding parameter

  Alternatives considered:
  - Direct open()/write() operations: More verbose, requires manual encoding/line ending handling
  - Third-party libraries: Unnecessary abstraction that adds external dependencies

  Rationale: pathlib.Path.write_text() is the standard Pythonic approach in Python 3.11+. It automatically
  encodes content as UTF-8 without BOM and ensures LF line endings on all platforms (Windows/macOS/Linux).
  This matches the established pattern from feature 211 and eliminates cross-platform issues. No external
  dependencies required—uses Python standard library only. Research decision #1 (File I/O Mechanism)
  confirms this approach.

  **2. Content Generation: Hard-Coded Deterministic Prose**

  Chosen approach: Hard-coded, deterministic prose content with no randomization

  Alternatives considered:
  - LLM/API-based generation (GPT, Anthropic API): Requires external API calls, introduces network latency,
    violates NFR-4 (no external dependencies), makes testing unreliable
  - Procedural/template generation: Unnecessary complexity for a 2-3 sentence test file

  Rationale: Hard-coded content provides deterministic, reproducible output that is fully transparent and
  auditable. The requirement spec allows free-form arbitrary topic selection with no domain constraints.
  This approach matches all 200+ existing test markdown files and feature 211. Hard-coded content requires
  no external dependencies, network calls, or complex generation logic, and executes instantly. Research
  decision #3 (Content Generation Strategy) confirms this approach.

  **3. Validation Scope: Comprehensive Multi-Property Validation**

  Chosen approach: Validate all file properties (format, encoding, line endings, size)

  Alternatives considered:
  - Minimal validation (file exists only): Insufficient quality assurance; provides no confidence in correctness
  - Automated content analysis (NLP-based grammar checking): Adds external dependency, contradicts NFR-4

  Rationale: Feature 211 reference implementation demonstrates comprehensive validation as the established
  pattern. This provides high confidence in file correctness before git operations. NFR-8 explicitly requires
  comprehensive validation of file properties. Validation checks are fail-fast: first error stops execution
  with clear error reporting. Research decision #4 (Validation Scope) confirms this approach.

  **4. Git Integration: subprocess.run() with shell=False**

  Chosen approach: subprocess.run() with shell=False for secure git command execution

  Alternatives considered:
  - GitPython library: Unnecessary abstraction for 3 simple sequential git commands; subprocess is more
    transparent and secure
  - Direct file system manipulation: Would require manual git status checking; subprocess provides standard,
    auditable git operations

  Rationale: subprocess.run() with shell=False provides secure, transparent git command execution without
  command injection risks. The approach uses standard git CLI commands (git add, git commit, git push) which
  are reliable and auditable. For simple operations, subprocess is simpler than GitPython wrapper. Matches
  feature 211 pattern. Research decision #2 (Git Integration Mechanism) confirms this approach.

  **5. Error Handling: Fail-Fast with Clear Error Reporting**

  Chosen approach: Fail immediately with specific exception types and clear error messages

  Alternatives considered:
  - Silent failure: Hides errors, complicates debugging
  - Retry logic with exponential backoff: Unnecessary for deterministic operations that should succeed first attempt

  Rationale: Fail-fast approach with proper exception handling and logging matches feature 211 pattern.
  Catches specific exceptions (FileNotFoundError, ValueError, subprocess.CalledProcessError) and returns
  exit codes 0 (success) or 1 (failure) for integration with Sheep automation platform. Enables transparent
  error reporting and faster debugging. Research decision #5 (Error Handling Strategy) confirms this approach.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (File Creation) comes first** because it establishes the foundation. All subsequent validation
     and git operations depend on the file existing with correct content.

  2. **Phase 2 (Validation) comes second** because it catches errors early before git operations. Fail-fast
     semantics prevent pushing incorrect files to the repository. Validation adds ~2-3 minutes of work but
     provides high confidence in correctness.

  3. **Phase 3 (Git Integration) comes last** because it only runs after file correctness is verified. Git
     operations (push, commit) are only executed after comprehensive validation succeeds.

  **Task Dependencies:**
  - File creation (task-1) has no dependencies
  - All validation tasks depend on file creation and each other in order
  - Git operations depend on all validation passing

  **Parallel Execution:**
  All phases are sequential (parallel: false) because of strict dependencies. File must exist before
  validation; validation must pass before git operations.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding issues (UTF-8 BOM or CRLF line endings) | File would fail validation or appear corrupted in some editors | Use pathlib.Path.write_text() which automatically ensures UTF-8 without BOM and LF line endings on all platforms. Validate encoding and line endings explicitly before git operations. |
  | Git configuration missing (user.name, user.email) | git commit would fail with unclear error message | Fail-fast error handling will catch subprocess.CalledProcessError immediately and report it clearly. User can fix git config and retry. |
  | Prose content validation failures | File fails validation due to grammar, coherence, or sentence count issues | Hard-code prose content that is known to be grammatically correct and coherent. Explicit sentence count validation catches errors. |
  | File size out of range | Validation fails if prose is too short or too long | Hard-code prose to naturally fall within 300-800 byte range. Validate size explicitly. File size is deterministic and predictable. |
  | Markdown format validation | Fails if structure doesn't match expected format | Explicit validation checks for H1 heading on line 1, blank line on line 2, exactly 2-3 sentences. Hard-coded content ensures format is correct. |
