# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-25
  - **Decision Status:** All technical decisions finalized with reference to feature 211 and 200+ precedent files

  ## Overview

  Feature 212 follows the well-established markdown file creation pattern from features 151-211. This research evaluates the technical approach for implementing a simple, deterministic feature that creates a markdown test file with hard-coded content, comprehensive validation, and git integration.

  All major architectural decisions have been predetermined by the extensive precedent of 200+ existing test markdown files and the reference implementation in feature 211. This feature requires no new technical approaches or external dependencies.

  ## Technology Decisions

  ### 1. File I/O Mechanism: pathlib.Path.write_text()

  **Chosen:** Python `pathlib.Path.write_text()` with explicit UTF-8 encoding

  **Rejected Alternatives:**
  - **Direct open()/write() operations** — More verbose, requires manual encoding specification and line ending conversion; pathlib provides automatic handling
  - **Third-party file libraries (pathlib-plus, upath)** — Adds external dependencies for no additional benefit; pathlib is built-in and sufficient

  **Rationale:** pathlib is the standard, Pythonic file I/O mechanism in Python 3.11+. The `write_text()` method automatically:
  - Encodes content as UTF-8 (Python 3 default, no BOM)
  - Handles line endings as LF (\n) on all platforms
  - Creates the file with proper permissions
  - Provides a clean, readable API

  This approach is established in feature 211 and all 200+ existing test markdown files. It requires zero external dependencies and works identically across Linux, macOS, and Windows.

  **Implementation Pattern:**
  ```python
  markdown_content = f"# {TITLE_TEXT}\n\n{PROSE_CONTENT}\n"
  file_path = Path(FILENAME)
  file_path.write_text(markdown_content, encoding="utf-8")
  ```

  ### 2. Git Integration: subprocess.run() with git CLI

  **Chosen:** `subprocess.run()` with `shell=False` for git CLI command execution

  **Rejected Alternatives:**
  - **GitPython library** — Available as project dependency but adds unnecessary complexity for 3 simple sequential git commands; subprocess is more transparent and secure
  - **Direct file system manipulation** — Would require manual git status checking; subprocess provides standard, auditable git operations

  **Rationale:** subprocess.run() with shell=False provides secure, transparent git command execution:
  - **Security:** shell=False prevents command injection vulnerabilities
  - **Transparency:** Uses standard git CLI commands that are visible, auditable, and consistent with git best practices
  - **Simplicity:** For sequential git add/commit/push, subprocess is simpler than GitPython wrapper
  - **Consistency:** Matches feature 211 reference implementation pattern

  **Implementation Pattern:**
  ```python
  # Stage file
  subprocess.run(["git", "add", FILENAME], check=True, capture_output=True, text=True)

  # Commit with conventional message
  subprocess.run(["git", "commit", "-m", COMMIT_MESSAGE], check=True, capture_output=True, text=True)

  # Push to remote
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True, capture_output=True, text=True)
  ```

  The `check=True` parameter provides fail-fast behavior: any git command failure raises `subprocess.CalledProcessError` immediately.

  ### 3. Content Generation: Hard-Coded Deterministic Prose

  **Chosen:** Hard-coded, deterministic prose content with no randomization

  **Rejected Alternatives:**
  - **LLM/API-based generation (GPT, Anthropic API, etc.)** — Requires external API calls, introduces network latency and non-determinism, violates NFR-4 (no external dependencies beyond standard library), makes testing unreliable
  - **Procedural/template-based generation** — Adds unnecessary complexity; the requirement is only 2-3 sentences of arbitrary prose

  **Rationale:** Hard-coded content provides:
  - **Deterministic output:** Identical on every execution, fully reproducible
  - **Transparent content:** Source code is auditable; no hidden dependencies or API calls
  - **Fast execution:** No network latency or API call overhead
  - **No dependencies:** Uses only Python standard library
  - **Precedent:** Matches all 200+ existing test markdown files and feature 211 reference implementation
  - **Flexibility:** Requirement allows free-form arbitrary topic selection

  **Prose Selection:** Free-form topic of choice (e.g., technology, creativity, nature, philosophy, etc.). The requirement spec explicitly allows "about anything" with no domain constraints.

  **File Size Strategy:** Hard-coded prose is composed to naturally fall within the 300-800 byte requirement observed in precedent test files (typically 350-450 bytes for 2-3 sentences with an H1 title).

  ### 4. Validation Approach: Comprehensive Multi-Check Validation

  **Chosen:** Comprehensive validation of all file properties (encoding, format, content, size)

  **Rejected Alternatives:**
  - **Minimal validation (file exists only)** — Insufficient quality assurance; provides no confidence in file correctness
  - **Automated content analysis (NLP-based grammar checking)** — Adds external dependencies (violates NFR-4); contradicts the requirement for no external dependencies

  **Rationale:** Feature 211 reference implementation demonstrates comprehensive validation as the established pattern. Validation checks are:

  1. **File Existence:** Verify file was created successfully
  2. **Markdown Format:** Ensure first line is H1 heading (`# `), second line is blank, exactly one H1 in file
  3. **Sentence Count:** Extract prose content, count periods, verify 2-3 sentences
  4. **UTF-8 Encoding:** Verify no UTF-8 BOM (Byte Order Mark); validate UTF-8 decodability
  5. **Line Endings:** Ensure only LF (\n), no CRLF (\r\n) or CR (\r)
  6. **File Size:** Verify 300-800 bytes (consistent with precedent files)

  **Validation Benefits:**
  - Catches errors early with fail-fast semantics (first error stops execution)
  - High confidence in file correctness before git operations
  - Detailed error logging enables debugging
  - Matches requirement NFR-8 (comprehensive validation)
  - Aligns with feature 211 pattern

  **Time Cost:** Validation adds ~2-3 minutes of total work (reading file, parsing, checking multiple properties). Cost is justified by confidence gained.

  ### 5. Error Handling: Fail-Fast with Proper Exception Management

  **Chosen:** Fail-fast approach with specific exception types, logging, and exit codes 0/1

  **Rejected Alternatives:**
  - **Silent failure:** Would hide errors and complicate debugging
  - **Retry logic with exponential backoff:** Unnecessary for deterministic file operations and git commands that should succeed on first attempt

  **Rationale:**
  - **Fail-fast:** Stops immediately on error, prevents cascading failures
  - **Transparent:** Logs all errors with context for debugging
  - **Exit codes:** Returns 0 (success) or 1 (failure) for integration with automation platform
  - **Specific exceptions:** Catches FileNotFoundError, ValueError, subprocess.CalledProcessError separately for better error handling

  **Pattern from feature 211:**
  ```python
  try:
      # Phase 1: Create file
      # Phase 2: Validate
      # Phase 3: Git operations
      return 0  # Success
  except (FileNotFoundError, ValueError, subprocess.CalledProcessError) as e:
      _logger.error(f"Workflow failed: {e}")
      return 1  # Failure
  ```

  ## Library Analysis

  | Library/Technology | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | Python pathlib | File creation, UTF-8 encoding, LF line endings | **USE** | Built-in, handles encoding and line endings automatically, cross-platform consistent |
  | subprocess | Git command execution | **USE** | Standard library, secure with shell=False, transparent git operations |
  | GitPython | Git operations (alternative) | **REJECT** | Unnecessary abstraction for simple git add/commit/push sequence |
  | External AI APIs (GPT, Anthropic, etc.) | Content generation (alternative) | **REJECT** | Violates NFR-4 (no external dependencies), introduces network latency and non-determinism |
  | NLP libraries (spaCy, TextBlob, NLTK) | Content validation (alternative) | **REJECT** | Violates NFR-4 (no external dependencies), unnecessary for manual prose verification |
  | File I/O alternatives (open/write, pathlib-plus) | File creation (alternative) | **REJECT** | pathlib.Path.write_text() is simpler, built-in, and established pattern |

  ## Security Considerations

  ### 1. Command Injection Prevention
  - **Approach:** subprocess.run() uses shell=False and explicit argument list
  - **Impact:** Prevents command injection attacks from malformed git commands or file paths
  - **Example:** Safe execution of `git add test-e6mp6y.md` without shell interpretation

  ### 2. File Encoding Validation
  - **Approach:** Explicit UTF-8 encoding in write_text(); validation checks for no BOM
  - **Impact:** Prevents encoding issues that could cause compatibility problems across systems
  - **Example:** Detects if file was accidentally created with UTF-8 BOM or different encoding

  ### 3. Line Ending Normalization
  - **Approach:** pathlib.Path.write_text() automatically produces LF line endings on all platforms
  - **Impact:** Ensures consistent line endings across Windows/macOS/Linux
  - **Example:** Validation detects accidental CRLF (Windows) or CR (Mac) line endings

  ### 4. File Permissions
  - **Approach:** pathlib.Path.write_text() uses default file permissions (user read/write)
  - **Impact:** Created file is readable/writable by owner, safe for repository inclusion
  - **Note:** Git tracks and preserves file permissions in repository

  ### 5. Git Operations Security
  - **Approach:** Using git CLI with configured user.name/user.email
  - **Impact:** Commits are attributed correctly; no credential storage in code
  - **Note:** Git configuration must be set in environment (CI/CD or local development)

  ## Performance Implications

  ### 1. File Creation Performance
  - **Estimated time:** <100ms for file write
  - **Scalability:** Single file write is I/O-bound but extremely fast
  - **Optimization:** Already optimal; no further optimization needed

  ### 2. Validation Performance
  - **Estimated time:** ~2-3 minutes of work (6 sequential validation checks)
  - **Each check:** <10ms per check (file stat, read, parse)
  - **Total overhead:** ~100-150ms total validation time

  ### 3. Git Operations Performance
  - **git add:** ~10-50ms (file staging)
  - **git commit:** ~50-200ms (create commit object, update refs)
  - **git push:** ~500-2000ms (depends on network, repository size, remote CI/CD)
  - **Total git time:** ~1-2 seconds (network-bound, not code-bound)

  ### 4. End-to-End Performance
  - **File creation + validation:** ~300-500ms
  - **Git operations:** ~1-2 seconds
  - **Total estimated time:** ~2-3 seconds of actual execution
  - **Specification requirement:** 10-15 minutes total (includes manual composition and review)

  ## Architecture Notes

  ### Integration with Sheep Platform
  - Feature fits into the Sheep automated implementation system as a "simple file creation" test case
  - Serves as a minimal validation of file creation + git workflow integration
  - Precedent of 200+ identical test files demonstrates this pattern is production-proven
  - No modifications to source code or dependencies required

  ### Consistency with Precedent
  - Feature 211 (immediately preceding) demonstrates identical architecture and approach
  - Features 209-210 show the same pattern with no variations
  - All 200+ existing test markdown files follow identical structure (H1, blank line, 2-3 sentences)
  - Architectural decisions are predetermined and not requiring research or architectural decisions

  ### Deterministic Nature
  - File creation is deterministic: same filename, same content, same format on every execution
  - Git operations are idempotent within a feature branch (can be re-run without duplicate commits if needed)
  - No randomization, AI generation, or external dependencies introduce non-determinism
  - Fully reproducible and testable

  ## Conclusion

  Feature 212 is a straightforward implementation of the well-established markdown file creation pattern. All technical decisions have been predetermined by 200+ existing test files and the immediate precedent of feature 211. The approach is:

  - **Simple:** Single file creation with hard-coded content, no complexity
  - **Proven:** Identical pattern used in 200+ existing test files across the repository
  - **Fast:** Entire workflow (creation, validation, git integration) completes in ~2-3 seconds
  - **Secure:** Uses subprocess with shell=False and explicit argument lists
  - **No new dependencies:** Uses only Python 3.11+ standard library and git CLI
  - **Consistent:** Matches feature 211 and all precedent implementations exactly

  No open questions, architectural decisions, or technical risks remain. Implementation is straightforward and can proceed immediately.

