content: |
  ## Technical Analysis

  ### Architecture Overview

  Feature 303 follows the well-established pattern from 300+ prior iterations:

  ```
  feature_303_markdown_file_creation.py
    └─ create_test_t4bvyv_markdown_file(repo_path)
         └─ calls: content_generators.create_markdown_file(
              filename="test-t4bvyv.md",
              repo_path=repo_path,
              feature_number=303
            )
              ├─ generate_markdown_content()
              │   └─ Claude API (via get_reasoning_llm)
              ├─ write_markdown_file(content, "test-t4bvyv.md")
              ├─ validate_markdown_file(filepath)
              ├─ commit_markdown_file(filepath, content, feature_number=303)
              └─ push_markdown_file()
  ```

  This architecture ensures:
  - **Single Responsibility**: Feature module handles only orchestration and logging
  - **Code Reuse**: All implementation logic is in proven, tested content_generators module
  - **Consistency**: Pattern identical to features 300-302
  - **Testability**: Each component (generate, write, validate, commit, push) is independently tested
  - **Maintainability**: Bug fixes in content_generators automatically benefit all 300+ features

  ### Content Generation Pipeline

  1. **Generation (via Claude API)**
     - Input: MARKDOWN_GENERATION_PROMPT (generates H1 title + 2-3 sentences about any topic)
     - Model: Claude via CrewAI LLM abstraction (get_reasoning_llm, temperature=0.2)
     - Output: String with structure "# Title\n\nSentence 1. Sentence 2. Sentence 3."
     - Validation: _validate_markdown_content() checks H1 prefix, sentence count (2-3), minimum length

  2. **File Writing**
     - Path: repository root (resolved via Path.cwd())
     - Filename: test-t4bvyv.md (safe filename validation in write_markdown_file)
     - Encoding: UTF-8 without BOM (Python 3 default open(..., encoding="utf-8"))
     - Line Endings: Unix LF (Python text mode normalization on all platforms)
     - Validation: File exists, size > 0, encoding readable

  3. **Structure Validation (validate_markdown_file)**
     - H1 heading check: must start with "# "
     - Blank line check: line 2 must be empty (separator between heading and prose)
     - Prose check: lines 3+ contain 2-3 sentences (period count)
     - Encoding: UTF-8 decodable, no BOM (b"\xef\xbb\xbf")
     - Line endings: no CRLF (b"\r\n"), only LF
     - Trailing newline: required for Unix convention

  4. **Git Workflow**
     - Add: git add test-t4bvyv.md
     - Commit: conventional message "feat(303): create markdown file test-t4bvyv.md with prose content"
     - Push: git push -u origin current_branch (upstream tracking)

  ### Library Analysis

  | Technology | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | Python 3.11+ | Runtime | Use | Required, widely deployed, offers pathlib, subprocess, standard lib features |
  | pathlib.Path | File operations | Use | Cross-platform (Unix/Windows paths unified), safe path joining, avoids os.path issues |
  | subprocess | Git operations | Use (indirect) | Content_generators uses this via git_add(), git_commit(), git_push() functions. Proven across 300+ features. |
  | CrewAI LLM | LLM abstraction | Use (indirect) | Multi-provider abstraction (Anthropic, OpenAI, Google, Cursor). Configured via sheep.config.llm. Provides get_reasoning_llm(), get_fast_llm() factories. |
  | Anthropic Claude API | Content generation | Use (via CrewAI) | Creates coherent prose reliably. Configured via environment variable ANTHROPIC_API_KEY. Multiple model options via settings. |
  | Markdown (CommonMark) | Output format | Use | Universal format, well-specified, human-readable, Git-friendly. Validation via sentence count + structure checks. |
  | Git | Version control | Use (via subprocess) | Local version control, ensures commit + push workflow. Branch detection automatic. |

  **No new dependencies needed.** All technologies are already in use across the codebase.

  ### Security Considerations

  1. **Input Security**
     - No user input: Feature parameters (filename, feature number) are hardcoded in feature module
     - No injection vectors: Filename validated (no "/" or "\" or "." prefix) in write_markdown_file()
     - Content from trusted source: Claude API is Anthropic service, content is internally generated

  2. **File I/O Security**
     - No path traversal: Filename is validated before use, stored only at repo root
     - Safe encoding: UTF-8 without BOM prevents byte-order attacks
     - Unix line endings: LF normalization prevents CRLF injection
     - File permissions: Inherited from repository (already managed via git config)

  3. **API Security**
     - Credentials: ANTHROPIC_API_KEY managed via sheep.config.llm (environment variable or secrets)
     - Transport: CrewAI LLM handles HTTPS, request signing, error codes
     - Rate limiting: Anthropic API handles rate limiting, retries configurable
     - No credential leakage: Logs exclude API keys (structured logging sanitizes sensitive data)

  4. **Git Security**
     - SSH keys: Repository assumes SSH configured (inherited from existing git setup)
     - Commit verification: Conventional commit format prevents typos, enables parsing
     - Branch safety: Upstream tracking (git push -u) prevents accidental force push
     - Local operations: No network exposure beyond git push

  **Risk Assessment: LOW**
  - All operations are local or to trusted services
  - No external user input reaches critical operations
  - Encoding/decoding is validated
  - Credentials are isolated

  ### Performance Considerations

  1. **Bottleneck Analysis**
     | Operation | Duration | Notes |
     | --- | --- | --- |
     | Claude API call | 2–5 minutes | LLM inference, streaming response, validation |
     | File write | <100 ms | Disk I/O, negligible |
     | Validation | <50 ms | Binary read for encoding/BOM check, text parsing for structure |
     | Git add | <100 ms | Staging operation, negligible |
     | Git commit | <500 ms | Creating commit object, writing index |
     | Git push | 1–3 seconds | Network round trip to remote, assumes fast connection |
     | **Total** | **2–5 minutes** | API call dominates; other operations negligible |

  2. **Optimization Opportunities (out of scope)**
     - Batch multiple features: Could parallelize API calls across multiple features (feature 304, 305, etc.)
     - Caching: Unnecessary for one-time operation per feature
     - Streaming: CrewAI LLM already handles streaming response
     - Async: Feature module is synchronous; parallelization would require async/await refactor

  3. **Performance Implications**
     - Total execution time aligns with spec estimate (8–15 minutes including setup/teardown)
     - No performance-critical loops or recursion
     - Validation overhead is minimal (<1% of total time)
     - Suitable for CI/CD integration with standard 15-minute timeout

  ### Integration Points

  1. **External Services**
     - **Anthropic Claude API** (via CrewAI LLM)
       - Configured via sheep.config.llm.get_reasoning_llm()
       - Credentials: ANTHROPIC_API_KEY environment variable
       - Fallback: None (required for feature to function)
       - Error handling: CrewAI LLM raises exceptions on API failures

  2. **Local Infrastructure**
     - **sheep.content_generators module**
       - Functions: generate_markdown_content(), write_markdown_file(), validate_markdown_file(),
                   commit_markdown_file(), push_markdown_file(), create_markdown_file()
       - Status: Mature, tested across 300+ features, stable API
       - Assumptions: Called from repository context (cwd is repo root)

     - **sheep.observability.logging**
       - Function: get_logger(__name__) for structured logging
       - Status: Standard pattern across codebase
       - Assumption: Configured with appropriate log levels

     - **sheep.config.llm**
       - Functions: get_reasoning_llm(), get_fast_llm()
       - Status: Factory pattern, well-tested
       - Assumptions: Settings properly configured, API key available

  3. **System Dependencies**
     - **Git CLI**: Required (git add, git commit, git push)
       - Assumption: Git is installed and in PATH
       - Fallback: None (git operations will fail gracefully with exceptions)

     - **Python 3.11+**: Required
       - Assumption: Runtime is Python 3.11 or newer
       - Fallback: None (pathlib requires 3.4+, but CrewAI requires 3.11+)

  ### Data Model Changes

  **None.** Feature 303 does not require changes to any data models:
  - No database schema changes
  - No new tables or fields
  - Markdown file is standalone (no relationship to other data)
  - Git commit is standard format (conventional commits)
  - No serialization changes

  ### Success Criteria Mapping

  Each success criterion from the spec maps directly to the orchestration workflow:

  | Criterion | Implemented By | Validation |
  | --- | --- | --- |
  | File test-t4bvyv.md created in repo root | write_markdown_file() | File.exists() check |
  | H1 markdown heading (# Title) | generate_markdown_content() + _validate_markdown_content() | content.startswith("# ") |
  | Blank line after H1 | write_markdown_file() (output of generate_markdown_content()) | validate_markdown_file() checks lines[1] == "" |
  | 2-3 sentences of prose | generate_markdown_content() + _validate_markdown_content() | Period count validation: 2-3 |
  | Prose coherent and via Claude API | Claude LLM (get_reasoning_llm, temp=0.2) | API call, validation format |
  | UTF-8 without BOM | write_markdown_file() (Python default) + validate_markdown_file() | Binary check for b"\xef\xbb\xbf" absent |
  | Unix LF line endings | write_markdown_file() (Python normalization) + validate_markdown_file() | Binary check for b"\r\n" absent |
  | Passes validate_markdown_file() | validate_markdown_file() | Comprehensive structural check |
  | File staged in git | commit_markdown_file() (calls GitCommitTool or git_add) | git status --porcelain |
  | Commit message format | commit_markdown_file() | Message = "feat(303): create markdown file test-t4bvyv.md with prose content" |
  | Pushed to remote | push_markdown_file() (calls GitPushTool or git_push) | git log --graph shows commit on origin branch |
  | All validation checkpoints pass | Multiple validate_*() calls in create_markdown_file() | Exception raised if any fails |

  ### Implementation Pattern (from feature_302 for reference)

  ```python
  # feature_303_markdown_file_creation.py
  from pathlib import Path
  from sheep.content_generators import create_markdown_file
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  FEATURE_NUMBER = 303
  FEATURE_NAME = "markdown-file-creation-67deea"
  MARKDOWN_FILENAME = "test-t4bvyv.md"

  def create_test_t4bvyv_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """Create markdown file for feature 303."""
      if repo_path is None:
          repo_path = str(Path.cwd())

      _logger.info(f"Creating feature {FEATURE_NUMBER} markdown file: {MARKDOWN_FILENAME}")

      try:
          result = create_markdown_file(
              filename=MARKDOWN_FILENAME,
              repo_path=repo_path,
              feature_number=FEATURE_NUMBER
          )
          _logger.info(f"Successfully created feature {FEATURE_NUMBER}: {MARKDOWN_FILENAME}")
          return result
      except Exception as e:
          _logger.error(f"Failed to create feature {FEATURE_NUMBER}: {e}")
          raise

  def main() -> int:
      """Execute feature 303."""
      try:
          result = create_test_t4bvyv_markdown_file()
          _logger.info(f"Feature {FEATURE_NUMBER} completed successfully")
          print("Feature 303 created successfully:")
          print(f"  File: {result['filepath']}")
          print(f"  Size: {len(result['content'])} bytes")
          print(f"  Message: {result['commit_message']}")
          return 0
      except Exception as e:
          _logger.error(f"Feature {FEATURE_NUMBER} failed: {e}")
          print(f"Error: Failed to create feature {FEATURE_NUMBER}: {e}")
          return 1

  if __name__ == "__main__":
      exit(main())
  ```

  This implementation:
  - Follows exact pattern from feature_302 (proven across 300+ features)
  - Reuses proven infrastructure (no custom logic)
  - Includes structured logging at info and error levels
  - Handles exceptions gracefully with logging
  - Returns structured result (filepath, content, message, push_result)
  - Supports main() for standalone execution

