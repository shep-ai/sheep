# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 303 follows the **thin-wrapper orchestration pattern** proven across 300+
  prior iterations. The architecture is minimal and delegation-focused:

  ```
  feature_303_markdown_file_creation.py
    ├─ Constants: FEATURE_NUMBER=303, MARKDOWN_FILENAME=\"test-t4bvyv.md\"
    ├─ create_test_t4bvyv_markdown_file(repo_path: str | None) → dict
    │   └─ calls: content_generators.create_markdown_file(
    │        filename=\"test-t4bvyv.md\",
    │        repo_path=repo_path,
    │        feature_number=303
    │      )
    │        ├─ generate_markdown_content() [Claude API]
    │        ├─ write_markdown_file() [File I/O]
    │        ├─ validate_markdown_file() [Structure validation]
    │        ├─ commit_markdown_file() [Git add/commit]
    │        └─ push_markdown_file() [Git push]
    └─ main() → int [Standalone execution entry point]
  ```

  This architecture ensures:
  - **Single Responsibility**: Feature module handles only orchestration and logging
  - **Code Reuse**: All implementation logic is in proven, tested content_generators module
  - **Consistency**: Pattern identical to features 300-302
  - **Simplicity**: No custom logic, error handling, or data transformation
  - **Maintainability**: Bug fixes in content_generators automatically benefit all 300+ features

  The feature module is approximately 40-50 lines of code (imports, constants, docstrings).
  All validation, file I/O, git workflow, and API integration logic is delegated to
  content_generators functions.

  ## Key Design Decisions

  ### Decision 1: Thin Wrapper vs Custom Implementation
  **Chosen**: Implement as thin wrapper calling existing content_generators.create_markdown_file()

  **Rationale**:
  - The orchestration function create_markdown_file() already handles the entire workflow:
    generate content, write file, validate structure, commit, push
  - Implementation in features 300-302 demonstrates this pattern is proven and stable
  - Custom reimplementation would duplicate tested code, increase maintenance burden,
    and reduce consistency across the feature family
  - The wrapper adds clarity through explicit feature-specific orchestration without
    adding unnecessary complexity

  **Trade-offs**: Minimal — thin wrapper provides perfect balance between reuse and clarity

  ### Decision 2: Error Handling Delegation
  **Chosen**: Delegate error handling to content_generators infrastructure with logging

  **Rationale**:
  - Each step in content_generators (generate, write, validate, commit, push) has
    comprehensive error handling and raises exceptions on failure
  - Feature module only needs to log errors and re-raise; no custom catch/handle logic needed
  - This matches the approach in features 300-302 and avoids code duplication
  - Structured logging (sheep.observability.logging) provides visibility without overhead

  **Trade-offs**: None — delegation simplifies code while maintaining full observability

  ### Decision 3: Content Generation Strategy
  **Chosen**: Use content_generators.create_markdown_file() which calls Claude API internally

  **Rationale**:
  - Requirement NFR-1 specifies \"via sheep.config.llm.get_reasoning_llm()\"
  - content_generators.generate_markdown_content() calls get_reasoning_llm() with
    temperature=0.2 for focused, coherent prose
  - Feature module does not need to call Claude API directly; orchestration function
    handles this transparently
  - This ensures consistency in LLM model selection and temperature settings

  **Trade-offs**: None — transparent delegation matches requirements perfectly

  ### Decision 4: File Path Resolution
  **Chosen**: Use Path.cwd() as repository root (passed via repo_path parameter)

  **Rationale**:
  - content_generators.write_markdown_file() uses repo_path to resolve file path:
    Path(repo_path) / filename
  - Feature execution always occurs within repository context (feature agent ensures this)
  - pathlib.Path is cross-platform (handles Unix/Windows path differences)
  - This matches the pattern in features 300-302

  **Trade-offs**: None — Path.cwd() is safe and proven

  ### Decision 5: Git Workflow via Existing Helpers
  **Chosen**: Use content_generators.commit_markdown_file() and push_markdown_file()

  **Rationale**:
  - These functions already implement git add, git commit with conventional format,
    and git push with upstream tracking
  - Reimplementing git operations would duplicate error handling and branch detection logic
  - Feature module does not interact with git directly; orchestration function handles this

  **Trade-offs**: None — delegation simplifies code and ensures consistency

  ## Implementation Strategy

  ### Why This Order?

  **Phase 1 (Foundation)** comes first because:
  - Module file must exist before any implementation
  - Constants define feature identity and must be in place
  - Imports establish dependencies

  **Phase 2 (Implementation)** follows because:
  - Wrapper function depends on module file existing
  - main() depends on wrapper function being implemented
  - Logging and error handling wrap the core logic

  **Phase 3 (Testing)** comes last because:
  - Tests verify the implementation works end-to-end
  - Module and functions must exist before testing
  - Integration tests validate against actual file system and git

  ### Why Each Decision Matters

  The thin-wrapper pattern is critical because:
  1. It avoids code duplication across 300+ features
  2. It centralizes maintenance (bugs fixed once in content_generators)
  3. It ensures feature parity (same logic, same validation)
  4. It reduces implementation time (5-15 minutes vs hours of custom code)
  5. It provides a clear template for future features (304, 305, etc.)

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Claude API rate limit exceeded | Low | High | Inherent to content_generators; fails gracefully with exception. Retry logic in CrewAI LLM. |
  | Git push fails due to upstream branch | Low | Medium | content_generators.push_markdown_file() handles branch detection automatically. Falls back to feature branch if origin/main unavailable. |
  | File encoding issues (BOM or CRLF) | Very Low | High | validate_markdown_file() checks for BOM (b\"\\xef\\xbb\\xbf\") and CRLF (b\"\\r\\n\"). Python text mode auto-normalizes to LF on all platforms. |
  | Concurrent feature execution | Very Low | High | Git operations are atomic. File naming (test-t4bvyv.md) is unique to feature 303. Worktree isolation prevents conflicts. |
  | Module import fails | Very Low | Low | Imports are standard library (pathlib, subprocess). sheep.* imports are same as features 300-302. Fails immediately at runtime if missing. |
  | Content validation fails | Low | High | generate_markdown_content() + _validate_markdown_content() ensure H1 and 2-3 sentences. Multiple checkpoint validation catches failures early. |

  **Overall Risk Assessment: LOW**
  - All infrastructure is proven across 300+ features
  - Architecture provides multiple validation checkpoints
  - Error handling is comprehensive and transparent
  - No novel technical approaches; pattern is fully established

  ## Validation Strategy

  Multiple checkpoints ensure reliability:

  1. **Content Generation** (in generate_markdown_content):
     - _validate_markdown_content() checks H1 prefix, sentence count (2-3), minimum length

  2. **File Write** (in write_markdown_file):
     - File exists check, size > 0, encoding readable as UTF-8

  3. **Structure Validation** (in validate_markdown_file):
     - H1 heading format, blank line separator, sentence count (2-3 periods)
     - UTF-8 encoding without BOM (b\"\\xef\\xbb\\xbf\")
     - Unix LF line endings (no CRLF), trailing newline

  4. **Git Operations** (in commit/push functions):
     - git add: file staged successfully
     - git commit: commit created with conventional message
     - git push: commit pushed to remote

  Feature module trusts these checkpoints; no additional validation needed.

  ## Success Criteria Validation

  Each success criterion maps directly to infrastructure validation:

  | Criterion | Infrastructure | Validation |
  | --------- | --------------- | ---------- |
  | File created in repo root | write_markdown_file() | Path.exists() check |
  | H1 heading present | generate_markdown_content() | content.startswith(\"# \") |
  | Blank line after H1 | validate_markdown_file() | lines[1] == \"\" |
  | 2-3 sentences | validate_markdown_content() | period_count == 2 or 3 |
  | Prose coherent | Claude API (temp=0.2) | LLM generation + validation |
  | UTF-8 no BOM | write_markdown_file() + validate | BOM check: b\"\\xef\\xbb\\xbf\" absent |
  | Unix LF endings | validate_markdown_file() | CRLF check: b\"\\r\\n\" absent |
  | Git staging | commit_markdown_file() | git add succeeds |
  | Conventional commit | commit_markdown_file() | message format verified |
  | Push to remote | push_markdown_file() | git push succeeds |

  ## Conclusion

  Feature 303 requires no new architectural decisions or technical innovation. All
  infrastructure is proven, tested, and consistent across 300+ prior features. The
  implementation is a straightforward thin wrapper following the exact pattern from
  features 300-302, differing only in feature number (303) and filename (test-t4bvyv.md).
  No blockers or risks identified. Estimated implementation time: 8-15 minutes.
