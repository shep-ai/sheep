content: |
  ## Problem Statement

  Feature 303 requires creating a single markdown file named test-t4bvyv.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This continues the well-established feature pattern successfully executed 300+ times in the Sheep codebase. Feature 303 follows the identical requirements, infrastructure, and implementation approach as features 300-302.

  ## Success Criteria

  - [ ] File test-t4bvyv.md created in repository root directory
  - [ ] File contains valid H1 markdown heading as first line (e.g., "# Some Title")
  - [ ] File contains blank line immediately after H1 heading
  - [ ] File contains exactly 2-3 sentences of prose content (validated by sentence count)
  - [ ] Prose content is coherent and generated via Claude API
  - [ ] File encoded as UTF-8 without BOM (byte order mark)
  - [ ] File uses Unix LF line endings (no CRLF, no mixed endings)
  - [ ] File passes markdown structure validation via validate_markdown_file()
  - [ ] File staged in git working directory
  - [ ] Commit created with message format: "feat(303): create markdown file test-t4bvyv.md with prose content"
  - [ ] Commit pushed to remote tracking branch
  - [ ] All validation checkpoints pass without errors (content generation, file write, encoding check, line ending check)

  ## Functional Requirements

  - **FR-1**: Generate markdown H1 heading via Claude API and use as first line of file
  - **FR-2**: Ensure blank line exists immediately after H1 heading
  - **FR-3**: Generate exactly 2-3 sentences of prose content via Claude API
  - **FR-4**: Write generated content to file named test-t4bvyv.md in repository root
  - **FR-5**: Encode file content as UTF-8 without BOM
  - **FR-6**: Ensure all line endings are Unix LF (0x0A), not CRLF or mixed
  - **FR-7**: Stage file in git working directory (git add test-t4bvyv.md)
  - **FR-8**: Create git commit with message "feat(303): create markdown file test-t4bvyv.md with prose content"
  - **FR-9**: Push commit to remote tracking branch

  ## Non-Functional Requirements

  - **NFR-1**: Prose content must be generated via Anthropic Claude API using sheep.config.llm.get_reasoning_llm()
  - **NFR-2**: Implementation must follow established pattern from features 300-302, reusing content_generators.py utilities
  - **NFR-3**: Markdown output must conform to CommonMark specification (valid H1 heading syntax, standard prose formatting)
  - **NFR-4**: Validation must occur at multiple checkpoints: content generation, file write, encoding verification, line ending verification
  - **NFR-5**: Implementation must leverage existing sheep.content_generators utilities (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file) with no custom implementations
  - **NFR-6**: Structured logging must be used via sheep.observability.logging.get_logger() for debug and info level messages
  - **NFR-7**: All file I/O must use pathlib.Path for cross-platform compatibility (no os.path)
  - **NFR-8**: Git operations must use subprocess for cli invocation, consistent with prior features
  - **NFR-9**: Implementation must complete within 15 minutes of execution (from feature module creation through git push)
  - **NFR-10**: No new external dependencies required; must use existing infrastructure already tested across 300+ features

  ## Product Decisions

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | --------------------- | --------- |
  | 1 | Should prose content be AI-generated via Claude API or manually provided? | AI-generated via Claude API | Aligns with established pattern proven across 300+ features, leverages existing infrastructure, maintains automation consistency |
  | 2 | Should prose content be constrained to a specific topic or allow any topic? | Allow any topic | User query explicitly states "about anything", provides maximum flexibility, consistent with established pattern |
  | 3 | What level of markdown validation should be enforced? | Structure validation only | Aligns with existing validation in content_generators.py, sufficient quality via Claude generation, consistent with 300+ prior features |
  | 4 | Should commit message follow conventional commits format? | Use conventional commits format | Established pattern across 300+ features, enables tooling integration, semantic meaning for changelog |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | None | All infrastructure (generate, write, validate, commit, push) is already implemented and tested across 300+ features. Only invoked with `filename=\"test-t4bvyv.md\"` and `feature_number=303`. |
  | `src/sheep/features/` | High | New feature module `feature_303_markdown_file_creation.py` will be created following established pattern from features 300-302. Simple wrapper function calling shared `content_generators` utilities. |
  | Repository root | High | Output location where `test-t4bvyv.md` will be created and persisted with 300+ other test markdown files. |
  | `.git/` directory | Medium | Git operations will stage file, create commit with message `feat(303): create markdown file test-t4bvyv.md with prose content`, and push to remote. |
  | `specs/303-markdown-file-creation-67deea/` | Low | This spec.yaml file updated during requirements phase. No other specs affected. |
  | `src/sheep/config/llm.py` | None | No changes required. LLM factory is pre-configured for content generation. |
  | `src/sheep/cli.py` | None | No CLI changes required. Feature can be invoked directly via module import or CLI if already integrated. |

  ## Dependencies

  **Internal Infrastructure** (Already Implemented and Tested):
  - `sheep.content_generators.generate_markdown_content()` — Calls Claude API to generate H1 heading and 2-3 sentences
  - `sheep.content_generators.write_markdown_file()` — Writes content to test-t4bvyv.md with UTF-8 encoding and LF line endings
  - `sheep.content_generators.validate_markdown_file()` — Validates H1 heading, sentence count, encoding, line endings
  - `sheep.content_generators.commit_markdown_file()` — Git add/commit with conventional format
  - `sheep.content_generators.push_markdown_file()` — Git push with upstream tracking
  - `sheep.observability.logging.get_logger()` — Structured logging for debug/info messages
  - `pathlib.Path` — Cross-platform file path operations

  **External Services**:
  - **Anthropic Claude API** — LLM for content generation (configured via `sheep.config.llm.get_reasoning_llm()`)
  - **Git CLI** — Executable for version control operations (via subprocess)

  **Python Standard Library**:
  - `pathlib` — Path operations
  - `subprocess` — Git command execution
  - Standard string/encoding functions

  **No New Dependencies Required** — All infrastructure is proven across 300+ prior features; no new packages needed.

  ## Size Estimate

  **S** (Small — 5-15 minutes) — Minimal-effort feature following well-established pattern:

  - **Feature module creation**: ~2-3 minutes (copy pattern from feature_302.py, update feature number=303 and filename=test-t4bvyv.md)
  - **Infrastructure invocation**: ~1 minute (call proven `content_generators` functions with correct parameters)
  - **LLM content generation**: ~2-5 minutes (API call to Claude, validation of 2-3 sentences)
  - **File I/O and validation**: ~1-2 minutes (write file, validate format/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (git add, commit with conventional message, push to remote)
  - **Total estimated effort**: 8-15 minutes of actual execution

  **Justification**:
  - Well-proven pattern with 300+ identical implementations providing clear precedent
  - Core infrastructure in `content_generators.py` is mature, tested, and reusable
  - No architectural decisions or research required; pattern is fully established
  - Implementation is purely a thin wrapper function following feature_302 template
  - Filename is pre-specified (test-t4bvyv.md), eliminating any naming decisions
  - Topic selection is completely open-ended (any topic, 2-3 sentences)
  - Git workflow is mechanical and proven across prior features
  - Recent features (300-302) demonstrate consistent 5-15 minute implementation times
  - No testing framework changes, documentation updates, or complex logic required

  ---

  _Requirements phase complete — ready for implementation planning_
