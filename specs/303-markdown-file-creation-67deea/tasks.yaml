# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 303 implementation consists of 6 ordered tasks across 3 phases:

  **Phase 1: Foundation (Task 1)** creates the feature module file with imports,
  constants, and module docstring following the exact pattern from feature_302.

  **Phase 2: Core Implementation (Tasks 2-4)** adds the orchestration function
  that delegates to content_generators.create_markdown_file(), wraps with error
  handling and logging, and implements a main() entry point for standalone execution.

  **Phase 3: Testing & Validation (Tasks 5-6)** verifies module imports, function
  signatures, and end-to-end functionality including file creation, markdown
  validation, and git workflow.

  Each task follows TDD cycle: RED (write test), GREEN (minimal implementation),
  REFACTOR (cleanup and improve). Tasks are ordered by dependency—later tasks depend
  on earlier ones completing.

  Total time estimate aligns with feature size (S: 8-15 minutes). Most time is spent
  on Claude API content generation (2-5 minutes, handled transparently by content_generators).
  Implementation code is ~40-50 lines following proven pattern.

  ## Implementation Notes

  - Follow feature_302.py exactly for consistency
  - All error handling delegated to content_generators (no custom try-catch at feature level)
  - Logging is structured via get_logger(__name__) for observability
  - No custom logic needed; feature is pure orchestration
  - Git operations handled transparently by content_generators infrastructure
  - File path resolution uses Path.cwd() for cross-platform compatibility
