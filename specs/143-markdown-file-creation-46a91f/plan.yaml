content: |
  ## Architecture Overview

  This feature follows the minimal, established pattern observed in 140+ existing test files
  and features 001-142. The implementation uses existing orchestration utilities from
  sheep.content_generators module with no new dependencies or complexity beyond reusing
  proven patterns.

  **Architecture Pattern:**
  - Repository root markdown file creation (isolated, no subdirectories)
  - Claude LLM-generated prose content (proven pattern across 140+ features)
  - Comprehensive file validation (UTF-8 encoding, Unix LF line endings, 2-3 sentences)
  - Standard git workflow (add → commit → push) using sheep.tools integration
  - Single feature module with clear orchestration function
  - Zero integration with /src/sheep/, tests/, or configuration beyond content generators

  **Alignment with Existing Codebase:**
  - Uses existing content_generators.py functions for all operations
  - Follows feature module pattern from feature_138_markdown_file_creation.py
  - Uses GitCommitTool and GitPushTool from sheep.tools (integrated with logging)
  - Does not depend on or interact with application source code, test suite, or configuration
  - Matches the pattern from preceding features (001-142) with zero architectural impact

  ## Key Design Decisions

  ### 1. Content Generation: Claude LLM via CrewAI

  **Chosen:** Use `sheep.content_generators.generate_markdown_content()` which calls Claude
  via CrewAI's `get_reasoning_llm()` with MARKDOWN_GENERATION_PROMPT.

  **Rationale:**
  - Research decision 1: Proven pattern across 140+ prior features (001-142)
  - LLM generates coherent, natural-sounding prose on any topic
  - MARKDOWN_GENERATION_PROMPT template clearly specifies format (H1 heading + 2-3 sentences)
  - Fast execution (typically <1s per generation)
  - Zero additional dependencies beyond CrewAI already in the project
  - Validation (`_validate_markdown_content()`) runs immediately after generation

  **Alternatives Considered:**
  - Hardcoded content: Reduced flexibility; LLM generation proven more effective across precedents
  - Template engines: Unnecessary complexity for straightforward content format
  - Random text generation: Less coherent; LLM produces natural, readable prose

  ### 2. File I/O: pathlib.Path with UTF-8 Encoding

  **Chosen:** Use `sheep.content_generators.write_markdown_file()` which uses pathlib.Path
  with open(encoding="utf-8") for file creation.

  **Rationale:**
  - Research decision 2: Standard Python approach for text file I/O
  - Avoids platform-specific line ending issues (Unix LF guaranteed across all platforms)
  - UTF-8 encoding with no BOM (Python default behavior)
  - Implicit validation: file existence check and size verification after write
  - Proven pattern across 140+ features in content_generators.py

  **Implementation Detail:**
  - pathlib.Path validates filename prevents path traversal (no "/" or "\\" in filename)
  - open(file_path, "w", encoding="utf-8") handles line endings correctly
  - Explicit newlines (\n) in content ensure Unix LF line endings

  ### 3. File Validation: Comprehensive Pre-Commit Checks

  **Chosen:** Use `sheep.content_generators.validate_markdown_file()` before git operations.

  **Rationale:**
  - Research decision 3: Validation maps directly to NFR requirements
  - Checks: UTF-8 encoding, no BOM, H1 heading at start, blank line separator, 2-3 sentences, trailing newline, Unix LF line endings
  - Catches encoding issues immediately before git staging (prevents invalid files in repository)
  - Exhaustive validation ensures file meets exact specification
  - Proven pattern across 140+ features

  **Validation Scope:**
  - UTF-8 BOM check (must be absent)
  - CRLF detection (must not exist; only LF allowed)
  - Markdown structure (H1 heading, blank line, prose content)
  - Prose format (exactly 2-3 sentences, counted by periods)
  - Trailing newline (Unix convention)

  ### 4. Git Integration: sheep.tools with Custom Commit Message

  **Chosen:** Use `sheep.content_generators.commit_markdown_file()` and `push_markdown_file()`
  with custom_message parameter set to exact spec format.

  **Rationale:**
  - Research decision 4: Existing tools integrated with Sheep logging framework
  - GitCommitTool and GitPushTool already proven across 140+ features
  - custom_message parameter allows exact format: `feat(143): create markdown file test-9mcc8z.md with prose content`
  - Tools provide error handling, observability, and consistent interfaces
  - No need to reimplement git operations or subprocess calls

  **Commit Message:**
  - Exact format: `feat(143): create markdown file test-9mcc8z.md with prose content`
  - Feature number in parentheses (conventional commits scope)
  - Lowercase "create" per spec requirement
  - "with prose content" (not topic-extracted) per feature 142 precedent

  **Git Push:**
  - Use `set_upstream=True` for branch tracking
  - Push to remote "origin" (default)
  - Feature branch pre-created as `feat/143-markdown-file-creation-46a91f`

  ### 5. Feature Module Structure

  **Chosen:** Create feature module `src/sheep/features/feature_143_markdown_file_creation.py`
  exporting single function `create_feature_143_markdown_file()`.

  **Rationale:**
  - Follows established pattern from features 138-142 for consistency
  - Single entry point for orchestration (simple, clear interface)
  - Function returns dict with filepath, content, commit_message, push_result
  - Minimal module with no new classes, abstractions, or helper functions

  **Function Signature:**
  ```python
  def create_feature_143_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      \"\"\"Create markdown file test-9mcc8z.md with orchestrated workflow.\"\"\"
  ```

  ## Implementation Strategy

  **Single-phase implementation** with linear orchestration:

  1. **Phase 1: File Creation & Git Integration** (5-7 minutes)
     - Create feature module with imports and function skeleton
     - Orchestrate five operations using existing content_generators utilities:
       1. Generate markdown content (Claude LLM via CrewAI)
       2. Write file to disk (pathlib with UTF-8)
       3. Validate file (comprehensive format checks)
       4. Commit with custom message (GitCommitTool with feature number scope)
       5. Push to remote (GitPushTool with upstream tracking)
     - Implement error handling with logging at each step
     - Test the complete workflow end-to-end

  **Why This Approach:**
  - Uses existing, proven utilities (zero need to reinvent file creation or git operations)
  - Linear orchestration: each step depends on previous step (no parallelization)
  - All operations straightforward with clear error cases
  - Validation happens before git staging (fail-fast approach)
  - Testing integrated into implementation (TDD pattern in task breakdown)

  **No parallel phases:** All work is sequential; git operations depend on file creation and validation.

  ## Risk Mitigation

  | Risk | Mitigation | Severity |
  | ---- | ---------- | -------- |
  | LLM API rate limiting or timeout | Existing generate_markdown_content() handles LLM errors with logging; exceptions propagate up. Retry logic unnecessary for single generation call. | Low |
  | UTF-8 encoding issues on Windows | pathlib.Path.write_text() with encoding=\"utf-8\" handles platform differences; explicit newlines (\\n) ensure Unix LF. | Very Low |
  | CRLF line endings from cached LLM responses | validate_markdown_file() checks for CRLF (b\"\\r\\n\") before git operations; validation fails fast if present. | Low |
  | Git authentication/branch not found | Assumes git is configured (user.name, user.email, credentials set) and feature branch `feat/143-markdown-file-creation-46a91f` exists (pre-created by orchestration system). | Very Low |
  | File collision (test-9mcc8z.md already exists) | Very unlikely; filename is unique per spec. pathlib.Path.write_text() overwrites existing files (acceptable for test artifact). | Very Low |
  | Custom commit message format mismatch | Hardcoded in feature module: `feat(143): create markdown file test-9mcc8z.md with prose content`. No topic extraction or variable interpolation. | Very Low |

  ## Success Criteria

  Feature is complete when:
  - ✓ File test-9mcc8z.md exists at repository root
  - ✓ File contains one H1 heading on first line (e.g., \"# Topic\")
  - ✓ File contains blank line after heading
  - ✓ File contains exactly 2-3 sentences of prose content
  - ✓ File is UTF-8 encoded without BOM
  - ✓ File uses Unix-style LF line endings (not CRLF)
  - ✓ File size is approximately 400-600 bytes (guideline)
  - ✓ Git commit exists with exact message: `feat(143): create markdown file test-9mcc8z.md with prose content`
  - ✓ Commit is on feature branch `feat/143-markdown-file-creation-46a91f`
  - ✓ Changes are pushed to remote origin

  ## Related Context

  This feature is part of a series (001-143) that creates simple test markdown files following
  an identical pattern. The established pattern provides clear precedent for:
  - LLM-based content generation with Claude via CrewAI (proven across 140+ features)
  - File location (repository root, no nesting)
  - Content structure (H1 heading + 2-3 sentences)
  - Prose encoding (UTF-8 with LF, no BOM)
  - Git workflow (conventional commits with feature number scope, push to feature branch)
  - Using existing utilities from content_generators.py (zero duplication, leverages proven patterns)

  The minimalist design is intentional: this feature demonstrates orchestrated file creation
  with LLM content generation, comprehensive validation, and git integration on a tiny, atomic
  scale with zero impact on application source code or architecture.
