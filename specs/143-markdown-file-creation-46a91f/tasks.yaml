content: |
  ## Summary

  Three sequential tasks across a single implementation phase:

  **Phase 1: File Creation & Git Integration** (7 minutes total)
  1. Create feature module skeleton with imports (2 min)
  2. Implement orchestration function using content_generators utilities (3 min)
  3. Test and verify complete workflow end-to-end (2 min)

  **Execution Flow:**
  - Task 1 establishes module structure and imports
  - Task 2 implements the core orchestration logic using existing utilities
  - Task 3 validates the complete workflow and verifies all success criteria

  **Key Implementation Details:**

  **Orchestration Sequence (Task 2):**
  1. Generate markdown content using `generate_markdown_content()` (Claude LLM via CrewAI)
  2. Write file to disk using `write_markdown_file(content, \"test-9mcc8z.md\")` (UTF-8 encoding)
  3. Validate file using `validate_markdown_file(filepath)` (comprehensive checks: encoding, line endings, structure)
  4. Commit file using `commit_markdown_file(filepath, content, repo_path, custom_message=...)` with exact spec message
  5. Push to remote using `push_markdown_file(repo_path)` with upstream tracking

  **Custom Commit Message (Critical):**
  The commit message must be exactly: `feat(143): create markdown file test-9mcc8z.md with prose content`
  - Feature number in parentheses: `(143)`
  - Lowercase \"create\" per spec
  - \"with prose content\" (not topic-extracted) per feature 142 precedent
  - Use custom_message parameter in commit_markdown_file() to override auto-generated message

  **File Validation (Before Git Operations):**
  The validate_markdown_file() function checks:
  - UTF-8 encoding without BOM
  - Unix LF line endings (no CRLF)
  - H1 heading at start
  - Blank line separator after heading
  - Exactly 2-3 sentences of prose content
  - Trailing newline
  - Validates immediately after file creation, before git staging

  **TDD Approach:**
  Each task includes RED-GREEN-REFACTOR cycles:
  - **RED:** Write test assertions before implementation
  - **GREEN:** Implement minimal code to satisfy assertions
  - **REFACTOR:** Clean up code, improve naming, add logging and error handling

  **Success Criteria:**
  Feature is complete when:
  - ✓ File test-9mcc8z.md exists at repository root with correct markdown format
  - ✓ File is UTF-8 encoded with Unix LF line endings and no BOM
  - ✓ File contains exactly 2-3 sentences of prose content
  - ✓ Git commit exists with message: `feat(143): create markdown file test-9mcc8z.md with prose content`
  - ✓ Changes are pushed to remote origin on feat/143-markdown-file-creation-46a91f branch
  - ✓ Function returns dict with filepath, content, commit_message, push_result

  **Notes:**
  - All tasks use existing utilities from content_generators.py (no new dependencies)
  - Uses sheep.tools integration (GitCommitTool, GitPushTool) for git operations
  - Single feature module with one exported function
  - No modifications to source code, tests, or configuration
  - Follows established pattern from features 138-142
  - Total implementation time: ~7 minutes (straightforward orchestration of proven utilities)
