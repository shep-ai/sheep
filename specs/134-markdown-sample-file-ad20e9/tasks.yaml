content: |
  ## Task Summary

  This implementation consists of 6 tasks organized across 2 phases:

  **Phase 1: File Creation & Validation (40 minutes)**
  - Task 1: Environment setup and prerequisite validation (10 min)
  - Task 2: File creation with TDD (15 min) - RED: test file doesn't exist/structure requirements; GREEN: generate and write content; REFACTOR: extract functions, add logging and error handling
  - Task 3: File validation with TDD (15 min) - RED: test encoding, structure, line endings; GREEN: implement validation checks; REFACTOR: extract validation functions, improve error reporting

  **Phase 2: Git Integration (20 minutes)**
  - Task 4: Stage and commit with GitCommitTool (10 min) - Import tool, stage file, commit with exact message, verify in log
  - Task 5: Verify commit details (5 min) - Confirm commit message, author, branch, working directory clean
  - Task 6: Push to remote with GitPushTool (5 min) - Import tool, push with upstream tracking, verify remote has commit

  ## Implementation Notes

  1. **Content Generation (Task 2):** Implementer chooses prose topic during development. Example: "# Markdown Fundamentals\n\nMarkdown is a lightweight markup language. It uses simple syntax for formatting. Files can be easily converted to HTML or other formats.\n"

  2. **Validation Strategy (Task 3):** While comprehensive validation would use 14 checks (from content_generators.py), this implementation uses basic validation appropriate for inline-generated content where structure is guaranteed by code. Focus on: file exists, UTF-8 readable, correct structure, no BOM, no CRLF.

  3. **Git Operations (Tasks 4-6):** Feature branch feat/134-markdown-sample-file-ad20e9 already exists. Use sheep.tools GitCommitTool and GitPushTool for consistency with recent implementations (features 127+).

  4. **Error Handling:** All tasks should include proper error handling with descriptive logging. Fail fast on errors rather than attempting retries.

  5. **Logging Strategy:** Use sheep.observability.logging.get_logger(__name__) for structured logging. Log: operation start, results, completion, errors with context.

  ## Success Criteria (Overall)

  - [ ] File test-jnjm6g.md exists at repository root with correct structure
  - [ ] File is UTF-8 without BOM, Unix LF line endings
  - [ ] File contains H1 heading + blank line + 2-3 sentences prose
  - [ ] File is staged in git
  - [ ] Commit exists with exact message: feat(134): create markdown file test-jnjm6g.md with prose content
  - [ ] Commit is on feature branch feat/134-markdown-sample-file-ad20e9
  - [ ] Changes are pushed to remote origin

