  - [ ] Import: pathlib.Path, open(), subprocess (via tools), sheep.tools.GitCommitTool, sheep.tools.GitPushTool, logging
  - [ ] Validate filename: no path traversal, repository root only
  - [ ] Generate content: H1 heading, blank line, 2-3 sentences prose, trailing newline
  - [ ] Write file: UTF-8 encoding, Unix LF line endings
  - [ ] Validate file: exists, UTF-8 decodable, correct structure
  - [ ] Stage file: `git add test-jnjm6g.md`
  - [ ] Commit: exact message `feat(134): create markdown file test-jnjm6g.md with prose content`
  - [ ] Push: `git push -u origin HEAD` (branch already exists)
  - [ ] Log: all operations with informative messages
  - [ ] Handle errors: fail fast, log with context

