content: |
  ## Task Breakdown Summary

  Feature 145 implements markdown file creation in 6 focused tasks across 2 phases (total: 13 minutes).

  **Phase 1: Content Generation & File Creation (7 minutes)**
  - Task 1 (3 min): Generate markdown content via Claude API with CrewAI (temperature 0.2)
  - Task 2 (2 min): Write file to disk with Python pathlib and explicit UTF-8 encoding
  - Task 3 (2 min): Validate markdown structure, encoding, and line endings

  **Phase 2: Git Integration & Push (6 minutes)**
  - Task 4 (2 min): Commit file with conventional commit message using GitCommitTool
  - Task 5 (2 min): Push commit to origin remote with upstream tracking using GitPushTool
  - Task 6 (2 min): Implement create_markdown_file() orchestration function tying all operations together

  **Design Approach:**
  - Leverage established patterns from features 001-144 for consistency
  - Use existing modules: sheep.config.llm, sheep.tools.git_tools, sheep.content_generators
  - Comprehensive validation at each stage ensures spec compliance
  - Single orchestration function (create_markdown_file) provides clean API for callers

  **Test Coverage:**
  - Content generation: format validation (H1 heading, sentence count)
  - File writing: path creation, encoding validation (no BOM, LF line endings)
  - File validation: comprehensive format and encoding checks
  - Git operations: commit message validation, push verification
  - Integration: end-to-end test of complete workflow

  **Error Handling Strategy:**
  - API failures (Claude): logged and raised to caller
  - File I/O failures: path validation, encoding checks, validation function
  - Git failures: caught from tool classes with descriptive error messages
  - Orchestration: comprehensive error handling at each step with logging

  **Task Dependencies:**
  - Task 1 is independent (no dependencies)
  - Task 2 depends on Task 1 (needs content generated)
  - Task 3 depends on Task 2 (needs file written)
  - Task 4 depends on Task 3 (needs file validated)
  - Task 5 depends on Task 4 (needs commit created)
  - Task 6 depends on all 5 tasks (orchestration requires all components)

  This phased, sequential approach ensures each component is properly implemented and tested
  before moving to the next step, reducing risk and enabling clear debugging if issues arise.
