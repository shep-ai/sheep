content: |
  ## Summary

  Three focused tasks across two phases deliver this feature:

  **Phase 1: File Creation and Verification**
  - Task 1 creates the markdown file with appropriate heading and 2-3 sentences of content
  - Task 2 verifies the file meets all technical requirements (encoding, line endings, syntax)

  **Phase 2: Git Integration**
  - Task 3 commits the file with a conventional commit message and pushes to the feature branch

  The tasks are sequentially dependent: the file must be created before verification,
  and verification must pass before committing. Total estimated effort is 20 minutes.

  ## Implementation Notes

  - **Content topic:** Developer has full discretion to choose any substantive, coherent topic
  - **Heading choice:** Both H1 (`#`) and H2 (`##`) are acceptable; choose based on semantic fit
  - **Verification approach:** Manual inspection of file properties (encoding, line endings, syntax)
    is sufficient for this simple feature; no automated test suite required
  - **Commit workflow:** Use `--no-verify` to skip pre-commit hooks as instructed in the planning phase
  - **No side effects:** Feature scope is strictly limited to file creation; verify no other
    files are modified during implementation
