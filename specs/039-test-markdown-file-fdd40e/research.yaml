# Structured technology decisions
decisions:
  - title: 'Markdown Heading Level (H1 vs H2)'
    chosen: 'Either H1 (#) or H2 (##) — both acceptable per specification'
    rejected: []
    rationale: >
      The specification permits both H1 and H2 heading levels. Both are valid top-level
      document titles in Markdown. No architectural reason to prefer one over the other.
      Developer should choose based on content context. If file stands alone, H1 is
      conventional; if it's part of a larger document collection, H2 may be more appropriate.

  - title: 'File Encoding and Line Endings'
    chosen: 'UTF-8 without BOM (Byte Order Mark) with LF (Unix-style \n) line endings'
    rejected:
      - 'UTF-8 with BOM — Would cause issues with some tools and Git diff visibility'
      - 'UTF-16/UTF-32 — Unnecessary for ASCII-compatible Markdown and incompatible with repository standards'
      - 'CRLF line endings — Causes platform inconsistency and pollutes Git diffs'
    rationale: >
      Specification explicitly requires UTF-8 without BOM and LF line endings. This ensures:
      (1) maximum cross-platform compatibility, (2) clean Git diffs without whitespace noise,
      (3) consistency with existing repository files, (4) compatibility with static site
      generators and CI/CD tooling. Repository standards already enforce this pattern
      (confirmed by presence of similar features 034–038 using same encoding).

  - title: 'Content Topic Selection'
    chosen: 'Developer discretion — any topic acceptable per specification'
    rejected:
      - 'Prescriptive topic assignment — Would reduce developer autonomy without technical benefit'
      - 'Random generator — Would likely produce incoherent content violating "substantive and coherent" requirement'
    rationale: >
      Specification delegates topic choice to developer with only one constraint: content
      must be "substantive and coherent." This is the correct approach because (1) any
      topic domain is acceptable for a test file, (2) developer familiarity with topic
      ensures coherent writing, (3) this is consistent with features 034–038 which also
      varied topic (some had tech focus, others were general). No technical reason to
      constrain topic selection.

  - title: 'Markdown Syntax Variant'
    chosen: 'CommonMark 0.30+ (GitHub-flavored Markdown compatible)'
    rejected:
      - 'MultiMarkdown — Adds non-standard extensions not needed for simple content'
      - 'Pandoc Markdown — Adds complexity beyond repository requirements'
    rationale: >
      GitHub renders files using GitHub-flavored Markdown (GFM), which is CommonMark-compatible.
      Repository files should be valid CommonMark to ensure compatibility with static site
      generators, documentation tools, and markdown linters. No need for extended variants.
      Simple heading + prose structure requires only core CommonMark features.

