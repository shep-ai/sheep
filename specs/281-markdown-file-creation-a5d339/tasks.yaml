tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Create markdown file with correct structure and encoding"
    description: >
      Create test-4pg81f.md in the repository root with a markdown H1 heading and 2-3 sentences of prose
      content. The file must use UTF-8 encoding without BOM and LF line endings. Content structure:
      `# Heading\n\n<2-3 sentences>\n`
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-4pg81f.md exists at repository root"
      - "File contains exactly one H1 heading (# ) on the first line"
      - "File contains exactly 2-3 sentences of prose after a blank line following the heading"
      - "File is encoded as UTF-8 (verified by reading bytes)"
      - "File uses LF line endings (\\n), not CRLF"
      - "Prose content is grammatically correct and readable"
    tdd:
      red:
        - "Assert that test-4pg81f.md does not exist before the task begins"
        - "Assert that attempting to read the file raises FileNotFoundError"
      green:
        - "Use pathlib.Path('test-4pg81f.md').write_text() with encoding='utf-8' to create the file"
        - "Define prose content as a string with heading: '# Software Automation' (or similar topic)"
        - "Ensure content follows format: '# Heading\\n\\n<3 sentences>\\n'"
        - "Write the complete content string to the file"
        - "Assert that the file now exists and has non-zero size"
      refactor:
        - "Review the content string for grammatical correctness and readability"
        - "Ensure the heading is descriptive and the prose is clear and well-structured"
    estimatedEffort: "10 minutes"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Verify file properties (encoding, line endings, file size)"
    description: >
      Verify that the created file meets all encoding, line ending, and size requirements. Read the file
      back and validate: UTF-8 encoding, LF line endings, appropriate file size (400-600 bytes),
      and correct structure.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File size is between 400-600 bytes (natural outcome of proper structure)"
      - "File is encoded in UTF-8 (confirmed by reading and decoding)"
      - "File does not contain BOM (Byte Order Mark)"
      - "File uses LF (\\n) line endings, not CRLF (\\r\\n)"
      - "Content structure matches expected format: heading, blank line, prose"
      - "File is valid Markdown per CommonMark specification"
    tdd:
      red:
        - "Assert that file size is > 0"
        - "Assert that file can be read with UTF-8 decoding"
        - "Assert that content contains no CRLF characters (line_ending != '\\r\\n')"
        - "Assert that heading starts with '#' and prose contains exactly 3 sentences"
      green:
        - "Read file using Path('test-4pg81f.md').read_bytes()"
        - "Verify bytes do not start with UTF-8 BOM (EF BB BF)"
        - "Decode bytes as UTF-8 and check for success"
        - "Count line endings: verify all are '\\n', none are '\\r\\n'"
        - "Check file size: verify 400 <= size <= 600"
        - "Parse content structure: verify H1 heading, blank line, prose paragraph"
      refactor:
        - "Ensure validation code is clear and easy to understand"
        - "Document any assumptions about file structure or encoding"
    estimatedEffort: "5 minutes"

  - id: "task-3"
    phaseId: "phase-2"
    title: "Stage file in git"
    description: >
      Run `git add test-4pg81f.md` to stage the file for commit. Verify that the file appears in the
      git staging area.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "git add command succeeds with exit code 0"
      - "File appears in git status as 'Changes to be committed'"
      - "git ls-files --cached shows test-4pg81f.md in the index"
    tdd:
      red:
        - "Assert that git status shows test-4pg81f.md as untracked (before git add)"
        - "Assert that file is not in the git index yet"
      green:
        - "Run subprocess.run(['git', 'add', 'test-4pg81f.md'], check=True)"
        - "Verify exit code is 0 (command succeeded)"
        - "Assert that file now appears in git status as staged"
      refactor:
        - "Ensure subprocess call uses list arguments (not shell=True)"
        - "Confirm error handling with check=True parameter"
    estimatedEffort: "5 minutes"

  - id: "task-4"
    phaseId: "phase-2"
    title: "Commit file with conventional message"
    description: >
      Run `git commit -m 'feat(281): Create markdown file test-4pg81f.md with title and prose content'`
