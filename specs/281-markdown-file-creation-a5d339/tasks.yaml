    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "git commit command succeeds with exit code 0"
      - "Commit message is exactly: 'feat(281): Create markdown file test-4pg81f.md with title and prose content'"
      - "Commit exists on the current branch (feat/281-markdown-file-creation-a5d339)"
      - "git log shows the new commit"
      - "File is no longer in 'Changes to be committed' status"
    tdd:
      red:
