# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-30

  ## Technology Decisions

  ### 1. File I/O Implementation Method

  **Chosen:** `pathlib.Path.write_text()` with explicit `encoding='utf-8'`

  **Rejected:**
  - `open()` builtin — less ergonomic, requires manual encoding, doesn't align with NFR-5
  - `os` module file operations — lower-level, requires explicit byte handling, less idiomatic

  **Rationale:** NFR-5 explicitly requires pathlib.Path for file I/O. The `write_text()` method is
  the idiomatic way to write text files with guaranteed UTF-8 encoding. It's atomic, handles
  encoding automatically, and aligns with the established pattern in existing test files.

  ### 2. Prose Content Generation

  **Chosen:** Direct string literal with topic-specific prose (3 sentences)

  **Rejected:**
  - Template-based generation — unnecessary abstraction
  - Random/procedural generation — violates no-new-dependencies constraint, non-deterministic

  **Rationale:** The spec allows free-form topic selection. A simple, deterministic approach using
  hardcoded prose maintains complete control over content quality and grammatical correctness
  (FR-5), ensures reproducibility, and matches the observed pattern across existing test files.

  ### 3. Git Operations

  **Chosen:** `subprocess.run()` to invoke git CLI commands

  **Rejected:**
  - GitPython — adds abstraction layer for simple CLI calls
  - `os.system()` or `shell=True` — poor error handling, security concerns

  **Rationale:** For straightforward git operations (add, commit, push), subprocess is the
  standard Python approach. It provides clear exit code handling, is portable, and requires only
  Python standard library. Each operation is a single, idempotent CLI invocation.

  ### 4. Line Ending and Encoding Consistency

  **Chosen:** UTF-8 via pathlib, explicit `\n` in content strings for LF line endings

  **Rejected:**
  - Binary mode with explicit byte encoding — unnecessary complexity
  - `newline=''` parameter on open() — mixes string/binary mode, less aligned with pathlib

  **Rationale:** pathlib.write_text(encoding='utf-8') ensures UTF-8 without BOM. Explicitly
  using '\n' in string literals (not relying on implicit line breaks) guarantees LF line endings
  on all platforms. Content format: `# Heading\n\n<prose>\n`

  ### 5. File Naming and Location

  **Chosen:** Exact filename `test-4pg81f.md` in repository root

  **Rejected:**
  - Dynamic naming — unnecessary, filename is specified in spec
  - Subdirectory organization — conflicts with FR-2 and existing pattern

  **Rationale:** Filename is specified in the feature spec (test-4pg81f.md). FR-2 requires
  repository root. All 280+ existing test files follow this pattern.

  ### 6. Markdown Content Structure

  **Chosen:** `# Heading\n\n<3 sentences of prose>\n`

  **Rejected:**
  - H2/H3 headings — spec requires H1 (FR-3)
  - Complex structures — keep content simple and readable

  **Rationale:** Spec requires H1 heading (FR-3) + 2-3 sentences of prose (FR-4). Observed
  pattern shows this structure naturally produces 400-600 byte files. Valid per CommonMark (NFR-4).

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | Use | Required by NFR-5; idiomatic Python; handles encoding and file writes cleanly |
  | subprocess (stdlib) | Git command invocation | Use | Standard approach for CLI operations; good error handling; no external dependencies |
  | json (stdlib) | Potential config/logging | Use if needed | Available in stdlib; only use for actual serialization needs |
  | os (stdlib) | File system operations | Avoid | Lower-level than pathlib; used only for platform detection if absolutely required |
  | GitPython | Git operations | Avoid | Project has it as dependency, but subprocess is simpler for basic CLI calls; aligns with minimal abstraction principle |
  | Any external content API | Prose generation | Reject | Violates NFR-9 (no new dependencies) and adds unnecessary complexity |
  | Random/faker libraries | Content generation | Reject | Violates NFR-9; introduces non-determinism inappropriate for test artifacts |
  | Request/HTTPX | External content | Reject | Violates NFR-9; unnecessary for this task |

  ## Security Considerations

  ### 1. File Path Injection
  **Risk:** Using unsanitized or dynamically generated filenames could allow path traversal.
  **Mitigation:** Filename is hardcoded as `test-4pg81f.md` per spec. No user input or dynamic
  path construction. File location is relative path in repository root (no absolute paths).

  ### 2. File Encoding and Content Integrity
  **Risk:** Incorrect encoding could allow code injection or data corruption.
  **Mitigation:** UTF-8 encoding is explicitly specified via pathlib.write_text(encoding='utf-8').
  Content is hardcoded string literals, no dynamic content that could include malicious payloads.

  ### 3. Git Command Injection
  **Risk:** Passing user-controlled input to git commands via subprocess could allow shell injection.
  **Mitigation:** Using subprocess.run() with list arguments (not shell=True) prevents shell
  injection. All git arguments (filename, commit message) are hardcoded per spec, not user-controlled.

  ### 4. File Permissions
  **Risk:** File created with overly permissive permissions could allow unauthorized modification.
  **Mitigation:** File is created in repository root where permissions are inherited from parent
  directory. No explicit chmod needed. File is immediately committed to git, tracked by version control.

  ### 5. Markdown Content Integrity
  **Risk:** Markdown content should not contain execution vectors or unsafe syntax.
  **Mitigation:** Content is prose-only (plain text). No code blocks, no executable directives,
  no scripting. Valid per CommonMark specification.

  **No major security risks identified for this feature.** The implementation operates entirely with
  hardcoded, deterministic inputs. No external resources are accessed, no user input is processed,
  no shell metacharacters are involved.

  ## Performance Implications

  ### 1. File I/O Performance
  **Impact:** Negligible. Single file write (~500 bytes) is atomic and immediate.
  **Optimization:** No optimization needed. pathlib.write_text() is optimized for this use case.

  ### 2. Git Operations Performance
  **Impact:** Minimal. Three subprocess calls (add, commit, push) are synchronous but fast.
  **Optimization:** Operations could be batched (e.g., single git call with multiple arguments),
  but clarity and separation of concerns is preferred over micro-optimization for a ~1-2 second
  operation.

  ### 3. Process Overhead
  **Impact:** Each subprocess.run() call spawns a git process. Overhead is acceptable for 3 calls.
  **Optimization:** Theoretically could use GitPython to avoid process spawning, but the tradeoff
  (added library dependency) doesn't justify the negligible performance gain.

  ### 4. Memory Usage
  **Impact:** Negligible. Single 500-byte file in memory, subprocess communication via stdin/stdout.
  **Optimization:** No optimization needed.

  **Conclusion:** Performance is not a constraint for this feature. File creation, git staging,
  commit, and push are all fast enough for interactive use. No performance optimizations recommended.

  ## Architecture Notes

  ### Integration with Sheep Platform
  This feature implements a simple file creation task that fits into the Sheep automated
  implementation platform as a standalone operation. The implementation requires:

  1. **File System Access:** Write access to repository root (already available in feature branch)
  2. **Git Access:** Standard git CLI (available on all development machines)
  3. **Python Runtime:** 3.11+ (project requirement per pyproject.toml)

  No integration with CrewAI agents, tools, or flows is required at the implementation level.
  The feature is a simple imperative procedure that can be:
  - Called directly as a script
  - Wrapped in an agent task/tool by the platform
  - Invoked via CLI command
  - Triggered via Git workflow

  ### Pattern Alignment
  This implementation follows the exact pattern established by 200+ prior identical features
  (numbers 069-280). The approach is proven, tested, and reproducible:
  - Same file structure (heading + prose)
  - Same git workflow (add, commit, push)
  - Same technology stack (Python 3.11, pathlib, subprocess)
  - Same success criteria (file exists, correct content, committed)

  ### No Architecture Changes
  This feature makes zero changes to:
  - Application source code (/src/sheep/)
  - Project configuration files
  - Test suite
  - CI/CD pipelines
  - Dependencies

  The implementation is isolated to the repository root and has no impact on the larger system.

  ## Implementation Approach

  The implementation will follow these steps:

  1. **Create content string** with heading and prose
  2. **Write to file** using pathlib.Path.write_text()
  3. **Stage file** using git add
  4. **Commit file** with conventional message
  5. **Push to remote** origin

  All operations are straightforward, no error handling beyond letting exceptions propagate,
  no retries or fallback logic needed.

