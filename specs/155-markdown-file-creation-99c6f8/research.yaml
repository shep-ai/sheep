content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-22
  - **Pattern:** Established (150+ precedent files with identical requirements)

  ## Technology Decisions

  ### 1. File Creation Method

  **Chosen:** Use `pathlib.Path.write_bytes()` with explicit UTF-8 encoding

  **Rejected:**
  - `pathlib.Path.write_text()` — Does not guarantee consistent line endings across platforms; harder to control BOM (Byte Order Mark)
  - `open()` with manual encoding — More verbose and error-prone than pathlib; requires explicit close handling
  - Writing binary content directly — Unnecessary complexity when pathlib provides idiomatic Python solution

  **Rationale:**
  `pathlib.Path.write_bytes()` is the idiomatic choice for files requiring explicit encoding and line ending control. It avoids
  platform-specific issues (CRLF on Windows vs LF on Unix) by writing encoded bytes directly. This matches the established pattern
  from all 150+ existing test files in the codebase. The method is part of Python 3.4+ standard library (well-supported in 3.11+),
  requires no external dependencies, and provides concise, readable code.

  **Implementation pattern:**
  ```python
  content = f"# {title}\n\n{prose}\n"
  filepath = Path("test-1k8ri0.md")
  filepath.write_bytes(content.encode('utf-8'))
  ```

  ### 2. Line Ending Strategy

  **Chosen:** Use explicit `\n` characters in Python strings; write bytes via `pathlib.Path.write_bytes()`

  **Rejected:**
  - Rely on `pathlib.Path.write_text()` `newline='\n'` parameter — Less explicit control; not all Python environments guarantee behavior
  - Use platform-native line endings — Breaks consistency across platforms; violates spec requirement for Unix LF
  - Write bytes directly with manual `\n` encoding — More complex than constructing strings with `\n` characters

  **Rationale:**
  Constructing the markdown content string with explicit `\n` characters and encoding to UTF-8 bytes guarantees Unix LF line endings
  across all platforms. When Python strings with `\n` are encoded to UTF-8 bytes, they always produce LF (0x0A) without platform
  translation. Combined with `pathlib.Path.write_bytes()`, this ensures consistent output regardless of OS or Python configuration.
  Verified by analysis of 150+ existing test files, all using this exact approach.

  ### 3. Content Generation Approach

  **Chosen:** Hard-code prose content on any topic; construct in `create_file()` function

  **Rejected:**
  - Generate content programmatically — Unnecessary complexity; topic is flexible, no algorithmic generation needed
  - Read prose from external file — Adds file system dependency; breaks self-contained implementation
  - Use template engine — Over-engineering for single static file; violates simplicity principle

  **Rationale:**
  Hard-coded prose is the simplest, most maintainable approach. The spec explicitly allows any topic ("about anything"), so content
  generation flexibility is unnecessary. All 150+ existing test files use hard-coded prose on diverse topics (persistence, learning,
  bioluminescence, hashing, etc.). Hard-coded content is: (1) self-contained with no external dependencies, (2) fully deterministic
  and testable, (3) easy to understand and maintain, (4) exactly matches established codebase pattern.

  **Content structure:**
  - Title: Any topic, grammatically correct
  - Prose: 2-3 sentences on the same topic
  - Target size: 400-600 bytes (natural result of structure)
  - Encoding: UTF-8, no special characters required

  ### 4. Git Workflow Implementation

  **Chosen:** Use `subprocess.run()` with list-based arguments for git add, commit, and push

  **Rejected:**
  - Use `shell=True` with string commands — Security risk (command injection); violates best practices
  - Use GitPython library — Introduces external dependency; spec requires standard library only
  - Use `os.system()` — Deprecated; poor error handling; security risk

  **Rationale:**
  `subprocess.run()` with list-based arguments (not shell strings) is the secure, standard Python approach. Passing commands as lists
  prevents shell interpretation of special characters, eliminating injection risks. The `check=True` parameter raises `CalledProcessError`
  on failure, enabling robust error handling. This pattern is established throughout the codebase (features 152-154).

  **Implementation pattern:**
  ```python
  subprocess.run(["git", "add", "test-1k8ri0.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(155): create markdown file test-1k8ri0.md with prose content"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  ### 5. Validation Approach

  **Chosen:** Implement custom `validate_file()` function checking structure, size, encoding, and content

  **Rejected:**
  - No validation — Risks file corruption or spec non-compliance going unnoticed
  - Use external markdown parser — Unnecessary dependency; simple validation doesn't require library
  - Minimal validation (file exists only) — Insufficient to catch encoding, line-ending, or structure errors

  **Rationale:**
  Custom validation is appropriate without introducing external dependencies. Validation checks include:
  1. File exists
  2. Size in range (300-800 bytes, targeting 400-600)
  3. Starts with H1 heading (`# `)
  4. Contains blank line after heading (`\n\n`)
  5. Has prose content after heading

  These checks ensure UTF-8 encoding (via `read_text(encoding='utf-8')`), structure compliance, and consistency with 150+ precedent files.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | `pathlib` (stdlib) | File I/O operations | Use | Part of Python 3.4+ standard library; idiomatic for modern Python; provides explicit encoding/line-ending control |
  | `subprocess` (stdlib) | Execute git commands | Use | Standard library for external command execution; list-based arguments prevent injection; proper error handling |
  | `sys` (stdlib) | Exit codes and error reporting | Use | Standard library; minimal use for sys.exit(0) and sys.exit(1) |
  | GitPython | Alternative git library | Reject | External dependency; spec requires standard library only; subprocess is adequate |
  | External markdown parser | Content validation | Reject | Unnecessary dependency; simple structure validation doesn't require library |
  | External prose generators | Content generation | Reject | Unnecessary dependency; hard-coded prose matches established pattern |

  ## Security Considerations

  **1. Command Injection Prevention**
  - **Risk:** Git commands could be vulnerable to injection if arguments contain special characters
  - **Mitigation:** Use `subprocess.run()` with list-based arguments, not shell strings. Example:
    - ✓ Safe: `subprocess.run(["git", "commit", "-m", message], check=True)`
    - ✗ Unsafe: `subprocess.run(f"git commit -m '{message}'", shell=True, check=True)`
  - **Implementation:** All subprocess calls use list-based argument passing

  **2. File Permissions**
  - **Risk:** New files may be created with overly permissive permissions
  - **Mitigation:** Use default umask (typically 0o022); creates files with mode 0o644 (rw-r--r--)
  - **Acceptance:** Default permissions are adequate for markdown test files in a repository

  **3. Encoding Safety**
  - **Risk:** Incorrect character encoding could cause file corruption or parsing errors
  - **Mitigation:** Explicit UTF-8 encoding with `content.encode('utf-8')` and validation via `read_text(encoding='utf-8')`
  - **Validation:** validate_file() confirms UTF-8 readability

  **4. No Code Execution in Content**
  - **Risk:** Malicious code in file content could be executed
  - **Mitigation:** Files are markdown text only; no code execution possible
  - **Acceptance:** Content is static prose; no security risk from file content

  ## Performance Implications

  **1. File Creation**
  - Single file write operation: < 1ms for ~500 bytes
  - No optimization needed; negligible impact
  - No I/O performance constraints

  **2. Validation**
  - File read operation: < 1ms for ~500 bytes
  - Pattern matching (H1 heading, blank line) is O(1) or O(n) with n = file size
  - No performance concerns for validation

  **3. Git Operations**
  - `git add`: O(1) — adding single file to staging area
  - `git commit`: O(1) — single commit operation
  - `git push`: Network-bound; typical 1-5 seconds for local repo
  - Estimated total time: 5-10 seconds for git workflow

  **4. End-to-End**
  - File creation: ~5 minutes (human time to write prose; script execution < 1ms)
  - Validation: ~3 minutes (running tests; execution < 1ms)
  - Git workflow: ~2-5 minutes (manual operations or script execution)
  - **Estimated total:** 10-15 minutes per spec estimate (human time, not script execution)

