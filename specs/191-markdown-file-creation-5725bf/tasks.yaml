content: |
  ## Summary

  Feature 191 implementation comprises 6 tasks across 6 phases totaling approximately 2.5 hours of work:

  1. **Foundation** (15 min) — Create script skeleton with imports and constants
  2. **File Creation** (30 min) — Implement create_file() using pathlib with proper encoding and line endings
  3. **Validation** (45 min) — Implement comprehensive validate_file() with all checks from spec
  4. **Git Integration** (30 min) — Implement git_add(), git_commit(), git_push() using subprocess
  5. **Error Handling** (30 min) — Implement main() with comprehensive error handling and orchestration
  6. **Verification** (30 min) — Execute end-to-end and verify all spec criteria are met

  Each task includes TDD cycles (RED → GREEN → REFACTOR) to ensure testability and quality. Tasks are ordered by dependency; validation comes before git operations (as required by spec FR-5), error handling wraps the complete workflow, and final verification confirms all success criteria are met.

  The implementation follows the proven pattern from features 188-190, using pathlib for file I/O, subprocess for git operations, comprehensive pre-operation validation, and clear error messages for debugging. No external dependencies are needed; only Python 3.11+ standard library (pathlib, subprocess, sys).

