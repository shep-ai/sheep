content: |
  ## Architecture Overview

  This feature implements a standalone Python script (create_markdown_file_191.py) that:

  1. **Creates a markdown file** with a specific structure (H1 heading + 3 sentences of prose)
  2. **Validates the file** comprehensively before any git operations
  3. **Commits and pushes** to the remote repository with a conventional commit message

  The implementation follows the proven architecture from features 188-190, which have been successfully implemented and deployed. No changes to the src/sheep/ package are needed; this is purely a new script file.

  ### Design Pattern

  The script follows a modular design with clear separation of concerns:

  - `create_file()` — Creates the markdown file at repository root with proper encoding and line endings
  - `validate_file()` — Comprehensive validation of file structure, encoding, line endings, and size
  - `git_add()`, `git_commit()`, `git_push()` — Separate git operations with clear responsibilities
  - `main()` — Orchestrates the workflow and error handling

  Each function is focused on a single responsibility, making the code testable and maintainable. This matches the architecture from feature 190.

  ### How It Fits the Existing Architecture

  **File Creation Capability:** This feature extends the core markdown file creation capability of the Sheep platform, which already has 190+ similar test files in the repository root. The pattern (H1 heading + prose, UTF-8 encoding, Unix LF line endings) is consistent across all prior features.

  **Script-Based Implementation:** Like features 188-190, this is a standalone script file (not integrated into src/sheep/). The script can be executed independently or as part of the Sheep agent workflow. This approach keeps feature implementations isolated and easily testable.

  **Git Workflow Integration:** The script demonstrates Sheep's capability to programmatically manage git operations (add, commit, push) through subprocess, which is central to the platform's automated code generation and contribution workflow.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path (from research)

  **Chosen:** `pathlib.Path.write_text(encoding="utf-8", newline="\n")`

  **Rationale:**
  - Modern, standard library in Python 3.11+
  - Already used throughout the Sheep codebase
  - Cleanly handles UTF-8 encoding without BOM and Unix LF line endings on all platforms
  - Cross-platform compatibility (Windows, Linux, macOS)
  - Matches proven pattern from feature 190

  ### 2. Git Command Execution: subprocess.run() with command arrays (from research)

  **Chosen:** `subprocess.run(["git", "add", FILENAME], check=True)`

  **Rationale:**
  - Secure (no shell=True, no command injection risk)
  - Standard library, no external dependencies
  - check=True raises CalledProcessError for non-zero exit codes
  - Command arrays are debuggable and clear
  - Proven in feature 190 implementation

  ### 3. Validation Strategy: Pre-operation Comprehensive Checks (from research)

  **Chosen:** Implement validate_file() function that checks file properties BEFORE any git operations

  **Rationale:**
  - Spec FR-5 explicitly requires validation BEFORE git operations
  - Prevents committing invalid files to the repository
  - Fail-fast approach enables clear error messages and debugging
  - Validation is fast (~1ms) relative to git push latency

  Validation checks:
  - File exists and is readable
  - Contains H1 markdown heading as first line
  - Contains exactly 3 sentences of prose content
  - File encoding is UTF-8 without BOM (check for byte pattern 0xEF 0xBB 0xBF)
  - Line endings are Unix LF only (no CRLF)
  - File size is 400-600 bytes (consistent with prior features)

  ### 4. Error Handling: Comprehensive with Specific Exception Types (from research)

  **Chosen:** Catch specific exceptions (ValueError, OSError, CalledProcessError) with clear error messages

  **Rationale:**
  - Spec FR-9 requires detecting pre-existing files
  - Spec NFR-6 requires clear error messages that aid debugging
  - Comprehensive error handling enables operators to fix issues without cryptic failures
  - Matches error handling pattern from feature 190

  Error cases handled:
  - Pre-existing file: ValueError with clear message
  - File write failure: OSError with error details
  - Validation failure: ValueError with specific failure reason
  - Git add/commit/push failure: CalledProcessError with git output

  ### 5. Content: Template-Based Constants (from research)

  **Chosen:** Module-level constants for FILENAME, TITLE, PROSE, COMMIT_MESSAGE

  **Rationale:**
  - Ensures deterministic, reproducible output (NFR-10)
  - Generic technical content avoids platform version coupling (spec openQuestion 1)
  - Exactly 3 sentences meets spec requirement and ensures file size 400-600 bytes
  - Constants at module level improve clarity and testability
  - Matches feature 190 pattern

  ### 6. Pre-existing File Handling: Fail with Clear Error (from research)

  **Chosen:** Check `Path.exists()` before creating; return None if file exists, then print error and exit(1)

  **Rationale:**
  - Spec openQuestion 3 resolves to "Fail with descriptive error and exit"
  - Prevents accidental data loss if file already exists
  - Helps detect configuration or environment issues
  - Follows defensive programming practices
  - Matches feature 190 pattern

  ### 7. Commit Message Format: Conventional Commit (from research)

  **Chosen:** `feat(191): create markdown file test-1m1w18.md`

  **Rationale:**
  - Spec openQuestion 4 resolves to this exact format
  - Matches proven pattern from features 188-190
  - Follows conventional commit standard
  - Provides maximum clarity in git history
  - Consistency across 190+ features is essential

  ## Implementation Strategy

  ### Phase Ordering Rationale

  The phases are ordered by dependency:

  1. **Phase 1 (Foundation)** must come first — establishes the script structure and constants
  2. **Phase 2 (File Creation)** comes before validation — we need a file to validate
  3. **Phase 3 (Validation)** comes before git operations — validation must pass before committing
  4. **Phase 4 (Git Integration)** comes after validation — ensures only valid files are committed
  5. **Phase 5 (Main & Error Handling)** comes last — orchestrates everything with error handling
  6. **Phase 6 (Testing)** comes last — verifies the complete workflow works end-to-end

  ### Why This Approach

  - **Incremental:** Each phase builds on the previous, making testing easier
  - **TDD-Friendly:** Each phase can have dedicated tests (RED → GREEN → REFACTOR)
  - **Error Recovery:** Error handling in main() wraps everything, providing comprehensive protection
  - **Dependency-Aware:** Tasks are ordered so dependencies are satisfied before dependent tasks run

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File already exists | Script fails, file not overwritten | Check Path.exists() before creation; return None if exists; print error and exit(1) |
  | Encoding mismatch (UTF-8 BOM or CRLF) | File fails validation; doesn't get committed | Validate file before git operations; check for BOM (0xEF 0xBB 0xBF) and CRLF (0x0D 0x0A) explicitly |
  | Git not in PATH | subprocess fails with cryptic error | Catch CalledProcessError and provide clear message citing the git command that failed |
  | Pre-existing git state issues | Push fails but file is already committed | This is acceptable; error message tells user push failed so they can retry. File is safely in local repo. |
  | File size outside spec range | File doesn't match pattern, inconsistent with prior features | Validate file size (400-600 bytes) before git operations; prose is exactly 3 sentences |
  | Sentence count wrong (not 3) | File doesn't meet spec requirement FR-3 | Split prose into exactly 3 sentences; validate sentence count before git operations |
  | Markdown structure invalid | File not proper markdown | Validate H1 heading as first line; verify blank line after heading; verify prose comes after |
  | Subprocess injection attack | Command execution exploited | Always use command arrays, never shell=True; FILENAME and git commands are hardcoded constants |

