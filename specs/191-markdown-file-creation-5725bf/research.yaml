# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** Use `pathlib.Path.write_text()` for file creation and `read_bytes()`/`read_text()` for validation.

  **Rejected:**
  - `os` module — less modern, verbose, not ideal for cross-platform path operations
  - Built-in `open()` — requires more boilerplate for encoding and newline control

  **Rationale:** pathlib is the modern standard in Python 3.11+ and is already used throughout
  the Sheep codebase. It provides clean methods for text file operations with explicit encoding
  control. The pattern `write_text(encoding="utf-8", newline="\n")` ensures UTF-8 without BOM
  and Unix LF line endings on all platforms. Feature 190 successfully uses this approach.

  ### 2. Git Command Execution: subprocess.run()

  **Chosen:** Use `subprocess.run()` with command arrays and `check=True` flag.

  **Rejected:**
  - GitPython library — adds external dependency (violates NFR-5)
  - `shell=True` with string commands — security risk, harder to debug
  - `os.system()` — deprecated, no error handling

  **Rationale:** subprocess.run() with command arrays (not shell=True) is the secure, modern
  standard for executing external commands in Python. The check=True flag raises CalledProcessError
  on non-zero exit codes. This approach is proven in feature 190 and avoids shell injection risks.
  No external dependencies are added.

  ### 3. File Validation Strategy: Pre-operation Comprehensive Validation

  **Chosen:** Validate file structure, encoding, and line endings BEFORE any git operations.

  **Rejected:**
  - Post-write validation only — could commit invalid files to git
  - No validation — unreliable, violates spec FR-5 and NFR-5

  **Rationale:** Validating file properties before git operations follows fail-fast principles and
  prevents committing invalid files. This is explicitly required by spec FR-5. Validation is fast
  and provides clear error messages for debugging. Feature 190 implements this pattern successfully.

  ### 4. Encoding and Line Endings: UTF-8 without BOM + Unix LF

  **Chosen:** `encoding='utf-8'` and `newline='\n'` parameters in write_text().

  **Rejected:**
  - Native line endings (`newline=''`) — creates CRLF on Windows, not cross-platform
  - UTF-8 with BOM — not needed, adds 3 bytes, not standard for markdown

  **Rationale:** Spec FR-4 explicitly requires UTF-8 without BOM and Unix LF line endings.
  `write_text(encoding="utf-8", newline="\n")` achieves this reliably on all platforms. Validation
  must check for UTF-8 BOM (bytes 0xEF 0xBB 0xBF) and CRLF sequences (0x0D 0x0A).

  ### 5. Error Handling: Comprehensive with Specific Exception Types

  **Chosen:** Catch specific exceptions (ValueError, OSError, CalledProcessError) with descriptive messages.

  **Rejected:**
  - Minimal try-catch — misses edge cases, hard to debug
  - No error handling — cryptic failure messages

  **Rationale:** Comprehensive error handling is required by spec (openQuestion 5 selects this option).
  Each phase has specific error cases: pre-existing file detection (FR-9), validation errors, git
  failures. Feature 190 implements this pattern. Error messages cite file paths, encoding details,
  and git command output to aid debugging.

  ### 6. Content Generation: Template-based Constants

  **Chosen:** Fixed title and 3-sentence prose stored as module-level constants (TITLE, PROSE, FILENAME).

  **Rejected:**
  - Dynamic content generation — non-deterministic, violates NFR-10
  - Random sentence selection — inconsistent results

  **Rationale:** Spec resolves content topic to 'Generic technical content' and sentence count to
  'Exactly 3 sentences'. Module-level constants provide reproducibility and match feature 190's
  pattern. Prose should cover generic topics (testing, reliability, markdown, etc.) to maintain
  consistency with 190+ existing test files.

  ### 7. Pre-existing File Handling: Check and Fail

  **Chosen:** Check file existence before creation; return None if exists, print error, exit(1).

  **Rejected:**
  - Overwrite silently — risks data loss
  - Back up then create — adds complexity

  **Rationale:** Spec resolves this to 'Fail with descriptive error and exit' (openQuestion 3).
  Check `Path.exists()` and return None if file exists. Main() detects this and prints error
  then exits(1). This prevents accidental data loss and provides clear feedback. Feature 190
  implements this pattern.

  ### 8. Commit Message Format: Conventional Commit with Descriptor

  **Chosen:** Use `feat(191): create markdown file test-1m1w18.md` format.

  **Rejected:**
  - Minimal format like `feat(191): add test-1m1w18.md` — less descriptive
  - Informal format like `Add test file` — not conventional commit standard

  **Rationale:** Spec resolves this to the full descriptive format (openQuestion 4). This exactly
  matches features 188-190 and is the conventional commit standard. The format provides maximum
  clarity in git history. Consistency across 190+ features is essential for maintainability.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | Cross-platform file I/O | Use | Standard in Python 3.11+, already used throughout codebase, provides clean API for encoding control |
  | subprocess | Execute git commands | Use | Standard library, secure (no shell=True), proven in feature 190, no external dependencies |
  | sys | Exit codes and stderr | Use | Standard library, necessary for proper error reporting |
  | os | File paths, exists checks | Use (if needed) | Standard library, pathlib covers most use cases but os can supplement if needed |
  | GitPython | Git operations wrapper | Reject | Adds external dependency; spec NFR-5 requires "no external dependencies beyond Python 3.11+ standard library" |
  | dataclasses | Data structure definition | Reject | Not needed; constants are simple module-level variables, not complex data structures |

  ## Security Considerations

  ### Command Injection Prevention

  **Risk:** Using shell=True with user-controlled input in git commands could allow command injection.

  **Mitigation:** Always use command arrays (not shell=True) in subprocess.run(). Git commands are
  built with hardcoded strings and constant filenames, no user input. Example:
  `subprocess.run(["git", "add", FILENAME], check=True)` is safe; `os.system(f"git add {FILENAME}")` would not be.

  ### File Path Validation

  **Risk:** If filename is user-controlled, could create files outside repository root.

  **Mitigation:** FILENAME is a constant (test-1m1w18.md). File is created at repository root via
  `Path(FILENAME)` which stays in current directory. No path traversal possible.

  ### Encoding Validation

  **Risk:** Files with invalid UTF-8 or wrong line endings could cause issues for downstream tools.

  **Mitigation:** Pre-operation validation checks for:
  - UTF-8 BOM (forbidden by spec)
  - CRLF line endings (forbidden by spec, replaced with LF)
  - Valid UTF-8 decoding (reject non-UTF-8)
  - H1 heading structure

  ### File Permissions

  **Risk:** Created files could have incorrect permissions (too permissive).

  **Mitigation:** pathlib.Path.write_text() respects system umask. On typical Unix systems (umask
  0022), created files are 0644 (readable by all, writable only by owner), which is appropriate
  for repository files. Windows uses ACLs and handles permissions differently. No explicit
  chmod() needed.

  ### Git Push Safety

  **Risk:** If git push fails (network issue, permission denied), file is already committed locally.

  **Mitigation:** This is acceptable. Spec requires push to occur, but if network is temporarily
  down, having the file committed locally is better than discarding it. Error message tells user
  push failed so they can retry.

  ## Performance Implications

  ### File I/O Performance

  **File creation:** Writing ~500 bytes to disk is ~0.1ms on typical hardware.

  **File validation:** Reading bytes, decoding UTF-8, string operations, line splitting ~0.2ms.

  **Total:** Negligible. Spec NFR-3 requires completion within 5 seconds; file operations are sub-millisecond.

  ### Git Operations Performance

  **git add:** Updating index for one file ~5-50ms (depends on repo size, filesystem).

  **git commit:** Creating commit object ~10-100ms (depends on repo size, filesystem).

  **git push:** Network I/O dependent, typically 0.5-5 seconds depending on network latency.

  **Bottleneck:** git push to remote is the only significant latency (network-bound). File operations
  and validation are negligible. Total operation should complete within 5 seconds for most networks
  (unless connection is very slow).

  ### Memory Usage

  **File content:** ~500 bytes of prose fits easily in memory.

  **Subprocess overhead:** subprocess.run() is lightweight, spawns one process per git command (~3 MB overhead per subprocess).

  **Total:** Negligible for this operation. No optimization needed.

  ## Architecture Notes

  ### How This Fits Into Existing Architecture

  This feature is a direct extension of the established markdown file creation pattern in the Sheep
  platform. The implementation:

  1. **Follows existing conventions:** Features 1-190 all create test-*.md files in repository root.
     Feature 191 is identical in pattern: create file, validate, git add/commit/push.

  2. **No source code changes:** This is a standalone script (create_markdown_file_191.py), similar to
     create_markdown_file_190.py, create_markdown_file.py, etc. No changes to src/sheep/ package needed.

  3. **Uses established validation patterns:** The validation logic (UTF-8 BOM check, CRLF detection,
     H1 heading check, sentence count, file size) is proven across 190+ prior features.

  4. **Integrates with git workflow:** Uses subprocess to git add/commit/push, consistent with how
     Sheep platform automates code contributions.

  5. **Maintains consistency:** Same file structure (H1 + blank line + prose), same encoding, same
     line endings, same commit message format across all features.

  ### Reference Implementation

  Feature 190's create_markdown_file_190.py is a complete reference implementation that demonstrates:
  - File creation with proper encoding/line endings
  - Comprehensive validation function
  - Git operation functions (add, commit, push)
  - Error handling in main()
  - Proper use of pathlib and subprocess

  Feature 191 should follow this pattern exactly, changing only:
  - FILENAME: "test-08hm34.md" → "test-1m1w18.md"
  - TITLE: (generic technical content)
  - PROSE: (3 sentences of generic technical content)
  - COMMIT_MESSAGE: "feat(190): ..." → "feat(191): ..."

  ## Dependencies Analysis

  ### Required External Systems

  - **Git:** Must be installed and in PATH for subprocess calls to work
  - **Remote git repository:** Must have origin configured for git push to succeed

  ### Python Standard Library Modules

  - `sys` — for exit codes and stderr output
  - `subprocess` — for git command execution
  - `pathlib` — for file I/O and path handling
  - (Optional) `os` — file operations, but pathlib covers most needs

  ### No External Package Dependencies

  Per spec NFR-5: "No external dependencies beyond Python 3.11+ standard library"

  All required functionality is available in standard library. Do NOT add:
  - GitPython (too heavyweight)
  - requests (not needed)
  - Click or argparse (script does not need CLI args)

  ## Implementation Checklist

  - [ ] Use pathlib.Path for file creation
  - [ ] Ensure UTF-8 encoding without BOM via `encoding="utf-8"`
  - [ ] Force Unix LF line endings via `newline="\n"`
  - [ ] Check for pre-existing file, return None if exists
  - [ ] Implement validate_file() function with all checks from spec FR-4
  - [ ] Validate file structure (H1 heading, blank line, prose) before git operations
  - [ ] Validate file encoding (no BOM) and line endings (no CRLF)
  - [ ] Validate file size is 400-600 bytes
  - [ ] Validate sentence count is exactly 2-3 (should be exactly 3)
  - [ ] Use subprocess.run() with command arrays (not shell=True) for git operations
  - [ ] Include check=True flag to raise CalledProcessError on git command failure
  - [ ] Catch specific exceptions: ValueError, OSError, CalledProcessError
  - [ ] Provide clear error messages citing file paths, encoding info, git output
  - [ ] Use conventional commit format: `feat(191): create markdown file test-1m1w18.md`
  - [ ] Follow exact pattern from feature 190 implementation

  ## Success Criteria from Spec

  This research confirms that the feature spec's success criteria are achievable using:

  - **File structure:** pathlib.Path.write_text() creates file at repository root with proper structure
  - **Encoding/line endings:** UTF-8 without BOM + Unix LF via write_text parameters
  - **Validation:** Comprehensive checks before git operations (structure, encoding, size, sentence count)
  - **Git integration:** subprocess.run() with command arrays for add/commit/push
  - **Error handling:** Specific exception catches with clear messages
  - **Determinism:** Template-based constants ensure consistent results

  No blockers identified. Implementation should follow feature 190 pattern exactly.

