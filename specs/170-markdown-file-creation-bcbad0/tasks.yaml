content: |
  ## Summary

  The implementation follows a linear, sequential workflow with 6 concrete tasks across 2 phases:

  **Phase 1: Content Generation & File Creation**
  - Task 1: Generate markdown content via Claude API using `generate_markdown_content()`
  - Task 2: Write file to disk with UTF-8 encoding via `write_markdown_file()`
  - Task 3: Validate file structure, encoding, and line endings via `validate_markdown_file()`

  **Phase 2: Git Integration & Push**
  - Task 4: Commit file with exact message \"feat(170): ...\" via `commit_markdown_file()` with custom_message parameter
  - Task 5: Push to origin with upstream tracking via `push_markdown_file()`
  - Task 6: Integration test the complete end-to-end workflow

  **Total Effort: 15 minutes** (4+2+2+3+3+1 minutes)

  ### Why This Task Order?

  1. **Content generation first** (Task 1): Fail fast if LLM is unavailable; no point creating files if content generation fails
  2. **File operations second** (Tasks 2-3): Create and validate file before touching git; ensures data quality before committing
  3. **Validation before commit** (Task 3): Confirm file meets all requirements before committing bad data to history
  4. **Git operations last** (Tasks 4-5): Once file is confirmed valid, stage, commit, and push in sequence
  5. **Integration test final** (Task 6): Verify the complete workflow works end-to-end with all integration points

  ### Key Implementation Details

  - **Feature Number in Commit**: Task 4 must call `commit_markdown_file()` directly with `custom_message` parameter set to exactly `\"feat(170): Create markdown file test-day2kn.md with prose content\"` to ensure feature number 170 (not the hardcoded 145 from `create_markdown_file()`)
  - **Encoding Validation**: Task 3 uses binary file read to validate UTF-8 encoding without BOM and LF-only line endings, not relying on text mode which might mask issues
  - **Error Handling**: All tasks log errors via `sheep.observability.logging.get_logger()` and re-raise exceptions for caller handling (fail-fast pattern)
  - **All Tasks Use Existing Helpers**: No modifications to source code required; all tasks orchestrate existing, battle-tested functions from sheep.content_generators and sheep.tools
