# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file named `test-ngkv5b.md` in the repository root with a markdown heading
  as title and 2-3 sentences of prose content, following the established pattern of 90+ test files
  in the Sheep project. This is a continuation of the markdown-file-creation feature pattern established
  in features 069-228, with identical requirements and implementation approach.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  demonstrating automated file creation, git integration, and conventional commit workflows.

  ## Success Criteria

  - [ ] File `test-ngkv5b.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-ngkv5b.md`
  - [ ] Git commit with exact message exists: `feat(229): create markdown file test-ngkv5b.md with prose content`
  - [ ] Commit is created on the feature branch `feat/229-markdown-file-creation-a494fc`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-ngkv5b.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-ngkv5b.md`
  - **FR-7**: File must be committed with the exact message: `feat(229): create markdown file test-ngkv5b.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/229-markdown-file-creation-a494fc`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes as a natural outcome of proper structure
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 90+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (free-form)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Decisions

  **Status**: No product decisions required. This feature is fully specified by the established pattern from 150+ identical implementations (features 069-228). All aspects are predetermined:

  | Decision Area | Specification | Rationale |
  | ------------- | ------------- | --------- |
  | Filename | `test-ngkv5b.md` (pre-specified) | Exact filename provided in feature spec |
  | Content structure | `# Heading\n\n<2-3 sentences>` | Established pattern from 90+ existing files |
  | File format | UTF-8 with LF line endings, 400-600 bytes | Fixed by precedent and technical requirements (FR/NFR) |
  | Prose topic | Implementer's free choice | Minimizes cognitive load; diverse topics observed across existing test files |
  | Implementation approach | Python pathlib `Path.write_text()` | Matches all 150+ prior implementations; simple, idiomatic |
  | Git workflow | Manual (add, commit, push) | Standard precedent from 150+ prior implementations |
  | File location | Repository root | Established pattern, follows all 90+ existing test files |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-ngkv5b.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-228; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/229-markdown-file-creation-a494fc` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-ngkv5b.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-228) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-ngkv5b.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 150+ prior implementations
