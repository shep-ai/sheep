content: |
  ## Problem Statement

  Create a single markdown file named test-vlexrc.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content, then execute the complete git workflow (add/commit/push) to integrate this file into the feature branch. This is test iteration 133 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks.

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is organized as follows:

  - **Root Directory**: Contains 130+ existing test-*.md files created by preceding features (125-132), following a consistent naming pattern and format
  - **src/sheep/**: Main package directory containing:
    - **agents/**: Agent definitions (code_agents.py, general_agents.py)
    - **features/**: Feature implementations (feature_NNN_markdown_file_creation.py)
    - **flows/**: Orchestration logic (code_implementation.py, chat.py)
    - **config/**: Configuration management (settings.py, llm.py)
    - **content_generators.py**: Utility for generating markdown content
  - **specs/**: Feature specification directories (125+ features with YAML specs)
  - **tests/**: Test files validating file creation and git operations
  - **.github/workflows/**: CI/CD configuration (ci.yml)

  ### Architecture Patterns

  1. **Pattern Consistency**: Features 125-132 follow an identical pattern: create test-*.md file → stage with git add → commit with conventional message → push to feature branch. Feature 133 continues this validation pattern.

  2. **Existing Test Files**: 130+ test-*.md files already exist in the repository root, each containing:
     - H1 markdown heading (title)
     - Blank line separator
     - 2-3 sentences of prose content
     - UTF-8 encoding without BOM

  3. **Git Workflow Pattern**: All related features use:
     - Conventional commit format: `feat(NNN): Create markdown file test-XXXXX.md`
     - Feature branch: `feat/NNN-markdown-file-creation-XXXXX`
     - Full end-to-end workflow (add/commit/push)

  4. **Markdown Content Generation**: No external markdown libraries required; simple string formatting suffices. Content is random/generic prose (software, platforms, general observations).

  ### Relevant Technologies

  - **Python 3.11+**: Built-in pathlib and file I/O for file creation
  - **Git**: Standard operations (add, commit, push) via subprocess or GitPython
  - **Markdown**: Basic format with H1 heading and prose (no advanced features)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | A new markdown file (test-vlexrc.md) will be created following the pattern of 130+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging, conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting and encoding |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation**: Python's built-in pathlib and file I/O
  2. **Markdown Generation**: Simple string formatting (no markdown libraries required)
  3. **Git Integration**: Existing git commands or GitPython library (already a project dependency)
  4. **Content Generation**: Simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-132, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 8+ times in preceding features (125-132)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-132) were completed in a single commit with minimal complexity
