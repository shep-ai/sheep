# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-20

  ## Technology Decisions

  ### 1. Markdown Content Generation Strategy

  **Chosen:** Use CrewAI's LLM framework to generate content via Claude API

  **Rejected:**
  - Static/hard-coded content — does not validate platform's ability to generate content, conflicts with randomly-generated prose requirement from features 125-132
  - Template-based random selection — less sophisticated, doesn't test coherent prose generation capability
  - Direct anthropic.messages API calls — adds complexity, duplicates existing CrewAI abstraction

  **Rationale:** CrewAI is already a project dependency used throughout platform. The generate_markdown_content() function in src/sheep/content_generators.py implements this pattern with prompt template requesting H1 heading + 2-3 sentences. This validates platform's content generation capability (key validation objective), not just file I/O. Approach matches features 125-132 exactly.

  ### 2. File I/O and Encoding

  **Chosen:** Python's pathlib with UTF-8 text mode encoding (no BOM)

  **Rejected:**
  - os.path + open() — less Pythonic, no functional advantage
  - Third-party libraries (fsspec, nio) — unnecessary dependencies for simple operations
  - Binary mode + manual UTF-8 — adds complexity without benefit

  **Rationale:** pathlib is modern Python standard (3.4+) for filesystem operations. UTF-8 without BOM is web standard and aligns with non-functional requirements. Existing write_markdown_file() function uses this approach. Text mode with UTF-8 automatically handles line ending normalization per platform conventions.

  ### 3. Git Workflow Integration

  **Chosen:** Reuse existing GitCommitTool and GitPushTool from sheep.tools.git_tools

  **Rejected:**
  - Direct subprocess.run() calls — duplicates existing tool logic and error handling
  - GitPython library — adds external dependency for operations already covered
  - Bash subprocess — less portable, inconsistent error handling

  **Rationale:** Platform provides GitCommitTool and GitPushTool that encapsulate operations consistently. Used in features 125-132. Reusing ensures consistency, reduces duplication, maintains platform patterns. Tools handle error capture, logging, and provide typed input schemas via Pydantic.

  ### 4. Commit Message Format

  **Chosen:** Conventional commit: feat(133): Create markdown file test-vlexrc.md

  **Rejected:**
  - Dynamic message with content topic — adds complexity, not required
  - Generic messages — less informative, inconsistent with platform standards
  - Multi-line messages — exceeds requirements

  **Rationale:** Specification explicitly requires this format. Follows conventional commit standard, matches features 125-132. Message is deterministic (based on filename alone), making it idempotent and easily verifiable in git history.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File path manipulation and I/O | Use | Modern Python standard, clean API, already used in platform |
  | CrewAI | LLM framework and orchestration | Use | Project dependency, handles model selection and API keys, proven in 125-132 |
  | Claude API | Content generation | Use | Specified in project config, generates coherent prose, already integrated |
  | subprocess | Git command execution | Use (via GitTools) | Standard library, safe process execution, already wrapped by tools module |
  | GitPython | Git operations library | Reject | Unnecessary; existing GitTools provide cleaner abstraction |
  | markdown | Markdown parsing/validation | Reject | Not needed; validation in content_generators.py |
  | pathspec | Path pattern matching | Reject | Not needed; simple filename validation sufficient |

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** write_markdown_file() validates filenames to prevent path traversal. Rejects "/" or "\" characters and names starting with ".".
  - **Content safety:** Generated by Claude via LLM with safety guardrails. No user-supplied content used directly.
  - **File encoding:** UTF-8 without BOM prevents encoding-based injection attacks.

  ### Git Operations Security
  - **No credential exposure:** GitTools use subprocess with captured output. Credentials managed by git config, not in arguments.
  - **Commit verification:** Conventional format and simple message reduce risk of malicious metadata injection.
  - **Push safety:** GitPushTool uses -u flag for upstream tracking, prevents silent failures or force-push risks.

  ### Process Safety
  - **No shell injection:** subprocess calls use list format (not shell=True), prevents command injection.
  - **Error handling:** All exceptions caught and logged. Failures don't leave partial state (file creation and git ops separate).
  - **File permissions:** Created with default umask (typically 0644 on Unix). Directory is repository root (controlled environment).

  ## Performance Implications

  ### Content Generation
  - **LLM latency:** Claude API calls typically 500ms–2s depending on load. This is critical path.
  - **Token usage:** Prompt ~150 tokens, response ~100–200 tokens. Minimal cost for single file.
  - **Caching:** No caching applied. Not problematic for single-file scope.

  ### File I/O
  - **Disk I/O:** Writing 500–1000 bytes to local filesystem negligible (<10ms typical).
  - **Validation:** validate_markdown_file() reads twice (binary, text) but file is small and cached.

  ### Git Operations
  - **Network latency:** git push depends on network conditions. SSH typically 200ms–2s. Can fail transiently.
  - **Repository size:** Not affected. Single-file creation doesn't impact performance.
  - **Retry strategy:** Handled by calling code (feature orchestration).

  ### Overall
  - **Sequential execution:** Workflow is sequential. LLM step dominates (~1–2s total).
  - **Optimization:** Not needed for single file creation. Acceptable performance.

  ## Architecture Notes

  ### Integration with Sheep Platform
  - **Pattern consistency:** Feature 133 follows identical pattern of features 125-132. Validates platform's ability to reliably execute same task repeatedly.
  - **Modular design:** Content generation, file writing, git ops separated into modules. Feature orchestrates these.
  - **Dependency injection:** create_markdown_file() accepts optional repo_path, allowing use in different contexts.

  ### Code Organization
  - **No new modules:** Uses existing modules in src/sheep/. No new utilities or abstractions needed.
  - **LLM configuration:** Via CrewAI/sheep settings. Uses default model from config. Feature doesn't manage credentials.
  - **Logging:** Integrated with sheep.observability.logging. All steps logged at INFO with DEBUG details.

  ### Repeatability and Idempotency
  - **Deterministic behavior:** Filename fixed (test-vlexrc.md), commit message deterministic. Content non-deterministic (LLM-generated) as required.
  - **Retry safety:** Re-running should detect existing file and handle appropriately. Validate that feature handles existing files.
  - **Test verification:** Tests validate file existence, encoding, format, git history. Decouples feature from validation.

  ## Implementation Strategy

  ### High-Level Flow
  1. Import create_markdown_file() from sheep.content_generators
  2. Call with filename "test-vlexrc.md"
  3. Function returns dict: filepath, content, commit_message, push_result
  4. Return result for test verification

  ### Error Handling
  - **Content generation failure:** CrewAI raises Exception if LLM fails. Propagate with context.
  - **File write failure:** OSError if disk full or permissions denied. Propagate with context.
  - **Git failure:** CalledProcessError if git commands fail. Propagate; calling code handles retry.
  - **Validation:** ValueError if format invalid. Tests verify, not feature code.

  ## Success Verification

  - File test-vlexrc.md exists in repository root
  - Line 1: H1 heading
  - Line 2: blank line
  - Lines 3+: 2–3 sentences of prose
  - UTF-8 encoded without BOM
  - Git log: feat(133): Create markdown file test-vlexrc.md
  - Pushed to feat/133-markdown-file-creation-a5bfe3 branch

  ## Known Constraints

  - Requires initialized git repository
  - Claude API credentials required (environment variables or config)
  - Disk space required for file creation
  - Network access required for git push
  - Single-threaded sequential execution
