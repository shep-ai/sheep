# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The user wants a simple markdown file added to the repository root containing
  a title and 2-3 sentences of content about any topic. This is a trivial,
  content-only task that follows the established pattern used in features 006
  (JOKE.md), 008 (SHEEP.md), and recent features 287-291 (test-*.md files).
  No code changes or architectural decisions are required.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation. The
  repository is organized as follows:

  - **Root directory**: Contains various markdown files (`README.md`, `JOKE.md`,
    `SHEEP.md`, `DESIGN_PATTERN.md`, and numerous test-*.md files generated by
    recent features)
  - **specs/**: Feature specifications in YAML format, each with analysis,
    research, planning, and task tracking
  - **src/**: Source code for the Sheep platform itself
  - **.github/workflows/**: CI/CD configuration

  ### Architecture Patterns

  The repository follows a spec-driven development workflow:

  1. Each feature is defined in `specs/{number}-{name}/spec.yaml`
  2. Implementation follows the spec with analysis → research → planning →
     implementation → review → commit/push phases
  3. Content-only features (like this one) skip code analysis and testing,
     focusing directly on file creation
  4. Git workflow: create branch → make changes → commit → push to remote

  ### Relevant Technologies

  - **Markdown**: All content files use standard Markdown syntax
  - **Git**: Version control for the repository
  - **YAML**: Feature specifications are defined in YAML format
  - **Plain text files**: The feature creates a simple .md file

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (/) | Low | Adding a single new markdown file (test-ghvqqs.md) at the repository root |

  ## Dependencies

  None. This feature has no dependencies on existing code, libraries, or
  infrastructure. It is a pure content creation task.

  ## Success Criteria

  - [ ] File named `test-ghvqqs.md` exists at the repository root
  - [ ] The file contains a valid Markdown H1 heading
  - [ ] The file contains 2-3 sentences of prose content about any topic
  - [ ] The content is coherent and well-written
  - [ ] The file ends with a trailing newline (POSIX convention)
  - [ ] The file uses UTF-8 encoding
  - [ ] No existing files are modified
  - [ ] Changes are committed and pushed to remote

  ## Functional Requirements

  - **FR-1**: Create a new file named exactly `test-ghvqqs.md` at the
    repository root
  - **FR-2**: The file MUST begin with a Markdown H1 heading (e.g.,
    `# Descriptive Title`)
  - **FR-3**: The file MUST contain 2-3 sentences of prose content following
    the heading
  - **FR-4**: The content may be about any topic (technical, whimsical, factual,
    etc.)

  ## Non-Functional Requirements

  - **NFR-1**: The file MUST be valid Markdown that renders correctly on GitHub
  - **NFR-2**: The file MUST use UTF-8 encoding
  - **NFR-3**: The file MUST end with a single trailing newline (POSIX standard)
  - **NFR-4**: The filename MUST be exactly `test-ghvqqs.md` (case-sensitive)
  - **NFR-5**: No existing files may be modified as part of this change

  ## Affected Code Sections

  This feature does not modify any source code. It only adds a new file to the
  repository root.

  ## Testing Strategy

  No automated tests are required. This is a content-only feature.

  The success criteria above can be verified manually:

  1. Check that `test-ghvqqs.md` exists: `ls -la test-ghvqqs.md`
  2. Verify file content starts with an H1 heading
  3. Count the sentences to confirm 2-3 are present
  4. Check for trailing newline: `tail -c 1 test-ghvqqs.md | od -c` (should
     show newline)
  5. Verify the file renders correctly on GitHub when viewed in the web UI

  ## Size Estimate

  **S** — Single file creation with no code changes, no tests, no integration
  required. Implementation takes approximately 5-10 minutes:

  - Choose a topic (1 min)
  - Write a title and 2-3 sentences (3-5 min)
  - Commit and push (1-2 min)
  - Verify on GitHub (1-2 min)

  This is identical in scope and complexity to features 006 (JOKE.md) and 008
  (SHEEP.md), both marked as size S. The recent features 287-291 are also size
  S markdown file creations with similar structure.

  ## Implementation Notes

  - The file should be created at the repository root, at the same directory
    level as `README.md`, `JOKE.md`, `SHEEP.md`, etc.
  - The topic/content is completely open-ended; the implementer has full
    creative freedom
  - No validation of topic appropriateness is required beyond standard content
    policies (keep it respectful and professional)
  - The file path will be: `/test-ghvqqs.md` (at repo root)
