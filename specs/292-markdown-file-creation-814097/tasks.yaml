# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature requires three sequential tasks:

  1. **Create the markdown file** (task-1): Write test-ghvqqs.md with an H1 heading and 2-3 sentences.
     The implementer has full creative freedom on topic and content, provided it is coherent and professional.
     Estimated 15 minutes.

  2. **Verify structure and encoding** (task-2): Confirm the file meets all specifications: correct filename,
     proper Markdown structure, UTF-8 encoding, trailing newline, sentence count, and that no existing
     files were modified. Estimated 10 minutes.

  3. **Commit and push** (task-3): Stage the new file, create a conventional commit with descriptive message,
     and push changes to remote. Estimated 5 minutes.

  **Total Estimated Effort:** 30 minutes

  ## Implementation Flow

  The tasks are strictly sequential:
  - task-1 (file creation) must complete before task-2 (verification)
  - task-2 (verification) must complete before task-3 (commit/push)
  - No parallel work is possible

  ## Content Topic Guidance

  The specification provides full creative freedom on the content topic. Appropriate topics include:
  - Technical (algorithm explanation, programming concept, system design)
  - Nature (animal facts, ecosystem information, botanical knowledge)
  - History (historical event, person, or era)
  - Whimsical (short story, fictional world-building)
  - Educational (explanation of a concept, how-to guide)
  - Or any other coherent, professional topic

  The implementer should choose a topic that interests them and write 2-3 clear, well-formed sentences.
