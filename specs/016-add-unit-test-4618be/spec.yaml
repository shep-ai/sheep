content: |
  ## Problem Statement

  The project needs additional unit test coverage. Currently there are tests for
  `file_tools` (test_tools.py), `config/settings` (test_config.py), content files
  (test_state_machine_md.py, test_random_word_file.py), but several modules lack tests
  entirely — notably `git_tools.py`, `web_tools.py`, and the `observability/logging` module.
  The request is to add a single unit test of any kind.

  ## Codebase Analysis

  ### Project Structure
  - `src/sheep/` — main package (agents, config, flows, observability, tools)
  - `src/sheep/tools/` — file_tools.py, git_tools.py, web_tools.py (crewai BaseTool subclasses)
  - `src/sheep/config/` — settings.py (Pydantic Settings classes)
  - `src/sheep/observability/` — logging module
  - `tests/` — pytest test files (test_tools.py, test_config.py, test_state_machine_md.py, test_random_word_file.py)

  ### Architecture Patterns
  - Tools extend `crewai.tools.BaseTool` with a `_run()` method
  - Configuration uses `pydantic-settings` with env var loading and `lru_cache`
  - Tests use plain pytest functions and classes, no fixtures beyond stdlib tempfile
  - Tests follow pattern: import module under test, exercise `_run()` or settings directly

  ### Relevant Technologies
  - **pytest** — test runner configured in pyproject.toml (`testpaths = ["tests"]`)
  - **pydantic / pydantic-settings** — for config and tool input schemas
  - **unittest.mock** — used in test_config.py for patching env vars
  - **tempfile** — used in test_tools.py for filesystem isolation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | tests/ | High | New test file or additions to existing test file |
  | src/sheep/tools/git_tools.py | Low | Module under test (read-only, good candidate for new test) |
  | src/sheep/tools/web_tools.py | Low | Alternative module under test |

  ## Dependencies

  - pytest (dev dependency, already configured)
  - unittest.mock (stdlib, for mocking subprocess/httpx calls)
  - Existing tool classes in src/sheep/tools/

  ## Size Estimate

  **S** — This is a single unit test addition. Follow existing patterns in test_tools.py
  or test_config.py. Can be completed in under an hour.
