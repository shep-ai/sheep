# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown test file following an established pattern across the Sheep project.
  The implementation is straightforward and standalone:

  - **File Creation:** Use Python pathlib.Path to write a markdown file with explicit UTF-8 encoding and LF line ending enforcement
  - **No Code Integration:** Feature is pure file creation; no modifications to src/sheep/ or other source code
  - **Pattern Consistency:** Follows identical structure as 170+ existing test files (H1 heading + blank line + 2-3 prose sentences)
  - **Git Workflow:** Standard staging, conventional commit, and push to feature branch

  The implementation requires no external dependencies beyond Python 3.11+ stdlib and git.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path (from stdlib)

  **Chosen:** Use `pathlib.Path.write_text()` with explicit encoding and newline parameters

  **Why:**
  - Modern Python standard library (available in 3.11+, project requirement)
  - No external dependencies required (aligns with NFR-4)
  - Clean, cross-platform API for file operations
  - Explicit encoding control enables strict compliance with spec requirements

  **Alternatives rejected:**
  - `os.path` — older API; pathlib is the current standard
  - External libraries — unnecessary complexity for simple text file

  ### 2. Encoding & Line Ending Enforcement

  **Chosen:** UTF-8 encoding with explicit `newline='\\n'` parameter

  **Why:**
  - UTF-8 is Python's default encoding (explicitly specifying makes intent clear)
  - The `newline='\\n'` parameter is critical: it disables platform-specific line ending conversion
    (Windows text mode converts \\n to \\r\\n by default)
  - This is the standard Python approach for enforcing Unix line endings across all platforms
  - Ensures 100% compliance with spec requirement for LF-only files

  **Example:** `Path('file.md').write_text(content, encoding='utf-8', newline='\\n')`

  ### 3. Git Integration: subprocess.run() with CLI

  **Chosen:** Use `subprocess.run()` for git commands (add, commit, push)

  **Why:**
  - Lightweight, stdlib-native, zero external dependencies
  - Git operations are simple and straightforward (basic add/commit/push)
  - Subprocess calls use explicit argument lists (no shell=True, prevents injection)
  - Standard approach in similar Sheep automation scripts
  - Easier to debug and understand than wrapper libraries

  **Alternatives rejected:**
  - GitPython — external dependency violates NFR-4 (stdlib only)
  - Dulwich — overkill for basic operations; adds package management overhead

  ### 4. Content Generation: Manual Prose

  **Chosen:** Write exactly 2-3 sentences of coherent, grammatically correct prose

  **Why:**
  - Spec requires coherent, correct prose (NFR-2) — manual writing ensures quality
  - No complex content logic required (single execution feature)
  - All 170+ precedent files use manually written content
  - Topic is unconstrained per spec — arbitrary selection is explicitly permitted

  **Alternatives rejected:**
  - Templates — overengineering; no dynamic substitution needed
  - AI-generated prose — adds external API dependency, non-deterministic output

  ### 5. File Size Validation

  **Chosen:** Post-creation validation — check `Path.stat().st_size` is 300-600 bytes

  **Why:**
  - Pre-creation estimation is unreliable (actual size depends on platform encoding)
  - Post-creation check is only reliable approach
  - Simple validation (single stat() call) catches errors early, before git operations
  - Safety measure ensures compliance before irreversible git push

  ### 6. Implementation Approach

  **Chosen:** Single synchronous Python script (executed once during implementation)

  **Why:**
  - This is a one-off file creation task (single execution, S-size feature)
  - No reusability, testing framework, or configuration variation needed
  - Linear sequential flow (write → validate → git add → commit → push) is clearest
  - Matches successful pattern from features 158-160
  - Aligns with 10-15 minute estimate (NFR-3)

  ## Implementation Strategy

  ### Phase Ordering & Rationale

  **Phase 1: File Creation & Validation (First)**
  - Create the markdown file with proper structure and encoding
  - Validate file meets all specifications before committing
  - Rationale: File must exist and be correct before git operations; validation gates the next phase

  **Phase 2: Git Integration & Push (Second)**
  - Stage, commit, and push the validated file
  - Rationale: Final step; depends on successful completion of Phase 1

  ### Execution Flow

  1. Write markdown file with H1 heading and 2-3 prose sentences
  2. Ensure UTF-8 encoding (no BOM) and LF line endings via pathlib parameters
  3. Validate file size is 300-600 bytes
  4. Stage file with `git add test-fzgsdv.md`
  5. Commit with conventional message: `feat(161): Create markdown file test-fzgsdv.md with prose content`
  6. Push to feature branch `feat/161-markdown-file-creation-d9eb09`
  7. Verify git log shows only new file (no modifications to existing files)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding not UTF-8 without BOM** | Explicitly pass `encoding='utf-8'` to pathlib write_text(); verify with hex dump or encoding validation |
  | **Line endings not LF on Windows** | Use `newline='\\n'` parameter in write_text(); this disables platform conversion |
  | **File size outside 300-600 byte range** | Post-creation validation: check `Path.stat().st_size` before git operations |
  | **Git operations fail** | Use subprocess error handling; check return codes before proceeding |
  | **Prose content is incoherent** | Manual writing with human review ensures quality and coherence |
  | **Feature branch doesn't exist** | Branch pre-created per spec; verify existence before push |
  | **Commit message format incorrect** | Use hardcoded message string; verify against spec format before committing |
  | **Existing files accidentally modified** | Feature is pure file creation (single Path write operation); no existing files touched |

