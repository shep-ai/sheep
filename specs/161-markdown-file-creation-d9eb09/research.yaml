  - [ ] Determine prose topic and write 2-3 sentences of coherent content
  - [ ] Create markdown file with H1 heading, blank line, and prose paragraphs
  - [ ] Verify file encoding is UTF-8 (no BOM) and line endings are LF
  - [ ] Validate file size is 300-600 bytes
  - [ ] Stage file with `git add test-fzgsdv.md`
  - [ ] Commit with message: `feat(161): Create markdown file test-fzgsdv.md with prose content`
  - [ ] Push to feature branch `feat/161-markdown-file-creation-d9eb09`
  - [ ] Verify no existing files were modified (git diff --staged shows only new file)

