# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-31
  - **Status:** Complete — All technical decisions evaluated and documented

  ## Technology Decisions

  ### 1. Feature Implementation Pattern

  **Chosen:** Create feature_289_markdown_file_creation.py module in src/sheep/features/

  **Rejected:**
  - Use utility functions directly without feature module — loses feature-specific tracking
  - Create custom implementation — duplicates code, violates DRY principle
  - Implement as standalone script — reduces Sheep platform integration

  **Rationale:** Features 286-288 establish a clear pattern where each feature is a dedicated
  module that imports utilities from content_generators.py and orchestrates the workflow with
  explicit steps and feature-specific metadata. This enables consistent feature tracking, version
  control, and logging across the Sheep platform's 289+ features.

  ### 2. LLM Provider and Model Selection

  **Chosen:** Use `get_reasoning_llm()` from sheep.config.llm (Claude model via CrewAI framework)

  **Rejected:**
  - Alternative LLM providers (OpenAI, Cohere) — wrong provider, different API configuration
  - Weaker/cheaper models — compromises content quality and may fail validation
  - Custom prompt engineering — risks format inconsistency with established pattern

  **Rationale:** The feature spec explicitly requires Claude API content generation via
  `sheep.config.llm.get_reasoning_llm()`. This is already integrated in content_generators.py
  (line 40-45), which calls the LLM with MARKDOWN_GENERATION_PROMPT optimized for the required
  format (H1 heading + 2-3 sentences). CrewAI framework manages model configuration transparently.

  ### 3. Content Validation Approach

  **Chosen:** Two-layer validation: (1) validate LLM response format immediately after generation,
  (2) validate written file properties and content before committing

  **Rejected:**
  - Single validation after file write — delays error detection and wastes I/O
  - No validation before commit — risks invalid content in repository
  - Validation only during generation — misses encoding/line ending issues

  **Rationale:** The content_generators.py implements complementary validations:
  `_validate_markdown_content()` (line 70-97) checks format immediately after LLM response,
  catching errors early without I/O overhead. Then `validate_markdown_file()` (line 209-303)
  performs comprehensive file validation (UTF-8 BOM, CRLF, trailing newline) and content validation
  (H1 heading, 2-3 sentences). This layered approach ensures both content validity and file integrity.

  ### 4. File Overwrite Protection

  **Chosen:** Check if file exists and raise ValueError before writing

  **Rejected:**
  - Silently overwrite existing file — violates spec, risks data loss
  - Skip creation if file exists — doesn't meet requirement, unclear if feature ran

  **Rationale:** Feature spec resolves: "Fail with error (no overwrite) to prevent silent data loss."
  The `write_markdown_file()` function should check `Path(file_path).exists()` before opening
  with mode "w" and raise ValueError if the file already exists. This implements the specification's
  explicit requirement and prevents accidental data loss.

  ### 5. Git Integration

  **Chosen:** Use CrewAI-based GitCommitTool and GitPushTool via utility functions from
  content_generators.py

  **Rejected:**
  - Use subprocess to call git directly — loses tool integration and structured logging
  - Use GitPython library — different tool than codebase, adds external dependency
  - Manual git command construction — error-prone, not integrated with framework

  **Rationale:** The content_generators.py already implements `commit_markdown_file()` and
  `push_markdown_file()` which use GitCommitTool and GitPushTool from sheep.tools.git_tools.
  These are CrewAI BaseTool subclasses with error handling and structured logging. Using these
  ensures consistency with features 286-288 and proper integration with the Sheep platform.

  ### 6. Sentence Count Validation

  **Chosen:** Count periods (.) in prose content to validate 2-3 sentence requirement

  **Rejected:**
  - Use NLP library (NLTK, spaCy) — adds large dependency for simple requirement
  - Use regex patterns — fragile, difficult to maintain
  - Accept variable counts — violates strict specification

  **Rationale:** Period counting is sufficient because the LLM prompt explicitly requests 2-3
  sentences with periods, and validation fails if count is not exactly 2-3. The approach is
  deterministic, fast, and matches the specification. More sophisticated NLP would add unnecessary
  complexity without proportional benefit for this use case.

  ### 7. Error Handling Strategy

  **Chosen:** Fail fast with exception propagation and structured logging

  **Rejected:**
  - Implement retry logic for transient failures — adds complexity, not in established pattern
  - Use fallback content if API fails — compromises quality
  - Silently continue on validation failures — hides integrity issues

  **Rationale:** Feature spec resolves: "Fail the operation with clear error message... Maintains
  quality standards, keeps implementation simple." The content_generators.py implements this
  throughout: catch exceptions, log with _logger.error(), re-raise. Feature 288 follows the same
  pattern. This ensures failures are visible, debugging is straightforward, and no retry complexity.

  ### 8. Logging Granularity

  **Chosen:** INFO level for major workflow steps, DEBUG level for implementation details

  **Rejected:**
  - Log only errors — insufficient debugging context
  - Log everything at INFO — verbose and noisy
  - Log only at DEBUG — requires log level adjustment to see output

  **Rationale:** The content_generators.py uses a proven strategy: INFO for major operations
  ("Generating markdown content", "Writing markdown file", "File validation passed"),
  DEBUG for details (raw response, file size, commit message). This balances observability with
  readability. structlog provides structured logging with context propagation integrated with
  the Sheep platform observability infrastructure.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | Cross-platform file I/O | Use (required) | Python standard library, already used in content_generators.py, safe path operations |
  | Git (subprocess) | Version control operations | Use (via GitCommitTool/GitPushTool) | Already integrated in sheep.tools.git_tools, provides error handling and structured logging |
  | structlog | Structured logging | Use (required) | Already used throughout content_generators.py and Sheep platform, enables observability |
  | Claude API | LLM content generation | Use (required) | Specified in feature requirements, integrated via CrewAI framework |
  | CrewAI | LLM framework and tools | Use (required) | Provides reasoning LLM access and BaseTool integration for git operations |
  | NLTK/spaCy | Sentence tokenization | Reject | Unnecessary for simple period-based sentence counting, adds large dependency |
  | GitPython | Git operations | Reject | Redundant with existing GitCommitTool/GitPushTool, not part of codebase pattern |

  ## Security Considerations

  ### UTF-8 Encoding and BOM Protection
  The `validate_markdown_file()` function explicitly checks for UTF-8 BOM (Byte Order Mark) on
  line 246-247: `if binary_content.startswith(b"\xef\xbb\xbf"):` raises ValueError. This ensures
  files use clean UTF-8 encoding compatible with markdown parsers and git workflows.

  ### Path Traversal Prevention
  The `write_markdown_file()` function validates filename safety on lines 116-117:
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```
  This prevents path traversal attacks and ensures files are created only in the repository root,
  not in subdirectories. The filename "test-ayadmw.md" passes this check.

  ### File Ownership and Permissions
  Git operations are performed via CrewAI tools with subprocess, running in the context of the
  current user. The git configuration (user.name, user.email) must be set appropriately for
  commits to succeed. No special permission handling is needed — git respects system umask.

  ### API Key Management
  The Claude API key is accessed via `get_reasoning_llm()` which reads from standard Anthropic
  SDK configuration (ANTHROPIC_API_KEY environment variable or ~/.anthropic/config). No keys
  are embedded in code or logs.

  ### Content Generation Safety
  The LLM prompt (MARKDOWN_GENERATION_PROMPT, line 12-23) is a simple, benign instruction.
  The response is validated for format only (H1 heading, 2-3 sentences), not for malicious content.
  This is appropriate for test file generation where content quality is validated but not
  security-scanned.

  ## Performance Implications

  ### Content Generation Latency
  LLM API calls are the primary latency driver (~3-5 seconds typical). The feature waits for
  completion synchronously. No caching, batching, or async improvements are warranted for a
  single file creation feature.

  ### File I/O Overhead
  File write and validation are fast (~milliseconds). Using pathlib ensures efficient cross-platform
  handling. No performance concern.

  ### Git Operations Latency
  Git commit and push are typically fast (~1-2 seconds) but depend on network for push operation.
  The feature waits synchronously. This is acceptable for a single file feature.

  ### Memory Usage
  Content generation returns a string (~300-400 bytes), file I/O buffers content in memory,
  validation reads entire file. Total memory usage is negligible (<1 MB). No optimization needed.

  ### Overall Feature Latency
  Expected execution time: ~5-10 seconds (mostly LLM generation latency). This is acceptable
  for a test file creation feature that runs once per feature.

  ## Architecture Notes

  ### Integration with Sheep Platform
  Feature 289 integrates with the Sheep platform architecture:
  - **LLM Integration:** Uses CrewAI-managed `get_reasoning_llm()` for content generation
  - **Tools Integration:** Uses CrewAI BaseTool subclasses (GitCommitTool, GitPushTool) for git operations
  - **Logging Integration:** Uses structlog via `sheep.observability.logging.get_logger()` for observability
  - **Configuration Integration:** Uses `sheep.config.llm` for LLM configuration

  ### Relationship to Existing Features
  Feature 289 is one of 289+ identical markdown file creation features. The pattern is:
  - Feature 286: test-14epwa.md
  - Feature 287: test-t8i8ub.md
  - Feature 288: test-dx2xd7.md
  - Feature 289: test-ayadmw.md (this feature)

  Each feature creates one unique test file with identical structure. The utility functions
  in content_generators.py handle the complexity; each feature module is a thin orchestration
  layer that specializes the utilities with feature-specific metadata.

  ### Handling File Overwrite Edge Case
  The current `write_markdown_file()` implementation opens files with mode "w", which overwrites
  silently. To match the specification's requirement to "Fail with error (no overwrite)", the
  function should be enhanced to check `Path(file_path).exists()` before opening and raise
  `ValueError(f"File already exists: {file_path}")` if it does. This change should be made
  before feature 289 is executed.

