# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 289 fits into the established Sheep platform architecture as the 289th iteration of an
  identical markdown file creation pattern. Rather than implementing custom logic, the feature module
  imports and orchestrates pre-tested utility functions from src/sheep/content_generators.py.

  ### Dependency Chain

  The feature uses these core utilities from content_generators.py:
  - `generate_markdown_content(llm, filename)` — generates H1 heading + 2-3 sentences via Claude API
  - `write_markdown_file(filename, content)` — writes file to repository root with UTF-8 encoding
  - `validate_markdown_file(filename)` — validates structure (H1 heading, sentences, encoding, line endings)
  - `commit_markdown_file(filename, feature_number)` — stages and commits with conventional message
  - `push_markdown_file()` — pushes to feature branch with upstream tracking

  Each utility function includes error handling, structured logging, and strict validation matching
  the specification requirements. The feature module calls these functions in sequence with explicit
  error propagation.

  ### Integration with CrewAI and Sheep Platform

  The feature integrates with the Sheep platform in three ways:
  1. **LLM Access**: Uses sheep.config.llm.get_reasoning_llm() to access Claude model configured via CrewAI
  2. **Tools**: Uses CrewAI BaseTool subclasses (GitCommitTool, GitPushTool) for git operations with structured logging
  3. **Observability**: Uses structlog for logging with appropriate severity levels (DEBUG, INFO, ERROR)

  This integration ensures the feature benefits from platform-wide configuration, error handling,
  and observability infrastructure.

  ## Key Design Decisions

  ### 1. Reuse Existing Utilities Instead of Custom Implementation

  **Decision**: Import and orchestrate utility functions from src/sheep/content_generators.py.

  **Rationale**: Features 286-288 established a proven pattern where utility functions handle
  markdown generation, validation, and git operations. These utilities are thoroughly tested across
  288 preceding features, maintained centrally for consistency, integrated with CrewAI tools and
  structlog logging, and implement strict validation matching the specification.

  Reimplementing this logic would introduce code duplication, maintenance burden, and risk
  divergence from the established pattern. Reusing utilities ensures consistency while keeping
  the feature module small and focused.

  ### 2. Feature Module as Thin Orchestration Layer

  **Decision**: Create feature_289_markdown_file_creation.py that specializes utilities with
  feature-specific metadata and explicit workflow control.

  **Rationale**: Rather than calling a generic function with parameters, feature 288 (and 289)
  uses an explicit orchestration function that makes the workflow visible and testable, allows
  easy per-feature modifications if needed, maintains clear control flow and error handling, and
  provides feature-specific logging context. This approach is more verbose than a generic function
  but significantly more maintainable.

  ### 3. Strict Validation with Fail-Fast Error Handling

  **Decision**: Validate content format immediately after LLM generation and validate file
  properties before committing. Fail with clear error messages on any validation failure.

  **Rationale**: The specification explicitly requires exactly 2-3 sentences (strict), UTF-8
  encoding without BOM, Unix LF line endings (no CRLF), and file must not overwrite existing files.
  Two-layer validation catches errors early: format validation prevents I/O waste, file validation
  catches encoding/line ending issues. Fail-fast with clear errors makes debugging straightforward
  and prevents silent data loss.

  ### 4. CLI Support for Standalone Execution

  **Decision**: Include if __name__ == '__main__' block allowing feature module to be run
  directly as a script.

  **Rationale**: Feature 288 includes CLI support, allowing the feature to be executed outside
  the CrewAI framework for testing and debugging. This adds no complexity (simple function call)
  while providing significant flexibility.

  ### 5. Conventional Commit Message Format

  **Decision**: Commit message follows format: feat(289): create markdown file test-ayadmw.md with title and prose content

  **Rationale**: The specification explicitly requires this format. The commit message includes
  type (feat for new file creation), scope (289 feature number), and subject (descriptive text
  identifying the specific file). This maintains consistency with git history across all 289
  features and enables automated commit parsing if needed.

  ## Implementation Strategy

  The implementation follows three sequential phases:

  **Phase 1 - Foundation & Environment Validation** (minimal, mostly verification):
  Confirm src/sheep/content_generators.py exports expected utilities, verify Claude API is
  accessible via sheep.config.llm.get_reasoning_llm(), confirm git configuration is set, and
  review feature 288 pattern for consistency.

  **Phase 2 - Feature Module Creation** (main work):
  Create src/sheep/features/feature_289_markdown_file_creation.py, implement the orchestration
  function, import utility functions from content_generators, add proper error handling and
  logging, and include CLI support block.

  **Phase 3 - Workflow Integration & Testing** (execution & validation):
  Execute the feature module, verify Claude API generates appropriate content, confirm markdown
  file is created with correct structure, validate encoding and line endings, verify git commit
  and push succeed, and confirm file meets all 13 success criteria.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API fails or times out | Fail fast with clear error message. No retry logic per spec decision. Error logging helps debugging. |
  | File already exists (overwrite case) | Check Path(file_path).exists() before writing, raise ValueError if file exists. Prevents silent data loss. |
  | Invalid content format (wrong sentence count) | Two-layer validation catches format errors immediately after LLM response, before I/O. Fail if not exactly 2-3 sentences. |
  | UTF-8 encoding issues | pathlib.Path.write_text(encoding='utf-8') ensures correct encoding. Validation checks for BOM. |
  | CRLF or CR line endings | Validation checks for CRLF and CR, rejects if found. Ensures Unix LF only. |
  | Git operations fail | Use CrewAI GitCommitTool and GitPushTool with error handling. Clear error messages from tools. |
  | Missing or invalid git configuration | Verify git config before attempting commit. Error message will surface git configuration issues. |
  | Feature module import errors | Follow feature 288 structure exactly. Proper imports of utilities and error handling. |
  | Inconsistency with established pattern | Reference feature 288 pattern throughout. Reuse utility functions that features 286-288 already validated. |
  | Feature runs twice, creates duplicate commit | Feature number 289 is unique per Sheep platform design. Git prevents duplicate commits via hash. |
