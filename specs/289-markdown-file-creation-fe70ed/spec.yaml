content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 289 creates a single test markdown file
  (`test-ayadmw.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-288.
  With 288 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations.

  ## Success Criteria

  - [ ] File `test-ayadmw.md` is created in repository root
  - [ ] File contains exactly one H1 heading (CommonMark `#`) serving as the title
  - [ ] File contains 2-3 sentences of coherent prose content after the heading
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\n) exclusively, no CRLF or CR
  - [ ] File structure validation passes (H1 heading present, sentence count verified, encoding confirmed)
  - [ ] File is properly staged in git working directory
  - [ ] Commit message follows conventional format: `feat(289): create markdown file test-ayadmw.md with title and prose content`
  - [ ] Commit is successfully pushed to feature branch `feat/289-markdown-file-creation-fe70ed` with upstream tracking
  - [ ] Content is generated via Claude API using `sheep.config.llm.get_reasoning_llm()`
  - [ ] Implementation uses established utility functions from `src/sheep/content_generators.py`
  - [ ] No source code, test files, or configuration files are modified
  - [ ] File size falls within expected range (250-600 bytes, natural outcome of proper structure)
  - [ ] Structlog emits appropriate INFO/DEBUG messages during execution

  ## Functional Requirements

  - **FR-1**: Create a markdown file with exact filename `test-ayadmw.md` in repository root
  - **FR-2**: File must contain a single H1 heading (CommonMark-compliant syntax `# Title`) as the title
  - **FR-3**: File must contain exactly 2-3 sentences of coherent prose content following the heading, separated by a blank line
  - **FR-4**: Content must be generated by Claude API via `sheep.config.llm.get_reasoning_llm()` for quality and variety
  - **FR-5**: Use core utility functions from `src/sheep/content_generators.py`: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - **FR-6**: Stage file in git using `git add test-ayadmw.md`
  - **FR-7**: Create conventional commit with message: `feat(289): create markdown file test-ayadmw.md with title and prose content`
  - **FR-8**: Push commit to feature branch with upstream tracking (`git push -u origin HEAD`)
  - **FR-9**: Validate file structure before committing (H1 heading, 2-3 sentences, encoding, line endings)

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 without BOM
  - **NFR-2**: File must use Unix LF line endings (\n), never CRLF (\r\n) or Mac CR (\r)
  - **NFR-3**: Implementation must follow the established pattern from features 001-288 for consistency
  - **NFR-4**: All logging must use structlog with appropriate severity levels (DEBUG, INFO, ERROR)
  - **NFR-5**: All file I/O operations must use pathlib for cross-platform compatibility
  - **NFR-6**: File size naturally falls in 250-600 byte range (outcome of proper implementation, not a hard constraint)
  - **NFR-7**: No modifications to source code, tests, or configuration files
  - **NFR-8**: No directory creation or modification beyond repository root
  - **NFR-9**: Git operations must respect existing repository hooks (standard git workflow)
  - **NFR-10**: Content generation is non-deterministic (each file contains unique content from 288+ existing files)

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:
  - **Repository root**: Contains 289+ test markdown files (test-*.md) in the established pattern
  - **src/sheep/**: Application source code organized into:
    - `agents/` — CrewAI agent implementations
    - `config/` — Configuration management (LLM providers, settings)
    - `features/` — Feature implementations (feature_001_markdown_file_creation.py through feature_288_markdown_file_creation.py)
    - `tools/` — Git integration tools (GitCommitTool, GitPushTool)
    - `observability/` — Logging and tracing via Langfuse
    - `flows/` — Orchestration workflows
    - `content_generators.py` — Core utilities for markdown file creation
  - **specs/**: Feature specifications (289+ feature directories with their spec.yaml files)
  - **tests/**: Automated test suite for the Sheep platform
  - **pyproject.toml**: Python project metadata, dependencies, and build configuration
  - **.github/**: GitHub workflows and CI/CD configuration
  - **Dockerfile & docker-compose.yml**: Container orchestration files

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (288 precedents):
  - Content generation via Claude API using `sheep.config.llm.get_reasoning_llm()`
  - Utilizes core helper functions from `src/sheep/content_generators.py`:
    - `generate_markdown_content()` — LLM-based generation of H1 heading + 2-3 sentences
    - `write_markdown_file()` — File I/O using pathlib with UTF-8 encoding
    - `validate_markdown_file()` — Structural validation (H1 heading, sentences, encoding, line endings)
    - `commit_markdown_file()` — Git staging and conventional commit
    - `push_markdown_file()` — Remote push with upstream tracking
  - File structure: `# Heading\n\n<2-3 sentences of prose>\n`
  - UTF-8 encoding without BOM; Unix LF line endings
  - File size typically 250-600 bytes (natural outcome of proper structure)
  - Logging via structlog with DEBUG/INFO/ERROR levels

  **Git Workflow Pattern**:
  - Feature branch created as `feat/289-markdown-file-creation-fe70ed` (pre-created)
  - Files created in working directory (repository root)
  - Staged with `git add test-ayadmw.md`
  - Committed with conventional message: `feat(289): create markdown file test-ayadmw.md with title and prose content`
  - Pushed to feature branch with upstream tracking
  - Branch naming: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (from features 001-288):
  - Minimal, isolated changes affecting only repository root
  - No modifications to application source code, tests, or configuration
  - Single file creation with straightforward I/O operations
  - Reusable utility functions from `content_generators.py` handle most workflow steps
  - Each feature follows identical structure and requirements

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); standard library features like pathlib are fully leveraged
  - **pathlib (Python standard library)**: Used for safe, cross-platform file I/O operations (`Path.cwd()`, `Path.write_text()`)
  - **Git**: Version control system; operations include `git add`, `git commit`, `git push` via GitCommitTool and GitPushTool
  - **Markdown syntax**: Standard format with CommonMark-compliant H1 heading (`#`) and prose content
  - **Claude API (via CrewAI LLM)**: Anthropic's Claude model for content generation, accessed via `sheep.config.llm.get_reasoning_llm()`
  - **UTF-8 encoding**: File encoding standard ensuring compatibility and avoiding BOM issues
  - **Git hooks**: Repository may have pre-commit hooks configured; feature branch allows standard git workflow
  - **structlog**: Structured logging framework for observability and debugging

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-ayadmw.md) to existing collection of 288+ test files; no modifications to existing files |
  | File System | Low | Single file creation (~250-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch/merge complexity |
  | src/sheep/ | None | Feature uses existing utility functions from content_generators.py; no new code required |
  | specs/ | Low | Adds spec directory for feature 289; spec analysis phase only, no impact on other specs |
  | Tests | None | Feature does not require test modifications; is itself a test artifact |
  | Configuration | None | Feature uses existing config; no changes to .env, pyproject.toml, or other configs |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or core platform functionality |

  ## Dependencies

  - **Git repository**: Feature branch `feat/289-markdown-file-creation-fe70ed` must exist (pre-created per git status)
  - **File system**: Write access to repository root directory (standard)
  - **Established pattern**: 288 preceding test files provide clear precedent for content format and validation
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library**: pathlib module available in Python 3.11+
  - **sheep.content_generators module**: Utility functions for markdown creation (`generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`)
  - **Claude API access**: ANTHROPIC_API_KEY or equivalent configured in .env for content generation via `sheep.config.llm`
  - **File naming**: Exact filename `test-ayadmw.md` provided in feature spec and must be used as specified

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation**: ~3 minutes (write file using pathlib, validate structure/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate**: 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 288 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting (content generation, validation, git operations)
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - File naming (test-ayadmw.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 288 prior implementations
  - Recent implementations (features 284-288) demonstrate efficient execution of identical features

  ---

  _Analysis phase complete — architectural patterns documented, dependencies identified, size estimate justified, implementation approach is straightforward reuse of established utilities_
