      - option: "Lenient validation (1-4 sentences with preference for 2-3)"
        description: "Accept 1-4 sentences but prefer 2-3. More flexible, fewer retries needed. But allows inconsistency with specification and diverges from 288-feature pattern where all files are identically structured."
