content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-21
  - **Decision Status:** All technical decisions documented and validated against 151+ precedent implementations

  ## Technology Decisions

  ### 1. File Creation Approach

  **Chosen:** `pathlib.Path.write_text()` with `encoding='utf-8'` and `newline='\\n'`

  **Rejected:**
  - **open() context manager** — More verbose (5-7 lines vs. 1 line); requires manual newline parameter on open(); identical outcome with more ceremony
  - **os.path + open()** — Lower-level API; requires manual file descriptor management; less pythonic than pathlib
  - **Third-party file libraries** — Adds external dependency; pathlib provides all needed functionality in standard library

  **Rationale:**
  pathlib.Path is the modern standard for file I/O in Python 3.11+ (project requirement). The write_text()
  method is concise, declarative, and handles encoding correctly. The `encoding='utf-8'` parameter ensures
  UTF-8 encoding (NFR-1), and `newline='\\n'` ensures LF line endings on all platforms including Windows (NFR-2).
  This approach is proven across 151+ identical feature implementations, demonstrating consistency and reliability.

  ### 2. Text Encoding

  **Chosen:** UTF-8 without BOM (Byte Order Mark), specified via `encoding='utf-8'` parameter

  **Rejected:**
  - **Default system encoding** — Platform-dependent; varies by OS and locale; undermines reproducibility and consistency
  - **UTF-8 with BOM** — Adds 3 bytes (EF BB BF); violates NFR-1 requirement; unnecessary per CommonMark specification
  - **ASCII encoding** — Insufficient for realistic prose content; UTF-8 is superset of ASCII with no downside

  **Rationale:**
  Python's pathlib.write_text(encoding='utf-8') produces UTF-8 without BOM by default (Python's UTF-8 codec
  does not write BOM). This satisfies NFR-1 explicitly. UTF-8 is: (1) deterministic across platforms;
  (2) compatible with CommonMark markdown specification; (3) used in all 151+ precedent test files.
  No special handling needed.

  ### 3. Line Ending Handling

  **Chosen:** Explicit `newline='\\n'` parameter in write_text() for Unix-style LF line endings

  **Rejected:**
  - **Universal newlines mode (newline=None)** — Default behavior varies by platform (CRLF on Windows, LF on Unix); violates NFR-2
  - **Manual post-processing** — Replace CRLF with LF after write; unnecessary complexity when newline parameter handles it
  - **Git autocrlf configuration** — Relies on external configuration that may vary; explicit parameter is more portable and reliable

  **Rationale:**
  The `newline='\\n'` parameter in pathlib.write_text() ensures Python's text I/O layer writes LF (\\n)
  regardless of platform, preventing Windows from converting to CRLF. This meets NFR-2 requirement explicitly.
  More reliable than external configuration, and proven across 151+ implementations.

  ### 4. Content Structure

  **Chosen:** Format: `# Heading\\n\\nSentence 1. Sentence 2. Sentence 3.`

  **Rejected:**
  - **Multiple markdown headings or advanced markdown** — Violates FR-3 ("exactly one markdown H1 heading"); adds unnecessary complexity
  - **No blank line between heading and content** — Violates CommonMark conventions (NFR-4); reduces readability
  - **Variable sentence count (1 sentence, 4+ sentences)** — Violates FR-4 requirement for "exactly 2-3 sentences"; introduces ambiguity

  **Rationale:**
  The simple structure (H1 heading + blank line + 2-3 prose sentences) satisfies all functional requirements
  (FR-3, FR-4) and non-functional requirement NFR-4 (CommonMark compliance). Observed pattern in all 151+
  test files, e.g., test-0qakgw.md (458 bytes, 3 sentences, proper structure). Blank line separates title
  from body per markdown conventions. Simple format is content-agnostic and supports flexible topic selection (NFR-8).

  ### 5. Git Workflow

  **Chosen:** Use git command-line: `git add`, `git commit`, `git push`

  **Rejected:**
  - **GitPython library** — Adds external Python dependency; git CLI is available and standard in all environments
  - **Manual git operations** — Manipulating git object database directly; unnecessary complexity, error-prone
  - **CI/CD automation** — Feature spec explicitly requires local operations (FR-6, FR-7, FR-8, FR-9); can't defer to pipeline

  **Rationale:**
  Git CLI is standard in development environments. It provides a simple subprocess interface without additional
  dependencies. Conventional commit message format (FR-7: `feat(152): create markdown file test-khhb6k.md with prose content`)
  aligns with CommitConv specification and is enforced via git command. Proven approach across 151+ implementations.

  ### 6. Error Handling

  **Chosen:** No explicit error handling; assume preconditions are met

  **Rejected:**
  - **Validate file creation** — Check file exists after write, validate size/encoding; overengineering
  - **Git operation error handling** — Check return codes, handle conflicts; unnecessary given clean feature branch precondition
  - **Encoding validation** — Verify UTF-8, check for BOM, count line endings; pathlib and git handle correctly by design

  **Rationale:**
  All 151+ precedent implementations use straightforward code without error handling. This is justified because:
  (1) Feature branch is pre-created and checked out (guaranteed via spec); (2) Working tree has write access
  (guaranteed for development environment); (3) Git configuration is standard precondition; (4) Python 3.11+
  guarantees UTF-8 support. Avoid over-engineering — handle only edge cases that can realistically occur,
  not hypothetical failure modes.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | `pathlib` (standard library) | File I/O | **Use** | Part of Python 3.11+ standard library; required per NFR-5; modern, preferred approach; no external dependency |
  | `os.path` (standard library) | File operations | Reject | Lower-level; more verbose; pathlib is preferred modern alternative |
  | `GitPython` | Git operations | Reject | External dependency; git CLI is available and standard; adds unnecessary import |
  | `plumbum` / `sh` | Shell operations | Reject | External dependencies; subprocess is sufficient; no benefit |
  | `encoding` libraries | Text encoding | Reject | Python 3.11+ standard library handles UTF-8 natively; no 3rd-party libs needed |

  ## Security Considerations

  ### UTF-8 Encoding (No BOM)

  - **Threat:** BOM (Byte Order Mark) can be misinterpreted by some parsers, potentially causing issues
  - **Mitigation:** Explicitly specify UTF-8 without BOM in pathlib.write_text(encoding='utf-8'); Python's codec does not emit BOM by default
  - **Validation:** File should be exactly the content size without 3-byte BOM prefix

  ### LF Line Endings (Unix-style)

  - **Threat:** CRLF line endings on Windows could trigger inconsistent git diffs or cause parser issues across different tools
  - **Mitigation:** Use `newline='\\n'` parameter to force LF on all platforms; prevents platform-specific conversion
  - **Validation:** Hexdump/od can verify file contains \\n (0x0A) not \\r\\n (0x0D 0x0A)

  ### Git Commit Author Validation

  - **Threat:** Git commits require user.name and user.email configuration; if not set, commits will fail
  - **Assumption:** Standard development environment has git configured (working precondition)
  - **Mitigation:** If commit fails, user must configure git (outside scope of feature; standard prerequisites)

  ### File Permissions

  - **Assumption:** Working tree has write access to repository root (working precondition)
  - **Mitigation:** Feature branch is pre-created by platform; write access verified by earlier successful file operations
  - **No additional security handling needed:** Feature assumes working environment is properly provisioned

  ## Performance Implications

  ### File I/O Performance

  - **Single file write**: pathlib.write_text() opens, writes 400-600 bytes, closes in single operation (~1ms on any modern system)
  - **No optimization needed:** File size is trivial; single small write is negligible performance cost
  - **Baseline:** Feature execution typically completes in <100ms including git operations

  ### Git Operations Performance

  - **git add**: Trivial overhead, single file staging (~1ms)
  - **git commit**: Local operation only, no network (~5ms)
  - **git push**: Network bound; depends on connectivity (100-500ms typical on modern connections)
  - **Total git time**: 100-500ms typically; not a bottleneck

  ### Memory Usage

  - **String storage**: 400-600 byte prose content resident in memory during write (~1KB)
  - **No memory concerns:** Single string write, negligible memory footprint
  - **No memory optimization needed:** Feature is memory-efficient by nature

  ## Architecture Notes

  ### Fit with Existing Patterns

  This feature is part of the markdown-file-creation series (features 061-151+) with 151+ identical implementations.
  All decisions follow established patterns:

  - **Repository structure**: New file (test-khhb6k.md) joins 100+ existing test-*.md files in repository root
  - **No source code impact**: Feature creates data artifact only; does not modify /src/sheep/, tests/, or configs
  - **Git workflow**: Standard feature branch workflow consistent with all 151+ precedents
  - **Dependency policy**: No external Python packages required (NFR-9); uses only Python 3.11+ standard library

  ### Codebase Integration

  - **Non-invasive**: Feature is purely additive (one new file); no modifications to existing code
  - **Build/CI unaffected**: New markdown file does not affect build system, test suite, or CI/CD pipeline
  - **Documentation**: Markdown file is data artifact; does not modify project documentation or API specs

  ### Scalability

  - **Pattern scales trivially**: Adding test-*.md files is O(1) operation per file; no accumulation of technical debt
  - **Proven at scale**: 151+ identical implementations demonstrate pattern stability and predictability
  - **No architectural constraints**: Pattern has no performance, maintainability, or scalability bottlenecks

  ## Validation Plan

  After implementation, verify:

  1. **File creation**: Confirm test-khhb6k.md exists in repository root
  2. **Format validation**:
     - Exactly one H1 heading on first line
     - Blank line separator (second line)
     - 2-3 sentences of prose (line 3)
  3. **Encoding validation**:
     - File is UTF-8 (confirm via `file` command or hexdump)
     - No BOM present (file starts with text content, not EF BB BF bytes)
  4. **Line ending validation**:
     - File uses LF endings (\\n, not \\r\\n)
     - Verify via `od -c` or equivalent
  5. **Git workflow validation**:
     - File appears in `git status` as staged
     - Commit message matches exact format
     - Commit is on current branch
     - Changes pushed to remote
  6. **Size validation**:
     - File size approximately 400-600 bytes (guideline, accept natural variation per NFR-3)

