  | Dependency | Type | Status | Reason |
  | ---------- | ---- | ------ | ------ |
  | Python 3.11+ | Runtime | **Required** | Project requirement; pathlib available in all versions |
  | pathlib (stdlib) | Library | **Required** | File I/O per NFR-5; part of standard library, no external install |
  | Git CLI | Tool | **Required** | Version control operations; standard in development environments |
  | Git config (user.name, user.email) | Config | **Precondition** | Required for commits; assumed configured in development environment |
  | Unix/Linux environment | System | **Recommended** | LF line endings are standard on Unix; Windows Git can be configured to use LF |

