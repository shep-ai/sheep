content: |
  ## Architecture Overview

  Feature 096 fits the established test file pattern at repository root. No integration with source
  code in `/src/sheep/`, no configuration changes, no application logic impact. Pure additive change
  that has been replicated 95+ times across Features 069-095.

  **Location:** Repository root alongside existing test-*.md files (95+ precedents)
  **Format:** Markdown with H1 heading + blank line + 2-3 sentences of prose
  **Workflow:** Standard git add → commit → push to feature branch

  The feature branch `feat/096-markdown-file-creation-ad27a9` is pre-created. Implementation is
  deterministic and has a proven pattern across the entire codebase.

  ## Key Design Decisions

  **1. File I/O Implementation: pathlib.Path.write_text()**

  *Chosen:* `Path("test-rzmpu1.md").write_text(content, encoding="utf-8")`

  *Why:* Established across all 95+ prior test file implementations. Provides cross-platform file I/O
  with automatic encoding handling, explicit UTF-8 support, and clean API. Zero external dependencies
  (Python standard library since 3.4). Handles line ending normalization automatically (text mode
  ensures LF on Unix platforms).

  *Alternatives considered and rejected:*
  - `os.open() / os.write()`: Lower-level, requires manual encoding and platform-specific newline
    handling; pathlib abstracts these details automatically
  - `open()` builtin: More verbose, requires manual file handle management; pathlib is more Pythonic

  **2. Git Operations: subprocess with git CLI**

  *Chosen:* Execute `git add`, `git commit -m "..."`, and `git push` via subprocess

  *Why:* Proven across all 95+ prior features. Requires zero external dependencies beyond git
  (already required). Simple to test, debug, and integrate with CI/CD. Produces deterministic output.

  *Alternatives considered and rejected:*
  - GitPython/pygit2: Adds external dependency overhead for simple add/commit/push operations
  - Direct libgit2 bindings: Requires compiled native dependencies; unnecessary complexity

  **3. Content Format: H1 + Blank Line + 2-3 Sentences**

  *Chosen:* Markdown format with `# Title` heading, blank line separator, and 2-3 sentences of prose

  *Why:* H1 is semantic document title per CommonMark specification. Blank line separator is
  standard markdown practice improving readability. 2-3 sentence range is validated across 95+ test
  files, maintains consistent file size (320-600 bytes) and prose quality.

  *Alternatives considered and rejected:*
  - Lower heading levels (H2-H6): Violates semantic structure conventions; H1 is document title
  - No blank line: Reduces readability, violates markdown conventions
  - 1 sentence or 4+ sentences: Range of 2-3 is optimal for consistency across prior implementations

  **4. File Encoding & Line Endings: UTF-8 without BOM, LF only**

  *Chosen:* UTF-8 encoding without byte order mark; Unix-style LF line endings (`\n` only, no CRLF)

  *Why:* Standard for Unix/Linux systems and modern platforms. All 95+ existing test files use this
  encoding. Python 3 text mode uses UTF-8 as default and ensures LF on Linux. Specification
  explicitly requires this encoding (success criteria verified via `file` command).

  *Alternatives considered and rejected:*
  - UTF-8 with BOM: Adds unnecessary 3-byte overhead; breaks some markdown parsers
  - CRLF line endings: Breaks cross-platform consistency, causes git issues

  **5. Topic Selection: Flexible Manual Selection**

  *Chosen:* Manual selection from universal/generic domains (professional development, personal
  growth, productivity, philosophy, ethics). No external API, no hardcoded global topic.

  *Why:* Specification explicitly allows flexible topic selection (NFR-9). Features 069-095
  demonstrate success with diverse topics. Universal topics have broad relevance without cultural
  bias. Manual selection requires minimal effort and is proven across 95+ implementations.

  *Alternatives considered and rejected:*
  - Hardcoded fixed topic: Reduces variety, becomes repetitive
  - External API topic generation: Adds network dependency and failure risk

  **6. Dependency Management: Zero External Dependencies**

  *Chosen:* Use only Python standard library (pathlib) and git CLI (already required)

  *Why:* Simple markdown format needs no validation library. All 95+ prior test files created
  without additional dependencies. Keeps build complexity minimal. Validation is via inspection
  and standard external markdown parsers for CI.

  ## Implementation Strategy

  **Phase 1: File Creation**
  Write the markdown file with correct format, then validate all success criteria. This is
  straightforward: use pathlib to write a single file with hardcoded prose content. Verification
  ensures encoding, line endings, syntax, and file size all meet requirements.

  **Phase 2: Git Integration**
  Execute standard git workflow: stage the file, commit with conventional message, push to remote.
  Each step is simple and follows the exact pattern from 95+ prior implementations. No complex
  rebase, merge, or branch workflows required.

  **Why this order:** File must be created before git operations can stage/commit it. Sequential
  execution mirrors the natural workflow. Both phases are independent of any other codebase state.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists | Verify file doesn't exist before creation; feature is new so this is not a concern |
  | Encoding mismatch (UTF-8 vs CRLF) | Use pathlib.Path.write_text() with explicit `encoding="utf-8"`; text mode ensures LF on Unix |
  | Prose quality or coherence issues | Write prose carefully, proofread for grammar/spelling, validate against 95+ examples |
  | Git staging/push failure | Ensure git user.name and user.email are configured; feature branch exists; standard permissions |
  | File size out of range | Write 2-3 sentences of typical length; validate with `wc -c` command (expect 320-600 bytes) |
  | Commit message format incorrect | Follow exact convention: `feat(096): create markdown file test-rzmpu1.md with prose content` |
