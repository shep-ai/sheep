content: |
  ## Summary

  Feature 096 implementation consists of 4 focused tasks across 2 phases:

  **Phase 1: Markdown File Creation (1 task, ~5 minutes)**
  - Write test-rzmpu1.md with markdown content: H1 heading + blank line + 2-3 sentences of prose
  - Validate encoding (UTF-8 without BOM), line endings (LF only), syntax, and file size (320-600 bytes)
  - Topic selection is flexible from universal domains (productivity, growth, philosophy, etc.)

  **Phase 2: Git Integration (3 tasks, ~5 minutes)**
  - Stage file with `git add test-rzmpu1.md`
  - Commit with conventional message: `feat(096): create markdown file test-rzmpu1.md with prose content`
  - Push to feature branch with `git push -u origin HEAD`

  **Total effort:** Approximately 10 minutes for the actual implementation (file creation + git workflow).

  All tasks follow TDD cycles appropriate to simple file creation and git operations:
  - **RED:** Assert expected state does not yet exist
  - **GREEN:** Perform the operation to create that state
  - **REFACTOR:** Verify state and validate against acceptance criteria

  Tasks are strictly ordered by dependency: file must exist before staging, staging before committing,
  committing before pushing. Each task is small and focused, with clear acceptance criteria and
  validation steps.
