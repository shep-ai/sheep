content: |
  ## Architecture Overview

  Feature 149 is a minimal-effort file-artifact creation feature following the established pattern from 100+ identical
  implementations (features 061-148). The architecture is deliberately simple and isolated:

  ### Design Pattern

  The implementation follows a three-step pattern, proven across 100+ precedent features:

  1. **File Creation:** Use Python pathlib.Path.write_text() to create a markdown file at the repository root with:
     - Fixed filename: test-naz382.md
     - UTF-8 encoding (no BOM)
     - Unix-style LF line endings (\n) across all platforms
     - Content format: H1 heading + blank line + 2-3 sentences of prose

  2. **Content Format:** Hardcoded prose content (implementer chooses topic, but format is fixed):
     ```
     # Title Heading

     Sentence 1. Sentence 2. Sentence 3.
     ```

  3. **Git Workflow:** Three sequential subprocess.run() calls:
     - `git add test-naz382.md` — stage the file
     - `git commit -m "feat(149): create markdown file test-naz382.md with prose content"` — commit with conventional message
     - `git push -u origin HEAD` — push to feature branch

  ### Integration with Existing Codebase

  - **Zero impact on /src/sheep/:** Feature does not depend on or modify application source code
  - **Zero impact on tests/:** Feature does not modify or interact with test suite
  - **Zero impact on configuration:** Feature does not modify pyproject.toml, CI/CD, or project settings
  - **Isolated artifact:** Creates a single markdown file at repository root, consistent with 65+ existing test files (features 061-148+)
  - **Standard git workflow:** Uses only standard git commands; no custom tooling or configuration required

  ### File System Structure

  ```
  repository/
  ├── test-naz382.md          # ← NEW FILE (this feature)
  ├── test-xyz123.md          # existing files from features 061-148
  ├── test-abc456.md
  ├── ... (60+ more test files)
  ├── src/
  ├── specs/
  ├── tests/
  └── ... (other project structure unchanged)
  ```

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Decision:** Use Python's pathlib module for file creation with explicit UTF-8 encoding and LF line endings.

  **Rationale:**
  - **Requirement Mandate:** NFR-5 explicitly requires pathlib.Path for file I/O operations
  - **Platform Independence:** pathlib.write_text() with newline='\n' parameter ensures Unix-style LF across Windows, macOS, and Linux
  - **Encoding Safety:** Explicitly specify encoding='utf-8' to prevent platform-native encoding issues
  - **Modern Python Standard:** Pathlib is the idiomatic Python 3 approach for filesystem operations
  - **Proven Pattern:** Used successfully in 100+ prior implementations (features 061-148)

  ### 2. Git Integration: subprocess.run()

  **Decision:** Use Python's subprocess module for git operations (add, commit, push).

  **Rationale:**
  - **Standard Library:** No external dependencies; subprocess is built-in to Python standard library
  - **Simplicity:** For three sequential, non-conditional git operations, subprocess is cleaner than higher-level abstractions
  - **Error Handling:** subprocess.run() with check=True raises CalledProcessError on non-zero exit
  - **Transparency:** Command arguments are explicit and readable
  - **Proven Pattern:** Used in 100+ prior implementations (features 061-148)

  ### 3. Content Generation: Hardcoded Prose

  **Decision:** Hardcode prose content directly with fixed H1 heading and exactly 2-3 sentences.

  **Rationale:**
  - **Format Compliance:** Hardcoding guarantees format compliance at authoring time
  - **Deterministic Output:** Ensures same content on every execution
  - **No External Dependencies:** Avoids template engines, file loaders, or LLM APIs
  - **Proven Pattern:** All 100+ prior test files use hardcoded prose; established convention
  - **Topic Flexibility:** Implementer chooses any topic; format is fixed, content topic is flexible

  ### 4. Line Ending Handling: Explicit LF Enforcement

  **Decision:** Use pathlib.Path.write_text() with newline='\n' parameter to enforce Unix-style LF across all platforms.

  **Rationale:**
  - **Requirement Mandate:** NFR-2 requires Unix-style LF line endings, not Windows CRLF
  - **Cross-Platform Consistency:** On Windows, default text mode converts '\n' to CRLF; newline='\n' prevents this
  - **Markdown Compliance:** CommonMark specification expects LF; CRLF can cause parsing issues
  - **Git Consistency:** Most repositories use LF uniformly; CRLF files trigger git warnings

  ### 5. Encoding: UTF-8 without BOM

  **Decision:** Use pathlib.Path.write_text() with encoding='utf-8' (which creates BOM-free UTF-8 by default).

  **Rationale:**
  - **Requirement Mandate:** NFR-1 requires UTF-8 without BOM (Byte Order Mark)
  - **Source File Standard:** BOM-free UTF-8 is standard for source files and markdown
  - **Tool Compatibility:** Markdown processors, git, and text editors handle BOM-free UTF-8 seamlessly
  - **Default Behavior:** pathlib.write_text() produces BOM-free UTF-8 by default; no special handling needed

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2:** File creation must precede git operations because git operations (add, commit) require the file to exist.

  ### Phase 1: File Creation and Validation

  Create test-naz382.md at the repository root with proper markdown format and encoding:

  1. Define markdown content: H1 heading + blank line + 2-3 sentences of prose
  2. Use pathlib.Path.write_text() with encoding='utf-8' and newline='\n'
  3. Verify file exists and contains expected content
  4. Validate file encoding and line endings via file inspection
  5. Verify file size is within expected range (~400-600 bytes)

  ### Phase 2: Git Integration and Publication

  Stage, commit, and push the file using subprocess:

  1. Run `git add test-naz382.md` to stage the file
  2. Run `git commit` with conventional commit message: `feat(149): create markdown file test-naz382.md with prose content`
  3. Run `git push -u origin HEAD` to publish changes to remote

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File creation fails due to permission issues | Low | Medium | Development environment has write access to repo root; verified in setup |
  | Git commands fail (missing config, detached HEAD) | Low | Medium | Feature branch is pre-created; standard git config assumed |
  | Content violates markdown syntax | Low | Low | Hardcoded content is author-verified before implementation |
  | Encoding/line-ending issues on non-Unix systems | Low | Low | Explicit pathlib parameters handle cross-platform differences |
  | File already exists | Low | Low | Feature branch is fresh; minimal collision risk |
  | Git push fails due to network | Low | Medium | Network is assumed available; standard development precondition |

  ## Why This Approach Works

  1. **Proven Pattern:** 100+ identical implementations provide clear, battle-tested precedent
  2. **Minimal Complexity:** Single file, fixed format, hardcoded content
  3. **No Dependencies:** Uses only Python standard library (pathlib, subprocess)
  4. **Isolated Impact:** Creates one artifact file with zero impact on source code, tests, or configuration
  5. **Standard Workflow:** Conventional git workflow is familiar and well-documented
  6. **Fast Execution:** Estimated 10-15 minutes end-to-end

