content: |
  ## Summary

  Three sequential tasks implement the markdown file creation feature:

  1. **Task 1: Prepare Content** (5 min) — Define the title and 2-3 sentences of prose. Free topic choice eliminates decision overhead. Content should be coherent English that naturally produces 400-600 bytes with the H1 heading.

  2. **Task 2: Create File** (5 min) — Use pathlib.Path.write_text() with explicit UTF-8 encoding to create test-w20aja.md at the repo root. Content format is fixed: H1 heading + blank line + prose. Verify UTF-8 encoding, LF line endings, and file size are correct.

  3. **Task 3: Git Integration** (5 min) — Use subprocess.run() to stage, commit (with conventional message), and push to origin. Verify file appears in git log and is accessible from HEAD.

  **Total Effort:** 15 minutes

  **Task Dependencies:** Task 1 → Task 2 → Task 3 (strict sequential order)

  **No Parallelization:** Content must exist before file creation; file must exist before git operations.

  ## Implementation Notes

  - All tasks execute within a single Python script (~30-40 lines)
  - File creation uses explicit UTF-8 encoding to meet NFR-1 (no BOM)
  - Content uses \n line endings to meet NFR-2 (LF only)
  - Git operations use shell=False for security (no command injection risk)
  - Pattern is proven by 80+ existing test files and features 080-083
  - No external dependencies; Python 3.11+ standard library only
  - No validation beyond basic file existence and git history checks

  ---

  _Task breakdown ready for implementation_
