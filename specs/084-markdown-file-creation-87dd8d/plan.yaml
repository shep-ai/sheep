content: |
  ## Architecture Overview

  Feature 084 is a minimal, isolated implementation that creates a single markdown test file
  at the repository root, then commits it to git. There are no code changes, no system
  integration, and no architectural impact. The feature is self-contained:

  - **File Creation**: Uses Python pathlib.Path.write_text() to create test-w20aja.md
  - **Content Format**: Fixed structure proven by 80+ existing test files (one H1 heading + 2-3 sentences)
  - **Git Integration**: Uses Python subprocess to stage, commit, and push in sequence
  - **Dependencies**: Python 3.11+ standard library only (pathlib, subprocess)

  The implementation follows the established pattern from features 080-083 without deviation.
  No validation, error handling, or special logic is needed beyond the core operations.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-w20aja.md').write_text(content, encoding='utf-8')`

  **Rationale:** Explicitly required by FR-4 ("File must be created using Python's pathlib.Path module").
  Modern Python standard library (3.4+). Cross-platform, readable API with built-in encoding support.
  Explicit `encoding='utf-8'` parameter ensures UTF-8 compliance (NFR-1) and prevents BOM prefixes.
  Verified in features 080-083 implementations and all 80+ existing test files.

  **Alternatives Rejected:**
  - open() context manager — lower-level API requiring manual file handle management
  - os.path module — legacy, superseded by pathlib; less Pythonic

  ### 2. Content Format: H1 Heading + 2-3 Sentences

  **Chosen:** Fixed structure: `# Title\n\nsentence 1. sentence 2. sentence 3.`

  **Rationale:** This format is proven by all 80+ existing test files (test-*.md) with zero formatting issues.
  Generates 400-600 bytes naturally (NFR-3) without active length management. No validation needed—following
  the pattern is sufficient. Free topic choice (per product decision) eliminates decision overhead.

  **Why This Approach:**
  - No template engines, randomizers, or complex content generation
  - No domain restrictions or predefined topic lists
  - Simple f-string composition in Python is cleaner than any templating system
  - All prior features (080-083) used freely chosen topics with success

  ### 3. Git Operations: subprocess.run() with shell=False

  **Chosen:** Three sequential subprocess.run() calls for `git add`, `git commit`, `git push`

  **Rationale:** Part of Python 3.11+ standard library (no external dependencies, per NFR-4).
  Safe execution with `shell=False` and explicit argument lists prevents command injection.
  Three git operations are trivial—no complex shell syntax justifies external dependencies like GitPython.
  Subprocess.run(..., check=True) provides proper error propagation.
  Verified in features 080-083 implementations.

  **Alternatives Rejected:**
  - GitPython library — external dependency violating NFR-4; overkill for 3 simple commands
  - os.system() with shell — security risk; less reliable error handling

  ### 4. Encoding & Line Endings: UTF-8 Explicit, LF Only

  **Chosen:** pathlib.write_text(encoding='utf-8') with content composed using \n only

  **Rationale:** Requirement NFR-1 (UTF-8, no BOM). Requirement NFR-2 (LF line endings only).
  Explicit encoding parameter in write_text() avoids platform-specific defaults. Content string
  uses \n only (no \r\n), ensuring LF line endings. All existing test files use UTF-8 without BOM
  and LF line endings exclusively.

  ## Implementation Strategy

  **Single Phase, Linear Workflow:**

  1. **Task 1: Prepare Content** — Define markdown title and 2-3 sentences of prose
     - Choose any topic (per spec resolution for open question)
     - Ensure 2-3 sentences, coherent English, ~50-80 words total
     - No special research or domain expertise needed

  2. **Task 2: Create File with pathlib** — Implement Python code to write test-w20aja.md
     - Use pathlib.Path.write_text(content, encoding='utf-8')
     - Verify file exists at repo root, has correct content, UTF-8 encoding, LF line endings

  3. **Task 3: Stage, Commit, and Push** — Implement git operations via subprocess
     - git add test-w20aja.md
     - git commit with message: `feat(084): create markdown file test-w20aja.md with prose content`
     - git push to origin HEAD
     - Verify file is in git history and accessible from HEAD

  **Why This Order:**
  - Content must be defined before file creation (Task 1 → Task 2)
  - File must exist before git operations (Task 2 → Task 3)
  - No parallelization possible; dependencies are strict

  **Execution Context:**
  - All three tasks execute within a single Python script (~30-40 lines)
  - Script runs in feature branch workspace (feat/084-markdown-file-creation-87dd8d)
  - Git user.name and user.email must be pre-configured (standard in CI/CD)
  - Write access to repo root is assumed (standard in cloned repos)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding issues (BOM, wrong encoding)** | Explicit `encoding='utf-8'` in pathlib.write_text(); all existing test files use UTF-8; zero prior issues in 080-083. |
  | **Line ending corruption (CRLF vs LF)** | Content string uses \n only; text mode pathlib preserves this; all existing test files use LF exclusively. |
  | **File size out of range (not 400-600 bytes)** | Fixed format (H1 + 2-3 sentences) naturally produces correct size; examined all 80+ existing test files; no truncation or padding needed. |
  | **Git operations fail (auth, remote, etc.)** | Subprocess.run(..., check=True) raises exception on non-zero exit; failures surface immediately. Git configuration is pre-requisite (standard setup). |
  | **File overwrites existing content** | Feature spec guarantees FR-8 (no existing files modified); pathlib.write_text() creates new file or truncates existing (expected behavior). |
  | **Invalid CommonMark markdown** | Fixed format is proven by 80+ existing test files; no syntax errors possible with H1 heading + prose. |

  ## Architecture Fit

  This feature is a **test file creation** operation—isolated from the main codebase:
  - No impact on /src/sheep/ or any source code
  - No CI/CD modifications, no tests, no documentation updates
  - No dependencies on other features or modules
  - Pure file I/O and git workflow, no system integration

  The implementation integrates seamlessly with the repository's established test file pattern
  (80+ existing test-*.md files) and git workflow (feature branches with conventional commits).
  No new architectural patterns introduced; follows precedent exactly.

