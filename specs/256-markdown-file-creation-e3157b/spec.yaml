content: |
  ## Problem Statement

  Create a single markdown file called test-rlrl92.md in the repository root with a clear
  H1 title and 2-3 sentences of prose content on any topic. The file must follow established
  patterns from 255 prior similar features, including UTF-8 encoding without BOM, Unix LF
  line endings, and proper Git integration (stage, commit with conventional message, push
  to feature branch).

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-rlrl92.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (format: `# <Title>`)
  - **FR-3**: File must contain 2-3 sentences of coherent prose content
  - **FR-4**: Content must be semantically meaningful and grammatically correct
  - **FR-5**: Stage file using `git add test-rlrl92.md`
  - **FR-6**: Commit file with conventional commit message: `feat(256): create markdown file test-rlrl92.md with prose content`
  - **FR-7**: Push committed file to remote feature branch (feat/256-markdown-file-creation-e3157b)
  - **FR-8**: Return structured result containing filepath, content, commit message, and push status

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be Unix LF (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: File size must be between 250-600 bytes (typical range from 255 prior features)
  - **NFR-4**: Prose content length must be 100-300 characters (before H1 heading)
  - **NFR-5**: Implementation must reuse existing utility functions from `/src/sheep/content_generators.py`
  - **NFR-6**: Feature module must follow naming convention: `feature_256_markdown_file_creation.py`
  - **NFR-7**: Feature module must be located in `/src/sheep/features/`
  - **NFR-8**: Implementation must include logging via `get_logger(__name__)` for observability
  - **NFR-9**: All validation checks must pass: content structure, encoding format, and Git operations
  - **NFR-10**: Implementation should not require any external dependencies beyond those already in use
  - **NFR-11**: Feature branch must remain clean with exactly one commit after completion

  ## Success Criteria

  - [ ] File `test-rlrl92.md` is created in repository root (alongside existing test-*.md files)
  - [ ] File contains valid H1 markdown heading matching pattern `# <Title>`
  - [ ] File contains exactly 2-3 sentences of coherent prose (100-300 characters)
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (verified via validation function)
  - [ ] File size is between 250-600 bytes (typical range)
  - [ ] File is staged using `git add`
  - [ ] File is committed with message: `feat(256): create markdown file test-rlrl92.md with prose content`
  - [ ] Commit is pushed to remote branch `feat/256-markdown-file-creation-e3157b`
  - [ ] All validation functions pass (content validation, encoding validation, structure validation)
  - [ ] Feature branch contains exactly one new commit (no orphaned changes)
  - [ ] Feature module follows `feature_256_markdown_file_creation.py` naming and structure

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is a modular, observable agentic platform for automated code implementation built with
  CrewAI. The repository is organized as follows:

  - `/src/sheep/` — Main package with agents, config, tools, and features
  - `/src/sheep/agents/` — CrewAI agents for various code/research tasks
  - `/src/sheep/config/` — Configuration for LLM providers and settings
  - `/src/sheep/features/` — Individual feature implementation modules (101-255 with pattern for 256)
  - `/src/sheep/tools/` — Git and file operation tools (GitCommitTool, GitPushTool)
  - `/src/create_markdown.py` — Legacy utility for markdown file operations
  - `/src/sheep/content_generators.py` — High-level wrapper functions for markdown creation
  - `/specs/` — Feature specification directories with yaml definitions
  - `tests/` — Test suite directory (minimal in this repository)

  ### Architecture Patterns

  The Sheep platform follows these key architectural patterns:

  1. **Modular Feature Pattern**: Each feature (001-256+) is implemented as a standalone Python module
     in `/src/sheep/features/feature_NNN_markdown_file_creation.py` with a main function that
     orchestrates the workflow. Features reuse common patterns and utilities.

  2. **Wrapper Layer Abstraction**: High-level utility functions in `content_generators.py` wrap
     low-level file/git operations to keep feature modules lean (~30 lines). Functions include:
     - `generate_markdown_content()` — LLM-based content generation
     - `write_markdown_file()` — File I/O with encoding validation
     - `validate_markdown_file()` — Comprehensive file validation
     - `commit_markdown_file()` — Git staging and commit
     - `push_markdown_file()` — Git push with upstream tracking

  3. **Logging and Observability**: All modules use structured logging via `get_logger(__name__)`
     for trace-level debugging and observability. Supports Langfuse integration for execution tracing.

  4. **Configuration Management**: LLM configuration is centralized in `/src/sheep/config/llm.py`
     with `get_reasoning_llm()` providing a pre-configured Claude instance for content generation.

  5. **Git Workflow**: Uses GitPython-based tools (GitCommitTool, GitPushTool) in `/src/sheep/tools/`
     with standardized conventional commit messages and automatic upstream tracking.

  ### Relevant Technologies

  - **Python 3.11+** — Language for all source code and automation
  - **CrewAI** — Multi-agent framework for orchestrating complex workflows
  - **Anthropic Claude API** — LLM for generating prose content via `get_reasoning_llm()`
  - **GitPython** — Git repository operations (commit, push, branch management)
  - **Pydantic** — Configuration validation and settings management
  - **pathlib** — Cross-platform file path handling
  - **structlog** — Structured logging with Langfuse integration for observability

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Creates single file `test-rlrl92.md` alongside 255 existing test-*.md files; does not modify existing files |
  | `/src/sheep/features/` | Low | Adds `feature_256_markdown_file_creation.py` (~30 lines) following established pattern from features 001-255 |
  | `/src/sheep/content_generators.py` | None | Existing utilities are reused without modification; no changes required |
  | `/src/sheep/config/llm.py` | None | Existing LLM configuration is reused; no changes required |
  | Git repository | Low | Creates one commit and push operation to feature branch; no impact on main branch or CI/CD |

  ## Dependencies

  This feature depends on:

  - **Existing utilities in `/src/sheep/content_generators.py`**:
    - `generate_markdown_content()` — Generates H1 heading + prose via Claude LLM
    - `write_markdown_file()` — Writes file with proper UTF-8 encoding and LF line endings
    - `validate_markdown_file()` — Comprehensive validation (encoding, line endings, structure, sentence count)
    - `commit_markdown_file()` — Git staging and commit with conventional message format
    - `push_markdown_file()` — Git push with upstream tracking

  - **Existing infrastructure**:
    - Anthropic Claude API (configured via environment variables)
    - Git executable (already in use across repo for features 001-255)
    - Python 3.11+ standard library (pathlib, subprocess for file/git operations)
    - CrewAI framework (already integrated for multi-agent coordination)

  - **No new external dependencies required**: This feature uses only existing packages from
    the project's dependency set (Anthropic SDK, GitPython, CrewAI, pydantic, structlog)

  ## Size Estimate

  **S** (Small — <2 hours) — This is a straightforward, low-complexity feature with minimal risk:

  - Content generation logic is fully implemented, tested, and proven across 255 prior features
  - File creation and validation utilities are mature, reusable, and well-documented
  - Feature module structure is standardized (copy-paste-customize pattern from feature 255)
  - Git integration is stable and proven by 255 successful feature releases
  - No architectural changes, new abstractions, or untested functionality required
  - **Implementation effort**: (1) Create `feature_256_markdown_file_creation.py` (~30-40 lines,
    copy from feature 255 with filename/number updates), (2) Call existing wrapper functions in sequence,
    (3) Execute test, validate, and commit
  - **Testing**: Reuses validation functions from content_generators.py that have passed in
    255 prior features
  - **Estimated implementation time**: <2 hours for experienced developer; <3 hours for new team member

