name: unit-test-coverage
summary: >
  Technical research for adding comprehensive unit tests across the Sheep codebase.
  Key decisions include using unittest.mock exclusively (no new dependencies), testing tools
  via their public _run() method following existing patterns, class-based test organization,
  and configuring pytest-cov with a 60% fail-under threshold in pyproject.toml.

# Relationships
relatedFeatures: []

technologies:
  - Python 3.11+
  - pytest >= 8.0.0 (already in dev dependencies)
  - pytest-asyncio >= 0.24.0 (already in dev dependencies)
  - pytest-cov >= 5.0.0 (already in dev dependencies)
  - unittest.mock (stdlib — patch, MagicMock, patch.dict)
  - tempfile (stdlib — TemporaryDirectory for filesystem isolation)
  - Pydantic / pydantic-settings (BaseModel, BaseSettings under test)
  - CrewAI BaseTool (parent class of tools under test)
  - structlog (logging framework under test)
  - httpx (mocked in WebFetchTool tests)
  - duckduckgo-search (mocked in WebSearchTool tests)
  - subprocess (mocked in git_tools and ShellCommandTool tests)

