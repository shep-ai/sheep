    chosen: "Hardcoded string with H1 heading + blank line + 3 sentences"
    rejected:
      - "Template-based content with substitution — Adds complexity, templates require maintenance. Hardcoding is deterministic and matches existing pattern."
      - "Procedurally generated content — Non-deterministic output, complexity, inconsistent with 240+ existing test files that use hardcoded content."
