      - "GitPython library — Adds external dependency for simple operations. This feature only needs git add, git commit, and git push, which are trivial via subprocess."
      - "Shell command strings (shell=True) — Security risk (command injection) and platform-dependent behavior. Using shell=False with list arguments is safer."
    rationale: >
      subprocess is the correct choice because: (1) this feature requires only three simple git operations (add, commit, push), not complex git manipulation;
      (2) adding GitPython creates an external dependency that complicates the project with no benefit; (3) subprocess with shell=False provides security
      and cross-platform compatibility; (4) the established pattern across the codebase uses subprocess for git operations; (5) future extensions can still
      use subprocess, which is sufficient for git workflows.

  - title: "Encoding Specification"
    chosen: "encoding='utf-8' parameter with pathlib.Path.write_text()"
    rejected:
      - "codecs.open() with 'utf-8-sig' — Adds BOM (Byte Order Mark) which violates NFR-1 requirement for UTF-8 without BOM. Standard utf-8 is correct."
      - "Binary mode with manual encoding — More verbose and error-prone. Python's text mode with explicit encoding is clearer and standard practice."
    rationale: >
      Using encoding='utf-8' (not 'utf-8-sig') ensures the file is UTF-8 without BOM, which is required by NFR-1. pathlib.Path.write_text() with
      explicit encoding is the modern, Pythonic approach in Python 3.11+. This ensures the file meets encoding requirements without additional complexity.
      The established pattern uses this approach across the codebase.

  - title: "Line Ending Handling"
    chosen: "Explicit newline='\\n' parameter in write_text() to ensure Unix LF line endings"
    rejected:
      - "Default Python text mode (newline=None) — Platform-dependent; on Windows creates CRLF line endings, violating NFR-2 requirement for LF."
      - "Use binary mode and manual byte writing — More verbose, error-prone, requires manual UTF-8 encoding."
    rationale: >
      NFR-2 explicitly requires Unix-style LF line endings (\\n), not Windows CRLF (\\r\\n). The newline parameter in Python's text mode allows explicit
      control: newline='\\n' ensures LF on all platforms including Windows. This is the standard approach for cross-platform text file handling in Python.
      pathlib.Path.write_text() supports this parameter natively.

