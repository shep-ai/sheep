# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning Complete
  - **Updated:** 2026-03-25

  ## Architecture Overview

  Feature 214 is a minimal, single-file creation task. The implementation is straightforward:

  1. **File Creation**: Use Python pathlib.Path to create test-k8kqxb.md with hardcoded markdown content
  2. **Content Structure**: H1 heading (# title) + blank line + 3-sentence prose paragraph
  3. **Validation**: Verify file properties (UTF-8 encoding, LF line endings, 300-600 byte size)
  4. **Git Integration**: Use subprocess.run() to execute git add, commit, and push operations

  This pattern follows 210+ existing test files already in the repository. All decisions are
  predetermined by established precedent and the feature specification.

  ## Key Design Decisions

  ### 1. File I/O with pathlib (not open() or os module)

  **Decision**: Use `pathlib.Path` for file creation

  **Alternatives Considered**:
  - `open()` builtin: lower-level API, more verbose, requires manual context management
  - `os` module functions: lower-level system calls, less Pythonic

  **Rationale**: pathlib.Path is modern, idiomatic Python 3.11+ approach. It provides:
  - Clean, object-oriented API
  - Cross-platform path handling
  - Single method call: `Path("test-k8kqxb.md").write_text(content, encoding="utf-8")`
  - Part of standard library (NFR-4: no external dependencies)

  ### 2. Hardcoded Prose Content (not generated, not Lorem Ipsum)

  **Decision**: Hardcode a 3-sentence prose paragraph about learning and creativity

  **Alternatives Considered**:
  - Template system / programmatic generation: adds unnecessary complexity for single-file feature
  - Random / Lorem Ipsum text: violates NFR-2 (grammatically correct and coherent prose)

  **Rationale**: Hardcoded prose matches all 210+ precedent files:
  - All existing test files use real, coherent prose
  - Spec allows arbitrary topic selection (NFR-7)
  - Single 3-sentence paragraph is ~340 bytes, fits target size (300-600 bytes)
  - Ensures compliance with NFR-2 (grammatically correct and coherent)
  - Minimizes complexity

  ### 3. Git Integration via subprocess (not GitPython library)

  **Decision**: Use `subprocess.run()` for git commands (add, commit, push)

  **Alternatives Considered**:
  - GitPython library: external dependency (violates NFR-4: stdlib only), unnecessary abstraction
  - Manual git tracking: doesn't fulfill FR-7/FR-8/FR-9 (git add, commit, push requirements)

  **Rationale**: subprocess.run() provides:
  - Standard library only (aligns with NFR-4)
  - Idiomatic Python approach for shell commands
  - Simple, direct interface for three git operations
  - Prevents command injection (using list args, not shell=True)

  ### 4. File Validation Strategy

  **Decision**: Validate file properties after creation (size, encoding, line endings)

  **Alternatives Considered**:
  - No validation: risky, can't guarantee compliance with success criteria
  - External validation tools: over-engineered, adds complexity

  **Rationale**: Basic validation ensures compliance with success criteria:
  - File size check (300-600 bytes via `os.path.getsize()`)
  - Encoding verification (UTF-8 without BOM)
  - Line ending verification (\\n vs \\r\\n)
  - Uses standard library only

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1: File Creation & Validation** comes first because:
  - File must exist and be valid before git operations
  - Validation ensures spec compliance
  - Simpler operations (file I/O) should precede complex ones (git)

  **Phase 2: Git Integration** comes second because:
  - Depends on Phase 1: file must exist and be valid
  - Adds file to version control
  - Completes FR-7/FR-8/FR-9 requirements

  ### No Code/Logic Components

  This feature is purely file creation with no business logic:
  - No new functions or classes beyond file creation and validation
  - No API integration or orchestration
  - No modifications to src/sheep/ or production code
  - No external dependencies

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding mismatch | Explicitly specify UTF-8 encoding in pathlib.write_text(), verify after creation |
  | Line ending differences (CRLF vs LF) | Use Python strings with \\n (Unix convention), don't rely on platform defaults |
  | Git command failures (missing git config) | Use check=True in subprocess.run() to raise exception if commands fail |
  | File size out of range | Validate file size after creation (300-600 bytes), adjust prose if needed |
  | File already exists | pathlib.write_text() will overwrite (acceptable for deterministic test files) |
  | Commit message format | Hardcode conventional commit format in code, no runtime customization |

