content: |
  ## Architecture Overview

  Feature 205 creates a single markdown test file (`test-2kf6c7.md`) following the established pattern from
  200+ existing test files and the immediately preceding feature 204. The implementation is a straightforward,
  single-module system with clear separation of concerns:

  - **Content Generation:** Claude API with temperature=0 for deterministic, reproducible prose
  - **File Creation:** Python pathlib for UTF-8 encoding and Unix LF line ending guarantees
  - **Validation:** Enhanced 6-check pipeline (exists, format, sentences, encoding, line endings, size)
  - **Git Workflow:** subprocess-based commands for safe, auditable version control operations

  The architecture mirrors feature 204 exactly, proven successful across 200+ test files in production.
  No new dependencies required—leverages existing sheep platform infrastructure (LLM config, structured logging).

  ### Module Structure

  **Location:** `src/sheep/features/feature_205_markdown_file_creation.py`

  **Responsibilities:**
  1. Generate markdown content (title + prose) via Claude API
  2. Write file to disk with UTF-8 encoding and LF line endings
  3. Validate file meets all success criteria before commit
  4. Stage, commit, and push file via git
  5. Log all operations for audit trail

  **Public Interface:**
  - `main()` — orchestrates the complete workflow end-to-end

  **Imports:**
  - Python stdlib: `pathlib`, `subprocess`, `sys`
  - Platform: `sheep.config.llm` (LLM factory), `sheep.observability.logging` (structured logging)

  ### Integration Points

  **LLM Configuration:** Uses `sheep.config.llm.create_llm(temperature=0)`
  - Centralized, multi-provider support (Claude, OpenAI, Anthropic, Cursor, etc.)
  - Secret management via Settings pattern (no hardcoded API keys)
  - Temperature=0 for deterministic output across runs

  **Logging:** Uses `sheep.observability.logging.get_logger()`
  - Structured logging via structlog
  - Audit trail for all operations
  - Configurable log level via Settings

  **Git:** Direct subprocess calls to git CLI
  - No external VCS library dependencies
  - Requires: git installed, user.name/user.email configured, feature branch pre-created
  - Operations: add file, commit with conventional message, push to origin

  **File System:** Python pathlib for cross-platform file I/O
  - pathlib.Path.write_text(content, encoding="utf-8") handles encoding + line endings
  - Automatic platform-aware line ending normalization
  - Atomic write (not append or partial updates)

  ## Key Design Decisions

  ### 1. Content Generation: Claude API with Temperature=0

  **Choice:** Use `sheep.config.llm.create_llm(temperature=0)` to generate markdown in a single API call.

  **Rationale:**
  Feature 204 and 200+ test files demonstrate this pattern successfully. CrewAI's LLM wrapper centralizes
  configuration and handles multi-provider support. Temperature=0 ensures reproducible, deterministic output
  critical for CI/CD and automated testing. Single API call is efficient and proven.

  ### 2. File Creation: pathlib.Path.write_text() with UTF-8

  **Choice:** Use `Path(filename).write_text(content, encoding="utf-8")` to create the file.

  **Rationale:**
  pathlib is Python 3.11+ standard, cross-platform, and handles encoding + line endings automatically.
  The encoding="utf-8" parameter explicitly specifies UTF-8. Universal newlines mode ensures Unix LF
  on all platforms. This is the proven approach from feature 204.

  ### 3. Validation: Enhanced 6-Check Pipeline

  **Choice:** Implement comprehensive validation with fail-fast on first error.

  **Rationale:**
  Spec explicitly requires enhanced validation (NFR-4). Feature 204 validates all critical aspects.
  This pipeline ensures quality before commit, catches errors early, provides clear debugging messages.
  6-check approach validates all success criteria and catches common issues.

  ### 4. File Size Constraint: 200-800 Bytes

  **Choice:** Validate file size between 200-800 bytes per feature 205 spec.

  **Rationale:**
  Feature 205 spec explicitly states this range. This is slightly broader than feature 204's 250-600
  to accommodate content variation while maintaining constraints.

  ### 5. Git Integration: subprocess.run()

  **Choice:** Use `subprocess.run([cmd, arg1, arg2, ...], check=True, capture_output=True)` for git operations.

  **Rationale:**
  subprocess is Python stdlib, proven in feature 204, safe (list-based args prevent injection).
  check=True raises CalledProcessError on non-zero exit. capture_output=True enables error extraction.

  ### 6. Sentence Validation: Period-Based Counting

  **Choice:** Validate sentence count using `prose.count(".")`

  **Rationale:**
  Simple, reliable, proven in feature 204. For typical English prose with 2-3 sentences, period counting
  accurately validates the requirement. No external dependencies required.

  ### 7. Error Handling: Fail-Fast with Actionable Messages

  **Choice:** Raise specific exceptions with clear, descriptive error messages. Fail on first error.

  **Rationale:**
  Fail-fast approach enables rapid debugging. Specific exception types indicate failure mode. Clear error
  messages immediately identify issues vs. generic messages.

  ### 8. Code Organization: Strict Replication of Feature 204

  **Choice:** Follow feature 204's module structure exactly.

  **Rationale:**
  Feature 204 is the immediately preceding feature with identical requirements. Proven pattern reduces
  risk. Consistency with recent features ensures maintainability.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Foundation & Setup (Phase 1)** — Establish module structure and imports
  2. **Content Generation (Phase 2)** — Generate content via Claude API
  3. **File Creation (Phase 3)** — Write file with UTF-8/LF
  4. **Validation (Phase 4)** — Validate before git operations
  5. **Git Integration (Phase 5)** — Stage, commit, push
  6. **Integration & Orchestration (Phase 6)** — Wire all phases and test end-to-end

  This order ensures clear dependencies (content → file → validate → git), fail-fast on errors, and
  testability at each phase.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API rate limit/timeout | Use temperature=0 for concise output; implement 5-10s timeout |
  | File already exists | Check exists() before creation; fail with clear error message |
  | Invalid UTF-8 encoding | Use pathlib.Path.write_text(encoding="utf-8") for automatic handling |
  | CRLF line endings on Windows | pathlib uses universal newlines; explicit LF validation |
  | Git user not configured | Fail with clear error message; require pre-configuration |
  | Feature branch doesn't exist | Fail with clear error; require pre-created branch |
  | Claude generates invalid content | Validation pipeline catches format/sentence/size issues |
  | Git push fails | Fail with git error output; log for debugging; no retry |
  | File created but validation fails | File on disk; subsequent run detects exists() error |
