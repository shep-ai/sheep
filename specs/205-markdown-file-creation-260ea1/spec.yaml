content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. Feature 205 creates a single test markdown file (`test-2kf6c7.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-204, with 200+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system, proving the platform can consistently produce high-quality files that match established patterns.

  ## Success Criteria

  - [ ] File `test-2kf6c7.md` is created in repository root
  - [ ] File contains valid CommonMark markdown with H1 heading as title
  - [ ] File contains exactly 2-3 sentences of prose content after the H1 heading
  - [ ] File uses UTF-8 encoding (verified via file command or encoding inspection)
  - [ ] File uses Unix LF line endings (`\n`, not `\r\n`)
  - [ ] File size is between 200-800 bytes (excluding title)
  - [ ] Content is unique and meaningful (not placeholder, Lorem Ipsum, or generic filler)
  - [ ] Git commit exists on feature branch with conventional format message
  - [ ] Commit message follows format: `feat(205): Create markdown file test-2kf6c7.md with prose content`
  - [ ] Changes are pushed to remote feature branch `feat/205-markdown-file-creation-260ea1`
  - [ ] Feature branch merges with main without conflicts or manual resolution

  ## Functional Requirements

  - **FR-1**: File creation — system must create file at repository root with exact name `test-2kf6c7.md`
  - **FR-2**: Markdown structure — file must contain a CommonMark-compliant H1 heading (`# Title`) as the first content element
  - **FR-3**: Prose content — file must contain exactly 2-3 complete sentences following the H1 heading, separated by blank line
  - **FR-4**: Content quality — prose must be meaningful and coherent, generated via Claude API (not hardcoded placeholder)
  - **FR-5**: Encoding — file must be written with UTF-8 encoding (no BOM, standard UTF-8)
  - **FR-6**: Line endings — file must use Unix LF (`\n`) line endings exclusively, not CRLF (`\r\n`)
  - **FR-7**: Git staging — file must be added to git staging area using `git add`
  - **FR-8**: Git commit — changes must be committed with conventional commit message format (`feat(205): ...`)
  - **FR-9**: Git push — committed changes must be pushed to remote feature branch `feat/205-markdown-file-creation-260ea1`
  - **FR-10**: No overwrites — if file already exists, fail with clear error message rather than overwriting

  ## Non-Functional Requirements

  - **NFR-1**: Performance — file creation and git workflow must complete in under 10 seconds total
  - **NFR-2**: Code consistency — implementation must follow established pattern from features 150-204, matching code structure and style
  - **NFR-3**: Reproducibility — prose generation must use Claude API with `temperature=0` for deterministic, consistent output
  - **NFR-4**: Content validation — implementation must validate markdown syntax, line endings, file size, sentence count, and content quality
  - **NFR-5**: Markdown compliance — output file must pass CommonMark specification validation without warnings or errors
  - **NFR-6**: No dependencies — implementation must use only Python standard library (`pathlib`, `subprocess`, `sys`) and git; no external packages
  - **NFR-7**: Error handling — implementation must provide clear, actionable error messages for all failure modes (file exists, invalid encoding, git failures)
  - **NFR-8**: Logging — implementation must log key operations (file creation, validation, git operations) via `sheep.observability.logging`

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be unrestricted (any topic) or domain-specific? | **Unrestricted topic** | Simplifies implementation, maximizes flexibility, matches the 200+ existing test files which demonstrate topic variety |
  | 2 | Should markdown validation include constraint checking beyond basic syntax? | **Enhanced validation** | Ensures quality, catches common issues early, verifies sentence count requirement, consistent with established pattern |
  | 3 | Should the implementation follow the exact code pattern from feature 204? | **Strict pattern replication** | Provides proven working template, ensures consistency, reduces implementation complexity and decision-making |
  | 4 | Should prose generation use Claude API with temperature=0 for deterministic output? | **Deterministic (temperature=0)** | Ensures reproducibility and consistency, matches established platform pattern, aligns with automated testing requirements |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-204; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/features/) | Low | Creates one new feature module following established pattern from 200+ prior features; no modifications to existing code |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/205-markdown-file-creation-260ea1` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Claude API access with valid authentication credentials (for LLM prose generation)
  - Target filename: `test-2kf6c7.md` (specified in user query)

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-204) demonstrate successful execution of identical pattern
  - Recent commits show exact templates and working examples
  - Feature 204 implementation provides direct code precedent for implementation approach

  **Not Required:**
  - No source code modifications to existing files
  - No changes to core platform logic in agents, flows, or tools
  - No modification of configuration files
  - No test framework integration
  - No documentation updates beyond spec files

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 200+ existing test files:

  - **Content generation**: ~3-5 minutes (generate title and 2-3 sentences via Claude API with deterministic settings)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings using pathlib)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, line endings, file size, prose quality)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (200-204) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 204 implementation serves as direct working precedent for all implementation patterns
  - File creation and git operations use only Python standard library (pathlib, subprocess) and standard git commands
  - Claude API for prose generation reduces content creation time and ensures quality

  ---

  _Requirements phase complete — ready for implementation planning_
