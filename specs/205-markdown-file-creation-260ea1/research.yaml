content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24
  - **Approach:** Strict replication of feature 204 with single file-size constraint adjustment

  ## Technology Decisions

  ### 1. Prose and Title Generation: Claude API with Temperature=0

  **Chosen:** Use `sheep.config.llm.create_llm(temperature=0)` to generate markdown content via Claude API.

  **Rejected:**
  - Hardcoded content — violates FR-4 requirement for Claude API-generated prose
  - Alternative LLM provider — introduces dependencies, breaks established platform pattern
  - Higher temperature (>0) — violates spec requirement for deterministic output

  **Rationale:**
  Claude API with temperature=0 is the proven pattern from feature 204. CrewAI's LLM wrapper
  (sheep.config.llm.create_llm) provides centralized configuration, secret management, and multi-provider
  support. Temperature=0 ensures deterministic output for reproducible testing and CI/CD. This approach
  has been validated across 200+ existing test files.

  Feature 204 generates full markdown in a single Claude API call using a structured prompt that returns
  `# Title\n\nProse content.` This approach is efficient and reliable.

  ### 2. File Creation and Encoding: pathlib.Path.write_text()

  **Chosen:** Use `Path(filename).write_text(content, encoding=\"utf-8\")` for file creation.

  **Rejected:**
  - Manual bytes manipulation — adds complexity, increases error surface
  - codecs module — less Pythonic than pathlib, more verbose
  - Using `\n` literals — fragile on different platforms

  **Rationale:**
  `pathlib.Path.write_text()` is standard library (Python 3.11+), cross-platform, and handles encoding
  and line endings automatically. It guarantees UTF-8 encoding via the encoding parameter and Unix LF
  line endings via universal newlines mode. This is the proven pattern from feature 204.

  ### 3. File Validation: Enhanced 6-Check Pipeline

  **Chosen:** Implement comprehensive validation with 6 sequential checks:
  1. File exists (verify successful creation)
  2. Markdown format (H1 heading + blank line separator)
  3. Sentence count (exactly 2-3 periods)
  4. UTF-8 encoding (no BOM, valid UTF-8)
  5. Unix LF line endings (no CRLF or CR)
  6. File size (200-800 bytes per spec)

  **Rejected:**
  - Minimal validation (syntax only) — misses quality requirements, violates spec NFR-4
  - No validation — allows invalid files to be committed
  - Post-commit validation — harder to fix, creates git history pollution

  **Rationale:**
  Specification requires enhanced validation per product requirement analysis. Feature 204 validates
  all critical aspects. This approach:
  - Catches issues early before git commit
  - Provides clear error messages for debugging
  - Validates all success criteria from spec (FR-1 through FR-10)
  - Ensures quality matching 200+ existing test files
  - Fails fast with no silent failures

  ### 4. File Size Range: 200-800 Bytes

  **Chosen:** Validate file size between 200-800 bytes per feature 205 spec.

  **Rejected:**
  - Use feature 204's 250-600 bytes — inconsistent with feature 205 spec
  - No file size validation — violates spec success criteria

  **Rationale:**
  Feature 205 spec explicitly states this range. This is slightly broader than feature 204 (250-600)
  to accommodate content variation while maintaining constraints. The range includes H1 title + blank
  line + prose.

  ### 5. Git Integration: subprocess.run() Pattern

  **Chosen:** Use `subprocess.run()` with `check=True` and `capture_output=True` for git operations
  (add, commit, push).

  **Rejected:**
  - GitPython or pygit2 — external dependencies, violates NFR-6
  - Shell commands (shell=True) — security risk
  - Manual git file manipulation — fragile and error-prone

  **Rationale:**
  subprocess.run() is standard library, proven in feature 204, and safe. check=True raises
  CalledProcessError on non-zero exit. capture_output=True enables error message extraction.
  List-based command specification prevents shell injection.

  Three operations needed:
  1. `git add filename` — stages file for commit
  2. `git commit -m \"message\"` — creates commit with conventional message
  3. `git push -u origin branch` — pushes to feature branch

  ### 6. Sentence Counting: Period-Based Validation

  **Chosen:** Count sentences using `prose.count(\".\")`

  **Rejected:**
  - NLTK, spacy, or NLP libraries — heavy external dependencies, overkill
  - Regex sentence splitting — fragile for edge cases (abbreviations, decimals)
  - Complex parsing — unnecessary for 2-3 sentence constraint

  **Rationale:**
  Period counting is simple, reliable, and proven in feature 204 across all preceding test files.
  No dependencies required (NFR-6). For typical English prose with 2-3 complete sentences, period
  counting accurately validates the requirement.

  ### 7. Error Handling: Fail-Fast with Actionable Messages

  **Chosen:** Raise specific exceptions with descriptive error messages; fail fast on first error.

  **Rejected:**
  - Retry logic — hides root causes, inappropriate for deterministic file creation
  - Graceful degradation — creates ambiguous state, prevents debugging
  - Silent error suppression — violates observability requirement

  **Rationale:**
  Fail-fast approach ensures:
  - Early error detection — invalid files never reach git staging
  - Clear debugging — specific exception types indicate failure mode
  - Audit trail — structured logging via sheep.observability.logging
  - Automation-friendly — CI/CD systems can respond to error codes

  Example: \"Generated prose has 4 sentences, expected 2-3\" immediately identifies the issue
  (Claude returned too many sentences) vs. generic \"validation failed\" message.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | `sheep.config.llm` | Claude API integration | Use | CrewAI LLM wrapper with centralized config, multi-provider support |
  | `pathlib` (stdlib) | File I/O | Use | Cross-platform, Python 3.11+ standard, handles encoding/line endings |
  | `subprocess` (stdlib) | Git operations | Use | Safe command execution, standard library, proven in feature 204 |
  | `sheep.observability.logging` | Structured logging | Use | Audit trail, structured output via structlog |
  | `sys` (stdlib) | Error reporting | Use | Exit codes, stderr output |
  | GitPython / pygit2 | Git operations | Reject | External dependencies violate NFR-6 |
  | NLTK / spacy | NLP processing | Reject | Overkill for simple period counting; violates NFR-6 |

  **Dependency Status:** Zero new dependencies. All required libraries (CrewAI, pathlib, subprocess, structlog)
  already exist in the platform.

  ## Security Considerations

  1. **Path Traversal Prevention**
     - File created at repository root with hardcoded filename `test-2kf6c7.md`
     - No variable path construction
     - **Mitigation:** ✓ No path traversal risk

  2. **Command Injection Prevention**
     - Git commands use list-based arguments: `[\"git\", \"add\", filename]`
     - Never use `shell=True` or string interpolation
     - Filename is hardcoded constant
     - **Mitigation:** ✓ No command injection risk

  3. **API Key Management**
     - Claude API key handled by `sheep.config.llm.create_llm()`
     - Keys stored in environment variables via Settings pattern
     - Not hardcoded in feature code
     - **Mitigation:** ✓ Follows platform secret management standards

  4. **Input Validation**
     - Title and prose generated by Claude API (trusted source)
     - No external user input
     - Validation pipeline checks output before commit
     - **Mitigation:** ✓ No untrusted input exposure

  **Overall Security Posture:** Low-risk. No external input, standard libraries, centralized secret
  management, safe subprocess usage.

  ## Performance Implications

  **Estimated Execution Timeline:**
  - Claude API call (title generation): 2-4 seconds
  - Claude API call (prose generation): 2-4 seconds
  - File creation (pathlib write): <100ms
  - Validation pipeline (6 checks): <100ms
  - Git add: <100ms
  - Git commit: <200ms
  - Git push: 1-2 seconds
  - **Total: 5-11 seconds**

  **NFR-1 Requirement:** Performance must complete in under 10 seconds total.
  - Expected execution: 6-10 seconds (within limit)
  - Bottleneck: Claude API network latency (2-4 seconds per call)
  - Actual performance depends on network conditions; local operations are negligible (<1 second total)

  ## Architecture Notes

