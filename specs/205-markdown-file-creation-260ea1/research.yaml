  **File Location:** `src/sheep/features/feature_205_markdown_file_creation.py`
  - Follows naming pattern: `feature_NNN_markdown_file_creation.py`
  - Parallel structure with features 104-204 in same directory

  **Imports:**
  - `subprocess`, `sys`, `pathlib` — Python standard library
  - `sheep.config.llm.create_llm` — existing platform LLM factory
  - `sheep.observability.logging.get_logger` — existing platform logging

  **Module Organization:**
  - Constants (FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE)
  - Generation functions (generate_prose, generate_title)
  - Creation function (create_markdown_file)
  - Validation functions (verify_file_exists, validate_markdown_format, etc.)
  - Git functions (git_add_file, git_commit, git_push)
  - Main orchestrator (main())

  ### Interaction with Existing Systems

  **LLM Configuration:** Leverages `sheep.config.llm` module
  - Centralized settings via Settings pattern
  - Provider-agnostic (OpenAI, Anthropic, Google, Cursor)
  - Temperature control for deterministic generation

  **Logging System:** Uses `sheep.observability.logging.get_logger()`
  - Structured logging via structlog
  - Log level configurable via Settings

  **Git Integration:** Direct subprocess calls to git CLI
  - Requires git installed and configured
  - Requires git user.name and user.email set
  - Uses existing feature branch: `feat/205-markdown-file-creation-260ea1`

  **Directory Structure:** No changes to repository structure
  - File created at repository root: `./test-2kf6c7.md`
  - No new directories or configuration files
  - Minimal impact on existing codebase

  ### Pattern Consistency

  **Deviation from Feature 204:**
  - File size range: 200-800 bytes (vs. feature 204's 250-600)
  - Rationale: Spec requirement explicitly specifies 200-800 byte range
  - All other aspects: identical to feature 204

  **Alignment with 200+ Test Files:**
  - Follows established pattern: create file, validate, commit, push
  - Topic variety (unrestricted): matches prior test files
  - Deterministic generation (temperature=0): matches established pattern
  - Conventional commits: matches all prior features

  ## Markdown Specification Compliance

  **CommonMark Compliance:**
  - Output must validate against CommonMark spec (https://spec.commonmark.org/)
  - H1 heading format: `# Title` (exact match required)
  - Blank line separator: required between heading and prose
  - Prose: standard UTF-8 text with Unix LF line endings
  - No special CommonMark features required

  **Validation:** Feature 204 pattern validates:
  1. First line must be `# Title` format
  2. Second line must be blank
  3. Exactly one H1 heading in file
  4. Prose starts at line 3

  This ensures output is valid CommonMark and consistent with 200+ existing test files.

