        - "Create module file with required imports"
        - "Define all constants at module level"
        - "Initialize logger: logger = get_logger(__name__)"
      refactor:
        - "Add module docstring explaining purpose"
        - "Organize imports: stdlib first, then platform imports"
        - "Add comments explaining constants"
    estimatedEffort: "15 minutes"

  - id: "task-2"
    phaseId: "phase-2"
    title: "Implement title and prose generation via Claude API"
    description: |
      Implement generate_title() and generate_prose() functions that call Claude API with temperature=0.
      Return properly formatted markdown content. Title should be a descriptive string (for H1 heading).
      Prose should be 2-3 complete sentences.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "Function generate_title() exists and returns a string (no # symbol)"
      - "Function generate_prose() exists and returns a string with 2-3 sentences"
      - "Claude API called with temperature=0 for deterministic output"
      - "LLM client created via sheep.config.llm.create_llm(temperature=0)"
      - "Errors from API (timeout, auth failure) caught and logged"
      - "Functions called during testing return valid content within 10 seconds"
    tdd:
      red:
        - "Write test that calls generate_title() and asserts it returns a non-empty string"
        - "Write test that calls generate_prose() and asserts it returns a string"
        - "Assert generate_prose() result contains periods (sentence boundaries)"
      green:
        - "Create Claude LLM client: llm = sheep.config.llm.create_llm(temperature=0)"
        - "Implement generate_title() that prompts Claude for a short, descriptive title"
        - "Implement generate_prose() that prompts Claude for 2-3 sentences of prose"
        - "Return title and prose strings directly (no formatting in this function)"
      refactor:
        - "Extract prompt strings to module-level constants if reusable"
        - "Add logging for API calls: logger.info('Calling Claude API for title generation')"
        - "Add error handling with specific exception messages"
        - "Set reasonable timeout (5-10 seconds per call)"
    estimatedEffort: "25 minutes"

  - id: "task-3"
    phaseId: "phase-3"
    title: "Implement file creation with UTF-8 encoding and Unix LF line endings"
    description: |
      Implement create_markdown_file(title, prose) function that writes a markdown file to repository root
      with proper structure: H1 heading, blank line, prose. Use pathlib.Path.write_text() with explicit
      UTF-8 encoding to guarantee encoding and line ending properties.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "Function create_markdown_file(title, prose) exists"
      - "File created at repository root with name 'test-2kf6c7.md'"
      - "File content structure: '# {title}\\n\\n{prose}'"
      - "File uses UTF-8 encoding (no BOM)"
      - "File uses Unix LF line endings (\\n, not \\r\\n)"
      - "Used pathlib.Path.write_text() with encoding='utf-8' parameter"
      - "If file already exists, raises FileExistsError with descriptive message"
    tdd:
      red:
        - "Write test that calls create_markdown_file('Test Title', 'Prose here.') and asserts file exists"
        - "Read created file and verify it starts with '# Test Title'"
        - "Read file in binary mode and assert no \\r\\n (CRLF) sequences"
        - "Assert file encoding is UTF-8 (check no BOM bytes 0xEF 0xBB 0xBF)"
      green:
        - "Implement create_markdown_file(title, prose) function"
        - "Build content: f'# {title}\\n\\n{prose}'"
        - "Create Path object: filepath = Path('test-2kf6c7.md')"
        - "Check if exists: if filepath.exists(): raise FileExistsError(...)"
        - "Write file: filepath.write_text(content, encoding='utf-8')"
      refactor:
        - "Add logging before and after file creation"
        - "Extract file path and content structure to named variables for clarity"
        - "Add comprehensive error messages for file exists case"
        - "Validate inputs (title and prose are not empty)"
    estimatedEffort: "20 minutes"

  - id: "task-4"
    phaseId: "phase-4"
    title: "Implement comprehensive validation pipeline (6 checks)"
    description: |
      Implement validate_file() with 6 sequential checks: (1) file exists, (2) markdown format valid,
      (3) sentence count 2-3, (4) UTF-8 encoding, (5) Unix LF line endings, (6) file size 200-800 bytes.
      Each check raises specific exception with descriptive message on failure. All checks must pass before
      file can proceed to git operations.
    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "Function validate_file(filename) exists and returns True if all checks pass"
      - "Check 1: File exists at specified path"
      - "Check 2: First line is '# Title' format (H1 heading), second line is blank"
      - "Check 3: Prose contains exactly 2-3 periods (sentences)"
      - "Check 4: File content is valid UTF-8 (no invalid byte sequences)"
      - "Check 5: File uses only Unix LF (\\n), no CRLF (\\r\\n) or CR (\\r)"
      - "Check 6: File size is between 200-800 bytes (excluding H1 title line)"
      - "Each failed check raises specific exception with clear message"
      - "Validation fails fast on first error (does not continue after failure)"
      - "Detailed error messages include actual values: 'File has 4 sentences, expected 2-3'"
    tdd:
      red:
        - "Write test that validates a correct file returns True"
        - "Write test that file with 4 sentences raises ValueError"
        - "Write test that file with CRLF line endings raises ValueError"
        - "Write test that file with wrong H1 format raises ValueError"
        - "Write test that file outside 200-800 byte range raises ValueError"
      green:
        - "Implement validate_file(filename) that performs 6 checks in sequence"
        - "Check 1: if not Path(filename).exists(): raise FileNotFoundError('File does not exist at {filename}')"
        - "Check 2: read first two lines, assert first is '# Title', second is blank"
        - "Check 3: count periods in prose, assert count == 2 or count == 3"
        - "Check 4: try to decode file as UTF-8, catch UnicodeDecodeError"
        - "Check 5: read file with 'rb' mode, assert b'\\r\\n' not in content and b'\\r' not in content"
        - "Check 6: measure file size, assert 200 <= size <= 800"
        - "Return True if all checks pass"
      refactor:
        - "Extract each check into separate function: validate_exists(), validate_format(), validate_sentences(), validate_encoding(), validate_line_endings(), validate_size()"
        - "Call from validate_file() to improve testability and readability"
        - "Add detailed logging for each check result"
        - "Improve error messages to include actual values vs. expected"
    estimatedEffort: "35 minutes"

  - id: "task-5"
    phaseId: "phase-5"
    title: "Implement git workflow (add, commit, push)"
    description: |
      Implement git_add(filename), git_commit(message), and git_push(branch) functions using subprocess
      for safe command execution. Ensure commands fail fast on error. Log all git operations for audit trail.
      Commits use conventional commit format: 'feat(205): Create markdown file test-2kf6c7.md with prose content'
    state: "Todo"
    dependencies:
      - "task-4"
    acceptanceCriteria:
      - "Function git_add(filename) runs 'git add <filename>' and raises error if fails"
      - "Function git_commit(message) runs 'git commit -m <message>' and raises error if fails"
      - "Function git_push(branch) runs 'git push -u origin <branch>' and raises error if fails"
      - "All commands use subprocess.run() with check=True and capture_output=True"
      - "Commands use list-based arguments (no shell=True)"
      - "Errors captured and logged with full git output for debugging"
      - "Commit message follows conventional commits format"
      - "All operations logged via structured logging"
    tdd:
      red:
        - "Write test that git_add() executes without raising exception"
        - "Write test that git_commit() executes without raising exception"
        - "Write test that invalid command raises subprocess.CalledProcessError"
      green:
