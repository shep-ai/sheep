        - "Implement git_commit(message): subprocess.run(['git', 'commit', '-m', message], check=True, capture_output=True)"
        - "Implement git_push(branch): subprocess.run(['git', 'push', '-u', 'origin', branch], check=True, capture_output=True)"
        - "Each function: on error, log full stderr and raise with clear message"
      refactor:
        - "Extract common subprocess error handling into helper function"
        - "Add logging before each git operation: 'Running: git add test-2kf6c7.md'"
        - "Add logging after success: 'File staged for commit'"
        - "Add descriptive error messages that include git error output"
        - "Ensure branch name comes from module constant BRANCH_NAME"
    estimatedEffort: "20 minutes"

  - id: "task-6"
    phaseId: "phase-6"
    title: "Implement main orchestrator and end-to-end integration test"
    description: |
      Implement main() function that orchestrates the complete workflow: generate title and prose,
      create file, validate, stage/commit/push. Wire all components together. Add comprehensive logging
      at each step. Test full workflow end-to-end. Ensure feature branch merges cleanly with main.
    state: "Todo"
    dependencies:
      - "task-5"
    acceptanceCriteria:
      - "Function main() exists and can be called without arguments"
