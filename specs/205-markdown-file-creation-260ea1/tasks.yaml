tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Set up feature module structure and imports"
    description: |
      Create the feature module file with all necessary imports (pathlib, subprocess, sys, sheep.config.llm,
      sheep.observability.logging) and define module-level constants (FILENAME, FEATURE_NUMBER, BRANCH_NAME,
      COMMIT_MESSAGE). Establish the foundation for all subsequent tasks.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "Module file created at src/sheep/features/feature_205_markdown_file_creation.py"
      - "All imports present: pathlib, subprocess, sys, sheep.config.llm, sheep.observability.logging"
      - "Constants defined: FILENAME='test-2kf6c7.md', FEATURE_NUMBER=205, BRANCH_NAME, COMMIT_MESSAGE"
