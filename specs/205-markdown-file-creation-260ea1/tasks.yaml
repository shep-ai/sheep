  6 tasks across 6 phases to implement markdown file creation feature. Build module foundation (phase 1),
  implement content generation via Claude API (phase 2), create file with UTF-8/LF (phase 3), validate
  with 6-check pipeline (phase 4), integrate git workflow (phase 5), orchestrate end-to-end (phase 6).
  Each task includes TDD cycle (red/green/refactor). Estimated total: 2-3 hours for typical development
  pace (includes understanding feature 204 precedent, implementation, testing, cleanup).

