content: |
  ## Summary

  Feature 205 breaks into 6 focused tasks across 6 phases, implementing markdown file creation with
  proven patterns from feature 204. Build sequence:

  **Phase 1 (Task 1):** Foundation
  - Create module, imports, constants

  **Phase 2 (Task 2):** Content Generation
  - Claude API with temperature=0 for title and prose
  - Returns markdown-ready strings

  **Phase 3 (Task 3):** File Creation
  - pathlib.Path.write_text() with UTF-8 encoding
  - Atomic write to repository root
  - Ensures Unix LF line endings

  **Phase 4 (Task 4):** Validation Pipeline
  - 6 sequential checks: exists, format, sentences, encoding, line endings, size
  - Fail fast with clear error messages
  - Validates all success criteria before git operations

  **Phase 5 (Task 5):** Git Workflow
  - subprocess-based git add, commit, push
  - Conventional commit message format
  - Safe command execution with error handling

  **Phase 6 (Task 6):** Integration & Testing
  - main() orchestrator wires all components
  - End-to-end workflow from generation to push
  - Comprehensive logging throughout
  - Execution under 10 seconds

  ## Task Dependencies

  Linear dependency chain ensures each task builds on previous:
  - Task 1 (Foundation) → Task 2 (Content Generation)
  - Task 2 → Task 3 (File Creation)
  - Task 3 → Task 4 (Validation)
  - Task 4 → Task 5 (Git Workflow)
  - Task 5 → Task 6 (Integration)

  This ordering ensures:
  - No circular dependencies
  - Clear progression from generation → creation → validation → git
  - Each task independently testable
  - Early detection of issues before reaching git operations

  ## Effort Estimation

  - Task 1: 15 minutes (module setup)
  - Task 2: 25 minutes (Claude API integration)
  - Task 3: 20 minutes (file creation with encoding)
  - Task 4: 35 minutes (validation pipeline with 6 checks)
  - Task 5: 20 minutes (git operations)
  - Task 6: 30 minutes (orchestration and integration test)
  - **Total: 2 hours 25 minutes**

  Includes time for understanding feature 204 precedent, implementation, testing, and cleanup.
  Actual time varies based on debugging, edge cases encountered, and test coverage depth.

  ## Testing Strategy

  Each task includes unit tests via TDD cycles (red/green/refactor):
  - Red: Write test that fails before implementation
  - Green: Implement minimal code to pass test
  - Refactor: Clean up, improve readability, add error handling

  Integration testing occurs in Task 6: end-to-end workflow from generation through git push.

  Final validation: Feature branch merges cleanly with main, no conflicts.

  ## Key Success Factors

  1. **Code Precedent:** Feature 204 implementation serves as template
  2. **Temperature=0:** Ensures deterministic Claude API output for reproducible testing
  3. **Validation Before Commit:** 6-check pipeline catches issues before git staging
  4. **Clear Error Messages:** Specific exceptions and logging enable rapid debugging
  5. **Comprehensive Logging:** Structured logging provides audit trail for automation system
  6. **Speed:** All operations complete in <10 seconds (mostly Claude API latency)
