      - "Random generated prose — non-deterministic, harder to validate"
    rationale: >
      Per resolved open question: use generic placeholder prose. All 200+ precedent features
      use topic-independent prose about learning, growth, innovation. Advantages: (1) Deterministic
      and reproducible, (2) Consistent with all precedent features, (3) Simple to implement,
      (4) Consistent prose length and structure.

