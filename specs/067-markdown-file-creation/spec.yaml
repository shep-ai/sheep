# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-0qakgw.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 65+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 059-066, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-0qakgw.md` exists at repository root (not in subdirectory)
  - [ ] File contains a valid markdown heading (H1 with `#` or H2 with `##`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line following the heading
  - [ ] File uses UTF-8 encoding (no BOM)
  - [ ] File uses LF line endings (Unix-style `\n`, not CRLF or mixed)
  - [ ] File size is within 400-600 bytes (consistent with established pattern)
  - [ ] Markdown syntax is valid per GitHub Flavored Markdown (GFM) specification
  - [ ] File is staged in git with `git add test-0qakgw.md`
  - [ ] Commit message follows conventional commits format with `feat:` prefix (e.g., `feat(067): create markdown file test-0qakgw.md with prose content`)
  - [ ] Commit is pushed to feature branch `feat/067-markdown-file-creation`
  - [ ] No modifications to any source code, tests, or configuration files
  - [ ] No changes to any existing files in the repository

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named exactly `test-0qakgw.md` at the repository root directory
  - **FR-2**: File must contain a markdown heading (H1 or H2) as the title for the prose content
  - **FR-3**: File must contain a blank line after the heading
  - **FR-4**: File must contain exactly 2-3 sentences of prose content
  - **FR-5**: Prose content must be a coherent, grammatically correct statement (not random words)
  - **FR-6**: Stage the created file in git using `git add`
  - **FR-7**: Create a git commit with a conventional commit message using the `feat:` prefix
  - **FR-8**: Push the commit to the feature branch `feat/067-markdown-file-creation`
  - **FR-9**: Provide clear output indicating successful file creation and git operations

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (no BOM, no UTF-16 or other encodings)
  - **NFR-2**: Line endings must be LF only (`\n`), not CRLF (`\r\n`) or mixed
  - **NFR-3**: File size should be 400-600 bytes to align with established test file pattern (400-byte minimum for 2-3 sentences, 600-byte maximum for readability)
  - **NFR-4**: Markdown must follow GitHub Flavored Markdown (GFM) syntax specification for compatibility with repository display
  - **NFR-5**: No dependencies on external tools beyond Git and Python standard library (pathlib, encoding)
  - **NFR-6**: Implementation must be isolated from application source code — no modifications to `/src/sheep/` or other source directories
  - **NFR-7**: Implementation must complete within 15 minutes of actual work time
  - **NFR-8**: Output and logging should be clear and informative for debugging purposes
  - **NFR-9**: Pattern must be reproducible — identical requirements for all markdown-file-creation features (059-067)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be free-form or scoped to a specific domain? | Any topic (random) | User query explicitly says "about anything"; 65+ test files use diverse topics; flexibility aligns with minimal-constraint philosophy of established pattern |
  | 2 | Should file include metadata beyond heading and prose (YAML frontmatter, comments, etc.)? | No additional metadata | All 65+ existing test files use simple structure (heading → blank line → prose); consistency with precedent is critical |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-0qakgw.md) to existing collection of 65+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 059-066; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/067-markdown-file-creation` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 65+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 65+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (059-066) demonstrate efficient implementation of identical features

  ---

  _Requirements phase complete — ready for implementation_
