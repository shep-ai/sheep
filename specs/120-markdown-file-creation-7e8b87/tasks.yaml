content: |
  ## Task Breakdown Summary

  This implementation consists of 4 focused tasks across 2 phases:

  **Phase 1: File Creation (Task 1)**
  - Create the markdown file test-96jjvi.md with a single pathlib.write_text() operation
  - Content includes one H1 markdown heading and 2-3 sentences of prose
  - Ensures proper UTF-8 encoding and file size (300-600 bytes)

  **Phase 2: Git Integration (Tasks 2-4)**
  - Task 2: Stage the file using git add
  - Task 3: Create a conventional commit with the specified message format
  - Task 4: Push the commit to the remote feature branch

  All tasks follow the TDD cycle (RED-GREEN-REFACTOR) with straightforward assertions and implementation.
  No error handling or defensive checks are included, per NFR-4 and established pattern.

  Total estimated effort: 12 minutes (slightly under the 10-15 minute size estimate, accounting for prose writing time).

  ## Sequential Dependencies

  Task execution must follow this order:
  1. Task 1: File must exist before staging
  2. Task 2: File must be staged before committing
  3. Task 3: File must be committed before pushing
  4. Task 4: Commit must exist before pushing to remote

  No tasks can execute in parallel; each depends on the completion of the previous task.

  ## Prose Content Guidance

  The prose content for Task 1 should be:

  - Hand-written by the implementation author (any topic is acceptable)
  - Coherent and readable (proper grammar and sentence structure)
  - 2-3 complete sentences
  - Total file size 300-600 bytes (typically easy to achieve with a heading + 2-3 sentences)

  Example structure (do not use this exact content):
  ```
  # Example Title

  This is the first sentence of prose content. This is the second sentence. This is the third sentence.
  ```

  ---

  _Task breakdown complete. Ready for implementation._
