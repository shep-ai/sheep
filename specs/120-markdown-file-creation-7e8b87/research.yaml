# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** `pathlib.Path().write_text()` with explicit `encoding='utf-8'`

  **Rejected:**
  - `open()` context manager — More verbose than pathlib, less modern Python approach
  - `os.path` module operations — Legacy API, less readable and maintainable than pathlib

  **Rationale:** pathlib.Path is the modern Python stdlib standard for file operations. The
  write_text() method is concise, automatically closes files, and explicitly supports encoding
  specification. Python 3.11+ guarantees UTF-8 output by default. This approach:
  - Requires no external dependencies
  - Is consistent with established pattern from 100+ existing test files
  - Follows NFR-4 (straightforward imperative code)
  - Produces the exact output required (UTF-8 encoded, LF line endings on Linux)

  ### 2. Git Operations Implementation

  **Chosen:** `subprocess.run()` with list-based command arguments

  **Rejected:**
  - GitPython library — Adds unnecessary external dependency; abstract API contradicts NFR-6
    ("no new abstractions"); excessive for three simple sequential git commands
  - `os.system()` — Legacy approach, introduces shell injection risks, unreliable error handling

  **Rationale:** subprocess.run() is the modern stdlib approach for external command execution.
  Using list-based arguments (not shell=True) prevents shell injection attacks while providing
  explicit control. Three sequential calls (git add, git commit, git push) map directly to
  requirements. This approach:
  - Requires no external dependencies
  - Provides reliable execution and error status
  - Avoids shell injection risks
  - Matches the approach from prior features in this pattern

  ### 3. Content String Construction

  **Chosen:** Simple Python string literal with embedded newlines (`\n`)

  **Rejected:**
  - Jinja2 or other template engine — External dependency; contradicts NFR-6 (no new
    abstractions); unnecessary for fixed single-use content
  - textwrap module — Over-engineered for simple prose; adds complexity without benefit

  **Rationale:** A simple string literal is imperative and straightforward per NFR-4. The
  content is hand-written by the feature author (product decision #3) and fixed for this feature.
  No templating system needed. This approach:
  - Requires no external dependencies
  - Produces clear, readable code
  - Matches all 100+ existing test files
  - Is the simplest solution per NFR-4

  ### 4. Line Endings Handling

  **Chosen:** Rely on Python's platform-native line endings; environment is Linux (LF default)

  **Rejected:**
  - Explicit newline parameter or post-write normalization — Contradicts NFR-4 (no validation);
    unnecessary when environment defaults to LF
  - Manual encoding/decoding with line-ending conversion — Adds complexity without benefit

  **Rationale:** Python 3's write_text() uses the platform's native line endings. The system
  environment is Linux (from system reminder), which defaults to LF (Unix line endings) —
  exactly what the spec requires. This approach:
  - Requires no special handling or additional code
  - Is consistent with all 100+ existing test files created in this Linux environment
  - Avoids complexity that would contradict NFR-4
  - Produces the correct output format automatically

  ### 5. Error Handling and Validation Strategy

  **Chosen:** No error handling or validation — straightforward imperative code only

  **Rejected:**
  - Try/except blocks for defensive error handling — Directly contradicts NFR-4 explicit
    requirement for "straightforward imperative code with no validation, no edge-case handling,
    no defensive checks"
  - Pre-write validation (file existence checks, content format validation) — Contradicts
    established pattern; adds unnecessary complexity

  **Rationale:** NFR-4 explicitly specifies: "straightforward imperative code pattern: create
  content string, write to file (no validation, no edge-case handling, no defensive checks)".
  All 100+ existing test files and prior features (099-119) follow this pattern without
  validation. The simple operations (write file, git add, git commit, git push) have very low
  failure risk in a controlled development environment. Adding defensive checks would:
  - Contradict explicit requirements (NFR-4, NFR-6)
  - Deviate from the established pattern
  - Add unnecessary complexity

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | Use | Modern Python stdlib standard; write_text() provides concise UTF-8 file creation; no external dependencies |
  | subprocess (stdlib) | Git command execution | Use | Modern stdlib for external commands; list-based args prevent shell injection; no external dependencies |
  | GitPython | Git operations abstraction | Reject | External dependency; unnecessary abstraction for 3 simple sequential git commands; contradicts NFR-6 (no new abstractions) |
  | Jinja2 | Template-based content generation | Reject | External dependency; contradicts product decision #3 (hand-written prose) and NFR-6 (no new abstractions); unnecessary complexity |
  | textwrap (stdlib) | Multi-line string formatting | Reject | Unnecessary for simple prose content; over-engineered; contradicts NFR-4 (straightforward code) |

  ## Security Considerations

  1. **Command Injection Prevention:** Using subprocess.run() with list-based arguments (not
     shell=True) prevents shell injection attacks. Git commands use literal strings only. No user
     input is interpolated into commands.

  2. **File Permissions:** Test markdown files contain only prose content (no code, credentials, or
     sensitive data). File is created with default umask permissions, which is appropriate for
     repository files in a development environment.

  3. **No Dynamic Content:** Content is hand-written by the feature author (product decision #3).
     No dynamic generation, template injection, or code evaluation occurs.

  4. **No Input Validation:** No user input is processed. Feature is self-contained and does not
     accept or process external input beyond the fixed requirements.

  **Conclusion:** No security vulnerabilities or risks identified. The straightforward approach
  with no dynamic content and explicit subprocess list arguments is security-appropriate.

  ## Performance Considerations

  1. **Single File Operation:** Feature creates one ~300-600 byte markdown file. I/O operation is
     O(1) with negligible performance impact.

  2. **No Optimization Needed:** File size is small; no buffering, streaming, or chunk handling
     required. pathlib.write_text() is optimized for this use case.

  3. **Git Operations:** Three lightweight git commands (add, commit, push) are standard operations
     with typical performance. No optimization needed for a single file.

  4. **No Caching or Repetition:** Feature is single-use within a given implementation run. No
     caching or optimization for repeated operations is needed.

  **Conclusion:** No performance optimization needed. Straightforward approach is appropriate for
  the feature's scope and frequency.

  ## Architecture Notes

  This feature integrates with the Sheep automated implementation platform following the
  well-established markdown-file-creation pattern:

  - **No Source Code Dependencies:** Feature does not depend on or modify /src/sheep/ or other
    source code
  - **No Configuration Dependencies:** Uses standard git and Python; no feature flags, config
    files, or new abstractions
  - **Follows Established Pattern:** Identical implementation approach to features 099-119 and
    100+ existing test files
  - **Minimal Scope:** Single file creation with standard git workflow
  - **No Testing or Documentation Impact:** Test markdown files are artifacts, not application
    code; no test changes required
  - **Straightforward Imperative Code:** Aligns with NFR-4 and NFR-6 requirements

  The feature serves as a minimal, testable unit of work for the automated implementation
  system, demonstrating the platform's capability to create files, integrate with git, and
  follow conventional commit workflows.

  ## Implementation Approach

  Based on the research above, the implementation will follow this pattern:

  1. Create a content string with title (H1 markdown heading) and 2-3 sentences of prose
  2. Use `pathlib.Path("test-96jjvi.md").write_text(content, encoding="utf-8")` to write the file
  3. Execute three subprocess.run() calls for git operations:
     - `subprocess.run(["git", "add", "test-96jjvi.md"])`
     - `subprocess.run(["git", "commit", "-m", "feat(120): Create markdown file test-96jjvi.md with prose content"])`
     - `subprocess.run(["git", "push", "-u", "origin", "HEAD"])`

  This approach aligns with all product decisions, NFR requirements, and the established pattern
  from 100+ existing test files.

