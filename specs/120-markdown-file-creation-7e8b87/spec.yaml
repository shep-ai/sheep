# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established and proven pattern. This feature creates a single test markdown file (`test-96jjvi.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 099-119, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-96jjvi.md` created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# [Title]`)
  - [ ] File contains 2-3 sentences of prose content below the heading
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses LF (Unix-style) line endings
  - [ ] File size is between 300-600 bytes (consistent with established pattern)
  - [ ] File is staged to git with `git add test-96jjvi.md`
  - [ ] Commit created with message format: `feat(120): Create markdown file test-96jjvi.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/120-markdown-file-creation-7e8b87`
  - [ ] No other files modified or created in repository root
  - [ ] No changes to source code (`/src/sheep/`) or configuration files

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-96jjvi.md` in the repository root directory using Python pathlib file I/O
  - **FR-2**: File must contain a single H1 markdown heading as the title in format `# [Title]`
  - **FR-3**: File must contain 2-3 sentences of coherent prose content following the heading, separated by blank line
  - **FR-4**: Stage the created file to git using `git add test-96jjvi.md`
  - **FR-5**: Create a git commit with conventional commit message: `feat(120): Create markdown file test-96jjvi.md with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/120-markdown-file-creation-7e8b87` using `git push`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM, consistent with established pattern from features 099-119
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF or CR
  - **NFR-3**: File size should be approximately 300-600 bytes, following the pattern of 100+ existing test files
  - **NFR-4**: Implementation must follow straightforward imperative code pattern: create content string, write to file (no validation, no edge-case handling, no defensive checks)
  - **NFR-5**: Implementation must not modify source code, configuration files, or test files
  - **NFR-6**: Implementation must follow the established pattern from features 099-119 exactly (no new abstractions, no new helpers, no configuration)

  ## Product Decisions

  This requirements phase made three implicit product decisions explicit with AI-recommended defaults:

  | # | Decision | Recommendation | Rationale |
  | - | -------- | --------------- | --------- |
  | 1 | File validation approach | No post-write validation; trust write operation | Aligns with NFR-4 (straightforward imperative code), matches 100+ existing test files, keeps implementation simple |
  | 2 | Existing file behavior | Overwrite if file exists | Standard pathlib.Path().write_text() behavior, consistent with all previous features (099-119), imperative approach |
  | 3 | Content generation method | Hand-written prose by implementation author | All 100+ existing test files use hand-written content, all previous features (099-119) follow this pattern, human-readable output |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-96jjvi.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 099-119; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/120-markdown-file-creation-7e8b87` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format, structure, and encoding
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (099-119) demonstrate efficient implementation of identical features in 10-15 minutes
  - Straightforward imperative code pattern (no validation) keeps implementation simple
  - Product decisions are explicit and have clear, established defaults from precedent

