decisions:
  - title: "File I/O Approach"
    chosen: "Python pathlib.Path with standard file I/O"
    rejected:
      - "os.path with open() — More verbose, less idiomatic in modern Python. pathlib is the preferred approach in Python 3.4+ and is already specified in the feature spec (NFR-5)."
      - "Template libraries (Jinja2, mako) — Adds external dependency complexity unnecessary for simple static content. Harder to modify and test. Violates NFR-8 (no new dependencies)."
      - "f-strings with os.system() — Vulnerable to command injection if content isn't carefully sanitized. Not best practice."
    rationale: >
      pathlib.Path is the modern, idiomatic Python approach for file operations. It's included in the standard library since Python 3.4 and is explicitly required by NFR-5. It provides a clean, object-oriented API and handles platform-specific path operations transparently. For this simple file creation task, pathlib is perfect. The approach is consistent with established patterns in the codebase (evident from 65+ existing test files being created similarly). No external dependencies are introduced, satisfying NFR-8.

  - title: "Line Ending Handling"
    chosen: "Explicit LF line endings using newline='\\n' parameter in open()"
    rejected:
      - "Platform-default line endings (os.linesep or default mode) — Would use CRLF on Windows, violating NFR-2 requirement for Unix LF line endings. Creates platform-specific inconsistency."
      - "Post-write line ending conversion — Adds an extra I/O operation and increases code complexity. Better to handle correctly at write time."
      - "Using Python's universal newlines mode — Converts on read/write based on platform, but spec explicitly requires LF, not platform defaults."
    rationale: >
      NFR-2 explicitly requires Unix-style LF line endings, not Windows CRLF. The cleanest approach is to specify newline='\\n' in the open() call, which tells Python to use LF regardless of platform. This is well-documented in Python's io module documentation and is the standard way to enforce specific line endings. Writing with explicit newline handling produces correct results immediately without post-processing.

  - title: "File Encoding"
    chosen: "Explicit UTF-8 encoding with encoding='utf-8' parameter in open()"
    rejected:
      - "Platform-default encoding (relying on locale) — May produce different encodings on different machines (e.g., cp1252 on Windows, UTF-8 on Linux). Violates NFR-1 requirement for UTF-8 without BOM."
      - "No encoding specification — Risk of encoding errors or platform-specific behavior. Less explicit and maintainable."
    rationale: >
      NFR-1 explicitly requires UTF-8 encoding without BOM. Specifying encoding='utf-8' in the open() call ensures consistent, explicit UTF-8 encoding on all platforms. Python's open() function with this parameter writes UTF-8 without BOM by default (no special BOM handling needed). This is the standard, recommended approach and makes the intent clear in the code.

  - title: "Content Generation Approach"
    chosen: "Direct string literal (hardcoded prose content)"
    rejected:
      - "Prompt-based generation (asking implementer for content) — Out of scope for research phase. Better handled during implementation phase with manual content creation per spec requirements."
      - "Programmatic content generation — Unnecessary complexity for static prose. Harder to validate quality and readability. Doesn't align with spec's 'free-form' content requirement."
      - "Template files or configuration — Adds indirection and file dependencies for no benefit in this single-file scenario."
    rationale: >
      The specification explicitly allows free-form prose content (any topic, any style) and states that prose validation is manual (per product decision 3 in the spec). The simplest approach is for the implementer to write quality prose directly as a string literal during implementation. This allows flexibility, quality control, and alignment with the spec's free-form requirement. No generation logic is needed. This mirrors the approach used in all 65+ existing test files, which contain varied, human-written prose content.

  - title: "Git Workflow Execution"
    chosen: "subprocess module for git commands (git add, git commit, git push)"
    rejected:
      - "GitPython library — Adds external dependency (violates NFR-8). More overhead than needed for simple git operations. Subprocess is sufficient and standard library only."
      - "os.system() for git commands — UNSAFE. Vulnerable to shell injection if any variables aren't properly escaped. subprocess is strictly safer. os.system() is deprecated for this use case."
      - "Shell commands with shell=True — Unnecessary and unsafe. subprocess with shell=False is the correct approach."
    rationale: >
      subprocess is the standard library way to execute external commands safely. Using subprocess.run() with shell=False and explicit argument lists prevents command injection vulnerabilities. For three simple git commands (add, commit, push), this is adequate and doesn't require external dependencies like GitPython. The approach is secure, standard, and widely recommended in Python best practices documentation.

