# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-19
  - **Status:** Complete

  ## Technology Overview

  This feature requires only Python standard library and git CLI—no external dependencies. The implementation involves:

  - **File I/O**: pathlib.Path for creating the markdown file
  - **Encoding**: Explicit UTF-8 with proper line ending handling
  - **Content**: Human-written prose matching the established pattern (65+ test files)
  - **Git Integration**: subprocess for git commands (add, commit, push)
  - **File Format**: Markdown (CommonMark-compliant structure)

  ## Technology Decisions

  ### 1. File I/O Approach — pathlib.Path

  **Chosen:** Python's pathlib.Path with standard open() for file I/O

  **Rejected:**
  - os.path with open() — More verbose, less idiomatic. pathlib is the modern standard (Python 3.4+).
  - Template libraries (Jinja2) — Adds external dependency unnecessarily for static content.
  - Programmatic generation — Unnecessary complexity for free-form prose content.

  **Rationale:** pathlib is the modern, idiomatic Python approach and is explicitly required by NFR-5. It handles platform-specific path operations transparently and integrates seamlessly with Python's file I/O. For this simple operation, it's sufficient, clean, and follows Python best practices. This approach aligns with existing patterns in the codebase (evidenced by 65+ existing test files).

  ### 2. Line Ending Handling — Explicit LF via newline Parameter

  **Chosen:** Specify `newline='\n'` in the open() call to enforce Unix LF line endings

  **Rejected:**
  - Platform-default line endings (os.linesep) — Would produce CRLF on Windows, violating NFR-2.
  - Post-write conversion — Adds unnecessary I/O operation and complexity.
  - Universal newlines mode — Converts based on platform; we need explicit LF control.

  **Rationale:** NFR-2 explicitly requires Unix-style LF line endings. Specifying `newline='\n'` in Python's open() function ensures consistent LF on all platforms (Windows, macOS, Linux). This is the standard, documented way to enforce specific line endings in Python and produces correct results immediately without post-processing. Python's file I/O documentation recommends this approach for cross-platform consistency.

  ### 3. File Encoding — Explicit UTF-8

  **Chosen:** Specify `encoding='utf-8'` in the open() call

  **Rejected:**
  - Platform-default encoding — May vary by locale/platform (cp1252 on Windows, UTF-8 on Linux). Violates NFR-1.
  - No explicit encoding — Risk of platform inconsistency and encoding errors.

  **Rationale:** NFR-1 explicitly requires UTF-8 without BOM. Specifying `encoding='utf-8'` in open() ensures consistent UTF-8 encoding on all platforms. Python's UTF-8 codec by default does not add BOM, satisfying the "without BOM" requirement. This is explicit, maintainable, and the standard approach for consistent encoding across platforms.

  ### 4. Content Generation — Direct String Literal

  **Chosen:** Implementer writes prose content directly as a string literal during implementation phase

  **Rejected:**
  - Prompt-based generation — Out of scope for research; belongs in implementation planning.
  - Programmatic generation — Adds unnecessary complexity for static content.
  - Template files — Adds file dependencies and indirection with no benefit.

  **Rationale:** The specification explicitly allows free-form prose (any topic, any style) and designates prose validation as manual (per product decision 3). Direct string literals are simple, flexible, and allow quality control. This approach mirrors all 65+ existing test files, which contain human-written, varied prose. No generation logic is needed; the implementer writes content directly during implementation.

  ### 5. Git Workflow — subprocess Module

  **Chosen:** Use subprocess.run() for executing git commands (add, commit, push)

  **Rejected:**
  - GitPython library — Adds external dependency (violates NFR-8). Unnecessary overhead for simple operations.
  - os.system() — Unsafe; vulnerable to command injection if variables aren't properly escaped.
  - Shell commands with shell=True — Adds complexity and security risk without benefit.

  **Rationale:** subprocess is the standard library way to safely execute external commands. Using subprocess.run() with shell=False and explicit argument lists prevents command injection vulnerabilities. For three straightforward git commands, this is sufficient and requires no external dependencies. This approach is recommended by Python security best practices and the Python documentation.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib | File path and I/O operations | Use | Standard library (Python 3.4+), modern, idiomatic, explicitly required by NFR-5. Cleaner than os.path. |
  | subprocess | Execute git commands | Use | Standard library, safe approach to command execution (shell=False prevents injection), no external dependencies. |
  | UTF-8 encoding | File encoding | Use | Built into Python, satisfies NFR-1, explicitly specified via encoding parameter. No alternative needed. |
  | Git CLI | Version control operations | Use | Already available on system, no Python package needed. subprocess invokes it. |
  | Markdown format | File format specification | Use | Lightweight, human-readable, CommonMark-compliant. No special library needed; plain text format. |
  | Jinja2/Mako | Template generation | Reject | Unnecessary for static content. Adds external dependency (violates NFR-8). Direct strings are simpler. |
  | GitPython | Python git library | Reject | External dependency (violates NFR-8). subprocess is adequate for our simple needs. |
  | os.path | Older file path API | Reject | pathlib is the modern standard and explicitly required by the spec. os.path is less idiomatic. |

  ## Security Considerations

  ### File I/O Security

  - **Risk:** Writing to repository root directory
  - **Mitigation:** Feature spec explicitly designates repository root as target location (FR-2). File creation is performed with explicit pathlib.Path, preventing path traversal. No user input is used in the path.
  - **Assessment:** Low risk. File I/O operations are straightforward with no untrusted input involved.

  ### Git Command Execution

  - **Risk:** Executing git commands via subprocess
  - **Mitigation:** Use subprocess.run() with shell=False and explicit argument lists. Do not pass user input directly to git commands. All parameters (filename, commit message, branch) are defined in the spec and code, not external input.
  - **Assessment:** Low risk. subprocess with shell=False is safe. No shell injection possible with hardcoded git arguments.

  ### File Encoding and Content

  - **Risk:** UTF-8 encoding may allow certain characters; prose content could theoretically be malicious
  - **Mitigation:** File content is specification-defined and implementer-controlled. Prose is manually validated by implementer per product decision 3. No external input sources.
  - **Assessment:** Low risk. Content is under implementer control with manual validation requirements.

  ### No External Dependencies

  - **Assessment:** NFR-8 requires no new external dependencies. This design uses only Python standard library and git CLI. No third-party packages introduce supply chain risk.

  ## Performance Implications

  ### File Creation

  - **I/O Operation:** Single file write (~400-600 bytes) to disk. Negligible impact.
  - **Optimization:** No optimization needed. Sequential write is fastest approach for small files.
  - **Assessment:** Performance is not a concern for this single, small file operation.

  ### Git Operations

  - **git add:** Adds file to staging area. Negligible performance impact.
  - **git commit:** Writes commit object and updates branch ref. Negligible impact for single file.
  - **git push:** Network operation; depends on network latency, not code efficiency. No optimization possible at implementation level.
  - **Assessment:** Git performance is network-dependent, not implementation-dependent. No code-level optimizations needed.

  ### Overall

  - **Estimate:** File creation + git operations should complete in <1 second on typical systems.
  - **Scalability:** This feature is not concerned with scalability; it's a single, atomic operation.

  ## Architecture Notes

  ### Fit Within Existing Codebase

  This feature follows the established pattern from 65+ existing test files (`test-*.md`) in the repository root. The implementation integrates seamlessly with the existing codebase because:

  1. **File Location:** Repository root directory, matching all existing test files.
  2. **File Format:** Markdown (CommonMark), same as all existing test files.
  3. **Content Structure:** One H1 heading + blank line + 2-3 sentences, identical to existing files.
  4. **Git Integration:** Conventional commit format (`feat(108): ...`) aligns with repository commit conventions.
  5. **No Source Code Changes:** Feature is purely file creation; no modifications to `/src/sheep/` or other source code (NFR-7).

  ### Dependencies and Constraints

  - **Python 3.11+:** Feature requires Python 3.11+ as per technology stack in spec. pathlib and subprocess are available in all Python 3.x versions.
  - **Git Configuration:** Standard git configuration (user.name, user.email) must be set up for commits. This is assumed to be pre-configured in the repository.
  - **Feature Branch:** Feature branch `feat/108-markdown-file-creation-ca6ed1` must exist and be checked out before implementation. Pre-created per setup.
  - **Write Access:** Repository root must be writable. Already available in working directory.

  ### No Special Considerations

  - No database schema changes needed.
  - No API modifications required.
  - No configuration files need updating.
  - No documentation needs generation (spec is the source of truth).

  ## Implementation Readiness

  **All decisions made. No blockers identified.**

  - File I/O approach is clear (pathlib.Path with explicit encoding/line endings).
  - Content generation is straightforward (direct string literal, manually written).
  - Git workflow is standard and well-documented (subprocess for commands).
  - No external dependencies required; only standard library and git CLI.
  - Low security risk; no special precautions beyond using subprocess safely.
  - Performance is not a concern; operation is trivial.
  - Architectural fit is excellent; aligns with 65+ existing test files.

  **Ready to proceed to implementation planning phase.**

