content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-9veux3.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 30+ similar test files already existing in the repository as precedents.

  ## Success Criteria

  - [ ] File `test-9veux3.md` is created in the repository root directory
  - [ ] File contains exactly one markdown heading (H1) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is valid markdown syntax (no syntax errors)
  - [ ] File is UTF-8 encoded with proper line endings
  - [ ] File is staged and committed to git with conventional commit message
  - [ ] Commit message follows format: `feat: Create test-9veux3.md with [topic] content`
  - [ ] Commit is pushed to remote origin on the feature branch
  - [ ] No other files are modified or created
  - [ ] Feature branch contains exactly one new commit

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-9veux3.md` at the repository root (not in subdirectories)
  - **FR-2**: Add a markdown H1 heading (`# Title`) as the first line of the file
  - **FR-3**: Add 2-3 sentences of prose content after the heading, separated by a blank line
  - **FR-4**: Stage the created file in the git index using `git add`
  - **FR-5**: Commit the file with a conventional commit message following format `feat: Create test-9veux3.md with [topic] content`
  - **FR-6**: Push the commit to remote origin on the feature branch using `git push -u origin HEAD`
  - **FR-7**: Ensure the generated prose content is contextually coherent and about a single topic

  ## Non-Functional Requirements

  - **NFR-1**: File must be valid markdown that parses without errors
  - **NFR-2**: File must use UTF-8 encoding
  - **NFR-3**: File must use Unix line endings (LF, not CRLF)
  - **NFR-4**: File must have readable permissions for owner and group, writable by owner
  - **NFR-5**: File creation must complete within 10 seconds
  - **NFR-6**: Implementation must follow the established pattern from recent commits (#122-#126)
  - **NFR-7**: Prose content should be generated/sourced automatically without manual intervention
  - **NFR-8**: No temporary files or artifacts should remain after execution

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content generation strategy | Auto-generated with any topic | Aligns with "about anything" requirement, provides variety, leverages Sheep's AI capabilities |
  | 2 | Remote push inclusion | Yes, push to remote | Follows recent commit patterns (#122-#126), ensures upstream persistence |
  | 3 | Markdown heading level | H1 (#) | Standard convention for document titles, most readable and expected |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Adds one new markdown file (test-9veux3.md) to existing collection of 30+ test files |
  | File system | Low | Single file creation operation, no directory structure changes |
  | Git repository | Low | Standard commit and push following established pattern, no branch/merge complexity |
  | Workflow/Process | Low | Uses existing FileWriteTool and GitPython tools, no new dependencies or infrastructure |

  ## Dependencies

  - **No code dependencies**: Feature does not depend on Python libraries beyond existing tools
  - **No infrastructure dependencies**: Uses local filesystem and existing git configuration
  - **Existing tools**: Relies on FileWriteTool (tools/file_tools.py) for file creation and GitPython-based tools for version control
  - **Existing conventions**: Follows established markdown file creation pattern with 30+ precedents
  - **File system**: Requires write access to repository root (already available)

  ## Size Estimate

  **S** — Straightforward minimal task:
  - Creating a single markdown file at repository root
  - Adding a markdown heading (title)
  - Writing/generating 2-3 sentences of prose content
  - No code changes, configuration modifications, or new dependencies
  - Follows well-established pattern with 30+ existing precedents
  - Estimated effort: 15-30 minutes for implementation, validation, and git operations

  ---

  _Requirements phase complete — ready for implementation planning_
