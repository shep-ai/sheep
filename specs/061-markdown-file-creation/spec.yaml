content: |
  ## Problem Statement

  The task is to create a single test markdown file following the established pattern
  in the Sheep repository. The file should be named `test-9veux3.md`, include a
  markdown heading as the title, and contain 2-3 sentences of prose content about
  any topic of choice.

  ## Codebase Analysis

  ### Project Structure

  Sheep is an agentic platform for automated code implementation using CrewAI.
  The repository is organized as follows:

  - **Root directory**: Contains markdown test files (test-*.md) and documentation
  - **src/sheep/**: Main Python package
    - `agents/`: CrewAI agent definitions (researcher, implementer, reviewer)
    - `flows/`: Flow orchestration (code_implementation.py is the main flow)
    - `tools/`: Agent tools including file operations (file_tools.py) and git operations
    - `config/`: Configuration management and LLM setup
    - `observability/`: Logging and Langfuse integration
  - **specs/**: Feature specifications and documentation
  - **tests/**: Test suite

  The repository has 80+ markdown files, with 30+ test files (test-*.md) in the root
  directory that serve as test cases for the automated implementation system.

  ### Architecture Patterns

  The Sheep platform uses CrewAI-based architecture with:
  - **Flow-based orchestration**: Main execution flow defined in `code_implementation.py`
  - **Agent-based implementation**: Specialized agents handle research, implementation, and review
  - **Tool ecosystem**: Agents have access to tools for file operations, git operations, and web search
  - **File I/O pattern**: FileWriteTool in `tools/file_tools.py` handles file creation
  - **Git integration**: GitPython-based tools for version control

  Recent implementation pattern (commits #122-#126):
  - Each commit creates a single test markdown file
  - Files follow a consistent format: markdown heading + 2-3 sentences of prose
  - Files are created at repository root level
  - Commits use conventional commit format: `feat: Create [filename] with [topic] content`

  ### Relevant Technologies

  - **Python 3.11+**: Required runtime
  - **CrewAI 0.86.0+**: Agent orchestration framework
  - **Pydantic 2.0+**: Configuration management (used in FileWriteInput schema)
  - **Markdown format**: Plain text markup language for file content
  - **File system I/O**: Native Python pathlib and open() for file operations
  - **Git/GitPython**: Version control (via existing git tools)
  - **Hatchling**: Build system

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Will add one new markdown file (test-9veux3.md) to the existing collection of test files |
  | File system | Low | Simple file creation operation, no directory structure changes needed |
  | Git repository | Low | Standard commit and push operation following existing patterns |

  ## Dependencies

  - **No code dependencies**: This task does not depend on any Python libraries or modules
  - **No infrastructure dependencies**: Simple local file creation
  - **Existing conventions**: Follows established markdown file creation pattern in the repository (30+ similar test files exist)
  - **File system**: Requires write access to repository root directory (already available)

  ## Size Estimate

  **S** — This is a straightforward, minimal task requiring:
  - Creating a single markdown file at repository root
  - Adding a markdown heading (title)
  - Writing 2-3 sentences of prose content
  - No code changes, configuration modifications, or dependency additions needed
  - Follows a well-established pattern with 30+ existing precedents

  Estimated effort: Less than 1 hour (likely 15-30 minutes for implementation and git operations)

