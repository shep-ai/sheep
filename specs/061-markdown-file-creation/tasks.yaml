# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation proceeds through three sequential phases, each with its own set of tasks:

  **Phase 1: Content Generation** — Task 1 creates the markdown content generation capability
  using Claude API via CrewAI. This single task establishes the core ability to generate a title
  and 2-3 sentences of coherent prose about any topic.

  **Phase 2: File Creation & Validation** — Tasks 2 and 3 handle the physical file creation
  (using FileWriteTool with UTF-8 encoding) and comprehensive validation (checking markdown
  structure, line endings, encoding). These tasks work sequentially: write first (task 2),
  then validate (task 3).

  **Phase 3: Git Integration & Publication** — Tasks 4 and 5 orchestrate version control
  (git commit with conventional message format, then git push with upstream tracking).
  Task 6 serves as the integration task that chains everything together and executes the
  full workflow end-to-end to create the actual test-9veux3.md file.

  Each task includes full TDD cycles (RED/GREEN/REFACTOR) with specific test assertions
  and minimal implementation code. Dependencies are explicitly ordered so no task depends
  on a later task. Total estimated effort: 9 hours across all development and testing cycles.
