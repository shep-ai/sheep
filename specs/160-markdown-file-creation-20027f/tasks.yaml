content: |
  ## Task Summary

  Implementation breaks into 5 concrete tasks across 2 phases, totaling approximately 15 minutes:

  **Phase 1: File Creation (3 tasks, ~11 minutes)**
  1. Compose markdown prose content (2-3 sentences, free-form topic)
  2. Write file using pathlib.Path with UTF-8 encoding and LF line endings
  3. Verify file properties (size 300-600 bytes, format, encoding, line endings)

  **Phase 2: Git Integration (2 tasks, ~5 minutes)**
  4. Stage file and create conventional commit message with git
  5. Push commit to feature branch 'feat/160-markdown-file-creation-20027f'

  **Workflow:**
  Tasks are strictly sequential (no parallelization). Each task depends on the previous one:
  prose composition → file creation → verification → staging/commit → push. This natural
  workflow ensures each step builds on successful completion of prior steps.

  **Success Definition:**
  After all 5 tasks complete:
  - File `test-31h2sh.md` exists at repository root with correct structure and encoding
  - File is staged, committed with conventional message, and pushed to feature branch
  - All success criteria met (size, format, encoding, line endings, git integration)
