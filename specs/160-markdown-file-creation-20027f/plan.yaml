content: |
  ## Architecture Overview

  Feature 160 is a minimal, file-creation feature that follows the established pattern
  from 170+ existing test markdown files in the repository (test-*.md). The implementation
  consists of two simple, sequential phases:

  **Phase 1: File Creation**
  Uses Python's `pathlib.Path` to create a markdown file at the repository root with:
  - H1 heading (title line starting with `#`)
  - Blank line separator
  - 2-3 sentences of prose content
  - UTF-8 encoding without BOM (Python default)
  - LF line endings (Unix convention, automatic in Python text mode)
  - Target size: 300-600 bytes (matching precedent files)

  **Phase 2: Git Integration**
  Uses subprocess to execute standard git commands:
  - `git add test-31h2sh.md` — stage the file
  - `git commit -m \"...\"` — create conventional commit
  - `git push` — push to feature branch

  **Why This Architecture:**
  - **Simplicity**: No external dependencies, just Python 3.11+ standard library (pathlib, subprocess) and git CLI
  - **Consistency**: Mirrors exactly the pattern from features 151-159 and all 170+ existing test files
  - **No integration with src/sheep/**: This is a test fixture, not platform code
  - **Minimal scope**: Pure file creation and git workflow, no configuration changes or code modifications

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib.Path

  **Chosen:** `pathlib.Path('test-31h2sh.md').write_text(content, encoding='utf-8')`

  **Rationale:**
  - Modern standard library (Python 3.4+, universal in 3.11+)
  - Cross-platform path handling without platform-specific separators
  - `write_text()` method handles encoding automatically
  - Matches pattern from all 170+ existing test files
  - No external dependencies required

  **Alternatives rejected:**
  - `open()` builtin — less object-oriented, requires manual context manager
  - `os` module — lower-level, more verbose, not idiomatic in modern Python

  ### 2. Text Encoding: UTF-8 Without BOM

  **Chosen:** UTF-8 without Byte Order Mark (Python default when no encoding specified)

  **Rationale:**
  - Python 3's default text encoding is UTF-8 without BOM
  - CommonMark markdown standard (not UTF-8 with BOM)
  - Matches all 170+ existing test files
  - No code needed — pathlib handles automatically
  - Spec requirement: \"File SHALL be encoded in UTF-8 without Byte Order Mark\"

  **Alternatives rejected:**
  - UTF-8 with BOM — adds unnecessary bytes, interferes with markdown parsers
  - UTF-16 — inappropriate for markdown, incompatible with Unix tools

  ### 3. Line Endings: LF (Unix Convention)

  **Chosen:** LF line endings (`\n`), automatic in Python text mode on all platforms

  **Rationale:**
  - Repository is Unix-based (bash used for scripts and hooks)
  - Python text mode defaults to `\n` (LF) on all platforms
  - Spec requirement: \"File SHALL use LF (\\\\n) line endings throughout\"
  - Git configuration via .gitattributes normalizes CRLF → LF automatically
  - Matches all 170+ existing test files

  **Alternatives rejected:**
  - CRLF (Windows) — violates repository standards, breaks markdown parsing
  - Auto-detection — causes inconsistency across platforms and developers

  ### 4. Prose Content: Human-Written

  **Chosen:** Compose 2-3 sentences of human-written prose at implementation time

  **Rationale:**
  - Spec requirement: prose must be \"grammatically correct and coherent\" (NFR-2)
  - Examining 170+ precedent files shows human-quality content across diverse topics
  - Topics are free-form (\"about anything\"), providing implementation flexibility
  - Prose composition is 5-10 minutes, well within 10-15 minute total estimate
  - Maintains quality consistency with existing test files

  **Alternatives rejected:**
  - Procedurally generated text — hard to guarantee exactly 2-3 sentences, inconsistent quality
  - Template/placeholder text — fails coherence requirement, lower quality than precedents

  ### 5. Git Integration: subprocess to Git CLI

  **Chosen:** `subprocess.run()` with list-based arguments for git commands (no `shell=True`)

  **Rationale:**
  - Standard library (no external dependencies like GitPython)
  - List-based arguments prevent command injection vulnerabilities
  - Git CLI is guaranteed available in repository environment
  - Matches approach from features 151-159 and codebase patterns
  - Spec requirement: no external dependencies beyond Python 3.11+ and git

  **Alternatives rejected:**
  - GitPython library — external dependency, unnecessary overhead for simple operations
  - `shell=True` with bash — security risk (command injection), not portable

  ### 6. File Location: Repository Root

  **Chosen:** Create file at repository root (same directory level as `.git/`, `pyproject.toml`)

  **Rationale:**
  - All 170+ existing test markdown files are at repository root
  - Established pattern documented in spec's codebase analysis section
  - Maintains consistency and discoverability
  - Spec requirement: \"File is created in repository root\"

  **Alternatives rejected:**
  - `tests/` subdirectory — breaks established pattern from 170+ test files
  - `specs/` subdirectory — reserved for feature specifications (YAML files)
  - `src/sheep/` subdirectory — for source code only, not test files

  ## Implementation Strategy

  The implementation follows a sequential two-phase approach:

  **Phase 1 (File Creation)** — Compose and write the markdown file using pathlib
  - Compose coherent 2-3 sentences of prose (free-form topic)
  - Use pathlib.Path to create file at repository root
  - Python's default UTF-8 encoding and LF line endings are used automatically
  - Verify file properties (size, encoding, line endings)

  **Phase 2 (Git Integration)** — Stage, commit, and push via git CLI
  - Stage the file with `git add test-31h2sh.md`
  - Commit with conventional message: `feat(160): Create markdown file test-31h2sh.md with prose content`
  - Push to feature branch `feat/160-markdown-file-creation-20027f`

  **Why This Order:**
  File creation must complete first; git operations require the file to exist. The sequential
  approach is simple and aligns with the natural workflow. No parallelization is needed or
  beneficial for a single-file task.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | \"File already exists\" | \"File would be overwritten, losing data (unlikely since this is new feature)\" | \"Check file doesn't exist before writing; if it does, investigate and remove it first\" |
  | \"Encoding not UTF-8\" | \"File would be unreadable on some systems, fail validation\" | \"Python pathlib uses UTF-8 by default; no special handling needed\" |
  | \"Line endings are CRLF\" | \"Validation would fail, file would be inconsistent with 170+ precedents\" | \"Python text mode uses LF by default on all platforms; git config normalizes CRLF\" |
  | \"Git operations fail\" | \"File not committed/pushed, branch state inconsistent\" | \"Verify git is configured (user.name/email), verify network connectivity, verify feature branch exists\" |
  | \"File size out of range\" | \"Validation would fail, inconsistent with precedents\" | \"2-3 sentences typically 300-600 bytes; verify before committing\" |
  | \"Wrong commit message\" | \"Doesn't follow conventional commits, inconsistent with spec\" | \"Use exact format: feat(160): Create markdown file test-31h2sh.md with prose content\" |

  ## No Architecture Changes

  - No modifications to `src/sheep/` source code
  - No new configuration files or changes to existing configuration
  - No database schema changes (not applicable)
  - No API endpoints or interfaces
  - No CrewAI agent integration
  - Pure file creation operation at repository root, following established pattern
