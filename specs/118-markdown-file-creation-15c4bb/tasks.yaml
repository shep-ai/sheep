tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Create markdown file test-oyjp7x.md with H1 heading and prose content"
    description: >
      Write Python code to create the markdown file using pathlib.Path.write_text()
      with explicit UTF-8 encoding. File must contain a markdown H1 heading (title)
      followed by a blank line and 2-3 sentences of readable, grammatically correct
      prose. Prose topic is implementer's choice.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-oyjp7x.md exists in repository root directory"
      - "File contains exactly one H1 heading (# ) on the first line"
      - "File contains blank line after heading"
      - "File contains exactly 2-3 sentences of prose content after blank line"
      - "Prose is grammatically correct and readable"
      - "File size is between 400-600 bytes (guideline)"
    tdd:
      red:
        - "Write Python script that attempts to read test-oyjp7x.md"
        - "Assert file exists in repository root"
        - "Assert file contains exactly one H1 heading"
        - "Assert file has blank line separating heading from prose"
        - "Assert prose content is 2-3 sentences"
      green:
        - "Use pathlib.Path to create file: Path('test-oyjp7x.md').write_text(content, encoding='utf-8')"
        - "Choose a prose topic (e.g., nature, technology, philosophy, culture)"
        - "Write H1 heading as title related to chosen topic"
        - "Write exactly 2-3 sentences of prose content"
        - "Construct content string: '# Heading\\n\\n<sentence 1> <sentence 2> [<sentence 3>]'"
        - "Run script to create file and verify assertions pass"
      refactor:
        - "Review prose for grammar and readability"
        - "Verify file was created with no errors"
        - "Clean up any temporary test scripts if used"
    estimatedEffort: "15 minutes"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Verify file meets all encoding and format requirements"
    description: >
      Verify that test-oyjp7x.md has correct UTF-8 encoding without BOM, uses
      only LF line endings (not CRLF), follows the pattern format exactly, and
      file size is within guidelines. This validation ensures the file meets
      all non-functional requirements (NFR-1 through NFR-6).
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File encoding is UTF-8 without BOM (confirmed via file inspection)"
      - "File uses only LF line endings (\\n), not CRLF"
      - "File format matches pattern: '# Heading\\n\\n<prose>'"
      - "File size is 400-600 bytes"
      - "Markdown syntax is valid per CommonMark specification"
    tdd:
      red:
        - "Write validation script that reads test-oyjp7x.md in binary mode"
        - "Assert file does not start with UTF-8 BOM (bytes EF BB BF)"
        - "Assert file contains only \\n line endings, no \\r\\n"
        - "Assert file format matches H1 + blank line + prose pattern"
        - "Assert file size is >= 400 and <= 600 bytes"
      green:
        - "Read file in binary mode: Path('test-oyjp7x.md').read_bytes()"
        - "Check first 3 bytes for BOM: assert file[0:3] != b'\\xef\\xbb\\xbf'"
        - "Check for CRLF: assert b'\\r\\n' not in file"
        - "Decode as UTF-8 and verify format matches expected pattern"
        - "Check file size: assert 400 <= len(file) <= 600"
        - "Run validation script and confirm all assertions pass"
      refactor:
        - "No refactoring needed — validation is simple and clear"
    estimatedEffort: "10 minutes"

  - id: "task-3"
    phaseId: "phase-2"
    title: "Stage file with git add and commit with conventional message"
    description: >
      Stage the markdown file using git add, then create a commit with the
      conventional commit message format: 'feat(118): Create markdown file
      test-oyjp7x.md with prose content'. Verify commit exists on the feature
      branch with correct message.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "File test-oyjp7x.md is staged in git (git status shows 'Changes to be committed')"
      - "Commit exists with message: 'feat(118): Create markdown file test-oyjp7x.md with prose content'"
      - "Commit is on feature branch feat/118-markdown-file-creation-15c4bb"
      - "git log shows commit with correct author and timestamp"
    tdd:
      red:
        - "Run: git status"
        - "Assert test-oyjp7x.md is not yet staged (appears in 'Untracked files')"
        - "Run: git log --oneline"
        - "Assert commit message 'feat(118): ...' does not exist yet"
      green:
        - "Run: git add test-oyjp7x.md"
        - "Run: git status (verify file appears in 'Changes to be committed')"
        - "Run: git commit -m 'feat(118): Create markdown file test-oyjp7x.md with prose content'"
        - "Run: git log --oneline (verify commit appears with correct message)"
        - "Run: git branch (verify on feat/118-markdown-file-creation-15c4bb)"
      refactor:
        - "No refactoring needed — git workflow is standard and straightforward"
    estimatedEffort: "5 minutes"

  - id: "task-4"
    phaseId: "phase-2"
    title: "Push commit to remote origin"
    description: >
      Push the feature branch with the new commit to the remote origin repository.
      Verify the commit exists on the remote branch and is accessible to other
      users of the repository.
    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "Commit is pushed to remote origin on branch feat/118-markdown-file-creation-15c4bb"
      - "Remote branch contains the commit with message 'feat(118): Create markdown file test-oyjp7x.md with prose content'"
      - "git log origin/feat/118-markdown-file-creation-15c4bb shows the commit"
      - "No conflicts, rejected updates, or push errors occur"
    tdd:
      red:
        - "Run: git log origin/feat/118-markdown-file-creation-15c4bb --oneline"
        - "Assert commit 'feat(118): ...' does not exist on remote yet (push hasn't happened)"
      green:
        - "Run: git push -u origin feat/118-markdown-file-creation-15c4bb"
        - "Verify push succeeds (no errors or rejections)"
        - "Run: git log origin/feat/118-markdown-file-creation-15c4bb --oneline"
        - "Assert commit 'feat(118): ...' now appears on remote"
        - "Run: git show origin/feat/118-markdown-file-creation-15c4bb:test-oyjp7x.md"
        - "Verify remote version of file matches local version"
      refactor:
        - "No refactoring needed — push is final operation"
    estimatedEffort: "5 minutes"

totalEstimate: "35 minutes"
openQuestions: []

content: |
  ## Summary

  This feature requires 4 concrete tasks across 2 phases totaling approximately 35 minutes:

  **Phase 1: File Creation & Validation (25 minutes)**
  - Task 1: Create markdown file using pathlib.Path.write_text() with H1 heading and prose
  - Task 2: Verify file encoding (UTF-8 no BOM), line endings (LF only), format, and size

  **Phase 2: Git Integration (10 minutes)**
  - Task 3: Stage file with git add and commit with conventional message
  - Task 4: Push commit to remote origin

  ## Execution Flow

  The tasks follow a natural progression:

  1. **Create the file first** (Task 1) — use pathlib to write markdown content with proper encoding
  2. **Validate immediately** (Task 2) — confirm encoding, line endings, format, and size before proceeding
  3. **Stage and commit** (Task 3) — git add and commit with the specified conventional message format
  4. **Push to remote** (Task 4) — finalize the feature by pushing to origin

  Each task includes a TDD cycle with RED (test/verification step), GREEN (implementation),
  and REFACTOR (cleanup if needed). This ensures the feature is built incrementally with
  verification at each step.

  ## Implementation Notes

  - **Prose topic**: Completely free choice — any topic works (nature, technology, philosophy, etc.)
  - **Prose length**: 2-3 sentences naturally produces files in the 400-600 byte guideline range
  - **File location**: Always repository root, never subdirectories (per pattern from 117+ existing files)
  - **No external dependencies**: Uses only Python pathlib (stdlib) and Git (pre-configured)
  - **Commit message**: Must match exactly: `feat(118): Create markdown file test-oyjp7x.md with prose content`
