content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-22
  - **Decision Status:** All technical decisions finalized

  ## Overview

  Feature 160 creates a single markdown test file (`test-9ehmdc.md`) at repository root.
  This is a straightforward file creation task following the established pattern from 170+ existing
  test files and recent features 151-159. The implementation requires no external dependencies
  beyond Python 3.11+ standard library and git.

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** `pathlib.Path.write_text(encoding='utf-8')`

  **Rejected:**
  - Traditional `open()` function — more verbose, requires context manager, more ceremony for same result
  - `pathlib.Path.touch()` then write — splits operation into two steps unnecessarily

  **Rationale:** pathlib is the modern Python standard for file I/O (Python 3.4+, standard in 3.11+).
  It provides clean, readable, single-call file creation. The explicit `encoding='utf-8'` parameter
  ensures UTF-8 encoding across all platforms and locales, preventing platform-dependent variations.

  ### 2. Line Ending Strategy

  **Chosen:** Write with `\n` characters; rely on Python's universal newline handling

  **Rejected:**
  - Post-processing with `.replace()` — unnecessary complexity
  - `open()` with `newline=''` — lower-level, exposes unnecessary implementation detail

  **Rationale:** On Unix systems (target platform), Python's text mode automatically converts
  `\n` to LF (Unix line ending \x0A). No post-processing needed. The file will naturally have
  LF line endings matching repository standards.

  ### 3. Git Integration

  **Chosen:** `subprocess.run()` for git add, commit, push operations

  **Rejected:**
  - GitPython library — external dependency for operations that are trivial with subprocess
  - `os.system()` or `shell=True` — unsafe (injection risks), deprecated, less portable

  **Rationale:** subprocess is standard library, safe, portable, and ideal for simple git operations.
  No external dependencies required. The operations are straightforward: `git add`, `git commit`,
  `git push` with a conventional commit message.

  ### 4. Prose Content Strategy

  **Chosen:** Hardcoded, specific prose content (coherent sentences about a chosen topic)

  **Rejected:**
  - Generated/randomized content — violates NFR-2 requirement for grammatically correct and coherent
  - Template-based generation — unnecessary complexity for single file
  - External content sources — adds dependencies and complexity

  **Rationale:** Feature specification explicitly requires coherent, grammatically correct prose (NFR-2).
  All 170+ existing test files contain specific, crafted prose rather than generated content.
  Hardcoding ensures deterministic, predictable, requirement-compliant output.

  ### 5. Encoding Specification

  **Chosen:** Explicit `encoding='utf-8'` parameter in `write_text()`

  **Rejected:**
  - Rely on Python default — platform/locale dependent, unpredictable
  - Manual `.encode()` — lower-level, more error-prone, more verbose

  **Rationale:** Explicit beats implicit (PEP 20). Specification requires UTF-8 without BOM.
  The explicit parameter ensures compliance across all environments regardless of system settings.
  This is the most maintainable, safest approach.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O — create and write markdown file | **Use** | Modern Python standard, clean API, single method call, part of standard library |
  | subprocess (stdlib) | Git integration — add, commit, push | **Use** | Standard library, safe, portable, ideal for simple git operations |
  | GitPython | Git integration alternative | **Reject** | External dependency for trivial operations, unnecessary complexity |
  | markdown, commonmark | Markdown parsing | **Reject** | Not needed; we're writing plain text, not parsing markdown |
  | uuid, random | Content generation | **Reject** | Not needed; filename and content are predefined |

  ## Security Considerations

  **Injection Risks:** Minimal. File name and content are predefined, not derived from user input.
  No shell commands with user-controlled strings.

  **File Permissions:** File created with default umask permissions (typically 0644 on Unix).
  This is standard and expected for repository files.

  **Encoding Safety:** UTF-8 without BOM prevents encoding-related attacks or confusion.
  Explicit encoding specification prevents platform-dependent encoding surprises.

  **Dependencies:** Using only Python standard library (pathlib, subprocess) eliminates
  supply chain risks from external packages.

  **Git Safety:** Using subprocess.run() with explicit argument list (not shell=True)
  prevents any possibility of shell injection in git commands.

  ## Performance Implications

  **File Creation:** Single file (~350-450 bytes) creates negligible I/O overhead.
  pathlib.Path.write_text() is optimized for this exact use case.

  **Git Operations:** Three simple git commands (add, commit, push) on a single file.
  No performance concerns; these are typical development operations.

  **No Optimization Needed:** This feature is small, fast, and not performance-sensitive.

  ## Architecture Notes

  This feature follows the established pattern from 170+ existing test files:
  - File created in repository root (not in src/, specs/, or other directories)
  - Git workflow uses conventional commits on feature branch
  - No source code modifications in src/sheep/ or production code
  - No database changes, API modifications, or architectural impacts

  The implementation is entirely self-contained: create file → validate → git add → commit → push.
  No integration with other features or systems required.

  ## Implementation Approach

  The feature will be implemented as a Python script that:

  1. Creates markdown file at repository root with exact name `test-9ehmdc.md`
  2. Writes H1 heading as first line
  3. Writes blank line
  4. Writes 2-3 sentences of coherent prose
  5. Stages file with `git add test-9ehmdc.md`
  6. Commits with message: `feat(160): Create markdown file test-9ehmdc.md with prose content`
  7. Pushes to feature branch `feat/160-markdown-file-creation-ba8faf`

  **Example structure:**
  ```
  # Heading Title

  First sentence. Second sentence. Third sentence.
  ```

  **Pseudo-code:**
  ```python
  from pathlib import Path
  import subprocess

  # Write file
  content = "# Title\n\nProse sentences here.\n"
  Path("test-9ehmdc.md").write_text(content, encoding='utf-8')

  # Git operations
  subprocess.run(["git", "add", "test-9ehmdc.md"])
  subprocess.run(["git", "commit", "-m", "feat(160): Create markdown file test-9ehmdc.md with prose content"])
  subprocess.run(["git", "push", "-u", "origin", "HEAD"])
  ```

  ## Precedent Analysis

  Features 151-159 successfully implemented identical patterns:
  - All used pathlib or similar for file I/O
  - All created markdown files with H1 heading + 2-3 sentences
  - All followed conventional commit format
  - All were completed in estimated 10-15 minutes
  - Example: Feature 159 (`test-rk485w.md`) follows exact same pattern

  All 170+ test files in repository follow this identical structure, confirming the
  pattern is well-tested, proven, and reliable.

  ## Conclusion

  Feature 160 is a straightforward file creation task with well-established precedents.
  The chosen technologies (pathlib, subprocess, standard library) align with modern Python
  conventions and the established pattern in this repository. No external dependencies needed.
  All requirements can be met with high confidence using the documented approach.

