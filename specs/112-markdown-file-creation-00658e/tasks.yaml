      green:
        - "Verify pathlib.Path.write_text(..., encoding=\"utf-8\", newline=\"\\n\") produces correct encoding"
        - "Confirm content is valid markdown heading + prose sentences"
      refactor:
        - "No refactoring needed; encoding/line endings are handled by pathlib parameters"
    estimatedEffort: "5 minutes"

