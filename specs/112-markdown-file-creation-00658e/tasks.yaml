      Define the prose content (unique topic with H1 heading and 3 sentences) and write test-yadead.md
      to repository root using pathlib.Path.write_text(). Content must follow: # Heading\n\n<3 sentences>
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-yadead.md exists in repository root directory"
      - "File contains exactly one H1 heading (#) on first line"
      - "File contains exactly blank line after heading (line 2)"
      - "File contains exactly 3 sentences of prose content on lines 3-5"
      - "Prose content is grammatically correct and readable"
      - "Implementation uses pathlib.Path.write_text() as required by NFR-5"
    tdd:
      red:
        - "Write assertion that file test-yadead.md does not exist (or is empty)"
      green:
        - "Use pathlib.Path(\"test-yadead.md\").write_text(content, encoding=\"utf-8\", newline=\"\\n\")"
        - "Content format: \"# Unique Topic\\n\\nSentence one. Sentence two. Sentence three.\""
