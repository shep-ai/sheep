content: |
  ## Task Summary

  This feature requires 5 concrete tasks broken into 2 logical phases:

  **Phase 1: Markdown File Creation (tasks 1-2, ~15 minutes)**
  First, create the markdown file with proper content structure, encoding, and line endings using pathlib.
  Validate that UTF-8 without BOM and LF line endings are correctly applied. Content must be 2-3 sentences
  (implementing as 3 sentences for consistency with prior features) with a meaningful, unique topic.

  **Phase 2: Git Integration (tasks 3-5, ~11 minutes)**
  Then, integrate with version control: stage the file, commit with conventional commit message format
  (feat(112): ...), and push to the remote origin on the feature branch.

  ## Task Ordering Rationale

  - **Tasks 1-2 are sequential:** File must exist (task-1) before validation (task-2)
  - **Tasks 3-5 are sequential:** File must exist before git operations can stage/commit/push it
  - **Phase 1 before Phase 2:** File creation is a prerequisite for all git operations
  - **No parallel tasks:** Each task depends on successful completion of prior work

  ## TDD Approach for This Feature

  Given that this is a file creation and git automation feature (not a unit-testable code module),
  the TDD cycles are adapted to assertion-based validation:

  - **RED:** Write assertion/check that validates the requirement is not yet met
  - **GREEN:** Implement minimal code to satisfy the requirement
  - **REFACTOR:** Verify implementation quality and edge cases

  Example (task-1):
  - RED: Assert file does not exist yet
  - GREEN: Use pathlib to create file with content
  - REFACTOR: Verify content structure and readability

  Example (task-3):
  - RED: Assert file is not in git staging area
  - GREEN: Run git add subprocess command
  - REFACTOR: Confirm git status shows file is staged

  ## Implementation Flow

  1. Create markdown file (task-1): pathlib.Path.write_text() with UTF-8/LF
  2. Validate encoding/size (task-2): Binary inspection, CommonMark syntax check
  3. Stage file (task-3): subprocess.run(['git', 'add', ...])
  4. Commit (task-4): subprocess.run(['git', 'commit', ...])
  5. Push (task-5): subprocess.run(['git', 'push', 'origin', ...])

  All tasks follow the established pattern from 111+ prior markdown-file-creation features.

  ## Dependencies and Constraints

  - Feature branch `feat/112-markdown-file-creation-00658e` must exist (pre-created)
  - Git must be configured with user.name and user.email (standard environment setup)
  - Write access to repository root (already available)
  - Python 3.11+ with pathlib and subprocess (standard library, always available)
  - Network access for git push (required for FR-9)

  ---

  _Task breakdown complete — 5 ordered tasks with TDD cycles, ready for implementation_
