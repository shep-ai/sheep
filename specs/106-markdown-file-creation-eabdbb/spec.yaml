content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-vnjj9m.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 105+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-105, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-vnjj9m.md` exists in repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# Title`)
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File is UTF-8 encoded with no special characters or encoding issues
  - [ ] File is staged in git (visible in `git status`)
  - [ ] File is committed with message: "feat(106): create markdown file test-vnjj9m.md with prose content"
  - [ ] Commit is pushed to branch `feat/106-markdown-file-creation-eabdbb`
  - [ ] No existing files in the repository are modified or deleted
  - [ ] No changes to source code (src/sheep/ or elsewhere)
  - [ ] File size is within 400-600 bytes (minimal implementation)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-vnjj9m.md` in the repository root directory using file I/O (Python pathlib or shell equivalent)
  - **FR-2**: File must contain a markdown H1 heading (single `#` with title text) on the first line
  - **FR-3**: File must contain exactly 2-3 sentences of prose content on lines following the heading
  - **FR-4**: File must be encoded in UTF-8 with no BOM (Byte Order Mark)
  - **FR-5**: File must be staged in the git index via `git add`
  - **FR-6**: File must be committed with conventional commit message following the pattern: "feat(106): create markdown file test-vnjj9m.md with prose content"
  - **FR-7**: Commit must be pushed to the feature branch `feat/106-markdown-file-creation-eabdbb` (no pull request required, branch only)
  - **FR-8**: No modifications to existing files (repository root, src/, specs/, or elsewhere)

  ## Non-Functional Requirements

  - **NFR-1**: Follow the established pattern from features 069-105 (105+ identical implementations already completed)
  - **NFR-2**: Keep file size minimal (~400-600 bytes total, matching prior test files)
  - **NFR-3**: Use generic/template prose content that is simple and focused on demonstrating the file creation pattern, not meaningful documentation
  - **NFR-4**: Ensure prose consists of plain text paragraphs only, with no advanced markdown formatting (no bold, italic, lists, code blocks, etc.)
  - **NFR-5**: Implementation should complete in approximately 10-15 minutes (matches prior feature implementation time)
  - **NFR-6**: No external dependencies beyond Python standard library (pathlib) or git CLI
  - **NFR-7**: No changes to project architecture, configuration, or source code

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | --- | -------- | ----------------- | --------- |
  | 1 | Prose content: generic or meaningful? | Generic template prose | This is one of 105+ test files demonstrating automated file creation, not documentation. Template content keeps focus on the mechanism. |
  | 2 | Markdown formatting: advanced or plain? | Plain paragraphs only | Consistency with pattern 069-105. Additional formatting adds no value and distracts from core file-creation pattern. |
  | 3 | Commit message: exact pattern or variation? | Match established pattern exactly | Exact consistency across 105+ implementations ensures clarity in git history and maintains recognizable pattern. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-vnjj9m.md) to existing collection of 105+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-105; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/106-markdown-file-creation-eabdbb` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 105+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)
  - **No code dependencies**: This feature does not depend on the Sheep codebase, CrewAI, or any other project source code

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of template prose)
  - **Git workflow**: ~5-10 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 105+ identical test files providing clear precedent
  - Topic selection is straightforward (generic template prose, no research needed)
  - Single file with minimal, well-understood content format (one heading + plain prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-105) demonstrate efficient implementation of identical features in 10-15 minutes
  - No technical complexity; task is purely file I/O and git workflow
  - No source code modifications needed
  - No architectural decisions or design work required

  **Size rationale**: Confirmed as "S" (10-15 minutes) based on:
  - Pattern simplicity: file creation with no code changes
  - Established precedent: 105+ identical implementations with clear, reusable pattern
  - Scope: single file, no modifications to existing code
  - Effort: basic file I/O (~5 min) + standard git workflow (~5-10 min)

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria specified, product decisions documented with AI recommendations_
