content: |
  ## Technology Decisions

  ### 1. File Creation Method

  **Chosen:** Python built-in pathlib.Path with open() context manager

  **Rejected:**
  - pathlib.Path.write_text() — simpler but less explicit about encoding parameters; open() with context manager provides fine-grained control over newline handling
  - Direct file I/O with os module — lower-level, less modern Python idiom; pathlib is standard in Python 3.4+
  - External file libraries (e.g., fsspec) — unnecessary dependency; pathlib handles all requirements without external packages

  **Rationale:**
  The open() context manager with pathlib.Path provides explicit control over encoding and newline parameters.
  The `newline=""` parameter is critical for cross-platform line ending consistency (prevents CRLF conversion on Windows).
  This pattern is proven across 116+ prior implementations in the Sheep project. The existing
  content_generators.py module demonstrates this approach (line 128: `open(file_path, "w", encoding="utf-8")`).

  ### 2. Content Generation Approach

  **Chosen:** Claude API via CrewAI LLM framework (get_reasoning_llm())

  **Rejected:**
  - Static content templates — would produce repetitive prose; Claude API allows creative, coherent prose
  - Procedural generation (random sentence assembly) — produces grammatically awkward results
  - External markdown generators — overcomplicated; the Sheep project standardizes on Claude API

  **Rationale:**
  Claude API via the Sheep framework's get_reasoning_llm() integration provides high-quality prose generation.
  All 116+ prior features use this pattern, ensuring consistency and proven reliability. The implementation
  in content_generators.py (lines 27-68: generate_markdown_content()) uses an LLM prompt with validation
  to ensure output meets the markdown requirements (H1 heading, 2-3 sentences, trailing newline).

  ### 3. Line Ending Management

  **Chosen:** Explicit newline parameter in open(): newline="" for write, binary mode for validation

  **Rejected:**
  - Default Python text mode — converts \\n to \\r\\n on Windows, failing validation
  - Post-write .replace() to strip CRLF — fragile; better to prevent conversion at write-time
  - Platform-specific logic (if sys.platform...) — adds complexity; single parameter works uniformly

  **Rationale:**
  The spec requires "Unix-style LF line endings only". Python's text mode behavior is platform-dependent:
  on Windows, it converts \\n to \\r\\n unless `newline=""` is passed to open(). This requirement was
  discovered through testing (commit 534fff2 fixed a CRLF issue via the newline="" parameter).
  Validation uses binary mode (rb) to detect any line ending violations (line 197-198 in content_generators.py).

  ### 4. Encoding Specification

  **Chosen:** UTF-8 without Byte Order Mark (BOM)

  **Rejected:**
  - UTF-8 with BOM — adds unnecessary b'\\xef\\xbb\\xbf' bytes; validation explicitly rejects this
  - ASCII encoding — too restrictive; prose may contain international characters
  - Default system encoding — unreliable across platforms; explicit UTF-8 ensures reproducibility

  **Rationale:**
  UTF-8 without BOM is the modern standard for markdown and web content. All 116+ existing test files
  follow this encoding. The validation function (line 187-188 in content_generators.py) explicitly
  checks for and rejects UTF-8 BOM. Python's default UTF-8 encoding (without BOM) is used when
  writing files (line 128: `encoding="utf-8"`).

  ### 5. File Validation Strategy

  **Chosen:** Comprehensive post-write validation function (validate_markdown_file)

  **Rejected:**
  - No validation — would miss encoding or structure errors silently
  - Schema library validation — overkill for markdown; custom validation is clearer
  - Lazy validation (on read) — too late; must catch issues immediately after file creation

  **Rationale:**
  The existing validate_markdown_file() function (lines 150-244 in content_generators.py) provides
  comprehensive checks: UTF-8 encoding validation, CRLF detection, H1 heading structure, blank line
  separator, 2-3 sentence prose count, trailing newline. This function is called immediately after
  file creation (line 411 in create_markdown_file()) to catch issues before committing. The validation
  approach directly implements the success criteria and non-functional requirements from the feature spec.

  ### 6. Git Workflow Implementation

  **Chosen:** Sheep framework GitCommitTool and GitPushTool with conventional commits

  **Rejected:**
  - Direct subprocess.run() to git CLI — duplicates existing tool functionality, less testable
  - GitPython library — adds external dependency where Sheep framework already provides git tools
  - Manual staging via Bash — brittle, less integrated with framework logging and error handling

  **Rationale:**
  The Sheep framework provides GitCommitTool and GitPushTool (imported in content_generators.py line 8).
  These tools are the proven integration points for all 116+ prior features. They handle error cases,
  validation, and provide consistent logging. The commit function (lines 274-328) uses GitCommitTool
  with add_all=True for staging, and push function (lines 331-360) uses GitPushTool with set_upstream
  for remote tracking.

  ### 7. Conventional Commit Message Format

  **Chosen:** "feat(feature_number): Create [filename] markdown file with prose content"

  **Rejected:**
  - Simple format without feature number — lacks semantic context and feature traceability
  - Custom format inconsistent with prior features — would break established pattern
  - PR title only — loses feature tracking and conventional commit structure

  **Rationale:**
  The established pattern from 116+ prior features uses format: `feat(117): Create test-vlr6wx.md with prose content`.
  This implements conventional commits (feat scope for feature number), improving git history readability and
  enabling automated changelog generation. The pattern is consistent with Angular commit conventions and enables
  feature traceability via feature number in the commit scope. The content topic may be included in the message
  for additional context (line 315 in content_generators.py).

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | Python pathlib | File I/O and path operations | Use | Standard library since Python 3.4; perfect fit for cross-platform path handling |
  | Python open() | File writing with encoding control | Use | Standard library with native newline parameter; proven via commit 534fff2 |
  | Claude API | LLM-based content generation | Use | Proven across 116+ features; integrated via Sheep framework's get_reasoning_llm() |
  | CrewAI | LLM framework integration | Use | Sheep framework dependency; provides LLM abstraction layer for Claude API calls |
  | GitCommitTool | Git staging and commit operations | Use | Sheep framework tool; proven integration point; handles add_all staging |
  | GitPushTool | Git push operations with upstream tracking | Use | Sheep framework tool; proven integration point; handles remote push and tracking |
  | Git CLI (native) | Version control and branch operations | Use | Native platform tool; no dependency; Sheep tools wrap this internally |
  | CommonMark | Markdown syntax validation | Reference | Specification standard; validation function confirms compliance |

  ## Security Considerations

  1. **Path Traversal Prevention**: The write_markdown_file() function validates filename safety
     (line 117: checks for "/" and "\\" and leading "." to prevent directory escape). Filenames must
     be simple identifiers like "test-xxxxx.md" with no path components.

  2. **LLM Prompt Injection**: The Claude API call uses a fixed, hardcoded prompt (MARKDOWN_GENERATION_PROMPT)
     with no user input interpolation, preventing prompt injection attacks.

  3. **File Permissions**: Files are created with default system permissions (typically 644 on Unix, inherited
     permissions on Windows). No sensitive data is written; all content is non-confidential markdown prose.

  4. **Encoding Validation**: Binary read validation (line 183-184) checks for UTF-8 BOM and confirms UTF-8
     decoding, preventing encoding-related attacks or malformed input processing.

  5. **Newline Handling**: Explicit newline="" parameter prevents CRLF injection attacks or unintended line
     ending conversion that could cause validation failures.

  6. **Git Operations**: GitCommitTool and GitPushTool use native git CLI with safe parameter passing, avoiding
     command injection vulnerabilities.

  ## Performance Implications

  1. **File I/O**: Single file write operation (~300-600 bytes) is negligible (~1-2ms on modern hardware).

  2. **LLM Latency**: Claude API call (line 46) is the dominant performance factor, typically 1-3 seconds
     depending on API load and network latency. This is acceptable per the 10-15 minute feature estimate.

  3. **Validation**: Post-write validation (line 411) reads file once in binary mode, then processes text,
     adding ~10-50ms for typical file sizes.

  4. **Git Operations**: Commit (line 416) and push (line 426) operations are standard git workflows,
     typically 200-1000ms depending on repository size and network latency.

  5. **Overall Timing**: Estimated 10-15 minutes per feature spec accounts for LLM API latency (1-3s),
     file I/O (~1-2ms), validation (~10-50ms), and git operations (~200-1000ms), with overhead for
     logging and error handling.

  ## Architecture Notes

  ### Integration with Sheep Framework

  The markdown file creation feature leverages the Sheep framework's existing abstractions:
  - **LLM Integration**: Uses `sheep.config.llm.get_reasoning_llm()` for Claude API access via CrewAI
  - **Logging**: Uses `sheep.observability.logging.get_logger()` for structured observability
  - **Git Tools**: Uses `sheep.tools.GitCommitTool` and `sheep.tools.GitPushTool` for git operations

  ### Existing Code Reuse

  The feature is implemented in the existing `src/sheep/content_generators.py` module (116+ features use
  this same module). No new files or modules are required. The module exports:
  - `generate_markdown_content()`: LLM-based prose generation with validation
  - `write_markdown_file()`: File creation with encoding control
  - `validate_markdown_file()`: Comprehensive post-write validation
  - `commit_markdown_file()`: Git staging and commit
  - `push_markdown_file()`: Git push with upstream tracking
  - `create_markdown_file()`: Orchestration function combining all steps

  ### Error Handling

  Each function in content_generators.py includes:
  - Try/except blocks with detailed logging (lines 44-68, 126-147, 181-244, etc.)
  - Specific error types (ValueError for validation, IOError for file operations)
  - Propagation of errors upstream for caller handling
  - Detailed error messages with context

  ### Testing Strategy

  The Sheep framework includes test suites for content_generators.py (multiple test phases across 116+ features):
  - Unit tests for each function (content generation, file writing, validation)
  - Integration tests combining multiple functions (full workflow)
  - Validation tests confirming file structure and encoding
  - Git operation tests confirming commit and push behavior

  ## Conclusion

  Feature 117 is a direct continuation of the markdown-file-creation pattern established in features 069-116.
  All technical decisions are validated through 116+ prior implementations. The architecture is simple,
  modular, and reuses proven components from the Sheep framework. No new dependencies or architectural
  changes are required. The implementation is ready for the implementation phase.

