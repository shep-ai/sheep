# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-30
  - **Status:** Complete — ready for implementation

  ## Architecture Overview

  Feature 281 is a standalone file creation task with no dependencies on the Sheep
  application logic. The implementation is a self-contained script that:

  1. **Creates a markdown file** using `pathlib.Path.write_text()` with hard-coded
     prose content (one H1 heading + 2-3 sentences)
  2. **Verifies file properties** to ensure UTF-8 encoding without BOM, LF line
     endings, correct structure, and appropriate file size
  3. **Performs git operations** (add, commit, push) using subprocess with standard
     git CLI commands

  This approach aligns with the established pattern observed in 225+ identical test
  files already in the repository (test-*.md at root). The feature creates a
  validation artifact for the automated implementation system, with no modifications
  to application source code, tests, or configuration.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Selected:** `pathlib.Path.write_text()` with default UTF-8 encoding

  **Rationale:**
  - pathlib is the modern Python 3.11+ standard for file operations
  - write_text() handles UTF-8 encoding without BOM (exact spec requirement) by default
  - Automatically manages file closing (no resource leak risk)
  - More Pythonic and readable than open() + manual encoding handling
  - Consistent with implicit pattern in all 225+ existing test files
  - Simplifies exception handling (repository root is guaranteed writable)

  **Alternative considered:** open() function with manual encoding — rejected because
  it requires explicit try/finally for resource cleanup and is less Pythonic.

  ### 2. Content Generation: Hard-Coded Prose

  **Selected:** Hard-coded prose content in Python string literal

  **Rationale:**
  - This is a one-time file creation task with simple, static content
  - Spec allows free-form topic selection (no constraints on content)
  - Grammatical correctness is the only quality requirement; hard-coding guarantees this
  - No templating overhead; simplest = fewest opportunities for error
  - All 225+ precedents use inline prose strings

  **Alternatives considered:**
  - Template engines (Jinja2): rejected for unnecessary dependency complexity
  - Random/procedural generation: rejected for added complexity with no benefit

  ### 3. Git Operations: subprocess with CLI commands

  **Selected:** `subprocess.run()` with standard git CLI (add, commit, push)

  **Rationale:**
  - Git operations are straightforward and minimal
  - subprocess is simpler and more transparent than GitPython wrapper
  - CLI commands are human-readable in git history and logs
  - Provides clear error messages from git itself (via check=True)
  - Allows exact control over commit message format
  - Consistent with all 225+ precedents

  **Alternative considered:** GitPython library — rejected because while available
  in dependencies, it adds abstraction overhead for simple operations.

  ### 4. Line Endings: Explicit LF in string literal

  **Selected:** Explicit LF (`\n`) in Python string, preserved by pathlib.write_text()

  **Rationale:**
  - Spec explicitly requires Unix-style LF, not Windows CRLF
  - Python string literals with `\n` explicitly represent LF
  - pathlib.write_text() preserves literal characters without modification
  - Portable and explicit; no platform-dependent behavior

  **Alternative considered:** os.linesep — rejected because it's platform-dependent
  and would fail the spec requirement on Windows.

  ### 5. File Encoding: UTF-8 without BOM

  **Selected:** UTF-8 without BOM (default for pathlib.write_text())

  **Rationale:**
  - Modern standard matching spec requirement
  - pathlib.write_text() defaults to UTF-8 without BOM
  - Matches Python/Git best practices (BOM-less is preferred)
  - Consistent with all existing test files in the repository
  - Requires no special handling or manual specification

  ## Implementation Strategy

  ### Phase Ordering

  Phase 1 (file creation) comes before Phase 2 (git integration) because:

  1. The git operations depend on the file existing with correct properties
  2. Validation can catch encoding/structure issues before attempting git operations
  3. Logical separation: file system operations, then version control operations

  ### High-Level Approach

  1. Define markdown content as a Python string with H1 heading and prose
  2. Use pathlib.Path.write_text() to write file atomically with UTF-8 encoding
  3. Verify file meets all technical requirements (encoding, line endings, structure)
  4. Use subprocess to stage, commit, and push the file to remote origin

  ### Standalone Implementation

  This is NOT integrated with the Sheep agent framework. The implementation:

  - Creates a simple, testable Python script
  - Has no dependencies on application logic or Crew agents
  - Violates no spec requirement (spec prohibits /src/sheep/ modifications)
  - Follows precedent from all 225+ identical features

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File already exists with different content | Low | Low | Script should verify file creation succeeds and content is correct |
  | Git configuration missing (user.name, user.email) | Low | Medium | subprocess.run() with check=True will raise CalledProcessError with clear message |
  | Git push fails due to network | Very Low | Low | check=True will raise error; user can retry |
  | File encoding not UTF-8 without BOM | Very Low | Low | pathlib.write_text() defaults to UTF-8 without BOM; verify in testing |
  | Line endings become CRLF due to git config | Low | Low | Verify actual bytes in file; git core.safecrlf=false prevents auto-conversion |
  | File size outside expected range | Very Low | Very Low | File size naturally falls in range with correct structure; verify as acceptance criterion |

  **Overall Risk Level:** Very Low. The feature is simple, follows established patterns, and has
  no architectural complexity.

  ## Summary

  Feature 281 is a minimal, well-understood task following a clear pattern from 225+ precedents.
  The implementation uses only Python 3.11+ standard library (pathlib, subprocess) with no
  external dependencies. Two-phase approach (file creation, then git integration) is logical
  and straightforward. No significant risks or architectural concerns.

