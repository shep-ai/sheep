  - title: "Encoding and Line Ending Handling"
    chosen: "Explicit UTF-8 encoding with \\n newlines in Python strings"
    rejected:
      - "os.linesep — would use system line endings (CRLF on Windows), violates NFR-2 which explicitly requires LF"
