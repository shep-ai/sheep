# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows a well-established pattern from 100+ identical markdown file creation features
  (features 063-187) already implemented in the Sheep repository. The implementation is straightforward
  and isolated: create a single markdown file at the repository root with hardcoded prose content,
  then stage, commit, and push to the feature branch.

  **Key architectural characteristics:**

  1. **Isolated Implementation**: No dependencies on application source code (/src/sheep/). Pure file
     creation exercise at repository root alongside existing test-*.md files.

  2. **Standalone Execution**: Implementation via direct Python pathlib and git CLI calls, not
     integrated into Sheep agents or CLI infrastructure. Consistent with precedent pattern from
     features 063-187.

  3. **Zero External Dependencies**: Uses only Python standard library (pathlib) and system git
     executable. Adheres to NFR-9 (no new dependencies).

  4. **Minimal Complexity**: Single file, simple markdown format (H1 heading + prose), straightforward
     git workflow. No algorithms, data structures, or control flow complexity.

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib.Path

  **Chosen:** `pathlib.Path("test-svqqqu.md").write_text(content, encoding='utf-8')`

  **Reasoning:**
  - Modern Python standard (PEP 428) for file operations, recommended in Python 3.11+
  - Single method call handles file creation, encoding, and line ending preservation
  - Explicit `encoding='utf-8'` ensures UTF-8 without BOM (Python default) across platforms
  - Python string `\n` is preserved as LF byte in UTF-8 text mode (meets NFR-2)
  - Zero external dependencies; no verbose boilerplate of built-in `open()` or `os.open()`
  - Already mentioned in feature spec (NFR-5) as preferred approach
  - Consistent with implicit pattern in 100+ existing test files

  **Alternatives rejected:**
  - Built-in `open()` function: more verbose, requires manual encoding/decoding
  - `os.open()` with `os.write()`: lower-level, requires additional imports, not Pythonic
  - Subprocess to shell utilities: cross-platform issues, unnecessary shell dependency

  ### 2. Content Generation: Hardcoded Prose

  **Chosen:** Generate prose content directly via hardcoded string variable

  **Reasoning:**
  - Feature spec (NFR-8) explicitly permits flexible topic: "Prose topic may be any topic chosen by
    implementer"
  - User query says "anything", enabling any coherent 2-3 sentences
  - Hardcoded content is simple, deterministic, and requires zero external dependencies
  - Selected topic: general technology/programming concept (relevant to Sheep context, demonstrates
    technical prose structure quality)
  - Eliminates risk of non-determinism or external service dependencies
  - Consistent with pattern of 100+ test files, each created directly without external templates

  **Alternatives rejected:**
  - Template engine (Jinja2, Mako): adds external dependency, unnecessary for simple format
  - LLM-generated content: adds external service dependency, non-deterministic, violates NFR-9
  - Load from external file: adds I/O complexity, couples feature to other artifacts

  ### 3. Encoding and Line Endings: Explicit UTF-8 + \n

  **Chosen:** Explicit UTF-8 encoding with `\n` newlines in Python strings

  **Reasoning:**
  - NFR-2 explicitly requires "Unix-style LF line endings (`\n`), not Windows CRLF"
  - Python string literals containing `\n` are platform-agnostic; `\n` byte is preserved as LF in
    UTF-8 text mode regardless of OS (Windows, Linux, macOS)
  - `pathlib.Path.write_text(content, encoding='utf-8')` handles text mode encoding correctly:
    Python default behavior ensures UTF-8 without BOM
  - Most straightforward, portable, and correct approach
  - Avoids pitfalls of `os.linesep` (would use CRLF on Windows), git autocrlf configuration
    (inappropriate for single-file feature)

  **Alternatives rejected:**
  - `os.linesep`: would use system line endings (CRLF on Windows), violates NFR-2
  - Git autocrlf configuration: system/repository-wide setting, inappropriate for feature scope
  - Binary mode with explicit byte encoding: more complex, no advantage over text mode

  ### 4. Markdown Validation: Manual Structural Verification

  **Chosen:** Manual structural validation before git commit (no external markdown libraries)

  **Reasoning:**
  - Markdown format is trivially simple: `# Heading\n\n<prose>` (no nesting, blocks, special syntax)
  - Manual validation ensures: (1) H1 heading on first line, (2) blank line after heading,
    (3) 2-3 sentences of prose
  - External markdown libraries (pymdown, markdown2) add unnecessary dependencies for simple format
  - Regular expressions insufficient for CommonMark validation; manual inspection is clearest
  - CommonMark compliance implicit through correct prose and H1 syntax (no complex constructs)
  - Validation is quick (visual inspection ~30 seconds) and sufficient for feature's simplicity

  **Alternatives rejected:**
  - markdown/pymdown library: adds dependency without benefit for simple format
  - Regular expression validation: fragile, doesn't comprehensively validate CommonMark
  - No validation: risky, could produce malformed markdown

  ### 5. Git Workflow: Direct CLI Commands

  **Chosen:** Direct git CLI commands via subprocess (git add, git commit, git push)

  **Reasoning:**
  - Feature spec explicitly requires: stage with `git add`, commit with conventional message,
    push to feature branch (FR-6, FR-7, FR-8, FR-9)
  - Established pattern from 100+ similar features (063-187); proven approach
  - Subprocess with `shell=False` and command as list is safe, portable, debuggable
  - Commit message is hardcoded constant (no user input), eliminating shell injection risks
  - Simpler than external libraries; standard git operations are well-optimized

  **Alternatives rejected:**
  - GitPython library: overkill for three simple git operations, adds unnecessary dependency
  - Subprocess with `shell=True`: security risk from string formatting, less portable
  - Manual git object manipulation: dangerous, breaks git invariants, unmaintainable

  ## Implementation Strategy

  **Single-phase approach** with three ordered tasks ensures proper sequencing:

  1. **Phase 1: Markdown File Creation and Git Integration**
     - Task 1 (5-7 min): Create markdown file with hardcoded content using pathlib
     - Task 2 (2-3 min): Validate file meets all specification requirements
     - Task 3 (2-3 min): Stage, commit, and push to remote

  **Rationale for ordering:**
  - Tasks are tightly coupled: file must exist before validation, validation must pass before git
    operations
  - Single phase reflects cohesive, unified implementation scope (all aspects are inseparable)
  - Dependency chain enforces correctness: invalid file will not be committed

  **Why this approach is optimal:**
  - Minimal complexity: straightforward file creation with standard git operations
  - Proven pattern: 100+ existing implementations in codebase establish precedent
  - Fast execution: total 10-15 minutes aligns with S size estimate
  - Low risk: isolated changes, no modifications to application code or configuration
  - Clear success criteria: file exists, git history shows correct commit, remote has changes

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding issues on Windows** | Explicit `encoding='utf-8'` in pathlib ensures UTF-8 regardless of platform. Python `\n` is preserved as LF in text mode. No reliance on system locale or git autocrlf. |
  | **Prose content doesn't meet format requirements** | Pre-generate hardcoded content satisfying all requirements (H1 + blank + 2-3 sentences). Validate before git operations. |
  | **Git push fails due to network/authentication** | Feature branch pre-exists and is writable. Test git operations locally first. Standard repository configuration (user.name, user.email) required and already in place. |
  | **File size outside 350-600 byte range** | 2-3 sentences of prose naturally lands in spec range (~300-500 bytes) + heading (~20-40 bytes) = 320-540 bytes. Validate size after creation; log warning if unusual. |
  | **Commit message format incorrect** | Hardcoded message string eliminates formatting risk: `"feat(188): create markdown file test-svqqqu.md with prose content"`. No user input, no interpolation. |
  | **Markdown syntax validation missed** | Manual verification in Task 2 ensures: first line is `# heading`, blank line follows, prose is prose text (not code/formatting). Simple format requires no complex validation. |

  ## Success Criteria

  - ✓ File `test-svqqqu.md` exists in repository root
  - ✓ File contains H1 heading on first line
  - ✓ File contains blank line separating heading from prose
  - ✓ File contains exactly 2-3 sentences of readable prose
  - ✓ File is UTF-8 encoded without BOM
  - ✓ File uses LF line endings (not CRLF)
  - ✓ File size is in 350-600 byte range
  - ✓ File is staged in git (`git add`)
  - ✓ Git commit exists with correct conventional message
  - ✓ Commit is on feature branch `feat/188-markdown-file-creation-025fbd`
  - ✓ Changes are pushed to remote origin

