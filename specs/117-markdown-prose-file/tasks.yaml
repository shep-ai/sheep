content: |
  ## Summary

  This feature involves 4 focused tasks across 2 phases:

  **Phase 1: File Creation & Content (Tasks 1-2)**
  - Create the markdown file with a heading on any topic
  - Add 2-3 sentences of prose content with proper formatting
  - Verify file size and encoding (pathlib handles this automatically)

  **Phase 2: Git Integration (Tasks 3-4)**
  - Stage the file and commit with the conventional message
  - Push the commit to the feature branch on remote

  Each task follows a TDD cycle: RED (assert something is missing/wrong), GREEN (implement
  minimal code), REFACTOR (clean up if needed). For such a simple feature with proven patterns,
  refactoring is minimal.

  The implementation leverages Python pathlib for safe file I/O and subprocess for git operations,
  both proven in 116+ identical features. No external dependencies or complex logic required.
  Total estimated effort: ~20 minutes.
