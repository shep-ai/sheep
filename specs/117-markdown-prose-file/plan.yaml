content: |
  ## Architecture Overview

  This feature creates a single test markdown file at the repository root, following an established
  pattern proven by 116+ identical test files (features 069-116). The implementation is completely
  isolated from application source code and requires no architectural decisions.

  The file is created using Python's pathlib module for file I/O operations, which provides:
  - Automatic UTF-8 encoding (per NFR-1)
  - Automatic LF line endings on Unix systems (per NFR-2)
  - Simple, idiomatic Python API
  - Zero external dependencies

  Git integration uses subprocess with explicit git CLI commands, providing:
  - Direct control over exact git operations
  - Prevention of command injection via explicit arguments (no shell=True)
  - Guaranteed availability of git CLI in the repository environment
  - Alignment with the pattern established in features 069-116

  ## Key Design Decisions

  ### Decision 1: File I/O Implementation — Use pathlib.Path().write_text()

  **Chosen:** `pathlib.Path("test-vvqygz.md").write_text(content)`

  **Alternatives Considered:**
  - `open()` built-in with manual context management — more verbose, error-prone
  - subprocess with shell echo commands — introduces process overhead and shell injection risk

  **Rationale:** pathlib is the modern Python standard for file operations. It automatically handles
  UTF-8 encoding and LF line endings on Unix systems without any configuration. The approach matches
  the pattern observed in all 116+ existing test files and requires no external dependencies.

  ### Decision 2: Git Integration — Use subprocess with explicit git CLI commands

  **Chosen:** subprocess with explicit arguments (git add, git commit, git push)

  **Alternatives Considered:**
  - GitPython library — adds abstraction layer for trivial operations
  - Direct git protocol implementation — unnecessarily complex

  **Rationale:** Subprocess with explicit arguments is simple, direct, and prevents injection risks
  by avoiding shell=True. Git CLI is guaranteed available in the repository environment. The approach
  aligns with established patterns from features 069-116 and requires no external dependencies.

  ### Decision 3: Content Generation — Hardcoded prose with flexible topic selection

  **Chosen:** Implementer selects any topic and writes 2-3 coherent sentences

  **Alternatives Considered:**
  - LLM API integration — violates NFR-9 (no external dependencies), adds latency and cost
  - Template-based generation — unnecessary abstraction for 2-3 sentences

  **Rationale:** Hardcoded prose is simplest and fastest. Feature spec NFR-8 explicitly allows
  "prose topic may be any topic chosen by the implementer." All 116+ existing test files use
  hand-written, unique prose on diverse topics (AI, nature, history, etc.). This approach requires
  no dependencies or API calls.

  ### Decision 4: Markdown Syntax & Encoding — Trust simple format, rely on pathlib defaults

  **Chosen:** Format: `# Heading\n\n<2-3 sentences>\n` with pathlib defaults (UTF-8, LF)

  **Alternatives Considered:**
  - Validation libraries — unnecessary complexity for trivially valid format
  - Explicit encoding specifications — redundant, Python defaults to UTF-8
  - Platform-specific newline handling — wrong, spec requires Unix LF always

  **Rationale:** The format is so simple (heading + prose) that correctness is guaranteed by
  construction. It's been proven valid in 116+ existing files. Python's pathlib.Path().write_text()
  defaults to UTF-8 encoding and LF line endings on Linux without explicit handling. No validation
  needed.

  ## Implementation Strategy

  ### Phase 1: File Creation & Content
  This phase focuses on creating the markdown file with valid content. The task is straightforward:
  compose a markdown heading (any topic), write 2-3 sentences of prose, and use pathlib to write
  the file. No external dependencies or complex logic required.

  ### Phase 2: Git Integration & Push
  This phase stages, commits, and pushes the file. Using subprocess with explicit git commands,
  we stage the file, create a commit with the conventional message format, and push to the feature
  branch. Simple, direct git operations following the established pattern.

  **Why This Order:**
  1. File must exist before we can stage and commit it
  2. Testing file content comes before testing git integration
  3. Git operations depend on file existing in working directory

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues | pathlib.Path().write_text() automatically uses UTF-8 on all platforms; no explicit handling needed |
  | Line ending issues | pathlib defaults to LF on Linux; no platform-specific code needed |
  | Git push failure | Feature branch (feat/117-markdown-prose-file) is pre-created; standard git operations are reliable in repository environment |
  | Content validation | Format is trivially simple and proven in 116+ existing files; no validation library needed |
  | External dependencies | All technologies (pathlib, subprocess, git CLI) are built-in or system-available; no external packages required |
