# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature implements a minimal, isolated file creation and git workflow, following the established
  pattern from 65+ identical test files in features 063-080. The architecture is intentionally simple:

  1. **File Creation Layer**: Use Python `pathlib.Path.write_text()` to create a markdown file with
     explicitly managed encoding (UTF-8 without BOM) and line endings (Unix LF, not CRLF).
  2. **Content Structure**: H1 markdown heading + blank line + 2-3 prose sentences, matching the
     format of all existing test files.
  3. **Git Integration Layer**: Use git CLI commands (add, commit, push) to integrate the file into
     version control with a conventional commit message.

  **Files Modified**: None (feature is isolated to new file creation)
  **Source Code Impact**: None (no changes to /src/sheep/ or test suite)
  **Configuration Impact**: None (no changes to setup, build, or CI/CD)

  The feature fits the existing architecture by:
  - Following the established test-file pattern (repository root contains 65+ test-*.md files)
  - Using only Python standard library (pathlib) — no new dependencies
  - Adhering to the conventional commit format observed in recent git history
  - Maintaining clean separation: pure file creation with no source code coupling

  ## Key Design Decisions

  ### Decision 1: File I/O Library Selection — Python pathlib

  **Chosen**: `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Why This Approach**:
  - Modern Python standard library (Python 3.4+, recommended in Python 3.11+)
  - `write_text()` method handles file creation, writing, and closing automatically
  - Explicit `encoding='utf-8'` parameter ensures UTF-8 without BOM (NFR-1)
  - Explicit `newline='\n'` parameter ensures Unix LF line endings, not Windows CRLF (NFR-2)
  - Clean, readable API — minimal code required
  - Aligns with NFR-5 requirement: "Implementation must use Python pathlib.Path for file I/O operations"
  - Matches the pattern observed in 65+ existing test files (features 063-080)

  **Alternatives Considered**:
  - Built-in `open()`: More verbose, requires manual encoding and newline parameter handling
  - Third-party libraries: Adds unnecessary dependencies

  ### Decision 2: Git Workflow Integration — Git CLI Commands

  **Chosen**: Direct `git` CLI commands: `git add`, `git commit`, `git push`

  **Why This Approach**:
  - Provides complete transparency and traceability in git history
  - No wrapper complexity — simple, direct invocation of standard git operations
  - Aligns with feature spec requirements (FR-6, FR-7, FR-8, FR-9)
  - Matches pattern observed in 65+ precedent features (063-080)
  - Conventional commit format aligns with recent git history
  - Git already configured with user.name and user.email (system requirement)

  **Alternatives Considered**:
  - GitPython library: Adds wrapper complexity; simple git commands are more transparent
  - Shell scripts: Unnecessary overhead for minimal operations

  ### Decision 3: Prose Topic — Flexible (Implementer Chooses)

  **Chosen**: Implementer selects any topic for the 2-3 prose sentences

  **Why This Approach**:
  - Directly matches user query: "create ... about anything"
  - Reduces implementation friction — no research overhead
  - Topic choice has zero functional impact (validation depends only on sentence count)
  - Aligns with autonomy in 65+ precedent files (varied topics like "Software Testing", "Crystal Structures")
  - Consistent with feature spec product decision #3

  ### Decision 4: Prose Validation — Punctuation Counting

  **Chosen**: Count sentence-ending punctuation marks (periods, exclamation marks, question marks)

  **Why This Approach**:
  - Simple, reliable validation for "exactly 2-3 sentences" requirement
  - Requires no external libraries — aligns with NFR-9
  - Matches existing validation patterns in implementation scripts
  - Effective for structured markdown prose format
  - Avoids NLP complexity

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  **Phase 1: File Creation & Validation**
  - Create the markdown file with H1 heading and prose content using pathlib
  - Validate file meets all requirements: encoding, line endings, file size, sentence count
  - This phase establishes the file as a complete, valid artifact before git integration

  **Phase 2: Git Integration & Push**
  - Stage file: `git add test-ymxyhv.md`
  - Commit: `git commit -m "feat(081): Create markdown file test-ymxyhv.md with prose content"`
  - Push: `git push -u origin HEAD`
  - This phase records changes in version control and publishes to remote

  **Why This Order**:
  - File creation and validation precede git integration (git tracks complete, valid files)
  - Validation ensures requirements are met before committing
  - Git integration is isolated and depends on file existence

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists | Feature branch is clean; no existing test-ymxyhv.md in repository |
  | Encoding/line-ending issues | Use explicit pathlib parameters: `encoding='utf-8'`, `newline='\n'` |
  | Prose validation failure | Validate by counting punctuation marks — simple, reliable method |
  | Git push failure | Standard git configuration in place; feature branch pre-created; no merge conflicts |
  | Incomplete git config | Git user.name and user.email pre-configured (system requirement) |

  ## Effort Justification

  **Estimated Total: 15 minutes (S size)**
  - File creation: ~5 minutes
  - Validation: ~3 minutes
  - Git workflow: ~2-5 minutes

  Justification: Well-established pattern with 65+ precedents, minimal content, no architectural decisions needed.
