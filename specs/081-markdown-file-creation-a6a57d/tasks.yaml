# Markdown content (the full tasks document)
content: |
  ## Task Breakdown Summary

  This feature is implemented across 4 concrete tasks in 2 phases:

  **Phase 1: File Creation & Validation** (Tasks 1-2, ~10 minutes)
  - Task 1: Create the markdown file with H1 heading and 2-3 prose sentences using pathlib
  - Task 2: Validate file meets all requirements (encoding, line endings, size, prose count)

  **Phase 2: Git Integration & Push** (Tasks 3-4, ~5 minutes)
  - Task 3: Stage and commit the file with conventional commit message
  - Task 4: Push changes to remote feature branch

  The task sequence is strictly linear: file creation → validation → commit → push.
  Each task depends on the previous task's successful completion.

  ## Task Details

  ### Task 1: Create markdown file with H1 heading and prose content (5 min)

  **What**: Create test-ymxyhv.md at repository root using pathlib with explicit UTF-8 encoding and LF line endings.

  **TDD Cycle**:
  - RED: Assert file doesn't exist; verify structure once created
  - GREEN: Implement pathlib.Path.write_text() with proper parameters
  - REFACTOR: Ensure prose is well-written and heading is descriptive

  **Acceptance**: File exists with correct structure, encoding, line endings.

  ---

  ### Task 2: Validate file encoding, line endings, size, and prose content (5 min)

  **What**: Validate UTF-8 encoding without BOM, LF line endings, 300-600 byte size, and 2-3 sentences.

  **TDD Cycle**:
  - RED: Write tests for encoding, line endings, size, sentence count
  - GREEN: Implement validation checks for each requirement
  - REFACTOR: Extract validation into helper functions

  **Acceptance**: File passes all validation checks (encoding, line endings, size, prose).

  ---

  ### Task 3: Stage and commit file with conventional commit message (2 min)

  **What**: Run 'git add test-ymxyhv.md' and 'git commit' with exact message.

  **Command**:
  ```bash
  git add test-ymxyhv.md
  git commit -m "feat(081): Create markdown file test-ymxyhv.md with prose content"
  ```

  **Acceptance**: Commit exists on feature branch with correct message.

  ---

  ### Task 4: Push changes to remote feature branch (2 min)

  **What**: Push committed changes to remote origin repository.

  **Command**:
  ```bash
  git push -u origin HEAD
  ```

  **Acceptance**: Remote feature branch contains commit; file is available on remote.

  ---

  ## Implementation Notes

  **File Creation Pattern** (Task 1):
  ```python
  from pathlib import Path

  heading = "# [Your chosen topic heading]"
  prose = "Sentence 1. Sentence 2. Sentence 3."
  content = f"{heading}\n\n{prose}\n"

  Path("test-ymxyhv.md").write_text(content, encoding='utf-8', newline='\n')
  ```

  **Validation Pattern** (Task 2):
  - UTF-8 without BOM: Check file doesn't start with bytes 0xEF 0xBB 0xBF
  - LF line endings: Verify content contains \n, not \r\n
  - File size: Use Path.stat().st_size, target range 300-600 bytes
  - Sentence count: Sum occurrences of . ! ?, expect 2-3

  **Git Workflow** (Tasks 3-4):
  - Stage: `git add test-ymxyhv.md`
  - Commit: `git commit -m "feat(081): Create markdown file test-ymxyhv.md with prose content"`
  - Push: `git push -u origin HEAD`

  All tasks follow the established pattern from features 063-080. No deviations from convention.
