  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-17
  - **Decision Status:** All 4 technical decisions finalized with clear rationale

  ## Technology Decisions

  ### 1. File I/O Library Selection: Python pathlib.Path.write_text()

  **Chosen:** Python pathlib.Path.write_text() with encoding='utf-8' and newline='\n'

  **Rejected:**
  - Built-in open() — More verbose, requires explicit encoding and newline parameter handling
  - Third-party libraries — Adds unnecessary dependencies (pathvalidate, etc.)

  **Rationale:**
  pathlib is the modern Python standard library for file I/O (Python 3.4+, recommended in 3.11+ documentation).
  The write_text() method with explicit parameters correctly:
  - Ensures UTF-8 encoding without BOM (NFR-1)
  - Ensures Unix LF line endings, not Windows CRLF (NFR-2)
  - Automatically handles file creation, writing, and closing
  - Provides clean, readable API

  This approach aligns with NFR-5 requirement ("Implementation must use Python pathlib.Path for file I/O operations")
  and matches the established pattern observed in 65+ existing test files and implementation scripts
  (features 063-080).

  **Implementation Pattern:**
  ```python
  from pathlib import Path
  content = "# Heading\n\nProse content.\n"
  Path("test-ymxyhv.md").write_text(content, encoding='utf-8', newline='\n')
  ```

  ### 2. Git Workflow Integration: Git CLI Commands

  **Chosen:** Direct git CLI commands (git add, git commit, git push)

  **Rejected:**
  - GitPython library — Adds wrapper complexity without benefit for simple operations
  - Scripting automation tools (Make, shell scripts) — Unnecessary overhead

  **Rationale:**
  The feature spec requires:
  - Stage file: `git add test-ymxyhv.md` (FR-6)
  - Commit with conventional message: `feat(081): Create markdown file test-ymxyhv.md with prose content` (FR-7, FR-8)
  - Push to origin: `git push -u origin HEAD` (FR-9)

  Direct git CLI invocation provides:
  - Complete transparency and traceability
  - No additional dependencies (git is already required for the repository)
  - Readability and alignment with established workflow
  - Conventional commit format matching the repository's history (commits 232dcc9, 81100b0, 738f1df)

  While GitPython is already a project dependency, simple git commands are more appropriate for minimal,
  straightforward operations and match the pattern observed in 65+ precedent implementations.

  ### 3. Content Topic Selection: Flexible (Implementer Chooses)

  **Chosen:** Implementer selects any topic for the 2-3 prose sentences

  **Rejected:**
  - Predefined topic (hardcoded subject matter) — Unnecessary constraint
  - Random generation from topic list — Adds complexity without functional benefit

  **Rationale:**
  Feature spec product decision #3 (section openQuestions) explicitly states: "Flexible topic is strongly
  recommended because it directly matches the user query ('about anything'), reduces implementation friction,
  and aligns with the autonomy granted in 65+ precedent files."

  Analysis of existing test files confirms varied topic selection:
  - test-k5yjxa.md: "The Art of Software Testing"
  - test-v7xasn.md: "Crystalline Structures and Their Properties"
  - test-6tawx3.md: "The Joy of Reading"
  - test-2ak324.md: "The Power of Patience"

  Topic choice has zero functional impact—validation depends only on sentence count (2-3) and structure
  (H1 + blank line + prose), not content relevance. Implementer autonomy is consistent with the established
  pattern and reduces friction.

  ### 4. Prose Content Validation: Sentence-Ending Punctuation Counting

  **Chosen:** Count sentence-ending punctuation marks (periods, exclamation marks, question marks)

  **Rejected:**
  - Natural Language Processing (NLP) library — Overkill; simple pattern matching is sufficient
  - Manual sentence parsing with regex — Error-prone; simple counting is more reliable

  **Rationale:**
  Existing implementation scripts (create_test_2ak324.py, specs/070/implementation.py) demonstrate that
  sentence validation simply counts punctuation ending marks:
  - Periods (.)
  - Exclamation marks (!)
  - Question marks (?)

  The requirement is "exactly 2-3 sentences" (FR-4). Punctuation counting is:
  - Simple and reliable
  - Requires no external libraries
  - Avoids NLP complexity
  - Aligns with existing validation patterns
  - Effective for the prose structure format (structured sentences, not prose paragraphs)

  This approach is validated by existing, working implementations and provides straightforward,
  maintainable validation logic.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O (standard library) | **Use** | Modern Python standard for file operations; handles encoding and line endings correctly; available in Python 3.11+ |
  | git | Version control (external tool) | **Use** | Required for repository integration; already configured; use CLI directly |
  | GitPython | Python git wrapper | **Reject** | Adds unnecessary wrapper complexity; direct git CLI commands are more transparent and minimal |
  | NLP libraries | Prose validation | **Reject** | Overcomplicated for simple sentence counting; punctuation-based validation is sufficient and matches existing patterns |

  ## Security Considerations

  **File Creation Security:**
  - pathlib.Path.write_text() creates files with default OS permissions (typically 644 on Unix systems)
  - No sensitive data is written; markdown test content is public
  - File is created in repository root with other test files; follows established pattern
  - No file overwrite vulnerability: existing implementation checks if file exists before creation

  **Git Integration Security:**
  - Uses standard git CLI commands with no shell injection vectors
  - Commit message is hardcoded from spec (no user input injection)
  - Git configuration (user.name, user.email) must be pre-configured (system requirement)
  - Push operation uses authenticated remote origin (standard git workflow)

  **Encoding Security:**
  - UTF-8 encoding without BOM prevents encoding-based attacks
  - Unix LF line endings (no CRLF) prevent line-ending-based exploits
  - No binary content, no embedded code execution
  - Markdown is a safe, plain-text format

  **No identified security risks.** The feature creates a simple test markdown file following
  established patterns with no sensitive data, external input processing, or privileged operations.

