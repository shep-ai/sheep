content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-z4ucz3.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in previous features, with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 100+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management (LLM settings, Pydantic-based settings)
    - `flows/` - Flow definitions using CrewAI for orchestration
    - `tools/` - Agent tools including git and file operations
    - `observability/` - Logging and Langfuse integration
    - `content_generators.py` - Utilities for markdown content generation and validation
  - **specs/**: Feature specification directory with subdirectories for each feature number
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration specifying Python 3.11+ requirement
  - **README.md**: Project documentation describing the CrewAI-based automation platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (100+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes (natural variation acceptable)
  - Implementation follows straightforward imperative code (create content string, write to file)
  - Existing utility functions in `src/sheep/content_generators.py` provide reusable components:
    - `generate_markdown_content()` - LLM-based content generation via Claude API
    - `write_markdown_file()` - File creation with validation
    - `validate_markdown_file()` - Comprehensive format checking
    - `commit_markdown_file()` - Git staging and commit
    - `push_markdown_file()` - Remote push with upstream tracking
    - `create_markdown_file()` - Orchestrates complete end-to-end workflow

  **Git Workflow Pattern**:
  - Create feature branch (pre-created as feat/123-markdown-file-creation-c2dee1)
  - Create/modify files
  - Stage with git add
  - Commit with conventional commit format: `feat(123): Create markdown file test-z4ucz3.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **LLM Integration**:
  - The project uses CrewAI with Claude API for intelligent content generation
  - `content_generators.py` demonstrates LLM integration patterns:
    - Prompt template-based generation with structured output
    - Response parsing and validation
    - Error handling with logging via structlog

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content
  - **Claude API**: LLM integration for content generation (via CrewAI)
  - **CrewAI**: Agent orchestration framework supporting multi-step workflows

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-z4ucz3.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from previous features; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/123-markdown-file-creation-c2dee1` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Claude API** (optional): If using LLM-based content generation via existing utilities, requires API key and CrewAI setup already in place

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (120-122) demonstrate efficient implementation of identical features in 10-15 minutes
  - Reusable utility functions in `content_generators.py` simplify implementation

  ---

  _Analysis phase complete — repository structure understood, architecture analyzed, specification ready for implementation phase_
