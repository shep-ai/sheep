content: |
  ## Architecture Overview

  This feature creates a single test markdown file following the established pattern in the Sheep
  project, where 100+ test files already exist at the repository root (test-*.md files).

  **Implementation approach:**
  1. **Manual Prose Creation** — The implementer writes 2-3 coherent sentences on any chosen topic
     as a Python string literal (per spec decision that manual prose is better than LLM generation
     for test artifacts).
  2. **File Writing** — Use the existing `write_markdown_file()` utility from `sheep.content_generators`
     to handle UTF-8 encoding (no BOM), LF line endings, file creation, and basic validation.
  3. **Git Operations** — Use existing CrewAI tools `GitCommitTool` and `GitPushTool` from
     `sheep.tools.git_tools` to stage, commit with exact message, and push to the feature branch.
  4. **Validation** — Perform basic manual verification that the file exists, has H1 heading,
     contains 2-3 sentences, correct encoding, and appropriate file size (300-800 bytes).

  **Integration with existing codebase:**
  - Reuses `write_markdown_file()` wrapper for consistent file I/O handling across the project
  - Reuses CrewAI git tool framework (`GitCommitTool`, `GitPushTool`) established in sheep/tools/git_tools.py
  - Follows exact pattern of 100+ existing test files at repository root
  - Does NOT use higher-level `create_markdown_file()` orchestration function, which couples
    prose generation to Claude API calls (contradicts spec decision for manual prose)
  - Does NOT use `generate_markdown_content()` or other LLM-based utilities

  **Why manual prose over LLM:**
  - User explicitly requested flexibility ("about anything")
  - Project's established pattern shows hand-written content is the norm (100+ test files)
  - For test artifacts, LLM generation adds unnecessary latency and complexity
  - Manual prose is faster to implement (5 minutes vs. 1-5 seconds for API call)
  - No external dependencies or API key management needed
  - Aligns with spec's product decision, which was already made during requirements phase

  ## Key Design Decisions

  ### 1. Prose Generation: Manual Implementation
  **Decision:** Implementer writes 2-3 coherent sentences on any chosen topic as a Python string.

  **Why this approach:**
  - Spec explicitly resolved this as a product decision during requirements phase
  - User requested "about anything", indicating topic flexibility is intentional
  - Project's 100+ test files establish hand-written content as the norm
  - For test artifacts, manual prose is faster and simpler than LLM generation
  - No external dependencies needed

  **Alternative considered:** LLM-based via `generate_markdown_content()` — rejected because it adds
  unnecessary overhead (1-5 second API latency), requires API key setup, and contradicts the spec's
  deliberate decision to prioritize simplicity and alignment with project precedent.

  **Implementation:** Create a simple Python string with prose on any topic of interest.

  ### 2. File I/O: Reuse write_markdown_file() Wrapper
  **Decision:** Use existing `write_markdown_file(content, "test-z4ucz3.md")` from `sheep.content_generators`.

  **Why this approach:**
  - Existing function handles UTF-8 encoding (no BOM), LF line endings, file validation
  - Provides error handling and logging via structured logging
  - Orthogonal to prose generation choice (file I/O is independent of prose source)
  - Spec recommends using existing helpers when available
  - Ensures consistency with project patterns

  **Alternative considered:** Custom pathlib implementation — rejected because it duplicates
  validated logic already in the codebase and loses error-checking benefits.

  ### 3. Git Operations: Use CrewAI Tool Framework
  **Decision:** Use `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`.

  **Why this approach:**
  - Low-level, reusable abstractions already in the project
  - Part of CrewAI framework already imported in content_generators.py
  - Loosely coupled to content source (don't depend on LLM-based generation)
  - Provide proper error handling and structured logging
  - Spec recommends using existing helpers

  **Alternative considered:** Higher-level `commit_markdown_file()` and `push_markdown_file()` from
  content_generators.py — rejected because these are tightly coupled to LLM content generation.
  Instead, use the lower-level CrewAI tools directly with the exact commit message.

  ### 4. Commit Message Format: Exact Conventional Commit
  **Decision:** Use exact message: `feat(123): Create markdown file test-z4ucz3.md with prose content`

  **Why this approach:**
  - Feature spec explicitly requires this exact format (non-negotiable success criterion)
  - Follows conventional commit convention with scope (123) for feature tracking
  - Ensures proper commit message semantics and traceability

  **Implementation:** Pass exact string to `GitCommitTool` with no dynamic generation.

  ### 5. Validation: Basic Manual Checks
  **Decision:** Perform basic manual verification that file meets requirements.

  **Why this approach:**
  - Spec recommends basic manual checks are sufficient for simple, well-understood features
  - 100+ successful precedents with identical pattern reduce validation complexity
  - Simple checks verify: file exists, H1 present, 2-3 sentences, UTF-8, LF, 300-800 bytes

  **Implementation:** After file creation, verify file exists, size is 300-800 bytes,
  first non-empty line starts with `#`, and prose contains ~2-3 sentences.

  ## Implementation Strategy

  **Phase 1: Content Creation & File Writing**
  1. Choose a topic of interest for 2-3 sentences of prose
  2. Write manual prose as a Python string literal with proper markdown format
  3. Call `write_markdown_file()` to create the file with UTF-8 encoding and LF line endings
  4. Perform basic validation: verify file exists, check size, verify structure

  **Phase 2: Git Integration & Push**
  1. Stage the file in git using `GitCommitTool` (which includes git add internally)
  2. Commit with exact message using `GitCommitTool` with the required scope and filename
  3. Push to feature branch with upstream tracking using `GitPushTool`
  4. Verify commit and push succeeded by checking git status and remote branch

  **Why this ordering:**
  - File creation must precede git operations (nothing to commit until file exists)
  - Validation should happen before git operations to catch issues early
  - Git operations are final step (push is last, irreversible action)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists | Feature spec specifies unique filename (test-z4ucz3.md); repository pattern ensures uniqueness. write_markdown_file() will error if file exists, caught in validation. |
  | Prose quality issues | Implementer has creative freedom ("about anything"); basic coherence check during manual review before commit. 100+ precedents show quality is straightforward. |
  | Encoding errors (CRLF instead of LF) | write_markdown_file() guarantees UTF-8 with LF on all platforms. No manual encoding needed. |
  | Commit message mismatch | Message is hardcoded in spec exactly. Will use string literal with exact text. No dynamic generation. |
  | Git push failure | Push to feature branch (already exists). Network errors will be caught by GitPushTool and logged. Can retry if needed. |
  | File size out of range | Manual validation step checks 300-800 byte range. If prose is too short/long, adjust before commit. |
  | Existing tests fail | Feature only creates new file, doesn't modify source code. No test impact expected. |
