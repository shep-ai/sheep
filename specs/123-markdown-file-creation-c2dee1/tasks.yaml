content: |
  ## Summary

  This implementation creates a single test markdown file (test-z4ucz3.md) at the repository root
  following the established pattern of 100+ existing test files in the Sheep project.

  **Implementation flow:**

  1. **Phase 1: Content Creation & File Writing (15 minutes)**
     - Choose a topic and write 2-3 sentences of manual prose (implementer-written, not LLM-generated)
     - Create markdown file with H1 heading and prose using write_markdown_file() utility
     - Validate file structure: H1 present, 2-3 sentences, UTF-8 encoding, LF line endings, 300-800 bytes

  2. **Phase 2: Git Integration & Push (10 minutes)**
     - Stage file and commit using GitCommitTool with exact message: "feat(123): Create markdown file test-z4ucz3.md with prose content"
     - Push to feature branch using GitPushTool with upstream tracking
     - Verify commit and push succeeded

  **Why manual prose:** Spec explicitly decided manual prose is better than LLM-based generation
  because the user requested flexibility ("about anything"), the project's 100+ test files show
  hand-written content is the norm, and LLM adds unnecessary overhead for test artifacts.

  **Why reuse existing utilities:** Spec recommends using existing helpers (write_markdown_file,
  GitCommitTool, GitPushTool) when available. These are orthogonal to the prose approach and
  provide tested, consistent behavior. Higher-level orchestration functions like create_markdown_file()
  are NOT used because they couple prose generation to Claude API calls, contradicting the spec decision.

  **No testing complexity:** This is straightforward file creation with no architectural decisions
  or business logic. Tests verify the final state (file exists, has correct content, is committed/pushed).
  Implementation is direct: write prose string → call write_markdown_file() → call git tools → push.

  **Total effort:** 20-25 minutes (estimate is conservative; recent features 120-122 with identical
  pattern completed in ~10-15 minutes). Actual time may be shorter once prose is written.
