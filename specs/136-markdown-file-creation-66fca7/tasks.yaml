content: |
  ## Summary

  Feature 136 consists of 3 concrete tasks organized across 2 phases:

  **Phase 1: Markdown File Creation (Task 1)**
  - Generate prose content (H1 title + 2-3 sentences) based on implementation agent's choice of topic
  - Write file to test-znbtx9.md in repository root using pathlib with UTF-8 encoding
  - Validate file format, encoding, and content through TDD cycle

  **Phase 2: Git Integration (Tasks 2 & 3)**
  - Task 2: Stage file and create conventional commit (git add + git commit)
  - Task 3: Push commit to feature branch and validate success
  - Each task follows TDD: write failing test first (RED), implement minimal code (GREEN), refactor if needed

  **Total Estimated Effort:** 50 minutes
  - Task 1 (file creation & validation): 20m
  - Task 2 (git add & commit): 15m
  - Task 3 (git push & validation): 15m

  **Execution Flow:**
  1. Generate and write test-znbtx9.md (phase-1, task-1)
  2. Stage file with git add (phase-2, task-2)
  3. Create commit with conventional message (phase-2, task-2, same task)
  4. Push to feature branch (phase-2, task-3)
  5. Validate all success criteria met (phase-2, task-3)

  Tasks proceed sequentially: task-1 → task-2 → task-3 (each depends on the previous).

  ## Task Execution Notes

  ### Task 1: File Creation
  - Implementation agent has full creative freedom in choosing prose topic
  - File format is strict: `# Title\n\nSentence 1. Sentence 2. Sentence 3.`
  - UTF-8 encoding must be explicit in code: `pathlib.Path(...).write_text(..., encoding="utf-8")`
  - Test validates file exists, format is correct, encoding is UTF-8 without BOM
  - No validation of prose quality (that's test suite's job); focus on format compliance

  ### Task 2: Git Add & Commit
  - Uses subprocess.run() to invoke git CLI (standard approach in Sheep platform)
  - Commit message must be exact: "feat(136): Create markdown file test-znbtx9.md"
  - Both git add and git commit succeed or raise CalledProcessError (checked via check=True)
  - Test validates file is staged, commit message is correct, no other files involved
  - Should run task-1 to completion before starting task-2

  ### Task 3: Git Push
  - Pushes to current branch (feat/136-markdown-file-creation-66fca7) set by platform
  - Uses subprocess.run(['git', 'push'], check=True)
  - Validates commit reaches remote and working directory is clean post-push
  - Integration test confirms all success criteria: file created, formatted, committed, pushed
  - Should run task-2 to completion before starting task-3

  ## TDD Cycle Details

  Each task follows the TDD pattern:

  **RED Phase:** Write tests that fail because feature doesn't exist yet
  - Tests check preconditions (file doesn't exist, file not staged, etc.)
  - Tests check the operation happens (file created, file staged, commit made, push succeeds)
  - Tests check postconditions (file exists, committed, no other changes)

  **GREEN Phase:** Implement minimal code to make tests pass
  - Implement only what's needed; don't optimize or overengineer
  - Focus on happy path; exceptions are fine (caught by test suite)
  - Keep implementation straightforward and maintainable

  **REFACTOR Phase:** Clean up if needed
  - Extract helpers if logic is repeated
  - Improve naming for clarity
  - Remove duplication
  - Many tasks may skip this phase if implementation is already clean

  ## Dependencies

  - Task 2 depends on Task 1 (file must exist before staging)
  - Task 3 depends on Task 2 (commit must exist before pushing)
  - All tasks depend on Python 3.7+, git CLI in PATH
  - No external Python dependencies required (pathlib, subprocess are stdlib)

  ## Validation

  All success criteria are validated as acceptance criteria in each task. After all tasks complete:
  - ✓ File test-znbtx9.md exists in repository root with correct format and encoding
  - ✓ File is committed with conventional message on feature branch
  - ✓ Commit is pushed to remote
  - ✓ No other files modified or created
  - ✓ Git history and file state match expected results

  Post-implementation, the test suite performs additional validation (content coherence, git state verification, etc.), but that is outside the scope of implementation tasks.

