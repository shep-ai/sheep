content: |
  ## Problem Statement

  Create a single markdown file named test-znbtx9.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is test iteration 136 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks. The file must follow the established format used in features 125-135 and be properly committed to the feature branch.

  ## Success Criteria

  - [ ] File test-znbtx9.md exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (single `#` prefix) as the title
  - [ ] File contains 2-3 sentences of prose content separated from the heading by a blank line
  - [ ] File follows the established format: `# Title\n\nSentence 1. Sentence 2. Sentence 3.`
  - [ ] File is encoded in UTF-8 with no BOM (Byte Order Mark)
  - [ ] File has been staged with `git add test-znbtx9.md`
  - [ ] Git commit created with conventional commit message format: `feat(136): Create markdown file test-znbtx9.md`
  - [ ] Changes pushed to the feature branch feat/136-markdown-file-creation-66fca7
  - [ ] No other files have been modified or created (only test-znbtx9.md in git status)

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named exactly `test-znbtx9.md` in the repository root directory (same level as .git, .github, specs/, etc.)
  - **FR-2**: File must contain a single H1 markdown heading at the top, formatted as `# Title` (single hash, space, and descriptive title text)
  - **FR-3**: H1 heading must be separated from prose content by exactly one blank line
  - **FR-4**: File must contain 2-3 sentences of prose content after the blank line separator
  - **FR-5**: Prose content must be coherent and meaningful (not random text or placeholder strings)
  - **FR-6**: File must be created with UTF-8 character encoding without BOM (Byte Order Mark)
  - **FR-7**: File must be added to git staging area using `git add test-znbtx9.md` (or equivalent staging mechanism)
  - **FR-8**: A git commit must be created with message format: `feat(136): Create markdown file test-znbtx9.md` (conventional commit format)
  - **FR-9**: Commit must be pushed to the feature branch `feat/136-markdown-file-creation-66fca7`
  - **FR-10**: No files other than test-znbtx9.md may be created or modified during implementation

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow the established pattern from features 125-135 for consistency and predictability
  - **NFR-2**: File creation must not introduce any unexpected side effects (e.g., modifying .gitignore, creating hidden files, altering directory structure)
  - **NFR-3**: Implementation must complete within the S (small) size estimate scope (achievable in a few hours)
  - **NFR-4**: File format must be compatible with CommonMark markdown specification to ensure proper rendering across markdown renderers
  - **NFR-5**: Implementation must use only Python standard library (pathlib, built-in file I/O) - no external dependencies
  - **NFR-6**: Git operations must use standard git CLI commands or existing git abstraction in Sheep platform (no direct file system git operations)
  - **NFR-7**: Content generation should be deterministic enough to verify completion, but agent has creative freedom in topic choice
  - **NFR-8**: File must be properly tracked by git after push (no gitignore rules should exclude test-*.md files)

  ## Product Decisions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content topic choice | Any topic is acceptable | Features 125-135 use varied topics; validation is focused on file creation capability, not content quality |
  | 2 | File metadata/frontmatter | Plain markdown only (H1 + prose) | Maintains consistency with existing test-*.md files and established pattern |
  | 3 | Programmatic validation | Just create the file, no validation | Test suite handles validation post-implementation; keeps task focused on creation and git workflow |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | A new markdown file (test-znbtx9.md) will be created in the repository root, following the pattern of 135+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting and encoding |
  | Specification system | Low | The specs/ directory structure is only used for documentation; no code changes needed |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform and Python standard library:

  1. **File Creation** - Python's built-in `pathlib` and file I/O (already available)
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Standard git CLI commands or existing git support in Sheep platform
  4. **Content Generation** - Prose generation (consistent with existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-135, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 10+ times in preceding features (125-135)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing infrastructure (file I/O, git tools) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Based on git history, similar features (125-135) were completed in single commits with minimal complexity
