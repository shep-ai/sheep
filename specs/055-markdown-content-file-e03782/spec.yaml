content: |
  ## Problem Statement

  Create a single markdown file named `test-j3dwzh.md` at the repository root containing a markdown h1 title and 2-3 sentences describing any topic. This feature is part of the Sheep agentic platform test suite and continues an established pattern of lightweight markdown test files used to validate the system's ability to perform simple, well-defined implementation tasks.

  ## Success Criteria

  - [ ] File created at repository root with exact filename `test-j3dwzh.md`
  - [ ] File contains a valid markdown h1 heading (format: `# Title`)
  - [ ] File contains 2-3 sentences of prose describing a topic
  - [ ] Content is syntactically valid markdown
  - [ ] File uses UTF-8 text encoding
  - [ ] Changes committed to git with a conventional commit message (e.g., `feat(055): Create markdown test file`)
  - [ ] Changes pushed to feature branch `feat/055-markdown-content-file-e03782` on remote repository
  - [ ] No modifications made to existing files (purely additive feature)

  ## Functional Requirements

  - **FR-1**: The markdown file must be created with the exact filename `test-j3dwzh.md` (case-sensitive)
  - **FR-2**: File must be placed in the repository root directory (alongside existing test files following the `test-{code}.md` pattern)
  - **FR-3**: File must begin with a valid markdown h1 heading using `#` syntax (format: `# Title Here` with single space after hash)
  - **FR-4**: File must contain exactly 2-3 sentences of prose describing any topic chosen by the implementation
  - **FR-5**: Markdown content must be syntactically valid and render correctly in standard markdown parsers (CommonMark-compliant)
  - **FR-6**: File must have a newline at the end following Unix convention
  - **FR-7**: Changes must be committed to git with a conventional commit message following the project's commit message standard
  - **FR-8**: Committed changes must be pushed to the remote repository on the feature branch `feat/055-markdown-content-file-e03782`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 text encoding (standard for all repository markdown files)
  - **NFR-2**: Markdown formatting must adhere to the CommonMark specification for valid h1 headings and prose
  - **NFR-3**: File should follow the established format convention used in related features (#050-054): single h1 heading followed by 2-3 sentences of prose with no additional sections, lists, code blocks, or complex formatting
  - **NFR-4**: Implementation should complete within the S (Small) size estimate of approximately 20-30 minutes total effort
  - **NFR-5**: No breaking changes to existing codebase; feature is purely additive with no impacts to src/, tests/, or configuration directories
  - **NFR-6**: Topic selection is unconstrained—any subject matter is acceptable and encouraged (examples: technical, creative, educational, humorous, etc.)

  ## Product Questions & Decisions

  This feature has no ambiguous product decisions. All requirements are fully specified:
  - **Filename**: `test-j3dwzh.md` (specified by user query)
  - **Location**: repository root (established pattern from features #050-054)
  - **Format**: h1 heading + 2-3 prose sentences (established pattern)
  - **Topic**: unrestricted ("anything" per user query)
  - **Commit workflow**: conventional commits + push to feature branch (project standard)

  Topic selection is deliberately left flexible to allow implementation autonomy while maintaining consistent structure and format.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. The repository root contains:
  - **Markdown test files**: 40+ files following the `test-{randomCode}.md` naming pattern (test-sf7prc.md, test-cxrhpd.md, test-u6624u.md, test-9nkcx2.md, test-em3o13.md, test-gkrlxj.md, test-gt1tgb.md, and many others)
  - **Topic-specific markdown files**: Educational and technical content files (ELEVATOR_STATE_MACHINE.md, RANDOM_DESIGN_PATTERN.md, DESIGN_PATTERN.md, ABOUT_ME.md, CLASSIC_JOKE.md, SHEEP.md, etc.)
  - **Specs directory**: Contains 55 numbered feature specifications, each in its own subdirectory with spec.yaml and related documentation
  - **Source code**: `src/sheep/` directory with Python implementation for CrewAI-based agentic platform
  - **Tests directory**: `tests/` with Python test files
  - **Configuration**: Standard files (README.md, .github/, Dockerfile, docker-compose.yml, pyproject.toml, .env.example, .gitignore, etc.)

  ### Architecture Patterns

  The repository follows a feature-driven development pattern with clear conventions:
  - Each feature has a numbered specification in `specs/{number}-{name}/spec.yaml`
  - Specifications track phases (Analysis, Requirements, Implementation, Review)
  - Markdown test files serve as simple, standalone validation tasks for the agentic system
  - Test markdown files follow a consistent format: single h1 title followed by 2-3 sentences of prose
  - Topics across test files are diverse and free-form (Cloud Computing, Acoustic Engineering, Black Holes, Embossing, Fermentation Science, Folklore Studies, Knot Theory, Lighthouse History, Kiln Construction, Nautical Knots, Salt Mining, Ultraviolet Light, Urban Beekeeping, Volcanic Eruptions, Weather Forecasting, Wind Tunnel Testing, and more)
  - Each file is independently created and committed with conventional commit messages (e.g., `feat(055): Create markdown test file`)
  - No dependencies between markdown test files—each is a completely standalone task
  - Features #050-054 provide strong precedent and validation of this simple pattern

  ### Relevant Technologies

  - **Markdown**: All test files use standard markdown syntax with h1 headings (`# Title`) and plain text prose
  - **Git**: Version control system for branching (`feat/055-markdown-content-file-e03782`), committing with conventional messages, and pushing to remote
  - **UTF-8**: Standard text encoding for all markdown files in the repository
  - **CommonMark**: Markdown specification standard for rendering validation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New markdown file will be created at root level, following the established `test-{code}.md` naming pattern alongside 40+ existing test files |
  | Specs directory | None | Feature specification already exists; analysis phase only updates this spec.yaml file |
  | Source code (`src/sheep/`) | None | No Python code, platform logic, or module changes affected |
  | Tests (`tests/`) | None | No test files created, modified, or deleted; this is a content-only feature |
  | CI/CD (`.github/`) | None | No workflow or automation changes required; standard git workflow applies |
  | Build system (`pyproject.toml`) | None | No dependencies, configuration, or build settings modified |

  ## Dependencies

  None identified. This feature has no dependencies on:
  - Existing Python code or libraries
  - Infrastructure or configuration changes
  - External APIs or services
  - Build system integration
  - Test framework coordination
  - Other features

  This is a completely standalone task of creating a single static markdown file and committing it to git.

  ## Size Estimate

  **S** — Small. This is a minimal-effort, single-file creation feature with straightforward requirements, following the identical pattern of recently completed features #050, #051, #052, #053, and #054:

  Implementation breakdown:
  - Topic selection and planning: ~5 minutes
  - Writing markdown file with h1 title and 2-3 sentences of prose: ~10 minutes
  - Git commit and push operations: ~5 minutes
  - **Total estimated effort**: ~20 minutes (well within the 30-minute threshold for S tier)

  Justification:
  - Established pattern with five recent, identical precedents (features #050-054) providing clear implementation guidance
  - Flexible topic selection with no research, architectural decisions, or complex reasoning required
  - Single file creation with minimal, well-understood content format (one h1 heading + prose)
  - No testing framework integration, CI/CD changes, documentation updates, or code analysis required
  - No modifications to existing files—purely additive change
  - High confidence in pattern due to five recent identical implementations

