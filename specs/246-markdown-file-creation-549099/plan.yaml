content: |
  ## Architecture Overview

  This feature follows the established pattern from features 069-245, which have already
  created 240+ similar test markdown files. The implementation leverages existing
  infrastructure to avoid code duplication:

  **Existing Functions (sheep.content_generators):**
  - `generate_markdown_content()` — Uses CrewAI LLM to generate contextually-appropriate
    prose meeting the 2-3 sentence requirement with H1 heading
  - `write_markdown_file(filename, content)` — Writes to disk using pathlib.Path.write_text()
    with UTF-8 encoding (no BOM)
  - `validate_markdown_file()` — Comprehensive validation: H1 heading presence, prose count,
    UTF-8 encoding, LF line endings, file size range

  **Existing Tools (sheep.tools.git_tools):**
  - `GitCommitTool` — Wraps subprocess git commit with proper error handling and logging
  - `GitPushTool` — Wraps subprocess git push with upstream tracking (set_upstream=True)

  These functions are already proven across 170+ implementations and provide all required
  functionality. No new code should be added to the codebase — only file creation.

  ## Key Design Decisions

  ### 1. Reuse Existing Functions (Not Reimplementation)

  **Decision:** Use `generate_markdown_content()`, `write_markdown_file()`,
  `validate_markdown_file()`, `commit_markdown_file()`, and `push_markdown_file()`
  from sheep.content_generators module.

  **Why:** These functions are proven across 170+ prior implementations. Reimplementing
  would duplicate code, add maintenance burden, and risk introducing bugs. Consistency
  with the established pattern (features 069-245) is more important than local optimization.

  **Alternative Considered:** Custom implementation with direct subprocess/pathlib calls.
  Rejected because it would ignore the abstraction layer already in place.

  ### 2. Content Generation via LLM (Not Hard-Coded)

  **Decision:** Use `generate_markdown_content()` which leverages CrewAI LLM framework.

  **Why:** Ensures diverse, contextually-appropriate prose across 240+ test files.
  CrewAI is already a project dependency. LLM framework validates output format
  (H1 heading, 2-3 sentences) before returning.

  **Alternative Considered:** Hard-coded prose content. Rejected because it violates
  the established pattern from features 069-245 where all implementations use the LLM.

  ### 3. Sequential Phases (Content → Validation → Git)

  **Decision:** Three ordered phases: (1) generate and write content, (2) validate,
  (3) git operations.

  **Why:** Validation must complete successfully before pushing to git. File creation
  and validation are prerequisites for git operations. This ordering ensures correctness
  and clear error detection at each stage.

  ### 4. File Encoding (UTF-8 without BOM)

  **Decision:** Use pathlib.Path.write_text('utf-8') and validate with
  validate_markdown_file().

  **Why:** Python 3.11+ defaults to LF line endings on all platforms (including Windows).
  The validation function explicitly checks for CRLF and BOM, providing defense in depth.
  This matches the established pattern where all 240+ test files use LF + UTF-8 (no BOM).

  ## Implementation Strategy

  1. **Phase 1 (Content & File Creation):**
     - Call `generate_markdown_content(feature_number=246, filename='test-dgxq7g.md')`
       to create prose content with proper structure (H1 + 2-3 sentences)
     - Call `write_markdown_file('test-dgxq7g.md', content)` to persist to disk
     - Verify file exists in repository root directory

  2. **Phase 2 (Validation):**
     - Call `validate_markdown_file(filepath)` to check all requirements
     - Exit early if validation fails (don't proceed to phase 3)

  3. **Phase 3 (Git Integration):**
     - Stage file: `git add test-dgxq7g.md`
     - Commit: `git commit -m "feat(246): create markdown file test-dgxq7g.md with prose content"`
     - Push to origin with upstream tracking

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | "Content generation fails (LLM API unavailable)" | "Phase 1 blocks phase 2/3" | "Retry logic already in generate_markdown_content(); validate API connectivity before starting" |
  | "File write fails (permission error on repo root)" | "Phase 1 blocks phase 2/3" | "Verify write permissions before starting; check disk space" |
  | "Validation fails (unexpected format/encoding)" | "Phase 2 blocks phase 3" | "Use existing validate_markdown_file() to detect issues early; review LLM output format" |
  | "Git commit fails (git not configured)" | "Phase 3 blocks final state" | "Verify git user.name and user.email are configured; test git commands before starting" |
  | "Git push fails (network issue, branch doesn't exist)" | "Phase 3 fails, feature incomplete" | "Verify feature branch exists (feat/246-markdown-file-creation-549099); test git push connectivity" |
  | "File already exists (overwrite risk)" | "Data loss potential" | "Check if file exists before writing; ask for confirmation or use unique naming if needed" |
