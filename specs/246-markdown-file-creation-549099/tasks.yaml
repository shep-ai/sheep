content: |
  ## Task Summary

  Six concrete tasks implement the feature across three phases:

  **Phase 1: Content Generation & File Creation (Tasks 1-2)**

  Task 1 generates markdown content with LLM using existing generate_markdown_content()
  function. Task 2 writes the content to test-dgxq7g.md in the repository root using
  existing write_markdown_file() function. Both tasks follow TDD pattern (RED: write
  assertions about expected state, GREEN: call existing functions that satisfy those
  assertions, REFACTOR: ensure error handling and logging).

  **Phase 2: Validation (Task 3)**

  Task 3 validates the created file using existing validate_markdown_file() function.
  This validation is critical — it confirms the file meets all structural (H1 + prose
  count), encoding (UTF-8 without BOM), and line ending (LF) requirements before
  proceeding to git operations. If validation fails, tasks 4-6 should not execute.

  **Phase 3: Git Integration (Tasks 4-6)**

  Task 4 stages the file with `git add`. Task 5 commits with the exact conventional
  message. Task 6 pushes to the feature branch with upstream tracking. These tasks
  follow the established pattern from features 069-245 and use existing wrapper tools
  (GitCommitTool, GitPushTool) for consistent error handling and logging.

  ## Implementation Notes

  - All tasks reuse existing functions from sheep.content_generators and sheep.tools.git_tools
  - No new source code should be added to /src/sheep/
  - Only test-dgxq7g.md should be created in the repository
  - TDD cycles are implemented but may be lightweight for file I/O tasks
  - Total estimated effort: 30 minutes (10 min content gen, 5 min file write, 5 min validation, 10 min git)
  - Each task should validate using existing, proven functions rather than custom logic
