# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows a minimal, proven pattern from 100+ identical test file creation features (069-277). The implementation
  consists of two independent but sequentially-dependent phases:

  ### Phase 1: File Creation
  - **Approach**: Single Python script creates markdown file using pathlib.Path.write_text()
  - **Content**: H1 heading (descriptive, content-relevant) + blank line + 2-3 sentences of prose (any topic)
  - **Encoding**: UTF-8 without BOM, achieved via encoding='utf-8' parameter to pathlib.Path.write_text()
  - **Line Endings**: Unix LF, ensured by writing explicit '\\n' characters (Python 3 default behavior)
  - **Location**: Repository root directory (test-b2fl92.md)
  - **Verification**: Check file exists, has correct structure, proper encoding, and expected size (approximately 400-500 bytes)

  ### Phase 2: Git Integration
  - **Approach**: Subprocess calls to git CLI (add, commit, push)
  - **Operations**:
    - `git add test-b2fl92.md` — stage file for commit
    - `git commit -m \"feat(278): create markdown file test-b2fl92.md with title and prose content\"` — create conventional commit
    - `git push -u origin HEAD` — push to feature branch feat/278-markdown-file-creation-c4a504
  - **Error Handling**: Capture subprocess return codes; report success or failure with clear error messages
  - **Verification**: Check git log shows correct commit message, file is tracked in git, push succeeds

  ### Integration with Existing Codebase
  - **Repository Structure**: Feature adds test-b2fl92.md to repository root, alongside 100+ existing test-*.md files
  - **No Code Changes**: Feature does not modify /src/sheep/, /tests/, configuration files, or any source code
  - **Git Workflow**: Standard feature branch + PR workflow (feat/278-markdown-file-creation-c4a504 → main)
  - **Pattern Consistency**: Implementation mirrors approach used in features 069-277 — identical structure, file I/O, git workflow
  - **Dependencies**: Only Python standard library (pathlib, subprocess) and git CLI; no external pip packages

  ## Key Design Decisions

  ### Decision 1: File I/O Using pathlib.Path.write_text()
  **Chosen**: pathlib.Path().write_text(encoding='utf-8')

  **Rationale**:
  - All 100+ existing test files (features 069-277) use pathlib.Path.write_text()
  - Correctly handles UTF-8 encoding without BOM (via encoding='utf-8' parameter)
  - Automatically handles Unix LF line endings (Python 3 default when writing '\\n')
  - Cross-platform compatible (Windows/Linux/macOS)
  - Part of Python standard library (satisfies NFR-3: no external dependencies)
  - Concise, readable syntax; automatic file closing prevents resource leaks

  **Implementation**: Use `Path('test-b2fl92.md').write_text(content, encoding='utf-8')` where content includes H1 heading, blank line, and prose.

  ---

  ### Decision 2: Git Operations via subprocess.run()
  **Chosen**: Standard git CLI commands executed via Python subprocess.run()

  **Rationale**:
  - All 100+ test file features use standard git CLI (no library wrappers)
  - Git CLI is available in all development environments
  - No external library dependency (satisfies NFR-3)
  - Commands are transparent: 'git add', 'git commit -m \"...\"', 'git push -u origin HEAD'
  - Error handling is straightforward: check subprocess return codes and capture stderr
  - Conventional commit message format enforced by commit message content, not code

  **Implementation**: Use `subprocess.run(['git', 'add', 'test-b2fl92.md'], check=False, capture_output=True)` and similar for commit/push, with error checking.

  ---

  ### Decision 3: Manual Content Creation (Not Automated)
  **Chosen**: Implementer writes original 2-3 sentences on any topic (complete creative freedom)

  **Rationale**:
  - Product decision question #1 resolved to \"any topic - complete creative freedom\" (spec.yaml)
  - 100+ existing test files demonstrate diverse, original prose works well
  - Product decision question #2 recommends \"descriptive and content-relevant headings\"
  - Original prose is simple (5 minutes), demonstrates implementer understanding
  - Prose should relate to H1 heading (e.g., if heading is \"The Ocean\", prose discusses oceans)

  **Implementation**: Implementer manually writes H1 heading + 2-3 complete sentences. Topic is completely open (any subject acceptable). Prose should be substantive (complete thoughts, not fragments).

  ---

  ### Decision 4: Encoding and Line Ending Handling
  **Chosen**: pathlib.Path.write_text(encoding='utf-8') with explicit '\\n' newline characters

  **Rationale**:
  - pathlib.Path.write_text(encoding='utf-8') automatically writes UTF-8 without BOM (FR-5)
  - Python 3 treats '\\n' characters as Unix LF when encoding='utf-8' specified (FR-6)
  - No manual newline conversion needed; cross-platform compatible
  - Matches behavior in all 100+ existing test files

  **Implementation**: Write prose string with explicit '\\n' characters (e.g., `\"# Title\\n\\nSentence 1. Sentence 2. Sentence 3.\\n\"`).

  ---

  ### Decision 5: Error Handling Strategy
  **Chosen**: Basic error checking with return code inspection and human-readable error messages

  **Rationale**:
  - Operations are straightforward (file write, three git commands)
  - Failures have clear root causes (file exists, git unconfigured, branch missing, etc.)
  - Simple checks sufficient: verify file doesn't exist before creation, capture subprocess return codes
  - If file exists or git operations fail, report which step failed and exit code; no automatic recovery needed

  **Implementation**: Check that test-b2fl92.md doesn't already exist; capture return codes from git add/commit/push and report if non-zero; provide clear error messages.

  ## Implementation Strategy

  **Overall Approach**: Create single Python script that:
  1. Imports pathlib.Path and subprocess
  2. Defines prose content string (H1 heading + blank line + 2-3 sentences)
  3. Creates file using Path('test-b2fl92.md').write_text(content, encoding='utf-8')
  4. Stages file with subprocess.run(['git', 'add', 'test-b2fl92.md'])
  5. Commits with conventional message: subprocess.run(['git', 'commit', '-m', '...'])
  6. Pushes to feature branch: subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'])
  7. Verifies file exists and git operations succeeded; reports results

  **Phase Ordering Rationale**:
  - Phase 1 (File Creation) comes first because the file must exist before it can be added to git
  - Phase 2 (Git Workflow) depends on Phase 1 and stages/commits/pushes the created file
  - Sequential dependency is strict: cannot git add a non-existent file; cannot commit before adding

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File test-b2fl92.md already exists in repository | Very Low | High — prevents file creation | Check file doesn't exist before creation; fail with clear error message if it does |
  | Invalid UTF-8 encoding or CRLF line endings | Very Low | Medium — violates success criteria | Use pathlib.Path.write_text(encoding='utf-8'); Python 3 handles '\\n' as LF correctly |
  | Git add/commit/push fails (network, config, permissions) | Low | High — prevents completion | Capture subprocess return codes and stderr; report which git command failed; suggest troubleshooting steps |
  | Prose contains fewer than 2 or more than 3 sentences | Medium | High — violates FR-3 | Implementer manually counts sentences while writing; verification step checks sentence count |
  | File size unexpectedly small/large | Low | Low — indicates possible content issue | Use 'wc -c' or 'ls -la' to verify file size is approximately 400-500 bytes; if significantly different, review prose length |
  | Feature branch feat/278-markdown-file-creation-c4a504 doesn't exist | Very Low | High — git push fails | Branch is pre-created for worktree; verify branch exists via 'git branch -a' before pushing |
  | H1 heading not relevant to prose content | Low | Low — quality issue, not functional problem | Implementer chooses heading that relates to prose topic; product decision #2 recommends descriptive headings |

  All risks are low-likelihood; mitigation strategies are straightforward and don't require architectural changes.
