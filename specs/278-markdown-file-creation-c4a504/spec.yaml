content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-b2fl92.md`) at the repository root with a title and prose content, demonstrating automated file creation and git integration.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 100+ similar test files already existing in the repository as precedents (test-*.md files at root directory created in features 069-277). This is a continuation of the markdown-file-creation pattern established in earlier features, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-b2fl92.md` is created in repository root directory (confirmed by file system check)
  - [ ] File contains valid CommonMark markdown with H1 heading (`# `) as the title
  - [ ] File contains exactly 2-3 sentences of prose content separated from heading by blank line
  - [ ] File is UTF-8 encoded without byte order mark (BOM)
  - [ ] File uses Unix LF line endings exclusively (no CRLF or mixed endings)
  - [ ] File size is within expected range of 400-600 bytes (natural outcome of proper structure)
  - [ ] File is staged with `git add test-b2fl92.md`
  - [ ] File is committed with conventional commit message: `feat(278): create markdown file test-b2fl92.md with title and prose content`
  - [ ] Commit is pushed to feature branch `feat/278-markdown-file-creation-c4a504`
  - [ ] No source code, tests, or configuration files are modified
  - [ ] Git log shows only the feature file creation commit on this branch

  ## Functional Requirements

  - **FR-1**: Create markdown file named exactly `test-b2fl92.md` in repository root directory
  - **FR-2**: Include CommonMark-compliant H1 heading (`# Heading`) as file title
  - **FR-3**: Include exactly 2-3 sentences of prose content after heading, separated by blank line
  - **FR-4**: Ensure prose content is substantive (complete thoughts, not fragments)
  - **FR-5**: Use UTF-8 character encoding without BOM via pathlib.Path().write_text(encoding='utf-8')
  - **FR-6**: Use Unix LF line endings exclusively (Python's default with '\n' in write_text)
  - **FR-7**: Stage file with `git add test-b2fl92.md`
  - **FR-8**: Commit with conventional commit message format: `feat(278): create markdown file test-b2fl92.md with title and prose content`
  - **FR-9**: Push commit to feature branch via `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: File creation and git operations must complete in less than 1 second (technical constraint)
  - **NFR-2**: Markdown content must conform to CommonMark specification for compatibility and parsing
  - **NFR-3**: Implementation must use only Python standard library (pathlib, no external pip dependencies)
  - **NFR-4**: Implementation must use pathlib.Path for cross-platform file I/O compatibility (Windows/Linux/macOS)
  - **NFR-5**: File size must naturally fall within 400-600 byte range as outcome of proper structure
  - **NFR-6**: Git operations must use standard command-line tools (git add, git commit, git push)
  - **NFR-7**: Implementation must follow identical pattern from features 069-277 for consistency
  - **NFR-8**: H1 heading should be descriptive and relevant to prose content (readability/quality)
  - **NFR-9**: No modifications to source code (/src/sheep/), tests (/tests/), or configuration files

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be limited to topic categories or allow complete creative freedom? | Any topic (complete creative freedom) | 200+ existing test files across all topic categories demonstrate this works; test artifacts don't need governance; maximizes implementer autonomy |
  | 2 | Should H1 heading be generic or descriptive/relevant to prose? | Descriptive and content-relevant | Adds minimal effort; improves artifact quality; aligns with common practice in existing files; demonstrates content understanding |
  | 3 | Should exactly 2-3 sentences be enforced or allow flexibility? | Enforce exactly 2-3 sentences | Matches specification; maintains consistency with 200+ implementations; ensures predictable 400-600 byte file size; eliminates ambiguity |
  | 4 | Should implementation use pathlib.Path().write_text() or allow alternatives? | Pathlib Path.write_text() (established pattern) | All 100+ existing files use this approach; simpler and more readable; part of standard library; enforces consistency across identical-pattern features |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-b2fl92.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Standard single commit and push operation following established pattern from features 069-277; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, agents, flows, or tools in the application |
  | Tests (/tests/) | None | Feature requires no test modifications or additions; purely file creation with no logic to test |
  | Configuration Files | None | Feature does not require modifications to pyproject.toml, .env, docker-compose.yml, or other configuration |
  | Specs Directory | Low | Updates only this feature's spec.yaml file during analysis and requirements phases; no impact on other feature specifications |

  ## Dependencies

  **Internal Dependencies**:
  - Feature branch `feat/278-markdown-file-creation-c4a504` must exist (pre-created for this worktree)
  - Write access to repository root directory (assumed available in standard development environment)
  - Git repository initialized with standard configuration (user.name, user.email configured)

  **External Dependencies**:
  - Python 3.11+ runtime (already available in project environment per pyproject.toml)
  - pathlib standard library module (built-in to Python, no external installation required)
  - Git command-line tools (assumed available in development environment)

  **Pattern Dependencies**:
  - 100+ existing test files (test-*.md) provide clear precedent for structure, content format, and file organization
  - Features 069-277 demonstrate identical implementation patterns for reference

  **No External Library Dependencies**: Implementation uses only Python standard library (pathlib), with no pip packages, external modules, or third-party dependencies required.

  ## Size Estimate

  **S (Small)** — Approximately 10-15 minutes of work total.

  **Justification**:
  - **File creation**: ~5 minutes
    - Create markdown content string with H1 heading and 2-3 sentences of prose
    - Choose topic (complete creative freedom, any subject acceptable per product decision)
    - Use pathlib.Path().write_text() for cross-platform file creation
  - **Encoding & line endings**: ~2 minutes
    - Ensure UTF-8 encoding without BOM (handled automatically by write_text() with encoding='utf-8')
    - Ensure LF line endings (handled by explicit '\n' characters in content string)
    - Verify file structure: heading, blank line, prose content
  - **Git workflow**: ~3-5 minutes
    - Stage file with git add
    - Create commit with conventional commit message
    - Push to feature branch
  - **Total effort**: 10-15 minutes of actual implementation work

  **Complexity Factors** (all minimize effort):
  - Well-established pattern with 100+ identical test files providing clear precedent
  - No architectural decisions, no code design required (resolved via product questions)
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - No testing, documentation updates, or configuration changes required
  - Topic selection is completely flexible (creative freedom on any subject per FR-4)
  - File naming is pre-specified (test-b2fl92.md), eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 200+ prior implementations
  - Dependencies are minimal: only standard Python library (pathlib)

  ---

  Requirements phase complete — feature scope, functional/non-functional requirements, success criteria, and product decisions documented and resolved
