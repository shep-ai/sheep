content: |
  ## Summary

  Feature 208 implementation is broken into 10 concrete tasks across 5 phases, following a dependency-driven
  approach that ensures earlier phases provide foundation for later phases.

  **Phase 1 (Foundation)** establishes module structure, constants, logger, and helper functions
  (extract_prose_content, count_sentences). These are prerequisites for all other work.

  **Phase 2 (Content Generation)** implements generate_content() that calls Claude API with temperature=0
  to produce deterministic markdown output. Single API call generates both title and prose in correct format.

  **Phase 3 (File Operations & Validation)** creates the markdown file and implements comprehensive modular
  validators (file exists, markdown format, sentence count, encoding, line endings, file size). Each validator
  has single responsibility; orchestrator runs all in sequence with fail-fast behavior.

  **Phase 4 (Git Integration)** implements three git operation functions (add, commit, push) using subprocess.run()
  with proper error handling. These operate on the file created in Phase 3.

  **Phase 5 (Orchestration)** implements main() function that coordinates all phases (create -> validate -> git ops),
  adds module if __name__ == __main__ entry point, and verifies end-to-end functionality through integration test.

  All tasks follow TDD approach (RED-GREEN-REFACTOR cycles), maintain consistency with feature 207 pattern
  (NFR-5 requirement), include comprehensive logging for observability (NFR-10 requirement), and implement
  fail-fast error handling with clear error messages (NFR-9 requirement).

  Total estimated effort: 3.5 hours including all coding, testing, validation, and integration verification.
