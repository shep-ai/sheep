# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a simple markdown test file following the established pattern from 100+
  existing test files in the repository root (test-*.md files). The implementation is completely
  isolated from application source code (/src/sheep/) and has no interaction with CrewAI,
  agents, flows, tools, or application logic.

  The implementation uses two standard library modules:
  - **pathlib**: Modern, cross-platform file I/O with Path.write_text() method (required by FR-4)
  - **subprocess**: Standard library approach for executing git commands without external dependencies

  This approach maintains the minimalism requirement (NFR-6: no external dependencies) while
  providing reliable file creation and git workflow automation.

  ## Key Design Decisions

  ### 1. File I/O via pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text() with explicit encoding and newline parameters

  **Alternatives rejected:**
  - Built-in open() function: More verbose, less modern for Python 3.11+
  - os.write(): Low-level API, less convenient, not cross-platform friendly
  - Third-party libraries: Unnecessary overhead, violates minimalism (NFR-6)

  **Rationale:** Specification explicitly mandates pathlib (FR-4). Explicit parameters ensure
  correct encoding ('utf-8') and line endings (newline='\\n') across all platforms (Windows, macOS,
  Linux). This is the modern, Pythonic approach for Python 3.11+.

  ### 2. Hardcoded Prose Content

  **Chosen:** Hardcode natural prose directly in implementation code

  **Alternatives rejected:**
  - Dynamic prose generation (templates, faker, GPT): Adds complexity, external dependencies
  - External template file: Configuration overhead not present in 100+ existing files
  - Generated prose: Lower quality than carefully written natural content

  **Rationale:** All 100+ existing test files use hardcoded prose with diverse topics (nature,
  technology, science, history, culture, philosophy). Specification permits \"complete creative
  freedom\" on topic selection. Hardcoding is fastest (~2-3 minutes), produces highest quality
  output, avoids external dependencies, and matches established pattern from features 069-276.

  ### 3. Explicit UTF-8 Encoding & LF Line Endings

  **Chosen:** Use encoding='utf-8' and newline='\\n' parameters in Path.write_text()

  **Alternatives rejected:**
  - System default encoding: Not portable, may be Latin-1 or ASCII on some systems
  - CRLF line endings: Windows default, violates NFR-2 requirement for LF-only
  - Post-processing conversion: Error-prone, requires extra string manipulation

  **Rationale:** Explicit parameters ensure NFR-1 (UTF-8 without BOM) and NFR-2 (LF line endings)
  are met on all platforms. The 'utf-8' encoding (not 'utf-8-sig') ensures no BOM is written.

  ### 4. Git Operations via subprocess

  **Chosen:** Use Python subprocess module to execute git commands (git add, commit, push)

  **Alternatives rejected:**
  - GitPython library: Adds abstraction layer, requires API learning
  - os.system(): Deprecated approach, less flexible
  - Manual operations: Would violate automation requirements (FR-5, FR-6, FR-7)

  **Rationale:** subprocess is the standard library approach in Python 3.11+ for executing
  external commands. Git commands needed (add, commit, push) are straightforward, making
  subprocess simpler and more direct than GitPython.

  ### 5. No Runtime Markdown Validation

  **Chosen:** Format guaranteed by code construction; no markdown validation library

  **Alternatives rejected:**
  - python-markdown library: Unnecessary overhead, adds dependencies
  - Custom validator: Overengineering, contradicts minimalism (NFR-6)
  - Regex validation: Premature optimization for format that cannot fail if code is correct

  **Rationale:** File format is extremely simple and fixed by code: one H1 heading, blank line,
  2-3 sentences, trailing newline. Format is guaranteed correct by code construction, not
  runtime validation.

  ## Implementation Strategy

  The implementation follows a logical two-phase approach:

  **Phase 1 (File Creation & Validation):** Create the markdown file using pathlib with correct
  structure, encoding, and line endings. Write prose content string following established pattern
  from 100+ existing files: H1 heading + blank line + 2-3 sentences of natural prose. Verify file
  properties match all requirements: UTF-8 encoding without BOM, LF line endings, CommonMark syntax
  compliance, and file size 400-600 bytes.

  **Phase 2 (Git Workflow & Remote Integration):** Implement git operations using subprocess:
  stage file, create commit with conventional message format, and push to remote feature branch.
  Verify all operations succeed and remote branch is updated.

  **Phase ordering rationale:** File must exist before git operations can work. No parallel
  execution is beneficial; this is a simple sequential workflow. Both phases must complete in order.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Git not installed or misconfigured | Low | Blocking | Assume standard CI environment has git; subprocess will surface errors |
  | Insufficient disk space | Very Low | Blocking | File is only 400-600 bytes; assume adequate space in build environment |
  | File encoding issues on Windows | Low | Non-blocking | Explicit encoding='utf-8' parameter ensures portability across platforms |
  | Git credentials/SSH key issues | Low | Blocking | Assume pre-configured git with proper credentials; feature branch pre-created |
  | Concurrent file access race condition | Very Low | Non-blocking | Feature branch is isolated; no concurrent writes expected |
  | Invalid markdown syntax from typo | Very Low | Non-blocking | Format guaranteed by code; prose manually written and reviewed |
  | Line ending conversion by git | Low | Non-blocking | Explicitly write LF; git autocrlf won't affect already-written file |
