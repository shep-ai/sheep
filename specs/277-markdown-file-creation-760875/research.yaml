decisions:
  - title: "File I/O Technology"
    chosen: "Python pathlib.Path with write_text() method"
    rejected:
      - "Built-in open() function — less modern, more verbose, pathlib is preferred in Python 3.11+"
      - "os.write() — low-level API, less convenient, not cross-platform friendly"
      - "Third-party I/O libraries — unnecessary overhead, pathlib is sufficient"
    rationale: >
      Specification explicitly requires pathlib (FR-4: \"Implementation must use Python's pathlib
      library\"). pathlib is the modern standard library approach for file operations in Python 3.11+,
      providing cross-platform compatibility and cleaner API. Already used consistently in the project.

  - title: "Content Generation Approach"
    chosen: "Hardcode prose content directly in Python code"
    rejected:
      - "Generate prose dynamically using templates — unnecessary complexity, natural prose is better"
      - "Use prose generation library (e.g., faker, GPT) — adds external dependency, violates minimalism requirement (NFR-6)"
      - "Read prose from external template file — adds configuration management overhead not present in existing 100+ files"
    rationale: >
      All 100+ existing test files use hardcoded, natural prose content with diverse topics. Spec
      permits complete creative freedom on topic selection. Hardcoding is simplest approach, fastest
      to implement (10-15 min estimate), and produces highest quality output. Avoids external
      dependencies and matches established pattern.

  - title: "Line Ending Guarantee Strategy"
    chosen: "Explicitly specify newline='\\n' in pathlib.Path.write_text() call"
    rejected:
      - "Rely on system default line endings — risks CRLF on Windows, violates NFR-2 (LF required)"
      - "Convert line endings after writing using string replace — error-prone, less reliable"
      - "Use open() with newline parameter instead of write_text() — more verbose, less clear intent"
    rationale: >
      pathlib.Path.write_text() accepts newline parameter. Explicitly passing newline='\\n' ensures
      LF line endings on all platforms (Windows, macOS, Linux). This is the most reliable and
      Pythonic approach. Verified against existing test files which all use LF endings.

  - title: "Encoding Specification Method"
    chosen: "Explicitly specify encoding='utf-8' in pathlib.Path.write_text()"
    rejected:
      - "Rely on system default encoding — may be Latin-1 on some systems, violates NFR-1 guarantee"
      - "Use encoding='utf-8-sig' to write BOM, then remove it — unnecessarily complex"
      - "Assume UTF-8 is default without explicit specification — fragile assumption"
    rationale: >
      Specification requires UTF-8 encoding without BOM (NFR-1). Explicitly passing encoding='utf-8'
      to write_text() ensures correct encoding on all systems. No BOM is written by default with
      'utf-8' encoding (unlike 'utf-8-sig'). This approach is the most explicit and reliable.

  - title: "Git Workflow Implementation"
    chosen: "Use Python subprocess module to execute git commands (git add, git commit, git push)"
    rejected:
      - "Use GitPython library — adds abstraction layer, requires understanding of GitPython API, slightly heavier"
      - "Use os.system() to execute git commands — deprecated approach, less flexible, harder to capture output"
      - "Assume manual git operations — violates FR-5, FR-6, FR-7 requirements"
    rationale: >
      subprocess is the standard library approach for executing external commands in Python 3.11+.
      While GitPython is available in pyproject.toml, subprocess is simpler, more direct, and
      requires no additional API learning. Git commands are straightforward (git add, commit, push),
      making subprocess the better fit. Matches simplicity principle and minimalism requirement.

  - title: "Markdown Validation Approach"
    chosen: "No runtime markdown validation — rely on fixed, simple format"
    rejected:
      - "Use python-markdown library to validate syntax — unnecessary overhead, format is fixed and trivial"
      - "Implement custom markdown validator — overengineering, contradicts specification minimalism"
      - "Use regex validation of heading and prose structure — premature optimization"
    rationale: >
      File format is extremely simple and fixed: one H1 heading, blank line, 2-3 sentences.
      This format is guaranteed by code construction, not runtime validation. Adding validation
      library increases dependencies, violates NFR-6 (dependency minimalism), and slows execution.
      Format is guaranteed correct by careful prose writing and newline placement.

