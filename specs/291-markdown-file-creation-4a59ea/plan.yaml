content: |
  ## Architecture Overview

  Feature 291 is a minimal orchestration layer over proven utilities. All core functionality exists:

  | Responsibility | Existing Utility | Location |
  | -------------- | --------------- | -------- |
  | Generate H1 heading + 2-3 sentences | `generate_markdown_content()` | src/sheep/content_generators.py |
  | Write file with UTF-8 + LF line endings | `write_markdown_file()` | src/sheep/content_generators.py |
  | Validate structure (H1, sentences, encoding) | `validate_markdown_file()` | src/sheep/content_generators.py |
  | Stage + commit with conventional message | `commit_markdown_file()` | src/sheep/content_generators.py |
  | Push to feature branch with upstream | `push_markdown_file()` | src/sheep/content_generators.py |

  The feature module creates a single function `create_test_sv8lfo_markdown_file(repo_path=None)` that:
  1. Determines repo root (default: current working directory)
  2. Calls utilities in sequence: generate → write → validate → commit → push
  3. Returns success indicator or raises exception on failure
  4. Emits structured logs at each checkpoint

  ### Integration Points

  - **Module Location:** `src/sheep/features/feature_291_markdown_file_creation.py` (mirrors pattern from features 288-290)
  - **Function Export:** `create_test_sv8lfo_markdown_file(repo_path=None)` — callable by agents, CLI, tests, direct execution
  - **LLM Factory:** Uses `sheep.config.llm.get_reasoning_llm()` for Claude API access (no API key in feature code)
  - **Logging:** Uses `sheep.observability.logging.get_logger(__name__)` for structured logs
  - **Utilities:** Imports from `sheep.content_generators` (all functions already exist)

  ### Consistency with Features 288-290

  Implementation follows exact patterns proven in recent features:

  ```python
  # Module structure mirrors feature_290_markdown_file_creation.py
  from pathlib import Path
  from sheep.content_generators import (
      generate_markdown_content,
      write_markdown_file,
      validate_markdown_file,
      commit_markdown_file,
      push_markdown_file,
  )
  from sheep.observability.logging import get_logger

  logger = get_logger(__name__)

  def create_test_sv8lfo_markdown_file(repo_path: str | None = None) -> bool:
      """Orchestrate markdown file creation following established pattern."""
      # Implementation here
      pass

  if __name__ == "__main__":
      create_test_sv8lfo_markdown_file()
  ```

  ## Key Design Decisions

  ### Decision 1: Utility Composition Over Inline Implementation

  **Chosen:** Orchestrate existing `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()` functions.

  **Rationale:** Research findings confirm all utilities exist and are proven across 290+ features. Composition maintains consistency, reduces code duplication, leverages proven error handling patterns, and enables predictable testing.

  **Alternative Considered:** Inline implementation with direct pathlib, CrewAI, and subprocess calls — rejected because it duplicates validation logic, introduces encoding/line-ending bugs, and diverges from 290+ established precedent.

  ### Decision 2: Fail Fast on Errors (No Retries, No Fallbacks)

  **Chosen:** Propagate exceptions with clear error messages. Let utilities raise ValueError for file-exists, API failures, validation failures.

  **Rationale:** Specification explicitly selects "fail with clear error" for open questions on API failures and pre-existing files. This approach prevents silent data loss, maintains quality standards, and facilitates debugging. Stack traces and error messages provide clear guidance for investigation.

  **Alternative Considered:** Retry logic with backoff for API failures, fallback content if generation fails — rejected because specification explicitly rejects these approaches and they obscure root causes.

  ### Decision 3: Exact Function Naming and Repo Path Handling

  **Chosen:** Function name `create_test_sv8lfo_markdown_file(repo_path: str | None = None)` matching pattern from features 288-290. Default repo_path to current working directory if None.

  **Rationale:** Mirrors features 288-290 naming convention for predictability. Optional repo_path parameter enables flexible invocation (CLI, agents, tests, direct execution). Default to cwd enables simple `python feature_291_markdown_file_creation.py` execution from repository root.

  ### Decision 4: CrewAI LLM Abstraction

  **Chosen:** Use `sheep.config.llm.get_reasoning_llm()` via utility functions (no direct SDK calls in feature module).

  **Rationale:** Platform standard through existing utilities. Centralizes API key management, enables model/temperature configuration without code changes, maintains consistency with CrewAI agent patterns.

  ### Decision 5: Structured Logging at Checkpoints

  **Chosen:** Log via structlog at key steps: start, after content generation, after file validation, after commit, after push. Use INFO for progress, DEBUG for detailed operations.

  **Rationale:** Enables observability across feature execution, facilitates debugging, integrates with platform logging infrastructure already established in codebase.

  ## Implementation Strategy

  ### Phase 1: Setup & Pattern Analysis

  Before writing code, confirm utility signatures and patterns:
  - Read `src/sheep/content_generators.py` to verify exact function signatures
  - Review `src/sheep/features/feature_290_markdown_file_creation.py` for implementation template
  - Confirm imports and logging patterns used in feature 290
  - Verify git repository state (feature branch exists)

  **Rationale:** Ensures consistency and catches any API changes since features 288-290.

  ### Phase 2: Module Implementation

  Create `src/sheep/features/feature_291_markdown_file_creation.py`:
  1. Import utilities from content_generators
  2. Import logging via sheep.observability.logging
  3. Set up logger instance
  4. Implement main orchestration function with TDD (tests first)
  5. Add `if __name__ == "__main__"` block for direct execution
  6. Validate implementation against feature 290 patterns

  **Key Implementation Details:**
  - Function signature: `create_test_sv8lfo_markdown_file(repo_path: str | None = None) -> bool`
  - Repo path resolution: `Path(repo_path or ".").resolve()`
  - Call sequence: generate → write → validate → commit → push
  - Exception handling: Let utilities raise, catch at function level for logging, re-raise
  - Return True on success; raise exception on failure

  ### Phase 3: Execution & Validation

  Execute the feature and validate:
  - File `test-sv8lfo.md` exists at repository root
  - File contains exactly one H1 heading and 2-3 sentences
  - File uses UTF-8 without BOM, Unix LF line endings only
  - Commit message follows conventional format
  - Commit is pushed to feature branch with upstream tracking
  - Git log shows the new commit

  **Validation Approach:**
  - Execute: `python src/sheep/features/feature_291_markdown_file_creation.py` from repo root
  - Verify: `ls -la test-sv8lfo.md` shows file exists
  - Inspect: `cat test-sv8lfo.md` shows correct structure (H1 heading + 2-3 sentences)
  - Confirm: `git log --oneline -1` shows conventional commit message
  - Check: `git branch -vv` or `git show --no-patch` confirms push to feature branch

  ## Risk Mitigation

  | Risk | Mitigation | Probability |
  | ---- | ---------- | ----------- |
  | Utility function signatures differ from feature 290 | Read content_generators.py and feature_290 implementation before writing code; validate signatures match | Low |
  | LLM API fails or returns invalid content | Specification selects "fail with clear error"; utilities already handle validation and will raise ValueError | Low |
  | File already exists (incomplete cleanup) | Utility will raise ValueError; specification selects fail-with-error approach | Very Low |
  | Git operations fail (no credentials, wrong branch) | Git configuration must already work (evidenced by feature branch creation); credentials already functional; utilities will propagate git errors | Low |
  | Encoding or line-ending issues | Utilities enforce UTF-8 and LF; pathlib handles cross-platform compatibility | Very Low |
  | Module structure diverges from features 288-290 | Use feature 290 as explicit template; mirror imports, logging, function signature exactly | Very Low |

  ## Success Criteria

  Implementation is complete when:
  1. ✅ `src/sheep/features/feature_291_markdown_file_creation.py` exists with correct module structure
  2. ✅ Function `create_test_sv8lfo_markdown_file()` can be imported and called
  3. ✅ Execution creates file `test-sv8lfo.md` at repository root
  4. ✅ File contains H1 heading and exactly 2-3 sentences
  5. ✅ File uses UTF-8 encoding and Unix LF line endings
  6. ✅ Commit message matches conventional format: `feat(291): create markdown file test-sv8lfo.md with prose content`
  7. ✅ Commit is pushed to feature branch with upstream tracking
  8. ✅ Structured logs emit at checkpoints (start, generate, write, validate, commit, push)
  9. ✅ No modifications to existing code or configuration files
  10. ✅ Specification files (plan.yaml, tasks.yaml) are committed

  ## Effort Estimate

  Total implementation time: **25-35 minutes**

  - Phase 1 (Setup): 5-10 minutes — Read existing code, understand patterns
  - Phase 2 (Implementation): 10-15 minutes — Create module, implement function with TDD cycles
  - Phase 3 (Execution & Validation): 5-10 minutes — Run feature, verify output, confirm all success criteria

  **Justification:** Minimal new code (thin orchestration layer), all utilities proven across 290+ features, exact pattern established in features 288-290, no architectural decisions or research required beyond confirming utility signatures.
