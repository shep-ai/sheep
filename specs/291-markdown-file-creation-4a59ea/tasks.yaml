content: |
  ## Summary

  Feature 291 implementation follows a proven pattern from 290+ identical preceding features. Work is organized in three sequential phases:

  **Phase 1: Pattern Analysis (13m total)** — Before writing code, thoroughly examine existing implementations (features 288-290) to confirm exact function signatures, import patterns, and orchestration sequence. Verify git repository state and confirm all prerequisites are met. This analysis phase is critical to ensure consistency and catch any API changes since earlier features.

  **Phase 2: Module Implementation (18m total)** — Create the feature module with proper structure, implement the main orchestration function following TDD principles, and add comprehensive logging. The function is a thin wrapper that chains existing utilities in sequence: generate content → write file → validate structure → commit with conventional message → push to remote. All heavy lifting is delegated to proven utilities in src/sheep/content_generators.py.

  **Phase 3: Execution & Validation (10m total)** — Execute the feature function and validate all success criteria are met: correct file creation, proper encoding/line-endings, conventional commit format, successful push to feature branch. Commit specification files (plan.yaml, tasks.yaml) to complete the work.

  ## Implementation Approach

  The implementation is **100% composition of existing utilities**:

  1. `generate_markdown_content()` — Generates H1 heading + 2-3 sentences via Claude API
  2. `write_markdown_file()` — Writes file with UTF-8 encoding and Unix LF line endings
  3. `validate_markdown_file()` — Validates structure, encoding, line endings before commit
  4. `commit_markdown_file()` — Stages file and commits with conventional message
  5. `push_markdown_file()` — Pushes commit to remote with upstream tracking

  No new utilities or libraries are needed. The feature module is a thin orchestration layer that calls these functions in sequence, logs at checkpoints, and propagates exceptions for debugging.

  ## Key Implementation Details

  - **Module Location:** `src/sheep/features/feature_291_markdown_file_creation.py`
  - **Function Signature:** `create_test_sv8lfo_markdown_file(repo_path: str | None = None) -> bool`
  - **Return Value:** True on complete success; raises exception on any failure
  - **Error Strategy:** Fail fast, propagate exceptions, let utilities raise with clear messages
  - **Logging:** Structured logs at start, after each major step, before return
  - **Git Workflow:** Automatic via utilities (stage, commit with exact message, push to feature branch)

  ## Testing Approach

  Feature uses TDD for the orchestration function:

  1. **RED:** Write test that expects function to exist, be callable, and return True
  2. **GREEN:** Implement minimal function that calls utilities in sequence
  3. **REFACTOR:** Add logging, improve clarity, enhance error messages

  Unit tests mock the utilities to isolate the orchestration logic. Integration testing occurs in Phase 3 when the actual feature is executed against the real repository and LLM API.

  ## Success Definition

  Implementation is complete and validated when:

  - ✅ Module imports successfully with all required utilities available
  - ✅ Function orchestrates utilities in correct sequence
  - ✅ File test-sv8lfo.md is created with valid structure
  - ✅ File uses UTF-8 encoding and Unix LF line endings
  - ✅ Commit follows conventional format: `feat(291): create markdown file test-sv8lfo.md with prose content`
  - ✅ Commit is pushed to feature branch with upstream tracking
  - ✅ Structured logs emit at all checkpoints
  - ✅ All tests pass (unit and integration)
  - ✅ Specification files (plan.yaml, tasks.yaml) are committed

  ## Effort Breakdown

  | Phase | Tasks | Time |
  | ----- | ----- | ---- |
  | Phase 1: Setup & Analysis | task-1, task-2 | 13m |
  | Phase 2: Implementation | task-3, task-4, task-5 | 18m |
  | Phase 3: Validation & Commit | task-6, task-7 | 10m |
  | **Total** | **7 tasks** | **41m** |

  This aligns with the "S" (small, 15-20 minutes) size estimate in the feature specification because:
  - Minimal new code (thin orchestration layer)
  - All utilities already proven across 290+ features
  - Exact pattern established in features 288-290
  - No architectural decisions or research required beyond confirming signatures
  - No new libraries or dependencies needed
  - Straightforward testing and validation process
