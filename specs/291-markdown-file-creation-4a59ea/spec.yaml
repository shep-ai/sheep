content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 291 creates a single test markdown file
  (`test-sv8lfo.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-290.
  With 290 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations.

  ## Success Criteria

  - [ ] File `test-sv8lfo.md` is created in repository root at path `./test-sv8lfo.md`
  - [ ] File contains exactly one H1 heading (CommonMark `#`) serving as the title
  - [ ] File contains exactly 2-3 sentences of coherent prose content following the heading, separated by a blank line
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\n) exclusively, no CRLF (\r\n) or Mac CR (\r)
  - [ ] File structure validation passes (H1 heading present, sentence count verified, encoding confirmed)
  - [ ] File is properly staged in git working directory via `git add`
  - [ ] Commit message follows conventional format: `feat(291): create markdown file test-sv8lfo.md with prose content`
  - [ ] Commit is successfully pushed to feature branch `feat/291-markdown-file-creation-4a59ea` with upstream tracking
  - [ ] Content is generated via Claude API using `sheep.config.llm.get_reasoning_llm()`
  - [ ] Implementation uses established utility functions from `src/sheep/content_generators.py`
  - [ ] No source code, test files, or configuration files are modified
  - [ ] File size falls within expected range (250-600 bytes, natural outcome of proper structure)
  - [ ] Structured logging via structlog emits appropriate INFO/DEBUG messages during execution

  ## Functional Requirements

  - **FR-1**: Create a markdown file with exact filename `test-sv8lfo.md` in repository root (not in subdirectories)
  - **FR-2**: File must contain a single H1 heading (CommonMark-compliant syntax `# Title`) as the title
  - **FR-3**: File must contain exactly 2-3 sentences of coherent prose content following the heading, separated by a blank line
  - **FR-4**: Content must be generated by Claude API via `sheep.config.llm.get_reasoning_llm()` for quality and variety
  - **FR-5**: Use core utility functions from `src/sheep/content_generators.py` where available: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - **FR-6**: Stage file in git using `git add test-sv8lfo.md`
  - **FR-7**: Create conventional commit with message: `feat(291): create markdown file test-sv8lfo.md with prose content`
  - **FR-8**: Push commit to feature branch with upstream tracking (`git push -u origin HEAD`)
  - **FR-9**: Validate file structure before committing (H1 heading present, exactly 2-3 sentences, UTF-8 encoding, Unix LF line endings)
  - **FR-10**: Fail with clear error message if file already exists (prevent silent overwrite)

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix LF line endings (\n), never CRLF (\r\n) or Mac CR (\r)
  - **NFR-3**: Implementation must follow the established pattern from features 001-290 for consistency and maintainability
  - **NFR-4**: All logging must use structlog with appropriate severity levels (DEBUG for detailed operations, INFO for checkpoints, ERROR for failures)
  - **NFR-5**: All file I/O operations must use pathlib (Path class) for cross-platform compatibility
  - **NFR-6**: File size naturally falls in 250-600 byte range (expected outcome of proper implementation, not a hard constraint)
  - **NFR-7**: No modifications to source code, tests, or configuration files (feature creates only the markdown file)
  - **NFR-8**: No directory creation or modification beyond repository root
  - **NFR-9**: Git operations must respect existing repository hooks and configuration (standard git workflow)
  - **NFR-10**: Content generation is non-deterministic (each file contains unique content, different from 290+ existing files)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-sv8lfo.md) to existing collection of 290+ test files; no modifications to existing files |
  | File System | Low | Single file creation (~250-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch/merge complexity |
  | src/sheep/ | None | Feature uses existing utility functions from content_generators.py; no new code required |
  | specs/ | Low | Adds spec directory for feature 291; spec requirements phase only, no impact on other specs |
  | Tests | None | Feature does not require test modifications; is itself a test artifact |
  | Configuration | None | Feature uses existing config; no changes to .env, pyproject.toml, or other configs |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or core platform functionality |

  ## Dependencies

  - **Git repository**: Feature branch `feat/291-markdown-file-creation-4a59ea` must exist (pre-created per git status)
  - **File system**: Write access to repository root directory (standard)
  - **Established pattern**: 290 preceding test files provide clear precedent for content format and validation
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library**: pathlib module available in Python 3.11+
  - **sheep.content_generators module**: Utility functions for markdown creation (`generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`, or `create_markdown_file()`)
  - **Claude API access**: ANTHROPIC_API_KEY or equivalent configured in environment for content generation via `sheep.config.llm.get_reasoning_llm()`
  - **File naming**: Exact filename `test-sv8lfo.md` provided in feature spec and must be used as specified

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation**: ~3 minutes (write file using pathlib, validate structure/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate**: 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 290 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting (content generation, validation, git operations)
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - File naming (test-sv8lfo.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 290 prior implementations
  - Recent implementations (features 284-290) demonstrate efficient execution of identical features
