  - [ ] Validate file size is 400-600 bytes; fail with diagnostic error if not
  - [ ] Stage file with `git add test-ju8e95.md`
  - [ ] Commit with message: `feat(268): create markdown file test-ju8e95.md with prose content`
  - [ ] Push to feature branch: `git push -u origin feat/268-markdown-file-creation-7177f9`
