content: |
  ## Problem Statement

  Create a single markdown file named `test-jukbpa.md` at the repository root containing
  a markdown H1 title and 3 sentences of content about any topic. This is part of
  the Sheep repository's test file collection, which validates the system's ability to
  perform straightforward file creation tasks with appropriate version control workflows.

  ## Success Criteria

  - [ ] File named `test-jukbpa.md` exists at repository root
  - [ ] File contains a valid markdown H1 heading for the title
  - [ ] File contains exactly 3 sentences of prose content
  - [ ] All markdown syntax is valid (properly formatted)
  - [ ] Content is meaningful and complete (not placeholder text)
  - [ ] File is staged and committed to git with conventional commit message format
  - [ ] Commit message follows `feat(059): description` pattern
  - [ ] Changes are pushed to the remote branch
  - [ ] No existing files are modified or deleted
  - [ ] File size is approximately 100-300 bytes

  ## Functional Requirements

  - **FR-1**: Create and write markdown file named `test-jukbpa.md`
  - **FR-2**: File must be created at the repository root directory
  - **FR-3**: File must contain exactly one H1 markdown heading (single # symbol) as the title
  - **FR-4**: File must contain exactly 3 sentences of prose content
  - **FR-5**: Content may be about any topic at the author's discretion
  - **FR-6**: File must be added to git staging area
  - **FR-7**: File must be committed with a conventional commit message (`feat(059): description`)
  - **FR-8**: Changes must be pushed to the remote branch

  ## Non-Functional Requirements

  - **NFR-1**: File must use valid markdown syntax with no formatting errors
  - **NFR-2**: Content must be meaningful and complete (not placeholder, filler, or auto-generated text)
  - **NFR-3**: File follows the established naming convention pattern `test-<id>.md` used in features 054-058
  - **NFR-4**: Content should be natural, well-written, and appropriate for the chosen topic
  - **NFR-5**: Implementation must not modify any existing files in the repository
  - **NFR-6**: File formatting must match existing markdown files in the repository (blank line after title, single paragraph blocks)
  - **NFR-7**: Git commit message must accurately describe the addition following conventional commits specification
  - **NFR-8**: No side effects or unintended changes to repository state

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository contains two main components:
  - **Platform Code**: Located in `/src/sheep/` — the agentic implementation platform using CrewAI
  - **Test Content**: Markdown files at the repository root that validate platform functionality

  The root directory contains numerous markdown files organized by purpose:
  - **Test files**: Pattern of `test-<random-id>.md` (e.g., `test-oxui09.md`, `test-fj138v.md`)
    containing simple content with titles and prose
  - **Example/Topic files**: Content files on various subjects (e.g., `DESIGN_PATTERN.md`, `SHEEP.md`, `ABOUT_ME.md`)
  - **Configuration**: `README.md`, `pyproject.toml`, `Dockerfile`, `.env.example`
  - **Specs**: `/specs/` directory contains feature specifications organized by number and name

  ### Architecture Patterns

  The repository follows these patterns:
  - **Flat File Structure for Content**: All markdown content is stored at the repository root with no
    subdirectories for content organization
  - **Naming Convention**: Test files follow the pattern `test-<random-id>.md` where the random ID is typically
    a 6-character alphanumeric string (e.g., `test-jukbpa.md`)
  - **Content Pattern**: Each markdown file contains:
    - A single H1 heading (# Title)
    - Blank line after the title
    - Prose content of 3 sentences (based on features 054-058 pattern)
    - No additional structure or formatting beyond title and paragraphs
  - **Version Control**: Each new file is committed to git with conventional commit messages (`feat(NNN): description`)

  ### Relevant Technologies

  - **Markdown**: Plain text markup language for content formatting (no special features, just basic H1 headings and paragraphs)
  - **Git**: Version control system for tracking file additions and changes (standard add/commit/push workflow)
  - **No dependencies**: No build tools, compilers, testing frameworks, or external libraries involved

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Single file addition to root; no structural impact or modifications to existing files |
  | Git history | Low | Single new commit added to repository history; no destructive or complex operations |
  | File system | Low | One new `.md` file created (~150-300 bytes); no deletions or modifications to existing files |

  ## Dependencies

  - **Git**: Required for committing and pushing the new file to the remote repository
  - **Markdown syntax understanding**: Basic knowledge of markdown H1 heading syntax (single `#`)
  - **No code dependencies**: No external libraries, frameworks, build tools, or platform features required
  - **No impacts to platform code**: This is a content-only addition with zero changes to `src/` directory
  - **File system access**: Write access to repository root directory (standard development environment assumption)

  ## Size Estimate

  **S** (Single Sitting, <30 minutes) — Trivial implementation with zero complexity:
  - **Precedent**: Features 054-057-058 all estimated as S and follow identical pattern with identical success criteria
  - **File creation**: Single markdown file (~150-250 bytes with 3-sentence content)
  - **Requirements**: None (all FRs and NFRs are straightforward with no ambiguity)
  - **Content creation**: Free choice of topic, no approval cycle or research needed
  - **Git workflow**: Standard add/commit/push sequence (<2 minutes)
  - **Testing**: None required; success criteria are objective and trivial to verify by inspection

  This is the simplest possible implementation task. Requirements are fully resolved with
  no blocking decisions. Time is dominated by content authoring (2-3 minutes) and git
  operations (<1 minute).

