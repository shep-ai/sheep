content: |
  ## Problem Statement

  Create a single markdown file called `test-nlmz8w.md` in the repository root with a title and 2-3 sentences of prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established
  pattern and convention used throughout 297+ previous iterations in this repository (features 001-297).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content on any topic of the implementer's choice
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-nlmz8w.md`
  - Committed with conventional commit message: `feat(298): create markdown file test-nlmz8w.md with prose content`
  - Pushed to the feature branch `feat/298-markdown-file-creation-b1e6e0`

  ## Codebase Analysis

  ### Project Structure

  **Repository Purpose**: Sheep is an agentic platform for automated code implementation using CrewAI. This particular repository instance contains a systematic test workflow where 297+ markdown files have been created following a consistent pattern. The repository structure indicates:

  - **Root Directory**: Contains markdown test files (test-*.md), specification directories (specs/), and key documentation (README.md, SHEEP.md, etc.)
  - **specs/ Directory**: Contains numbered feature specifications (001-, 002-, etc.) with corresponding spec.yaml files documenting each feature's requirements and analysis
  - **Git Branches**: The working branch is `feat/298-markdown-file-creation-b1e6e0`, which is a feature branch following the established naming pattern for markdown file creation tasks
  - **Configuration Files**: .env.example, Dockerfile, .gitignore present but not modified by this feature
  - **Source Code (/src/)**: Sheep platform contains Python agents, flows, tools, and observability modules, but this feature does not interact with them

  ### Architecture Patterns

  **Feature Implementation Pattern**: This repository follows a repeating workflow pattern established across 297+ prior iterations:

  1. **Feature Specification**: Each feature has a spec.yaml file in specs/{number}-{name}/ directory
  2. **File Creation**: Implementation creates a single markdown file in the repository root
  3. **Content Structure**: Consistent format with H1 title, blank line, 2-3 sentences of prose
  4. **Git Workflow**: Stage, commit with conventional message, push to feature branch
  5. **Separation of Concerns**: File creation is completely isolated from the application logic (agents, flows, tools)

  **Design Principles**:
  - **Output-Focused Requirements**: Specifications define what output files should look like, not how to create them
  - **Implementation Flexibility**: Any approach (Python script, shell, manual) can satisfy requirements
  - **Consistency Through Convention**: 297+ prior files establish clear precedent and conventions to follow
  - **No Code Dependencies**: Feature is purely file creation; does not depend on or interact with Sheep application code

  ### Relevant Technologies

  - **Markdown**: File format follows CommonMark specification; contains H1 heading + prose
  - **Git**: Version control operations (add, commit, push) performed in sequence
  - **Python**: Can be used for implementation (pathlib for file I/O), though not required
  - **GitHub Actions**: CI pipeline present but not modified by this feature
  - **File System**: Standard POSIX file system operations (write, permissions)

  ## Success Criteria

  - [ ] File `test-nlmz8w.md` exists in the repository root directory
  - [ ] File contains exactly one H1 heading (using `#` syntax)
  - [ ] Blank line exists between the H1 heading and prose content
  - [ ] File contains exactly 2-3 sentences of coherent prose content
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (not Windows CRLF)
  - [ ] File size is approximately 400-600 bytes
  - [ ] File is staged in git (verified by `git add test-nlmz8w.md`)
  - [ ] Commit message is exactly: `feat(298): create markdown file test-nlmz8w.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/298-markdown-file-creation-b1e6e0`

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-nlmz8w.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 heading (using `#` syntax) as the title
  - **FR-3**: Include a blank line between the H1 heading and the prose content
  - **FR-4**: Include 2-3 sentences of coherent prose content on any topic of the implementer's choice
  - **FR-5**: Encode the file using UTF-8 without BOM (Byte Order Mark)
  - **FR-6**: Use Unix LF line endings (`\n`) throughout the file (not Windows CRLF)
  - **FR-7**: Stage the file in git using `git add test-nlmz8w.md`
  - **FR-8**: Commit the file with conventional commit message: `feat(298): create markdown file test-nlmz8w.md with prose content`
  - **FR-9**: Push the commit to the feature branch `feat/298-markdown-file-creation-b1e6e0`

  ## Non-Functional Requirements

  - **NFR-1**: File size must naturally result in approximately 400-600 bytes as a consequence of writing 2-3 sentences after an H1 heading; no artificial padding or compression required
  - **NFR-2**: Implementation must follow the established pattern and conventions used across 297+ prior markdown file creation features
  - **NFR-3**: Must not modify, delete, or overwrite any existing files in the repository
  - **NFR-4**: Must not require any external package dependencies beyond Python 3.11+ standard library (pathlib) and Git
  - **NFR-5**: Implementation should complete within the estimated 10-15 minutes

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-nlmz8w.md) to existing collection of 297+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-297; no branch/merge complexity, no destructive operations, no conflicts |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or other infrastructure |
  | Source Code (/src/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/298-markdown-file-creation-b1e6e0` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 297+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<identifier>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  **No External Package Dependencies**:
  - Feature uses only Python standard library (pathlib, subprocess/os for git operations if needed)
  - No additional pip packages required beyond existing project dependencies
  - No API keys, credentials, or external service integrations needed
  - No database, cache, or storage system dependencies

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes of actual implementation work)

  **Justification**:
  - Well-established pattern with 297+ identical test files providing clear, proven precedent
  - No architectural decisions, design choices, or research required
  - Flexible topic selection with no constraints; implementer chooses freely
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - File naming (test-nlmz8w.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 297+ prior implementations
  - Recent feature implementations (295-297) demonstrate efficient execution in 10-15 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern

  ---

  _Analysis phase complete — codebase structure understood, requirements clearly defined, dependencies identified, specification ready for implementation_
