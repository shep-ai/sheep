content: |
  ## Problem Statement

  Create a single markdown file named `test-8v8ws2.md` at the repository root containing a markdown h1 heading and 2-3 sentences of descriptive prose describing any topic.
  This feature is part of the Sheep agentic platform test suite, which validates the system's ability to perform simple, well-defined implementation tasks with correct execution.

  ## Success Criteria

  - [ ] File `test-8v8ws2.md` exists at repository root (not in any subdirectory)
  - [ ] File contains exactly one h1 markdown heading using the syntax `# [Title]` as the first line
  - [ ] File contains 2-3 sentences of coherent, grammatically correct prose content following the h1 heading, separated by a blank line
  - [ ] Content is coherent, grammatically correct, and follows markdown formatting standards without syntax errors
  - [ ] File uses UTF-8 encoding (standard for markdown files in the repository)
  - [ ] File follows the `test-{code}.md` naming convention pattern matching existing test files
  - [ ] No additional markdown elements are present (only h1 heading and prose sentences)
  - [ ] Changes are committed to the feature branch with a clear, conventional commit message (e.g., "feat(051): Create test-8v8ws2.md markdown test file")
  - [ ] Committed changes are pushed to the remote repository on the feature branch `feat/051-markdown-test-file-aaa5b3`

  ## Functional Requirements

  - **FR-1**: Create a new markdown file with the exact filename `test-8v8ws2.md` in the repository root directory (same level as README.md, other test-*.md files)
  - **FR-2**: File must contain exactly one h1 markdown heading using the syntax `# [Title]` as the first line of content
  - **FR-3**: File must contain exactly 2-3 sentences of descriptive prose content, separated from the h1 heading by a blank line
  - **FR-4**: Prose must describe a coherent, well-defined topic and be grammatically correct with proper English punctuation
  - **FR-5**: File must be valid markdown with no syntax errors and must not contain additional markdown elements beyond h1 heading and plain prose
  - **FR-6**: File must be committed to the feature branch with a descriptive commit message following conventional commit format (e.g., "feat(051): Create test-8v8ws2.md...")
  - **FR-7**: Committed changes must be pushed to the remote repository on the feature branch `feat/051-markdown-test-file-aaa5b3`
  - **FR-8**: The title/heading should be concise (5-10 words) and clearly identify the topic

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 with LF line endings (consistent with repository standards)
  - **NFR-2**: Content quality should match or exceed the clarity and informativeness of existing test files in the repository (measured by coherence, grammar, and informativeness)
  - **NFR-3**: Implementation should follow the established test file pattern (`test-{randomCode}.md`) without deviation
  - **NFR-4**: Task completion should require no external dependencies, API calls, build system invocations, or code generation
  - **NFR-5**: Implementation should complete within the S (small) size estimate of 30 minutes
  - **NFR-6**: File content should use neutral/educational tone that informs without being overly formal or casual
  - **NFR-7**: Topic selection should be from any subject area that can be coherently described in 2-3 sentences

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the file contain ONLY h1 + sentences, or allow additional markdown? | Strict structure only (h1 + prose sentences) | Specification explicitly defines structure; minimizes ambiguity; aligns with simple test file pattern |
  | 2 | What topic should the file cover? | No constraint - implementer chooses any coherent topic | Specification says "any topic"; validates flexible requirement handling; reduces decision overhead |
  | 3 | What tone should the prose use? | Neutral/educational tone | Balances professionalism with accessibility; matches repository documentation standards; provides clear guidance |

