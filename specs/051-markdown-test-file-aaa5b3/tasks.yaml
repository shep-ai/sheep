content: |
  ## Summary

  Three sequential tasks across three phases implement feature 051:

  **Phase 1 (File Creation):** Create test-8v8ws2.md at repository root with h1 heading and 2-3
  sentences of substantive, accessible prose in neutral/educational tone. Topic selection emphasizes
  technical breadth while remaining clear and informative, following pattern established by features
  049 and 050.

  **Phase 2 (Verification):** Manually verify file against all success criteria from specification.
  Checklist includes location, markdown structure, content quality, grammar, encoding (UTF-8), line
  endings (LF), and absence of additional markdown elements.

  **Phase 3 (Git Integration):** Stage file, commit with conventional message (feat(051): Create
  test-8v8ws2.md...), and push to feature branch feat/051-markdown-test-file-aaa5b3. Verify
  successful push to remote.

  Each phase builds on the previous one. Tasks are ordered by dependency: file must exist before
  verification, verification must pass before committing. Total effort: ~30 minutes aligned with
  Small (S) size estimate.

  ## Task Execution Flow

  1. **Task 1 (15 min):** Create the markdown file with h1 heading and 2-3 sentences, ensuring
     proper encoding and line endings. Use TDD approach: verify file doesn't exist (RED), create file
     (GREEN), ensure UTF-8 and LF compliance (REFACTOR).

  2. **Task 2 (10 min):** Verify the file against all success criteria using manual checklist.
     Check location, structure, content quality, grammar, tone, encoding, and markdown syntax.
     Fix any issues found (grammar edits, encoding conversion, line-ending normalization).

  3. **Task 3 (5 min):** Stage the file, commit with conventional message, and push to feature
     branch. Verify commit is on correct branch and push to remote succeeds.

  All tasks are straightforward with no blocking dependencies beyond the obvious (file must exist
  before verification, verification must pass before commit).
