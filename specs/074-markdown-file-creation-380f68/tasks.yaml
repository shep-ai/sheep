# Markdown content (the full tasks document)
content: |
  ## Task Execution Flow

  **Phase 1: File Creation & Validation (Tasks 1-2)**

  Tasks 1 and 2 are sequential and must complete before moving to Phase 2:
  1. Create the markdown file with proper content using pathlib
  2. Validate the file comprehensively to ensure it meets all NFRs

  This two-step approach ensures the file is correct before git operations begin,
  preventing malformed files from being committed.

  **Phase 2: Git Integration (Tasks 3-4)**

  Tasks 3 and 4 are sequential and depend on Phase 1 completion:
  3. Stage and commit the file with conventional commit message
  4. Push to remote origin

  This ordering ensures the file is committed locally before being pushed to remote,
  following standard git workflow.

  ## Implementation Notes

  ### File Content Strategy

  For task-1, choose any topic for the 2-3 sentences. Examples from existing test files:
  - "The Moon and Its Impact on Earth" (from feature 072)
  - "Simplicity" (from feature 073)
  - "Practice" (from other test files)

  The topic is completely unrestricted per product decision #3. Pick a topic that
  interests you and write clear, readable prose.

  ### Validation Strategy

  For task-2, validation is integrated (not separate script). The validation checks
  serve as both quality assurance and acceptance criteria verification. Each check
  corresponds to a specific NFR or FR requirement.

  ### Git Command Strategy

  For tasks 3-4, use subprocess.run() with list-based arguments (never shell=True).
  The safe pattern is:
  ```python
  subprocess.run(['git', 'arg1', 'arg2', ...], check=True)
  ```

  List arguments are parsed as individual arguments, preventing shell injection attacks.
  The `check=True` parameter causes CalledProcessError to be raised if the command fails,
  enabling fail-fast error handling.

  ### Error Handling

  For all git operations (tasks 3-4), catch subprocess.CalledProcessError and provide
  clear error messages that indicate:
  - What git command was attempted
  - Why it failed (if possible to determine)
  - Any relevant context (current branch, working directory status, etc.)

  ## Dependencies & Sequencing

  ```
  Task 1 (Create file)
    ↓
  Task 2 (Validate format)
    ↓
  Task 3 (Stage & commit)
    ↓
  Task 4 (Push to remote)
  ```

  All dependencies are sequential. Each task must complete successfully before the
  next begins. If any task fails, stop and report the error; do not proceed to
  subsequent tasks.

  ## Effort Breakdown

  - Task 1: 5 min (file creation straightforward)
  - Task 2: 8 min (validation has multiple checks, but mostly straightforward)
  - Task 3: 5 min (git operations using standard subprocess pattern)
  - Task 4: 3 min (git push is simplest operation)
  - **Total: 21 min** (includes file content writing, validation implementation, git setup)

  This is slightly longer than the spec's 10-15 min estimate due to more granular
  task breakdown and explicit validation implementation. The actual execution may be
  faster depending on prose quality and familiarity with subprocess patterns.

  ## Acceptance Criteria Summary

  All acceptance criteria from the feature spec are mapped to specific tasks:

  | Requirement | Task |
  | ----------- | ---- |
  | File exists with correct name (test-macwxa.md) | Task 1 |
  | H1 heading present | Task 1 & 2 |
  | 2-3 sentences prose | Task 1 & 2 |
  | Blank line separator | Task 1 & 2 |
  | UTF-8 encoding without BOM | Task 2 |
  | LF line endings (no CRLF) | Task 2 |
  | Markdown valid structure | Task 2 |
  | File size 400-600 bytes (guideline) | Task 2 |
  | Git add (staged) | Task 3 |
  | Git commit with exact message | Task 3 |
  | Git push to remote | Task 4 |
  | On feature branch | Task 3 & 4 |

