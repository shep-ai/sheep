# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File I/O Implementation — pathlib.Path.write_text()

  **Chosen:** `Path(filename).write_text(content, encoding='utf-8')`

  **Rejected:**
  - `open()` context manager — More verbose; pathlib is more idiomatic; all 65+ existing files use pathlib
  - `subprocess.run(['touch'])` — Over-engineered; requires shell; pathlib handles directly
  - `os.open()` with manual encoding — Low-level; pathlib abstracts cleanly

  **Rationale:** pathlib is the modern Python standard for file operations (PEP 519). It provides clean,
  readable syntax and handles encoding explicitly. The pattern `Path(filename).write_text(content, encoding='utf-8')`
  is already used in the codebase (file_tools.py:96-97) and all 65+ existing test files follow this approach.
  Explicit UTF-8 encoding ensures portability and prevents BOM inclusion (per NFR-1).

  ### 2. Git Operations — subprocess.run() with CLI

  **Chosen:** `subprocess.run(['git', 'add', filename], check=True)` pattern

  **Rejected:**
  - GitPython library — Adds abstraction not needed for basic operations; existing codebase uses subprocess
  - `os.system()` with shell string — Security risk (command injection); subprocess with list args is safer
  - Shell script execution — Violates Python implementation; adds shell dependency

  **Rationale:** The existing git_tools.py (lines 15-29) implements _run_git() using subprocess.run()
  with list-based arguments. This is safe, clear, and portable. List arguments prevent shell injection.
  The pattern is: `subprocess.run(['git', arg1, arg2], check=True)` for fail-fast error handling.
  GitPython is available in dependencies but deliberately not used in git operations, indicating
  subprocess is the project's preferred approach for simplicity.

  ### 3. Prose Content — Hardcoded Unrestricted Topic

  **Chosen:** Manually written prose (2-3 sentences, unrestricted topic)

  **Rejected:**
  - LLM-based generation — Adds external dependency; overkill for test files
  - Random topic generation with templates — Over-engineering for simple one-off task
  - External data source — Adds API/network dependency; test files are static

  **Rationale:** Hardcoded prose is the simplest, most direct approach. All existing 65+ test files
  contain manually written content. This approach requires no external dependencies or network calls,
  is deterministic and reproducible, and maximizes implementer autonomy per user request "about anything"
  (product decision #3). Topic choice is completely unrestricted—implementer selects any topic they prefer.

  ### 4. Line Ending Handling — Python Default LF on Unix

  **Chosen:** Rely on Python's default LF line endings on Unix systems (no explicit newline parameter)

  **Rejected:**
  - Explicit `newline=''` parameter — Unnecessary on Unix; adds complexity
  - Manual line ending conversion — Over-engineering; Python handles automatically
  - Git autocrlf configuration — Project-level concern; not feature scope

  **Rationale:** The project runs on Linux (confirmed by environment context "Platform: linux") where
  Python's write_text() defaults to Unix-style LF line endings per POSIX convention. All existing test
  files use LF. Therefore, relying on Python's default behavior satisfies NFR-2 (Unix LF line endings)
  without explicit parameter. This follows the principle of least surprise: on Unix, use Unix conventions naturally.

  ### 5. BOM Prevention — UTF-8 Standard Codec (not utf-8-sig)

  **Chosen:** `encoding='utf-8'` (standard UTF-8 codec without BOM)

  **Rejected:**
  - `encoding='utf-8-sig'` — Adds BOM marker; violates NFR-1 requirement
  - Manual BOM stripping — Unnecessary; Python utf-8 codec doesn't add BOM by default
  - Binary mode with manual encoding — Over-complicated; pathlib handles cleanly

  **Rationale:** Python's pathlib.write_text() with `encoding='utf-8'` produces valid UTF-8 without BOM.
  The utf-8 codec does not emit BOM (unlike utf-8-sig). Explicit 'utf-8' parameter (not 'utf-8-sig')
  ensures no BOM. This satisfies NFR-1 "UTF-8 without BOM" automatically. Validation can check with:
  `assert not binary_content.startswith(b'\xef\xbb\xbf')`.

  ### 6. File Size Validation — Soft Guideline with Tolerance Range

  **Chosen:** Validate against 350-650 byte range (tolerance around 400-600 guideline)

  **Rejected:**
  - Strict 400-600 byte enforcement — Contradicts spec: NFR-3 says "guideline, not strict limit"
  - No validation — Loses sanity check on output format
  - Size-based content generation — Over-engineering; prose should flow naturally

  **Rationale:** NFR-3 specifies 400-600 bytes as a guideline ("should typically"), not a strict requirement.
  Validation provides confidence that output is well-formed without forcing artificial constraints.
  Validation approach: (1) Write prose naturally (2-3 sentences); (2) Validate file is within reasonable range
  (350-650 bytes tolerance); (3) Flag if significantly outside range. This respects the spec's soft guidance
  while avoiding over-enforcement. Implementation: ~5 lines of code, low overhead.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O operations | **Use** | Modern Python standard; already used in file_tools.py; idiomatic for file creation |
  | subprocess (stdlib) | Git command execution | **Use** | Standard approach for external process execution; safe with list args; existing pattern in git_tools.py |
  | gitpython (3.1.0+) | Git library abstraction | **Reject** | Available in dependencies but not used in git_tools.py; unnecessary abstraction for basic operations |
  | os (stdlib) | System operations | **Minimal** | Only use os.system for one-off ops; subprocess preferred; not needed here |
  | sys (stdlib) | System exit handling | **Use** | For proper process exit codes in main() function |

  ## Security Considerations

  ### Command Injection Prevention
  **Risk:** Git operations via subprocess could be vulnerable to command injection if arguments are not properly escaped.
  **Mitigation:** Use list-based arguments in subprocess.run() (not shell=True). Example: `subprocess.run(['git', 'add', filename], ...)` passes filename as single argument, not shell parsing. This is the safe pattern used in git_tools.py and is immune to injection.

  ### File Path Validation
  **Risk:** Creating files in arbitrary paths could write to unintended locations.
  **Mitigation:** Feature hardcodes filename as `test-macwxa.md` in repository root. No user input or path construction from untrusted sources. File path is compile-time constant.

  ### File Encoding Security
  **Risk:** Incorrect encoding could lead to data corruption or injection attacks in rendered markdown.
  **Mitigation:** Explicit UTF-8 encoding with no BOM ensures correct byte representation. UTF-8 is ASCII-compatible for English text; no control characters or encoding tricks possible in normal prose.

  ### Git Credential Exposure
  **Risk:** Git operations might leak credentials or private keys in error output.
  **Mitigation:** Use `check=True` in subprocess.run() to fail fast; capture stdout/stderr separately; don't echo unfiltered git output to logs. Feature doesn't involve credentials (simple add/commit/push operations).

  ## Performance Implications

  ### Minimal Performance Overhead
  This feature has negligible performance implications:
  - **File creation:** O(1) operation; writing ~500 bytes is microseconds
  - **Git operations:** Network latency dominates (push to remote); local add/commit are milliseconds
  - **No optimization needed:** Feature is not performance-critical; execution time is sub-second total

  ### Validation Performance
  Validation operations are O(n) where n = file size (~500 bytes):
  - Reading file to check encoding: microseconds
  - Counting sentences (counting periods): linear scan, negligible overhead
  - Size check: O(1)
  - Total validation: <10ms on typical hardware

  ### Scalability
  Not applicable—this is a single-file creation operation. No loops, no algorithms, no data structures of variable size.

  ## Architecture Notes

  ### Fit with Existing Codebase Patterns

  This feature follows established patterns from 65+ existing test files and recent feature implementations:

  1. **File I/O Pattern** (from file_tools.py):
     - Uses pathlib.Path.write_text() for file creation
     - Explicit UTF-8 encoding
     - No directory creation needed (repository root already exists)

  2. **Git Integration Pattern** (from git_tools.py):
     - subprocess.run() with list-based arguments for git commands
     - `check=True` for fail-fast error handling
     - Separate calls for git add, commit, push
     - Simple error reporting

  3. **Implementation Pattern** (from create_markdown.py, features 064-073):
     - Standalone Python script with main() entry point
     - Hardcoded content (no external data sources)
     - Validation as integral part of implementation
     - Conventional commit message format: `feat(NNN): create markdown file test-XXXXX.md with prose content`

  4. **No Dependency on Application Code** (/src/sheep/):
     - Feature is pure file creation and git workflow
     - Does not import from sheep application
     - Does not require agents, tools, or orchestration
     - Operates at filesystem level only

  ### Relationship to Testing Infrastructure
  This feature is a **test artifact**, not test code:
  - Created test markdown files (test-*.md) are not test suites
  - They are static files that demonstrate file creation capability
  - Tests for file creation (if any) would be in tests/ directory
  - This feature creates the artifact; separate tests would verify it

  ### No Impact on Application
  - No changes to /src/sheep/ source code
  - No changes to tests/ test suite
  - No changes to configuration or dependencies
  - Pure additive change: one new file in repository root

  ## Technology Stack Summary

  - **Python Version:** 3.11+ (from pyproject.toml requires-python)
  - **File I/O:** pathlib (stdlib)
  - **Process Management:** subprocess (stdlib)
  - **Version Control:** Git CLI (external; no library needed)
  - **Encoding:** UTF-8 (no BOM)
  - **Line Endings:** LF (Unix standard)
  - **Markdown Syntax:** CommonMark compatible

