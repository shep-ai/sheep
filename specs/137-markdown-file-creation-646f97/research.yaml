# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path.write_text() with explicit encoding and newline parameters"
    rejected:
      - "Built-in open() with manual file handle management — requires more boilerplate and manual resource management; pathlib is more concise and Pythonic"
      - "os.open() and os.write() with low-level I/O — unnecessary complexity for single file write operation; pathlib abstracts this elegantly"
      - "subprocess call to shell commands — platform-dependent, less reliable across Windows/Unix, harder to validate encoding"
    rationale: >
      pathlib.Path.write_text() provides the most reliable, maintainable approach for this
      use case. The critical advantage is the explicit newline and encoding parameters:
      encoding='utf-8' ensures UTF-8 without BOM (BOM is only added with utf-8-sig), and
      newline='\n' forces Unix LF line endings on all platforms, bypassing platform-specific
      line ending conversion. This directly satisfies the spec requirements for UTF-8 LF encoding.
      Pattern established across 136+ identical features in codebase confirms this is the
      standard approach for this task.

  - title: "Line Ending Enforcement (CRLF vs LF)"
    chosen: "Use newline='\\n' parameter in Path.write_text() to force Unix LF line endings"
    rejected:
      - "Platform default line endings — would produce CRLF on Windows, violating spec requirement for Unix LF; spec explicitly requires LF"
      - "Post-processing with str.replace('\\r\\n', '\\n') — unnecessary; newline parameter is more efficient and cleaner"
      - "Binary write mode with b'...' literals — more complex and error-prone for text; text mode with newline parameter is standard"
    rationale: >
      The specification explicitly requires Unix-style LF line endings, and current test files
      in the repository use CRLF (a discrepancy from spec). The newline parameter in
      Path.write_text() is the standard Python mechanism to enforce platform-independent line
      endings. When newline='\n' is specified, Python opens the file in universal newlines mode
      but writes using only the specified delimiter, ensuring consistent LF across all platforms
      (Windows, macOS, Linux). This is more reliable than post-processing and follows Python
      best practices.

  - title: "Text Encoding (UTF-8 with/without BOM)"
    chosen: "encoding='utf-8' (without BOM) in Path.write_text()"
    rejected:
      - "encoding='utf-8-sig' — adds UTF-8 BOM (EF BB BF bytes), which violates spec requirement for UTF-8 without BOM"
      - "encoding='utf-16' or 'utf-32' — spec explicitly requires UTF-8; these introduce unnecessary compatibility complexity"
      - "No encoding parameter (platform default) — may use locale-specific encoding on some systems; explicit UTF-8 is more reliable"
    rationale: >
      The specification requires UTF-8 without BOM (Byte Order Mark). Python's utf-8 encoding
      never adds BOM (only utf-8-sig does), making it the correct choice. BOM is unnecessary
      for UTF-8 (only needed for UTF-16/32 byte-order detection) and the spec explicitly
      forbids it. Using encoding='utf-8' ensures consistent behavior across all platforms and
      prevents accidental BOM insertion.

  - title: "Git Integration Method"
    chosen: "subprocess.run() to execute git commands (add, commit, push)"
    rejected:
      - "GitPython library — adds external dependency not in current codebase; subprocess is available in stdlib and sufficient for simple commands"
      - "Shell commands via os.system() or subprocess.shell=True — less safe (shell injection risk), harder to capture exit codes reliably"
      - "Direct git object manipulation via Dulwich library — excessive complexity for simple staging/commit/push operations"
    rationale: >
      subprocess.run() with check=True is the standard, safe approach for invoking git commands
      in Python automation. It provides: reliable error handling (CalledProcessError on nonzero
      exit), no shell injection risk, cross-platform compatibility, and clear exit code semantics.
      The commands used (git add, git commit, git push) are simple and don't require library
      abstractions. No external dependencies are introduced. Pattern established across 136+
      identical features confirms this is the standard approach in this codebase.

  - title: "Content Generation Approach"
    chosen: "Hardcoded markdown prose string with H1 heading + blank line + 2-3 sentences"
    rejected:
      - "AI/LLM-generated prose — introduces external API dependency, latency, cost, and complexity; spec allows any topic ('about anything') so hardcoded content is sufficient"
      - "Template file with variable substitution — unnecessary for single-file feature; adds template dependency and complexity"
      - "Random topic selection from predefined list — adds complexity; feature requirement is fully satisfied by any reasonable prose"
    rationale: >
      The spec explicitly states the content can be 'about anything,' indicating no specific
      topic requirement. Hardcoded prose is the simplest, fastest, most reliable approach.
      It requires no external APIs, templates, or randomization. The established pattern
      across 136+ identical features shows each implementation uses hardcoded content with
      different topics (learning, problem-solving, creativity, etc.). This approach is
      efficient, reproducible, and meets all functional requirements.

  - title: "File Validation Strategy"
    chosen: "Two-phase validation: binary checks (BOM, CRLF) then text structure checks (heading, blank line, prose)"
    rejected:
      - "Skip validation entirely — risky; could silently produce files that fail spec requirements (wrong encoding, line endings, structure)"
      - "Text-only validation — cannot reliably detect BOM or CRLF issues; binary inspection is required for encoding verification"
      - "External tools (file command, grep) — adds subprocess overhead; Python's built-in file I/O provides all needed validation"
    rationale: >
      Comprehensive validation ensures the created file meets all hard requirements: UTF-8 without
      BOM, LF line endings, correct structure (H1 + blank + prose). Binary validation (checking
      for BOM bytes b'\xef\xbb\xbf' and CRLF bytes b'\r\n') is essential because these
      issues are invisible in text mode. Text structure validation confirms the file has the
      required H1 heading on line 1, blank line 2, and 2-3 sentences of prose. This validation
      pattern is established across all similar features and provides confidence in feature
      correctness before git integration.

