# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 137 validates the Sheep platform's ability to create files with strict technical
  requirements (UTF-8 without BOM, Unix LF line endings) and integrate reliably with git
  workflows. This is the 137th iteration of an established pattern; codebase has 137+
  validation examples confirming the technical approach.

  Implementation is self-contained: creates only `test-narzc3.md` at repository root, does not
  modify any existing files or application source code in `/src/sheep/`.

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text() with Explicit Encoding

  **Chosen**: `Path(filename).write_text(content, encoding='utf-8', newline='\n')`

  **Why**:
  - pathlib provides cleanest, most Pythonic file I/O interface
  - Explicit `encoding='utf-8'` ensures UTF-8 without BOM (only 'utf-8-sig' adds BOM)
  - Explicit `newline='\n'` forces Unix LF on all platforms, bypassing OS defaults
  - Directly satisfies NFR-1 (UTF-8 without BOM) and NFR-2 (Unix LF) from spec
  - Established pattern in 136+ identical features confirms this is standard approach

  **Rejected**:
  - Built-in `open()` — requires more boilerplate, less concise
  - Low-level `os.open()` — unnecessary complexity for single file write
  - Shell commands via subprocess — platform-dependent, harder to control encoding

  ### 2. Content Generation: Hardcoded Prose

  **Chosen**: Create markdown with hardcoded H1 heading and 2-3 sentences of prose

  **Why**:
  - Spec permits any topic ("about anything") — no specific content requirement
  - Hardcoded content is deterministic, reproducible, requires no external dependencies
  - All 136+ identical features use hardcoded prose with different topics
  - Simple string concatenation: `# Heading\n\n<2-3 sentences>` format

  **Rejected**:
  - AI/LLM-generated prose — external API dependency, latency, complexity
  - Template system — unnecessary overhead for single-file feature
  - Random topic selection — adds complexity without clear benefit

  ### 3. Validation Strategy: Binary + Text Two-Phase Approach

  **Chosen**: Binary validation (BOM/CRLF detection) followed by text validation (structure check)

  **Why**:
  - Binary validation detects encoding issues invisible in text mode
    - BOM bytes: b'\xef\xbb\xbf'
    - CRLF bytes: b'\r\n'
  - Text validation confirms correct structure
    - H1 heading on line 1
    - Blank line on line 2
    - Exactly 2-3 sentences of prose
  - Validates file meets all hard requirements before committing to git
  - Prevents invalid files from being silently committed
  - Established pattern across all similar features (136+)

  **Rejected**:
  - Skip validation — risky; could silently produce non-compliant files
  - Text-only validation — cannot reliably detect encoding issues
  - External tools — adds subprocess overhead unnecessarily

  ### 4. Git Integration: subprocess.run() with check=True

  **Chosen**: `subprocess.run(['git', 'command', ...], check=True)` for all git operations

  **Why**:
  - Standard, safe approach for git automation in Python
  - check=True raises CalledProcessError on failure — clean error semantics
  - Prevents shell injection vulnerabilities (no shell=True)
  - Works cross-platform (Windows, macOS, Linux)
  - No external dependencies (subprocess is stdlib)
  - All 136+ identical features use subprocess for git

  **Rejected**:
  - GitPython library — introduces external dependency not in codebase
  - Shell commands with shell=True — security risk, less reliable
  - Direct git manipulation (Dulwich) — excessive complexity for simple operations

  ### 5. Error Handling: Strict Propagation

  **Chosen**: subprocess.run(check=True) raises exceptions on any git command failure

  **Why**:
  - Spec requires ALL git operations to succeed
  - Strict error handling reports failures immediately
  - Prevents partial/broken repository state from persisting undetected
  - Established pattern in 136+ identical features

  **Rejected**:
  - Retry logic — unnecessary for local git operations
  - Graceful degradation — violates spec requirement for changes to be pushed

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 → Phase 2 → Phase 3** is the logical, sequential progression:

  1. **Phase 1** (Content & File Creation) comes first
     - Creates the file that Phases 2 and 3 depend on
     - Failure here means no file to validate or commit

  2. **Phase 2** (Validation) comes before Phase 3
     - Validates file meets all requirements before git integration
     - Catches encoding/structure issues early, preventing invalid commits
     - Cheaper to fix file content than fix repository state after bad commit

  3. **Phase 3** (Git Integration) comes last
     - Only executes after file is validated
     - By this point, we're confident the file is correct
     - Adds file to repo in clean, well-defined state

  ### Canonical Implementation Flow

  ```
  1. Create content string (H1 heading + blank line + 2-3 sentences)
  2. Write file using pathlib with encoding='utf-8' and newline='\n'
  3. Validate binary encoding (check for BOM, CRLF)
  4. Validate text structure (H1, blank, prose structure)
  5. If validation fails, raise exception with clear error message
  6. Stage file: subprocess.run(['git', 'add', 'test-narzc3.md'], check=True)
  7. Commit file: subprocess.run(['git', 'commit', '-m', 'feat(137): ...'], check=True)
  8. Push to origin: subprocess.run(['git', 'push', '-u', 'origin', branch], check=True)
  9. Exit with success
  ```

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding wrong or BOM present | Binary validation checks for BOM bytes (b'\xef\xbb\xbf'); explicit encoding='utf-8' parameter prevents BOM insertion |
  | File has CRLF instead of LF | Binary validation checks for CRLF bytes (b'\r\n'); explicit newline='\n' forces LF on all platforms |
  | File structure incorrect | Text validation verifies H1 on line 1, blank line 2, exactly 2-3 sentences of prose before git operations |
  | Git commands fail silently | Use subprocess.run(check=True) to raise CalledProcessError on any failure; no partial/broken states |
  | File already exists | Implementation overwrites file (consistent with established pattern); spec doesn't require idempotent skip |
  | Repository not in clean state | Caller responsibility to ensure clean feature branch before execution |
  | Network failure during push | subprocess.run(check=True) raises CalledProcessError; caller can retry or handle failure |
  | Commit message has special characters | Hardcoded message ("feat(137): Create markdown file test-narzc3.md") has no special characters; no escaping needed |
  | Python version incompatibility | pathlib and subprocess available in Python 3.11+ stdlib; no compatibility issues |
  | File I/O permissions denied | Will raise OSError; caller responsibility to ensure write permissions on repo root |

