content: |
  ## Summary

  Implementation requires 4 sequential tasks across 3 phases, total estimated effort 45 minutes:

  **Phase 1 — File Creation (Task 1, ~10min)**
  Create the markdown file with hardcoded content using pathlib.Path.write_text() with
  explicit encoding='utf-8' and newline='\\n' to enforce UTF-8 without BOM and Unix LF
  line endings on all platforms.

  **Phase 2 — Validation (Task 2, ~12min)**
  Implement two-phase validation: binary checks (verify no BOM bytes b'\\xef\\xbb\\xbf',
  no CRLF bytes b'\\r\\n') and text checks (verify H1 heading on line 1, blank line 2,
  exactly 2-3 sentences of prose). Raises ValueError if any check fails.

  **Phase 3 — Git Integration (Tasks 3-4, ~23min)**
  Task 3 (~12min): Implement git operations using subprocess.run(check=True) to stage file,
  create conventional commit, and push to origin on feature branch.
  Task 4 (~11min): Create main() function to orchestrate all phases, verify end-to-end
  correctness, and exit with appropriate status code.

  Each task follows TDD cycle (RED-GREEN-REFACTOR) to ensure correctness. Tasks are ordered
  by dependency: Task 1 creates file → Task 2 validates it → Task 3 integrates with git →
  Task 4 orchestrates all together.

  ## Task Dependencies

  ```
  Task 1 (Create file)
      ↓
  Task 2 (Validate file)
      ↓
  Task 3 (Git integration)
      ↓
  Task 4 (End-to-end verification)
  ```

  All tasks are sequential (no parallelization possible). Each task depends on previous
  task completing successfully.

  ## Acceptance Criteria Summary

  - File test-narzc3.md created at repository root with correct content
  - File encoded as UTF-8 without BOM, using Unix LF line endings
  - File structure: H1 heading, blank line, 2-3 sentences of prose
  - Validation catches encoding/structure issues and raises clear exceptions
  - Git operations: add → commit with conventional message → push to origin
  - End-to-end flow works correctly with all phases integrated
  - Script exits with code 0 on success, code 1 on any failure

  ## Effort Breakdown

  - Task 1: 10 minutes (file creation with pathlib)
  - Task 2: 12 minutes (binary + text validation)
  - Task 3: 12 minutes (git add/commit/push with subprocess)
  - Task 4: 11 minutes (orchestration + end-to-end verification)
  - **Total: 45 minutes** (~3/4 hour)

  This aligns with the feature's size estimate of "S" (Small, 10-15 minutes of actual work),
  with some overhead for validation and testing infrastructure that ensures robustness.

