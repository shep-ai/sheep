content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-narzc3.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is the 137th iteration of the markdown-file-creation pattern established in features 63-136, with identical requirements and implementation approach. The feature serves as a minimal, testable unit of work for the automated implementation system, validating the platform's core capabilities across hundreds of repetitions.

  ## Success Criteria

  - [ ] File `test-narzc3.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content, separated from heading by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git using `git add test-narzc3.md`
  - [ ] Git commit with conventional commit message created: `feat(137): Create markdown file test-narzc3.md`
  - [ ] Commit is created on the feature branch `feat/137-markdown-file-creation-646f97`
  - [ ] Changes are pushed to remote origin repository
  - [ ] No other files have been modified or created

  ## Functional Requirements

  - **FR-1: File Creation** — Create a markdown file named `test-narzc3.md` in the repository root directory (where pyproject.toml and README.md are located)
  - **FR-2: Markdown H1 Heading** — File must begin with exactly one markdown H1 heading (single `#` symbol followed by heading text); this heading serves as the title
  - **FR-3: Prose Content** — File must contain exactly 2-3 sentences of prose content separated from the heading by a single blank line
  - **FR-4: Content Structure** — File structure must follow: `# Heading\n\n<sentence 1>. <sentence 2>. [<sentence 3>.]`
  - **FR-5: Git Staging** — File must be staged in git using `git add test-narzc3.md`
  - **FR-6: Conventional Commit** — Create a git commit with the conventional commit message: `feat(137): Create markdown file test-narzc3.md`
  - **FR-7: Feature Branch** — Commit must be created on feature branch `feat/137-markdown-file-creation-646f97` (pre-created by platform)
  - **FR-8: Remote Push** — Changes must be pushed to the remote origin repository on the feature branch

  ## Non-Functional Requirements

  - **NFR-1: File Encoding** — File must be encoded as UTF-8 without BOM (Byte Order Mark); no alternative encodings or BOM prefixes permitted
  - **NFR-2: Line Endings** — File must use Unix-style LF (`\n`) line endings; Windows CRLF (`\r\n`) or other line ending styles are not permitted
  - **NFR-3: File Size** — File should be approximately 400-600 bytes; content should be concise and within expected prose length
  - **NFR-4: Isolation** — Only `test-narzc3.md` may be created; no other files may be created, modified, or deleted during this feature's implementation
  - **NFR-5: Idempotency** — Implementation must work reliably and consistently; repeated implementations of similar features (63-136) must follow identical patterns
  - **NFR-6: No Source Code Impact** — Implementation must not modify, create, or delete any files in `/src/sheep/` directory or other application source code
  - **NFR-7: Git State** — Implementation must not introduce uncommitted changes, merge conflicts, or detached HEAD state; repository must be in clean state after completion

  ## Product Questions & AI Recommendations

  | # | Question | Resolution | Rationale |
  | - | -------- | ---------- | --------- |
  | 1 | Are there any ambiguous implementation decisions? | No — Feature fully specified | Pattern is well-established across 136+ identical features with zero ambiguities: file location is repo root (fixed), filename is test-narzc3.md (fixed), heading format is markdown H1 (fixed), prose count is 2-3 sentences (fixed), encoding is UTF-8 LF (fixed), commit message format is conventional (fixed), branch is pre-created (fixed). Implementer has only one meaningful choice: topic/content selection, which is intentionally left flexible per the original request (\"about anything\"). |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:

  - **Repository root**: Contains 120+ test markdown files (test-*.md) following a consistent pattern, representing completed features 63-136
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/137-markdown-file-creation-646f97/)
  - **src/sheep/**: Application source code for the CrewAI-based agentic platform (agents, flows, tools, observability)
  - **.github/**: GitHub Actions workflow configuration
  - **README.md**: Project documentation
  - **pyproject.toml**: Python project configuration (dependencies, build metadata)

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature pattern and serve as validation artifacts for the Sheep platform's automation capabilities.

  ### Architecture Patterns

  **Established File Creation Pattern** (136+ precedents):

  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes
  - Implementation is straightforward: generate title → generate content → write to file

  **Git Workflow Pattern**:

  - Feature branch pre-created as `feat/137-markdown-file-creation-646f97`
  - Create file in working directory
  - Stage with `git add test-narzc3.md`
  - Commit with conventional commit format: `feat(137): Create markdown file test-narzc3.md`
  - Push to feature branch
  - No modifications to source code (/src/sheep/), configuration files, or tests

  **Feature Implementation Pattern** (observed in features 63-136):

  - Minimal, isolated changes affecting only repository root directory
  - No dependencies on application source code
  - No test modifications, no configuration changes
  - Single-file operations with straightforward file I/O
  - Consistent prose formatting with varied topics chosen by implementer

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (e.g., `Path("test-narzc3.md").write_text(content)`)
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content
  - **Conventional Commits**: Git commit message format (feat/fix/docs etc.)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-narzc3.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 63-136; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Spec file exists in specs/137-markdown-file-creation-646f97/; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/137-markdown-file-creation-646f97` (pre-created)
  - **File system**: Write access to repository root directory
  - **Established pattern**: 136+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~5 minutes (choose topic, write one H1 heading + 2-3 sentences of prose)
  - **File creation**: ~2 minutes (write markdown file to disk with proper UTF-8 encoding and LF line endings)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Verification**: ~2 minutes (confirm file exists, has correct content, and is properly committed)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:

  - Well-established pattern with 136+ identical test files providing clear, proven precedent
  - Flexible topic selection with no research, architectural decisions, or design work needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - No dependencies to resolve or integrate
  - Git history demonstrates similar features (63-136) completed efficiently in 10-15 minutes
  - No special skills or deep codebase knowledge required

