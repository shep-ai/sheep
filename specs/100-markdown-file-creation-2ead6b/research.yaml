# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. Content Generation Method

  **Chosen:** Claude API via CrewAI LLM framework (existing integration in codebase)

  **Rejected:**
  - Static/hardcoded content — Less flexible, doesn't leverage existing infrastructure, reduces novelty across 100+ test files
  - Other LLM providers (OpenAI, Anthropic alternatives) — Misaligned with established codebase architecture standardized on Claude

  **Rationale:** The codebase already provides a robust, tested content generation pipeline in `src/sheep/content_generators.py` using Claude API via CrewAI. The `generate_markdown_content()` function handles the complete workflow: prompt engineering, API interaction, response parsing, and validation. This integration has been validated across 99+ prior features (069-099) and provides reliable, flexible content generation without introducing new dependencies or architectural complexity.

  ### 2. File I/O Library

  **Chosen:** Python `pathlib.Path` (standard library)

  **Rejected:**
  - `os.path` module — More verbose, less modern, inconsistent with existing code patterns
  - Direct `open()` with string paths — Lower-level, lacks convenience methods for path manipulation

  **Rationale:** The codebase consistently uses `pathlib.Path` throughout (file_tools.py, content_generators.py). It provides cross-platform path handling, a modern object-oriented API, and methods like `.parent`, `.exists()`, `.stat()`. The write operation specifies UTF-8 encoding explicitly, aligning with NFR-1 (UTF-8 without BOM). No additional dependencies required (stdlib in Python 3.4+).

  ### 3. Git Operations

  **Chosen:** Subprocess-based git command execution (existing pattern in `src/sheep/tools/git_tools.py`)

  **Rejected:**
  - GitPython library — Would introduce new external dependency; subprocess approach aligns with established codebase patterns and provides better error granularity
  - Direct libgit2 bindings — Overkill for simple operations (add, commit, push), adds complexity

  **Rationale:** The codebase implements git operations via subprocess in git_tools.py (GitCommitTool, GitPushTool classes). This approach provides: fine-grained control over git command arguments and output capture, clear error handling with stderr/stdout separation, no external dependencies beyond the git CLI (universal in dev environments), and direct alignment with 99+ prior implementations. The required git operations are straightforward and don't require higher-level abstractions.

  ### 4. Commit Message Format

  **Chosen:** Conventional commit with feature number scope: `feat(100): create markdown file test-h49uqm.md with prose content`

  **Rejected:**
  - `feat:` without scope — Loses feature tracking context
  - `feat(feature-name):` without number — Less precise for automated tracking

  **Rationale:** Analysis of recent commits (via `git log --oneline`) shows consistent pattern: `feat(099):`, `feat(098):`, `feat(097):` from features 099-097. The scope number enables automated feature tracking and clear association between commits and feature specs. Conventional commit format is industry standard and supports automated tooling.

  ### 5. Encoding and Line Endings

  **Chosen:** UTF-8 without BOM, LF line endings (Unix standard)

  **Rejected:**
  - UTF-8 with BOM — Unnecessary for UTF-8, creates parsing complications
  - CRLF line endings — Causes normalization issues across platforms and version control

  **Rationale:** Specifications NFR-1 and NFR-2 explicitly require UTF-8 without BOM and LF line endings. The validation function in content_generators.py (lines 186-198) enforces these requirements. This is standard in Unix/Linux git repositories to prevent line ending normalization issues. Python's pathlib write operation naturally produces LF on Unix systems.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | pathlib (stdlib) | File path operations and I/O | Use | Consistent with existing codebase, no extra dependencies, modern API |
  | subprocess (stdlib) | Git command execution | Use | Existing pattern in codebase, fine-grained control, no extra deps |
  | CrewAI framework | Agent and tool orchestration | Use | Already integrated in project for agent coordination |
  | Claude API (via CrewAI) | Markdown content generation | Use | Tested integration across 99+ features, reliable, flexible |
  | Git CLI | Version control operations | Use | Universal in dev environments, subprocess wrapper provides good abstraction |

  **No new external dependencies required.** All tooling is already integrated and validated.

  ## Security Considerations

  ### Path Traversal Prevention
  The `write_markdown_file()` function in content_generators.py (lines 116-118) validates the filename:
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```
  This prevents directory traversal attacks. The feature requires writing only to repository root with a specific filename (`test-h49uqm.md`), so this validation is sufficient.

  ### File Encoding Security
  UTF-8 encoding without BOM prevents encoding-based injection attacks and ensures consistent parsing across tools and platforms. The validation in `validate_markdown_file()` (lines 186-194) explicitly checks for BOM and valid UTF-8 decoding.

  ### Git Command Execution
  The subprocess approach in git_tools.py constructs git commands as lists (not shell strings), preventing shell injection attacks. Arguments are passed as separate elements to `subprocess.run()`, which is the secure approach.

  ### Content Validation
  The `validate_markdown_content()` and `validate_markdown_file()` functions perform comprehensive validation:
  - H1 heading presence and position
  - Blank line separator verification
  - Sentence count validation (2-3 sentences)
  - File size bounds (320-600 bytes per spec)
  - Encoding and line ending verification

  These validations ensure content meets all functional and non-functional requirements before commit/push.

  ## Performance Implications

  ### Bottleneck Analysis
  1. **Claude API call** — ~1-5 seconds (dominant factor)
  2. **File I/O operations** — <1 second (pathlib write is fast)
  3. **File validation** — <1 second (binary read and string parsing)
  4. **Git operations** — <1 second each (local operations)

  **Total expected execution time:** ~10-15 minutes per spec estimate (dominated by API latency)

  ### Optimization Opportunities
  - Subprocess git operations are already optimal for this use case (no batch processing benefit)
  - File I/O pathlib operations are already optimized (no caching needed for single file)
  - API response times cannot be optimized without changing LLM provider (not recommended)

  The implementation is I/O-bound on API latency, not CPU-bound, so no optimization is needed or beneficial.

  ## Architecture Integration

  ### Alignment with Existing Patterns
  The implementation strictly follows patterns established in features 069-099:
  - Content generation via Claude API (content_generators.py)
  - File operations via pathlib (consistent with file_tools.py)
  - Git operations via subprocess (consistent with git_tools.py)
  - Markdown validation (existing validate_markdown_file() function)
  - Conventional commit format with scope number (established precedent)

  ### Data Flow
  1. **Content Generation** — Claude API generates markdown via CrewAI
  2. **File Creation** — pathlib.Path writes content to `test-h49uqm.md` at repo root
  3. **Validation** — Existing validate_markdown_file() checks all requirements
  4. **Git Staging** — `git add test-h49uqm.md` via subprocess
  5. **Git Commit** — `git commit -m "feat(100): ..."` via subprocess
  6. **Git Push** — `git push -u origin feat/100-markdown-file-creation-2ead6b` via subprocess

  All operations are sequential and atomic — no concurrency concerns.

  ### Integration Points
  - **CrewAI agents:** Can invoke content_generators.create_markdown_file() function
  - **Git repository:** Feature branch `feat/100-markdown-file-creation-2ead6b` pre-exists
  - **File system:** Standard Unix/Linux file operations, cross-platform via pathlib
  - **CI/CD:** Git push triggers standard GitHub Actions workflows (pre-existing)

