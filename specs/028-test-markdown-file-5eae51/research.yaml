# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-15

  ## Technology Decisions

  ### 1. Test Framework and File Path Resolution

  **Chosen:** Pytest with pathlib.Path for file resolution from repository root

  **Rejected:**
  - Custom test runner — breaks consistency with extensive existing pytest infrastructure across the repository
  - os.path module — pathlib is more modern, type-safe, and is the established convention in all existing markdown tests

  **Rationale:** The codebase uses pytest exclusively for validation testing. Every markdown validation test
  follows the same pattern: import pathlib.Path, define REPO_ROOT as `Path(__file__).parent.parent`, define the
  file path as a module-level constant, and use pytest assertions for validation. This consistency reduces cognitive
  load, leverages familiar tools, and ensures the test infrastructure integrates seamlessly with the existing CI/CD
  pipeline (tests run via `pnpm test` which invokes pytest).

  ### 2. Test Scope: Minimal Structural Testing

  **Chosen:** Test only file existence, H1 heading presence, and newline termination

  **Rejected:**
  - Content validation (topic-specific keywords, sentence count) — not required by spec; adds maintenance burden
  - File size constraints (< 80 lines) — not required by the "minimal testing" requirement in the spec
  - Topic-specific assertions — the spec explicitly chose "general topic" with no specialized validation

  **Rationale:** The feature specification explicitly resolved the open question "Should the test file include content
  validation beyond basic structural checks?" with the answer "Minimal testing (structural only)." The rationale given
  was that "established repository patterns focus on structural validation" and this "keeps the test simple and consistent
  with existing conventions." While some tests in the repository include topic-specific validations (e.g.,
  test_weather_forecasting_guide.py checks for the word "weather"), these are optional enhancements. The minimal set
  of assertions—file existence, H1 heading, and newline—are sufficient to validate that the markdown file meets the
  structural requirements specified in the feature (exactly one H1 heading and content ending with newline).

  ### 3. Markdown Content Structure

  **Chosen:** Simple format with single H1 heading as title and 2-3 sentences of body content

  **Rejected:**
  - Multiple sections with subheadings — unnecessary complexity; feature requires only a title and content
  - Bullet lists, code blocks, or rich formatting — out of scope; the feature specifies simple sentence-based content
  - Topic-specific templates or structured data — the spec chose "general topic" to maintain flexibility

  **Rationale:** All existing content markdown files in the repository follow this minimal structure. Examples:
  - test-quk4of.md: "# The Power of Curiosity" + 1 sentence + blank line
  - weather-forecasting-vhiwx5.md: "# Weather Forecasting Care Instructions" + 1 sentence + blank line

  This format is easy to read, simple to validate, and consistent with the established convention. The feature
  explicitly requires "2-3 complete sentences of content below the title heading," which this structure provides.

  ### 4. File Naming Convention

  **Chosen:** Kebab-case with 6-character alphanumeric suffix: test-5v39c6.md

  **Rejected:**
  - snake_case or Snake_Case naming — inconsistent with all existing markdown files
  - Simple names without suffix (test.md) — collides with existing patterns and reduces uniqueness

  **Rationale:** The feature specification explicitly specifies the filename as `test-5v39c6.md`. The codebase
  demonstrates a clear convention: all content markdown files use lowercase kebab-case with 6-character random
  alphanumeric suffixes. Examples: weather-forecasting-vhiwx5.md, cloud-computing-xwbxsh.md, nautical-knots-ii4zkr.md,
  embossing-j1qx9z.md. This convention ensures uniqueness, prevents naming collisions, and maintains visual consistency.

  ### 5. Test File Naming and Location

  **Chosen:** Name: test_test_5v39c6.py; Location: tests/ directory

  **Rejected:**
  - Alternate naming (test_5v39c6_markdown.py or test_5v39c6_content.py) — inconsistent with codebase pattern
  - Subdirectories within tests/ — all markdown validation tests are in the root tests/ directory

  **Rationale:** The established pattern for test naming is test_[semantic description].py where the description
  relates to the markdown file's purpose or name. For test-5v39c6.md, the test file is test_test_5v39c6.py. All
  markdown validation tests reside in tests/ without subdivision: test_weather_forecasting_guide.py,
  test_cloud_computing_timeline.py, test_embossing_comparison.py, etc. This flat structure makes tests easy to
  discover, organize, and run together with the overall test suite.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | Pytest | Test framework and assertions | Use | Already the standard test infrastructure across the codebase; extensive existing test suite uses pytest; integrates with pnpm test |
  | pathlib.Path | File path resolution | Use | Modern, type-safe Python standard library; established convention in all existing markdown tests; eliminates relative path issues |
  | Python (3.11+) | Test implementation language | Use | Already the language of the test infrastructure; matches existing codebase requirements |
  | Markdown | Content format | Use | Plain text, human-readable, supported by GitHub and documentation tools; established pattern for all content files |

  ## Security Considerations

  **File Creation and Integrity:**
  - Markdown files are plain text files with no executable content; no code execution risk
  - Tests use pathlib for safe path resolution, preventing directory traversal vulnerabilities
  - Files are committed to version control; changes are tracked and auditable

  **Testing Infrastructure:**
  - Tests read files using standard Python file I/O with explicit UTF-8 encoding
  - No external API calls or network requests; testing is purely local
  - Assertions use simple string operations; no eval() or other dangerous patterns

  **Risk Assessment:** Minimal. This feature adds only static content and validation tests. No security implications
  beyond standard file system access controls.

  ## Performance Implications

  **Test Execution:**
  - Three simple assertions per test (file existence, H1 heading check, newline validation)
  - Total test runtime: < 1ms per test (pathlib.Path operations are highly optimized)
  - No I/O performance issues: reading a small markdown file is negligible

  **Content Size:**
  - Markdown file: ~150-300 bytes (title + 2-3 sentences)
  - Test file: ~400-500 bytes (three test functions + imports)
  - No impact on repository size or build times

  **Caching and Optimization:**
  - No caching required; files are static and small
  - pytest automatically parallelizes independent tests; no sequential dependencies
  - No performance bottlenecks identified

  **Conclusion:** This feature has negligible performance impact. The test runs in microseconds, and the markdown
  file contributes minimal storage overhead.

  ## Architecture Notes

  ### Integration with Existing Patterns

  **Test Infrastructure:**
  - Fits seamlessly into the existing pytest-based validation framework
  - Uses the same file resolution pattern (pathlib.Path from REPO_ROOT) as all other markdown tests
  - No modifications to test configuration, CI/CD pipelines, or build scripts needed

  **Content Organization:**
  - Markdown file placed at repository root alongside other content files (test-quk4of.md, weather-forecasting-vhiwx5.md, etc.)
  - No changes to directory structure; follows the established flat organization

  **No Code Dependencies:**
  - Feature creates only content and tests; does not modify application code
  - No imports from src/sheep or other application modules
  - Does not affect build, deployment, or runtime behavior

  ### How This Fits into the Broader System

  The Sheep repository uses markdown files for documentation and examples, with corresponding pytest-based
  tests to validate structure and content. This feature follows the established pattern:

  1. **Content Creation:** Add a markdown file with a title and brief content
  2. **Test Creation:** Add a pytest test file to validate the markdown structure
  3. **Validation:** Tests ensure consistency with established patterns (H1 heading, newline termination, file existence)
  4. **Quality Assurance:** All tests run in the CI/CD pipeline (pnpm test, pnpm lint)

  This approach ensures documentation remains consistent, validates that new content follows conventions, and prevents
  accidental formatting issues or missing files.

  ## Summary

  The implementation is straightforward and follows established conventions:

  - **Test Framework:** Pytest with pathlib.Path (existing infrastructure)
  - **Test Scope:** Minimal structural validation (file existence, H1 heading, newline)
  - **Content Format:** Single H1 title + 2-3 sentences (established pattern)
  - **File Naming:** Kebab-case with suffix (repository convention)
  - **Dependencies:** None (uses only Python standard library and existing pytest framework)
  - **Security:** No risks; static content only
  - **Performance:** Negligible impact

  No technical blockers or unusual decisions required. The feature is ready for implementation.
