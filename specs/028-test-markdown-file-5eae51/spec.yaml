# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository contains multiple markdown files at the root level with associated test files in the `tests/` directory. This feature requires creating a new markdown file named `test-5v39c6.md` containing a title and 2-3 sentences about any topic, following the established pattern used throughout the repository (e.g., `test-quk4of.md`, `weather-forecasting-vhiwx5.md`).

  ## Codebase Analysis

  ### Project Structure

  - **Root Directory**: Contains markdown files (JOKE.md, CLASSIC_JOKE.md, test-quk4of.md, weather-forecasting-vhiwx5.md, etc.)
  - **tests/**: Contains test files validating markdown files, using pytest. Each markdown file has a corresponding test file (e.g., `test_weather_forecasting_guide.py` validates `weather-forecasting-vhiwx5.md`)
  - **specs/**: Feature specifications in YAML format
  - **src/sheep/**: Main application code (agents, flows, tools, config, observability)

  ### Architecture Patterns

  - **Test-Driven Structure**: Each content file (markdown) has a corresponding test file that validates:
    - File exists at expected location
    - Contains H1 heading (`# Title`)
    - Ends with newline character
    - Meets topic-specific content requirements
    - Optional: file size constraints (< 80 lines for short files)
  - **Convention Over Configuration**: Test files follow a consistent pattern - they use `pathlib.Path` to locate files from the repo root and apply standard assertions
  - **Markdown Naming**: Files use kebab-case with random suffixes (e.g., `weather-forecasting-vhiwx5.md`, `test-quk4of.md`)

  ### Relevant Technologies

  - **Python 3.11+**: Test infrastructure uses Python with Pytest
  - **Markdown**: Plain markdown format for content files
  - **Pytest**: Test framework used to validate markdown files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | High | New markdown file `test-5v39c6.md` will be created here |
  | tests/ directory | High | New test file `test_test_5v39c6.py` must be created to validate the markdown file |
  | No source code | None | This feature only adds content and tests, does not modify application code |

  ## Dependencies

  - **No external dependencies**: The feature only requires creating markdown content and a simple test file
  - **Depends on**: Established file naming and test patterns in the repository

  ## Success Criteria

  - [ ] Markdown file `test-5v39c6.md` exists at repository root
  - [ ] File contains an H1 heading (`# Title`)
  - [ ] File contains 2-3 sentences of content
  - [ ] File ends with a newline character
  - [ ] Test file `test_test_5v39c6.py` exists in tests/ directory
  - [ ] Test file validates file existence, H1 heading, and newline termination
  - [ ] All tests pass: `pnpm test`
  - [ ] No lint errors: `pnpm lint`

  ## Size Estimate

  **S** — This is a straightforward task requiring:
  1. Creation of one simple markdown file (~100 bytes) with a title and 2-3 sentences
  2. Creation of one test file (~200-300 bytes) following the established pattern
  3. No modifications to existing code or complex logic required
  - Estimated effort: Under 1 hour
