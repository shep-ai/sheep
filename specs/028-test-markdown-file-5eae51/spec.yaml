# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository contains multiple markdown files at the root level with associated test files in the `tests/` directory. This feature requires creating a new markdown file named `test-5v39c6.md` containing a title and 2-3 sentences about any topic, following the established pattern used throughout the repository (e.g., `test-quk4of.md`, `weather-forecasting-vhiwx5.md`). This task ensures the repository continues to grow with documented content while maintaining consistent test coverage.

  ## Codebase Analysis

  ### Project Structure

  - **Root Directory**: Contains markdown files (JOKE.md, CLASSIC_JOKE.md, test-quk4of.md, weather-forecasting-vhiwx5.md, etc.)
  - **tests/**: Contains test files validating markdown files, using pytest. Each markdown file has a corresponding test file (e.g., `test_weather_forecasting_guide.py` validates `weather-forecasting-vhiwx5.md`)
  - **specs/**: Feature specifications in YAML format
  - **src/sheep/**: Main application code (agents, flows, tools, config, observability)

  ### Architecture Patterns

  - **Test-Driven Structure**: Each content file (markdown) has a corresponding test file that validates:
    - File exists at expected location
    - Contains H1 heading (`# Title`)
    - Ends with newline character
    - Meets topic-specific content requirements
    - Optional: file size constraints (< 80 lines for short files)
  - **Convention Over Configuration**: Test files follow a consistent pattern - they use `pathlib.Path` to locate files from the repo root and apply standard assertions
  - **Markdown Naming**: Files use kebab-case with random suffixes (e.g., `weather-forecasting-vhiwx5.md`, `test-quk4of.md`)

  ### Relevant Technologies

  - **Python 3.11+**: Test infrastructure uses Python with Pytest
  - **Markdown**: Plain markdown format for content files
  - **Pytest**: Test framework used to validate markdown files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | High | New markdown file `test-5v39c6.md` will be created here |
  | tests/ directory | High | New test file `test_test_5v39c6.py` must be created to validate the markdown file |
  | No source code | None | This feature only adds content and tests, does not modify application code |

  ## Dependencies

  - **No external dependencies**: The feature only requires creating markdown content and a simple test file
  - **Depends on**: Established file naming and test patterns in the repository

  ## Success Criteria

  - [ ] Markdown file `test-5v39c6.md` exists at repository root
  - [ ] File contains exactly one H1 heading as the title
  - [ ] File contains 2-3 sentences of meaningful content below the heading
  - [ ] File ends with a newline character
  - [ ] Test file `test_test_5v39c6.py` exists in tests/ directory
  - [ ] Test file validates file existence at expected location
  - [ ] Test file validates H1 heading presence
  - [ ] Test file validates newline termination
  - [ ] All tests pass: `pnpm test`
  - [ ] No lint errors: `pnpm lint`
  - [ ] Implementation follows established repository patterns for markdown naming and test structure

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-5v39c6.md` in the repository root directory
  - **FR-2**: The markdown file must contain exactly one H1 heading (prefixed with `#`) as the title
  - **FR-3**: The markdown file must contain 2-3 complete sentences of content below the title heading
  - **FR-4**: The markdown file must end with a newline character (no trailing text without newline)
  - **FR-5**: Create a corresponding test file named `test_test_5v39c6.py` in the `tests/` directory
  - **FR-6**: The test file must verify that the markdown file exists at the expected location using pathlib.Path
  - **FR-7**: The test file must verify the presence of an H1 heading in the markdown file
  - **FR-8**: The test file must verify that the markdown file ends with a newline character
  - **FR-9**: All tests must pass when executed via `pnpm test`
  - **FR-10**: The code must pass linting checks when executed via `pnpm lint`

  ## Non-Functional Requirements

  - **NFR-1**: Follow established repository patterns for markdown file naming (kebab-case with random alphanumeric suffix)
  - **NFR-2**: Follow established pytest conventions and patterns used in existing test files (e.g., pathlib.Path for file location resolution, standard assertion patterns)
  - **NFR-3**: Markdown file should be minimal and focused (following the convention of keeping content files under 80 lines)
  - **NFR-4**: Test file should be concise and maintainable, matching the structure and complexity level of existing markdown tests
  - **NFR-5**: Content should be meaningful and coherent, not placeholder text, to demonstrate professional documentation standards

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the markdown file content cover? | General topic | Provides maximum flexibility, allows meaningful accessible content, aligns with diverse topics in existing files |
  | 2 | Should the test file include content validation beyond structural checks? | Minimal testing (structural only) | Keeps tests simple and consistent with established repository patterns that focus on format validation |

  ## Size Estimate

  **S** — This is a straightforward task requiring:
  1. Creation of one simple markdown file (~100 bytes) with a title and 2-3 sentences
  2. Creation of one test file (~200-300 bytes) following the established pattern
  3. No modifications to existing code or complex logic required
  - Estimated effort: Under 1 hour
