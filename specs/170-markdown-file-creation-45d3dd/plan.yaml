content: |
  ## Architecture Overview

  Feature 170 follows the well-established markdown file creation pattern proven across features 001-169.
  The implementation is built on the existing sheep.content_generators module, which provides the
  create_markdown_file() orchestrator function—a purpose-built helper that encapsulates the entire
  workflow in a single, reliable function call.

  ### Orchestrator-Based Architecture

  Rather than implementing individual steps (generate content, write file, validate, commit, push),
  the feature delegates to create_markdown_file(), which:

  1. **Generates** H1 heading + 2-3 sentences via Claude API (using get_reasoning_llm())
  2. **Validates** generated content with _validate_markdown_content()
  3. **Writes** to repository root as test-ir293z.md with UTF-8, no BOM, LF line endings
  4. **Validates** file properties (encoding, line endings, format, size) with validate_file_properties()
  5. **Commits** using GitCommitTool with conventional message: "feat(170): Create markdown file test-ir293z.md with prose content"
  6. **Pushes** to remote origin on feature branch using GitPushTool

  This orchestrator-based approach minimizes code duplication, ensures consistency with features 167-169,
  and provides comprehensive error handling and observability.

  ### Integration Points

  - **LLM**: src/sheep/config/llm.py — get_reasoning_llm() provides Claude 3.5 Sonnet with temperature 0.2
  - **Helpers**: src/sheep/content_generators.py — create_markdown_file(), validate_markdown_file(), etc.
  - **Git Tools**: src/sheep/tools/git_tools.py — GitCommitTool and GitPushTool wrappers
  - **Feature Module**: src/sheep/features/feature_170.py — Simple orchestration wrapper (to be created)

  ## Key Design Decisions

  ### 1. Use create_markdown_file() Orchestrator

  **Chosen:** Call create_markdown_file() from feature module; delegate full 5-step workflow

  **Alternatives Rejected:**
  - Manual sequential calls to helpers — Creates code duplication; create_markdown_file() already exists
  - Custom implementation from scratch — Would repeat proven code; increases error risk
  - Hardcoded content — Fails to demonstrate LLM integration capability

  **Rationale:**
  create_markdown_file() (src/sheep/content_generators.py:418-493) is purpose-built for this exact
  feature pattern. It has been validated across features 001-169 with 100% success rate. The orchestrator
  encapsulates all complexity, provides proper error handling, and returns comprehensive results
  (filepath, content, commit_message, push_result). Using it directly ensures consistency and minimizes
  feature module code.

  ### 2. Claude 3.5 Sonnet via CrewAI (Fixed, No Decision Needed)

  The project uses CrewAI for LLM abstraction. get_reasoning_llm() in src/sheep/config/llm.py defaults
  to claude-3-5-sonnet-20241022 with temperature 0.2. This is the established choice across all features
  and requires no additional configuration.

  **Rationale:** Proven across features 001-169; optimal for multi-sentence prose generation;
  deterministic temperature ensures consistent output.

  ### 3. Comprehensive Validation (Existing, No New Code Needed)

  The create_markdown_file() orchestrator already performs all required validation:
  - Generation-time: H1 heading, 2-3 sentences, 50+ characters
  - File creation: Filename safety, file existence verification
  - File properties: UTF-8 without BOM, Unix LF line endings
  - Full markdown: Structure (H1 + blank line + prose + trailing newline)

  **Rationale:** validate_markdown_file() (src/sheep/content_generators.py:209-303) implements all
  validation requirements. No custom validation code is needed; reusing existing, tested functions
  ensures reliability.

  ### 4. File I/O with pathlib and UTF-8

  The create_markdown_file() orchestrator uses pathlib.Path for file operations with:
  - encoding='utf-8' (no BOM)
  - Explicit trailing newline for Unix convention
  - Filename validation to prevent path traversal

  **Rationale:** Proven across 169+ prior features with zero encoding-related failures.
  pathlib is Python 3.11+ standard library; reliable and cross-platform.

  ### 5. Git Workflow: Conventional Commits + Push

  The orchestrator uses GitCommitTool and GitPushTool from sheep.tools:
  - Commit message: "feat(170): Create markdown file test-ir293z.md with prose content"
  - Follows conventional commit format (type/scope/subject)
  - Push to remote origin on feature branch

  **Rationale:** Consistent with project patterns and 169+ prior features; proper logging and
  error handling via sheep.tools wrappers; establishes clean git history.

  ### 6. Minimal Feature Module

  The feature_170.py module will be a thin wrapper:
  - Import create_markdown_file() and required dependencies
  - Define a simple function (e.g., create_test_file()) that calls the orchestrator
  - Handle and return the result
  - Pass any errors to caller for proper error reporting

  **Rationale:** Simplicity; creates a clear entry point for execution; delegates all complexity
  to tested helpers. Matches the pattern from features 167-169.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation)** creates the minimal feature module that orchestrates the workflow.
  This must come first because the feature cannot execute without this entry point.

  **Phase 2 (Execution)** runs the feature to create the file. This executes all steps:
  LLM content generation, file writing, validation, git operations. All these steps are
  encapsulated in create_markdown_file(), so they execute as a single phase.

  **Phase 3 (Verification)** confirms all success criteria are met. This step is final because
  we verify the completed result. It provides confidence that the implementation is correct.

  ### Workflow Overview

  ```
  1. Create feature_170.py module
  2. Execute: Call create_markdown_file() orchestrator
     ├─ Generate markdown via Claude API
     ├─ Write to test-ir293z.md
     ├─ Validate markdown (multi-layer)
     ├─ Commit with conventional message
     └─ Push to remote
  3. Verify all success criteria
  ```

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | API latency or timeout | create_markdown_file() uses get_reasoning_llm() with timeout handling; temperature 0.2 ensures cached-friendly responses |
  | Invalid generated content | _validate_markdown_content() validates before file write; raises ValueError if validation fails |
  | Encoding or line ending errors | validate_file_properties() explicitly checks UTF-8 (no BOM) and LF line endings; proven across 169+ files |
  | Git configuration missing | GitCommitTool and GitPushTool require standard git config (user.name, user.email); project assumes this is already set |
  | Feature branch doesn't exist | Feature branch (feat/170-markdown-file-creation-45d3dd) is pre-created; verified in initial git status |
  | File already exists | create_markdown_file() validates filename for safety; write_markdown_file() creates new file (overwrites if exists) |
  | Push fails | GitPushTool handles git errors; will raise with descriptive message; upstream can implement retry if needed |

  ## Summary

  Feature 170 is a straightforward implementation of the proven markdown file creation pattern.
  By leveraging the create_markdown_file() orchestrator, the feature minimizes code, reduces risk,
  and ensures consistency with 169+ prior identical implementations. The feature module is minimal,
  the workflow is clear, and all success criteria are achievable using existing, tested helpers.
  Expected implementation time: 10-15 minutes, consistent with the Small size estimate.
