content: |
  ## Summary

  Feature 170 requires three sequential tasks implementing the established markdown file creation
  pattern:

  **Task 1 (Foundation)**: Create feature_170.py module that imports and calls the
  create_markdown_file() orchestrator. This provides the entry point for feature execution.
  Expected effort: 10 minutes.

  **Task 2 (Execution)**: Run the feature module to create test-ir293z.md. The orchestrator
  handles all steps: content generation via Claude API, file writing with proper encoding,
  comprehensive validation, git commit, and push to remote. All five steps are encapsulated
  in a single orchestrator call. Expected effort: 8 minutes.

  **Task 3 (Verification)**: Verify all 10 success criteria are met. Use existing validation
  helpers and git status checks to confirm: file exists, has correct markdown format, proper
  encoding/line endings, size is within range, is staged/committed/pushed with correct message,
  and content is meaningful prose. Expected effort: 7 minutes.

  **Total effort: 25 minutes** (includes task execution + verification + buffer; implementation
  work itself is 10-15 minutes as estimated in spec).

  ## Implementation Flow

  1. **Task 1 creates feature_170.py** — defines a simple function that calls create_markdown_file()
  2. **Task 2 executes feature** — triggers the orchestrator, which runs all 5 steps and returns results
  3. **Task 3 verifies results** — checks all 10 success criteria using validation helpers and git commands

  ## Test-Driven Development Approach

  Each task follows TDD cycle:
  - **RED**: Write tests that assert desired behavior/criteria
  - **GREEN**: Implement minimal code to pass tests (or verify existing code passes)
  - **REFACTOR**: Clean up, improve, align with style

  For Task 1: Test that feature module imports correctly and function is callable.
  For Task 2: Integration test that file exists and contains expected content.
  For Task 3: Comprehensive test checking all 10 success criteria against actual file.

  ## Key Success Factors

  - Feature_170.py remains minimal; orchestrator handles all complexity
  - create_markdown_file() is the single source of truth for implementation
  - All validation is delegated to existing, tested helpers in sheep.content_generators
  - Git operations are handled by sheep.tools wrappers with proper error handling
  - No new dependencies or infrastructure required

  ## Expected Outcome

  Upon completion of all three tasks:
  - File test-ir293z.md exists at repository root
  - File contains auto-generated H1 heading + 2-3 sentences of coherent prose
  - File is properly encoded (UTF-8, no BOM) with Unix LF line endings
  - File is staged, committed with conventional message, and pushed to remote
  - All 10 success criteria are verified and passing
  - Feature branch is clean and ready for integration to main
