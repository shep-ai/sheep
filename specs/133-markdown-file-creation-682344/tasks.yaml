content: |
  ## Implementation Summary

  Six concrete tasks across three phases implement feature 133:

  **Phase 1: Module Foundation (75 minutes)**
  - Task 1.1: Create module file with imports, constants, logger, entry point signature (30m)
  - Task 1.2: Set up structured logging framework for consistent observability (45m)

  **Phase 2: Orchestrator Implementation (2 hours)**
  - Task 2.1: Implement steps 1-3 (generate, write, validate) orchestrating existing utilities (45m)
  - Task 2.2: Implement steps 4-5 (commit, push) with conventional commit messaging (45m)
  - Task 2.3: Assemble complete orchestrator function chaining all five steps (30m)

  **Phase 3: Integration & Validation (30 minutes)**
  - Task 3.1: Manual end-to-end testing verifying all requirements met (30m)

  **Total Estimated Effort: 3 hours**

  ## Workflow Overview

  Each task follows TDD cycles where applicable (tasks 1.1-2.3 have code; task 3.1 is manual testing):

  1. **RED:** Write tests that assert expected behavior
  2. **GREEN:** Implement minimal code to pass tests (call existing utilities, don't reimplements)
  3. **REFACTOR:** Clean up code, improve naming, verify consistency

  ## Task Dependencies

  ```
  task-1-1 (Create module)
    ↓
  task-1-2 (Setup logging)
    ↓
  task-2-1 (Implement steps 1-3)
    ↓
  task-2-2 (Implement steps 4-5)
    ↓
  task-2-3 (Assemble orchestrator)
    ↓
  task-3-1 (Manual validation)
  ```

  All tasks are sequential; no parallelization possible due to dependencies.

  ## Key Implementation Principles

  **Code Reuse (100%):** All orchestration steps call existing functions from content_generators.py.
  No reimplementation of file creation, validation, or git operations. Feature module is thin
  orchestration layer wrapping proven utilities.

  **Observability:** Structured logging at each step provides complete visibility into execution flow.
  All exceptions logged with full context before re-raising. Enables post-mortem analysis if failures occur.

  **Error Handling:** Fail-fast approach. Exceptions from any step propagate immediately with full logging
  context. No silent failures, retries, or workarounds that mask underlying issues.

  **Testing Strategy:** TDD cycles for code tasks (write tests first, implement to pass tests). Integration
  testing validates complete workflow. Manual testing in Phase 3 confirms all requirements met before
  integration to main branch.

  ## Expected Results

  After completing all tasks:
  - Feature module created at `/src/sheep/features/feature_133_markdown_file_creation.py`
  - Orchestrator function `create_feature_133_markdown_file()` successfully creates markdown file
  - Git commit created with conventional format: `feat(133): Create markdown file test-az5jtn.md with [topic] content`
  - Markdown file pushed to remote branch: `feat/133-markdown-file-creation-682344`
  - Complete execution flow traceable via structured logs
  - All format requirements verified: UTF-8 encoding, Unix LF line endings, trailing newline, proper structure
  - Total execution time: 3-7 seconds (well within 2-minute specification)

  ## Testing Notes

  - Unit tests validate individual steps and logging framework
  - Integration tests validate orchestrator chains steps correctly
  - Manual testing (Phase 3) validates complete workflow against specification
  - All tests should use mocking sparingly; prefer integration testing where possible
  - Structured logs are primary debugging tool if failures occur
