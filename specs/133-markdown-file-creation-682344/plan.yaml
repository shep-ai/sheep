content: |
  ## Architecture Overview

  Feature 133 extends the Sheep validation suite by creating markdown files using proven patterns from
  features 101-132. The implementation is thin orchestration that coordinates five existing utilities:

  1. **generate_markdown_content()** — Claude LLM generates H1 heading + 2-3 sentences
  2. **write_markdown_file()** — Write to disk with UTF-8 encoding, Unix LF line endings
  3. **validate_markdown_file()** — Strict format compliance (H1, blank line, 2-3 sentences, encoding, line endings)
  4. **commit_markdown_file()** — Stage and commit with conventional message `feat(133): Create markdown file test-az5jtn.md with [topic] content`
  5. **push_markdown_file()** — Push to remote with upstream tracking enabled

  All functions exist in `/src/sheep/content_generators.py` and are battle-tested across 32+ prior features.
  Feature 133 module acts as orchestrator, not implementer. Dependencies include CrewAI (LLM), structlog
  (logging), and standard library (pathlib).

  **Integration:** Feature module sits at `/src/sheep/features/feature_133_markdown_file_creation.py`,
  following naming convention from features 101-132. Single orchestrator function coordinates the workflow.
  No architectural changes to platform required.

  ## Key Design Decisions

  ### Decision 1: Standalone Module vs. Shared Orchestrator
  **Chosen:** Standalone feature module pattern

  **Rationale:** Proven across 32+ features. Refactoring existing features would exceed deduplication
  benefit. Standalone module provides feature-level isolation for testing/debugging. Established pattern
  ensures consistency and rapid execution.

  ### Decision 2: Explicit Five-Step Workflow vs. Direct Utility Calls
  **Chosen:** Explicit step-by-step orchestration with logging at each stage

  **Rationale:** Provides execution visibility. Logs identify exact failure stage if issues occur.
  Matches successful pattern from feature_127. Balances code reuse (using utilities) with explicit
  control (orchestration, logging).

  ### Decision 3: Error Handling Strategy
  **Chosen:** Fail-fast with descriptive error messages

  **Rationale:** Test validation suite requires strict compliance. Descriptive errors identify specific
  failures. Failures halt execution immediately, preventing downstream errors. Enables post-mortem analysis
  via structured logs. Matches existing validation pattern in content_generators.py.

  ### Decision 4: Content Generation Strategy
  **Chosen:** Allow Claude LLM to choose topics freely

  **Rationale:** Maximizes variety across 130+ test files. Simulates realistic usage. Reduces maintenance
  burden vs. predefined topic lists. Primary goal is reliable file creation/git workflow, not content consistency.

  ### Decision 5: File Encoding and Line Endings
  **Chosen:** Python text mode with explicit `encoding='utf-8'` parameter

  **Rationale:** Python text mode automatically produces platform-specific line endings (Unix LF on
  Unix/Linux/macOS). Explicit encoding ensures deterministic behavior. write_markdown_file() already
  implements this correctly; no custom encoding logic needed.

  ### Decision 6: Git Workflow and Commit Format
  **Chosen:** Conventional commit `feat(133): Create markdown file test-az5jtn.md with [topic] content`

  **Rationale:** Format provides feature tracking (feature number), audit trail, and follows repository
  convention established across features 101-132. GitCommitTool stages with add_all=True. GitPushTool
  pushes with set_upstream=True for proper upstream tracking.

  ### Decision 7: Structured Logging and Observability
  **Chosen:** Use `sheep.observability.logging.get_logger(__name__)` for structlog integration

  **Rationale:** Provides queryable JSON-formatted logs with full context (timestamp, level, message,
  variables). Each step logs entry/exit with structured context. Enables detailed post-mortem analysis.
  Already integrated in platform; feature module simply reuses existing infrastructure.

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 (Foundation)** establishes module structure, imports, logger, and error handling framework.
  Must come first because subsequent phases depend on proper module initialization.

  **Phase 2 (Orchestrator)** implements the five-step workflow using existing utilities. Each step
  calls a function from content_generators.py with logging. Requires Phase 1 foundation to be complete.

  **Phase 3 (Validation)** verifies end-to-end workflow. Manual testing confirms all requirements met
  before integration to main. Can only happen after Phase 2 implementation.

  ### File Creation

  **`/src/sheep/features/feature_133_markdown_file_creation.py`** (~80-100 lines):
  - Imports: content_generators, observability.logging, pathlib
  - Module constants: FEATURE_NUMBER=133, FEATURE_NAME, MARKDOWN_FILENAME="test-az5jtn.md"
  - Logger: `_logger = get_logger(__name__)`
  - Main function: `create_feature_133_markdown_file(repo_path=None)`
  - Internal helper functions for each orchestration step
  - Error handling wraps all steps
  - Return value: dict with filepath, content, commit_hash, push_result

  ### Execution Flow

  ```
  create_feature_133_markdown_file()
    ├─ Step 1: generate_markdown_content() → (title, prose)
    ├─ Step 2: write_markdown_file(content, "test-az5jtn.md") → filepath
    ├─ Step 3: validate_markdown_file(filepath) → bool or raises ValueError
    ├─ Step 4: commit_markdown_file(filepath, content, repo_path) → commit_hash
    ├─ Step 5: push_markdown_file(repo_path) → push_result
    └─ Return: successful dict or raise exception
  ```

  Each step logs entry, exit (or failure), with structured context. All exceptions propagate to caller
  with full context logged. No silent failures or auto-retries.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | LLM API failure | Blocks content generation | Exceptions logged with full context. Test suite examines logs for debugging. No retry logic masks failures. |
  | Git operation fails | Blocks commit/push | GitCommitTool/GitPushTool fail with clear errors. Feature module logs all context. Early-stage failures prevent later steps. |
  | File validation fails | Prevents commit/push | Validation before commit. Root cause visible in earlier step logs. No partial commits. |
  | Encoding/line ending issues | Format compliance | Python text mode with explicit UTF-8 handles line endings correctly. Validation checks for LF and no BOM. Deterministic across platforms. |
  | Network delays on push | Execution timeout | Total estimate 3-7 seconds; spec allows 2 minutes. Large buffer for network variations. |
  | Feature branch missing | Push fails | Branch (feat/133-markdown-file-creation-682344) already exists. GitPushTool fails with clear error if missing. |

  ## Code Quality & Testing Strategy

  **Code Reuse:** 100% — All orchestration steps use existing, production-tested functions.
  No reimplementation of file creation, validation, or git operations.

  **Testing Surface:** Minimal — Feature module has limited logic (function calls + error handling).
  Integration tests verify orchestrator coordinates steps correctly. Underlying utilities already
  have comprehensive test coverage.

  **Validation Approach:**
  - Manual end-to-end testing confirms workflow completes
  - Output file: correct location, format, content
  - Git operations: staging, commit message, push successful
  - Structured logs: all five steps logged with proper context

  **Expected Timing:**
  - Content generation (LLM): 1-3 seconds
  - File write (I/O): <100ms
  - Validation (read + checks): <10ms
  - Commit (git add + commit): 100-200ms
  - Push (remote): 1-2 seconds
  - **Total: 3-7 seconds** (well within 2-minute specification)

  ## Architecture Alignment

  Feature 133 follows Sheep platform architecture:

  - **Modular pattern:** Standalone feature module orchestrating existing utilities (features 101-132 pattern)
  - **Shared utilities:** Reuses battle-tested content_generators.py functions (100% code reuse)
  - **Conventional commits:** Follows format established across repository (feat(NNN): ...)
  - **Structured logging:** Integrates with platform observability (structlog with JSON output)
  - **Feature isolation:** Module operates independently; failures don't cascade
  - **No architectural changes:** Drop-in extension using proven patterns

  Implementation is straightforward orchestration of proven components. All heavy lifting reuses existing,
  tested utilities. Zero new dependencies or infrastructure changes required.
