content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-20
  - **Decision Count:** 7 major technical decisions
  - **Open Questions Resolved:** 3 (all resolved)
  - **New Dependencies:** 0 (zero — pure reuse of existing utilities)

  ## Technology Decisions

  ### 1. Implementation Architecture: Standalone Module Pattern

  **Chosen:** Standalone module at `/src/sheep/features/feature_133_markdown_file_creation.py`

  **Rejected:**
  - Shared orchestrator across all markdown features — Requires refactoring 32+ existing features, adds coordination overhead exceeding deduplication benefit
  - Inline script execution — Insufficient structure for testing, debugging, and validation suite integration

  **Rationale:**
  The standalone module pattern is proven across features 101-132. Each feature maintains complete isolation,
  simplifying debugging and enabling per-feature validation testing. The established pattern is rapid to execute
  and provides clear separation of concerns. Feature 133 follows identical pattern: standalone Python module
  that imports and orchestrates functions from the shared content_generators.py utilities.

  ### 2. File Location and Encoding: Repository Root with UTF-8

  **Chosen:** Create file at repository root with UTF-8 encoding, Unix LF line endings

  **Rejected:**
  - Subdirectory organization — Fragments test files, diverges from 130+ file precedent
  - Platform-default encoding — Non-deterministic behavior across Windows/Linux/macOS
  - Manual line ending handling — Unnecessary; Python's builtin open() with encoding='utf-8' handles Unix LF automatically

  **Rationale:**
  Repository root maintains consistency with existing 130+ test files. UTF-8 encoding
  is explicit and deterministic. Python's text mode file writing with encoding='utf-8'
  automatically uses platform line endings; on Unix/Linux/macOS this is LF (0x0A). The
  validation function in content_generators.py explicitly checks for LF line endings and
  no CRLF, ensuring spec compliance. No manual line ending conversion needed.

  ### 3. Content Generation: LLM Topic Freedom

  **Chosen:** Allow Claude LLM to choose content topics freely

  **Rejected:**
  - Static predefined topic list — Requires maintenance, leads to repetitive content across 130+ iterations
  - Hardcoded templates — Reduces variety, less realistic validation

  **Rationale:**
  LLM freedom maximizes test file variety across 130+ iterations, simulates realistic usage,
  and reduces maintenance burden. Platform validation goal is reliable file creation and
  git workflow execution, not content consistency. Content quality is validated by existing
  _validate_markdown_content() function which ensures proper structure regardless of topic.

  ### 4. Validation: Strict Fail-Fast Approach

  **Chosen:** Fail immediately on validation failure with descriptive error messages

  **Rejected:**
  - Auto-correct minor format issues — Masks underlying problems, obscures failure modes
  - Lenient validation — Insufficient rigor for test suite which must enforce specification strictly

  **Rationale:**
  Test suite validation must ensure specification compliance. Strict validation matches
  existing pattern in content_generators.py. Descriptive errors (e.g., "Content must have
  2-3 sentences, found 4") provide immediate visibility into failures. Failures halt execution,
  preventing downstream operations that might mask the root cause.

  ### 5. Git Workflow: Conventional Commits with Feature Tracking

  **Chosen:** Conventional commit format: `feat(133): Create markdown file test-az5jtn.md with [topic] content`

  **Rejected:**
  - Generic "Add file" messages — Insufficient audit trail and feature tracking context
  - Custom message formats — Deviates from repository convention established across features 101-132

  **Rationale:**
  Conventional commit format provides clear feature tracking (feat = feature type, 133 = feature number),
  file context (filename), and topic context. This format is established pattern across entire repository.
  GitCommitTool stages file with `add_all=True`. GitPushTool pushes with `set_upstream=True` to track
  remote branch and prevent future push errors.

  ### 6. Structured Logging with Full Traceability

  **Chosen:** Use structlog via `sheep.observability.logging.get_logger()` with trace-level detail

  **Rejected:**
  - print() statements — No production traceability or structured data capture
  - Simple string logging — Loses context necessary for debugging complex failures

  **Rationale:**
  Structured logging provides queryable, aggregatable logs. Implementation logs each step:
  content generation, file write, validation, commit, push. Timestamp, log level, message,
  and context are captured in structured format. This enables detailed post-mortem analysis
  and integration with platform observability infrastructure (structlog is configured with
  ISO timestamps and rich console output).

  ### 7. Workflow Implementation: Explicit Steps vs. Direct Utility Calls

  **Chosen:** Implement explicit 5-step workflow with logging at each stage (matching feature_127 pattern)

  **Rejected:**
  - Direct call to create_markdown_file() — While valid code reuse, reduces visibility into individual steps and makes debugging harder if failures occur
  - Completely custom implementation — Unnecessary duplication; utilities are well-tested and should be reused

  **Rationale:**
  Feature 127 (the reference implementation) uses explicit step-by-step workflow with logging at each stage,
  providing clear visibility into generation → write → validate → commit → push phases. This approach
  balances code reuse (using underlying utilities) with explicit execution visibility. If failures occur,
  logs pinpoint exact stage. This pattern is proven across recent features.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | Cross-platform file path handling | **Use** | Standard library; provides robust path abstractions. Used throughout codebase. |
  | CrewAI | LLM orchestration framework | **Use** | Established platform integration. Provides LLM abstraction and tool framework. |
  | structlog | Structured logging | **Use** | Already integrated in platform via sheep.observability.logging. Provides production-ready logging. |
  | subprocess | Git command execution | **Use** | Standard library wrapped by git_tools.py. No direct dependency; hidden behind GitCommitTool and GitPushTool. |
  | Third-party markdown validation | Markdown format validation | **Reject** | Unnecessary; content_generators.py provides comprehensive validation. Adding dependency increases surface area without benefit. |
  | Alternative LLM frameworks | LLM integration | **Reject** | CrewAI is established; switching adds risk. Feature requires only simple LLM call which is handled well by existing integration. |

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** `write_markdown_file()` validates filename for path traversal attempts
    (rejects "/" and "\\" characters, rejects leading ".")
  - **File path safety:** Uses pathlib.Path which prevents directory traversal
  - **Encoding safety:** UTF-8 encoding is safe; all binary content decoded/encoded consistently

  ### Data Integrity
  - **File integrity verification:** After write, validates file exists and is non-empty
  - **Format validation:** validate_markdown_file() checks for BOM, line endings, encoding
  - **Git operations:** Uses established git_tools.py which wraps subprocess safely

  ### Platform Security
  - **No shell injection:** Git commands use subprocess with argument list, not shell strings
  - **No privilege escalation:** All operations run in user context with current repository permissions
  - **Credential handling:** API keys handled by settings module with SecretStr type

  ### Non-Security Considerations
  - **Determinism:** UTF-8 encoding, LF line endings, LLM content generation are non-deterministic
    (each run produces different content). This is feature, not bug — validates variety.
  - **Race conditions:** No file locking; assumes exclusive access to repository (typical for test suite)

  ## Performance Implications

  ### Execution Timeline
  - **Content generation:** ~1-3 seconds (LLM API call to Claude reasoning model)
  - **File write:** <100ms (local disk I/O)
  - **File validation:** <10ms (reads file, validates format)
  - **Git commit:** ~100-200ms (git add -A, git commit)
  - **Git push:** ~1-2 seconds (depends on network latency to remote)
  - **Total:** ~3-7 seconds (spec requirement is <2 minutes, well within budget)

  ### Resource Usage
  - **Memory:** Minimal; content is ~400-600 bytes, entire operation fits in memory
  - **Disk space:** Single ~500 byte markdown file
  - **Network:** One LLM API call, one git push

  ### Optimization Notes
  - No caching applied (each test file is unique, validation suite goal is variety)
  - LLM call cannot be parallelized (depends on external API)
  - Git operations are sequential (required for workflow correctness)
  - Implementation prioritizes correctness and observability over micro-optimizations

  ## Architecture Notes

  ### Design Principles
  1. **Reuse Existing Utilities:** All heavy lifting is in content_generators.py, tested across 32+ features
  2. **Feature Isolation:** Standalone module enables per-feature testing and debugging
  3. **Explicit Steps:** Logging at each stage provides visibility into workflow
  4. **Fail Fast:** Errors immediately halt execution with descriptive messages
  5. **Convention Over Configuration:** Follows established patterns from features 101-132

  ### Module Structure
  ```
  feature_133_markdown_file_creation.py:
  ├── Imports
  │   ├── content_generators module (for file creation functions)
  │   └── observability.logging (for structured logging)
  ├── Constants
  │   ├── FEATURE_NUMBER = 133
  │   ├── FEATURE_NAME = "markdown-file-creation-682344"
  │   └── MARKDOWN_FILENAME = "test-az5jtn.md"
  ├── Logger instance
  │   └── _logger = get_logger(__name__)
  └── Main orchestrator function
      └── create_feature_133_markdown_file(repo_path=None)
          ├── Step 1: Generate markdown content
          ├── Step 2: Write file to disk
          ├── Step 3: Validate file format
          ├── Step 4: Commit with conventional message
          ├── Step 5: Push to remote with upstream tracking
          └── Return: dict with filepath, content, commit_message, push_result
  ```

  ### Dependency Flow
  ```
  feature_133_markdown_file_creation.py
    │
    ├── imports: from sheep.content_generators import (
    │   ├── generate_markdown_content()
    │   │   └── uses: CrewAI LLM (Claude reasoning model via config/llm.py)
    │   ├── write_markdown_file(content, filename)
    │   │   └── uses: pathlib.Path, open(encoding='utf-8')
    │   ├── validate_markdown_file(filepath)
    │   │   └── uses: pathlib.Path, binary file reading
    │   ├── commit_markdown_file(filepath, content, repo_path)
    │   │   └── uses: GitCommitTool (from tools/git_tools.py)
    │   └── push_markdown_file(repo_path)
    │       └── uses: GitPushTool (from tools/git_tools.py)
    │
    └── imports: from sheep.observability.logging import get_logger
        └── get_logger() → structlog.BoundLogger (structured logging)
  ```

  ### Integration Points
  - **LLM Integration:** Via CrewAI, uses reasoning model from config/llm.py, temperature=0.2
  - **Git Integration:** Via tools/git_tools.py (GitCommitTool, GitPushTool) which wrap subprocess
  - **Logging Integration:** Via observability/logging.py (structlog with ISO timestamps)
  - **File I/O:** Via pathlib.Path and builtin open() (standard library, no dependencies)
  - **Configuration:** Via config/settings.py for LLM model and log level

  ### Error Handling Strategy
  - **Generate step:** ValueError if LLM returns invalid format (caught, logged, re-raised)
  - **Write step:** IOError if file system operations fail (caught, logged, re-raised)
  - **Validate step:** ValueError if format requirements not met (caught, logged, re-raised)
  - **Commit step:** Exception if git add/commit fails (caught, logged, re-raised)
  - **Push step:** Exception if git push fails (caught, logged, re-raised)
  - **All steps:** Each exception logged with detailed error context via structlog

  All exceptions propagate up to caller. Feature module catches all exceptions for logging
  and re-raises. This enables clear failure visibility while maintaining stack trace for
  debugging.

  ## Implementation Readiness

  - **Code Reuse:** 100% — All utilities exist and tested in content_generators.py
  - **Pattern Precedent:** Proven pattern from features 101-132 (32+ implementations)
  - **Reference Implementation:** Feature 127 provides exact pattern to follow
  - **Dependencies:** Zero new dependencies — Uses existing CrewAI, structlog, pathlib
  - **Testing Surface:** Minimal — Feature module orchestrates existing, tested utilities
  - **Execution Risk:** Low — Straightforward orchestration of proven components

  ## Conclusion

  Feature 133 is straightforward markdown file creation following proven patterns. All
  technical decisions prioritize reusing battle-tested utilities and established conventions.
  Implementation reuses content_generators.py functions across generation, validation,
  commit, and push stages. Zero new dependencies required. Explicit step-by-step workflow
  with structured logging provides full observability. Expected implementation time: 1-2 hours.
  Estimated execution time per test: 3-7 seconds (well within 2-minute specification).
