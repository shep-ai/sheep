content: |
  ## Problem Statement

  Create a single markdown file named test-az5jtn.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content, then execute the complete git workflow (add/commit/push) to integrate this file into the feature branch. This is test iteration 133 of the Sheep agentic platform's validation suite, verifying the platform's ability to reliably execute simple file creation and standard git workflow automation tasks.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation built on CrewAI. The repository is organized as follows:

  - **`/src/sheep/`** - Main source code directory
    - **`/agents/`** - Agent definitions (code_agents.py, general_agents.py)
    - **`/config/`** - Configuration management (settings.py, llm.py)
    - **`/flows/`** - Flow definitions for orchestration
    - **`/features/`** - Individual feature implementations (feature_101_*.py through feature_132_*.py)
    - **`content_generators.py`** - Shared utilities for markdown generation, validation, and git operations
    - **`cli.py`** - CLI entry point
  - **`/tests/`** - Test suite
  - **`/specs/`** - Feature specifications (163 feature specs, organized hierarchically)
  - **Repository root** - Contains 130+ test-*.md files and supporting documentation (README.md, DESIGN_PATTERN.md, etc.)

  ### Architecture Patterns

  The project follows a **modular agent-based architecture** with clear separation of concerns:

  1. **Feature-Driven Development**: Each feature (101-132+) is implemented as a standalone Python module in `/src/sheep/features/` following the naming convention `feature_NNN_markdown_file_creation.py`

  2. **Shared Utilities Pattern**: Common operations are centralized in `content_generators.py` to avoid duplication:
     - `generate_markdown_content()` - Uses Claude LLM to generate H1 heading + 2-3 sentences
     - `write_markdown_file()` - Writes to disk with UTF-8 encoding
     - `validate_markdown_file()` - Ensures format compliance (H1 heading, blank line separator, 2-3 sentences, LF line endings, no BOM)
     - `commit_markdown_file()` - Stages and commits with conventional message
     - `push_markdown_file()` - Pushes to remote with upstream tracking
     - `create_markdown_file()` - Orchestrates the complete workflow

  3. **Orchestration Flow**: Each feature implementation follows a 5-step workflow:
     - Step 1: Generate markdown content (using Claude LLM via CrewAI)
     - Step 2: Write file to disk at repository root
     - Step 3: Validate file meets all requirements
     - Step 4: Stage and commit with conventional commit message
     - Step 5: Push to remote feature branch

  4. **Conventional Commits**: All commits follow the pattern `feat(NNN): Create markdown file test-XXXXX.md with [topic] content` where NNN is the feature number

  5. **Logging & Observability**: Structured logging via `sheep.observability.logging` module for tracing execution flow and debugging

  ### Relevant Technologies

  - **Python** - Core implementation language (3.10+)
  - **CrewAI** - Agent orchestration and LLM coordination framework
  - **Claude LLM** - Via Anthropic API for content generation (reasoning model)
  - **Git** - Version control (git add, commit, push with upstream tracking)
  - **Markdown** - File format for content
  - **Pathlib** - Python standard library for cross-platform file operations
  - **UTF-8 Encoding** - Text encoding with Unix LF line endings (no BOM)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | High | A new markdown file (test-az5jtn.md) will be created in the repository root, following the pattern of 132+ existing test files |
  | `/src/sheep/features/` | Medium | New feature module (feature_133_markdown_file_creation.py) will be created to orchestrate the markdown file creation workflow |
  | Git Workflow (staging/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit (feat(133): Create markdown file test-az5jtn.md), and pushing to the feature branch |
  | Content Generation System | Low | No changes to existing content_generators.py; existing functions will be reused as in features 125-132 |
  | LLM Integration | Low | Uses existing Claude LLM integration via CrewAI's reasoning model; no new LLM configuration needed |

  ## Dependencies

  **No new external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O modules (standard library)
  2. **Markdown Generation** - Existing `generate_markdown_content()` function that uses Claude LLM via CrewAI
  3. **File Validation** - Existing `validate_markdown_file()` function that enforces format requirements (H1 heading, blank line separator, 2-3 sentences, UTF-8 encoding, LF line endings, trailing newline)
  4. **Git Integration** - Existing GitCommitTool and GitPushTool classes for git operations
  5. **Structured Logging** - Existing `sheep.observability.logging` module

  The feature follows an established pattern used in features 125-132, so no new utilities, dependencies, or infrastructure need to be created. All required functions are already implemented and tested in `/src/sheep/content_generators.py`.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - **Simple, repetitive task**: Create a markdown file with a title and 2-3 sentences of prose
  - **Established pattern**: Identical implementation pattern repeated 20+ times in features 112-132 (all following the same orchestration workflow)
  - **No code changes**: Uses existing, well-tested functions from content_generators.py
  - **No architectural modifications**: No changes to platform infrastructure, agent definitions, or orchestration flows
  - **No new dependencies**: All required libraries and modules already integrated
  - **Existing infrastructure handles heavy lifting**: File I/O, LLM integration, git tools, and content validation are all pre-built and tested
  - **Straightforward implementation**: 5-step workflow is linear with no branching logic or error recovery (failures propagate with descriptive logging)
  - **Minimal decision overhead**: File format is standardized, commit message format is fixed, target location is fixed (repository root)
  - **Git history confirms precedent**: Recent features (128-132) show this pattern is well-established and rapidly executed (often single commits)

  **Estimated effort breakdown:**
  - Create feature_133_markdown_file_creation.py module: ~30 minutes (copy from feature_132, update feature number and filename)
  - Testing and validation: ~15 minutes (verify markdown format, git operations complete successfully)
  - Integration and git push: ~15 minutes (ensure clean merge with main, verify CI/CD passes)
  - **Total: ~1 hour** (well within "S" category for a few hours)

