  ## Codebase Analysis

  ### Project Structure

  Sheep is a Python-based agentic platform for automated code implementation using CrewAI.

  ```
  src/sheep/
  ├── __init__.py
  ├── cli.py                  # Typer CLI entry point ("sheep" command)
  ├── agents/                 # Agent definitions
  │   ├── code_agents.py      # Research, Implementation, Review agents
  │   └── general_agents.py   # General-purpose agents
  ├── config/                 # Configuration management
  │   ├── settings.py         # Pydantic settings (env-based config)
  │   └── llm.py              # LLM factory (OpenAI, Anthropic, Gemini)
  ├── flows/                  # Flow orchestration (CrewAI Flow)
  │   ├── code_implementation.py  # Main implementation flow
  │   └── chat.py             # Chat flow
  ├── observability/          # Logging and tracing
  │   ├── logging.py          # Structured logging via structlog
  │   └── langfuse_client.py  # Langfuse integration
  └── tools/                  # Agent tools
      ├── git_tools.py        # Git operations
      ├── file_tools.py       # File operations
      └── web_tools.py        # Web tools
  ```

  Additional root-level content files: markdown docs for state machines, design patterns,
  jokes, and other generated content from previous feature specs.

  Tests: `tests/` with pytest (test_config, test_tools, test_state_machine_md, test_random_word_file).

  ### Architecture Patterns

  - **Separation of Structure and Intelligence**: Flows define execution structure; Crews provide AI decision-making
  - **Task-First Design**: Well-crafted tasks drive agent performance
  - **Specialized Agents**: Each agent has a focused role (research, implementation, review)
  - **Pydantic models** for settings and state management
  - **CrewAI Flow** pattern with `@start()` and `@listen()` decorators for orchestration

  ### Relevant Technologies

  - **CrewAI >= 0.86.0**: Core agentic framework with tools and Google GenAI support
  - **Pydantic >= 2.0**: Settings, validation, and state models
  - **Typer >= 0.12.0**: CLI interface
  - **GitPython >= 3.1.0**: Git operations
  - **Langfuse >= 2.0**: Observability and tracing
  - **structlog >= 24.0**: Structured logging
  - **Build**: Hatchling with `src/sheep` layout

