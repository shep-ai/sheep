content: |
  ## Architecture Overview

  Feature 167 integrates seamlessly with the existing Sheep platform layered architecture:

  ```
  Feature Layer (src/sheep/features/)
    └─ feature_167_markdown_file_creation.py [NEW]
       └─ Orchestrates workflow using generalized utilities

  Content Generation Layer (sheep.content_generators)
    ├─ generate_markdown_content() [REUSE]
    ├─ write_markdown_file() [REUSE]
    ├─ validate_markdown_file() [REUSE]
    ├─ commit_markdown_file() [REUSE]
    └─ push_markdown_file() [REUSE]

  Supporting Layers [REUSE]
    ├─ LLM Layer (sheep.config.llm)
    ├─ Git Layer (sheep.tools)
    └─ Logging Layer (sheep.observability.logging)
  ```

  All utility functions are already generalized and proven across 166 prior features.
  No modifications to existing code needed — pure addition of feature module and tests.

  ## Key Design Decisions

  ### 1. Pattern Reuse from Feature 166
  **Chosen:** Copy feature_166 module and update three constants
  **Alternatives Considered:**
  - Create from scratch (wastes time, introduces inconsistency)
  - Use generic utility directly (loses feature-specific metadata, breaks pattern)

  **Rationale:** All 166 prior features use identical module structure with feature-specific
  metadata. This provides observability, consistency, and enables feature tracking. Pattern
  is minimal overhead (~120 lines) and has proven successful across entire series. Copying
  and updating constants requires minimal effort while maintaining all established patterns.

  ### 2. Content Generation via LLM
  **Chosen:** Use existing generate_markdown_content() from content_generators
  **Alternatives Considered:**
  - Implement custom LLM prompt (existing is well-tested, proven 100% success rate)
  - Use alternative LLM service (CrewAI with Claude already integrated and configured)

  **Rationale:** The existing function uses CrewAI with Claude and produces H1 heading + 2-3
  sentences reliably across 166 features. Creating custom prompts or switching LLM services
  would add unnecessary complexity and risk. Reusing existing infrastructure ensures
  consistency and leverages proven solutions.

  ### 3. File I/O and Validation
  **Chosen:** Use existing write_markdown_file() and validate_markdown_file() utilities
  **Alternatives Considered:**
  - Write custom file I/O (utilities already handle all requirements)
  - Use simple open()/write() (loses consistency with patterns, no validation)

  **Rationale:** Existing utilities handle all requirements: UTF-8 encoding with no BOM,
  Unix LF line endings, file structure validation (H1 presence, sentence count), and file
  size validation (300-600 bytes). Battle-tested across 166 features. Reusing eliminates
  duplication and maintains code quality standards.

  ### 4. Git Integration
  **Chosen:** Use existing commit_markdown_file() and push_markdown_file() with custom_message
  **Alternatives Considered:**
  - Use GitPython directly (existing utilities already abstract this)
  - Create commit without custom message (loses feature-specific metadata)

  **Rationale:** Existing utilities abstract GitPython, handle staging/committing/pushing,
  and support custom commit messages. Custom_message parameter enables feature-specific
  messages following conventional commit format. Maintains consistency with 166 prior features
  and ensures proper commit history tracking.

  ### 5. Structured Logging
  **Chosen:** Use get_logger() from sheep.observability.logging with structlog
  **Alternatives Considered:**
  - Use print() statements (loses structured logging benefits)
  - Implement custom logging (existing structlog setup provides rich context)

  **Rationale:** All features use structured logging providing consistent formatting,
  configurable log levels, and observability integration. Existing implementation from
  feature_166 demonstrates proper usage for all major operations (generation, validation,
  write, commit, push).

  ### 6. Validation Strategy
  **Chosen:** Strict enforcement at three validation points with clear error messages
  **Alternatives Considered:**
  - Warning-only validation (reduces consistency)
  - No validation (loses quality assurance)

  **Rationale:** All 166 prior features enforce strict validation: content validation
  (H1, sentences, length), file property validation (encoding, line endings), and markdown
  structure validation. Three-layer approach catches issues early, prevents invalid output
  from being committed, maintains consistency across feature series.

  ## Implementation Strategy

  ### Phase 1: Module Implementation (15 minutes)
  Copy feature_166_markdown_file_creation.py to feature_167_markdown_file_creation.py,
  update three constants:
  - FEATURE_NUMBER: 166 → 167
  - MARKDOWN_FILENAME: "test-5iigac.md" → "test-868wy8.md"
  - COMMIT_MESSAGE: "feat(166)..." → "feat(167): Create markdown file test-868wy8.md with prose content"

  No logic changes needed. All function calls remain identical.

  ### Phase 2: Testing & Validation (30-40 minutes)
  Create test_167_markdown_file_creation.py with:
  - Unit tests for each component (content generation, file writing, validation)
  - Integration test for end-to-end workflow
  - Mock tests for LLM calls and git operations
  - File property assertions (size, encoding, line endings, structure)

  Follow patterns from feature_166 tests. Establish test fixtures for reusable setup.

  ### Phase 3: Integration & Commit (15 minutes)
  - Execute feature_167 module directly via if __name__ == '__main__' block
  - Verify test-868wy8.md created with proper content
  - Verify file is staged, committed with correct message
  - Verify push to remote succeeds
  - Run test suite to ensure no regressions
  - Commit plan and task files with conventional message

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **LLM API unavailability** | Retry logic in CrewAI; API key validation before execution; clear error messages |
  | **Generated content invalid (wrong format, too long/short)** | Three-layer validation catches issues: content validation, file property validation, markdown structure validation |
  | **File write fails (permissions, disk space)** | Error handling in write_markdown_file() with descriptive exceptions; file system checks |
  | **Git repository not initialized** | Validation in commit_markdown_file(); error handling with descriptive messages |
  | **Git authentication fails** | GitPython error propagation; clear error messages indicate auth issues |
  | **Test setup issues** | Follow existing test patterns from feature_166; use fixtures for common setup |
  | **Pattern deviation introduces bugs** | Copy-paste from feature_166 minimizes custom code; reuse utilities ensures consistency |
  | **Encoding or line ending issues** | Utilities already handle UTF-8 validation and LF enforcement; validate_markdown_file() checks both |

  **Overall Risk Assessment: VERY LOW**
  - Pattern proven across 166 prior features ✓
  - All infrastructure already in place ✓
  - No new dependencies or architectural changes ✓
  - Minimal custom logic (constants only) ✓
  - Comprehensive validation at multiple layers ✓
  - Structured logging for observability ✓

