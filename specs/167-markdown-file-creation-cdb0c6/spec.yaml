content: |
  ## Problem Statement

  Create a single markdown file named `test-868wy8.md` in the repository root containing:
  - An H1 markdown heading (`#`) as a title about any topic
  - 2-3 sentences of coherent prose content
  - Proper UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (not CRLF)
  - File size between 300-600 bytes
  - File staged, committed with conventional commit message format, and pushed to remote

  This is the 167th feature in a series of markdown file creation tasks that test and demonstrate the Sheep platform's agentic capabilities. The feature reuses all existing infrastructure with no new dependencies or architectural changes required.

  ## Success Criteria

  - [ ] File `test-868wy8.md` created in repository root
  - [ ] File contains exactly 1 H1 heading (#) as title
  - [ ] File contains exactly 2-3 sentences of coherent prose
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are Unix LF (\n), not CRLF (\r\n)
  - [ ] File size is between 300-600 bytes (inclusive)
  - [ ] Content validation passes before file write
  - [ ] File is staged in git
  - [ ] Commit message follows conventional format: "feat(167): Create markdown file test-868wy8.md with prose content"
  - [ ] File is pushed to remote repository on feature branch
  - [ ] All operations logged with structured logging (structlog)
  - [ ] Feature module follows established pattern from 166 prior features

  ## Functional Requirements

  - **FR-1**: Generate markdown content via LLM that includes exactly 1 H1 heading
  - **FR-2**: Generate 2-3 sentences of coherent, contextually appropriate prose content
  - **FR-3**: Write generated content to file named `test-868wy8.md` in repository root
  - **FR-4**: Encode file as UTF-8 without BOM
  - **FR-5**: Use Unix LF line endings (\n) exclusively
  - **FR-6**: Validate generated file size is between 300-600 bytes before commit
  - **FR-7**: Validate content structure (H1 presence, sentence count, length) before writing to disk
  - **FR-8**: Stage file and create git commit with message "feat(167): Create markdown file test-868wy8.md with prose content"
  - **FR-9**: Push committed file to remote repository on feature branch
  - **FR-10**: Log all major operations (generation, validation, write, commit, push) with structured logging
  - **FR-11**: Return operation result as dictionary with status and details

  ## Non-Functional Requirements

  - **NFR-1**: Feature module implementation must follow established pattern from prior 166 features
  - **NFR-2**: Implementation must reuse existing utilities from `sheep.content_generators` (no code duplication)
  - **NFR-3**: Implementation must use existing LLM configuration from `sheep.config.llm`
  - **NFR-4**: Implementation must integrate with structured logging via `sheep.observability.logging`
  - **NFR-5**: No new package dependencies required; all infrastructure already integrated
  - **NFR-6**: Code must use Pathlib for path operations
  - **NFR-7**: Error handling must propagate exceptions with descriptive messages
  - **NFR-8**: Implementation should be completable in 1-1.5 hours
  - **NFR-9**: All operations must be observable via structured logging for debugging

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should a comprehensive test file be created? | Create comprehensive test file | Maintains consistency with 166 prior features, ensures automated coverage, minimal 30-min overhead improves quality |
  | 2 | Should file size validation be strict? | Strict enforcement (300-600 bytes) | Ensures consistent output across all features, catches issues early, proven range has worked reliably |
  | 3 | Should feature module include main block? | Include if-name-main block | Follows established pattern, enables quick validation during development, aids debugging and ad-hoc testing |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **src/sheep/**: Main source code
    - **features/**: Feature implementation modules (feature_XXX_markdown_file_creation.py)
    - **content_generators.py**: Reusable utilities for markdown generation, file I/O, validation, and git operations
    - **tools/**: Custom tools including GitCommitTool and GitPushTool
    - **config/**: LLM configuration and factory functions
    - **observability/**: Logging via structlog
    - **agents/**: Agent definitions (not used for simple features)
    - **flows/**: Flow orchestration (not needed for this feature)
  - **specs/**: Feature specification files (YAML)
  - **tests/**: Test files with comprehensive coverage patterns
  - **Repository root**: Output location for generated markdown files

  ### Architecture Patterns

  The codebase follows these key architectural patterns:

  1. **Feature Module Pattern**: Each feature (001-167+) has a corresponding Python module in src/sheep/features/ following this structure:
     - Module docstring explaining the feature
     - FEATURE_NUMBER constant
     - MARKDOWN_FILENAME constant
     - COMMIT_MESSAGE constant
     - Main function `create_feature_XXX_markdown_file(repo_path: str | None) -> dict[str, str]`
     - If-name-main block for direct execution

  2. **Orchestration Pattern**: Feature functions orchestrate a multi-step workflow:
     - Task 1: Generate markdown content via LLM
     - Task 2: Write file to disk
     - Task 3: Validate file properties and content
     - Task 4: Stage and commit with git
     - Task 5: Push to remote repository

  3. **Content Generation Pipeline**:
     - `generate_markdown_content()`: Uses CrewAI LLM framework to generate H1 heading + 2-3 sentences
     - `_validate_markdown_content()`: Ensures content has proper structure (H1, sentence count, minimum length)
     - `write_markdown_file()`: Writes UTF-8 encoded content with LF line endings
     - `validate_file_properties()`: Checks encoding, line endings, and file integrity
     - `commit_markdown_file()`: Stages file and creates conventional commit
     - `push_markdown_file()`: Pushes to remote feature branch

  4. **Error Handling**: Features use structured logging with detailed error messages and exceptions propagation for observability

  ### Relevant Technologies

  - **CrewAI** (v0.86.0+): Multi-agent orchestration framework
  - **Anthropic Claude**: LLM backend for content generation (via CrewAI)
  - **GitPython** (v3.1.0+): Python git repository interface for commit/push operations
  - **Pydantic** (v2.0+): Data validation
  - **structlog**: Structured logging for observability
  - **Pathlib**: Path manipulation and file operations
  - **UTF-8 Encoding**: Text file encoding standard
  - **Unix LF Line Endings**: Platform-standard line endings

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | High | New feature module (feature_167_markdown_file_creation.py) required with ~120 lines of orchestration code following established pattern |
  | src/sheep/content_generators.py | None | No changes needed; utilities are already generalized and reusable |
  | Repository root | High | New file test-868wy8.md (300-600 bytes) will be created and committed |
  | Git history | High | New commit with message "feat(167): Create markdown file test-868wy8.md with prose content" will be added; new push to remote |
  | tests/ | Low | May add test file (test_167_markdown_file_creation.py) following patterns from test_166, test_165, etc. |
  | pyproject.toml | None | No changes to dependencies; all required infrastructure already available |
  | README.md | None | No documentation updates needed for simple feature |

  ## Dependencies

  ### Existing Infrastructure Required

  1. **Content Generation** (`sheep.content_generators`):
     - `generate_markdown_content()`: LLM-based generation via CrewAI
     - `_validate_markdown_content()`: Format validation (H1, sentences, length)

  2. **File Operations** (`sheep.content_generators`):
     - `write_markdown_file()`: UTF-8 encoding with LF line endings
     - `validate_file_properties()`: Encoding and line ending verification

  3. **Git Integration** (`sheep.content_generators`):
     - `commit_markdown_file()`: Staging and conventional commit
     - `push_markdown_file()`: Remote push operations

  4. **LLM Configuration** (`sheep.config.llm`):
     - `get_reasoning_llm()`: CrewAI LLM instance configured for content generation

  5. **Logging** (`sheep.observability.logging`):
     - `get_logger()`: Structured logging for observability and debugging

  ### External Dependencies

  - **CrewAI**: Already integrated; provides LLM orchestration
  - **Anthropic Claude**: Configured via environment variables; generates markdown content
  - **GitPython**: Already integrated; powers git operations
  - **Git repository**: Working directory must be a valid git repository with remote configured

  ## Size Estimate

  **S (Small - Hours)** — This feature has minimal implementation effort:

  1. **Code Creation** (30 minutes):
     - Create feature_167_markdown_file_creation.py by copying feature_166
     - Update 3 constants: FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE
     - No logic changes needed; reuse existing orchestration pattern

  2. **Testing** (15 minutes, if test file created):
     - Optional test file would follow existing patterns with minimal customization
     - Integration tests would reuse infrastructure from test_166

  3. **Validation** (10 minutes):
     - Run feature module directly to validate end-to-end workflow
     - Verify markdown file created, committed, and pushed

  4. **Total Effort**: ~1-1.5 hours

  **Rationale**:
  - All infrastructure (content generation, file I/O, git operations, logging) is already in place
  - Feature follows identical pattern proven over 166 prior iterations
  - No new dependencies, architectural changes, or complex logic required
  - Code is straightforward copy-adapt-validate workflow
  - Well-tested building blocks reduce implementation and debugging risk

