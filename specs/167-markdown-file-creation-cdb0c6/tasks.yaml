content: |
  ## Summary

  Feature 167 implementation follows a straightforward 4-task workflow across 3 phases:

  1. **Phase 1 (Module Implementation):** Task 1 creates feature_167_markdown_file_creation.py
     by copying feature_166 and updating three constants. No logic changes needed.

  2. **Phase 2 (Testing & Validation):** Task 2 creates comprehensive test suite (test_167_markdown_file_creation.py)
     with unit tests for each workflow component, integration test for end-to-end execution,
     mocked LLM/git operations, and file property assertions.

  3. **Phase 3 (Integration & Commit):** Task 3 validates complete feature execution (markdown
     generation, file creation, git staging/commit/push, all properties verified). Task 4 commits
     plan and task files to remote.

  ## Workflow Breakdown

  **Task 1 (15 min):** Copy feature_166 module → feature_167 module. Update FEATURE_NUMBER=167,
  MARKDOWN_FILENAME="test-868wy8.md", COMMIT_MESSAGE="feat(167): Create markdown file test-868wy8.md
  with prose content". Red/green/refactor: define import test, implement copy-adapt, verify formatting.

  **Task 2 (35 min):** Create test_167_markdown_file_creation.py with comprehensive coverage.
  Red/green/refactor: define test stubs, implement each test (content generation, file I/O,
  validation, git operations, end-to-end), extract fixtures and helpers. All tests pass.

  **Task 3 (15 min):** Execute feature module end-to-end. Red/green/refactor: define validation
  script, execute pytest and feature module, verify all properties (size 300-600 bytes, H1
  heading, 2-3 sentences, UTF-8 encoding, LF line endings, git staging/commit/push).

  **Task 4 (10 min):** Final review and commit. Non-code task: verify YAML files complete and
  valid, stage both files, create conventional commit "docs(specs): create implementation plan
  and task breakdown for feature 167", push to remote.

  ## TDD Philosophy

  Each task follows RED-GREEN-REFACTOR cycles:
  - **RED:** Write tests/assertions that fail (describe desired behavior)
  - **GREEN:** Implement minimal code to pass tests (copy/adapt existing patterns)
  - **REFACTOR:** Clean up, extract helpers, improve readability (maintain quality)

  This approach ensures code quality, prevents regressions, and validates acceptance criteria.

  ## Risk Mitigation

  - **Pattern Deviation:** Strict copy-adapt from feature_166 minimizes custom code
  - **LLM API Failures:** Mocked in tests; handled by CrewAI retry logic in production
  - **Git Failures:** Tested via mocks; GitPython error propagation provides clear messages
  - **File I/O Issues:** Existing utilities handle encoding/line endings; validation catches errors
  - **Test Coverage:** Comprehensive test suite covers all workflow components and edge cases

  ## Implementation Notes

  - All utility functions (generate_markdown_content, write_markdown_file, validate_markdown_file,
    commit_markdown_file, push_markdown_file) are already proven across 166 prior features
  - No new dependencies required; all infrastructure available
  - No architectural changes needed; feature adds to existing patterns
  - Structured logging provides observability for debugging
  - Error handling propagates exceptions with descriptive messages
