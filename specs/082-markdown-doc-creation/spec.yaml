# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-8lzq5l.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 80+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-doc-creation pattern established
  in features 079-081, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-8lzq5l.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] Prose content is readable and grammatically correct
  - [ ] File is staged in git (`git add test-8lzq5l.md`)
  - [ ] Git commit exists on the current branch with message: `feat(082): create markdown file test-8lzq5l.md with prose content`
  - [ ] Commit is on the feature branch `feat/082-markdown-doc-creation`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-8lzq5l.md`
  - **FR-2**: File must be created in the repository root directory (not in subdirectories)
  - **FR-3**: File must contain exactly one markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: Prose topic may be any subject chosen by the implementer (see openQuestions for decision)
  - **FR-7**: File must be staged using `git add test-8lzq5l.md`
  - **FR-8**: File must be committed with the exact message: `feat(082): create markdown file test-8lzq5l.md with prose content`
  - **FR-9**: Commit must be created on the current branch `feat/082-markdown-doc-creation`
  - **FR-10**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be in the 400-600 byte range; natural variation based on topic is acceptable
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation should use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation should follow the established pattern from 80+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Implementation must not introduce any new dependencies or external packages
  - **NFR-9**: Git configuration (user.name, user.email) must be present for commit creation

  ## Product Decisions & AI Recommendations

  Three key product decisions have been resolved as part of the requirements phase and are documented
  in the openQuestions section above for review and approval:

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose Topic | Flexible (Any Subject) | User query explicitly states "about anything", providing full autonomy to the implementer. Consistent with features 079-081. Reduces cognitive load and keeps focus on file creation mechanics. |
  | 2 | Prose Length | 2-3 sentences (strict) | All 80+ existing test files follow this standard, ensuring consistency and predictable file structure. This constraint maintains established patterns and provides clear validation criteria. |
  | 3 | File Size | Guideline (400-600 bytes typical) | Prose naturally varies by topic and word choice; the 2-3 sentence requirement typically yields 400-600 bytes without artificial text manipulation. Flexibility allows quality prose while maintaining general consistency. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-8lzq5l.md) to existing collection of 80+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 079-081; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/082-markdown-doc-creation` must exist and be checked out
  - **File system**: Write access to repository root directory (available in standard CI/CD environment)
  - **Established pattern**: 80+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size in expected range)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 80+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (079-081) demonstrate efficient implementation of identical features in 10-15 minutes

