decisions:
  - title: 'File I/O Method'
    chosen: 'Python pathlib.Path with write_text()'
    rejected:
      - 'open() with context manager — lower-level, more verbose, less modern; pathlib is the standard Python 3.6+ approach and matches the spec NFR-5 requirement'
      - 'os.open() and os.write() — even more low-level, requires manual encoding/decoding; pathlib abstracts these details cleanly'
      - 'Third-party libraries (pathlib2, py, etc.) — unnecessary when pathlib is in Python 3.11+ standard library; adds external dependencies violating spec NFR-8'
    rationale: >
      Python pathlib.Path is the modern, idiomatic approach for file I/O in Python 3.6+. The write_text()
      method cleanly handles encoding (UTF-8 by default), line ending normalization, and atomic writes on most
      systems. This aligns with spec NFR-5 ("Implementation should use Python pathlib.Path") and NFR-8 (no
      external dependencies). All 80+ existing test files were created using this approach, establishing a proven
      pattern within the codebase. The pathlib abstraction is cleaner and more maintainable than open() or os
      module calls.

  - title: 'Text Encoding and Line Endings'
    chosen: 'UTF-8 encoding without BOM; explicit LF line endings via newline parameter'
    rejected:
      - 'Default system encoding (varies by OS) — could produce non-portable files; explicit UTF-8 ensures consistency across Linux, macOS, and Windows environments per spec NFR-1'
      - 'UTF-8 with BOM — adds 3-byte signature that is not required by CommonMark spec and unnecessarily increases file size; spec explicitly requires UTF-8 without BOM per NFR-1'
      - 'Windows CRLF line endings — incompatible with Unix-based CI/CD systems and git best practices; spec requires LF per NFR-2'
    rationale: >
      UTF-8 without BOM is the universal standard for text files in modern development, guaranteed by Python's
      write_text() method. Explicit newline='\n' parameter ensures Unix LF line endings regardless of host OS,
      matching spec NFR-1 and NFR-2 and ensuring consistency with 80+ existing test files across the repository.
      This is critical in CI/CD environments and git workflows where line ending consistency prevents spurious
      diffs and merge conflicts. The pathlib.Path.write_text() method in Python 3.11+ accepts the newline
      parameter, making this straightforward to implement.

  - title: 'Markdown Format and Validation'
    chosen: 'Strict H1 heading + blank line + 2-3 sentences, validated against CommonMark spec'
    rejected:
      - 'Flexible markdown (varying heading levels, optional structure) — reduces consistency and makes file validation ambiguous; existing 80+ files use strict H1 format'
      - 'No validation, assume correctness — risky; automated validation ensures all files are syntactically valid and consistent per spec NFR-4'
    rationale: >
      All 80+ existing test files follow a strict, consistent format: H1 heading (single #) on line 1, blank line 2,
      2-3 sentences of prose on lines 3+. This consistency is crucial for automated validation and file consistency.
      CommonMark specification is the standard for markdown syntax validation. Python has no required external
      markdown validators (spec NFR-8); basic structural validation can be performed with simple string/line checks
      (heading count, sentence count via splitting on periods). This maintains the established pattern and makes
      automated testing straightforward.

  - title: 'Git Integration Method'
    chosen: 'subprocess module to call git commands (add, commit, push) from Python'
    rejected:
      - 'GitPython library — external dependency violating spec NFR-8; subprocess is in Python standard library and fully sufficient for simple add/commit/push operations'
      - 'Manual file staging and repository state management — complex, error-prone, reimplements git functionality; using git subprocess calls is simpler and more robust'
    rationale: >
      The subprocess module is Python's standard library approach for invoking external commands. All 80+ existing
      test files used git workflow (stage, commit, push), validating this approach. Subprocess calls to git
      (git add, git commit, git push) are straightforward, reliable, and don't require external dependencies.
      This aligns with spec NFR-8 (no external dependencies) and follows the established pattern. Error handling
      is simple: check subprocess return code and stderr for git command failures.

  - title: 'Content Strategy — Topic and Prose Quality'
    chosen: 'Flexible topic selection; implementer chooses any topic of interest; prose quality validated via grammar/readability spot-check'
    rejected:
      - 'Fixed topic list — constrains implementer choice and adds decision overhead; spec explicitly allows "anything" per open question resolution'
      - 'Automated grammar/spell checking via external library — adds complexity and dependencies; human review via spot-check during git commit message review is sufficient'
    rationale: >
      The spec's open question resolution explicitly recommends flexible topic selection ("about anything"), giving
      the implementer autonomy and reducing cognitive load. The 2-3 sentence requirement ensures prose is concise
      and evaluable. Prose quality validation is inherently human-centric (readability, grammar) and spot-checking
