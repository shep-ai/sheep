# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 256 integrates seamlessly into the established markdown file creation pattern observed
  across all 255 prior features. The implementation follows a clean separation of concerns:

  **Feature Module Layer** (src/sheep/features/feature_256_markdown_file_creation.py):
  - High-level orchestration of 5 sequential steps
  - Structured logging via get_logger(__name__)
  - Fail-fast error handling with clear error messages
  - Returns structured result object with filepath, content, commit hash, push status
  - ~30-50 lines of code using high-level wrapper functions

  **Content Generators Wrapper Layer** (src/sheep/content_generators.py):
  - generate_markdown_content() → calls Claude API via get_reasoning_llm()
  - write_markdown_file() → pathlib-based file I/O with UTF-8 encoding, no BOM
  - validate_markdown_file() → comprehensive validation (structure, encoding, size)
  - commit_markdown_file() → stages file and commits with conventional message
  - push_markdown_file() → pushes to feature branch with upstream tracking

  **Low-Level Utility Layer** (src/create_markdown.py):
  - Granular functions for content generation, validation, git operations
  - Called by wrapper layer; feature module never calls directly
  - Ensures consistency across all 256 features

  **Integration Points**:
  - CrewAI framework: LLM access via get_reasoning_llm() from sheep.config.llm
  - Structured logging: get_logger(__name__) from sheep.observability.logging
  - Git tools: GitCommitTool and GitPushTool from sheep.tools
  - Platform configuration: No changes to CrewAI or API setup required

  The feature operates within existing infrastructure with zero modifications to application code,
  configuration, or tests. Test markdown files (test-*.md) are validation artifacts at repository
  root, separate from application source code.

  ## Key Design Decisions

  **1. Architecture Pattern: Reuse Feature 255 Orchestration**
  - **Chosen**: Replicate the 5-step workflow from feature_255_markdown_file_creation.py
  - **Rationale**: 255 prior features prove this pattern is reliable, tested, and maintainable.
    Reusing established orchestration ensures consistency, reduces risk, and allows feature modules
    to remain lean (~30-50 lines). No architectural improvements needed; pattern is stable.
  - **Alternatives Rejected**: Custom architecture (unnecessary reinvention, adds risk), async
    patterns (adds complexity without benefit, contradicts proven synchronous approach).

  **2. Utility Layer: High-Level Wrappers from content_generators.py**
  - **Chosen**: Call wrapper functions (generate_markdown_content, write_markdown_file,
    validate_markdown_file, commit_markdown_file, push_markdown_file) in sequence
  - **Rationale**: Wrappers abstract encoding, validation, git operations, and error handling.
    Feature 255 demonstrates this yields clean, maintainable code. Using wrappers reduces
    implementation burden, improves readability, ensures consistency, and maintains separation
    of concerns. Wrapper layer is the established best practice across recent features.
  - **Alternatives Rejected**: Direct calls to low-level utilities (more verbose, duplicates
    error handling), custom utility functions (violates DRY, adds unmaintainable code).

  **3. Content Generation: Claude API via CrewAI get_reasoning_llm()**
  - **Chosen**: Use Claude API (claude-3-5-sonnet or later) to generate free-form prose on
    any topic (H1 heading + 2-3 sentences)
  - **Rationale**: Spec explicitly requires Claude API. CrewAI's get_reasoning_llm() wrapper
    handles authentication, model selection, and response parsing. This approach generates
    coherent prose on arbitrary topics, matches 255 prior features, and integrates seamlessly
    with existing CrewAI framework.
  - **Alternatives Rejected**: Deterministic templates (produces artificial prose, violates
    spec), static content library (doesn't leverage Claude API).

  **4. Error Handling: Fail-Fast with Clear Messages**
  - **Chosen**: Raise exceptions immediately on operation failure with clear, actionable error
    messages identifying the failure point. No automatic retries; operator intervention required.
  - **Rationale**: Feature 255 establishes fail-fast as correct pattern: (1) keeps feature module
    lean (~30-50 lines), (2) provides clear feedback for debugging, (3) allows manual
    investigation, (4) prevents silent failures, (5) matches codebase conventions. All validation
    logic exists in utility layers; feature module orchestrates high-level steps.
  - **Alternatives Rejected**: Automatic retry logic (adds complexity, masks issues), silent
    fallback (produces low-quality artifacts, hides failures).

  **5. File Encoding & Line Endings: UTF-8 No BOM, Unix LF**
  - **Chosen**: Use pathlib.Path.write_text(encoding=\"utf-8\") via write_markdown_file() wrapper;
    validate using validate_markdown_file() wrapper (checks BOM, CRLF, size, structure)
  - **Rationale**: Wrapper functions handle all encoding concerns. On Unix systems,
    write_text(encoding=\"utf-8\") automatically uses LF line endings and avoids BOM. Validation
    wrapper comprehensively checks all requirements. Centralizes validation for maintainability.
  - **Alternatives Rejected**: Manual encoding in feature module (adds ~20 lines, error-prone,
    duplicates logic), trust platform defaults (doesn't verify requirements).

  **6. Git Integration: Conventional Commits via Wrappers**
  - **Chosen**: Use commit_markdown_file() wrapper (handles git add + commit) and push_markdown_file()
    wrapper (handles git push). Commit message: \"feat(256): create markdown file test-50k3t2.md with prose content\"
  - **Rationale**: Wrappers encapsulate git complexity via platform tools. Benefits: (1) consistent
    commit format across 256 features, (2) centralized error handling, (3) structured logging at
    each step, (4) matches feature 255, (5) reduces security risk from subprocess injection.
  - **Alternatives Rejected**: Direct subprocess calls (lower-level, more verbose, injection risk),
    batch all operations (harder to debug, less clear logging).

  **7. Structured Logging: structlog with get_logger(__name__)**
  - **Chosen**: Import get_logger(__name__) from sheep.observability.logging; log major steps
    at info level (task start, content generated, file written, validation passed, committed, pushed)
  - **Rationale**: Platform standardized on structlog for observability. Benefits: (1) clear
    audit trail through 5-step workflow, (2) observable failures, (3) debuggability, (4) operator
    control over verbosity, (5) integration with platform observability stack.
  - **Alternatives Rejected**: Python built-in logging (less structured, harder to query), no
    logging (reduces debuggability, violates NFR-3).

  ## Implementation Strategy

  **Phase 1: Feature Module Implementation** (Deliver clean orchestration code)
  - Create src/sheep/features/feature_256_markdown_file_creation.py with:
    - Imports: content_generators wrappers, structlog, typing
    - Function signature: run_feature_256(filename: str, repo_path: str) -> dict
    - 5-step orchestration: generate → write → validate → commit → push
    - Structured logging at each step (info level for major steps)
    - Error handling: let exceptions propagate with clear messages
    - Return value: dict with filepath, content, commit hash, push status
  - Expected code length: ~40 lines using high-level wrappers
  - No code duplication; all logic delegated to existing utilities

  **Phase 2: Execution & Comprehensive Validation** (Verify all requirements met)
  - Execute feature module: Call run_feature_256() with filename \"test-50k3t2.md\"
  - Validate file existence and location (repository root)
  - Validate markdown structure: H1 heading present, 2-3 sentences
  - Validate file properties: UTF-8 encoding (no BOM), LF line endings, size 250-600 bytes
  - Validate git integration: commit on feature branch, commit message matches spec, push success
  - Verify structured logging captured all key steps
  - Ensure feature meets all 20+ success criteria from spec

  **Rationale for Phase Ordering**: Phase 1 creates the feature module (foundation); Phase 2
  executes and validates it (verification). Sequential approach ensures each phase builds on previous.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Claude API call fails | Medium | High | Fail-fast error handling logs error and raises exception. Operator investigates API status and retries. |
  | File I/O fails (permissions, disk full) | Low | High | Fail-fast error handling logs error and raises. Operator verifies permissions and disk space. |
  | Generated content fails validation | Low | Medium | validate_markdown_file() wrapper checks structure. Exception raises with specific failure reason. |
  | Git operations fail (credentials, branch) | Low | High | Fail-fast handling in wrappers. Feature branch pre-created; credentials configured. Exceptions identify failure. |
  | Encoding/line ending issues | Very Low | Medium | validate_markdown_file() checks UTF-8 BOM absence and LF-only endings. pathlib.write_text() on Unix produces correct encoding. |
  | Feature module syntax errors | Low | High | Code review during Phase 1 catches errors. Simple ~40 lines with few dependencies. |
  | Logging configuration missing | Very Low | Low | structlog already configured platform-wide. get_logger(__name__) works without setup. |
  | Commit hash not captured | Low | Low | Wrappers return commit hash and push status. Feature module captures and returns in result dict. |

  **Overall Risk Assessment**: Low-risk feature due to: (1) proven pattern from 255 prior features,
  (2) all utilities mature and tested, (3) simple linear orchestration (5 steps), (4) no new
  dependencies, (5) fail-fast error handling provides clear failure modes, (6) pre-created
  feature branch eliminates setup risk. If any step fails, exception prevents corrupt artifacts.

