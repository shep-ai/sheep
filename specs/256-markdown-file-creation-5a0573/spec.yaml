content: |
  ## Problem Statement

  Create a single markdown file called test-50k3t2.md in the repository root with a clear H1 title and 2-3 sentences of prose content on any topic. The file must follow established patterns from 255 prior similar features, including UTF-8 encoding without BOM, Unix LF line endings, and proper Git integration (stage, commit with conventional message, push to feature branch).

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **Repository root**: Contains 255+ test markdown files (test-*.md) following a consistent pattern established by features 001-255
  - **src/sheep/**: Application source code (agents, configuration, flows, tools, observability)
  - **src/sheep/features/**: Feature modules (feature_NNN_markdown_file_creation.py) implementing individual features
  - **src/create_markdown.py**: Low-level utilities for markdown content generation, file creation, validation, and git operations
  - **src/sheep/content_generators.py**: High-level wrapper functions abstracting file I/O, encoding, and git workflows
  - **specs/**: Feature specification directory with subdirectories for each feature (specs/NNN-<feature-name>/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python 3.11+ project configuration (dependencies, build configuration, tools)
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation for the Sheep automation platform
  - **Dockerfile**: Container configuration for the platform

  Test markdown files at the repository root are validation artifacts produced by feature implementations, not application source code. They serve as functional test outputs for the automated system.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (255+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# <H1 Heading>\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix LF line endings (`\n`)
  - File size typically 250-600 bytes as natural outcome of proper structure
  - Implementation uses high-level wrapper functions from content_generators.py or low-level utilities from create_markdown.py
  - Files are isolated test artifacts with no dependencies on application source code
  - Diverse topics observed across existing test files (nature, technology, science, history, culture, philosophy, etc.)

  **Feature Module Pattern** (observed in features 001-255):
  - File located at `src/sheep/features/feature_NNN_markdown_file_creation.py`
  - Imports high-level utilities from content_generators.py
  - Calls existing wrapper functions in sequence: generate content → write file → commit → push
  - Implementation typically 30-50 lines using high-level wrappers
  - Follows fail-fast approach with clear error handling
  - Includes logging via `get_logger(__name__)` for observability
  - Returns structured result with filepath, content, commit hash, and push status

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/256-markdown-file-creation-5a0573`
  - Files created/modified in working directory
  - Stage with `git add test-50k3t2.md`
  - Commit with conventional format: `feat(256): create markdown file test-50k3t2.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files
  - Branch naming: `feat/<number>-<feature-name>-<suffix>`

  **Content Generation Pattern**:
  - Uses Anthropic Claude API via CrewAI framework
  - Generates H1 heading + 2-3 sentences on any topic
  - Validates generated content: structure, character count, prose quality
  - Validates file properties: encoding, line endings, size
  - All validation logic exists in utility modules (no new validation code required)

  ### Relevant Technologies

  - **Python 3.11+**: Required minimum version (specified in pyproject.toml)
  - **pathlib (stdlib)**: Cross-platform file path and I/O operations (Path.write_text(), etc.)
  - **subprocess (stdlib)**: Git command execution (git add, git commit, git push)
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content per CommonMark spec
  - **Git**: Version control; file staging, commits, and push operations
  - **CrewAI**: Multi-agent framework for orchestration and tool integration
  - **Anthropic Claude API**: Content generation via claude-3-5-sonnet or later model
  - **structlog**: Structured logging for observability (used across Sheep platform)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Creates single file test-50k3t2.md alongside 255 existing test-*.md files; no modifications to existing files |
  | src/sheep/features/ | Low | Adds new feature module feature_256_markdown_file_creation.py following established pattern; no modifications to existing modules |
  | src/create_markdown.py | None | Existing utilities are reused unchanged; no modifications required |
  | src/sheep/content_generators.py | None | Existing wrapper functions are reused unchanged; no modifications required |
  | Git repository | Low | Creates one commit and push operation to feature branch; no merge conflicts, no branch complexity |
  | Application logic | None | Feature is purely file creation artifact; zero impact on application behavior, agents, flows, or tools |
  | Configuration | None | No configuration files modified; feature operates within existing framework setup |
  | Tests | None | No test modifications required; feature produces artifact output, not testable application code |

  ## Dependencies

  This feature depends on:

  - **Existing utilities in src/create_markdown.py**:
    - `generate_markdown_content()` — Generates H1 heading + prose via Claude API
    - `validate_content()` — Validates generated content structure (H1, sentence count, character bounds)
    - `create_markdown_file()` — Writes file with UTF-8 encoding and LF line endings
    - `validate_markdown_file()` — Comprehensive file validation (size, encoding, syntax)
    - `stage_and_commit_file()` — Git staging and conventional commit workflow
    - `push_to_remote()` — Git push to feature branch

  - **Existing utilities in src/sheep/content_generators.py** (high-level wrappers):
    - `generate_markdown_content()` — Higher-level abstraction for content generation
    - `write_markdown_file()` — File writing with built-in validation
    - `commit_markdown_file()` — Commit wrapper with conventional message formatting
    - `push_markdown_file()` — Push wrapper with error handling

  - **External dependencies** (already configured):
    - Anthropic Claude API (credentials via ANTHROPIC_API_KEY environment variable)
    - Git executable (system-level, required across repo)
    - Python 3.11+ standard library (pathlib, subprocess, logging)
    - CrewAI framework (version ≥0.86.0, already integrated)

  - **Pre-requisites**:
    - Feature branch `feat/256-markdown-file-creation-5a0573` must exist (pre-created)
    - Write permissions to repository root directory (already available)
    - Git configuration (user.name, user.email) set up for commits
    - ANTHROPIC_API_KEY environment variable configured (required for content generation)

  ## Size Estimate

  **S** (Small — <2 hours) — This is a straightforward, low-complexity feature:

  - Content generation logic is fully implemented and tested across 255 prior features
  - File creation, validation, and git utilities are mature and reusable
  - Feature module structure is standardized (copy-paste-customize pattern from recent features)
  - Git integration is already proven and stable
  - No architectural changes, new dependencies, or novel functionality required
  - Implementation breakdown:
    - Create feature_256_markdown_file_creation.py (~30-40 lines using high-level wrappers)
    - Call existing utility functions in sequence (generate → write → commit → push)
    - Single markdown file test-50k3t2.md created and validated
  - Estimated implementation effort: <1 hour for experienced developer, <2 hours for new team member
  - Estimated testing/validation effort: <30 minutes (validation functions already exist)

  **Justification**:
  - Identical feature structure as features 001-255 (255+ precedents showing ~1 hour implementation time)
  - All required utilities exist in mature state across src/create_markdown.py and src/sheep/content_generators.py
  - No discovery, architectural design, or experimentation needed
  - Simple file creation with no complex logic or state management
  - Git workflow is mechanical and follows exact precedent from 255 implementations
  - User query is unambiguous: specific filename (test-50k3t2.md), clear content requirements (H1 + 2-3 sentences), flexible topic ("about anything")

  ---

  _Analysis complete — feature requirements clear, affected areas identified, established patterns documented, ready for implementation planning_
