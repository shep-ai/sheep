# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-e0zdw8.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 65+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 064-070, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] Markdown file named `test-e0zdw8.md` exists at repository root
  - [ ] File contains exactly one H1 heading (single `#` line)
  - [ ] File contains blank line immediately after heading
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses LF line endings (not CRLF)
  - [ ] File size is approximately 400-600 bytes
  - [ ] File is staged in git (visible in `git status`)
  - [ ] File is committed with conventional message: `feat(071): create markdown file test-e0zdw8.md with prose content`
  - [ ] Feature branch is pushed to remote origin
  - [ ] No other files are modified (only test-e0zdw8.md added)

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named `test-e0zdw8.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 heading (a single line starting with `#`)
  - **FR-3**: File must contain a blank line immediately after the heading (required separator)
  - **FR-4**: File must contain exactly 2-3 sentences of prose content (measurable by sentence-ending punctuation: `.`, `!`, `?`)
  - **FR-5**: System must stage the created file using `git add test-e0zdw8.md`
  - **FR-6**: System must commit the file with conventional commit message: `feat(071): create markdown file test-e0zdw8.md with prose content`
  - **FR-7**: System must push the committed file to feature branch `feat/071-markdown-file-creation-d097a5` on remote origin

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without byte-order mark (BOM)
  - **NFR-2**: File must use LF (Unix-style) line endings, not CRLF (Windows-style)
  - **NFR-3**: File size should be approximately 400-600 bytes (guideline for quality/completeness)
  - **NFR-4**: Implementation must follow the established pattern observed in features 064-070 and 65+ existing test files
  - **NFR-5**: Implementation must not modify any source code (`/src/sheep/`), tests (`/tests/`), or configuration files
  - **NFR-6**: Implementation must be deterministic and reproducible (same filename, different topics should produce consistent file structure)
  - **NFR-7**: Error messages must be clear and actionable if file creation or git operations fail

  ## Product Questions & Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should validation include all format requirements? | Strict validation (H1 heading, blank line, sentence count, encoding, line endings) | Matches established pattern from 65+ test files and features 064-070. Ensures consistency and prevents format regressions. Analysis explicitly identifies these as standard validation checks. |
  | 2 | Should prose content follow guidelines or be flexible? | Flexible prose (any topic, no coherence requirement) | Spec explicitly states "about any topic". Simpler implementation. Matches use case as test file generation in automated system. |
  | 3 | Error handling strategy for failures? | Fail immediately with clear error message | File creation and git operations should succeed on first attempt in well-configured environment. Errors indicate system-level issues, not transient failures. Simpler implementation matches pattern. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 65+ test markdown files (test-*.md and other themed .md files) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
    - `agents/`: Code and general agents for implementation tasks
    - `config/`: LLM and settings configuration
    - `flows/`: ChatFlow and CodeImplementationFlow orchestration
    - `tools/`: File, Git, and Web tools for task execution
    - `observability/`: Langfuse and logging integration
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/071-markdown-file-creation-d097a5/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation describing the CrewAI-based automation platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They are created as part of feature implementation,
  not as source code or configuration.

  ### Architecture Patterns

  **Established File Creation Pattern** (65+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes (guideline, not strict requirement)
  - Implementation follows straightforward imperative code (create content string, write to file)
  - Validation checks: H1 heading, blank line separator, sentence count, encoding, line endings

  **Git Workflow Pattern**:
  - Create feature branch (pre-created as feat/071-markdown-file-creation-d097a5)
  - Create/modify files in repository root
  - Stage with git add
  - Commit with conventional commit format: `feat(071): create markdown file test-e0zdw8.md with prose content`
  - Push to feature branch on remote origin
  - No modifications to source code, tests, or configuration files

  **Feature Implementation Pattern** (observed in features 064-070):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Consistent validation and error handling
  - Reproducible and deterministic (same requirements, different filename/topic)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-e0zdw8.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content
  - **Subprocess (Python standard library)**: For executing git commands (git add, git commit, git push)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-e0zdw8.md) to existing collection of 65+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 064-070; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, agents, tools, flows, or configuration |
  | Test Suite (/tests/) | None | No modifications to test files or test configuration |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/071-markdown-file-creation-d097a5` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 65+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Subprocess**: Available in Python standard library for git operations

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 65+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (064-070) demonstrate efficient implementation of identical features in 10-15 minutes
  - Implementation can leverage existing Python pathlib and git command patterns from previous features

