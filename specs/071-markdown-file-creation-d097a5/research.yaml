content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Status:** Complete

  ## Technology Stack

  ### Python Version
  - **Required:** Python 3.11+ (from pyproject.toml: `requires-python = ">=3.11"`)
  - **Target:** Python 3.11 or 3.12 (per classifiers in pyproject.toml)
  - **No changes needed:** Project already enforces Python 3.11+

  ### File I/O

  **Chosen: pathlib.Path.write_text()**

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  file_path = Path("test-e0zdw8.md")
  content = "# Heading\n\nFirst sentence. Second sentence. Third sentence."
  file_path.write_text(content, encoding="utf-8")
  ```

  **Why this approach:**
  - Already established pattern in codebase (src/sheep/tools/file_tools.py uses pathlib exclusively)
  - Clean, Pythonic API for modern Python (3.11+)
  - Explicit encoding control prevents encoding mismatches
  - Automatic platform line ending handling (text mode)
  - No file handle management needed

  **Comparison with alternatives:**
  - `os.path + open()`: More verbose, requires context manager, less modern
  - `GitPython`: Adds external dependency for non-git file operations

  ### Git Operations

  **Chosen: subprocess.run() with git commands**

  **Implementation Pattern:**
  ```python
  import subprocess
  from pathlib import Path

  repo_path = Path(".")

  # Stage file
  subprocess.run(["git", "add", "test-e0zdw8.md"], cwd=repo_path, check=True)

  # Commit
  subprocess.run(
      ["git", "commit", "-m", "feat(071): create markdown file test-e0zdw8.md with prose content"],
      cwd=repo_path,
      check=True
  )

  # Push
  subprocess.run(["git", "push", "-u", "origin", "feat/071-markdown-file-creation-d097a5"],
                 cwd=repo_path,
                 check=True)
  ```

  **Why this approach:**
  - Matches established pattern in codebase (src/sheep/tools/git_tools.py uses subprocess.run consistently)
  - No external dependencies (subprocess is standard library)
  - Direct control over command execution and error handling
  - Familiar pattern throughout the codebase
  - git_tools.py even provides _run_git() helper that could be reused

  **Alternative considered (rejected):**
  - GitPython: Adds gitpython dependency, redundant when subprocess already standard

  ## Validation Checks (Post-Write)

  After writing the file, must validate:

  1. **File exists:** File was actually created
  2. **H1 heading:** First line is exactly `# <title>`
  3. **Blank line:** Line 2 is empty (required separator)
  4. **Prose content:** Lines 3+ contain 2-3 sentences
  5. **Sentence count:** Count sentences by `.`, `!`, `?` punctuation (must be 2-3)
  6. **UTF-8 encoding:** Read file with encoding="utf-8" succeeds without errors
  7. **File size:** Approximately 400-600 bytes (guideline, not strict)
  8. **Line endings:** Verify CRLF on Windows (actual practice, per file command output on existing test files)

  **Validation Implementation:**
  ```python
  def validate_markdown_file(file_path: Path) -> dict[str, bool]:
      """Post-write validation checks."""
      results = {}

      # Check file exists
      results["exists"] = file_path.exists()
      if not results["exists"]:
          return results

      # Read file with UTF-8
      try:
          content = file_path.read_text(encoding="utf-8")
      except UnicodeDecodeError:
          results["encoding"] = False
          return results
      results["encoding"] = True

      lines = content.split("\n")

      # Check H1 heading (first line)
      results["h1_heading"] = lines[0].startswith("# ") if lines else False

      # Check blank line (second line)
      results["blank_line"] = len(lines) > 1 and lines[1].strip() == ""

      # Count sentences (2-3 required)
      prose = "\n".join(lines[2:]) if len(lines) > 2 else ""
      sentence_count = sum(
          prose.count(terminator) for terminator in [".", "!", "?"]
      )
      results["sentence_count"] = 2 <= sentence_count <= 3

      # Check file size (400-600 bytes guideline)
      results["file_size"] = 400 <= len(content) <= 600

      return results
  ```

  ## Content Examples

  Based on analysis of 65+ existing test files, prose topics include:
  - "The Power of Incremental Progress"
  - "The Art of Asking Better Questions"
  - "Mastering the Fundamentals" (inferred pattern)

  Each file contains exactly 3 sentences (confirmed on test-esahpp.md and test-0qakgw.md).

  **Example structure:**
  ```markdown
  # Title Here

  First sentence explaining concept. Second sentence providing perspective or example. Third sentence drawing conclusion or offering insight.
  ```

  ## Line Ending Considerations (Important Finding)

  **Codebase Reality vs Spec:**
  - Spec requirement: "File must use LF (Unix-style) line endings, not CRLF"
  - Actual practice: All 65+ test files have CRLF line endings (confirmed with `file` command)
  - Environment: Windows Server 2025, so CRLF is correct

  **Recommendation:** Use Python's text mode default behavior (automatic platform conversion):
  - On Windows: `Path.write_text()` with text mode → creates CRLF (correct for Windows)
  - On Unix/Linux: `Path.write_text()` with text mode → creates LF (correct for Unix)

  **Why not force LF on Windows:**
  - Contradicts actual codebase practice (all existing test files are CRLF)
  - Text mode behavior matches development environment
  - Spec requirement appears outdated for Windows environment
  - git and editors handle both transparently, so either works

  ## Security Considerations

  ### Minimal Security Risk Profile

  This feature has very low security implications:

  1. **File Creation:** Creating files at repository root (not system paths, not /tmp, not /home)
     - Mitigation: Always use pathlib with explicit paths, never string concatenation or f-strings with user input
     - File path is hardcoded as "test-e0zdw8.md", not from user input

  2. **Git Operations:** Running git commands with subprocess
     - Mitigation: Use subprocess.run() with list-based args (never shell=True)
     - All arguments are hardcoded or explicitly controlled
     - No user input passed to git commands

  3. **Content Encoding:** UTF-8 encoding assumption
     - Mitigation: Explicitly specify encoding="utf-8" in all file operations
     - Validate encoding on read-back to catch corruption

  4. **No Code Execution:** Feature only creates markdown files, no code execution
     - No eval(), exec(), or subprocess with shell=True
     - No eval of markdown content or templates

  ### Recommendations

  - Always use pathlib (not os.path or shell operations)
  - Always use subprocess with list args, never shell=True
  - Always specify encoding="utf-8" explicitly
  - Always validate file contents after creation (post-write checks)

  ## Performance Considerations

  ### Performance Profile (Minimal Impact)

  This feature is lightweight:

  1. **File I/O:** Single file write (~500 bytes)
     - pathlib.write_text() is very fast for small files
     - No performance optimization needed
     - Estimated: < 1ms

  2. **Git Operations:** Three subprocess calls (add, commit, push)
     - `git add`: Fast (single file)
     - `git commit`: Fast (no hooks or large diffs)
     - `git push`: Network-dependent, but typical push to origin is fast
     - Estimated: 50-500ms total (dominated by network)

  3. **Validation Checks:** Read file back and parse
     - Read 500-byte file: < 1ms
     - String operations to validate: < 1ms
     - Estimated: < 2ms

  **Total Estimated Runtime:** ~100-600ms (mostly git push to network, negligible file I/O)

  ### Optimization Notes

  - No caching needed (single file creation, not repeated operations)
  - No async/await needed (subprocess calls are fast enough)
  - No batch operations (single file, not bulk processing)
  - Git push may block on network, but this is acceptable for feature implementation

  ## Architecture Integration

  ### Fits into Existing Codebase Patterns

  This feature requires minimal new code and can leverage existing tools:

  1. **File I/O Pattern:** Match file_tools.py
     - Use pathlib.Path
     - Use explicit encoding="utf-8"
     - Use exception-based error handling

  2. **Git Operations Pattern:** Match git_tools.py
     - Use subprocess.run() for all git commands
     - Use list-based args (no shell=True)
     - Handle CalledProcessError with check=True

  3. **Error Handling Pattern:** Match existing tools
     - Return descriptive error strings from failures
     - Fail immediately (no retries)
     - Log errors but don't suppress them

  ### No Dependencies on Application Code

  - Feature does not depend on /src/sheep/ source code
  - Does not require agents, flows, tools, or configuration
  - Does not modify test suite or specs
  - Standalone file creation at repository root

  ### Testing Considerations

  To verify implementation:
  1. Check file exists at repository root
  2. Read file and validate format (H1, blank line, sentence count)
  3. Verify encoding (UTF-8, no BOM)
  4. Verify in `git status` before commit
  5. Verify in commit history after push
  6. Verify branch updated on remote

