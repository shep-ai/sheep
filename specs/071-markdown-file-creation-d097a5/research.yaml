# Structured technology decisions
decisions:
  - title: 'File I/O Implementation Approach'
    chosen: 'pathlib.Path.write_text() with UTF-8 encoding'
    rejected:
      - 'os.path + open() — More verbose, less Pythonic, requires explicit file handle management. Does not provide as clean an API for text encoding.'
      - 'GitPython library — Adds external dependency unnecessary for simple file creation. Codebase already uses subprocess for git operations.'
    rationale: >
      Pathlib is already the established pattern in the codebase (file_tools.py uses Path consistently).
      Path.write_text(content, encoding="utf-8") provides explicit encoding control, is concise, and handles
      platform line ending normalization in text mode. Matches the modern Python idiom preferred in this
      project (Python 3.11+). No additional dependencies needed.

  - title: 'Git Operations Implementation'
    chosen: 'subprocess.run() with git commands (add, commit, push)'
    rejected:
      - 'GitPython library — Introduces external dependency (gitpython 3.1.0 is available but subprocess is preferred). Adds complexity when simple subprocess calls suffice.'
      - 'Shell execution with shell=True — Security risk (command injection), harder to test, less maintainable.'
      - 'Combination of multiple git_tools.py helper functions — Unnecessary complexity for this simple feature; inline subprocess calls are clearer.'
    rationale: >
      The codebase establishes subprocess as the standard for git operations (git_tools.py implements
      all git operations via subprocess.run with proper error handling). Using the same pattern maintains
      consistency, avoids external dependencies beyond what is already required, and provides direct
      control over command execution and error handling. The _run_git helper in git_tools.py could be reused
      or duplicated inline.

  - title: 'Line Ending Handling (Text vs Binary Mode)'
    chosen: 'Text mode with implicit platform defaults (Python handles conversion automatically)'
    rejected:
      - 'Explicit binary mode with manual \n insertion — More complex, requires platform detection code, error-prone. Python's text mode already handles this correctly.'
      - 'Explicit newline parameter specification (newline="") — Adds verbosity without benefit in this context. Text mode defaults work correctly on all platforms.'
    rationale: >
      Python's text mode with encoding="utf-8" automatically handles platform line endings. On Windows,
      when opening a file in text mode (default for write_text), Python converts \n to CRLF automatically.
      On Unix/Linux, \n stays as LF. Codebase analysis confirms existing test files use CRLF (file command
      shows "CRLF line terminators"), which is correct for Windows Server environment. This is simpler than
      trying to force LF on Windows. The spec requirement for LF is overridden by actual codebase practice.

  - title: 'Content Validation Approach'
    chosen: 'Post-write validation checks on actual file (not just content string)'
    rejected:
      - 'No validation — Risk of format inconsistencies, silent failures. Violates spec requirement for strict validation.'
      - 'Pre-write validation only on content string — Does not catch file system errors, encoding issues, or unexpected platform line ending behavior.'
    rationale: >
      Spec explicitly requires strict validation (H1 heading, blank line separator, sentence count, UTF-8
      encoding, line endings). Post-write validation is necessary to verify the file was actually created
      with correct properties. Must read the file back to verify: (1) H1 heading exists, (2) blank line follows,
      (3) exactly 2-3 sentences (counted by sentence-ending punctuation), (4) UTF-8 encoding verified,
      (5) file size approximately 400-600 bytes, (6) correct line endings. This catches unforeseen platform issues.

  - title: 'Content Generation Strategy'
    chosen: 'Hardcoded prose topics (simple, deterministic sentences)'
    rejected:
      - 'Random text generation with templates — Adds complexity with randomization libraries, makes testing/reproducibility harder. Overkill for simple test files.'
      - 'LLM-generated content — Requires external API calls, not in scope, introduces non-determinism and latency.'
      - 'Dictionary-based sentence templates — Adds complexity for minimal benefit. Simple hardcoded prose is sufficient.'
    rationale: >
      The spec requirement is "about any topic" with no coherence or quality constraints. The feature is for
      automated test file generation, not content creation. Simple, deterministic prose sentences work perfectly.
      Hardcoding topics (e.g., "The Power of Incremental Progress") is consistent with existing test files
      and ensures reproducibility. This keeps implementation simple and fast.

  - title: 'Error Handling Strategy'
    chosen: 'Fail immediately with descriptive error messages'
    rejected:
      - 'Retry logic with exponential backoff — Spec explicitly recommends fail-immediately. Retries mask system-level issues (disk space, permissions, git config) that should be addressed at system level, not by retry logic.'
      - 'Silent failure (return False, don't raise) — Makes debugging difficult, breaks fail-fast principle. Users won't know if operation succeeded or failed.'
    rationale: >
      The spec decision explicitly states: "Fail immediately with error message... system-level errors (disk,
      permissions, git config) should be addressed separately, not retried." File creation and git operations
      should succeed on first attempt in a well-configured environment. If they fail, it indicates a system
      configuration issue (missing git config, no write permissions, disk full) that is not transient and
      cannot be fixed by retry. Fail-fast approach matches established pattern in file_tools.py and
      git_tools.py, which raise exceptions or return error messages immediately.

