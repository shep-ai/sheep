content: |
  ## Task Execution Summary

  This task breakdown implements the feature in 6 ordered tasks across 2 sequential phases:

  **Phase 1: File Creation & Validation (5 + 3 = 8 minutes)**
  - Task 1.1 creates the markdown file with proper format using pathlib
  - Task 1.2 implements and runs validation checks to verify all requirements met
  - Phase 1 must complete successfully before Phase 2 (file must exist and be valid before git operations)

  **Phase 2: Git Integration & Publishing (1 + 1 + 2 + 1 = 5 minutes)**
  - Task 2.1 stages the file using git add
  - Task 2.2 commits with a conventional commit message
  - Task 2.3 pushes to the remote feature branch
  - Task 2.4 verifies final state and confirms no extraneous files were modified
  - Tasks are strictly sequential (each depends on the previous)

  **Total Estimated Time: 13 minutes**

  ## TDD Approach

  **Phase 1 tasks use full TDD cycles (RED-GREEN-REFACTOR):**
  - Task 1.1: Write assertions about file existence and format, implement creation, extract helpers
  - Task 1.2: Write validation checks, implement validation functions, refactor for clarity

  **Phase 2 tasks use minimal TDD (RED-GREEN only):**
  - Tasks 2.1-2.4: Write assertions about git state/output, implement git commands
  - Refactor is not applicable for simple subprocess calls to git

  ## Dependency Graph

  ```
  task-1-1 (create file)
    ↓
  task-1-2 (validate file)
    ↓
  task-2-1 (git add)
    ↓
  task-2-2 (git commit)
    ↓
  task-2-3 (git push)
    ↓
  task-2-4 (verify final state)
  ```

  All dependencies are sequential (strict linear ordering) to ensure fail-fast behavior:
  - File creation must succeed before validation
  - Validation must pass before git staging
  - Each git operation must succeed before the next

  ## Validation Strategy

  Post-write validation in Task 1.2 ensures file meets all spec requirements:
  1. H1 heading on first line
  2. Blank line as second line
  3. 2-3 sentences in prose (counted by punctuation)
  4. UTF-8 encoding (verified by reading back)
  5. File size 400-600 bytes
  6. CRLF line endings (Windows platform)

  If any validation fails, raise clear error message and stop (fail-fast principle).

  ## Error Handling

  All subprocess calls use `check=True` to raise `CalledProcessError` on non-zero exit codes.
  This ensures immediate failure detection rather than silent failures.

  ---

  _Task breakdown complete. All 6 tasks ordered by dependency. Ready for implementation._
