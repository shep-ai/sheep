content: |
  ## Architecture Overview

  This is a minimal, isolated feature with no impact on application code or existing infrastructure.

  **Placement:** New file created at repository root as `test-kpaotj.md`, joining 100+ existing test files
  following an identical pattern (tests 114-123, and many precedents before).

  **Pattern:** File creation → validation → git workflow (add, commit, push). Standard developer workflow,
  no special architecture or orchestration needed.

  **Dependencies:**
  - Git repository with feature branch already created (pre-established)
  - Write access to repository root (already available)
  - Python 3.11+ standard library (pathlib, subprocess)
  - Configured git user identity (already set up)

  **Scope:** Single file creation with no side effects. Does not modify:
  - `/src/sheep/` (application source code)
  - Test files or test infrastructure
  - Configuration files
  - Any existing markdown files

  This isolation makes the feature safe, reversible, and independently testable.

  ## Key Design Decisions

  ### 1. File I/O: Use pathlib.Path.write_text()

  **Decision:** pathlib.Path.write_text() with explicit encoding='utf-8'

  **Rationale:**
  - Feature spec NFR-5 explicitly mandates pathlib for file I/O operations
  - pathlib is the modern, idiomatic Python approach (standard library, no dependencies)
  - Explicit encoding='utf-8' ensures UTF-8 without BOM across all platforms
  - Python 3's text mode on Unix automatically produces LF line endings when writing '\n'
  - Matches pattern established in 100+ precedent features (114-123)

  **Alternatives rejected:**
  - Built-in open() function: less modern, more verbose; pathlib required by spec
  - Third-party file libraries: violate NFR-9 (no new dependencies)

  ### 2. Git Operations: Use subprocess.run() with git CLI

  **Decision:** subprocess.run() calling git command-line interface directly

  **Rationale:**
  - Feature spec NFR-9 explicitly forbids new external dependencies
  - subprocess provides direct git access without any external libraries
  - Standard git CLI commands are transparent, debuggable, familiar to developers
  - Matches workflow in all precedent features (114-123)
  - Using check=True raises CalledProcessError on failure, making issues visible

  **Alternatives rejected:**
  - GitPython library: adds external dependency (violates NFR-9)
  - Direct git plumbing: complex, error-prone, difficult to debug

  ### 3. Markdown Content: Simple String Concatenation

  **Decision:** Direct string concatenation with f-string: `f"# {heading}\n\n{prose}"`

  **Rationale:**
  - Markdown structure is trivial: one H1 heading + blank line + 2-3 sentences
  - Simple concatenation is clearest, most readable approach
  - No templating logic needed; implementer simply chooses topic and writes prose
  - No external dependencies required
  - Matches pattern across all 100+ existing test files

  **Alternatives rejected:**
  - Template engines (Jinja2): overengineered for trivial formatting, adds dependency
  - Prose generation libraries: violate NFR-9, introduce non-determinism

  ### 4. Error Handling: Exception Transparency

  **Decision:** Let exceptions bubble up naturally, no custom error handling

  **Rationale:**
  - Exceptions from pathlib (PermissionError, FileExistsError) and subprocess (CalledProcessError) are informative
  - They indicate environmental issues (permissions, git configuration, branch state) that need fixing
  - Custom error handling would obscure root causes
  - Matches straightforward approach in all precedent features
  - File size validation unnecessary: proper structure naturally yields 400-600 bytes (confirmed in 100+ precedents)

  **Alternatives rejected:**
  - Try-catch blocks with custom messages: adds verbosity, hides root causes
  - Validation functions: adds complexity for constraints that are natural outcomes of proper structure

  ## Implementation Strategy

  **Phase 1 (File Creation & Validation)** comes first because the file must exist and be valid before git operations.

  1. Create markdown file with:
     - H1 heading chosen by implementer
     - Blank line separator
     - 2-3 sentences of prose about any topic
  2. Validate encoding (UTF-8), line endings (LF), structure (heading → blank line → prose)
  3. Verify file size is in expected 400-600 byte range (natural outcome of structure)

  **Phase 2 (Git Integration)** follows file creation:

  4. Stage file with `git add test-kpaotj.md`
  5. Commit with exact message: `feat(124): create markdown file test-kpaotj.md with prose content`
  6. Push to remote with `git push -u origin HEAD`

  This order ensures:
  - File is valid before being committed to git
  - All validation checks pass before integration
  - Git history is clean with single, well-formed commit
  - Feature branch reflects all changes ready for PR

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File I/O fails (permissions, disk full) | Subprocess will raise PermissionError or OSError; let it bubble up to surface environmental issue |
  | Git operations fail (branch doesn't exist, git not configured) | Feature branch pre-created; git identity pre-configured; CalledProcessError surfaces any issues |
  | File encoding/line endings incorrect | Explicit encoding='utf-8' and Python 3 text mode on Unix guarantee correct behavior |
  | Prose quality insufficient | Implementer manual validation (FR-5) ensures 2-3 readable, grammatical sentences before commit |
  | File size outside 400-600 byte range | Verify after creation; size is natural outcome of structure, not independent constraint |
  | Accidental overwrites of existing files | Filename test-kpaotj.md is unique; check does not exist before writing |

  ## Summary

  This is a minimal, low-risk feature with a proven pattern. All technology decisions are sound,
  follow specification requirements, and match 100+ precedent implementations. Implementation
  involves simple file I/O and straightforward git operations with no architectural complexity.
  Ready to proceed to implementation phase.
