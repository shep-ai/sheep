# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the minimal, established pattern observed in 111+ existing test files
  and features 063-112. The implementation is purely a file artifact creation with no impact
  on application source code, test infrastructure, or configuration.

  **Architecture Pattern:**
  - Repository root markdown file creation (no subdirectories, no nesting)
  - Hardcoded prose content (eliminates runtime validation and format generation complexity)
  - Standard git workflow (add → commit → push)
  - Self-contained implementation with no external dependencies
  - Zero integration with /src/sheep/, tests/, or configuration

  **Alignment with Existing Codebase:**
  The implementation is isolated to repository root and does not depend on or interact with:
  - Application source code in /src/sheep/
  - Test suite in tests/ (no modifications, no test files created)
  - Configuration files (pyproject.toml, etc.)
  - Build, CI/CD, or deployment pipelines

  This matches the pattern from preceding features (063-111) which also created simple test
  markdown files at the repository root with zero impact on the application codebase.

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF line endings

  **Rationale:**
  - NFR-2 mandates use of pathlib for file I/O operations
  - pathlib provides modern, object-oriented API for filesystem operations
  - Path.write_text() with encoding='utf-8' and newline='\n' parameters ensures proper format
  - Guarantees UTF-8 encoding without BOM and Unix-style LF line endings
  - Python 3.11+ standard library (no external dependencies)
  - Consistent with all 111+ prior implementations

  **Alternatives Considered:**
  - `open()` built-in: requires manual file management and context managers; less explicit
  - `os.open()` / `os.write()`: lower-level, more verbose; less idiomatic in modern Python 3

  **Research Reference:** Technical decision "File Creation Implementation Method" in research.yaml
  validates pathlib as the correct choice aligned with NFR-2 and established pattern.

  ### 2. Prose Content: Hardcoded String

  **Chosen:** Hardcoded prose content with H1 heading and 2-3 sentences

  **Rationale:**
  - Content format is fixed and immutable (exactly 2-3 sentences + heading)
  - File size is small (~400-600 bytes) and simple
  - Hardcoding guarantees format compliance without runtime validation
  - Pattern matches all 111+ existing test files (each contains hardcoded prose)
  - Eliminates need for template engines, external files, or generation logic
  - Implementer selects any topic of interest (freely chosen per spec)

  **Alternatives Considered:**
  - Template-based generation: Adds complexity for fixed content
  - External file loading: Adds file I/O complexity and deployment concerns
  - Programmatic sentence generation: Unnecessary; compliance guaranteed by hardcoding

  **Research Reference:** Technical decision "Prose Content Generation Strategy" in research.yaml
  confirms hardcoding matches established pattern and eliminates validation complexity.

  ### 3. Encoding and Line Ending Specification

  **Chosen:** UTF-8 encoding without BOM; LF-only line endings via pathlib newline='\n'

  **Rationale:**
  - FR-6: File must be UTF-8 encoded without BOM
  - FR-7: File must use exclusively LF line endings, no CRLF
  - pathlib.Path.write_text(content, encoding='utf-8', newline='\n') explicitly specifies both
  - Prevents platform-dependent behavior (critical: prevents CRLF on Windows)
  - Consistent with all 111+ prior implementations
  - Simple, declarative approach with clear intent

  **Alternatives Considered:**
  - UTF-8 with platform-default line endings: Would allow CRLF on Windows, violating FR-7
  - Other encodings: Violates FR-6 requirement for UTF-8

  **Research Reference:** Technical decision "File Encoding and Line Ending Specification"
  validates explicit UTF-8 with LF-only control.

  ### 4. Format Validation: Manual Verification

  **Chosen:** Manual verification checklist after file creation

  **Rationale:**
  - Feature creates only one file — verification is quick and straightforward
  - Catches critical issues: file existence, markdown syntax, encoding, line endings, size
  - Easier to understand and troubleshoot than automated scripts
  - Consistent with approach used across 111+ prior features
  - Satisfies success criteria verification without unnecessary automation

  **Alternatives Considered:**
  - Automated validation script: Unnecessary complexity for single-file feature
  - No validation: Risks subtle issues (encoding, line endings, size)

  **Research Reference:** Technical decision "Validation and Post-Creation Verification"
  confirms manual verification is sufficient for single-file creation.

  ### 5. Git Workflow: Standard Staging, Commit, Push

  **Chosen:** Standard git workflow: stage, commit with conventional message, push

  **Rationale:**
  - Established pattern across all 111+ prior implementations
  - Straightforward and auditable — single commit with clear message
  - Conventional commit format 'feat(112): ...' follows spec requirement (FR-9)
  - Simple local workflow: stage file, commit, push to feature branch
  - No friction or complexity — three simple git commands

  **Alternatives Considered:**
  - Interactive/exploratory commits: Unnecessary complexity, creates commit noise
  - Automated CI/CD commits: Over-engineering for lightweight feature

  **Research Reference:** Technical decision "Git Workflow and Commit Strategy"
  validates standard staging, commit, and push approach.

  ## Implementation Strategy

  **Single-phase implementation** with sequential tasks:

  1. **Phase 1: File Creation & Git Integration**
     - Create markdown file with pathlib.Path using hardcoded prose content
     - Verify file encoding (UTF-8), line endings (LF), and format compliance
     - Execute git workflow: stage → commit → push

  **Why this approach:**
  - File creation must precede git operations (cannot stage non-existent file)
  - Git operations are sequential and depend on file existence
  - All operations are straightforward with minimal error cases
  - Testing (RED-GREEN-REFACTOR) is integrated into task definitions

  **No parallel phases:** All work is sequential; git operations depend on file creation.

  ## Risk Mitigation

  | Risk | Mitigation | Severity |
  | ---- | ---------- | -------- |
  | Encoding mismatch (CRLF vs LF) | Use explicit newline='\n' parameter in pathlib.Path.write_text(). Validate with file command or hex dump. | Low |
  | Git authentication/configuration failure | Assume git is configured (user.name, user.email, credentials). Standard error handling will catch failures. | Low |
  | File already exists (collision) | test-9riwv3.md is unique filename; collision virtually impossible. pathlib.Path.write_text() overwrites (acceptable for test artifact). | Very Low |
  | File system permissions | Repository root is writable (111+ test files already exist). No permission escalation needed. | Very Low |

  ## Success Criteria

  Feature is complete when:
  - ✓ File test-9riwv3.md exists at repository root
  - ✓ File contains one H1 heading, blank line, 2-3 sentences of prose
  - ✓ File is UTF-8 encoded without BOM
  - ✓ File uses Unix-style LF line endings
  - ✓ File size is approximately 400-600 bytes
  - ✓ Git commit exists with message: `feat(112): create markdown file test-9riwv3.md with prose content`
  - ✓ Changes are pushed to remote origin on feat/112-markdown-file-creation-9f25b3 branch

  ## Related Context

  This feature is part of a series (063-112+) that creates simple test markdown files following
  an identical pattern. The established pattern provides clear precedent for:
  - File location (repository root)
  - Content structure (H1 heading + 2-3 sentences)
  - Prose encoding (UTF-8, LF)
  - Git workflow (conventional commits, push to feature branch)

  The minimalist design is intentional: these features demonstrate automated file creation,
  git integration, and conventional commit workflows on a tiny, atomic scale with zero
  impact on application source code.
