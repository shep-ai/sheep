content: |
  ## Status

  - **Phase:** Architecture & Implementation Planning
  - **Updated:** 2026-03-31
  - **Pattern Version:** Established from 290+ prior implementations (features 005-295)

  ## Architecture Overview

  Feature 296 implements markdown file creation by reusing the established pattern from 290+ prior features.
  Rather than implementing file I/O, encoding, validation, and git operations from scratch, the feature
  delegates all heavy lifting to existing platform utilities:

  - **Prose Generation**: `sheep.config.llm.get_reasoning_llm()` generates coherent prose via Anthropic Claude API
  - **File I/O**: `sheep.content_generators.write_markdown_file()` writes with explicit UTF-8 encoding (no BOM)
  - **Validation**: `sheep.content_generators.validate_markdown_file()` ensures specification compliance
  - **Git Operations**: `sheep.content_generators.git_add()`, `git_commit()`, `git_push()` handle version control
  - **Orchestration**: `sheep.content_generators.create_markdown_file()` coordinates all steps in a single function

  The feature implementation is a thin wrapper (~30 lines total) that:
  1. Imports `create_markdown_file` from `sheep.content_generators`
  2. Defines constants: `FEATURE_NUMBER = 296`, `MARKDOWN_FILENAME = \"test-v4dx46.md\"`
  3. Implements `create_test_v4dx46_markdown_file()` that calls `create_markdown_file(...)`
  4. Implements `main()` entry point with error handling and logging
  5. Returns status to indicate success/failure

  ### Why Reuse Existing Infrastructure

  - **Code reuse**: 290+ identical features share the same pattern
  - **Consistency**: All markdown file features behave identically
  - **Reduced risk**: Delegating to tested, proven utilities minimizes bugs
  - **Rapid development**: Thin wrapper enables quick implementation
  - **Maintainability**: Changes to core utilities benefit all 290+ features

  ## Key Design Decisions

  ### Decision 1: Delegate to create_markdown_file() Orchestration Function

  **Chosen**: Use `sheep.content_generators.create_markdown_file()` to coordinate the entire workflow.

  **Rejected Alternatives**:
  - Reimplementing file I/O, encoding, validation, and git operations — unnecessary duplication, introduces risk
  - Using lower-level utilities directly (write_markdown_file, git_add, etc.) — verbose, error-prone, defeats abstraction

  **Rationale**:
  The research phase identified `create_markdown_file()` (lines 579-658 in content_generators.py) as the proven,
  tested orchestration function used across 290+ prior markdown file features. This function encapsulates all complexity:
  - Prose generation via Claude API with temperature=0.2 (prevents hallucination)
  - File creation with explicit UTF-8 encoding (no BOM)
  - Comprehensive validation of encoding, line endings, markdown structure
  - Git add/commit/push with conventional commit message format
  - Proper error handling and logging at each step

  Both the feature specification and research findings recommend this as the established pattern.
  Feature 294 (immediate predecessor) uses this approach identically, confirming its correctness.

  **Impact**: Reduces feature implementation to < 30 lines, enabling rapid development while maintaining 100% spec compliance.

  ### Decision 2: Prose Generation via Claude API

  **Chosen**: Auto-generate using `sheep.config.llm.get_reasoning_llm()` (Anthropic Claude API via CrewAI wrapper).

  **Rejected Alternatives**:
  - Manually written prose by implementer — inconsistent quality, doesn't leverage platform capabilities
  - Static placeholder text — doesn't demonstrate Sheep's agentic architecture

  **Rationale**:
  Per the feature specification (product question 1, resolved: true), Claude API auto-generation is recommended because:
  - Aligns with Sheep platform's agentic architecture and core value proposition
  - Ensures consistent prose quality across all 290+ files (temperature=0.2 prevents hallucination)
  - Demonstrates the platform's LLM capabilities and integration
  - Empirically completes in 1-2 seconds per feature (well within S size estimate)
  - Has been validated by features 290-295, all using this approach successfully

  The `get_reasoning_llm()` function provides credential management, temperature tuning (0.2),
  and seamless integration with Sheep's config system. No custom LLM integration code needed.

  **Impact**: High-quality, varied prose across all test files; aligns with platform philosophy.

  ### Decision 3: Python Implementation with Pathlib + Subprocess

  **Chosen**: Python script using `pathlib.Path` for file I/O and `subprocess` for git operations.

  **Rejected Alternatives**:
  - Shell script — less control over encoding, line endings; less portable across Windows/macOS/Linux
  - Manual step-by-step execution — error-prone, not reusable, slows development

  **Rationale**:
  Per the feature specification (product question 3, resolved: true), Python is recommended:
  - `pathlib.Path` with `encoding=\"utf-8\"` provides explicit control over encoding (UTF-8 without BOM)
  - `subprocess.run()` with git CLI uses standard library only (no external dependencies beyond CrewAI)
  - Cross-platform compatibility and portability
  - Follows Python 3.11+ best practices (pathlib over os.path)
  - Matches established pattern in `src/sheep/content_generators.py` and git_tools.py

  **Implementation Location**: All Python implementation is already in `sheep.content_generators`.
  Feature 296 only creates a thin wrapper calling these utilities.

  **Impact**: No encoding surprises, portable across platforms, uses only stdlib, follows codebase conventions.

  ### Decision 4: Comprehensive Multi-Layer Validation

  **Chosen**: Validate encoding (UTF-8, no BOM), line endings (LF only), markdown structure (H1, blank line, prose).

  **Rejected Alternatives**:
  - Minimal validation (file exists only) — misses specification violations
  - No validation — risks silent failures

  **Rationale**:
  Per the feature specification (product question 4, resolved: true), comprehensive validation is essential:
  - Specification requires exact compliance: UTF-8 encoding, LF line endings, proper markdown structure
  - `validate_markdown_file()` in `content_generators.py` (lines 210-304) checks all requirements
  - Validation overhead is negligible (< 10ms) compared to assurance benefit
  - Research phase confirmed this is the defensive pattern across the entire Sheep codebase

  **Implementation Location**: Validation is built into `create_markdown_file()` orchestration function.
  Feature 296 automatically benefits from this validation without additional code.

  **Impact**: Specification compliance guaranteed; silent failures prevented; 100% confidence in output quality.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation)** → **Phase 2 (Implementation)** → **Phase 3 (Validation)**

  This ordering is natural and sequential because:
  1. Foundation creates the file structure and imports needed by implementation
  2. Implementation calls `create_markdown_file()`, which requires the feature file to exist and be importable
  3. Validation executes the feature and verifies results, which requires implementation to be complete

  No parallelization possible; each phase strictly depends on the previous.

  ### Within Each Phase

  **Phase 1 (Foundation)**:
  - Create `src/sheep/features/feature_296_markdown_file_creation.py`
  - Add module docstring explaining feature 296 and the markdown file creation workflow
  - Import required modules: `Path` from pathlib, `create_markdown_file` from sheep.content_generators, `get_logger` from sheep.observability.logging
  - Define constants: `FEATURE_NUMBER = 296`, `FEATURE_NAME = \"markdown-file-creation-v4dx46\"`, `MARKDOWN_FILENAME = \"test-v4dx46.md\"`
  - Create logger instance: `_logger = get_logger(__name__)`
  - No implementation code; structure only

  **Phase 2 (Implementation)**:
  - Implement `create_test_v4dx46_markdown_file(repo_path: str | None = None) -> dict[str, str]` function
    - If repo_path is None, default to `str(Path.cwd())`
    - Call `create_markdown_file(filename=\"test-v4dx46.md\", repo_path=repo_path, feature_number=296)`
    - Return the result dict from `create_markdown_file()`
    - Add comprehensive docstring with description, args, returns, raises sections
  - Implement `main() -> int` entry point
    - Try block: call `create_test_v4dx46_markdown_file()`, log success, return 0
    - Except block: log error with exception details, return 1
  - Add `if __name__ == \"__main__\": exit(main())` for direct script execution

  **Phase 3 (Validation)**:
  - Execute feature via `create_test_v4dx46_markdown_file()` or `main()`
  - Verify file exists in repository root with correct name
  - Verify file encoding: UTF-8 without BOM, read successfully as text
  - Verify line endings: Unix LF only, no CRLF sequences
  - Verify markdown structure: H1 heading at start, blank line follows, 2-3 prose sentences, file ends with newline
  - Verify file size: between 400-600 bytes (natural outcome of proper structure)
  - Verify git operations: file staged (in git index), committed with exact message, pushed to remote origin
  - Verify remote tracking branch has the new commit

  ### Code Template (Pattern from Feature 294)

  Feature implementation follows the exact structure from feature_294_markdown_file_creation.py:

  ```python
  \"\"\"Implementation for feature 296: Create markdown file test-v4dx46.md with prose content.
  ...detailed docstring...
  \"\"\"

  from pathlib import Path
  from sheep.content_generators import create_markdown_file
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  FEATURE_NUMBER = 296
  FEATURE_NAME = \"markdown-file-creation-v4dx46\"
  MARKDOWN_FILENAME = \"test-v4dx46.md\"

  def create_test_v4dx46_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      \"\"\"Create markdown file for feature 296.\"\"\"
      if repo_path is None:
          repo_path = str(Path.cwd())
      _logger.info(f\"Creating feature {FEATURE_NUMBER} markdown file: {MARKDOWN_FILENAME}\")
      try:
          result = create_markdown_file(
              filename=MARKDOWN_FILENAME,
              repo_path=repo_path,
              feature_number=FEATURE_NUMBER,
          )
          _logger.info(f\"Successfully created feature {FEATURE_NUMBER}: {MARKDOWN_FILENAME}\")
          return result
      except Exception as e:
          _logger.error(f\"Failed to create feature {FEATURE_NUMBER}: {e}\")
          raise

  def main() -> int:
      \"\"\"Main entry point.\"\"\"
      try:
          result = create_test_v4dx46_markdown_file()
          _logger.info(f\"Feature 296 completed: {result['filepath']}\")
          return 0
      except Exception as e:
          _logger.error(f\"Feature 296 failed: {e}\")
          return 1

  if __name__ == \"__main__\":
      exit(main())
  ```

  ## Reuse of Existing Infrastructure

  All heavy lifting is already implemented in existing modules. Feature 296 uses these without modification:

  | Component | Module | Function(s) | Purpose |
  | --------- | ------ | ----------- | ------- |
  | Prose Generation | sheep.config.llm | get_reasoning_llm() | Generate H1 title and 2-3 prose sentences via Claude API |
  | File I/O | sheep.content_generators | write_markdown_file() | Write file to disk with explicit UTF-8 encoding |
  | Validation | sheep.content_generators | validate_markdown_file() | Verify encoding, line endings, markdown structure |
  | Git Add | sheep.content_generators | git_add() | Stage file in git index |
  | Git Commit | sheep.content_generators | git_commit() | Commit with conventional message |
  | Git Push | sheep.content_generators | git_push() | Push to remote with upstream tracking |
  | Orchestration | sheep.content_generators | create_markdown_file() | Coordinate all steps in single function |
  | Logging | sheep.observability.logging | get_logger() | Log execution progress and errors |

  These utilities handle all complexity. Feature 296 is purely a configuration/wrapper over these utilities.

  ## Risk Assessment

  ### Low Risk Overall

  This feature reuses proven infrastructure from 290+ prior implementations. All technologies are established,
  tested, and working reliably in production.

  ### Identified Risks and Mitigations

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Claude API unavailable or times out | Low | Medium | `create_markdown_file()` catches exceptions. Feature implementation can log error and return failure status. Same risk as 290+ prior features — all have succeeded. |
  | File encoding incorrect (BOM present, CRLF used) | Very Low | High | `validate_markdown_file()` explicitly checks for BOM and CRLF, rejects file before commit. Specification compliance guaranteed. |
  | Git operations fail (credentials missing, branch doesn't exist) | Low | Medium | Git functions capture stderr and raise CalledProcessError. Feature catches exception, logs error, returns failure status. |
  | Markdown file already exists (overwrite risk) | Very Low | Low | File creation is idempotent; creating again produces same result. If wrong content exists, validation detects it. |
  | Pattern differs from established conventions | Very Low | Low | Implementation closely follows feature_294 template. Code review can catch deviations. 290+ prior features provide precedent. |
  | Specification requirements misunderstood | Very Low | Low | Specification and research findings are clear and explicit. Verification phase tests all success criteria. |

  ### No Known Issues from Prior Implementations

  - Features 290-295 all used identical pattern — no known failures
  - Content generation is reliable with temperature=0.2
  - File I/O is straightforward (no complex operations)
  - Git operations use standard CLI (guaranteed availability)
  - Validation catches specification violations

  ## Success Criteria for Implementation

  All of the following must be true for feature 296 to be complete:

  **File Creation**:
  - [ ] File `test-v4dx46.md` exists in repository root directory
  - [ ] File contains exactly one H1 heading using `# ` syntax
  - [ ] H1 heading is followed by exactly one blank line
  - [ ] File contains 2-3 complete sentences of coherent prose content
  - [ ] Each prose sentence is minimum 10 words and conveys a complete thought

  **File Format**:
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF (`\n`) line endings exclusively; no CRLF
  - [ ] File size is between 400-600 bytes
  - [ ] File ends with newline character (no missing final newline)

  **Git Operations**:
  - [ ] File is staged in git (visible in `git status` output)
  - [ ] File is committed with exact message: `feat(296): create markdown file test-v4dx46.md with prose content`
  - [ ] Commit is present in local feature branch
  - [ ] Commit is pushed to remote origin on branch `feat/296-markdown-file-creation-67ee89`
  - [ ] Remote tracking branch reflects the new commit

  ---

  _Implementation planning complete — architecture defined, design decisions documented, phases structured, ready for task breakdown and execution_
