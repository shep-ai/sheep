decisions:
  - title: "Prose Generation Method"
    chosen: "Anthropic Claude API via sheep.config.llm.get_reasoning_llm()"
    rejected:
      - "Manual prose writing by implementer — loses consistency across 290+ files, doesn't leverage platform capabilities, slower to execute"
      - "Placeholder static text — misses demonstration of Sheep platform's agentic LLM integration, doesn't showcase dynamic content generation"
    rationale: >
      Claude API is the correct choice because it aligns with Sheep platform's core value proposition of agentic systems,
      ensures high-quality, grammatically correct prose across all 290+ files, and demonstrates the platform's LLM capabilities.
      The CrewAI wrapper (get_reasoning_llm()) provides temperature tuning (0.2) for consistent output without hallucination.
      Empirical evidence from features 290-295 shows this approach executes reliably in 1-2 seconds with consistent quality.
      Temperature=0.2 in get_reasoning_llm() prevents creative drift while maintaining natural language variety.

  - title: "LLM Integration Library"
    chosen: "CrewAI's LLM wrapper (from sheep.config.llm)"
    rejected:
      - "Raw Anthropic Python SDK (anthropic package) — requires lower-level credential management, no temperature/model abstraction, verbose boilerplate"
      - "LangChain LLM — adds external dependency, heavier abstraction, not integrated with Sheep's existing config system"
    rationale: >
      CrewAI wrapper is already used throughout the codebase (feature_294 uses get_reasoning_llm() identically).
      It provides convenient abstraction over API credentials via Settings, built-in temperature tuning, and consistent error handling.
      No additional dependencies needed beyond what Sheep already uses. Matches pattern in src/sheep/config/llm.py.

  - title: "File Creation & Encoding Approach"
    chosen: "pathlib.Path with explicit 'w' mode and UTF-8 encoding parameter"
    rejected:
      - "Built-in open() with default encoding — relies on system locale, may introduce CRLF on Windows, less explicit intent"
      - "io.open() with explicit encoding — equivalent to pathlib but less readable and modern Python conventions favor pathlib"
    rationale: >
      pathlib.Path with encoding='utf-8' in write_markdown_file() (line 128) is the Pythonic standard since 3.4+.
      Explicit encoding parameter makes intent crystal clear: UTF-8 without BOM, mandatory for cross-platform compatibility.
      'w' mode (text, line-ending translation) combined with explicit UTF-8 encoding ensures LF on Unix/Linux/GitHub Actions.
      Matches established pattern in src/sheep/content_generators.py:write_markdown_file().

  - title: "Line Ending Control Strategy"
    chosen: "Rely on pathlib 'w' mode with UTF-8 encoding on target platform (Unix/Linux/GitHub Actions)"
    rejected:
      - "Explicit 'wb' mode with manual b'\\n' insertion — verbose, requires manual byte handling, error-prone with mixed strings/bytes"
      - "Use git config core.safecrlf=true or core.autocrlf — relies on external git configuration, not explicit in code, harder to debug"
    rationale: >
      GitHub Actions environment (target deployment) is Linux, where 'w' mode with UTF-8 encoding produces LF only.
      Validation layer in validate_file_properties() (line 191) explicitly checks for CRLF and rejects if found,
      providing safety net if line endings diverge. This matches the defensive pattern in content_generators.py.
      For Windows development, WSL or git's core.autocrlf setting handles conversion; validation ensures correctness on all platforms.

  - title: "Git Operations Implementation"
    chosen: "subprocess module calling git CLI directly (subprocess.run with git commands)"
    rejected:
      - "GitPython library (GitPython package) — adds external dependency, not in current requirements, overkill for simple add/commit/push"
      - "Manual shell script — less portable, harder to test, error handling complex"
    rationale: >
      subprocess is part of Python standard library, no external dependencies.
      git CLI is guaranteed to be available in target environment (GitHub Actions).
      Matches pattern in src/sheep/tools/git_tools.py and src/sheep/content_generators.py (git_add, git_commit, git_push functions).
      Provides explicit control over git command arguments and error handling via subprocess.CalledProcessError.
      Functions in content_generators.py (lines 424-576) demonstrate proven, working pattern with proper stderr capture.

  - title: "Markdown Content Validation Level"
    chosen: "Comprehensive validation (encoding, line endings, markdown structure, prose quality)"
    rejected:
      - "Minimal validation (file exists, is readable) — misses encoding issues, CRLF problems, malformed structure"
      - "No validation — risks silent failures, no assurance file meets specification requirements"
    rationale: >
      Comprehensive validation is essential because specification requires exact UTF-8 encoding, LF line endings, and proper markdown structure.
      validate_markdown_file() in content_generators.py (lines 210-304) implements all necessary checks: BOM detection (line 247),
      CRLF detection (line 257), UTF-8 decoding (line 252), H1 heading presence (line 261), blank line separator (line 271), sentence count (line 288), trailing newline (line 294).
      Validation cost is minimal (1-2 lines per check) compared to risk of undetected specification violations.
      Matches defensive programming pattern observed across entire Sheep codebase.

  - title: "Error Handling Strategy"
    chosen: "Raise exceptions immediately, rely on caller for recovery (feature implementation code)"
    rejected:
      - "Silent fallback to defaults — hides real errors, makes debugging harder, violates fail-fast principle"
      - "Comprehensive retry logic — appropriate for network operations, not for local file I/O and git where retries won't fix root causes"
    rationale: >
      All validation functions raise ValueError/OSError with descriptive messages (see content_generators.py).
      This allows feature implementation code to catch exceptions and implement retry/recovery logic if appropriate.
      Matches Python best practices and error handling pattern in sheep codebase.
      Feature 294 uses identical approach: let exceptions propagate, catch at entry point (feature_294_markdown_file_creation.py:77).

  - title: "Orchestration Pattern"
    chosen: "Single create_markdown_file() function coordinating the entire workflow (generate → write → validate → commit → push)"
    rejected:
      - "Separate script for each phase — more modular but harder to coordinate, risk of incomplete workflows"
      - "Manual step-by-step execution in feature code — verbose, error-prone, no reusability across 290+ files"
    rationale: >
      create_markdown_file() in content_generators.py (lines 579-658) encapsulates entire workflow with clear logging at each step.
      Single entry point ensures consistent behavior across all markdown file features.
      Already proven pattern from features 290-295 (feature_294 uses it identically at line 63-67).
      Reduces feature implementation code to a simple wrapper (see feature_294_markdown_file_creation.py).
      Returns structured dict with filepath, content, commit_message, push_result for introspection and testing.

