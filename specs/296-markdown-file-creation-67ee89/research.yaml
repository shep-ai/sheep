content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-31
  - **Pattern Version:** Established from 290+ prior implementations (features 005-295)

  ## Architecture Overview

  This feature follows the well-established markdown file creation pattern used throughout the Sheep platform testing infrastructure.
  The implementation leverages existing platform utilities and proven patterns rather than introducing new technology or approaches.

  ### Technology Stack

  | Component | Technology | Purpose | Decision |
  | --------- | ---------- | ------- | -------- |
  | **Prose Generation** | Anthropic Claude API via CrewAI wrapper | Auto-generate H1 title and 2-3 sentences | ✓ Use |
  | **File I/O** | pathlib.Path with explicit UTF-8 encoding | Write markdown to disk with exact encoding | ✓ Use |
  | **Git Operations** | subprocess + git CLI | Stage, commit, push to remote | ✓ Use |
  | **Validation** | Custom validation functions in content_generators | Verify encoding, line endings, markdown structure | ✓ Use |
  | **Logging** | sheep.observability.logging | Track execution progress and errors | ✓ Use |

  ## Technology Decisions

  ### 1. Prose Generation: Claude API via CrewAI

  **Chosen:** Anthropic Claude API via `sheep.config.llm.get_reasoning_llm()`

  **Rejected:**
  - Manual prose writing — loses consistency, doesn't leverage platform capabilities
  - Placeholder static text — doesn't demonstrate Sheep's agentic nature

  **Rationale:**
  Claude API with CrewAI wrapper is the proven pattern across features 290-295.
  The `get_reasoning_llm()` function (src/sheep/config/llm.py) provides:
  - Temperature=0.2 for consistent, non-hallucinating output
  - Transparent credential management via Settings
  - Seamless integration with Sheep's config system
  - ~1-2 second execution time, well within S (small) size estimate

  The prompt template in content_generators.py requests:
  - H1 heading (using # syntax)
  - Blank line separator
  - 2-3 sentences of coherent prose on any topic

  ### 2. File Encoding: UTF-8 without BOM

  **Chosen:** pathlib.Path with mode='w' and encoding='utf-8'

  **Rejected:**
  - Default system encoding — may vary by platform, risks CRLF on Windows
  - Manual binary mode with b'\\n' — verbose, error-prone, requires byte handling

  **Rationale:**
  Explicit UTF-8 encoding in `write_markdown_file()` (line 128):
  ```python
  with open(file_path, "w", encoding="utf-8") as f:
      f.write(content)
  ```

  This approach:
  - Makes intent explicit in code
  - Guarantees UTF-8 on all platforms
  - Prevents BOM insertion (mode='w' uses UTF-8, not UTF-8-sig)
  - Matches Python 3.11+ best practices
  - Is validated by `validate_file_properties()` which checks for BOM at bytes level (line 187)

  ### 3. Line Endings: Unix LF Strategy

  **Chosen:** Rely on pathlib mode='w' text translation + platform Unix/Linux environment

  **Rejected:**
  - Explicit 'wb' mode with manual byte insertion — too verbose for simple use case
  - Core.autocrlf git configuration — implicit, harder to debug, requires external config

  **Rationale:**
  Target environment is GitHub Actions (Linux), where mode='w' naturally produces LF only.
  For Windows developers:
  - Git's core.autocrlf or WSL handles conversion transparently
  - Validation layer catches any CRLF issues before commit (line 191 in validate_file_properties)

  The validation is defensive:
  ```python
  if b"\r\n" in binary_content:
      raise ValueError("File uses CRLF line endings (should use LF)")
  ```

  This ensures specification compliance across all environments.

  ### 4. Git Operations: subprocess + Git CLI

  **Chosen:** subprocess.run() calling git CLI directly

  **Rejected:**
  - GitPython library — adds external dependency, overkill for simple operations
  - Shell script — less portable, harder to test

  **Rationale:**
  subprocess is Python standard library (no new dependencies).
  Git CLI is guaranteed available in target environment.
  Implementation in content_generators.py provides proven pattern:

  - `git_add()` (line 424): stage file
  - `git_commit()` (line 480): commit with conventional message
  - `git_push()` (line 526): push with upstream tracking (-u flag)

  Each function captures subprocess output, checks return codes, and raises CalledProcessError on failure.
  This matches the pattern in src/sheep/tools/git_tools.py (GitPushTool, GitCommitTool, etc.).

  ### 5. Validation: Comprehensive Multi-Layer

  **Chosen:** Comprehensive validation covering encoding, line endings, and markdown structure

  **Rejected:**
  - Minimal validation (file exists only) — misses specification violations
  - No validation — risks silent failures

  **Rationale:**
  Specification requires exact compliance on encoding, line endings, and structure.
  `validate_markdown_file()` (lines 210-304) checks:

  1. **Encoding:** UTF-8 decode, no BOM (line 187)
  2. **Line Endings:** No CRLF (line 191)
  3. **Structure:** H1 heading at start (line 261), blank line separator (line 271), proper prose (line 284)
  4. **Format:** Trailing newline (line 294)

  Each check is specific and raises ValueError with descriptive message.
  Validation cost is negligible (< 10ms) compared to assurance benefit.

  ### 6. Orchestration: Single Workflow Function

  **Chosen:** Single `create_markdown_file()` entry point coordinating all phases

  **Rejected:**
  - Separate scripts per phase — harder to coordinate, risk of incomplete workflows
  - Manual execution — verbose, not reusable

  **Rationale:**
  `create_markdown_file()` (lines 579-658) encapsulates entire workflow:

  1. Generate content via Claude API
  2. Write file to disk with validation
  3. Commit with conventional message
  4. Push to remote with upstream tracking

  Returns structured dict:
  ```python
  {
      "filepath": str(path_to_file),
      "content": str(markdown_content),
      "commit_message": str(message_used),
      "push_result": str(git_push_output),
  }
  ```

  This enables:
  - Reuse across all 290+ markdown file features
  - Consistent behavior and error handling
  - Easy testing and introspection
  - Minimal feature implementation code (see feature_294)

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File path handling and I/O | ✓ Use (stdlib) | Standard library, explicit encoding support, cross-platform, Pythonic |
  | subprocess | Git CLI execution | ✓ Use (stdlib) | Standard library, no dependencies, proven in git_tools.py |
  | crewai | LLM abstraction and API calls | ✓ Use (existing) | Already in requirements, provides get_reasoning_llm() wrapper, consistent with codebase |
  | anthropic SDK | Raw Claude API access | ✗ Reject | CrewAI wrapper already provides needed abstraction, no need for lower-level API |
  | GitPython | Git library bindings | ✗ Reject | Adds external dependency, subprocess + git CLI is simpler and proven |
  | LangChain | LLM framework | ✗ Reject | Not integrated with Sheep config system, crewai already used |

  ## Security Considerations

  ### File Path Security
  - Filename validation in `write_markdown_file()` (line 117) rejects paths with `/`, `\\`, or leading `.`
  - This prevents directory traversal attacks (e.g., `../../../etc/passwd`)
  - Specification requires file in repository root only

  ### Encoding Security
  - Explicit UTF-8 encoding prevents encoding-based injection attacks
  - BOM validation ensures no hidden bytes at file start
  - Validation layer performs binary checks before text interpretation

  ### Git Operations Security
  - Conventional commit messages use feature number and filename only (no user input)
  - Subprocess calls git with explicit arguments, no shell injection risk
  - Error handling captures stderr and raises exceptions for visibility

  ### LLM API Security
  - CrewAI wrapper handles credential management via Settings
  - API keys never appear in code or logs (marked with get_secret_value())
  - Temperature=0.2 minimizes hallucination risk and output variability
  - Prompt template is simple, read-only, no user input injection

  ### No Sensitive Data Exposure
  - Feature creates only a markdown file with prose content (no secrets)
  - Logging is informational only, no content leakage
  - File is committed to git (intentional, for testing infrastructure)

  ## Performance Considerations

  ### Execution Timeline
  - Content generation (Claude API): ~1-2 seconds (network latency)
  - File I/O: < 50ms (pathlib write)
  - Validation: < 10ms (binary checks)
  - Git operations: ~1-3 seconds (network latency for push)
  - **Total:** 5-8 seconds typical, well within S (small, 10-20 min) size estimate

  ### Memory Usage
  - Markdown file: ~400-600 bytes (small)
  - Content in memory: < 1KB
  - No streaming required, no resource exhaustion risk

  ### Network I/O
  - One Claude API call (HTTP POST): ~1-2 seconds
  - One git push to GitHub: ~1-3 seconds (depends on network)
  - No batching or parallel optimization needed for single file

  ### Optimization Opportunities (Not Needed)
  - Caching generated prose: Not applicable, each file has unique content
  - Parallel git operations: Not applicable, single file, sequential workflow
  - Async I/O: Not applicable, synchronous Python script is sufficient

  ## Integration Points

  ### Dependencies on Existing Code
  1. **sheep.config.llm.get_reasoning_llm()** — provides LLM instance with Anthropic API
  2. **sheep.observability.logging.get_logger()** — provides logger for observability
  3. **sheep.tools.GitCommitTool, GitPushTool** — git tools (used via content_generators functions)

  ### Consumed by Feature Implementation
  1. **sheep.content_generators.create_markdown_file()** — main orchestration function
  2. **sheep.content_generators.validate_markdown_file()** — content validation
  3. **sheep.config.llm.get_reasoning_llm()** — prose generation

  ### No Modifications Required
  - No source code files in src/sheep/ require changes
  - No configuration files (pyproject.toml, .env) require changes
  - No test files require updates
  - No CI/CD workflows require modification

  ## Implementation Approach for Feature 296

  Given the established pattern, feature implementation is straightforward:

  1. Create src/sheep/features/feature_296_markdown_file_creation.py
  2. Call `create_markdown_file(filename="test-v4dx46.md", feature_number=296)`
  3. Handle any exceptions and return status
  4. Add entry point to CLI if needed (optional, for testability)

  This follows the exact pattern from feature_294 (and 290+ prior features):
  - Simple wrapper function
  - Imports from content_generators
  - Single entry point
  - Error handling and logging
  - Returns result dict or status code

  ### Code Template (Pattern from Feature 294)

  ```python
  \"\"\"Implementation for feature 296: Create markdown file test-v4dx46.md with prose content.\"\"\"
  from pathlib import Path
  from sheep.content_generators import create_markdown_file
  from sheep.observability.logging import get_logger

  FEATURE_NUMBER = 296
  MARKDOWN_FILENAME = "test-v4dx46.md"

  def create_test_v4dx46_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      \"\"\"Create markdown file for feature 296.\"\"\"
      if repo_path is None:
          repo_path = str(Path.cwd())
      return create_markdown_file(
          filename=MARKDOWN_FILENAME,
          repo_path=repo_path,
          feature_number=FEATURE_NUMBER,
      )

  def main() -> int:
      \"\"\"Main entry point.\"\"\"
      try:
          result = create_test_v4dx46_markdown_file()
          return 0
      except Exception as e:
          return 1
  ```

  ## Codebase Pattern Alignment

  This feature follows the established pattern observed in:
  - src/sheep/features/feature_294_markdown_file_creation.py (most recent)
  - src/sheep/features/feature_293_markdown_file_creation.py
  - src/sheep/features/feature_290_markdown_file_creation.py
  - And 285+ other markdown file creation features

  All of these features:
  1. Use `create_markdown_file()` from content_generators
  2. Call `get_reasoning_llm()` for prose generation
  3. Rely on pathlib + subprocess for file and git operations
  4. Implement comprehensive validation
  5. Use conventional commit messages: `feat(N): create markdown file filename with prose content`

  No deviations from this pattern are needed or recommended.

  ## Risk Assessment

  ### Low Risk
  - Feature is well-understood from 290+ prior implementations
  - Technology stack is proven and tested
  - No external dependencies beyond crewai (already in requirements)
  - Fully reversible (can delete file and revert commit)
  - Spec compliance is straightforward and validated automatically

  ### No Known Issues
  - Content generation is reliable with temperature=0.2
  - File I/O is straightforward (no complex operations)
  - Git operations use standard CLI (guaranteed availability)
  - Validation catches specification violations

  ### Mitigation Strategies
  - Comprehensive validation prevents silent failures
  - Logging provides visibility into each step
  - Exception handling allows graceful error reporting
  - Pattern reuse reduces novel code and risk

  ---

  _Research phase complete — all technical decisions evaluated, alternatives considered, rationale documented, ready for implementation planning_
