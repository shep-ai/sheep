content: |
  ## Summary

  Feature 296 implementation is executed across 6 concrete tasks spanning 3 logical phases, estimated at ~65 minutes total effort:

  **Phase 1 (Foundation — 10 min)**: Create Python module file with proper structure, imports, and constants.
  This phase sets up the baseline with zero implementation complexity. Task 1 only: Create feature_296_markdown_file_creation.py.

  **Phase 2 (Implementation — 25 min)**: Implement two functions that orchestrate markdown file creation.
  Task 2 implements create_test_v4dx46_markdown_file(), the core feature function that calls the platform's
  create_markdown_file() orchestration function, delegating all heavy lifting (prose generation, file I/O,
  validation, git) to existing utilities. Task 3 implements main() function as CLI entry point with error
  handling. Both functions follow the established pattern from feature_294 (immediate predecessor).
  Together, these tasks add ~30 lines of code implementing the full feature.

  **Phase 3 (Validation — 30 min)**: Execute the feature and comprehensively verify all outputs.
  Task 4 executes the feature to create test-v4dx46.md (5-8 seconds actual runtime).
  Task 5 verifies file properties: existence, UTF-8 encoding without BOM, Unix LF line endings,
  markdown structure (H1 heading + blank line + 2-3 prose sentences), file size (400-600 bytes).
  Task 6 verifies git operations: file staged, committed with exact conventional message, pushed to remote.

  ### Key Implementation Pattern

  All feature implementation delegates to existing platform utilities rather than reimplementing functionality:

  - **Prose Generation**: sheep.config.llm.get_reasoning_llm() generates H1 title and prose via Claude API
  - **File I/O**: sheep.content_generators.write_markdown_file() writes with explicit UTF-8 encoding
  - **Validation**: sheep.content_generators.validate_markdown_file() verifies all specification requirements
  - **Git Staging**: sheep.content_generators.git_add() stages file in git index
  - **Git Commit**: sheep.content_generators.git_commit() commits with conventional message
  - **Git Push**: sheep.content_generators.git_push() pushes to remote with upstream tracking
  - **Orchestration**: sheep.content_generators.create_markdown_file() coordinates all steps in one function
  - **Logging**: sheep.observability.logging.get_logger() provides consistent logging throughout

  The feature implementation is a thin wrapper (~30 lines) that calls create_markdown_file() with appropriate
  parameters (filename=\"test-v4dx46.md\", feature_number=296). This approach has been validated across
  290+ identical features (features 005-295), all using the same pattern successfully.

  ### Execution Flow

  1. **Phase 1 (Foundation)**: Create module file and define constants (Task 1 — 10 min)
  2. **Phase 2 (Implementation)**: Implement core function (Task 2 — 15 min) and CLI entry point (Task 3 — 10 min)
  3. **Phase 3 (Validation)**:
     - Execute feature (Task 4 — 5 min actual runtime + 0 min verification)
     - Verify file properties (Task 5 — 15 min verification)
     - Verify git operations (Task 6 — 10 min verification)

  All tasks are sequential (each depends on previous) because later tasks depend on outputs from earlier tasks.
  Parallel execution is not applicable. Tasks must be executed in order: 1 → 2 → 3 → 4 → 5 → 6.

  ### Effort Breakdown

  | Phase | Task | Effort | Purpose |
  | ----- | ---- | ------ | ------- |
  | Foundation | 1 | 10min | Module structure, imports, constants |
  | Implementation | 2 | 15min | Core function calling platform utilities |
  | Implementation | 3 | 10min | CLI entry point with error handling |
  | Validation | 4 | 5min | Execute feature (runtime + minimal verification) |
  | Validation | 5 | 15min | Verify file properties (encoding, line endings, structure, size) |
  | Validation | 6 | 10min | Verify git operations (staged, committed, pushed) |
  | **Total** | | **65min** | **Complete feature implementation with comprehensive validation** |

  This estimate aligns with the feature specification's S (small, 10-20 min) size estimate when accounting for
  comprehensive validation. Actual implementation is quick (~25 min); validation is thorough (~30 min).

  ### No Modifications to Existing Code

  This feature creates a new file only (src/sheep/features/feature_296_markdown_file_creation.py) and modifies
  no existing source code, tests, configuration, or infrastructure. The feature operates entirely through calling
  established platform utilities (sheep.content_generators.create_markdown_file() and related functions).
  This isolation introduces zero risk to existing functionality. The feature is essentially a configuration
  wrapper over proven, tested infrastructure used by 290+ prior markdown file creation features.

  ### Success Indicators

  **Phase 1 Completion**: Module file exists with proper structure, can be imported without errors.

  **Phase 2 Completion**: Both functions implemented, feature can be executed via create_test_v4dx46_markdown_file() or main().

  **Phase 3 Completion**:
  - File test-v4dx46.md created in repository root
  - File contains H1 heading, blank line, 2-3 prose sentences
  - File encoded as UTF-8 without BOM, uses Unix LF line endings
  - File size 400-600 bytes
  - File staged, committed with exact message, pushed to remote origin
  - All 11 success criteria from feature specification met
  - Feature ready for code review and merge

  ---

  _Task breakdown complete — concrete work items defined, TDD cycles specified, dependencies established, effort estimated, ready for execution_
