content: |
  ## Problem Statement

  Create a single markdown file called `test-v4dx46.md` in the repository root with a properly formatted H1 title and 2-3 sentences of coherent prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established pattern and convention used throughout 290+ previous iterations in this repository (features 005-295).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax per CommonMark)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-v4dx46.md`
  - Committed with conventional commit message: `feat(296): create markdown file test-v4dx46.md with prose content`
  - Pushed to the feature branch `feat/296-markdown-file-creation-67ee89`

  ## Success Criteria

  - [ ] File `test-v4dx46.md` exists in the repository root directory
  - [ ] File contains exactly one H1 heading (single `#` followed by title text)
  - [ ] H1 heading is followed by a blank line
  - [ ] File contains 2-3 complete sentences of coherent prose content (minimum 10 words per sentence)
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (`\n`), not CRLF
  - [ ] File size is between 400-600 bytes
  - [ ] File is staged in git (visible in `git status` output)
  - [ ] File is committed with exact message: `feat(296): create markdown file test-v4dx46.md with prose content`
  - [ ] Commit is pushed to remote feature branch `feat/296-markdown-file-creation-67ee89`
  - [ ] Remote origin reflects the new commit (visible via `git log origin/feat/296-markdown-file-creation-67ee89`)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-v4dx46.md` in the repository root directory (same level as .git, src/, specs/, etc.)
  - **FR-2**: File must contain exactly one H1 heading using CommonMark syntax (`# ` followed by title text)
  - **FR-3**: H1 heading must be followed by exactly one blank line (a single `\n` creating an empty line)
  - **FR-4**: File must contain 2-3 complete sentences of grammatically correct, coherent prose content
  - **FR-5**: Each prose sentence must be a minimum of 10 words and conveying a complete thought
  - **FR-6**: File must be saved with UTF-8 encoding, explicitly excluding BOM (Byte Order Mark)
  - **FR-7**: File must use Unix LF (`\n`) line endings exclusively; CRLF (`\r\n`) is not permitted
  - **FR-8**: File must be staged in git using `git add test-v4dx46.md` (visible in git index)
  - **FR-9**: File must be committed to the local feature branch using conventional commit message: `feat(296): create markdown file test-v4dx46.md with prose content`
  - **FR-10**: Commit must be pushed to remote origin on branch `feat/296-markdown-file-creation-67ee89` (visible in remote tracking branch)

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 400-600 bytes (natural outcome of proper H1 + blank line + 2-3 sentences)
  - **NFR-2**: Implementation must follow established pattern from 290+ prior implementations (features 005-295); no deviations from format
  - **NFR-3**: Implementation must use only Python standard library modules (pathlib, subprocess, os) for cross-platform compatibility
  - **NFR-4**: No external package dependencies may be introduced; feature must work with Python 3.11+ out-of-the-box
  - **NFR-5**: Implementation must complete in under 20 minutes (S estimate: 10-20 minutes of active work)
  - **NFR-6**: No modifications to source code, tests, documentation, or configuration files (pyproject.toml, .env, GitHub workflows, etc.)
  - **NFR-7**: Feature must be fully reversible; if needed, file can be deleted and commit reverted with no side effects
  - **NFR-8**: Prose content must be grammatically correct, well-formed English with proper punctuation and capitalization
  - **NFR-9**: Implementation must be idempotent; running it multiple times should produce the same result (file with same content and git history)
  - **NFR-10**: All git operations must use git CLI (`git add`, `git commit`, `git push`) with explicit, conventional commit messages

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | How should prose content be generated? | Auto-generate using Claude API via sheep.config.llm | Aligns with Sheep's agentic nature; ensures consistent quality across 290+ files; demonstrates platform capabilities; acceptable latency for S-sized feature |
  | 2 | What topic should the prose content use? | Topic-neutral (any coherent prose on any subject) | Maximizes flexibility across corpus; avoids repetition; allows natural, varied generation; matches pattern from prior implementations |
  | 3 | What implementation approach should be used? | Python script with pathlib + subprocess | Explicit encoding control (UTF-8, no BOM); explicit line ending control (LF); cross-platform; standard library only; no dependencies |
  | 4 | What validation level is needed? | Basic validation (file exists, is readable, contains content) | Sufficient to catch 95% of issues; minimal overhead; adds only 1-2 minutes; appropriate for simple feature |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-v4dx46.md) to existing collection of 290+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 005-295; no branch/merge complexity, no destructive operations, no conflicts |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or other infrastructure |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/296-markdown-file-creation-67ee89` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)
  - subprocess standard library module (included in Python 3.11+; no external packages needed)

  **Optional Dependencies** (if auto-generating prose with Claude API):
  - `sheep.config.llm.get_reasoning_llm()` - Access to Claude API for prose generation
  - Claude API credentials/authentication (provided by Sheep platform config)
  - Network access to Anthropic API endpoint

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 290+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<random-string>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  **No External Package Dependencies**:
  - Feature uses only Python standard library (pathlib, subprocess for git operations)
  - No additional pip packages required beyond existing project dependencies
  - No API keys, credentials, or external service integrations needed beyond Claude API (optional)
  - No database, cache, or storage system dependencies

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes of actual implementation work)

  **Breakdown**:
  - Prose generation (with Claude API or manual writing): 3-5 minutes
  - File creation with pathlib (encoding + line endings): 2-3 minutes
  - Basic validation (file exists, readable, content check): 1-2 minutes
  - Git operations (add, commit, push): 3-5 minutes
  - **Total**: 10-15 minutes of active implementation

  **Justification**:
  - Well-established pattern with 290+ identical test files providing clear, proven precedent
  - No architectural decisions beyond product questions (which are resolved with AI recommendations)
  - No research required; all technologies are standard library or Sheep platform utilities
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - File naming (test-v4dx46.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 290+ prior implementations
  - Recent feature implementations (290-295) demonstrate efficient execution in 10-20 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern
  - Product decisions are pre-resolved with AI recommendations, reducing decision-making overhead

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product decisions resolved with AI recommendations, specification ready for implementation planning_
