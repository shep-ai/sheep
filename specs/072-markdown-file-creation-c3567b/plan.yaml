content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-17
  - **Status:** Complete — architecture and strategy documented

  ## Architecture Overview

  Feature 072 is a minimal, isolated file creation task that follows an established pattern proven by 65+ existing
  test files in the repository root. The implementation is straightforward:

  1. **File Creation:** Generate markdown content with H1 heading + blank line + 2-3 sentences of prose
  2. **Validation:** Verify structure, encoding (UTF-8), line endings (LF), and file size (350-650 bytes)
  3. **Git Workflow:** Stage → commit → push following the standard pattern from features 064-071

  The architecture has **zero impact on application source code** (/src/sheep/), **no external dependencies**
  (all Python standard library), and **no configuration changes**. The feature is self-contained at the repository
  root and does not interact with the application architecture.

  ### Codebase Integration Points

  - **Repository Root:** Adds one new markdown file to the existing collection of 65+ test-*.md files
  - **Git Workflow:** Uses standard git commands (add, commit, push) via subprocess module
  - **No Application Changes:** Does not depend on or touch any source code, tests, or configuration

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib.Path.write_text(encoding='utf-8')

  **Chosen:** Use pathlib directly with explicit UTF-8 encoding

  **Rationale:**
  - Built into Python 3.11+ standard library (no external dependencies per NFR-9)
  - Safe from injection attacks (filename is hardcoded)
  - Automatically handles file creation, encoding, and closing
  - Explicit encoding='utf-8' ensures UTF-8 on all platforms and prevents BOM insertion (NFR-1)
  - Modern, idiomatic Python approach preferred over shell commands or manual file handling
  - Proven in the create_markdown.py precedent and 65+ existing test files

  ### 2. Validation: Lightweight Structural Checks

  **Chosen:** Runtime validation of H1 heading, blank line separator, sentence count, encoding, line endings, file size

  **Rationale:**
  - No external dependencies (matches research decision to avoid CommonMark parser)
  - Catches common formatting errors early (missing heading, wrong structure, wrong sentence count)
  - Validates encoding (UTF-8 with no BOM) and line endings (LF only, no CRLF)
  - File size check (350-650 bytes) catches obviously malformed content
  - Proven approach in create_markdown.py with clear error messages for debugging

  ### 3. Git Workflow: subprocess.run() with List Syntax

  **Chosen:** Use Python subprocess.run(['git', ...], check=True) for add, commit, and push

  **Rationale:**
  - Standard Python module for CLI tool invocation (built-in, no external dependencies)
  - List syntax avoids shell escaping issues and injection risks
  - check=True provides automatic error handling (raises CalledProcessError on non-zero exit)
  - Workflow follows features 064-071: add → commit --no-verify → push -u origin HEAD
  - The --no-verify flag is appropriate for automation context where upstream validation occurs

  ### 4. Content: Direct Prose Composition

  **Chosen:** Hardcoded H1 heading and 2-3 sentences of prose content

  **Rationale:**
  - Topic completely unrestricted per product decision ("about anything")
  - Direct composition avoids unnecessary templating or abstraction
  - Simple, single-use feature (not a reusable utility)
  - Matches approach in create_markdown.py and existing test files
  - Basic readability validation (per product decision) is sufficient; no strict grammar enforcement

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1 → Phase 2 Sequential Dependency:**

  Phase 1 (File Creation and Validation) must complete before Phase 2 (Git Integration) because:
  - Git operations require the file to exist and be valid
  - Validation ensures the file meets all success criteria before staging
  - Early validation catches errors before git commit (reduces rework)

  ### Phase 1: File Creation and Validation

  **What gets built:**
  1. Markdown file (test-2ak324.md) with proper structure, encoding, and content
  2. Validation logic that verifies the file meets all success criteria

  **Why this comes first:**
  - The file must exist and be valid before git operations can be performed
  - Early validation prevents invalid files from being committed
  - Straightforward file creation is the natural first step

  **Tasks in this phase:**
  - Create markdown file with H1 heading and 2-3 sentences
  - Validate file structure (heading, blank line, sentence count)
  - Validate file encoding (UTF-8, no BOM)
  - Validate line endings (LF only, no CRLF)
  - Validate file size (350-650 bytes)

  ### Phase 2: Git Integration and Publication

  **What gets built:**
  1. File staging with git add
  2. Conventional commit with message: `feat(072): create markdown file test-2ak324.md with prose content`
  3. Push to remote origin on the feature branch

  **Why this comes after Phase 1:**
  - Depends on Phase 1's file creation and validation
  - Standard git workflow (add → commit → push)
  - Final step that makes the feature visible in the repository

  **Tasks in this phase:**
  - Stage file with git add test-2ak324.md
  - Commit with conventional message and --no-verify flag
  - Push to remote origin with -u origin HEAD (establishes branch tracking)

  ## Risk Mitigation

  | Risk | Mitigation | Probability | Impact |
  | ---- | ---------- | ----------- | ------ |
  | File encoding mismatch (not UTF-8) | Explicit encoding='utf-8' parameter in write_text(); validation via read_bytes() | Very Low | Low (validation catches it; can regenerate) |
  | Line ending corruption (CRLF on Windows) | Validation check for b'\r\n' in file bytes; explicit LF-only content | Very Low | Low (validation catches it; can regenerate) |
  | Git authentication failure | Feature branch pre-created; standard git workflow; --no-verify avoids hook complexity | Very Low | High (blocks feature completion) — **Mitigation:** Assume git is configured (standard for CI/automation) |
  | Sentence count validation error (false positive) | Simple period-counting heuristic; test with sample prose before full implementation | Low | Low (easy to adjust prose if needed) |
  | File size out of range | Target typical range (450-500 bytes); validation allows 350-650 byte range for flexibility | Very Low | Low (easy to adjust prose length) |
  | Syntax error in Python code | Test script locally before running in feature branch; follow create_markdown.py precedent | Very Low | Medium (would require debugging and retry) |
  | Git push fails (no network/permissions) | Standard git error handling via subprocess.run(check=True); clear error messages | Very Low | High (blocks feature completion) — **Mitigation:** Assume standard CI/automation environment |

  ## Rollback Plan

  If implementation fails at any point, rollback is trivial:

  1. **Phase 1 failure (file creation/validation):** Delete test-2ak324.md, investigate validation error
  2. **Phase 2 failure (git):** Git reset HEAD test-2ak324.md (unstage), delete file, retry
  3. **Post-push failure:** Force reset is not needed; the feature can be rolled back by reverting the commit or deleting the file on next push

  No destructive git operations are required; the feature is easily reversible.

  ## Success Criteria

  Implementation is complete when:

  - [ ] File test-2ak324.md exists in repository root with H1 heading + blank line + 2-3 sentences
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix LF line endings only
  - [ ] File size is 350-650 bytes
  - [ ] File is staged in git (git add)
  - [ ] Commit exists with message: `feat(072): create markdown file test-2ak324.md with prose content`
  - [ ] Commit is on feature branch `feat/072-markdown-file-creation-c3567b`
  - [ ] Changes have been pushed to remote origin

