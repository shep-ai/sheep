decisions:
  - title: 'File I/O Implementation Approach'
    chosen: 'Python pathlib.Path.write_text() with explicit UTF-8 encoding'
    rejected:
      - 'Subprocess with shell commands (echo/cat) — less safe, requires shell escaping for special characters, not idiomatic Python'
      - 'Manual open() file handling — more verbose, requires explicit encoding/closing, higher error surface'
    rationale: >
      pathlib.Path.write_text() is the modern, safe, and idiomatic Python approach. It is built into the standard
      library (NFR-9), automatically handles file creation and closing, supports explicit encoding parameter
      (ensuring UTF-8 per NFR-1), and is immune to injection attacks. This matches the create_markdown.py precedent
      and the established pattern across 65+ existing test files. The explicit encoding='utf-8' parameter ensures
      consistent behavior across all platforms (Linux, macOS, Windows) and prevents BOM insertion.

  - title: 'Encoding and Line Ending Handling'
    chosen: 'Explicit UTF-8 with write_text(); validation via read_bytes() BOM check and b\r\n detection'
    rejected:
      - 'Default system encoding — may not be UTF-8 on all systems, risks NFR-1 non-compliance'
      - 'Binary mode with manual UTF-8 encoding (encode/decode) — unnecessary complexity, error-prone'
    rationale: >
      write_text(encoding='utf-8') guarantees UTF-8 encoding on all platforms. Python''s write_text() respects the
      system newline convention by default, but since the repository requires Unix LF (NFR-2), validation via
      read_bytes() check for b'\r\n' ensures compliance. The newline parameter is unnecessary because: (1) the
      repository uses Git with core.autocrlf disabled (inferred from existing test files), (2) validation catches
      any CRLF violations, and (3) modern Python defaults to LF on Unix systems. This approach is proven in the
      create_markdown.py precedent.

  - title: 'Content Validation Strategy'
    chosen: 'Runtime structural validation: verify H1 heading, blank line, and 2-3 sentences'
    rejected:
      - 'No validation — risks silent non-compliance, could create invalid files that violate success criteria'
      - 'Full CommonMark schema validation library — adds external dependency (violates NFR-9), overkill for simple format'
    rationale: >
      Lightweight runtime validation ensures success criteria compliance without external dependencies. The validation
      checks (H1 heading at start, blank line separator, sentence count 2-3) are simple, deterministic, and catch
      the most common formatting errors. Sentence count is validated by counting periods (.), which is a reliable
      heuristic for typical prose. This approach is proven in create_markdown.py and aligns with the established
      pattern. Validation is essential because: (1) it prevents silent failures, (2) it provides clear error messages
      for debugging, and (3) it ensures all created files meet spec requirements.

  - title: 'Git Integration and Workflow'
    chosen: 'Python subprocess module for git add, commit, and push operations'
    rejected:
      - 'GitPython library — adds external dependency (violates NFR-9), unnecessary complexity for simple git operations'
      - 'Manual git internals — unreliable, not maintainable, requires deep git knowledge'
    rationale: >
      subprocess is the standard Python module for invoking external CLI tools. It is built into the standard library
      (NFR-9), reliable, and the idiomatic approach for git integration in Python. subprocess.run() with check=True
