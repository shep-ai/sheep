# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Status:** Complete — all technical decisions documented and rationale provided

  ## Summary

  Feature 072 is a straightforward, low-risk markdown file creation task following an established pattern used
  successfully in features 064-071. The implementation uses only Python standard library components (pathlib,
  subprocess) with no external dependencies. All technologies are proven, well-documented, and consistent with the
  existing codebase pattern.

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python `pathlib.Path.write_text(encoding='utf-8')`

  **Rejected:**
  - Subprocess shell commands (echo/cat) — unsafe for special characters, not idiomatic Python
  - Manual open() file handling — verbose, requires explicit encoding/closing, higher error surface
  - subprocess cat << EOF — dangerous for multiline content, requires shell escaping

  **Rationale:**
  pathlib is the modern Python standard for file operations. It automatically handles file creation, encoding,
  and closing. The explicit `encoding='utf-8'` parameter ensures UTF-8 encoding on all platforms and prevents
  BOM insertion (NFR-1). This approach is safe from injection, idiomatic, and proven in create_markdown.py and
  65+ existing test files. pathlib.Path is built into Python 3.11+ (project requirement) and requires no external
  dependencies.

  ### 2. Encoding and Line Ending Validation

  **Chosen:** Explicit UTF-8 encoding with runtime validation via `read_bytes()` checks

  **Rejected:**
  - Default system encoding — may not be UTF-8, risks spec non-compliance
  - Binary mode with manual encode/decode — unnecessary complexity
  - Git core.autocrlf — relies on repository configuration, not resilient

  **Rationale:**
  `write_text(encoding='utf-8')` guarantees UTF-8 on all platforms. Validation via `read_bytes()` check for
  BOM (b'\xef\xbb\xbf') ensures NFR-1 compliance. Detection of b'\r\n' catches Windows CRLF, ensuring NFR-2
  (LF line endings). This defensive approach is proven in create_markdown.py. No need for explicit `newline='\n'`
  parameter because the repository environment uses Unix LF, and validation provides a safety net.

  ### 3. Content Validation

  **Chosen:** Lightweight structural validation (H1 heading, blank line separator, 2-3 sentences)

  **Rejected:**
  - No validation — risks silent spec violations
  - Full CommonMark parser — adds external dependency, overkill for simple format

  **Rationale:**
  Simple, built-in validation ensures all created files meet success criteria. Checks for H1 heading at start,
  blank line separator, and sentence count (via period counting) are deterministic and lightweight. This catches
  common formatting errors (missing heading, wrong structure, wrong sentence count) early. Proven in create_markdown.py.
  No external dependencies required (NFR-9).

  ### 4. Git Workflow Integration

  **Chosen:** Python `subprocess.run()` for git add, commit, and push

  **Rejected:**
  - GitPython library — adds external dependency (violates NFR-9)
  - Manual git invocation — less reliable, no error checking

  **Rationale:**
  subprocess is the standard Python module for CLI tool invocation, built into the standard library. Using
  `subprocess.run(['git', 'add', ...], check=True)` avoids shell escaping issues and provides automatic error
  handling. The workflow (add → commit --no-verify → push -u origin HEAD) follows features 064-071 and is proven.
  The --no-verify flag skips pre-commit hooks, appropriate for CI/automation where upstream validation occurs.

  ### 5. Topic Selection and Prose Generation

  **Chosen:** Direct prose composition; topic completely unrestricted per product decision

  **Rejected:**
  - Template-based generation — unnecessary abstraction for 2-3 sentences
  - Topic validation from list — violates product decision

  **Rationale:**
  Per product decision, topic is unrestricted ("about anything"). Implementer has full autonomy. Prose quality
  is basic readability (per product decision), not strict grammar. Direct composition avoids AI/template complexity.
  This is consistent with create_markdown.py approach and maximizes flexibility.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O and path handling | Use (standard library) | Built-in, modern, safe, handles encoding automatically. No alternatives needed. |
  | subprocess | Git command execution | Use (standard library) | Built-in, standard for CLI tool invocation, reliable error handling via check=True. |
  | GitPython | Git operations via Python API | Reject | External dependency (violates NFR-9); subprocess is simpler and sufficient for this use case. |
  | CommonMark or markdown parser | Markdown validation | Reject | External dependency; lightweight structural validation is sufficient for this simple format. |
  | pytest or unittest | Testing framework | Not required | No test modifications needed (NFR-7); validation happens at runtime during file creation. |

  ## Security Considerations

  1. **File Path Injection:** Not applicable. The filename `test-2ak324.md` is hardcoded, not user-input.

  2. **Content Injection:** Prose content is hardcoded, not from external input. No injection risk.

  3. **Git Command Injection:** subprocess is used with list syntax (`['git', 'add', ...]`), not shell=True.
     This prevents command injection even if filenames contained special characters (though they don't here).

  4. **File Encoding Attacks:** Explicit UTF-8 encoding without BOM prevents encoding-based attacks. Validation
     ensures no hidden characters or unusual encodings are introduced.

  5. **Git Security:** Using `--no-verify` skips pre-commit hooks, but this is acceptable in CI/automation context.
     Standard git signing is not required for this feature (typical for test artifacts).

  **Conclusion:** No security vulnerabilities identified. All inputs are hardcoded. All external tool invocations
  use safe subprocess patterns.

  ## Performance Considerations

  1. **File I/O:** Single file creation (~500 bytes) is negligible. No performance concerns.

  2. **Encoding/Validation:** UTF-8 encoding and validation (read_bytes, string operations) are O(file_size).
     For a ~500-byte file, this is microseconds. No optimization needed.

  3. **Git Operations:** Three git subprocess calls (add, commit, push). Network-bound on push, negligible for
     modern systems. No performance concerns.

  4. **Scalability:** This feature creates one file per run. No scalability issues.

  **Conclusion:** No performance optimization needed. All operations are inherently fast for this scope.

  ## Architecture Notes

  This feature fits seamlessly into the existing codebase architecture:

  - **Repository Root Test Files:** The 65+ existing test-*.md files demonstrate this is an established pattern.
    This feature adds one more file following the identical structure, content format, and git workflow.

  - **No Source Code Impact:** This feature only creates a markdown file at the repository root. It does not
    touch /src/sheep/, /tests/, or any configuration files (NFR-7). Zero architectural impact.

  - **Standard Git Workflow:** The feature uses the standard git workflow (branch → create file → add → commit →
    push), consistent with all prior features. No new git patterns introduced.

  - **No New Dependencies:** All technologies (pathlib, subprocess, UTF-8, LF) are built-in or standard. NFR-9
    is satisfied (no external package dependencies).

  - **Implementation Pattern:** The create_markdown.py script provides a complete, tested precedent for this
    exact task. The implementation can reuse this pattern directly, reducing risk and development time.

  ## Risk Assessment

  **Overall Risk:** Very Low

  - **Complexity:** Minimal. Single file creation with straightforward validation.
  - **Testing:** Covered by success criteria validation. No additional test infrastructure needed.
  - **Dependencies:** Zero external dependencies. Only Python standard library.
  - **Reversibility:** Trivial. File deletion and branch reset are straightforward if needed.
  - **Precedent:** 65+ identical test files + create_markdown.py script provide clear, proven pattern.

  ## Recommendations for Implementation Phase

  1. **Reuse create_markdown.py Pattern:** The existing create_markdown.py script (features 069-071) provides
     a complete, tested reference implementation. Adapt it by updating:
     - FILENAME = "test-2ak324.md"
     - PROSE_CONTENT = (your chosen prose with H1 heading + 2-3 sentences)
     - commit_message = "feat(072): create markdown file test-2ak324.md with prose content"

  2. **Topic Selection:** Choose any topic of interest. Examples from existing files: "The Power of Persistence",
     "The Moon and Its Impact on Earth", etc. Keep prose readable and 2-3 sentences.

  3. **Validation:** The validation logic in create_markdown.py is proven. Reuse the validate_file() function
     unchanged for consistency.

  4. **Git Workflow:** Use the subprocess-based git workflow (add → commit --no-verify → push) directly.
     No deviations needed.

  5. **File Size:** Target 400-600 bytes (validate 350-650 range). A typical H1 heading + 2-3 sentences = ~450-500 bytes.

  ---

