      already validated upstream.

  - title: 'Content Generation and Topic Selection'
    chosen: 'Direct prose composition; topic completely unrestricted per product decision'
    rejected:
      - 'Template-based generation — adds unnecessary abstraction, overengineering for a single 2-3 sentence task'
      - 'Topic validation/curation — violates product decision to be unrestricted, adds unnecessary validation'
