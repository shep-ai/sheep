content: |
  ## Architecture Overview

  ### Codebase Integration

  This feature follows the **content-driven test pattern** established in the Sheep project:
  - **Specification-first development**: Requirements defined in spec.yaml before implementation
  - **Markdown file creation**: Create a single markdown test file at repository root
  - **Git workflow integration**: Stage, commit, and push using conventional commits
  - **Repetitive pattern validation**: Features 287-292 follow identical structure, confirming approach

  The file is created at the same directory level as 90+ existing test files (test-ghvqqs.md, test-p1rf9x.md, etc.).
  No changes to application code, configuration, or infrastructure are required.

  ### Key Constraints

  - **File path**: Must be at repository root (test-msaxvu.md)
  - **Structure**: H1 heading → blank line → 2-3 sentences → trailing newline
  - **Encoding**: Explicit UTF-8 (per spec requirement)
  - **Content**: Complete creative freedom on prose topic and style
  - **Verification**: Manual via CLI commands (per spec)
  - **Size estimate**: S (5-10 minutes per spec)

  ## Key Design Decisions

  ### 1. File Creation Method: Python pathlib

  **Decision**: Use `pathlib.Path('test-msaxvu.md').write_text(content, encoding='utf-8')`

  **Rationale**:
  - Modern standard for file I/O in Python 3.11+
  - Cross-platform (handles Windows/Unix path separators automatically)
  - Explicit UTF-8 encoding parameter ensures consistency across platforms
  - Concise one-line syntax; more Pythonic than open() or os module
  - Proven in features 287-292 (established pattern in codebase)

  **Alternatives rejected**:
  - Bash/shell redirection: Less portable, requires escaping, harder to control encoding
  - Python open() with context manager: More verbose, older API
  - os module file operations: Lower-level, less expressive

  ### 2. Content Strategy: Hardcoded Prose

  **Decision**: Write content directly in implementation code (title + 2-3 sentences)

  **Rationale**:
  - Spec explicitly grants complete creative freedom for prose topic and content
  - Analysis of 90+ existing test files shows each has unique, hand-written content
  - Simplest approach; eliminates unnecessary complexity and dependencies
  - Matches established pattern in this codebase

  **Alternatives rejected**:
  - Template-based generation: Unnecessary complexity for fixed requirements
  - Randomized/procedurally generated: Violates determinism
  - External content file: Adds dependency, violates minimalism

  ### 3. Git Workflow: Python subprocess

  **Decision**: Execute git commands via `subprocess.run(['git', ...], check=True, capture_output=True)`

  **Rationale**:
  - Standard library module; no external dependencies
  - Reliable for simple local command execution
  - Three operations needed: `git add`, `git commit`, `git push`
  - Proven in features 287-292
  - check=True ensures errors are caught and raised

  **Alternatives rejected**:
  - GitPython library: External dependency, overkill for simple operations
  - Manual shell commands: Error-prone, not reproducible
  - Pre-commit hooks: Adds infrastructure complexity not justified by spec

  ### 4. Markdown File Structure: Standard Pattern

  **Decision**: H1 heading → blank line → 2-3 prose sentences → trailing newline

  **Structure**:
  ```
  # Title Here

  First sentence with period. Second sentence? Third sentence!

  ```

  **Rationale**:
  - Standard Markdown best practice (one H1 per document)
  - Blank line after heading improves readability
  - Matches structure of all 90+ existing test files in repository
  - Renders correctly in GitHub markdown parser
  - Trailing newline follows Unix/POSIX file format conventions

  **Alternatives rejected**:
  - Multiple H1 headings: Violates CommonMark best practice
  - No blank line after heading: Reduces readability
  - Multiple paragraphs: Violates 2-3 sentence requirement

  ### 5. Character Encoding: Explicit UTF-8

  **Decision**: `pathlib.Path.write_text(content, encoding='utf-8')`

  **Rationale**:
  - Spec explicitly requires UTF-8 encoding
  - Explicit encoding parameter ensures consistency across platforms (Windows, Linux, macOS)
  - Prevents locale-dependent behavior
  - Standard for modern markdown files and GitHub compatibility

  **Alternatives rejected**:
  - System default encoding: Varies by OS/locale, causes portability issues
  - No explicit encoding: Less explicit, potential encoding surprises
  - ASCII-only: Too restrictive, UTF-8 is modern standard

  ### 6. Validation: Manual CLI Verification

  **Decision**: Manual verification using standard CLI tools per spec

  **Commands**:
  - `ls -la test-msaxvu.md` — Verify file exists
  - `head -n 1 test-msaxvu.md` — Verify H1 heading format
  - `grep -o '[.!?]' test-msaxvu.md | wc -l` — Count sentence-ending punctuation
  - `tail -c 1 test-msaxvu.md | od -c` — Verify trailing newline
  - GitHub web UI — Verify markdown renders correctly

  **Rationale**:
  - Spec explicitly recommends manual verification
  - Requires no additional tooling or infrastructure
  - Proven across 90+ test files
  - Simple and transparent; matches documented verification strategy

  **Alternatives rejected**:
  - Automated Python validation script: Adds complexity, contradicts spec guidance
  - Pre-commit hooks with linting: Unnecessary for simple markdown
  - GitHub Actions CI: Overkill for content-only feature

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (File Creation)** — Must come first. Creates the actual file content that will be committed.
  2. **Phase 2 (Git Integration)** — Depends on Phase 1. File must exist before it can be staged and committed.
  3. **Phase 3 (Verification)** — Depends on Phase 2. Verify file structure and git operations after completion.

  ### Why This Approach

  - **Linear progression**: Each phase has clear dependencies; no parallelization possible
  - **Minimal scope**: Only creates new file; no modifications to existing code
  - **Proven pattern**: Matches exactly the approach in features 287-292
  - **Low risk**: Content creation has zero impact on application code or infrastructure

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | File already exists (test-msaxvu.md) | Low | Use unique filename from spec; check before creating |
  | Encoding issues (non-UTF-8) | Very Low | Explicit UTF-8 parameter in pathlib.write_text() |
  | Git push failure (wrong branch) | Low | Verify current branch is feat/293-markdown-file-creation-d78f9d before push |
  | Git authentication failure | Very Low | Use existing git config; no new credentials needed |
  | Content doesn't meet spec | Medium | Follow spec checklist: H1 heading, 2-3 sentences, professional tone |
  | File not staged correctly | Low | Verify git status shows file staged before commit |
  | Commit message format wrong | Low | Use exact format from spec: feat(293): create markdown file test-msaxvu.md with prose content |
  | Trailing newline missing | Low | Pathlib.write_text() with single write ensures newline; verify with tail -c 1 |

  ## Dependencies

  **External Dependencies**: None. Uses only Python standard library (pathlib, subprocess).

  **Internal Dependencies**: None. Feature is self-contained; no reliance on other features or application code.

  **Git Dependencies**: Assumes git is configured and current branch is feat/293-markdown-file-creation-d78f9d (per environment setup).

