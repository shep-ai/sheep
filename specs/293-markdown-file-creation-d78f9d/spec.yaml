content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-msaxvu.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 90+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 069-292, with identical requirements and implementation approach.

  ## Success Criteria

  - [x] File `test-msaxvu.md` is created at repository root (same directory level as test-ghvqqs.md, test-p1rf9x.md, etc.)
  - [x] First line of file is a valid H1 markdown heading (starts with `#` followed by space and title text)
  - [x] File contains exactly 2-3 sentences of prose content after the heading (2-3 sentence-ending punctuation marks: . ? !)
  - [x] File ends with a newline character (no missing final newline)
  - [x] File is valid CommonMark markdown syntax
  - [x] Prose content is respectful and professional
  - [x] File is staged in git (`git add test-msaxvu.md`)
  - [x] Single commit created with conventional commit message format (`feat(293): create markdown file test-msaxvu.md with prose content`)
  - [x] Commit is pushed to feature branch (`feat/293-markdown-file-creation-d78f9d`)
  - [x] GitHub web UI renders the markdown file correctly

  ## Functional Requirements

  - **FR-1**: System must create a markdown file named `test-msaxvu.md` at the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading on the first line (format: `# Title Text`)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading (counted by sentence-ending punctuation: . ? !)
  - **FR-4**: File content must be encoded as UTF-8 text
  - **FR-5**: File must end with a newline character (proper Unix/POSIX file format)
  - **FR-6**: File must be valid CommonMark markdown that renders in GitHub UI
  - **FR-7**: Implementer must stage the file in git using `git add test-msaxvu.md`
  - **FR-8**: Implementer must create a commit with conventional commit message: `feat(293): create markdown file test-msaxvu.md with prose content`
  - **FR-9**: Implementer must push changes to the feature branch `feat/293-markdown-file-creation-d78f9d`

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow the established pattern from features 287-292 (identical structure and workflow)
  - **NFR-2**: Content must be respectful and professional; no offensive or inappropriate material
  - **NFR-3**: File creation must have zero impact on application code, tests, or configuration files
  - **NFR-4**: Markdown rendering must be compatible with GitHub's markdown parser
  - **NFR-5**: Implementation approach is flexible (Python pathlib, bash, or any method that produces correct file format)
  - **NFR-6**: No automated testing framework integration required; manual verification sufficient
  - **NFR-7**: Implementation timeline is approximately 5-10 minutes (choose topic 1 min, write content 3-5 min, commit/push 1-2 min, verify 1-2 min)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementer have complete freedom to choose prose topic and content? | Complete freedom | 90+ existing test files demonstrate this pattern with diverse topics; user query explicitly says "about anything"; no business constraint on topic choice. |
  | 2 | How should the 2-3 sentences requirement be verified? | Count sentence-ending punctuation (. ? !) | Objective, measurable method; matches existing verification strategy in spec; requires no subjective interpretation. |
  | 3 | Should H1 heading relate to the prose content? | No requirement — independent content | 90+ existing test files show this works without enforcing relevance; maximizes freedom while maintaining simplicity. |
  | 4 | What verification approach after creation? | Manual verification via CLI commands | Matches documented strategy in spec; requires no new tooling; proven across 90+ files. |

  ## Codebase Analysis

  ### Project Structure

  The repository follows a flat, content-centric organization:

  - **Repository Root**: Contains 90+ markdown test files following the naming pattern `test-*.md` (e.g., test-ghvqqs.md, test-p1rf9x.md, test-f7lgjt.md, etc.)
  - **Specs Directory** (`/specs/`): Contains 280+ feature specifications organized by feature number and name (e.g., `/specs/292-markdown-file-creation-814097/spec.yaml`)
  - **Source Code** (`/src/sheep/`): Contains application source code (referenced but not affected by markdown file creation tasks)
  - **Configuration**: `.claude/settings.local.json` provides local configuration for Claude Code

  Recent git history shows a clear pattern of sequential feature implementation (features 283-292) all following the identical markdown-file-creation pattern.

  ### Architecture Patterns

  This repository follows a **content-driven test pattern**:

  1. **Specification-First Development**: Each feature has a `spec.yaml` file defining requirements
  2. **Markdown File Creation**: Features consist primarily of creating single markdown files at the repository root
  3. **Git Workflow**: Implementation includes `git add`, `git commit`, and `git push` operations with conventional commit messages
  4. **Repetitive Pattern**: Features 069-292 follow identical structure, suggesting an established, proven workflow
  5. **No Code Dependencies**: Markdown file creation has zero impact on application code or architecture

  ### Relevant Technologies

  - **Markdown**: Standard file format, CommonMark specification
  - **Git**: Version control, conventional commits (format: `feat(NUMBER): description`)
  - **Python 3.11+**: Runtime environment for file I/O operations (via pathlib module)
  - **File I/O**: Using Python pathlib for creating files, writing content, and managing file paths

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root (/) | Low | Adding a single new markdown file (test-msaxvu.md) with no modifications to existing files |
  | Git History | Low | Single conventional commit added to feature branch; no impact on main branch until merged |
  | Application Code (/src/sheep/) | None | Zero impact on application source code or configuration |
  | Configuration Files | None | No changes to project configuration or dependencies |
  | Tests | None | No new tests required; verification is manual via file existence and content review |

  ## Dependencies

  None. This feature has no dependencies on existing code, libraries, or infrastructure. It is a pure content creation task that:
  - Does not import or depend on any application modules
  - Does not require database changes or migrations
  - Does not modify configuration files
  - Does not impact build, test, or deployment processes
  - Follows the established pattern proven by 90+ preceding test files

  ## Implementation Notes

  - The file should be created at the repository root, at the same directory level as `test-ghvqqs.md`, `test-p1rf9x.md`, `test-f7lgjt.md`, etc.
  - The topic/content is completely open-ended; the implementer has full creative freedom (per product decision Q1)
  - No validation of topic appropriateness is required beyond standard content policies (keep it respectful and professional)
  - File path will be: `/test-msaxvu.md` (at repo root)
  - Commit message should follow conventional format: `feat(293): create markdown file test-msaxvu.md with prose content`
  - Git operations: `git add test-msaxvu.md`, followed by `git commit` and `git push`

  ## Verification Strategy

  No automated tests are required. This is a content-only feature. Success criteria can be verified manually using standard CLI commands:

  1. **File Existence**: `ls -la test-msaxvu.md` — confirm file exists at repository root
  2. **H1 Heading**: `head -n 1 test-msaxvu.md` — first line must start with `#` followed by space
  3. **Sentence Count**: `grep -o '[.!?]' test-msaxvu.md | wc -l` — should show 2 or 3
  4. **Trailing Newline**: `tail -c 1 test-msaxvu.md | od -c` — output should show newline character
  5. **GitHub Rendering**: View file in GitHub web UI — verify markdown renders correctly without errors

  ## Size Estimate

  **S** — Single file creation with no code changes, no tests, no integration required. Implementation takes approximately 5-10 minutes:

  - Choose a topic (1 min)
  - Write a title and 2-3 sentences (3-5 min)
  - Commit and push (1-2 min)
  - Verify on GitHub (1-2 min)

  This is identical in scope and complexity to features 287-292, all marked as size S. The pattern has been proven across 90+ successful markdown file creations in the repository.
