content: |
  ## Architecture Overview

  Feature 299 follows an established pattern from 100+ prior identical features in the codebase.
  The implementation is a straightforward, low-risk artifact creation with no architectural
  complexity or impact on application code.

  **Architecture fit:**
  - Single file creation at repository root (aligned with 100+ existing test markdown files)
  - No source code modifications (`/src/sheep/` untouched)
  - No configuration changes (pyproject.toml, .github workflows unchanged)
  - Standard git workflow (add → commit → push)
  - No external dependencies beyond Python 3.11+ standard library
  - No CI/CD modifications required

  **Pattern consistency:**
  - File placement and format matches 100+ prior test markdown files
  - Prose content structure (H1 + 2-3 sentences) is standard across all similar features
  - Git workflow is identical to established pattern
  - Conventional commit message format (`feat(N): ...`) follows organizational standard

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path.write_text(text, encoding='utf-8')` for file creation.

  **Rationale:**
  - FR-5 explicitly requires pathlib.Path.write_text() method
  - Modern, Pythonic API for file I/O
  - Single-call interface handles file creation, writing, and resource cleanup
  - Explicit encoding='utf-8' parameter ensures UTF-8 without BOM (NFR-1 compliance)
  - No external dependencies required (Python 3.11+ standard library)
  - Established pattern proven across 100+ prior features
  - Zero additional code complexity or maintenance burden

  **Alternatives considered and rejected:**
  - `open()` with context manager: more verbose, awkward encoding handling
  - Built-in `open()` function: older API, less Pythonic
  - External file libraries: unnecessary dependency bloat

  ### 2. Content Generation: Manual Hardcoded Prose

  **Decision:** Manually author prose content specific to this file instance.

  **Rationale:**
  - FR-4 specifies flexible topic choice (nature, technology, science, philosophy, culture, etc.)
  - Ensures high-quality, coherent prose content
  - No external dependencies or API calls required
  - Deterministic, reproducible output
  - Natural file size emergence (400-600 bytes is natural outcome of proper H1 + 2-3 sentences)
  - Matches approach observed in 100+ prior features
  - Zero operational overhead

  **Alternatives considered and rejected:**
  - Template-based generation: unnecessary complexity for single file
  - Random selection from prose pool: risk of incoherent content; external data dependency
  - AI-generated content: external API dependency, latency, cost, verification overhead

  ### 3. Git Operations: Sequential subprocess.run() Calls

  **Decision:** Three sequential `subprocess.run()` calls: `git add`, `git commit`, `git push`.

  **Rationale:**
  - No external dependencies required (subprocess is Python standard library)
  - Explicit error handling for each git operation independently
  - Established, proven pattern from 100+ prior feature implementations
  - Clear, maintainable code familiar to team
  - Easy debugging if any step fails
  - Provides helpful error output (stdout/stderr) for troubleshooting
  - Aligns with sequential workflow requirements (FR-6, FR-7, FR-8)
  - Negligible performance impact (~100-200ms total)

  **Alternatives considered and rejected:**
  - Single shell command with && chaining: loses granular error handling
  - GitPython or pygit2 library: unnecessary external dependency; subprocess is sufficient
  - Git plumbing commands: overly complex; CLI commands are simpler

  ### 4. Line Ending Handling: Native Unix LF

  **Decision:** Rely on `pathlib.Path.write_text()` default behavior producing LF on Unix/Linux.

  **Rationale:**
  - NFR-2 explicitly requires Unix LF line endings
  - pathlib.Path.write_text() produces native LF on Unix/Linux systems
  - Development and CI environments are Unix-based
  - No post-processing required
  - Matches Sheep platform infrastructure assumptions
  - Validation testing ensures correctness
  - Aligns with 100+ prior features using identical approach

  **Alternatives considered and rejected:**
  - Platform-specific line ending detection: unnecessary complexity
  - Explicit post-write conversion: adds unnecessary post-processing
  - Using `os.linesep`: inappropriate for consistent cross-platform behavior

  ### 5. Encoding: Explicit UTF-8 Specification

  **Decision:** Use `encoding='utf-8'` parameter in `pathlib.Path.write_text()`.

  **Rationale:**
  - NFR-1 explicitly requires UTF-8 without BOM
  - Explicit specification ensures deterministic, cross-platform UTF-8 encoding
  - No risk of locale-based encoding surprises on non-English systems
  - Python 3 UTF-8 codec does not add BOM prefix by default
  - Clear intent for code maintainers
  - Matches approach in all 100+ prior markdown file creation features

  **Alternatives considered and rejected:**
  - Rely on system default encoding: risks BOM injection or unexpected encoding
  - No encoding specification: violates NFR-1; introduces platform dependency

  ### 6. Workflow Orchestration: Sequential Synchronous Execution

  **Decision:** Single linear execution flow: create file → stage → commit → push (all synchronously).

  **Rationale:**
  - Clear logical dependencies: file must exist before staging; staging must succeed before committing
  - All operations complete quickly (~100-200ms total); no parallelization benefit
  - Error handling is straightforward in linear flow
  - Matches established pattern from 100+ prior features
  - Simplifies debugging: failures occur at specific, predictable steps
  - Aligns with size estimate: S (Small) implies minimal orchestration overhead

  **Alternatives considered and rejected:**
  - Separate scripts for file creation vs git: requires external orchestration
  - Asynchronous/parallel operations: file creation is prerequisite to staging; adds complexity
  - Build system integration: overkill for simple file creation

  ## Implementation Strategy

  **Phase 1: Markdown File Creation**
  - Create test-z7vfpr.md at repository root using pathlib.Path.write_text()
  - Include one H1 markdown heading (single # in markdown) as title
  - Include 2-3 sentences of prose content on any topic
  - Explicitly specify UTF-8 encoding
  - Validate file structure, encoding (UTF-8 without BOM), and line endings (LF)
  - Expected file size: naturally falls within 400-600 byte range (natural outcome of proper structure)

  **Phase 2: Git Integration**
  - Stage file using `git add test-z7vfpr.md`
  - Commit with conventional message: `feat(299): create markdown file test-z7vfpr.md with prose content`
  - Push to feature branch `feat/299-markdown-file-creation-838a9b`
  - Use sequential subprocess.run() calls for each git operation
  - Implement explicit error handling and helpful error messages at each step

  **Ordering rationale:**
  - Phase 1 must complete before Phase 2 (file must exist before staging)
  - File creation and validation are logical prerequisites to git operations
  - Sequential, clear workflow minimizes complexity and risk
  - Matches established pattern and organizational standards

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File creation fails due to permissions | Very Low | Medium | Repository root is writable; standard dev environment; validation catches failures |
  | Encoding issues (BOM or wrong encoding) | Very Low | Medium | Explicit UTF-8 encoding parameter; validation testing; matches all 100+ prior features |
  | Line ending issues (CRLF instead of LF) | Very Low | Medium | pathlib.Path.write_text() produces native LF on Unix; validation testing; proven across 100+ prior features |
  | Git staging/commit/push fails | Low | High | Explicit error handling for each subprocess.run() call; helpful error messages; sequential workflow enables clear debugging |
  | File size outside 400-600 byte range | Very Low | Low | Natural emergence from H1 + 2-3 sentences structure; 100+ prior features confirm natural range compliance |
  | Git credentials not configured | Low | High | Standard git credential configuration; validation of git status before push; aligns with organizational setup |
  | File already exists | Very Low | Low | File naming is unique (test-z7vfpr.md); unlikely collision with existing files; validation catches pre-existence |
  | Prose content quality issues | Very Low | Low | Manual hardcoded prose ensures coherence; flexible topic choice allows natural, high-quality content |

  **Overall risk assessment:** Low-risk feature with 100+ established precedents. Simple, straightforward implementation with no architectural complexity. Minimal surface area for errors. Clear, linear workflow enables easy debugging if issues arise. No external dependencies introduce unexpected failure modes.
