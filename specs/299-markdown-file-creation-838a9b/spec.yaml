content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create test markdown files following
  a well-established pattern. This feature creates a single test markdown file (test-z7vfpr.md) at the repository
  root with a title and prose content, demonstrating basic file creation and git integration workflows.

  The feature is part of the markdown-file-creation pattern that has been implemented 40+ times previously
  (features 069-109 and beyond), with 100+ test markdown files already existing in the repository root as
  precedents. This is a continuation of the established pattern with identical requirements and implementation approach.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 100+ test markdown files (test-*.md pattern) created by markdown-file-creation features
  - **src/sheep/**: Core application source code with agents, configuration, flows, tools, and observability modules
  - **specs/**: Feature specification directory containing numbered subdirectories (e.g., specs/299-markdown-file-creation-838a9b/) with spec.yaml files
  - **tests/**: Automated test suite for the application
  - **pyproject.toml**: Python project configuration defining dependencies, build system, and tooling
  - **.github/**: GitHub workflows and CI/CD configuration
  - **Dockerfile**: Container configuration for the platform
  - **README.md**: Project documentation

  The test markdown files at repository root are implementation artifacts—not part of the application source code.
  They serve as validation artifacts for the automated implementation system and demonstrate the platform's
  capability to execute complete workflows (file creation → git integration → version control).

  ### Architecture Patterns

  **File Creation Pattern** (100+ precedents):
  - Simple file creation using Python pathlib.Path for I/O operations
  - Markdown structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM (Byte Order Mark); LF line endings (\n)
  - File size naturally ranges 400-600 bytes as outcome of proper structure
  - Straightforward imperative implementation (compose content string, write to file)
  - Files are isolated test artifacts with no dependencies on source code
  - Diverse content topics observed across existing files (nature, technology, science, philosophy, culture, etc.)

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/299-markdown-file-creation-838a9b`
  - Standard workflow: create file → stage with git add → commit → push
  - Conventional commit format: `feat(299): create markdown file test-z7vfpr.md with prose content`
  - Branch naming convention: `feat/<number>-<feature-name>-<hash-suffix>`
  - All implementations follow this exact workflow without variation

  **Feature Implementation Pattern** (observed in features 069-299):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/) or infrastructure
  - No modifications to tests, configuration, or build files
  - Single-file operations with straightforward, well-understood file format
  - Each feature iteration follows identical structure and requirements
  - All implementations use standard Python pathlib and git commands

  ### Relevant Technologies

  - **Python 3.11+**: Required by pyproject.toml; standard library modules sufficient for implementation
  - **pathlib (Python standard library)**: File I/O operations (Path.write_text() method for creating markdown file)
  - **Git**: Version control system; stage, commit, and push operations
  - **Markdown syntax**: Simple heading (#) and prose content per CommonMark specification
  - **CrewAI**: Framework used by Sheep platform (not directly required for this feature)

  ### Conventions

  - **File naming**: Test files use `test-<randomstring>.md` pattern in repository root
  - **Markdown structure**: Consistent format with H1 heading on first line, blank line, then 2-3 prose sentences
  - **Topic selection**: Free-form; implementer chooses any topic (technology, nature, science, philosophy, etc.)
  - **Prose quality**: Manual validation by implementer; no automated checks required for test content
  - **Git commits**: Conventional commit format with `feat(<number>): <description>` pattern
  - **Encoding**: UTF-8 without BOM; LF line endings (Unix-style)
  - **File size**: Naturally 400-600 bytes as result of proper structure (not enforced)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds single markdown file to existing collection of 100+ test files; no existing file modifications or directory structure changes |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory changes, deletions, or overwrites |
  | Git Repository | Low | Standard single commit following established pattern from 100+ prior implementations; no branch/merge complexity |
  | Source Code | None | Feature is purely artifact creation; does not impact /src/sheep/, application logic, agents, flows, or tools |
  | Configuration | None | No modifications to pyproject.toml, .github workflows, or other configuration files |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other feature specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/299-markdown-file-creation-838a9b` must exist (pre-created)
  - **File system**: Write access to repository root directory (available)
  - **Established pattern**: 100+ existing test files provide clear precedent for content structure and file format
  - **Python standard library**: pathlib module (available in Python 3.11+; no external dependencies)
  - **Git configuration**: Standard git user.name and user.email configuration (standard setup)
  - **File naming**: Exact filename test-z7vfpr.md provided in feature spec

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation:

  - **File creation**: ~5 minutes (compose one markdown H1 heading + 2-3 sentences of prose on any topic)
  - **Validation**: ~2 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow**: ~3-8 minutes (stage file with git add, commit with conventional message, push to branch)
  - **Total**: 10-15 minutes of actual implementation work

  **Justification**:
  - Extremely well-established pattern with 100+ identical test files providing clear reference
  - No research, design decisions, or architectural considerations required
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - Flexible topic selection eliminates research or content generation concerns
  - No testing, documentation, configuration, or source code modifications required
  - File naming is pre-specified; eliminates any naming decisions
  - Git workflow is mechanical and follows exact precedent from 100+ prior implementations
  - Recent feature iterations (features 069-299) demonstrate consistent ~10-15 minute implementation times

