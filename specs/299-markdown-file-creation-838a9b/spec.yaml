content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create test markdown files following
  a well-established pattern. This feature creates a single test markdown file (test-z7vfpr.md) at the repository
  root with a title and prose content, demonstrating basic file creation and git integration workflows.

  The feature is part of the markdown-file-creation pattern that has been implemented 100+ times previously
  (features 069-299 and beyond), with 100+ test markdown files already existing in the repository root as
  precedents. All requirements are locked in by this established pattern.

  ## Success Criteria

  - [ ] File test-z7vfpr.md is created in repository root
  - [ ] File contains exactly one H1 markdown heading as title
  - [ ] File contains 2-3 sentences of prose content
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses LF line endings (Unix-style)
  - [ ] File size naturally ranges 400-600 bytes
  - [ ] File is staged with `git add`
  - [ ] File is committed with conventional commit message: `feat(299): create markdown file test-z7vfpr.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/299-markdown-file-creation-838a9b`

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-z7vfpr.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 heading (single `#` in markdown) serving as the title
  - **FR-3**: File must contain 2-3 sentences of prose content following the H1 heading
  - **FR-4**: Prose content may cover any topic (nature, technology, science, philosophy, culture, etc.)
  - **FR-5**: File must be created using Python pathlib.Path.write_text() method
  - **FR-6**: Stage the created file using `git add test-z7vfpr.md`
  - **FR-7**: Commit the file with conventional commit message: `feat(299): create markdown file test-z7vfpr.md with prose content`
  - **FR-8**: Push the commit to the feature branch `feat/299-markdown-file-creation-838a9b`

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use LF line endings (Unix-style `\n`), not CRLF or CR
  - **NFR-3**: File size should naturally result in approximately 400-600 bytes (natural outcome of proper structure)
  - **NFR-4**: Implementation must follow the established pattern from 100+ existing test markdown files
  - **NFR-5**: File creation must not modify, delete, or overwrite any existing files
  - **NFR-6**: Implementation must not impact application source code (`/src/sheep/`), tests, or configuration
  - **NFR-7**: Git commit must strictly follow conventional commit format (`feat(number): description`)
  - **NFR-8**: Implementation should complete in approximately 10-15 minutes

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds single markdown file to existing collection of 100+ test files; no existing file modifications or directory structure changes |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory changes, deletions, or overwrites |
  | Git Repository | Low | Standard single commit following established pattern from 100+ prior implementations; no branch/merge complexity |
  | Source Code | None | Feature is purely artifact creation; does not impact `/src/sheep/`, application logic, agents, flows, or tools |
  | Configuration | None | No modifications to pyproject.toml, .github workflows, or other configuration files |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other feature specs |

  ## Dependencies

  - **Git repository**: Feature branch `feat/299-markdown-file-creation-838a9b` must exist (pre-created)
  - **File system**: Write access to repository root directory (available)
  - **Established pattern**: 100+ existing test files provide clear precedent for content structure and file format
  - **Python standard library**: pathlib module (available in Python 3.11+; no external dependencies)
  - **Git configuration**: Standard git user.name and user.email configuration (standard setup)
  - **File naming**: Exact filename `test-z7vfpr.md` provided in feature spec

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation:

  - **File creation**: ~5 minutes (compose one markdown H1 heading + 2-3 sentences of prose on any topic)
  - **Validation**: ~2 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file structure)
  - **Git workflow**: ~3-8 minutes (stage file with git add, commit with conventional message, push to branch)
  - **Total**: 10-15 minutes of actual implementation work

  **Justification**:
  - Extremely well-established pattern with 100+ identical test files providing clear reference
  - No research, design decisions, or architectural considerations required
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - Flexible topic selection eliminates research or content generation concerns
  - No testing, documentation, configuration, or source code modifications required
  - File naming is pre-specified; eliminates any naming decisions
  - Git workflow is mechanical and follows exact precedent from 100+ prior implementations
  - Recent feature iterations (features 069-299) demonstrate consistent ~10-15 minute implementation times

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, ready for implementation_
