content: |
  ## Architecture Overview

  Feature 220 creates a single markdown file in the repository root, following the well-established
  pattern proven across 60+ identical features (160-219). The implementation is stateless and
  standalone — it does not depend on or integrate with any part of the Sheep platform
  (src/sheep/, agents, crews, tasks, tools) or any external packages.

  **Key architectural properties:**
  - **No external dependencies**: Uses Python 3.11+ standard library only (pathlib, subprocess, sys)
  - **Isolated workflow**: File creation and git operations are self-contained, no side effects
  - **Proven pattern**: Features 160-219 provide exact template and validation across 60 iterations
  - **Simple error handling**: Specific exception types (FileExistsError, OSError, CalledProcessError) with clear error messages
  - **No validation layer**: Create file and push, per spec requirement "No validation, create only"

  The implementation fits into Sheep's test suite as a minimal, repeatable unit demonstrating:
  1. File creation with proper encoding/line endings
  2. Git staging and conventional commits
  3. Push to remote with upstream tracking

  ## Key Design Decisions

  ### 1. File Creation: Python pathlib with explicit encoding

  **Decision:** Use `Path.write_text(content, encoding="utf-8", newline="\n")` to create the file

  **Rationale:**
  - Proven pattern across features 160-219 (60+ precedents)
  - `encoding="utf-8"` ensures UTF-8 without BOM
  - `newline="\n"` forces Unix LF line endings on all platforms (Windows, macOS, Linux)
  - Modern, clean Python standard library API
  - Cross-platform compatible
  - No external dependencies (satisfies NFR-3)

  **Alternatives rejected:**
  - Direct bash/shell commands: Inconsistent with codebase patterns, harder to debug
  - GitPython/libgit2: Add external dependencies (violates NFR-3)
  - Template-based generation: Over-engineered for simple content

  ### 2. Content: Flexible/generic prose (any topic)

  **Decision:** Use flexible prose content with no thematic constraint

  **Examples from precedents:**
  - Feature 219: "Clear Communication" (team collaboration theme)
  - Feature 216: "Personal Development" (self-improvement theme)
  - Feature 220: To be determined (any topic acceptable)

  **Content structure:**
  - H1 heading: `# Title Here` (single line)
  - Blank line: Separates heading from prose
  - 2-3 sentences: Single paragraph of prose content
  - Target file size: 300-500 bytes

  **Rationale:**
  - User query explicitly states "about anything" — no thematic constraint
  - Minimizes decision overhead
  - Enables fastest execution
  - Aligns with spec goal: "Create markdown file... with a title and 2-3 sentences about anything"

  **Alternatives rejected:**
  - Thematic content: Adds decision overhead, conflicts with spec "about anything"
  - Random/procedural generation: Adds non-determinism without benefit
  - Pre-generated content database: Over-engineered for simple feature

  ### 3. Git Integration: Sequential subprocess.run() calls

  **Decision:** Execute git operations sequentially: add → commit → push

  **Pattern:**
  ```
  subprocess.run(["git", "add", "test-hmis8d.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(220): Create markdown file test-hmis8d.md"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  **Rationale:**
  - Established pattern across all 200+ features in Sheep project
  - `check=True` raises `CalledProcessError` on non-zero exit
  - List-based arguments prevent command injection
  - Cross-platform compatible (works on Linux, macOS, Windows)
  - No external dependencies (satisfies NFR-3)
  - Sequential operations are necessary (commit depends on add, push depends on commit)

  **Alternatives rejected:**
  - GitPython library: Adds external dependency (violates NFR-3)
  - os.system() or shell=True: Unsafe, harder to capture errors
  - Single shell command chain: Less safe, harder to isolate failures

  ### 4. Error Handling: Minimal, specific exception types

  **Decision:** Catch specific exceptions (FileExistsError, OSError, CalledProcessError) with clear error messages

  **Pattern from feature 219:**
  ```python
  try:
    # File creation and git operations
  except FileExistsError:
    print("✗ File already exists", file=sys.stderr)
    sys.exit(1)
  except OSError:
    print("✗ File I/O error", file=sys.stderr)
    sys.exit(1)
  except subprocess.CalledProcessError:
    print("✗ Git command failed", file=sys.stderr)
    sys.exit(1)
  ```

  **Rationale:**
  - Feature 219 (immediate precedent) uses this exact pattern
  - Spec explicitly requires "No validation layer"
  - Minimal error handling keeps implementation lean (~50 lines)
  - Specific exception types provide meaningful failure diagnostics

  **Alternatives rejected:**
  - No error handling: Fragile, unclear failure modes
  - Extensive validation layer: Contradicts spec requirement
  - Generic Exception handling: Masks specific error types

  ### 5. No Validation Layer

  **Decision:** Create file and execute git workflow only — no post-creation validation

  **Rationale:**
  - Spec explicitly states: "No validation layer per spec requirement 'No validation, create only'"
  - Feature 219 (immediate predecessor) confirms this pattern
  - Feature 216 includes comprehensive validation but that was earlier design choice
  - Validation would add 100+ lines of code for minimal benefit in test feature
  - Spec success criteria focus on workflow execution, not file validation

  **What IS validated (implicit in spec):**
  - File exists after creation (assumed by git add succeeding)
  - Git operations succeed (CalledProcessError if they fail)

  **What IS NOT validated (per spec):**
  - File encoding (ensured by pathlib encoding parameter)
  - Line endings (ensured by pathlib newline parameter)
  - File size bounds (inherent in 2-3 sentence constraint)
  - Markdown structure (inherent in content generation)
  - Sentence count (inherent in content generation)

  ## Implementation Strategy

  **Phase ordering rationale:**

  1. **Phase 1: Create Markdown File** (first)
     - Must come first because git operations depend on the file existing
     - Uses pathlib to write test-hmis8d.md with proper encoding/line endings
     - No external dependencies, no side effects
     - Estimated effort: 5 minutes

  2. **Phase 2: Git Workflow Integration** (second)
     - Depends on Phase 1 completing successfully
     - Uses subprocess to stage, commit, and push the file
     - Sequential operations: add → commit → push
     - Estimated effort: 5-10 minutes

  **Total implementation effort:** ~10-15 minutes (size "S" per spec estimate)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (FileExistsError) | Catch FileExistsError and exit with clear error message; feature 219 pattern confirms this approach |
  | Permission denied (OSError) | Catch OSError for I/O failures; assumes write access to repo root (pre-condition: NFR-8) |
  | Git not configured (CalledProcessError) | Catch CalledProcessError; assumes git user.name and user.email are set (pre-condition: NFR-8) |
  | Incorrect line endings (platform-dependent) | Use pathlib newline="\n" to force Unix LF on all platforms; proven across 60+ features |
  | Git push fails (network issues) | Catch CalledProcessError; push may fail temporarily but implementation tried |
  | Wrong commit message format | Hardcode message "feat(220): Create markdown file test-hmis8d.md" per spec |
  | File encoding issues | Use encoding="utf-8" explicitly; no BOM, UTF-8 standard encoding |

  ## Success Criteria Mapping

  This plan ensures all spec success criteria are met:

  | Criterion | Implementation Detail |
  | --------- | --------------------- |
  | File test-hmis8d.md exists in root | Phase 1: Create with pathlib.Path.write_text() |
  | Valid markdown H1 heading | Phase 1: Content includes "# Title" format |
  | 2-3 sentences of prose | Phase 1: Content structure enforced in string |
  | Unix line endings (LF) | Phase 1: pathlib newline="\n" parameter |
  | File staged in git | Phase 2: git add via subprocess |
  | Conventional commit message | Phase 2: git commit with exact message format |
  | Pushed to feature branch | Phase 2: git push -u origin HEAD |
  | Consistent with test files | Phase 1: Follow established markdown format |
  | Feature branch HEAD points to commit | Phase 2: Automatic from git push |
