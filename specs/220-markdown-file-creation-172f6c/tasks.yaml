content: |
  ## Task Breakdown Summary

  This feature is implemented across 2 phases and 4 focused tasks:

  **Phase 1: Create Markdown File (1 task)**
  - Task 1: Create test-hmis8d.md with H1 heading and 2-3 sentences of prose
    - Uses Python pathlib for safe file creation
    - Explicitly sets UTF-8 encoding and Unix LF line endings
    - No validation, create only (per spec requirement)
    - Estimated effort: 5 minutes

  **Phase 2: Git Workflow Integration (3 tasks)**
  - Task 2: Stage file with git add
    - Prepares file for commit
    - Estimated effort: 2 minutes

  - Task 3: Commit with conventional message
    - Creates commit with exact message format
    - Follows conventional commits specification
    - Estimated effort: 3 minutes

  - Task 4: Push to feature branch
    - Pushes commit to remote origin
    - Sets upstream tracking with -u flag
    - Estimated effort: 5 minutes

  **Total effort:** 15 minutes (consistent with spec size estimate "S")

  ## Task Dependencies

  ```
  Task 1 (Create file)
    ↓
  Task 2 (git add)
    ↓
  Task 3 (git commit)
    ↓
  Task 4 (git push)
  ```

  All tasks are sequential. Each task depends on the successful completion of the previous one:
  - Task 2 cannot run until file is created (Task 1)
  - Task 3 cannot run until file is staged (Task 2)
  - Task 4 cannot run until commit is created (Task 3)

  ## TDD Cycle Approach

  Each task follows the RED-GREEN-REFACTOR pattern:

  **Task 1 (Create file):**
  - **RED:** Verify file doesn't exist yet (assertion would fail if it existed)
  - **GREEN:** Create file with pathlib, exact content and encoding
  - **REFACTOR:** Verify encoding, line endings, size, and structure are correct

  **Task 2 (git add):**
  - **RED:** Run git status and verify file isn't staged yet
  - **GREEN:** Execute git add command
  - **REFACTOR:** Run git status again and confirm file is staged

  **Task 3 (git commit):**
  - **RED:** Run git log and verify commit doesn't exist yet
  - **GREEN:** Execute git commit with conventional message format
  - **REFACTOR:** Run git log and verify commit exists with correct message

  **Task 4 (git push):**
  - **RED:** Check git log on remote and verify commit isn't there yet
  - **GREEN:** Execute git push with -u flag
  - **REFACTOR:** Check remote and verify commit and tracking are set up

  ## Success Criteria Fulfillment

  This task breakdown ensures all spec success criteria are met:

  | Success Criterion | Implemented In |
  | ---- | ---- |
  | File test-hmis8d.md exists in repository root | Task 1 |
  | File contains valid markdown H1 heading | Task 1 |
  | File contains exactly 2-3 sentences of prose | Task 1 |
  | File uses Unix line endings (LF, not CRLF) | Task 1 |
  | File is staged in git (git add successful) | Task 2 |
  | Commit created with conventional message format | Task 3 |
  | Commit pushed to feature branch | Task 4 |
  | File format consistent with existing test files | Task 1 |
  | Feature branch HEAD points to new commit | Task 4 |

  ## Phase Integration

  **Phase 1: Create Markdown File**
  - Sets up the file that all subsequent operations depend on
  - Ensures proper encoding and line endings from the start
  - No validation layer (per spec) — file creation is the only concern

  **Phase 2: Git Workflow Integration**
  - Depends entirely on Phase 1 completing successfully
  - Executes three sequential git operations
  - Each operation builds on the previous one (add → commit → push)
  - No parallelization possible (operations are strictly sequential)

  ## Estimated Time Allocation

  - Task 1 (Create file): 5 min — Main effort is composing content and understanding pathlib API
  - Task 2 (git add): 2 min — Simple subprocess call, minimal verification
  - Task 3 (git commit): 3 min — Ensure message format is correct, verify commit creation
  - Task 4 (git push): 5 min — Longest task due to network latency in push operation
  - **Total: 15 minutes**

  Estimates are conservative and aligned with spec size classification "S (Small — approximately
  10-15 minutes of work)". Features 160-219 provide historical validation that similar tasks
  complete within this timeframe.
