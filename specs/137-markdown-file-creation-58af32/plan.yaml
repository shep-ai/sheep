content: |
  ## Architecture Overview

  Feature 137 is a minimal test file creation feature following the established pattern of 137+ existing
  markdown files in the Sheep repository. All test files follow a consistent structure:
  - File location: repository root (no subdirectories)
  - Format: markdown H1 heading + blank line + 2-3 sentences of prose
  - Encoding: UTF-8 without BOM
  - Line endings: Unix LF (\n)
  - Size: typically 400-600 bytes (emerges naturally from proper structure)

  The implementation is completely isolated from application source code (/src/sheep/) and involves only:
  1. Creating a new markdown file using pathlib
  2. Standard git workflow (add, commit, push)

  This architecture has proven reliable and repeatable across 137+ implementations with no modifications
  to core patterns.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen approach:** Use Python's pathlib.Path.write_text() with explicit encoding='utf-8' parameter.

  **Rationale:**
  - Explicitly required by NFR-5
  - Idiomatic in Python 3.11+ (standard library, no dependencies)
  - Provides direct encoding parameter for UTF-8 without BOM
  - Automatically handles file closing and context management
  - Preserves explicit \n line endings without platform translation
  - All 137+ existing test files use this approach

  **Implementation pattern:**
  ```python
  from pathlib import Path

  title = "Your Title"
  prose = "Sentence 1. Sentence 2. Sentence 3."
  content = f"# {title}\n\n{prose}"
  Path("test-wutm1y.md").write_text(content, encoding='utf-8')
  ```

  **Alternatives considered:**
  - open() builtin: lower-level, requires explicit close/context manager, less idiomatic
  - Third-party libraries: unnecessary dependencies for trivial file I/O

  ### 2. String Formatting: Simple f-string with explicit \n delimiters

  **Chosen approach:** Compose content as f-string with explicit newline characters.

  **Rationale:**
  - Markdown format is fixed and simple (no runtime parameterization)
  - Explicit \n characters guarantee LF line endings regardless of platform
  - Maximally readable and maintainable
  - No template engine or builder complexity needed
  - Matches pattern of all 137+ existing files

  ### 3. Git Workflow: Direct CLI commands

  **Chosen approach:** Use standard git CLI commands (git add, git commit, git push).

  **Rationale:**
  - Transparent and auditable
  - No external dependencies (git CLI available in all environments)
  - Exact commit message prescribed by spec (enforces conventional commits)
  - Using --no-verify flag skips pre-commit hooks as documented
  - Matches all 137+ existing implementations

  **Command sequence:**
  ```bash
  git add test-wutm1y.md
  git commit --no-verify -m "feat(137): create markdown file test-wutm1y.md with prose content"
  git push -u origin HEAD
  ```

  ### 4. Topic Selection: Implementer-chosen

  **Chosen approach:** Implementer selects any topic at implementation time.

  **Rationale:**
  - User query explicitly permits "about anything" (NFR-8)
  - Existing 137+ files demonstrate diverse topics (no constraints)
  - Maximizes implementation flexibility
  - Simpler than predefined lists or generation logic
  - Aligns with "minimal test feature" design

  ## Implementation Strategy

  ### Phase 1: Markdown File Creation (5-7 minutes)
  Create the markdown file with proper structure, encoding, and line endings. This phase focuses
  purely on file content and format compliance, independent of git operations.

  **Key steps:**
  1. Choose a title and 2-3 sentences about any topic
  2. Compose content as f-string: `f"# {title}\n\n{prose}"`
  3. Write to test-wutm1y.md using pathlib.Path.write_text(encoding='utf-8')
  4. Verify file structure (heading present, blank line, prose), encoding (UTF-8), and size (400-600 bytes)

  **Why first:** File creation is prerequisite for git operations; must complete before staging.

  ### Phase 2: Git Integration (5-8 minutes)
  Stage the file, create a commit with the prescribed message, and push to the feature branch.

  **Key steps:**
  1. Stage file: `git add test-wutm1y.md`
  2. Verify staging: `git status` shows file staged for commit
  3. Commit: `git commit --no-verify -m "feat(137): create markdown file test-wutm1y.md with prose content"`
  4. Verify commit: check commit message and file inclusion in commit
  5. Push: `git push -u origin HEAD` (or current branch)
  6. Verify push: commit exists on remote origin

  **Why second:** Depends on file creation; integrates completed file into version control.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Incorrect encoding (not UTF-8 or with BOM) | Low | File fails validation | Use pathlib.Path.write_text(encoding='utf-8') — Python's UTF-8 codec does not add BOM by default |
  | Wrong line endings (CRLF instead of LF) | Low | File fails validation | Use explicit \n in f-string; write_text() preserves \n without platform translation |
  | Missing or malformed markdown heading | Low | File structure violation | Use f-string with explicit `# {title}` syntax; verify heading present after write |
  | Wrong prose length (not 2-3 sentences) | Low | Fails success criteria | Count sentences during implementation; review before commit |
  | Commit message mismatch | Low | File not associated with feature 137 | Use exact message prescribed in spec; no variation or abbreviation |
  | Git operations fail (permissions, remote unreachable) | Very Low | Feature incomplete | Preconditions assume write access to repo root and remote connectivity; failures are expected/reported |
  | Feature branch doesn't exist | Very Low | Push fails | Precondition: feature branch `feat/137-markdown-file-creation-58af32` pre-created before implementation |

  **No significant risks identified.** The architecture is simple, precedent is strong (137+ implementations),
  and all technical decisions are proven and established.
