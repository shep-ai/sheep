content: |
  ## Summary

  Feature 137 is implemented in 4 sequential tasks across 2 phases:

  **Phase 1: Markdown File Creation** creates the actual test file with proper structure, encoding, and content.
  This phase is independent of git and focuses purely on file format compliance.

  **Phase 2: Git Integration** stages the completed file, commits it with the exact conventional message,
  and pushes to the remote repository. Tasks are sequential: add → commit → push.

  No task runs in parallel; each depends on the previous one's completion. The total estimated effort
  is 12-17 minutes, aligning with the feature spec's \"S\" (Small) size estimate of 10-15 minutes.

  ## Task Dependencies

  - **Task 1** (File Creation): No dependencies. Must complete first.
  - **Task 2** (Stage): Depends on task 1. File must exist before staging.
  - **Task 3** (Commit): Depends on task 2. File must be staged before committing.
  - **Task 4** (Push): Depends on task 3. Commit must exist before pushing.

  Linear dependency chain ensures sequential execution: Task 1 → Task 2 → Task 3 → Task 4.

  ## TDD Approach

  Each task follows RED-GREEN-REFACTOR cycle:
  - **RED**: Verify current state does not meet criteria (file missing, untracked, no commit, commit not on remote)
  - **GREEN**: Take minimal action to make the test pass (create file, stage, commit, push)
  - **REFACTOR**: Verify the action succeeded and refine as needed (check structure, confirm git operations)

  This approach ensures each step is deliberate and verifiable, reducing risk of silent failures.
