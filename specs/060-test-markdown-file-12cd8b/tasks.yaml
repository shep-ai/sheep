content: |
  ## Summary

  This feature is completed in two sequential tasks. First, create the markdown file (test-l2grww.md)
  in the repository root with a single # heading and 2-3 sentences of coherent prose, following
  the established pattern of 65+ existing test files. Ensure UTF-8 encoding and LF line endings.
  Second, stage and commit the file using a conventional commit message that includes the topic,
  following the pattern established in recent test file commits (e.g., "feat: Create test-g0dk19.md
  markdown file" and "feat: Create markdown file test-fj138v.md with cloud computing content").

  The two tasks are sequential (commit depends on file creation), but together they form a single
  logical unit of work that completes the feature. No refactoring or additional work is needed
  beyond these two tasks.
