content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-ab3u1g.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 70+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-103, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] Markdown file `test-ab3u1g.md` is created in repository root directory
  - [ ] File contains a single markdown heading (H1 format: `# Title`)
  - [ ] File contains 2-3 sentences of prose content following the heading
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix line endings (LF, not CRLF)
  - [ ] File size is approximately 400-600 bytes (natural consequence of content spec)
  - [ ] File is staged with `git add test-ab3u1g.md`
  - [ ] File is committed with conventional commit message: `feat(104): create markdown file test-ab3u1g.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/104-markdown-file-creation-8782a1`
  - [ ] No other files are modified (source code, configuration, tests remain unchanged)

  ## Functional Requirements

  - **FR-1**: Create a file named `test-ab3u1g.md` in the repository root directory
  - **FR-2**: File must contain a markdown H1 heading as the title (format: `# Heading`)
  - **FR-3**: File must contain 2-3 sentences of prose content following the heading, separated by a blank line
  - **FR-4**: File must be encoded in UTF-8 without BOM
  - **FR-5**: File must use Unix line endings (LF, `\n` characters, not CRLF)
  - **FR-6**: Stage the created file using `git add test-ab3u1g.md`
  - **FR-7**: Commit the file with conventional commit format: `feat(104): create markdown file test-ab3u1g.md with prose content`
  - **FR-8**: Push the commit to the feature branch `feat/104-markdown-file-creation-8782a1`
  - **FR-9**: Do not modify any source code in `/src/sheep/`, configuration files, or test files

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow the established pattern demonstrated by 70+ existing test files in the repository root
  - **NFR-2**: Code should be simple, maintainable, and idiomatic (using pathlib for file I/O per Python standard practice)
  - **NFR-3**: File size should naturally emerge from the content specification (heading + 2-3 sentences typically yields 400-600 bytes); no strict byte-count enforcement required
  - **NFR-4**: Git workflow must be clean and non-destructive: single commit, no force pushes, no branch rebasing
  - **NFR-5**: Implementation should complete within the S (small) size estimate: approximately 10-15 minutes of actual work

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be meaningful or can it use placeholder text? | Meaningful prose | Maintains quality consistency with 70+ existing test files and improves readability; requires minimal additional effort |
  | 2 | Is 2-3 sentence count a strict requirement or flexible guideline? | Flexible guideline | The spec reads as a content target; strict validation would over-engineer a simple feature. Small variance acceptable. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-ab3u1g.md) to existing collection of 70+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-103; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/104-markdown-file-creation-8782a1` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 70+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of meaningful prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file conforms to pattern)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 70+ identical test files providing clear precedent
  - Topic selection is open-ended ("anything") with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-103) demonstrate efficient implementation of identical features in 10-15 minutes

  ---

  _Requirements phase complete — product decisions made, requirements fully specified, ready for implementation phase_
