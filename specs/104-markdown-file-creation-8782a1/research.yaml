decisions:
  - title: "Content Generation Method"
    chosen: "LLM-based generation via Claude API"
    rejected:
      - "Hardcoded/manual prose — Reduces consistency and requires manual effort for each feature; LLM generation provides diverse, meaningful content matching 70+ existing test files without manual overhead"
      - "Template-based generation with variable substitution — Over-engineers a simple task; LLM is more elegant and produces more natural prose than template variables"
    rationale: >
      The existing codebase (features 101-103) demonstrates that LLM-based content generation
      produces consistent, semantically meaningful prose matching the quality of 70+ existing
      test files. This approach:
      1. Ensures content quality without manual oversight
      2. Provides diversity across test files (each gets unique, contextually appropriate prose)
      3. Requires minimal code (already implemented in content_generators.generate_markdown_content())
      4. Aligns with the established pattern that automated implementations must replicate
      5. Satisfies the product requirement for "meaningful prose" as resolved in feature spec

  - title: "File I/O Library"
    chosen: "Python pathlib (Path objects and context managers)"
    rejected:
      - "open() builtin function — Works but less idiomatic; pathlib provides cleaner path handling, validation, and stat operations"
      - "os module functions — Lower-level, more verbose, and less Pythonic than pathlib for this use case"
    rationale: >
      Pathlib is the modern Python standard (PEP 519, Python 3.4+) and is already used throughout
      the codebase (confirmed in content_generators.py lines 121-143). It provides:
      1. Cleaner, OS-agnostic path construction (Path.cwd() / filename)
      2. Built-in existence checks and stat operations (path.exists(), path.stat().st_size)
      3. Intuitive context manager support for file operations
      4. Better readability and maintainability for future developers
      5. Consistency with existing implementation patterns

  - title: "Git Integration Approach"
    chosen: "Reuse custom GitCommitTool and GitPushTool from sheep framework"
    rejected:
      - "Direct subprocess calls (git.Repo, etc.) — More verbose, error-prone, requires manual parsing of output; sheep tools provide abstraction and logging"
      - "GitPython library — Would introduce external dependency; sheep framework already abstracts git operations with custom tools"
    rationale: >
      Features 101-103 establish that the sheep framework provides GitCommitTool and GitPushTool
      (confirmed in content_generators.py lines 320-356) that handle:
      1. Consistent commit message formatting with conventional commits standard
      2. Proper error handling and logging via sheep's observability framework
      3. Upstream branch tracking (set_upstream=True flag)
      4. Abstraction from underlying git implementation details
      Reusing these tools ensures consistency with the 3 preceding features and avoids reinventing
      git integration logic.

  - title: "File Encoding and Line-Ending Handling"
    chosen: "Python's automatic UTF-8 encoding with explicit LF validation"
    rejected:
      - "Manual binary encoding/decoding — Adds unnecessary complexity; Python's open(encoding='utf-8') handles UTF-8 automatically"
      - "No line-ending validation — Risk of inconsistency; explicit validation ensures Unix LF compliance across platforms"
    rationale: >
      The existing implementation (content_generators.py lines 182-198) demonstrates robust
      encoding and line-ending handling:
      1. Python's built-in UTF-8 support is reliable and idiomatic
      2. Binary validation (checking for BOM, CRLF) is critical on Windows systems
      3. Feature spec explicitly requires UTF-8 without BOM and Unix LF line endings
      4. Validation is performed by validate_markdown_file() which is already proven in 103
      5. Adding trailing newline (line 57-58) ensures Unix convention compliance

  - title: "Content Validation Strategy"
    chosen: "Comprehensive validation matching feature 103 approach"
    rejected:
      - "Minimal validation (only check file exists) — Risks non-compliance with encoding/format requirements; spec explicitly requires multiple validation checks"
      - "No validation — Trusts LLM output and file system; leaves specification compliance unverified"
    rationale: >
      The comprehensive validation approach used in features 101-103 (validate_markdown_file,
      _validate_markdown_content) ensures:
      1. H1 heading format compliance (lines 200-208)
      2. Blank-line separator between heading and prose (lines 210-212)
      3. Sentence count verification (2-3 sentences, lines 226-231)
      4. UTF-8 encoding without BOM (lines 186-194)
      5. Unix LF line endings only (lines 196-198)
      6. Trailing newline for Unix convention (lines 234-235)
      The specification explicitly requires these checks, and the validation functions are proven
      to work correctly across 103 preceding features.

  - title: "Implementation Location and Code Reuse"
    chosen: "Reuse existing functions from content_generators module; create minimal feature_104 wrapper module"
    rejected:
      - "Duplicate entire feature_103 module — Creates code duplication; functions are already generic and reusable"
      - "Inline everything in a single script — Loses modular structure and makes testing harder"
    rationale: >
      The content_generators module (lines 363-441) provides a create_markdown_file() function
      that is generic and reusable for any feature number. Rather than duplicate the 110+ lines
      of implementation from feature_103, the approach is:
      1. Create minimal src/sheep/features/feature_104_markdown_file_creation.py (20-30 lines)
      2. Call create_markdown_file("test-ab3u1g.md") to orchestrate the workflow
      3. Reuse all proven utilities: generate_markdown_content(), write_markdown_file(),
         validate_markdown_file(), commit_markdown_file(), push_markdown_file()
      4. Follow the exact same pattern as feature_103 (lines 33-117)
      This maximizes code reuse, reduces maintenance burden, and ensures consistency.

