content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-19
  - **Confidence:** High — Pattern established across 103 preceding features with proven implementation

  ## Technology Decisions

  ### 1. Content Generation Approach

  **Chosen:** LLM-based generation via Claude API (CrewAI framework)

  **Rejected:**
  - Hardcoded/manual prose — Reduces consistency and requires manual effort per feature
  - Template-based generation — Over-engineers simple task; LLM provides more natural prose

  **Rationale:**
  Features 101-103 demonstrate that LLM-based generation produces consistent, semantically
  meaningful prose matching 70+ existing test files. The implementation uses a simple prompt
  that requests "H1 heading + 2-3 sentences about any topic" and validates the response matches
  the format. This approach requires no manual content creation while ensuring diversity and
  quality across test files. The generate_markdown_content() function in content_generators.py
  is already proven and reusable.

  ### 2. File I/O and Path Handling

  **Chosen:** Python pathlib with UTF-8 encoding

  **Rejected:**
  - Built-in open() function — Works but less idiomatic than pathlib
  - os module functions — Lower-level and more verbose than pathlib

  **Rationale:**
  Pathlib is the modern Python standard (PEP 519, 3.4+) and is already used throughout the
  codebase. It provides:
  - OS-agnostic path construction (Path.cwd() / filename)
  - Built-in existence checks and stat operations
  - Clean context manager support
  - Better readability for future developers

  File encoding uses Python's built-in UTF-8 support with open(encoding='utf-8'), which
  automatically handles BOM avoidance and LF line endings on Unix systems. Validation confirms
  these requirements post-write.

  ### 3. Git Integration

  **Chosen:** Reuse custom GitCommitTool and GitPushTool from sheep framework

  **Rejected:**
  - Direct subprocess calls — Verbose and error-prone; sheep tools provide abstraction
  - GitPython library — Would add external dependency; sheep already abstracts git operations

  **Rationale:**
  The sheep framework provides proven GitCommitTool and GitPushTool that handle:
  - Conventional commit message formatting
  - Error handling and logging via observability framework
  - Upstream branch tracking (set_upstream=True)
  - Consistent behavior across all features

  These tools are used in features 101-103 and reduce implementation complexity.

  ### 4. File Validation

  **Chosen:** Comprehensive validation matching feature 103

  **Rejected:**
  - Minimal validation (only check file exists) — Risks non-compliance with requirements
  - No validation — Leaves specification compliance unverified

  **Rationale:**
  The specification explicitly requires validation of:
  - H1 heading format and placement
  - Blank-line separator between heading and prose
  - Sentence count (2-3 sentences verified via period count)
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - Trailing newline for Unix convention

  The validate_markdown_file() function in content_generators.py (lines 150-244) provides
  all these checks and is proven across 103 preceding features.

  ### 5. Code Organization

  **Chosen:** Create feature_104_markdown_file_creation.py module that reuses content_generators

  **Rejected:**
  - Duplicate feature_103 module — Creates unnecessary code duplication
  - Inline everything in script — Breaks modular pattern and loses feature isolation

  **Rationale:**
  Features 101-103 each have their own dedicated module (feature_10X_markdown_file_creation.py)
  that orchestrate the workflow. Rather than duplicate the entire implementation, the approach:
  1. Create minimal feature_104 module (~25 lines) that mirrors feature_103 structure
  2. Import and call the generic create_markdown_file() function from content_generators
  3. Provide feature-specific constants (FEATURE_NUMBER, MARKDOWN_FILENAME, FEATURE_NAME)
  4. Handle logging and return consistent result dictionary

  This maximizes code reuse while maintaining the established architectural pattern.

  ### 6. Commit Message Format

  **Chosen:** Conventional format per spec: `feat(104): create markdown file test-ab3u1g.md with prose content`

  **Rejected:**
  - Topic-based format with generated content — More informative but non-deterministic
  - Minimal format without feature number — Breaks consistency with preceding features

  **Rationale:**
  The specification (FR-7) explicitly requires this format. It's also what feature_103 uses
  (hardcoded in feature_103_markdown_file_creation.py line 84). This format:
  - Matches specification requirements exactly
  - Provides clear feature number tracking
  - Is consistent with features 101-103
  - Avoids variable content in commit messages (aids determinism and testing)

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File path manipulation and I/O | **Use** | Modern Python standard (PEP 519); already used throughout codebase; provides OS-agnostic path handling and cleaner API than os module |
  | Claude API (CrewAI) | LLM-based content generation | **Use** | Proven in features 101-103; generates consistent, meaningful prose; eliminates manual content creation; already integrated into sheep framework via get_reasoning_llm() |
  | GitCommitTool | Git staging and commit operations | **Use** | Custom sheep framework tool; provides error handling, logging, and conventional commit support; proven across 103 preceding features |
  | GitPushTool | Git push to remote | **Use** | Custom sheep framework tool; handles upstream tracking and error handling; proven across 103 preceding features |
  | sheep.observability.logging | Application logging | **Use** | Integrated logging framework used throughout sheep codebase; provides consistent, structured logging for debugging and tracing |
  | subprocess | Direct git command execution | **Reject** | Would require manual git command parsing and error handling; sheep tools provide superior abstraction |
  | GitPython | Alternative git library | **Reject** | Would introduce external dependency; sheep framework already abstracts git operations with custom tools |

  ## Security Considerations

  **File Path Validation:**
  - The implementation validates filenames to prevent path traversal attacks (content_generators.py lines 116-118)
  - Filename "test-ab3u1g.md" is safe; no special characters or path separators
  - File is created in repository root only, not user-supplied paths

  **Encoding Security:**
  - UTF-8 encoding without BOM prevents interpretation issues on Windows systems
  - Validation explicitly checks for and rejects CRLF line endings (which could cause injection issues in some contexts)
  - All file content is generated by LLM and validated before writing

  **Git Operations Security:**
  - Uses existing sheep GitCommitTool which handles credential management and authentication
  - Commits are signed according to repository's git configuration (no --no-verify bypass)
  - Push operations use configured remote (origin) without force flags

  **No External Input Risk:**
  - Filename is hardcoded as "test-ab3u1g.md" — not user-supplied
  - Content is LLM-generated and validated — not from external sources
  - No environment variables or configuration that could be manipulated

  ## Performance Implications

  **Latency:**
  - LLM API call for content generation: ~1-3 seconds (network request to Claude API)
  - File write operations: <10ms (single file at repository root)
  - Validation checks: ~5ms (regex and binary scanning)
  - Git commit: ~50-100ms (local filesystem operation)
  - Git push: ~500ms-2s (network operation to remote)
  - **Total estimated time:** 2-5 seconds (primarily LLM and git network I/O)

  **Resource Usage:**
  - Memory: ~10-20 MB (file content ~400-600 bytes, LLM response buffers)
  - Disk I/O: Single ~500-byte file write, no temporary files
  - Network: One LLM API call, one git push operation
  - No caching or optimization needed for this simple, one-time operation

  **Scalability:**
  - Not applicable — this feature creates a single file per execution
  - No database queries, loops, or scalability concerns
  - Implementation is O(1) with respect to repository size

  ## Architecture Notes

  **Consistency with Established Patterns:**
  - Follows identical architecture to features 101-103
  - Leverages existing content_generators module (proven for 3+ features)
  - Reuses sheep framework tools (GitCommitTool, GitPushTool, logging)
  - No new dependencies or architectural changes required

  **Integration Points:**
  1. **Content Generation**: Uses get_reasoning_llm() from sheep.config.llm
  2. **File I/O**: Uses Python standard library (pathlib, open)
  3. **Validation**: Uses regex and binary validation patterns from content_generators
  4. **Git Integration**: Uses custom sheep GitCommitTool and GitPushTool
  5. **Logging**: Uses sheep.observability.logging for structured logging

  **Feature Module Structure:**
  ```
  feature_104_markdown_file_creation.py:
  - Imports from content_generators (generate, write, validate, commit, push functions)
  - Defines FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME constants
  - Implements create_feature_104_markdown_file() orchestration function
  - Provides __main__ entry point for direct script execution
  - Returns structured result dictionary with filepath, content, message, result
  ```

  **No Code Duplication:**
  - All core logic (content generation, validation, git operations) lives in content_generators.py
  - Feature 104 module is a ~25-line orchestration wrapper
  - Reuses proven functions from features 101-103 without modification

  ## Implementation Plan Summary

  1. **Create feature module** (~25 lines):
     - Create src/sheep/features/feature_104_markdown_file_creation.py
     - Import functions from content_generators
     - Define feature constants and create_feature_104_markdown_file() function
     - Mirror structure of feature_103_markdown_file_creation.py

  2. **Execute workflow**:
     - Generate markdown content via LLM
     - Write file to repository root with UTF-8 encoding
     - Validate against all specification requirements
     - Stage and commit with conventional message
     - Push to feature branch with upstream tracking

  3. **Validation** (automatic via validate_markdown_file()):
     - H1 heading format and position
     - Blank-line separator
     - 2-3 sentence prose content
     - UTF-8 encoding, no BOM
     - Unix LF line endings
     - Trailing newline

  4. **Git workflow**:
     - Commit message: `feat(104): create markdown file test-ab3u1g.md with prose content`
     - Push to branch: `feat/104-markdown-file-creation-8782a1`
     - No force push, no branch rebasing

  ---

  _Research phase complete. No open technical questions. Ready for implementation._
