content: |
  ## Architecture Overview

  Feature 104 follows the architectural pattern established by features 101-103. Rather than
  duplicate implementation code, it reuses the `content_generators` module which provides
  a complete, proven, generic workflow for markdown file creation. The architecture is
  **layered and modular**:

  ```
  feature_104_markdown_file_creation.py (orchestration, ~25 lines)
      └─> content_generators.create_markdown_file() (complete workflow)
          ├─> generate_markdown_content() (LLM-based generation via CrewAI)
          ├─> write_markdown_file() (file I/O with UTF-8/LF validation)
          ├─> validate_markdown_file() (comprehensive format checking)
          ├─> commit_markdown_file() (git staging and commit via GitCommitTool)
          └─> push_markdown_file() (git push via GitPushTool)
  ```

  **Integration Points:**
  1. **Content Generation**: Uses sheep.config.llm.get_reasoning_llm() for Claude API access
  2. **File I/O**: Uses Python standard library pathlib and open() with encoding validation
  3. **Validation**: Uses regex patterns and binary scanning (proven across 103+ features)
  4. **Git Operations**: Uses custom sheep GitCommitTool and GitPushTool
  5. **Logging**: Uses sheep.observability.logging for structured logging

  The feature module is minimal (~25 lines) and serves only as an entry point and feature
  identifier. All core logic resides in content_generators, eliminating duplication and
  ensuring consistency across features.

  ## Key Design Decisions

  ### 1. Code Reuse via content_generators Module

  **Decision:** Import and call generic functions from content_generators rather than
  duplicating implementation from feature_103.

  **Alternatives Considered:**
  - Duplicate feature_103 module verbatim (~110 lines) — creates maintenance burden
  - Inline all logic in feature_104 module — loses modular structure
  - Create shared utilities library — over-engineers a simple, proven pattern

  **Rationale:**
  The content_generators module provides a complete, generic, tested workflow that has been
  validated across features 101-103. The create_markdown_file(filename) function is designed
  to be reusable for any feature number and filename. Reusing this function:
  - Eliminates 110+ lines of duplicated code
  - Ensures consistency across all markdown file features
  - Reduces maintenance burden (bug fixes apply to all features)
  - Aligns with DRY principle and established architectural patterns
  - Requires only ~25 lines of feature-specific wrapper code

  **Research Reference:** Research findings, "Implementation Location and Code Reuse" section,
  confirms this approach is proven and recommended.

  ### 2. LLM-Based Content Generation

  **Decision:** Use Claude API for semantic, meaningful prose generation rather than
  hardcoded or templated text.

  **Alternatives Considered:**
  - Hardcoded/manual prose — requires manual effort per feature, reduces diversity
  - Template-based generation — over-engineers simple task, produces less natural text
  - Random Lorem ipsum — fails quality requirement for "meaningful prose"

  **Rationale:**
  The research findings and feature spec both confirm LLM-based generation as the best approach:
  - Produces consistent, semantically meaningful prose
  - Matches quality of 70+ existing test files
  - Provides diversity across test files (each gets unique content)
  - Requires minimal code (single API call, already wrapped)
  - Satisfies product requirement for "meaningful prose"
  - Proven across features 101-103 with no issues

  **Implementation:** Uses generate_markdown_content() from content_generators, which prompts
  Claude API for "H1 heading + 2-3 sentences about [random topic]" and validates response format.

  ### 3. Comprehensive Validation Against Specification

  **Decision:** Validate all specification requirements: H1 heading format, sentence count,
  UTF-8 encoding without BOM, Unix LF line endings, blank-line separator, trailing newline.

  **Alternatives Considered:**
  - Minimal validation (only check file exists) — risks non-compliance with encoding/format
  - No validation — leaves specification unverified
  - Only validate content, not encoding — misses BOM/CRLF issues on Windows systems

  **Rationale:**
  The feature specification explicitly requires 9 validation checks across format, content,
  encoding, and line endings. The validate_markdown_file() function in content_generators
  provides all these checks and is proven across 103+ features. Skipping validation risks:
  - H1 heading placed incorrectly (no blank-line separator)
  - Wrong sentence count (LLM may generate 1 or 4 sentences)
  - CRLF line endings on Windows (cross-platform inconsistency)
  - UTF-8 BOM (encoding issues on some systems)
  - Missing trailing newline (Unix convention violation)

  Comprehensive validation ensures compliance with all specification requirements.

  ### 4. Git Integration via sheep Framework Tools

  **Decision:** Use custom GitCommitTool and GitPushTool from sheep framework rather than
  direct subprocess calls.

  **Alternatives Considered:**
  - Direct subprocess calls (git add, git commit, git push) — verbose, error-prone
  - GitPython library — introduces external dependency sheep framework doesn't use
  - Manual string manipulation — hard to parse git output, fragile error handling

  **Rationale:**
  The sheep framework provides GitCommitTool and GitPushTool that are already integrated and
  used across features 101-103. These tools provide:
  - Consistent error handling and logging via sheep.observability
  - Conventional commit message formatting
  - Upstream branch tracking (set_upstream=True)
  - Credential management abstraction
  - No new dependencies introduced
  - Proven across 103+ features with no issues

  Using sheep framework tools ensures consistency with established patterns.

  ### 5. Feature Module Structure and Entry Point

  **Decision:** Create feature_104_markdown_file_creation.py with a create_feature_104_markdown_file()
  function that orchestrates the workflow via content_generators.create_markdown_file().

  **Alternatives Considered:**
  - Single-file script with no module structure — breaks established pattern from 101-103
  - Direct import and use of content_generators functions — no feature isolation or tracking
  - Complex feature module with custom implementation — duplicates existing code

  **Rationale:**
  Features 101-103 each have their own dedicated module following this structure:
  - Provides clear feature separation and tracking
  - Aligns with established architectural pattern
  - Enables future feature-specific testing and logging
  - Requires only ~25 lines of code (mostly imports and constants)
  - Maintains consistency across all markdown file features

  The feature module is a thin orchestration layer that identifies the feature and delegates
  to generic functions in content_generators.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3** ensures a clean, testable progression:

  1. **Module Creation (Phase 1)** comes first because:
     - Establishes the feature entry point and structure
     - Minimal, easy to verify via import test
     - No dependencies on external state
     - Enables Phase 2 to have a callable entry point

  2. **Feature Execution (Phase 2)** comes second because:
     - Depends on module existing (Phase 1 dependency)
     - Actually creates the markdown file
     - Runs comprehensive validation
     - Generates concrete artifacts for Phase 3 to operate on

  3. **Git Integration (Phase 3)** comes last because:
     - Depends on file existing and validated (Phase 2 dependency)
     - Commits and pushes the created file
     - Verifies the entire workflow end-to-end
     - Leaves the repository in clean, pushed state

  ### No Complex Interdependencies

  The phases are strictly sequential with clear data flow:
  - Phase 1 output: Module file (enables Phase 2)
  - Phase 2 output: Created/validated markdown file (enables Phase 3)
  - Phase 3 output: Committed and pushed file (complete feature)

  No circular dependencies, no rework needed between phases.

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | **LLM API unavailable or rate-limited** | Low | Claude API is highly available and rate limits are generous. Feature gracefully fails with error message if API unavailable. No retry logic needed for this simple feature. |
  | **File already exists at test-ab3u1g.md** | Low | File should not exist at start of feature. If it does, validate_markdown_file() will flag inconsistency. Resolution: delete or rename existing file before running feature. |
  | **UTF-8 encoding fails on Windows** | Very Low | Python's open(encoding='utf-8') is cross-platform safe. Validation explicitly checks for and rejects CRLF line endings. No platform-specific workarounds needed. |
  | **Git credentials not configured** | Low | sheep framework GitCommitTool/GitPushTool require user.name/user.email in git config. If missing, git commands fail with clear error message. Resolution: run `git config user.name` / `git config user.email`. |
  | **Feature branch doesn't exist** | Very Low | Feature branch feat/104-markdown-file-creation-8782a1 is pre-created. Feature assumes branch exists. If missing, git push fails with clear error message. |
  | **Content generator produces invalid format** | Very Low | LLM response is validated immediately after generation. If format invalid, validate_markdown_file() rejects with clear error. Feature fails fast and loudly. No silent corruption. |
  | **Commit message format incorrect** | Very Low | GitCommitTool enforces conventional commit format. Feature specifies exact message: \"feat(104): create markdown file test-ab3u1g.md with prose content\". No user input involved. |
  | **Push fails due to network** | Low | GitPushTool handles standard git push errors. Feature fails with clear error message. Resolution: check network connectivity and retry. Git state remains clean (no force push used). |

  ## Files to Create and Modify

  **Create:**
  - `src/sheep/features/feature_104_markdown_file_creation.py` (feature module, ~25 lines)
  - `test-ab3u1g.md` (created by feature execution, ~400-600 bytes)

  **Modify:**
  - None (no existing files modified)

  ## Technology Requirements

  All technologies are already available:
  - Python 3.11+ (pathlib, standard library)
  - Claude API (available via sheep.config.llm)
  - Git (pre-configured for repository)
  - sheep framework modules (content_generators, GitCommitTool, GitPushTool, logging)

  No new dependencies to install.

