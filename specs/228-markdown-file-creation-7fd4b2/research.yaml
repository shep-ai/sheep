decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path.write_text() with UTF-8 encoding and explicit LF newlines"
    rejected:
      - "open() context manager — less idiomatic in modern Python 3.11+, requires manual encoding specification and file handle management"
      - "pathlib.Path.write_bytes() — requires manual UTF-8 encoding, adds unnecessary complexity for text files"
      - "File creation via git workflow only — does not meet requirement to create file in working directory before staging"
    rationale: >
      pathlib.Path.write_text() is the idiomatic Python 3.11+ approach for text file creation.
      It automatically handles UTF-8 encoding (the default), manages file handles safely, and produces
      clean, readable code. This method is used consistently across all 150+ existing features (224-227, 069-226).
      By explicitly including newline=\"\\n\", we guarantee Unix LF line endings on all platforms (Windows, Linux, macOS).
      This approach meets all encoding and line ending requirements without additional complexity.

  - title: "Prose Content Generation"
    chosen: "Hardcoded prose string (2-3 sentences) on a freely chosen topic"
    rejected:
      - "Random text generation from corpus — no quality control, may produce nonsensical content, adds complexity"
      - "LLM-based generation (Claude API) — adds external API dependency and latency, unnecessarily complex for deterministic test artifact"
      - "User-provided input — requires external input, not suitable for automated, unattended execution"
    rationale: >
      The specification explicitly permits free-form topic selection (NFR-8). Creating a single hardcoded
      prose string is the simplest, most maintainable approach with zero dependencies. The prose must be
      grammatically correct (FR-3) and 2-3 sentences (FR-3), which is straightforward to author directly.
      This approach mirrors the established pattern across 150+ existing test files (224-227 and prior),
      each with unique, hand-written prose content. Simple and direct is preferable to automated generation
      for this minimal feature. No evidence exists that LLM generation was used in prior features.

  - title: "Line Ending Management (Unix LF vs Windows CRLF)"
    chosen: "Enforce Unix LF line endings via pathlib.write_text() with explicit newline=\"\\\\n\" parameter"
    rejected:
      - "System default line endings — fails on Windows systems, unpredictable cross-platform behavior"
      - "Post-creation normalization with git config — introduces additional processing step and complexity"
      - "Rely on git auto-conversion — not reliable, depends on git configuration state (core.autocrlf, core.safecrlf)"
    rationale: >
      Python's pathlib.write_text() uses the system default line ending by default (CRLF on Windows, LF on Unix).
      To guarantee Unix LF line endings across all platforms, explicitly pass newline=\"\\n\" to write_text().
      Feature 226 implementation demonstrates this pattern. This ensures compliance with requirement NFR-2
      (Unix-style LF line endings) regardless of host OS. Explicit parameter passing is more reliable
      than relying on git configuration or post-processing.

  - title: "Git Integration Method (add, commit, push)"
    chosen: "subprocess.run() for direct git CLI invocations with list-based command format"
    rejected:
      - "GitPython library — while available in project dependencies, adds abstraction overhead unnecessarily"
      - "os.system() with shell strings — introduces shell injection risks and less control over execution"
      - "Automated pre-commit hooks — adds CI/CD complexity, not needed for deterministic file creation"
    rationale: >
      Features 224-227 consistently use subprocess.run() to execute git commands (git add, git commit, git push).
      This approach provides: direct verification of command success via return codes and stderr, transparent
      output for debugging, minimal overhead with no library abstraction layer, and clear representation in source code.
      Using list-based command format (e.g., ['git', 'add', filename]) prevents shell injection attacks.
      GitPython is available but not necessary for straightforward sequential git operations. Direct subprocess calls
      are proven, maintainable, and match the established codebase pattern across 150+ features.

  - title: "Validation Strategy"
    chosen: "Basic post-creation validation with file existence, size range, and UTF-8 readability checks"
    rejected:
      - "No validation — risks missing bugs in file format or git integration, no failure detection"
      - "Comprehensive validation (full parsing, byte-level inspection) — over-engineered for simple deterministic file creation"
      - "Exception-based control flow — less appropriate than explicit assertions for validation intent"
    rationale: >
      Feature 226 implementation includes simple validation functions: verify file exists, verify file size is in
      expected range (400-600 bytes), verify content reads as valid UTF-8. These lightweight checks detect common
      errors (permission issues, filesystem problems, encoding corruption) and fail fast with clear messages.
      This comprehensive approach is appropriate for a simple file creation task without imposing unnecessary complexity.
      The pattern is proven across 150+ features and provides confidence that all success criteria are met.

  - title: "Markdown Specification Compliance"
    chosen: "CommonMark specification (version 0.30) for heading and prose format"
    rejected:
      - "GitHub Flavored Markdown (GFM) — not necessary for simple heading+prose structure"
      - "Custom markdown dialect — reduces portability and introduces non-standard format"
