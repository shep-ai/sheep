content: |
  ## Summary

  This feature requires two straightforward tasks:

  1. **Prose Content Preparation** (10 min): Write 2-3 sentences about any topic. Focus on clarity, grammatical correctness, and informativeness. Total length should be approximately 350–500 bytes.

  2. **Markdown File Creation and Git Integration** (10 min): Execute the existing `create_markdown.py` automation script with the prepared content. The script handles all heavy lifting: file creation with proper UTF-8 encoding (no BOM), LF line endings validation, trailing newline enforcement, format validation, and git workflow (add/commit/push).

  No code modifications, external dependencies, or complex testing required. The approach follows the proven pattern from related features 119-125. All validation happens automatically within the script, and success is observable via file existence, format correctness, and git commit visibility.

  **Total Effort**: Approximately 20 minutes (10 min content prep + 10 min script execution + validation)

  ---

  ### Task 1: Prepare Prose Content (2-3 Sentences)

  **What**: Write 2-3 sentences of informative prose about any topic.

  **Why**: The markdown file requires readable, well-written content. Prose preparation is manual work done before automation.

  **Acceptance**:
  - Exactly 2–3 sentences (validated by period count)
  - ~350–500 bytes total
  - Grammatically correct, professional tone
  - Informative and clear

  **Effort**: 10 minutes

  ---

  ### Task 2: Execute Markdown File Creation via create_markdown.py

  **What**: Run the existing automation script to create test-gh8wxw.md with proper format and git integration.

  **Why**: The script automates file creation (UTF-8 encoding, POSIX compliance), validation (format checks, sentence count), and git workflow (add, commit, push) — eliminating manual error-prone steps.

  **Acceptance**:
  - File exists at repository root
  - Proper H1 heading, prose content, encoding, line endings, trailing newline
  - Markdown renders correctly
  - Staged, committed, and pushed to remote branch
  - All ~12 success criteria from the feature spec are met

  **TDD Cycle**:
  - **RED**: Verify file doesn't exist yet
  - **GREEN**: Run the script; all validation passes
  - **REFACTOR**: Confirm all criteria met via git log and file inspection

  **Effort**: 10 minutes (includes script execution + validation)

  ---

  **Total**: 20 minutes (sequential tasks; task-2 depends on task-1 completion)
