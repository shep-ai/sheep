# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file named `test-gh8wxw.md` in the repository root. The file must follow the established pattern seen throughout the codebase: an H1 markdown heading followed by 2-3 sentences of informative prose content about any topic. This is a content-only task with no code changes or architectural decisions required.

  ## Codebase Analysis

  ### Project Structure

  The repository (Sheep) is an agentic platform for automated code implementation using CrewAI. The directory structure includes:

  - **Repository Root**: Contains numerous markdown test files (test-*.md) following a consistent pattern: `# Title` followed by 2-3 sentences of prose
  - **src/sheep/**: Main application source code with subdirectories for agents, configuration, flows, observability, tools, and CLI
  - **specs/**: Feature specifications organized by feature number (e.g., specs/006-joke-markdown, specs/126-markdown-file-create-2b029c)
  - **tests/**: Test files for the application
  - **docs/**: Documentation and reference files

  ### Architecture Patterns

  The codebase follows these established patterns:

  1. **Markdown File Convention**: All test markdown files in the root follow this exact structure:
     - Line 1: H1 heading (format: `# Topic Title`)
     - Line 2: Blank line
     - Lines 3+: 2-3 sentences of informative prose content
     - Final: Trailing newline (POSIX convention)

  2. **File Naming**: New test markdown files use pattern `test-<random-id>.md`

  3. **Content Quality**: Prose is informative, well-written, typically 350-500 bytes

  4. **Git Integration**: File creation is followed by git add, commit with conventional message, and push

  ### Relevant Technologies

  - **Markdown**: The file format used throughout the repository
  - **Python**: Used for helper scripts that automate markdown file creation and validation (see create_markdown.py)
  - **Git**: Version control integration for tracking and pushing changes
  - **UTF-8 Encoding**: Standard character encoding for all markdown files

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adding a single new markdown file with no modifications to existing files or code |
  | Git history | Low | Single commit with conventional message format |

  ## Dependencies

  None. This feature requires no external libraries, existing code modifications, or architectural changes. It is purely a file creation task following existing conventions.

  ## Functional Requirements

  - **FR-1**: File creation — Create a new file named `test-gh8wxw.md` in the repository root directory
  - **FR-2**: Markdown heading — Include a valid H1 markdown heading in the format `# [Topic Title]` on the first line
  - **FR-3**: Prose content — Include exactly 2–3 sentences of informative, well-written prose content about any appropriate topic
  - **FR-4**: Content quality — Ensure prose is clear, grammatically correct, and provides useful information
  - **FR-5**: Git integration — Add file to git staging, commit with a conventional commit message (e.g., "feat(126): create markdown file test-gh8wxw.md with prose content"), and push to remote branch

  ## Non-Functional Requirements

  - **NFR-1**: Character encoding — File must use UTF-8 encoding without BOM (byte order mark)
  - **NFR-2**: Line endings — File must use Unix-style LF (\\n) line endings, not Windows CRLF (\\r\\n)
  - **NFR-3**: File termination — File must end with a single trailing newline character (POSIX convention)
  - **NFR-4**: Markdown validity — File must be valid markdown that renders correctly on GitHub without syntax errors
  - **NFR-5**: Content size — File prose content should be approximately 350–500 bytes in total size
  - **NFR-6**: No side effects — No existing files in the repository should be modified or deleted
  - **NFR-7**: Consistency — File structure and formatting must follow the established pattern of existing test markdown files (test-*.md) in the repository root

  ## Success Criteria

  - [ ] **File existence**: File `test-gh8wxw.md` exists at repository root level
  - [ ] **H1 heading**: First line contains a valid H1 markdown heading (format: `# Title`)
  - [ ] **Prose count**: File contains exactly 2 or 3 sentences of prose content
  - [ ] **Prose quality**: Content is informative, well-written, and grammatically correct
  - [ ] **Encoding**: File uses UTF-8 encoding without BOM (verified by hex inspection or editor setting)
  - [ ] **Line endings**: All line endings are LF (\\n), not CRLF (verified via `git diff --check` or editor)
  - [ ] **Trailing newline**: File ends with exactly one trailing newline (not zero, not multiple)
  - [ ] **Markdown render**: File renders correctly on GitHub without syntax errors
  - [ ] **Content size**: File content is between 350–500 bytes
  - [ ] **No modifications**: No other files in the repository have been created, modified, or deleted
  - [ ] **Git commit**: File is committed with a conventional commit message in the format `feat(126): create markdown file test-gh8wxw.md with prose content`
  - [ ] **Remote push**: Commit is pushed to the remote branch `feat/126-markdown-file-create-2b029c`

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | --------- | -------- | --------- |
  | 1 | Should git operations (add, commit, push) be included in the feature definition scope? | Yes - full integration with git operations | All related features (122–125) follow this pattern. The commit provides documentation and version control tracking. This aligns with the established workflow and ensures complete, reviewable work. |
  | 2 | Should the prose topic be constrained to repository/project-related content, or can it be any topic? | Any topic is acceptable | The spec explicitly states \"about any topic.\" This maximizes flexibility and simplifies the task. Content quality is more important than topic relevance for this feature. |

  ## Implementation Notes

  - The file name `test-gh8wxw.md` is specified and must not be changed
  - Prose can cover any topic (e.g., technical concepts, explanations, observations, facts)
  - Use the same structure as existing test markdown files: heading on line 1, blank line on line 2, prose starting on line 3
  - Can be created manually or using any existing automation script (e.g., `create_markdown.py`) if available
  - Validate file format using GitHub's markdown preview or a markdown linter (e.g., markdownlint)

  ## Size Estimate

  **S** — Single file creation requiring only prose content, no code changes, no testing, no system integration. Straightforward content-only task that can be completed in minutes. Complexity is minimal because it involves no architectural decisions, code modifications, or technical implementation—purely markdown file creation following an established repository pattern.
