# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature continues the established markdown test file creation pattern used in features 063-077
  and beyond. The architecture is deliberately minimal:

  **Scope**: Single file creation in repository root, no integration with application code
  **Pattern**: Files created at repository root (test-*.md) are test artifacts for the Sheep
  automated implementation platform, not part of the source code in /src/sheep/
  **Dependency Chain**: File creation → git staging → commit → push (simple sequential flow)

  The feature fits naturally into the existing codebase with zero modifications to source code,
  tests, or configuration files. The implementation is self-contained and follows the exact same
  approach as 65+ precedent features.

  ## Key Design Decisions

  ### Decision 1: Use pathlib.Path.write_text() for File Creation
  **Chosen**: Python `pathlib.Path.write_text(content, encoding="utf-8", newline="\n")`

  **Rationale**:
  - Modern Python 3.11+ standard for file I/O (explicit requirement NFR-5)
  - Explicit encoding and newline parameters guarantee UTF-8 without BOM (NFR-1) and LF line endings (NFR-2)
  - Concise, readable alternative to open()/close() boilerplate or os module
  - Cross-platform path handling ensures consistency across Linux/macOS/Windows
  - Proven reliable across 65+ existing test files in the codebase
  - The `newline="\n"` parameter is critical: it prevents Python from applying platform-specific
    line ending conversion, ensuring Unix LF on all systems

  ### Decision 2: Hardcode Prose Content (No Templates)
  **Chosen**: Hardcoded markdown content string with specific prose

  **Rationale**:
  - Specification explicitly allows "about anything" — topic is flexible per user query
  - No complex content generation needed (not a template system use case)
  - Deterministic, reproducible content (important for test files)
  - Zero external dependencies vs. template engines (Jinja2) which add complexity
  - Consistent with 65+ precedent features (all use hardcoded prose)
  - Direct, transparent implementation — implementer selects topic and writes content directly

  **Content Structure**:
  ```
  # Topic Title

  First sentence introducing the topic. Second sentence developing a specific aspect.
  Third sentence providing concluding perspective or insight.
  ```

  ### Decision 3: subprocess Module for Git Operations
  **Chosen**: Python subprocess for git commands (add, commit, push)

  **Rationale**:
  - Available in Python standard library (no new dependencies)
  - Git CLI commands are simple and self-documenting: `git add`, `git commit -m "..."`, `git push`
  - Three sequential operations are straightforward to manage
  - No complex git state manipulation needed
  - Simpler than GitPython (already in dependencies) for these basic operations
  - Consistent with codebase patterns where git operations are typically CLI-based

  **Git Operations Sequence**:
  ```python
  subprocess.run(["git", "add", "test-6tawx3.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(078): Create markdown file test-6tawx3.md with prose content"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  ### Decision 4: Manual Content Validation (No Automated Checks)
  **Chosen**: Implementer validates readability and structure during development

  **Rationale**:
  - Markdown structure is simple and trivial to verify by eye (H1 + blank line + prose)
  - File size (300-600 bytes) is a natural consequence of proper structure, not a precondition
  - Prose readability (FR-5) is inherently subjective — not automatable
  - UTF-8/LF encoding is guaranteed by implementation (pathlib parameters handle it)
  - Consistent with 65+ precedent features (all validated manually, no automated checks)
  - Automated pre-commit validation would add unnecessary complexity for a test file

  ## Implementation Strategy

  **Phase 1: File Creation and Git Integration** (single phase, sequential flow)

  1. **File Creation & Structure** (5-10 min):
     - Write markdown content string: H1 heading + blank line + 2-3 sentences of prose
     - Use pathlib.Path.write_text() with explicit UTF-8 and LF parameters
     - Verify file exists, encoding is correct, line endings are LF, size is ~300-600 bytes

  2. **Git Staging & Commit** (2-3 min):
     - Stage file: `git add test-6tawx3.md`
     - Commit: `git commit -m "feat(078): Create markdown file test-6tawx3.md with prose content"`
     - Verify commit exists on feature branch with correct message

  3. **Push to Remote** (1-2 min):
     - Push to origin: `git push -u origin HEAD`
     - Verify remote branch updated

  **Why This Order**: File must exist before staging; staging must be verified before pushing;
  remote push depends on successful local commit. Linear dependency chain with no parallelization
  opportunity.

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | File encoding defaults to system locale (not UTF-8) | Low | Explicit `encoding="utf-8"` parameter in pathlib.write_text() guarantees UTF-8 regardless of system settings |
  | Platform-specific line endings (CRLF on Windows) | Low | Explicit `newline="\n"` parameter prevents Python from applying platform-specific conversion |
  | Git push fails due to missing credentials | Low | Assume git credentials are pre-configured in CI/CD environment (standard practice); feature branch already created |
  | File content is grammatically incorrect or unreadable | Low | Manual review by implementer during RED/GREEN cycle; prose quality is subjective and easily verified by eye |
  | File already exists (overwrite risk) | Very Low | Feature spec requires creating NEW file; collision unlikely given unique filename (test-6tawx3.md); git will detect if file is modified |
  | Commit message contains typo | Low | Message is hardcoded in git command; no variation or user input involved; easy to verify before push |
  | Git operations fail (network timeout, permission denied) | Very Low | Feature branch pre-created; assume standard git configuration in environment; push uses -u origin HEAD for clarity |

  **Overall Risk Level**: Very Low. This is a well-established, simple pattern with 65+ successful
  precedents. All encoding/line ending issues are handled by implementation approach.
