# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 201 implementation proceeds through 6 tasks across 4 phases:

  **Phase 1: Content Generation Setup** orchestrates the main script creation (task 1) and
  implementation of content generation using existing utilities (task 2). These tasks establish
  the foundation for subsequent work by importing dependencies and calling proven utilities
  from features 199-200.

  **Phase 2: File Creation and Validation** implements the core file operations: task 3 creates
  the file with correct encoding and line endings, and task 4 implements all validation checks
  in sequential order (encoding, line endings, structure, size) before git integration.

  **Phase 3: Git Integration** implements the three git operations (task 5): add, commit, and
  push. These execute only after all validations pass, ensuring the repository is left in a
  clean, verified state.

  **Phase 4: Integration Testing** runs the complete workflow end-to-end (task 6) to verify
  all phases work together and produce the expected output file with passing validations.

  The implementation reuses patterns established in features 190-200, maintains consistency
  through shared utilities, and follows fail-fast principles with transparent error reporting.
  All major operations are logged via sheep observability for debugging and monitoring.
