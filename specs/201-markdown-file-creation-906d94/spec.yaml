content: |
  ## Problem Statement

  Create a markdown file named `test-lihjez.md` in the repository root containing:
  - One H1 heading (title)
  - 2-3 sentences of prose content

  The file must meet strict technical requirements:
  - UTF-8 encoding without BOM
  - Unix LF line endings (no CRLF)
  - File size 400-600 bytes (inclusive)
  - Must end with exactly one newline character

  After creation and validation, integrate with git workflow:
  - Stage file: `git add test-lihjez.md`
  - Commit with conventional message: `feat(201): create markdown file test-lihjez.md...`
  - Push to feature branch: `git push -u origin HEAD`

  This is feature 201 in the continuation of established markdown file creation pattern
  (features 190-200, all successfully completed).

  ## Success Criteria

  - [ ] File `test-lihjez.md` exists in repository root
  - [ ] File contains exactly one H1 heading
  - [ ] File contains 2-3 sentences (validated by sentence boundary markers: . ! ?)
  - [ ] File size is 400-600 bytes (inclusive)
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF line endings exclusively (no CRLF)
  - [ ] File ends with exactly one newline character
  - [ ] File is staged in git index (visible in `git status` as "new file:")
  - [ ] File is committed with message matching conventional format: `feat(201): create markdown file test-lihjez.md`
  - [ ] File is pushed to remote feature branch `origin/feat/201-markdown-file-creation-906d94`
  - [ ] No validation errors logged during execution
  - [ ] Structured logs confirm all validation checks passed

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-lihjez.md` in repository root directory
  - **FR-2**: File must contain exactly one H1 heading serving as the title
  - **FR-3**: File must contain 2-3 sentences of prose content (separate from title)
  - **FR-4**: Generate content using Claude API via CrewAI integration
  - **FR-5**: Validate file structure: confirm H1 heading, blank line, prose, final newline
  - **FR-6**: Validate file encoding: must be UTF-8 without BOM
  - **FR-7**: Validate line endings: must be Unix LF throughout, no CRLF
  - **FR-8**: Validate file size: must be 400-600 bytes (inclusive)
  - **FR-9**: Stage file using `git add test-lihjez.md`
  - **FR-10**: Commit file with conventional commit message format (feat(201): ...)
  - **FR-11**: Push file to origin feature branch using `git push -u origin HEAD`
  - **FR-12**: Report success only after all validations and git operations complete
  - **FR-13**: Fail if test-lihjez.md already exists (prevent data loss and inconsistent state)

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding without BOM (no byte-order mark)
  - **NFR-2**: File must use Unix LF line endings (0x0A, not CRLF 0x0D0A)
  - **NFR-3**: File size must be 400-600 bytes inclusive (prevents too-small or oversized content)
  - **NFR-4**: File must end with exactly one newline character (standard Unix convention)
  - **NFR-5**: Implementation must follow established patterns from features 190-200 for consistency
  - **NFR-6**: Must use `sheep.config.llm.get_reasoning_llm()` for Claude API access via CrewAI
  - **NFR-7**: Must use `sheep.observability.logging.get_logger()` for structured logging
  - **NFR-8**: All major operations must be logged (content generation, file creation, validation, git ops)
  - **NFR-9**: Error messages must be specific and actionable (not generic)
  - **NFR-10**: Execution time should complete in under 2 minutes for full workflow
  - **NFR-11**: Implementation should fail fast on validation errors without attempting recovery
  - **NFR-12**: Must validate all constraints before writing file (prevent partial failures)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Reuse utilities from src/create_markdown.py or write fresh code? | Reuse existing utilities | Features 199-200 established proven abstractions; reusing validates them, ensures consistency, reduces bugs, saves time. |
  | 2 | Auto-correct validation failures or fail immediately? | Fail immediately with error report | Fail-fast principle ensures predictability. Auto-correction masks issues. Users should see what failed, not mysterious fixes. |
  | 3 | How to handle pre-existing test-lihjez.md file? | Fail if file exists | Feature isolation is crucial. Existing file suggests branch state is inconsistent. Failing alerts user to investigate rather than silently skipping or overwriting. |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The directory structure is:

  - **Root directory**: Contains numerous test markdown files (test-*.md) and implementation scripts from previous features
  - **src/sheep/**: Core platform code
    - `config/`: LLM configuration and settings (llm.py, settings.py)
    - `flows/`: Flow definitions for orchestration
    - `agents/`: Agent definitions
    - `tools/`: Agent tools for file and git operations
    - `observability/`: Logging and Langfuse integration
    - `cli.py`: CLI entry point
  - **specs/**: Feature specifications in YAML format
  - Multiple implementation scripts (create_markdown_file.py, create_feature_*.py, etc.) demonstrating the pattern

  ### Architecture Patterns

  1. **Feature-driven development**: Each numbered feature (190-201) creates a single markdown file with consistent structure
  2. **Workflow orchestration**: Features follow a three-phase pattern:
     - Phase 1: Content creation (title + prose generation)
     - Phase 2: File validation (encoding, line endings, structure, size)
     - Phase 3: Git integration (add, commit, push)
  3. **LLM integration**: Uses `sheep.config.llm.get_reasoning_llm()` for Claude API calls via CrewAI
  4. **Modular utilities**: Shared functionality in src/create_markdown.py for content generation and validation
  5. **Error handling**: Try-catch blocks with specific exception types (ValueError for validation, OSError for I/O)
  6. **Logging**: Structured logging via `sheep.observability.logging.get_logger()`

  ### Relevant Technologies

  - **CrewAI**: Multi-agent orchestration framework for LLM coordination
  - **Claude API**: Anthropic's reasoning LLM for content generation
  - **Git**: Version control for staging, committing, and pushing files
  - **Pydantic**: Configuration management and validation
  - **Langfuse**: Observability and tracing for agent execution

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | High | A new markdown file (test-lihjez.md) will be created in the repository root |
  | Git repository | High | File will be staged, committed with conventional message format, and pushed to origin |
  | Implementation pattern | Medium | Follows established pattern from features 190-200; demonstrates consistency and reusability |

  ## Dependencies

  **External dependencies** (already in the project):
  - `CrewAI` (>=0.86.0): Agent orchestration and LLM coordination
  - `Anthropic/Claude API`: For generating markdown content (via sheep.config.llm.get_reasoning_llm)
  - `GitPython` (>=3.1.0): Python bindings for git operations
  - `Pydantic` (>=2.0.0): Data validation and configuration management
  - `structlog` (>=24.0.0): Structured logging

  **Code dependencies**:
