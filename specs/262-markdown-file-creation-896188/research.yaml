content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-29
  - **Status:** Complete

  ## Technology Stack

  ### Core Technologies
  1. **Claude API** — Anthropic reasoning LLM for content generation
  2. **Python 3.11+** — Runtime environment
  3. **pathlib** — Modern, cross-platform file path and I/O
  4. **subprocess** — Safe git command integration
  5. **regex** — Sentence boundary detection for validation
  6. **Markdown (CommonMark)** — Content format and validation target
  7. **Git** — Version control and commit/push operations

  ### Existing Module: src/create_markdown.py

  The implementation leverages a comprehensive, battle-tested module already in the codebase:

  **Key Functions:**
  - `generate_markdown_content(max_retries=3)` — Claude API content generation with exponential backoff
  - `validate_content(content)` — Multi-stage structure and prose validation
  - `create_markdown_file(content, filename, filepath)` — pathlib-based file I/O
  - `validate_file_encoding(filepath)` — UTF-8/LF encoding validation
  - `stage_and_commit_file(filename, commit_message)` — Git staging and commit
  - `push_to_feature_branch(branch_name)` — Git push to origin
  - `create_and_commit_markdown_file(filename, filepath, branch_name)` — Full orchestration workflow

  **Why Reuse Existing Code:**
  - Already used in features 259-261 (identical use case)
  - Thoroughly tested and production-ready
  - Eliminates reimplementation risk
  - Consistent approach across all markdown-file-creation features
  - Reduces development time from 10-15 minutes to ~5 minutes
  - All NFRs already met by existing implementation

  ## Library Analysis

  | Technology | Purpose | Decision | Reasoning |
  | ---------- | ------- | -------- | --------- |
  | Claude API (Anthropic) | Content generation | Use (existing) | Already integrated via sheep.config.llm; no new dependencies; proven across features 259-261 |
  | pathlib | File I/O and path handling | Use (stdlib) | Modern Python 3.11+ standard; explicit encoding/newline control; cross-platform reliability |
  | subprocess | Git command execution | Use (stdlib) | No new dependencies; shell=False prevents injection; well-established safety pattern |
  | regex | Sentence boundary detection | Use (stdlib) | Simple, fast, sufficient for this use case; part of standard library |
  | sheep.config.llm | LLM abstraction layer | Use (existing) | Existing Sheep module for Claude API access; handles authentication and configuration |
  | sheep.observability.logging | Logging framework | Use (existing) | Existing Sheep module; structured logging with levels (info, warning, error) |
  | GitPython | Git abstraction | Reject | Would add external dependency (violates NFR-9); provides no functional advantage over subprocess |
  | NLTK | NLP sentence detection | Reject | Overkill for simple regex-based validation; adds external dependency unnecessarily |
  | CommonMark library | Markdown validation | Reject | Existing regex-based validation is sufficient; no need for full parser; adding dependency not justified |

  ## Detailed Technology Decisions

  ### 1. Content Generation: Claude API

  **Chosen:** Claude reasoning LLM via `generate_markdown_content()` with retry logic and exponential backoff.

  **Why Claude API over alternatives:**
  - Produces genuinely varied, coherent prose across 100+ test files
  - Thematic consistency (title-prose relationship)
  - Sentence structure and grammar validation built-in
  - Retry logic handles API transience (exponential backoff)
  - Validation layer ensures quality before file creation
  - Already integrated into Sheep platform (sheep.config.llm.get_reasoning_llm())

  **Integration Points:**
  - `sheep.config.llm.get_reasoning_llm()` — Existing wrapper for Claude API
  - `sheep.observability.logging.get_logger()` — Existing logging framework
  - Error handling: ValueError on validation failure, Exception on API unavailability
  - Retry: 3 attempts, exponential backoff (1s, 2s, 4s)

  ### 2. File I/O: pathlib.Path

  **Chosen:** `pathlib.Path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")`

  **Why pathlib over alternatives:**
  - **Requirement:** NFR-5 explicitly mandates pathlib use
  - Modern Python 3.11+ standard (PEP 3123)
  - Cross-platform path handling (no manual os.path.join)
  - Atomic write with explicit encoding/newline parameters
  - Built-in methods for exists(), mkdir(parents=True), is_dir()
  - Eliminates encoding/line-ending bugs by design

  **Encoding Guarantees:**
  - `encoding=\"utf-8\"` ensures UTF-8 without BOM (Python default for UTF-8)
  - `newline=\"\\n\"` forces Unix LF line endings, ignores platform defaults
  - Fails explicitly on encoding errors (no silent corruption)
  - Works identically on Windows/Mac/Linux

  ### 3. Git Integration: subprocess

  **Chosen:** `subprocess.run(['git', 'add'/'commit'/'push'], check=True, capture_output=True, text=True, shell=False)`

  **Why subprocess over alternatives:**
  - **Requirement:** NFR-9 prohibits new external dependencies (GitPython would violate this)
  - stdlib availability (no new dependencies)
  - `shell=False` prevents command injection (OWASP best practice)
  - Arguments as list prevents shell metacharacter interpretation
  - Clear error handling per command (CalledProcessError)
  - Already proven in features 259-261

  **Safety Pattern:**
  - Arguments passed as list, not concatenated strings
  - Filenames/messages cannot contain metacharacters that execute code
  - Commit message is hardcoded in spec

  ### 4. Content Validation

  **Chosen:** Multi-stage validation executed at two points:
  1. **During generation:** validate_content() before file write
  2. **After file creation:** validate_markdown_file() and validate_file_encoding()

  **Validation Layers:**

  **Layer 1: Structure Validation (validate_content)**
  - Starts with H1 heading (`^# `)
  - Blank line separator (line 2 is empty)
  - Exactly 2-3 sentences (regex sentence boundary detection)
  - Prose length: 100-300 characters
  - Vocabulary variety: 10+ unique words

  **Layer 2: File Encoding Validation (validate_file_encoding)**
  - UTF-8 without BOM (checks for EF BB BF bytes)
  - Unix LF line endings (no CRLF)
  - Readable by Python UTF-8 decoder

  **Layer 3: Markdown Structure Validation (validate_markdown_file)**
  - Same structure checks as Layer 1, but on written file
  - Ensures file write did not corrupt content

  ### 5. Sentence Detection: Regex

  **Chosen:** `SENTENCE_BOUNDARY_PATTERN = r\"[.!?]\\s+\"`

  **How It Works:**
  - Counts sentences by splitting on sentence terminators (. ! ?)
  - Requires space after terminator (prevents false splits on abbreviations)
  - Regex is simple, fast, and sufficient for this use case

  ## Security Considerations

  ### Input Validation
  - **Content source:** Claude API (trusted, internal service); prose is AI-generated, not user input
  - **Filename:** Hardcoded in spec (test-qvlm4j.md); no dynamic naming or path traversal risk
  - **File path:** Defaults to repo root; pathlib prevents directory traversal

  ### Command Injection Prevention
  - **Git commands:** Arguments passed as list to subprocess (shell=False), not as concatenated strings
  - **No shell interpretation:** Filenames/messages cannot contain metacharacters that execute code
  - **Commit message:** Hardcoded in spec; no user input

  ### File System Safety
  - **Overwrite prevention:** FileExistsError raised if file exists (fail-safe)
  - **Directory creation:** pathlib.mkdir(parents=True, exist_ok=True) safe for idempotent directory structure
  - **Permissions:** Uses default umask (respects repository settings)

  ### Data Integrity
  - **Encoding validation:** Explicit UTF-8 without BOM (prevents corruption)
  - **Line endings:** LF validation catches platform-specific corruption
  - **Git verification:** Commit message matches spec exactly; no tampering possible

  ## Performance Characteristics

  ### Expected Performance
  - **Content generation:** ~1-3 seconds (Claude API call)
  - **File creation:** <100ms (pathlib write_text)
  - **Validation:** <50ms (regex matching, file read)
  - **Git operations:** <500ms (git add, commit, push)
  - **Total workflow:** ~3-5 seconds per file

  ### Scalability
  - **Sequential execution:** Feature creates one file per execution (not batched)
  - **API calls:** Retry logic with exponential backoff (max 3 attempts)
  - **No caching needed:** File is created once, committed once, pushed once
  - **Logging overhead:** Minimal (structured logger, no heavy I/O)

  ## Integration Points

  ### Existing Modules Used
  - `sheep.config.llm.get_reasoning_llm()` — Returns Claude API client
  - `sheep.observability.logging.get_logger(__name__)` — Returns structured logger

  ### Git Workflow Integration
  - **Branch:** Feature branch `feat/262-markdown-file-creation-896188` (pre-created)
  - **Commit message:** Conventional format `feat(262): Create markdown file test-qvlm4j.md with prose content`
  - **Push target:** `origin` remote, current branch
  - **CI/CD:** No interaction (file creation does not trigger pipeline)

  ### Established Pattern Compliance
  - Identical to features 259-261 implementation
  - Follows 100+ existing test files format and structure
  - No deviations from established patterns
  - Re-uses src/create_markdown.py functions directly

  ## Risk Assessment

  ### Low-Risk Areas
  - **File I/O:** pathlib is battle-tested; encoding parameters are explicit and safe
  - **Git operations:** subprocess pattern is well-established; no shell interpretation
  - **Content generation:** Claude API is trusted; validation layer is comprehensive
  - **Dependencies:** No new external packages (all stdlib or existing)

  ### Mitigations in Place
  - Multi-stage validation (structure, encoding, markdown compliance)
  - Explicit error handling and logging throughout
  - Retry logic for API transience
  - File existence check prevents accidental overwrites
  - subprocess safety pattern prevents command injection

