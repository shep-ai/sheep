content: |
  ## Summary

  This feature implements the 255th identical markdown file creation pattern in
  the Sheep project. Work is organized into 3 concrete tasks across 2 logical phases:

  **Phase 1: Content Creation** — Task 1 creates the markdown file using pathlib
  with explicit UTF-8 encoding and LF line endings. Implementer writes original
  2-3 sentence prose on any topic, following 250+ existing precedents.

  **Phase 2: Validation & Git Integration** — Task 2 validates the file meets all
  structural, encoding, and format requirements. Task 3 stages the file, commits
  with the exact conventional message, and pushes to the remote origin.

  Each task has TDD-style RED/GREEN/REFACTOR cycles:
  - RED: Define expectations and assertions
  - GREEN: Implement minimal code to satisfy
  - REFACTOR: Verify correctness and quality

  Tasks depend sequentially: Task 1 → Task 2 → Task 3. Total work is approximately
  13 minutes, fitting the S (Small) size estimate of 10-15 minutes.
