content: |
  ## Summary

  This implementation consists of 4 tasks across 3 phases that create the test-ssvpxa.md markdown file
  using orchestrated helpers from the sheep.content_generators module:

  **Phase 1 — Feature Setup (Task 1, ~10 min):**
  Create a minimal feature module (src/sheep/features/feature_168.py, ~15 lines) that imports and calls
  the create_markdown_file() helper. This is the entry point for the feature.

  **Phase 2 — File Creation & Validation (Tasks 2-3, ~15 min):**
  Execute the helper to generate prose content via Claude API, write the file to disk with proper encoding
  and line endings, and validate all file properties match spec requirements (UTF-8, LF, markdown structure,
  sentence count, size).

  **Phase 3 — Git Integration (Task 4, ~5 min):**
  Verify that git operations (stage, commit with conventional message, push to remote) completed successfully.
  The helper handles these automatically; this task confirms they succeeded.

  **Key Points:**
  - Implementation is minimal because create_markdown_file() handles orchestration of all steps
  - All helpers are battle-tested across 165+ prior identical implementations
  - No new dependencies or source code modifications required
  - Total effort ~25-30 minutes (matches spec estimate of S/Small size)
  - TDD cycles ensure verification at each step before proceeding
