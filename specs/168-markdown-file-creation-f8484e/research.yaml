content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete

  ## Overview

  Feature 168 (markdown-file-creation) requires creating a single markdown file named `test-ssvpxa.md` with a title (H1 heading) and 2-3 sentences of prose content. This is the 168th iteration of an identical feature pattern with 165+ prior successful implementations existing in the repository.

  **Key Finding:** All necessary helper functions already exist in the `sheep.content_generators` module, which is specifically designed for this exact use case. The module provides battle-tested implementations of content generation, file writing, validation, and git operations. No new libraries or custom code is needed—implementation is primarily orchestration of existing helpers.

  ## Technology Decisions

  ### 1. Content Generation — Use Existing Helper Function

  **Chosen:** `sheep.content_generators.generate_markdown_content()`

  **Rejected:**
  - Custom Claude API integration — duplicates existing functionality with less error handling
  - Hardcoded template content — breaks pattern of dynamic content generation
  - Direct Anthropic SDK — unnecessary when CrewAI integration is configured

  **Rationale:** The helper function uses CrewAI's `get_reasoning_llm()` to generate markdown via Claude API. It includes:
  - Well-engineered prompt (MARKDOWN_GENERATION_PROMPT constant)
  - Response parsing for different return types (dict vs string)
  - Trailing newline normalization (Unix convention)
  - Format validation via `_validate_markdown_content()`
  - Comprehensive error logging

  This eliminates risk of subtle format deviations and is battle-tested across 165+ implementations.

  ### 2. File Writing — Use Existing Helper Function

  **Chosen:** `sheep.content_generators.write_markdown_file()`

  **Rejected:**
  - Direct `pathlib.Path.write_text()` — lacks safety checks (directory traversal prevention)
  - Manual file operations — no filename validation or error handling
  - StringIO buffering — unnecessary complexity

  **Rationale:** The helper function provides critical safety features:
  - Validates filenames (rejects '/', '\\', '.') to prevent directory traversal
  - Uses `Path.cwd()` for repository-relative paths
  - Verifies file creation success (exists check)
  - Validates file is non-empty (size check)
  - Returns full filepath as string for downstream use
  - Comprehensive error logging

  ### 3. File Validation — Comprehensive Validation Required

  **Chosen:** `sheep.content_generators.validate_markdown_file()`

  **Rejected:**
  - Basic existence check only — insufficient for format verification
  - Custom validation logic — duplicates existing helper
  - Skip validation — violates NFR requirements

  **Rationale:** Comprehensive validation ensures:
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (not CRLF)
  - H1 heading format and position
  - 2-3 sentence count via period matching
  - Blank line separator between heading and prose
  - Trailing newline for Unix compatibility
  - Reasonable content length

  This prevents silent format deviations that downstream tools might not detect until too late.

  ### 4. Git Operations — Use Established Workflow

  **Chosen:** `sheep.content_generators.commit_markdown_file()` and `push_markdown_file()`

  **Rejected:**
  - Direct GitPython API — lower-level, less error handling, no message format enforcement
  - Manual subprocess calls — error-prone, duplicates tool logic
  - Custom git orchestration — unnecessary complexity

  **Rationale:** The helper functions wrap `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`:
  - Automatic `git add` via `add_all=True` parameter
  - Conventional commit message format enforcement
  - Proper error detection (distinguishes "nothing to commit" from other errors)
  - Upstream tracking on push (`set_upstream=True`)
  - Comprehensive error logging and reporting

  ### 5. Orchestration Pattern — Use End-to-End Helper

  **Chosen:** `sheep.content_generators.create_markdown_file()`

  **Rejected:**
  - Manual step-by-step calls — duplicates orchestration logic
  - Custom CrewAI agents — unnecessary complexity for straightforward file creation
  - Inline implementation — scatters logic across multiple files

  **Rationale:** The `create_markdown_file()` function provides complete orchestration:

  ```python
  def create_markdown_file(
      filename: str, repo_path: str | None = None
  ) -> dict[str, str]:
  ```

  **Workflow:**
  1. Generate markdown content (Step 1)
  2. Write file to disk (Step 2)
  3. Validate file meets requirements (Step 3)
  4. Commit with conventional message (Step 4)
  5. Push to remote with upstream tracking (Step 5)

  **Returns:** Dictionary with keys: `filepath`, `content`, `commit_message`, `push_result`

  This is the established pattern from features 165-167.

  ### 6. Commit Message Format — Conventional Commits

  **Chosen:** `feat(168): Create markdown file test-ssvpxa.md with prose content`

  **Rejected:**
  - Simple format ('Create file') — breaks convention and 165+ pattern
  - Multi-line format with explanation — inconsistent with existing pattern
  - Custom templated format — unnecessary when convention is established

  **Rationale:** The spec explicitly requires this exact format (FR-7). The `commit_markdown_file()` function accepts an optional `custom_message` parameter to enforce the exact required message. This follows Conventional Commits specification: `type(scope): description`.

  ### 7. File Location — Repository Root

  **Chosen:** Repository root directory (via `Path.cwd() / filename`)

  **Rejected:**
  - Subdirectories (tests/, specs/) — breaks 165+ test file pattern
  - Configurable location — unnecessary complexity
  - Dynamic naming — user specified exact filename 'test-ssvpxa.md'

  **Rationale:** Spec requirements (FR-1, FR-2) mandate repository root and exact filename. The `write_markdown_file()` function uses `Path.cwd()` which is the repository root when invoked from implementation code. All 165+ prior test files follow this pattern.

  ## Library Analysis

  | Library | Purpose | Decision | Version | Reasoning |
  | ------- | ------- | -------- | ------- | --------- |
  | CrewAI | LLM orchestration framework | Use (required) | 0.86.0+ | Project foundation; provides `get_reasoning_llm()` integration and agent task orchestration |
  | Anthropic Claude API | Content generation LLM | Use (via CrewAI) | Current | Configured via `sheep.config.llm.get_reasoning_llm()`; no direct SDK calls needed |
  | GitPython | Git operations library | Use (via tools) | 3.1.0+ | Already integrated via `GitCommitTool` and `GitPushTool` in `sheep.tools.git_tools` |
  | pathlib | File I/O and path operations | Use (required) | std lib Python 3.11+ | Python standard library; essential for cross-platform file operations; used in helpers |
  | Pydantic | Data validation library | Use (existing) | 2.0+ | Already integrated; used in `_validate_markdown_content()` and git tool schemas |
  | structlog | Structured logging | Use (existing) | 24.0+ | Already integrated via `sheep.observability.logging`; used for comprehensive logging |

  **Dependencies Assessment:**
  - No new external dependencies required
  - All libraries used are already in `pyproject.toml`
  - Implementation is pure orchestration of existing helpers

  ## Security Considerations

  ### 1. File Path Traversal Prevention

  **Implementation:** `write_markdown_file()` validates filenames:
  ```python
  if "/" in filename or "\\" in filename or filename.startswith("."):
      raise ValueError(f"Invalid filename: {filename}")
  ```

  **Effect:** Prevents directory traversal attacks that could create files outside repository root.

  **Mitigation:** ✓ Enforced by helper function

  ### 2. Encoding Safety

  **Implementation:**
  - Files written with UTF-8 encoding (no BOM)
  - Validated in `validate_file_properties()` to ensure no UTF-8 BOM present
  - Binary read check for CRLF line endings

  **Effect:** Prevents encoding-related vulnerabilities and ensures platform consistency.

  **Mitigation:** ✓ Enforced by helper functions

  ### 3. Content Validation

  **Implementation:** `_validate_markdown_content()` and `validate_markdown_file()` ensure:
  - Valid markdown structure (H1 heading, blank separator)
  - Reasonable content length (50+ bytes minimum, 300-600 bytes typical)
  - Sentence structure (2-3 sentences via period count)
  - Trailing newline (Unix convention)

  **Effect:** Prevents injection attacks through malformed markdown and ensures predictable output.

  **Mitigation:** ✓ Enforced by validation helpers

  ### 4. LLM Output Validation

  **Implementation:** Content from Claude API is validated before file write:
  ```
  generate_markdown_content()
    ↓ (calls _validate_markdown_content())
    ↓
  write_markdown_file()
  ```

  **Effect:** Unvalidated AI output never reaches the filesystem.

  **Mitigation:** ✓ Enforced by helper function chain

  ### 5. Git Credential Management

  **Implementation:** Git operations delegated to `GitCommitTool` and `GitPushTool` which use project's configured git credentials.

  **Effect:** Credentials are managed by git configuration, not stored in code.

  **Mitigation:** ✓ Handled by project infrastructure

  ## Performance Implications

  ### Performance Profile

  | Operation | Duration | Bottleneck | Notes |
  | --------- | -------- | ---------- | ----- |
  | LLM content generation | 2-5 seconds | Network latency to Claude API | Expected; acceptable for feature size estimate of ~10-15 minutes |
  | File write to disk | <10ms | I/O | Single file, ~300-600 bytes; negligible |
  | Validation operations | <5ms | CPU | O(n) where n = file size; negligible |
  | Git commit | <100ms | Disk I/O | Single file; minimal overhead |
  | Git push | 1-5 seconds | Network | Depends on remote repository; typical for GitHub |
  | **Total estimated** | **5-15 seconds** | **LLM latency + network** | Matches size estimate of ~10-15 minutes execution time |

  ### Optimization Opportunities

  1. **LLM Caching:** Not applicable — requirement specifies content "about anything", no two feature implementations would generate identical content
  2. **Batch Operations:** Not applicable — single file creation per feature
  3. **Parallel Processing:** Not applicable — steps have sequential dependencies (must generate before write, must validate before commit)
  4. **Network Optimization:** Handled by CrewAI and git infrastructure; implementation has no control

  ### Scalability Notes

  This feature has minimal computational requirements:
  - Single file creation (not bulk operations)
  - Linear time complexity (O(n) where n = file size)
  - No database queries or external API calls beyond Claude API
  - No caching or state management needed

  Scalability is not a concern for this feature pattern.

  ## Architecture Integration

  ### How This Fits Into Sheep Architecture

  **Layer 1 - Content Generation:** `sheep.content_generators.generate_markdown_content()`
  - Uses CrewAI LLM framework
  - Integrates with `sheep.config.llm.get_reasoning_llm()`
  - Provides structured logging via `sheep.observability.logging`

  **Layer 2 - File Operations:** `sheep.content_generators.write_markdown_file()`
  - Uses pathlib for cross-platform file I/O
  - Provides safety validation and error handling
  - Logs all operations for observability

  **Layer 3 - Validation:** `sheep.content_generators.validate_markdown_file()`
  - Validates file properties (encoding, line endings)
  - Validates markdown structure and content
  - Provides detailed error messages for debugging

  **Layer 4 - Git Integration:** `sheep.content_generators.commit_markdown_file()` and `push_markdown_file()`
  - Uses `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools`
  - Wraps subprocess calls to git CLI
  - Ensures conventional commit format

  **Layer 5 - Orchestration:** `sheep.content_generators.create_markdown_file()`
  - Chains all layers in correct sequence
  - Handles error propagation
  - Returns complete result dictionary

  ### Design Patterns Used

  1. **Separation of Concerns:** Each helper function has single responsibility
  2. **Error Propagation:** Exceptions bubble up with descriptive messages
  3. **Structured Logging:** All operations logged via `sheep.observability.logging`
  4. **Validation at Boundaries:** Input validation at file write, output validation after generation
  5. **Functional Composition:** `create_markdown_file()` composes individual helpers

  ### Integration Points

  - **LLM Integration:** Via `sheep.config.llm.get_reasoning_llm()` (CrewAI's LLM factory)
  - **Git Integration:** Via `sheep.tools.git_tools.GitCommitTool` and `GitPushTool`
  - **Logging Integration:** Via `sheep.observability.logging.get_logger()`
  - **Error Handling:** Standard Python exception hierarchy

  ### No Source Code Modifications Required

  Per NFR-7: Implementation must not modify source code in `/src/sheep/`:
  - All helpers exist in `sheep.content_generators`
  - No changes to agent definitions needed
  - No changes to flow definitions needed
  - No changes to tool definitions needed
  - Feature code only orchestrates existing helpers

  ## Comparison with Prior Implementations

  Features 165-167 followed identical pattern:
  - Same `sheep.content_generators` helpers
  - Same commit message format (feat(N): Create markdown file...)
  - Same validation approach
  - Same git workflow

  **Verification:** All 165+ test files in repository root follow identical structure:
  ```
  # [Title]

  [2-3 sentences of prose]
  ```

  This consistency demonstrates the pattern's maturity and reliability.

  ## Implementation Strategy

  ### Recommended Approach

  **Primary entry point:** `sheep.content_generators.create_markdown_file("test-ssvpxa.md")`

  **Single function call handles:**
  1. Content generation via Claude API
  2. File write with validation
  3. Format validation (encoding, line endings, structure)
  4. Conventional commit with message
  5. Push to remote with upstream tracking

  **Returns:** Dictionary with complete results for logging and verification

  **Error handling:** All exceptions propagate with descriptive messages and logging

  ### Alternative Approaches

  If more control is needed:
  ```python
  content = generate_markdown_content()
  filepath = write_markdown_file(content, "test-ssvpxa.md")
  validate_markdown_file(filepath)
  commit_result = commit_markdown_file(filepath, content, custom_message="feat(168): Create markdown file test-ssvpxa.md with prose content")
  push_result = push_markdown_file()
  ```

  However, the `create_markdown_file()` orchestration function is preferred—it's tested and used in features 165-167.

