content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-28
  - **Status:** Complete — implementation strategy defined, architecture decisions documented, ready for task execution

  ## Architecture Overview

  Feature 251 follows the established pattern from 181+ existing markdown test files (features 069-250) in the Sheep repository. The implementation is straightforward file creation with git integration:

  1. **File Creation**: Single markdown file (`test-yoduvz.md`) in repository root with standard structure (H1 heading + 2-3 prose sentences)
  2. **Encoding & Format**: UTF-8 without BOM, LF line endings, CommonMark-compliant markdown syntax
  3. **Git Workflow**: Stage, commit with conventional message format, push to pre-created feature branch
  4. **No Application Code Changes**: Feature does not modify source code in `/src/sheep/` or any application logic

  This is a **validation artifact** — a test file demonstrating the platform's ability to create files and manage git workflows. It has no dependencies on application code and is isolated from the main codebase.

  ### Codebase Fit

  - **Artifact Collection**: Adds one file to the existing 181+ test markdown files at repository root (test-*.md pattern)
  - **No Source Code Impact**: Zero modifications to application code, configuration, or test infrastructure
  - **Pattern Consistency**: Identical structure and requirements to features 069-250 (proven pattern across 181+ precedents)
  - **Git History**: Commits follow conventional commit format; appear in standard git log
  - **No New Dependencies**: Uses only Python standard library (pathlib, subprocess) and git (already required)

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path.write_text()

  **Decision**: Use `pathlib.Path("test-yoduvz.md").write_text(content, encoding='utf-8')`

  **Rationale**:
  - **Requirement**: NFR-5 explicitly mandates pathlib.Path for file I/O
  - **Idiomatic**: pathlib is modern Python standard library (since 3.4), the recommended approach for file operations
  - **Cleanliness**: write_text() avoids context manager boilerplate required by open()
  - **Encoding**: encoding='utf-8' parameter ensures UTF-8 without BOM (Python's utf-8 codec doesn't add BOM by default, unlike utf-8-sig)
  - **Precedent**: Established across all 181+ existing test files in the repository

  **Alternatives Considered**:
  - open() function: Requires context manager, more verbose, less idiomatic for simple file creation
  - os module functions: Too low-level, requires manual byte encoding and doesn't handle text encoding cleanly

  ### 2. Prose Content: Hardcoded with Manual Quality Review

  **Decision**: Write prose content directly (hardcoded), validated manually by implementer during creation

  **Rationale**:
  - **Product Decision**: Product question #3 resolves that prose readability (FR-5) is validated by implementer manual review, standard practice across 181+ existing files
  - **Quality Assurance**: Hardcoded content ensures consistent quality and grammatical correctness
  - **Simplicity**: No additional logic, external libraries, or procedural generation needed
  - **Precedent**: All 181+ existing test files use hand-written prose content
  - **Topic Freedom**: Product question #2 confirms free-form topic selection with no constraints

  **Alternatives Considered**:
  - Random/procedurally generated content: Adds complexity, harder to ensure grammatical correctness per FR-5
  - Template-based generation: Unnecessary complexity for single file creation

  ### 3. Git Integration: subprocess with Git CLI

  **Decision**: Use `subprocess.run()` with standard git command-line interface (git add, git commit, git push)

  **Rationale**:
  - **Requirement**: NFR-9 explicitly prohibits new external dependencies
  - **Standard Library**: subprocess is built-in Python module, available without additional packages
  - **Simplicity**: Direct git commands are clearer than library abstractions
  - **No Configuration**: Repository already has git user configured, feature branch pre-created
  - **Safety**: subprocess.run() with argument list (not shell string) prevents command injection attacks

  **Alternatives Considered**:
  - GitPython library: Violates NFR-9 (new external dependency), would require adding external package
  - PyGit2 library: Violates NFR-9, adds unnecessary complexity for simple operations

  ### 4. Encoding & Line Ending Handling: Native Platform Defaults

  **Decision**:
  - Encoding: UTF-8 via pathlib.write_text(encoding='utf-8')
  - Line endings: Native Unix LF (text mode default)

  **Rationale**:
  - **UTF-8 without BOM**: Python's utf-8 codec (distinct from utf-8-sig) does NOT add BOM. The encoding='utf-8' parameter in write_text() satisfies NFR-1 without additional logic.
  - **LF Preservation**: Unix systems (this environment) use LF natively in text mode. Python's text mode on Unix preserves LF automatically, satisfying NFR-2.
  - **CommonMark Compliance**: Standard markdown syntax (H1 heading + plain text) automatically complies with CommonMark specification (NFR-4)

  **Verification Methods**:
  - Encoding: File will show "UTF-8 Unicode text" with `file -b test-yoduvz.md`
  - Line endings: `od -c test-yoduvz.md` shows Unix newlines, not CRLF

  ### 5. Validation Strategy: Manual Review After Creation

  **Decision**: No automated validation script; rely on manual review and successful git push

  **Rationale**:
  - **Test Content**: This is test content, not production code. Manual review per FR-5 is standard practice across 181+ precedent files.
  - **Clear Success Criteria**: Specification defines measurable, testable success criteria (file exists, git commit created, push succeeded)
  - **Code Simplicity**: No additional validation logic needed; implementation stays focused on core file creation
  - **Test Execution**: If automated testing is needed, CI will validate file properties during test runs
  - **Precedent**: All 181+ existing test files follow manual validation pattern

  **Alternatives Considered**:
  - Automated validation script: Adds code complexity without clear benefit; may generate false positives
  - Inline validation assertions: Complicates code flow unnecessarily; not standard practice for test artifacts

  ## Implementation Strategy

  The implementation follows two sequential phases:

  **Phase 1: File Creation & Validation**
  - Create markdown file with hardcoded prose content using pathlib.Path.write_text()
  - Verify file structure: H1 heading on first line, blank line, 2-3 prose sentences following
  - Confirm encoding is UTF-8 without BOM using `file` command
  - Confirm line endings are LF (Unix) using `od` command
  - Validate file size naturally falls within expected range (400-600 bytes)
  - Implementer manually reviews prose for grammatical correctness and readability

  **Phase 2: Git Integration & Push**
  - Stage file with `git add test-yoduvz.md`
  - Commit with conventional commit message: "feat(251): create markdown file test-yoduvz.md with prose content"
  - Push to feature branch `feat/251-markdown-file-creation-8e107d` using `git push -u origin HEAD`
  - Verify push succeeds and remote tracking branch is configured

  **Why This Order**:
  1. Create the file first — establishes the artifact that git will track
  2. Git operations second — stages and commits the created file
  3. Push last — completes the workflow and publishes changes to remote origin

  This sequence ensures the file exists, is valid, and is committed before attempting to push to the remote repository.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Encoding mismatch (BOM included) | Low | File might not pass specification validation | Use pathlib.write_text(encoding='utf-8') which Python's utf-8 codec ensures no BOM; verify with `file -b test-yoduvz.md` command |
  | Line ending inconsistency (CRLF instead of LF) | Low | File might not pass specification validation | Python's text mode on Unix preserves LF natively; verify with `od -c test-yoduvz.md` shows Unix newlines |
  | Git user not configured | Low | Commit fails with "Please tell me who you are" error | Repository assumes git user.name and user.email already configured (standard setup in this environment) |
  | Feature branch doesn't exist | Very Low | git push fails | Feature branch pre-created as `feat/251-markdown-file-creation-8e107d` per git status at session start |
  | File already exists | Very Low | Content gets overwritten silently | Specification requires creating new file; directory is clean per git status; no risk of data loss |
  | Prose quality issues | Low | File might not meet FR-5 requirement (grammatical correctness) | Implementer manually reviews prose during creation; standard practice across 181+ precedent files |
  | File size out of range | Low | File doesn't meet NFR-3 requirement (400-600 bytes) | File size naturally results from proper structure (heading ~20-30 bytes + 2-3 sentences ~350-550 bytes); no artificial constraints needed |

  ## Files & Scope

  **Files to Create**:
  - test-yoduvz.md (markdown file with prose content)

  **Files to Modify**:
  - None (no source code changes)

  **Files NOT Touched**:
  - /src/sheep/* (application code untouched)
  - tests/* (test suite untouched)
  - pyproject.toml (dependencies untouched)
  - .github/* (CI configuration untouched)
  - Configuration files (untouched)

  This is a minimal, focused feature that creates a single artifact and commits it to git without touching any application code or infrastructure.

  ## Implementation Summary

  The core implementation is simple and uses standard library functions:

  ```python
  from pathlib import Path
  import subprocess

  # 1. Create markdown content with heading and prose
  content = "# [Topic]\n\n[Sentence 1]. [Sentence 2]. [Sentence 3]."

  # 2. Write file with pathlib (ensures UTF-8 without BOM, LF line endings)
  Path("test-yoduvz.md").write_text(content, encoding='utf-8')

  # 3. Stage in git
  subprocess.run(["git", "add", "test-yoduvz.md"], check=True)

  # 4. Commit with conventional message
  subprocess.run([
      "git", "commit", "-m",
      "feat(251): create markdown file test-yoduvz.md with prose content"
  ], check=True)

  # 5. Push to feature branch
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  Total code: ~15 lines (including comments), uses only standard library, no external dependencies.

