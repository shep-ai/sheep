content: |
  ## Architecture Overview

  Feature 195 follows the well-established pattern from features 150-194 (195+ test files already in repository).
  The implementation integrates with existing Sheep platform components:

  - **Claude API Integration:** Uses existing `content_generators.generate_markdown_content()` or direct Claude API
    via CrewAI LLM framework. Generates title and prose content in single API call for efficiency and semantic coherence.

  - **File I/O:** Uses Python `pathlib.Path.write_text()` with UTF-8 encoding and explicit LF line endings.
    Cross-platform, idiomatic modern Python, no external dependencies.

  - **Validation:** Uses `content_generators.validate_markdown_file()` or custom validation logic. Checks encoding,
    line endings, markdown structure (H1 heading), sentence count (exactly 2-3), and file size (250-600 bytes).

  - **Git Operations:** Uses subprocess with list-format arguments (secure, standard library). Three operations:
    `git add`, `git commit`, `git push`.

  The feature creates a single markdown file at repository root with:
  ```markdown
  # Title Text

  This is the first sentence. This is the second sentence. This is the third sentence.
  ```

  This structure matches all 195+ existing test files, ensuring output is "indistinguishable from existing files."

  ## Key Design Decisions

  ### 1. Content Generation via Claude API

  **Decision:** Use Claude API (via CrewAI LLM framework or direct API call) for prose generation.

  **Alternatives Considered:**
  - Deterministic templates: Would produce generic, identical output. Violates spec requirement for "meaningful and coherent" prose.
  - Hardcoded content: Zero reusability, least flexible option.

  **Rationale:** Claude API aligns with existing Sheep infrastructure (`content_generators.generate_markdown_content()` already
  implemented). Produces meaningful, coherent prose matching quality of 195+ existing test files. Minimal implementation risk
  by reusing existing infrastructure. Single coordinated API call ensures semantic coherence between title and content.

  ### 2. File Writing with Correct Encoding & Line Endings

  **Decision:** Use `pathlib.Path.write_text()` with `encoding="utf-8"` and `newline="\n"`.

  **Alternatives Considered:**
  - `os.open()` with manual binary writes: Lower-level, more error-prone, lacks pathlib abstractions.
  - External file I/O libraries: Violates spec requirement for Python standard library only.

  **Rationale:** pathlib is idiomatic modern Python (standard library). The `write_text()` method with `encoding='utf-8'`
  ensures UTF-8 encoding without BOM. Parameter `newline='\n'` prevents platform-specific conversion, guaranteeing Unix LF
  line endings across all platforms. Consistent with features 150-194. No external dependencies.

  ### 3. Comprehensive Validation Before Git Operations

  **Decision:** Validate file completely before committing. Checks: UTF-8 encoding, Unix LF line endings, H1 heading,
  exactly 2-3 sentences, file size 250-600 bytes, trailing newline.

  **Alternatives Considered:**
  - Basic validation (file exists): Insufficient, allows broken content to commit.
  - No validation (trust code): Too risky, violates spec requirements.

  **Rationale:** Spec explicitly requires comprehensive validation. Aligns with quality standards of features 150-194.
  Prevents malformed files from entering git history. Adds minimal time overhead (2-3 minutes per spec) with significant
  quality benefit. Existing `content_generators.validate_markdown_file()` or custom validation can be implemented simply.

  ### 4. Git Integration via subprocess

  **Decision:** Use Python `subprocess` module with list-format arguments for git commands (`add`, `commit`, `push`).

  **Alternatives Considered:**
  - GitPython library: Adds external dependency, violates spec requirement for standard library only.
  - Shell invocation with `shell=True`: Security risk for command injection, less portable.

  **Rationale:** subprocess is Python standard library and meets spec requirements. List-format arguments prevent command
  injection. Feature 193 and other implementations use this pattern successfully. Simple git operations don't require
  GitPython's object-oriented layer.

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Content Generation) comes first** because all subsequent phases depend on the prose content.
     Cannot write a file without knowing what content to write. This phase generates the title and sentences.

  2. **Phase 2 (File Creation & Validation) comes second** because validation must run before any git operations.
     The file is written to disk and thoroughly validated to catch any issues before committing.

  3. **Phase 3 (Git Integration & Push) comes last** because git operations are point-of-no-return.
     All quality checks must pass before staging the file. This ensures only valid files enter git history.

  This waterfall approach matches features 150-194 and ensures quality gates prevent broken files from propagating.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Claude API call fails or times out | Content generation blocked, feature incomplete | Implement retry logic (3 attempts with exponential backoff); clear error messages; document API quota requirements |
  | File encoding issues (CRLF on Windows, missing UTF-8 BOM) | Validation fails, git commit blocked | Explicit `newline="\n"` parameter in pathlib.write_text() ensures LF; UTF-8 encoding without BOM validated |
  | Markdown validation too strict (rejects valid content) | Feature fails unnecessarily | Test validation logic against 195+ existing test files; ensure it accepts all precedent examples |
  | Git operations fail (permission denied, remote unreachable) | Feature incomplete, manual intervention required | Check git config (user.name/email) before commit; validate remote exists before push; clear error messages |
  | File already exists (leftover from previous run) | Overwrite risk, data loss | Check file does not exist before writing; fail with clear error if file exists |
  | Sentence count detection fails (false positives) | Validation rejects valid content | Use regex pattern validated against 195+ existing files; handle abbreviations, ellipsis, special punctuation |
