content: |
  ## Summary

  Feature 195 creates a single test markdown file `test-2xz0x5.md` at repository root following the pattern
  established in features 150-194.

  **Task Flow:**

  1. **Task 1: Generate Content** — Call Claude API to generate a meaningful title and 2-3 sentences of prose.
     The prose is thematically related to the title, producing a coherent, professional output.

  2. **Task 2: Write File** — Write the generated content to `test-2xz0x5.md` using pathlib with UTF-8 encoding
     and explicit Unix LF line endings. This ensures the file is created correctly on all platforms.

  3. **Task 3: Validate** — Comprehensively validate the file (markdown structure, encoding, line endings, content).
     This validation must pass before git operations begin. Prevents broken files from entering history.

  4. **Task 4: Git Integration** — Stage the file, commit with conventional commit message, and push to remote.
     This completes the feature and makes it visible in the repository.

  All four tasks follow RED-GREEN-REFACTOR TDD cycles. Task dependencies are sequential (each task depends on
  previous one), ensuring content → file → validation → git operations flow.

  **Total Estimated Effort:** 15 minutes of implementation work (5 min generation, 2 min file I/O, 3 min validation, 5 min git).
