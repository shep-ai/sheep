# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-2xz0x5.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-194,
  with 195+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-2xz0x5.md` exists in the repository root directory (same directory as .git and src/)
  - [ ] File contains an H1 markdown heading as the first line (format: `# Title Text`)
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line following the heading
  - [ ] Prose content is meaningful and coherent (not placeholder or dummy text)
  - [ ] Title is thematically related to the prose content
  - [ ] File is encoded in UTF-8 text format
  - [ ] File uses Unix line endings (LF character, not CRLF)
  - [ ] File follows CommonMark markdown specification syntax
  - [ ] File is staged with `git add test-2xz0x5.md` (visible in `git status`)
  - [ ] File is committed with conventional commit message: `feat(195): Create markdown file test-2xz0x5.md with title and prose content`
  - [ ] Commit is pushed to feature branch `feat/195-markdown-prose-file` on origin
  - [ ] File size is between 250-600 bytes (typical for this pattern)
  - [ ] All 195+ existing test markdown files remain unmodified
  - [ ] No source code, configuration files, or other project files are modified

  ## Functional Requirements

  - **FR-1**: Create a markdown file with filename exactly matching `test-2xz0x5.md`
  - **FR-2**: Write an H1 markdown heading as the first line of content (format: `# <Title>`)
  - **FR-3**: Write exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-4**: Ensure prose content is meaningful, coherent, and thematically related to the title
  - **FR-5**: Write file to repository root directory (same directory level as .git, src/, specs/)
  - **FR-6**: Encode file as UTF-8 with Unix line endings (LF only, no CRLF)
  - **FR-7**: Stage the file with `git add test-2xz0x5.md`
  - **FR-8**: Create a commit with message format: `feat(195): Create markdown file test-2xz0x5.md with title and prose content`
  - **FR-9**: Push the commit to the feature branch `feat/195-markdown-prose-file` on origin
  - **FR-10**: Validate file content after creation: confirm markdown syntax, sentence count, encoding, and line endings before commit

  ## Non-Functional Requirements

  - **NFR-1**: Implementation should complete in approximately 10-15 minutes (size estimate: S)
  - **NFR-2**: File creation and git operations should use only Python standard library (pathlib) and standard git commands (no external package dependencies)
  - **NFR-3**: Output must conform to CommonMark markdown specification (https://spec.commonmark.org/)
  - **NFR-4**: Commit message must follow Conventional Commits specification (https://www.conventionalcommits.org/)
  - **NFR-5**: Implementation must follow the established pattern from features 150-194 for consistency and quality
  - **NFR-6**: No existing files, source code, or configuration should be modified — only create the new markdown file
  - **NFR-7**: Output file should be indistinguishable from the 195+ existing test markdown files in terms of structure, quality, and professionalism

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose content be AI-generated and meaningful, or use a template? | AI-generated meaningful prose | Demonstrates system flexibility and capability, aligns with precedent examples (test-9zebfj.md), still simple to implement |
  | 2 | Should the title and prose content be thematically related? | Yes, related title and content | All precedent examples show coherent relationships; improves output quality and matches established pattern |
  | 3 | What level of output validation should be performed? | Comprehensive validation | Aligns with quality standards of features 150-194; ensures all requirements met before commit; adds minimal time overhead |

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Organization:**
  - Repository root contains 195+ test markdown files following pattern `test-*.md`
  - Examples: `test-9zebfj.md`, `test-yqu2yr.md`, `test-xgtwtq.md`, `test-2xz0x5.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `Dockerfile`

  **Spec Directory Structure:**
  - `specs/` contains 195+ feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name/spec.yaml`
  - Example: `specs/194-markdown-prose-file/spec.yaml`
  - This spec is located at: `specs/195-markdown-prose-file/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions for Research, Implementation, Review
  - `src/sheep/flows/` contains flow orchestration (code_implementation.py)
  - `src/sheep/config/` contains configuration management (settings.py, llm.py)
  - `src/sheep/tools/` contains Git and file operation tools
  - `src/sheep/cli.py` contains CLI entry point

  ### Architecture Patterns

  **Test File Format (195+ precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of prose content
    - File size: typically 300-600 bytes
  - Example from `test-9zebfj.md`:
    ```markdown
    # The Power of Curiosity

    Curiosity is the fundamental drive that propels human progress and discovery across all fields
    of knowledge. It encourages us to question assumptions, explore new ideas, and seek deeper
    understanding of the world around us. By cultivating curiosity, we unlock our potential for
    innovation and meaningful growth.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-2xz0x5.md`
  - Naming is fixed by user specification (not variable)

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with title and prose content`
  - Changes are pushed to feature branch `feat/###-markdown-prose-file`
  - Pattern observed from commits 190-194

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default)

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/195-markdown-prose-file`
  - No specialized git libraries required; can use subprocess or GitPython

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 195+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-194; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/195-markdown-prose-file` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 195+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-194) demonstrate successful execution of identical pattern
  - Recent commits (190-194) show exact templates and working examples
  - README.md documents Sheep platform architecture and capabilities

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **Content generation**: ~3-5 minutes (generate topic, title, and 2-3 sentences of prose)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, file size)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 195+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (190-194) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity

  ---

  _Requirements phase complete — ready for implementation_
