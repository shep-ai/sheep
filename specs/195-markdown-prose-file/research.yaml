# Structured technology decisions
decisions:
  - title: "Prose Content Generation Strategy"
    chosen: "Claude API (via CrewAI LLM framework)"
    rejected:
      - "Deterministic template with variable insertion — would produce generic, identical output for all files. Contradicts spec requirement for \"meaningful and coherent\" prose. Previous features (192-194) demonstrate AI-generated content works reliably and produces higher-quality output. Maintenance burden of managing topic templates."
      - "Hardcoded content specific to this feature — least flexible, zero reusability for feature 196+. Contradicts specification recommendation for AI-generated meaningful prose. Would require manual content creation for each feature."
    rationale: >
      Claude API is the optimal choice because it aligns with existing Sheep platform
      infrastructure (codebase already implements content_generators.generate_markdown_content()
      using get_reasoning_llm()). This approach produces meaningful, coherent prose with
      related titles and content as required by the spec. The generated content quality
      matches the 195+ existing test files. Leveraging existing infrastructure minimizes
      implementation risk and complexity.

  - title: "File Writing and Encoding Implementation"
    chosen: "Python pathlib.Path.write_text() with UTF-8 encoding and newline='\\n'"
    rejected:
      - "os.open() with manual binary writes — lower-level approach adds complexity without benefit. More error-prone for encoding/line-ending handling. pathlib provides cross-platform abstractions that os.open() lacks. Would require explicit BOM handling and newline conversion."
      - "External file I/O library — violates spec requirement for Python standard library only. Adds unnecessary dependency. pathlib is sufficient for this simple use case."
    rationale: >
      pathlib is the idiomatic, modern Python approach (standard library since 3.4).
      The write_text() method with encoding='utf-8' ensures UTF-8 encoding. The newline='\\n'
      parameter prevents platform-specific line ending conversion (critical for Unix LF guarantee).
      This pattern is used consistently in features 150-194 and the content_generators module.
      Cross-platform, handles encoding correctly, no external dependencies required.

  - title: "Line Ending Normalization"
    chosen: "Text mode with newline='\\n' parameter in write_text() and open()"
    rejected:
      - "Binary mode with explicit bytes (b'\\n') — more verbose and lower-level than necessary. Requires manual encoding to bytes. Text mode with newline parameter is cleaner and equally reliable. Python standard library explicitly documents that newline='' preserves line endings."
      - "os.linesep constant — platform-dependent, would produce CRLF on Windows. Violates requirement for Unix LF. Current codebase uses explicit newline='\\n', not os.linesep."
    rationale: >
      Per Python documentation, newline='\\n' in text mode ensures LF line endings are
      preserved without conversion. This guarantees Unix line ending requirement across
      all platforms. Simpler than binary mode. Existing codebase (content_generators.py)
      uses write_text() without explicit newline parameter but file writing does enforce
      LF in subsequent validation. Text mode with newline='\\n' is the explicit, correct approach.

  - title: "Validation Strategy"
    chosen: "Comprehensive validation before git operations (encoding, structure, line endings, file size)"
    rejected:
      - "Basic validation (file exists and is readable) — insufficient to catch errors before committing. Violates spec requirement for \"comprehensive validation\". Inconsistent with quality standards of features 150-194. Could allow malformed content to enter git history."
      - "No validation (trust code works) — too risky for file creation. No safety net for edge cases. Spec explicitly requires validation of markdown syntax, sentence count, encoding, and line endings."
    rationale: >
      Comprehensive validation aligns with spec requirements and quality standards
      established in features 150-194. The content_generators module implements
      validate_markdown_file() with checks for: UTF-8 encoding (no BOM), Unix LF line endings,
      H1 heading structure, 2-3 sentence count, and trailing newline. Running all validations
      before git operations ensures quality and prevents broken files from entering history.
      Adds minimal time overhead (2-3 minutes per spec estimate) with significant quality benefit.

  - title: "Git Integration Approach"
    chosen: "subprocess module for git commands (git add, git commit, git push)"
    rejected:
      - "GitPython library — adds external dependency. Spec explicitly requires Python standard library only. subprocess is sufficient for simple git operations. GitPython provides object-oriented abstractions not needed for three basic commands."
      - "Direct shell invocation (shell=True) — security risk for command injection. Less portable than subprocess list format. Current codebase uses subprocess with list arguments for safety."
    rationale: >
      subprocess is part of Python standard library and meets spec requirements.
      Using subprocess with list-format arguments (not shell=True) is secure and prevents
      command injection. Existing implementation in feature_193 and other features uses
      subprocess.run() with list arguments. Pattern is well-established and reliable.
      Simple git operations (add, commit, push) don't require GitPython's abstraction layer.

  - title: "Markdown Content Structure"
    chosen: "H1 heading, blank line, exactly 2-3 sentences of prose (matching precedent examples)"
    rejected:
      - "H2 heading instead of H1 — violates explicit requirement (FR-2) for H1 markdown heading. All precedent files use H1. Less prominent in markdown hierarchy."
      - "No blank line separator — reduces readability and violates structure of all 195+ existing test files. Makes markdown semantically different from precedent examples."
      - "4+ sentences or variable sentence count — violates spec requirement for exactly 2-3 sentences. All precedent examples use 3 sentences consistently. More complex to validate and maintain."
    rationale: >
      H1 heading with blank line separator and 2-3 sentences matches all 195+ existing
      test files (e.g., test-9zebfj.md, test-xgtwtq.md). This consistency is critical
      for the \"indistinguishable from existing files\" requirement. The structure is
      simple to validate, parse, and maintain. Aligns with spec and precedent pattern.

  - title: "Error Handling and Recovery"
    chosen: "Fail-fast with clear error messages; no recovery attempts or partial commits"
    rejected:
      - "Retry logic for transient failures — adds complexity without clear benefit for local file operations. File I/O rarely fails transiently. Git push might fail but retry logic doesn't improve reliability. Better to surface error and let operator retry if needed."
      - "Partial commit strategy (commit file even if validation fails) — violates data integrity. Broken files in git history create technical debt. Spec requires all validations pass before commit."
    rationale: >
      Fail-fast approach ensures integrity: validation completes fully before any git
      operations begin. If validation fails, file is not committed, preventing broken
      state. Feature 193 and existing implementations follow this pattern. Clear error
      messages (via logging and exceptions) help operators diagnose issues quickly.
      Simpler than retry logic and more reliable.

