# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-24
  - **Author:** Technical Architect

  ## Technology Decisions

  ### 1. Prose Content Generation

  **Chosen:** Claude API via CrewAI LLM framework

  **Rejected:**
  - Deterministic templates — would produce generic, identical output. Contradicts spec requirement for meaningful content. Existing features demonstrate AI generation works reliably.
  - Hardcoded content — least flexible, zero reusability for feature 196+. Contradicts spec recommendation for AI-generated prose.

  **Rationale:** Claude API aligns with existing Sheep platform infrastructure (content_generators.generate_markdown_content() already implemented). Produces meaningful, coherent prose with related titles as required. Matches quality of 195+ existing test files. Minimal implementation risk by reusing existing infrastructure.

  ### 2. File Writing and Encoding

  **Chosen:** Python pathlib.Path.write_text() with encoding="utf-8" and newline="\n"

  **Rejected:**
  - os.open() with manual binary writes — adds complexity without benefit, more error-prone, lacks pathlib abstractions.
  - External file I/O library — violates spec requirement for Python standard library only.

  **Rationale:** pathlib is idiomatic modern Python (standard library). The write_text() method with encoding='utf-8' ensures UTF-8 encoding. Parameter newline='\n' prevents platform-specific conversion, guaranteeing Unix LF. Consistent with features 150-194 pattern. No external dependencies.

  ### 3. Line Ending Normalization

  **Chosen:** Text mode with newline="\n" parameter

  **Rejected:**
  - Binary mode with explicit bytes — more verbose, lower-level than necessary, requires manual byte encoding.
  - os.linesep constant — platform-dependent, produces CRLF on Windows, violates Unix LF requirement.

  **Rationale:** Python documentation confirms newline="\n" in text mode preserves LF without conversion. Guarantees Unix line endings across platforms. Simpler than binary mode. Existing codebase uses this approach (write_text defaults to respecting line endings set via newline parameter).

  ### 4. Validation Strategy

  **Chosen:** Comprehensive validation before git operations

  Validation checks:
  - UTF-8 encoding without BOM (byte order mark)
  - Unix LF line endings (no CRLF)
  - H1 heading at start of file
  - Exactly 2-3 sentences in prose content
  - Trailing newline present
  - File size 250-600 bytes (typical for this pattern)

  **Rejected:**
  - Basic validation (file exists) — insufficient, allows broken content to commit.
  - No validation — too risky for file creation, violates spec requirements.

  **Rationale:** Spec requires comprehensive validation. Aligns with quality standards of features 150-194. content_generators.validate_markdown_file() implements these checks. Running validation before git operations ensures quality and prevents malformed files from entering history. Adds minimal time overhead with significant quality benefit (2-3 minutes per spec estimate).

  ### 5. Git Integration

  **Chosen:** subprocess module with list-format arguments

  Git operations:
  - `git add test-2xz0x5.md`
  - `git commit -m "feat(195): Create markdown file test-2xz0x5.md with title and prose content"`
  - `git push -u origin HEAD`

  **Rejected:**
  - GitPython library — adds external dependency, violates spec requirement for standard library only.
  - Direct shell invocation (shell=True) — security risk for command injection, less portable.

  **Rationale:** subprocess is Python standard library and meets spec requirements. List-format arguments prevent command injection. Feature 193 and other implementations use this pattern successfully. Simple git operations (add, commit, push) don't require GitPython's object-oriented layer. Well-established, reliable pattern in codebase.

  ### 6. Markdown Structure

  **Chosen:** H1 heading + blank line + exactly 2-3 sentences

  Example structure:
  ```markdown
  # Title Text

  This is the first sentence. This is the second sentence. This is the third sentence.
  ```

  **Rejected:**
  - H2 heading instead of H1 — violates explicit FR-2 requirement, differs from all precedent files.
  - No blank line separator — reduces readability, differs from all 195+ existing files.
  - 4+ sentences or variable count — violates spec requirement for exactly 2-3 sentences.

  **Rationale:** Exact match to all 195+ existing test files (e.g., test-9zebfj.md, test-xgtwtq.md) ensures output is "indistinguishable from existing files" (spec requirement). H1 heading is explicit spec requirement. Blank line separator is standard markdown convention and present in all precedents. 2-3 sentence count is validated consistently across codebase.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O, path handling | **Use** | Python standard library, idiomatic, cross-platform, no external dependencies |
  | subprocess | Git command execution | **Use** | Python standard library, secure with list arguments, established pattern in codebase |
  | Claude API | Content generation | **Use** | Already integrated via CrewAI in content_generators module, produces quality output |
  | re (regex) | Sentence/structure validation | **Use** | Python standard library, useful for pattern matching and validation |
  | os | System operations | **Limited use** | Use pathlib for file operations; use for environment/platform detection only |
  | GitPython | Advanced git operations | **Reject** | External dependency; subprocess sufficient for simple add/commit/push operations |
  | External markdown libraries | Markdown parsing | **Reject** | CommonMark is simple; no parsing library needed for generation or basic validation |

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** Verify filename matches pattern `test-[a-z0-9]{6}.md` to prevent directory traversal or unexpected file names
  - **API response validation:** Ensure Claude API response conforms to markdown format before writing to disk
  - **Path safety:** Use pathlib (prevents directory traversal) and validate filename has no path separators

  ### Output Safety
  - **Encoding guarantee:** UTF-8 encoding ensures no null bytes or binary content injected
  - **Line ending control:** Explicit LF-only line endings prevent platform-specific issues
  - **No shell execution:** subprocess list format prevents command injection

  ### File System Safety
  - **Exclusive creation:** Check file does not exist before writing (prevents overwriting)
  - **Atomic writes:** pathlib.write_text() is atomic on most systems
  - **Permissions:** File created with default umask (typically readable by user, potentially group/world depending on system)

  ## Performance Implications

  ### File Creation
  - File write: ~1-2 ms (small file, ~350-550 bytes)
  - Encoding: Included in write operation, negligible overhead
  - No performance bottleneck

  ### Validation
  - Binary read: ~0.5 ms for 350-550 byte file
  - Text validation (sentence counting, regex): ~1 ms
  - Total validation: ~3-5 ms
  - Negligible overhead, well worth the quality assurance

  ### API Calls
  - Claude API call: ~2-5 seconds (dominant time factor)
  - Includes network latency, model inference
  - Per spec estimate: 3-5 minutes for content generation phase

  ### Git Operations
  - git add: ~5-50 ms (local file system operation)
  - git commit: ~10-100 ms (local operation, no network)
  - git push: ~1-5 seconds (network bound, uploads to remote)
  - Total git time: ~2-5 minutes per spec estimate

  ### Overall Performance
  - Feature 195 follows identical pattern to 150-194
  - Expected execution time: 10-15 minutes (per spec estimate)
  - Dominant factors: Claude API call (~2-5s), git push (~1-5s)
  - File operations and validation: <50 ms, negligible
  - Bottleneck: Claude API and network operations (not within codebase control)

  ## Architecture Notes

  ### Integration Points
  - **content_generators module:** Use `generate_markdown_content()` for prose generation
  - **Validation functions:** Use `validate_markdown_file()` for comprehensive validation
  - **Git tools:** Use subprocess (standard library) or GitCommitTool/GitPushTool from existing tools
  - **Logging:** Use sheep.observability.logging.get_logger() for observability

  ### Consistency with Existing Pattern
  - Feature 193 (most recent) provides exact template for implementation
  - File structure, validation logic, git workflow all proven in production
  - 195+ test files demonstrate reliability of the approach
  - No architectural changes needed; feature fits existing pattern perfectly

  ### Codebase Patterns
  - **Content generation:** content_generators.generate_markdown_content() — established, tested
  - **File validation:** content_generators.validate_markdown_file() — comprehensive, proven
  - **Git integration:** subprocess with list arguments — secure, standard
  - **Error handling:** Fail-fast with clear messages — consistent with features 150-194

  ## Implementation Recommendation

  **Approach: Follow the Feature 193 template exactly**

  The implementation pattern from feature 193 (feature_193_markdown_file_creation.py) should be adapted for feature 195 with these changes:
  - Update FILENAME to "test-2xz0x5.md"
  - Update TITLE, PROSE, and commit message with new content
  - All validation functions, git operations, and structure remain identical

  Alternatively, implement using content_generators module for even cleaner integration:
  - Call `generate_markdown_content()` to generate prose
  - Call `write_markdown_file("test-2xz0x5.md")` to write file
  - Call `validate_markdown_file()` to validate
  - Use subprocess or git tools for add/commit/push

  Both approaches are valid; choice depends on whether integration with content_generators module is preferred (cleaner) or direct implementation like feature 193 (more explicit).

  ---

  **Research Phase Complete — Ready for Implementation**

  All technical decisions documented with clear rationale. Infrastructure exists in codebase
  to support implementation. Pattern established in features 150-194 is proven and reliable.
  Feature 195 will follow identical approach with high confidence of success.
