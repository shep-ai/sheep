content: |
  ## Architecture Overview

  This feature follows the minimal-impact pattern established by features 063-083. The implementation:

  - **Creates a single markdown file** at the repository root (test-cldw5t.md)
  - **Does not modify source code**, tests, or configuration
  - **Uses no external dependencies** beyond Python standard library
  - **Follows standard git workflow** for version control

  The feature integrates seamlessly into the existing codebase by:
  1. Replicating the proven markdown file structure from 65+ existing test files
  2. Using established file naming pattern (test-*.md)
  3. Following the conventional commit format used in recent features
  4. Operating entirely within the pre-created feature branch

  The implementation is completely isolated—it does not touch /src/sheep/, tests, configuration, or any other source code.
  File creation uses only Python standard library (pathlib) and standard git CLI commands.

  ## Key Design Decisions

  ### 1. File Creation with Python pathlib

  **Decision:** Use `pathlib.Path.write_text(content, encoding="utf-8")`

  **Rationale:** pathlib (PEP 428) is the modern Python standard library approach for file I/O. It:
  - Provides automatic UTF-8 encoding handling (explicitly specified)
  - Eliminates manual newline/encoding complexity
  - Requires zero external dependencies
  - Matches the established pattern from 65+ existing test files
  - Is explicitly listed in the feature spec as the technology to use

  **Alternatives Considered:**
  - Python open() built-in: older approach, requires manual encoding/newline handling, more boilerplate
  - File system abstraction layers: adds unnecessary complexity and external dependencies

  ### 2. Prose Content Generation

  **Decision:** Hardcoded generic/universal topic with fixed prose

  **Rationale:** The feature spec explicitly resolves topic selection to generic/universal topics. Hardcoded content:
  - Eliminates external dependencies (no LLM calls, no randomization)
  - Ensures consistency with 65+ existing test files using hardcoded diverse topics
  - Matches the implementation pattern from features 063-083
  - Provides full control over content quality and coherence
  - Allows free selection of any accessible, universally-understood topic

  **Topic Selection:** Implementation can select from universal concepts such as:
  - Natural phenomena (seasons, weather, ecosystems, water cycle)
  - Human concepts (learning, creativity, resilience, patience)
  - Decision-making (problem-solving, critical thinking, planning)
  - Daily life (habit formation, time management, communication)

  **Alternatives Considered:**
  - Dynamic topic selection via LLM: introduces external dependency, unpredictability, complexity
  - Random topic from list: adds unnecessary complexity for single-file feature

  ### 3. Git Integration with Standard CLI

  **Decision:** Use standard git CLI commands: `git add`, `git commit`, `git push`

  **Rationale:**
  - Proven pattern from features 063-083 (all implemented with CLI commands)
  - Zero external dependencies (git is already required)
  - Full compatibility with git ecosystem and repository semantics
  - Clear, straightforward commands for simple workflow
  - Maintains consistency with project's git workflow patterns

  **Commit Format:** Conventional commit per spec:
  ```
  feat(084): create markdown file test-cldw5t.md with prose content
  ```

  **Alternatives Considered:**
  - GitPython library: adds external dependency for simple operations, unnecessary overhead
  - Direct git binary manipulation: bypasses version control semantics, introduces fragility

  ### 4. Encoding and Line Endings

  **Decision:** UTF-8 without BOM, Unix-style LF line endings (\n)

  **Rationale:** Explicitly required by feature spec non-functional requirements (NFR-1, NFR-2):
  - UTF-8 without BOM is the secure, standard default for text files
  - LF line endings ensure cross-platform consistency (all existing test files use LF)
  - pathlib.write_text() uses UTF-8 by default
  - Explicit '\n' in prose string ensures LF on all platforms
  - Matches encoding/line endings of all 65+ existing test files

  **Verification:** File command should report "ASCII text" with no BOM indicator

  **Alternatives Considered:**
  - Platform-dependent line endings (CRLF): violates NFR-2, breaks consistency
  - UTF-8 with BOM: adds 3-byte overhead, violates NFR-1, unnecessary

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**

  The implementation creates the markdown file with content meeting all functional requirements:
  - One H1 markdown heading as title
  - 2-3 sentences of grammatically correct prose
  - Blank line between heading and prose
  - UTF-8 encoding (no BOM)
  - Unix-style LF line endings
  - File size within 400-600 byte range

  The validation step verifies all success criteria before proceeding to git integration.

  **Phase 2: Git Integration**

  After file creation and validation, the implementation:
  1. Stages the file with `git add test-cldw5t.md`
  2. Creates a conventional commit with the required message
  3. Pushes to the feature branch with `git push`

  **Why This Order:** File creation and validation must complete before git operations to ensure the file meets all requirements before committing.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (BOM, CRLF) | Use pathlib.write_text() with explicit UTF-8; use '\n' for line endings; validate with file command |
  | File size out of range | Use clear prose structure: heading + blank line + 2-3 sentences; validate size before commit |
  | Git push fails (credentials, branch) | Feature branch pre-created; verify git configuration (user.name, user.email); retry push with verbose output |
  | Prose content quality | Use grammatically correct, naturally readable prose; follow established pattern from 65+ test files |
  | Typos or format errors | Use clear template structure; verify file with cat command before git operations |
