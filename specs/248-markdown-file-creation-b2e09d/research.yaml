decisions:
  - title: "File I/O Implementation Method"
    chosen: "pathlib.Path.write_text() with explicit UTF-8 encoding"
    rejected:
      - "Built-in open() function — verbose boilerplate for encoding/newline handling, requires manual mode and encoding parameters, less idiomatic for Python 3.11+"
      - "External file I/O libraries (e.g., pathspec, fileinput) — unnecessary external dependencies for a single file operation, adds complexity without benefit"
    rationale: >
      pathlib.Path.write_text() is the idiomatic Python 3.11+ approach for simple file writing.
      It provides a clean, single-method API that handles encoding, file creation, and safe file
      closing automatically. The method signature write_text(data, encoding='utf-8', errors='strict',
      newline=None) allows explicit control over encoding and newline handling required by the
      spec. It's part of Python's standard library (no external dependencies) and is the pattern
      used in modern Python code. The codebase requires Python 3.11+, making pathlib the natural choice.

  - title: "Encoding Enforcement (UTF-8 without BOM)"
    chosen: "Use encoding='utf-8' parameter in write_text(); verify no BOM in validation step"
    rejected:
      - "Use encoding='utf-8-sig' — this automatically adds BOM, violating NFR-1 requirement for no BOM"
      - "Use locale-based encoding — risks platform-specific divergence (UTF-16 on Windows, UTF-8 on Linux), creates CRLF/encoding inconsistencies"
    rationale: >
      The spec explicitly requires UTF-8 encoding without BOM (NFR-1). Using encoding='utf-8'
      (not 'utf-8-sig') ensures no BOM is added. Python's 'utf-8' codec writes pure UTF-8 bytes
      without a BOM prefix. Validation post-write should verify the first three bytes are not the
      UTF-8 BOM sequence (EF BB BF in hex). This approach maintains consistency with 250+ existing
      test files and prevents encoding divergence across platforms.

  - title: "Line Ending Enforcement (LF only, not CRLF)"
    chosen: "Use newline='\\n' parameter in write_text() to force Unix LF line endings"
    rejected:
      - "Use platform default newlines — results in CRLF on Windows, LF on Linux/Mac; creates inconsistent version control diffs and violates NFR-2"
      - "Manual post-write line ending replacement — adds complexity, risk of double-replacement if prose already contains LF"
    rationale: >
      Python's pathlib.write_text() with newline parameter controls line ending behavior. Setting
      newline='\\n' ensures that all '\\n' characters in the content are written as Unix LF (U+000A),
      not converted to platform-specific CRLF. This is documented in PEP 3116 and enforces the
      NFR-2 requirement for LF-only line endings. The newline parameter operates at the text layer,
      so it's the cleanest, most reliable way to enforce universal LF across all platforms.

  - title: "Validation Strategy"
    chosen: "Basic post-write structural validation: file exists, size bounds, H1 count, sentence count, encoding/BOM verification"
    rejected:
      - "No validation — risks committing files with missing heading, wrong encoding, or malformed structure; defeats purpose of automated validation"
      - "Comprehensive validation with grammar/readability checks — over-engineering for a test artifact, adds 5-10 min overhead per file, requires NLP library dependency"
    rationale: >
      The spec resolves to \"Basic structural validation\" in the requirements (open question 2).
      This means: (1) file exists after write, (2) file size is within 300-800 byte range, (3) exactly
      one H1 heading (regex: '^# [^#]'), (4) contains 2-3 sentences (simple sentence-split heuristic),
      (5) first 3 bytes are not UTF-8 BOM, (6) no CRLF line endings. These checks are lightweight
      (~50 lines of Python), catch real errors without over-engineering, and align with the
      established pattern that prioritizes safety over complexity.

  - title: "Prose Content Generation"
    chosen: "Manual prose writing (human-authored, coherent, substantive)"
    rejected:
      - "Programmatic generation with templates/random text — produces generic placeholder prose that doesn't match the human-authored quality of existing 250+ test files, risks incoherent/gibberish output"
      - "Copy/paste from existing test files — violates uniqueness and defeats purpose of creating distinct content"
    rationale: >
      The spec resolves to \"Manual writing\" in requirements (open question 3). This ensures prose
      content is substantive and coherent (FR-5), matches the human-authored quality of existing
      test files, and maintains narrative coherence. While this adds ~2-3 minutes per file compared
      to templates, it's necessary to maintain pattern fidelity and prevent gibberish. The codebase
      has 250+ examples of well-written, diverse prose; manual writing ensures parity with this
      established standard.

  - title: "Git Integration Approach"
    chosen: "Use subprocess.run() to invoke git CLI commands (stage, commit, push)"
    rejected:
      - "GitPython library — adds external dependency (not in pyproject.toml), requires installation and maintenance, unnecessary for simple CLI operations"
      - "Manual git operations via os.system() — shell injection risks, no error handling, less portable"
    rationale: >
      The feature requires git operations: git add, git commit, git push. Using subprocess.run()
      with a list of arguments (not shell=True) is the safe, standard Python approach. It's
      available in Python 3.11+ standard library, avoids external dependencies, and provides
      proper error handling via return codes and exceptions. Each operation is straightforward
      enough that a full git library isn't justified. The feature branch is pre-created, so no
      branch creation logic is needed — only stage, commit (with conventional message), and push.

