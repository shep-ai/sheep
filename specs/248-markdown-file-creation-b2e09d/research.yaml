content: |
  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF newline parameter

  **Rejected:**
  - Built-in `open()` function — verbose, requires manual mode and encoding parameters, less idiomatic for Python 3.11+
  - External file I/O libraries — unnecessary external dependencies for a single file write operation

  **Rationale:** pathlib is the modern, idiomatic Python approach. The `write_text(data, encoding='utf-8', newline='\n')` API handles file creation, encoding, newline conversion, and safe closing in a single method call. It's part of Python's standard library (no dependencies) and is the pattern used in contemporary Python code. The codebase requires Python 3.11+, making pathlib the natural, zero-dependency choice.

  ### 2. Encoding Enforcement (UTF-8 without BOM)

  **Chosen:** Use `encoding='utf-8'` parameter in `write_text()`; validate no BOM in post-write checks

  **Rejected:**
  - `encoding='utf-8-sig'` — automatically adds BOM, violating NFR-1
  - Platform-default encoding — risks CRLF and locale-specific divergence across platforms

  **Rationale:** Python's `'utf-8'` codec writes pure UTF-8 without BOM. The 'utf-8-sig' variant is explicitly avoided because it adds a 3-byte BOM prefix (EF BB BF), violating the requirement. Post-write validation checks that the file's first three bytes are not the BOM sequence. This approach maintains consistency with 250+ existing test files and prevents platform-specific encoding drift.

  ### 3. Line Ending Enforcement (LF only, not CRLF)

  **Chosen:** Use `newline='\n'` parameter in `write_text()` to universally enforce Unix LF line endings

  **Rejected:**
  - Platform-default newlines — results in CRLF on Windows, LF on Unix, creating inconsistent diffs and violating NFR-2
  - Manual post-write replacement — adds complexity and risks double-replacement if content already contains LF

  **Rationale:** Python's `pathlib.write_text(newline='\n')` ensures that all '\n' characters are written as Unix LF (U+000A), not converted to platform-specific CRLF (U+000D U+000A). This is the documented, correct way to enforce cross-platform line ending consistency per PEP 3116. The newline parameter operates at the text layer, making it reliable and clean — no need for post-write text manipulation.

  ### 4. Validation Strategy

  **Chosen:** Basic post-write structural validation (file exists, size bounds, H1 count, sentence count, encoding/BOM verification)

  **Rejected:**
  - No validation — risks committing malformed files (missing heading, wrong encoding, etc.)
  - Comprehensive validation with grammar/readability checks — over-engineering for a test artifact, requires NLP library, adds 5-10 min overhead

  **Rationale:** The feature spec resolves to "Basic structural validation." This means lightweight checks: (1) file exists, (2) size 300–800 bytes, (3) exactly one H1 heading, (4) contains 2–3 sentences, (5) no BOM, (6) no CRLF. These ~50 lines of Python catch real errors (missing heading, encoding issues) without unnecessary complexity. The validation approach aligns with the established pattern: safety without over-engineering.

  ### 5. Prose Content Generation

  **Chosen:** Manual prose writing — human-authored, substantive, coherent content

  **Rejected:**
  - Programmatic generation (templates, random text generators) — produces generic placeholder text that doesn't match the human-authored quality of 250+ existing test files
  - Copy/paste from existing files — violates uniqueness principle

  **Rationale:** The feature spec resolves to "Manual writing" in requirements (open question 3). Manual prose ensures content is substantive (FR-5), coherent, and matches the human-authored standard of existing test files. While this adds ~2–3 minutes per file, it's necessary for pattern fidelity and prevents gibberish output. The codebase demonstrates that diverse, well-written prose topics (nature, science, history, culture, philosophy) are the norm — manual writing maintains this quality.

  ### 6. Git Integration

  **Chosen:** Use `subprocess.run()` to invoke git CLI commands (stage, commit, push)

  **Rejected:**
  - GitPython library — adds external dependency not in pyproject.toml, requires installation, unnecessary for simple CLI operations
  - `os.system()` — vulnerable to shell injection, no error handling, less portable

  **Rationale:** The feature requires git operations: `git add`, `git commit`, `git push`. Using `subprocess.run(cmd_list)` (with `shell=False`) is the safe, standard Python approach. It's in the standard library, provides proper error handling via return codes and exceptions, and avoids external dependencies. The feature branch is pre-created, so no branch creation logic is needed.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib | File I/O operations | **Use** | Python 3.11+ standard library, idiomatic, handles encoding/newline parameters. Zero external dependencies. Required by NFR-3. |
  | subprocess | Git CLI invocation (git add/commit/push) | **Use** | Python standard library, safe CLI invocation, proper error handling. No shell injection risks with `shell=False`. |
  | GitPython | Alternative git integration | **Reject** | External dependency not in pyproject.toml. Unnecessary for simple git operations (3 commands). Adds complexity without benefit. |
  | re (regex) | Validation: H1 heading detection | **Use** | Python standard library. Simple pattern matching for `^# [^#]` to detect H1 headings. ~1 line of code. |
  | os.path / pathlib alternatives | File operations | **Reject** (in favor of pathlib) | Less idiomatic, more verbose than pathlib. `os.path` is legacy; pathlib is modern standard. |
  | tempfile | Temporary file for validation | **Use** (optional) | Standard library. Could be used for intermediate validation before writing, but not required for this simple feature. |

  ## Security Considerations

  ### 1. File Path Validation
  - **Risk**: Arbitrary file path could be used if feature is later generalized
  - **Mitigation**: File path is hard-coded as `test-98fzdw.md` in the feature spec. No user input accepted. Path is relative to repository root (same level as README.md). No path traversal possible.

  ### 2. File Overwrite Safety
  - **Risk**: Existing file at `test-98fzdw.md` could be silently overwritten
  - **Mitigation**: This is the intended behavior per the feature spec. However, a pre-write check could verify the file doesn't already exist (to detect accidental re-runs). The feature spec assumes first-time execution.

  ### 3. Git Command Injection
  - **Risk**: If git commit message contained user input, injection is possible
  - **Mitionale**: Commit message is hard-coded in the feature spec: `feat(248): create markdown file test-98fzdw.md with prose content`. No user input. No shell=True usage. Safe via `subprocess.run(cmd_list)`.

  ### 4. Content Injection / Code Execution
  - **Risk**: Prose content could contain executable code or malicious markdown
  - **Mitigation**: This is a markdown file (text-only), not executable code. Content is author-written, not dynamically generated. Markdown rendering is responsibility of downstream consumers. No code execution from markdown file creation itself.

  ### 5. Encoding Attacks
  - **Risk**: Incorrect encoding could allow Unicode normalization attacks or overlong UTF-8 sequences
  - **Mitigation**: Python's UTF-8 codec strictly validates encoding. Using `errors='strict'` (default) in `write_text()` ensures invalid UTF-8 sequences are rejected. Standard UTF-8 encoding prevents normalization attacks.

  ### 6. Line Ending Vulnerabilities
  - **Risk**: CRLF injection could create different behavior on Unix vs Windows (e.g., in line-based parsing)
  - **Mitigation**: Enforcing LF-only line endings (newline='\n') prevents CRLF from being introduced. Consistent across all platforms.

  ## Performance Considerations

  ### 1. File I/O Performance
  - **Single file write** (~400–600 bytes) is negligible: <1ms on modern hardware
  - **No optimization needed**: File size is small, single I/O operation
  - **pathlib overhead**: Minimal; pathlib's overhead is <1ms for single file operations

  ### 2. Git Operations Performance
  - **Three git commands** (add, commit, push) require subprocess invocations and network I/O (push)
  - **Expected timing**: `git add` (<1ms), `git commit` (1–5ms), `git push` (100–5000ms depending on network/server latency)
  - **No optimization needed**: Feature estimate is 10–15 min total; git operations are small fraction
  - **Recommendation**: Don't optimize git operations; they're I/O bound and expected to take time

  ### 3. Validation Performance
  - **Structural validation** (file exists, size check, regex matching for heading count) is <10ms
  - **Negligible impact**: Validation overhead is minimal compared to file write and git operations

  ### 4. Memory Usage
  - **Minimal**: Single 300–800 byte file in memory
  - **No streaming needed**: File size is small enough to fit in memory easily

  ## Architecture Notes

  ### Integration with Existing Codebase

  This feature follows the established pattern of 250+ existing test markdown files in the repository root:

  1. **Repository Structure Preserved**: No changes to /src/sheep/, /tests/, specs/, or any source code directories. Single file addition to repository root.
  2. **No Source Code Dependencies**: Feature is purely file I/O and git operations. Does not import from /src/sheep/ or any application code (NFR-4).
  3. **Standard Python Only**: Uses Python 3.11+ standard library (pathlib, subprocess). No external dependencies to add to pyproject.toml.
  4. **Git Workflow Pattern**: Follows the established pattern: create file → stage → commit with conventional message → push to feature branch.
  5. **No Configuration Changes**: No updates to pyproject.toml, GitHub workflows, or other configuration files.
  6. **Test Artifact**: This markdown file is a test artifact, not part of the application logic. It serves as a validation artifact for the automated implementation system (similar to 250+ existing test-*.md files).

  ### Relationship to Recent Features

  Features 245, 246, and 247 follow the identical pattern:
  - Same feature requirements (markdown file creation with heading + prose)
  - Same git workflow (stage, commit, push to feature branch)
  - Same validation approach (basic structural checks)
  - Recent commits show successful implementations of identical features

  This research documents the technical approach for feature 248, which is identical in scope and implementation to features 245–247. The pattern is well-established and proven.

  ## Implementation Plan (High-Level)

  1. **Create prose content**: Write 2–3 coherent sentences about a chosen topic (unrestricted).
  2. **Write file**: Use `pathlib.Path('test-98fzdw.md').write_text(content, encoding='utf-8', newline='\n')`
  3. **Validate structure**: Check H1 count, sentence count, file size, encoding/BOM, line endings
  4. **Stage file**: `subprocess.run(['git', 'add', 'test-98fzdw.md'])`
  5. **Commit**: `subprocess.run(['git', 'commit', '-m', 'feat(248): create markdown file test-98fzdw.md with prose content'])`
  6. **Push**: `subprocess.run(['git', 'push', '-u', 'origin', 'feat/248-markdown-file-creation-b2e09d'])`

  ---

  _Research phase complete — technology decisions documented with rationale, library choices evaluated, security and performance implications identified, architecture integration analyzed. Ready for implementation._
