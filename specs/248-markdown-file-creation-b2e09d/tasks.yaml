tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Author prose content for markdown file"
    description: >
      Write 2-3 coherent, substantive sentences about a chosen topic (unrestricted per
      spec). This prose will form the body of the markdown file. Manual authoring ensures
      quality and narrative coherence matching the 250+ existing test files.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "Prose consists of exactly 2 or 3 complete sentences"
      - "Content is coherent and substantive (not placeholder, gibberish, or disconnected)"
      - "Content demonstrates understanding of the chosen topic"
      - "Each sentence is separated by proper punctuation and spacing"
      - "Total prose length is appropriate (typically 100-150 words for 2-3 sentences)"
    tdd:
      red: |
        Define requirements for valid prose:
        - Must contain exactly 2 or 3 sentences (period-delimited)
        - Must be coherent and substantive (not gibberish)
        - Must demonstrate understanding of topic
        - Total length typically 100-150 words
      green: |
        Choose a topic (e.g., nature, technology, science, history, culture, philosophy)
        and hand-write 2-3 substantive sentences about it. Store in a variable/constant
        for use in file creation task.
      refactor: |
        Review prose for quality: ensure coherence, remove redundancy, verify each
        sentence adds value, confirm natural language flow, validate sentence count
        matches requirements exactly.
    estimatedEffort: "5m"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Create markdown file with proper encoding and line endings"
    description: >
      Create test-98fzdw.md at repository root with H1 markdown heading, blank line, and
      prose content. Use pathlib.Path.write_text() with explicit UTF-8 encoding (no BOM)
      and Unix LF line endings to ensure consistency with 250+ existing test files and
      satisfy encoding/line ending requirements.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File test-98fzdw.md is created at repository root (same level as README.md)"
      - "File contains exactly one H1 markdown heading (single # followed by space and text)"
      - "H1 heading is followed by blank line (one empty line), then prose"
      - "File is UTF-8 encoded without BOM (first 3 bytes are not EF BB BF in hex)"
      - "File uses Unix LF line endings only (no CRLF)"
      - "File size is between 300-800 bytes (natural result of structure)"
      - "File can be read back with encoding='utf-8' without errors"
    tdd:
      red: |
        Write test that asserts:
        - File 'test-98fzdw.md' does not exist initially
        - After calling create_markdown_file(), file exists
        - File content matches expected structure: heading + blank line + prose
        - File is valid UTF-8 without BOM
        - File has no CRLF line endings
        - File size is within 300-800 byte range
      green: |
        Implement create_markdown_file() function that:
        - Constructs content with H1 heading + blank line + prose
        - Calls Path('test-98fzdw.md').write_text(
            content,
            encoding='utf-8',
            newline='\n'
          )
        - Returns path or None indicating success
      refactor: |
        - Add docstring explaining parameters and return value
        - Extract prose content to constant for clarity
        - Add comments explaining encoding/newline parameters
        - Consider extracting heading construction to named variable
    estimatedEffort: "5m"

  - id: "task-3"
    phaseId: "phase-1"
    title: "Implement file structure validation"
    description: >
      Add validation logic to verify the created markdown file meets all structural,
      encoding, and format requirements before committing to git. Validation catches
      errors early and ensures file quality.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "Validation confirms file exists"
      - "Validation confirms file size is 300-800 bytes"
      - "Validation confirms exactly one H1 heading (regex: '^# [^#]')"
      - "Validation confirms 2-3 sentences in prose section (period-based count)"
      - "Validation confirms UTF-8 encoding (file reads without UnicodeDecodeError)"
      - "Validation confirms no UTF-8 BOM (first 3 bytes are not EF BB BF)"
      - "Validation confirms no CRLF line endings (no '\\r\\n' sequences)"
      - "Validation raises descriptive exception if any check fails"
    tdd:
      red: |
        Write tests that assert:
        - validate_markdown_file() raises exception if file doesn't exist
        - Raises exception if file size outside 300-800 byte range
        - Raises exception if H1 count != 1 (use regex '^# [^#]')
        - Raises exception if sentence count < 2 or > 3
        - Raises exception if file has non-UTF-8 sequences
        - Raises exception if file starts with UTF-8 BOM bytes
        - Raises exception if file contains CRLF
        - Returns True/None if all checks pass
      green: |
        Implement validate_markdown_file(filepath) function:
        - Check file exists: Path(filepath).exists()
        - Check size: 300 <= Path(filepath).stat().st_size <= 800
        - Count H1: len(re.findall(r'^# [^#]', content, re.MULTILINE))
        - Count sentences: simple heuristic (count '. ' + final sentence)
        - Read with encoding='utf-8' (will raise if invalid)
        - Check first 3 bytes: Path(filepath).read_bytes()[:3] != b'\xef\xbb\xbf'
        - Check line endings: '\r\n' not in content
        - Raise ValueError with descriptive message on any failure
      refactor: |
        - Extract validation checks into helper functions (e.g., check_encoding,
          check_heading_count, check_sentence_count)
        - Add detailed docstring with validation rules
        - Improve error messages to be more descriptive
        - Consider logging validation steps for debugging
    estimatedEffort: "5m"

  - id: "task-4"
    phaseId: "phase-2"
    title: "Stage markdown file with git add"
    description: >
      Stage the created test-98fzdw.md file in git using 'git add'. This prepares the
      file for committing in the next task.
    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "git add command is executed without errors"
      - "File appears in git staging area (Changes to be committed)"
      - "Return code from subprocess.run() is 0 (success)"
      - "No error messages or warnings from git add operation"
    tdd:
      red: |
        Write test that:
        - Asserts initial 'git status' shows file as untracked
        - Calls stage_file('test-98fzdw.md')
        - Asserts 'git status' now shows file in 'Changes to be committed' section
        - Asserts subprocess return code is 0
      green: |
        Implement stage_file(filename) function:
        - Call subprocess.run(
            ['git', 'add', filename],
            check=True,
            capture_output=True
          )
        - Return result.returncode or True on success
      refactor: |
        - Add error handling for FileNotFoundError or git errors
        - Add docstring explaining what the function does
        - Consider logging the git add command being executed
    estimatedEffort: "2m"

  - id: "task-5"
    phaseId: "phase-2"
    title: "Commit with conventional commit message"
    description: >
      Create git commit with conventional commit message format. Message format:
      'feat(248): create markdown file test-98fzdw.md with prose content'
    state: "Todo"
    dependencies:
      - "task-4"
    acceptanceCriteria:
      - "git commit command executes without errors"
      - "Commit message is exactly: 'feat(248): create markdown file test-98fzdw.md with prose content'"
      - "Return code from subprocess.run() is 0 (success)"
      - "Commit is created and appears in git log"
      - "File is no longer in staging area (working tree clean)"
      - "Commit follows conventional commits format (feat scope and colon)"
    tdd:
      red: |
        Write test that:
        - Asserts file is staged before commit
        - Calls commit_file() function
        - Asserts commit exists in git log with correct message
        - Asserts working tree is clean after commit
        - Verifies return code is 0
      green: |
        Implement commit_file() function:
        - Call subprocess.run(
            ['git', 'commit', '-m',
             'feat(248): create markdown file test-98fzdw.md with prose content'],
            check=True,
            capture_output=True
          )
        - Return result.returncode or True on success
      refactor: |
        - Extract commit message to constant for reusability
        - Add docstring
        - Consider validating commit message format before execution
    estimatedEffort: "2m"

  - id: "task-6"
    phaseId: "phase-2"
    title: "Push commit to feature branch"
    description: >
      Push the committed changes to the feature branch (feat/248-markdown-file-creation-b2e09d)
      on the remote origin. This makes the work visible in the remote repository.
    state: "Todo"
    dependencies:
      - "task-5"
    acceptanceCriteria:
      - "git push command executes without errors"
      - "Commit is pushed to remote branch: origin/feat/248-markdown-file-creation-b2e09d"
      - "Return code from subprocess.run() is 0 (success)"
      - "Local and remote branches are in sync"
      - "File and commit are visible in remote repository"
    tdd:
      red: |
        Write test that:
        - Asserts commit exists locally before push
        - Calls push_to_branch() function
        - Asserts git log --remotes shows commit on origin/feat/248-*
        - Verifies return code is 0
        - Confirms no local commits remain unpushed
      green: |
        Implement push_to_branch() function:
        - Call subprocess.run(
            ['git', 'push', '-u', 'origin',
             'feat/248-markdown-file-creation-b2e09d'],
            check=True,
            capture_output=True
          )
        - Return result.returncode or True on success
      refactor: |
        - Add docstring explaining branch name and remote
        - Extract branch name to constant for clarity
        - Consider handling network errors gracefully (optional)
        - Add logging for push operation details
    estimatedEffort: "2m"

totalEstimate: "16m"

