content: |
  ## Task Breakdown Overview

  This task breakdown spans 6 concrete work items across 2 phases, implementing feature 248
  from requirement to git integration.

  **Phase 1 — File Creation & Validation** (3 tasks, ~15 minutes):
  1. Author prose content (2-3 coherent sentences about chosen topic)
  2. Create markdown file using pathlib with UTF-8 encoding and LF line endings
  3. Implement validation to verify file structure, encoding, and format

  **Phase 2 — Git Integration** (3 tasks, ~6 minutes):
  4. Stage file with git add
  5. Commit with conventional commit message
  6. Push to feature branch on remote origin

  Each task includes TDD cycles (RED-GREEN-REFACTOR) defining the test, minimal implementation,
  and cleanup steps. Dependencies ensure proper ordering: prose → file creation → validation →
  git operations.

  ### Task Dependencies

  ```
  task-1 (prose)
    ↓
  task-2 (create file)
    ↓
  task-3 (validate)
    ↓
  task-4 (git add)
    ↓
  task-5 (git commit)
    ↓
  task-6 (git push)
  ```

  All tasks are sequential (no parallelization possible due to dependencies).

  ### TDD Approach

  Each task defines a TDD cycle:

  - **RED**: Write test/assertion that fails without implementation
  - **GREEN**: Implement minimal code to pass the test
  - **REFACTOR**: Clean up, extract helpers, improve naming, add documentation

  For file I/O tasks (2-3), tests verify file existence, size, encoding, and structure.
  For git operations (4-6), tests verify git state before and after execution.

  ### Effort Breakdown

  - Task 1 (prose): 5m
  - Task 2 (file creation): 5m
  - Task 3 (validation): 5m
  - Task 4 (git add): 2m
  - Task 5 (git commit): 2m
  - Task 6 (git push): 2m
  - **Total: ~16 minutes** (aligns with feature size estimate of 10-15m)

  ### Acceptance & Verification

  Each task includes specific acceptance criteria that define what "done" looks like. These
  criteria are testable and measurable, enabling clear verification of task completion.
  The final state: test-98fzdw.md exists at repository root, contains proper markdown
  structure and prose, is valid UTF-8 with LF line endings, is committed with conventional
  message, and is pushed to the feature branch on remote origin.

  ---

  _Task breakdown complete — 6 concrete tasks defined with TDD cycles, dependencies, and
  acceptance criteria. Ready for implementation phase._
