content: |
  ## Summary

  This 4-task implementation creates a markdown file (test-pz9pb9.md) at the repository root following
  the established pattern from 155+ prior features (069-223). Task 1 creates the file with proper structure
  (H1 heading + 2-3 sentences of prose content), and tasks 2-4 handle the git workflow (stage → commit →
  push). Each task is small, focused, and follows the TDD pattern (RED/GREEN/REFACTOR). Total estimated
  effort is 10 minutes, consistent with the \"S\" (Small) size estimate from the feature spec.

  ### Execution Flow

  1. **task-1 (Phase 1)**: Create markdown file with proper structure
     - Create test-pz9pb9.md at repository root
     - Content: H1 heading + blank line + 2-3 sentences
     - Verify UTF-8 encoding and LF line endings
     - Estimated: 5 minutes

  2. **task-2 (Phase 2)**: Stage file with git add
     - Depends on: task-1 (file must exist before staging)
     - Use subprocess.run() for git add command
     - Verify file appears in staging area
     - Estimated: 2 minutes

  3. **task-3 (Phase 2)**: Commit with conventional message
     - Depends on: task-2 (file must be staged before committing)
     - Exact message: \"feat(224): create markdown file test-pz9pb9.md with prose content\"
     - Verify commit in history with correct message
     - Estimated: 2 minutes

  4. **task-4 (Phase 2)**: Push to remote
     - Depends on: task-3 (commit must exist before pushing)
     - Use subprocess.run() for git push origin HEAD
     - Verify changes visible on remote branch
     - Estimated: 1 minute

  ### Dependency Chain

  All tasks execute sequentially with strict dependencies:
  ```
  task-1 → task-2 → task-3 → task-4
  ```

  No parallel execution possible; each task depends on the previous one completing successfully.

  ### TDD Approach

  Each task follows RED-GREEN-REFACTOR pattern:

  - **RED**: Write assertion/verification that step hasn't been completed yet
  - **GREEN**: Implement minimal code to pass the assertion
  - **REFACTOR**: Verify implementation details (encoding, syntax, git state)

  This approach ensures each step is validated before moving to the next task.

  ---

  _Task breakdown complete — 4 concrete, ordered tasks with TDD cycles, ready for implementation_
