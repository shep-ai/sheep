content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. Feature 146 creates a single test markdown file (`test-vqya6w.md`) at the repository root with a title and prose content, demonstrating automated file creation and git integration.

  This is a continuation of the markdown-file-creation pattern established in features 001-145, with 145+ identical test files already existing in the repository. The pattern is foundational to validating the Sheep platform's core capability of automated, repeatable implementation tasks.

  ## Success Criteria

  - [ ] File `test-vqya6w.md` is created at repository root (accessible via `Path("test-vqya6w.md")`)
  - [ ] File contains valid Markdown syntax with H1 heading on first line (e.g., `# Heading Title`)
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line separator
  - [ ] File uses UTF-8 encoding without BOM (validated via `validate_markdown_file()`)
  - [ ] File uses Unix LF line endings (`\n`), not Windows CRLF (`\r\n`)
  - [ ] File ends with a single trailing newline character
  - [ ] File passes all validation checks in `sheep.content_generators.validate_markdown_file()`
  - [ ] Git commit is created with conventional commit message: `feat(146): [commit message]`
  - [ ] Commit is successfully pushed to remote feature branch `feat/146-markdown-file-creation-c31ed2`
  - [ ] File size is between 400-600 bytes (reasonable for H1 + 2-3 sentences)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a markdown file named exactly `test-vqya6w.md` at the repository root directory
  - **FR-2**: The file SHALL contain an H1 heading (markdown syntax `# Title`) as the first line
  - **FR-3**: The file SHALL contain a blank line after the heading, followed by exactly 2-3 sentences of prose content
  - **FR-4**: Prose content SHALL be generated using Claude API via the existing `sheep.content_generators.generate_markdown_content()` function
  - **FR-5**: The file SHALL be written to disk using Python's `pathlib.Path` with UTF-8 encoding
  - **FR-6**: The file SHALL be validated using `sheep.content_generators.validate_markdown_file()` before committing
  - **FR-7**: The file SHALL be staged and committed using `sheep.content_generators.commit_markdown_file()` with a conventional commit message
  - **FR-8**: The commit SHALL be pushed to the remote using `sheep.content_generators.push_markdown_file()` on the current feature branch

  ## Non-Functional Requirements

  - **NFR-1**: File encoding shall be UTF-8 without BOM (Byte Order Mark), as validated by the encoding check in `sheep.content_generators.validate_markdown_file()`
  - **NFR-2**: Line endings shall be Unix LF (`\n`), not Windows CRLF (`\r\n`), as validated by the line ending check
  - **NFR-3**: File shall include a trailing newline character at the end, as validated by the trailing newline check
  - **NFR-4**: Implementation must follow the established pattern from features 001-145 for consistency and maintainability
  - **NFR-5**: All prose content must be semantically coherent and readable, generated by Claude API
  - **NFR-6**: Implementation shall use the existing `sheep.content_generators.create_markdown_file()` orchestrator function to ensure consistency
  - **NFR-7**: Implementation shall complete in under 15 minutes of execution time
  - **NFR-8**: Implementation shall have zero impact on existing source code in `src/sheep/` beyond using existing utilities

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementation use the create_markdown_file() orchestrator or build custom implementation? | Use create_markdown_file() orchestrator | Proven with 145+ uses, all validation built-in, ensures consistency with established pattern, reduces risk of validation errors |
  | 2 | Should a dedicated feature_146 module be created? | Yes, create feature_146_markdown_file_creation.py module | Maintains consistency with 001-145 pattern, enables proper feature organization and documentation, improves discoverability |
  | 3 | What conventional commit prefix should be used? | feat(146): | Accurately reflects new feature/file creation, aligns with semantic versioning, standard practice for feature implementations |
  | 4 | Should prose content topic be specific or flexible? | Flexible — any topic (LLM-generated) | Matches established pattern from 145+ files, reduces implementation overhead, demonstrates LLM flexibility, topic not specified by user |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated software development with the following key directories:

  - **src/sheep/features/** - Individual feature implementations (features 001-146 including markdown file creators)
  - **src/sheep/content_generators.py** - Reusable utilities for markdown file creation and validation
  - **src/sheep/agents/** - CrewAI agent definitions (code_agents.py, general_agents.py)
  - **src/sheep/flows/** - Workflow orchestration (code_implementation.py, chat.py)
  - **src/sheep/tools/** - Git tools (git_tools.py), file tools (file_tools.py)
  - **src/sheep/config/** - Configuration and LLM setup (settings.py, llm.py)
  - **specs/** - Specification documents for each feature (146+ directories)

  ### Architecture Patterns

  The project follows a modular architecture with clear separation:

  1. **Content Generation**: The `sheep.content_generators` module provides a complete toolkit for markdown file creation:
     - `generate_markdown_content()` - Calls Claude LLM to generate H1 heading + 2-3 sentences
     - `write_markdown_file()` - Writes content to disk with UTF-8 encoding
     - `validate_markdown_file()` - Validates file structure, encoding, line endings
     - `commit_markdown_file()` - Stages file and commits with conventional message
     - `push_markdown_file()` - Pushes to remote with upstream tracking
     - `create_markdown_file()` - Orchestrates entire workflow (1-5 above)

  2. **Feature Implementations**: Each feature (101+) follows the same pattern:
     - Imports from content_generators
     - Defines feature metadata (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)
     - Calls create_markdown_file() or orchestrates individual utilities
     - Returns results dictionary with filepath, content, commit_message, push_result

  3. **Validation Strategy**: Files must pass validation checks:
     - UTF-8 encoding without BOM
     - Unix LF line endings (not CRLF)
     - H1 heading on first line
     - Blank line separator
     - 2-3 sentences of prose content
     - Trailing newline

  ### Relevant Technologies

  - **Python 3.11+**: Provides pathlib for cross-platform file operations
  - **Git**: Version control with staging, commits, and push operations
  - **Claude API with CrewAI**: LLM-based content generation for prose
  - **Markdown**: CommonMark-compliant syntax for file format
  - **sheep.content_generators**: Established, battle-tested module with 145+ successful uses

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-vqya6w.md) to existing collection of 145+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-145; no branch/merge complexity, no destructive operations |
  | src/sheep/features/ | Low | May add new feature_146_markdown_file_creation.py module following established pattern; does not modify existing feature modules |
  | Source Code (/src/sheep/) | None | Feature is purely file creation at repository root; does not depend on or modify any source code, agents, flows, or tools beyond existing content_generators module utilities |
  | Specs Directory | Low | Updates this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Test Suite | None | No modifications to test files or testing infrastructure |

  ## Dependencies

  - **Git repository**: Feature branch `feat/146-markdown-file-creation-c31ed2` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 145+ test files in features 001-145 provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python 3.11+**: Project requires Python 3.11 or higher
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Claude API**: Content generation requires Claude API access via CrewAI LLM framework
  - **sheep.content_generators module**: Provides create_markdown_file() orchestration function and all validation utilities

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~2-3 minutes (Claude API call via generate_markdown_content() in content_generators)
  - **File creation and validation**: ~3-5 minutes (use write_markdown_file() and validate_markdown_file() utilities)
  - **Git workflow**: ~2-5 minutes (use commit_markdown_file() and push_markdown_file() utilities)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 145+ identical test files in features 001-145 providing clear precedent
  - Proven content generators in sheep.content_generators module available for reuse (create_markdown_file() is primary entry point)
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (143-145) demonstrate consistent 10-15 minute implementation of identical features
  - Zero impact on application source code or architecture
  - Claude API handles prose generation, eliminating manual content composition

  ---

  _Requirements phase complete — specification ready for implementation_
