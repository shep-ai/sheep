content: |
  ## Summary

  Feature 146 implementation follows a straightforward 4-phase approach:

  **Phase 1 (Module Creation):** Create the feature module with metadata constants matching the established naming convention from features 143-145. This is mostly boilerplate structure copied from prior features with minimal changes (feature number, filename).

  **Phase 2 (Orchestrator Integration):** Implement the core function as a thin wrapper around the sheep.content_generators.create_markdown_file() orchestrator. The orchestrator handles all the heavy lifting (content generation, file writing, validation, git operations).

  **Phase 3 (Validation & Testing):** Execute the feature function and verify that the markdown file is created correctly with proper structure, encoding, and content. Validate that all success criteria are met using the existing validate_markdown_file() utility.

  **Phase 4 (Git Verification):** Confirm that git operations succeeded — commit created with correct message, pushed to the feature branch, and no uncommitted changes remain.

  ## Execution Strategy

  The tasks are ordered by dependency: module must exist before implementation, implementation must work before validation, validation must pass before confirming git operations.

  Each task includes TDD cycle guidance (RED → GREEN → REFACTOR) to ensure quality and traceability. However, because the feature relies heavily on proven orchestrator utilities, the testing focuses on integration and end-to-end verification rather than unit testing individual functions.

  ## Effort Breakdown

  - **Task 1 (Module Creation):** 10 min — Mostly copying structure from feature 145, minimal customization
  - **Task 2 (Implementation):** 10 min — Single function calling existing orchestrator
  - **Task 3 (Validation):** 15 min — Verify file creation (includes ~3 min API latency, ~2 min git operations)
  - **Task 4 (Git Verification):** 10 min — Final checks

  **Total: 45 minutes** (conservative estimate that accounts for API latency and git operations)

  The actual coding work is minimal (~10-15 minutes); most time is spent waiting for LLM API calls and git operations.

  ## Risk Mitigation

  The implementation is very low-risk because:
  - Pattern is established and proven across 145+ prior features
  - No custom logic needed; orchestrator handles all complexity
  - No architectural changes; uses existing stable utilities
  - Module structure copied directly from feature_145
  - Comprehensive validation ensures correctness before committing
