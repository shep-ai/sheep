content: |
  ## Architecture Overview

  Feature 146 integrates seamlessly into the existing Sheep platform architecture:

  ### Existing Infrastructure (Proven with 145+ Features)

  The `sheep.content_generators` module provides the complete orchestration pipeline:

  - **generate_markdown_content()** — Calls Claude API to generate H1 heading + 2-3 sentences
  - **write_markdown_file()** — Writes content to disk with UTF-8 encoding and Unix line endings
  - **validate_markdown_file()** — Comprehensive validation of structure, encoding, and format
  - **commit_markdown_file()** — Git staging and commit with conventional message
  - **push_markdown_file()** — Git push to remote with upstream tracking
  - **create_markdown_file()** — Orchestrator that chains all above steps with error handling and logging

  ### Feature Module Pattern

  The feature module follows the established pattern from features 001-145:

  ```
  feature_146_markdown_file_creation.py
  ├── Imports: sheep.content_generators, logging
  ├── Metadata Constants:
  │   ├── FEATURE_NUMBER = 146
  │   ├── MARKDOWN_FILENAME = "test-vqya6w.md"
  │   └── COMMIT_MESSAGE = "feat(146): create markdown file test-vqya6w.md with prose content"
  ├── create_feature_146_markdown_file() function
  │   └── Calls create_markdown_file(MARKDOWN_FILENAME, COMMIT_MESSAGE)
  │   └── Returns result dictionary
  └── if __name__ == "__main__": main block for direct execution
  ```

  ### Integration Points

  1. **LLM Configuration** — Uses sheep.config.llm.get_reasoning_llm() with temperature=0.2 (configured in generate_markdown_content)
  2. **Git Integration** — Uses sheep.tools.GitCommitTool and GitPushTool via orchestrator
  3. **Logging** — Uses sheep.observability.logging.get_logger(__name__)
  4. **File Operations** — Uses pathlib.Path for cross-platform file I/O

  ## Key Design Decisions

  ### 1. Use Existing Orchestrator (Not Custom Implementation)

  **Chosen:** Call `create_markdown_file()` orchestrator from sheep.content_generators

  **Why:** The orchestrator encapsulates the proven workflow used in 145+ prior implementations. It includes:
  - Comprehensive error handling with logging
  - All validation checks (UTF-8, line endings, structure, sentence count, trailing newline)
  - Consistent behavior across all features
  - Minimal risk of validation errors

  **Alternative Rejected:** Building custom implementation with individual utility calls would duplicate logic, increase error handling complexity, and deviate from established pattern.

  ### 2. Create Dedicated Feature Module (Consistent with 001-145)

  **Chosen:** Create `feature_146_markdown_file_creation.py` module in src/sheep/features/

  **Why:** Maintains consistency with all 145 prior features, enables future feature discovery/documentation, and keeps feature implementations organized and discoverable.

  **Alternative Rejected:** Inline implementation without module would break the established pattern and make the feature harder to locate.

  ### 3. Follow Semantic Versioning Commit Convention

  **Chosen:** Use `feat(146):` prefix for commit message

  **Why:** Accurately reflects new feature creation, aligns with semantic versioning standards, and matches convention used by features 001-145. Enables automated changelog generation.

  **Alternative Rejected:** Using `docs()` or `test()` would be semantically inaccurate for a feature implementation.

  ### 4. Use LLM-Generated Content (Flexible Topic)

  **Chosen:** Allow Claude API to generate content with flexible topic selection

  **Why:** Matches the pattern from 145+ prior features, demonstrates platform's content generation capability, reduces implementation overhead (no predetermined content needed).

  **Alternative Rejected:** Static content would reduce demonstration value; specific topic would require additional specification.

  ### 5. Validate Using Existing Framework (Not Custom Validation)

  **Chosen:** Rely on `validate_markdown_file()` from sheep.content_generators

  **Why:** Comprehensive validation framework that has been proven across 145+ features. Validates:
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - H1 heading structure
  - Blank line separator
  - Exactly 2-3 sentences of prose
  - Trailing newline character

  **Alternative Rejected:** Custom validation or minimal checking would introduce inconsistency and risk of invalid files.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (Module Creation)** — Establish the module structure and metadata. This is foundational; all other phases depend on having the module file in place.

  2. **Phase 2 (Orchestrator Integration)** — Implement the core function that calls the orchestrator. This is where the actual feature logic lives (which is just delegating to the orchestrator).

  3. **Phase 3 (Validation & Testing)** — Verify that the feature produces a valid markdown file. This ensures all success criteria are met before declaring completion.

  4. **Phase 4 (Verification & Cleanup)** — Final end-to-end verification and confirmation that the commit is pushed to the feature branch.

  ### Why This Order Works

  - Each phase builds on the previous one (no backtracking)
  - Module must exist before implementing functions
  - Functions must be implemented before validating output
  - Validation must pass before pushing to git

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation Strategy |
  | ---- | ---------- | ------------------- |
  | File validation fails (encoding, line endings) | Very Low | Use existing validate_markdown_file() which has been proven across 145+ features. No custom validation means no custom bugs. |
  | Git commit/push fails | Very Low | Use existing GitCommitTool and GitPushTool wrappers via orchestrator. Proven in 145+ prior implementations. |
  | LLM generates invalid content (wrong sentence count) | Very Low | Claude API with temperature=0.2 produces deterministic output. The generate_markdown_content() prompt is designed to produce exactly 2-3 sentences. Prior 145+ features show 100% success rate. |
  | File structure doesn't match spec | Very Low | Orchestrator enforces the exact structure (H1 + blank line + 2-3 sentences). No custom logic means no deviation. |
  | Module doesn't follow established pattern | Very Low | Copy structure directly from feature_145_markdown_file_creation.py. Minimal changes: just feature number and filename. |
  | Integration with sheep.content_generators breaks | Very Low | The orchestrator is actively used in features 001-145 and is in stable maintenance. No API changes expected. |

  ## Success Criteria

  Feature 146 is complete when:

  1. **Module File Exists** — `src/sheep/features/feature_146_markdown_file_creation.py` with proper structure
  2. **File Creation Works** — `test-vqya6w.md` exists at repository root after running the feature
  3. **Content Valid** — File contains H1 heading + blank line + 2-3 sentences of prose
  4. **Validation Passes** — File passes all checks in validate_markdown_file()
  5. **Encoding Correct** — UTF-8 without BOM, Unix LF line endings
  6. **Git Integration Works** — Commit created with message `feat(146): create markdown file test-vqya6w.md with prose content`
  7. **Push Succeeds** — Commit pushed to remote feature branch `feat/146-markdown-file-creation-c31ed2`
  8. **File Size Reasonable** — Between 400-600 bytes (appropriate for H1 + 2-3 sentences)

  ## Effort Estimate

  **Total: 30-45 minutes**

  - Phase 1 (Module Setup): 5-10 min — Mostly copying structure from feature 145
  - Phase 2 (Implementation): 5-10 min — Single function calling orchestrator
  - Phase 3 (Validation): 10-15 min — Verify file creation, structure, and validation
  - Phase 4 (Verification): 5-10 min — Final checks, git operations

  The estimate is conservative because Phase 3 includes actual execution time of the orchestrator (which calls Claude API, ~2-3 minutes) and git operations (~1-2 minutes).
