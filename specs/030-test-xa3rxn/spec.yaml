content: |
  ## Problem Statement

  The repository contains a collection of markdown files documenting various topics and examples.
  A new simple markdown file is needed to extend this collection. The task is straightforward:
  create a single markdown file named test-xa3rxn.md with a title (heading) and 2-3 sentences
  of content about any topic.

  ## Codebase Analysis

  ### Project Structure

  The "Sheep" project is an agentic platform for automated code implementation using CrewAI. The repository
  contains:
  - **Repository root**: Collection of markdown files (.md) documenting various topics
  - **tests/**: Python test files using pytest that validate markdown file existence and content
  - **pyproject.toml**: Python project configuration using setuptools/hatchling
  - **specs/**: Feature specification directories with YAML and markdown files
  - **src/**: Python source code for the Sheep platform

  The markdown collection at the root includes files like:
  - Humor: CLASSIC_JOKE.md, DAD_JOKE.md, RANDOM_JOKE.md
  - State machines: ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md
  - Recent test files: test-an5dun.md, test-idm3s2.md, test-quk4of.md, test-local-abc123.md
  - Topic files: cloud-computing-xwbxsh.md, enamel-art-pz8a65.md, fermentation-science-6tiohf.md, honey-bee-dance.md

  ### Architecture Patterns

  The codebase follows these patterns:
  - **Documentation-first**: Markdown files serve as standalone documentation/examples
  - **File naming**: Uses either descriptive names (TOPIC.md) or random identifiers (test-xxxxx.md)
  - **Content structure**: Simple files with a heading and body text
  - **Testing**: Python pytest tests validate file existence and basic content requirements (optional for documentation files)
  - **Version control**: Git-based workflow with feature branches (feat/XXX-description) and conventional commits

  ### Relevant Technologies

  - **Markdown**: GitHub-Flavored Markdown for all documentation files
  - **Git**: Version control with conventional commit messages
  - **Python**: Test suite using pytest (optional for documentation files)

  ## Functional Requirements

  - **FR-1**: The markdown file named `test-xa3rxn.md` must be created at the repository root
  - **FR-2**: The file must contain exactly one heading (level 1 with `#` or level 2 with `##`) serving as the title
  - **FR-3**: The file must contain 2-3 complete sentences of body content after the heading
  - **FR-4**: The body content may be about any topic (e.g., technology, humor, concepts, descriptions, examples)
  - **FR-5**: The file must be valid GitHub-Flavored Markdown with proper syntax

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (consistent with existing repository files)
  - **NFR-2**: Line endings must be LF (Unix-style, `\n`), not CRLF or CR
  - **NFR-3**: File size should be minimal (~10-20 lines including heading, content, and whitespace)
  - **NFR-4**: File should follow the established naming pattern of similar test markdown files (test-xxxxx.md format)
  - **NFR-5**: Changes must be committed with a conventional commit message following repository standards (e.g., `feat(content): add test-xa3rxn.md markdown file`)
  - **NFR-6**: No code changes, test files, or configuration modifications are required as part of this feature

  ## Success Criteria

  - [ ] File `test-xa3rxn.md` exists at the repository root
  - [ ] File contains a single markdown heading (# or ##) as the title
  - [ ] File contains exactly 2-3 complete sentences of body content
  - [ ] Content is valid GitHub-Flavored Markdown with no syntax errors
  - [ ] File uses UTF-8 encoding
  - [ ] File uses LF line endings (not CRLF)
  - [ ] File name matches pattern of existing test markdown files (test-xa3rxn.md)
  - [ ] Changes are committed with a conventional commit message
  - [ ] No unrelated files are modified or created

