# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository contains a collection of markdown files documenting various topics and examples.
  A new simple markdown file is needed to extend this collection. The task is straightforward:
  create a single markdown file named test-xa3rxn.md with a title (heading) and 2-3 sentences
  of content about any topic.

  ## Success Criteria

  - [ ] File `test-xa3rxn.md` exists at the repository root
  - [ ] File contains a single markdown heading (# or ##) as the title
  - [ ] File contains exactly 2-3 complete sentences of body content
  - [ ] Content is valid GitHub-Flavored Markdown with no syntax errors
  - [ ] File uses UTF-8 encoding
  - [ ] File uses LF line endings (not CRLF)
  - [ ] File name matches pattern `test-xa3rxn.md`
  - [ ] Changes are committed with a conventional commit message (e.g., `feat(content): add test-xa3rxn.md markdown file`)
  - [ ] No unrelated files are modified or created

  ## Functional Requirements

  - **FR-1**: The markdown file named `test-xa3rxn.md` must be created at the repository root
  - **FR-2**: The file must contain exactly one heading (level 1 with `#` or level 2 with `##`) serving as the title
  - **FR-3**: The file must contain 2-3 complete sentences of body content after the heading
  - **FR-4**: The body content may be about any topic (e.g., technology, humor, concepts, descriptions, examples)
  - **FR-5**: The file must be valid GitHub-Flavored Markdown with proper syntax

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (consistent with existing repository files)
  - **NFR-2**: Line endings must be LF (Unix-style, `\n`), not CRLF or CR
  - **NFR-3**: File size should be minimal (~10-20 lines including heading, content, and whitespace)
  - **NFR-4**: File should follow the established naming pattern of similar test markdown files (test-xxxxx.md format)
  - **NFR-5**: Changes must be committed with a conventional commit message following repository standards (e.g., `feat(content): add test-xa3rxn.md markdown file`)
  - **NFR-6**: No code changes, test files, or configuration modifications are required as part of this feature

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should we add automated test validation for the markdown file? | No automated validation | The spec explicitly requires no tests. Manual PR review is sufficient for a documentation file. Existing similar files follow this pattern. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adds one new .md file; no code or configuration changes |
  | Git history | Low | Single file addition; conventional commit message |
  | CI/Tests | None | No test code changes required; documentation files validated via PR review |

  ## Dependencies

  None. Pure documentation file with no code dependencies or external requirements. No changes to other files are necessary.

  ## Size Estimate

  **S** — Single markdown file (~10-20 lines including heading and content). No code changes, configuration updates, or test files required. Straightforward documentation file following established patterns. Can be completed in minutes.
