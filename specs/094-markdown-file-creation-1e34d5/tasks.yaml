content: |
  ## Summary

  Implementation consists of 4 sequential tasks across 2 phases:

  **Phase 1: File Creation & Validation** (9 minutes)
  - Create markdown file with generic prose topic, H1 heading, and 2-3 sentences using pathlib
  - Validate file meets all non-functional requirements (UTF-8 encoding, LF line endings, 300-600 bytes)

  **Phase 2: Git Integration** (5 minutes)
  - Stage file and create commit with conventional format
  - Push to feature branch and verify clean working tree

  All tasks are sequential (each depends on the previous). No parallelization possible because file must exist and be validated before git staging, and staging must complete before pushing.

  ## Implementation Flow

  1. **task-1** composes prose and writes file using pathlib with explicit encoding/line-ending parameters
  2. **task-2** validates file against all format requirements (encoding, line endings, size)
  3. **task-3** stages file and creates conventional commit
  4. **task-4** pushes to feature branch and verifies completion

  Total effort: ~14 minutes (within spec estimate of 10-15 minutes)
