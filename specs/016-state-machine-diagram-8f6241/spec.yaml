content: |
  ## Problem Statement

  The repository already contains several state machine markdown files
  (STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md,
  VENDING_MACHINE_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md). The request is
  to add one more simple, standalone example that is not tied to any application
  logic in this repo.

  ## Success Criteria

  - [ ] A new file named `TRAFFIC_LIGHT_STATE_MACHINE.md` exists at the repo root
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` code block
  - [ ] The diagram has exactly 3 states (Red, Green, Yellow) and 3 transitions forming a cycle
  - [ ] The file includes at least a top-level heading and a one-sentence description
  - [ ] The file follows the `<SUBJECT>_STATE_MACHINE.md` naming convention (all caps, underscores)
  - [ ] No existing files are modified
  - [ ] No source code or test files are added or changed

  ## Functional Requirements

  - **FR-1**: A new Markdown file `TRAFFIC_LIGHT_STATE_MACHINE.md` must be created at the repository root.
  - **FR-2**: The file must embed a Mermaid `stateDiagram-v2` diagram representing a traffic light cycle (Red → Green → Yellow → Red).
  - **FR-3**: The diagram must define exactly three states: `Red`, `Green`, and `Yellow`.
  - **FR-4**: The diagram must define exactly three directed transitions forming a closed loop: Red→Green, Green→Yellow, Yellow→Red.
  - **FR-5**: The file must include a top-level Markdown heading (H1) and a brief one-to-two sentence description of the state machine.
  - **FR-6**: The content must be self-contained — no references to application code, tests, or repo-specific concepts.

  ## Non-Functional Requirements

  - **NFR-1**: The file must be valid GitHub-flavored Markdown that renders without errors on GitHub.
  - **NFR-2**: The Mermaid diagram must use syntactically correct `stateDiagram-v2` syntax (renderable by standard Mermaid tooling).
  - **NFR-3**: The file name must follow the established convention exactly: `<SUBJECT>_STATE_MACHINE.md` in all-uppercase with underscores.
  - **NFR-4**: Total file length should be ≤ 25 lines to stay consistent with the "short example" intent of the user request.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which state machine subject to use? | Traffic Light | Canonical example, 3 states, not yet in repo |
  | 2 | Include prose alongside diagram? | Brief prose + diagram | Matches existing file pattern; minimal extra effort |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root-level MD files | Low | Add one new standalone markdown file; no existing files modified |

  ## Dependencies

  None. Pure documentation, no code or library dependencies.

  ## Size Estimate

  **S** — Single file addition, ~15–20 lines including heading, description, and diagram. Follows established pattern exactly.
