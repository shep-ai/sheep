# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. File Structure and Content Format

  **Chosen:** H1 heading + one-sentence description + Mermaid stateDiagram-v2 block

  **Rejected:**
  - Diagram only — breaks consistency with all existing STATE_MACHINE files
  - Extended prose — violates NFR-4 (≤25 lines) and the "super fast / short" user intent

  **Rationale:** The TURNSTILE_STATE_MACHINE.md (and others) use a minimal ~10-line
  structure. Replicating it exactly is the lowest-risk, highest-consistency approach.

  ### 2. Diagram Syntax

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — deprecated; not used anywhere in the repo
  - `flowchart` — wrong semantic type for a state machine

  **Rationale:** All existing files use `stateDiagram-v2`; this ensures uniform
  rendering on GitHub without any tooling changes.

  ### 3. Subject Matter

  **Chosen:** Traffic Light

  **Rejected:**
  - ATM — too many states for a "simple" example
  - Microwave — similar in complexity to existing repo examples, less iconic

  **Rationale:** Traffic Light is the universal state machine 101 example with
  exactly 3 states and 3 transitions — perfectly matching FR-3 and FR-4.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid | Diagram rendering | Use (already in repo) | All existing files use it; no new dependency needed |

  ## Security Considerations

  None. This is a static markdown file with no executable code, no user input,
  and no network requests. There are no authentication, authorization, or data
  safety concerns.

  ## Performance Implications

  None. A ~15-line markdown file has negligible impact on repository size or
  any tooling that processes the repo.

  ## Architecture Notes

  The file is placed at the repository root alongside the four existing
  STATE_MACHINE files. It is entirely self-contained and modifies no existing
  files, making the change trivially reversible. The naming convention
  (ALL_CAPS + underscores + _STATE_MACHINE.md) is preserved exactly.
