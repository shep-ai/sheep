content: |
  ## Architecture Overview

  The repo root already contains five STATE_MACHINE markdown files, each following
  the same minimal structure: H1 heading, one descriptive sentence, and a fenced
  Mermaid stateDiagram-v2 block. TRAFFIC_LIGHT_STATE_MACHINE.md slots directly into
  this pattern as a sixth file.

  The feature requires no architectural decisions beyond file placement and content
  format — both of which are dictated by the existing convention.

  ## Key Design Decisions

  ### 1. File Structure
  **Chosen:** H1 + one-sentence description + stateDiagram-v2 block (<=25 lines)
  **Rationale:** Matches every existing STATE_MACHINE file exactly (see TURNSTILE,
  ELEVATOR, DOOR_LOCK, VENDING_MACHINE). Deviating would break visual consistency
  with no benefit.

  ### 2. Diagram Syntax
  **Chosen:** `stateDiagram-v2`
  **Rationale:** All existing files use stateDiagram-v2. Using the deprecated v1
  or a generic flowchart would be semantically incorrect and inconsistent.

  ### 3. Subject Matter
  **Chosen:** Traffic Light (Red -> Green -> Yellow -> Red)
  **Rationale:** Canonical state machine example; exactly 3 states and 3 transitions
  forming a closed loop; not yet in the repo; requires zero domain explanation.

  ## Implementation Strategy

  Single phase: create the file. No setup, no teardown, no refactoring of existing
  content. The file is self-contained and trivially reversible.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect Mermaid syntax breaks GitHub rendering | Verify against stateDiagram-v2 spec; cross-check with existing repo files |
  | File name typo violates NFR-3 naming convention | Use exact name: TRAFFIC_LIGHT_STATE_MACHINE.md (all caps, underscores) |
  | File exceeds 25-line limit (NFR-4) | Target ~10 lines matching TURNSTILE_STATE_MACHINE.md length |
