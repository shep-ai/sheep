# Markdown content (the full tasks document)
content: |
  ## Status

  - **Phase:** Implementation (ready to start)
  - **Updated:** 2026-03-24
  - **Total Tasks:** 6 (distributed across 3 phases)
  - **Estimated Effort:** 70 minutes

  ## Summary

  This feature implements a straightforward markdown file creation workflow in 6 tasks across 3 phases:

  **Phase 1 (Foundation):** Tasks 1-2 establish the module structure and define meaningful prose content.
  The feature module is created with proper error handling infrastructure, then populated with a
  meaningful title and 2-3 sentences of prose that are thematically related.

  **Phase 2 (File Creation & Validation):** Tasks 3-4 create the markdown file with proper UTF-8 encoding
  and Unix LF line endings, then run comprehensive validation (5 checks) to ensure all requirements are met
  before any git operations. Validation includes: file non-existence check, encoding (no BOM), line endings
  (LF only), structure (H1 + 2-3 sentences), and file size (300-600 bytes).

  **Phase 3 (Git Integration):** Tasks 5-6 implement the git workflow (add, commit with conventional message, push)
  and complete end-to-end integration testing. Git operations only execute after all validation passes, ensuring
  no repository pollution if errors occur.

  The implementation follows the well-established pattern from features 150-195, particularly feature 193 which
  provides a direct code reference. All code uses only Python 3.11+ standard library (pathlib, subprocess, sys)
  with no external dependencies.

  ## Implementation Order

  1. **Task 1** (10 min) - Module skeleton: Create file with imports, constants, main function
  2. **Task 2** (5 min) - Prose content: Define TITLE and PROSE with meaningful content
  3. **Task 3** (10 min) - File creation: Implement create_file() with proper encoding/line endings
  4. **Task 4** (20 min) - Validation: Implement 5 validation functions (encoding, line endings, structure, size, existence)
  5. **Task 5** (15 min) - Git operations: Implement add, commit, push with subprocess
  6. **Task 6** (10 min) - Integration test: Verify complete workflow and output quality

  **Total: 70 minutes** (estimated for full implementation including testing and verification)

  ## Key Task Dependencies

  - Task 2 depends on Task 1 (need module before adding content)
  - Task 3 depends on Task 2 (need content before creating file)
  - Task 4 depends on Task 3 (need file before validating)
  - Task 5 depends on Task 4 (validation must pass before git)
  - Task 6 depends on Task 5 (integration test is final step)

  All tasks are sequential by design (no parallelization possible).

  ## Testing Strategy (TDD Cycles)

  Each task includes RED-GREEN-REFACTOR TDD cycle:

  **RED:** Write test/assertion that fails (what we're implementing)
  **GREEN:** Write minimal implementation to pass the test
  **REFACTOR:** Clean up, improve clarity (if needed)

  Example (Task 3):
  - **RED:** Assert file doesn't exist, call create_file(), assert file exists with correct content
  - **GREEN:** Implement pathlib.Path.write_text() with encoding and newline parameters
  - **REFACTOR:** Verify no unnecessary code, check error handling

  For git operations (Task 5) and integration test (Task 6), "test" is subprocess execution verification
  and manual end-to-end testing.

  ## Quality Assurance Points

  - **Encoding validation:** Binary check for UTF-8 BOM (0xEF 0xBB 0xBF) — catches common encoding issues
  - **Line ending validation:** Binary checks reject CRLF (\r\n) and CR (\r) — ensures cross-platform consistency
  - **Structural validation:** Explicit H1 check and period counting — verifies markdown format
  - **Size validation:** Prevents truncation or padding — detects corruption
  - **Existence check:** Prevents accidental overwrites — safety mechanism
  - **Integration test:** End-to-end verification of complete workflow

  ## Success Criteria (Detailed)

  All of the following must be true when Task 6 completes:

  1. **File Existence:** `test-niog0h.md` exists in repository root
  2. **File Content:** H1 heading as first line, blank line, 2-3 sentences of prose
  3. **Encoding:** UTF-8 text without BOM
  4. **Line Endings:** Unix LF only (no CRLF)
  5. **Markdown Syntax:** Follows CommonMark specification
  6. **Prose Quality:** Meaningful, coherent, thematically related to title
  7. **File Size:** 250-600 bytes
  8. **Git Staging:** File visible in `git status`
  9. **Commit:** History shows commit with message `feat(196): Create markdown file test-niog0h.md with title and prose content`
  10. **Push:** Commit pushed to origin/feat/196-markdown-file-creation-be60a2
  11. **Existing Files:** All 195+ test-*.md files remain unmodified
  12. **Source Code:** No changes to src/sheep/ (except new feature_196_markdown_file_creation.py)

