# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-24
  - **Estimated Implementation Time:** 60-90 minutes (6 tasks across 3 phases)

  ## Architecture Overview

  This feature implements a simple markdown file creation workflow following the established pattern
  from features 150-195 (196+ test markdown files already in repository). The implementation is isolated
  to a single feature module with no dependencies on other Sheep platform components.

  ### Architecture Pattern (Matches Features 150-195)

  **Module Location:** `src/sheep/features/feature_196_markdown_file_creation.py`

  **Three-Phase Workflow:**
  1. **Content Definition Phase** - Define title and prose content (constants in code)
  2. **File Creation & Validation Phase** - Create file with proper encoding, run 5 validation checks
  3. **Git Integration Phase** - Add to git, commit with conventional message, push to remote

  **Execution Flow:**
  ```
  check_file_does_not_exist() → create_file() → validate_encoding() → validate_line_endings()
  → validate_structure() → validate_file_size() → git_add() → git_commit() → git_push()
  ```

  **Error Handling Strategy:** Any error in phases 1-2 prevents phase 3 execution (no git pollution)

  ### Integration with Existing Codebase

  - **No modifications to existing code** - Pure feature creation
  - **No external dependencies** - Uses only Python 3.11+ standard library
  - **Follows established patterns** - Matches feature 193-195 structure exactly
  - **No source code dependencies** - Sheep platform doesn't need modification
  - **Git available in environment** - Standard git CLI integration

  ### File Structure

  ```
  src/sheep/features/
  └── feature_196_markdown_file_creation.py
      ├── Constants: FILENAME, TITLE, PROSE
      ├── Validation functions: check_file_does_not_exist(), validate_encoding(),
      │                         validate_line_endings(), validate_structure(),
      │                         validate_file_size()
      ├── File operations: create_file()
      ├── Git operations: git_add(), git_commit(), git_push()
      └── Main orchestration: main()
  ```

  ## Key Design Decisions

  ### Decision 1: Prose Content Generation Approach
  **Chosen:** Hardcoded meaningful prose with thematically related title (not LLM generation or templates)

  **Rationale:**
  - Feature 193 and all 196+ existing test markdown files use hardcoded prose
  - Proven successful pattern with high-quality output (examples: test-9zebfj.md, test-yqu2yr.md)
  - No external API calls, network dependencies, or rate limiting
  - Simple, reliable, zero latency, fully deterministic
  - Satisfies spec requirement: meaningful prose with title-content relationship

  **Implementation Detail:**
  ```python
  TITLE = "The Power of Curiosity"  # or similar meaningful title
  PROSE = """Curiosity drives human progress and innovation, pushing us to explore beyond familiar boundaries.
  Throughout history, curious minds have challenged assumptions and discovered profound truths.
  This fundamental quality connects us to endless possibilities and growth."""
  ```

  ### Decision 2: File I/O Implementation
  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and `newline="\n"`

  **Rationale:**
  - Feature 193 pattern: `Path(filename).write_text(content, encoding="utf-8", newline="\n")`
  - Part of Python 3.11+ standard library (satisfies NFR-2: no external dependencies)
  - Cross-platform: handles path separators and line endings on Windows/Mac/Linux
  - Explicit `newline="\n"` ensures Unix LF line endings on all platforms
  - Cleaner API than built-in `open()` with context manager
  - Direct precedent from features 150-195

  **Why not alternatives:**
  - Not `open()` with context manager: More verbose, error-prone if newline parameter forgotten
  - Not external libraries: Adds dependencies when standard library is sufficient

  ### Decision 3: File Validation Strategy
  **Chosen:** Comprehensive validation (5 checks, all must pass before git operations)

  **Rationale:**
  - Spec explicitly requires comprehensive validation (openQuestions resolved)
  - Feature 193 pattern implements all 5 validation functions
  - Quick execution (~2-5ms total) with minimal overhead
  - Catches errors early: fails before any git operations (no repository pollution)
  - Ensures output meets all requirements before commit
  - Matches quality standards of features 150-195

  **Five Validation Checks:**
  1. `check_file_does_not_exist()` - Prevent accidental overwrites
  2. `validate_encoding()` - Verify UTF-8 without BOM (binary check: file should not start with 0xEF 0xBB 0xBF)
  3. `validate_line_endings()` - Verify Unix LF only (binary check: reject CRLF \r\n and CR \r)
  4. `validate_structure()` - Verify H1 heading on line 1, exactly 2-3 sentences (period-based counting)
  5. `validate_file_size()` - Verify 300-600 bytes (pathlib.Path.stat().st_size)

  **Why comprehensive validation:**
  - Encoding issues: BOM can cause problems in some tools
  - Line ending issues: CRLF causes git diffs to show entire file changed, breaks CI/CD
  - Structure issues: Missing H1 or wrong sentence count violates requirements
  - Size issues: Truncation (too small) or padding (too large) indicates corruption

  ### Decision 4: Sentence Counting
  **Chosen:** Simple period counting: `text.count(".")`

  **Rationale:**
  - Feature 193 pattern uses exact approach
  - Prose is well-formed with clear sentence boundaries (one period per sentence)
  - No external dependencies (NLP libraries like NLTK/spacy are overkill)
  - Reliable for controlled markdown content in this context
  - Requirement is 2-3 sentences; prose will be written to have exactly 2-3 periods

  **Why not alternatives:**
  - Not regex-based sentence segmentation: Fragile with abbreviations, ellipses, edge cases
  - Not NLP libraries: Adds dependencies, overkill for simple period counting, increases complexity

  ### Decision 5: Git Operations Implementation
  **Chosen:** `subprocess.run()` for all git operations (add, commit, push)

  **Rationale:**
  - Feature 193 pattern: `subprocess.run(["git", "add", filename], check=True, capture_output=True)`
  - Simple, direct, transparent: easy to debug and understand
  - Part of Python 3.11+ standard library (satisfies NFR-2)
  - Cross-platform: works on Windows, Mac, Linux
  - `check=True` raises CalledProcessError on git failures (fail fast)
  - `capture_output=True` prevents noise in terminal
  - Matches codebase pattern (features 150-195 all use subprocess)

  **Why not GitPython:**
  - GitPython abstraction layer adds overhead for simple linear workflow
  - Subprocess more transparent for debugging
  - Direct git commands easier to understand and verify
  - Feature 193 proven subprocess sufficient and preferable

  ### Decision 6: Commit Message Format
  **Chosen:** Conventional Commits format: `feat(196): Create markdown file test-niog0h.md with title and prose content`

  **Rationale:**
  - Spec requirement FR-8: exact format specified
  - Matches Conventional Commits specification (https://www.conventionalcommits.org/)
  - Consistent with recent commits in repository (features 190-195)
  - Type: `feat` (new feature), scope: `196` (feature number)
  - Feature 193 uses identical format pattern

  ### Decision 7: Error Handling
  **Chosen:** Comprehensive try-except with specific exception types and exit codes

  **Rationale:**
  - Feature 193 pattern distinguishes between error types for better diagnostics
  - Descriptive error messages help debugging
  - Exit code 1 allows CI/CD to detect failures
  - Catches: FileExistsError, FileNotFoundError, ValueError (validation), CalledProcessError (git)
  - Outputs errors to stderr (sys.stderr)

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation) must come first:**
  - Module structure and main function are prerequisites for all other code
  - Prose content must be defined before file creation
  - Error handling infrastructure needed for phases 2-3

  **Phase 2 (File Creation & Validation) must come before Phase 3:**
  - File must be created before git operations
  - Validation must pass before committing to repository
  - Early failures prevent repository pollution

  **Phase 3 (Git Integration) comes last:**
  - Only executes after file is created and validated
  - Commits to repository only if phases 1-2 pass
  - Pushes to remote as final step

  ### TDD Cycle for Each Task

  Each task follows RED-GREEN-REFACTOR:

  **RED:** Write test/assertion that fails (what we're implementing)
  **GREEN:** Write minimal implementation to pass the test
  **REFACTOR:** Clean up code, extract helpers, improve naming (if needed)

  For integration-level tasks (like git operations), "test" is manual verification/integration test.

  ### Task Dependencies

  All tasks are sequential (each depends on previous):
  - Task 1 (module skeleton) must complete before Task 2
  - Task 2 (content definition) must complete before Task 3
  - Task 3 (file creation) must complete before Task 4
  - Task 4 (validation) must complete before Task 5
  - Task 5 (git operations) must complete before Task 6
  - Task 6 (integration test) is final verification

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File already exists in repo | Low | Medium | check_file_does_not_exist() prevents overwrites; explicit FileExistsError |
  | Encoding issues (BOM, non-UTF8) | Low | High | validate_encoding() catches before git; strict binary checks for BOM |
  | Line ending issues (CRLF vs LF) | Low | High | explicit newline="\n" in write_text(); validate_line_endings() confirms |
  | Git push fails (network/auth) | Low | Medium | Validation phase succeeds; file staged locally; CI/CD detects failure |
  | Sentence count wrong | Low | Medium | validate_structure() counts periods; prose written with exactly 2-3 periods |
  | File size unexpected | Low | Low | validate_file_size() ensures 300-600 bytes; unlikely given prose length |
  | Prose is incoherent/low quality | Very Low | Low | Feature 193 precedent; meaningful prose proven successful; title-content related |
  | Git command not available | Very Low | High | Assume git CLI available (standard in all environments); error if missing |
  | Existing test files modified | Very Low | High | This feature only creates test-niog0h.md; no modifications to existing files |

  ## Technology Justification

  All technology choices align with constraints (NFR-2: no external dependencies beyond Python 3.11+ standard library):

  | Technology | Why | Alternative | Why Rejected |
  | ---------- | --- | ----------- | ----------- |
  | pathlib | Standard library, cross-platform, explicit encoding control | open() + context manager | More verbose, error-prone if newline forgotten |
  | subprocess | Standard library, simple for add/commit/push | GitPython | Abstraction overhead; subprocess more transparent |
  | Period counting | Simple, reliable for well-formed prose | NLTK/spacy NLP | Overkill; adds dependencies; unnecessary for controlled content |
  | Hardcoded prose | Simple, reliable, matches 196+ precedents | Claude/OpenAI API | Network dependency; overkill; hardcoded proven successful |
  | Binary validation | Catches BOM and CRLF accurately | Text-based checks | Miss edge cases; binary view is ground truth |

