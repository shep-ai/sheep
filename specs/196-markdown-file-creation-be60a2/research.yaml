  **Feature Implementation Pattern:**
  - File: `src/sheep/features/feature_196_markdown_file_creation.py`
  - Module provides main() orchestration function
  - Called by Sheep workflow engine (feature execution agent)
  - No source code modifications to Sheep platform needed
  - Isolated to this single feature implementation file

  **Codebase Pattern Consistency:**
  - Matches feature 193-195 implementation pattern exactly
  - Uses same validation approach (five validation functions)
  - Uses same git workflow (subprocess add/commit/push)
  - Uses same file I/O (pathlib.Path.write_text)
  - Error handling matches existing pattern
  - Fits into 196+ test file creation pattern seamlessly

  **No External Dependencies:**
  - Uses only Python 3.11+ standard library
  - Satisfies NFR-2 (no external package dependencies)
  - Git dependency is already available in environment (git CLI)

  ### Directory Structure Impact

  **Files Created:**
  - `test-niog0h.md` in repository root (same level as .git, src/, specs/)
  - Follows naming convention: `test-<6-char-id>.md`
  - Adds to collection of 196+ existing test markdown files

  **Files Modified:**
  - None (this is purely file creation, no modifications to existing files)

  **Directory Structure:**
  - No new directories created
  - No changes to existing directory structure
  - Repository organization unchanged

  ## Implementation Workflow

  **Phase 1: File Creation**
  1. Check file does not exist (prevent overwrites)
  2. Create markdown content: `# {TITLE}\n\n{PROSE}\n`
  3. Write to disk with pathlib.Path.write_text() (UTF-8, LF line endings)
  4. Confirm file exists and is readable

  **Phase 2: Comprehensive Validation**
  5. Validate UTF-8 encoding (no BOM)
  6. Validate Unix LF line endings (no CRLF or CR)
  7. Validate markdown structure (H1 heading + 2-3 sentences)
  8. Validate file size (300-600 bytes)
  - All validation must pass before proceeding to Phase 3
  - Early exit on any validation failure

  **Phase 3: Git Operations** (only if Phase 2 passes)
  9. Stage file: `git add test-niog0h.md`
  10. Commit with message: `feat(196): Create markdown file test-niog0h.md with title and prose content`
  11. Push to remote: `git push -u origin HEAD`

  **Success Output:**
  - File exists in repository root
  - File visible in `git status`
  - Commit visible in `git log`
  - All 195+ existing test files unchanged

