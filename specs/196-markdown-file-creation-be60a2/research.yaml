# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24

  ## Technology Decisions

  ### 1. File Creation and Encoding (pathlib.Path.write_text)

  **Chosen:** Python pathlib.Path.write_text() with explicit UTF-8 encoding and newline="\n"

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  filename = "test-niog0h.md"
  content = f"# {TITLE}\n\n{PROSE}\n"
  Path(filename).write_text(content, encoding="utf-8", newline="\n")
  ```

  **Rationale:**
  - Standard library (no additional dependencies) - satisfies NFR-2
  - Cross-platform path handling and file operations
  - Explicit parameters ensure UTF-8 encoding and Unix LF line endings on all platforms
  - Clean, intuitive API compared to built-in open()
  - Matches feature 193 pattern exactly
  - Python 3.11+ (required version) has mature pathlib implementation

  ### 2. Prose Content Generation

  **Chosen:** Hardcoded meaningful prose with thematically related title

  **Implementation Pattern:**
  ```python
  FILENAME = "test-niog0h.md"
  TITLE = "[Meaningful title related to prose topic]"
  PROSE = "[2-3 sentences of coherent, meaningful prose related to title]"
  ```

  **Rationale:**
  - Feature 193 uses hardcoded prose ("The Journey of a Thousand Miles") - proven successful pattern
  - All 196+ existing test markdown files use hardcoded prose, establishing quality baseline
  - No external API calls, network dependencies, or rate limiting
  - Zero latency, fully deterministic
  - Prose can be meaningful and professional (precedents demonstrate this)
  - Title and prose must be thematically related (spec requirement)
  - Example precedent: test-9zebfj.md has title "The Power of Curiosity" with prose about how curiosity drives progress

  ### 3. File Validation (Comprehensive)

  **Chosen:** Five validation checks before any git operations

  **Validation Functions (following feature 193 pattern):**

  1. **validate_encoding()** - Check UTF-8 without BOM
     - Read file as binary
     - Check for UTF-8 BOM (bytes 0xEF 0xBB 0xBF)
     - Attempt UTF-8 decode to verify valid encoding

  2. **validate_line_endings()** - Check for Unix LF only
     - Read file as binary
     - Reject Windows CRLF (\r\n) - most common issue
     - Reject Mac CR (\r) - legacy issue
     - pathlib.Path.write_text() with newline="\n" ensures this, but validation confirms

  3. **validate_structure()** - Check H1 heading and sentence count
     - Verify first line starts with "# " (H1 heading)
     - Count sentences in prose (period-based counting)
     - Ensure 2-3 sentences (no more, no less)

  4. **validate_file_size()** - Check size within 300-600 bytes
     - Use pathlib.Path.stat().st_size
     - Catches truncation (too small) or padding (too large)
     - Typical markdown file (heading + 2-3 sentences) = ~350-500 bytes

  5. **check_file_does_not_exist()** - Prevent overwrites
     - Run before creation
     - Raise FileExistsError if file exists
     - Safety check against accidental overwrites

  **Execution Order:** All validation completes before ANY git operations (Phase 2 before Phase 3)

  ### 4. Sentence Counting

  **Chosen:** Simple period counting: text.count(".")

  **Implementation Pattern:**
  ```python
  def count_sentences(text: str) -> int:
      return text.count(".")
  ```

  **Rationale:**
  - Feature 193 uses this exact approach
  - Prose will be well-formed with clear sentence boundaries (one period per sentence)
  - No dependencies on NLTK, spacy, or regex complexity
  - Reliable for controlled markdown content
  - Requirement is 2-3 sentences, prose written to have exactly 2-3 periods

  ### 5. Git Operations (subprocess)

  **Chosen:** Python subprocess.run() for git add, commit, and push

  **Implementation Pattern:**
  ```python
  import subprocess

  # Stage file
  subprocess.run(["git", "add", filename], check=True, capture_output=True)

  # Commit with conventional message
  subprocess.run(["git", "commit", "-m", message], check=True, capture_output=True)

  # Push to remote
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True, capture_output=True)
  ```

  **Parameters Explanation:**
  - `check=True`: Raise CalledProcessError on non-zero exit (fail fast on git errors)
  - `capture_output=True`: Capture stdout/stderr to prevent noise in terminal
  - `-u origin HEAD`: Set upstream tracking and push to current branch

  **Rationale:**
  - Feature 193 uses subprocess exclusively
  - Simple, direct, transparent - easy to debug
  - Standard library (no external dependencies)
  - Cross-platform (Windows/Mac/Linux)
  - GitPython (in dependencies) unnecessary for linear add→commit→push workflow
  - No abstraction layer overhead

  ### 6. Commit Message Format

  **Chosen:** Conventional Commits format following codebase pattern

  **Format:**
  ```
  feat(196): Create markdown file test-niog0h.md with title and prose content
  ```

  **Rationale:**
  - Feature 193 uses: `feat(193): create markdown file test-yqu2yr.md`
  - Matches Conventional Commits specification (https://www.conventionalcommits.org/)
  - Consistent with recent commits in repository (features 190-195)
  - Requirement FR-8 specifies exact format
  - Type is "feat" (new feature), scope is feature number (196)

  ### 7. Error Handling Strategy

  **Chosen:** Comprehensive try-except with specific exception types and exit codes

  **Error Types Handled:**
  - `FileExistsError`: File already exists (check_file_does_not_exist)
  - `FileNotFoundError`: File missing after creation or during validation
  - `ValueError`: Validation failures (encoding, line endings, structure, size)
  - `subprocess.CalledProcessError`: Git operations failures
  - `Exception`: Catch-all for unexpected errors

  **Exit Codes:**
  - `0`: Success (implicit)
  - `1`: Any error condition

  **Rationale:**
  - Feature 193 pattern distinguishes between error types for better diagnostics
  - Descriptive error messages help debugging
  - Exit code 1 allows CI/CD to detect failures
  - Matches codebase error handling convention

  ## Library Analysis

  | Library/Module | Purpose | Use/Reject | Reasoning |
  | -------------- | ------- | ---------- | --------- |
  | pathlib | File I/O and path handling | **USE** | Standard library, cross-platform, matches feature 193 pattern, satisfies NFR-2 (no external dependencies) |
  | subprocess | Git command execution | **USE** | Standard library, simple for add/commit/push workflow, matches feature 193 pattern |
  | sys | System exit codes and stderr | **USE** | Standard library, needed for sys.exit() and sys.stderr output |
  | GitPython | Git abstraction layer | **REJECT** | Already in dependencies but abstraction overhead unnecessary for simple linear workflow; subprocess more transparent and matches codebase pattern |
  | NLTK/spacy | NLP sentence segmentation | **REJECT** | Overkill for simple period counting; adds external dependencies; not justified for well-formed markdown prose |
  | Claude/OpenAI API | Dynamic prose generation | **REJECT** | Adds complexity, API calls, rate limiting, network failure modes; hardcoded meaningful prose proven successful in 196+ test files |
  | Template engines (Jinja2, etc.) | Dynamic content generation | **REJECT** | Unnecessary abstraction for single static file; hardcoded content is simpler and matches codebase pattern |

  ## Security Considerations

  ### File System Security

  **UTF-8 Encoding (no BOM):**
  - BOM (byte order mark) can cause file parsing issues in some tools
  - Validation ensures UTF-8 without BOM
  - Explicit encoding parameter prevents BOM injection

  **Unix LF Line Endings:**
  - Cross-platform consistency prevents issues in git diffs and CI/CD
  - Validation rejects CRLF (Windows) and CR (Mac) line endings
  - Explicit newline="\n" parameter ensures LF on all platforms

  **File Existence Check:**
  - Prevents accidental overwrites of existing files
  - check_file_does_not_exist() runs before creation
  - Raises FileExistsError if file exists

  ### Git Operations Security

  **Command Injection Prevention:**
  - subprocess.run() with list argument (not shell=True) prevents shell injection
  - Filename and message come from code constants, not user input
  - No user input in git commands

  **Safe Error Handling:**
  - check=True raises exception on git failures (no silent failures)
  - Detailed error messages help identify issues
  - Exit code 1 signals failures to CI/CD

  ### Content Security

  **Hardcoded Prose:**
  - No external content sources (API, file, network)
  - No template injection or code evaluation
  - Static content written at implementation time
  - No dynamic code execution in prose content

  ## Performance Implications

  ### File Operations Performance

  **File Creation:** ~1 millisecond
  - Single write_text() call
  - File size ~350-500 bytes
  - No streaming or buffering needed

  **Validation Performance:** ~2-5 milliseconds total
  - Five validation functions, each very fast
  - read_bytes() for encoding/line ending checks: ~1ms
  - read_text() for structure validation: ~1ms
  - File size check (stat()): <1ms
  - String operations (split, count, startswith) on small text: <1ms

  **Git Operations Performance:** ~100-500 milliseconds total
  - Network I/O dominates (git push to remote)
  - Local operations (add, commit): ~10-50ms each
  - Network latency to git server: ~50-500ms (depends on network/server)
  - Total workflow: file creation + validation + git ~100-600ms expected

  **Total Estimated Execution Time:** ~200-700 milliseconds
  - File creation and validation: ~10ms
  - Git operations (especially push): ~100-500ms
  - Overhead and buffer: ~50-100ms

  **No Performance Bottlenecks:**
  - Single-file operation (not batch)
  - No loops or repeated operations
  - No database queries or external API calls (except git over network)
  - Operation is I/O bound (network git push), not CPU bound
  - All operations complete within acceptable ~1-2 second timeframe

