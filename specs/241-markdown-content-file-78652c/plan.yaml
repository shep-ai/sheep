# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 241 implements markdown file creation following the well-established pattern deployed
  170+ times across features 069-240. The implementation leverages the proven `src/create_markdown.py`
  utility module, which provides the complete orchestration function `create_and_commit_markdown_file()`.

  This architecture:
  - **Eliminates code duplication** — Reuses validated code rather than reimplementing file I/O, validation, and git operations
  - **Ensures consistency** — File 241 matches all prior implementations in structure, encoding, line endings, and quality
  - **Integrates seamlessly** — Uses sheep framework's `sheep.config.llm` for Claude API access and `sheep.observability.logging` for structured logging
  - **Provides defense-in-depth validation** — Content validation during generation + file validation post-creation catches errors at multiple stages
  - **Handles errors robustly** — Specific exception handling, retry logic for network operations, clear error messages

  The feature is purely additive (new file, no modifications to existing code or infrastructure) and has
  no impact on application logic, CI/CD systems, or other features.

  ## Key Design Decisions

  ### 1. Reuse Existing Utility Module (create_markdown.py)

  **Decision:** Import `create_and_commit_markdown_file()` from `src/create_markdown.py` rather than implementing
  file creation logic directly.

  **Rationale:**
  - **Proven in production** — Used by 170+ similar features (069-240) without modification or incident
  - **Comprehensive validation** — Already includes content validation, file encoding checks, git config validation
  - **Error handling** — Specific exception types, retry logic with exponential backoff, timeout enforcement
  - **Avoids duplication** — Eliminates code duplication across 241 implementations
  - **Maintainability** — Bug fixes in utility automatically benefit all dependent features

  **Alternatives considered:**
  - Implement file creation directly → Duplicates tested code; breaks consistency with established patterns
  - Create new shared utility → Unnecessary; proven utility already exists

  ### 2. Content Generation via Claude API

  **Decision:** Use `sheep.config.llm` (Claude API integration) for prose generation with validation.

  **Rationale:**
  - Existing utility already implements this (lines 40-109 in create_markdown.py)
  - Analysis of 170+ existing test files shows high-quality, topic-relevant prose (not placeholders)
  - Spec requirement "about any topic" enables implementer freedom in topic selection
  - Includes validation: sentence count (2-3), prose length (100-300 chars), vocabulary variety (≥10 unique words)
  - Retry logic handles transient API failures

  ### 3. File I/O with Explicit Encoding Control

  **Decision:** Use `pathlib.Path.write_text()` with `encoding="utf-8"` and `newline="\n"` parameters.

  **Rationale:**
  - Guarantees UTF-8 encoding without BOM (Byte Order Mark)
  - Enforces Unix LF line endings on all platforms (Windows/Linux/macOS via newline parameter)
  - Idiomatic Python 3.11+ approach (pathlib is standard library)
  - Already proven in create_markdown.py (line 380)
  - Atomic file creation (single method call, no manual encoding needed)

  ### 4. Git Operations via subprocess

  **Decision:** Use `subprocess.run()` with `shell=False` and command list format for all git operations.

  **Rationale:**
  - Prevents command injection attacks by passing arguments as list (not shell string)
  - Provides clear error handling with specific exception types (CalledProcessError, TimeoutExpired)
  - Includes retry logic with exponential backoff for network operations (push, auth check)
  - Timeout enforcement (30 seconds) prevents indefinite waiting on network operations
  - Already proven in create_markdown.py (lines 607-847)

  ### 5. Dual-Phase Validation

  **Decision:** Validate prose content during generation, then validate actual file post-creation.

  **Rationale:**
  - Content validation (during generation) prevents invalid prose from being written
  - File validation (post-creation) catches file system issues (encoding drift, line ending conversion, permission errors)
  - Both phases required for comprehensive error detection
  - Utility logs validation failures with context for debugging
  - Already proven in create_markdown.py (lines 112-208, 388-604)

  ## Implementation Strategy

  Feature 241 implementation is straightforward because production-proven utility code already exists:

  **Phase 1: Utility Integration & File Creation**
  1. Verify prerequisites — Git config exists (user.name, user.email), feature branch checked out, target file doesn't exist
  2. Import and invoke `create_and_commit_markdown_file()` from `src/create_markdown.py` with parameters:
     - `filename="test-zgsuo4.md"`
     - `branch_name="feat/241-markdown-content-file-78652c"`
  3. Function orchestrates complete workflow internally:
     - Generate coherent prose via Claude API (2-3 sentences, 100-300 chars)
     - Validate prose (sentence count, length, vocabulary variety)
     - Create file with pathlib.write_text() (UTF-8, LF line endings)
     - Validate file encoding and structure
     - Stage file: `git add test-zgsuo4.md`
     - Commit: `git commit -m "feat(241): Create markdown file test-zgsuo4.md with prose content"`
     - Push: `git push origin feat/241-markdown-content-file-78652c`
  4. Verify results — Check file exists, git log shows correct commit, remote branch updated

  This single-phase approach is appropriate because:
  - No architectural decisions needed (utility pattern proven)
  - No setup required beyond prerequisite checks
  - No modifications to existing code or configuration
  - Feature is purely additive (new file)
  - Utility handles all complexity internally

  ## Risk Mitigation

  | Risk | Mitigation Strategy |
  | ---- | ------------------- |
  | Git configuration missing (user.name, user.email) | Utility validates git config before attempting commit; fails fast with clear error if missing |
  | File already exists (unexpected state) | Utility checks `Path.exists()` before writing; raises FileExistsError if file present, preventing overwrites |
  | Claude API unavailable or rate limited | Utility includes retry logic with exponential backoff (3 retries: 1s, 2s, 4s delays) to handle transient failures |
  | Network error during push to remote | Utility distinguishes retryable errors (network, timeout) from non-retryable (auth, branch not found); retries network errors up to 3 times |
  | Generated prose fails validation (sentence count, length) | Utility validates during generation; retries prose generation if validation fails (up to 3 retries) before giving up |
  | File system encoding issues (CRLF on Windows) | Utility enforces `newline="\n"` parameter to pathlib.write_text(); guarantees LF line endings on all platforms |
  | Commit or push fails silently | Utility uses subprocess.run() with explicit return code checking; raises CalledProcessError if commands fail, no silent failures |
  | File validation fails post-creation | Utility validates actual written file (encoding, line endings, structure); fails before pushing if validation fails; errors with context |
  | Feature branch doesn't exist | Utility validates branch exists before push; fails with clear error if branch not found on remote |
