content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-zgsuo4.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 170+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-240, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] Markdown file `test-zgsuo4.md` is created at repository root
  - [ ] File contains a markdown heading (H1, prefixed with `#`) serving as the title
  - [ ] File contains exactly 2-3 sentences of prose content below the heading
  - [ ] File uses UTF-8 encoding with no BOM (Byte Order Mark)
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File follows CommonMark markdown specification syntax
  - [ ] File size is approximately 400-600 bytes (natural result of proper structure)
  - [ ] File is staged in git using `git add test-zgsuo4.md`
  - [ ] File is committed with conventional commit message: `feat(241): Create markdown file test-zgsuo4.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/241-markdown-content-file-78652c`
  - [ ] Prose content is coherent, meaningful, and topic-relevant
  - [ ] File does not exist in repository before implementation (no overwrites)

  ## Functional Requirements

  - **FR-1**: System SHALL create a markdown file named `test-zgsuo4.md` at the repository root directory
  - **FR-2**: File MUST contain a markdown H1 heading (prefixed with `#`) as the title
  - **FR-3**: File MUST contain exactly 2 or 3 sentences of prose content following the heading, separated by a blank line
  - **FR-4**: File MUST use UTF-8 character encoding without BOM
  - **FR-5**: File MUST use LF (Unix-style) line endings throughout
  - **FR-6**: File content MUST conform to CommonMark markdown specification
  - **FR-7**: File content MUST be coherent and meaningful prose relevant to the chosen topic
  - **FR-8**: File MUST be staged in git using conventional `git add` workflow
  - **FR-9**: Changes MUST be committed to git with message format: `feat(241): Create markdown file test-zgsuo4.md with prose content`
  - **FR-10**: Committed changes MUST be pushed to the feature branch `feat/241-markdown-content-file-78652c`
  - **FR-11**: Implementation MUST use Python pathlib module for file I/O operations
  - **FR-12**: Implementation MUST NOT modify any existing files or repository structure

  ## Non-Functional Requirements

  - **NFR-1 (Performance)**: File creation and git operations MUST complete in less than 60 seconds
  - **NFR-2 (Code Quality)**: Implementation code MUST be straightforward, imperative, and understandable (no unnecessary abstraction)
  - **NFR-3 (Consistency)**: File structure and content MUST follow the established pattern demonstrated by 170+ existing test files
  - **NFR-4 (Simplicity)**: Implementation MUST NOT introduce dependencies or modifications to project source code, configuration, or tests
  - **NFR-5 (Isolation)**: Feature MUST have no impact on application logic, agents, flows, tools, or CI/CD systems
  - **NFR-6 (Documentation)**: Commit message MUST accurately describe the file creation action using conventional commit format

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What quality level should the prose content meet? | Coherent and meaningful prose | Examining 170+ existing test files shows consistent quality prose with topic-relevant, grammatically correct content. Maintaining this standard ensures consistency with established patterns and represents the expected quality bar. |
  | 2 | Who should decide the content topic? | Implementer chooses freely | Specification explicitly states "about any topic" and existing test files demonstrate diverse topics (nature, technology, science, history, culture, philosophy). This flexibility aligns with the spec while maintaining consistency with established patterns. |
  | 3 | How strictly should content match the established pattern? | Follow pattern as template | Using 170+ existing files as a guide and template provides consistency with flexibility. This approach has proven successful in prior implementations (features 069-240) and balances uniformity with reasonable flexibility. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zgsuo4.md) to existing collection of 170+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-240; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/241-markdown-content-file-78652c` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 170+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-zgsuo4.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of coherent, meaningful prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness against established pattern)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 170+ identical test files providing clear precedent
  - Topic selection flexibility with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-240) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-zgsuo4.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 170+ prior implementations

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product questions with AI recommendations identified, ready for implementation_
