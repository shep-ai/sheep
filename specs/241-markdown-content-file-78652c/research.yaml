content: |
  ## Technology Decisions

  ### 1. File I/O Implementation Method

  **Chosen:** Use `pathlib.Path.write_text()` with explicit `encoding='utf-8'` and `newline='\n'` parameters

  **Rejected:**
  - `os.open()` with low-level binary mode — requires manual encoding/decoding, more verbose, less idiomatic than pathlib
  - `open()` builtin — lacks explicit newline parameter for cross-platform safety, pathlib is cleaner
  - Writing bytes directly — requires manual UTF-8 encoding, pathlib abstracts this safely

  **Rationale:**
  The pathlib approach is proven in the existing `create_markdown.py` utility (line 380):
  ```python
  target_path.write_text(content, encoding='utf-8', newline='\n')
  ```
  This ensures:
  - UTF-8 encoding guaranteed at creation time (prevents encoding errors)
  - LF line endings on all platforms (Windows/Linux/macOS) via `newline='\n'` parameter
  - Idiomatic Python 3.11+ code
  - Cross-platform file path handling via Path objects
  - Atomic file creation (single method call)

  ### 2. Content Generation Strategy

  **Chosen:** Use Claude API via `sheep.config.llm` with validation and retry logic

  **Rejected:**
  - Hardcoded prose — contradicts spec requirement "about any topic", reduces flexibility
  - Template-based substitution — lacks coherence and semantic quality, fails quality requirements
  - No generation (placeholder) — fails spec requirement for 2-3 sentences of meaningful prose

  **Rationale:**
  Analysis of 170+ existing test files shows high-quality, topic-relevant prose (not placeholders).
  The Claude API approach via `sheep.config.llm` is already proven in `create_markdown.py` (lines 40-109).
  This enables:
  - Unique, coherent prose for each file (prevents duplication)
  - Implementer topic flexibility (Claude chooses freely per spec "about any topic")
  - Quality validation (100-300 chars, 2-3 sentences, vocabulary variety)
  - Retry logic with exponential backoff for API failures
  - Integration with sheep framework's LLM infrastructure

  ### 3. Git Operations Implementation

  **Chosen:** Use `subprocess.run()` with `shell=False` and command list format

  **Rejected:**
  - GitPython library — external dependency; subprocess is in standard library, proven in codebase
  - Shell commands via `shell=True` — command injection vulnerability risk
  - Manual git file manipulation — requires understanding git internals, error-prone

  **Rationale:**
  Subprocess with `shell=False` is the safest approach, proven in `create_markdown.py` (lines 607-847).
  Passing arguments as a list prevents command injection attacks. Implementation includes:
  - Git config validation before committing (user.name, user.email)
  - Clear error messages for common failure modes
  - Retry logic with exponential backoff for push operations
  - Branch verification before push (prevent pushes to non-existent branches)
  - Distinction between retryable (network) and non-retryable (auth) errors

  ### 4. Markdown Content Validation

  **Chosen:** Implement two-phase validation (during generation + post-creation)

  **Rejected:**
  - No validation — risky, no verification of actual file properties on disk
  - Generation-time only — doesn't catch file system encoding issues
  - Post-creation only — doesn't catch bad prose before writing

  **Rationale:**
  Dual validation (as in `create_markdown.py`) provides defense-in-depth:
  1. **Content validation (lines 112-208):** Validates prose during generation, retries on failure
     - Sentence count: exactly 2-3 sentences
     - Prose length: 100-300 characters
     - Vocabulary variety: minimum 10 unique words
     - Markdown structure: H1 heading, blank line separator
  2. **File validation (lines 388-604):** Validates actual written file
     - Encoding: valid UTF-8 without BOM
     - Line endings: LF (not CRLF)
     - Structure: H1 heading, blank line separator, 2-3 sentences
     - File size: 250-600 bytes (natural result of proper structure)

  Both phases must pass; if either fails, operations halt with clear error messages.

  ### 5. Error Handling and Recovery

  **Chosen:** Comprehensive error handling with specific exception types and retry logic for network operations

  **Rejected:**
  - Silent failure (ignore exceptions) — prevents debugging, failures invisible to operators
  - Generic error handling — loses context, difficult root cause analysis
  - Fail immediately without retries — network operations have transient failures

  **Rationale:**
  The `create_markdown.py` module demonstrates robust error handling:
  - Specific exception types (subprocess.CalledProcessError, TimeoutExpired, OSError)
  - Contextual error messages describing what failed and why
  - Retry logic with exponential backoff for network operations
  - Distinction between retryable and non-retryable errors
  - Timeout enforcement on network operations (30 seconds for push)
  This enables operators to understand failures and allows transient issues to resolve automatically.

  ### 6. File Encoding and Line Ending Strategy

  **Chosen:** UTF-8 encoding without BOM and Unix LF line endings via `pathlib.write_text(newline='\n')`

  **Rejected:**
  - Auto-detection of system encoding — produces CRLF on Windows, breaking cross-platform consistency
  - UTF-8 with BOM — adds unnecessary bytes (EF BB BF), not required by spec
  - Manual post-processing — adds complexity and risk of missed conversions

  **Rationale:**
  The `pathlib.write_text(newline='\n')` approach is Python-idiomatic and enforces LF line endings
  on all platforms. Per Python documentation, `newline='\n'` means only LF is used, regardless of OS.
  This satisfies spec requirements:
  - UTF-8 encoding (standard for text files)
  - No BOM (plain UTF-8)
  - LF line endings (Unix standard)
  - Cross-platform consistency

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O with explicit encoding control | **Use** | Standard library, idiomatic Python 3.11+, proven in create_markdown.py |
  | subprocess | Execute git commands safely | **Use** | Standard library, shell=False prevents injection, proven pattern |
  | sheep.config.llm | Claude API integration | **Use** | Framework-provided LLM interface, already in use across codebase |
  | sheep.observability.logging | Structured logging | **Use** | Framework-provided logging, used in create_markdown.py |
  | GitPython | Alternative git library | **Reject** | External dependency; subprocess is safer and in standard library |
  | os module | Low-level file operations | **Reject** | More verbose than pathlib, less idiomatic for modern Python |
  | sys module | System operations | **Reject** | Not needed; pathlib and subprocess handle all requirements |
  | typing module | Type annotations | **Use** | Standard library, already in create_markdown.py, improves code clarity |

  ## Security Considerations

  ### Command Injection Prevention
  - **Threat:** Malicious filenames or git commands executed via shell
  - **Mitigation:** Use `subprocess.run()` with `shell=False` and pass arguments as a list (not a shell string)
  - **Example:** `subprocess.run(['git', 'add', filename], ...)` prevents interpretation of shell metacharacters in filename

  ### File Path Validation
  - **Threat:** Directory traversal via filenames like `../../malicious.md`
  - **Mitigation:** Use `pathlib.Path` which normalizes paths; validate filename format before use
  - **Example:** Check that filename matches pattern `test-[a-z0-9]+\.md`

  ### File Overwrite Protection
  - **Threat:** Accidentally overwriting existing files
  - **Mitigation:** Check `Path.exists()` before writing; raise `FileExistsError` if file exists
  - **Code:** `if target_path.exists(): raise FileExistsError(...)`

  ### UTF-8 Encoding Safety
  - **Threat:** Encoding errors from non-UTF-8 content
  - **Mitigation:** Validate all content is valid UTF-8 before writing; use `encoding='utf-8'` parameter
  - **Validation:** Claude API generates valid UTF-8; pathlib validates during file creation

  ### Git Configuration Validation
  - **Threat:** Commits with missing or invalid git configuration
  - **Mitigation:** Validate `user.name` and `user.email` before attempting commit
  - **Code:** Query git config via subprocess, raise error if missing

  ## Performance Considerations

  ### File Creation Performance
  - **Consideration:** Single file creation is minimal I/O (400-600 bytes)
  - **Optimization:** Pathlib.write_text() is atomic and efficient
  - **Impact:** Negligible; file creation completes in < 1ms

  ### Claude API Latency
  - **Consideration:** API call has variable latency (typically 2-5 seconds)
  - **Optimization:** Retry logic with exponential backoff for transient failures
  - **Impact:** Plan for 10-15 second total time including retries
  - **Mitigation:** Retry limit of 3 with delays (1s, 2s, 4s) prevents indefinite waiting

  ### Git Operations Latency
  - **Consideration:** Network operations (push to remote) may have latency
  - **Optimization:** 30-second timeout on push; retry network errors only
  - **Impact:** Typical push completes in 2-5 seconds; timeout handles network issues
  - **Mitigation:** Distinguish retryable (network) from non-retryable (auth) errors

  ### Validation Performance
  - **Consideration:** Post-creation file validation adds overhead
  - **Optimization:** Validation functions are lightweight (file read + regex matching)
  - **Impact:** Negligible; validation completes in < 100ms

  ### Overall Workflow Performance
  - **Expected:** Total time 10-15 seconds (content generation 5-10s + file/git operations < 5s)
  - **Spec Requirement:** NFR-1 specifies completion in < 60 seconds
  - **Status:** Well within specification

  ## Architecture Notes

  ### Integration with Sheep Framework
  - Implementation leverages existing `sheep.config.llm` for Claude API access
  - Uses `sheep.observability.logging` for structured logging and observability
  - Follows established patterns from 170+ similar features (069-240)
  - No modifications needed to sheep core; feature is standalone utility

  ### Consistency with Established Patterns
  - **170+ existing test files** provide clear precedent for:
    - File naming convention: `test-<random-string>.md`
    - Structure: H1 heading, blank line, 2-3 sentences
    - Encoding: UTF-8, LF line endings
    - Quality: Coherent, meaningful prose relevant to topic
  - Implementation follows exact pattern from `create_markdown.py` (Feature 199)
  - All technology choices validated by prior implementations (Features 069-240)

  ### Git Workflow Integration
  - Feature branch `feat/241-markdown-content-file-78652c` pre-created
  - Commits follow conventional commit format: `feat(241): Create markdown file test-zgsuo4.md with prose content`
  - Git configuration (user.name, user.email) assumed to be already set up
  - No modifications to CI/CD, main branch, or other repositories

  ### Testing and Validation Strategy
  - Post-creation validation ensures file meets all requirements before committing
  - Error handling provides clear feedback if validation fails
  - File is committed only after all validations pass
  - Failure at any step is reported with actionable error messages

  ## Implementation Approach

  ### Recommended Execution Path
  1. Import orchestration function from `src/create_markdown.py`:
     ```python
     from src.create_markdown import create_and_commit_markdown_file
     ```
  2. Call with feature-specific parameters:
     ```python
     result = create_and_commit_markdown_file(
         filename="test-zgsuo4.md",
         branch_name="feat/241-markdown-content-file-78652c"
     )
     ```
  3. Check result dictionary for success/errors
  4. Log completion with file path, commit hash, and branch name

  ### Why Reuse Existing Utility
  - **Proven:** Used by 170+ similar features without modification
  - **Tested:** Comprehensive validation and error handling already in place
  - **Consistent:** Ensures this feature matches established patterns exactly
  - **Efficient:** Avoids code duplication across 241 implementations
  - **Maintainable:** Bugs fixed in one place benefit all features using the utility

