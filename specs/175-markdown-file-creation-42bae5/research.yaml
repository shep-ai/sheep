# Structured technology decisions
decisions:
  - title: "File I/O Implementation Strategy"
    chosen: "pathlib.Path.write_text() with encoding='utf-8' and newline='\\n' parameters"
    rejected:
      - "pathlib.Path.write_bytes() — more verbose and requires manual UTF-8 encoding; the text-based approach is cleaner while providing explicit control"
      - "open() with context manager — less Pythonic than pathlib and requires more boilerplate; pathlib is the modern Python 3.11+ standard library approach"
      - "subprocess with shell redirection (>>) — introduces platform-specific behavior and security risks; pathlib is cleaner and more secure"
    rationale: >
      pathlib.Path.write_text() is optimal because it provides explicit control over both encoding and line endings in a single, clean call. The encoding='utf-8' parameter ensures UTF-8 without BOM (BOM only appears with 'utf-8-sig'), and newline='\n' ensures Unix LF line endings on all platforms without platform-specific conversion. This approach has been validated across 170+ prior features in this repository and is the Python 3.11+ standard. The pattern is explicit, documented, and proven to work reliably across Windows, Linux, and macOS despite git autocrlf settings.

  - title: "File Validation Scope and Timing"
    chosen: "Implement standard validation (structure, encoding, size, line endings) after creation but before git operations"
    rejected:
      - "Minimal validation (file exists only) — provides insufficient assurance; violates quality standards from features 162-174"
      - "Post-git validation — allows invalid files to be committed; violates pre-commit validation requirement from FR-8"
      - "Over-comprehensive validation with semantic analysis — unnecessary complexity without additional benefit"
    rationale: >
      Standard validation matches the established pattern from features 162-174 and strikes the right balance between assurance and simplicity. Validation checks: (1) file exists with non-zero size, (2) UTF-8 encoding without BOM (binary check for EF BB BF bytes), (3) no CRLF line endings (binary check for \\r\\n bytes), (4) H1 heading on first line, (5) blank line on second line, (6) prose content with 2-3 sentences, (7) file ends with newline, (8) size within 300-800 byte range. This provides comprehensive coverage while remaining maintainable. Validation before git operations ensures invalid content never reaches the repository per FR-8 requirement.

  - title: "Git Command Execution Safety"
    chosen: "subprocess.run() with check=True and args as list (not shell string)"
    rejected:
      - "subprocess.call() without check=True — requires manual return code checking; less explicit about error handling"
      - "subprocess.run() with shell=True — introduces command injection vulnerability; violates security best practices per OWASP guidance"
      - "os.system() — deprecated approach with poor error handling and security issues"
    rationale: >
      subprocess.run() with check=True provides explicit error handling: it raises CalledProcessError if the command exits with non-zero status. Using args as a list (e.g., ['git', 'add', filename]) rather than shell=True prevents command injection vulnerabilities. Even though filename is controlled in this feature, following this pattern consistently prevents future regressions. The check=True parameter makes error conditions obvious in code. This pattern is used consistently across features 162-174 and is the Python 3.11+ subprocess best practice per official documentation.

