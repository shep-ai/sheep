# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-23
  - **Completion:** 100%

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** pathlib.Path.write_text() with encoding='utf-8' and newline='\n'

  **Rejected:**
  - pathlib.Path.write_bytes() — more verbose; requires manual UTF-8 encoding when the text-based API is cleaner and equally explicit
  - open() context manager — less Pythonic and more boilerplate than pathlib; pathlib is the modern Python 3.11+ standard
  - Subprocess-based file creation (echo with redirection) — introduces platform dependency and security concerns

  **Rationale:**
  This is the modern Python 3.11+ standard for file operations. The explicit encoding='utf-8' parameter ensures UTF-8 without BOM (BOM only appears with 'utf-8-sig'), and newline='\n' ensures Unix LF line endings on all platforms without platform-specific conversion. This single call is clear, concise, and has been validated across 170+ prior features in this repository. The intent is explicit and maintainable. Even though git is configured with autocrlf=true on Windows, the Python code writes LF bytes; git handles the conversion based on platform and configuration.

  ### 2. File Validation Strategy

  **Chosen:** Comprehensive validation (structure, encoding, size, line endings) executed before git operations

  **Rejected:**
  - Minimal validation (file exists only) — insufficient assurance; violates quality standards from features 162-174
  - Post-git validation — allows invalid files to be committed; violates pre-commit validation requirement
  - Over-comprehensive validation with semantic analysis — unnecessary complexity without additional benefit

  **Rationale:**
  The standard validation approach matches features 162-174 and provides appropriate assurance without over-engineering. Validation checks:
  1. File exists with non-zero size
  2. UTF-8 encoding without BOM (binary check for EF BB BF bytes)
  3. No CRLF line endings (binary check for \r\n)
  4. H1 heading on first line (starts with '# ')
  5. Blank line on second line
  6. Prose content with 2-3 sentences (counts periods)
  7. File ends with newline
  8. File size within 300-800 byte range (per NFR-1)

  This validation is performed after file creation but before git operations, ensuring invalid content never reaches the repository per FR-8.

  ### 3. Git Command Execution

  **Chosen:** subprocess.run() with check=True and args as list

  **Rejected:**
  - subprocess.call() without check=True — requires manual error checking; less explicit
  - subprocess.run() with shell=True — command injection vulnerability; violates security best practices
  - os.system() — deprecated; poor error handling and security concerns

  **Rationale:**
  subprocess.run(check=True) raises CalledProcessError on non-zero exit, providing explicit error handling. Using args as a list (e.g., ['git', 'add', filename]) prevents command injection vulnerabilities and is the Python 3 security best practice. Even though filename is controlled in this feature, maintaining this pattern prevents future regressions. This approach is consistent across features 162-174.

  ### 4. Prose Content Strategy

  **Chosen:** Module-level string constants with creative, thematic, meaningful prose

  **Rejected:**
  - Template-based or generated prose — introduces unnecessary complexity; harder to test and maintain
  - Lorem ipsum or generic placeholder text — breaks consistency with prior features; produces unprofessional test files
  - External prose source files — adds file dependencies; constants are simpler and self-contained

  **Rationale:**
  Creative, thematic content maintains consistency with features 162-174 and produces professional, readable test files. Example topics include 'The Power of Resilience', 'Learning from Failure', 'The Art of Problem Solving', 'Cloud Architecture Fundamentals'. The prose is meaningful and coherent, making test files valuable even after implementation. Constants defined at module level are easy to test and understand.

  ### 5. Error Handling Approach

  **Chosen:** Catch specific exceptions with clear error messages and appropriate exit codes

  **Rejected:**
  - Generic catch-all exception handling — masks root causes; makes debugging difficult
  - No error handling — unmask exceptions are confusing to users
  - Return codes without structured exceptions — requires manual propagation; error-prone

  **Rationale:**
  Specific exception handling (ValueError for validation, OSError for file I/O, subprocess.CalledProcessError for git) enables clear diagnosis. Each exception is logged to stderr with context before exiting with code 1. This pattern matches features 162-174 and provides a clear user experience that integrates well with CI/CD pipelines.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib | File path operations and I/O | Use | Modern Python 3.11+ standard; provides explicit encoding/newline control; used across 170+ prior features |
  | subprocess | Git command execution | Use | Standard library solution for executing external commands safely with check=True pattern |
  | sys | System utilities (exit codes, stderr) | Use | Standard library; minimal dependency for sys.exit() and sys.stderr output |
  | pytest | Testing framework (for implementation phase) | Use | Standard across repository; clean syntax; excellent integration with CI/CD |
  | tempfile | Temporary file handling in tests | Use | Standard library; essential for creating isolated test fixtures without affecting repository state |
  | pathlib.Path.stat() | File size checking | Use | Part of pathlib; no additional dependency; provides reliable file size info |
  | codecs | Advanced encoding operations | Reject | Binary file inspection is simpler and more reliable for BOM/CRLF detection than codecs module |
  | GitPython | Python git bindings | Reject | Adds external dependency when subprocess is cleaner, simpler, and works reliably; inconsistent with 170+ prior features using subprocess |

  ## Security Considerations

  ### Subprocess Execution
  - **Issue:** Git commands could be vulnerable to command injection if filenames contained shell metacharacters
  - **Mitigation:** Use subprocess.run() with args as list (not shell=True); no shell interpretation occurs; filename parameter is controlled and comes from module constant
  - **Status:** Low risk due to controlled filename, but pattern prevents future regression

  ### File Encoding
  - **Issue:** UTF-8 BOM (Byte Order Mark) could cause parsing issues in some tools
  - **Mitigation:** Explicit encoding='utf-8' (not 'utf-8-sig') prevents BOM; validation explicitly checks for BOM bytes and rejects files with BOM
  - **Status:** Fully mitigated

  ### File Permissions
  - **Issue:** Created files inherit default umask permissions
  - **Mitigation:** Default file creation permissions are appropriate for repository files; no explicit chmod required
  - **Status:** Not a concern for this use case

  ### Line Ending Consistency
  - **Issue:** Platform-specific line ending conversion could create CRLF line endings on Windows
  - **Mitigation:** Explicit newline='\n' parameter in write_text() prevents platform conversion; validation explicitly checks for CRLF bytes and rejects files with Windows line endings
  - **Status:** Fully mitigated (even with git autocrlf=true, validation confirms LF in source file)

  ### Path Traversal
  - **Issue:** Filename could contain path traversal sequences (../)
  - **Mitigation:** Filename is a module constant (test-rh39t2.md); no user input; validated before use
  - **Status:** Not applicable

  ## Performance Implications

  ### File Operations
  - **Analysis:** Single file creation is I/O-bound but extremely fast at sub-millisecond scale
  - **Optimization:** No optimization needed; pathlib operations are optimal for this scale
  - **Expected Performance:** File creation + validation + git operations complete in <2 seconds

  ### Validation Overhead
  - **Analysis:** Binary read for BOM/CRLF checks is O(file_size) but file is ~300-800 bytes
  - **Optimization:** No optimization needed; overhead is negligible
  - **Benefit:** Pre-commit validation prevents expensive repository corruption cleanup

  ### Git Operations
  - **Analysis:** Three subprocess calls (add, commit, push) dominate execution time
  - **Optimization:** No optimization possible; subprocess calls are necessary
  - **Expected Performance:** Git operations typically <2 seconds on modern hardware

  ### Overall Performance
  - **Expected Total Time:** <2 seconds
  - **Scaling:** Performance is O(1) regardless of repository size
  - **Bottleneck:** Network latency for git push (unavoidable)

  ## Architecture Notes

  ### Fit with Existing Codebase
  This implementation follows the well-established pattern from features 162-174, ensuring consistency across the repository:

  1. **Module Structure:** Single create_markdown_file.py script with helper functions:
     - create_file() — creates markdown file with specified title and prose
     - validate_file() — performs comprehensive validation (encoding, line endings, structure, size)
     - git_add() — stages file in git
     - git_commit() — creates commit with conventional message
     - git_push() — pushes to feature branch
     - main() — orchestrates workflow with error handling

  2. **Test Structure:** pytest test suite with 8+ test functions:
     - test_file_created() — verifies file exists
     - test_file_has_heading() — checks H1 heading format
     - test_file_has_blank_line() — validates structure
     - test_prose_content_exists() — verifies prose content
     - test_file_ends_with_newline() — checks trailing newline
     - test_no_utf8_bom() — validates UTF-8 without BOM
     - test_lf_line_endings() — verifies Unix line endings
     - test_file_size_in_range() — checks 300-800 byte range
     - test_git_operations() — validates git workflow

  3. **Constants Pattern:** Title and prose defined as module-level constants:
     - FILENAME = "test-rh39t2.md"
     - TITLE = (meaningful title about technology/software)
     - PROSE = (2-3 sentences of thematic content)
     - COMMIT_MESSAGE = "feat(175): create markdown file test-rh39t2.md with prose content"

  4. **Validation Order:** File created → validated → staged → committed → pushed (fail-fast on validation errors)

  5. **Error Handling:** Clear exceptions with context, logged to stderr, exit code 1 on failure

  ### Integration Points
  - **File Location:** Repository root (consistent with 170+ existing test-*.md files)
  - **Git Integration:** Standard add/commit/push workflow using current branch (HEAD)
  - **No Dependencies:** Feature is self-contained; does not depend on /src/sheep/ or other application code
  - **Consistency:** Pattern matches features 162-174 exactly

  ### Code Quality Standards
  - **Readability:** Clear function names, comprehensive docstrings (following features 162-174 pattern)
  - **Maintainability:** Modular functions with single responsibility principle
  - **Testability:** Each function is independently testable; validation is mockable
  - **Documentation:** Docstrings explain parameters, return values, and exceptions

  ### Platform Compatibility
  - **Windows (current environment):** pathlib handles file creation with LF; git autocrlf=true handles conversion
  - **Linux/macOS:** pathlib handles file creation with LF; no git conversion needed
  - **Validation:** Binary checks for LF/CRLF and BOM work identically across all platforms

