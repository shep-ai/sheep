content: |
  ## Problem Statement

  Add a new markdown file called test-rh39t2.md to the repository root with a coherent title and 2-3 sentences of prose content. This continues the pattern established across 170+ existing test files in the Sheep repository. The file should follow strict formatting requirements: UTF-8 encoding without BOM, Unix LF line endings, and be staged/committed/pushed to git with a conventional commit message.

  ## Success Criteria

  - [ ] File test-rh39t2.md is created in the repository root directory
  - [ ] File contains an H1 heading on line 1 (format: `# [Title]`)
  - [ ] File contains a blank line on line 2
  - [ ] File contains 2-3 sentences of coherent prose content starting on line 3
  - [ ] File contains a trailing newline at the end
  - [ ] File is UTF-8 encoded without Byte Order Mark (BOM)
  - [ ] File uses Unix LF line endings (\n), not Windows CRLF (\r\n)
  - [ ] File size is within 300-800 byte range
  - [ ] File is staged to git using `git add`
  - [ ] File is committed with conventional commit message: "feat(175): create markdown file test-rh39t2.md with prose content"
  - [ ] File is pushed to origin remote on the current branch
  - [ ] Markdown syntax is valid with no formatting errors
  - [ ] Prose content is grammatically correct and coherent

  ## Functional Requirements

  - **FR-1**: Create a markdown file named test-rh39t2.md in the repository root directory
  - **FR-2**: File must contain an H1 heading on line 1 with meaningful title text (e.g., "# Understanding Cloud Architecture")
  - **FR-3**: File must contain exactly one blank line on line 2
  - **FR-4**: File must contain 2-3 sentences of coherent prose content starting on line 3
  - **FR-5**: File must end with a trailing newline character (no content after the final \n)
  - **FR-6**: File must be encoded in UTF-8 without Byte Order Mark (BOM)
  - **FR-7**: File must use Unix LF line endings (\n) exclusively, never Windows CRLF (\r\n)
  - **FR-8**: Implementation must validate file structure and size before performing git operations
  - **FR-9**: Implementation must add the file to git staging area using `git add`
  - **FR-10**: Implementation must commit the file with a conventional commit message following the format: "feat(175): create markdown file test-rh39t2.md with prose content"
  - **FR-11**: Implementation must push the commit to the origin remote using `git push -u origin HEAD`
  - **FR-12**: Implementation must report success/failure with appropriate exit codes (0 for success, non-zero for failure)

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 300-800 bytes to ensure reasonable prose content length while preventing bloat
  - **NFR-2**: Implementation must follow the established pattern used in features 162-174 for consistency and maintainability
  - **NFR-3**: Implementation must complete within the estimated 1-2 hour timeframe (size: S)
  - **NFR-4**: Code must be simple, readable, and maintainable with minimal complexity (no unnecessary abstraction)
  - **NFR-5**: Implementation must use Python 3 standard library modules (pathlib, subprocess) as established in prior features
  - **NFR-6**: Implementation must handle error cases with clear error messages (invalid file structure, encoding issues, git operation failures)
  - **NFR-7**: All file I/O must be performed using pathlib.Path with explicit UTF-8 encoding specified
  - **NFR-8**: Implementation must not modify any existing files or directories outside the repository root

  ## Product Decisions with AI Recommendations

  | Question | AI Recommendation | Rationale |
  | -------- | ----------------- | --------- |
  | Content domain (tech vs. generic vs. generated) | **Technology/Software Domain** | Consistency with 170+ prior features ensures professional quality and coherent test file collection |
  | File size validation (strict vs. flexible vs. none) | **Strict 300-800 byte enforcement** | Maintains uniform test file sizes across the repository; prevents regressions in the established pattern |
  | Validation scope (full vs. minimal vs. none) | **Full validation before git operations** | FR-8 requires it, NFR-6 specifies clear errors, and prevents invalid files from entering repository |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **Root directory**: Contains 170+ test markdown files (test-*.md) that serve as test fixtures for the feature implementation workflow
  - **specs/**: Contains subdirectories for each feature numbered 006+ (e.g., specs/175-markdown-file-creation-42bae5/)
  - Each spec directory includes:
    - spec.yaml: Feature specification (this file)
    - Implementation and test scripts created during implementation phase
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **README.md**: Project documentation
  - **Dockerfile, docker-compose.yml**: Container configuration
  - **.github/**: GitHub Actions workflows

  ### Architecture Patterns

  The project follows a well-established pattern for markdown file creation features:

  1. **File Structure**: All test markdown files follow identical format:
     - H1 heading on line 1 (e.g., `# The Evolution of Technology`)
     - Blank line on line 2
     - 2-3 sentences of prose content (lines 3+)
     - Trailing newline
     - Total file size: typically 400-600 bytes (range 300-800 bytes acceptable)

  2. **Encoding Standards**: All files strictly enforce:
     - UTF-8 encoding without Byte Order Mark (BOM)
     - Unix LF line endings (\n), never Windows CRLF (\r\n)
     - Written using pathlib.Path.write_text() with explicit UTF-8 encoding

  3. **Implementation Pattern**: Each markdown file creation feature:
     - Defines title and prose content as string constants
     - Uses pathlib.Path for file operations
     - Validates file structure, size, and encoding before git operations
     - Performs git add, commit, push using subprocess.run() with check=True

  4. **Git Workflow**: Standard conventional commit format:
     - Message: "feat(NUMBER): create markdown file FILENAME with prose content"
     - Example: "feat(175): create markdown file test-rh39t2.md with prose content"
     - Operations: git add, git commit, git push -u origin HEAD

  ### Relevant Technologies

  - **Python 3.11+**: pathlib module for cross-platform file operations, subprocess for git integration
  - **Git**: Version control operations (add, commit, push)
  - **Markdown**: Standard markdown format with H1 heading level
  - **UTF-8**: Standard text encoding with LF line endings

  ### Established Precedent

  Features 162-174 (170+ total) all follow the identical pattern:
  - Same file structure (H1 heading + blank line + 2-3 sentences)
  - Same size target (300-800 bytes)
  - Same encoding (UTF-8 LF)
  - Same git workflow (conventional commit, push)
  - Same estimated effort (S — 1-2 hours)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Adds new file test-rh39t2.md to root directory; joins 170+ existing test files |
  | Git history | High | Creates new commit in current branch; adds git operations workflow |
  | File system | Low | Single file creation (~400-600 bytes); no modifications to existing files |
  | specs/175-* directory | Low | Contains specification files and supporting documentation |
  | Source code | None | Feature is purely file creation; does not touch /src/sheep/ application code |

  ## Dependencies

  - **Python Standard Library**: pathlib (file I/O), subprocess (git commands)
  - **Git**: Required for add, commit, and push operations
  - **Existing test pattern**: References 170+ existing test markdown files as templates (no runtime dependency)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set for commits
  - **Feature branch**: feat/175-markdown-file-creation-42bae5 must exist (pre-created)

  ## Size Estimate

  **S** — This is a straightforward, short-duration task (1-2 hours maximum) because:

  - **Pattern is well-established**: Repeated across 170+ prior features (features 162-174) with identical requirements
  - **No architectural decisions**: Follows existing conventions exactly; all decisions pre-made by pattern
  - **Simple file creation**: Write H1 heading + 2-3 sentences of prose, validate structure, perform 3 git operations
  - **Comprehensive reference implementations**: Available in features 165-174 for direct comparison
  - **No code complexity**: Straightforward imperative code (create content, validate, run git commands)
  - **File validation**: Simple check against established ranges (file size 300-800 bytes, structure validation)

  ### Effort Breakdown

  - File creation with content: 10-15 minutes (write title and prose)
  - File validation: 5 minutes (verify encoding, line endings, size)
  - Git workflow: 5 minutes (add, commit, push)
  - **Total**: 20-25 minutes

  ### Justification

  Given 170+ identical features successfully implemented with size estimate S, and no complexity differences for feature 175, the S estimate is well-supported. This is a minimal-effort task with no research, design, or architectural work needed.

