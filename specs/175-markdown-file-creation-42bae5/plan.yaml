content: |
  ## Status

  - **Phase:** Planning Complete
  - **Updated:** 2026-03-23
  - **Completion:** 100%

  ## Architecture Overview

  This feature follows the well-established pattern from features 162-174 (170+ total
  features) with identical structure and approach. The implementation is self-contained
  within a single Python module (`create_markdown_file.py`) located in the spec directory.

  ### Key Components

  1. **File Creation Module** (`create_markdown_file.py`):
     - Constants: FILENAME, TITLE, PROSE (module-level string constants)
     - `create_file()` → Creates markdown file with pathlib.Path.write_text()
     - `validate_file()` → Comprehensive validation before git operations
     - `git_add()`, `git_commit()`, `git_push()` → Git workflow using subprocess.run()
     - `main()` → Orchestrates the workflow with error handling

  2. **Test Suite** (`test_create_markdown_file.py`):
     - Unit tests for file creation, validation, git operations
     - Integration tests for complete workflow
     - Edge case coverage (encoding, line endings, structure, size)
     - Uses pytest and tempfile for isolated testing

  ### Integration with Existing Codebase

  - **File Location**: Repository root (test-rh39t2.md) joins 170+ existing test files
  - **Pattern Consistency**: Identical to features 162-174; reuses proven approach
  - **No Dependencies**: Self-contained; doesn't depend on /src/sheep/ or other modules
  - **Git Integration**: Standard add/commit/push workflow on current feature branch
  - **Platform Compatibility**: pathlib and binary validation work identically on Windows/Linux/macOS

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen**: `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rationale**:
  - Explicit `encoding='utf-8'` ensures UTF-8 without BOM (BOM only appears with 'utf-8-sig')
  - Explicit `newline='\n'` ensures Unix LF line endings on all platforms (Windows, Linux, macOS)
  - Single clean call vs. alternatives like `open()` with context managers or `write_bytes()`
  - Python 3.11+ standard library best practice; proven across 170+ prior features
  - Platform-agnostic: works correctly regardless of git autocrlf settings or OS defaults

  **Why Not Alternatives**:
  - `open()` context manager: more boilerplate; pathlib is more modern and Pythonic
  - `write_bytes()`: requires manual UTF-8 encoding; the text API is cleaner and equally explicit
  - subprocess with shell redirection: introduces platform-specific behavior and security risks

  ### 2. File Validation: Comprehensive Pre-Git Checks

  **Chosen**: Full validation (structure, encoding, size, line endings) executed before git operations

  **Rationale**:
  - FR-8 explicitly requires validation before git operations
  - NFR-6 specifies clear error messages
  - Prevents invalid files from entering repository; catches errors early
  - Standard approach used across 162-174; proven to work reliably
  - Binary inspection for BOM (EF BB BF bytes) and CRLF (\r\n bytes) is platform-independent
  - Specific validation checks:
    - File exists with non-zero size
    - UTF-8 encoding without BOM (binary check)
    - No CRLF line endings (binary check)
    - H1 heading on first line
    - Blank line on second line
    - 2-3 sentences of prose content
    - Trailing newline
    - Size within 300-800 byte range (NFR-1)

  **Why Not Alternatives**:
  - Minimal validation: insufficient assurance; breaks consistency with prior features
  - Post-git validation: allows invalid files to be committed; violates FR-8
  - No validation: dangerous; invalid files could corrupt repository state

  ### 3. Git Command Execution: subprocess.run() with check=True

  **Chosen**: `subprocess.run(args=[...], check=True, capture_output=True, text=True)`

  **Rationale**:
  - `check=True` raises CalledProcessError on non-zero exit; explicit error handling
  - args as list (not shell=True) prevents command injection vulnerabilities
  - `capture_output=True` provides stdout/stderr for error diagnosis
  - `text=True` uses text mode for readable output (not binary)
  - Consistent with Python 3 security best practices
  - Pattern used across 162-174; proven safe and reliable

  **Why Not Alternatives**:
  - `subprocess.call()`: requires manual return code checking; less explicit
  - `shell=True`: introduces command injection risk; violates OWASP security guidelines
  - `os.system()`: deprecated; poor error handling and platform inconsistencies

  ### 4. Error Handling: Specific Exceptions with Clear Messages

  **Chosen**: Catch ValueError (validation), OSError (file I/O), subprocess.CalledProcessError (git)

  **Rationale**:
  - ValueError: validation failures (structure, encoding, size) → user-facing, actionable
  - OSError: file I/O problems (permissions, disk space) → system-level diagnosis
  - CalledProcessError: git command failures (network, permissions) → operation-specific details
  - Each exception logged to stderr with context before exit code 1
  - Clear error messages help user diagnose and fix issues
  - Exit codes (0 success, 1 failure) integrate with CI/CD pipelines and shell scripts

  **Why Not Alternatives**:
  - Generic try/except: masks root causes; makes debugging difficult
  - No error handling: confusing exceptions; poor user experience
  - Silent failures: undetectable bugs; repository corruption risk

  ### 5. Prose Content: Module-Level Constants with Thematic Content

  **Chosen**: TITLE and PROSE as module-level string constants with meaningful technology/software domain content

  **Rationale**:
  - Consistency with 170+ prior features; all use technology/software domain content
  - Professional, coherent prose maintains test file quality across repository
  - Examples: "The Power of Resilience", "Learning from Failure", "Cloud Architecture Fundamentals"
  - 2-3 full sentences (100-150 words) ensures substantial, meaningful content
  - Constants defined at module level: easy to test, understand, and maintain
  - Makes test files have intrinsic value beyond being mere fixtures

  **Why Not Alternatives**:
  - Template/generated prose: introduces complexity; harder to test; less meaningful
  - Lorem ipsum: unprofessional; breaks consistency with prior features
  - External prose files: adds dependencies; constants are simpler and self-contained

  ## Implementation Strategy

  ### Execution Order (Why This Sequence)

  **Phase 1 First (File Creation & Validation)**:
  - File must be created with correct structure before validation makes sense
  - Validation logic is independent of git operations; can be tested in isolation
  - Establishes the foundation; everything else depends on correct file state

  **Phase 2 Second (Git Workflow)**:
  - Only git operations after validation passes; prevents invalid files from being committed
  - Git operations depend on file existing in correct state (Phase 1 output)
  - Ordering reflects the sequence in actual execution

  **Phase 3 Third (Main Orchestration)**:
  - Brings together Phase 1 (file creation) and Phase 2 (git operations)
  - Orchestration depends on both previous phases being complete
  - Error handling wraps all operations; happens last in logical flow

  **Phase 4 & 5 (Testing & Integration)**:
  - Testing phases occur after implementation is complete
  - Unit tests validate individual components
  - Integration tests validate complete workflow

  ### Why No Architectural Complexity

  This feature has no architectural decisions beyond what exists in 170+ prior features:
  - No new patterns required; follows established conventions exactly
  - No library decisions; uses only Python standard library (pathlib, subprocess, sys)
  - No structural changes; adds single file to repository root
  - No code in /src/sheep/; feature is purely file creation
  - No new testing frameworks; uses existing pytest infrastructure

  The simplicity is by design: the pattern works, so reuse it exactly.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File size validation rejecting valid content | Low | Medium | Size range (300-800 bytes) was chosen to accommodate natural prose variation while maintaining consistency. Conservative testing ensures reasonable prose fits within range. |
  | UTF-8 BOM appearing despite encoding='utf-8' | Low | Medium | Using encoding='utf-8' (not 'utf-8-sig') prevents BOM. Validation explicitly checks for BOM bytes (EF BB BF) and rejects files with BOM. Tested across 170+ prior features. |
  | CRLF line endings on Windows despite newline='\n' | Low | Medium | Explicit newline='\n' in write_text() prevents platform conversion. Validation explicitly checks for CRLF bytes (\r\n) and rejects files with Windows line endings. Binary validation works identically on all platforms. |
  | git push fails due to network issues | Medium | Low | Validates file before git operations so invalid state never reaches push. If push fails, clear error message from subprocess explains the issue. User can diagnose and retry. |
  | Git configuration missing (user.name/user.email) | Low | Medium | Validation doesn't check git config, but git commit will fail with clear error message. Caught by subprocess.CalledProcessError with git's error output. User can configure git and retry. |
  | File already exists (test-rh39t2.md) | Low | Low | Implementation overwrites existing file (uses Path.write_text() without append mode). If this is undesired, feature spec determines filename, so conflict is a spec issue not implementation issue. |
  | Platform-specific path issues | Low | Low | pathlib.Path handles platform-specific paths (Windows backslashes, Unix forward slashes) automatically. No hardcoded paths. Works identically on Windows, Linux, macOS. |
