# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the established pattern from features 250-252 (204+ similar test files already in
  repository). The implementation uses a single Python script to automate the complete workflow: markdown
  file creation, git staging, conventional commit message, and push to remote. This approach ensures
  consistency, reduces manual error, and aligns with existing Sheep project patterns.

  The implementation leverages Python 3.11+ standard library with no external dependencies:
  - **pathlib.Path.write_text()**: File I/O with explicit encoding and line ending control
  - **subprocess.run()**: Git command execution with shell safety (explicit command list, no shell=True)

  The final artifact is test-bvt0ve.md in the repository root, following the established test-*.md
  naming convention. File structure is fixed: H1 markdown heading + blank line + 2-3 sentences of
  developer-chosen prose content. File size naturally falls within 400-600 byte range as consequence
  of proper structure (no explicit size validation needed).

  ## Key Design Decisions

  ### 1. File Creation via pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-bvt0ve.md').write_text(content, encoding='utf-8', newline='\n')`

  **Why:**
  - Explicit requirement in spec NFR-5 (use Python pathlib for file I/O)
  - Built-in to Python 3.11+ standard library (no external dependencies)
  - Precise control over UTF-8 encoding (NFR-1) and Unix LF line endings (NFR-2)
  - Cleaner, more intuitive API than open() with manual file handling
  - Proven pattern from features 250-252 (all successfully implemented)
  - Best-practice approach in Python for text file creation

  ### 2. Prose Content: Hardcoded & Topic-Flexible

  **Chosen:** Hardcoded 2-3 sentences about a developer-selected topic

  **Why:**
  - Each file is created once; no template reusability benefit
  - Manual quality validation during creation aligns with spec decision (implementer validates prose)
  - Eliminates runtime dependencies and complexity (no LLM APIs, template engines)
  - Matches 200+ existing test files which use diverse topics without constraints
  - Minimizes implementation complexity; entire script is ~20-30 lines of Python
  - Developer has full discretion in prose topic per spec requirements

  ### 3. Git Integration via subprocess.run()

  **Chosen:** `subprocess.run(['git', 'add', ...])` with explicit command list (no shell=True)

  **Why:**
  - Git is already available in the environment (it's the repository tool)
  - External library (GitPython) would violate spec NFR-9 (no new external dependencies)
  - Three mechanical operations (add, commit, push) are simple and don't require library abstraction
  - Explicit command list prevents shell injection vulnerabilities
  - Subprocess module is standard library; no additional imports needed
  - Proven pattern from features 250-252 (all completed successfully)

  ### 4. Single Cohesive Script Design

  **Chosen:** One Python script that performs all operations sequentially (file creation → git add → git commit → git push)

  **Why:**
  - Atomic operation: all steps execute together or fail together (no partial state)
  - Reduces cognitive load: one script to write, test, and maintain
  - Ensures consistency across all file creation and git integration operations
  - Minimizes implementation time: spec estimates 10-15 minute feature
  - Matches successful pattern from features 250-252
  - Easier to debug and troubleshoot than separate multi-step workflow

  ## Implementation Strategy

  **Phase 1 — Implementation Script Development:**
  1. Create `specs/253-markdown-file-creation-0600e1/implementation.py` with:
     - Define markdown content: H1 heading + blank line + 2-3 sentences (free-form topic)
     - Use pathlib.Path.write_text() with encoding='utf-8', newline='\n'
     - Use subprocess.run() for git add, commit (with exact conventional message), push
     - Include error handling and status reporting

  **Phase 2 — Execution & Verification:**
  1. Execute the implementation script
  2. Verify test-bvt0ve.md exists at repository root with correct structure
  3. Verify file encoding (UTF-8 without BOM) and line endings (LF only)
  4. Verify git commit created with exact message: "feat(253): create markdown file test-bvt0ve.md with prose content"
  5. Verify commit pushed to remote origin/feat/253-markdown-file-creation-0600e1

  **Why this ordering:** File creation (Phase 1) must be implemented before git operations (which operate on that file).
  Both must be complete before execution and verification (Phase 2) can validate the full workflow.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File encoding mismatch (UTF-8 vs platform default)** | Explicit `encoding='utf-8'` parameter in pathlib ensures UTF-8 regardless of platform; explicit `newline='\n'` prevents CRLF on Windows |
  | **Line ending corruption (CRLF instead of LF)** | pathlib `newline='\n'` explicitly enforces Unix LF; no platform-specific line ending fallback |
  | **Git operations fail (missing git config, branch issues)** | Implementation includes error checking; failures are caught early with clear error messages; subprocess.run() with check=True raises exceptions on non-zero exit |
  | **File content doesn't meet spec (prose too short, wrong structure)** | Implementation hardcodes exact structure; Phase 2 verification explicitly checks: heading present, blank line present, sentence count, byte size |
  | **Commit message typo or format error** | Conventional message is hardcoded in string; cannot be mistyped during execution |
  | **Git push fails (auth/network issues)** | Script includes error handling; failures are reported clearly; non-critical for initial feature completion (script handles error gracefully) |
  | **File already exists (overwrite safety)** | Implementation can optionally check: if file exists, report error before writing (safe for repeated execution) |

  ## Success Criteria (from Spec)

  All must be verifiable after Phase 2 execution:

  - File `test-bvt0ve.md` exists in repository root (exact location, exact filename)
  - File contains exactly one H1 markdown heading on first line
  - File contains exactly one blank line after heading
  - File contains exactly 2-3 sentences of prose content
  - File encoding is UTF-8 without BOM (verifiable via `file` command or byte inspection)
  - File line endings are Unix LF (\n), not Windows CRLF (verifiable via `od` or `hexdump`)
  - File size naturally falls within 400-600 byte range
  - Markdown syntax is valid per CommonMark specification
  - File is staged in git (verifiable via `git status`)
  - Git commit exists with exact message: "feat(253): create markdown file test-bvt0ve.md with prose content"
  - Commit is on feature branch `feat/253-markdown-file-creation-0600e1`
  - Commit is pushed to remote origin (verifiable via `git ls-remote origin`)
  - Git working tree is clean (verifiable via `git status`)
