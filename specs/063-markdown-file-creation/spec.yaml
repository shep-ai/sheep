# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-zo2ge0.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 40+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory).

  ## Success Criteria

  - [ ] File `test-zo2ge0.md` is created at the repository root directory
  - [ ] File contains exactly one markdown level-1 heading (#) followed by a line break
  - [ ] File contains 2-3 sentences of prose content below the heading
  - [ ] Prose content is grammatically correct and meaningful (any topic acceptable)
  - [ ] File is encoded in UTF-8 format
  - [ ] File uses Unix line endings (LF, not CRLF)
  - [ ] File contains valid Markdown syntax
  - [ ] File is staged in git (shows in `git status`)
  - [ ] File is committed with a conventional commit message starting with `feat:`
  - [ ] Commit is pushed to the `feat/063-markdown-file-creation` branch
  - [ ] Commit appears in `git log` on the feature branch
  - [ ] File size is approximately 400-600 bytes
  - [ ] File follows the same structural pattern as 40+ existing test-*.md files

  ## Functional Requirements

  - **FR-1**: Create a file named `test-zo2ge0.md` in the repository root directory
  - **FR-2**: File must contain a markdown level-1 heading (#) as the title/opening element
  - **FR-3**: File must contain 2-3 complete, prose sentences below the heading describing any topic
  - **FR-4**: Stage the created file in git using `git add`
  - **FR-5**: Create a git commit with a message following conventional commits format (starts with `feat:`)
  - **FR-6**: Push the commit to the feature branch `feat/063-markdown-file-creation`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 character encoding (no other encodings)
  - **NFR-2**: File must use Unix line endings (LF, 0x0A) — not Windows (CRLF) or Mac classic (CR)
  - **NFR-3**: File must contain valid Markdown syntax with no syntax errors
  - **NFR-4**: File must follow the established pattern from existing test-*.md files (heading + prose, no additional structure)
  - **NFR-5**: Commit message must follow conventional commits format: `feat(specs): <short description>`
  - **NFR-6**: Implementation must complete within the S (Small) size estimate of 10-15 minutes
  - **NFR-7**: No external libraries or dependencies required — use only Python standard library
  - **NFR-8**: Implementation must not modify any existing files (only creates test-zo2ge0.md)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-zo2ge0.md) to existing collection of 40+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes |
  | Git Repository | Low | Standard single commit and push following established pattern from commits #122-#128; no branch/merge complexity |
  | Workflow/Process | Low | Uses existing file creation and git tooling; no new dependencies, infrastructure, or platform modifications required |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase |

  ## Dependencies

  - **Git repository**: Feature branch `feat/063-markdown-file-creation` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Established pattern**: 40+ test files provide clear precedent for content format and structure

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with 40+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent commits (#122-#128) demonstrate efficient implementation of identical features
