# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "Python pathlib.Path.write_text() with explicit UTF-8 encoding and LF line endings"
    rejected:
      - "Shell commands (echo > file) — insufficient control over encoding and line endings; inconsistent across platforms"
      - "os.open() with manual buffer management — unnecessary complexity; pathlib provides cleaner API with same control"
    rationale: >
      pathlib.Path.write_text() is the idiomatic Python approach for text file creation. It provides:
      (1) Explicit UTF-8 encoding control, (2) Guaranteed consistent line endings via write_text()
      which normalizes to LF on Unix platforms, (3) Cross-platform compatibility, (4) Cleaner code
      readability vs. manual file handle management. The method has been successfully used in all
      62 prior similar features in this project (commits #122-#129). Modern Python best practices
      strongly favor pathlib for file I/O operations.

  - title: "Git Operations"
    chosen: "subprocess.run() with ['git', ...] argument list (not shell=True)"
    rejected:
      - "GitPython library — external dependency not needed for simple operations; introduces unnecessary complexity"
      - "Shell commands with subprocess shell=True — security risk from command injection; inconsistent behavior"
    rationale: >
      Using subprocess.run() with explicit argument lists provides (1) Security against shell
      injection attacks through proper argument list handling, (2) No external dependencies beyond
      Python stdlib, (3) Simple, linear code for straightforward git operations (add, commit, push),
      (4) Consistency with all 40+ prior test files in this project that use the same approach.
      GitPython would add unnecessary dependency overhead for simple operations. The subprocess
      approach has proven reliable and maintainable throughout this project's history.

  - title: "Content Generation Strategy"
    chosen: "Static prose content — handcrafted meaningful sentence(s) on any topic"
    rejected:
      - "AI/LLM-generated content — introduces external API dependency; violates NFR-7 (no external libraries); adds latency"
      - "Random/Template-based content — produces unreadable, incoherent output; fails quality requirements"
    rationale: >
      Static, human-readable prose content ensures (1) Compliance with spec requirement for
      'grammatically correct and meaningful' content, (2) No external dependencies, (3) Predictable
      deterministic output, (4) Consistency with all 40+ prior test files which use topic-specific
      meaningful content (not random/generated). The content length requirement (2-3 sentences,
      400-600 bytes) is easily achievable with manually-written prose on any topic.

  - title: "Line Ending Handling"
    chosen: "Rely on pathlib.write_text() default LF behavior on Unix + explicit validation in tests"
    rejected:
      - "Manual newline handling with open(newline='') — adds unnecessary complexity; harder to reason about"
      - "Shell echo with -n flag — unreliable across systems; difficult to control encoding"
    rationale: >
      On Unix systems (where this project runs), pathlib.Path.write_text() defaults to LF line
      endings per PEP 3140 universal newlines behavior. Explicit validation tests (test suite
      checks for b'\\n' and absence of b'\\r\\n') ensure LF compliance. This approach has worked
      reliably across 40+ files. Manual newline parameter handling is unnecessarily complex for
      a feature with clear platform (Unix) and encoding (UTF-8) requirements.

  - title: "File Size Target"
    chosen: "Target 400-600 bytes through 2-3 sentences of prose (~50-100 words per sentence)"
    rejected:
      - "Minimize file size (<400 bytes) — forces cramped, awkward prose; violates 'meaningful' requirement"
      - "Maximize file size (>600 bytes) — requires artificially lengthy content; wastes space"
    rationale: >
      The 400-600 byte range naturally accommodates 2-3 complete, readable English sentences without
      artificial padding or compression. A typical sentence is 100-150 characters; 2-3 sentences
      easily fit this range. This size is observable in all 40+ existing test files (test-uxhn30.md,
      test-u6624u.md, test-xf7h2g.md all fall in this range). The range provides enough content to
      be substantive while remaining minimal.

