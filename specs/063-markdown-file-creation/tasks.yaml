content: |
  ## Summary

  This task breakdown implements the complete feature in 5 focused tasks across 2 phases:

  **Phase 1: File Creation & Validation (3 tasks, ~20 min)**
  - Task 1: Write comprehensive test suite that documents all requirements
  - Task 2: Implement markdown file creation using pathlib with UTF-8 encoding
  - Task 3: Validate all file properties and handle edge cases

  **Phase 2: Git Integration & Verification (2 tasks, ~10 min)**
  - Task 4: Stage file and create conventional commit
  - Task 5: Push to feature branch and verify in git history

  **TDD Flow:**
  - RED (Task 1): Write tests, verify they fail (no artifact exists)
  - GREEN (Task 2): Implement file creation, verify tests pass
  - REFACTOR (Task 3): Polish implementation, verify edge cases
  - GREEN (Task 4): Implement git add/commit operations
  - REFACTOR (Task 5): Verify push succeeded, commit is discoverable

  **Total Effort:** ~30 minutes (aligns with S size estimate of 10-15 minutes actual work
  plus validation, testing, and verification overhead)

  **Key Principles:**
  - Tests first: All requirements documented as assertions before implementation
  - One artifact: Single file creation with clear success criteria
  - Proven pattern: Implementation follows 40+ identical features in project
  - No dependencies: Uses only Python stdlib (pathlib, subprocess)
  - Isolated change: Adds one file, modifies nothing, impacts only repository root

  ## Dependencies Between Tasks

  ```
  task-1 (Create test suite)
      ↓
  task-2 (Implement file creation) — tests verify GREEN phase
      ↓
  task-3 (Validate & refactor) — ensure artifact is correct before committing
      ↓
  task-4 (Stage & commit) — add validated artifact to git
      ↓
  task-5 (Push & verify) — complete feature by pushing to remote
  ```

  All tasks are sequential; no parallelization possible because later tasks depend
  on artifacts and validations from earlier tasks.

  ## Validation Strategy

  - **File properties:** test_create_markdown.py validates structure, encoding, line endings, size
  - **Git state:** git commands (status, log, branch -vv) verify staging, commits, history
  - **Correctness:** Manual spot-check that prose is meaningful and matches 40+ precedent files
  - **Final state:** Working directory clean, commit on feature branch, ready for PR

  ## Success Criteria Summary

  After all 5 tasks complete:
  - ✓ test-zo2ge0.md exists at repository root with correct structure and content
  - ✓ File is UTF-8 encoded with LF line endings
  - ✓ File size is 400-600 bytes
  - ✓ test_create_markdown.py passes all assertions
  - ✓ create_markdown.py correctly implements file creation
  - ✓ Commit exists with conventional message on feature branch
  - ✓ Commit is pushed to feat/063-markdown-file-creation
  - ✓ Feature is complete and ready for merge
