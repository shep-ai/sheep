content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-3upd7w.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 240+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-243, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-3upd7w.md` exists in the repository root directory
  - [ ] File contains a valid markdown H1 heading as title
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix-style LF line endings (\\n)
  - [ ] File follows CommonMark markdown syntax (valid and parseable)
  - [ ] File size is within 400-600 bytes (natural outcome of proper structure)
  - [ ] File is staged in git with `git add test-3upd7w.md`
  - [ ] Commit is created with conventional format: `feat(244): create markdown file test-3upd7w.md with prose content`
  - [ ] Changes are pushed to origin branch `feat/244-markdown-file-creation-f64ea6`
  - [ ] Feature branch contains only this file change and no modifications to other files
  - [ ] No changes to source code (/src/sheep/), tests (/tests/), or configuration files

  ## Functional Requirements

  - **FR-1**: Create a markdown file with exact filename `test-3upd7w.md` in the repository root
  - **FR-2**: File must contain a markdown H1 heading (`# <Title>`) as the title
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading
  - **FR-4**: Stage the created file in git using `git add`
  - **FR-5**: Create a commit with conventional commit message: `feat(244): create markdown file test-3upd7w.md with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/244-markdown-file-creation-f64ea6`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without byte-order mark (BOM)
  - **NFR-2**: Line endings must be Unix-style LF (\\n), not Windows CRLF
  - **NFR-3**: Markdown content must be valid CommonMark syntax
  - **NFR-4**: File size should naturally result in 400-600 bytes range given proper markdown structure
  - **NFR-5**: Implementation must follow the established pattern of 240+ existing test files (test-*.md files in root)
  - **NFR-6**: No modifications permitted to source code, tests, or configuration files
  - **NFR-7**: Feature branch must contain exactly this single file change with no extraneous commits or modifications
  - **NFR-8**: Implementation should complete within 15 minutes of work time

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-3upd7w.md) to existing collection of 240+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing content |
  | Git Repository | Low | Standard single commit and push following established pattern from 170+ prior features; no branch complexity, no merge operations, no destructive git operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code |
  | Tests (/tests/) | None | No test modifications required; feature is independent validation artifact |
  | Configuration Files | None | No modifications to pyproject.toml, .env, CI workflows, or other configuration |
  | Application Logic | None | Feature has zero impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/244-markdown-file-creation-f64ea6` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (already available in feature branch)
  - **Established pattern**: 240+ test files provide clear, well-documented precedent for file format and structure
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies needed)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be available for commits
  - **File naming**: Filename `test-3upd7w.md` is specified in feature requirements and must be used exactly as given

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content authoring**: ~5 minutes (create markdown heading + 2-3 sentences of prose with appropriate topic selection)
  - **Validation**: ~3 minutes (verify markdown syntax correctness, UTF-8 encoding, LF line endings, structure compliance with established pattern)
  - **Git workflow**: ~2-5 minutes (stage file with git add, create commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 240+ identical test files providing extremely clear precedent and documentation
  - No architectural decisions required; all decisions made in features 069-243 and documented
  - Flexible topic selection allows prose authoring without research or domain constraints
  - Single file with minimal, fully-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation updates, or configuration changes required
  - Recent feature implementations (240-243) demonstrate efficient execution of identical features in 10-15 minutes
  - File naming (`test-3upd7w.md`) is pre-specified, eliminating all naming decisions
  - Git workflow is mechanical and follows exact precedent from 170+ prior feature implementations
