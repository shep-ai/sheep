content: |
  ## Architecture Overview

  Feature 173 creates a single markdown test artifact (test-87xoko.md) in the repository root.
  This follows an established pattern from features 169-172 and is consistent with 65+ existing
  test files in the repository. The feature is purely artifact creation — no source code changes,
  no configuration modifications, no system dependencies beyond Python standard library and git.

  The implementation integrates with the repository's file structure and git workflow:
  - **Location:** Repository root directory (consistent with test-*.md naming pattern)
  - **Git Integration:** Single commit per feature, conventional commit format, push to feature branch
  - **No Architecture Changes:** Feature does not modify /src/sheep/, configuration files, or any source code

  ## Key Design Decisions

  ### 1. File Creation Using Python pathlib

  **Decision:** Use `pathlib.Path.write_text()` to create the markdown file.

  **Rationale:**
  - Built-in Python standard library (no external dependencies)
  - Explicit UTF-8 encoding support and control
  - Atomic write operation ensures data integrity
  - Simple 2-3 line implementation
  - Consistent with features 169-172 pattern
  - Scales to full repository of 65+ test files

  **Alternative Rejected:** Bash echo/printf (shell escaping complexity, less robust encoding control)

  ### 2. Prose Content: Unrestricted Human-Authored

  **Decision:** Write human-authored prose on any topic (completely unrestricted).

  **Rationale:**
  - Product requirement explicitly states "about anything" with maximum flexibility
  - Enables fastest implementation (no topic research constraints)
  - Consistent with existing test files (diverse topics, hand-crafted content)
  - Maintains established pattern from features 169-172
  - Basic quality standard: grammatically correct, readable, no major errors

  **Alternative Rejected:** Automated prose generation (adds latency, external dependency, violates flexibility requirement)

  ### 3. Git Workflow: Standard CLI Commands

  **Decision:** Use standard git CLI workflow (git add, git commit, git push).

  **Rationale:**
  - Established pattern across features 169-172 and entire repository
  - No external Python dependencies required
  - Full visibility and auditability of each step
  - Supports conventional commit formatting with Co-Authored-By footer
  - Integrates with existing CI/CD and GitHub workflows

  **Alternative Rejected:** GitPython library (unnecessary dependency, compatibility risks, inconsistent with established pattern)

  ### 4. File Encoding: UTF-8 with LF Line Endings

  **Decision:** UTF-8 encoding with Unix (LF) line endings, configured via git core.safecrlf.

  **Rationale:**
  - Explicit requirement in success criteria and non-functional requirements
  - UTF-8 is modern standard for text files (supports all common characters)
  - LF (Unix line endings) configured in repository git settings
  - Consistent with CommonMark specification and existing test files
  - pathlib.Path.write_text() uses UTF-8 by default

  **Alternative Rejected:** CRLF or ASCII encoding (violates requirements, reduces flexibility and platform compatibility)

  ## Implementation Strategy

  **Phase 1: File Creation**

  Create the markdown file with appropriate content structure. This phase includes:
  - Selecting an unrestricted prose topic of choice
  - Writing H1 title using markdown syntax (# Title)
  - Writing 2-3 sentences of narrative prose
  - Creating file using pathlib.Path.write_text() with explicit UTF-8 encoding
  - Validating file properties (encoding, line endings, size 100-600 bytes, content structure)

  **Phase 2: Git Integration**

  Integrate the new file into version control following the established workflow. This phase includes:
  - Staging file to git index (git add test-87xoko.md)
  - Creating a conventional commit with message format: "feat(173): create markdown file test-87xoko.md with prose content"
  - Including Co-Authored-By footer for proper attribution
  - Pushing to feature branch (feat/173-markdown-file-creation-2f0877)
  - Verifying successful push and commit integrity

  Both phases follow the TDD pattern: RED (verification that something is needed), GREEN (minimal implementation),
  REFACTOR (validation and cleanup).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect file encoding (not UTF-8) | Use pathlib.Path.write_text() with explicit encoding=\"utf-8\" parameter |
  | Wrong line endings (CRLF instead of LF) | Git core.safecrlf configuration handles automatic normalization; verify with git diff |
  | File size outside expected range (100-600 bytes) | Write 2-3 sentences of normal prose; validate size before committing |
  | Commit message format incorrect | Follow established pattern from features 169-172 exactly; use template: \"feat(173): create markdown file test-87xoko.md with prose content\" |
  | Push fails or branch is stale | Ensure feature branch is checked out and up-to-date; pull origin before push if needed |
  | File overwrite or accidental deletion | Use git status to verify file creation before staging; ensure no existing test-87xoko.md file exists |
  | Prose quality below basic standard | Single review pass to ensure grammatically correct, readable, no major errors |
