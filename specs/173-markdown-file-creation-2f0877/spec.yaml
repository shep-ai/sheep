content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. Feature 173 creates a single test markdown file (`test-87xoko.md`)
  at the repository root with a title and prose content, continuing the pattern from features 169-172
  and consistent with 65+ existing test files in the repository.

  This feature demonstrates automated file creation, git integration, and conventional commit workflows
  in a simple, testable unit-of-work that fits within the Sheep platform's continuous feature
  development and testing paradigm.

  ## Success Criteria

  - [ ] File `test-87xoko.md` is created in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (e.g., `# My Title`)
  - [ ] File contains between 2-3 sentences of prose content below the heading
  - [ ] File is UTF-8 encoded with Unix line endings (LF, not CRLF)
  - [ ] File follows CommonMark markdown specification and renders correctly
  - [ ] Prose content is grammatically correct with no major spelling errors
  - [ ] File size is between 100-600 bytes (reasonable for title + 2-3 sentences)
  - [ ] File is staged to git (appears in staging area)
  - [ ] Commit message follows conventional commit format: `feat(173): Create markdown file test-87xoko.md with prose content`
  - [ ] Commit includes Co-Authored-By footer if required by project standards
  - [ ] Changes are pushed to feature branch `feat/173-markdown-file-creation-2f0877`
  - [ ] No existing files are modified or deleted
  - [ ] File path exactly matches: `test-87xoko.md` (case-sensitive filename)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-87xoko.md` in the repository root
  - **FR-2**: File must contain a single markdown H1 heading (title) using syntax `# Title`
  - **FR-3**: File must contain 2-3 sentences of narrative prose content below the heading
  - **FR-4**: File must be UTF-8 encoded with Unix line endings (LF)
  - **FR-5**: Content must follow CommonMark markdown specification
  - **FR-6**: Stage the newly created file to git index (git add test-87xoko.md)
  - **FR-7**: Create a conventional commit with message following pattern from features 169-172
  - **FR-8**: Push committed changes to the feature branch `feat/173-markdown-file-creation-2f0877`
  - **FR-9**: Verify no unintended files are created or modified during the process

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 100-600 bytes (validates appropriate content length)
  - **NFR-2**: Prose content must be grammatically correct, readable, and suitable for documentation
  - **NFR-3**: Implementation must follow the established pattern from features 169-172 for consistency
  - **NFR-4**: Filename must match exactly (case-sensitive): `test-87xoko.md`
  - **NFR-5**: File creation must not modify, overwrite, or delete any existing files or directories
  - **NFR-6**: Implementation time should not exceed 15 minutes (supports S size estimate)
  - **NFR-7**: Commit message format must match conventional commits standard (feat: description)
  - **NFR-8**: Line ending normalization must use LF (Unix) not CRLF (Windows), as configured by git

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose topic be unrestricted or domain-guided? | Completely unrestricted (any topic acceptable) | User spec explicitly states "about anything", indicating maximum flexibility. Enables fastest implementation. |
  | 2 | Should markdown use plain text only or allow rich formatting? | Plain text only (H1 + sentences, no formatting) | Maintains consistency with established pattern from features 169-172. Simpler implementation, appropriate for test artifacts. |
  | 3 | What prose quality bar should be enforced? | Basic quality (correct grammar, readable, no major errors) | Test artifact context suggests basic readability standards. Higher quality bar would extend size estimate beyond S. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-87xoko.md) to existing collection of 65+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites of existing files |
  | Git Repository | Low | Single commit and push following established pattern from features 169-172; no branch conflicts, complex merges, or destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; no impact on source code, modules, agents, flows, or platform functionality |
  | Configuration Files | None | No changes to pyproject.toml, .env, Dockerfile, docker-compose.yml, or any configuration files |
  | Tests & CI/CD | None | No new tests required; feature is a test artifact itself, not a functional feature; no modifications to test suite or workflows |

  ## Dependencies

  - Git repository with feature branch `feat/173-markdown-file-creation-2f0877` pre-created and checked out
  - Write access to repository root directory (for file creation)
  - Git configuration with user.name and user.email set (for creating commits)
  - Python 3.11+ for pathlib standard library (if using Python-based file I/O)
  - 65+ existing test files (test-*.md) as pattern reference and precedent
  - Network access to push to remote origin (GitHub or configured git remote)
  - UTF-8 text editor or tool capable of creating markdown files

  ## Size Estimate

  **S** (Small — 10-15 minutes of implementation work)

  This feature is estimated as Size Small because:

  - **File creation and prose writing**: ~5 minutes (choose topic, write heading, write 2-3 sentences)
  - **Format validation**: ~2 minutes (verify UTF-8 encoding, LF line endings, file size, basic grammar)
  - **Git operations**: ~3-5 minutes (stage file, create commit with correct message, push to origin)

  **Justification**:
  - Straightforward single-file creation with well-established pattern from 65+ precedent files
  - Minimal complexity; no testing, documentation, or configuration changes required
  - Completely unrestricted topic selection ("about anything") enables fast implementation without research
  - Basic quality standards (readable prose with correct grammar) match existing test files
  - No system dependencies, no infrastructure changes, no architectural decisions needed
  - Clear manual workflow established by features 169-172 eliminates exploration overhead

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria
  established, and product decisions identified with AI-recommended defaults. Feature is ready for
  implementation phase._
