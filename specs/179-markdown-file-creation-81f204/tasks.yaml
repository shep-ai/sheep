# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 179 creates a test markdown file (test-cyktqk.md) in the repository
  root following the established pattern from 178+ prior features (001-178).

  Implementation breaks into three core tasks across two phases:

  **Phase 1: File Creation with Content Generation**
  - Task 1: Generate markdown content (H1 + 2-3 sentences) via Claude LLM using
    content_generators module, write to disk with UTF-8/LF encoding

  **Phase 2: Validation and Git Integration**
  - Task 2: Validate created markdown file for structure, encoding, line endings,
    and file size using content_generators.validate_markdown_file()
  - Task 3: Stage file in git, create conventional commit message, push to
    feature branch using content_generators orchestration functions

  ## Workflow Logic

  1. File must be created and properly formatted before validation (Task 1 → Task 2)
  2. File must be valid before staging in git (Task 2 → Task 3)
  3. Validation prevents invalid commits and ensures consistent test artifacts
  4. Total effort approximately 9 minutes, well within the 10-15 minute estimate

  ## Key Implementation Details

  - **Leverage existing content_generators module** for all operations (no custom code)
  - **Single orchestrator call** (create_markdown_file) reduces boilerplate
  - **File creation in repository root** follows 178+ precedent pattern
  - **Conventional commit message format** ensures clean git history
  - **No modifications to /src/sheep/** application code or tests
  - **Zero impact** on source code, configuration, or CI/CD

  ## Task Dependencies

  ```
  task-1 (File Creation)
    ↓
  task-2 (Validation)
    ↓
  task-3 (Git Operations)
  ```

  Sequential execution ensures file exists before validation, file is valid
  before staging, and commit exists before push. Each task builds on successful
  completion of previous tasks.
