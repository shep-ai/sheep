# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 179 creates a single test markdown file (test-cyktqk.md) at the
  repository root using the content_generators orchestration module
  (src/sheep/content_generators.py). This module encapsulates the complete workflow:

  - **generate_markdown_content()**: LLM-based prose generation using Claude API
  - **write_markdown_file()**: Atomic file writing with UTF-8/LF encoding
  - **validate_markdown_file()**: Format validation (heading, sentence count, encoding, size)
  - **commit_markdown_file()**: Git staging + conventional commit via GitCommitTool
  - **push_markdown_file()**: Git push with upstream tracking via GitPushTool
  - **create_markdown_file()**: High-level orchestrator for complete workflow

  Test files are repository artifacts that do not integrate with /src/sheep/
  application code. They serve as validation artifacts for the Sheep platform's
  automated implementation capabilities, following the established pattern from
  features 001-178 (178+ test files already in repository).

  ## Key Design Decisions

  ### 1. Content Generation: LLM-Based vs. Hardcoded

  **Decision:** Use LLM-based content generation via
  content_generators.generate_markdown_content()

  **Chosen Over:**
  - Hardcoded prose (feature 178 approach) — works well but duplicates logic
    now available in content_generators module
  - Templates — add indirection and configuration overhead for single file
  - Random generation — risks incoherence; LLM ensures quality and diversity

  **Rationale:**
  Content_generators module is already implemented, tested, and available in
  the project. It provides: (1) Reusable, proven utilities reducing boilerplate;
  (2) Consistent prose quality via Claude API (verified by 178+ existing test
  files showing coherent, diverse topics: storytelling, resilience, innovation,
  patience, etc.); (3) Integration with orchestration functions that handle
  validation and git operations; (4) Significant improvement over feature 178's
  hardcoded prose, which predates this module's documentation.

  ### 2. File Persistence: pathlib via content_generators

  **Decision:** Use pathlib.Path.write_text() via
  content_generators.write_markdown_file() abstraction

  **Chosen Over:**
  - Direct open() context manager — requires manual encoding and newline handling
  - os.open() with os.write() — low-level, verbose, no advantage over pathlib
  - File templates/builders — unnecessary abstraction for simple, single file

  **Rationale:**
  pathlib is the established pattern across all 178+ test files in the
  repository. It is standard in Python 3.11+ (project requirement), handles
  UTF-8 encoding and file creation atomically, and works cross-platform.
  Content_generators module wraps this with validation, ensuring consistent
  encoding and line ending handling. Proven across existing test files with
  typical size 400-600 bytes (acceptable range 300-800 bytes).

  ### 3. Git Integration: Module Wrappers vs. Direct Subprocess

  **Decision:** Use content_generators module wrappers
  (commit_markdown_file, push_markdown_file) which delegate to GitCommitTool
  and GitPushTool

  **Chosen Over:**
  - Direct subprocess.run() calls — feature 178 approach; module abstracts
    these effectively, reducing boilerplate and error-prone sequencing
  - GitPython library — available in dependencies but unnecessary when module
    already wraps operations at appropriate abstraction level
  - Shell scripts — reduce transparency, complicate debugging

  **Rationale:**
  GitCommitTool and GitPushTool (src/sheep/tools/git_tools.py) provide
  transparent, explicit control over git operations (git add, git commit,
  git push) without additional abstraction layers. The content_generators
  module's wrapper functions ensure: (1) Consistent commit message formatting
  across all features; (2) Integrated logging and error handling; (3) Reduced
  implementation effort via single orchestrator call. Feature branch
  (feat/179-markdown-file-creation-81f204) is pre-created, so no branch
  creation logic needed.

  ### 4. Encoding and Line Endings: UTF-8/LF Standard

  **Decision:** UTF-8 encoding (no BOM), LF (Unix) line endings

  **Chosen Over:**
  - Platform-default encoding — introduces variability across developers/CI
  - CRLF line endings — increases file size, complicates diffs, inconsistent
    with 178+ existing test files
  - UTF-8 with BOM — violates CommonMark specification, adds 3 bytes
    unnecessarily

  **Rationale:**
  UTF-8 without BOM and LF line endings are the established pattern verified
  across all 178+ existing test files in the repository. pathlib.write_text()
  defaults to UTF-8 in Python 3.11+. Content_generators module explicitly
  specifies encoding="utf-8" when writing files. LF is standard in Unix/Linux
  environments and matches repository .gitattributes convention. This approach
  ensures CommonMark compliance, clean git diffs, and consistency with all
  prior features.

  ### 5. Implementation Scope: Single Orchestrator Call

  **Decision:** Call content_generators.create_markdown_file() orchestrator
  function for complete workflow

  **Chosen Over:**
  - Standalone script with manual sequencing — requires explicit calls to
    each function; feature 178 approach before module was available
  - Integration into /src/sheep/ application code — violates separation of
    concerns; test files are artifacts, not application logic
  - Custom module in tools/ — creates unnecessary coupling and maintenance
    burden for isolated, single-file task

  **Rationale:**
  The create_markdown_file() function orchestrates the entire workflow:
  content generation → file writing → validation → git staging → committing →
  pushing. This reduces implementation to a single, well-tested function call,
  maximizes code reuse, eliminates manual sequencing error potential, and
  ensures consistency with the established 178+ feature pattern. Implementation
  becomes straightforward: call create_markdown_file("test-cyktqk.md"),
  verify success, done.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation)** must come first because it establishes the test
  artifact that Phase 2 will validate and commit. File must exist with correct
  content before any downstream operations.

  **Phase 2 (Validation & Git Integration)** depends on successful file
  creation. Tasks are ordered: validate before committing (ensures only valid
  files are committed), then push after commit succeeds.

  ### Workflow Sequence

  1. Generate markdown content (H1 heading + 2-3 sentences) via Claude LLM
  2. Write file to disk (test-cyktqk.md, repository root, UTF-8/LF)
  3. Validate file format (heading, sentence count, encoding, size, line endings)
  4. Stage file in git (git add)
  5. Create commit with conventional message
  6. Push to feature branch

  ### Why Sequential Execution

  - File must exist before validation
  - File must be valid before staging (prevents invalid commits)
  - Staging must occur before commit
  - Commit must exist before push
  - Each step builds on prior successful completion; dependencies prevent
    downstream failure from invalid state

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | LLM API unavailable during content generation | Medium | Content_generators module includes fallback to hardcoded prose; feature will not block |
  | File encoding errors (BOM, CRLF line endings) | Medium | Content_generators.validate_markdown_file() checks encoding and line endings before committing; validation prevents invalid commits |
  | Git user configuration missing (user.name, user.email) | High | Pre-implementation check: verify git config is set; GitCommitTool will fail with clear error message if missing |
  | Insufficient file system permissions | High | Feature branch requires write access to repository root; pre-check via git status |
  | File size exceeds expected range (>800 bytes) | Low | Content_generators.generate_markdown_content() is prompt-engineered for 2-3 sentences; historical data (178+ files) confirms 300-800 byte range, typical 400-600 bytes |
  | Sentence count incorrect (not exactly 2-3) | Medium | Content_generators.validate_markdown_file() explicitly counts sentences and rejects invalid content; prevents non-conformant files from being committed |
  | Push fails (remote branch issues) | Low | Feature branch (feat/179-markdown-file-creation-81f204) is pre-created; push should succeed |
  | Uncommitted changes in working tree | Low | Feature is isolated to single file; pre-check: `git status --short` should show only test-cyktqk.md |
  | Content_generators module not available | High | Module is part of project structure (src/sheep/content_generators.py); confirmed to exist during research phase |
  | Commit message format incorrect | Low | Content_generators.commit_markdown_file() enforces conventional format; message is templated and validated |

  ## Success Criteria Verification

  All success criteria from the feature specification will be validated through
  task acceptance criteria and TDD cycles:

  - ✓ File created at repository root with correct name (test-cyktqk.md)
  - ✓ Valid markdown H1 heading as title (validated via regex)
  - ✓ Exactly 2-3 sentences of prose (validated via sentence count)
  - ✓ UTF-8 encoding with no BOM (validated via binary read and decode)
  - ✓ LF line endings (validated via byte inspection)
  - ✓ File size within 300-800 bytes (validated via file size check)
  - ✓ File staged in git (verified via git status/diff --cached)
  - ✓ Conventional commit message (feat(179): create markdown file...)
  - ✓ Proper git user configuration (enforced by GitCommitTool)
  - ✓ Changes pushed to feature branch (verified via git push output)
  - ✓ Valid markdown syntax (validated during file write)
  - ✓ Grammatically correct prose (LLM-generated ensures coherence)

  ## Notes

  - **Total Effort:** ~9-10 minutes (well within S estimate of 10-15 minutes)
  - **Code Changes:** Zero modifications to /src/sheep/ application code
  - **File Changes:** Single test artifact creation (test-cyktqk.md at root)
  - **Dependencies:** All required utilities exist in content_generators module;
    no new installations needed
  - **Scope:** Repository root only; no impact on application code, tests, or
    configuration files
  - **Pattern Consistency:** Identical to features 178, 177, 176, 175 and 001-178
  - **Testing:** Pattern already validated across 178+ prior features; no new
    test infrastructure required
