content: |
  ## Architecture Overview

  Feature 155 creates a single markdown test file at the repository root following the
  established pattern of 150+ existing test files. The implementation has minimal
  architectural complexity: pure file I/O + validation + git workflow.

  **Design principles:**
  - Zero external dependencies (Python stdlib + Git only)
  - Minimal code footprint (straightforward imperative approach)
  - No source code modifications (/src/sheep/ untouched)
  - Pattern consistency with features 151-154 and all 150+ precedent test files

  **Integration points:**
  - Repository root directory (adds one test file among 150+)
  - Git repository (single commit following conventional format)
  - Python ecosystem (uses standard library only)

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Decision:** `Path("test-0h4oez.md").write_text(content, encoding='utf-8', newline="")`

  **Alternatives rejected:**
  - os.open()/os.write() — more verbose, requires file handle management
  - subprocess with external tools — unnecessary complexity, platform inconsistencies

  **Rationale:** pathlib is the modern Python standard (PEP 519) explicitly required by
  NFR-5. The critical parameter is `newline=""` which disables platform-specific line
  ending conversion (preventing CRLF on Windows, preserving LF per NFR-2).

  ### 2. Cross-Platform Line Ending Preservation

  **Decision:** Include `newline=""` parameter in write_text()

  **Problem solved:** Python's text mode write_text() defaults to universal newlines
  mode, which converts `\n` to `\r\n` on Windows. NFR-2 requires Unix-style LF on all
  platforms. The `newline=""` parameter disables this conversion while keeping code in
  text mode (readable, maintainable).

  **On Windows specifically:**
  - Without `newline=""`: content `"# Title\n\nText"` → file contains `# Title\r\n\r\nText`
  - With `newline=""`: content `"# Title\n\nText"` → file contains `# Title\n\nText`

  ### 3. UTF-8 Encoding Without Byte Order Mark

  **Decision:** Use Python's standard UTF-8 codec (encoding='utf-8')

  **Key fact:** Python's utf-8 codec does NOT emit a Byte Order Mark (BOM) by default.
  This meets NFR-1 requirement without additional complexity.

  **Alternatives rejected:**
  - utf-8-sig codec — explicitly adds BOM (violates NFR-1)
  - Manual file handling — equivalent functionality but more verbose

  ### 4. Content Construction: Simple String Literals

  **Decision:** Direct inline string construction (f-string or literal)

  **Rationale:** Markdown structure is trivially simple (`# Heading\n\n<prose>`).
  Template engines (Jinja2, etc.) add dependencies and complexity for zero benefit.
  Direct string construction is readable, maintains zero dependencies (NFR-9),
  and matches all 150+ existing test files.

  **Example:**
  ```python
  content = "# Title\n\nFirst sentence. Second sentence. Third sentence."
  Path("test-0h4oez.md").write_text(content, encoding='utf-8', newline="")
  ```

  ### 5. Git Operations: subprocess.run()

  **Decision:** Use `subprocess.run(['git', 'add', ...], check=True)` for all git operations

  **Alternatives rejected:**
  - GitPython library — adds external dependency (violates NFR-9), overkill for simple ops
  - Shell scripts — platform compatibility issues on Windows

  **Rationale:** subprocess.run() is built-in, portable, sufficient for straightforward
  commands (add, commit, push). Argument list format (not shell=True) prevents injection.
  check=True raises exception on non-zero exit for clear error handling.

  ### 6. File Validation: Native Python Checks

  **Decision:** Post-write validation using only pathlib and file operations

  **Checks implemented:**
  - File existence: `Path.exists()`
  - File size: `Path.stat().st_size` (validate 400-600 byte range)
  - Encoding: Read as UTF-8, verify no BOM prefix (b'\xef\xbb\xbf')
  - Line endings: Assert no CRLF present (`'\r\n' not in content`)
  - Markdown structure: First line starts with '#', contains blank line separator

  **Rationale:** All criteria are verifiable with simple Python checks. No external
  validators (linters, AST parsers) needed. Clear, fast, dependency-free.

  ### 7. Topic Selection: Manual, Diverse, Human-Written

  **Decision:** Implementer chooses topic and writes 2-3 sentences of original prose

  **Rationale:** Spec explicitly states prose topic is "completely unrestricted — any
  subject chosen by the implementer" (NFR-8). All 150+ existing test files have diverse,
  human-written content. Manual selection ensures:
  - Content variety (not repetitive boilerplate)
  - Logical coherence (heading matches prose topic, per NFR-11)
  - Grammatical correctness (NFR-10)
  - Pattern consistency with all similar features

  ## Implementation Strategy

  **Three sequential phases** (can implement all code in single file, but phases define
  logical grouping):

  1. **Phase 1: File Creation** — Implement file creation with proper encoding/line
     endings. Critical: test on Windows to verify CRLF doesn't appear.

  2. **Phase 2: Validation** — Implement all validation checks. These must pass before
     git operations to ensure file meets requirements. Validation provides confidence
     and early error detection.

  3. **Phase 3: Git Integration** — Implement git workflow. Only proceeds after
     validation passes. Uses subprocess for transparency and portability.

  **Sequential ordering rationale:** File must exist before validation, validation must
  pass before git operations. No parallelization possible (strict dependencies).

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  |------|--------|-----------|
  | Line ending corruption on Windows | High — violates NFR-2 if CRLF appears | Explicit `newline=""` parameter in write_text(), verified by validation |
  | Encoding/BOM mismatch | Medium — violates NFR-1 | Explicit encoding='utf-8' (no BOM), validated by reading first bytes |
  | Invalid markdown structure | Medium — violates markdown spec | Validation checks heading format and blank line presence |
  | Git operation failure (permission, config) | Low — recoverable | Use check=True to catch errors, provide clear error messages |
  | File size outside range | Low — indicates content malformed | Validation enforces 400-600 byte range |
  | Missing or incomplete prose | Low — violates content requirements | Validation counts sentences and checks logical structure |

  ## Success Criteria Verification

  All success criteria from spec will be verified during implementation:

  - ✓ File exists at repository root (validation)
  - ✓ Exactly one H1 heading (validation)
  - ✓ Exactly 2-3 sentences of prose (validation)
  - ✓ UTF-8 without BOM (validation + implementation)
  - ✓ LF line endings (validation + explicit newline="" parameter)
  - ✓ Proper markdown structure (validation)
  - ✓ File size 400-600 bytes (validation)
  - ✓ Staged with git add (subprocess call)
  - ✓ Committed with exact message (subprocess call + validation)
  - ✓ On feature branch (verification)
  - ✓ Pushed to remote (subprocess call)
