content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete — all technical decisions made, no architectural complexity

  ## Technology Stack Overview

  This feature uses **only Python standard library and Git** — no external dependencies.

  | Component | Technology | Justification |
  |-----------|-----------|---------------|
  | File I/O | Python pathlib.Path | Modern standard, project convention, no dependencies |
  | Text encoding | UTF-8 (Python codec) | Built-in, no BOM by default, meets NFR-1 |
  | Line endings | Explicit newline="" parameter | Preserves LF on all platforms including Windows |
  | Git operations | subprocess.run() | Built-in, portable, no external dependencies |
  | Validation | Native Python (pathlib, file operations) | Simple checks, no external libraries needed |

  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path

  **Chosen:** Use `pathlib.Path("test-0h4oez.md").write_text(content, encoding='utf-8', newline="")`

  **Rejected:**
  - `os.open()` / `os.write()` — More verbose, requires file handle management, less idiomatic Python
  - subprocess for external tools — Unnecessary complexity, platform inconsistencies, adds external dependency

  **Rationale:**
  pathlib is the modern Python standard (PEP 519) and is explicitly required by NFR-5.
  The `.write_text()` method provides a clean one-liner for creating text files with full control
  over encoding and line ending behavior. All 150+ existing test files in the repository use pathlib,
  establishing the established pattern that this feature must follow.

  ### 2. Line Ending Control: Explicit newline="" Parameter

  **Chosen:** Include `newline=""` in write_text() call to preserve LF line endings on all platforms

  **Rejected:**
  - `os.linesep` — Platform-dependent (CRLF on Windows), violates NFR-2 requirement for Unix LF
  - Binary mode with bytes — Functionally correct but adds unnecessary complexity for text content

  **Rationale:**
  Python's text mode write_text() defaults to "universal newlines" mode, which converts `\n` to `\r\n`
  on Windows. To preserve LF consistently across platforms (NFR-2), the `newline=""` parameter must
  be explicitly set. This is the standard Python approach documented in PEP 3116.

  On Windows specifically:
  - Without `newline=""`: `\n` → `\r\n` (CRLF, violates requirement)
  - With `newline=""`: `\n` → `\n` (LF, meets requirement)

  This approach is recommended in Python's official documentation for cross-platform line ending control.

  ### 3. UTF-8 Encoding: Python's Default UTF-8 Codec

  **Chosen:** Use `encoding='utf-8'` (Python standard UTF-8 codec, no BOM by default)

  **Rejected:**
  - `utf-8-sig` codec — Explicitly adds a BOM, violates NFR-1
  - Manual open() with encoding — Functionally equivalent but more verbose

  **Rationale:**
  Python's standard UTF-8 codec does not emit a Byte Order Mark (BOM) by default, meeting NFR-1.
  Using explicit `encoding='utf-8'` parameter ensures consistent behavior across systems.
  This is simpler and clearer than alternative approaches.

  ### 4. Content Construction: Simple String Literals

  **Chosen:** Manual string construction using f-string or literal with explicit newlines

  **Example structure:**
  ```python
  content = "# Topic Heading\n\nFirst sentence about the topic. Second sentence providing more detail. Third sentence concluding the thought."
  ```

  **Rejected:**
  - Template engines (Jinja2) — Adds external dependency, overkill for trivial markdown structure
  - Markdown generation libraries — Adds dependencies, violates NFR-9

  **Rationale:**
  The markdown structure is extremely simple: a single heading line, blank line, and prose.
  Template engines add unnecessary complexity and dependencies. Direct string construction is
  the most straightforward approach, matches all 150+ existing test files,
  and requires no imports beyond pathlib. Code is maximally readable.

  ### 5. Git Operations: subprocess.run()

  **Chosen:** Use `subprocess.run(['git', 'add', 'test-0h4oez.md'], check=True)` and similar for commit/push

  **Rejected:**
  - GitPython library — Adds external dependency (violates NFR-9)
  - Bash/shell scripts — Platform compatibility issues, less transparent

  **Rationale:**
  Requirement NFR-9 explicitly forbids new dependencies.
  subprocess.run() is part of Python's standard library, portable across Windows/Unix,
  and sufficient for straightforward git operations. It provides:
  - Clear error handling (check=True raises on non-zero exit)
  - Transparent command logging
  - No hidden behavior or library versions to manage

  GitPython would add ~30KB of dependencies for operations that are trivial with subprocess.

  ### 6. File Validation: Post-Write Native Python Checks

  **Chosen:** After writing file, validate using:
  - File existence check: `Path.exists()`
  - File size: `Path.stat().st_size` (400-600 bytes)
  - Encoding: Read with UTF-8 and confirm no BOM
  - Line endings: Check content contains only `\n`, no `\r\n`
  - Markdown structure: Verify first line is heading (starts with `#`), has blank line, followed by prose

  **Rejected:**
  - No validation — Risky, no confidence file meets all criteria
  - Complex validators (linters, AST parsing) — Overkill, unnecessary dependencies

  **Rationale:**
  Spec includes specific success criteria (size range, encoding, line endings, markdown syntax).
  Simple Python checks can verify these without external tools. Validation logic is:
  - Fast (single file, small size)
  - Clear (each check has obvious meaning)
  - Dependency-free (uses only pathlib and file I/O)
  - Matches pattern from 150+ existing test files

  ### 7. Topic Selection: Manual, Diverse, Human-Written

  **Chosen:** Implementer manually selects a topic and writes unique prose sentences

  **Examples of valid topics (based on 150+ existing files):**
  - Power of innovation in modern society
  - Clear communication in teams
  - Problem-solving methodologies
  - Discovery and exploration
  - Technology trends and impact
  - Creative thinking patterns
  - Any other unrestricted topic (NFR-8)

  **Rejected:**
  - Boilerplate template prose — Reduces diversity, violates NFR-8 (unrestricted topic)
  - AI-generated content — Adds complexity, unnecessary for test files, inconsistent with precedents

  **Rationale:**
  Spec explicitly states prose topic is "completely unrestricted — any subject chosen by the implementer" (NFR-8).
  All 150+ existing test files have diverse, human-written content on different topics.
  Manual topic selection ensures:
  - Content remains diverse and interesting
  - Heading and prose logically cohere (NFR-11)
  - Prose is grammatically correct (NFR-10)
  - Pattern matches all similar features (151-154)

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  |---------|---------|----------|-----------|
  | pathlib (Python stdlib) | File I/O | **Use** | Required by NFR-5, standard for modern Python, no dependencies |
  | subprocess (Python stdlib) | Git commands | **Use** | Standard library, portable, no external dependencies |
  | utf-8 (Python codec) | Text encoding | **Use** | Built-in, no BOM by default, meets NFR-1 |
  | os (Python stdlib) | File operations | **Partial** | Use only for path verification if needed; pathlib preferred |
  | GitPython | Git abstraction | **Reject** | External dependency (violates NFR-9), overkill for simple operations |
  | Jinja2 / mako | Template engines | **Reject** | External dependency, unnecessary for trivial markdown structure |
  | markdown / mistune | Markdown generation | **Reject** | External dependencies, not needed for simple static content |

  ## Security Considerations

  **Profile:** Low risk — feature creates static content with no dynamic input, no network operations, no authentication.

  ### Threat Analysis

  | Threat | Risk | Mitigation |
  |--------|------|-----------|
  | File permission escalation | Low | File created with default permissions (inherited from parent directory). No special permissions requested. |
  | Malicious prose injection | Low | Prose is user-selected and human-written for test file. No dynamic input processing. |
  | Git command injection | Low | Using subprocess.run() with argument list (not shell=True) prevents command injection. Arguments are hardcoded. |
  | Path traversal | Low | Filename is hardcoded as "test-0h4oez.md", no user input for path. File always created at repo root. |
  | Encoding attacks | Low | Explicit UTF-8 encoding with `encoding='utf-8'` prevents encoding-based exploits. |

  ### Mitigations

  - Use subprocess.run() with argument list (never shell=True) to prevent command injection
  - Hardcode filename and path; never interpolate user input into git commands
  - Validate file size is within expected range (400-600 bytes) to catch corrupted writes
  - Verify encoding is UTF-8 without BOM before considering operation successful

  ## Performance Implications

  **Profile:** Negligible — single small file write, minimal I/O, single git operation.

  | Operation | Complexity | Impact |
  |-----------|-----------|---------|
  | File creation (~500 bytes) | O(1) | ~1ms disk I/O |
  | Validation (file checks) | O(1) | <1ms (single small file) |
  | Git add | O(n) where n = files in repo | <10ms (single file add, standard git performance) |
  | Git commit | O(n) where n = commits | ~50-100ms (depends on repo size, standard operation) |
  | Git push | O(n) where n = new commits | 100-500ms (network-dependent) |
  | **Total** | Linear (dominated by network) | 150-600ms (mostly network latency) |

  ### Optimizations

  - No caching needed (single file, run once)
  - No database queries (file system only)
  - No parallel processing opportunities (sequential file operations)
  - Git operations are standard, no custom optimization possible

  **Conclusion:** Performance is not a concern. Feature is I/O-bound and dominated by network latency of git push. No optimization needed.

  ## Architecture Notes

  ### Integration with Existing Codebase

  This feature integrates minimally with the codebase:

  - **No source code impact:** Does not modify `/src/sheep/`, tests, or configuration
  - **No dependency changes:** Uses only Python standard library (pathlib, subprocess)
  - **Repository structure:** Adds one test file to root directory (same as 150+ existing files)
  - **Git workflow:** Follows established pattern from features 151-154 (stage, commit, push)

  ### Pattern Consistency

  All decisions align with established patterns from 150+ existing test files:

  - **File structure:** `# Heading\n\n<prose>` (one H1, blank line, 2-3 sentences)
  - **File encoding:** UTF-8 without BOM
  - **Line endings:** Unix LF
  - **File size:** 400-600 bytes (natural consequence of structure)
  - **Git workflow:** stage → commit → push on feature branch
  - **Commit message:** Conventional Commits format (feat/fix/etc.)
  - **Content:** Human-written prose on implementer-chosen topic

  ### No Architectural Complexity

  This feature requires no:
  - New modules or abstractions
  - Dependency management changes
  - Configuration or schema updates
  - Database changes
  - API design decisions
  - Authentication/authorization
  - Caching or optimization
  - Error handling beyond standard file I/O

  The feature is purely **file I/O + git workflow**, with straightforward Python standard library usage.

  ## Risk Assessment

  **Overall Risk:** Minimal

  - **Technical Risk:** None — well-established pattern with 150+ precedents
  - **Integration Risk:** None — isolated to single test file, no dependencies on source code
  - **Git Risk:** Low — standard commit/push, feature branch already created
  - **Data Risk:** None — no sensitive data, test file only
  - **Dependency Risk:** None — only standard library used

  ## Conclusion

  Feature 155 is a straightforward file creation task with no architectural complexity or new technical decisions needed. All implementation approaches are well-established through 150+ precedent test files.

  **Key decisions:**
  1. Use pathlib.Path.write_text() with explicit newline="" for cross-platform LF support
  2. Use subprocess.run() for git operations (no external dependencies)
  3. Simple string construction for markdown content (no templates)
  4. Post-write validation using native Python checks
  5. Manual topic selection (diverse, human-written prose)

  **Status:** Ready for implementation planning. All technical decisions resolved, no open questions, low risk.

