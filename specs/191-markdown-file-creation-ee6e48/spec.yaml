content: |
  ## Problem Statement

  Create a single markdown file named test-u1rtbw.md in the repository root containing an H1 heading and 2-3 sentences of prose content about any topic. The file must follow the established pattern used by 190+ existing test files in the repository: UTF-8 encoding, Unix LF line endings, proper markdown structure, comprehensive validation, and be committed and pushed to git.

  This feature is part of a systematic pattern (features 1-191) that creates test markdown files within the Sheep agentic platform. Proven implementations exist across 190 preceding features, with recent examples (features 189-190) demonstrating the exact workflow.

  ## Success Criteria

  - [ ] File test-u1rtbw.md is created in the repository root directory
  - [ ] File contains exactly one H1 heading (single # followed by title text)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without BOM (byte order mark)
  - [ ] File uses Unix LF line endings (\\n, not \\r\\n or \\r)
  - [ ] File structure validation passes (proper markdown format)
  - [ ] File is staged with git add
  - [ ] File is committed with conventional commit message: "feat(191): create markdown file test-u1rtbw.md"
  - [ ] Commit is pushed to remote repository
  - [ ] No validation warnings or errors during execution
  - [ ] File size is approximately 450-550 bytes (consistent with pattern)
  - [ ] File is readable as UTF-8 text without corruption

  ## Functional Requirements

  - **FR-1**: The system MUST create a markdown file named "test-u1rtbw.md" in the repository root directory
  - **FR-2**: The file MUST contain exactly one H1 heading (single # followed by title text)
  - **FR-3**: The file MUST contain 2-3 sentences of prose content following the heading
  - **FR-4**: The file MUST be encoded in UTF-8 without BOM
  - **FR-5**: The file MUST use Unix LF (\\n) line endings exclusively
  - **FR-6**: The file MUST be validated for proper markdown structure before git operations
  - **FR-7**: The file MUST be validated for UTF-8 encoding before git operations
  - **FR-8**: The file MUST be validated for Unix LF line endings before git operations
  - **FR-9**: The file MUST be added to git staging area using git add
  - **FR-10**: The file MUST be committed with the message "feat(191): create markdown file test-u1rtbw.md"
  - **FR-11**: The commit MUST be pushed to the remote repository
  - **FR-12**: All validation checks MUST complete successfully before proceeding to git operations

  ## Non-Functional Requirements

  - **NFR-1**: File size SHOULD be between 450-550 bytes to maintain consistency with existing test files
  - **NFR-2**: Validation checks MUST execute completely before any git operations begin
  - **NFR-3**: Encoding validation MUST detect and reject non-UTF-8 content with clear error messages
  - **NFR-4**: Line ending validation MUST detect and reject CRLF or CR-only line endings with clear error messages
  - **NFR-5**: Markdown structure validation MUST verify H1 heading presence and prose sentence count
  - **NFR-6**: Implementation MUST use pathlib for cross-platform file I/O operations
  - **NFR-7**: Git operations MUST use subprocess module to execute git commands
  - **NFR-8**: Implementation SHOULD follow the established patterns from reference implementations (features 185-190)
  - **NFR-9**: Error messages SHOULD provide specific details about validation failures
  - **NFR-10**: Implementation SHOULD be deterministic and produce identical output across runs

  ## Product Questions & Decisions

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose content: fixed template or randomly generated? | Fixed template text | Maintains consistency with 190+ prior implementations, reduces complexity, ensures reproducible test results |
  | 2 | Error handling: fail fast or graceful degradation? | Fail fast with exit code | Matches comprehensive validation requirement, prevents invalid files in repository, established pattern in reference implementations |
  | 3 | Commit message format? | feat(191): create markdown file test-u1rtbw.md | Matches pattern from features 188-190, provides feature number traceability, clear action description |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation built on CrewAI. The repository contains:

  - **Root directory**: Contains 190+ test markdown files (test-*.md) following the same pattern, plus documentation and configuration files
  - **specs/ directory**: Specifications for all features, numbered 1-191, each with its own subdirectory
  - **src/sheep/**: Main Python package containing agents, flows, tools, and configuration
  - **Reference implementations**: create_markdown_file.py, create_markdown.py demonstrate the complete pattern

  This feature extends the established pattern of creating test markdown files in the repository root, which is a core capability of the Sheep platform.

  ### Architecture Patterns

  The codebase follows these key patterns relevant to this feature:

  1. **File Creation Pattern**: Create files with specific structure (H1 heading + prose), proper encoding (UTF-8), and line endings (Unix LF)
  2. **Validation Pattern**: Comprehensive validation checks on file properties before committing
  3. **Git Integration Pattern**: Consistent workflow of git add → commit → push with conventional commit messages
  4. **Feature Numbering**: Sequential feature numbers with unique identifiers (test-u1rtbw in this case)

  Multiple reference implementations exist in the codebase:
  - create_markdown_file.py
  - create_markdown.py
  - Established pattern across features 101-190

  ### Relevant Technologies

  - **Python pathlib**: Cross-platform file I/O for creating and validating markdown files
  - **subprocess module**: Execute git commands (add, commit, push) programmatically
  - **UTF-8 encoding**: Ensure proper text encoding without BOM
  - **Markdown format**: Standard markdown syntax with H1 headings (# Title)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | Low | Creates single new file (test-u1rtbw.md) following established pattern of 190+ existing test-*.md files |
  | Git repository | Low | Standard git workflow (add, commit, push) using subprocess to execute git commands |
  | File system | Low | Simple file write operation (~450-550 bytes) with UTF-8 encoding and LF line endings |
  | Validation layer | Low | File structure, encoding, and line ending validation reusing patterns from existing implementations |

  ## Dependencies

  **External Dependencies:**
  - Git (version control system) — must be available in PATH for subprocess calls

  **Internal Dependencies:**
  - Established markdown file patterns from existing 190+ test files (test-xgtwtq.md, test-ir293z.md, test-khrvcn.md, etc.)
  - Repository must be a valid git repository with remote configured
  - Python 3.11+ with standard library modules (pathlib, subprocess, sys, os)

  **Known Working Examples:**
  - 190+ similar test markdown files already exist in repository root
  - Reference implementations: create_markdown_file.py, create_markdown.py demonstrate the complete pattern
  - Features 188-190 all completed identical tasks successfully
  - Commit history shows consistent successful pattern with features 185-190

  **No New Dependencies Required**
  - Only Python standard library modules needed
  - File I/O operations handled by pathlib (already used throughout codebase)
  - Git operations via subprocess (standard pattern across repository)

  ## Size Estimate

  **S** — 1-2 hours of work

  **Justification:**
  - Trivial complexity: Single file creation following an established, well-documented pattern with 190 prior implementations
  - No new code paths or logic required: Copy pattern from proven reference implementations (features 185-190, create_markdown_file.py)
  - No external dependencies: Only Python standard library (pathlib, subprocess)
  - Clear success criteria: H1 heading + 2-3 sentences, proper encoding/line endings, git workflow
  - Expected file size: ~450-550 bytes (consistent with similar test files)
  - No architectural decisions required: Pattern is already established and validated
  - Validation is straightforward: File existence, encoding, line endings, markdown syntax checks
  - Reference implementations readily available and tested across 190 prior features
  - Git operations well-tested and reliable

  ---

  _Requirements phase completed — proceed with implementation planning_
