content: |
  ## Summary

  Feature 191 is implemented across 8 concrete tasks organized into 5 phases. Each task follows TDD
  (RED-GREEN-REFACTOR) cycles to ensure quality and testability.

  **Phase 1 (Setup):** Task 1 defines constants for filename, title, and prose template.

  **Phase 2 (File Creation):** Task 2 implements core file creation using pathlib with explicit UTF-8
  encoding and Unix LF line endings, with error handling for existing files.

  **Phase 3 (Validation, parallel):** Tasks 3-6 implement four independent validation functions:
  - Task 3: UTF-8 encoding validation (rejects BOM)
  - Task 4: Unix LF line ending validation (rejects CRLF/CR)
  - Task 5: Markdown structure validation (H1 + 2-3 sentences)
  - Task 6: File size validation (450-550 bytes)

  **Phase 4 (Git Integration):** Task 7 implements three git operations:
  - git add (staging)
  - git commit (with conventional message)
  - git push (to remote)

  **Phase 5 (Integration):** Task 8 creates main() entry point that orchestrates all previous
  tasks, ensures validations complete before git operations, and implements error handling.

  **Execution Flow:**
  1. Create markdown file (pathlib with UTF-8, LF)
  2. Validate encoding (reject BOM)
  3. Validate line endings (reject CRLF)
  4. Validate structure (H1 + 2-3 sentences)
  5. Validate size (450-550 bytes)
  6. Stage with git add
  7. Commit with "feat(191): create markdown file test-u1rtbw.md"
  8. Push to remote origin

  **Total Effort:** 1.5 hours (~10-20 minutes per task)
