content: |
  ## Architecture Overview

  This feature implements a straightforward, automation-first workflow that generates and
  commits a single markdown file following the well-established pattern from features 150-198.
  The implementation is self-contained Python code that orchestrates three distinct phases:
  content generation, file creation with validation, and git integration.

  The architecture fits cleanly into the Sheep platform's automation philosophy: the system
  generates unique, meaningful content (not boilerplate), validates quality comprehensively
  before committing, and integrates seamlessly with git workflows. No modifications to existing
  code, configuration, or infrastructure are required. The implementation uses only Python
  standard library (pathlib, subprocess, re) and the Claude API (already available in the
  platform environment).

  ### Existing Pattern Reference

  Analysis of the 199+ existing test markdown files (test-*.md) establishes a clear pattern:

  ```
  # Title Text
  [blank line]
  Sentence one. Sentence two. Sentence three.
  [final newline for LF ending]
  ```

  Key characteristics observed across all precedent files:
  - H1 ATX-style heading with space after `#` (CommonMark required)
  - Blank line separating heading from prose (CommonMark block structure)
  - Exactly 2-3 sentences with clear thematic alignment to title
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - File size 250-600 bytes (consistent across all existing test files)
  - Professional prose quality (AI-generated in features 150-198)

  The implementation must produce files indistinguishable from this 199+ file corpus, ensuring
  consistency and maintaining platform credibility as an automated system capable of reliable,
  high-quality artifact generation.

  ## Key Design Decisions

  ### 1. Content Generation: Claude API (Not Static Templates)

  **Decision:** Use Claude API to generate unique, coherent prose for each file.

  **Alternatives Considered:**
  - Static templates: Does not meet \"meaningful and coherent\" requirement, produces
    indistinguishable boilerplate, contradicts platform automation philosophy
  - Manual human writing: Defeats automation purpose, does not scale with platform design

  **Rationale:** Claude API is available in the platform environment (evidenced by features
  150-198) and generates unique, thematically coherent prose that maintains alignment between
  title and content. This approach demonstrates the platform's automation-first philosophy and
  maintains the quality baseline established across 199+ existing test files. The flexibility
  of AI generation supports the \"about anything\" requirement without requiring predefined
  template variations.

  **Impact:** 3-5 minutes for content generation including API latency (normal for this
  platform capability).

  ### 2. File Writing: Python pathlib with Explicit Encoding Control

  **Decision:** Use `pathlib.Path.write_text()` with explicit `encoding=\"utf-8\"` and
  `newline=\"\\n\"` parameters.

  **Alternatives Considered:**
  - `open()` context manager: More verbose, requires manual resource management, less pythonic
    for single-write operations
  - `os.path` with `os.write()`: Deprecated pattern, requires bytes conversion, less readable

  **Rationale:** pathlib is the Python 3.11+ standard for file I/O. The `write_text()` method
  provides clean, modern syntax while accepting explicit encoding and newline parameters that
  guarantee UTF-8 (no BOM) and Unix LF line endings. This approach eliminates the need for
  post-hoc encoding validation or manual byte handling. The implementation satisfies strict
  encoding requirements without additional complexity.

  **Impact:** Guarantees encoding/line-ending correctness by design, reducing validation
  complexity.

  ### 3. Validation: Comprehensive Pre-Commit Checks

  **Decision:** Validate all success criteria before staging with `git add`.

  **Alternatives Considered:**
  - Minimal validation (file exists, H1 present, sentence count): Misses encoding/line-ending
    errors that cause cross-platform issues and violate quality standards from features 150-198
  - No validation: Risks committing malformed files, violates platform quality baseline,
    requires rework

  **Rationale:** The feature specification mandates comprehensive validation of markdown
  syntax, sentence count, UTF-8 encoding, LF line endings, and file size. These constraints
  are observed across all 199+ existing test files, representing a platform quality standard.
  Validation adds minimal overhead (2-3 minutes) and catches errors early, preventing rework.
  The validation pipeline checks:
  - H1 heading present at line start (CommonMark structure)
  - Exactly 2-3 sentences (regex-based boundary detection)
  - UTF-8 encoding without BOM
  - Unix LF line endings only (no CRLF)
  - File size 250-600 bytes (typical for pattern)
  - CommonMark syntax compliance

  **Impact:** Ensures all files meet consistency standards before commit; prevents encoding
  rework.

  ### 4. Git Integration: subprocess Module (Not External Libraries)

  **Decision:** Use Python `subprocess` module for `git add`, `git commit`, `git push`.

  **Alternatives Considered:**
  - GitPython library: External dependency violating NFR-2 (standard library only),
    unnecessary complexity
  - HTTP API calls: Overly complex, requires authentication handling, loses git semantics

  **Rationale:** subprocess is part of Python standard library and provides direct, reliable
  access to git commands with clear error reporting. The feature explicitly requires no
  external package dependencies (NFR-2). subprocess enables clean execution of conventional
  commit workflow: stage file, create commit with templated message format, push to feature
  branch. The implementation uses `shell=False` and passes arguments as a list to prevent
  command injection.

  **Impact:** Minimizes dependencies, maintains full compatibility with git semantics and
  error handling.

  ### 5. Markdown Format: CommonMark-Compliant Structure

  **Decision:** Use CommonMark-specified ATX heading (H1) with blank line separation.

  **Alternatives Considered:**
  - Non-standard heading formats: Violates CommonMark spec, inconsistent with existing test files
  - Direct prose after heading (no blank line): Violates CommonMark block structure rules

  **Rationale:** The feature requires CommonMark compliance (NFR-3). Analysis of existing test
  files confirms the pattern: `# Title`, blank line, prose. This structure ensures valid
  markdown parsing across all processors and maintains consistency with 199+ existing test
  files. The blank line between heading and prose is required by CommonMark for proper block
  separation.

  **Impact:** Guarantees markdown compatibility and consistency with established pattern.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Content Generation) → Phase 2 (File Creation) → Phase 3 (Git Integration)**

  1. **Content generation first:** Must generate and validate prose before writing to disk.
     Allows retry if generated content fails validation (e.g., insufficient sentence count)
     without filesystem pollution.

  2. **File creation and validation second:** Once content is validated, write to disk and
     verify all file-level criteria (encoding, line endings, file size, structure) before
     staging. Catches encoding/structure errors before git operations.

  3. **Git integration last:** Only stage and commit once all quality validation is complete.
     Ensures every commit contains a valid, well-formed file that meets all success criteria.

  This ordering prevents rework: failed validation at any stage is resolved before proceeding,
  and only fully-validated files are committed.

  ### Implementation Approach

  1. **Generate Content (Phase 1):**
     - Call Claude API with prompt requesting title and 2-3 sentences on any topic
     - Parse response to extract title and prose
     - Validate prose has exactly 2-3 sentences and reasonable length (100-300 chars)
     - Retry with different topic if validation fails

  2. **Write File (Phase 2):**
     - Format content: `# Title\\n\\nProse sentences.\\n`
     - Write to repository root as test-nttet0.md using pathlib.Path.write_text() with
       encoding=\"utf-8\" and newline=\"\\n\"
     - Read file back and validate encoding, line endings, structure, and size

  3. **Git Workflow (Phase 3):**
     - Execute `git add test-nttet0.md` via subprocess
     - Execute `git commit -m \"feat(199): Create markdown file test-nttet0.md with title and prose content\"`
     - Execute `git push -u origin feat/199-markdown-file-creation-5e3e07`
     - Verify commit exists on feature branch

  **Estimated Duration:** 10-15 minutes total (includes Claude API latency and comprehensive
  validation).

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API unavailability or rate limits | Implement retry logic with exponential backoff; implement timeout handling; fallback error message if API fails after retries |
  | Generated prose fails validation | Implement retry loop (up to 3 attempts) with different topic prompts; log failures for debugging |
  | File encoding issues (CRLF, BOM, wrong encoding) | Use pathlib.Path.write_text() with explicit encoding=\"utf-8\" and newline=\"\\n\" parameters; validate written bytes before commit |
  | File already exists (filename collision) | Filename (test-nttet0.md) is unique and not used in existing repository; use Path.write_text() which raises error if file exists (fail-safe) |
  | Git not configured or access denied | Validate git config and remote access before operations; implement clear error messages; feature branch pre-created, not dependent on branch creation |
  | Incorrect line endings after write | Validate written bytes contain only LF (b\"\\n\"), not CRLF (b\"\\r\\n\"); pathlib with newline=\"\\n\" guarantees this |
  | Commit message format incorrect | Use templated commit message format (not user input); validate message before execution |
  | Push fails or feature branch missing | Feature branch (feat/199-markdown-file-creation-5e3e07) is pre-created; validate branch exists before push; implement retry logic for network failures |
  | File validation errors caught late | Implement comprehensive validation immediately after file creation, before git operations; fail fast to prevent rework |
