content: |
  ## Task Overview

  This task breakdown implements feature 199 across three sequential phases:

  1. **Phase 1 - Content Generation & Validation (Tasks 1-2):** Generate unique, meaningful
     prose using Claude API, validate that generated content meets all quality requirements
     (sentence count, length, thematic alignment).

  2. **Phase 2 - File Creation & Encoding Validation (Tasks 3-4):** Write validated content
     to test-nttet0.md at repository root with explicit UTF-8/LF encoding, then comprehensively
     validate the written file meets all structural and encoding criteria.

  3. **Phase 3 - Git Integration & Push (Tasks 5-7):** Stage file with git add, create commit
     with conventional message format, push to feature branch, and perform end-to-end
     verification that all success criteria are met.

  ## Implementation Flow

  The tasks are ordered to follow the principle of \"fail fast and prevent rework\":

  - **Content validation before file creation:** If generated prose fails validation, retry
    with different topics rather than writing invalid content to disk
  - **File validation before git operations:** Catch encoding/structure errors before staging,
    preventing invalid commits
  - **Git operations in correct order:** Stage → commit → push ensures proper workflow and
    allows rollback if needed
  - **End-to-end verification:** Final integration test confirms all success criteria are met

  ## TDD Approach

  Each task includes RED-GREEN-REFACTOR cycles:

  - **RED:** Write tests that assert desired behavior (tests fail initially)
  - **GREEN:** Implement minimal code to pass tests
  - **REFACTOR:** Clean up, extract helpers, improve error handling and logging

  This approach ensures comprehensive test coverage and validates correctness before integration.

  ## Dependencies

  - Tasks are strictly ordered by phase and dependencies
  - Task 2 depends on Task 1 (needs content generation before validation)
  - Task 3 depends on Task 2 (needs validated content before file creation)
  - Task 4 depends on Task 3 (needs created file before validation)
  - Task 5 depends on Task 4 (needs validated file before git operations)
  - Task 6 depends on Task 5 (commit must exist before push)
  - Task 7 depends on Task 6 (integration test runs after all components complete)

  ## Effort Estimates

  - Content generation & validation: 5-8 minutes (includes Claude API latency)
  - File creation & validation: 3-5 minutes
  - Git integration: 3-5 minutes
  - End-to-end testing: 1-2 minutes
  - **Total:** 13-20 minutes of actual implementation work

  The estimate accounts for Claude API network latency, comprehensive validation checks, and
  TDD cycles (red-green-refactor). This aligns with the feature size estimate (S: 10-15 minutes)
  when accounting for development time plus validation and git integration overhead.
