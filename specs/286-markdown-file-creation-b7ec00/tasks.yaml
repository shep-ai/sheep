content: |
  ## Summary

  This feature follows the well-established markdown-file-creation pattern and is implemented in 3 focused tasks
  across 2 phases:

  **Phase 1: File Creation & Validation** creates the markdown file with proper structure (H1 heading + blank line +
  2-3 sentences of prose) using pathlib.Path.write_text() with explicit UTF-8 encoding and newline='\n' parameter.
  Task 1 implements file creation and basic structure validation. Task 2 validates output meets all success criteria
  (size 400-600 bytes, encoding/line endings, sentence count) before proceeding to git operations.

  **Phase 2: Git Integration** stages the file, creates a conventional commit, and pushes to the feature branch.
  Task 3 executes sequential git commands (add → commit → push) using subprocess, with fail-fast error handling
  to ensure operations complete successfully.

  **Workflow:** Create → Validate → Git Integrate

  Each task follows TDD principles:
  - RED: Write test asserting desired behavior
  - GREEN: Implement minimal code to pass test
  - REFACTOR: Clean up, extract helpers, improve naming

  Total estimated effort: 45 minutes (covers file creation ~15min, validation ~15min, git workflow ~15min).
  No external dependencies required — implementation uses Python standard library (pathlib, subprocess) only.
  Pattern matches 286+ existing precedent features with proven, low-risk execution.
