content: |
  ## Architecture Overview

  This feature implements the well-established markdown-file-creation pattern proven across 286+ precedent features.
  The implementation is straightforward and isolated from application code (/src/sheep/):

  1. **File Creation**: Use Python pathlib.Path.write_text() to create a markdown file with explicit UTF-8 encoding
     and newline='\n' parameter to ensure LF line endings across all platforms (Windows/Linux/macOS)
  2. **Content Structure**: Compose markdown with H1 heading (# Title) followed by blank line and 2-3 sentences
     of grammatically correct prose
  3. **Validation**: Verify output meets all success criteria using simple string inspection and file stat operations
  4. **Git Integration**: Use subprocess to execute sequential git commands (add → commit → push)

  The pattern matches established conventions from 286+ existing test-*.md files in the repository root.
  No external dependencies required beyond Python standard library (pathlib, subprocess).

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** pathlib.Path.write_text() with explicit encoding and newline parameters

  **Rationale from Research:**
  - Modern Python 3 standard API for file operations
  - write_text() handles encoding, file closing, and resource management automatically
  - Explicit newline='\n' parameter ensures LF endings on all platforms (critical requirement)
  - Default UTF-8 encoding without BOM satisfies FR-6 and FR-7
  - Matches established pattern across 286+ precedent files
  - No external dependencies required

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  content = "# Title\n\nSentence 1. Sentence 2. Sentence 3."
  Path("test-w8wuax.md").write_text(content, encoding="utf-8", newline="\n")
  ```

  ### 2. Content Generation: Hand-Written Prose

  **Chosen:** Direct string composition with hand-written prose

  **Rationale from Research:**
  - Simple structure (H1 + blank line + 2-3 sentences) requires no templating or generation libraries
  - Over-engineering would introduce unnecessary external dependencies
  - Hand-written prose ensures requirement FR-8 (clear, grammatically correct content) is naturally met
  - Matches established pattern: 286+ precedent files use hand-written content
  - Topic flexibility ("about anything" per user query) allows implementer to choose appropriate subject matter

  ### 3. Validation Strategy: Manual Structure & Metadata Checks

  **Chosen:** Manual validation using string inspection and file stat operations

  **Rationale from Research:**
  - Scope is limited: verify H1 presence, blank line separation, sentence count, file size, encoding, line endings
  - Simple structure validation requires no markdown parsing library
  - CommonMark compliance for simple H1+prose is trivial to verify manually
  - Eliminates external dependency on markdown parsing libraries (commonmark-py, python-markdown)
  - Matches established pattern: 286+ precedent files use simple structure requiring no special tooling

  **Validation Approach:**
  - Assert file exists and is readable
  - Check file starts with "# " (H1 heading)
  - Verify H1 followed by "\n\n" (blank line)
  - Count sentences using period count (2-3 required)
  - Verify file size 400-600 bytes (NFR-1)
  - Verify UTF-8 encoding without BOM
  - Verify LF line endings (no CRLF, no CR)

  ### 4. Git Integration: subprocess CLI Commands

  **Chosen:** subprocess.run() with git CLI commands (add, commit, push)

  **Rationale from Research:**
  - Git CLI available on all supported platforms (Windows/Linux/macOS)
  - Subprocess calls with list argument form prevent command injection
  - Sequential execution (add → commit → push) matches established pattern from 286+ prior features
  - No external library dependencies (GitPython, pygit2) required
  - Transparent and easy to debug/audit
  - Fail-fast approach with check=True ensures operations succeed or raise error

  **Implementation Pattern:**
  ```python
  import subprocess

  subprocess.run(["git", "add", "test-w8wuax.md"], check=True)
  subprocess.run(
      ["git", "commit", "-m", "feat(286): create markdown file test-w8wuax.md with prose content"],
      check=True
  )
  subprocess.run(["git", "push", "-u", "origin", "feat/286-markdown-file-creation-b7ec00"], check=True)
  ```

  ### 5. Error Handling: Fail-Fast Approach

  **Chosen:** Fail immediately with clear error messages if file creation or git operations fail

  **Rationale from Research:**
  - Feature requirements are strict: must create exactly one file, commit, and push successfully
  - No viable fallback/recovery if file creation fails or git operations fail (no middle ground)
  - Feature success criteria explicitly require clean git status and successful push (SC-9, SC-10)
  - Matches established pattern: 286+ prior features use same fail-fast approach
  - Prevents silent failures or partial completion

  ## Implementation Strategy

  ### Phase Ordering

  **Phase 1: File Creation & Validation** comes before Phase 2 (Git Integration) because:
  - Must create and validate output before staging with git (logical dependency)
  - Validation ensures file meets all success criteria before committing
  - Early failure in file creation prevents unnecessary git operations

  **Phase 2: Git Integration** depends on Phase 1 completing successfully because:
  - Only stage/commit/push a file that meets all success criteria
  - Git operations are final step, ensuring complete success at end

  ### Minimal Implementation Approach

  The implementation is kept minimal and focused:
  - Single file created (no supporting infrastructure or utilities)
  - Simple validation using built-in string/file operations (no parsing libraries)
  - Sequential git commands with subprocess (no complex branching logic)
  - No configuration files, no documentation updates, no test suite modifications
  - Straightforward imperative code matching established pattern

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding mismatch (CRLF vs LF) | Use pathlib.write_text() with explicit newline='\n' parameter (standard Python approach) and validate line endings after writing |
  | Git push fails due to network/auth | Use check=True in subprocess calls to fail fast; error message will identify root cause |
  | File size outside 400-600 byte range | Validate file size post-write using Path.stat().st_size; if out of range, adjust prose and retry |
  | H1 heading or sentence structure incorrect | Manual string inspection during validation catches structural issues before git commit |
  | File not properly staged/committed | Verify git status after each operation; subprocess errors will surface immediately |
  | Platform-specific line ending issues | Python's newline parameter is platform-independent and handles this correctly (standard approach) |

  ## Pattern Consistency Notes

  This implementation maintains strict consistency with 286+ precedent features:
  - **File naming**: test-<identifier>.md pattern (this feature: test-w8wuax.md)
  - **Content structure**: # Heading\n\n<2-3 sentences of prose> (exact pattern from precedents)
  - **Encoding/line endings**: UTF-8 without BOM, LF endings (verified across 286+ files)
  - **File size**: 400-600 bytes (observed range: 499-597 bytes in recent precedents)
  - **Git workflow**: add → commit (conventional format) → push (identical across all features)
  - **Error handling**: Fail-fast with clear messages (no recovery logic, matches pattern)
  - **No dependencies**: Python standard library only (pathlib, subprocess)

  The feature is a direct repeat of features 283-285 with identical structure and scope. No architectural
  innovation required — proven pattern can be executed with confidence.
