# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-w4tuuy.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 230+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 223-238, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-w4tuuy.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls within typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-w4tuuy.md`
  - [ ] Git commit with exact message exists: `feat(239): create markdown file test-w4tuuy.md with prose content`
  - [ ] Commit is created on the feature branch `feat/239-markdown-file-creation-737423`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-w4tuuy.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct (validated by implementer during creation per product question #3)
  - **FR-6**: File must be staged using `git add test-w4tuuy.md`
  - **FR-7**: File must be committed with the exact message: `feat(239): create markdown file test-w4tuuy.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/239-markdown-file-creation-737423`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should naturally fall within typical range of 400-600 bytes as outcome of proper structure (per product question #1)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 230+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (free-form per product question #2)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Questions & AI Recommendations

  All product decisions have been resolved with AI-recommended defaults. Structured options and selection rationale are defined in the openQuestions array at the top of this specification.

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should file size be strictly enforced (400-600 bytes) or treated as a natural outcome of proper structure? | **Natural outcome** — validate structure correctness, accept any resulting file size | File size is consequence of content structure, not independent constraint. Flexibility in topic/sentence length is intentional. Structure validation is sufficient. |
  | 2 | Should prose topic be constrained or free-form? | **Free-form** — any topic chosen by implementer | User query states \"about anything\". No business constraints on topic. Flexibility enables natural, varied test file creation. Diverse topics work well across 230+ precedents. |
  | 3 | How should prose readability (FR-5) be validated? | **Implementer manual validation** — sufficient for test files | This is test content, not production. Manual review by implementer is standard practice across 230+ precedents. No automation needed. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 230+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/239-markdown-file-creation-737423/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **.github/**: GitHub workflows and configuration
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile**: Container configuration for the Sheep platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as validation artifacts
  for the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (230+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes (as natural outcome of proper structure)
  - Implementation follows straightforward imperative code (create content string, write to file)
  - Files are isolated test artifacts with no dependencies on application source code
  - Diverse topics (nature, technology, science, history, culture, philosophy, etc.) observed across existing test files

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/239-markdown-file-creation-737423`
  - Create/modify files in working directory
  - Stage with `git add test-w4tuuy.md`
  - Commit with conventional commit format: `feat(239): create markdown file test-w4tuuy.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (observed in features 223-238):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Each feature is identical in structure and requirements
  - Implementation is identical across all 16 recent iterations (features 223-238)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path(\"test-w4tuuy.md\").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content per CommonMark specification
  - **CrewAI**: Framework used by Sheep platform for agent-based automation (not directly relevant to this file creation task)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-w4tuuy.md) to existing collection of 230+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 223-238; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/239-markdown-file-creation-737423` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 230+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-w4tuuy.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 230+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (223-238) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-w4tuuy.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 15+ prior implementations in this session

