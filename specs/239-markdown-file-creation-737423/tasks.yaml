content: |
  ## Summary

  The implementation follows three sequential phases that together create a complete markdown file
  and integrate it into version control:

  1. **Task 1 (Content Preparation, Phase 1):** Implementer prepares the markdown content by defining
     a heading and writing 2-3 sentences of prose on any topic. This task focuses on creating
     well-structured, grammatically correct content that will be written to the file.

  2. **Task 2 (File Creation, Phase 2):** Implementation creates test-w4tuuy.md using pathlib.Path.write_text()
     with UTF-8 encoding and explicit LF line endings. The file is created in the repository root
     and validated to have correct encoding, line endings, and structure.

  3. **Task 3 (Version Control Integration, Phase 3):** Implementation stages the file with git add,
     commits with the conventional commit message, and pushes to the remote repository. This ensures
     the feature is properly recorded in the git history and pushed to origin.

  All three tasks are sequential (task-2 depends on task-1; task-3 depends on task-2) and must
  be completed in order. Total estimated effort is approximately 15 minutes, aligning with the
  feature's size estimate of "S" (small).
