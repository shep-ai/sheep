# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a markdown file following an established pattern from 150+ existing test files
  in the Sheep repository. Rather than manual one-off commands, the implementation uses a standalone
  Python script that automates the full workflow:

  1. **File creation** with proper encoding (UTF-8, no BOM) and line endings (LF)
  2. **Validation** to verify structure, encoding, and compliance
  3. **Git integration** (stage, commit, push) with strict error handling

  ### Design Rationale

  The script approach is preferred over manual commands because:
  - **Automation-first:** The Sheep platform automates implementation; automation should be code, not manual steps
  - **Python-native:** Implementation is in Python, the project language, ensuring consistency
  - **Reusable:** Script can be adapted for similar markdown-file-creation features (pattern recurs across 150+ files)
  - **Error handling:** Python subprocess with `check=True` surfaces failures immediately; easier to debug than shell failures
  - **Verifiable:** Code-based implementation is testable and version-controlled

  ### File Structure

  The implementation creates one script file:
  ```
  specs/154-markdown-file-creation-9221e9/create_markdown_file.py
  ```

  This script is self-contained and executable. It depends only on Python standard library modules
  (pathlib, subprocess, sys) — no external dependencies are added, adhering to NFR-9.

  The script produces one output file at the repository root:
  ```
  test-fdr055.md
  ```

  ### Encoding and Line Ending Strategy

  The script uses `pathlib.Path.write_bytes()` with explicit byte construction to guarantee:
  - **UTF-8 without BOM:** Content is encoded as UTF-8 bytes with no Byte Order Mark
  - **Unix LF line endings:** Python string `'\n'` becomes LF byte (0x0A) in the UTF-8 encoding

  This approach is platform-independent and deterministic, eliminating reliance on OS defaults or
  git autocrlf configuration. It ensures consistent output across Windows, macOS, and Linux.

  ## Key Design Decisions

  ### 1. Automation Script vs. Manual Commands
  **Chosen:** Standalone Python script in specs directory

  **Rationale (from research):**
  - Sheep is an automated implementation platform; automation should be code-first, not manual
  - Python is the primary project language; maintaining automation in Python ensures consistency
  - Scripts are reusable for similar features (150+ test files demonstrate this pattern)
  - Error handling and validation are more maintainable in Python than in shell commands
  - Demonstrates the platform's core capability of automating repetitive tasks

  ### 2. File I/O Implementation
  **Chosen:** `pathlib.Path` with `write_bytes()` for explicit encoding control

  **Rationale (from research):**
  - Explicitly required by NFR-5 ("Implementation must use Python pathlib.Path for file I/O operations")
  - `write_bytes()` with manual encoding ensures deterministic UTF-8 (no BOM) and LF line endings
  - Avoids platform-specific line ending translation on Windows
  - Modern Python 3.11+ best practice and recommended approach

  **Implementation approach:**
  ```python
  content = "# Heading\n\nProse here."
  Path("test-fdr055.md").write_bytes(content.encode('utf-8'))
  ```

  ### 3. Git Operations with Error Handling
  **Chosen:** `subprocess.run()` with list-based invocation and `check=True` for strict validation

  **Rationale (from research):**
  - Standard library; no external dependencies
  - List-based calls (e.g., `['git', 'add', 'file.md']`) prevent shell injection (no `shell=True`)
  - `check=True` raises `CalledProcessError` on any git failure, surfacing problems immediately
  - Transparent and easy to debug; git commands are explicit in the code
  - Aligns with research decision for strict error-checking (no partial success)

  ### 4. Prose Content Strategy
  **Chosen:** Hard-coded human-written string

  **Rationale (from research):**
  - FR-5 requires prose to be "readable and grammatically correct"
  - Examination of existing 150+ test files confirms all use hand-written, meaningful prose
  - Ensures consistent quality and topic coherence (NFR-11)
  - Topic is completely unrestricted (NFR-8); implementer chooses subject
  - Avoids complexity of generated content while maintaining quality

  ### 5. Validation Strategy
  **Chosen:** Basic format checks (file exists, size, structure)

  **Rationale (from research):**
  - Catches obvious errors without requiring full CommonMark parser
  - File existence confirms write succeeded
  - Size check (typically 400-600 bytes) verifies content is in expected range (NFR-3, soft guideline)
  - Structure check ensures H1 heading, blank line, and prose are present
  - Simple, maintainable validation that provides confidence before git operations

  ## Implementation Strategy

  **Phase 1: Script Foundation**
  - Create Python script with proper structure, imports, and entry point
  - Define helper functions: `create_file()`, `validate_file()`, `git_operations()`
  - Verify script is executable and has no import/syntax errors

  **Phase 2: File Creation & Validation**
  - Implement `create_file()` function using pathlib with explicit UTF-8 encoding and LF line endings
  - Choose meaningful topic and write 2-3 grammatically correct sentences (hard-coded prose)
  - Implement `validate_file()` function to check: existence, size (400-600 bytes typical), structure (H1, blank line, prose)
  - This phase produces the markdown file artifact with quality assurance

  **Phase 3: Git Integration & Execution**
  - Implement `git_operations()` function: stage (git add), commit (conventional message), push (to remote)
  - Use `subprocess.run()` with `check=True` for strict error handling
  - Execute full workflow: create file → validate → stage → commit → push
  - Verify file appears in git log with correct commit message

  **Sequencing rationale:** Each phase builds on prior work. File creation must be correct before validation passes.
  Validation must succeed before git operations make sense. This sequence ensures a reproducible, automated workflow.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File created but git operations fail (partial success) | Use strict error handling with `check=True` on all subprocess calls; if any step fails, exception surfaces immediately for investigation and retry |
  | Platform-specific line endings (CRLF on Windows) | Use explicit byte construction with `write_bytes(content.encode('utf-8'))`; guarantees LF regardless of OS |
  | Git credentials not configured or push fails | Catch `CalledProcessError` from git push; provide clear error messaging indicating auth/network issue requires manual investigation |
  | File encoding issues (BOM or non-UTF-8) | Use explicit `encode('utf-8')` without BOM; verify with file inspection tools if needed |
  | Prose content violates FR-5 (not grammatically correct) | Use hard-coded, human-reviewed prose; validate by code review before execution |
  | Script has syntax/import errors | Write minimal, testable code in TDD cycles; catch errors early in Phase 1 before proceeding to Phases 2-3 |
  | File size outside typical range (< 300 or > 800 bytes) | Validation check catches this; adjust prose length if needed; remember NFR-3 is soft guideline, not strict requirement |
