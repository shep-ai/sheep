  ## Summary

  This task breakdown implements a standalone Python script that automates markdown file creation
  following the pattern of 150+ existing test files in the repository.

  **Phase 1 (Script Foundation):** Create the Python script skeleton with imports and entry point.
  This establishes the automation framework.

  **Phase 2 (File Creation & Validation):** Implement file creation using pathlib with explicit
  UTF-8 encoding and LF line endings, plus validation checks to verify structure and encoding.

  **Phase 3 (Git Integration):** Implement git operations (add, commit, push) with strict error
  handling, then execute the full end-to-end workflow.

  The implementation follows TDD principles: each task writes tests first (RED), implements minimal
  code to pass (GREEN), then cleans up and documents (REFACTOR). Tasks are ordered by dependency:
  skeleton must exist before implementing functions, file creation before validation, validation
  before git operations.

  **Total estimated effort: 1 hour 15 minutes across 4 tasks.**
