    options:
      - option: "Strict error-checking (exit on any git command failure)"
        description: >
          Raise exceptions if git add, commit, or push fails. Ensures atomicity and prevents
          partial success. Safer but may fail on transient network issues.
        selected: true
      - option: "Permissive with logging (log errors but continue)"
        description: >
          Log git command failures but continue execution. More resilient to network issues
          but risks inconsistent repository state.
