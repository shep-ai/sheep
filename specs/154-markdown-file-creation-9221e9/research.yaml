      file creation, git add, commit, AND push (FR-6 through FR-9), (2) Partial completion
      (file created but not pushed) violates requirements and leaves repo inconsistent,
      (3) Strict errors surface problems immediately for the automated system to handle,
      (4) Test feature with clear success criteria — no benefit to permissive handling.
