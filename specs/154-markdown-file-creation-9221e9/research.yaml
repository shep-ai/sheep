# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Requirement Clarity:** Complete — all product decisions resolved in feature spec

  ## Technology Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** Use `pathlib.Path` with `.write_bytes()` for file creation with explicit encoding control

  **Rejected:**
  - `os.open()` and manual byte operations — Unnecessarily low-level; pathlib is the modern standard
  - `open()` with context manager — Functionally equivalent; pathlib is more object-oriented and preferred in Python 3.11+
  - External file I/O libraries — Would add dependencies (violates NFR-9)

  **Rationale:**
  pathlib is explicitly mandated by NFR-5. Using `.write_bytes()` with manual construction ensures:
  - UTF-8 encoding without BOM: `content.encode('utf-8')` produces clean UTF-8 bytes
  - Unix LF line endings: Python string `'\\n'` becomes LF byte (0x0A) in UTF-8
  - Platform independence: No reliance on OS-specific line ending defaults

  This approach is deterministic and aligns with the established pattern from 150+ existing test files.

  ### 2. Git Operations: subprocess.run()

  **Chosen:** Use Python's `subprocess.run()` to execute git commands

  **Rejected:**
  - GitPython library — While in dependencies, it is unnecessarily abstract for three simple operations
  - Shell script — Less portable, harder to manage output and error codes
  - Manual low-level git operations — Overkill; git CLI is available and proven

  **Rationale:**
  `subprocess.run()` is the Python standard library tool for external command execution. For sequential
  git operations, it is simpler and more transparent than GitPython. Using list-based invocation prevents
  shell injection. Example:
  ```python
  subprocess.run(["git", "add", "test-fdr055.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(154): create markdown file test-fdr055.md with prose content"], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```
  The `check=True` flag enforces strict error handling (open question 2).

  ### 3. Prose Content: Hard-Coded Human-Written Text

  **Chosen:** Write prose content as a hard-coded string (human-authored)

  **Rejected:**
  - Generated/dynamic content — Risks violating FR-5 (grammatically correct); excessive for a test file
  - Lorem Ipsum or placeholders — Contradicts established pattern; existing test files use meaningful prose
  - Template-based with variable substitution — Adds complexity without proportional benefit

  **Rationale:**
  Examination of existing test files confirms all use hand-written, meaningful prose:
  - test-ax8kga.md: \"The Power of Automated Systems\" with 3 sentences on software automation
  - test-h8ylmx.md: \"Serverless Computing Revolution\" with 3 sentences on serverless architecture

  Hard-coding ensures: consistent quality (FR-5), topic coherence (NFR-11), reproducibility, and simplicity.
  Topic choice is completely unrestricted (NFR-8).

  ### 4. Line Ending and Encoding: Explicit byte construction

  **Chosen:** Use `.write_bytes()` with explicit UTF-8 encoding and LF construction

  **Rejected:**
  - `.write_text()` with platform defaults — Fails NFR-2; Windows may use CRLF
  - `.write_text(newline='\\n')` — Not guaranteed to prevent line ending translation in all contexts
  - Relying on `git autocrlf` — Too fragile; better to ensure file correctness at creation

  **Rationale:**
  Explicit byte construction eliminates platform-dependent behavior:
  ```python
  content = \"# Heading\\n\\nProse here.\"
  Path(\"test-fdr055.md\").write_bytes(content.encode('utf-8'))
  ```
  This guarantees:
  - UTF-8 encoding without BOM (NFR-1)
  - Unix LF line endings (NFR-2)
  - Platform independence
  Simple, deterministic, and verifiable.

  ### 5. Validation: Basic Format Checks

  **Chosen:** Implement basic validation (file existence, size, structure)

  **Rejected:**
  - Full CommonMark specification validation — Overkill; would require additional tools
  - No validation — Risky; could silently produce malformed output
  - Cryptographic or hash-based checks — Unnecessary; we are validating structure

  **Rationale:**
  Basic validation with minimal complexity catches obvious errors:
  1. **File exists:** `Path(\"test-fdr055.md\").exists()` — confirms write succeeded
  2. **Size check:** File is typically 400-600 bytes (NFR-3, soft guideline)
  3. **Structure check:** H1 heading, blank line, prose present

  Example validation:
  ```python
  path = Path(\"test-fdr055.md\")
  assert path.exists(), \"File not created\"
  content = path.read_text(encoding='utf-8')
  assert content.startswith(\"# \"), \"Missing H1 heading\"
  assert \"\\n\\n\" in content, \"Missing blank line\"
  size = path.stat().st_size
  assert 300 < size < 800, f\"Size {size} outside typical range\"
  ```

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib | File I/O operations | Use (required by NFR-5) | Standard library; explicit requirement; modern Python best practice |
  | subprocess | Execute git commands | Use (standard library) | Simple, transparent; no new dependencies; git CLI is idiomatic |
  | GitPython | Alternative git interface | Reject | Already in dependencies; unnecessary; subprocess suffices |
  | os module | Alternative file I/O | Reject | Less object-oriented; pathlib is preferred in Python 3.11+ |
  | tempfile | Temporary file handling | Not needed | No temporary files required |
  | Markdown libraries | CommonMark validation | Not needed | Basic structure validation sufficient |

  ## Security Considerations

  **File Creation (Low Risk):**
  - Creating a markdown file in the repository root is safe; no command injection or path traversal risk
  - File is created by the Python process with inherited permissions; no privilege escalation
  - Content is hard-coded (not user-input), eliminating injection vectors

  **Git Operations (Low Risk):**
  - Git commands use list-based subprocess invocation (`[\"git\", \"add\", ...]`), not shell strings
  - This prevents shell injection attacks (no shell interpreting the command)
  - Commit message is hard-coded (not user-input), safe from injection
  - `check=True` ensures command failures are caught and reported

  **No Authentication Secrets:**
  - Prose content is public (no credentials, API keys, or sensitive data)
  - Git operations use existing repo credentials (assumed to be securely configured)
  - No new network connections or external API calls

  **Mitigation:** Use list-based subprocess calls throughout (never `shell=True`).

  ## Performance Considerations

  **File Creation (Negligible):**
  - Single file write operation (~400-600 bytes) — extremely fast (< 1ms)
  - No I/O loops or batch operations; simple synchronous write
  - No performance optimization needed

  **Git Operations (Minimal):**
  - `git add`: Stages single file (instant)
  - `git commit`: Creates commit object (instant for small repo)
  - `git push`: Network operation (typically 1-5 seconds depending on remote latency)
  - Overall time: dominated by network latency of `git push`

  **No Caching or Optimization Needed:**
  - Feature is simple, one-time operation; no repeated calls or batch processing
  - No database queries, network I/O beyond git push, or heavy computation
  - Sequential operation is appropriate and required

  **Scalability Note:**
  This feature is not designed to scale — single-file operation. If system scales to create multiple
  test files, future work could implement batch processing and parallel git operations.

  ## Architecture Notes

  ### Fit Within Existing Codebase

  This feature fits the established pattern of the Sheep platform:
  - **Minimal isolated changes:** Single file creation at repository root
  - **No source code dependencies:** Does not import or depend on `/src/sheep/` modules
  - **Standard library only:** Uses Python built-ins; no new dependencies (adheres to NFR-9)
  - **Git integration:** Follows conventional commit pattern from features 151-153
  - **Clear success criteria:** Testable, verifiable file creation and git workflow

  ### Pattern Consistency

  The 150+ existing test files demonstrate a proven, repeatable pattern:
  ```
  # Title Heading

  Prose sentence one. Prose sentence two. Prose sentence three.
  ```

  This feature implementation replicates this pattern:
  - Same file naming convention (`test-*.md`)
  - Same content structure (H1 + prose)
  - Same git workflow (add → commit → push)
  - Same topic freedom (diverse subjects across existing files)

  ### Automation Platform Alignment

  The Sheep platform automates code implementation. This feature demonstrates:
  - **File I/O automation:** Creating files programmatically
  - **Git automation:** Staging, committing, and pushing in sequence
  - **Repeatable implementation:** Script can be adapted for future markdown-file-creation features
  - **Error handling:** Strict validation ensures failures surface clearly

  Aligns with the platform's core mission of automating human-manual tasks.

  ## Implementation Approach

  **File creation pseudo-code:**
  ```python
  from pathlib import Path
  import subprocess

  # Define content with human-written prose
  title = \"Topic Title Here\"
  prose = \"First sentence about topic. Second sentence with detail. Third sentence with conclusion.\"
  content = f\"# {title}\\n\\n{prose}\\n\"

  # Write file (UTF-8, LF line endings)
  path = Path(\"test-fdr055.md\")
  path.write_bytes(content.encode('utf-8'))

  # Validate structure
  assert path.exists() and 300 < path.stat().st_size < 800

  # Git workflow with strict error handling
  subprocess.run([\"git\", \"add\", \"test-fdr055.md\"], check=True)
  subprocess.run([\"git\", \"commit\", \"-m\", \"feat(154): create markdown file test-fdr055.md with prose content\"], check=True)
  subprocess.run([\"git\", \"push\", \"-u\", \"origin\", \"HEAD\"], check=True)
  ```

