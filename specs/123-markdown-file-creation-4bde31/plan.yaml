# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown file at the repository root following the established
  pattern from 120+ existing test files (features 069-122). The implementation is straightforward
  and isolated:

  - **Scope:** Repository root directory only (test-vt3vtp.md)
  - **No dependencies:** Uses only Python standard library (pathlib) and git CLI
  - **No impact on existing code:** File creation is purely additive, no modifications to /src/sheep/ or other source code
  - **Established pattern:** Identical structure to all existing test files: H1 heading + blank line + 2-3 sentences

  The feature fits the existing codebase as a continuation of the markdown-file-creation pattern
  that has been successfully implemented 50+ times with consistent results.

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Decision:** Use Python's `pathlib.Path.write_text()` method with explicit UTF-8 encoding.

  **Rationale:** The specification explicitly mandates pathlib (NFR-5). This approach provides:
  - Clean, readable syntax that handles encoding and file closure automatically
  - Matches the established pattern in all 120+ existing test files
  - Modern Python 3 standard library approach (available in Python 3.11+)
  - No external dependencies required

  **Why not alternatives:**
  - `os.path` — lower-level, more verbose, less idiomatic for Python 3
  - `open()` context manager — functional but more verbose than pathlib for simple operations

  ### 2. Character Encoding: UTF-8 without BOM

  **Decision:** Write file with UTF-8 encoding and no Byte Order Mark (BOM).

  **Rationale:** The specification explicitly requires this (NFR-1). Benefits:
  - Industry standard for web, Unix, and modern development
  - Python's `write_text(encoding='utf-8')` produces UTF-8 without BOM by default
  - Matches all 120+ existing test files in the repository
  - Cross-platform compatible (no BOM interpretation issues)

  ### 3. Line Endings: Unix-style LF Only

  **Decision:** Use explicit `\n` characters for all line breaks (Unix LF, not Windows CRLF).

  **Rationale:** The specification explicitly requires this (NFR-2). Benefits:
  - Standard for version control repositories and cross-platform development
  - Using explicit '\n' in content string ensures LF-only output regardless of OS
  - Matches all existing test files
  - Prevents git diff noise from CRLF conversion issues

  ### 4. Content Construction: Simple String Concatenation

  **Decision:** Construct markdown content using basic Python string concatenation with explicit newlines.

  **Rationale:** The specification mandates standard library only (NFR-9). Benefits:
  - Trivial content structure (H1 heading + blank line + 2-3 sentences) needs no template engine
  - Simple string concatenation is clearest and most maintainable
  - Matches the pattern in all 120+ existing test files
  - No external dependencies required

  ### 5. Git Workflow: CLI Commands

  **Decision:** Use git CLI commands (`git add`, `git commit`, `git push`) via shell execution.

  **Rationale:** All related features (120-122) use this approach. Benefits:
  - Transparent and easy to debug
  - Simple for straightforward git operations
  - Established pattern throughout the codebase
  - No need for GitPython abstraction layer

  ### 6. Prose Content Topic: Implementer Free Choice

  **Decision:** Allow implementer to select any topic without constraints.

  **Rationale:** The specification explicitly permits this (Product Decision #1). Benefits:
  - Maximizes implementer efficiency and creativity
  - All 120+ existing test files demonstrate diverse human-selected topics
  - No research or design decisions needed for topic selection

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  **Phase 1: File Creation & Verification**
  - Create the markdown file with correct H1 heading and 2-3 sentences of prose
  - Verify file properties: encoding, line endings, content structure, file size

  **Phase 2: Git Integration & Push**
  - Stage file with `git add`
  - Commit with conventional message format: `feat(123): Create markdown file test-vt3vtp.md with prose content`
  - Push to remote feature branch

  This ordering ensures the file is created and verified before git operations, following
  the established workflow pattern.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (BOM, CRLF) | Explicit encoding parameter in pathlib.write_text() and '\n' characters in content string ensure UTF-8 without BOM and Unix LF line endings. Test verification ensures compliance. |
  | File size out of spec (400-600 bytes) | Prose content guidelines (2-3 sentences) naturally produce files in this range. If content is quality and follows format, size deviation is acceptable per product decision. |
  | Git commit message incorrect | Exact commit message is specified in requirements (FR-7) and enforced via git command. No room for deviation. |
  | File overwrite if already exists | This is a new test file in a git-tracked repository. If file exists, git version control provides rollback capability. Overwrite is tracked and reversible. |
  | Git operations fail (auth, network) | Feature branch is pre-created and checked out. Standard git configuration (user.name, user.email) must be set. These are system prerequisites outside feature scope. |

  ## Files to Create and Modify

  **Files to Create:**
  - `test-vt3vtp.md` — The markdown file with H1 heading and 2-3 sentences of prose

  **Files to Modify:**
  - None. No existing files are modified; this is purely additive.

  ## Implementation Notes

  - The feature branch `feat/123-markdown-file-creation-4bde31` is pre-created and should be checked out
  - Prose topic selection is completely free; implementer may choose any subject
  - File content follows the established pattern: `# Heading\n\n<2-3 sentences>`
  - Git operations assume standard git configuration is in place (user.name, user.email)
  - All work is isolated to repository root; no impact on source code or configuration
