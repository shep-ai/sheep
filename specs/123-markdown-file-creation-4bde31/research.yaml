decisions:
  - title: "File I/O Implementation Approach"
    chosen: "Python pathlib.Path with write_text() method"
    rejected:
      - "os.path module — lower-level, more verbose, less idiomatic Python 3. pathlib is preferred modern standard library approach."
      - "open() context manager — functional but more verbose than pathlib.write_text() for simple file creation. pathlib is more concise."
    rationale: >
      The specification mandates use of pathlib (NFR-5). pathlib.Path is the modern Python standard library approach (Python 3.4+) and is fully supported in Python 3.11+. The write_text() method with explicit encoding parameter provides clean, readable code that handles encoding, line ending normalization, and file closure automatically. This follows Python best practices and matches the established pattern demonstrated in 120+ existing test files. The project targets Python 3.11+ per pyproject.toml, making pathlib the natural choice.

  - title: "Character Encoding Strategy"
    chosen: "UTF-8 without BOM (Byte Order Mark)"
    rejected:
      - "UTF-16 or UTF-32 — unnecessary for this use case, increases file size, and incompatible with the established pattern of existing test files."
      - "UTF-8 with BOM — adds 3 extra bytes at file start, violates spec requirement (NFR-1), and complicates text processing. Standard practice is UTF-8 without BOM."
    rationale: >
      The specification explicitly requires UTF-8 without BOM (NFR-1). This is the industry standard for web, Unix systems, and modern development. Python's write_text(encoding='utf-8') method automatically produces UTF-8 without BOM (the UTF-8 BOM is not the default in Python or most text editors). This matches the encoding pattern of all 120+ existing test files in the repository. BOM is unnecessary and adds complexity without benefit for markdown files.

  - title: "Line Ending Normalization"
    chosen: "Unix-style LF line endings (\\n only)"
    rejected:
      - "Windows CRLF (\\r\\n) — violates spec requirement (NFR-2), reduces cross-platform compatibility, and deviates from established pattern in 120+ test files."
      - "Platform-specific line endings — creates inconsistency across the repository and violates spec requirement. Git can normalize on clone, but explicit UTF-8 LF is clearer."
    rationale: >
      The specification explicitly requires Unix-style LF line endings, not Windows CRLF (NFR-2). Python's write_text() method on modern Python versions preserves the string exactly as written (does not perform platform-specific conversion). Explicitly using '\n' in the content string ensures LF-only output regardless of the OS. This is the standard practice for version control repositories and matches all 120+ existing test files. LF is the Unix standard and recommended for cross-platform consistency.

  - title: "Content String Construction"
    chosen: "Simple string concatenation with explicit newlines"
    rejected:
      - "Template engines (Jinja2, etc.) — adds external dependency, unnecessary complexity for trivial content. Simple strings are sufficient."
      - "Markdown builder libraries — adds external dependency, introduces complexity for a two-line markdown structure. Direct string is clearer and faster."
    rationale: >
      The specification prohibits external dependencies (NFR-9) and mandates Python standard library only. The content structure is trivial: one H1 heading + blank line + 2-3 prose sentences. Simple string concatenation with explicit '\n' characters is the most readable, maintainable, and performant approach. This matches the established pattern observed in 120+ existing test files, which are all created via simple imperative code (not generated from templates).

  - title: "Git Workflow: CLI vs GitPython Library"
    chosen: "Git CLI commands (git add, git commit, git push)"
    rejected:
      - "GitPython library (gitpython>=3.1.0 in pyproject.toml) — while available, adds unnecessary abstraction. CLI is simpler, more transparent, follows established pattern from features 069-122."
      - "Subprocess calls without shell — more verbose and error-prone than direct CLI invocation. Git CLI is designed for command-line use."
    rationale: >
      The specification requires git staging, commit, and push (FR-6, FR-7, FR-8, FR-9) but does not mandate a specific implementation. Examination of related features (120-122) shows all implementations use git CLI commands rather than GitPython. CLI commands are transparent, easier to debug, and match the established pattern. While GitPython is available as a dependency, using it adds unnecessary abstraction for straightforward git operations. Bash/shell execution of git commands is the simplest and most maintainable approach.

  - title: "Prose Content Topic Selection"
    chosen: "Implementer free choice of any topic (no constraints)"
    rejected:
      - "Prescribed topic set — specification explicitly permits any topic. Constraining choice adds unnecessary complexity."
      - "Random/generated topic — adds complexity; human-written prose is more natural and maintains consistency with existing test files written by humans."
    rationale: >
      The specification explicitly resolves this: prose topic is completely unrestricted (Product Decision #1). The implementer has full freedom to choose any topic (technical, creative, scientific, etc.) without restrictions. All 120+ existing test files demonstrate diverse, human-selected topics (debugging, AI/ML, language evolution, etc.). This flexibility maximizes implementer efficiency and maintains consistency with established patterns.

