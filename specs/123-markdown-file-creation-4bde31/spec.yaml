# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-vt3vtp.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 120+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-122, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-vt3vtp.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on first line
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content is readable and grammatically sound (implementer judgment)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File size is approximately 400-600 bytes (flexible guideline based on content)
  - [ ] File is staged in git with `git add test-vt3vtp.md`
  - [ ] Commit message is exactly: `feat(123): Create markdown file test-vt3vtp.md with prose content`
  - [ ] Commit is created on branch `feat/123-markdown-file-creation-4bde31`
  - [ ] Changes are pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-vt3vtp.md`
  - **FR-2**: File must be created in the repository root directory (not in subdirectories)
  - **FR-3**: File must contain exactly one markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable with sound grammar; implementer provides basic quality assurance without strict code review
  - **FR-6**: File must be staged using `git add test-vt3vtp.md`
  - **FR-7**: File must be committed with the exact commit message: `feat(123): Create markdown file test-vt3vtp.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/123-markdown-file-creation-4bde31`
  - **FR-9**: Changes must be pushed to the remote origin repository (origin/feat/123-markdown-file-creation-4bde31)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: File size should typically be 400-600 bytes; this is a flexible guideline based on prose length, not a strict hard requirement
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for all file I/O operations (Python standard library only, no external dependencies)
  - **NFR-6**: Implementation must follow the established pattern from 120+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files outside repository root
  - **NFR-8**: Prose topic is completely flexible; implementer may choose any topic without restrictions
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages beyond Python standard library

  ## Product Decisions (Resolved)

  All major product decisions are resolved based on the established pattern and clear requirements:

  1. **Prose Topic**: Completely unrestricted. Implementer has full freedom to choose any topic (technical, creative, scientific, etc.)
  2. **Sentence Count**: Exactly 2-3 sentences, strictly enforced. This matches the pattern of 120+ existing test files and provides consistent precedent.
  3. **File Size Tolerance**: File size guideline of 400-600 bytes is flexible and should not block implementation if prose content is quality. Treat as guideline, not hard constraint.
  4. **Grammar/Quality Standard**: Basic readability with sound grammar is sufficient. Implementer judgment applies; no formal spell-checking or advanced style review is required.
  5. **Heading Text**: Any text is acceptable for the heading. While heading text is flexible, it should be a reasonable title (not empty or gibberish).

  No blocking questions or ambiguities exist—all decisions default to maximizing implementer speed while maintaining consistency with established patterns.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 120+ test markdown files (test-*.md and randomly-named *.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/123-markdown-file-creation-4bde31/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **.github/workflows/**: CI/CD pipeline definitions

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (120+ precedents):
  - Simple file creation using Python `pathlib.Path` for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, LF line endings
  - File size typically 400-600 bytes
  - Implementation uses straightforward imperative code (construct content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/123-markdown-file-creation-4bde31`
  - Create/modify file in repository root
  - Stage with `git add <filename>`
  - Commit with conventional commit format: `feat(123): Create markdown file <filename> with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 069-122):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (per pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O (example: `Path("test-vt3vtp.md").write_text(content, encoding="utf-8")`)
  - **Git**: Version control system for file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (`#`) and prose content
  - **CrewAI**: Framework used for agent orchestration (not directly used in this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-vt3vtp.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-122; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only spec.yaml as part of analysis and requirements phases; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/123-markdown-file-creation-4bde31` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 120+ test files provide clear precedent for content format, structure, and style
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits to succeed
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose on any topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding without BOM, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file with git add, commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual implementation work

  **Justification**:
  - Well-established pattern with 120+ identical test files providing clear precedent for structure and format
  - Flexible topic selection with no research, design decisions, or architectural complexity
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences of prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (features 069-122) demonstrate efficient implementation of identical features in 10-15 minutes
  - All product decisions resolved; no blocking questions or unresolved ambiguities

