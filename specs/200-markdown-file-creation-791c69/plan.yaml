# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 200 follows the established pattern used by 199 prior features with no architectural
  innovations or deviations. The implementation is a **thin orchestration layer** that reuses
  proven, battle-tested utilities from src/create_markdown.py.

  ### Component Structure

  ```
  feature_200_main.py (new orchestration script)
    ↓
  create_and_commit_markdown_file() (existing utility)
    ├─ generate_markdown_content() → Claude API integration
    ├─ create_markdown_file() → UTF-8/LF file creation
    ├─ validate_file_encoding() → File structure validation
    └─ stage_and_commit_file() → Git integration
  ```

  All core functionality (content generation, validation, file I/O, git integration) already
  exists and is proven across features 195-199. Feature 200 adds only the orchestration entry
  point with Feature 200-specific filenames and branch names.

  ### How This Fits the Codebase

  - **Module Reuse**: feature_200_main.py imports create_and_commit_markdown_file() from
    src/create_markdown.py (same pattern as feature_199_main.py)
  - **LLM Integration**: Uses sheep.config.llm.get_reasoning_llm() for Claude API access
    (standardized platform LLM initialization)
  - **Logging**: Uses sheep.observability.logging.get_logger() for structured logging
    (platform observability standard)
  - **Git Operations**: Leverages GitPython via existing utilities; no manual git commands
  - **Error Handling**: Returns result dict with success/failure status (consistent interface)

  ### File Organization

  - **Root**: feature_200_main.py (standalone orchestration script)
  - **specs/200-markdown-file-creation-791c69/**: Specification files
  - **Output**: test-8ij3et.md created at project root by orchestration workflow

  ## Key Design Decisions

  ### 1. Reuse Existing Utilities (No New Code)

  **Chosen**: Call create_and_commit_markdown_file() from src/create_markdown.py

  **Rationale**: The utility is proven across 199 features (including Feature 199).
  It encapsulates all required functionality: Claude API integration with exponential
  backoff retries, content validation, file creation with UTF-8/LF encoding, and git
  operations. Reuse reduces implementation time and increases confidence in success.

  ### 2. Single Atomic Commit Strategy

  **Chosen**: One commit containing both markdown file and spec files

  **Rationale**: The spec NFR explicitly requires this. Features 195-199 follow this pattern.
  It keeps feature documentation and implementation together as a self-contained, auditable
  unit in git history.

  ### 3. Non-Streaming Claude API

  **Chosen**: Use non-streaming API calls (already proven in existing utilities)

  **Rationale**: Content volume is small (2-3 sentences), latency is not critical, and
  non-streaming simplifies error handling. The existing generate_markdown_content()
  function implements this with proven retry logic.

  ### 4. Strict Sentence Count Validation (Exactly 2-3)

  **Chosen**: Validate for exactly 2-3 sentences (not flexible range)

  **Rationale**: Spec resolution and Features 195-199 enforce strict validation for
  standardization. The existing _count_sentences() function uses regex boundary detection.

  ### 5. Exponential Backoff Retry Strategy

  **Chosen**: Exponential backoff (1s → 2s → 4s) with max 3 attempts

  **Rationale**: Industry standard (AWS, Google Cloud), already implemented in existing
  generate_markdown_content(). Balances resilience with avoiding excessive delays.

  ### 6. No Environment-Specific Configuration

  **Chosen**: Hardcode filename and branch_name in feature_200_main.py

  **Rationale**: These values are feature-specific and fixed (test-8ij3et.md and
  feat/200-markdown-file-creation-791c69). Feature 199 does the same.

  ## Implementation Strategy

  ### Phase 1: Foundation & Pattern Analysis
  Examine feature_199_main.py and src/create_markdown.py to confirm available functions
  and orchestration pattern.

  ### Phase 2: Feature Script Implementation
  Create feature_200_main.py by adapting the Feature 199 template with updated filenames
  and branch names. Keep logging format and error handling identical.

  ### Phase 3: Execution & Validation
  Run feature_200_main.py and validate the generated markdown file (H1 heading, exactly
  2-3 sentences, UTF-8, LF line endings). Confirm git operations complete.

  ### Phase 4: Integration & Push
  Stage markdown file and spec files in a single atomic git commit with conventional
  commit message. Push to origin/feat/200-markdown-file-creation-791c69.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API unavailable | Exponential backoff retry (3 attempts) handles transient failures; persistent failures logged with clear message |
  | ANTHROPIC_API_KEY missing | sheep.config.llm validates key on initialization; early failure with clear error |
  | Markdown validation failure | Exponential backoff retry up to 3 times; if all fail, logged error explains issue |
  | Git configuration incomplete | _validate_git_config() checks git user.name/user.email before attempting commit |
  | Network failure on push | Error is logged; commit exists locally and can be pushed manually |
  | File I/O error | validate_file_encoding() catches file errors; returned in result['errors'] |

  ## Success Criteria

  The feature is complete when:

  1. **File Created**: test-8ij3et.md exists at project root with valid markdown structure
  2. **Content Valid**: Contains H1 heading and exactly 2-3 sentences
  3. **Encoding Correct**: UTF-8 encoding, Unix LF line endings
  4. **Git Committed**: Single atomic commit with markdown file and spec files
  5. **Commit Message**: Conventional format: `feat(200): Create markdown file test-8ij3et.md with title and prose content`
  6. **Pushed**: Commit visible on origin/feat/200-markdown-file-creation-791c69
  7. **Logs Clear**: All operations logged; errors (if any) are actionable

  ## Dependencies & Assumptions

  **Dependencies** (already available):
  - src/create_markdown.py — all orchestration utilities
  - sheep.config.llm — Claude API initialization
  - sheep.observability.logging — structured logging
  - GitPython — git operations

  **Assumptions**:
  - ANTHROPIC_API_KEY environment variable is set and valid
  - Git user.name and user.email are configured
  - Current working directory is project root
  - Network connectivity to Claude API and GitHub
