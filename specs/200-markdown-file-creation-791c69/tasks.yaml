content: |
  ## Summary

  Feature 200 implementation follows 4 logical phases with 8 concrete tasks:

  **Phase 1: Foundation (2 tasks, 15 min)** — Examine existing patterns from Feature 199 and
  verify utilities are available in src/create_markdown.py.

  **Phase 2: Implementation (1 task, 15 min)** — Create feature_200_main.py by adapting the
  Feature 199 template with updated filenames and branch names.

  **Phase 3: Execution & Validation (2 tasks, 10 min)** — Run the orchestration script and
  validate the generated markdown file meets all requirements (H1 heading, exactly 2-3 sentences,
  UTF-8 encoding, Unix LF line endings).

  **Phase 4: Integration & Push (3 tasks, 9 min)** — Stage all files (markdown + specs) in git,
  create an atomic commit with conventional message format, and push to remote branch.

  The implementation is straightforward reuse of proven patterns. All core functionality
  (content generation, validation, file I/O, git integration) already exists in
  src/create_markdown.py. Feature 200 adds only the thin orchestration script with
  Feature 200-specific parameters (filename=test-8ij3et.md, branch=feat/200-...).

  **Total estimated time: 49 minutes** (planning time was separate; this is execution time)

  Each task includes specific acceptance criteria and TDD cycles (red/green/refactor) to
  guide implementation and validation. Tasks are ordered by dependency to enable parallel
  work where applicable (tasks 1-2 can be done concurrently; task 3 depends on 1+2, etc.).
