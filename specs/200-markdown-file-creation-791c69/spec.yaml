content: |
  ## Problem Statement

  Create a single markdown file named `test-8ij3et.md` at the project root containing a title (H1 heading) and exactly 2-3 sentences of prose content. This follows the established pattern in the Sheep repository where each feature involves creating a markdown file with standardized structure, validating it, staging it in git, committing with a conventional commit message, and pushing to the feature branch. This is the 200th iteration of this pattern, demonstrating a reproducible feature automation workflow.

  ## Success Criteria

  - [ ] File `test-8ij3et.md` is created at project root with UTF-8 encoding and Unix LF line endings
  - [ ] File contains exactly one H1 heading (markdown syntax: `# Title`)
  - [ ] File contains exactly 2-3 complete sentences of prose after the heading (validated via regex sentence boundary detection)
  - [ ] File is validated against the standardized markdown structure before commit
  - [ ] File is staged and committed with conventional commit message format: `feat(200): Create markdown file test-8ij3et.md with title and prose content`
  - [ ] Commit message optionally includes a brief description of the generated content
  - [ ] Both the markdown file and spec file are committed in a single atomic commit
  - [ ] Commit is pushed to feature branch `feat/200-markdown-file-creation-791c69`
  - [ ] Spec file is updated to Requirements phase
  - [ ] No new source code is written; implementation reuses existing `src/create_markdown.py` utilities
  - [ ] All errors are logged via structured logging with appropriate context
  - [ ] Content generation retries are attempted on API failures (exponential backoff strategy)

  ## Functional Requirements

  - **FR-1**: Generate markdown content using Claude API with prompt requesting an H1 heading followed by 2-3 sentences on any topic
  - **FR-2**: Create file at project root with filename `test-8ij3et.md` using UTF-8 encoding and Unix LF line endings
  - **FR-3**: Validate generated content structure:
    - Presence of exactly one H1 heading (regex: `^# `)
    - Presence of exactly 2-3 complete sentences (sentence boundary detection via regex)
    - Presence of blank line between heading and prose
  - **FR-4**: Retry content generation on validation failure with exponential backoff (max 3 attempts recommended)
  - **FR-5**: Stage the markdown file in git working tree
  - **FR-6**: Commit both the markdown file and spec file with conventional commit message `feat(200): Create markdown file test-8ij3et.md with title and prose content`
  - **FR-7**: Push the commit to feature branch `feat/200-markdown-file-creation-791c69`
  - **FR-8**: Handle API failures gracefully with retry logic before failing the workflow

  ## Non-Functional Requirements

  - **NFR-1**: Reuse existing utilities from `src/create_markdown.py` — no new source files should be created for core functionality
  - **NFR-2**: Use non-streaming Claude API calls for simpler error handling and validation of complete responses
  - **NFR-3**: Log all operations (content generation, validation, file creation, git operations) using structured logging from `sheep.observability.logging`
  - **NFR-4**: Implement exponential backoff for API retries (e.g., 1s, 2s, 4s) with max 3 attempts
  - **NFR-5**: Complete execution within estimated S-size (few hours) effort; actual runtime should be <2 minutes
  - **NFR-6**: Handle missing or invalid ANTHROPIC_API_KEY environment variable with clear error message
  - **NFR-7**: Ensure generated content is unique and does not duplicate content from previous test files
  - **NFR-8**: Validate all file I/O operations and report filesystem errors with context

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | API response format (streaming vs. non-streaming) | Non-streaming | Simpler error handling, sufficient for small content volume, maintains consistency with 199 prior features |
  | 2 | Commit strategy (separate vs. bundled) | Single bundled commit | Atomic feature implementation, aligns with established pattern, simpler git workflow |
  | 3 | Sentence count validation | Strict (exactly 2-3) | Enforces standardization across test files, matches established pattern, retry logic handles API variance |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation organized as follows:

  - **Root directory**: Contains test markdown files (test-*.md) and feature implementation scripts
  - **src/sheep/**: Core platform module with subdirectories:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management and LLM setup
    - `flows/` - Flow definitions for orchestration
    - `observability/` - Structured logging and tracing integration
    - `tools/` - Git operations and file utilities
    - `features/` - Feature-specific implementations
    - `content_generators.py` - Utilities for AI-powered content generation
  - **src/create_markdown.py**: Reusable utilities for markdown generation, validation, and git integration
  - **specs/**: Contains ~228 feature specification YAML files
  - **tests/**: Test suite for the platform
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies)

  ### Architecture Patterns

  1. **Established Feature Pattern**: All recent features (195-199) follow the same workflow:
     - Generate markdown content with H1 heading + 2-3 sentences using Claude API
     - Validate content structure (heading presence, sentence count)
     - Create file with UTF-8 encoding and Unix LF line endings
     - Stage and commit with conventional commit format: `feat(###): Create markdown file test-*.md ...`
     - Push to feature branch

  2. **Markdown Structure**: Standardized across all test files:
     ```
     # Title Here

     Sentence one. Sentence two. Sentence three.
     ```

  3. **Git Workflow**: Files are created at project root, committed, and pushed to feature branches

  4. **Content Generation**: Uses Claude API (via `sheep.config.llm.get_reasoning_llm()`) with prompt-based generation and validation

  5. **Error Handling & Validation**: Existing utilities in `src/create_markdown.py` include:
     - Sentence boundary detection via regex pattern
     - Content validation with retry logic (exponential backoff)
     - Comprehensive logging via structured logging

  ### Relevant Technologies

  - **Python 3.11+**: Language and runtime
  - **CrewAI 0.86.0+**: Agentic orchestration framework
  - **Claude API**: Content generation via Anthropic SDK
  - **GitPython 3.1.0+**: Git operations (staging, committing, pushing)
  - **Pydantic 2.0+**: Data validation and settings management
  - **Langfuse 2.0+**: Observability and execution tracing
  - **Markdown**: File format (no special parser needed - plain text with UTF-8 encoding)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Project root directory | High | File will be created here following naming convention test-RANDOM_ID.md |
  | Git working tree | High | File will be staged, committed, and pushed as part of the feature workflow |
  | src/create_markdown.py | Low | Will reuse existing utilities; no modifications needed unless enhancement is desired |
  | Feature specifications (specs/) | Low | This spec file serves as documentation for the feature |

  ## Dependencies

  - **src/create_markdown.py**: Reusable module providing `generate_markdown_content()` for Claude API integration and `create_and_commit_markdown_file()` for file creation + git workflow
  - **sheep.config.llm**: LLM configuration and Claude API access
  - **sheep.observability.logging**: Structured logging infrastructure
  - **GitPython**: For git staging, committing, and pushing operations
  - **Anthropic Claude API**: For generating prose content (requires valid API key in environment)

  ## Size Estimate

  **S** — A few hours of work. This is a straightforward feature because:
  - No new source code needs to be written for the core functionality
  - Existing `src/create_markdown.py` module provides all required utilities (content generation, validation, git operations)
  - File structure is completely standardized and well-tested across 200 prior iterations
  - Content validation and error handling are already implemented
  - Git workflow is established and proven
  - The only variation is the filename (`test-8ij3et.md`) and randomly generated content, both handled by existing code
  - Implementation can be accomplished by:
    1. Creating a feature implementation script (similar to feature_199_main.py)
    2. Calling existing `create_and_commit_markdown_file()` with filename "test-8ij3et.md"
    3. Staging and committing the spec file
    4. Pushing to the feature branch
