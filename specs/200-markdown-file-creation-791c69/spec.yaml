content: |
  ## Problem Statement

  Create a single markdown file named `test-8ij3et.md` at the project root containing a title and 2-3 sentences of prose content. This follows the established pattern in the Sheep repository where each feature involves creating a markdown file with standardized structure and committing it with git integration.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation organized as follows:

  - **Root directory**: Contains test markdown files (test-*.md) and feature implementation scripts
  - **src/sheep/**: Core platform module with subdirectories:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management and LLM setup
    - `flows/` - Flow definitions for orchestration
    - `observability/` - Structured logging and tracing integration
    - `tools/` - Git operations and file utilities
    - `features/` - Feature-specific implementations
    - `content_generators.py` - Utilities for AI-powered content generation
  - **src/create_markdown.py**: Reusable utilities for markdown generation, validation, and git integration
  - **specs/**: Contains ~228 feature specification YAML files
  - **tests/**: Test suite for the platform
  - **pyproject.toml**: Python project configuration (Python 3.11+, dependencies)

  ### Architecture Patterns

  1. **Established Feature Pattern**: All recent features (195-199) follow the same workflow:
     - Generate markdown content with H1 heading + 2-3 sentences using Claude API
     - Validate content structure (heading presence, sentence count)
     - Create file with UTF-8 encoding and Unix LF line endings
     - Stage and commit with conventional commit format: `feat(###): Create markdown file test-*.md ...`
     - Push to feature branch

  2. **Markdown Structure**: Standardized across all test files:
     ```
     # Title Here

     Sentence one. Sentence two. Sentence three.
     ```

  3. **Git Workflow**: Files are created at project root, committed, and pushed to feature branches

  4. **Content Generation**: Uses Claude API (via `sheep.config.llm.get_reasoning_llm()`) with prompt-based generation and validation

  5. **Error Handling & Validation**: Existing utilities in `src/create_markdown.py` include:
     - Sentence boundary detection via regex pattern
     - Content validation with retry logic (exponential backoff)
     - Comprehensive logging via structured logging

  ### Relevant Technologies

  - **Python 3.11+**: Language and runtime
  - **CrewAI 0.86.0+**: Agentic orchestration framework
  - **Claude API**: Content generation via Anthropic SDK
  - **GitPython 3.1.0+**: Git operations (staging, committing, pushing)
  - **Pydantic 2.0+**: Data validation and settings management
  - **Langfuse 2.0+**: Observability and execution tracing
  - **Markdown**: File format (no special parser needed - plain text with UTF-8 encoding)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Project root directory | High | File will be created here following naming convention test-RANDOM_ID.md |
  | Git working tree | High | File will be staged, committed, and pushed as part of the feature workflow |
  | src/create_markdown.py | Low | Will reuse existing utilities; no modifications needed unless enhancement is desired |
  | Feature specifications (specs/) | Low | This spec file serves as documentation for the feature |

  ## Dependencies

  - **src/create_markdown.py**: Reusable module providing `generate_markdown_content()` for Claude API integration and `create_and_commit_markdown_file()` for file creation + git workflow
  - **sheep.config.llm**: LLM configuration and Claude API access
  - **sheep.observability.logging**: Structured logging infrastructure
  - **GitPython**: For git staging, committing, and pushing operations
  - **Anthropic Claude API**: For generating prose content (requires valid API key in environment)

  ## Size Estimate

  **S** — A few hours of work. This is a straightforward feature because:
  - No new source code needs to be written for the core functionality
  - Existing `src/create_markdown.py` module provides all required utilities (content generation, validation, git operations)
  - File structure is completely standardized and well-tested across 200 prior iterations
  - Content validation and error handling are already implemented
  - Git workflow is established and proven
  - The only variation is the filename (`test-8ij3et.md`) and randomly generated content, both handled by existing code
  - Implementation can be accomplished by:
    1. Creating a feature implementation script (similar to feature_199_main.py)
    2. Calling existing `create_and_commit_markdown_file()` with filename "test-8ij3et.md"
    3. Staging and committing the spec file
    4. Pushing to the feature branch
