content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-kp1fm3.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 90+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 069-291, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-kp1fm3.md` exists in repository root
  - [ ] File contains exactly one markdown heading (`#`) as the title
  - [ ] File contains 2-3 sentences of prose content following the heading
  - [ ] File uses valid CommonMark markdown syntax
  - [ ] File uses UTF-8 encoding with LF line endings
  - [ ] File is approximately 400-600 bytes in size
  - [ ] File is staged in git (visible in `git status`)
  - [ ] Commit with message `"feat: create markdown file test-kp1fm3.md with prose content"` exists in git history
  - [ ] Commit is pushed to feature branch `feat/292-markdown-file-creation-a7c367`
  - [ ] File structure and formatting matches established pattern from features 069-291

  ## Functional Requirements

  - **FR-1**: File must be created with exact filename `test-kp1fm3.md` in the repository root directory
  - **FR-2**: File must contain a single markdown level-1 heading (`# Title`) as the document title
  - **FR-3**: File must contain 2-3 sentences of prose content describing any topic (no restrictions on subject matter)
  - **FR-4**: File must use valid CommonMark markdown syntax that passes markdown linting
  - **FR-5**: File must be encoded in UTF-8 with LF (Unix) line endings, not CRLF
  - **FR-6**: File must be created via file I/O operations (e.g., Python `pathlib` or `open()`)
  - **FR-7**: File must be staged in the git index after creation
  - **FR-8**: A single git commit must be created with message `"feat: create markdown file test-kp1fm3.md with prose content"`
  - **FR-9**: The commit must be pushed to the remote tracking the feature branch `feat/292-markdown-file-creation-a7c367`
  - **FR-10**: Implementation must follow the exact workflow pattern established in features 069-291 (file creation → validation → stage → commit → push)

  ## Non-Functional Requirements

  - **NFR-1**: File size must be approximately 400-600 bytes to align with established test file precedents
  - **NFR-2**: Implementation must complete within 10-15 minutes, consistent with recent identical features
  - **NFR-3**: Markdown syntax must validate against CommonMark specification without warnings
  - **NFR-4**: Commit message must follow conventional commits specification (prefix with `feat:`)
  - **NFR-5**: File content must be original prose, not copied from existing test files
  - **NFR-6**: Implementation must not modify any existing files or directory structure
  - **NFR-7**: No dependencies beyond Python 3.11 standard library (pathlib, no external packages required)
  - **NFR-8**: Git operations must use standard git configuration (user.name, user.email) already set in repository

  ## Product Questions & AI Recommendations

  No unresolved product decisions for this feature. The specification is complete and unambiguous:

  | Decision | Status | Rationale |
  | -------- | ------ | --------- |
  | File naming | Resolved | Filename `test-kp1fm3.md` is pre-specified in the feature request; no choice needed |
  | Content format | Resolved | Markdown with heading + 2-3 sentences is established pattern from 90+ prior test files |
  | Topic selection | Resolved | Feature explicitly allows "anything"; implementation has complete freedom |
  | Git workflow | Resolved | Conventional commit with feat: prefix and push workflow is established from 220+ prior features (069-291) |
  | File location | Resolved | Repository root is specified and standardized for all test-*.md files |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as follows:
  - **Root directory**: Contains 90+ generated test markdown files (test-*.md) following the same pattern
  - **Source code**: `/src/sheep/` contains the main agentic platform code
  - **Configuration**: `pyproject.toml` defines dependencies and project metadata
  - **Git integration**: Full support via GitPython and native git commands
  - **CI/CD**: `.github/workflows/ci.yml` defines build and test pipelines
  - **Docker**: `Dockerfile` defines containerized deployment with Python 3.11
  - **Specs**: `/specs/` directory contains feature specifications in YAML format

  ### Architecture Patterns

  The Sheep platform follows a modular agentic architecture:
  - **Flows**: Orchestration layer defining execution structure (in `/src/sheep/flows/`)
  - **Agents**: Specialized AI agents with focused roles (in `/src/sheep/agents/`)
  - **Tools**: Git tools, file tools, and other utilities (in `/src/sheep/tools/`)
  - **Config**: LLM factory and settings management (in `/src/sheep/config/`)
  - **Observability**: Langfuse integration for tracing and metrics (in `/src/sheep/observability/`)

  The platform automates tasks through a 5-phase workflow: 1) Create branch, 2) Research, 3) Implement, 4) Review, 5) Push.

  ### Relevant Technologies

  - **Python 3.11+**: Primary runtime (specified in `pyproject.toml` as `requires-python = ">=3.11"`)
  - **CrewAI**: Agent framework for multi-agent collaboration
  - **pathlib**: Python standard library for cross-platform file operations
  - **Git/GitPython**: Version control integration (3.1.0+)
  - **Markdown**: Standard text format for file content
  - **Pydantic**: Data validation framework
  - **Langfuse**: Observability and tracing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-kp1fm3.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-291; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/292-markdown-file-creation-a7c367` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-kp1fm3.md is provided in the feature spec and must be used exactly as specified
  - **Markdown syntax knowledge**: Implementation must follow CommonMark specification for markdown heading syntax

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-291) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-kp1fm3.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 220+ prior implementations

  ---

  _Requirements phase complete — functional requirements, non-functional requirements, and success criteria defined. No unresolved product decisions. Ready for implementation phase._
