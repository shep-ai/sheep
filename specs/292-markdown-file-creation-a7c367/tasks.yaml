content: |
  ## Task Breakdown Summary

  Feature 292 is implemented in 8 focused tasks across 2 sequential phases:

  ### Phase 1: Content Generation and Validation (Tasks 1-4)

  **Task 1**: Generate markdown content using Claude API with retry logic
  - Calls Claude API with structured prompt requesting H1 heading + 2-3 sentences
  - Implements exponential backoff (1s, 2s, 4s) for transient failures
  - Returns generated content or raises exception after max retries

  **Task 2**: Validate heading structure
  - Checks content starts with `# ` followed by non-empty title
  - Ensures exactly one H1 heading (not multiple, not wrong level)
  - Raises ValueError if heading format invalid

  **Task 3**: Validate sentence count
  - Counts sentences using regex sentence boundary detection
  - Ensures exactly 2 or 3 sentences in prose section
  - Handles edge cases (abbreviations, multiple punctuation marks)

  **Task 4**: Validate prose length and encoding
  - Combines all validation checks into single function
  - Verifies prose is 100-300 characters
  - Verifies UTF-8 encoding (no BOM)
  - Verifies blank line separator between heading and prose
  - Only succeeds if all checks pass

  ### Phase 2: File Creation and Git Integration (Tasks 5-8)

  **Task 5**: Create markdown file using pathlib
  - Uses `pathlib.Path.write_text(encoding='utf-8')` for explicit UTF-8 without BOM
  - Ensures LF (not CRLF) line endings
  - Verifies file exists and contains expected content

  **Task 6**: Stage file in git (`git add`)
  - Executes `git add test-kp1fm3.md` via subprocess
  - Verifies file appears in `git status --short` with 'A' flag (staged)

  **Task 7**: Commit with conventional message (`git commit`)
  - Message format: `feat(292): create markdown file test-kp1fm3.md with prose content`
  - Verifies commit appears in `git log --oneline`

  **Task 8**: Push to feature branch (`git push`)
  - Executes `git push -u origin feat/292-markdown-file-creation-a7c367`
  - Verifies branch tracking status via `git status -sb`

  ## Task Dependencies

  ```
  Task 1 (Content Generation)
    ↓
  Task 2 (Heading Validation)
    ↓
  Task 3 (Sentence Count Validation)
    ↓
  Task 4 (Full Content Validation)
    ↓
  Task 5 (File Creation)
    ↓
  Task 6 (Git Add)
    ↓
  Task 7 (Git Commit)
    ↓
  Task 8 (Git Push)
  ```

  All tasks are sequentially dependent (each depends on previous success).

  ## TDD Cycle Pattern

  Each task follows TDD:
  1. **RED**: Write tests that assert desired behavior (tests fail initially)
  2. **GREEN**: Implement minimal code to pass tests
  3. **REFACTOR**: Improve implementation (extract constants, enhance logging, better error messages)

  Non-code tasks like documentation would use `tdd: null`.

  ## Effort Breakdown

  | Phase | Tasks | Effort | Rationale |
  | ----- | ----- | ------ | --------- |
  | Phase 1: Content Generation & Validation | 1-4 | 6h | Content generation (2h) + three validation tasks (1h, 1.5h, 1.5h) |
  | Phase 2: File Creation & Git Integration | 5-8 | 4h | File creation (1h) + three git operations (1h, 1h, 1h) |
  | **Total** | **8 tasks** | **10h** | Includes test writing, implementation, and refactoring |

  **Notes:**
  - Effort includes writing tests (RED), implementation (GREEN), and refactoring
  - Does not include integration testing or manual verification
  - Time estimates are conservative (include potential debugging)
  - Actual execution may be faster (~5-15 minutes) due to parallelizable git operations and simple implementation

  ## Success Criteria Coverage

  Each task addresses specific success criteria from the feature spec:

  | Task | Success Criteria Addressed |
  | ---- | -------------------------- |
  | 1 | Generated content with heading and 2-3 sentences |
  | 2 | File contains exactly one markdown heading |
  | 3 | File contains 2-3 sentences of prose |
  | 4 | File uses valid CommonMark syntax; UTF-8 encoding; ~400-600 bytes |
  | 5 | File exists in root; uses UTF-8 with LF line endings |
  | 6 | File is staged in git |
  | 7 | Commit with conventional message created |
  | 8 | Commit pushed to feature branch |

  ---

  _Task breakdown complete. All 8 tasks sequentially ordered with clear dependencies,
  acceptance criteria, and TDD cycles. Ready for implementation phase._
