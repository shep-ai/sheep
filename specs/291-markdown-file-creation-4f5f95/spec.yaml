content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 291 creates a single test markdown file
  (`test-6sw4o8.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-290.
  With 290 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations.

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is organized with the following key directories:

  - **src/sheep/** — Core platform modules containing utility functions, configurations, and integrations
    - `content_generators.py` — Markdown file creation utilities with established functions for content generation, file writing, validation, and git operations
    - `config/` — Configuration modules including LLM configuration (`llm.py`)
    - `observability/` — Structured logging via structlog
    - `tools/` — Git integration tools (`GitCommitTool`, `GitPushTool`)
    - `agents/`, `flows/`, `features/` — Agentic execution framework components

  - **specs/** — Feature specifications organized by feature number, containing YAML specs and associated documentation
    - Over 290 subdirectories following pattern `NNN-markdown-file-creation-XXXXXXX`
    - Each spec contains implementation requirements and success criteria

  - **Repository root** — Contains test markdown files created by features 001-290 (hundreds of test-*.md files)

  - **Dockerfile, docker-compose.yml** — Containerization support for reproducible execution

  - **pyproject.toml, uv.lock** — Python dependency management (modern setuptools/UV tooling)

  ### Architecture Patterns

  **Established Markdown File Creation Workflow** (proven through 290 preceding features):

  1. **Content Generation** — Use Claude API via `sheep.config.llm.get_reasoning_llm()` to generate H1 heading + 2-3 sentences
  2. **File Writing** — Write to repository root using pathlib (Path class) with UTF-8 encoding, ensuring Unix LF line endings
  3. **Validation** — Verify file structure (H1 heading present, 2-3 sentences), encoding, and line endings
  4. **Git Integration** — Stage file, commit with conventional commit format, push to feature branch with upstream tracking

  **Key Utility Functions** (in `src/sheep/content_generators.py`):
  - `generate_markdown_content()` — Generate H1 + 2-3 sentences using Claude API
  - `write_markdown_file(content, filename)` — Write content to repository root
  - `validate_markdown_file(filepath)` — Validate structure, encoding, line endings
  - `commit_markdown_file(filepath, content, ...)` — Stage and commit with conventional message
  - `push_markdown_file(repo_path, ...)` — Push to remote with upstream tracking
  - `create_markdown_file(filename, ...)` — Orchestrate entire workflow end-to-end

  **Logging** — All operations use structlog with appropriate severity levels (INFO for checkpoints, DEBUG for details, ERROR for failures)

  **No Source Code Changes Required** — Feature uses only existing utility functions; no new code needs to be written

  ### Relevant Technologies

  - **Python 3.11+** — Target runtime environment for all Sheep features
  - **pathlib** — Standard library for cross-platform file path handling and I/O
  - **Git** — Version control with staging, commits, and push operations
  - **Markdown (CommonMark)** — Standard markdown syntax for H1 heading (`# Title`) and prose
  - **Claude API** — Anthropic's language model accessed via CrewAI LLM wrapper in `sheep.config.llm`
  - **UTF-8 encoding** — Standard text file encoding (no BOM, Unix LF line endings)
  - **structlog** — Structured logging with JSON-compatible output for observability

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-6sw4o8.md) to existing collection of 290+ test files; no modifications to existing files or directories |
  | File System | Low | Single file creation (~250-600 bytes); no directory structure changes, no deletions or overwrites; file is placed at repo root |
  | Git Repository | Low | Standard single commit and push following established pattern from 290 preceding features; no branch/merge complexity, uses existing feature branch |
  | src/sheep/content_generators.py | None | Feature uses existing utility functions; no modifications to source code required |
  | specs/ | Low | Adds spec directory for feature 291; spec documentation phase only, no impact on other specs or source code |
  | Tests | None | Feature does not require test modifications; is itself a test artifact validating the Sheep platform |
  | Configuration | None | Feature uses existing environment configuration; no changes to .env, pyproject.toml, or other configs |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or core platform functionality — purely data artifact creation |

  ## Dependencies

  - **Git repository** — Feature branch `feat/291-markdown-file-creation-4f5f95` must exist (pre-created per git status)
  - **File system** — Write access to repository root directory (standard execution environment)
  - **Established pattern** — 290 preceding test files provide clear precedent for content format and validation; all patterns proven
  - **Git configuration** — Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library** — pathlib module available in Python 3.11+
  - **sheep.content_generators module** — Utility functions available: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`, and `create_markdown_file()`
  - **Claude API access** — ANTHROPIC_API_KEY must be configured in environment for content generation via `sheep.config.llm.get_reasoning_llm()`
  - **File naming** — Exact filename `test-6sw4o8.md` specified in feature spec and must be used as provided

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation** — ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation** — ~3 minutes (write file using pathlib, validate structure/encoding/line endings using existing utilities)
  - **Git workflow** — ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate** — 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 290 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting (content generation, validation, git operations)
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - File naming (test-6sw4o8.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 290 prior implementations
  - Recent implementations (features 284-290) demonstrate efficient execution of identical features
  - Primary implementation path: Call `create_markdown_file("test-6sw4o8.md", feature_number=291)` from existing utilities
