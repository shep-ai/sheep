content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create a simple test markdown file
  following an extensively-established pattern. Feature 291 creates a single test markdown file
  (`test-6sw4o8.md`) at the repository root with a title and prose content.

  This is a continuation of the markdown-file-creation pattern established in features 001-290.
  With 290 preceding identical features already implemented, implementation patterns, tooling, and
  validation approaches are well-documented and proven. This feature is identical in structure and
  requirements to all previous implementations.

  ## Success Criteria

  - [ ] Markdown file `test-6sw4o8.md` created in repository root directory
  - [ ] File contains exactly 1 H1 heading (ATX-style: `# Title`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File encoding is UTF-8 with Unix LF line endings (no BOM, no CRLF)
  - [ ] File content validation passes (H1 present, sentence count correct, encoding valid, line endings correct)
  - [ ] File is staged in git via `git add`
  - [ ] Commit created with conventional message format: `feat(291): create markdown file test-6sw4o8.md with prose content`
  - [ ] Commit contains only the new markdown file (no other files)
  - [ ] Commit pushed to remote feature branch `feat/291-markdown-file-creation-4f5f95` with upstream tracking
  - [ ] All operations logged via structlog with appropriate severity (INFO for checkpoints, DEBUG for details)
  - [ ] Total implementation time within S estimate (15-20 minutes)

  ## Functional Requirements

  - **FR-1**: Use Claude API via `sheep.config.llm.get_reasoning_llm()` to generate H1 heading (title) for markdown content
  - **FR-2**: Generate exactly 2-3 sentences of prose content using Claude API that relate to the selected topic
  - **FR-3**: Write generated markdown content to file named `test-6sw4o8.md` at repository root (not in subdirectory)
  - **FR-4**: Ensure file is written with UTF-8 encoding and Unix LF line endings
  - **FR-5**: Validate created file to confirm: (a) H1 heading is present, (b) prose contains 2-3 sentences, (c) UTF-8 encoding, (d) Unix LF line endings
  - **FR-6**: Stage the markdown file in git using `git add test-6sw4o8.md`
  - **FR-7**: Create a git commit with conventional commit message format including feature number (291) and descriptive message
  - **FR-8**: Push the commit to the feature branch `feat/291-markdown-file-creation-4f5f95` with upstream tracking (`-u origin`)

  ## Non-Functional Requirements

  - **NFR-1**: Performance — Claude API content generation must complete within 10 seconds per call (typical: 3-5 seconds)
  - **NFR-2**: Compatibility — Use Python 3.11+ and pathlib for cross-platform file path handling (Windows, macOS, Linux)
  - **NFR-3**: Reliability — Reuse existing utility functions from `src/sheep/content_generators.py` to ensure proven reliability
  - **NFR-4**: Observability — All operations must emit structured logs via structlog (INFO for key checkpoints, DEBUG for intermediate steps, ERROR for failures)
  - **NFR-5**: Maintainability — Implementation must not modify source code, configuration files, or tests; must be self-contained artifact creation
  - **NFR-6**: Code Reuse — Must use only existing utility functions: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`, and optionally `create_markdown_file()` (orchestration)
  - **NFR-7**: Consistency — File content and structure must match pattern established by features 001-290 (H1 heading, 2-3 sentences, no trailing metadata)
  - **NFR-8**: Efficiency — Total implementation time target 15-20 minutes (S estimate); feature should be completable in one focused session

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should generated content topic be freely chosen by the AI or constrained to specific categories? | Free topic selection | Spec explicitly states "about anything", allowing AI to independently choose topic. Proven through 290 implementations. More interesting content, no constraints needed. |
  | 2 | Should generated markdown content be validated before committing to git? | Comprehensive validation | Established pattern from 290 prior features. Validates H1 heading, sentence count, encoding, and line endings. Catches errors early and ensures quality. |
  | 3 | Should implementation use existing utility functions or create new code? | Use existing utilities only | Spec requires "no new code". All necessary functions proven through 290 implementations. Maintains pattern consistency and minimizes risk. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Adds one new markdown file (test-6sw4o8.md) to existing collection of 290+ test files; no modifications to existing files or directories |
  | File System | Low | Single file creation (~250-600 bytes); no directory structure changes, no deletions or overwrites; file is placed at repo root |
  | Git Repository | Low | Standard single commit and push following established pattern from 290 preceding features; no branch/merge complexity, uses existing feature branch |
  | src/sheep/content_generators.py | None | Feature uses existing utility functions; no modifications to source code required |
  | specs/ | Low | Adds spec directory for feature 291; spec documentation phase only, no impact on other specs or source code |
  | Tests | None | Feature does not require test modifications; is itself a test artifact validating the Sheep platform |
  | Configuration | None | Feature uses existing environment configuration; no changes to .env, pyproject.toml, or other configs |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or core platform functionality — purely data artifact creation |

  ## Dependencies

  - **Git repository** — Feature branch `feat/291-markdown-file-creation-4f5f95` must exist (pre-created per git status)
  - **File system** — Write access to repository root directory (standard execution environment)
  - **Established pattern** — 290 preceding test files provide clear precedent for content format and validation; all patterns proven
  - **Git configuration** — Standard git configuration (user.name, user.email) must be set for commits
  - **Python standard library** — pathlib module available in Python 3.11+
  - **sheep.content_generators module** — Utility functions available: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`, and `create_markdown_file()`
  - **Claude API access** — ANTHROPIC_API_KEY must be configured in environment for content generation via `sheep.config.llm.get_reasoning_llm()`
  - **File naming** — Exact filename `test-6sw4o8.md` specified in feature spec and must be used as provided

  ## Size Estimate

  **S** (Small — approximately 15-20 minutes) — Minimal-effort, single-file creation feature:

  - **Content generation** — ~3 minutes (LLM call to generate H1 heading + 2-3 sentences via Claude API)
  - **File creation and validation** — ~3 minutes (write file using pathlib, validate structure/encoding/line endings using existing utilities)
  - **Git workflow** — ~2-3 minutes (stage, commit with conventional message, push to feature branch)
  - **Total estimate** — 15-20 minutes of actual work

  **Justification**:
  - Extensively-established pattern with 290 identical preceding features
  - Core utility functions in `src/sheep/content_generators.py` handle all heavy lifting (content generation, validation, git operations)
  - Flexible topic selection with no architectural decisions or research required
  - Single file with well-understood structure (H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - File naming (test-6sw4o8.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows proven precedent from 290 prior implementations
  - Recent implementations (features 284-290) demonstrate efficient execution of identical features
  - Primary implementation path: Call `create_markdown_file("test-6sw4o8.md", feature_number=291)` from existing utilities
