content: |
  ## Summary

  Feature 291 implementation breaks down into 6 concrete tasks across 4 phases. The workflow is:

  1. **Preparation (Task 1)**: Verify environment has Python 3.11+, dependencies installed, Git configured, and ANTHROPIC_API_KEY available.

  2. **Implementation (Task 2)**: Create a simple entry point function that calls `create_markdown_file("test-6sw4o8.md", feature_number=291)`. This delegates all complexity to the existing orchestration function.

  3. **Testing (Tasks 3-5)**: Write comprehensive tests using TDD approach:
     - Unit test (Task 3) verifies entry point returns expected result structure
     - Integration test (Task 4) verifies file was created with correct content and encoding
     - Integration test (Task 5) verifies git operations (commit, push, upstream tracking)

  4. **Verification (Task 6)**: Run all tests together and verify every success criterion is met. If any test fails, diagnose and fix the root cause.

  **Effort Breakdown**:
  - Task 1 (verification): 15 min
  - Task 2 (entry point): 30 min
  - Task 3 (unit test): 45 min
  - Task 4 (file integration test): 1 hour
  - Task 5 (git integration test): 1 hour
  - Task 6 (end-to-end): 30 min
  - **Total**: 4.5 hours (includes all TDD cycles)

  **Key Dependencies**:
  - Task 1 must complete before Task 2 (need verified environment)
  - Task 2 must complete before Task 3 (need implementation to test)
  - Tasks 3-5 can be written in parallel after Task 2
  - Task 6 depends on Tasks 3-5 (verify all tests pass)

  **TDD Approach**:
  Each code task follows RED-GREEN-REFACTOR:
  - RED: Write test that fails (asserts desired behavior that doesn't exist yet)
  - GREEN: Write minimal code to make test pass
  - REFACTOR: Clean up, improve clarity, add edge cases

  **Success Criteria Verification**:
  By the end of Task 6, all 10 success criteria from the feature spec are verified:
  - ✓ File `test-6sw4o8.md` created at repo root
  - ✓ Contains exactly 1 H1 heading (ATX-style `# Title`)
  - ✓ Contains exactly 2-3 sentences of prose
  - ✓ UTF-8 encoding with Unix LF line endings (no BOM, no CRLF)
  - ✓ File content validation passes (done by orchestration function)
  - ✓ File staged in git (verified by Task 5)
  - ✓ Commit with conventional message created (verified by Task 5)
  - ✓ Commit contains only markdown file (verified by Task 5)
  - ✓ Pushed to remote with upstream tracking (verified by Task 5)
  - ✓ All operations logged via structlog (verified by observing logs in Task 6)
