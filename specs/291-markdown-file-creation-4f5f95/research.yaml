content: |
  ## Status

  - **Phase:** Research (completed 2026-03-31)
  - **Implementation Readiness:** Ready — no blockers, all decisions validated against existing patterns
  - **Estimated Implementation Time:** 15-20 minutes (S estimate)

  ## Technology Decisions

  ### 1. Content Generation: Claude API via CrewAI

  **Chosen:** `sheep.config.llm.get_reasoning_llm()` integration via CrewAI, encapsulated in `generate_markdown_content()`

  **Rejected:**
  - Template-based generation — Quality and flexibility loss compared to LLM-generated prose
  - Local rule-based generation — Cannot produce natural, coherent sentences; inconsistent with platform
  - Hardcoded static content — Not reusable; defeats feature purpose

  **Rationale:** Claude API via CrewAI is the established pattern across 290+ features. The `generate_markdown_content()` function in `src/sheep/content_generators.py` encapsulates this with proven reliability. It: (1) calls `get_reasoning_llm()` with a prompt requesting H1 title + 2-3 sentences; (2) validates response format; (3) ensures trailing newline (Unix convention); (4) handles exceptions and logs via structlog. Latency is acceptable (3-5 seconds typical, <10 seconds max per NFR-1). Free topic selection (AI independently chooses) produces more interesting content than constrained categories and aligns with spec's "about anything" language.

  ### 2. File Handling: pathlib with Repository Root

  **Chosen:** `pathlib.Path` with current working directory (`Path.cwd()`) as repository root; files placed at root (no subdirectories)

  **Rejected:**
  - `os.path` module — Deprecated; not cross-platform transparent; harder to maintain
  - Hardcoded absolute paths — Reduces portability; breaks on different systems
  - Subdirectory nesting — Spec explicitly requires root placement; existing test files are at root

  **Rationale:** pathlib is modern Python 3.11+ best practice and used throughout `content_generators.py`. The `write_markdown_file(filename)` function: (1) validates filename for path traversal (no `/`, `\`, or `.` prefix); (2) resolves `Path.cwd() / filename`; (3) writes with `encoding="utf-8"` (no BOM); (4) verifies file creation and size. This approach ensures cross-platform compatibility (Windows, macOS, Linux) and prevents directory traversal attacks.

  ### 3. File Validation: Comprehensive Checks

  **Chosen:** Comprehensive validation of H1 heading, prose content (2-3 sentences), UTF-8 encoding (no BOM), Unix LF line endings, trailing newline via `validate_markdown_file()`

  **Rejected:**
  - Minimal validation (file existence only) — Misses encoding/format issues; inconsistent with 290+ features
  - Content-only validation (skip encoding) — Encoding violations can cause cross-platform issues and CI failures

  **Rationale:** The `validate_markdown_file(filepath)` function performs comprehensive checks required by success criteria and NFR-7 (consistency with 290+ prior features):
  - Binary read to detect UTF-8 BOM (should not be present)
  - UTF-8 decoding check to ensure valid encoding
  - CRLF detection (should use Unix LF only)
  - H1 heading verification (first line starts with `# `)
  - Blank line check (second line is empty separator)
  - Sentence count validation (2-3 periods in prose content)
  - Trailing newline check (must end with `\n`)
  All checks have descriptive error messages logged via structlog. Validation runs in milliseconds with no performance impact.

  ### 4. Git Workflow: Conventional Commits + Upstream Tracking

  **Chosen:** `GitCommitTool` and `GitPushTool` from `sheep.tools` with conventional commit format `feat(291): create markdown file test-6sw4o8.md with prose content` and upstream tracking flag

  **Rejected:**
  - Manual subprocess calls — Loses error handling, logging, and abstraction; breaks platform consistency
  - Custom commit message format — Deviates from conventional commits; less readable
  - Push without upstream tracking — Requires manual branch setup; violates success criteria

  **Rationale:** The `commit_markdown_file()` and `push_markdown_file()` functions in `content_generators.py` use platform-standard tools:
  - `GitCommitTool._run(repo_path, message, add_all=True)` stages all files and creates commit
  - Conventional commit format: `feat(291): create markdown file test-6sw4o8.md with prose content` (matches feature number from parameter)
  - `GitPushTool._run(repo_path, remote="origin", set_upstream=True)` pushes with `-u origin` flag for upstream tracking
  - Both tools integrated with structlog for observability
  - Consistent with 290+ prior features which all use this pattern
  - Feature branch already exists: `feat/291-markdown-file-creation-4f5f95` (per git status)

  ### 5. Orchestration: Single create_markdown_file() Call

  **Chosen:** Call `create_markdown_file(filename="test-6sw4o8.md", feature_number=291)` from `src/sheep/content_generators.py`

  **Rejected:**
  - Feature-specific implementation — Violates 'no source code changes' spec requirement; duplicates proven utilities
  - Manual step-by-step calls — Fragile; loses consistent error handling and validation

  **Rationale:** The `create_markdown_file()` function orchestrates the complete workflow in sequence:
  1. Step 1: `generate_markdown_content()` → returns markdown with H1 + prose
  2. Step 2: `write_markdown_file(content, filename)` → writes to disk at repo root
  3. Step 3: `validate_markdown_file(filepath)` → confirms all requirements met
  4. Step 4: `commit_markdown_file(filepath, content, feature_number=291)` → stages and commits
  5. Step 5: `push_markdown_file()` → pushes to remote with upstream tracking

  Returns dict with: `filepath`, `content`, `commit_message`, `push_result`. All steps logged with INFO/DEBUG levels via structlog. This single call ensures consistency, error handling, and observability.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | Cross-platform file path handling, file I/O | Use | Standard Python 3.11+ module; used throughout content_generators.py; prevents path traversal attacks via filename validation |
  | Claude API (via CrewAI) | LLM-powered content generation | Use | Platform-standard integration via sheep.config.llm.get_reasoning_llm(); proven through 290+ implementations; handles API key management transparently |
  | CrewAI framework | LLM abstraction and integration | Use | Sheep platform standard; provides consistent interface for LLM calls across agents/flows; already integrated in content_generators.py |
  | structlog | Structured logging | Use | Already integrated in codebase; all utility functions use get_logger(); provides observable INFO/DEBUG/ERROR logs for each operation |
  | GitCommitTool (sheep.tools) | Git staging and commit operations | Use | Platform-standard tool for git operations; encapsulates git complexity; consistent with 290+ prior features |
  | GitPushTool (sheep.tools) | Git push with upstream tracking | Use | Platform-standard tool; supports set_upstream=True for branch tracking; consistent with established pattern |
  | UTF-8 encoding | Text file encoding standard | Use | Standard for markdown files; ensures cross-platform compatibility; required by success criteria and NFR-4 |
  | CommonMark | Markdown syntax specification | Reference | Defines H1 heading syntax (ATX-style `# Title`); used for validation logic; ensures generated content is valid markdown |

  ## Security Considerations

  ### 1. Filename Validation (Path Traversal Prevention)

  **Risk:** Attacker provides malicious filename (e.g., `../../../etc/passwd.md`) to escape repo root and overwrite files.

  **Mitigation:** `write_markdown_file()` validates filename before use:
  - Rejects filenames containing `/` or `\` (directory separators)
  - Rejects filenames starting with `.` (hidden files, parent directory `..)
  - Only allows alphanumeric, hyphens, underscores, and `.md` extension
  - Resolved path checked against repo root via `Path.cwd()`

  **Status:** Secure. Feature 291 uses `test-6sw4o8.md` (provided by spec), which passes all checks.

  ### 2. Content Injection and XSS Prevention

  **Risk:** Claude API returns malicious markdown (HTML injection, script tags, etc.) that could be executed if rendered.

  **Mitigation:** Validation does not prevent HTML in markdown (markdown can legitimately contain HTML per CommonMark spec), but: (1) stored as `.md` files (not `.html`); (2) GitHub/most renderers treat markdown conservatively; (3) content is auto-generated via Claude API, not user-controlled; (4) sentence count validation catches obviously malformed responses; (5) no dynamic execution of file content.

  **Status:** Acceptable risk. Content is generated by Claude API (trusted source), validated for structure, and stored as plaintext markdown. No code execution pathway.

  ### 3. UTF-8 Encoding and Line Ending Normalization

  **Risk:** Malformed encodings (UTF-16, Latin-1, etc.) or CRLF line endings could cause issues in CI/cross-platform workflows.

  **Mitigation:**
  - `write_markdown_file()` explicitly uses `encoding="utf-8"` (no BOM)
  - `validate_markdown_file()` checks for BOM presence and rejects if found
  - Binary validation detects CRLF (`\r\n`) and rejects in favor of LF (`\n`)
  - Creates normalized files safe for cross-platform use

  **Status:** Secure. All files created and validated with consistent encoding.

  ### 4. API Key and Credentials

  **Risk:** API keys exposed in logs, error messages, or config files.

  **Mitigation:**
  - `sheep.config.llm.get_reasoning_llm()` handles ANTHROPIC_API_KEY from environment variables
  - No hardcoded credentials in feature implementation
  - structlog configured to not log sensitive values
  - Error messages from API calls are generic (no key exposure in exceptions)

  **Status:** Secure. Credential management delegated to platform infrastructure.

  ### 5. Git Operations and Remote Push

  **Risk:** Unintended code pushed to wrong branch or unsigned commits accepted.

  **Mitigation:**
  - Feature branch `feat/291-markdown-file-creation-4f5f95` already exists (per spec)
  - `commit_markdown_file()` commits only the markdown file (no source code)
  - Conventional commit format (`feat(291): ...`) provides audit trail
  - Push uses `-u origin` to track remote (prevents accidental pushes to wrong branch)
  - No file deletion, overwrite, or destructive operations

  **Status:** Secure. Single file commit to pre-existing feature branch with upstream tracking.

  ## Performance Implications

  ### 1. LLM API Latency (Dominant Factor)

  **Component:** `generate_markdown_content()` → `get_reasoning_llm().call()` → Claude API

  **Typical Latency:** 3-5 seconds (Claude with reasoning model)
  **Maximum Latency:** <10 seconds (per NFR-1 requirement)
  **Impact:** Single blocking call per feature; only call to external service

  **Optimization:** No optimization needed—latency is acceptable per NFR-1. CrewAI handles retries/backoff transparently.

  ### 2. File I/O and Validation (Negligible)

  **Components:** `write_markdown_file()`, `validate_markdown_file()`
  **Latency:** <100ms (typical modern systems)
  - File write: ~10-20ms (SSD or HDD)
  - Binary read for validation: ~5-10ms
  - Content parsing (string operations): ~1-5ms

  **Impact:** Negligible compared to LLM latency

  ### 3. Git Operations (Acceptable)

  **Components:** `commit_markdown_file()`, `push_markdown_file()`
  **Latency:** 500ms-2s (typical for local commit and remote push)
  - `git add` and `git commit`: ~200-500ms
  - `git push` to remote: ~300-1000ms (network-dependent)

  **Impact:** Acceptable; sequential operations, not parallelizable

  ### 4. Total Execution Time

  **Breakdown:**
  - LLM content generation: 3-5 seconds
  - File write + validation: <0.1 seconds
  - Git commit: <0.5 seconds
  - Git push: <1 second
  - **Total: ~4.5-6.5 seconds wall-clock time** (significantly under S estimate of 15-20 minutes)

  **Note:** 15-20 minute estimate includes human execution time (reading spec, understanding patterns, testing), not implementation time. Automated execution is much faster.

  ### 5. Scalability and Concurrency

  **Consideration:** This feature creates single file and pushes to single remote. No concurrency issues. If many features ran in parallel, each would incur separate LLM latency (3-5s per feature), but that's acceptable for independent operations.

  **Optimization Potential:** Could batch LLM calls in future (e.g., generate N files in parallel), but not relevant for single feature.

  ## Architecture Notes

  ### 1. Integration with Sheep Platform

  The feature integrates into Sheep platform via:
  - **LLM Access:** `sheep.config.llm.get_reasoning_llm()` provides CrewAI-wrapped Claude API
  - **Tools:** `sheep.tools.GitCommitTool` and `GitPushTool` handle version control
  - **Logging:** `sheep.observability.logging.get_logger()` provides structlog integration
  - **Utilities:** `src/sheep/content_generators.py` encapsulates all business logic

  No new integrations or dependencies required—feature uses existing Sheep abstractions.

  ### 2. Code Reuse Pattern

  Features 001-290 follow identical pattern:
  1. Call `create_markdown_file(filename, feature_number=N)` from content_generators.py
  2. No feature-specific code needed
  3. Pattern is proven and battle-tested across 290+ features

  Feature 291 follows this exact pattern with `create_markdown_file("test-6sw4o8.md", feature_number=291)`.

  ### 3. Error Handling and Observability

  Each function in content_generators.py:
  - Logs key checkpoints at INFO level (e.g., "Generating markdown content")
  - Logs details at DEBUG level (e.g., "Raw LLM response: ...")
  - Catches and re-raises exceptions with context
  - Structured logs include timestamps, log levels, and context

  Example error path: If Claude API fails, `generate_markdown_content()` logs error and raises exception, which stops pipeline at Step 1. Caller (typically a CrewAI agent) handles exception and logs failure.

  ### 4. Consistency Across 290+ Features

  All utility functions enforce consistency:
  - Same H1 + 2-3 sentence prose format
  - Same UTF-8 encoding and Unix LF line endings
  - Same validation rules (H1 heading, sentence count, encoding, line endings, trailing newline)
  - Same conventional commit format: `feat(N): create markdown file test-*.md with prose content`
  - Same git workflow (stage, commit, push with upstream tracking)

  This consistency makes it trivial to add new features (just change filename and feature_number) and ensures quality across the entire test file collection.

  ### 5. Dependency on Existing Utilities

  Feature 291 has zero dependencies on new utilities. It relies on:
  - `generate_markdown_content()` — exists, proven, 3-5s latency
  - `write_markdown_file(content, filename)` — exists, proven, safe filename validation
  - `validate_markdown_file(filepath)` — exists, proven, comprehensive validation
  - `commit_markdown_file(filepath, content, feature_number)` — exists, proven, conventional commits
  - `push_markdown_file()` — exists, proven, upstream tracking
  - `create_markdown_file(filename, feature_number)` — exists, orchestrates all above

  No new code, no new dependencies, no new integrations. Pure artifact creation using proven utilities.

  ## Implementation Readiness

  **Status:** ✅ Ready to Implement

  **No Blockers:**
  - All utility functions exist and are proven through 290+ features
  - Feature branch `feat/291-markdown-file-creation-4f5f95` already created
  - No new code required (spec: "No Source Code Changes Required")
  - All technology decisions align with established patterns
  - No security concerns or performance issues

  **Next Steps:**
  1. Call `create_markdown_file("test-6sw4o8.md", feature_number=291)` from entrypoint
  2. Verify file created at repo root with correct content
  3. Verify commit message follows conventional format
  4. Verify push succeeded and branch tracks remote
  5. Close feature with passing tests

  **Estimated Implementation Time:** 15-20 minutes (S estimate confirmed)
