content: |
  ## Architecture Overview

  Feature 291 leverages the established pattern from 290+ preceding features. The implementation is a thin orchestration layer that calls the proven `create_markdown_file()` function from `src/sheep/content_generators.py`.

  ### Integration with Sheep Platform

  - **LLM Access**: Claude API accessed via `sheep.config.llm.get_reasoning_llm()` wrapped in CrewAI framework
  - **Utilities**: All business logic encapsulated in `src/sheep/content_generators.py`:
    - `generate_markdown_content()` — Claude API call for H1 title + 2-3 sentences
    - `write_markdown_file(content, filename)` — Writes to repo root with UTF-8 encoding, Unix LF line endings
    - `validate_markdown_file(filepath)` — Comprehensive validation (H1 heading, sentence count, encoding, line endings)
    - `commit_markdown_file()` — Git staging and conventional commit
    - `push_markdown_file()` — Push with upstream tracking (-u origin)
    - `create_markdown_file(filename, feature_number)` — Orchestrates all above steps sequentially
  - **Logging**: Structured logs via `structlog` with INFO/DEBUG/ERROR levels
  - **Git Tools**: `sheep.tools.GitCommitTool` and `GitPushTool` handle version control operations

  ### Why Orchestration Function Approach

  Calling `create_markdown_file()` directly is the correct choice because:
  1. Function already exists and proven through 290+ implementations
  2. Encapsulates all 5 steps with consistent error handling
  3. Provides single source of truth for validation and git workflow
  4. Minimal new code required (just the function call)
  5. Eliminates risk of inconsistency between features
  6. Aligns with spec requirement: "No Source Code Changes Required"

  ## Key Design Decisions

  ### Decision 1: Use Existing Orchestration Function (Not Custom Implementation)

  **Chosen**: Call `create_markdown_file("test-6sw4o8.md", feature_number=291)` from `src/sheep/content_generators.py`

  **Rejected Alternatives**:
  - Write custom content generation code — Duplicates existing proven function; increases complexity and risk
  - Manual step-by-step calls — Loses consistent error handling, validation, and logging provided by orchestration
  - Hardcoded static content — Not reusable; doesn't leverage Claude API for dynamic content

  **Rationale**: The orchestration function exists, is proven, and handles all complexity. Calling it directly is the minimal, safest approach that follows the established pattern from 290+ prior features. Implementation time is dominated by LLM latency (3-5s), not by code complexity.

  ### Decision 2: Call from Simple Entry Point (No New Abstraction)

  **Chosen**: Create a minimal entry point function/script that calls `create_markdown_file()` and returns the result

  **Rejected Alternatives**:
  - Create new utility module in `src/sheep/content_generators.py` — Violates spec requirement (no source code changes); unnecessary abstraction
  - Integrate directly into an agent workflow — Would require understanding and modifying existing framework; increases scope
  - Create a complex orchestration layer — Premature abstraction; single feature doesn't need it

  **Rationale**: Feature 291 is a single, self-contained execution. A simple entry point that calls the orchestration function is sufficient. Future features can reuse the same pattern without modification.

  ### Decision 3: Comprehensive Validation (Built Into Orchestration)

  **Chosen**: Leverage existing `validate_markdown_file()` which checks:
  - H1 heading present (first line starts with `# `)
  - Exactly 2-3 sentences in prose content
  - UTF-8 encoding (no BOM)
  - Unix LF line endings (no CRLF)
  - Trailing newline present

  **Rejected Alternatives**:
  - Minimal validation (file exists only) — Misses encoding/format issues; inconsistent with 290+ prior features
  - Custom validation logic — Reinvents existing functionality; risk of divergence

  **Rationale**: Validation is built into the orchestration function and proven through 290+ uses. Comprehensive checks catch errors early and ensure quality. No performance impact (runs in milliseconds).

  ### Decision 4: Git Workflow: Conventional Commits + Upstream Tracking

  **Chosen**: Use existing `commit_markdown_file()` and `push_markdown_file()` which:
  - Stage file with `git add test-6sw4o8.md`
  - Create commit: `feat(291): create markdown file test-6sw4o8.md with prose content`
  - Push with upstream tracking: `git push -u origin feat/291-markdown-file-creation-4f5f95`

  **Rejected Alternatives**:
  - Manual git subprocess calls — Loses error handling and logging from existing tools
  - Custom commit message format — Deviates from conventional commits standard

  **Rationale**: Existing git tools are part of sheep.tools and proven through 290+ features. They handle error cases, provide observability, and follow platform conventions. Feature branch already exists (per git status), so push with `-u` flag ensures proper upstream tracking.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Preparation** first — Verify environment and understand patterns before implementing
  2. **Implementation** second — Create the entry point with minimal code
  3. **Testing** third — Write tests to validate behavior (TDD: RED → GREEN → REFACTOR)
  4. **Integration** fourth — Run end-to-end test and verify all success criteria

  This sequence ensures:
  - Environment is ready before starting implementation
  - Implementation is guided by clear understanding of patterns
  - Tests verify behavior before integration
  - Final integration test confirms all success criteria met

  ### Core Implementation Approach

  Feature 291 implementation consists of:
  1. Create a simple function or script that calls `create_markdown_file("test-6sw4o8.md", feature_number=291)`
  2. The orchestration function handles all complexity:
     - Step 1: Generate content via Claude API (~3-5 seconds)
     - Step 2: Write to file at repo root with UTF-8 encoding
     - Step 3: Validate file structure, encoding, and line endings
     - Step 4: Stage and commit with conventional message
     - Step 5: Push to remote with upstream tracking
  3. Return result object with filepath, content, commit message, and push result
  4. Test and verify all operations succeeded

  ### Files to Create/Modify

  - **filesToCreate**: None (implementation code is minimal and could be inline in tests or entry point)
  - **filesToModify**: None (spec requirement: "No Source Code Changes Required")
  - **Artifacts Created at Runtime**: `test-6sw4o8.md` at repository root (created by orchestration function)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation Strategy |
  | ---- | ---------- | ------ | ------------------- |
  | Claude API timeout or failure | Low | Medium | Orchestration function has built-in error handling; NFR-1 specifies <10s max latency |
  | File encoding issues (CRLF vs LF) | Low | Medium | Comprehensive validation detects encoding issues before commit |
  | Git push fails (network, auth) | Low | High | Push uses `set_upstream=True` flag; existing `push_markdown_file()` has error handling |
  | Generated content doesn't meet specs | Very Low | High | Validation checks for exactly 2-3 sentences and H1 heading; proven through 290+ uses |
  | Filename collision | Very Low | Medium | Filename `test-6sw4o8.md` is unique per spec |
  | Feature branch doesn't exist | Very Low | High | Feature branch already created (per git status) |
  | Missing dependencies | Very Low | High | Production environment has all dependencies (proven through 290+ features) |

  ## Performance Considerations

  **Total Execution Time**: ~4.5-6.5 seconds wall-clock
  - Content generation (Claude API): 3-5 seconds (dominant factor)
  - File I/O + validation: <100ms
  - Git operations: 500ms-2s

  **Optimization**: None needed — execution time is acceptable and dominated by external API latency.

  ## Security Considerations

  1. **Path Traversal Prevention**: `write_markdown_file()` validates filename, rejects `../`, `./`, absolute paths
  2. **Content Injection**: Content is Claude-generated (trusted source), validated for structure, stored as plaintext markdown (no code execution)
  3. **Encoding Security**: UTF-8 validation prevents encoding-based attacks
  4. **API Key Security**: Credentials handled by `sheep.config.llm`, not exposed in implementation
  5. **Git Operations**: Single file commit to pre-existing feature branch; no force push or destructive operations

  ## Implementation Readiness

  **Status**: ✅ Ready to Implement

  **No Blockers**:
  - All utility functions exist and proven through 290+ features
  - Feature branch exists (per git status)
  - No new code required (only calling existing orchestration)
  - All technology decisions align with established patterns
  - No security, performance, or compatibility concerns

  **Next Phase**: Proceed to IMPLEMENTATION phase where the entry point will be created and tested per task breakdown.
