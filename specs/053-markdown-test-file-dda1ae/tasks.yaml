content: |
  ## Summary

  Feature 053 is implemented in 4 sequential tasks across a single phase:

  1. **Select Topic** (5 min) — Choose any topic of interest with no constraints
  2. **Create Markdown File** (10 min) — Create test-aygmjm.md with h1 title and 2-3 sentences, following established pattern
  3. **Validate Structure** (3 min) — Verify h1 heading, sentence count, UTF-8 encoding, and markdown syntax validity
  4. **Commit and Push** (2 min) — Stage file, commit with conventional message, push to feature branch

  Total effort: **20 minutes** (well within S tier estimate). No parallelization possible since each task
  depends on previous completion. Linear progression ensures validation before version control.

  ## Implementation Flow

  ```
  Task 1: Select Topic
       ↓
  Task 2: Create File (TDD: red/green/refactor)
       ↓
  Task 3: Validate Structure (TDD: red/green/refactor)
       ↓
  Task 4: Commit and Push (no code, no TDD)
  ```

  ## Key Implementation Notes

  - **Topic Selection:** Completely free-form. No constraints, research, or domain guidance required. Examples from related features: walking, architecture, software iteration, documentation.

  - **File Format:** Follow established pattern from 50+ existing test files:
    - Single h1 heading: `# Title Here`
    - Blank line after heading
    - Exactly 2-3 sentences of prose
    - UTF-8 encoding
    - LF line endings
    - No additional sections or complex formatting

  - **Validation:** Structural validation only. No prose quality assessment. Focus on format compliance (h1 + 2-3 sentences).

  - **Git Workflow:** Conventional commit with feature branch push. Message format: `feat(053): Create markdown test file with title and prose about [topic]`

  ## Success Criteria Summary

  - ✓ File test-aygmjm.md created at repository root
  - ✓ Contains valid markdown h1 heading using `#` syntax
  - ✓ Contains exactly 2-3 sentences of prose
  - ✓ UTF-8 encoding, LF line endings
  - ✓ Syntactically valid markdown (CommonMark compliant)
  - ✓ Committed with conventional commit message
  - ✓ Pushed to feature branch feat/053-markdown-test-file-dda1ae
