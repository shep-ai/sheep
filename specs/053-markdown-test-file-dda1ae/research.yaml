  **Step 3: Validate Structure**
  - Verify file contains exactly one h1 heading using `#` syntax
  - Verify file contains exactly 2-3 sentences (simple check: count periods)
  - Optionally run through CommonMark parser to ensure specification compliance

  **Step 4: Git Commit and Push**
