content: |
  ## Problem Statement

  Create a single markdown file named `test-aygmjm.md` at the repository root containing a markdown h1 title and 2-3 sentences describing any topic. This feature is part of the Sheep agentic platform test suite and continues an established pattern of lightweight markdown content files used to validate the system's ability to perform simple, well-defined implementation tasks.

  ## Success Criteria

  - [ ] File created at repository root with exact filename `test-aygmjm.md`
  - [ ] File contains a valid markdown h1 heading (format: `# Title`)
  - [ ] File contains 2-3 sentences of prose describing a topic
  - [ ] Content is syntactically valid markdown
  - [ ] File uses UTF-8 text encoding
  - [ ] Changes committed to git with a conventional commit message (e.g., `feat(053): Create markdown test file`)
  - [ ] Changes pushed to feature branch `feat/053-markdown-test-file-dda1ae` on remote repository
  - [ ] No modifications made to existing files (purely additive feature)

  ## Functional Requirements

  - **FR-1**: The markdown file must be created with the exact filename `test-aygmjm.md`
  - **FR-2**: File must be placed in the repository root directory (alongside existing test files like test-sf7prc.md, test-cxrhpd.md, test-lo8q71.md, etc.)
  - **FR-3**: File must begin with a valid markdown h1 heading using `#` syntax (e.g., `# Title Here`)
  - **FR-4**: File must contain 2-3 sentences of prose describing any topic chosen by the implementation
  - **FR-5**: Markdown content must be syntactically valid and render correctly in standard markdown parsers
  - **FR-6**: Changes must be committed to git with a conventional commit message following the project's commit message standard
  - **FR-7**: Committed changes must be pushed to the remote repository on the feature branch `feat/053-markdown-test-file-dda1ae`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 text encoding (standard for all repository markdown files)
  - **NFR-2**: Markdown formatting must adhere to the CommonMark specification for valid h1 headings and prose
  - **NFR-3**: File should follow the established format convention used in related features (#047, #050, #051, #052): single h1 heading followed by 2-3 sentences of prose with no additional sections or complex formatting
  - **NFR-4**: Implementation should complete within the S (Small) size estimate of approximately 20 minutes total effort
  - **NFR-5**: No breaking changes to existing codebase; feature is purely additive with no impacts to src/, tests/, or configuration directories

