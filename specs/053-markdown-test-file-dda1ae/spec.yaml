content: |
  ## Problem Statement

  Create a single markdown file named `test-aygmjm.md` at the repository root containing a markdown h1 title and 2-3 sentences describing any topic. This feature is part of the Sheep agentic platform test suite and continues an established pattern of lightweight markdown content files used to validate the system's ability to perform simple, well-defined implementation tasks.

  The file must follow the exact format established in recent features (#047, #050, #051, #052): a single h1 heading (markdown syntax: `# Title`) followed immediately by 2-3 sentences of prose. No additional sections, complex formatting, or special styling is required.

  ## Success Criteria

  - [ ] File created at repository root with exact filename `test-aygmjm.md`
  - [ ] File contains a valid markdown h1 heading using `#` syntax (e.g., `# Title`)
  - [ ] File contains 2-3 sentences of prose describing a topic
  - [ ] Content is syntactically valid markdown that renders correctly in standard parsers
  - [ ] File uses UTF-8 text encoding
  - [ ] Changes committed to git with a conventional commit message following project standards
  - [ ] Changes pushed to feature branch `feat/053-markdown-test-file-dda1ae` on remote repository
  - [ ] No modifications to existing files; feature is purely additive

  ## Functional Requirements

  - **FR-1**: File must be created with exact filename `test-aygmjm.md` at the repository root directory
  - **FR-2**: File must contain a valid markdown h1 heading using the `#` syntax (format: `# Title Here`)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content describing any topic
  - **FR-4**: Markdown content must be syntactically valid and render correctly in CommonMark-compliant markdown parsers
  - **FR-5**: Changes must be committed using git with a conventional commit message (format: `feat(053): [description]`)
  - **FR-6**: Committed changes must be pushed to the remote repository on feature branch `feat/053-markdown-test-file-dda1ae`
  - **FR-7**: No existing files may be modified; implementation must be purely additive

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 text encoding (standard for all repository markdown files)
  - **NFR-2**: Markdown formatting must adhere to CommonMark specification for h1 headings and plain-text prose
  - **NFR-3**: File structure must match established convention: single h1 heading immediately followed by 2-3 sentences with no additional sections, subsections, or complex formatting
  - **NFR-4**: Implementation must complete within the S (Small) size estimate of approximately 20 minutes total effort
  - **NFR-5**: Feature is purely additive with no impact to source code (`src/`), test files (`tests/`), build configuration (`pyproject.toml`), or CI/CD workflows (`.github/`)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New markdown file will be created at root level, following the established `test-{code}.md` naming pattern alongside 50+ existing test files |
  | Specs directory | None | Feature specification updated; no changes to other specs or configurations |
  | Source code (`src/sheep/`) | None | No Python code, platform logic, or module changes affected |
  | Tests (`tests/`) | None | No test files created, modified, or deleted; this is a content-only feature |
  | CI/CD (`.github/`) | None | No workflow or automation changes required; standard git workflow applies |
  | Build system (`pyproject.toml`) | None | No dependencies, configuration, or build settings modified |

  ## Dependencies

  None identified. This feature has no dependencies on:
  - Existing Python code or libraries
  - Infrastructure or configuration changes
  - External APIs or services
  - Build system integration
  - Test framework coordination
  - Other features

  This is a completely standalone task of creating a single static markdown file and committing it to git.

  ## Size Estimate

  **S** — Small. This is a minimal-effort, single-file creation feature with straightforward requirements, following the identical pattern of recently completed features #047, #050, #051, and #052:

  Implementation breakdown:
  - Topic selection and planning: ~5 minutes
  - Writing markdown file with h1 title and 2-3 sentences of prose: ~10 minutes
  - Git commit and push operations: ~5 minutes
  - **Total estimated effort**: ~20 minutes (well within the 30-minute threshold for S tier)

  Justification:
  - Established pattern with multiple recent, identical precedents (features #047, #050, #051, #052) providing clear implementation guidance
  - Flexible topic selection with no research, architectural decisions, or complex reasoning required
  - Single file creation with minimal, well-understood content format (one h1 heading + prose)
  - No testing framework integration, CI/CD changes, documentation updates, or code analysis required
  - No modifications to existing files—purely additive change
  - Repository already contains 50+ similar files validating the pattern and file location conventions
