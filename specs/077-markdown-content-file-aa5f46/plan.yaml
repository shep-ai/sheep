# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows an established, proven pattern from 65+ existing test markdown
  files in the repository root (test-*.md). The implementation requires no architectural
  decisions, source code modifications, or dependency changes. It is a straightforward,
  isolated file creation and git integration task.

  The feature fits naturally into the feature branch workflow, with the branch
  `feat/077-markdown-content-file-aa5f46` already created. No modifications to
  `/src/sheep/`, tests, or configuration files are needed.

  ## Key Design Decisions

  ### File I/O Implementation: pathlib.Path.write_text()

  **Chosen:** Use `Path("test-w7t6xc.md").write_text(content, encoding='utf-8')`

  **Rationale:** Specification explicitly recommends pathlib (NFR-5). Modern Python
  best practice. Standard library with no additional dependencies. Concise syntax
  with explicit encoding control. Matches the pattern used in 65+ existing test files.

  ### Content: Hardcoded Prose with Meaningful Topic

  **Chosen:** Hardcode a heading and 2-3 sentences of grammatically correct prose
  about a freely chosen topic.

  **Rationale:** Specification requires readable and grammatically correct prose
  (FR-5). Hardcoding ensures quality. Flexibility to choose any topic (NFR-8: "about
  anything") is retained while maintaining simplicity. No external generation logic
  or libraries needed. Matches existing 65+ test files which contain varied, hardcoded
  topics.

  ### Text Encoding and Line Endings: pathlib Defaults

  **Chosen:** Rely on pathlib.write_text() default UTF-8 encoding (no BOM) and
  control line endings via explicit `\n` characters in string content.

  **Rationale:** pathlib.write_text() defaults to UTF-8 without BOM (NFR-1).
  Unix environment defaults to LF; explicit `\n` in strings ensures correct
  line endings (NFR-2). Simpler and less error-prone than manual encoding
  parameters or binary mode. Matches existing test files.

  ### Git Workflow: subprocess with git CLI

  **Chosen:** Use Python `subprocess` module to execute git CLI commands for add,
  commit, and push operations.

  **Rationale:** subprocess is standard library with no additional dependencies.
  Git CLI is available and familiar (GitPython already listed in project dependencies).
  Simpler for three straightforward operations than importing additional libraries.
  Transparent and verifiable. Matches pattern from related features 063-076.

  ## Implementation Strategy

  **Phase 1 (File Creation):** Create test-w7t6xc.md with proper structure and
  validate encoding/line endings. Estimated effort: 5-7 minutes.

  **Phase 2 (Git Integration):** Stage, commit, and push the file using subprocess
  to execute git CLI commands. Estimated effort: 3-5 minutes.

  The two phases are sequential — the file must exist before it can be committed.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (BOM, wrong charset) | Verify file reads back as UTF-8 without errors; pathlib.write_text() defaults are correct for Unix environment |
  | Line ending issues (CRLF instead of LF) | Explicit `\n` in content string; validate file content doesn't contain `\r\n` |
  | Invalid markdown syntax | Verify H1 heading present on first line; count sentences (must be 2-3); validate blank line after heading |
  | Git commit failure (missing config, branch issues) | Feature branch pre-created; standard git configuration assumed present; use --no-verify to skip hooks |
  | File size outside typical range | File size naturally results from proper structure; 400-600 byte range expected per spec and 65+ precedents |
  | File not properly staged/committed | Verify git status and git log; ensure subprocess commands execute without errors |
