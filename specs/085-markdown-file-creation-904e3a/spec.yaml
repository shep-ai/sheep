# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-lwosg1.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 65+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 063-084, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-lwosg1.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] File size is between 320-600 bytes (observed range for this pattern)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-lwosg1.md`)
  - [ ] Git commit exists on the current branch with message: `feat(085): create markdown file test-lwosg1.md with prose content`
  - [ ] Commit is on the feature branch `feat/085-markdown-file-creation-904e3a`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-lwosg1.md` in the repository root directory using standard file I/O operations (e.g., Python pathlib)
  - **FR-2**: File must contain exactly one H1 markdown heading (`# Title`) as the prose heading
  - **FR-3**: File must contain exactly 2-3 sentences of prose content following the heading, separated by one blank line
  - **FR-4**: Prose content must be grammatically correct, coherent, and naturally readable
  - **FR-5**: File must be staged in git using `git add test-lwosg1.md`
  - **FR-6**: File must be committed with the conventional commit message: `feat(085): create markdown file test-lwosg1.md with prose content`
  - **FR-7**: Commit must be made to the feature branch `feat/085-markdown-file-creation-904e3a` (branch must already exist)
  - **FR-8**: Changes must be pushed to remote origin using `git push` (commits are pushed to the feature branch, not main)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (byte order mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not CRLF or CR
  - **NFR-3**: File size must be within the observed range of 320-600 bytes (consistent with established test files)
  - **NFR-4**: Implementation must follow the established file creation pattern from features 063-084 (simple, imperative approach with no external dependencies beyond Python standard library)
  - **NFR-5**: No modifications to source code, tests, configuration files, or existing markdown files—only file creation
  - **NFR-6**: Implementation must be completable in approximately 10-15 minutes (size estimate: S)
  - **NFR-7**: Topic selection must be flexible and not constrained to specific domains (can be about any topic per user query)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | --------- | --------- |
  | 1 | What approach should be used for selecting the prose content topic? | **Generic/universal topic** | Flexible, requires no domain expertise, consistent with established pattern of 65+ diverse test files, aligns with "about anything" user requirement |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 65+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code with modular organization (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/085-markdown-file-creation-904e3a/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **.env.example / .env**: Environment configuration for API keys and settings
  - **README.md**: Project documentation for the CrewAI-based automation platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as simple, repeatable test
  cases for the Sheep automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (65+ precedents):
  - Simple file creation using Python pathlib for I/O operations (e.g., `Path("test-lwosg1.md").write_text()`)
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 320-600 bytes (observed range across existing test files)
  - Implementation follows straightforward imperative code (create content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/085-markdown-file-creation-904e3a`
  - Create/modify files at repository root
  - Stage with `git add test-lwosg1.md`
  - Commit with conventional commit format: `feat(085): create markdown file test-lwosg1.md with prose content`
  - Push to feature branch using `git push`
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 063-084):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Consistent topic diversity across files (no specific subject requirement)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); supports 3.11 and 3.12
  - **pathlib (Python standard library)**: Used for cross-platform file I/O operations
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-lwosg1.md) to existing collection of 65+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-084; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |

  ## Dependencies

  - **Git repository**: Feature branch `feat/085-markdown-file-creation-904e3a` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 65+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 320-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 65+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (063-084) demonstrate efficient implementation of identical features in 10-15 minutes

