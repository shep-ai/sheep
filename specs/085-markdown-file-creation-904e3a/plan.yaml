# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-18
  - **Status:** Ready for implementation — all technical decisions documented, pattern precedents established

  ## Architecture Overview

  This feature is a minimal, isolated file creation task with no architectural complexity:

  - **No application logic**: Feature is pure file I/O (create markdown file in repository root)
  - **No integration needed**: Standalone operation with zero dependencies on /src/sheep/ source code
  - **No state management**: Stateless single operation (write file, stage in git, commit, push)
  - **Established pattern**: 65+ identical test files in repository provide clear precedent for content format, encoding, and size

  The feature fits the test/validation pattern observed in features 063-084. This is a simple,
  repeatable unit of work for the Sheep automated implementation system.

  ## Key Design Decisions

  ### 1. File I/O Implementation: Python pathlib.Path.write_text()

  **Chosen approach**: Use `pathlib.Path.write_text(content, encoding='utf-8')`

  **Why this approach:**
  - pathlib is the modern Python standard library approach (3.4+, project uses 3.11+)
  - Automatic UTF-8 encoding by default (explicit parameter ensures compliance)
  - Cross-platform path handling without manual path joining
  - Atomic, safe file creation without manual resource management
  - No external dependencies beyond Python stdlib
  - Verified pattern across 65+ existing test files in repository

  **Alternatives considered and rejected:**
  - `os.path + open()`: More verbose, requires manual file handle management, less Pythonic
  - Third-party libraries (plumbum, pathspec): Unnecessary external dependencies
  - Direct shell invocation: Less portable, less reliable than stdlib

  ### 2. Content Generation: Hardcoded Generic/Universal Topic

  **Chosen approach**: Hardcode prose content with generic/universal topic (no domain expertise required)

  **Why this approach:**
  - Feature spec explicitly permits "about anything" (user query: "about anything")
  - Spec resolves topic selection question with recommendation: "Generic/universal topic"
  - Analysis of 65+ test files shows diverse, hardcoded topics with no procedural generation
  - Hardcoded content is deterministic, simple, and consistent with established pattern
  - Avoids unnecessary complexity of templates, randomization, or parameterization

  **Alternatives considered and rejected:**
  - Template-based generation: Adds complexity without benefit for one-off file
  - Procedural/random content: Unnecessary complexity; established pattern uses fixed content
  - Parameterized content: Overengineering; feature does not require configurability

  **Topic selection**: "The Power of Reading" (generic, universal, requires no domain expertise,
  grammatically sound, appropriate for markdown prose context)

  ### 3. Git Workflow: Standard Bash Commands

  **Chosen approach**: Direct bash/shell commands via standard git CLI (git add, git commit, git push)

  **Why this approach:**
  - Three simple, standard operations with no complex orchestration needed
  - Direct commands are clearer than library abstraction for minimal operation set
  - No external Python dependencies (GitPython would add unnecessary abstraction)
  - Established pattern in related features (082-084) confirms direct bash approach
  - Standard commands are reliable and well-understood

  **Alternatives considered and rejected:**
  - GitPython library: Unnecessary external dependency; simple operations don't justify library
  - Shell script wrapper: Over-complication; direct commands are clearer
  - Git plumbing: Low-level and error-prone; standard porcelain commands are appropriate

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Format Validation)** comes first because:
  - Establishes the core artifact (test-lwosg1.md) that will be committed in Phase 2
  - Allows verification of file format (encoding, line endings, size) before git operations
  - Follows logical dependency: file must exist and be correct before staging in git
  - TDD approach: verify content requirements first, then ensure format compliance

  **Phase 2 (Git Integration & Push)** follows because:
  - Depends on Phase 1: file must exist and be validated before git operations
  - Completes the workflow: moves file from local workspace to git history to remote
  - Follows established pattern: create artifact first, then integrate with version control

  ### Execution Approach

  1. **Create file content** using Python pathlib.Path.write_text() with UTF-8 encoding
  2. **Verify format** (encoding, line endings, size match requirements)
  3. **Stage file** with `git add test-lwosg1.md`
  4. **Commit** with conventional message: `feat(085): create markdown file test-lwosg1.md with prose content`
  5. **Push** to feature branch: `git push -u origin feat/085-markdown-file-creation-904e3a`

  All steps follow established patterns from features 063-084.

  ## Risk Mitigation

  | Risk | Impact | Likelihood | Mitigation |
  | ---- | ------ | ---------- | ---------- |
  | File already exists (overwrite risk) | Medium | Very Low | test-lwosg1.md is unique filename; 65+ test files show no naming conflicts in established pattern |
  | File encoding mismatch | Low | Very Low | pathlib defaults to UTF-8; explicit encoding parameter ensures compliance |
  | Incorrect line endings (CRLF vs LF) | Low | Very Low | Python's pathlib on Unix uses LF by default; cross-platform compliance ensured with explicit newline handling |
  | Git push fails | Medium | Very Low | Feature branch pre-created; standard git config expected in environment; no merge conflicts expected |
  | File size out of range (320-600 bytes) | Low | Low | Hardcoded content tested against precedents; typical size ~350-400 bytes |
  | Disk full or permissions denied | Medium | Very Low | Write access to repo root established by prior features (063-084); file size negligible (~400 bytes) |

  ## Success Criteria for Completion

  Implementation is complete when all success criteria from feature spec are met:
  - ✓ File test-lwosg1.md exists in repository root
  - ✓ File contains exactly one H1 heading
  - ✓ File contains exactly 2-3 sentences of prose (separated by blank line)
  - ✓ UTF-8 encoding without BOM
  - ✓ Unix-style LF line endings
  - ✓ File size 320-600 bytes
  - ✓ File staged in git (`git add test-lwosg1.md`)
  - ✓ Commit with conventional message on feature branch
  - ✓ Changes pushed to remote origin

  ## Implementation Timeline

  - **Phase 1 (File Creation & Validation)**: ~8 minutes (file creation + format verification)
  - **Phase 2 (Git Integration)**: ~3 minutes (stage, commit, push)
  - **Total estimated effort**: ~11 minutes (aligns with size estimate: S)

