content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-28
  - **Status:** Complete — all technical decisions resolved

  ## Problem Recap

  Feature 247 requires creation of a single markdown file (test-440dhk.md) at repository root with:
  - Exactly one H1 markdown heading
  - Exactly 2-3 complete sentences of prose content
  - UTF-8 encoding without BOM
  - Unix-style LF line endings
  - Standard git workflow (add, commit, push)

  This feature follows an established pattern replicated 90+ times in the repository (test-*.md files)
  and continues the pattern from recent features 242-246.

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python pathlib.Path.write_text() with encoding='utf-8'

  **Rejected:**
  - Direct open() function — verbose boilerplate, manual encoding specification
  - os module functions — lower-level, requires explicit byte handling
  - Third-party libraries — unnecessary overhead, pathlib sufficient

  **Rationale:** Specification explicitly requires pathlib (NFR-3). The write_text() method provides:
  - Clean, Pythonic API
  - Built-in encoding parameter with UTF-8 default behavior (no BOM added)
  - Cross-platform consistency
  - Automatic file close handling
  - Matches established patterns in 90+ existing test files

  **Implementation Pattern:**
  ```python
  from pathlib import Path

  content = "# Heading\n\nProse sentence 1. Prose sentence 2. Prose sentence 3.\n"
  Path("test-440dhk.md").write_text(content, encoding='utf-8')
  ```

  ### 2. Validation Strategy

  **Chosen:** Basic structural validation (file exists, heading present, 2-3 sentences)

  **Rejected:**
  - No validation — silent failures risk invalid commits
  - Comprehensive validation — over-engineered, requires additional dependencies

  **Rationale:** Validates success criteria without unnecessary complexity:
  - File exists and is readable
  - First non-empty line matches "# <heading>" pattern
  - Prose section contains 2-3 sentence-ending punctuation marks
  - No external dependencies required

  **Validation Approach:**
  - Read file content
  - Split by blank line separator (heading | prose)
  - Check heading line: starts with "# "
  - Count prose sentences: regex pattern matching ".", "!", "?" with optional whitespace
  - Report errors; fail-fast if validation fails

  ### 3. Sentence Detection

  **Chosen:** Regex-based detection of sentence-ending punctuation

  **Rejected:**
  - Newline splitting — unreliable, doesn't detect sentence boundaries
  - NLP parsing (spaCy, NLTK) — external dependency, overkill

  **Rationale:** Simple regex pattern (\\.\\s*[!?.]) is sufficient for typical prose:
  - Matches period, exclamation mark, question mark
  - Handles optional whitespace after punctuation
  - Requires no external dependencies
  - Resilient to common prose variations

  ### 4. Markdown Syntax Validation

  **Chosen:** Simple string-based checks (no markdown parser library)

  **Rejected:**
  - Full markdown parser — unnecessary overhead
  - Complex regex — over-engineered for single-element check

  **Rationale:** H1 validation requires only: line.startswith('# ') on first non-empty line.
  The established pattern is simple:
  1. Heading line (starts with "# ")
  2. Blank line
  3. Prose content

  No markdown parser library needed for this validation.

  ### 5. Line Ending Enforcement

  **Chosen:** Use Python text mode (which preserves '\\n' as LF); validate absence of CRLF

  **Rejected:**
  - Platform defaults (CRLF on Windows) — violates consistency requirement
  - Binary mode byte handling — unnecessary complexity

  **Rationale:** Specification requires Unix LF across all platforms. Python 3 text mode treats
  '\\n' as LF consistently regardless of OS. Post-creation validation (read binary, check for b'\\r\\n')
  provides explicit verification. This approach is:
  - Platform-independent
  - Specification-compliant
  - Requires no platform-specific code

  ### 6. Implementation Architecture

  **Chosen:** Simple imperative script (string → file → validate → git)

  **Rejected:**
  - Class-based abstraction — unnecessary architectural overhead
  - Configuration-driven approach — over-engineered

  **Rationale:** Straightforward imperative pattern mirrors 90+ existing test file implementations:
  - Define prose content (string literal or parameter)
  - Write file via pathlib
  - Validate structure (fail-fast on error)
  - Execute git operations (add, commit, push)

  This approach is transparent, maintainable, and optimal for isolated single-purpose operations.

  ### 7. Git Integration

  **Chosen:** Git CLI via subprocess.run()

  **Rejected:**
  - GitPython library — external dependency
  - os.system() — error-prone, lacks process control

  **Rationale:** subprocess.run() provides:
  - Lightweight, no external dependency
  - Robust error handling via returncode
  - Standard approach used in existing features
  - Straightforward command invocation

  **Git Operations:**
  ```bash
  git add test-440dhk.md
  git commit -m "feat(247): create markdown file test-440dhk.md with prose content"
  git push -u origin HEAD
  ```

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O | Use | Required by spec (NFR-3), standard library, clean API |
  | re (stdlib) | Regex validation | Use | Sentence boundary detection, no external dependencies |
  | subprocess (stdlib) | Git CLI invocation | Use | Subprocess execution, error handling, standard approach |
  | git CLI | Version control | Use | External tool, required for git operations, standard in environment |
  | GitPython | Git library | Reject | Unnecessary external dependency; subprocess sufficient |
  | commonmark | Markdown parsing | Reject | Over-engineered for single-element validation |
  | spaCy/NLTK | NLP parsing | Reject | Overkill for simple sentence counting |

  ## Security Considerations

  **Low Risk Profile:**
  - No external input processing (prose content is developer-authored)
  - No command injection vectors (git commands constructed with fixed arguments)
  - File creation in trusted environment (repository root, developer machine)
  - No authentication, secrets, or sensitive data involved

  **Mitigations:**
  - Git commands use explicit argument lists (subprocess, not shell=True)
  - File encoding explicitly specified (UTF-8) prevents encoding-based exploits
  - Validation ensures file integrity before git commit
  - No imports from /src/sheep/ application code

  **Conclusion:** This feature presents minimal security risk. It is an isolated file creation
  operation with no external dependencies, external input processing, or network operations.

  ## Performance Implications

  **Performance Analysis:**
  - Single file write: ~1-5ms (negligible)
  - File validation: ~1-2ms (read + regex matching)
  - Git operations: ~50-200ms (local operations, dominated by subprocess overhead)
  - **Total time:** ~100-250ms (human-imperceptible)

  **Optimization Observations:**
  - No caching needed (single operation)
  - No I/O parallelization beneficial (single file)
  - No performance constraints from specification
  - Git operations dominate execution time; acceptable cost for version control

  **Conclusion:** Performance is not a constraint. Feature meets soft time estimates (10-15 minutes
  for implementation) due to straightforward requirements and established patterns.

  ## Architecture Integration

  **Codebase Integration Points:**
  - Repository root directory (write test-440dhk.md alongside 90+ existing test-*.md files)
  - Feature branch feat/247-markdown-file-creation-483618 (already created)
  - No dependencies on /src/sheep/ application code
  - No modifications to source, tests, or configuration files
  - Follows git workflow conventions observed in features 242-246

  **Pattern Alignment:**
  - Single-file creation operation matches 90+ existing test files
  - Identical structure, encoding, and line-ending specifications
  - Conventional git commit message format ("feat(247): ...")
  - Isolated from application source code

  **Conclusion:** Feature integrates naturally into existing patterns without requiring architectural
  changes or new abstractions.

  ## Decision Summary

  | Decision | Chosen | Rationale |
  | -------- | ------ | --------- |
  | File I/O | pathlib.Path.write_text() | Spec requirement, clean API, built-in encoding |
  | Validation | Basic structural checks | Catches errors without over-engineering |
  | Sentence detection | Regex matching punctuation | Simple, no dependencies, sufficient |
  | Markdown validation | String prefix check | H1 validation doesn't need parser |
  | Line endings | Python text mode + binary validation | Platform-independent, explicit verification |
  | Architecture | Imperative script pattern | Matches 90+ existing implementations |
  | Git integration | subprocess.run() | Lightweight, standard, no external dependencies |

  ## Risks and Mitigations

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File not created | Low | Validation catches; fail-fast prevents git commit | Validation check for file existence |
  | Encoding mismatch | Low | Binary validation checks for BOM presence | Explicit UTF-8 parameter + binary check |
  | Line ending variation | Low | Validation verifies LF only | Platform-independent text mode + check |
  | Git operation failure | Low | Returns error code; subprocess catches | returncode checking, fail-fast |
  | Invalid markdown syntax | Low | Validation catches; fail-fast | Structural validation before commit |

  ## Conclusion

  Feature 247 requires straightforward file I/O implementation using established patterns. No
  external libraries needed beyond Python standard library (pathlib, re, subprocess) and git CLI.
  Basic structural validation provides practical error detection without unnecessary complexity.
  This feature presents minimal security risk and negligible performance impact.

