content: |
  ## Architecture Overview

  This feature follows the established pattern replicated 90+ times in the repository
  (test-*.md files at repository root). The implementation is a straightforward, imperative
  script that:

  1. **Creates the markdown file** using pathlib.Path.write_text() with explicit UTF-8
     encoding parameter, ensuring platform-independent behavior and no BOM
  2. **Validates structure** with basic checks (file exists, heading format, sentence count)
     using regex and string operations — no external dependencies required
  3. **Executes git workflow** (add, commit, push) via subprocess.run() for robust
     error handling and standard CLI integration

  The architecture mirrors the existing implementation patterns seen in features
  242–246 and all 90+ existing test files. No abstractions, no external libraries,
  no modifications to source code or project configuration.

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Decision:** Use pathlib.Path.write_text(content, encoding='utf-8') for file creation.

  **Alternatives Considered:**
  - Python open() directly — more verbose, requires manual context manager and encoding
  - os module functions — lower-level, requires explicit byte handling
  - Third-party libraries (pathspec, smart_open) — unnecessary overhead

  **Rationale:** The feature spec explicitly requires pathlib (NFR-3). The write_text()
  method provides a clean, Pythonic API with built-in encoding parameter. Python's
  utf-8 codec does NOT add BOM by default, meeting the strict UTF-8 requirement.
  This approach matches established patterns across 90+ existing test files and requires
  no external dependencies.

  ### 2. Validation Scope: Basic Structural Checks

  **Decision:** Validate file existence, heading presence, and prose sentence count.

  **Alternatives Considered:**
  - No validation — risks silent failures (missing file, incomplete content)
  - Comprehensive validation — encoding checks, byte-range constraints, grammar analysis

  **Rationale:** Basic validation catches common structural errors without imposing
  unnecessary complexity. The spec requires these elements, so verifying their presence
  is practical and proportional. Comprehensive validation would require additional
  dependencies (NLP tools, language parsers) without commensurate safety gain for a
  test artifact. This balances error detection with implementation simplicity.

  ### 3. Sentence Detection: Regex-Based Punctuation Matching

  **Decision:** Use regex pattern to count sentence-ending punctuation marks (., !, ?).

  **Alternatives Considered:**
  - Newline-based splitting — unreliable, doesn't detect sentence boundaries
  - NLP parsing (spaCy, NLTK) — unnecessary complexity and external dependency

  **Rationale:** A simple regex pattern (\\.\\s*[!?.]) reliably identifies sentence
  endings in typical English prose without requiring external dependencies. The pattern
  handles periods, exclamation marks, and question marks with optional whitespace
  variations. This is sufficient for straightforward validation and keeps implementation
  minimal.

  ### 4. Markdown H1 Validation: String Prefix Check

  **Decision:** Validate H1 heading with simple string check (line.startswith('# ')).

  **Alternatives Considered:**
  - Full markdown parser library (commonmark, markdown-it) — unnecessary overhead
  - Complex regex for markdown structure — over-engineered for single-element validation

  **Rationale:** The feature requires exactly one H1 heading. The established pattern
  places the heading as the first line, followed by blank line, then prose. This simple
  structure doesn't warrant a markdown parser library. A straightforward prefix check
  is sufficient and introduces no dependencies.

  ### 5. Line Ending Enforcement: Text Mode + Binary Validation

  **Decision:** Use Python text mode (which treats \\n as LF consistently); validate
  created file contains no CRLF bytes (\\r\\n).

  **Alternatives Considered:**
  - Platform-default line endings (CRLF on Windows) — violates consistency requirement
  - Binary mode with explicit byte handling — unnecessary complexity

  **Rationale:** The spec explicitly requires Unix-style LF line endings across all
  platforms (NFR-2) for consistency with 90+ existing test files. Python 3 text mode
  treats \\n as LF on all platforms regardless of OS. Post-creation binary validation
  (checking file does not contain b'\\r\\n') provides explicit verification while
  keeping implementation simple and platform-independent.

  ### 6. Implementation Architecture: Imperative Script Pattern

  **Decision:** Straightforward imperative code: define content → write file → validate
  structure → execute git operations.

  **Alternatives Considered:**
  - Class-based abstraction or factory pattern — unnecessary architectural overhead
  - Configuration-driven approach (YAML/JSON config) — over-engineered

  **Rationale:** The established pattern across 90+ test files and recent features
  (242–246) uses transparent imperative code. Content is defined directly as a string,
  file is written via pathlib, validation runs in sequence, git operations execute
  step-by-step. This approach is transparent, maintainable, and optimal for isolated,
  single-purpose operations. No abstraction layers or configuration management needed.

  ### 7. Git Integration: subprocess.run() CLI

  **Decision:** Invoke git CLI via subprocess.run() for staging, committing, and pushing.

  **Alternatives Considered:**
  - GitPython library — external dependency; subprocess approach sufficient
  - os.system() — error-prone, lacks process control

  **Rationale:** subprocess.run() is lightweight, requires no external dependencies,
  and provides robust error handling via returncode checking. The established pattern
  uses subprocess for git operations, maintaining consistency across the codebase.
  Git CLI is universally available in development environments.

  ### 8. Error Handling: Fail-Fast Approach

  **Decision:** When validation fails (file missing, heading incorrect, sentence count
  wrong), raise exception and skip git operations.

  **Alternatives Considered:**
  - Warn and proceed — allows invalid files to be committed
  - Silent validation — no feedback about errors

  **Rationale:** Fail-fast is appropriate because validation errors indicate structural
  problems that contradict success criteria. Committing invalid files to the repository
  defeats the purpose of validation and makes debugging harder. Fail-fast ensures only
  correct files are committed, maintains data integrity, and provides immediate feedback.

  ## Implementation Strategy

  The implementation follows three sequential phases, each building on the previous:

  **Phase 1 – File Creation & Content Structure:**
  Create test-440dhk.md with proper markdown structure, manually-written prose content,
  UTF-8 encoding, and LF line endings. This establishes the baseline file artifact that
  forms the core deliverable.

  **Phase 2 – Structural Validation & Error Handling:**
  Implement validation logic to verify the file meets structural requirements (heading
  present, 2-3 sentences, proper encoding/line-endings). Fail-fast behavior prevents
  invalid files from being committed.

  **Phase 3 – Git Integration & Completion:**
  Stage, commit, and push the file following the conventional git workflow observed in
  features 242-246. This completes the feature and integrates the artifact into the
  repository history.

  These phases are sequential because each builds on the previous: the file must exist
  before validation can run, and validation must pass before git operations execute.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File not created or empty | Validation checks file existence and reads content; fail-fast prevents invalid commits |
  | Incorrect heading format (missing #, wrong level) | Validation verifies line starts with \"# \"; caught before git operations |
  | Prose sentence count incorrect (0, 1, 4+) | Regex-based validation counts sentence-ending punctuation; fail-fast on mismatch |
  | Encoding not UTF-8 or contains BOM | Binary validation checks for BOM bytes (0xEF 0xBB 0xBF); enforced via pathlib parameter |
  | Line endings are CRLF instead of LF | Binary validation checks file for absent b'\\r\\n' bytes; text mode ensures LF on all platforms |
  | Git command fails (bad config, no branch) | subprocess.run() with returncode checking catches git errors; fail-fast prevents partial commits |
  | File staging succeeds but commit fails | Validation runs before git operations, reducing likelihood of partial failure; fail-fast approach |

  ## Files & Scope

  **Files to Create:** None (test-440dhk.md created as artifact, not checked into specs)

  **Files to Modify:** None (no source code, tests, or configuration modified)

  **Scope:** Single markdown file creation at repository root; isolated from all other
  codebase components. No dependencies on /src/sheep/ or other application code.

