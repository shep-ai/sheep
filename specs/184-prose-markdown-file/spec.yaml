content: |
  ## Problem Statement

  Create a single markdown test file (`test-2cw6g8.md`) at the repository root containing an H1 heading as title and 2-3 sentences of coherent prose content. This feature demonstrates automated file creation, git integration, and conventional commit workflows following the well-established pattern of 180+ preceding test markdown files already present in the repository.

  The feature follows an identical, proven pattern executed 180+ times successfully in features 1-183. All format specifications, naming conventions, git workflows, and content structure are fully validated through precedent. No architectural decisions or research is required.

  ## Codebase Analysis

  ### Project Structure

  **Repository Root Organization:**
  - Repository root contains 155+ test markdown files following pattern `test-*.md`
  - Examples: `test-ir293z.md`, `test-xgtwtq.md`, `test-khrvcn.md`, `test-2cw6g8.md` (target file)
  - Main directories: `src/sheep/`, `specs/`, `tests/`, `.github/`
  - Configuration files: `pyproject.toml`, `.env.example`, `docker-compose.yml`, `Dockerfile`

  **Spec Directory Structure:**
  - `specs/` contains 184 feature specifications as subdirectories
  - Each spec has format: `NNN-feature-name-hash/spec.yaml`
  - Example: `specs/183-markdown-file-creation-14373e/spec.yaml`
  - This spec is located at: `specs/184-prose-markdown-file/spec.yaml`

  **Source Code Structure:**
  - `src/sheep/` contains the main Sheep platform code
  - `src/sheep/agents/` contains agent definitions
  - `src/sheep/flows/` contains flow orchestration (CrewAI-based)
  - `src/sheep/config/` contains configuration management
  - `src/sheep/cli.py` contains CLI entry point

  **Sheep Project Purpose:**
  Sheep is an agentic platform for automated code implementation using CrewAI. It orchestrates Research, Implementation, and Review agents to autonomously handle software development tasks across arbitrary repositories. The platform integrates with multiple LLM providers (OpenAI, Anthropic Claude, Google Gemini) and provides observability via Langfuse integration.

  ### Architecture Patterns

  **Test File Format (155+ existing precedents):**
  - All test markdown files follow identical structure:
    - Line 1: `# Title (H1 Heading)`
    - Line 2: Blank line
    - Lines 3-5: Exactly 2-3 sentences of coherent prose content
    - File size: typically 350-600 bytes
  - Example from `test-ir293z.md`:
    ```markdown
    # The Art of Meaningful Communication

    Effective communication lies at the heart of human connection and collaboration. It enables us to share ideas, build relationships, and drive progress in every aspect of our lives. Through clear and thoughtful dialogue, we create understanding and unlock possibilities for positive change.
    ```

  **File Naming Convention:**
  - Pattern: `test-<6-character-alphanumeric-id>.md`
  - Target filename: `test-2cw6g8.md`

  **Git Workflow Pattern:**
  - File is created in repository root
  - File is staged with `git add <filename>`
  - Commit uses conventional commit format: `feat(###): Create markdown file <filename> with prose content`
  - Changes are pushed to feature branch `feat/###-<feature-name>`

  ### Relevant Technologies

  **File I/O:**
  - Python `pathlib.Path` for cross-platform file operations
  - Standard library, available in Python 3.11+ (no external dependencies)
  - Simple text file write with UTF-8 encoding (Python default)

  **Markdown Format:**
  - Simple CommonMark-compatible format
  - Only requires: H1 heading (`#`) and plain text prose
  - No complex markdown features needed (no lists, code blocks, tables, etc.)

  **Git Integration:**
  - Standard git commands: `git add`, `git commit`, `git push`
  - Feature branch already created: `feat/184-prose-markdown-file`
  - No specialized libraries required

  **Project Infrastructure:**
  - CrewAI-based agentic platform for task automation
  - No source code modifications needed for this feature
  - Feature is pure file creation (no code/logic components)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 155+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-500 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-183; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/184-prose-markdown-file` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 155+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (1-183) demonstrate successful execution of identical pattern
  - Features 181-183 specs provide exact templates and working examples

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose H1 heading + 2-3 coherent sentences of prose)
  - **Validation**: ~2-3 minutes (verify UTF-8 encoding, LF line endings, markdown format, ~400-500 byte size)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message `feat(184): Create markdown file test-2cw6g8.md with prose content`, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 155+ identical test files providing clear precedent
  - No architectural decisions, research, or complex logic required
  - Single file with simple, well-understood format (H1 + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent features (181-183) demonstrate efficient execution in this time range
  - Standard git workflow with no merge conflicts or branch complexity
  - Topic selection is free-form and unconstrained (user query: "about anything")

