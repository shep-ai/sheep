content: |
  ## Summary

  Feature 056 implementation consists of four sequential tasks across two phases:

  **Phase 1: File Creation & Content Validation**
  - Task 1 creates the markdown file with h1 title and 2-3 sentences of prose describing any chosen topic
  - Task 2 validates the file format: UTF-8 encoding, CommonMark compliance, trailing newline, proper spacing

  **Phase 2: Git Integration & Push**
  - Task 3 commits the file to git with a conventional commit message (`feat(056): Create markdown test file`)
  - Task 4 pushes the changes to the remote repository on the feature branch

  Each task builds on the previous one, with phase 2 depending on successful completion of phase 1.
  The implementation follows the established pattern from features #050–#055, which collectively demonstrate
  the correct approach, format, and git workflow for this type of simple, static-content feature.

  ## Task Sequence

  1. **Create the file** (task-1): Choose a topic and write the markdown content with h1 title and prose
  2. **Validate format** (task-2): Ensure encoding, syntax, and structure meet all requirements
  3. **Commit to git** (task-3): Stage and commit with conventional message format
  4. **Push to remote** (task-4): Complete the git workflow by pushing to feature branch

  Total estimated effort: 30 minutes (well within the S tier estimate)
