content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-knejqo.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 85+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-104, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-knejqo.md` is created at the repository root directory
  - [ ] File contains exactly one H1 markdown heading (`#`) on the first line
  - [ ] Heading is followed by exactly one blank line
  - [ ] File contains exactly 2-3 sentences of prose content after the blank line
  - [ ] Prose content is semantically meaningful and grammatically correct
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File is staged in git with `git add test-knejqo.md`
  - [ ] Git commit is created with conventional commit format: `feat(105): create markdown file test-knejqo.md with prose content`
  - [ ] Commit message includes feature number (105)
  - [ ] Commit is pushed to the feature branch `feat/105-markdown-file-creation-763e59`
  - [ ] File size is within 400-600 bytes (natural consequence of content spec)
  - [ ] No modifications to existing files, source code, config, or tests

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-knejqo.md` at the repository root using Python pathlib
  - **FR-2**: The file must contain a markdown H1 heading (single `#` followed by heading text) on the first line
  - **FR-3**: The file must contain exactly one blank line separating the heading from prose content
  - **FR-4**: The file must contain exactly 2-3 sentences of prose content after the blank line
  - **FR-5**: Stage the created file in git using `git add test-knejqo.md`
  - **FR-6**: Create a git commit with conventional commit message format: `feat(105): create markdown file test-knejqo.md with prose content`
  - **FR-7**: Push the commit to the feature branch `feat/105-markdown-file-creation-763e59`
  - **FR-8**: No modifications to existing files, source code directories (/src/sheep/), configuration files, or test suite

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding without BOM (achieved by default via Python's `pathlib.Path.write_text()`)
  - **NFR-2**: File must use LF (Unix) line endings, not CRLF
  - **NFR-3**: File size should be approximately 400-600 bytes (natural result of content specification)
  - **NFR-4**: Prose content must be semantically meaningful and relevant, following the pattern established by 85+ precedent files
  - **NFR-5**: Implementation must use Python pathlib for file I/O operations (no subprocess calls or shell commands)
  - **NFR-6**: Implementation must follow established pattern from features 069-104 (no deviations or enhancements)
  - **NFR-7**: Commit message must be concise and follow conventional commit format exactly
  - **NFR-8**: No external dependencies required beyond Python 3.11+ standard library (pathlib, git CLI)
  - **NFR-9**: Implementation should complete within 15 minutes (10-15 minute estimate for full workflow)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose content be freely chosen or constrained to specific topics? | Free choice of any topic | Spec explicitly states "anything"; 85+ precedent files demonstrate diverse topics; maximizes flexibility and matches established pattern |
  | 2 | Should the implementation include file validation or just create the file? | No validation—create only | Task scope is file creation, not verification; established pattern has no validation step; Python pathlib guarantees UTF-8 encoding without explicit checks |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-knejqo.md) to existing collection of 85+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-104; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/105-markdown-file-creation-763e59` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 85+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of meaningful prose with chosen topic)
  - **Git workflow**: ~5-10 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 85+ identical test files providing clear precedent
  - Topic selection is open-ended ("anything") with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-104) demonstrate efficient implementation of identical features in 10-15 minutes
  - No technical complexity; task is purely file I/O and git workflow

  ---

  _Requirements phase complete — functional/non-functional requirements defined, success criteria specified, product questions resolved with AI recommendations_
