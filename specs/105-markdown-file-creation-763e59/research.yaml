# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-19
  - **Codebase Analysis:** Examined 85+ existing test files (test-*.md) and 4 related features (069, 070, 103, 104)
  - **Pattern Established:** Consistent across all features; feature 070 provides latest comprehensive reference implementation

  ## Technology Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Chosen:** `Path("test-knejqo.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - subprocess echo/cat — subprocess overhead, less reliable encoding control, requires shell interpretation
  - Built-in open() with manual write — more boilerplate, same functionality as pathlib
  - File I/O libraries (aiofiles, etc.) — adds external dependency, unnecessary for synchronous operation

  **Rationale:** This is the established pattern in all 85+ existing test files and features 069-104. Provides explicit UTF-8 encoding and Unix LF line ending control. Available in Python 3.11+ stdlib. Pythonic and handles file closing automatically. Feature 070 confirms this pattern.

  ### 2. Encoding and Line Ending Control

  **Chosen:** Explicit `encoding="utf-8"` and `newline="\n"` parameters

  **Rejected:**
  - Platform default encoding — varies by platform (cp1252 on Windows, UTF-8 on Linux), causes CRLF issues
  - Implicit text mode handling — no control over line ending conversion
  - Post-processing file — adds complexity, error-prone

  **Rationale:** UTF-8 without BOM (NFR-1) and Unix LF line endings (NFR-2) are hard requirements. Python defaults vary by platform. Feature 070 explicitly uses this pattern (`newline="\n"`). All 85+ existing files demonstrate consistent UTF-8+LF, confirming this is the standard.

  ### 3. Prose Content: Hardcoded with Free Topic Selection

  **Chosen:** Hardcoded content with chosen topic (one H1 heading + 2-3 sentences of meaningful prose)

  **Rejected:**
  - Randomly generated content — adds complexity via generation library, harder to validate, spec allows "anything"
  - Content from external file — adds file dependency, violates "no modifications to existing files"
  - User-prompted content — not applicable for automated SHEEP implementation

  **Rationale:** Spec explicitly allows "anything" (requirement resolved to free choice). All 85+ test files use hardcoded prose with diverse topics (persistence, cloud computing, problem solving, etc.). Hardcoded is simpler, deterministic, and faster. Matches feature 070 pattern. Topic selection is unconstrained.

  ### 4. Validation After File Creation

  **Chosen:** Include basic validation function checking structure, encoding, line endings, file size

  **Rejected:**
  - No validation — simpler, but feature 070 shows validation is now the established pattern
  - Extensive validation with checksums — adds unnecessary complexity

  **Rationale:** Feature 070 (latest precedent) includes comprehensive validation. Validates all success criteria: H1 heading, blank line, prose, UTF-8, LF, file size 400-600 bytes. Early error detection. Verification before git operations. Aligns with pattern shift toward robustness.

  ### 5. Git Workflow: subprocess with Individual Commands

  **Chosen:** `subprocess.run()` for three separate commands: `git add`, `git commit`, `git push`

  **Rejected:**
  - Shell script — less reliable, cross-platform issues, more maintenance
  - pygit2/GitPython — adds external dependency, not needed for basic operations
  - os.system() or shell=True — security risk, discouraged

  **Rationale:** Established pattern in create_markdown.py and git_workflow_089.py. Available in Python 3.11+ stdlib. Safe (no shell injection with list form), reliable, cross-platform. Fine-grained error handling. No external dependencies. Feature 070 confirms this approach.

  ### 6. Error Handling: Explicit Try-Catch

  **Chosen:** Explicit error handling: try-catch for file I/O (PermissionError, OSError, UnicodeDecodeError); subprocess check=True for git commands

  **Rejected:**
  - Minimal error handling — harder to debug, no meaningful messages
  - Generic Exception handler — loses specificity
  - Warnings instead of errors — masks failures

  **Rationale:** Feature 070 demonstrates this pattern with specific exception handlers. Explicit error messages aid debugging. Separate handling for file vs git failures. Supports SHEEP's robustness requirements. Matches the more robust pattern from feature 070.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib (stdlib) | File creation and I/O | **Use** | Established pattern in all 85+ files; reliable UTF-8 and LF handling; available in Python 3.11+ stdlib; no external dependency |
  | subprocess (stdlib) | Git command execution | **Use** | Established pattern in features 069-104; safe (no shell injection); cross-platform; available in Python 3.11+ stdlib |
  | os.path (stdlib) | Not needed | **Reject** | pathlib is modern replacement; cleaner API |
  | pygit2 | Direct git operations | **Reject** | External dependency; subprocess is sufficient and already established |
  | GitPython | Direct git operations | **Reject** | External dependency; overkill for add/commit/push operations |
  | aiofiles | Async file I/O | **Reject** | No async requirement; adds dependency; write_text() is sufficient |
  | click/argparse | CLI argument parsing | **Reject** | No CLI arguments needed; hardcoded content and filename |

  ## Security Considerations

  **File Creation Security:**
  - **Safe:** pathlib.Path.write_text() handles file permissions correctly; creates files readable by owner
  - **UTF-8 Encoding:** No security risk; standard text encoding; no injection vectors in markdown content
  - **Line Ending Normalization:** LF vs CRLF is not a security issue; consistency ensures cross-platform behavior

  **Git Operations Security:**
  - **subprocess.run() with list form:** Safe from shell injection when arguments are passed as list (not shell=True)
  - **Commit message format:** Conventional commit format is sanitized; no user input in message (hardcoded with feature number)
  - **No credential handling:** Uses existing git configuration; no credentials hardcoded or passed in arguments
  - **No destructive operations:** Only add, commit, push (non-destructive); no force flags

  **No Special Security Concerns:** Feature creates only a markdown test file. No sensitive data, no authentication, no file permissions issues. Follows principle of least privilege (file creation only).

  ## Performance Implications

  **File Creation Performance:**
  - **pathlib.Path.write_text():** O(n) where n = file size (~500 bytes); sub-millisecond operation on modern systems
  - **Validation overhead:** Reading file once, checking structure/encoding; negligible performance impact
  - **Overall:** Entire feature (create + validate) completes in <100ms; well within spec's 10-15 minute estimate

  **Git Operations Performance:**
  - **git add:** O(1) for single file; milliseconds
  - **git commit:** Writes commit object; milliseconds
  - **git push:** Network latency dependent; typically 1-5 seconds for remote push
  - **Overall:** Git workflow adds 1-5 seconds total; dominated by network latency, not implementation

  **No Scalability Concerns:** Feature operates on single file. No loops, no batch operations. Predictable performance regardless of repository size.

  **No Caching Needed:** One-time operation; no repeated operations that would benefit from caching.

  ## Architecture Notes

  **Integration with SHEEP Platform:**
  - Feature is self-contained; creates one file, no dependencies on other modules or features
  - Follows established pattern from 85+ precedent files; consistent with SHEEP's test file creation framework
  - Pure file I/O and git workflow; no integration with source code, configs, or test suites
  - Spec requirement: "No modifications to existing files, source code, config, or tests" — fully satisfied

  **Pattern Consistency:**
  - Matches feature 070 (latest comprehensive implementation) in all architectural aspects:
    - File creation via pathlib.Path.write_text()
    - Validation function separate from creation
    - subprocess.run() for git operations
    - Explicit error handling with try-catch
  - Consistent with 85+ existing test files in structure (H1 heading, blank line, prose)
  - No deviations from established pattern; no new abstractions or utilities

  **Spec Compliance:**
  - All functional requirements (FR-1 through FR-8) are satisfied by chosen approaches
  - All non-functional requirements (NFR-1 through NFR-9) are satisfied by chosen approaches
  - Success criteria are verifiable through validation function
  - Implementation approach matches recent precedent (features 103, 104, 070)

  ## Implementation Approach (Summary)

  1. **Create markdown file** using `Path("test-knejqo.md").write_text(content, encoding="utf-8", newline="\n")`
     - Content: H1 heading + blank line + 2-3 sentences of chosen topic
     - Encoding: UTF-8 without BOM (explicit parameter)
     - Line endings: Unix LF (explicit newline="\n" parameter)

  2. **Validate file** with separate validation function checking:
     - File exists and is readable
     - File size 400-600 bytes (guideline)
     - Content structure: H1 heading on line 1, blank line on line 2, prose on lines 3+
     - UTF-8 encoding verified by successful read
     - Unix LF line endings (no CRLF)

  3. **Stage file** with `subprocess.run(["git", "add", "test-knejqo.md"], check=True)`

  4. **Commit with conventional message** using `subprocess.run(["git", "commit", "-m", "feat(105): create markdown file test-knejqo.md with prose content"], check=True)`

  5. **Push to remote** with `subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)`

  **Error Handling:** Explicit try-catch blocks for file I/O and subprocess operations; meaningful error messages for debugging.

  **Dependencies:** Python 3.11+ stdlib only (pathlib, subprocess); no external packages required.

  **Estimated Effort:** 10-15 minutes total (5 min file creation, 5-10 min git workflow), matching spec estimate.

