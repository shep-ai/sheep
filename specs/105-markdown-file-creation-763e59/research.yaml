      external dependencies; (5) It's Pythonic, concise, and handles file closing automatically; (6) Features 070
      and later implementations confirm this is the established pattern.

  - title: "Encoding and Line Ending Handling"
    chosen: "Explicit encoding=\"utf-8\" and newline=\"\\n\" parameters to Path.write_text()"
