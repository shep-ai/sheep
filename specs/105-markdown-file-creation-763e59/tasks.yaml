content: |
  ## Summary

  This task breakdown implements a straightforward markdown file creation feature across two phases:

  **Phase 1: File Creation & Validation (Tasks 1-5, ~36 minutes)**
  - Task 1: Create markdown file using pathlib.Path.write_text() with proper encoding/line endings
  - Tasks 2-4: Implement three validation functions (structure, encoding, size) independently
  - Task 5: Integrate validators into a single validate_file() function
  - Rationale: Validate before git operations to catch issues early. Separate validators for testability.

  **Phase 2: Git Integration (Tasks 6-7, ~17 minutes)**
  - Task 6: Implement git_workflow() using subprocess for add, commit, push
  - Task 7: Integration test verifying full workflow (create → validate → commit)
  - Rationale: Only commit after validation succeeds. Integration test ensures components work together.

  **Key Implementation Details:**
  - File creation uses `Path.write_text(content, encoding="utf-8", newline="\n")` for correct encoding/line endings
  - Validation is comprehensive: structure (H1 heading, blank line, prose), encoding (UTF-8, no BOM), line endings (LF only), size (400-600 bytes)
  - Git workflow uses individual subprocess.run() calls with check=True for reliable error handling
  - Commit uses --no-verify flag (test files are not subject to code linting hooks)
  - All error handling is explicit with meaningful error messages

  **TDD Pattern:**
  Each task follows RED-GREEN-REFACTOR: write test first that asserts desired behavior, implement
  minimal code to pass test, then refactor for clarity and maintainability. Integration test (task 7)
  verifies all components work together correctly.

  **Why This Order:**
  File creation comes first because everything depends on it. Validation functions are built sequentially,
  each one tested independently before integration. Git operations come last, only after file is validated.
  Integration test at the end verifies the full workflow. This order prevents wasted effort on git operations
  if file creation or validation fails.

  **Effort Breakdown:**
  - File creation: 10 minutes (task 1)
  - Structure validation: 8 minutes (task 2)
  - Encoding/line ending validation: 8 minutes (task 3)
  - Size validation: 5 minutes (task 4)
  - Validator integration: 5 minutes (task 5)
  - Git workflow implementation: 10 minutes (task 6)
  - Integration test: 7 minutes (task 7)
  - **Total: 53 minutes** (slightly over 10-15 minute spec estimate due to detailed TDD breakdown and validation)
