# Structured technology decisions
decisions:
  - title: 'File Creation Method'
    chosen: 'Python pathlib.Path.write_text() with explicit UTF-8 encoding'
    rejected:
      - 'open() context manager — More boilerplate code, less modern, pathlib is the standard Python 3.11+ approach'
      - 'Binary mode write with explicit \n — Unnecessary complexity, error-prone, pathlib handles text mode correctly'
      - 'os.path + open() — Less cross-platform, less idiomatic in modern Python'
    rationale: >
      Feature spec explicitly requires FR-4: "create markdown file using standard Python pathlib methods:
      Path('test-rgxk86.md').write_text(content)". Pathlib is the modern standard for file I/O in Python 3.11+,
      available in the standard library (no external dependencies), and handles text encoding transparently.
      UTF-8 is Python's default text mode encoding; write_text() with encoding="utf-8" ensures explicit,
      cross-platform consistency. All 92+ prior features use this same approach successfully.

  - title: 'Line Ending Handling'
    chosen: 'Python text mode with platform-native line endings, validated to be LF (\n) on Linux'
    rejected:
      - 'Binary mode with manual \n insertion — Adds complexity, error-prone, defeats purpose of text mode'
      - 'os.linesep — Platform-dependent, violates spec requirement for \n specifically (not CRLF)'
    rationale: >
      Python's text mode (default for write_text()) correctly handles line endings: on Linux/Unix, it writes
      LF (\n) directly; on Windows, it converts to CRLF if git core.safecrlf is not set, but git auto-converts
      back to LF on commit. Spec requires "\n only, not CRLF" (NFR-4), which is satisfied on Linux. Success
      criteria test with "file test-rgxk86.md returns UTF-8", not explicitly checking CRLF. On Linux execution
      environment, write_text() produces correct \n line endings. All 92+ prior features confirm this works.

  - title: 'Character Encoding'
    chosen: 'UTF-8 without BOM (Python default)'
    rejected:
      - 'ASCII — Too restrictive, UTF-8 is the standard modern choice'
      - 'UTF-8 with BOM — Spec explicitly requires "UTF-8 without byte order mark" (NFR-3)'
      - 'UTF-16 — Overkill for simple text, not standard for markdown files'
    rationale: >
      Spec explicitly requires "UTF-8 without byte order mark" (NFR-3). Python's write_text() defaults to
      UTF-8 without BOM on all platforms. UTF-8 is the universal standard for web and text files, supported
      by all markdown processors, and established across all 92+ prior test files. No BOM adds 0 bytes to file
      size, making validation simpler. Using encoding="utf-8" in write_text() call ensures explicit consistency.

  - title: 'Markdown Content Format'
    chosen: 'H1 heading on first line, blank line, then 2-3 sentences of prose (established pattern)'
    rejected:
      - 'External markdown parser library — Unnecessary for simple validation, adds dependency, overkill'
      - 'Markdown validation via regex — Error-prone, manual validation better for simple format'
      - 'Other heading levels (H2, H3) — Spec explicitly requires "exactly one H1 markdown heading" (FR-2)'
    rationale: >
      Format is fully specified in feature spec and established across 92+ prior implementations. Simple format
      requires no external parsing: H1 is `#` followed by space, heading text, newline; blank line is `\n\n`;
      prose is plain text. No markdown-specific parsing library (like python-markdown or mistune) is needed
      because the format is so simple that basic text validation suffices. Validation can be done with simple
      string/byte checks. All markdown processors accept this format without warnings (NFR-1). Success criteria
      test file size (320-600 bytes), not markdown parser output, so no library required.

  - title: 'Prose Content Generation'
    chosen: 'Manual composition of 2-3 sentences on a universal topic (e.g., "The Value of Continuous Learning")'
    rejected:
      - 'LLM-based generation (via Claude API or other) — Adds external dependency, non-deterministic, overengineered'
      - 'Template-based generation — Reduces flexibility, prose sounds robotic, less natural'
      - 'Random/procedural text generation — Adds complexity, no clear benefit, prior features use manual approach'
    rationale: >
      Spec allows "Prose topic can be any appropriate subject" (NFR-9) and recommends "generic/universal topics
      preferred". Manual composition is: (1) simple, requiring no external libraries or API calls; (2) proven
      across 92+ prior features; (3) flexible — any grammatically correct, coherent topic works; (4) predictable
      — full control over content quality. Example topics from prior features: "The Power of Incremental Progress",
      "The Art of Problem Solving", "The Value of Continuous Learning". 2-3 sentences typically yields 320-455
      bytes (confirmed by examining test-0qakgw.md: 455 bytes with 3 sentences; test-3kyco5.md: 320 bytes with 2
      sentences). No LLM or complex generation needed; human-written prose is clearer, faster, and fully predictable.

  - title: 'Git Operations Implementation'
    chosen: 'Shell commands (git add, git commit, git push) via subprocess or Bash'
    rejected:
      - 'GitPython library — Already in project dependencies (gitpython>=3.1.0), but adds unnecessary abstraction for simple operations'
      - 'Direct git operations only (no staging/commit) — Fails FR-5 (stage file) and FR-6 (commit with conventional message)'
      - 'Manual git plumbing (low-level git objects) — Overengineered, error-prone, no benefit'
    rationale: >
      Spec requires three explicit git operations (FR-5, FR-6, FR-7): (1) `git add test-rgxk86.md`, (2) `git commit`
      with conventional message, (3) `git push`. While GitPython is available in dependencies, shell commands are simpler,
      more transparent, and match the established pattern across 92+ prior features (confirmed by git log showing commits
      from features 069-092). Shell commands make intent clear and are easier to debug. GitPython would add a layer of
      abstraction with no operational benefit for such simple operations. Standard approach: use Bash or subprocess.run()
      with git command strings.

  - title: 'Commit Message Format'
    chosen: 'Conventional Commits format: feat(093): create markdown file test-rgxk86.md with prose content'
    rejected:
      - 'Free-form commit message — Violates spec requirement for "conventional format" (FR-6)'
      - 'Alternative conventional format (fix, docs, refactor) — Feature creates new file, "feat" is correct type'
    rationale: >
      Spec explicitly requires "Commit message follows conventional format: `feat(093): create markdown file
      test-rgxk86.md with prose content`" (success criteria). Conventional Commits (https://www.conventionalcommits.org/)
      is the standard; "feat" indicates a new feature (file creation is a new addition). Number 093 in parentheses
      follows established convention across prior features (verified in git log: "feat(092):", "feat(091):", etc.).
      Message should be descriptive ("create markdown file {filename} with prose content") to clarify intent.

  - title: 'Topic Selection Strategy'
    chosen: 'Choose flexible, generic/universal topic not tied to project specifics'
    rejected:
      - 'Project-specific topics (e.g., "Sheep Platform Architecture") — Reduces reusability, ties test file to current context'
      - 'Random topic generation — Adds complexity without clear benefit, prior features use manual selection'
    rationale: >
      Spec states "Prose topic can be any appropriate subject (generic/universal topics are preferred)" (NFR-9).
      Prior features use varied, universal topics: "The Power of Incremental Progress", "The Art of Problem Solving",
      "The Value of Continuous Learning", "The Importance of Clear Communication". These topics are: (1) broadly
      applicable, (2) not tied to the Sheep project specifically, (3) appropriate in tone, (4) grammatically standard.
      Universal topics make the test file more timeless and reusable. No complex selection logic needed; pick an
      appropriate topic from common philosophical/practical subjects, write 2-3 coherent sentences, ensure grammatical
      correctness.

