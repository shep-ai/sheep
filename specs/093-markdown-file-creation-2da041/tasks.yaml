# Markdown content (the full tasks document)
content: |
  ## Summary

  This task breakdown implements feature 093-markdown-file-creation-2da041 across 5 concrete tasks
  in 2 phases:

  **Phase 1 — File Creation & Validation** (13 minutes):
  1. Determine prose topic and create markdown file with H1 heading and 2-3 sentences
  2. Validate file meets all technical requirements (encoding, line endings, size, syntax)

  **Phase 2 — Git Integration** (3-4 minutes):
  3. Stage file with `git add`
  4. Commit with conventional commit message format
  5. Push to feature branch

  The implementation follows the TDD cycle where applicable: file creation tasks (1-2) include
  RED-GREEN-REFACTOR cycles to ensure test-driven validation; git operations (3-5) are shell
  commands and use `tdd: null` since they're not code artifacts to be tested.

  **Total Estimated Effort**: 12-17 minutes (aligns with feature spec estimate of 10-15 minutes)

  ## Task Dependencies

  ```
  task-1 (File Creation)
    ↓
  task-2 (File Validation)
    ↓
  task-3 (git add)
    ↓
  task-4 (git commit)
    ↓
  task-5 (git push)
  ```

  All tasks must be completed in order. No parallel work possible; each task depends on completion
  of the previous task.

  ## Implementation Notes

  ### Prose Topic Selection (Task 1)
  Choose a universal, non-project-specific topic. Examples from prior features:
  - "The Value of Continuous Learning"
  - "The Power of Incremental Progress"
  - "The Art of Problem Solving"
  - "Building Better Habits"
  - "The Importance of Clear Communication"
  - "Effective Collaboration"
  - "The Nature of Change"
  - "Resilience Through Adversity"

  Write 2-3 grammatically correct, coherent sentences. Target ~320-455 bytes (confirmed by examining
  prior test files: test-0qakgw.md: 455 bytes with 3 sentences; test-3kyco5.md: 320 bytes with 2 sentences).

  ### File Creation (Task 1)
  Use Python standard library pathlib:
  ```python
  from pathlib import Path
  content = "# <Heading>\n\n<2-3 sentences of prose>"
  Path("test-rgxk86.md").write_text(content, encoding="utf-8")
  ```

  ### File Validation (Task 2)
  Validate using Python and shell commands:
  - Encoding: `file test-rgxk86.md` should show "UTF-8 Unicode"
  - Line endings: `od -c test-rgxk86.md` should show only `\n`, not `\r\n`
  - File size: `wc -c test-rgxk86.md` should be 320-600 bytes
  - Markdown syntax: manual review (simple format: H1 + blank line + prose)
  - Prose quality: manual review (grammar, coherence, tone)

  ### Git Operations (Tasks 3-5)
  Three standard git operations:
  1. Stage: `git add test-rgxk86.md`
  2. Commit: `git commit -m "feat(093): create markdown file test-rgxk86.md with prose content"`
  3. Push: `git push -u origin HEAD` (or `git push` if tracking already set)

  Verify each step:
  - After task 3: `git status` shows file staged
  - After task 4: `git log --oneline` shows commit
  - After task 5: Remote branch contains commit (testable with `git log origin/feat/093-markdown-file-creation-2da041`)

  ## Success Criteria Checklist

  All success criteria from feature spec must be satisfied at feature completion:
  - [ ] File `test-rgxk86.md` exists at repository root
  - [ ] File contains exactly one H1 markdown heading
  - [ ] File contains exactly 2-3 sentences of prose after heading (separated by blank line)
  - [ ] Markdown syntax is valid
  - [ ] Prose is grammatically correct and coherent
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix-style line endings (LF only)
  - [ ] File size is 320-600 bytes
  - [ ] File is staged in git
  - [ ] Commit message follows conventional format: feat(093): ...
  - [ ] Commit is pushed to feature branch
  - [ ] Repository shows no uncommitted changes
