content: |
  ## Problem Statement

  Create a single markdown file named test-o2fx99.md with a properly formatted title (H1 heading) and 2-3 sentences of prose content about any topic. The file must follow the established format specification that has been consistently applied across 298 preceding markdown file creation features.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation built on CrewAI. The project structure includes:

  - **Root directory**: Contains numerous test markdown files (test-*.md) created by previous features and Python scripts for content generation
  - **src/sheep/**: Main package containing the core platform
    - **agents/**: Agent definitions for research, implementation, and review
    - **config/**: LLM configuration and settings management
    - **content_generators.py**: Central orchestration module for markdown file creation workflow
    - **features/**: Individual feature implementations (feature_NUM_markdown_file_creation.py)
    - **observability/**: Logging and Langfuse integration for tracing
    - **tools/**: Git and file operation tools
    - **cli.py**: Command-line interface entry point
  - **specs/**: Feature specifications directory with YAML files
  - **tests/**: Test suite
  - **pyproject.toml**: Project configuration and dependencies

  ### Architecture Patterns

  **Separation of Concerns**:
  - **Orchestration Layer** (`content_generators.py::create_markdown_file`): High-level workflow coordination
  - **Generation Layer** (`generate_markdown_content`): Claude API integration via CrewAI LLM
  - **File I/O Layer** (`write_markdown_file`): pathlib.Path for safe file operations
  - **Validation Layer** (`validate_markdown_file`, `validate_file_properties`): Comprehensive format checking
  - **Git Layer** (`commit_markdown_file`, `push_markdown_file`): subprocess-based git operations
  - **Feature Module Layer** (`feature_299_markdown_file_creation.py`): Feature-specific orchestration

  **Naming and Commit Conventions**:
  - Feature files: `src/sheep/features/feature_{NUMBER}_markdown_file_creation.py`
  - Markdown files: `test-{RANDOM_ID}.md` pattern
  - Conventional commits: `feat({NUMBER}): create markdown file {FILENAME} with prose content`

  **Error Handling**:
  - Comprehensive validation at each step (generation, writing, file properties, markdown content)
  - Descriptive error messages with context
  - Structured logging via observability module
  - All exceptions include clear reasoning for failure

  ### Relevant Technologies

  1. **Python 3.11+**: Primary language; uses modern syntax (type hints, pathlib)
  2. **CrewAI (0.86.0+)**: Multi-agent orchestration framework; provides LLM abstraction
  3. **Anthropic Claude API**: Integrated through CrewAI's reasoning LLM for content generation
  4. **pathlib.Path**: Safe file I/O with UTF-8 encoding support
  5. **subprocess**: Git command execution with capture and error handling
  6. **Pydantic 2.0+**: Configuration validation and settings management
  7. **Rich**: Terminal formatting and CLI output (optional for this feature)
  8. **Langfuse 2.0+**: Observability and execution tracing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Single new feature module (feature_299_markdown_file_creation.py) will be created following established pattern from 298 preceding features; minimal code, high code reuse |
  | src/sheep/content_generators.py | None | No modifications needed; existing orchestration functions handle all required operations |
  | Repository root (test-o2fx99.md) | Low | Creates single markdown file at root; follows naming pattern established by 298+ existing test files |
  | git history | Low | Adds one conventional commit to feature branch; follows established message format |
  | Existing tests | None | No changes to test suite; feature is self-contained and tested via file creation workflow |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies needed):
  - `sheep.content_generators.create_markdown_file()`: Main orchestration function that handles entire workflow
  - `sheep.content_generators.generate_markdown_content()`: Claude API integration via CrewAI for prose generation
  - `sheep.content_generators.write_markdown_file()`: File creation with UTF-8 encoding
  - `sheep.content_generators.validate_markdown_file()`: Comprehensive format validation
  - `sheep.content_generators.commit_markdown_file()`: Git staging and commit
  - `sheep.content_generators.push_markdown_file()`: Git push to remote
  - `sheep.config.llm.get_reasoning_llm()`: LLM configuration for content generation
  - `sheep.observability.logging.get_logger()`: Structured logging

  **External Services**:
  - Anthropic Claude API (already configured in project)
  - Git remote (origin branch already exists)

  **File Format Requirements** (enforced by validation):
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (not CRLF)
  - H1 markdown heading (# Title)
  - Blank line separator after heading
  - 2-3 sentences of prose content (validated by period count)
  - Trailing newline at end of file
  - Typical file size: 300-600 bytes

  ## Size Estimate

  **S** — This is a straightforward, repetitive feature requiring minimal implementation effort:

  **Justification**:
  - The entire markdown file creation infrastructure is already built and battle-tested across 298 previous features
  - Implementation is a simple feature module that calls existing `create_markdown_file()` orchestration function
  - No architectural changes, no new dependencies, no modifications to core systems
  - Code reuse is maximized: feature implementation will be ~90 lines following established pattern from feature_297
  - Validation, generation, file I/O, git operations all handled by existing, proven functions
  - Estimated effort: 30 minutes for implementation + testing
  - High confidence in success due to repetitive pattern and comprehensive existing validation framework

