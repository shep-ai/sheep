content: |
  ## Problem Statement

  Create a single markdown file named test-o2fx99.md with a properly formatted H1 heading title and 2-3 sentences of coherent prose content about any topic. The file must follow the established format specification that has been consistently applied and validated across 298 preceding markdown file creation features. This feature tests the robustness of the automated markdown file creation infrastructure and demonstrates pattern replication at scale.

  ## Success Criteria

  - [ ] File `test-o2fx99.md` created at repository root directory
  - [ ] File contains exactly one H1 markdown heading (# Title) at the start
  - [ ] H1 heading is followed by blank line separator
  - [ ] File contains exactly 2-3 sentences of prose content (validated by period count)
  - [ ] All sentences are grammatically correct and coherent
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings exclusively (no CRLF)
  - [ ] File has trailing newline at end (validated by file properties)
  - [ ] File size is in typical range: 300-600 bytes
  - [ ] Feature module `feature_299_markdown_file_creation.py` created following established pattern
  - [ ] Feature module is approximately 90 lines of code
  - [ ] All validation checks pass: encoding, line endings, markdown format, content constraints
  - [ ] Conventional commit created: `feat(299): create markdown file test-o2fx99.md with prose content`
  - [ ] Commit includes feature metadata in footer (if applicable per project convention)
  - [ ] Changes pushed to remote origin branch successfully
  - [ ] No regression in existing test suite or functionality
  - [ ] Code follows established project conventions and patterns from feature_297/298
  - [ ] Structured logging captures execution flow (generation → validation → file write → git operations)

  ## Functional Requirements

  - **FR-1**: System must create a markdown file with exact filename `test-o2fx99.md` at repository root directory
  - **FR-2**: File must contain an H1 markdown heading with a descriptive title (format: `# Title`)
  - **FR-3**: H1 heading must be followed by exactly one blank line before prose content
  - **FR-4**: File must contain exactly 2-3 sentences of coherent prose content about any topic (validated by counting periods)
  - **FR-5**: Each sentence must be grammatically correct, properly punctuated, and contextually coherent
  - **FR-6**: File must be encoded in UTF-8 without Byte Order Mark (BOM)
  - **FR-7**: File must use Unix LF (Line Feed, \n) line endings exclusively, not CRLF or other formats
  - **FR-8**: File must have a trailing newline character at the end (no EOF without newline)
  - **FR-9**: Feature module `feature_299_markdown_file_creation.py` must be created in `src/sheep/features/` directory
  - **FR-10**: Feature module must orchestrate the markdown file creation workflow using existing infrastructure functions
  - **FR-11**: Feature module must call `sheep.content_generators.create_markdown_file()` with correct parameters (filename, title, content)
  - **FR-12**: Feature module must implement comprehensive error handling with try-catch blocks and descriptive error messages
  - **FR-13**: Feature module must call structured logging functions from `sheep.observability.logging` module
  - **FR-14**: Changes must be committed to the feature branch using conventional commit format: `feat({number}): create markdown file {filename} with prose content`
  - **FR-15**: Commit message must follow project conventions and pass pre-commit hook validation
  - **FR-16**: Committed changes must be pushed to remote origin branch (feature branch, not main)
  - **FR-17**: System must validate all file properties before committing (encoding, line endings, content, markdown format)
  - **FR-18**: Generation of prose content must use Anthropic Claude API via CrewAI LLM integration from existing config

  ## Non-Functional Requirements

  - **NFR-1**: Generated prose content must be grammatically correct, contextually coherent, and appropriate in tone
  - **NFR-2**: Feature module implementation must follow established code patterns from `feature_297_markdown_file_creation.py` and `feature_298_markdown_file_creation.py`
  - **NFR-3**: Feature module must reuse all existing orchestration functions from `sheep.content_generators` module (maximum code reuse, minimum new code)
  - **NFR-4**: Feature module must be implemented in approximately 90 lines of code (within ±10% of established pattern)
  - **NFR-5**: Implementation must include comprehensive error handling with descriptive exception messages and context
  - **NFR-6**: All execution steps must be logged using structured logging via `sheep.observability.logging.get_logger()`
  - **NFR-7**: File size should be in typical range of 300-600 bytes (calculated including encoding, line endings, newlines)
  - **NFR-8**: Generated content should be on diverse topics to maintain variation and realism across 299 test files
  - **NFR-9**: Execution must complete within established time constraints (<5 seconds total, including API calls)
  - **NFR-10**: No performance regression compared to feature_298 (similar execution profile)
  - **NFR-11**: Code must follow project style conventions: PEP 8 formatting, type hints for function signatures, docstrings for public functions
  - **NFR-12**: Implementation must validate Claude API response before writing to file (check for proper sentence count, no truncation)
  - **NFR-13**: Git operations must handle edge cases: file already exists (overwrite or error), git state issues (report with context)
  - **NFR-14**: Prose generation must use reliable, proven methods from existing infrastructure (no new experimental approaches)
  - **NFR-15**: All validation must be defensive: check file encoding, line endings, markdown format, sentence count, file size

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content generation instructions: minimal creative freedom vs. detailed topic guidelines? | Minimal instructions (minimal) | Maintains content diversity, aligns with 298-feature pattern, simplifies implementation |
  | 2 | Validation failure handling: fail fast with clear error vs. retry with fallback? | Fail fast with clear error | Comprehensive validation catches real issues, clear errors aid debugging, matches established pattern |
  | 3 | Logging verbosity: INFO level vs. DEBUG level? | INFO level (standard) | Matches project standards, sufficient for troubleshooting, DEBUG available at runtime if needed |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | Low | Single new feature module (feature_299_markdown_file_creation.py) created following established pattern from 298 preceding features; minimal code (~90 lines), high code reuse |
  | src/sheep/content_generators.py | None | No modifications needed; existing orchestration functions handle all required operations |
  | Repository root (test-o2fx99.md) | Low | Creates single markdown file at root; follows naming pattern established by 298+ existing test files |
  | git history | Low | Adds one conventional commit to feature branch; follows established message format |
  | Existing tests | None | No changes to test suite; feature is self-contained and tested via file creation workflow |
  | src/sheep/config/ | None | No configuration changes needed; existing LLM config used |
  | src/sheep/observability/ | None | No changes; uses existing logging infrastructure |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies needed):
  - `sheep.content_generators.create_markdown_file()` — Main orchestration function handling entire workflow
  - `sheep.content_generators.generate_markdown_content()` — Claude API integration via CrewAI for prose generation
  - `sheep.content_generators.write_markdown_file()` — File creation with UTF-8 encoding and Unix LF line endings
  - `sheep.content_generators.validate_markdown_file()` — Comprehensive format validation (encoding, line endings, markdown structure)
  - `sheep.content_generators.validate_file_properties()` — File property validation (size, line endings, trailing newline)
  - `sheep.content_generators.commit_markdown_file()` — Git staging and commit with conventional message format
  - `sheep.content_generators.push_markdown_file()` — Git push to remote origin branch
  - `sheep.config.llm.get_reasoning_llm()` — LLM configuration for content generation
  - `sheep.observability.logging.get_logger()` — Structured logging integration

  **External Services**:
  - Anthropic Claude API (already configured in project)
  - Git remote (origin branch already exists, feature branch checked out)

  **File Format Requirements** (enforced by validation):
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (not CRLF)
  - H1 markdown heading (# Title) followed by blank line
  - Exactly 2-3 sentences of prose content
  - Trailing newline at end of file
  - Typical file size: 300-600 bytes
  - No trailing whitespace on lines

  ## Size Estimate

  **S** — This is a straightforward, repetitive feature requiring minimal implementation effort.

  **Justification**:
  - The entire markdown file creation infrastructure is already built and battle-tested across 298 previous features
  - Implementation is a simple feature module that calls existing `create_markdown_file()` orchestration function
  - No architectural changes, no new dependencies, no modifications to core systems
  - Code reuse is maximized: feature implementation will be ~90 lines following established pattern from feature_297/298
  - Validation, generation, file I/O, git operations all handled by existing, proven functions
  - Estimated effort: 30 minutes for implementation + testing
  - High confidence in success due to repetitive pattern and comprehensive existing validation framework
  - This is the 299th feature in an established, proven pattern — execution risk is minimal

  ---

