# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 299 follows the identical architecture as all 298 preceding markdown file creation features. The implementation is a thin orchestration layer that delegates all complexity to proven infrastructure:

  ```
  feature_299_markdown_file_creation.py (thin orchestrator, ~90 lines)
           ↓
  create_markdown_file() (existing orchestration function)
           ├── generate_markdown_content() → Claude API via CrewAI
           ├── write_markdown_file() → File I/O with explicit UTF-8/LF
           ├── validate_markdown_file() → Format validation (H1, blank line, sentences)
           ├── validate_file_properties() → Encoding, line endings, size checks
           ├── commit_markdown_file() → Git staging + conventional commit
           └── push_markdown_file() → Git push to origin
  ```

  **Code Reuse**: ~90 lines of new code, ~2000+ lines of reused infrastructure. The feature module imports only what is necessary and delegates all operations to existing, battle-tested functions.

  **Integration Points**:
  - Imports `create_markdown_file()` from `sheep.content_generators`
  - Uses `get_logger()` from `sheep.observability.logging` for structured logging
  - Relies on existing `sheep.config.llm` configuration for Claude API access
  - No modifications to existing modules required

  ## Key Design Decisions

  ### 1. Minimal Feature Module (Thin Orchestration)
  **Decision**: Create a ~90 line module that calls existing orchestration function

  **Alternatives Considered**:
  - Inline the create_markdown_file() logic directly in feature module (rejected: duplicates code, reduces maintainability)
  - Create new utilities for validation/commit (rejected: infrastructure already exists)

  **Rationale**: Maximizes code reuse and maintainability. All 298 preceding features use this pattern with proven success. The feature module is a simple orchestrator that provides a consistent entry point for feature execution.

  ### 2. Fail-Fast Error Handling with Clear Messages
  **Decision**: Catch exceptions from create_markdown_file() and propagate with logging context

  **Alternatives Considered**:
  - Silent retry with exponential backoff (rejected: masks underlying issues, validation is comprehensive)
  - Partial success fallback (rejected: violates fail-safe principles)

  **Rationale**: Per specification. Comprehensive validation framework catches all common errors. Clear error messages aid debugging. Matches established pattern from all 298 features.

  ### 3. INFO Level Logging for Operational Visibility
  **Decision**: Use INFO level for high-level operations (file creation, validation, git ops)

  **Alternatives Considered**:
  - DEBUG level (rejected: verbose output, higher storage, not aligned with project standards)
  - WARNING level only (rejected: insufficient visibility)

  **Rationale**: Per specification. Matches project observability standards. Provides sufficient detail for issue investigation without verbose output.

  ### 4. Minimal Instructions for Content Generation
  **Decision**: Pass only filename and feature number to create_markdown_file(); let Claude choose topic

  **Alternatives Considered**:
  - Specify topic categories or tone guidelines (rejected: increases complexity, less diversity, not aligned with 298-feature pattern)

  **Rationale**: Per specification. Maintains content diversity across test files. Reduces prompt engineering overhead. Claude API response is validated regardless of topic.

  ### 5. No New Dependencies Required
  **Decision**: Use only existing imports: pathlib, create_markdown_file, get_logger

  **Rationale**: All infrastructure already present in project. No pip installs needed. Reduces risk and complexity.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Module Implementation First)**
  - Establish the feature module structure first
  - This is the primary artifact that will be committed
  - Minimal effort, low risk, validates module pattern
  - Sets up logging and error handling infrastructure before execution

  **Phase 2 (Execution & Validation)**
  - Execute module to generate the markdown file
  - Validate all properties match specification
  - Verify that existing validation framework catches all requirements
  - This phase confirms that orchestration function works as expected

  **Phase 3 (Git Integration)**
  - Commit changes with conventional message
  - Push to remote origin
  - Establish branch tracking
  - Final steps ensure changes are persisted and visible to CI/CD

  ### Why This Approach is Sound

  1. **Proven Pattern**: This exact approach has succeeded 298+ times
  2. **High Code Reuse**: ~90% of complexity delegated to existing, tested functions
  3. **Clear Separation of Concerns**: Feature module handles only orchestration and logging; infrastructure handles all operations
  4. **Low Risk**: Fail-fast behavior with comprehensive validation prevents invalid state
  5. **Rapid Development**: Focused on minimal new code; maximum leverage of existing infrastructure

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | Content generation produces invalid prose | Very Low | Comprehensive validate_markdown_file() checks H1 format, sentence count, grammar. Validation catches all format violations before file write. |
  | File encoding/line endings incorrect | Very Low | Explicit UTF-8 encoding and Unix LF line ending enforcement in write_markdown_file(). Validation checks for BOM and CRLF. |
  | Git commit fails due to hook violations | Low | Conventional commit message format pre-validated. Git hooks configured to match project standards. If failure occurs, detailed error message aids debugging. |
  | API rate limiting or transient failure | Very Low | Single API call per feature (50-100 tokens). Anthropic API reliability is high. Validation catches truncated output immediately. |
  | File already exists from prior run | Very Low | Orchestration function overwrites existing file (safe to re-run). Git staging handles modified files correctly. |
  | Branch not properly set up | Very Low | Feature branch already checked out (confirmed in git status). Remote origin exists and is configured. |
  | Unexpected module import errors | Very Low | Using only existing, imported modules (pathlib, create_markdown_file, get_logger). All dependencies already present and working across 298 features. |
  | Feature number mismatch | Low | Feature number comes from spec metadata. Verify against feature.yaml before task execution. |

  ## Success Criteria for Plan

  - [ ] Feature module created at `src/sheep/features/feature_299_markdown_file_creation.py`
  - [ ] Module imports and executes without errors
  - [ ] Markdown file `test-o2fx99.md` created at repository root
  - [ ] File passes all validation checks: encoding, line endings, format, content
  - [ ] Changes committed with conventional message: `feat(299): create markdown file test-o2fx99.md with prose content`
  - [ ] Commit pushed to remote origin successfully
  - [ ] No regressions in existing features or test suite
  - [ ] Logging shows clean execution path from generation through push

