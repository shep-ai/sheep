content: |
  ## Task Breakdown Summary

  Feature 202 is implemented in 9 focused tasks across 3 phases:

  **Phase 1 (Content Generation):** Task 1 calls Claude API with feature number 202 as seed
  to generate deterministic title and 2-3 sentences of prose. Output is validated for
  sentence count before proceeding.

  **Phase 2 (File Creation & Validation):** Tasks 2-6 create the markdown file using pathlib
  with explicit UTF-8/LF encoding (Task 2), then implement five comprehensive validation
  checks: UTF-8 without BOM (Task 3), LF line endings only (Task 4), sentence count and
  markdown format (Task 5), and a unified validation pipeline (Task 6).

  **Phase 3 (Git Integration):** Tasks 7-9 execute the standard git workflow: stage file
  with git add (Task 7), create commit with conventional message (Task 8), push to feature
  branch (Task 9).

  Each task has clear acceptance criteria and TDD cycles (red/green/refactor) with estimated
  effort. Tasks are ordered by dependency: content must be generated before file can be
  created; file must be validated before it can be committed; file must be committed before
  it can be pushed.

  Total estimated effort: 3.5 hours including all testing, implementation, and validation
  cycles.
