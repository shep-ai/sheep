name: "markdown-file-creation-05a473"
summary: >
  Feature 202: 9 tasks across 3 phases. Phase 1 generates deterministic prose via Claude
  API with feature number 202 as seed. Phase 2 creates the markdown file with explicit
  UTF-8/LF encoding and implements comprehensive pre-commit validation (encoding, line
  endings, sentence count, file size). Phase 3 executes git workflow (add, commit, push).
  Total estimated effort: 3.5 hours including all TDD cycles and validation.

relatedFeatures:
  - number: 201
    name: "markdown-file-creation-04332b"
    relationship: "Immediately preceding feature with identical pattern"
  - number: 200
    name: "markdown-file-creation-791c69"
    relationship: "Identical pattern providing implementation precedent"

technologies:
  - "Python 3.11+ (pathlib, subprocess, re)"
  - "Claude API"
  - "Git"

relatedLinks:
  - title: "CommonMark Specification"
    url: "https://spec.commonmark.org/"
  - title: "Conventional Commits Specification"
    url: "https://www.conventionalcommits.org/"
  - title: "Python pathlib Documentation"
    url: "https://docs.python.org/3/library/pathlib.html"

tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Generate deterministic prose via Claude API"
    description: >
      Call Claude API with feature number 202 as seed to generate a meaningful title (H1 heading,
      5-10 words) and 2-3 sentences of thematically coherent prose content. Use temperature=0
      or deterministic seed to ensure identical output across executions. Validate response
      contains exactly 2-3 sentences before proceeding.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "Claude API returns a generated title string (non-empty, 5-10 words)"
      - "Claude API returns prose content with exactly 2-3 sentences"
      - "Output is identical when feature is re-run with same seed"
      - "Generated prose is thematically related to the title (manual inspection)"
    tdd:
      red:
        - "Write test that calls Claude API with feature number 202 as seed"
        - "Assert response contains title and 2-3 sentences"
      green:
        - "Implement Claude API integration using anthropic SDK"
        - "Use temperature=0 or seed-based prompt to ensure deterministic output"
        - "Parse response to extract title and prose content"
      refactor:
        - "Extract Claude API integration into separate function for reusability"
        - "Add logging to track prose generation (title, sentence count, tokens)"
        - "Define constants for temperature=0, feature number=202, seed inputs"
    estimatedEffort: "45min"

  - id: "task-2"
    phaseId: "phase-2"
    title: "Create markdown file with proper structure and encoding"
    description: >
      Use pathlib.Path.write_text() to create test-1u4gfg.md at repository root with
      H1 title, blank line, and prose content. Explicitly specify encoding='utf-8' and
      newline='\n' to guarantee UTF-8 without BOM and Unix LF line endings. Verify file
      is created at correct path with correct permissions.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File test-1u4gfg.md exists at repository root (Path.cwd() / 'test-1u4gfg.md')"
      - "File contains exactly one H1 heading at the start ('# Title')"
      - "Blank line separates H1 heading from prose content"
      - "File is readable and has correct permissions"
      - "File size is between 250-600 bytes"
    tdd:
      red:
        - "Write test that checks test-1u4gfg.md exists at repository root"
        - "Write test that verifies file contains H1 heading and blank line"
        - "Write test that checks file size is between 250-600 bytes"
      green:
        - "Implement file creation using pathlib.Path.write_text() with encoding='utf-8' and newline='\\n'"
        - "Construct markdown content: '# {title}\\n\\n{prose}\\n'"
      refactor:
        - "Extract file creation into separate function (create_markdown_file)"
        - "Extract content formatting into separate function (format_markdown_content)"
    estimatedEffort: "30min"

  - id: "task-3"
    phaseId: "phase-2"
    title: "Implement encoding validation (UTF-8 without BOM)"
    description: >
      Validate that created file is UTF-8 encoded without BOM (Byte Order Mark). Read
      file in binary mode and check for absence of UTF-8 BOM bytes (xefbbbf). This
      ensures the file meets encoding requirement (FR-8) before commit.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "File is readable in binary mode without errors"
      - "File bytes do not start with UTF-8 BOM (xefbbbf)"
      - "Validation clearly reports 'UTF-8 without BOM' when test passes"
      - "Validation fails with clear error message if BOM is detected"
    tdd:
      red:
        - "Write test that reads file in binary mode and asserts no BOM bytes"
      green:
        - "Implement binary file read and BOM check: if data.startswith(b'\\xef\\xbb\\xbf') raise error"
      refactor:
        - "Extract BOM validation into separate function (validate_utf8_no_bom)"
        - "Add validation to comprehensive validation pipeline"
    estimatedEffort: "20min"

  - id: "task-4"
    phaseId: "phase-2"
    title: "Implement line ending validation (LF only)"
    description: >
      Validate that created file uses Unix LF line endings only (\\n), not CRLF (\\r\\n)
      or CR (\\r). Read file in binary mode and check for absence of CRLF bytes. This
      ensures the file meets line ending requirement (FR-9) before commit.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "File is readable in binary mode without errors"
      - "File does not contain CRLF bytes (\\r\\n)"
      - "File does not contain CR bytes (\\r)"
      - "Validation clearly reports 'LF line endings only' when test passes"
      - "Validation fails with clear error message if CRLF or CR detected"
    tdd:
      red:
        - "Write test that reads file in binary mode and asserts no CRLF or CR bytes"
      green:
        - "Implement binary file read and line ending check: if b'\\r\\n' in data or b'\\r' in data raise error"
      refactor:
        - "Extract line ending validation into separate function (validate_lf_only)"
        - "Add validation to comprehensive validation pipeline"
    estimatedEffort: "20min"

  - id: "task-5"
    phaseId: "phase-2"
    title: "Implement sentence count and markdown format validation"
    description: >
      Validate that prose content (text after blank line following H1) contains exactly
      2-3 sentences. Use regex-based sentence boundary detection (period, question mark,
      exclamation mark followed by whitespace). This ensures the file meets content
      requirement (FR-7) and markdown format requirement (FR-6) before commit.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "Prose section is correctly identified (text after blank line following H1)"
      - "Sentence count is exactly 2 or 3 (no more, no less)"
      - "Markdown format has exactly one H1 heading at file start"
      - "Blank line separates H1 from prose"
      - "Validation fails with clear error message if sentence count is wrong"
      - "Validation clearly reports sentence count when test passes"
    tdd:
      red:
        - "Write test that extracts prose section from markdown file"
        - "Write test that counts sentences using regex and asserts count is 2 or 3"
        - "Write test that verifies exactly one H1 heading at file start"
      green:
        - "Parse markdown: split by blank line to separate heading from prose"
        - "Implement regex-based sentence counting: re.split(r'[.!?]\\s+', prose.strip())"
        - "Count non-empty sentences and assert count == 2 or count == 3"
      refactor:
        - "Extract markdown parsing into separate function (parse_markdown)"
        - "Extract sentence counting into separate function (count_sentences)"
        - "Add validation to comprehensive validation pipeline"
    estimatedEffort: "30min"

  - id: "task-6"
    phaseId: "phase-2"
    title: "Assemble comprehensive validation pipeline"
    description: >
      Integrate all validation checks (file exists, markdown format, sentence count,
      UTF-8 encoding, LF line endings, file size) into a single validation pipeline
      that runs before commit. Log results for each check. Verify all checks pass for
      the generated test-1u4gfg.md file. If any check fails, log specific error and fail
      gracefully.
    state: "Todo"
    dependencies:
      - "task-3"
      - "task-4"
      - "task-5"
    acceptanceCriteria:
      - "All validation checks are implemented and integrated into pipeline"
      - "Pipeline runs all checks in logical order"
      - "Pipeline logs result of each check (pass/fail with details)"
      - "Pipeline returns clear success message if all checks pass"
      - "Pipeline raises error with specific failing check if any check fails"
      - "Test file test-1u4gfg.md passes all validation checks"
    tdd:
      red:
        - "Write test that runs full validation pipeline and asserts all checks pass"
      green:
        - "Create validation function that calls all validation sub-functions in order"
        - "Collect results and log pass/fail for each check"
        - "Raise error if any check fails, include specific failing check in error message"
      refactor:
        - "Extract validation pipeline into separate module (validation.py)"
        - "Create ValidationResult class or dict to track pass/fail/details for each check"
        - "Improve logging format for clear visibility of validation results"
    estimatedEffort: "30min"

  - id: "task-7"
    phaseId: "phase-3"
    title: "Stage file with git add"
    description: >
      Use subprocess.run() to execute 'git add test-1u4gfg.md' command. Verify file
