# Structured technology decisions
decisions:
  - title: File Creation Approach
    chosen: Python pathlib.Path with explicit UTF-8 encoding and newline='' parameter
    rejected:
      - 'Python open() with default parameters — lacks explicit path safety, encoding clarity, and newline handling control'
      - 'Third-party file libraries (e.g., pathvalidate) — unnecessary complexity and additional dependency when built-ins suffice (NFR-6: no external libraries)'
      - 'Template engines (Jinja2, Mako) — overkill for simple static content with no dynamic generation needed'
    rationale: >
      pathlib.Path provides modern, robust path handling with platform independence. Using explicit
      UTF-8 encoding and newline='' parameter ensures exact control over line endings (LF requirement,
      not CRLF). This aligns with Python best practices and existing codebase patterns. No external
      dependencies are required (NFR-6).

  - title: Git Integration Method
    chosen: subprocess module for git commands (git add, commit, push)
    rejected:
      - 'GitPython library — adds external dependency; subprocess is already available in standard library and sufficient for basic git operations'
      - 'Direct os.system() calls — security risk due to shell injection potential; subprocess provides better control and safety'
      - 'Manual file manipulation in .git directory — violates git abstraction and creates fragility; subprocess is the standard approach'
    rationale: >
      subprocess is the standard Python approach for invoking git commands. It's available in the
      standard library (no external dependencies), provides shell=False security by default, and
      allows proper error handling. The commands needed (add, commit, push) are simple and well-defined,
      making GitPython unnecessary. This aligns with existing codebase patterns used in features 059-061.

  - title: Content Structure and Validation
    chosen: Direct string formatting with flexible sentence count (approximately 2-3 sentences)
    rejected:
      - 'Strict sentence counting with regex validation — over-engineering for a requirement explicitly resolved to allow "approximate content" in feature spec'
      - 'Content from external source or template library — adds unnecessary complexity and I/O when substantive prose can be directly authored'
      - 'Randomized content generation — poor UX, unpredictable prose quality, contradicts requirement for "coherent, substantive, and readable" content'
    rationale: >
      The feature spec explicitly resolved the open question to "Allow approximate content" with
      rationale that "prose quality and readability should take priority over rigid counting." Direct
      string formatting allows natural, flowing prose that meets the spirit of the requirement. No
      programmatic validation is needed beyond ensuring the file exists with reasonable content length
      (~400-600 bytes per spec).

  - title: Encoding and Line Ending Handling
    chosen: UTF-8 encoding with explicit LF line endings (newline='' for control, manual '\n' in content)
    rejected:
      - 'Python default line ending behavior — varies by platform; explicit LF requirement cannot be guaranteed without explicit newline='' parameter'
      - 'Binary mode writing — increases complexity unnecessarily; text mode with explicit encoding is standard practice'
      - 'Post-processing with sed/dos2unix — unnecessary complexity when Python can enforce encoding at write time'
    rationale: >
      NFR-1 and NFR-2 require UTF-8 encoding and LF line endings (Unix conventions). Using
      newline='' in open() disables platform-specific line ending conversion and allows Python to
      pass '\n' characters directly to the file without modification. This ensures portable,
      predictable behavior across all platforms and satisfies the repository's Unix conventions.

