# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-xf7h2g.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 40+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory).

  ## Success Criteria

  - [ ] File `test-xf7h2g.md` created in repository root directory
  - [ ] File contains valid markdown syntax with no linting errors
  - [ ] File includes a level-1 markdown heading (#) as the title
  - [ ] File includes approximately 2-3 sentences of prose content after the heading
  - [ ] File uses UTF-8 encoding (standard Python default)
  - [ ] File uses LF line endings (\n) not CRLF (\r\n)
  - [ ] File is staged in git working tree (via git add)
  - [ ] File is committed with conventional commit message (feat: prefix)
  - [ ] Commit message clearly describes the file creation and follows pattern from features 059-061
  - [ ] File is pushed to remote feature branch `feat/062-markdown-file-creation`
  - [ ] File follows the same structure and pattern as existing test-*.md files
  - [ ] File size is approximately 400-600 bytes
  - [ ] Content is coherent, substantive, and readable

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-xf7h2g.md` in the repository root directory
  - **FR-2**: File must contain a single level-1 markdown heading (#) that serves as the document title
  - **FR-3**: File must contain approximately 2-3 sentences of prose content after the heading
  - **FR-4**: File must be added to the git staging area using git add or equivalent
  - **FR-5**: File must be committed to the git repository with a conventional commit message (feat: prefix)
  - **FR-6**: Commit message must be descriptive and describe the file creation action
  - **FR-7**: File must be pushed to the remote feature branch `feat/062-markdown-file-creation`
  - **FR-8**: Content must be on a substantive, appropriate topic with coherent prose

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (standard for markdown and Python file I/O)
  - **NFR-2**: File must use LF line endings (\n) matching repository Unix conventions
  - **NFR-3**: File format and structure must match the established pattern of existing test-*.md files
  - **NFR-4**: Markdown syntax must be valid and pass basic markdown validation
  - **NFR-5**: Implementation must complete in approximately 10-15 minutes
  - **NFR-6**: No external libraries or runtime dependencies required
  - **NFR-7**: Content should be appropriate for a professional, technical context
  - **NFR-8**: File should be human-readable with natural, flowing prose

  ## Product Decisions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the 2-3 sentence requirement be strictly enforced or allow variations? | Allow approximate content (roughly 2-3 sentences) | Prioritizes prose quality and readability. The intent is to keep content focused and concise, not to enforce rigid counting. Natural prose may vary slightly while maintaining the spirit of the requirement. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-xf7h2g.md) to existing collection of 40+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes |
  | Git Repository | Low | Standard single commit and push following established pattern from commits #122-#128; no branch/merge complexity |
  | Workflow/Process | Low | Uses existing file creation and git tooling; no new dependencies, infrastructure, or platform modifications required |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase |

  ## Dependencies

  - **Git repository**: Feature branch `feat/062-markdown-file-creation` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Established pattern**: 40+ test files provide clear precedent for content format and structure

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with 40+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent commits (#122-#128) demonstrate efficient implementation of identical features

  ---

  _Requirements phase complete — ready for implementation planning_
