content: |
  ## Summary

  The implementation follows a bottom-up approach across 3 phases with 7 tasks.
  First, we build the theme infrastructure — the ThemeProvider context, useTheme
  hook, and FOUC-prevention script constant — with full TDD coverage including
  localStorage mocking and DOM class assertions. Next, we create the ThemeToggle
  component using shadcn/ui Switch and Label, wired to useTheme, along with
  Storybook stories showing both Light and Dark variants via decorators. Finally,
  we integrate everything: wrapping the root layout with ThemeProvider, injecting
  the inline script, and placing ThemeToggle in the settings panel. A final
  validation pass ensures no regressions across build, test, and lint.

  Each code task follows strict TDD: failing tests are written first (RED),
  minimal implementation makes them pass (GREEN), then cleanup improves code
  quality (REFACTOR). Dependencies flow naturally — the context must exist before
  components can consume it, and components must exist before integration can
  wire them together.
