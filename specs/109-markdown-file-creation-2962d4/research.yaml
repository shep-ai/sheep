# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-19
  - **Status:** Complete

  ## Overview

  Feature 109 requires creating a single markdown file (`test-fsgmci.md`) in the repository root with a simple structure: H1 heading as title, blank line, and 2-3 sentences of prose. This is a continuation of the markdown-file-creation pattern established in features 063-108, with 65+ existing test files providing clear precedents for implementation approach.

  Technical research confirms that implementation is straightforward and adds zero new dependencies.

  ## Technology Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Chosen:** `Path(filename).write_text(content, encoding='utf-8')`

  **Rejected:**
  - `open()` context manager with manual encoding — more verbose, requires explicit mode handling
  - `os.path` module approach — deprecated API, less Pythonic, requires more boilerplate

  **Rationale:** pathlib is the modern, recommended approach for text file creation in Python 3.6+.
  Provides automatic UTF-8 encoding handling per NFR-1. Single line of code. Aligns with project
  specification requirement NFR-5 ("Implementation must use Python `pathlib.Path` for file I/O").
  All 65+ existing test files use pathlib-compatible patterns.

  ### 2. Git Operations: subprocess CLI Invocation

  **Chosen:** subprocess calls to git CLI (`git add`, `git commit`, `git push`)

  **Rejected:**
  - GitPython library — adds external dependency; violates NFR-9 (no new external packages)
  - Direct .git directory manipulation — complex, error-prone, not portable

  **Rationale:** subprocess is Python standard library (zero new dependencies). Git CLI is reliable,
  transparent, and well-understood. Feature branch already created; only straightforward operations
  needed: stage file, commit, push. Subprocess approach is simple and safe. Matches pattern used in
  existing features 063-108.

  ### 3. Content Generation: Hardcoded Imperative String

  **Chosen:** Simple string construction with f-string or format()

  **Rejected:**
  - Template system (Jinja2, Mako) — unnecessary complexity, adds external dependency
  - Random/procedural content generator — adds complexity without business value

  **Rationale:** Single file with fixed structure (one H1 + prose) is too simple to benefit from
  templating. Hardcoded content is clearest and most maintainable. Follows established pattern from
  65+ existing test files which all use imperative generation. No requirement for content variation.

  ### 4. Markdown Validation: Manual Implementer Review

  **Chosen:** Implementer reviews prose for readability and grammar during creation

  **Rejected:**
  - Automated markdown library (markdown, commonmark) — unnecessary for simple structure
  - Grammar checking library (language-tool-python) — adds dependency; test-level content doesn't warrant automated validation

  **Rationale:** Product specification (question resolution #3) explicitly states implementer
  manual validation is sufficient for test-level prose. Standard practice across all 65+ existing
  test files. Manual review is adequate for simple prose structure. Avoiding automated grammar
  checking keeps dependencies at zero (NFR-9).

  ### 5. Encoding & Line Endings: UTF-8 with Unix LF

  **Chosen:** pathlib.Path.write_text() with explicit encoding='utf-8'

  **Rejected:**
  - Binary mode with explicit \n handling — error-prone, harder to maintain
  - Platform-default encoding — not portable, could produce non-UTF-8 on some systems

  **Rationale:** write_text() method handles encoding transparently and safely. Explicit
  encoding='utf-8' parameter ensures cross-platform consistency per NFR-1. Unix LF line endings
  are default on Linux systems (project runtime environment); write_text() preserves this per NFR-2.
  Text mode is simpler and more maintainable than binary mode with manual escaping.

  ### 6. Topic Selection: Free-Form

  **Chosen:** Implementer chooses any topic; no constraints

  **Rejected:**
  - Constrained topic set — reduces flexibility, adds unnecessary validation
  - Random topic selection — adds complexity without business value

  **Rationale:** Product specification (question resolution #2) explicitly resolves free-form
  selection is correct. User query states "about anything". All 65+ existing test files use
  diverse topics without constraint. Free-form approach is simpler and enables natural content.

  ### 7. Content Structure: Simple f-String Format

  **Chosen:** `f"# {title}\n\n{prose}"` or equivalent string formatting

  **Rejected:**
  - Template engine (Jinja2, Mako) — overkill for fixed structure
  - Builder pattern or class-based abstraction — adds unnecessary complexity

  **Rationale:** Markdown structure is minimal and fixed (H1, blank line, prose). Simple string
  formatting is clearest without abstraction. Readable, efficient, minimal code. Aligns with
  imperative style of existing 65+ test files.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O | **USE** | Part of Python standard library; required for NFR-5; safe encoding handling; modern API |
  | subprocess (stdlib) | Git operations | **USE** | Standard library; transparent; no external dependencies; reliable for CLI calls |
  | os (stdlib) | File path operations | **OPTIONAL** | Only if needed for path validation; pathlib covers most use cases |
  | GitPython | Git operations | **REJECT** | External dependency; violates NFR-9; subprocess is sufficient |
  | markdown | Markdown validation | **REJECT** | Unnecessary for simple H1 + prose structure; adds dependency; manual review sufficient |
  | language-tool-python | Grammar validation | **REJECT** | Adds external dependency; test-level content doesn't warrant automated checking; violates NFR-9 |
  | Jinja2 | Content templating | **REJECT** | Overkill for single file; adds external dependency; simple string formatting sufficient |
  | lxml / BeautifulSoup | HTML/markup parsing | **REJECT** | Not applicable; pure markdown file, no parsing needed |

  ## Security Considerations

  **File Creation:**
  - pathlib.Path.write_text() is safe from file handle leaks (automatic context management)
  - UTF-8 encoding with explicit parameter prevents encoding-based attacks
  - File creation in repository root (not user input path) — no path traversal vulnerability

  **Git Operations:**
  - subprocess calls use explicit arguments (list form), not shell strings — prevents shell injection
  - Conventional commit message is hard-coded (not user input) — no injection risk
  - No sensitive credentials, keys, or tokens in commit message

  **Content Handling:**
  - Prose content is hardcoded (not user input) — no injection vectors
  - No markdown dynamic evaluation or code execution — plain text file format
  - No external library loading or deserialization — minimal attack surface

  **File Permissions:**
  - Repository root already has write access (working directory of feature branch)
  - No privilege escalation or permission changes needed
  - No sudo or special permissions required

  **Summary:** Implementation has minimal security risk. No user input is processed. File I/O uses
  safe standard library functions. Git operations use safe subprocess argument passing.

  ## Performance Implications

  **File Creation Performance:**
  - Single pathlib.write_text() call: <1ms (single file operation)
  - File size is minimal (~350-450 bytes): negligible I/O overhead
  - UTF-8 encoding: no performance penalty for ASCII prose

  **Git Operations Performance:**
  - git add: <10ms (single file)
  - git commit: <10ms (no hooks, local repository)
  - git push: variable (network dependent, typically 100-500ms)
  - Total execution time: ~500ms to 2s depending on network

  **Memory Usage:**
  - Entire file content loaded in memory: ~400 bytes (negligible)
  - String concatenation: <1KB of temporary memory
  - subprocess invocations: <10MB per process

  **Scalability:**
  - Not applicable for single file creation
  - Pattern scales linearly for multiple files (O(n) where n = number of files)
  - No database queries or external API calls — constant time operation

  **Optimization Notes:**
  - No caching needed (single file operation)
  - No batch operations (single file)
  - No parallelization possible (git push is sequential)
  - Implementation is already optimal for this use case

  **Summary:** Performance is excellent. Single file operation completes in <2s. No optimization
  opportunities or concerns. Implementation is already efficient.

  ## Architecture & Integration Notes

  **Codebase Patterns:**
  - Features 063-108 use identical pattern: simple pathlib file creation + git workflow
  - All test files stored in repository root (not in src/ or tests/ directories)
  - Feature implementation is isolated from application source code (no dependencies on /src/sheep/)
  - No modifications to test suite, configuration, or dependencies

  **Git Workflow:**
  - Feature branch `feat/109-markdown-file-creation-2962d4` is pre-created
  - Implementation follows conventional commit format: `feat(109): create markdown file test-fsgmci.md with prose content`
  - Standard git workflow: add → commit → push (no merge or rebase operations needed)
  - No CI/CD impact (test files are artifacts, not test code)

  **File System:**
  - Repository root contains 65+ test-*.md files (artifacts of features 063-108)
  - New file (`test-fsgmci.md`) follows established naming pattern
  - No directory structure changes needed
  - No file deletions or overwrites

  **Dependencies:**
  - Zero new external dependencies (uses only Python standard library)
  - Python 3.11+ required (per pyproject.toml; pathlib available in all Python 3 versions)
  - Git installed and configured (already required for feature branch workflow)
  - No package installation or environment setup needed

  ## Summary of Decisions

  All technology decisions are conservative and follow established patterns:

  1. **File I/O:** pathlib.write_text() — specified in spec, modern, safe
  2. **Git:** subprocess CLI — zero new dependencies, transparent, reliable
  3. **Content:** hardcoded string — follows 65+ precedents, simple, maintainable
  4. **Validation:** manual implementer review — matches spec requirement, no automation overhead
  5. **Encoding:** UTF-8 explicit — cross-platform safe, per spec requirements
  6. **Topic:** free-form — user requirement, no validation needed
  7. **Structure:** simple f-string — readable, efficient, minimal code

  **Implementation is straightforward, low-risk, and follows established patterns.**

