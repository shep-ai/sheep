# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning (Complete)
  - **Updated:** 2026-03-19
  - **Status:** Ready for implementation

  ## Architecture Overview

  This feature implements the well-established markdown-file-creation pattern used in features
  063-108 and represented by 65+ existing test files in the repository root. The implementation
  is isolated, artifact-driven, and follows established conventions.

  **File Structure:**
  - Repository root contains 65+ test-*.md files (artifacts from previous features)
  - New file `test-fsgmci.md` follows identical naming and content pattern
  - Files are created in working directory; no subdirectories or structural changes
  - No modifications to source code, tests, or configuration

  **Integration Points:**
  - Feature branch `feat/109-markdown-file-creation-2962d4` is pre-created
  - Git workflow uses standard CLI: add → commit → push
  - Conventional commit format: `feat(109): create markdown file test-fsgmci.md with prose content`
  - No CI/CD impact (test files are artifacts, not test code)
  - No dependencies on /src/sheep/ or application source code

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path.write_text()

  **Decision:** Use `Path('test-fsgmci.md').write_text(content, encoding='utf-8')`

  **Rationale:**
  - Modern, recommended approach for text file creation in Python 3.6+
  - Automatic UTF-8 encoding handling per NFR-1 specification requirement
  - Explicit encoding parameter ensures cross-platform consistency
  - Single line of code; safe from file handle leaks
  - Aligns with specification requirement NFR-5 ("use Python pathlib.Path")
  - All 65+ existing test files use pathlib-compatible patterns

  **Alternatives Rejected:**
  - `open()` context manager: more verbose, requires explicit mode and encoding parameters
  - `os.path` module: deprecated API, less Pythonic, requires more boilerplate

  ### 2. Git Operations: subprocess CLI Invocation

  **Decision:** Use subprocess to call git CLI for add, commit, and push operations

  **Rationale:**
  - subprocess is Python standard library (zero new external dependencies per NFR-9)
  - Git CLI is transparent, reliable, and well-understood
  - Feature branch already created; only straightforward operations needed
  - Simple argument list prevents shell injection vulnerabilities
  - Matches pattern used in features 063-108

  **Alternatives Rejected:**
  - GitPython library: adds external dependency; violates NFR-9
  - Direct .git directory manipulation: complex, error-prone, not portable

  ### 3. Content Generation: Hardcoded Imperative String

  **Decision:** Generate prose content with simple f-string or format() call

  **Rationale:**
  - Single file with fixed structure (one H1 heading + 2-3 prose sentences) is too simple for templating
  - Hardcoded content is clearest and most maintainable
  - Follows established pattern from all 65+ existing test files
  - No requirement for content variation or randomization
  - Reduces complexity and external dependencies

  **Alternatives Rejected:**
  - Template system (Jinja2, Mako): overkill for single file; adds external dependency
  - Random content generator: adds unnecessary complexity

  ### 4. Markdown Validation: Manual Implementer Review

  **Decision:** Implementer manually reviews prose for readability and grammar during creation

  **Rationale:**
  - Product specification (question resolution #3) explicitly states implementer manual validation is sufficient
  - This is test-level content, not production documentation
  - Standard practice across all 65+ existing test files
  - Manual review is adequate for simple prose structure (2-3 sentences)
  - Automated grammar checking would add external dependency (violates NFR-9)

  **Alternatives Rejected:**
  - markdown library validation: unnecessary for simple H1 + prose structure
  - language-tool-python: adds external dependency; test files don't warrant automated grammar checking

  ### 5. Encoding & Line Endings: UTF-8 with Unix LF

  **Decision:** pathlib.Path.write_text() with explicit encoding='utf-8' parameter

  **Rationale:**
  - write_text() method handles encoding transparently and safely
  - Explicit encoding='utf-8' ensures cross-platform consistency per NFR-1
  - Unix LF line endings are default on Linux; write_text() in text mode preserves this per NFR-2
  - Text mode is simpler and more maintainable than binary mode with manual \n escaping
  - No platform-specific edge cases

  **Alternatives Rejected:**
  - Binary mode with explicit line ending handling: error-prone, harder to maintain
  - Platform-default encoding: not portable; could produce non-UTF-8 on some systems

  ### 6. Topic Selection: Free-Form

  **Decision:** Implementer chooses any topic; no constraints on subject matter

  **Rationale:**
  - Product specification (question resolution #2) explicitly resolves free-form selection is correct
  - User query explicitly states "about anything" with no subject constraints
  - All 65+ existing test files use diverse topics without constraint
  - Free-form approach is simpler to implement and enables natural, varied content
  - No business requirement for topic restriction

  **Alternatives Rejected:**
  - Constrained topic set: reduces flexibility; adds unnecessary validation logic
  - Random topic selection: adds complexity without business value

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**

  Create the markdown file with proper structure using pathlib. The file should contain:
  - Line 1: H1 heading (e.g., `# Chosen Topic`)
  - Line 2: Empty line (blank separator)
  - Lines 3-5: 2-3 sentences of grammatically correct prose

  Validate that:
  - File exists at correct path (repository root)
  - Content structure matches specification
  - File uses UTF-8 encoding
  - File uses Unix LF line endings (\n, not \r\n)
  - File is approximately 350-450 bytes (natural outcome of proper structure)

  **Phase 2: Git Integration & Push**

  Stage, commit, and push following the standard git workflow:
  1. Stage file with `git add test-fsgmci.md`
  2. Commit with exact message: `feat(109): create markdown file test-fsgmci.md with prose content`
  3. Push to remote origin: `git push -u origin feat/109-markdown-file-creation-2962d4`

  Both phases are sequential (no parallelization possible) and follow the established pattern
  from features 063-108.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Incorrect file encoding (not UTF-8) | Use pathlib.Path.write_text() with explicit encoding='utf-8' parameter; verify encoding in file properties |
  | Windows line endings (CRLF instead of LF) | Use text mode write_text() which preserves platform defaults; verify on Linux (LF native) |
  | Content structure doesn't match spec | Review prose against requirements: exactly one H1, blank line separator, 2-3 grammatically correct sentences |
  | Git configuration missing (user.name, user.email) | Assume standard git configuration already in place (required for feature branch workflow); error message will indicate if missing |
  | File size outside 400-600 byte range | File size is natural outcome of proper structure; verify structure correctness rather than enforcing byte limit |
  | Grammatical or readability errors in prose | Implementer manually reviews prose during creation; no automated checking required per specification |
  | Git push fails (network, authentication) | Standard error handling; feature branch is pre-created and ready for push |

