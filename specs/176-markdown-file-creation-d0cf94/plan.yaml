content: |
  ## Architecture Overview

  This feature follows the established pattern from 175+ prior similar features in
  the Sheep repository (features 173-175, etc.). The implementation is isolated and
  does not modify existing Sheep platform code.

  ### File Structure

  **Implementation Module:** `specs/176-markdown-file-creation-d0cf94/create_markdown_file.py`
  - Module-level constants: FILENAME, MARKDOWN_TITLE, MARKDOWN_PROSE, COMMIT_MESSAGE
  - Function: create_file(filepath) → Path
  - Function: validate_file(filepath) → bool
  - Function: git_operations(filepath) → None
  - Function: main() → int (orchestration and error handling)

  **Test Module:** `tests/test_create_markdown_file_176.py`
  - Fixtures: temp_dir (TemporaryDirectory), original_cwd (working directory context)
  - Test classes: TestFileCreation, TestValidation, TestGitOperations, TestIntegration
  - Comprehensive coverage: success paths, failure cases, encoding, line endings, git mocking

  ### Design Principles

  **1. Isolation & Independence**
  - Feature is standalone; doesn't modify Sheep codebase
  - Uses only Python standard library + pytest (already in dependencies)
  - Can be developed and tested independently

  **2. Standard Library Only**
  - pathlib: Modern, built-in file operations (Path.write_bytes, Path.read_text)
  - subprocess: Safe git command execution with list-based arguments
  - pytest: Project's chosen test framework (pyproject.toml requirement)
  - No external dependencies beyond pytest (already listed in dev-dependencies)

  **3. Deterministic Behavior**
  - Explicit UTF-8 encoding (not utf-8-sig) to prevent BOM
  - Explicit '\\n' characters in content strings ensure LF, not CRLF on Windows
  - Validation confirms structure, encoding, and line endings
  - subprocess.run() with check=True ensures strict error handling

  **4. Comprehensive Validation**
  - validate_file() checks: existence, size (300-800 bytes), H1 heading, blank line, prose
  - Returns True on success; raises AssertionError with descriptive message on failure
  - Descriptive errors aid debugging and provide clear feedback

  **5. Test-Driven Development**
  - All tests written before implementation (RED phase)
  - Minimal implementation to pass tests (GREEN phase)
  - Cleanup and refinement (REFACTOR phase)
  - Comprehensive coverage prevents regressions

  ## Key Design Decisions

  ### Decision 1: File Operations with pathlib.Path

  **Chosen:** pathlib.Path with Path.write_bytes() and explicit UTF-8 encoding

  **Rationale:**
  - Built into Python 3.11+ standard library; no external dependencies
  - Cross-platform path handling (Windows vs Unix)
  - Object-oriented, intuitive API
  - Explicit control over encoding and line endings:
    - Path.write_bytes(content.encode('utf-8')) ensures UTF-8 without BOM
    - Using explicit '\\n' in content strings ensures LF line endings
  - Proven pattern across 175+ prior features (173-175)

  ### Decision 2: Git Operations with subprocess.run()

  **Chosen:** subprocess.run() with check=True and list-based command arguments

  **Rationale:**
  - Built into Python 3.11+ standard library; no external dependencies
  - List-based arguments prevent command injection attacks
  - check=True ensures CalledProcessError on any failure (strict error handling)
  - Three-step workflow (add → commit → push) is straightforward and conventional
  - Proven pattern across all 175+ prior markdown creation features

  ### Decision 3: Comprehensive Validation Function

  **Chosen:** validate_file() with AssertionError and descriptive failure messages

  **Rationale:**
  - Checks all critical requirements: size, structure, encoding, line endings
  - Returns True on success; raises AssertionError with message on failure
  - Descriptive errors enable debugging and provide clear feedback
  - File size range (300-800 bytes) is flexible guideline, not hard limit
  - Pattern established in features 173-175

  ### Decision 4: pytest with Fixture Isolation

  **Chosen:** pytest with tempfile.TemporaryDirectory() fixtures and mock.patch()

  **Rationale:**
  - Project uses pytest (pyproject.toml specifies pytest>=8.0.0)
  - Fixtures provide isolated test directories; automatic cleanup
  - mock.patch('subprocess.run') verifies git commands without side effects
  - Comprehensive coverage: success paths, failure cases, encoding, line endings
  - Established pattern from features 173-175

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Test Suite First (Phase 1):** Write all tests before implementation. Tests define
     the contract and acceptance criteria. Starting with tests ensures specification
     compliance and prevents implementation drift.

  2. **Core Functions (Phase 2):** Implement create_file(), validate_file(),
     git_operations() in order of dependency. Each function passes its test suite
     before moving to the next.

  3. **Integration (Phase 3):** Wire main() orchestration function. Verify complete
     workflow: create → validate → git. Ensure all tests pass.

  **Why This Order:**
  - Tests written first prevent scope creep and ensure spec compliance
  - Core functions implemented before orchestration allows isolated testing
  - Integration phase validates end-to-end workflow
  - Follows TDD principles: RED → GREEN → REFACTOR

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding issues (BOM, CRLF)** | Use Path.write_bytes() with explicit UTF-8 encoding and '\\n' characters; validate confirms no BOM and no CRLF |
  | **Git operation failures** | Use subprocess.run() with check=True to raise CalledProcessError on any failure; tests mock git to verify commands |
  | **Test isolation & side effects** | Use tempfile.TemporaryDirectory() fixtures; each test gets clean directory with cwd restored via try/finally |
  | **Windows platform compatibility** | Use pathlib for cross-platform path handling; explicit '\\n' ensures LF on all platforms; tests verify line endings |
  | **Missing dependencies** | Use only Python standard library + pytest (already in pyproject.toml); no external packages |
  | **Spec non-compliance** | Comprehensive test suite covers all requirements; validation function checks structure, size, encoding, line endings |
  | **Regression in similar features** | Follow exact pattern from 173-175; reusable code can serve as reference for future features |
