content: |
  ## Problem Statement

  Create a single markdown file named `test-t2wrez.md` in the repository root with:
  - An H1 (heading level 1) title
  - 2-3 sentences of prose content about any topic
  - Proper markdown formatting (blank line between heading and prose)
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix-style LF line endings (not Windows CRLF)
  - File staged, committed, and pushed to git using conventional commit format

  This is the 176th in a series of similar markdown file creation tasks (175+ total) that follow a consistent architectural pattern.

  ## Success Criteria

  - [ ] File `test-t2wrez.md` exists in repository root
  - [ ] File contains valid H1 markdown heading as first line (e.g., `# Title`)
  - [ ] File contains blank line immediately after heading
  - [ ] File contains exactly 2-3 sentences of prose content after blank line
  - [ ] File is valid UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (no Windows CRLF)
  - [ ] File size is within 300-800 byte range (expected outcome of structure, not hard constraint)
  - [ ] File is added to git index via `git add test-t2wrez.md`
  - [ ] File is committed with conventional commit message `feat(176): create markdown file test-t2wrez.md with title and prose content`
  - [ ] File is pushed to remote branch via `git push -u origin HEAD`
  - [ ] File content is readable and properly formatted in markdown

  ## Functional Requirements

  - **FR-1**: Implementation must create markdown file named exactly `test-t2wrez.md` at repository root
  - **FR-2**: File must contain H1 markdown heading as the first line (format: `# Heading Text`)
  - **FR-3**: File must have exactly one blank line after H1 heading before prose content begins
  - **FR-4**: File must contain prose content with exactly 2-3 sentences after blank line
  - **FR-5**: File must be encoded as UTF-8 without Byte Order Mark (BOM)
  - **FR-6**: File must use Unix-style LF line endings throughout (not Windows CRLF)
  - **FR-7**: Implementation must add file to git index using `git add test-t2wrez.md`
  - **FR-8**: Implementation must commit file with conventional commit message format `feat(176): create markdown file test-t2wrez.md with title and prose content`
  - **FR-9**: Implementation must push committed file to remote branch using `git push -u origin HEAD`
  - **FR-10**: Implementation must provide a validation function that verifies file structure, encoding, and line endings
  - **FR-11**: Validation must raise AssertionError with descriptive message if any requirement is violated

  ## Non-Functional Requirements

  - **NFR-1**: File size should naturally fall within 300-800 bytes (300-600 optimal) as result of 2-3 sentence requirement, not enforced as hard constraint
  - **NFR-2**: Implementation must follow established pattern from features 170-175 for consistency and maintainability
  - **NFR-3**: Code must have comprehensive pytest test coverage including: successful file creation, validation logic, encoding verification, line ending verification, git operations, and error cases
  - **NFR-4**: Implementation must be compatible with Python 3.11 and later
  - **NFR-5**: Implementation must use only Python standard library modules (pathlib, subprocess, sys, tempfile, unittest.mock) with no external package dependencies beyond pytest for testing
  - **NFR-6**: Implementation must be cross-platform compatible using pathlib.Path for file operations
  - **NFR-7**: Git operations must use subprocess.run() with check=True for strict error handling (raise CalledProcessError on failure)
  - **NFR-8**: Tests must use pytest fixtures for isolated temporary directories (tempfile) and mock.patch for git command verification
  - **NFR-9**: Implementation code must be maintainable and serve as reference for future similar features
  - **NFR-10**: All git and file operations must be deterministic and reproducible in any environment

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository structure includes:

  - **Root directory**: Contains markdown output files (test-*.md) and Python scripts (create_*.py, git_*.py)
  - **/specs**: Feature specifications organized by feature number and name
    - Each feature directory contains related implementation code and tests
    - Example: `specs/175-markdown-file-creation-35f9af/` contains implementation patterns to follow
  - **/tests**: Centralized pytest test files for various features
  - **/src/sheep**: Main source code (agents, flows, tools, configuration, observability)
  - **Configuration**: pyproject.toml defines dependencies, Python version (3.11+), and dev tools

  ### Architecture Patterns

  This repository follows a repeatable pattern for markdown file creation features:

  1. **File Creation Function**
     - Creates a markdown file with a specific name
     - Constructs content with H1 heading + blank line + prose
     - Uses pathlib.Path for cross-platform file operations
     - Writes with UTF-8 encoding explicitly, without BOM
     - Uses explicit '\n' characters to ensure LF (not CRLF) line endings
     - Returns a Path object for validation

  2. **Validation Function**
     - Verifies file exists and is readable
     - Checks file size is in acceptable range (300-800 bytes, soft guideline 400-600)
     - Validates structure: H1 heading + blank line + prose content
     - Confirms UTF-8 encoding and LF line endings
     - Raises AssertionError with descriptive messages on failure
     - Returns True on success

  3. **Git Operations**
     - Uses subprocess.run() to execute git commands
     - Three-step workflow: `git add`, `git commit` (with conventional message), `git push -u origin HEAD`
     - Strict error handling with check=True (raises CalledProcessError on failure)
     - Follows conventional commit format: `feat(NUMBER): description`

  4. **Testing Pattern**
     - Uses pytest with fixtures for isolated temporary directories
     - Comprehensive coverage: file creation, validation, git operations
     - Tests both success paths and failure cases (missing heading, wrong encoding, etc.)
     - Uses mock.patch to verify git commands without actual execution in tests
     - Integration tests verify complete workflow

  ### Relevant Technologies

  - **Python 3.11+**: Primary language; requires py311 or higher per pyproject.toml
  - **pathlib**: Standard library module for file path operations (Path.write_text, Path.read_text, Path.stat)
  - **subprocess**: Standard library module for executing git commands with strict error handling
  - **pytest**: Testing framework with fixtures, temporary directories (tempfile), and mocking (unittest.mock)
  - **CrewAI**: Underlying agentic platform (not directly used in simple file creation features)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | Creates new markdown file `test-t2wrez.md` at repository root |
  | specs/176-markdown-file-creation-d0cf94/ | High | Contains implementation code and tests for this feature |
  | Git Repository | Medium | Adds/commits/pushes new file; affects git history and remote branch |
  | test-t2wrez.md | High | New file created; must follow exact naming convention and structure |

  ## Dependencies

  ### External Dependencies
  - **Git**: Required for git operations (subprocess calls `git add`, `git commit`, `git push`)
  - **Python stdlib (pathlib, subprocess, sys, tempfile)**: No external packages required for core implementation

  ### Internal Dependencies
  - This feature has no dependencies on other Sheep features or codebase modules
  - Follows the same isolated pattern as 175+ previous similar features
  - Can be implemented independently without modifying existing codebase

  ### Patterns from Previous Implementations
  - Reference implementation: `specs/175-markdown-file-creation-35f9af/spec.yaml` (if implementation exists)
  - Reference test patterns: 175+ previous feature implementations in this repository
  - Consistent across features 170-176: same file structure, validation rules, git workflow

  ## Size Estimate

  **S** — This is a small, straightforward task that can be completed in 10-30 minutes.

  **Justification**:
  1. Simple file creation: Writing a markdown file with known structure (heading + prose)
  2. Well-established pattern: 175+ previous similar features provide clear templates
  3. Minimal validation: File size check (300-800 bytes), encoding check (UTF-8), structure check (H1 + blank + prose)
  4. Standard git operations: Three simple subprocess calls (add/commit/push)
  5. No architectural changes: No modifications to Sheep platform codebase needed
  6. Testing is straightforward: Follow pytest pattern from features 170-175
  7. Time breakdown:
     - Create markdown file: 5 min (simple content composition)
     - Validation: 2 min (check structure, encoding, line endings)
     - Git workflow: 3 min (add, commit, push)
     - Total: 10-30 minutes depending on iteration/refinement

  **Confidence**: High — This task is well-scoped, follows established patterns across 175+ prior implementations, and has clear success criteria based on precedent.

