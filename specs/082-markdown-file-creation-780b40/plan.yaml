# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 082 follows the established pattern from 65+ precedent markdown file creation
  features (063-081). The implementation is straightforward and isolated:

  1. **File Creation**: Single markdown file (test-55vda1.md) in repository root, created
     using Python pathlib with explicit encoding and line ending control
  2. **Git Integration**: Standard git workflow (add, commit, push) via subprocess system
     command invocation
  3. **No Application Code**: Feature does not modify /src/sheep/ or any application code
     (per NFR-7)

  The feature fits naturally into the test/demonstration file pattern already established
  in the repository root where 65+ similar test-*.md files reside.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen**: pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\n'

  **Rationale**:
  - Required by NFR-5 (specification explicitly requires pathlib)
  - Provides explicit, portable handling of encoding and line endings across Windows/macOS/Linux
  - Eliminates platform-specific CRLF vs. LF conversion issues
  - Clean, modern Python API vs. os.path + open() approach

  **Rejected Alternatives**:
  - os.path + open(): more verbose, requires manual encoding/newline handling
  - GitPython: violates NFR-9 (no external dependencies)
  - StringIO/in-memory buffers: unsuitable for direct disk file creation

  **Implementation Pattern**:
  ```python
  from pathlib import Path
  content = "# Title\n\nSentence one. Sentence two. Sentence three."
  Path("test-55vda1.md").write_text(content, encoding='utf-8', newline='\n')
  ```

  ### 2. Encoding & Line Ending Control

  **Chosen**: UTF-8 without BOM (via encoding='utf-8'), LF only (via newline='\n')

  **Rationale**:
  - NFR-1 requires UTF-8 without BOM; NFR-2 requires LF line endings
  - Explicit parameters prevent platform-specific conversion (e.g., CRLF on Windows)
  - pathlib automatically omits BOM when encoding='utf-8' (no 'utf-8-sig')
  - newline='\n' disables Python's default line ending conversion

  **Why Not Alternatives**:
  - Platform default encoding: unreliable, varies by system
  - Post-processing with replace(): fragile, harder to maintain
  - Git configuration (core.autocrlf): depends on user setup, not portable

  ### 3. Content Structure

  **Chosen**: `# Heading\n\n<2-3 sentences of prose>`

  **Rationale**:
  - Matches all 65+ precedent test files exactly
  - Satisfies FR-3 (H1 heading) and FR-4 (2-3 prose sentences)
  - Produces naturally 300-600 byte files (typical range)
  - Simple, predictable markdown structure per CommonMark specification
  - No complex markdown features needed

  **Topic Selection**: Implementer chooses any topic per NFR-8. Topic has zero functional
  impact on feature correctness; only structure matters.

  ### 4. Git Integration: subprocess + system git

  **Chosen**: subprocess calls to system git commands (git add, git commit, git push)

  **Rationale**:
  - NFR-9 compliance: subprocess is Python stdlib, no external dependencies
  - Standard, proven approach: used in all 65+ precedent features
  - Good error handling: subprocess.run(..., check=True) raises CalledProcessError on failure
  - Secure: list-based arguments (not shell=True) prevent command injection
  - Works across all platforms where git is installed

  **Rejected Alternatives**:
  - GitPython: external dependency (violates NFR-9)
  - pygit2: overly complex, low-level git knowledge required
  - Shell scripts: less portable, worse error handling, security concerns

  **Command Sequence**:
  1. git add test-55vda1.md
  2. git commit -m "feat(082): Create markdown file test-55vda1.md with prose content"
  3. git push origin feat/082-markdown-file-creation-780b40

  **Error Handling**: Use try/except with CalledProcessError to catch and report git failures

  ### 5. Validation Strategy

  **Chosen**: Validate after file creation, before git operations

  **Rationale**:
  - Catch file I/O errors early (encoding, line endings, content structure)
  - Prevents invalid state from being committed to git
  - Provides clear error messages before touching git state
  - Defensive programming practice

  **Validation Checks**:
  - File exists in repository root
  - Encoding is UTF-8 without BOM
  - Line endings are LF only (no CRLF)
  - Content matches pattern: H1 heading + blank line + 2-3 prose sentences
  - File size is 300-600 bytes

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**

  Create the markdown file using pathlib.write_text() with explicit encoding='utf-8' and
  newline='\n'. Immediately validate the file meets all requirements:
  - Encoding is UTF-8 (no BOM)
  - Line endings are LF only
  - Content structure matches H1 + blank line + prose pattern
  - File size falls in 300-600 byte range

  Validation occurs before any git operations to catch errors early.

  **Phase 2: Git Integration**

  Once file is validated, perform git workflow:
  1. Stage file: git add test-55vda1.md
  2. Commit: git commit with conventional message
  3. Push: git push to feature branch on origin

  Each git command checks return code and raises error on failure.

  **Phase Ordering Rationale**:
  - Phase 1 must complete first: file must exist and be valid before git can stage it
  - Phase 2 depends on Phase 1: git operations operate on the validated file
  - Simple linear dependency: no parallelization needed
  - Validation before git prevents invalid state in repository

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | File already exists (test-55vda1.md) | Medium | Low | Overwrite is acceptable; tests may be re-run. File operations are idempotent. |
  | Platform-specific line ending conversion | Very Low | Low | Explicit newline='\n' parameter prevents platform conversion; tested on Windows |
  | UTF-8 encoding issues on Windows | Very Low | Low | Explicit encoding='utf-8' ensures consistent behavior; no platform variation |
  | Git credentials not configured | Low | High | Standard git requirement; assumed pre-configured in repository environment |
  | Network failure on git push | Low-Medium | Medium | subprocess error caught and reported with clear message; can retry manually |
  | Git not installed | Very Low | High | Standard development environment requirement; assumed pre-installed |
  | Merge conflicts on push | Low | Medium | Feature branch isolation prevents conflicts; straightforward resolution if needed |
  | Invalid prose topic (not grammatically correct) | Medium | Low | Implementer responsible for prose quality; validation checks for 2-3 sentences only |

