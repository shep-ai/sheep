        selected: false
    selectionRationale: >
      Validation before git operations is recommended because it provides better error isolation
      and debugging. If file creation fails due to encoding or content issues, we detect this
      before modifying git state. This approach matches defensive programming practices and
      provides clearer error messages for troubleshooting.

  - question: 'What error handling approach should be used for git operations?'
    resolved: true
    options:
      - option: 'Check subprocess return codes; raise exceptions on non-zero status'
        description: >
          Use subprocess.run(..., check=True) to raise CalledProcessError on git command failure.
          Explicit error handling with try/except for meaningful error messages. Stops execution
          on first git operation failure.
        selected: true
      - option: 'Silent failure — assume git operations succeed'
        description: >
          Trust that git commands work; do not check return codes. Minimal error handling,
          but issues may go undetected until manual inspection.
        selected: false
      - option: 'Log warnings on failure, continue execution'
        description: >
          Check return codes but continue with subsequent operations even if one fails.
          Attempts to be fault-tolerant, but may result in incomplete/inconsistent state.
        selected: false
    selectionRationale: >
      Explicit error checking with exceptions is recommended because it ensures that if any git
      operation fails (add, commit, push), the implementation stops with a clear error message.
      This prevents partial/inconsistent state and matches standard Python error handling patterns.
      Using check=True is the simplest, most explicit approach.

  - question: 'Should the implementation include retry logic for git push (network resilience)?'
    resolved: true
    options:
      - option: 'No retry logic — single attempt per operation'
        description: >
          Attempt each git operation (add, commit, push) once. If it fails, raise an error.
          Simpler code, matches existing 65+ precedent features. Assumes network is stable.
        selected: true
      - option: 'Exponential backoff retry with configurable max attempts'
        description: >
          Retry git push up to N times with exponential backoff on failure. Handles transient
          network issues, but adds complexity and increases execution time on failure.
        selected: false
      - option: 'Fixed-delay retry with max attempts'
        description: >
          Retry git push up to N times with fixed delay between attempts. Middle ground
          between simplicity and resilience, but adds configuration burden.
        selected: false
    selectionRationale: >
      No retry logic is recommended because (1) the feature is small and isolated, (2) network
      issues are rare in typical environments, (3) 65+ precedent features use single-attempt
      approach without reported issues, (4) retry logic adds complexity without clear benefit
      for a simple file creation task. If network resilience becomes a systemic need, it should
      be addressed at the deployment/orchestration layer, not per-feature.

# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Status:** Complete

  ## Overview

  Feature 082 is a straightforward markdown file creation task following a well-established pattern
  demonstrated by 65+ preceding test files (features 063-081). The technical scope is minimal:
  create a 300-600 byte markdown file with UTF-8 encoding, LF line endings, and integrate with
  git via standard operations (add, commit, push).

  All required technologies are available in Python's standard library; no external dependencies
  are needed or allowed (per NFR-9).

  ## Technology Stack

  | Technology | Purpose | Version | Notes |
  | ---------- | ------- | ------- | ----- |
  | Python pathlib | File I/O, path operations | 3.4+ (stdlib) | Required per NFR-5; clean API for encoding/newline handling |
  | Python subprocess | Git command execution | 3.5+ (stdlib) | Standard for invoking system commands; built-in error handling |
  | Git | Version control operations | 2.0+ (system) | Already installed; used for add/commit/push workflow |
  | Python str | String manipulation | 3.11+ | For content assembly; no external libraries needed |

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python `pathlib.Path.write_text()` with explicit encoding and newline parameters

  **Rejected:**
  - `os.path + open()` — More verbose; requires manual newline handling and encoding specification; less idiomatic
  - StringIO or in-memory buffers — Designed for memory operations, not disk file creation
  - Third-party libraries (pathlib2, upath) — Unnecessary; pathlib is in stdlib since Python 3.4

  **Rationale:**
  NFR-5 explicitly requires pathlib for file I/O. The `write_text()` method provides a clean,
  modern API that handles encoding and line endings explicitly. This approach is:
  - **Portable:** Works identically across Windows, macOS, and Linux
  - **Simple:** Single method call vs. manual open/close/encoding handling
  - **Compliant:** Required by specification (NFR-5)
  - **Proven:** Demonstrated in 65+ precedent feature implementations

  Example usage:
  ```python
  from pathlib import Path

  content = "# My Title\n\nSentence one. Sentence two. Sentence three."
  Path("test-55vda1.md").write_text(content, encoding='utf-8', newline='\n')
  ```

  ### 2. Encoding and Line Ending Handling

  **Chosen:** Explicit `encoding='utf-8'` and `newline='\n'` parameters in write_text()

  **Rejected:**
  - Platform default encoding — Varies by system (UTF-8 on Linux/macOS, often CP1252 on Windows); violates NFR-1
  - Manual encode()/decode() — More verbose; error-prone; requires separate conversion step
  - Post-processing with replace() — Fragile; may not catch all CRLF vs. LF issues
  - Git configuration (core.autocrlf) — Depends on user/system git config; not portable

  **Rationale:**
  NFR-1 requires UTF-8 without BOM; NFR-2 requires LF line endings.

  - `encoding='utf-8'` ensures portable UTF-8 encoding across all platforms. pathlib's write_text()
    automatically omits BOM when encoding='utf-8' is specified (no `utf-8-sig`).

  - `newline='\n'` ensures Python writes literal `\n` characters without platform conversion.
    On Windows, without this parameter, Python would convert `\n` → `\r\n` (CRLF). By specifying
    `newline='\n'`, we disable this conversion and write LF only.

  This approach is:
  - **Explicit:** Requirements are clear in the code
  - **Portable:** Works identically on all platforms
  - **Reliable:** No dependency on system or git configuration
  - **Efficient:** No post-processing required

  ### 3. Content Structure

  **Chosen:** H1 heading (`# Title`) + blank line + 2-3 sentences of prose

  **Structure:**
  ```
  # Heading\n\n<sentence 1>. <sentence 2>. <sentence 3>.
  ```

  **Rationale:**
  - Matches all 65+ precedent test files exactly
  - Satisfies FR-3 (H1 heading on first line) and FR-4 (2-3 prose sentences)
  - Produces naturally 300-600 byte files (typical payload is 250-550 bytes)
  - Simple, predictable markdown structure per CommonMark specification
  - No special characters, code blocks, or markdown features — just heading + prose

  **Example:**
  ```markdown
  # The Art of Software Testing

  Software testing is a critical discipline that ensures applications work correctly in diverse scenarios. Through careful test design and execution, developers can catch bugs before they reach users. Comprehensive testing practices lead to more reliable, maintainable, and user-friendly software.
  ```

  ### 4. Git Integration

  **Chosen:** Subprocess calls to system `git` commands (git add, git commit, git push)

  **Command sequence:**
  ```python
  import subprocess

  # Stage file
  subprocess.run(['git', 'add', 'test-55vda1.md'], check=True)

  # Commit
  subprocess.run(
    ['git', 'commit', '-m', 'feat(082): Create markdown file test-55vda1.md with prose content'],
    check=True
  )

  # Push
  subprocess.run(['git', 'push', 'origin', 'feat/082-markdown-file-creation-780b40'], check=True)
  ```

  **Rejected:**
  - GitPython library — External dependency; violates NFR-9 (no new dependencies)
  - Direct git internals (pygit2) — Overly complex; requires low-level git knowledge
  - Shell script (os.system) — Less portable; worse error handling; security concerns with shell=True

  **Rationale:**
  - **NFR-9 Compliance:** subprocess is part of Python stdlib; introduces no external dependencies
  - **Simplicity:** Direct git commands are straightforward and well-understood
  - **Error Handling:** Using `check=True` raises CalledProcessError on command failure
  - **Portability:** Works on Windows, macOS, and Linux (assuming git is installed)
  - **Proven Pattern:** Used in 65+ precedent feature implementations
  - **Security:** Using list-based arguments (not shell=True) prevents command injection

  **Error handling:**
  ```python
  try:
    subprocess.run(['git', 'add', 'test-55vda1.md'], check=True)
    subprocess.run([...], check=True)
    subprocess.run([...], check=True)
  except subprocess.CalledProcessError as e:
    raise RuntimeError(f"Git operation failed: {e.returncode}") from e
  ```

  ### 5. Topic Selection

  **Chosen:** Implementer flexibility — select any topic appropriate for 2-3 sentences of prose

  **Rationale:**
  Product decision resolved this: NFR-8 explicitly allows "any topic chosen by the implementer"
  and the user query states "about anything". Topic selection has zero functional impact on
  feature correctness. Implementer chooses based on knowledge/preference:
  - Software/computing topics (testing, data structures, algorithms)
  - Science topics (physics, chemistry, biology)
  - General interest topics (history, geography, culture)

  The only constraint is the structure (H1 + 2-3 sentences) and encoding/line-ending requirements.
  Topic choice does not affect feature validation or test outcomes.

  ### 6. Implementation Scope

  **Chosen:** Isolated feature implementation — no modifications to /src/sheep/ or application code

  **Rationale:**
  NFR-7 explicitly forbids modifications to source code in /src/sheep/, test files, or configuration.
  Feature 082 is a demonstration feature, not part of the platform's core functionality. Implementation
  consists of:
  1. Create markdown file in repository root
  2. Stage/commit/push using git
  3. No application code modifications

  This approach matches all 65+ precedent features and ensures clean separation of test artifacts
  from production code.

  ## Library Analysis and Decisions

  | Library/Module | Purpose | Decision | Rationale |
  | -------------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O, path operations | **USE** | Required by NFR-5; clean, modern API |
  | subprocess (stdlib) | Git command execution | **USE** | Standard for invoking system commands; in stdlib |
  | os (stdlib) | Path manipulation | OPTIONAL | pathlib supersedes; use only if pathlib insufficient |
  | git/GitPython | Git operations | **REJECT** | Violates NFR-9 (no new external dependencies) |
  | pygit2 | Git internals | **REJECT** | Violates NFR-9; over-engineered for this task |
  | jinja2 | Template rendering | **REJECT** | No templates needed; over-engineered |
  | random/uuid | Content generation | **REJECT** | Hardcoded prose is simpler and more predictable |
  | json/yaml | Config/data storage | **REJECT** | No config or data files needed |

  ## Security Considerations

  ### Encoding Safety
  - **UTF-8 without BOM (NFR-1):** Specified explicitly in write_text(); no security risk
  - **LF line endings (NFR-2):** Prevents unexpected CRLF handling; ensures portable files

  ### Git Command Injection
  - **Risk:** Malicious input to git commands could trigger injection
  - **Mitigation:** Using subprocess with list-based arguments (not shell=True) prevents shell injection
  - **Context:** File naming is hardcoded (`test-55vda1.md`); no user input in git commands
  - **Assessment:** Risk is minimal; input is fixed, not user-controlled

  ### File System
  - **Path Traversal:** Filename is hardcoded (`test-55vda1.md`); no path traversal possible
  - **Permissions:** File created in repository root (writable in feature branch context)
  - **Overwrite:** May overwrite existing file if `test-55vda1.md` already exists — acceptable (tests may be re-run)

  ### Git Credentials
  - **Authentication:** Uses system git credentials (SSH keys or stored credentials)
  - **Risk:** SSH key compromise could allow malicious push
  - **Mitigation:** Feature operates within existing repository trust model; no new credentials introduced
  - **Assessment:** Standard git security model applies; no new vulnerabilities

  ## Performance Implications

  ### File Creation
  - **Latency:** Single `write_text()` call to disk (~1-5 ms on modern hardware)
  - **Impact:** Negligible for a 300-600 byte file

  ### Git Operations
  - **Latency:** Three subprocess calls (add, commit, push)
    - `git add`: ~5-10 ms (index update)
    - `git commit`: ~5-10 ms (object creation)
    - `git push`: ~100-5000 ms (depends on network and remote server latency)
  - **Bottleneck:** Network latency on git push dominates
  - **Impact:** Acceptable for a demonstration feature

  ### Memory Usage
  - **File content:** ~300-600 bytes in memory (string)
  - **Subprocess calls:** Minimal overhead (~5-10 MB for git process spawning)
  - **Overall:** Negligible memory footprint

  ### Scalability
  - **Single file creation:** No scalability concerns for one file
  - **Repeated execution:** If feature runs 1000s of times, file operations are still cheap; git push latency would remain the bottleneck
  - **Assessment:** No performance optimization needed for this task

  ## Integration Points

  ### Git Repository
  - **Integration:** Uses system git executable for all version control operations
  - **Dependencies:** Git must be installed; repository must be configured with user.name/user.email
  - **Impact:** Standard git configuration; no special setup required

  ### File System
  - **Integration:** Creates single file in repository root
  - **Dependencies:** Write permissions to repository root (guaranteed in feature branch)
  - **Impact:** Adds 1 file to repository; negligible disk usage

  ### CI/CD Pipeline (if applicable)
  - **Integration:** No direct integration; feature is isolated to file creation and git workflow
  - **Impact:** No changes to build, test, or deployment processes

  ### Application Code (/src/sheep/)
  - **Integration:** None (per NFR-7)
  - **Isolation:** Feature operates completely outside application code scope

  ## Validation Strategy

  ### Functional Validation (post-implementation)
  1. File exists: `test-55vda1.md` present in repository root
  2. Encoding: File is UTF-8 without BOM (verify with `file` command or hex inspection)
  3. Line endings: File contains LF (`\n`) only, no CRLF (verify with `od -c` or `cat -A`)
  4. Content structure: File matches pattern `# Heading\n\n<prose>` (3 parts)
  5. Prose content: Contains exactly 2-3 sentences (count sentence-ending punctuation)
  6. File size: Between 300-600 bytes (typical range)
  7. Git operations: Verify commit in `git log` with exact message
  8. Branch: Commit exists on `feat/082-markdown-file-creation-780b40`
  9. Remote: Push successful (verify `git push` output or check remote branch)

  ## Risk Assessment

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Git credentials compromised | Low | High | Use existing repo security; no new credentials introduced |
  | Network failure on push | Low-Medium | Medium | Will be caught by subprocess error; can be retried manually |
  | File already exists | Medium | Low | Overwrite is acceptable; tests may be re-run |
  | Git not installed | Very Low | High | Standard requirement; assumed pre-installed |
  | Encoding mismatch on Windows | Very Low | Low | Explicit UTF-8 encoding specified; no platform variation |
  | Line ending mismatch | Very Low | Low | Explicit `newline='\n'` parameter; no platform variation |

  **Overall Assessment:** Low risk. Feature uses standard tools, no novel security concerns.

  ## Conclusion

  Feature 082 markdown file creation is a straightforward task with well-established patterns
  from 65+ precedent features. Technical decisions are minimal:

  - **File I/O:** Use pathlib.write_text() with explicit encoding='utf-8' and newline='\n'
  - **Content:** H1 heading + blank line + 2-3 prose sentences
  - **Git Integration:** Subprocess calls to git add/commit/push with error checking
  - **Scope:** Isolated from /src/sheep/; no application code modifications

  All technologies are in Python's standard library; no external dependencies required.
  Implementation complexity is minimal; estimated 10-15 minutes of work.

  Ready for implementation phase.

