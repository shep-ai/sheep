# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-x1h34c.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 150+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 151-155, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-x1h34c.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is between 400-600 bytes (typical range for this pattern)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git with `git add test-x1h34c.md`
  - [ ] Git commit exists on the current branch with exact message: `feat(156): Create markdown file test-x1h34c.md with prose content`
  - [ ] Commit is on the feature branch `feat/156-markdown-file-creation-aa5012`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-x1h34c.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct English
  - **FR-6**: File must be staged in git using the command `git add test-x1h34c.md`
  - **FR-7**: File must be committed with the exact message: `feat(156): Create markdown file test-x1h34c.md with prose content`
  - **FR-8**: Commit must be created on the current feature branch `feat/156-markdown-file-creation-aa5012`
  - **FR-9**: Committed changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: File size should typically be 400-600 bytes (guideline, not a strict limit)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification version 0.30 or later
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 150+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files (specs/ directory excluded)
  - **NFR-8**: Prose topic may be any subject chosen by the implementer (explicitly flexible per user query "about anything")
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose topic selection be flexible or predetermined? | Implementer chooses freely | User query explicitly states "about anything"; 150+ existing test files have diverse topics; maximizes implementer autonomy |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-x1h34c.md) to existing collection of 150+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-155; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/156-markdown-file-creation-aa5012` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 150+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes of work)

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 150+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-155) demonstrate efficient execution in 10-15 minutes

  ## Acceptance Criteria Verification

  All success criteria listed above are measurable and testable:
  - File existence and location can be verified with filesystem checks
  - Markdown syntax and structure can be validated via parsing or manual review
  - Encoding and line endings can be verified with hexdump or text editor checks
  - File size can be measured with standard filesystem utilities
  - Git status can be verified with `git show`, `git log`, and `git push` confirmation
  - All requirements map directly to success criteria with no ambiguity

