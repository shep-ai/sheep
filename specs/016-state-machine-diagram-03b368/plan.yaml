# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The repository contains five standalone state machine markdown files at the root:
  STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md,
  TURNSTILE_STATE_MACHINE.md, and ELEVATOR_STATE_MACHINE.md. Each follows the same
  three-part structure: H1/H2 heading → one-sentence prose description → fenced
  Mermaid stateDiagram-v2 block. ATM_STATE_MACHINE.md slots directly into this
  pattern without modifying any existing file or configuration.

  ## Key Design Decisions

  **File naming:** `ATM_STATE_MACHINE.md` at the repo root — SCREAMING_SNAKE_CASE
  matches all five peers exactly. No subdirectory, no lowercase variant.

  **Diagram syntax:** `stateDiagram-v2` — used by every existing example; renders
  natively on GitHub; supports [*] initial-state notation and labeled transitions.

  **State set:** 5 states (Idle → CardInserted → PINEntry → Authenticated →
  DispensingCash) plus cancel arcs from CardInserted and PINEntry back to Idle.
  This satisfies the 3–7 state requirement, stays within 20–40 lines (NFR-1), and
  maps to the universally known ATM flow without over-engineering.

  ## Implementation Strategy

  Single phase, single task: write the file. No setup, no dependencies, no build
  changes. The file is ready to commit as soon as it passes the acceptance criteria.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Mermaid syntax error (e.g. missing quotes on multi-word labels) | Keep state names single-word; transition labels short and simple |
  | File line count outside 20–40 range | Target ~28 lines; count before marking task complete |
  | Domain overlap with existing files | ATM confirmed distinct from all five existing examples |
