name: state-machine-diagram-03b368
summary: >
  This feature requires only a new markdown file at the repo root following the established
  SCREAMING_SNAKE_CASE convention with a Mermaid stateDiagram-v2 block. No libraries,
  dependencies, or code changes are needed. The ATM domain was chosen as it produces a clean
  5-state linear flow that is universally familiar and distinct from all existing examples.

relatedFeatures: []

technologies:
  - Markdown
  - Mermaid stateDiagram-v2

relatedLinks:
  - https://mermaid.js.org/syntax/stateDiagram.html

decisions:
  - title: 'File Naming Convention'
    chosen: 'ATM_STATE_MACHINE.md at the repository root'
    rejected:
      - 'Lowercase name (e.g. atm_state_machine.md) — breaks the SCREAMING_SNAKE_CASE convention used by all five existing files'
      - 'Nested in a subdirectory — all existing examples live at the root; nesting would be inconsistent'
    rationale: >
      Every existing state machine file (STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md,
      VENDING_MACHINE_STATE_MACHINE.md, TURNSTILE_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md)
      uses SCREAMING_SNAKE_CASE at the repo root. ATM_STATE_MACHINE.md follows this pattern
      exactly and requires zero convention changes.

  - title: 'Mermaid Diagram Syntax Version'
    chosen: 'stateDiagram-v2'
    rejected:
      - 'stateDiagram (v1) — deprecated, produces less readable output, and all existing files already use v2'
      - 'flowchart/graph syntax — not a state diagram; semantically wrong for modelling states and transitions'
    rationale: >
      All existing examples use stateDiagram-v2. It supports clean [*] initial state notation,
      labeled transitions, and renders correctly on GitHub. No reason to deviate.

  - title: 'ATM State Set'
    chosen: '5-state model: Idle, CardInserted, PINEntry, Authenticated, DispensingCash — with cancel arcs back to Idle'
    rejected:
      - '3-state minimal model (Idle/Active/Done) — too generic, loses the domain specificity that makes the example educational'
      - '8+ state detailed model — violates the NFR-1 brevity constraint (20-40 lines) and the "short" user requirement'
    rationale: >
      Five meaningful states map cleanly to the real ATM flow everyone knows. Each state has
      at least one inbound and one outbound transition. Adding Cancel arcs from CardInserted
      and PINEntry back to Idle keeps the diagram realistic without inflating it beyond ~35 lines,
      satisfying the 3-7 state requirement from the spec.

openQuestions: []

content: |
  ## Technology Decisions

  ### 1. File Naming Convention

  **Chosen:** `ATM_STATE_MACHINE.md` at the repository root

  **Rejected:**
  - Lowercase name — breaks SCREAMING_SNAKE_CASE used by all existing files
  - Subdirectory placement — all peers live at root; nesting adds friction with no benefit

  **Rationale:** Zero-deviation from the established convention maximises consistency.

  ### 2. Mermaid Diagram Syntax Version

  **Chosen:** `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` (v1) — deprecated, all existing files use v2
  - `flowchart` syntax — semantically incorrect for state machines

  **Rationale:** All five existing examples use stateDiagram-v2; consistent with the codebase.

  ### 3. ATM State Set

  **Chosen:** 5-state model: Idle → CardInserted → PINEntry → Authenticated → DispensingCash, with Cancel arcs back to Idle

  **Rejected:**
  - 3-state minimal model — too generic, misses ATM's recognisable flow
  - 8+ state detailed model — violates brevity NFR and the "SUPER FAST / short" user request

  **Rationale:** Five states hit the sweet spot between realism and conciseness, satisfying
  the 3-7 state requirement from the spec and fitting comfortably within 20-40 lines.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid (stateDiagram-v2) | State diagram rendering | Use | Already used by all existing files; renders natively on GitHub |
  | Any JS/Python library | N/A | Reject | Pure markdown file; no runtime dependencies needed |

  ## Security Considerations

  None. A static markdown file with a Mermaid diagram block carries no security implications —
  it is not executed, does not accept input, and does not interact with any system.

  ## Performance Implications

  None. A ~30-line markdown file adds negligible repository size and has no runtime footprint.
  GitHub renders Mermaid diagrams client-side with no server-side processing.

  ## Architecture Notes

  This feature is purely additive: one new file at the repo root, no existing files modified,
  no dependencies introduced, no build or CI changes required. It slots directly into the
  existing pattern of standalone state machine documentation files.
