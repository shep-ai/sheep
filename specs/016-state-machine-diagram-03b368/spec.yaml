content: |
  ## Problem Statement

  The repository contains several state machine diagram examples (traffic light, door lock,
  vending machine, turnstile, elevator). This feature adds one more short, simple example
  as a standalone markdown file — no connection to the repo's main codebase required.

  ## Codebase Analysis

  ### Project Structure

  The repo root holds standalone markdown files for state machine examples:
  - `STATE_MACHINE.md` — traffic light
  - `DOOR_LOCK_STATE_MACHINE.md` — door lock
  - `VENDING_MACHINE_STATE_MACHINE.md` — vending machine
  - `TURNSTILE_STATE_MACHINE.md` — turnstile
  - `ELEVATOR_STATE_MACHINE.md` — elevator

  All follow the same pattern: a heading, brief description, and a Mermaid `stateDiagram-v2`
  block showing states and transitions.

  ### Architecture Patterns

  Pure documentation — no source code involved. Each file is a self-contained markdown
  document in the repo root.

  ### Relevant Technologies

  - **Markdown** — file format
  - **Mermaid stateDiagram-v2** — diagram syntax used across all existing examples

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new `.md` file) | Low | Adds one new standalone markdown file, no existing files changed |

  ## Dependencies

  None. Purely a new markdown file following existing conventions.

  ## Size Estimate

  **S** — Single markdown file, ~20-30 lines. Minutes of work.
