# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository contains several state machine diagram examples (traffic light, door lock,
  vending machine, turnstile, elevator). This feature adds one more short, simple example
  as a standalone markdown file — no connection to the repo's main codebase required.

  ## Success Criteria

  - [ ] A new markdown file named `<DOMAIN>_STATE_MACHINE.md` exists at the repo root
  - [ ] The file contains exactly one `stateDiagram-v2` Mermaid code block
  - [ ] The diagram defines at least 3 and no more than 7 states
  - [ ] Every state has at least one transition (no orphan states)
  - [ ] The diagram renders without errors in standard Mermaid renderers
  - [ ] The file includes a one-sentence prose description above the diagram
  - [ ] The chosen domain is not already covered by an existing example file
  - [ ] No existing files are modified

  ## Functional Requirements

  - **FR-1**: A new file `<DOMAIN>_STATE_MACHINE.md` must be created at the repository root.
  - **FR-2**: The file must contain a level-1 or level-2 Markdown heading that names the state machine.
  - **FR-3**: The file must contain a one-sentence description of what the state machine models.
  - **FR-4**: The file must contain a fenced Mermaid code block using `stateDiagram-v2` syntax.
  - **FR-5**: The diagram must show all meaningful states of the chosen domain with labeled transitions between them.
  - **FR-6**: The diagram must include an `[*]` initial state transition to indicate the start state.
  - **FR-7**: The chosen domain must be different from: traffic light, door lock, vending machine, turnstile, elevator.

  ## Non-Functional Requirements

  - **NFR-1**: The file must be 20–40 lines long (brevity — "short diagram" as requested).
  - **NFR-2**: Mermaid syntax must be valid and render correctly in GitHub's Mermaid renderer.
  - **NFR-3**: State and transition labels must be written in plain English, readable without domain expertise.
  - **NFR-4**: The file must use the `SCREAMING_SNAKE_CASE` naming convention consistent with all existing example files.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which domain for the new example? | ATM / bank machine | Universally familiar, ~5 clear states, completely distinct from all existing examples |
  | 2 | Include prose description above diagram? | Yes — one sentence | Matches all existing files; adds one line, maximises consistency |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new `.md` file) | Low | Adds one new standalone markdown file, no existing files changed |

  ## Dependencies

  None. Purely a new markdown file following existing conventions.

  ## Size Estimate

  **S** — Single markdown file, ~25-35 lines. Minutes of work.
