content: |
  ## Summary

  This feature breaks down into two sequential phases:

  **Phase 1: File Creation** — Write test-4ylnjw.md using Python pathlib with explicit
  UTF-8 encoding and Unix LF line endings. Content: one markdown H1 heading, blank line,
  then 2-3 sentences of prose (estimated 5 minutes).

  **Phase 2: Git Workflow** — Stage the file with `git add`, commit with conventional
  commit message `feat(113): create markdown file test-4ylnjw.md with prose content`,
  and push to remote origin on the feature branch (estimated 10 minutes).

  **Total effort**: 15 minutes across both phases.

  ### Task Ordering Rationale

  Task 1 (file creation) must complete before Task 2 (git workflow) because git operations
  depend on the file existing. No parallelization is possible.

  ### Implementation Notes

  - **Prose topic**: Flexible — any topic is acceptable per spec ("about anything")
  - **File location**: Repository root only (no subdirectories)
  - **Encoding**: Explicit `encoding='utf-8'` prevents BOM on all platforms
  - **Line endings**: Explicit `newline='\n'` ensures LF on Windows, Linux, macOS
  - **Git message**: Must match exactly — this is the conventional commit format
  - **Branch**: Feature branch `feat/113-markdown-file-creation-101225` (pre-created)
