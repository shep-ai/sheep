      Spec requires UTF-8 without BOM (NFR-1). Python's pathlib.write_text(encoding='utf-8') produces UTF-8 without BOM by
      default (only UTF-16/UTF-32 with BOM). Explicit encoding parameter makes intent clear, ensures portability across
      platforms, and prevents accidental system-default encoding on Windows (which could be cp1252). No manual BOM handling
      needed — Python handles this correctly.

