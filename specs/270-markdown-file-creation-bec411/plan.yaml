content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-29
  - **Size Estimate:** S (1-4 hours)
  - **Complexity:** Low — pure orchestration, no new patterns

  ## Architecture Overview

  Feature 270 integrates into the Sheep platform using the established pattern from features 001-269.
  The implementation is pure orchestration: call 5 stable, tested functions from sheep.content_generators
  in a specific sequence, with structured logging at each step and error handling at the top level.

  **Integration Points:**
  1. **Content Generation:** `sheep.content_generators.generate_markdown_content()`
     - Calls `sheep.config.llm.get_reasoning_llm()` to access Claude API
     - Returns validated content (H1 heading + 2-3 prose sentences)

  2. **File I/O:** `sheep.content_generators.write_markdown_file()`
     - Writes to disk with UTF-8 encoding, LF line endings, trailing newline
     - Located at repository root via Path.cwd() / filename

  3. **Validation:** `sheep.content_generators.validate_markdown_file()`
     - Strict validation: H1 format, blank line, sentence count, encoding, line endings
     - Fail-fast: raises ValueError on any violation

  4. **Git Commit:** `sheep.content_generators.commit_markdown_file()`
     - Stages file via `git add`
     - Commits with conventional message: `feat(270): create markdown file test-6jsp8a.md with prose content`

  5. **Git Push:** `sheep.content_generators.push_markdown_file()`
     - Pushes to remote origin on feature branch
     - Confirms push success

  **Module Pattern (following feature_267):**
  - Location: `src/sheep/features/feature_270_markdown_file_creation.py`
  - Module-level constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME
  - Public function: `create_feature_270_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  - Returns dictionary with: filepath, content, commit_message, push_result
  - All steps logged via structlog with _logger.info() for success, _logger.error() for failures

  ## Key Design Decisions

  ### 1. Orchestration Pattern: Reuse Existing Functions
  **Decision:** Call individual functions from sheep.content_generators directly

  **Rationale:**
  - `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`,
    `commit_markdown_file()`, and `push_markdown_file()` are stable, tested infrastructure
  - Used successfully by all 269 prior features with zero reported failures
  - Avoids code duplication, reduces testing burden, ensures consistency
  - Feature 267 reference implementation uses this exact pattern
  - Fail-fast error handling is already implemented in each function

  ### 2. LLM Model Selection: get_reasoning_llm()
  **Decision:** Use `sheep.config.llm.get_reasoning_llm()` with temperature=0.2

  **Rationale:**
  - Temperature=0.2 (reasoning LLM) produces higher-quality, more coherent prose
  - Temperature=0.3 (fast LLM) introduces more randomness, lower quality
  - For meaningful content generation, reasoning_llm is the correct choice
  - All 269 prior features use this model successfully

  ### 3. File I/O Library: pathlib
  **Decision:** Use `pathlib.Path` for all filesystem operations

  **Rationale:**
  - Modern Python standard (3.4+), already used throughout the codebase
  - Type-safe operations, cross-platform path handling, intuitive API
  - `Path.write_text(encoding='utf-8')` handles UTF-8 without manual file management

  ### 4. Filename Configuration: Hardcoded
  **Decision:** Set `MARKDOWN_FILENAME = "test-6jsp8a.md"` as a module constant

  **Rationale:**
  - Feature 267 reference implementation hardcodes the filename
  - Each feature number maps to exactly one filename
  - Function signature: `create_feature_270_markdown_file(repo_path: str | None = None)`

  ### 5. Validation Strategy: Strict Fail-Fast
  **Decision:** Call `validate_markdown_file()` before write; fail on any violation

  **Rationale:**
  - Feature specification explicitly requires strict validation (FR-5)
  - All 269 prior features use strict validation for guaranteed consistency
  - Test automation requires fail-fast approach

  ### 6. Commit Message Format: Feature-Specific
  **Decision:** `feat(270): create markdown file test-6jsp8a.md with prose content`

  **Rationale:**
  - Feature 267 uses this pattern: feature number for traceability
  - Conventional commit format is standard across codebase
  - Links commit to specification for auditing and debugging

  ### 7. Error Handling: Delegate to Infrastructure
  **Decision:** Let content_generators functions raise exceptions; catch at orchestration level

  **Rationale:**
  - Each function owns its domain and implements proper error handling
  - Avoids duplication of error handling logic
  - Clear separation of concerns

  ### 8. Retry Logic: CrewAI/Anthropic SDK Built-in
  **Decision:** Rely on CrewAI wrapper and Anthropic SDK for transparent retry handling

  **Rationale:**
  - NFR-4 specifies: \"maximum 3 attempts with exponential backoff (1s, 2s, 4s delays)\"
  - SDK implements this automatically
  - No custom implementation needed

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (Foundation & Module Setup)** — First
     - Creates the module file structure that subsequent phases build upon
     - No dependencies; establishes the foundation for all following work

  2. **Phase 2 (Content Generation & File Persistence)** — Second
     - Implements core content generation and file writing
     - Depends on: Phase 1 module structure

  3. **Phase 3 (Validation & Git Integration)** — Third
     - Implements validation and git operations
     - Depends on: Phase 2 (file must exist before validation/commit)

  4. **Phase 4 (Integration & End-to-End Validation)** — Fourth
     - Orchestrates all steps in the feature function
     - Depends on: Phases 1-3 (all individual steps must work)

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Claude API unavailable | Low (1%) | High | Retry logic with exponential backoff (3 attempts, 1s/2s/4s delays). Descriptive error if all retries fail. |
  | File already exists | Very Low (0.1%) | High | `write_markdown_file()` checks for existing file and raises IOError if present. Fail-fast. |
  | Git operations fail | Low (2%) | High | Established functions with proper git error handling. Descriptive error messages. |
  | UTF-8 encoding error | Very Low (0.01%) | High | `validate_markdown_file()` checks UTF-8. `write_markdown_file()` enforces UTF-8 explicitly. |
  | Generated content invalid | Low (2%) | High | `validate_markdown_file()` enforces strict requirements. Feature fails with descriptive error if violated. |
  | Feature module import error | Very Low (0.5%) | High | Phase 1 tests verify module imports correctly. Early detection prevents downstream failures. |

  ## Success Criteria

  The implementation is complete when:
  - ✓ Feature module `src/sheep/features/feature_270_markdown_file_creation.py` exists
  - ✓ `create_feature_270_markdown_file()` function orchestrates 5 steps correctly
  - ✓ File `test-6jsp8a.md` created at repository root with H1 heading + 2-3 sentences
  - ✓ Content generated via Claude API (not hardcoded)
  - ✓ File validates successfully (UTF-8, LF line endings, trailing newline)
  - ✓ Git commit created with message: `feat(270): create markdown file test-6jsp8a.md with prose content`
  - ✓ Commit pushed to `origin/feat/270-markdown-file-creation-bec411`
  - ✓ All operations logged via structlog for observability
  - ✓ All tests pass (TDD cycles verified)
