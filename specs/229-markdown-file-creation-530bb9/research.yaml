content: |
  ## Research Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-26
  - **Confidence:** High — established pattern from 150+ prior implementations

  ## Overview

  This feature creates a single markdown file (`test-c1ds43.md`) following a well-established pattern.
  All product decisions are finalized. Technical research validates the approach and rejects inferior alternatives.

  ## Technology Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-c1ds43.md').write_text(content, encoding='utf-8', newline='\n')`

  **Why not open()?**
  The classic `open()` function requires explicit mode handling, manual encoding specification, and close operations.
  pathlib is more concise, idiomatic, and handles all edge cases.
  For example:
  ```python
  # ❌ open() approach
  with open('test-c1ds43.md', 'w', encoding='utf-8', newline='\n') as f:
    f.write(content)

  # ✅ pathlib approach
  Path('test-c1ds43.md').write_text(content, encoding='utf-8', newline='\n')
  ```

  **Critical parameters:**
  - `encoding='utf-8'` — Python's utf-8 codec writes pure UTF-8 without BOM
  - `newline='\n'` — Forces Unix LF line endings regardless of platform (overrides Windows CRLF default)

  These parameters are essential for spec compliance (NFR-1, NFR-2).

  ### 2. Git Integration: subprocess with list arguments

  **Chosen:** `subprocess.run(['git', 'add', 'test-c1ds43.md'], check=True)`

  **Why not GitPython or shell strings?**
  GitPython adds an external dependency for trivial operations. Raw shell strings (`shell=True` or `os.system()`) are vulnerable to command injection.
  Subprocess with list arguments is the safe standard:
  - No command injection possible (arguments are atomic)
  - No external dependencies
  - Built into Python stdlib
  - Matches best practices

  **Git workflow:**
  ```python
  subprocess.run(['git', 'add', 'test-c1ds43.md'], check=True)
  subprocess.run([
    'git', 'commit', '-m',
    'feat(229): create markdown file test-c1ds43.md with prose content'
  ], check=True)
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  The `check=True` parameter raises CalledProcessError if git operations fail, providing clear error reporting.

  ### 3. Text Encoding: UTF-8 without BOM

  **Chosen:** Python's default 'utf-8' codec (no BOM)

  **Why not UTF-8-sig?**
  UTF-8-sig adds an unnecessary byte order mark (3 bytes: `EF BB BF`). BOM is unnecessary for UTF-8 and can cause issues:
  - Some markdown parsers interpret BOM as part of content
  - Increases file size unnecessarily
  - Not compatible with markdown spec expectations
  - All 90+ existing test files use UTF-8 without BOM

  **Verification:** Post-creation validation checks that file does not contain BOM bytes.

  ### 4. Line Endings: Unix LF across all platforms

  **Chosen:** `newline='\n'` parameter ensures Unix LF everywhere

  **Why not platform-native?**
  Python defaults to platform-native line endings (CRLF on Windows, LF on Unix).
  This causes repository inconsistency:
  - Files created on Windows have CRLF
  - Files created on Unix have LF
  - Git diffs show every line changed when switching platforms
  - CI/CD becomes non-deterministic

  **Solution:** The `newline='\n'` parameter forces Unix LF unconditionally.
  This ensures identical files regardless of platform (critical for CI/CD).
  All 90+ test files use Unix LF, validating this approach.

  ### 5. Validation Approach: Comprehensive post-write checks

  **Chosen:** Read file after writing and verify:
  1. File exists and is readable
  2. Content starts with `# ` (H1 heading in markdown)
  3. File contains 2-3 sentences (basic sentence count)
  4. File encoding is valid UTF-8 without BOM
  5. File uses Unix LF line endings (no CRLF)
  6. File size is approximately 400-600 bytes (natural for format)

  **Validation code outline:**
  ```python
  path = Path('test-c1ds43.md')
  content = path.read_text(encoding='utf-8')

  # Check H1 heading
  assert content.startswith('# '), 'Missing H1 heading'

  # Count sentences (simplified: split on '.', '!', '?')
  sentences = sum(1 for char in content if char in '.!?')
  assert 2 <= sentences <= 3, f'Expected 2-3 sentences, found {sentences}'

  # Check line endings
  assert '\r\n' not in content, 'Found CRLF line endings (should be LF)'

  # Check file size
  file_size = path.stat().st_size
  assert 400 <= file_size <= 600, f'File size {file_size} outside expected 400-600 bytes'
  ```

  This validation catches platform-specific issues before pushing to remote.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib | File I/O | **Use** | Python 3.11+ stdlib, modern standard for path operations and text file I/O, safe encoding/newline handling |
  | subprocess | Git operations | **Use** | Python 3.11+ stdlib, safe for command execution with list arguments (no injection), no external deps |
  | markdown parser (markdown-it, mistune, etc.) | Markdown validation | **Reject** | Overkill for simple H1+prose validation, adds external dependency, basic validation is trivial to implement inline |
  | GitPython | Git operations | **Reject** | External dependency not needed for 3 simple git commands, increases attack surface, not aligned with spec NFR-4 |
  | os.system() or shell=True | Git operations | **Reject** | Security risk (command injection), never use for external commands, subprocess with list args is always safer |

  ## Security Considerations

  ### Command Injection Prevention
  ✅ **Safe:** `subprocess.run(['git', 'add', 'test-c1ds43.md'], check=True)`
  Subprocess with list arguments cannot be exploited for command injection.
  Each element is an atomic argument, not subject to shell interpretation.

  ❌ **Unsafe:** `subprocess.run('git add test-c1ds43.md', shell=True, check=True)`
  Shell interpretation allows injection. Never use this pattern.

  ### Encoding Security
  ✅ **Safe:** UTF-8 without BOM
  Pure UTF-8 is well-defined and not susceptible to encoding-based attacks.
  BOM absence prevents confusion in some parsing scenarios.

  ❌ **Risky:** Mixed encodings or platform-specific encodings
  Can cause encoding-based vulnerabilities or content misinterpretation.

  ### File Permissions
  ✅ **Acceptable:** Default file permissions from pathlib.write_text()
  For test markdown files in a repository, no special permissions needed.
  File will be readable/writable by repository owner, appropriate for collaborative development.

  ### Input Validation
  ✅ **Addressed:** No user input in this feature
  File path and content are hardcoded (test-c1ds43.md with specified prose).
  No user-supplied input means no injection vectors.

  ## Performance Implications

  ✅ **Negligible impact** — this is a trivial I/O operation:

  - Single pathlib.write_text() call: ~1ms
  - Single pathlib.read_text() call for validation: ~1ms
  - Three git subprocess calls: ~100-500ms (network-bound, not CPU-bound)
  - Total time: ~500ms actual execution, 3-5 minutes with prose composition

  No caching needed. No optimization possible. No scaling concerns.

  ## Architecture Notes

  ### Fit into existing patterns
  This feature follows the exact pattern of 150+ prior implementations (features 069-228):
  - Uses Python pathlib for file creation
  - Uses git subprocess for version control
  - Creates test markdown file at repository root
  - Follows commonmark markdown format
  - Validates UTF-8 encoding and Unix line endings

  ### Repository structure
  Fits naturally into the test file pattern:
  ```
  /repo
    test-*.md (90+ existing test files)
    test-c1ds43.md (this feature)
    ...
  ```

  ### No application code impact
  This feature is purely additive:
  - No changes to src/sheep/ code
  - No changes to dependencies
  - No changes to CI/CD configuration
  - No changes to build system
  - No breaking changes

  Specification compliance:
  ✅ NFR-1: UTF-8 without BOM
  ✅ NFR-2: Unix LF line endings
  ✅ NFR-3: pathlib.Path.write_text() with encoding and newline params
  ✅ NFR-4: Git CLI via subprocess (no external git deps)
  ✅ NFR-5: CommonMark compliance (validated by post-write checks)
  ✅ NFR-6: Follows established pattern from 150+ implementations
  ✅ NFR-7: Pure additive, no application code changes
  ✅ NFR-8: No temporary files or side effects

  ## Risk Assessment

  **Risk Level:** ✅ Very Low

  - Feature scope is trivial (single file creation)
  - Technology choices are standard and well-tested
  - No external dependencies introduced
  - No breaking changes
  - All decisions validated by 150+ prior implementations
  - Comprehensive validation catches issues early
  - Git workflow is standard and reversible (can easily revert with `git reset`)

  ## Conclusion

  The technical approach is sound and well-established:
  1. **pathlib** is the modern, safe approach for file creation
  2. **subprocess with list args** is the secure standard for git integration
  3. **UTF-8 without BOM + Unix LF** ensures cross-platform consistency
  4. **Comprehensive validation** catches issues before pushing
  5. **No external dependencies** keeps the implementation simple and maintainable

  This feature is ready for implementation. All technology decisions follow best practices and are validated by 150+ prior implementations with identical patterns.

