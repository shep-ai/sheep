content: |
  ## Problem Statement

  Create a single markdown file named `test-c1ds43.md` in the repository root containing an H1 title and 2-3 sentences of prose content. This is a straightforward file creation task that follows an established pattern validated across 150+ prior implementations (features 069-228). The feature is additive, isolated, and requires no application code changes.

  ## Success Criteria

  - [ ] File `test-c1ds43.md` exists at repository root
  - [ ] File contains exactly one H1 heading (#) at the start
  - [ ] Blank line separates heading from prose content
  - [ ] File contains exactly 2-3 sentences of contextually relevant prose
  - [ ] File encoding is UTF-8 without BOM
  - [ ] File uses Unix LF line endings (\n) on all platforms
  - [ ] File is added to git staging area
  - [ ] Commit with message "feat(229): create markdown file test-c1ds43.md with prose content" exists in git history
  - [ ] Commit is pushed to remote on feature branch `feat/229-markdown-file-creation-530bb9`
  - [ ] File size is approximately 400-600 bytes (natural result of format compliance)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-c1ds43.md` at the repository root using Python `pathlib.Path`
  - **FR-2**: File must contain a single H1 heading using markdown syntax (#)
  - **FR-3**: File must contain exactly 2-3 sentences of contextually relevant prose following a blank line after the heading
  - **FR-4**: Stage the created file in git using `git add test-c1ds43.md`
  - **FR-5**: Commit the file with message "feat(229): create markdown file test-c1ds43.md with prose content"
  - **FR-6**: Push the commit to remote on the feature branch using `git push -u origin HEAD`
  - **FR-7**: Verify file creation and format compliance before pushing (validate encoding, line endings, structure)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (no byte order mark)
  - **NFR-2**: Line endings must be Unix LF (\n) regardless of platform (prevents CRLF on Windows)
  - **NFR-3**: Use Python standard library `pathlib.Path.write_text()` with explicit encoding and newline parameters
  - **NFR-4**: Use Git CLI via Python `subprocess` module with no external git dependencies (e.g., GitPython)
  - **NFR-5**: File format must comply with CommonMark Markdown specification
  - **NFR-6**: Implementation must follow the established pattern from 150+ prior implementations (features 069-228)
  - **NFR-7**: No application code modifications; feature is purely additive at repository root level
  - **NFR-8**: Implementation must not create any temporary files or side effects outside the target file and git operations

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | --------- | --------- |
  | 1 | Should prose content be contextually relevant or generic templated text? | Contextually relevant prose | Matches established pattern from 150+ implementations; demonstrates natural language quality; validates feature across diverse content rather than mechanical checkbox |
  | 2 | Should we validate file format compliance after creation? | Yes, comprehensive validation | Ensures UTF-8 and LF compliance on all platforms; catches encoding/line-ending issues early; matches quality standards of prior implementations |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | High | Single markdown file created at root level alongside 90+ existing test files (test-*.md) |
  | Git Repository | Medium | Standard add/commit/push workflow; feature branch already created; no configuration changes |
  | Application Code (src/sheep/) | None | Feature is isolated; no source code modifications required |

  ## Dependencies

  **External Dependencies:**
  - None. Feature uses only Python standard library (pathlib, subprocess) and system git CLI.

  **Internal Dependencies:**
  - Feature branch `feat/229-markdown-file-creation-530bb9` (pre-created and current)
  - Git repository properly initialized and on feature branch
  - Repository root is writable
  - System git CLI available in PATH

  **Validation Dependencies:**
  - 150+ prior implementations (features 069-228) validate the pattern
  - 90+ existing test markdown files validate the format, encoding, and line ending standards

  ## Implementation Approach

  ### File Creation

  Use Python `pathlib.Path` with explicit UTF-8 encoding and LF line ending enforcement:

  ```python
  from pathlib import Path

  path = Path('test-c1ds43.md')
  content = '# Title\n\nSentence one introducing the topic. Sentence two providing context and detail. Sentence three concluding the thought.'
  path.write_text(content, encoding='utf-8', newline='\n')
  ```

  **Design Decisions:**
  - `encoding='utf-8'` → UTF-8 without BOM (Python's utf-8 codec does not write BOM by default)
  - `newline='\n'` → Unix-style LF line endings regardless of platform (overrides Windows CRLF default)
  - Pattern proven across all 150+ existing test files

  ### Markdown Format

  Follow established pattern from 150+ prior implementations:

  ```markdown
  # Title Here

  First sentence introducing the topic. Second sentence providing context and detail.
  Third sentence concluding the thought or providing additional perspective.
  ```

  **Format Requirements:**
  - Single H1 heading using `#` syntax
  - Blank line between heading and prose
  - 2-3 sentences of prose with contextually appropriate content
  - UTF-8 encoding without BOM
  - Unix LF line endings
  - Naturally produces 400-600 byte file size

  ### Git Workflow

  Standard feature workflow via Python subprocess:

  ```python
  import subprocess

  subprocess.run(['git', 'add', 'test-c1ds43.md'], check=True)
  subprocess.run([
    'git', 'commit', '-m',
    'feat(229): create markdown file test-c1ds43.md with prose content'
  ], check=True)
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  ## Size Estimate

  **S** (Small — 10-15 minutes total effort)

  **Justification:**
  - Trivial feature with zero technical complexity
  - Established pattern across 150+ prior implementations
  - All product and technical decisions determined
  - Implementation is mechanical: pathlib.Path().write_text() + 3 git subprocess calls + format validation
  - File format fully validated by 90+ existing test files
  - Commit message pre-specified
  - Estimated breakdown:
    - Prose composition (contextually relevant): 3-5 minutes
    - File creation with pathlib: 1-2 minutes
    - Post-creation validation: 2-3 minutes
    - Git workflow (add/commit/push): 2-3 minutes

  ## Implementation Readiness

  ✓ All functional and non-functional requirements fully specified
  ✓ Product decisions (prose quality, validation scope) determined with AI recommendations
  ✓ Format validated by 90+ existing test files
  ✓ No external dependencies required (Python stdlib only)
  ✓ No security concerns identified
  ✓ No performance concerns
  ✓ Feature branch ready (feat/229-markdown-file-creation-530bb9)
  ✓ Zero architectural impact
  ✓ Complete precedent from 150+ prior implementations

  **Status:** Ready for implementation phase.

