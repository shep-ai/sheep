# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows an established pattern validated across 150+ prior implementations (features 069-228).
  The implementation is mechanically simple but requires careful attention to encoding and line ending consistency
  to ensure cross-platform reproducibility.

  ### Pattern Baseline

  The feature fits into the existing test file pattern at repository root:
  ```
  /repo
    test-c1ds43.md (new — this feature)
    test-*.md (90+ existing test files following identical pattern)
  ```

  All test files follow the same structure:
  - Single H1 heading (markdown syntax: `#`)
  - Blank line separator
  - 2-3 sentences of contextually appropriate prose
  - UTF-8 encoding without BOM
  - Unix LF line endings
  - Size approximately 400-600 bytes

  ### Implementation Architecture

  ```
  1. Compose Prose Content
     ↓
  2. Create test-c1ds43.md using pathlib.Path.write_text()
     ├─ encoding='utf-8' (no BOM by default)
     └─ newline='\n' (Unix LF on all platforms)
     ↓
  3. Validate File Format & Compliance
     ├─ Check file exists and is readable
     ├─ Verify H1 heading with regex
     ├─ Count sentences (2-3 required)
     ├─ Verify UTF-8 encoding (no BOM)
     ├─ Verify Unix LF line endings (no CRLF)
     └─ Verify file size (400-600 bytes)
     ↓
  4. Git Workflow via subprocess
     ├─ git add test-c1ds43.md
     ├─ git commit -m "feat(229): create markdown file test-c1ds43.md with prose content"
     └─ git push -u origin HEAD
  ```

  ### No Application Code Impact

  This feature is purely additive:
  - No changes to src/sheep/ application code
  - No changes to dependencies
  - No changes to CI/CD configuration
  - No breaking changes

  Repository structure remains unchanged except for one new test markdown file.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `Path('test-c1ds43.md').write_text(content, encoding='utf-8', newline='\n')`

  **Rationale (from research):**
  - Modern, idiomatic Python 3 standard for text file creation
  - Single-line API handles opening, encoding, and closing
  - Explicit parameters ensure platform-independent behavior
  - Matches pattern from 150+ existing test files in repository
  - Safer than open() with manual mode/encoding handling

  **Alternatives considered:**
  - `open()` with manual context manager — more verbose, higher error surface
  - `pathlib.write_bytes()` — requires manual encoding, not idiomatic for text
  - `tempfile.NamedTemporaryFile` — overkill, adds complexity

  ### 2. Git Integration: subprocess with list-based arguments

  **Chosen:** `subprocess.run(['git', 'add', 'test-c1ds43.md'], check=True)`

  **Rationale (from research):**
  - Safe: list arguments cannot be exploited for command injection
  - No external dependencies (spec requirement NFR-4)
  - Standard Python approach for external commands
  - Built-in error handling with `check=True`
  - Matches established pattern across all prior implementations

  **Alternatives rejected:**
  - GitPython — adds external dependency for trivial operations
  - Shell strings (shell=True) — command injection vulnerability
  - Manual git internals — fragile and non-portable

  ### 3. Encoding & Line Endings: UTF-8 without BOM + Unix LF

  **Chosen:**
  - `encoding='utf-8'` (Python's utf-8 codec does not write BOM by default)
  - `newline='\n'` (forces Unix LF, overrides Windows CRLF default)

  **Rationale (from research):**
  - UTF-8 is standard for modern text, web-compatible
  - BOM is unnecessary for UTF-8 and can confuse some markdown parsers
  - Unix LF ensures consistency across Windows/Unix/macOS developers
  - Spec requirements NFR-1 and NFR-2 mandate this approach
  - All 90+ existing test files use identical encoding/line endings

  **Alternatives rejected:**
  - UTF-8-sig — adds unnecessary 3-byte BOM (0xEF 0xBB 0xBF)
  - Platform-native line endings — causes CRLF on Windows (breaks CI/CD reproducibility)
  - Post-processing with replace() — requires additional I/O, unreliable

  ### 4. Validation Scope: Comprehensive post-write checks

  **Chosen:** Validate file existence, heading format, sentence count, encoding, line endings, file size

  **Validation checks:**
  ```python
  # 1. File exists and is readable
  assert path.exists()

  # 2. Content starts with H1 heading
  content = path.read_text(encoding='utf-8')
  assert content.startswith('# '), 'Missing H1 heading'

  # 3. Contains 2-3 sentences (split on . ! ?)
  sentences = sum(1 for char in content if char in '.!?')
  assert 2 <= sentences <= 3, f'Expected 2-3 sentences, found {sentences}'

  # 4. No CRLF line endings
  assert '\r\n' not in content, 'Found CRLF line endings (should be LF)'

  # 5. File size in expected range
  file_size = path.stat().st_size
  assert 400 <= file_size <= 600, f'File size {file_size} outside range'

  # 6. No BOM in file
  with open(path, 'rb') as f:
    first_bytes = f.read(3)
    assert first_bytes != b'\xef\xbb\xbf', 'Found UTF-8 BOM'
  ```

  **Rationale (from research):**
  - Comprehensive validation ensures quality and catches issues early
  - Platform-specific issues (CRLF on Windows) detected before push
  - Encoding issues (accidental BOM) caught immediately
  - Markdown format verified (H1 + 2-3 sentences)
  - Adds 2-3 minutes to implementation but prevents bad commits
  - Matches quality standards of 150+ prior implementations

  **Alternatives rejected:**
  - Minimal validation (file exists only) — misses encoding/line ending issues
  - No validation — relies entirely on subprocess error handling

  ### 5. Prose Content: Contextually Relevant

  **Chosen:** Compose meaningful, contextually appropriate prose about a substantive topic

  **Rationale (from research):**
  - All 150+ prior implementations use meaningful prose, not placeholders
  - Demonstrates feature works with actual natural language
  - Validates across diverse content and sentence structures
  - Takes 3-5 minutes but produces output aligned with established quality bar
  - Spec explicitly resolves this decision in favor of contextually relevant prose

  **Alternative rejected:**
  - Generic templated text (e.g., "This is sentence one. This is sentence two.") — doesn't match quality standard, reads artificial

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: Core File Creation & Validation** comes first because:
  - File must exist and be valid before git operations
  - Validation is independent and can be developed in parallel with prose composition
  - Early validation catches platform-specific issues (encoding, line endings)
  - Establishes the artifact that git will track

  **Phase 2: Git Integration & Finalization** comes second because:
  - Depends on Phase 1 producing a valid file
  - Git operations are straightforward once file is validated
  - Integration testing verifies complete workflow

  ### Implementation Flow

  1. **Compose Prose:** Write contextually relevant 2-3 sentences (3-5 min)
  2. **Create File:** Use pathlib.write_text() with explicit parameters (1-2 min)
  3. **Validate:** Verify format, encoding, line endings before proceeding (2-3 min)
  4. **Git Workflow:** Add, commit, push using subprocess (2-3 min)
  5. **Integration Testing:** Run full end-to-end workflow (2-3 min)

  **Total Estimated Time:** 10-15 minutes (matches spec S estimate)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Encoding issues (accidental BOM or UTF-16) | Low | Medium | Comprehensive post-write validation checks encoding; uses Python's default utf-8 codec which never writes BOM |
  | Line ending inconsistency (CRLF on Windows) | Medium | Medium | Force Unix LF with explicit newline='\n' parameter; validate line endings post-write; matches approach from 90+ existing files |
  | Invalid markdown format (missing heading, wrong number of sentences) | Low | Low | Comprehensive validation verifies H1 heading and sentence count before pushing |
  | Git operations fail (authentication, permissions) | Low | Medium | Use subprocess check=True for immediate error detection; standard git workflow, no custom logic |
  | Platform-specific behavior | Medium | Low | Comprehensive validation catches encoding/line ending issues on all platforms; pathlib and subprocess are portable |
  | File already exists | Low | Low | File doesn't exist yet (test-c1ds43.md is new); no overwrite risk |

  **Overall Risk Level:** ✅ Very Low

  - Feature scope is trivial (single file creation)
  - Technology choices are standard and well-tested
  - No external dependencies introduced
  - Comprehensive validation catches platform-specific issues
  - All decisions validated by 150+ prior implementations
  - Reversible with git reset if needed

