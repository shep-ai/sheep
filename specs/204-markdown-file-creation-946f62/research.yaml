# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-24
  - **Status:** Complete

  ## Technology Decisions

  ### 1. Claude API Integration & Deterministic Generation

  **Chosen:** Use `sheep.config.llm.create_llm(temperature=0)` for deterministic prose generation

  **Rejected:**
  - Direct anthropic SDK calls — adds unnecessary dependency, loses CrewAI integration, harder to configure API keys
  - Embedding prose in code as constants — loses flexibility, doesn't match established pattern, can't customize content per feature
  - External AI service (OpenAI/Google) — violates specification requiring Claude API, increases latency and cost

  **Rationale:** The `sheep.config.llm.create_llm` factory is already available and handles API key management, model selection, and temperature configuration. Using `temperature=0` ensures reproducible output across runs (same feature number generates identical content), which is critical for automated test systems. This approach matches features 150-203 and integrates seamlessly with CrewAI infrastructure.

  ### 2. Content Generation Strategy

  **Chosen:** Single Claude API call with structured prompt; parse H1 title and prose from response

  **Rejected:**
  - Multiple API calls (one for title, one for prose) — increases latency, cost, and complexity; harder to ensure thematic consistency
  - Streaming response parsing — adds complexity, requires async handling, no benefit for simple prose generation
  - Template-based generation — loses natural language quality, difficult to validate

  **Rationale:** Features 203 and 202 demonstrate that a single well-crafted prompt with clear format example reliably generates markdown content in the required format. The response is simple to parse with string operations. This approach is efficient (one API call, ~2-3 seconds), deterministic with temperature=0.

  ### 3. Markdown Validation Approach

  **Chosen:** Manual pattern-based validation without external markdown parsing library

  **Rejected:**
  - CommonMark parser library — adds external dependency (not in pyproject.toml), increases code size, overkill for simple test files
  - Minimal validation (just check file exists) — fails to catch formatting issues early, allows invalid test files into repository
  - Regex-based validation — harder to maintain and debug than explicit string parsing

  **Rationale:** Comprehensive, manual validation is already established in features 150-203 and validates all critical requirements: H1 format, blank line separator, sentence count (2-3), UTF-8 encoding without BOM, Unix LF line endings, and file size (250-600 bytes). This approach catches formatting issues immediately with specific error messages and requires only standard library.

  ### 4. File I/O & Encoding Handling

  **Chosen:** Use `pathlib.Path.write_text(encoding='utf-8')` for file creation; manual binary validation for BOM and line endings

  **Rejected:**
  - Open file with `io.open()` and manage encoding manually — more verbose, requires manual newline handling
  - codecs module for encoding — overly complex for simple UTF-8 file creation
  - Assume encoding is correct (skip validation) — fails to meet comprehensive validation requirement

  **Rationale:** pathlib.Path is the standard modern Python file I/O library (recommended since Python 3.4, standard in 3.11+). The `write_text()` method handles UTF-8 encoding directly and automatically uses LF line endings on Unix systems. Validation is performed post-creation using binary reads to check for UTF-8 BOM and to verify no CRLF or CR line endings are present.

  ### 5. Git Operations & Workflow

  **Chosen:** Use `subprocess.run()` with `check=True` for git add, commit, and push operations

  **Rejected:**
  - GitPython library — adds abstraction layer, harder to debug git failures
  - Shell script or bash wrapper — harder to cross-platform test, less Pythonic
  - Manual push only (skip push operation) — doesn't match specification or established pattern

  **Rationale:** `subprocess.run()` with `check=True` provides fail-fast behavior: raises CalledProcessError immediately if any git command fails. This approach matches features 150-203 exactly and requires only standard library. Error messages from git are passed directly to the user.

  ### 6. Error Handling & Fail-Fast Approach

  **Chosen:** Fail immediately on any error with specific, actionable error messages; no retry logic

  **Rejected:**
  - Automatic retry on transient errors — adds complexity, may mask underlying problems
  - Graceful degradation (continue if optional step fails) — inappropriate for file creation where all steps are critical
  - Suppress errors silently — violates specification, makes debugging impossible

  **Rationale:** In automated systems, immediate feedback on failure enables quick resolution. Features 150-203 implement fail-fast with specific error messages. This approach is superior to retries because most failures are not transient, and specific error messages enable engineers to fix issues quickly.

  ### 7. Module Structure & Function Organization

  **Chosen:** Organize as single module `feature_204_markdown_file_creation.py` with focused functions

  **Rejected:**
  - Monolithic script with inline logic — harder to test, reuse, and debug
  - Multiple modules (generation, validation, git) — overkill for simple feature, diverges from established pattern
  - Class-based OOP design — unnecessary for stateless operations, adds boilerplate

  **Rationale:** Features 150-203 use a single module with focused functions, each with clear responsibility. This structure is easy to understand, maintain, test, and reuse. The `main()` function orchestrates the workflow. This pattern is proven across 200+ features.

  ### 8. Logging Infrastructure

  **Chosen:** Use `sheep.observability.logging.get_logger(__name__)` for structured logging

  **Rejected:**
  - Python `print()` statements — loses structured logging, harder to filter/search
  - System logging (syslog) — unnecessary complexity, loses context
  - No logging — violates NFR-10, makes debugging impossible

  **Rationale:** `sheep.observability.logging` provides structured logging with Langfuse integration. Using `get_logger(__name__)` creates a logger with module name as context, enabling filtering by feature. Log levels are used appropriately: debug() for internal state, info() for workflow progress, error() for failures.

  ## Library Analysis

  | Library/Technology | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | CrewAI LLM wrapper | Claude API integration | Use | Already available, handles API keys, temperature config |
  | sheep.config.llm | LLM factory | Use | Central configuration point, matches established pattern |
  | sheep.observability.logging | Structured logging | Use | Provides rich output, Langfuse integration |
  | pathlib.Path | File I/O | Use | Standard modern Python library, handles encoding/line endings |
  | subprocess | Git operations | Use | Standard library, fail-fast with check=True |
  | structlog | Logging backend | Use (transitively) | Already configured, provides context/filtering |
  | markdown library | CommonMark validation | Reject | External dependency not in pyproject.toml, overkill |
  | commonmark library | CommonMark parsing | Reject | External dependency, unnecessary complexity |
  | GitPython | Git operations | Reject | Available but less direct, subprocess is simpler |
  | nltk/spaCy | Sentence segmentation | Reject | External dependencies, overkill for simple files |

  ## Security Considerations

  **Input Validation:**
  - All generated content is validated comprehensively: format, sentence count, encoding, line endings, size
  - File paths use `pathlib.Path` to prevent directory traversal attacks
  - Git commands use subprocess with explicit argument lists (no shell=True) to prevent command injection

  **API Security:**
  - Claude API credentials managed by `sheep.config.llm` factory with Pydantic SecretStr
  - API keys read from environment or .env file, never embedded in code
  - Temperature=0 setting prevents potential adversarial prompt injection

  **File System Security:**
  - File creation checks for existing file and raises FileExistsError
  - UTF-8 BOM validation prevents encoding-based attacks
  - Line ending validation ensures files are clean and auditable

  ## Performance Implications

  **API Latency:**
  - Single Claude API call: ~2-3 seconds typical
  - Total execution time: ~10-15 seconds (generation + validation + git operations)

  **File I/O Performance:**
  - `pathlib.Path.write_text()` is optimized for text files
  - Validation is all in-memory after file read
  - File size validation uses `pathlib.stat()` (one syscall)

  **Git Operations Performance:**
  - Three subprocess calls (add, commit, push) with minimal overhead
  - Network latency for push operation dominates (~1-2 seconds)

  ## Architecture Notes

  **Integration with Sheep Platform:**
  - Follows established pattern from features 150-203 (200+ identical features)
  - Module structure matches `src/sheep/features/feature_N_*.py` pattern
  - Uses sheep.config.llm and sheep.observability.logging as required
  - Fail-fast error handling aligns with automated system expectations
  - Conventional commit messages enable git history analysis

  **Modularity & Reusability:**
  - Each function has single responsibility
  - Functions can be tested independently and reused
  - Parameters with defaults enable customization
  - No global state or side effects

  **Extensibility:**
  - Adding new validation rules: add new validate_*() function
  - Changing generation strategy: modify generate_prose/generate_title
  - Customizing filenames/branches: pass different parameters to main()

  ## Testing Strategy

  **Unit Tests:**
  - Test generate_prose() with mocked llm.call()
  - Test generate_title() with mocked llm.call()
  - Test validate_markdown_format() with various invalid inputs
  - Test validate_encoding() with BOM and invalid UTF-8
  - Test validate_line_endings() with CRLF and CR
  - Test validate_file_size() with boundary conditions
  - Test validate_sentence_count() with 0, 1, 2, 3, 4+ sentences

  **Integration Tests:**
  - Create test markdown file with known content
  - Run full validation pipeline
  - Verify git operations (use temporary test branch)

  **Edge Cases:**
  - Empty prose or title
  - Prose with no periods
  - Multiple H1 headings
  - File size at boundaries
  - Unicode characters in title/prose

  ## Assumptions & Constraints

  **Assumptions:**
  - Git repository initialized and feature branch exists
  - Git user.name and user.email configured
  - Claude API credentials valid and available
  - Current working directory is repository root
  - No existing file named test-reejh3.md
  - Feature branch (feat/204-markdown-file-creation-946f62) exists

  **Constraints:**
  - Python 3.11+ required
  - Temperature must be 0 for deterministic generation
  - File must follow specific format (H1 + blank line + prose)
  - File size must be 250-600 bytes
  - Prose must have exactly 2-3 sentences
  - Git operations must succeed (fail-fast on any error)

  ## Recommendations

  **For Implementation:**
  1. Base implementation directly on feature 203
  2. Change FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE constants only
  3. Run full validation pipeline before git operations
  4. Use same logging approach and error handling patterns
  5. Test with sample content to verify encoding and line endings

  **For Future Enhancements:**
  1. If markdown validation needs to be comprehensive, add lightweight regex-based validator
  2. If sentence detection needs to handle abbreviations, maintain small abbreviation list
  3. Extract common validation functions to shared utils module (future refactoring)
  4. Add telemetry/metrics using sheep.observability infrastructure

