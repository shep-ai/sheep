# Structured technology decisions
decisions:
  - title: "Claude API Integration & Deterministic Generation"
    chosen: "Use sheep.config.llm.create_llm(temperature=0) for deterministic prose generation"
    rejected:
      - "Direct anthropic SDK calls — adds unnecessary dependency, loses CrewAI integration, harder to configure API keys"
      - "Embedding prose in code as constants — loses flexibility, doesn't match established pattern, can't customize content per feature"
      - "External AI service (OpenAI/Google) — violates specification requiring Claude API, increases latency and cost"
    rationale: >
      The sheep.config.llm.create_llm factory is already available and handles API key management, model selection,
      and temperature configuration. Using temperature=0 ensures reproducible output across runs (same feature number
      generates identical content), which is critical for automated test systems. This approach matches features 150-203
      and integrates seamlessly with CrewAI infrastructure. The factory supports multiple model providers and settings,
      making future migration or customization trivial.

  - title: "Content Generation Strategy"
    chosen: "Single Claude API call with structured prompt; parse H1 title and prose from response"
    rejected:
      - "Multiple API calls (one for title, one for prose) — increases latency, cost, and complexity; harder to ensure thematic consistency between title and prose"
      - "Streaming response parsing — adds complexity, requires async handling, no benefit for simple prose generation"
      - "Template-based generation (substituting variables into templates) — loses natural language quality, difficult to validate, doesn't match established pattern"
    rationale: >
      Features 203 and 202 demonstrate that a single well-crafted prompt with clear format example reliably generates
      markdown content in the required format (H1 heading, blank line, prose). The response is simple to parse with
      string operations. This approach is efficient (one API call, ~2-3 seconds), deterministic with temperature=0,
      and matches the established pattern exactly. The prompt explicitly requests only the markdown content with no
      additional text, making parsing robust.

  - title: "Markdown Validation Approach"
    chosen: "Manual pattern-based validation without external markdown parsing library"
    rejected:
      - "CommonMark parser library (markdown, commonmark, markdown-it) — adds external dependency (not in pyproject.toml), increases code size and memory footprint, overkill for simple test files with known structure"
      - "Minimal validation (just check file exists) — fails to catch formatting issues early, allows invalid test files into repository, inconsistent with comprehensive validation already implemented in features 150-203"
      - "Regex-based validation — harder to maintain and debug than explicit string parsing, no benefit for simple structure"
    rationale: >
      Comprehensive, manual validation is already established in features 150-203 and validates all critical requirements:
      (1) First line is H1 heading, (2) second line is blank, (3) prose has exactly 2-3 sentences, (4) UTF-8 encoding
      without BOM, (5) Unix LF line endings only, (6) file size in reasonable range (250-600 bytes). This approach
      catches formatting issues immediately with specific error messages. Manual validation requires only standard
      library (pathlib, str.split, str.count) and adds no dependencies. The structure is simple and well-understood,
      so pattern-based validation is sufficient and preferred over a general-purpose markdown parser.

  - title: "File I/O & Encoding Handling"
    chosen: "Use pathlib.Path.write_text(encoding='utf-8') for file creation; manual binary validation for BOM and line endings"
    rejected:
      - "Open file with io.open() and manage encoding manually — more verbose, requires manual newline handling, pathlib is the modern standard for Python 3.11+"
      - "codecs module for encoding — overly complex for simple UTF-8 file creation, pathlib handles this cleanly"
      - "Assume encoding is correct (skip validation) — fails to meet NFR-3 (comprehensive validation), risks inconsistent test files"
    rationale: >
      pathlib.Path is the standard modern Python file I/O library (recommended since Python 3.4, standard in 3.11+).
      The write_text() method handles UTF-8 encoding directly and automatically uses LF line endings on Unix systems
      (the deployment target). Validation is performed post-creation using binary reads to check for UTF-8 BOM and
      to verify no CRLF or CR line endings are present. This matches the exact pattern from features 203 and 202.
      Separating file creation from validation allows clear error messages when validation fails.

  - title: "Git Operations & Workflow"
    chosen: "Use subprocess.run() with check=True for git add, commit, and push operations"
    rejected:
      - "GitPython library (available in pyproject.toml) — adds abstraction layer, harder to debug git failures, subprocess is simpler and more direct"
      - "Shell script or bash wrapper — harder to cross-platform test, no clear advantage over subprocess, less Pythonic"
      - "Manual push only (skip push operation) — doesn't match specification or established pattern, leaves feature incomplete"
    rationale: >
      subprocess.run() with check=True provides fail-fast behavior: raises CalledProcessError immediately if any git
      command fails, with specific error message from stderr. This approach matches features 150-203 exactly and
      requires only standard library (subprocess). The feature branch is pre-created and isolated, so automatic push
