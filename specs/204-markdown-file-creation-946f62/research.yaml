      and cross-platform compatible. Error messages from git (e.g., 'file not found', 'permission denied') are passed
      directly to the user.

  - title: "Error Handling & Fail-Fast Approach"
    chosen: "Fail immediately on any error with specific, actionable error messages; no retry logic"
    rejected:
      - "Automatic retry on transient errors (up to 3 times) — adds complexity, may mask underlying problems, delays failure feedback in automated systems"
      - "Graceful degradation (continue if optional step fails) — inappropriate for file creation where all steps are critical, leads to incomplete features"
