content: |
  ## Architecture Overview

  Feature 204 follows the single-module architecture pattern established in features 150-203, with the following design:

  **Module Structure:**
  - Single module: `src/sheep/features/feature_204_markdown_file_creation.py`
  - Organized into logical function groups: generation, validation, file I/O, git operations, orchestration
  - All functions use standard library (pathlib, subprocess, sys) plus sheep integrations (llm, logging)
  - No external dependencies beyond those already in pyproject.toml

  **Key Functions:**
  - `generate_title()` - Generate H1 markdown title via Claude API
  - `generate_prose()` - Generate 2-3 sentences via Claude API
  - `create_markdown_file()` - Write markdown file with proper encoding and line endings
  - `validate_markdown_format()` - Check H1 format, blank line separator, single heading
  - `validate_encoding()` - Verify UTF-8 without BOM
  - `validate_line_endings()` - Verify Unix LF only (no CRLF or CR)
  - `validate_file_size()` - Check file is 250-600 bytes
  - `validate_sentence_count()` - Verify exactly 2-3 sentences in prose
  - `validate_markdown_file()` - Comprehensive validation pipeline (calls all validators in sequence)
  - `git_add_file()` - Stage file with `git add`
  - `git_commit()` - Create conventional commit with `git commit -m`
  - `git_push()` - Push to feature branch with `git push -u origin`
  - `main()` - Orchestrate complete workflow: create → validate → stage → commit → push

  **Integration Points:**
  - `sheep.config.llm.create_llm(temperature=0)` for deterministic Claude API calls
  - `sheep.observability.logging.get_logger(__name__)` for structured logging
  - `pathlib.Path` for all file I/O (cross-platform compatibility)
  - `subprocess.run()` with check=True for fail-fast git operations

  ## Key Design Decisions

  ### 1. Single Module Architecture
  **Chosen:** Create feature as single module with focused functions
  **Alternatives Considered:**
  - Multiple modules (generation.py, validation.py, git.py) — adds unnecessary complexity
  - Class-based OOP design — adds boilerplate, doesn't match established pattern
  - Monolithic script with inline logic — harder to test and reuse
  **Rationale:** Features 150-203 consistently use single-module pattern with focused functions. This approach is proven, easy to understand, test, and maintain. Each function has single responsibility and can be tested/reused independently.

  ### 2. Claude API with temperature=0 for Determinism
  **Chosen:** Use `sheep.config.llm.create_llm(temperature=0)` for all content generation
  **Alternatives Considered:**
  - Direct anthropic SDK — adds dependency, loses CrewAI integration
  - Embedding prose in constants — loses flexibility, doesn't match pattern
  - Variable temperature generation — produces inconsistent test files
  **Rationale:** Temperature=0 ensures identical output for identical prompts, critical for automated test systems. The sheep.config.llm factory handles API keys, model selection, and settings. This matches the established pattern from features 150-203 and specification requirements (temperature=0 explicitly required).

  ### 3. Single Claude API Call with Structured Prompt
  **Chosen:** Generate title and prose in single API call, parse response with string operations
  **Alternatives Considered:**
  - Multiple API calls (one for title, one for prose) — increases latency and cost
  - Streaming response parsing — adds complexity without benefit
  - Template-based generation — loses quality, harder to validate
  **Rationale:** Single well-crafted prompt with clear format example reliably produces valid markdown (H1 + blank line + prose). Simple string parsing after extraction. Efficient (~2-3 seconds), deterministic, matches feature 203 pattern exactly.

  ### 4. Manual Pattern-Based Validation
  **Chosen:** Implement custom validation functions checking specific requirements
  **Alternatives Considered:**
  - CommonMark parser library — adds external dependency, overkill for simple files
  - Minimal validation (file exists) — fails to catch formatting issues early
  - Regex-based validation — harder to maintain, no benefit
  **Rationale:** Comprehensive manual validation is established in features 150-203. Validates all critical requirements: H1 format, blank line, sentence count (2-3), UTF-8/no-BOM, LF-only line endings, file size (250-600 bytes). Catches issues immediately with specific error messages. Requires only standard library.

  ### 5. pathlib.Path for File I/O
  **Chosen:** Use `pathlib.Path.write_text(encoding='utf-8')` for file creation, binary validation for encoding/line endings
  **Alternatives Considered:**
  - `io.open()` with manual encoding — more verbose, requires manual newline handling
  - `codecs` module — overly complex for simple UTF-8 file creation
  - Skip encoding validation — fails to meet comprehensive validation requirement
  **Rationale:** pathlib is standard modern Python file I/O (recommended since 3.4, standard in 3.11+). The write_text() method handles UTF-8 directly and uses LF line endings on Unix. Post-creation binary validation checks for BOM and verifies no CRLF/CR present. Matches feature 203 pattern exactly.

  ### 6. subprocess.run() for Git Operations
  **Chosen:** Use `subprocess.run(['git', 'command', 'args'], check=True)` for all git operations
  **Alternatives Considered:**
  - GitPython library — adds abstraction layer, harder to debug
  - Shell script wrapper — harder to test cross-platform, less Pythonic
  - Skip push operation — doesn't match specification or pattern
  **Rationale:** subprocess.run() with check=True provides fail-fast behavior: raises CalledProcessError immediately if any git command fails, with error message from stderr. Matches features 150-203 exactly, requires only standard library. Error messages from git are passed directly to user for quick resolution.

  ### 7. Fail-Fast Error Handling
  **Chosen:** Exit immediately on any error with specific, actionable error messages
  **Alternatives Considered:**
  - Automatic retry on transient errors — adds complexity, may mask problems
  - Graceful degradation — inappropriate for file creation where all steps are critical
  - Silent error suppression — violates specification, breaks debugging
  **Rationale:** In automated systems, immediate feedback on failure enables quick resolution. Features 150-203 implement fail-fast with specific error messages (e.g., "Expected 2-3 sentences, found 4"). Specific errors enable engineers to fix issues quickly. Most failures are not transient (file exists, API error) so retries add no value.

  ## Implementation Strategy

  **Phase 1: Module Foundation & Content Generation**
  - Create module with proper docstring, imports, and logging setup
  - Define constants: FILENAME="test-reejh3.md", FEATURE_NUMBER=204, BRANCH_NAME="feat/204-markdown-file-creation-946f62", COMMIT_MESSAGE
  - Define MARKDOWN_GENERATION_PROMPT with clear format requirements
  - Implement generate_title() — call Claude API, extract title from H1 line
  - Implement generate_prose() — call Claude API, extract prose after blank line, validate sentence count

  **Phase 2: Validation & File Creation**
  - Implement validate_markdown_format() — check H1, blank line, single heading
  - Implement validate_encoding() — check UTF-8, no BOM using binary read
  - Implement validate_line_endings() — check no CRLF or CR using binary read
  - Implement validate_file_size() — check 250-600 bytes
  - Implement helper functions: verify_file_exists(), extract_prose_content(), count_sentences(), validate_sentence_count()
  - Implement validate_markdown_file() — comprehensive pipeline calling all validators in sequence
  - Implement create_markdown_file() — generate content, construct markdown, write with pathlib.Path.write_text()

  **Phase 3: Git Integration & End-to-End Testing**
  - Implement git_add_file() — subprocess call to `git add filename`
  - Implement git_commit() — subprocess call to `git commit -m "message"`
  - Implement git_push() — subprocess call to `git push -u origin branch`
  - Implement main() — orchestrate workflow: create → validate → add → commit → push, with comprehensive error handling
  - Write integration test verifying complete workflow
  - Test edge cases: empty content, invalid encoding, CRLF line endings, wrong sentence count

  **Effort Estimate:** 10-15 minutes total (well-established pattern, feature 203 as direct reference)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Content generation produces invalid markdown | Validate immediately after generation; Claude with temperature=0 + explicit prompt format example provides high confidence |
  | File encoding issues (BOM, CRLF) | Post-creation binary validation catches these immediately with specific error messages |
  | Git operations fail (branch doesn't exist, no credentials) | Fail-fast with specific error message from stderr; user can quickly diagnose and retry |
  | File already exists | Check with Path.exists() before creation; raise FileExistsError with clear message |
  | Sentence count validation miscounts (abbreviations, ellipsis) | Claude is trained to use standard sentence structure; test files have predictable format; count is validated during generation AND after file creation |
  | API rate limiting or transient errors | Temperature=0 generation is fast (~2-3 seconds); fail-fast immediately if error occurs rather than retrying (most failures are not transient) |
  | Line ending conversion by git | Validation uses binary read to check actual bytes; pathlib.write_text() uses native LF on Unix; git config core.autocrlf can interfere but won't affect validation |

  ---

  _Plan complete — ready for implementation. Architecture is clear, technology decisions are documented, and feature 203 provides direct implementation precedent._
