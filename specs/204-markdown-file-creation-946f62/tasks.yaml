content: |
  ## Task Summary

  Implementation of feature 204 spans 13 tasks across 3 phases:

  **Phase 1: Module Foundation & Content Generation (3 tasks, ~55 minutes)**
  Tasks 1-3 establish the module structure with logging, constants, and Claude API integration for deterministic
  title and prose generation using temperature=0. These tasks follow the exact pattern from feature 203.

  **Phase 2: Validation & File Creation (5 tasks, ~70 minutes)**
  Tasks 4-8 implement the comprehensive validation pipeline checking markdown format, UTF-8 encoding, Unix LF
  line endings, file size, and sentence count. Task 8 implements file creation using pathlib.Path with proper
  encoding handling.

  **Phase 3: Git Integration & End-to-End Testing (5 tasks, ~70 minutes)**
  Tasks 9-13 implement git operations (add, commit, push) using subprocess.run() with fail-fast error handling,
  orchestration function coordinating the full workflow, and integration testing verifying complete end-to-end
  behavior.

  **Workflow Architecture:**
  1. Create markdown file with generated title and prose
  2. Validate file structure, encoding, line endings, size, and sentence count
  3. Stage file with git add
  4. Create conventional commit with git commit
  5. Push to feature branch with git push
  6. Return success code 0, or 1 on any failure with specific error message

  **Test Strategy:**
  - Unit tests for each function using mocked dependencies
  - Validation functions tested with various invalid inputs
  - Git operations tested with mocked subprocess.run()
  - Integration test creates actual file and exercises full workflow
  - Edge cases: missing files, wrong encoding, invalid line endings, sentence count variations

  **Dependencies & Ordering:**
  - Task 1 (module setup) is a prerequisite for all others
  - Tasks 2-3 (generation) are independent but needed by Task 8 (file creation)
  - Tasks 4-7 (validation) are independent but all needed by Task 8
  - Tasks 9-11 (git operations) are independent but all needed by Task 12
  - Task 12 (orchestration) depends on Tasks 8-11
  - Task 13 (helpers & testing) depends on Tasks 4-7 but is best done last

  ---

  _Task breakdown complete — ready for implementation._
