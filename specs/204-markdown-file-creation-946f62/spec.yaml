content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-reejh3.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 150-203, with 200+ similar test files already existing in the repository as precedents. The feature serves as a minimal, testable unit of work for the automated implementation system, proving the platform can consistently produce high-quality files that match established patterns.

  ## Success Criteria

  - [ ] File `test-reejh3.md` is created at repository root (not in subdirectory)
  - [ ] File contains valid CommonMark markdown syntax with no parse errors
  - [ ] File starts with an H1 heading (title) on first line
  - [ ] File contains exactly 2-3 prose sentences after the title
  - [ ] File is encoded in UTF-8 with Unix LF line endings (0x0A, not CRLF)
  - [ ] File size is between 100-600 bytes (reasonable markdown file size range)
  - [ ] Content is generated via Claude API with deterministic settings (temperature=0)
  - [ ] File is staged in git index with no uncommitted changes
  - [ ] Git commit message follows Conventional Commits format (type: description)
  - [ ] Commit is pushed to `feat/204-markdown-file-creation-946f62` branch
  - [ ] Git history shows single commit for this feature with no merge commits
  - [ ] No existing files in repository are modified or deleted
  - [ ] All validation checks pass with clear error messages on any failure

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-reejh3.md` at the repository root using `pathlib.Path` for cross-platform compatibility
  - **FR-2**: File must begin with an H1 markdown heading (single `#` followed by space and title text) that serves as the file's title
  - **FR-3**: File must contain exactly 2-3 complete prose sentences after the title, separated by blank line from heading
  - **FR-4**: Write file with UTF-8 encoding and Unix LF line endings (validate and convert if necessary)
  - **FR-5**: Generate title and prose content using Claude API with deterministic settings (temperature=0, fixed seed for reproducibility)
  - **FR-6**: File must be valid CommonMark markdown (validate against CommonMark specification, not just basic syntax)
  - **FR-7**: Stage the file in git using subprocess to run `git add`
  - **FR-8**: Create a git commit with conventional commit message using subprocess (format: `type(scope): description`)
  - **FR-9**: Push commit to the feature branch `feat/204-markdown-file-creation-946f62` using subprocess
  - **FR-10**: Validate that no existing files were modified during this operation (fail if repository state diverges unexpectedly)

  ## Non-Functional Requirements

  - **NFR-1**: Execution must complete within 5 minutes total (Claude API calls, file I/O, git operations)
  - **NFR-2**: File size must be in range 100-600 bytes to match established test file patterns
  - **NFR-3**: Implementation must follow architecture patterns from features 150-203 with identical module structure and function organization
  - **NFR-4**: Claude API generation must use temperature=0 for deterministic, reproducible content across runs
  - **NFR-5**: All error messages must be specific and actionable (not generic), enabling quick resolution
  - **NFR-6**: File I/O must use `pathlib.Path` exclusively for cross-platform compatibility (no os.path module)
  - **NFR-7**: Git operations must use Python `subprocess` module with no external git wrapper dependencies
  - **NFR-8**: Code must be maintainable and follow existing feature module patterns from the codebase
  - **NFR-9**: No external package dependencies; use only Python 3.11+ standard library and git command-line
  - **NFR-10**: Logging and error tracking must use `sheep.observability.logging` infrastructure where available

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Validation scope (minimal vs comprehensive) | **Comprehensive validation** | Automated systems benefit from early failure detection. Catching formatting or sentence count issues immediately prevents inconsistent test files and matches the quality standards shown in features 150-203. |
  | 2 | Claude generation: deterministic or variable? | **Deterministic (temperature=0)** | Reproducible content across runs is essential in automated systems. The analysis already specifies temperature=0, confirming this is the expected pattern. Consistent test output is more valuable than prose variation. |
  | 3 | Error handling: fail-fast or retry? | **Fail fast with clear error message** | Immediate feedback on failures enables quick resolution in automated workflows. Clear, specific error messages are more useful than automatic retries. Matches expectations for engineering-focused systems. |
  | 4 | Git push: automatic or manual? | **Automatic push to feature branch** | Feature branch is pre-created and isolated. Automatic push completes the full workflow in one operation. Matches pattern from features 150-203. Reduces manual steps in automated implementation process. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized into the following key directories:

  - **src/sheep/** - Main source code directory containing all modules
    - **agents/** - Agent definitions for research, implementation, and review phases
    - **config/** - Configuration management including LLM factory and settings
    - **flows/** - Flow definitions for orchestrating multi-step workflows
    - **observability/** - Logging infrastructure and Langfuse integration
    - **tools/** - Agent tools for file operations and git commands
    - **features/** - Individual feature implementations (200+ markdown file creation modules)
    - **cli.py** - Command-line interface entry point
  - **specs/** - Feature specifications organized by number (234+ feature specs)
  - **.github/** - GitHub Actions workflows and CI/CD configuration
  - **Dockerfile** - Container configuration for deployment
  - **.env.example** - Environment variables template

  ### Architecture Patterns

  The Sheep platform follows these architectural patterns:

  **Separation of Structure and Intelligence:**
  - Flows define the execution structure and control flow paths
  - Crews provide autonomous AI decision-making within each flow
  - Each agent has a focused role with clear goals and backstories

  **Feature Implementation Pattern:**
  - Each feature is a self-contained module in `src/sheep/features/feature_N_*.py`
  - Modules contain functions for: content generation, file creation, validation, and git operations
  - Features follow conventional commit patterns and git workflow best practices
  - Validation is comprehensive and modular with fail-fast error handling

  **Dependency Flow:**
  - Feature modules import from `sheep.config.llm` for Claude API integration
  - Feature modules import from `sheep.observability.logging` for structured logging
  - Git operations use Python `subprocess` module (no external git wrapper dependencies)
  - File I/O uses `pathlib.Path` for cross-platform compatibility

  ### Relevant Technologies

  - **Python 3.11+**: Required runtime with access to standard library modules (pathlib, subprocess, sys)
  - **CrewAI**: Framework for agentic orchestration (used in flows, not directly in feature modules)
  - **Claude API**: LLM for deterministic content generation with temperature=0 for reproducibility
  - **Git**: Version control system required for staging, committing, and pushing changes
  - **Markdown**: CommonMark specification for file format (H1 heading + prose structure)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 200+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 150-203; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/features/) | Low | Creates one new feature module feature_204_markdown_file_creation.py following established pattern from 200+ prior features; no modifications to existing code |
  | Specs Directory | Low | Updates only this spec.yaml file during analysis phase; no impact on other specs or configurations |
  | Configuration Files | None | No changes to .env, pyproject.toml, dockerfile, or any config files |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Dependencies | None | Feature uses only Python standard library (pathlib, subprocess) and git; no new package dependencies required |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/204-markdown-file-creation-946f62` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` and `subprocess` (standard library, no external packages)
  - Git configuration with user.name and user.email set for commits
  - Claude API access with valid authentication credentials (for LLM prose generation)
  - Target filename: `test-reejh3.md` (specified in user query)

  **Reference/Precedent:**
  - 200+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (150-203) demonstrate successful execution of identical pattern
  - Recent commits (200-203) show exact templates and working examples
  - Feature 203 implementation provides direct code precedent for implementation approach

  **Not Required:**
  - No source code modifications to existing files
  - No changes to core platform logic in agents, flows, or tools
  - No modification of configuration files
  - No test framework integration
  - No documentation updates beyond spec files

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 200+ existing test files:

  - **Content generation**: ~3-5 minutes (generate title and 2-3 sentences via Claude API with deterministic settings)
  - **File creation and encoding**: ~1-2 minutes (write file with UTF-8 encoding and LF line endings using pathlib)
  - **Validation**: ~2-3 minutes (verify markdown syntax, sentence count, encoding, line endings, file size, prose quality)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to feature branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 200+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (200-203) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity
  - Feature 203 implementation serves as direct working precedent for all implementation patterns
  - File creation and git operations use only Python standard library (pathlib, subprocess) and standard git commands
  - Claude API for prose generation reduces content creation time and ensures quality

  ---

  _Requirements phase complete — ready for implementation_
