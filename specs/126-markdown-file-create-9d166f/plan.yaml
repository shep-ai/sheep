# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 126 integrates seamlessly with the existing Sheep platform by orchestrating
  proven, reusable utilities rather than implementing new functionality:

  - **Content generation:** Reuse `generate_markdown_content()` from content_generators.py
    (lines 27-64), which generates semantically coherent H1-heading + 2-3 sentences via
    Claude API and CrewAI framework
  - **File I/O:** Reuse `write_markdown_file()` from content_generators.py (lines 101-147),
    which handles pathlib-based file creation with UTF-8 encoding and LF line ending guarantees
  - **Validation:** Reuse `validate_markdown_file()` from content_generators.py (lines 150-244),
    which validates UTF-8 encoding, LF endings, H1 heading format, 2-3 sentence count, and
    trailing newlines
  - **Git operations:** Use GitCommitTool and GitPushTool from sheep.tools.git_tools, which
    provide safe subprocess-based git operations with logging and error handling

  The feature module (feature_126_markdown_file_creation.py) serves as the orchestration
  entry point, following the exact pattern established by features 121-125. This module
  will be invoked by the Sheep flow during the implementation phase.

  ### Relationship to Codebase

  Feature 126 is structurally identical to features 121-125, which already demonstrate this
  pattern successfully across 5 prior implementations. The codebase provides:

  - Pre-validated, tested utilities in content_generators.py (used by all prior features)
  - Pre-configured git tools in sheep.tools.git_tools (used by all prior features)
  - Pre-configured Claude API integration via sheep.config.llm (used by all prior features)
  - Observability via sheep.observability.logging (optional, recommended for consistency)

  No new dependencies, configuration, or architectural changes are required. The implementation
  is purely an orchestration task.

  ## Key Design Decisions

  ### Decision 1: Content Generation via LLM (not hardcoded templates)

  **Chosen:** Use `generate_markdown_content()` from content_generators.py

  **Rationale:**
  - Features 121-125 all use this approach successfully
  - Claude API is already integrated via CrewAI framework (no new setup)
  - Generates semantically coherent, topic-diverse prose (not constrained to templates)
  - Prose is automatically validated to 2-3 sentences via period counting (lines 71-98)
  - LLM integration aligns with Sheep\'s agentic design philosophy

  **Alternatives considered and rejected:**
  - Hardcoded markdown template: sacrifices topic variety, violates spec requirement
  - Random sentence sampling: unreliable coherence, semantic quality issues
  - File copying from existing test files: reduces credibility (duplicate content)

  ### Decision 2: File I/O via pathlib with UTF-8 encoding (not raw os.write)

  **Chosen:** Use `write_markdown_file()` from content_generators.py

  **Rationale:**
  - Already used successfully in content_generators.py (lines 101-147)
  - Pathlib is idiomatic for modern Python 3.11+ file operations
  - Automatic UTF-8 encoding without BOM (via `open(encoding=\'utf-8\')`)
  - Automatic LF line endings on Unix/Linux (the deployment platform)
  - Includes post-write verification (file existence, non-empty size)
  - Prevents path traversal via filename validation (lines 117-118)

  **Alternatives considered and rejected:**
  - os.open() with os.write(): lower-level without benefit for text files
  - External encoding libraries (chardet): unnecessary; UTF-8 is specified
  - Subprocess echo/tee commands: platform-dependent, harder to control encoding

  ### Decision 3: Post-write validation (not pre-generation constraints)

  **Chosen:** Use `validate_markdown_file()` from content_generators.py after file creation

  **Rationale:**
  - Comprehensive validation covers all spec requirements (UTF-8, LF, H1, 2-3 sentences, size)
  - Clear separation of concerns: generation is separate from validation
  - Features 121-125 use this pattern successfully
  - Handles edge cases and provides detailed error messages
  - If size is out of range (rare), regeneration is acceptable

  **Alternatives considered and rejected:**
  - No validation: risky for spec compliance verification
  - External markdown linters: adds dependencies for requirements already covered
  - Pre-generation byte constraints: LLMs imprecise with size limits

  ### Decision 4: Git operations via existing tools (not direct subprocess)

  **Chosen:** Use GitCommitTool and GitPushTool from sheep.tools.git_tools

  **Rationale:**
  - Both tools are already integrated in content_generators.py (lines 274-360)
  - Features 121-125 use these tools; pattern is proven
  - Pydantic-based CrewAI tools with schema validation and error handling
  - Subprocess calls use list-based args (safe, no shell=True)
  - Built-in logging via sheep.observability.logging

  **Alternatives considered and rejected:**
  - GitPython library: external dependency, less direct control
  - Direct subprocess: duplicates logic, loses error handling and logging
  - os.system(): no output capture, no error handling, unsafe

  ### Decision 5: Conventional commit format feat(126): (from spec)

  **Chosen:** Format: `feat(126): Create markdown file test-012sjx.md with prose content`

  **Rationale:**
  - Spec explicitly mandates this format (FR-8, success criterion)
  - Features 121-125 use identical format (verified in git log)
  - Maintains feature-to-commit traceability for CI/CD and analytics
  - Scope (126) is atomic feature identifier, not redundant with name

  **Alternatives considered and rejected:**
  - `feat: create markdown file`: loses feature number traceability
  - `feat(markdown-file-create)`: longer scope without atomic identifier

  ### Decision 6: Dedicated feature module (not inline execution)

  **Chosen:** Create feature_126_markdown_file_creation.py following the pattern from features 121-125

  **Rationale:**
  - Clear orchestration entry point for agents/flows
  - Feature-specific logging and context tracking
  - Consistent with Sheep\'s modular design
  - Enables per-feature tracking and reusability
  - Makes flow-level error handling clearer

  **Alternatives considered and rejected:**
  - Inline execution in flow: loses modularity and reusability
  - Only calling content_generators: loses feature-specific entry point

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Module Setup)** comes first because it establishes the structure that phases 2-4
  depend on. Without the module, orchestration point, and imports, we have nowhere to wire
  the utilities.

  **Phase 2 (Content & Validation)** follows because it is the core business logic—generating
  and validating the markdown file. This must work before we try to commit/push.

  **Phase 3 (Git Integration)** depends on phases 1-2: we cannot stage and commit without
  having created and validated the file.

  **Phase 4 (Integration Testing)** comes last because it verifies that all prior phases
  work together correctly. It tests the complete end-to-end workflow.

  ### Workflow Summary

  1. Create the feature module with constants (`FEATURE_NUMBER=126`, `MARKDOWN_FILENAME="test-012sjx.md"`)
  2. Call `generate_markdown_content()` to get H1 heading + prose via Claude API
  3. Call `write_markdown_file()` to create test-012sjx.md with UTF-8 encoding
  4. Call `validate_markdown_file()` to verify all spec requirements
  5. Call `GitCommitTool` to stage and commit with `feat(126): ...` message
  6. Call `GitPushTool` to push to feature branch with upstream tracking
  7. Verify all operations succeeded and output matches spec

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **LLM API latency/timeout** | Content generation is the expected bottleneck (500-2000ms). Spec allows 10-15 minutes total. If API is slow, retry logic is at the flow level, not feature module. |
  | **File size out of range (400-600 bytes)** | Validation catches this. Regenerate content if needed (rare; 2-3 sentences typically produces 400-600 bytes as evidenced by features 121-125). |
  | **Invalid markdown syntax** | `validate_markdown_file()` comprehensively checks H1 heading, sentence count, and trailing newline. Will reject and raise clear error. |
  | **Encoding issues (BOM, CRLF)** | `pathlib.open(encoding=\'utf-8\')` automatically handles UTF-8 without BOM. LF is the default on Unix (deployment platform). Validation double-checks both. |
  | **Git commit/push failures** | Git tools wrap subprocess with error handling and clear exception messages. Failures will propagate to flow-level orchestration (e.g., retry logic, manual intervention). |
  | **File already exists** | `write_markdown_file()` will overwrite or raise error depending on implementation. Check existing feature 121 behavior and match it. |
  | **Git user not configured** | Pre-flight check: if git user.name/email not set, git commit will fail with clear message. Assumes Sheep infrastructure has already configured this. |

  ## No New External Dependencies

  This feature leverages only existing Sheep codebase components:
  - No new pip packages required
  - No new environment variables needed
  - No new external service integrations
  - Claude API already configured (used by features 121-125)
  - CrewAI already installed (framework dependency)

  All utilities are production-tested by features 121-125 across 5+ prior implementations.

  ## Success Criteria for Implementation

  The implementation is complete when:
  1. ✓ test-012sjx.md exists in repository root
  2. ✓ File contains H1 heading + 2-3 sentences
  3. ✓ File is UTF-8 encoded, LF line endings, 400-600 bytes
  4. ✓ File passes `validate_markdown_file()` checks
  5. ✓ File is committed with `feat(126): Create markdown file test-012sjx.md with prose content`
  6. ✓ Commit is pushed to feature branch and visible in remote
  7. ✓ Module can be imported and orchestration function called successfully
