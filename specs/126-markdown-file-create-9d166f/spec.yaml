content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown
  files following an established pattern. This feature creates a single test markdown file
  (test-012sjx.md) at the repository root with a title and prose content, demonstrating
  automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 125+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 121-125, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File test-012sjx.md exists in repository root directory
  - [ ] File contains exactly one markdown H1 heading (# Title) serving as document title
  - [ ] File contains exactly 2-3 prose sentences following the heading
  - [ ] File is UTF-8 encoded with LF line endings (no CRLF)
  - [ ] File size is between 400-600 bytes (inclusive)
  - [ ] File content is valid markdown with no syntax errors
  - [ ] File is staged in git (git add test-012sjx.md)
  - [ ] File is committed with conventional commit message format: feat(126): Create markdown file test-012sjx.md with prose content
  - [ ] Commit is pushed to feature branch feat/126-markdown-file-create-9d166f
  - [ ] Changes appear in remote branch (verifiable via git log and remote tracking)

  ## Functional Requirements

  - **FR-1**: Create file named test-012sjx.md in repository root directory
  - **FR-2**: File must contain a single markdown H1 heading as title (format: # Title)
  - **FR-3**: File must contain 2-3 sentences of coherent prose content following the heading
  - **FR-4**: File must use UTF-8 character encoding
  - **FR-5**: File must use LF line endings (Unix-style), not CRLF (Windows-style)
  - **FR-6**: File content must be valid markdown with correct syntax (no unclosed tags, proper heading format)
  - **FR-7**: Stage the created file in git using git add command
  - **FR-8**: Commit the file with a conventional commit message following format: feat(126): Create markdown file test-012sjx.md with prose content
  - **FR-9**: Push the commit to the feature branch (feat/126-markdown-file-create-9d166f)
  - **FR-10**: Commit must be reachable from the feature branch in the remote repository

  ## Non-Functional Requirements

  - **NFR-1**: File must not exceed 600 bytes in size (keep prose concise and focused)
  - **NFR-2**: File must be at least 400 bytes in size (ensure meaningful content)
  - **NFR-3**: Implementation must complete in under 15 minutes (consistent with pattern from features 121-125)
  - **NFR-4**: Follow established markdown file creation pattern from features 121-125 (consistency)
  - **NFR-5**: Use Python pathlib for file I/O operations (leverage standard library, no external dependencies)
  - **NFR-6**: Use subprocess or git CLI for git operations (no git library dependencies unless already in use)
  - **NFR-7**: Implementation must not modify or delete any existing files in the repository
  - **NFR-8**: Implementation must not create any directories; file must be created directly in root

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the markdown file content topic be freely chosen or constrained to specific categories? | Free topic choice | Mirrors the successful pattern of features 121-125 (no constraints), avoids validation bottlenecks, and aligns with agile test file creation. The 2-3 sentence prose requirement is sufficient quality control. |
  | 2 | Should the prose content be exactly 2-3 sentences or allow flexibility in interpretation? | Exactly 2-3 sentences | Original spec states this explicitly, previous features follow this pattern, and it is objectively measurable. Clear validation criteria reduce review friction and ensure consistency. |
  | 3 | Should the markdown heading be H1 (#) or another heading level? | H1 heading | Standard markdown convention for document titles, directly matches spec language 'markdown heading as title', and validated by 125+ existing test files using H1 format. |
  | 4 | What should the commit message scope be (the part in parentheses after 'feat')? | Feature number (126) | Spec explicitly shows 'feat(126): message' as the format example, directly maps commits to feature tracking, and maintains consistency with feature-driven development workflow in features 121-125. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI.
  The repository structure is organized as follows:

  - **Root directory**: Contains 125+ test markdown files (test-*.md, *.md) demonstrating the
    established pattern for file creation features. These files serve as both examples and
    validation artifacts for the automated implementation system.
  - **specs/ directory**: Contains 126 feature specifications organized by feature number
    (e.g., 001-feature-name/, 002-feature-name/, ... 126-markdown-file-create-9d166f/).
    Each spec directory contains a spec.yaml file defining requirements and analysis.
  - **src/sheep/ directory**: Contains the source code for the Sheep platform including:
    - agents/: Agent definitions for research, implementation, and review
    - flows/: Flow definitions for orchestration (code_implementation.py is the main flow)
    - config/: Configuration management and LLM factory
    - tools/: Agent tools including git_tools.py and file_tools.py
    - cli.py: CLI entry point

  ### Architecture Patterns

  The Sheep platform follows these key architectural patterns:

  - **Separation of Structure and Intelligence**: Flows define execution structure and control
    paths, while crews provide autonomous AI decision-making. Each crew is a specialized unit
    invoked at specific flow steps.
  - **Task-First Design**: Well-designed tasks elevate agent performance; 80% of effort goes
    into task design, 20% into agent configuration.
  - **Specialized Agents**: Each agent has a focused role (Research, Implementation, Review)
    with complementary skills.
  - **Multi-LLM Support**: Works with OpenAI, Anthropic (Claude), Google (Gemini), and
    Cursor API, configured via environment variables.
  - **Observable Execution**: Full tracing via Langfuse for execution graphs, metrics, and logs.

  ### Relevant Technologies

  **File Creation & Markdown**:
  - Python pathlib: Used for file I/O operations (reading, writing, path manipulation)
  - Markdown: Simple text format with heading syntax (# Level 1, ## Level 2, etc.)
  - UTF-8 text encoding: Standard for markdown files

  **Git Integration**:
  - Git command-line interface: Used for staging, committing, and pushing
  - Conventional Commits: Specification for structured commit messages (e.g., "feat(126): message")
  - Feature branches: Git workflow with isolated branches for feature development

  **Automation & Testing**:
  - CrewAI: Multi-agent framework for autonomous AI task execution
  - Python 3.11+: Standard library features (pathlib, subprocess for git operations)
  - Optional Langfuse integration: Observability platform for tracing and metrics

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-012sjx.md) to existing collection of 125+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-125; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create-9d166f` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 125+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 125+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (121-125) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Analysis phase complete — project structure understood, codebase patterns identified, affected areas assessed, complexity evaluated_
