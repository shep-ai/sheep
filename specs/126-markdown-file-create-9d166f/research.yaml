content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-20
  - **Confidence:** High (pattern validated across 125+ similar features)

  ## Technology Decisions

  ### 1. Content Generation Strategy

  **Chosen:** LLM-based generation using Claude API via CrewAI framework (existing codebase integration)

  **Rejected Alternatives:**
  - Hardcoded template content — sacrifices topic variety and violates established pattern
  - Random sentence sampling — unreliable coherence and poor semantic quality
  - File copying from existing test files — reduces feature credibility and violates spec

  **Rationale:** The content_generators.py module (lines 27-64) provides a proven `generate_markdown_content()` function that uses Claude API via CrewAI to generate coherent, topic-diverse prose. Features 121-125 already use this successfully. The function includes validation (lines 71-98) to ensure 2-3 sentences via period counting. Reusing this utility:
  - Eliminates dependency duplication (CrewAI already integrated)
  - Maintains consistency with established codebase patterns
  - Provides high-quality, varied output
  - Already handles error cases and logging

  **Implementation Details:**
  - Prompt template specifies H1 heading + 2-3 sentences (lines 13-24)
  - LLM response is cleaned (trailing newline added if missing)
  - Content validated before returning (calls _validate_markdown_content)
  - All content generation failures propagate as exceptions for caller handling

  ### 2. File I/O and Encoding

  **Chosen:** Python pathlib.Path with standard open() for UTF-8 encoding

  **Rejected Alternatives:**
  - os.open() with os.write() — lower-level without benefit for text files
  - External file libraries (chardet, pathspec) — unnecessary dependencies
  - Subprocess-based commands — platform-dependent, harder to control encoding precisely

  **Rationale:** The write_markdown_file() function in content_generators.py (lines 101-147) uses pathlib and open(encoding='utf-8') successfully. This approach:
  - Is idiomatic modern Python (3.11+ standard library)
  - Automatically handles Unix LF line endings on Linux/macOS (the deployment platform)
  - Supports safe filename validation (line 117-118 blocks path traversal)
  - Includes post-write verification (file exists, non-empty)
  - Matches feature 121-125 pattern exactly

  **Implementation Details:**
  - Uses `repo_root = Path.cwd()` to resolve repository root
  - Opens file with `open(file_path, "w", encoding="utf-8")` for UTF-8 without BOM
  - Validates file creation and size post-write (lines 131-142)
  - Returns filepath as string for downstream usage

  ### 3. Git Integration: Staging, Commit, Push

  **Chosen:** Use existing GitCommitTool and GitPushTool from sheep.tools.git_tools module

  **Rejected Alternatives:**
  - GitPython library — adds external dependency, less control, overkill for this workflow
  - Direct subprocess calls — duplicates logic, loses error handling and logging
  - os.system() — no output capture, no error handling, unsafe

  **Rationale:** The codebase already provides GitCommitTool and GitPushTool (sheep/tools/git_tools.py) that wrap subprocess.run() safely:
  - Both tools are Pydantic-based CrewAI tools with schema validation
  - GitCommitTool handles `git add` and `git commit` in one call
  - GitPushTool handles upstream tracking (set_upstream=True)
  - Both include logging via sheep.observability.logging
  - Content_generators.py (lines 274-360) and feature_121 already demonstrate this pattern

  **Implementation Details:**
  - GitCommitTool: Calls tool._run(repo_path, message, add_all=True)
  - GitPushTool: Calls tool._run(repo_path, remote='origin', set_upstream=True)
  - Both handle subprocess exceptions and log stderr
  - Custom commit message can be passed to GitCommitTool.commit_markdown_file()

  ### 4. Markdown Validation

  **Chosen:** Use validate_markdown_file() from content_generators.py after file write

  **Rejected Alternatives:**
  - No validation — risky for spec compliance
  - External markdown linters (remark, markdownlint) — adds dependencies for simple checks
  - Inline manual validation — code duplication

  **Rationale:** The validate_markdown_file() function (content_generators.py, lines 150-244) comprehensively validates all spec requirements:
  - **Encoding:** Checks UTF-8 validity, rejects BOM
  - **Line endings:** Rejects CRLF, requires LF
  - **Markdown syntax:** Verifies H1 heading at start, blank line separator
  - **Prose content:** Counts periods to verify 2-3 sentences
  - **Format:** Requires trailing newline (Unix convention)
  - **Exceptions:** Clear error messages for each validation failure

  This post-write validation is the established pattern across features 121-125 and provides comprehensive compliance checking.

  ### 5. Commit Message Format

  **Chosen:** Conventional commit format `feat(126): Create markdown file test-012sjx.md with prose content`

  **Rejected Alternatives:**
  - `feat: create markdown file` — loses feature number traceability
  - `feat(markdown-file-create)` — longer scope without atomic identifier
  - Custom format — violates spec and established pattern

  **Rationale:** The spec explicitly mandates this format (FR-8, success criterion). Features 121-125 use this pattern consistently (verified in git log: `feat(123):`, `feat(124):`, etc.). This format:
  - Maintains feature-to-commit traceability
  - Works with CI/CD parsing and analytics
  - Matches conventional commits specification
  - Is parsed by git tools and PR/issue automation

  **Implementation Details:**
  - Format: `feat({feature_number}): Create markdown file {filename} with prose content`
  - Can be customized via custom_message parameter in commit_markdown_file()
  - Topic extracted from H1 heading for additional context if needed

  ### 6. Content Topic Selection

  **Chosen:** Allow LLM to freely choose any topic via the MARKDOWN_GENERATION_PROMPT

  **Rejected Alternatives:**
  - Constrain to predefined list — adds validation overhead, reduces variety
  - Require specific domain — unnecessary constraint

  **Rationale:** Features 121-125 demonstrate that free topic selection works well. The prompt (content_generators.py, lines 13-24) specifies structure (H1 + 2-3 sentences) which ensures quality. The spec explicitly resolves this (openQuestions, question 1): "Free topic choice is recommended because it mirrors the successful pattern of features 121-125."

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | Python pathlib | File I/O, path resolution | **Use** | Standard library, idiomatic, already used in content_generators.py, no external dependencies |
  | Python subprocess | Git CLI execution | **Use** | Standard library, already used in git_tools.py for git command wrapping |
  | Python open() | File writing with encoding | **Use** | Standard library, supports UTF-8 encoding control, part of pathlib workflow |
  | CrewAI framework | LLM integration, tool abstraction | **Use** | Already integrated in codebase, provides BaseTool and Pydantic integration for GitCommitTool/GitPushTool |
  | Claude API | Content generation | **Use** | Already configured via sheep.config.llm.get_reasoning_llm(), used in features 121-125 |
  | Pydantic | Data validation, tool schemas | **Use** | Already required by CrewAI, used for all tool input schemas |
  | GitPython | Git operations | **Reject** | External dependency; codebase already has GitCommitTool/GitPushTool; adds unnecessary complexity |
  | Markdown linters (remark, markdownlint) | Markdown validation | **Reject** | External dependencies; existing validate_markdown_file() covers all requirements |
  | chardet/encoding libraries | Encoding detection | **Reject** | Unnecessary; UTF-8 is specified, no detection needed |

  ## Security Considerations

  ### 1. Path Traversal Prevention

  **Status:** Handled by existing write_markdown_file()

  - Filename validation prevents directory separators (`/`, `\\`) and dot-prefixed files
  - Implementation: lines 117-118 in content_generators.py
  - Ensures file is created only in repository root, never in subdirectories
  - Filename `test-012sjx.md` passes validation

  ### 2. File Encoding and Injection

  **Status:** Secured via UTF-8 with proper validation

  - UTF-8 encoding prevents binary data injection
  - No shell interpretation occurs (pathlib.open, not subprocess)
  - No command injection possible (git operations use list-based args, not shell=True)
  - Validation rejects files with BOM or other encoding issues

  ### 3. Git Operations

  **Status:** Secured by subprocess without shell=True

  - GitCommitTool and GitPushTool use subprocess.run() with list args (not shell=True)
  - Command is constructed safely: `["git", "add", ...]`
  - No command injection possible
  - Credentials/SSH keys handled by git configuration (not embedded in code)

  ### 4. Content Generation

  **Status:** No security risk; LLM generates prose, not code

  - Generated content is markdown text, never executed
  - Content is validated before file write
  - No injection vectors in markdown format
  - Prompt is internal, not user-controlled

  ### 5. File Permissions

  **Status:** Uses system defaults

  - Files created with default umask permissions (typically 0644 on Unix)
  - Repository is already readable by agents (existing test files confirm)
  - No elevated permissions needed or used

  ## Performance Implications

  ### 1. Content Generation Latency

  - **Impact:** Dominant factor in overall execution time
  - **Estimate:** LLM API call ~500-2000ms (Claude API latency)
  - **Mitigation:** None needed; unavoidable for semantic content generation
  - **Precedent:** Features 121-125 tolerate this; spec allows 10-15 minutes

  ### 2. File I/O Operations

  - **Impact:** Negligible (~1-5ms for write, validation)
  - **File size:** 400-600 bytes; modern filesystems handle instantly
  - **Encoding:** UTF-8 write is atomic operation
  - **No optimization needed:** Already optimal with pathlib

  ### 3. Git Operations

  - **Impact:** Moderate (~100-500ms per git command)
  - **Network:** Push requires remote connectivity; can be slow on slow networks
  - **Staging:** `git add` is fast (local metadata update)
  - **Commit:** Local operation, fast (~50-100ms)
  - **Push:** Network-bound; typically 200-500ms for small files
  - **Precedent:** Features 121-125 include this in 10-15 minute estimate

  ### 4. Validation Operations

  - **Impact:** Minimal (~5-10ms for regex/encoding checks)
  - **Binary read:** File size is small; no performance issue
  - **UTF-8 decode:** Standard library optimized for this
  - **Pattern matching:** Simple regexes, not complex

  ### 5. Overall Workflow Performance

  - **Estimated total:** 700-2500ms (LLM 500-2000ms + file/git 200-500ms)
  - **Actual measured time:** Features 121-125 complete in ~1-3 minutes per feature
  - **Bottleneck:** LLM API latency, not local operations
  - **Conclusion:** Performance is acceptable; no optimization needed for this feature scope

