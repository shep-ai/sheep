# Markdown content (the full tasks document)
content: |
  ## Summary

  This 8-task breakdown implements feature 126 across 4 phases:

  **Phase 1 (Module Setup):** Create the feature module with constants and imports (task-1).
  This is the entry point for all downstream work.

  **Phase 2 (Content & File I/O):** Generate markdown prose via Claude API (task-2), write
  the file with UTF-8 encoding, and validate it against all spec requirements (task-3).

  **Phase 3 (Git Integration):** Stage and commit with conventional message format (task-4),
  then push to the feature branch with upstream tracking (task-5).

  **Phase 4 (Integration & Verification):** Wire all components into a cohesive orchestration
  function (task-6), then verify the complete end-to-end workflow against spec (task-7).
  Finally, add documentation and finalize the module (task-8).

  ## Effort Estimates

  Total estimated effort: **2.5 hours**

  This includes:
  - Code implementation: ~1.5 hours
  - Testing (TDD red/green/refactor cycles): ~0.7 hours
  - Documentation: ~0.3 hours
  - LLM API latency is unavoidable bottleneck (~500-2000ms per content generation) but is
    included in the \"actual running time\" not the implementation effort

  ## Task Dependencies

  - **task-1** (Module Setup) has no dependencies — start here
  - **task-2** (Content Generation) depends on **task-1**
  - **task-3** (File I/O & Validation) depends on **task-2**
  - **task-4** (Git Commit) depends on **task-3**
  - **task-5** (Git Push) depends on **task-4**
  - **task-6** (Orchestration) depends on **task-5**
  - **task-7** (End-to-End Test) depends on **task-6**
  - **task-8** (Documentation) depends on **task-7**

  All tasks form a linear dependency chain — they must be completed sequentially.

  ## Key Testing Strategy

  Each task uses TDD with RED-GREEN-REFACTOR cycles:

  - **RED:** Write test assertions that currently fail (test-driven)
  - **GREEN:** Implement minimal code to pass the test
  - **REFACTOR:** Clean up, improve naming, add logging/docs, ensure consistency with codebase

  Tests focus on behavior (content is correct, file exists, git commit has right message)
  rather than implementation details.

  ## Implementation Notes

  1. **Reuse Existing Utilities:** All heavy lifting (content generation, file I/O, git tools)
     comes from existing modules. Feature 126 is purely orchestration.

  2. **Error Handling:** All exceptions propagate to the orchestration function caller
     (the Sheep flow/agent). No try/except at feature module level — let errors bubble up.

  3. **Logging:** Use sheep.observability.logging.get_logger() consistently for debugging.
     Each step should log what it's doing (e.g., \"Generated markdown content\", \"Pushed to origin\").

  4. **Spec Compliance:** Success is defined by the spec criteria in plan.yaml. End-to-end
     test (task-7) validates all of them.

  5. **Pattern Consistency:** Follow features 121-125 exactly. Look at feature_121 or
     feature_125 module as reference.
