name: state-machine-diagram-a77db2
summary: >
  This feature adds a single markdown file (ATM_STATE_MACHINE.md) following the established
  NOUN_STATE_MACHINE.md pattern already used by five existing examples in the repo root.
  No libraries, build steps, or code changes are required — only valid Mermaid stateDiagram-v2
  syntax and adherence to the existing file structure conventions.

relatedFeatures: []

technologies:
  - Markdown
  - Mermaid stateDiagram-v2

relatedLinks:
  - https://mermaid.js.org/syntax/stateDiagram.html

decisions:
  - title: 'Diagram Syntax Version'
    chosen: 'Mermaid stateDiagram-v2'
    rejected:
      - 'stateDiagram (v1) — all existing examples (ELEVATOR, DOOR_LOCK, VENDING_MACHINE, TURNSTILE, STATE_MACHINE) use stateDiagram-v2; v1 is deprecated and inconsistent with the established pattern'
      - 'PlantUML — not used anywhere in the repo; requires separate rendering toolchain not present in project'
    rationale: >
      Every existing state machine file in the repository uses stateDiagram-v2 syntax
      (confirmed in ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, etc.).
      Using the same version ensures rendering consistency across all Mermaid-compatible
      viewers (GitHub, VS Code, etc.) and matches the established convention.

  - title: 'File Placement'
    chosen: 'Repository root (alongside existing *_STATE_MACHINE.md files)'
    rejected:
      - 'docs/ subdirectory — no docs/ directory exists; existing examples all live at root'
      - 'examples/ subdirectory — no examples/ directory exists; moving there would break the established flat pattern'
    rationale: >
      All five existing state machine markdown files (STATE_MACHINE.md,
      DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md,
      TURNSTILE_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md) are at the repository root.
      Placing ATM_STATE_MACHINE.md at root is the only option consistent with the pattern.

  - title: 'ATM State Graph Design'
    chosen: '6-state linear flow with a PIN retry branch: Idle → CardInserted → PINEntry → Authenticated → Dispensing → EjectCard → Idle'
    rejected:
      - '3-4 state minimal graph (Idle/CardInserted/Dispensing/Idle) — too trivial; omits the error/retry path required by FR-4 and would be less illustrative than existing examples'
      - '8+ state detailed graph (adding CardBlocked, OutOfCash, NetworkError states) — exceeds the "simple example" goal and NFR-1 (≤50 lines); increases cognitive load without proportional benefit'
    rationale: >
      6 states (Idle, CardInserted, PINEntry, Authenticated, Dispensing, EjectCard) satisfies
      FR-3 and matches the complexity of ELEVATOR_STATE_MACHINE.md (~6 states).
      A wrongPIN self-loop on PINEntry fulfills FR-4 (error/retry path) without adding extra
      states. This keeps the total file well under 50 lines (NFR-1).

openQuestions: []

content: |
  ## Technology Decisions

  ### 1. Diagram Syntax Version

  **Chosen:** Mermaid `stateDiagram-v2`

  **Rejected:**
  - `stateDiagram` v1 — deprecated; all existing repo examples use v2
  - PlantUML — not in use anywhere; requires separate toolchain

  **Rationale:** Consistency with all five existing state machine examples which all use
  `stateDiagram-v2`. Standard Mermaid rendering on GitHub and VS Code supports this natively.

  ### 2. File Placement

  **Chosen:** Repository root

  **Rejected:**
  - `docs/` subdirectory — does not exist in the repo
  - `examples/` subdirectory — does not exist; breaks flat pattern

  **Rationale:** All existing examples live at root. No directory restructuring needed.

  ### 3. ATM State Graph Design

  **Chosen:** 6-state flow with PIN retry self-loop

  States: `Idle → CardInserted → PINEntry → Authenticated → Dispensing → EjectCard → Idle`

  Error path: `PINEntry --> PINEntry : wrong PIN` (self-loop for retry)

  **Rejected:**
  - 3-4 states — too minimal, misses required error path (FR-4)
  - 8+ states — bloats a "simple example" file past NFR-1 (≤50 lines)

  **Rationale:** 6 states matches existing elevator example complexity, satisfies all
  functional requirements, and stays well within the 50-line limit.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Mermaid stateDiagram-v2 | State diagram rendering | Use | Standard across all existing examples; no install required |
  | PlantUML | Alternative diagram DSL | Reject | Not used in repo; requires separate toolchain |
  | Mermaid stateDiagram v1 | Legacy diagram syntax | Reject | Deprecated; inconsistent with existing files |

  ## Security Considerations

  None. This is a static markdown file with no code execution, no user input, no
  external links, and no sensitive content. No security implications.

  ## Performance Implications

  None. A single ≤50-line markdown file has negligible impact on any build, test,
  or rendering pipeline.

  ## Architecture Notes

  This is a purely additive change. The file follows an already-established pattern
  (five prior examples) with zero coupling to any source code. No build configuration,
  test files, or documentation indexes need to be updated.
