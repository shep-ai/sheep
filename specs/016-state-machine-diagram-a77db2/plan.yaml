# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The repository root contains five standalone state machine markdown files
  (STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md, VENDING_MACHINE_STATE_MACHINE.md,
  TURNSTILE_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md). This feature adds a sixth
  following the identical pattern: SCREAMING_SNAKE_CASE filename ending in
  _STATE_MACHINE.md, an H1 title, a short description, and a single
  `stateDiagram-v2` Mermaid code block.

  ## Key Design Decisions

  **Mermaid stateDiagram-v2 (not v1):** Every existing example uses v2. V1 is
  deprecated and would be inconsistent.

  **Repository root placement:** All five existing files are at root. No docs/ or
  examples/ directory exists; creating one would break the flat pattern.

  **6-state ATM graph with PIN retry self-loop:**
  Idle → CardInserted → PINEntry → Authenticated → Dispensing → EjectCard → Idle
  A wrongPIN self-loop on PINEntry satisfies FR-4 (error/retry path) without
  adding extra states, keeping the file well under the 50-line limit (NFR-1).

  ## Implementation Strategy

  Single phase, single task. Write the file. No build, no tests, no side effects.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Invalid Mermaid syntax | Manually verify block against Mermaid v2 grammar before committing |
  | File exceeds 50-line limit | Keep description to 2-4 sentences; count lines before committing |
