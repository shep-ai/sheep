# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository contains several state machine diagram examples as standalone markdown files
  (traffic light, door lock, vending machine, turnstile, elevator). A new simple state machine
  example is needed to extend the collection with a fresh, universally understood domain
  that is clearly unrelated to the repo's core purpose.

  ## Success Criteria

  - [ ] A file named `ATM_STATE_MACHINE.md` exists at the repository root
  - [ ] The file contains a valid Mermaid `stateDiagram-v2` code block
  - [ ] The diagram has 5–7 states covering a realistic ATM flow including an error/retry path
  - [ ] The file includes a title (H1) and a brief one-paragraph description above the diagram
  - [ ] The Mermaid syntax is correct and renders without errors in standard Mermaid tooling
  - [ ] The filename follows the `NOUN_STATE_MACHINE.md` naming convention of existing files
  - [ ] The domain is self-contained — no references to the repo's own codebase or domain

  ## Functional Requirements

  - **FR-1**: The system shall provide a new markdown file `ATM_STATE_MACHINE.md` at the repository root.
  - **FR-2**: The file shall contain exactly one Mermaid `stateDiagram-v2` diagram block.
  - **FR-3**: The diagram shall model an ATM (Automated Teller Machine) state machine with states including at minimum: Idle, CardInserted, PINEntry, Authenticated, Dispensing, and EjectCard.
  - **FR-4**: The diagram shall include at least one error/retry transition (e.g., wrong PIN returning to PINEntry or ejecting card after max attempts).
  - **FR-5**: All state transitions shall be labeled with the triggering event or action.
  - **FR-6**: The file shall open with an H1 heading and a short description paragraph (2–4 sentences) explaining the example.

  ## Non-Functional Requirements

  - **NFR-1**: The file must be ≤ 50 lines total to remain concise and scannable.
  - **NFR-2**: The Mermaid diagram must use only `stateDiagram-v2` syntax (not `stateDiagram` v1) for consistency with all existing examples.
  - **NFR-3**: The content must be self-contained — no external links, imports, or dependencies.
  - **NFR-4**: The filename must use SCREAMING_SNAKE_CASE ending in `_STATE_MACHINE.md` to match established conventions.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Which domain/theme? | ATM / bank machine | Universally understood, distinct from all existing examples, simple natural state graph |
  | 2 | How many states? | Simple (5–7 states) | Matches existing example complexity; allows realistic error path without bloat |
  | 3 | Output filename? | ATM_STATE_MACHINE.md | Matches NOUN_STATE_MACHINE.md convention used by all other examples |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root markdown files | Low | Add one new `.md` file following existing conventions |

  ## Dependencies

  None. Purely additive — a new standalone markdown file with a Mermaid diagram.

  ## Size Estimate

  **S** — Single markdown file, ≤ 50 lines, following an already-established pattern.
  No code changes, no tests, no build impact.
