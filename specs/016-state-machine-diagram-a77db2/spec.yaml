content: |
  ## Problem Statement

  The repository contains several state machine diagram examples as standalone markdown files
  (traffic light, door lock, vending machine, turnstile, elevator). A new simple state machine
  example is needed, unrelated to the repo's core domain.

  ## Codebase Analysis

  ### Project Structure

  The root directory contains flat markdown files for standalone diagram examples:
  - `STATE_MACHINE.md` — traffic light example
  - `DOOR_LOCK_STATE_MACHINE.md` — door lock example
  - `VENDING_MACHINE_STATE_MACHINE.md` — vending machine example
  - `TURNSTILE_STATE_MACHINE.md` — turnstile example
  - `ELEVATOR_STATE_MACHINE.md` — elevator example

  ### Architecture Patterns

  Each file is self-contained: a title, brief description, and a Mermaid `stateDiagram-v2`
  block showing states, transitions, and labels. No cross-file dependencies.

  ### Relevant Technologies

  - **Markdown**: file format
  - **Mermaid stateDiagram-v2**: diagram syntax used across all existing examples

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root markdown files | Low | Add one new `.md` file following existing conventions |

  ## Dependencies

  None. Purely additive — a new standalone markdown file with a Mermaid diagram.

  ## Size Estimate

  **S** — Single markdown file, ~20-30 lines, following an already-established pattern.
  No code changes, no tests, no build impact.
