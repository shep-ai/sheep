# Structured technology decisions
decisions:
  - title: 'File I/O Method — pathlib vs Alternatives'
    chosen: 'Python pathlib.Path for file creation and writing'
    rejected:
      - 'open()/write() builtin — More verbose, lower-level API, lacks modern Pythonic conveniences (Path objects, method chaining). All 65+ established test files use pathlib, making this inconsistent with codebase conventions.'
      - 'os.path module — Deprecated pattern in modern Python 3, string-based path handling lacks type safety and readability. pathlib supersedes this approach completely in Python 3.4+'
      - 'Third-party libraries (pathspec, upath) — Unnecessary abstraction for simple local file operations. Introduces external dependencies without benefit. Python stdlib pathlib is sufficient and already available.'
    rationale: >
      pathlib.Path is the modern, Pythonic standard in Python 3.4+ and is required by the project's
      Python 3.11+ constraint. All 65+ existing test files in the repository use pathlib directly,
      establishing a clear architectural precedent. pathlib provides: (1) Object-oriented path
      handling, (2) Method chaining for readable code (Path(filename).write_text(content)),
      (3) Cross-platform path handling, (4) Built-in encodings parameter for explicit UTF-8.
      No external dependencies, part of Python stdlib, matches established codebase pattern.

  - title: 'Text Encoding — UTF-8 vs Alternatives'
    chosen: 'UTF-8 without BOM (Byte Order Mark)'
    rejected:
      - 'ASCII — Insufficient for non-ASCII characters, overly restrictive. Modern web and files standard is UTF-8.'
      - 'UTF-8 with BOM — Adds unnecessary 3-byte prefix that confuses some tools and editors. Unix convention and version control systems prefer UTF-8 without BOM. All 65+ existing test files use UTF-8 without BOM.'
      - 'UTF-16 or other encodings — Platform-specific, heavier, and inconsistent with project standards. Python 3 defaults to UTF-8 for good reason.'
    rationale: >
      UTF-8 without BOM is the universal standard for text files in modern software development,
      version control systems (Git), and web standards. Python 3's default text encoding is UTF-8.
      All existing test files in the repository follow this pattern. BOM (Byte Order Mark) is
      unnecessary for UTF-8 and can cause issues with Unix tools and editors. The pathlib.Path.write_text()
      method defaults to UTF-8 encoding, making this the implicit behavior.

  - title: 'Line Endings — LF vs CRLF'
    chosen: 'Unix-style LF (Line Feed, \n) line endings'
    rejected:
      - 'Windows CRLF (\r\n) — Platform-specific, causes issues in cross-platform development and Git. Modern Windows and VSCode default to LF. Inconsistent with 65+ existing test files and Git best practices.'
      - 'Legacy CR (\r) — Obsolete format from classic Macintosh, never appropriate in modern systems.'
    rationale: >
      LF line endings are the Unix standard, Git best practice, and what all 65+ existing test files
      use. The feature development environment is Linux (as evidenced by the worktree path and
      repository configuration). Git's core.autocrlf is typically disabled or set to false in
      Unix environments, ensuring LF is preserved. Python's pathlib.Path.write_text() on Unix
      systems defaults to LF line endings. This ensures consistency across platforms and with
      the existing codebase.

  - title: 'Content Format — Structure and Validation'
    chosen: 'Markdown heading + blank line + 2-3 sentences of prose'
    rejected:
      - 'Flexible heading levels — Using h2/h3 instead of h1. Feature requirements specify exactly one h1 heading. H1 is the standard for file titles and matches established pattern.'
      - 'No blank line separation — Combining heading and prose on consecutive lines. Established pattern in all 65+ files includes blank line for readability and CommonMark compliance.'
      - 'Single sentence or 4+ sentences — Feature spec explicitly requires 2-3 sentences. This constraint is documented and should be validated.'
    rationale: >
      The established pattern (confirmed by reviewing test-uiq4ld.md, test-local-abc123.md,
      test-gt1tgb.md, and others) is: heading on line 1, blank line on line 2, prose on line 3,
      trailing newline on line 4. This follows CommonMark specification for document structure.
      The spec requirement of exactly 2-3 sentences provides clear validation criteria and matches
      the observed pattern in existing files. Content should be human-readable and topically coherent.

  - title: 'Git Workflow — Commit Strategy'
    chosen: 'Standard git add, conventional commit, and push to feature branch'
    rejected:
      - 'Amending previous commits — Not applicable; this is a new file, not a modification. Amends would create confusion and obscure clear history.'
      - 'Multiple commits per file — Unnecessary fragmentation. Single file creation warrants single commit. Matches pattern from features 070-072.'
      - 'Squashing or rebasing — Adds unnecessary complexity for a single-file feature. Simple linear history is appropriate.'
    rationale: >
      The git workflow follows conventional commit standards and established pattern from features
      070-072. Process: (1) File already staged by pathlib.write_text() in repository root,
      (2) git add test-i85c38.md stages the file, (3) git commit with message
      'feat(073): create markdown file test-i85c38.md with prose content' follows conventional
      commit format (type: feat, scope: 073), (4) git push -u origin HEAD pushes to the pre-created
      feature branch feat/073-markdown-file-creation-07153b. No complications; straightforward
      single commit for single file creation.

