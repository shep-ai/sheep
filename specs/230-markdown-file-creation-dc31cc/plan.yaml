content: |
  ## Architecture Overview

  The implementation uses a standalone, self-contained Python script (`create_test_markdown.py`)
  that combines file creation and git workflow automation. This architecture:

  - **Minimizes dependencies:** Uses only Python 3.11+ standard library (pathlib, subprocess)
  - **Avoids framework coupling:** No integration to Sheep agents, CrewAI, or src/sheep/
  - **Ensures portability:** Runs locally, in CI/CD, or embedded in any automation context
  - **Follows proven precedent:** Matches successful pattern from features 151-229 (230+ test files)
  - **Maintains simplicity:** Single-purpose script with no orchestration overhead

  The script is deterministic (no external APIs, no async operations) and self-contained
  (all dependencies pre-installed or in standard library). Git operations assume the
  feature branch already exists and git credentials are configured.

  ## Key Design Decisions

  ### Decision 1: File Creation with pathlib.Path().write_text()

  **Chosen:** Python pathlib for text file creation with explicit UTF-8 encoding and LF line endings.

  **Why:** pathlib is the modern, idiomatic approach for Python 3.11+:
  - Clean, intuitive API for text file operations
  - Automatic resource cleanup (no manual file handles or context managers)
  - Explicit encoding=\"utf-8\" parameter produces UTF-8 without BOM (Python default)
  - Cross-platform path handling
  - Zero external dependencies (standard library)

  **Rationale from research:** Matches requirements FR-5 (UTF-8 without BOM) and FR-6 (LF line endings).
  Content string uses explicit \\n (not \\r\\n) to guarantee LF line endings across all platforms.

  **Alternatives rejected:**
  - open() context manager — verbose boilerplate, requires manual resource management
  - Shell echo command — less portable, harder to control encoding/line endings precisely
  - Third-party libraries — introduces unnecessary external dependencies

  ### Decision 2: Git Workflow Automation with subprocess Module

  **Chosen:** Python subprocess module with explicit git commands (git add, git commit, git push).

  **Why:** subprocess is standard library and provides:
  - Secure command execution via explicit argument lists (prevents shell injection)
  - Output capture and error handling capabilities
  - Cross-platform compatibility
  - No external dependencies (unlike GitPython)

  **Feature requirements mapping:**
  - FR-7: git add test-xekj8s.md (stage file)
  - FR-8: git commit -m \"feat(230): Create markdown file test-xekj8s.md with prose content\" (conventional commit)
  - FR-9: git push -u origin HEAD (push to feature branch)

  **Alternatives rejected:**
  - GitPython — external dependency conflicts with NFR-4 (no new dependencies)
  - os.system() — less secure, harder to capture output
  - Manual git operations — requires human intervention, not automation

  ### Decision 3: Manual Prose Composition

  **Chosen:** Manually composed, unique 2-3 sentences of meaningful prose on arbitrary topic.

  **Why:** All 230+ existing test files contain manually written, unique content:
  - Ensures grammatical correctness (required by NFR-2)
  - Meaningful, coherent prose suitable as documentation and test examples
  - Consistency with established pattern and community expectations
  - Minimal overhead (2-3 sentences takes ~2 minutes to compose and review)

  **Topic flexibility:** Spec permits \"about anything\" (NFR-7), so selection is completely unconstrained.

  **Alternatives rejected:**
  - Programmatic generation (random sentences, templates) — introduces complexity, risks grammar errors
  - Template reuse — violates uniqueness principle, reduces test file value as examples
  - LLM/API generation — external dependency, non-deterministic output, quality variance

  ### Decision 4: Standalone Script Architecture (No Framework Integration)

  **Chosen:** Single Python script with no integration to Sheep platform (CrewAI agents, etc.).

  **Why:** Feature has no complex orchestration needs:
  - File creation is deterministic, requires only standard library
  - No dependencies on agentic system, no CrewAI task definitions needed
  - Simplest and most portable approach

  **Benefits:**
  - No framework learning curve or coupling to src/sheep/
  - Can be executed by humans, CI/CD, or automation without special setup
  - Easier to test and debug independently
  - Matches successful pattern from features 151-229

  **Per NFR-5:** Feature does not modify source code in src/sheep/ or production directories.

  **Alternatives rejected:**
  - CrewAI agent integration — adds unnecessary framework complexity
  - Shell script wrapper — less portable, harder to control text encoding
  - Manual CLI invocation — not automated, requires operator for each step

  ### Decision 5: Encoding and Line Endings

  **Chosen:** UTF-8 without BOM, LF line endings (\\n), via pathlib.write_text(encoding=\"utf-8\").

  **How it works:**
  - pathlib.write_text(..., encoding=\"utf-8\") produces UTF-8 without BOM (Python default)
  - Content string explicitly uses \\n (not \\r\\n) for LF line endings
  - No post-processing or external converters needed

  **Matches spec requirements:**
  - FR-5: UTF-8 without Byte Order Mark
  - FR-6: LF (\\n) line endings, not CRLF
  - NFR-1: File size naturally falls within 300-600 bytes for 2-3 sentences

  **Alternatives rejected:**
  - Binary mode with manual encoding — unnecessary complexity, error-prone
  - Platform-dependent line endings (os.linesep) — violates spec requirement for LF only
  - External converters (dos2unix, iconv) — adds post-processing and dependencies

  ## Implementation Strategy

  ### Phase 1: Script Development & Content Composition

  **Goal:** Create complete, ready-to-execute Python script with all dependencies included.

  **Approach:**
  1. Script structure: imports (pathlib, subprocess), main() function, entry point
  2. Content composition: Write meaningful 2-3 sentences on arbitrary topic
  3. File creation: pathlib.Path().write_text() with UTF-8 and explicit LF
  4. Git workflow: Three subprocess.run() calls (add, commit, push)
  5. Integration: Wire all components together in main()

  **Ordering rationale:** Build from simple structure → add content → implement file creation → add git operations.
  Dependencies flow logically (can't create file without content, can't commit without file existing).

  ### Phase 2: Execution & Validation

  **Goal:** Verify feature implementation meets all success criteria.

  **Approach:**
  1. Execute script — run create_test_markdown.py, verify exit code 0
  2. Validate file properties — check encoding, line endings, size, name, format
  3. Verify git operations — confirm file staged, committed, and pushed

  **Ordering rationale:** Execution first (creates file), then validate output (file properties),
  finally verify process (git operations).

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Git config missing (user.name/user.email) | Low | Assume pre-configured. Error message will indicate if git fails. Operator can configure and retry. |
  | Repository write permissions insufficient | Very Low | Repository is already writable (230+ test files exist). Same directory, same permissions. |
  | Prose content fails grammar requirement | Very Low | Manual composition with human review ensures quality. Arbitrary topic allows full flexibility. |
  | Line endings converted to CRLF on Windows | Low | Python text mode with explicit \\n handles correctly. pathlib doesn't perform line ending conversion. |
  | File size falls outside 300-600 byte range | Very Low | 2-3 sentences naturally falls within range (~400 bytes typical). Can spot-check before final commit. |
  | Feature branch doesn't exist or is stale | Low | Feature branch pre-created per spec. Standard push to HEAD works. No merge conflicts (single new file). |
  | Git push fails due to remote issues | Low | Simple deterministic push to pre-created branch. If failure occurs, error message indicates root cause. |
