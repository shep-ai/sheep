      Requirement FR-5 through FR-7 mandate specific git commands: git add, git commit, git push.
      All 97+ prior features use CLI commands (see pattern in features 069-097).
      Subprocess calls to git are reliable, standard, and require no additional dependencies.
      Example: subprocess.run(['git', 'add', 'test-rgq7az.md']) is clear and executable.

  - title: 'Commit Message Format: Conventional Commits vs alternatives'
