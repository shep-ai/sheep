# Structured technology decisions
decisions:
  - title: 'File Creation Method: pathlib.Path.write_text() vs alternatives'
    chosen: 'Python pathlib.Path.write_text()'
    rejected:
      - 'open() and f.write(): More verbose, less idiomatic Python 3 code; requires explicit close or context manager'
      - 'Subprocess shell command (echo, cat): Introduces shell escaping complexity, less portable, harder to control encoding/line endings'
    rationale: >
      pathlib is the modern Python approach (recommended in Python docs) and provides clean, readable code.
      Requirement FR-4 explicitly mandates use of pathlib: "Path(\"test-rgq7az.md\").write_text(content)".
      pathlib.write_text() handles file encoding and provides straightforward control over encoding parameter.
      This aligns with codebase patterns in src/sheep/tools/file_tools.py which uses pathlib for file operations.

  - title: 'Content Structure: Format of markdown heading and prose'
    chosen: 'H1 heading + blank line + 2-3 sentences (as established in 97+ existing test files)'
    rejected:
      - 'H1 heading + prose without blank line: Violates markdown best practices and established pattern seen in test-u6624u.md, test-uxhn30.md'
      - 'Multiple heading levels: Unnecessary complexity, spec requires single H1 heading, existing pattern uses only H1'
    rationale: >
      The 97+ existing test files follow a consistent pattern: H1 heading, blank line, 2-3 sentences.
      Examples: test-u6624u.md ("# The Power of Persistence" + blank line + 3 sentences = 414 bytes),
      test-uxhn30.md ("# The Power of Incremental Progress" + blank line + 3 sentences = 333 bytes).
      Blank line follows markdown syntax best practices and improves readability.
      This pattern is well-validated across features 069-097.

  - title: 'Topic Selection: Agent judgment vs pre-defined topic'
    chosen: 'Agent judgment from generic/universal category (flexible topic selection)'
    rejected:
      - 'Pre-defined specific topic in spec: Less flexible, requires spec update for each feature; reduces test file variety'
      - 'Pre-curated list of 3-5 topics: Requires maintaining list in spec; adds overhead without clear benefit over agent judgment'
    rationale: >
      Spec explicitly resolves this in openQuestions: Agent-selected approach is recommended.
      97+ prior features demonstrate agents successfully select coherent, appropriate topics when guided by category constraint.
      Generic/universal topics include: "The Power of Persistence", "The Value of Small Steps", "Why Curiosity Matters",
      "The Power of Incremental Progress", "The Importance of Continuous Learning" (see existing test files).
      Agent has full autonomy to compose original prose on chosen topic, ensuring variety while maintaining quality.

  - title: 'Encoding and Line Endings: UTF-8/LF vs alternatives'
    chosen: 'Explicit UTF-8 encoding (no BOM) with Unix-style LF line endings'
    rejected:
      - 'Use default system encoding: May result in non-UTF-8 on some systems; violates NFR-3 (UTF-8 required)'
      - 'Allow CRLF line endings: Violates NFR-4 (Unix-style LF required); creates cross-platform inconsistency'
    rationale: >
      Requirement NFR-3 mandates UTF-8 without BOM; NFR-4 mandates Unix-style LF.
      pathlib.write_text() in Python defaults to UTF-8 without BOM on modern systems, but to ensure compliance
      across all platforms, explicitly pass encoding='utf-8' parameter.
      Line endings: pathlib.write_text() uses system default (LF on Unix/Mac, CRLF on Windows).
      To ensure Unix-style LF, explicitly use '\n' in content string (Python's universal newlines will convert to LF on write).
      All Python string literals use '\n' by default, so no additional configuration needed if content is composed correctly.

  - title: 'Prose Composition: Direct composition vs templates vs external generation'
    chosen: 'Direct composition of original prose by agent at implementation time'
    rejected:
      - 'Template-based approach: Unnecessary indirection for simple content; reduces prose originality; adds template management overhead'
      - 'External content generation (API call): Introduces external dependency and latency; overengineered for simple prose; violates simplicity principle'
    rationale: >
      The feature requires "2-3 sentences of prose content" (FR-3).
      Direct composition allows agents to select topic and compose grammatically correct, original prose on-demand.
      This is how 97+ prior features have successfully implemented this (features 069-097).
      Simple, direct approach minimizes complexity and dependencies.
      Prose quality is high when agents follow: (1) generic/universal topic, (2) 2-3 complete sentences, (3) grammatical correctness, (4) 320-600 byte size constraint.

  - title: 'File Size Validation: Acceptable range and enforcement'
    chosen: '320-600 bytes (observed range from 97+ existing test files)'
    rejected:
      - 'Strict enforcement at 400 bytes: Too rigid; existing files range from 333-617 bytes; prevents natural prose variation'
      - 'No size constraint: Would allow excessively short or long content; 320-600 range provides clear target'
    rationale: >
      Requirement NFR-5 specifies "should fall within 320-600 bytes".
      Actual range in existing test files: 333-617 bytes (with most clustering 350-550).
      This size constraint ensures content is neither too terse nor too verbose.
      H1 heading + 3 sentences naturally produces ~330-600 bytes when composed by agent.
      Size validation can be performed post-creation using: wc -c test-rgq7az.md

  - title: 'Git Operations: CLI commands vs GitPython library'
    chosen: 'Standard git CLI commands (git add, git commit, git push) executed via subprocess'
    rejected:
      - 'GitPython library: Adds external dependency; same functionality available via CLI; CLI is standard in Sheep codebase'
