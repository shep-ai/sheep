content: |
  ## Task Breakdown Summary

  This feature requires 5 concrete tasks across 3 implementation phases:

  **Phase 1: File Creation & Validation (Task 1 — 5 min)**
  - Compose prose on generic/universal topic; create file using pathlib with UTF-8/LF encoding
  - Validate: structure (H1 heading + blank line + 2-3 sentences), size (320-600 bytes), encoding, line endings
  - Foundation for git workflow; all validations must pass before proceeding

  **Phase 2: Git Workflow (Tasks 2-4 — 4 min total)**
  - Task 2: Stage file with `git add test-rgq7az.md` (1m)
  - Task 3: Commit with conventional message `feat(098): create markdown file test-rgq7az.md with prose content` (1m)
  - Task 4: Push to feature branch with `git push -u origin HEAD` (2m)
  - Sequential execution: each task depends on previous success

  **Phase 3: Final Validation (Task 5 — 2 min)**
  - Comprehensive validation against all 12 success criteria from spec
  - Verify file properties, git state, and repository cleanliness
  - Document completion and confirm feature is ready

  **Total Estimated Effort: 11 minutes**

  ## Task Dependencies

  ```
  Task 1 (File Creation)
    ↓
  Task 2 (Git Add)
    ↓
  Task 3 (Git Commit)
    ↓
  Task 4 (Git Push)
    ↓
  Task 5 (Final Validation)
  ```

  All tasks execute sequentially. No parallel execution possible; each depends on previous task success.

  ## TDD Strategy

  Each task follows RED-GREEN-REFACTOR cycle:

  - **RED**: Assert precondition (file/state does not exist yet)
  - **GREEN**: Implement minimal code/commands to satisfy acceptance criteria
  - **REFACTOR**: Verify properties (encoding, size, git state, etc.) match spec

  For git operations (tasks 2-4), "RED" may be checking current state (staged/committed/pushed),
  "GREEN" is executing the command, and "REFACTOR" is verifying the result.

  For validation-only task (task 5), RED is skipped; GREEN runs all checks, REFACTOR documents results.

  ---

  **Implementation ready to proceed.** All tasks sequenced with clear dependencies and acceptance criteria.
