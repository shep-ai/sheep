# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-hsds9t.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 114-124, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-hsds9t.md` is created in the repository root directory
  - [ ] File contains a valid markdown H1 heading (single # prefix) as the first element
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] Prose content is neutral, general-purpose, and grammatically correct
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File size is between 400-600 bytes (consistent with established pattern)
  - [ ] File is staged in git (`git add test-hsds9t.md`)
  - [ ] File is committed with conventional commit message format: `feat(125): create markdown file test-hsds9t.md with prose content`
  - [ ] Commit is pushed to the `feat/125-markdown-file-creation-22d95d` feature branch
  - [ ] No other files in the repository are modified (only test-hsds9t.md is created)
  - [ ] Git commit includes no source code, configuration, or spec file changes

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-hsds9t.md` in the repository root
  - **FR-2**: The file must contain a markdown H1 heading (prefixed with single #) as the first line
  - **FR-3**: The heading should be a meaningful title related to the prose content topic
  - **FR-4**: The file must contain exactly 2-3 sentences of prose content below the heading, separated by a blank line
  - **FR-5**: Each sentence must be grammatically correct and contribute to a coherent paragraph
  - **FR-6**: Prose content may be about any topic chosen by the implementation (no topic restrictions)
  - **FR-7**: File must be written to disk using Python pathlib or equivalent file I/O
  - **FR-8**: File must be staged for commit using `git add test-hsds9t.md`
  - **FR-9**: File must be committed with a conventional commit message: `feat(125): create markdown file test-hsds9t.md with prose content`
  - **FR-10**: Commit must be pushed to the `feat/125-markdown-file-creation-22d95d` feature branch
  - **FR-11**: Implementation must not modify, overwrite, or delete any existing files in the repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use LF (line feed, Unix-style) line endings, not CRLF (Windows-style)
  - **NFR-3**: File size must be between 400-600 bytes, consistent with the established pattern from features 114-124
  - **NFR-4**: Implementation must follow the file creation pattern observed in 100+ existing test-*.md files
  - **NFR-5**: Implementation must complete within the S (Small) time estimate of 10-15 minutes
  - **NFR-6**: No external dependencies should be introduced; implementation should use Python 3.11+ standard library only
  - **NFR-7**: Git operations must use standard git commands (add, commit, push) with no custom scripts
  - **NFR-8**: Implementation must not depend on or modify any source code in `/src/sheep/` or configuration files

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Topic selection autonomy | Complete autonomy on topic selection | User stated "about anything"; matches established pattern; simplifies implementation |
  | 2 | Prose style | Neutral, general-purpose | Simplest to implement; matches existing test files; no stylistic constraints |
  | 3 | Heading level | H1 (#) | Matches established pattern from codebase analysis; standard for document titles |
  | 4 | Validation rigor | Strict validation | Prevents regressions; maintains consistency with 100+ existing test files; validates encoding and format |
  | 5 | Existing file handling | Fail with error | Prevents accidental overwrites; makes state changes explicit; defensive programming |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-hsds9t.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 114-124; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/125-markdown-file-creation-22d95d` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (114-124) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies or environment setup required beyond git and Python standard library

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria established, product decisions documented with AI-recommended defaults ready for review_
