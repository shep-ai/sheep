content: |
  ## Problem Statement

  Create a single markdown file named `test-m6zeml.md` in the repository root directory
  containing a markdown H1 title and 2-3 sentences of prose content on any topic.
  This continues the series of similar file creation tasks implemented in features 200-204,
  demonstrating the Sheep platform's capability to execute straightforward file creation workflows.

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-m6zeml.md` in the repository root directory
  - **FR-2**: File must contain a valid markdown H1 title (single `#` followed by one or more characters and newline)
  - **FR-3**: File must contain exactly 2-3 sentences of prose content (grammatically complete sentences separated by periods)
  - **FR-4**: All file content must follow markdown syntax conventions (proper spacing, no syntax errors)
  - **FR-5**: Stage the new file in Git using `git add` with the correct file path
  - **FR-6**: Create a commit with a conventional commit message following the format: `feat(205): [short description]`
  - **FR-7**: Push the commit to the remote branch `feat/205-markdown-file-creation-870df7` with `-u` flag (or ensure branch tracking is established)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (no BOM)
  - **NFR-2**: Line endings must be LF (Unix-style `\n`, not CRLF)
  - **NFR-3**: Markdown must be valid and render correctly in standard markdown processors
  - **NFR-4**: Git commit message must follow conventional commits specification (feat/fix/docs/etc. scope)
  - **NFR-5**: Implementation must follow patterns and conventions established in features 200-204
  - **NFR-6**: No external dependencies or build steps required beyond Git and file I/O
  - **NFR-7**: Implementation should be deterministic and produce the same output on repeated execution

  ## Success Criteria

  - [ ] File `test-m6zeml.md` exists at repository root (verified by `ls -la test-m6zeml.md` or `git ls-files`)
  - [ ] File contains exactly one H1 markdown title at the beginning (pattern: `# [Title Text]`)
  - [ ] File contains exactly 2-3 sentences of coherent prose after the title
  - [ ] No markdown syntax errors in file (checked by markdown linter or manual review)
  - [ ] File is committed with conventional commit message (checked by `git log` showing feat(205): message)
  - [ ] Commit is pushed to remote branch `feat/205-markdown-file-creation-870df7` (verified by `git log` showing remote tracking or `git branch -r`)
  - [ ] File encoding is UTF-8 (verified by `file` command or content inspection)
  - [ ] Line endings are LF (verified by `git diff --check` shows no CRLF issues)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be hard-coded or randomly generated? | Hard-coded content | Determinism enables reliable testing and review, matches patterns in features 200-204, and simplifies implementation without losing the ability to demonstrate the workflow |
  | 2 | What topic should the prose content cover? | Implementation team's choice (any appropriate topic) | The specification states "about anything", providing flexibility. Implementation team should choose a clear, coherent topic that demonstrates readable markdown prose |
  | 3 | Are there any additional validation requirements beyond markdown syntax? | No additional validation required | Standard markdown validation is sufficient. File should follow markdown best practices (proper spacing, clear structure) but no special linting or testing is needed |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Root Directory** - Contains markdown files created by feature tasks (167 test-*.md
    files plus several topic markdown files like ABOUT_ME.md, DESIGN_PATTERN.md, etc.)
  - **src/sheep/** - Main Python package with:
    - `agents/` - Agent definitions for research, implementation, and review
    - `config/` - Configuration management for LLM providers
    - `flows/` - Flow orchestration for the code implementation pipeline
    - `observability/` - Logging and Langfuse integration
    - `tools/` - Git and file operation tools
    - `cli.py` - CLI entry point
  - **specs/** - Feature specifications in YAML format
  - **tests/** - Python test files
  - **Docker/** - Docker configuration for containerized execution

  ### Architecture Patterns

  The Sheep platform uses a **Flow-based architecture** with specialized agents:

  1. **Separation of Structure and Intelligence**
     - Flows define execution structure and control paths
     - Crews provide autonomous AI decision-making
     - Each crew is a specialized unit invoked at specific flow steps

  2. **Agent-Based Design**
     - Research agent - analyzes codebase and project context
     - Implementation agent - writes code following conventions
     - Review agent - validates changes for quality and correctness

  3. **Git-Integrated Workflows**
     - Automatic branch creation and management
     - Support for git worktrees for isolated development
     - Full commit/push automation with conventional commit messages

  ### Relevant Technologies

  - **Python** - Primary implementation language
  - **CrewAI** - Multi-agent orchestration framework
  - **Langfuse** - Observability and execution tracing
  - **Git** - Version control and change management
  - **Markdown** - Documentation format (relevant for this feature)
  - **Multiple LLMs** - OpenAI, Anthropic Claude, Google Gemini

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root Directory | High | This feature creates a markdown file (test-m6zeml.md) directly in the repository root, following the pattern established by previous 167 test markdown files |
  | Git Workflow | Medium | New file must be committed with conventional commit message (feat(205): ...) and pushed to remote branch |
  | File System | Low | Simple file creation operation using standard file I/O |

  ## Dependencies

  **No external dependencies required.** This feature depends on:

  1. **Git** - For committing and pushing the new file
  2. **File I/O** - Standard file creation (built-in to all platforms)
  3. **Markdown format** - No special libraries needed, plain text markdown
  4. **Existing repository structure** - Uses established root directory convention

  ## Size Estimate

  **S** (Hours) — This is a straightforward file creation task requiring minimal effort.
  The implementation involves: (1) creating a new markdown file with prose content,
  (2) staging and committing the change with a conventional message, (3) pushing to
  the remote branch. No code modification, testing, or complex integration is required.
  Estimated effort: 1-2 hours including all git operations.

