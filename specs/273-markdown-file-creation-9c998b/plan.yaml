# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 273 follows the established Sheep pattern of minimal, modular file creation tasks.
  The architecture leverages the proven `content_generators.py` utility module which provides
  a single orchestration function (`create_markdown_file()`) that coordinates all workflow steps:

  1. **Content Generation**: Invoke CrewAI's `get_reasoning_llm()` with MARKDOWN_GENERATION_PROMPT
  2. **File I/O**: Write markdown to test-jaspyk.md with UTF-8 encoding and Unix LF line endings
  3. **Validation**: Two-layer validation (content structure + file properties)
  4. **Git Integration**: Stage, commit with conventional message, and push to feature branch
  5. **Observability**: All steps logged and traced via sheep.observability integration

  This design fits cleanly into Sheep's architecture:
  - **Modular utilities pattern**: Uses content_generators.py (single-responsibility functions)
  - **Convention over configuration**: Follows established naming (test-*.md), content structure (H1 + prose), and git workflow
  - **Pluggable LLM support**: Leverages CrewAI's get_reasoning_llm() factory (Claude API by default)
  - **Observable execution**: Integrated with sheep.observability for tracing
  - **Tool-based abstraction**: Uses GitCommitTool and GitPushTool (not subprocess calls)
  - **No application logic impact**: Feature is purely file creation; doesn't modify agents, flows, or core tools

  The implementation requires zero source code changes because all utilities already exist and are proven
  across 272+ prior features with 100% success rate.

  ## Key Design Decisions

  ### 1. Orchestration via create_markdown_file()

  **Chosen:** Single-function orchestration via content_generators.create_markdown_file()

  **Rationale:** The content_generators module provides a complete, battle-tested orchestration function that handles:
  - LLM invocation with structured prompt
  - File creation with UTF-8 encoding and LF line endings
  - Two-layer validation (content + properties)
  - Conventional git commit and upstream push
  - Observable logging via sheep.observability

  **Alternative rejected:** Custom orchestration would duplicate proven logic, break consistency with 272+ prior features,
  and add maintenance burden. Calling the existing function is the optimal approach.

  ### 2. Content Generation via Claude API

  **Chosen:** Claude API via CrewAI's `get_reasoning_llm()` factory function (default configuration)

  **Rationale:** The research phase established that:
  - CrewAI's `get_reasoning_llm()` is the standard integration point (used by all 272+ prior features)
  - Claude is the configured default LLM in sheep.config.llm
  - The function encapsulates API key management and provider selection
  - No configuration changes required; works out-of-the-box

  **Alternative rejected:** Direct Anthropic SDK calls would duplicate CrewAI's configuration logic.
  OpenAI or other LLMs would require configuration changes and break consistency with established pattern.

  ### 3. File I/O with Encoding Normalization

  **Chosen:** Python pathlib with explicit UTF-8 encoding, no BOM, Unix LF line endings

  **Rationale:** The content_generators.write_markdown_file() function uses UTF-8 encoding with explicit handling.
  On Unix systems, this automatically produces LF line endings. The validate_markdown_file() function
  explicitly checks for no UTF-8 BOM and rejects CRLF, ensuring cross-platform correctness.
  Pathlib prevents path traversal by rejecting filenames with "/" or "\\" characters.

  **Alternative rejected:** Platform-dependent encoding and CRLF would violate NFRs and break consistency.
  Direct file operations without validation would allow invalid content into the repository.

  ### 4. Two-Layer Validation Strategy

  **Chosen:** Validate content structure during generation + validate file properties after write

  **Rationale:** The content_generators module implements validation at two points:
  - Layer 1 (_validate_markdown_content): Checks H1 heading, sentence count, content length during LLM response processing
  - Layer 2 (validate_markdown_file): Checks UTF-8 validity, no BOM, LF-only line endings, structure after file write

  This dual-layer approach ensures both content correctness (fail fast, no file created) and file properties
  meet requirements (catches encoding/line-ending anomalies from file I/O).

  **Alternative rejected:** Single-layer validation would delay error detection or miss encoding issues.
  No validation would violate requirements and allow invalid files into the repository.

  ### 5. Git Integration via Tool Abstractions

  **Chosen:** Conventional commits via GitCommitTool, push via GitPushTool with upstream tracking

  **Rationale:** The content_generators module delegates to Sheep's tool abstractions:
  - GitCommitTool handles git staging and commit with conventional message format
  - GitPushTool handles push with set_upstream=True for remote tracking
  - Both tools provide error handling and observability integration
  - This approach is consistent with Sheep's architecture and 272+ prior features

  **Alternative rejected:** Direct git subprocess calls would break abstraction and duplicate error handling.
  Manual implementation would lose observability and break consistency with established patterns.

  ## Implementation Strategy

  The implementation follows three sequential phases:

  **Phase 1: Environment Preparation**
  - Verify feature branch `feat/273-markdown-file-creation-9c998b` is checked out
  - Verify ANTHROPIC_API_KEY environment variable is set
  - Verify git configuration (user.name, user.email) is valid
  - Review content_generators.py module interface to understand orchestration

  **Phase 2: File Creation and Validation**
  - Call `create_markdown_file("test-jaspyk.md", feature_number=273)` from content_generators module
  - Function internally orchestrates: generate → write → validate → commit → push
  - Receive return dict with filepath, content, commit_message, push_result
  - Verify file exists at repository root with expected size (~250-600 bytes)

  **Phase 3: Git State Verification**
  - Verify git commit was created with conventional message: `feat(273): create markdown file test-jaspyk.md with prose content`
  - Verify commit was pushed to remote origin on feature branch
  - Verify upstream tracking is set: `git branch -vv` shows branch tracking origin

  The entire implementation is a single function call followed by verification steps. Effort estimate: 10-15 minutes total.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **LLM API Failure** | Fail fast on error; no partial commits. User can investigate and retry. |
  | **File System Permission Issues** | Unlikely; 272+ prior features succeeded on same directory. |
  | **Invalid Markdown from LLM** | Validation layer checks structure during generation; fails before file write. |
  | **Encoding/Line-Ending Issues** | validate_markdown_file() explicitly checks UTF-8, no BOM, and LF-only endings. |
  | **Git Configuration Missing** | GitCommitTool fails with clear error if user.name/email not set. |
  | **Feature Branch Not Checked Out** | Error occurs immediately when attempting file write. |
  | **Inconsistent Results** | Extremely unlikely; 272+ identical features all succeeded with identical orchestration. |

  All risks are mitigated by existing validation in content_generators.py and clear error handling.
