# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 273 implementation consists of four sequential tasks totaling 15 minutes of effort:

  **Task 1: Environment Preparation (3 min)** — Verify feature branch is checked out, environment variables
  (ANTHROPIC_API_KEY) and git configuration (user.name, user.email) are set, and remote origin is configured.
  Review content_generators.py module interface to understand orchestration entry point.

  **Task 2: File Creation via Orchestration (5 min)** — Invoke create_markdown_file("test-jaspyk.md", feature_number=273)
  from content_generators module. The function internally handles: content generation via Claude API, file I/O with
  UTF-8/LF normalization, two-layer validation (content structure + file properties), git commit with conventional message,
  and push to remote origin. Verify function returns success dict and file is created at repository root.

  **Task 3: Verify File Properties (3 min)** — Validate file meets all success criteria: H1 heading, 2-3 sentences,
  UTF-8 encoding without BOM, Unix LF line endings only, ~250-600 bytes, valid markdown syntax, trailing newline.
  Use validate_markdown_file() or manual byte/text inspection to verify encoding and line-ending properties.

  **Task 4: Git State Verification (4 min)** — Verify git commit was created with conventional message format
  "feat(273): create markdown file test-jaspyk.md with prose content" and pushed to remote origin. Confirm
  upstream tracking is set via git branch -vv. Verify working tree is clean and commit is reachable on remote.

  The implementation is a single function call (create_markdown_file) leveraging 272+ prior identical features.
  No source code changes required; all utilities already exist in content_generators.py module. Architecture
  follows established Sheep patterns: modular utilities, convention over configuration, observable execution,
  tool-based abstractions. Total effort: 15 minutes (LLM generation ~5 min, file I/O + validation ~1 min,
  git operations ~2 min, verification ~3 min, setup/overhead ~4 min).
