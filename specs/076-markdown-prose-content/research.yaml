name: markdown-prose-content
summary: >
  Technical research confirms straightforward implementation using Python's pathlib for file I/O and
  subprocess for git operations, following the established pattern across 76+ existing test files.
  The feature requires file creation with H1 heading + blank line + 2-3 sentences of prose, UTF-8
  encoding (no BOM), LF line endings, ~400-600 bytes file size (as flexible guideline), and
  conventional git workflow. No external dependencies needed beyond Python standard library.

