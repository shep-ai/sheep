# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature integrates seamlessly into the existing codebase with zero dependencies on application
  source code (/src/sheep/). The implementation follows the well-established pattern documented across
  76+ existing test markdown files at the repository root and proven across 13 identical features
  (063-075).

  **Integration Pattern:**
  - Feature creates a single isolated artifact (test-lwc66n.md) in the repository root
  - No modifications to existing files, configuration, or source code
  - File creation uses Python standard library (pathlib); git operations use subprocess
  - Git workflow follows conventional commit standards already established in the project
  - Complete isolation means no conflicts with parallel feature development

  **Related Architecture Elements:**
  - **Test File Pattern:** Follows CommonMark markdown structure used by all 76+ test-*.md files
  - **Git Workflow:** Uses standard conventional commit format (feat(NNN): ...) matching project history
  - **File I/O:** Leverages Python pathlib as specified in NFR-5; text mode handles platform line endings
  - **Encoding:** UTF-8 without BOM, validated per existing test file inspection in research

  **Precedent Reference:**
  - Features 063-075 (13 identical features) document 10-15 minute implementation time
  - test-macwxa.md (469 bytes), test-juhs9z.md (505 bytes), test-i85c38.md (386 bytes) provide
    content structure and file size precedents
  - All precedents confirm H1 heading + blank line + prose format

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path().write_text()

  **Decision:** Use Python's `pathlib.Path().write_text(content, encoding="utf-8")` for file creation.

  **Rationale:**
  - Explicitly required by feature spec NFR-5
  - Modern Python standard (available since 3.4; project requires 3.11+)
  - Concise, readable, and handles UTF-8 encoding correctly
  - Text mode automatically produces LF line endings on Unix systems (PEP 309), satisfying NFR-2
  - All 76+ existing test files confirm this approach works correctly
  - No external dependencies required

  **Alternatives Considered:**
  - `open(file, "w", encoding="utf-8")` — More verbose; pathlib is more modern
  - Subprocess-based file creation — Unnecessarily complex and less Pythonic
  - Template-based generation — Over-engineered for simple content

  ### 2. Git Integration: subprocess with sequential operations

  **Decision:** Use Python's `subprocess.run()` with separate calls for git add, commit, and push.

  **Rationale:**
  - subprocess is Python standard library (no dependencies, NFR-9 compliance)
  - List-based argument format prevents shell injection
  - `check=True` ensures errors are caught and raised
  - Each operation maps directly to spec requirements FR-6 through FR-9
  - Clear, sequential execution matches established pattern from features 063-075
  - Transparent error handling and validation

  **Alternatives Considered:**
  - GitPython library — Available in project but adds external dependency (NFR-9 prohibits new deps)
  - Shell script or os.system() — Less portable, harder to validate results
  - Manual git command strings — Less secure (injection risk)

  ### 3. Prose Topic: Implementer-chosen, no assignment needed

  **Decision:** Implementer selects any topic of interest (user query explicitly permits "about anything").

  **Rationale:**
  - Feature spec explicitly resolved open question 1 in favor of implementer flexibility
  - User query states "about anything" — no topic constraints imposed
  - 76+ existing test files demonstrate successful diverse topics: nature, philosophy, engineering,
    design patterns, state machines, science, etc.
  - Flexible selection accelerates implementation (no research/assignment overhead)
  - Aligns with recommendation in spec: "implementer-chosen topics...accelerates implementation"

  ### 4. File Size: Guideline 400-600 bytes with natural variation

  **Decision:** Treat 400-600 bytes as typical guideline; accept natural prose variation based on topic
  and sentence structure.

  **Rationale:**
  - Feature spec explicitly resolved open question 2 in favor of flexible variation
  - Prose length naturally varies with topic complexity and sentence structure
  - Observed file sizes across precedents: test-i85c38.md (386 bytes), test-macwxa.md (469 bytes),
    test-juhs9z.md (505 bytes) — range spans outside strict bounds
  - Strict enforcement would force artificial padding/truncation, compromising prose quality
  - Spec states: "allow natural variation based on topic and prose complexity"

  ### 5. Content Structure: Standard markdown format

  **Decision:** H1 heading on line 1, blank line on line 2, prose content on lines 3+, trailing newline.

  **Format:** `# Heading\n\n<2-3 sentences of prose>\n`

  **Rationale:**
  - Feature spec requirements FR-3 and FR-4 explicitly mandate this structure
  - All 76+ existing test files follow identical format consistently
  - Format is valid per CommonMark specification (https://spec.commonmark.org/)
  - Blank line separator between heading and content improves readability
  - Trailing newline is standard Unix convention and present in all precedents

  ### 6. Encoding and Line Endings: UTF-8 no BOM, Unix LF

  **Decision:** Use pathlib's default UTF-8 encoding (no BOM); rely on text mode for LF line endings.

  **Rationale:**
  - NFR-1 requires UTF-8 without BOM; NFR-2 requires Unix LF line endings
  - pathlib.Path.write_text(encoding="utf-8") produces clean UTF-8 without BOM by default
  - Python text mode on Unix systems automatically uses LF line endings (PEP 309)
  - All 76+ existing test files confirmed via hexdump: lines end in 0x0a (LF), not 0x0d0a (CRLF)
  - No explicit newline parameter or post-write conversion needed
  - Over-engineering with dos2unix or manual newline handling would be unnecessary

  ## Implementation Strategy

  **Phase Ordering Rationale:**

  1. **Phase 1 (File Creation) First:** The file must exist before it can be staged or committed.
     This phase is blocking for Phase 2. Content correctness (encoding, line endings, structure)
     is validated before proceeding to git operations.

  2. **Phase 2 (Git Integration) Second:** Only after file creation is complete do we stage, commit,
     and push. This sequential approach ensures file validation happens before git workflow starts.
     Git operations depend on successful file creation (Phase 1).

  **Why This Order:**
  - Logical dependency: file must exist before git operations can reference it
  - Validation barrier: file content/structure issues are caught before git integration
  - Risk reduction: early detection of encoding/format issues before committing
  - Mirrors established pattern from features 063-075

  **Key Milestones:**
  1. File created with proper structure, encoding, and line endings
  2. File staged in git (git status shows "Changes to be committed")
  3. Conventional commit created on feature branch
  4. Changes pushed to remote origin

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding mismatch (not UTF-8 or with BOM) | HIGH | Use pathlib.Path.write_text(encoding="utf-8") explicitly; verify via hexdump that file starts with file content (no EF BB BF prefix) and contains 0x0a not 0x0d0a |
  | Incorrect line endings (CRLF instead of LF) | HIGH | Rely on Python text mode default behavior on Unix; validate with `hexdump -C` showing 0x0a line terminators |
  | Missing or incorrect markdown structure | MEDIUM | Follow precedent format exactly: "# Heading\n\n<prose>\n"; validate file contains all required parts |
  | Git operations fail (not staged, commit missing, push fails) | MEDIUM | Use subprocess.run(..., check=True) to catch errors; verify git status after each operation; ensure git user.name/email configured |
  | File size outside expectations | LOW | Document 400-600 bytes as guideline; accept natural variation; size is not a hard constraint per spec resolution |
  | Topic coherence or prose quality | LOW | Implementer chooses topic; no external validation needed; prose quality is self-evident |
  | Git push network issues | MEDIUM | Ensure network connectivity before attempting push; git push errors will bubble up via subprocess exception |
  | File already exists | LOW | Check if file exists before creation; if so, validate it matches requirements or abort with clear error message |

  ## Technical Dependencies

  - **Python Version:** 3.11+ (pathlib available since 3.4; project requires 3.11+)
  - **Platform:** Unix/Linux with standard file system and git
  - **Git Configuration:** user.name and user.email must be configured (standard project setup)
  - **Network:** Push operation requires network access to remote origin
  - **File System:** Write access to repository root (available in normal workflow)
  - **Feature Branch:** feat/076-markdown-prose-content must exist (pre-created)

