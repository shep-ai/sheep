# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the well-established markdown-file-creation pattern demonstrated by
  65+ existing test files in the repository and the preceding features 068-070. The implementation
  is minimal and self-contained:

  1. **File Creation**: Use pathlib.Path() to create a markdown file with a fixed, validated
     content structure (H1 heading + blank line + 2-3 sentences).

  2. **Git Workflow**: Use subprocess.run() to execute sequential git operations (add, commit, push)
     with hardcoded, deterministic commands (no user input, no string interpolation).

  3. **Isolated Change**: The feature creates a single test artifact at the repository root; it
     does not depend on or modify any source code in /src/sheep/, test suite, or configuration.

  The implementation fits naturally into the existing codebase architecture because:
  - **No source code dependencies**: Feature is orthogonal to the application logic
  - **Established pattern**: Precedent of 65+ test files provides clear template and validates approach
  - **Minimal scope**: Single file creation + three git commands = simple, atomic operation
  - **No configuration changes**: Feature operates entirely within the default Python/git environment

  ## Key Design Decisions

  ### 1. File I/O Method: pathlib.Path (NFR-5 compliance)

  **Decision**: Use pathlib.Path("test-uiq4ld.md").write_text() for file creation.

  **Rationale**:
  - **Mandated by NFR-5**: Project non-functional requirements explicitly require pathlib usage
  - **Modern, idiomatic Python**: pathlib is the standard library approach for Python 3.11+
  - **Resource management**: write_text() handles file closing and encoding automatically
  - **Consistent with precedent**: All 65+ existing test files follow this pattern
  - **Simple, transparent**: One-liner replaces manual file operations with clear intent

  **Alternative considered**: os.open() or built-in open() — both are more verbose and lack the
  automatic resource management of pathlib. Rejected in favor of spec requirement and best practices.

  ### 2. Git Integration: subprocess.run() (direct command execution)

  **Decision**: Use subprocess.run() with hardcoded git CLI commands (git add, commit, push).

  **Rationale**:
  - **No external dependencies**: subprocess is Python standard library (adheres to NFR-9)
  - **Transparent semantics**: git commands are explicit and familiar to developers
  - **Appropriate abstraction level**: Simple linear workflow (add → commit → push) requires no
    higher-level abstraction
  - **Error handling**: subprocess.run() raises CalledProcessError on failure, enabling simple
    error detection
  - **Consistent with features 068-070**: Proven pattern from immediately preceding features

  **Alternatives considered**:
  - **GitPython library**: Unnecessary abstraction for three simple sequential operations
  - **Shell invocation**: Lower portability, harder error handling, security risks from shell metacharacters
  - Both rejected in favor of subprocess for simplicity and transparency

  ### 3. Prose Content: Hardcoded String

  **Decision**: Embed prose content directly in the implementation as a hardcoded string constant.

  **Rationale**:
  - **Fixed format**: Content structure is predetermined (one H1 + 2-3 sentences), no dynamic generation
  - **Format guarantee**: Hardcoding ensures prose always matches requirements without validation
  - **Established pattern**: All 65+ existing test files use hardcoded prose specific to their topic
  - **Simple, transparent**: No template engines, external files, or string interpolation
  - **Flexible topic**: Implementer chooses topic at authoring time; resolves NFR-8 (fully flexible)

  **Alternatives considered**:
  - **Template engine**: Jinja2 or similar adds unnecessary complexity for fixed format
  - **External file**: Separates content from code, complicates deployment and versioning
  - Both rejected in favor of hardcoding per the established pattern

  ### 4. Sentence Validation: None (implicit via hardcoding)

  **Decision**: Do not implement runtime sentence counting or validation logic.

  **Rationale**:
  - **Compliance by construction**: Hardcoded prose guarantees exactly 2-3 sentences at creation
  - **No unnecessary complexity**: Runtime validation would add code without benefit
  - **Product decision alignment**: Requirements phase resolved validation as "basic readability
    standard — implementer responsibility" (not programmatic)
  - **Established pattern**: Features 068-070 and all 65+ existing test files use no validation logic

  **Alternatives considered**:
  - **Regex-based sentence detection**: Complex, error-prone (periods, abbreviations, ellipses)
  - **External validation tool**: Would violate NFR-9 (no new dependencies)
  - Both rejected for unnecessary complexity given that hardcoding guarantees compliance

  ### 5. Encoding and Line Endings: UTF-8 + LF (platform-independent)

  **Decision**: Use pathlib's default UTF-8 encoding and hardcode explicit '\n' newlines in prose.

  **Rationale**:
  - **NFR-1 compliance**: UTF-8 without BOM is pathlib's default; no additional configuration needed
  - **NFR-2 compliance**: By using '\n' directly in the prose string, we ensure LF output on all
    platforms (not platform-native CRLF on Windows)
  - **Cross-platform consistency**: Test files produced on Windows, macOS, or Linux are identical
  - **Established pattern**: All 65+ existing test files use UTF-8 + LF per this approach

  **Alternatives considered**:
  - **Platform-native line endings**: Would produce CRLF on Windows, violating NFR-2
  - **Binary mode + manual encoding**: More verbose; pathlib's text mode is correct for this use case
  - Both rejected in favor of the simple, standards-compliant approach

  ## Implementation Strategy

  **Phase 1 → Phase 2 ordering**:

  Phase 1 (File Creation) must complete before Phase 2 (Git Integration) because:
  1. The file must exist before git can stage it
  2. Conceptually, we create the artifact first, then integrate it into version control
  3. This matches the logical workflow: create → stage → commit → push

  **Why this is the right approach**:
  - **Minimal, focused phases**: Each phase has a single responsibility (file I/O or git)
  - **Clear dependencies**: No circular dependencies or out-of-order operations
  - **Testable**: Each phase can be verified independently before moving to the next
  - **Recoverable**: If git operations fail, the file still exists and can be debugged/retried
  - **Matches established workflow**: Follows the git workflow pattern from features 068-070

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | File already exists (test-uiq4ld.md from prior run) | Low | Task 1 includes check for existing file; if present, task documents expected behavior (overwrite vs. error) |
  | Git not configured (user.name, user.email missing) | Very Low | Standard git setup is part of development environment; project assumes git is configured |
  | Git push fails (network issue, permission) | Low | subprocess.run() will raise CalledProcessError; error output will indicate root cause (network, auth, branch mismatch) |
  | File encoding/line ending issues on Windows | Low | Explicit UTF-8 + '\n' in prose guarantees correct output; pathlib handles encoding transparently |
  | Conventional commit message format violation | Very Low | Message is hardcoded; no string interpolation or user input |
  | Branch checkout missing (wrong branch at start) | Very Low | Feature branch is pre-created; task assumes correct branch exists |

  ## Success Criteria Mapping

  The plan satisfies all success criteria from the spec:

  - **✓ Phase 1** creates test-uiq4ld.md with H1 heading and 2-3 sentences
  - **✓ Phase 1** ensures UTF-8 + LF encoding per NFR-1 and NFR-2
  - **✓ Phase 2** stages file with git add (Task 2)
  - **✓ Phase 2** commits with conventional message (Task 3)
  - **✓ Phase 2** pushes to remote origin (Task 4)

  All functional requirements (FR-1 through FR-9) and non-functional requirements (NFR-1 through
  NFR-9) are addressed by these phases.

