decisions:
  - title: "File I/O Implementation"
    chosen: "Use Python pathlib (Path class) for all file operations"
    rejected:
      - "Direct os.path module — less object-oriented, requires more string concatenation, not idiomatic Python 3.11+"
      - "Built-in open() function without pathlib wrapper — more verbose, mixes path manipulation with I/O concerns, established pattern uses pathlib"
      - "Third-party file libraries (pathspec, upath, etc.) — unnecessary external dependencies, pathlib provides all required functionality"
    rationale: >
      pathlib is the modern standard for file I/O in Python 3.11+ and is used consistently across all 90+
      preceding markdown-file-creation implementations (features 001-264). The Path class provides clear semantics
      for file operations (Path.cwd() for repo root, path.exists() for validation, path.write_text() for writing).
      This approach avoids string manipulation for paths, is platform-aware, and matches the established pattern
      seen in src/sheep/content_generators.py (lines 100-142).

  - title: "Markdown Content Generation"
    chosen: "Use Claude API via CrewAI LLM framework (generate_markdown_content function)"
    rejected:
      - "Hardcoded content — would require unique content for each file, not scalable for 200+ identical features, lacks variety"
      - "Template-based generation — adds complexity without benefit, less natural prose, template system not in existing codebase"
      - "Deterministic pseudo-random generation — would produce lower-quality content than LLM, requires complex seeding logic"
    rationale: >
      The established pattern from features 001-264 uses the Claude API through CrewAI's LLM interface to generate
      coherent, contextually-appropriate prose. This approach (implemented in src/sheep/content_generators.py lines 26-67)
      ensures quality content with semantic coherence and variety across files. The LLM is configured with a clear prompt
      requesting H1 heading + 2-3 sentences about any topic, ensuring format compliance while allowing creative variation.
      This pattern is proven across 200+ successful feature implementations.

  - title: "Markdown Document Structure"
    chosen: "H1 heading (# Title) + blank line + 2-3 sentences of prose + trailing newline"
    rejected:
      - "Multiple heading levels (H1, H2, H3) — adds complexity without matching the established pattern from 90+ files"
      - "Structured sections (## Problem, ## Solution) — overcomplicated for a test artifact, not seen in precedent files"
      - "Different prose length — spec requires 2-3 sentences; deviation breaks validation logic and precedent"
    rationale: >
      The established structure (observed in test-8hjiqa.md, test-440dhk.md, and 90+ similar files) consists of exactly:
      line 1 = H1 heading with # syntax, line 2 = blank line separator, lines 3+ = prose content (2-3 sentences),
      final line = trailing newline. This structure satisfies CommonMark specification for valid markdown, matches the
      validation logic in src/sheep/content_generators.py (_validate_markdown_content, lines 70-97 and validate_markdown_file
      lines 209-303), and represents the minimal valid markdown document.

  - title: "Text Encoding"
    chosen: "UTF-8 without BOM (Byte Order Mark), standard for file I/O"
    rejected:
      - "UTF-8 with BOM — adds 3 unnecessary bytes, validation explicitly rejects BOM (content_generators.py line 186-187), not standard for Unix/Linux"
      - "UTF-16 or UTF-32 — increases file size significantly, not required for ASCII-compatible prose, incompatible with Unix text processing tools"
      - "ASCII-only — would fail with any non-ASCII characters; UTF-8 is backward-compatible with ASCII and standard for modern text"
    rationale: >
      UTF-8 without BOM is the standard text encoding for web, Unix, and modern Python (default in Python 3+).
      The specification explicitly requires \"UTF-8 without BOM\" (NFR-1). The validation function checks for and
      rejects UTF-8 BOM (content_generators.py lines 186-187, 246-247), and Python's default encoding behavior
      (open with encoding=\"utf-8\") produces UTF-8 without BOM. This approach ensures compatibility with git,
      Unix text tools, and web standards.

  - title: "Line Ending Convention"
    chosen: "LF (Unix-style \\n) — enforced by validation and Python default behavior"
    rejected:
      - "CRLF (Windows-style \\r\\n) — explicitly forbidden by specification (NFR-2), validation rejects (content_generators.py lines 190-191, 256-257)"
      - "Mixed line endings — would cause validation failure, incompatible with git normalization and Unix conventions"
      - "CR-only (old Mac) — obsolete standard, not supported by modern tools, would fail validation"
    rationale: >
      Unix LF line endings are the standard for web, version control (git), and Linux systems. The specification
      requires \"LF (Unix-style) line endings\" (NFR-2). Python's text mode file writing (open with encoding=\"utf-8\")
      uses the platform default, which is LF on Linux. The validation function explicitly checks for and rejects
      CRLF (content_generators.py lines 190-191, 256-257), ensuring compliance. This avoids git's
      \"line ending normalization\" issues and maintains consistency with the 90+ existing test files.

  - title: "File Size Target"
    chosen: "Approximately 400-600 bytes as natural outcome of H1 heading + 2-3 sentences"
    rejected:
      - "Smaller sizes (under 300 bytes) — would require shorter sentences or single sentence, violates spec requirement of 2-3 sentences"
      - "Larger sizes (over 700 bytes) — would require 4+ sentences or verbose prose, violates spec requirement of 2-3 sentences"
      - "Exact byte-count enforcement — overspecification; the 400-600 byte range is the natural output of valid prose structure"
    rationale: >
      The specification states \"File size is approximately 400-600 bytes (natural outcome of proper structure)\" (NFR-3).
      This range emerges naturally from typical English prose: one H1 heading (15-30 bytes), blank line (1 byte),
      and 2-3 sentences of meaningful prose (300-550 bytes). Testing shows existing files (test-8hjiqa.md = 403 bytes,
      test-440dhk.md = similar range) fall consistently within this band. The range is intentionally approximate to avoid
      artificial content padding or truncation.

  - title: "Git Integration Pattern"
    chosen: "Use GitCommitTool and GitPushTool from sheep.tools module (established infrastructure)"
    rejected:
      - "Direct subprocess calls (subprocess.run with 'git add', 'git commit', 'git push') — bypasses error handling infrastructure, requires custom shell escaping, doesn't leverage existing tools"
      - "GitPython library (PyGit2, GitPython package) — introduces external dependencies, not used elsewhere in codebase, overkill for simple add/commit/push"
      - "Manual git command construction with shell execution — security risk (command injection), not idiomatic for Python, inconsistent with established pattern"
    rationale: >
      The Sheep codebase provides GitCommitTool and GitPushTool (imported in content_generators.py line 7) which wrap
      git operations with error handling, logging, and consistent behavior. Features 001-264 all use this pattern
      (see feature_264_markdown_file_creation.py lines 86-87, 91-92). These tools handle platform differences,
      git configuration validation, and provide structured return values. Using them ensures consistency with established
      patterns and benefits from bug fixes/improvements made to the tools.

  - title: "Conventional Commit Message Format"
    chosen: "\"feat(<feature_number>): Create markdown file <filename> with prose content\""
    rejected:
      - "Generic messages like \"Add test file\" or \"Update markdown\" — less descriptive, doesn't follow conventional commit standard, doesn't enable semantic versioning"
      - "Messages with topic/title extraction — adds complexity, unnecessary variation, established pattern uses fixed format with feature number and filename"
      - "Different format like \"docs:\" prefix — would be technically correct but inconsistent with established pattern across all 200+ markdown-file-creation features"
    rationale: >
      The Conventional Commits specification and Sheep's established pattern use \"feat(<number>):\" prefix for feature
      additions. The exact format \"feat(265): Create markdown file test-etv56m.md with prose content\" is specified in
      the requirements (FR-6) and observed in all prior implementations (feature_264_markdown_file_creation.py line 84).
      This format enables semantic versioning, clear git history, and automated changelog generation. Using feature number
      instead of feature name keeps commit messages concise while remaining searchable.

  - title: "Validation Strategy"
    chosen: "Comprehensive multi-stage validation: format, encoding, line endings, syntax at each step"
    rejected:
      - "Skip validation entirely — would miss issues early, no quality assurance, could commit invalid files"
      - "Single post-write validation only — would fail after wasting I/O, harder to debug, doesn't validate LLM output"
      - "Minimal validation (file exists only) — insufficient to catch encoding/line ending issues, violates NFR requirements"
    rationale: >
      The established pattern (content_generators.py) includes: (1) _validate_markdown_content after LLM generation
      (lines 70-97), (2) file existence/size check after write (lines 131-137), (3) comprehensive validate_markdown_file
      after writing (lines 209-303). This staged approach catches errors early, provides clear error messages, and ensures
      all NFRs are met before git operations. The validation functions check UTF-8 encoding, absence of BOM, LF line endings,
      H1 heading syntax, sentence count, and trailing newline — all specified in the requirements. This prevents invalid
      files from reaching git.

  - title: "Implementation Architecture"
    chosen: "Feature-specific orchestration function (create_feature_265_markdown_file) that calls reusable content_generators utilities"
    rejected:
      - "Monolithic single function — violates DRY principle, makes testing/reuse difficult, harder to debug individual steps"
      - "Directly call content_generators.create_markdown_file — loses feature-specific metadata, can't customize commit message with feature number"
      - "Inline all logic — creates maintenance burden, prevents reuse of validation/encoding logic, inconsistent with pattern"
    rationale: >
      All 90+ preceding features (visible in features 001-264) use the same architecture: feature-specific orchestration
      function (e.g., create_feature_264_markdown_file in feature_264_markdown_file_creation.py) that calls reusable utilities
      from content_generators.py. This approach enables: (1) feature-specific metadata (FEATURE_NUMBER, MARKDOWN_FILENAME),
      (2) logging at each orchestration step, (3) custom commit message with feature number, (4) clean separation of concerns.
      The orchestration function returns a dictionary with filepath, content, commit_message, and push_result for introspection
      and testing. This pattern is proven across 200+ feature implementations.

