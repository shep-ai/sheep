content: |
  ## Architecture Overview

  Feature 265 follows the **established markdown-file-creation pattern** from 90+ preceding features (001-264).
  The implementation consists of three layers:

  ### 1. Feature Module Layer (src/sheep/features/feature_265_markdown_file_creation.py)

  - **Orchestration function**: `create_feature_265_markdown_file()` coordinates all steps
  - **Metadata constants**: FEATURE_NUMBER=265, MARKDOWN_FILENAME="test-etv56m.md"
  - **Return structure**: Dictionary with filepath, content, commit_message, push_result for introspection
  - **Error handling**: Comprehensive exception handling with descriptive messages at each stage
  - **Logging**: Structured logging via sheep.observability.logging for audit trails and debugging

  This layer follows the exact pattern seen in src/sheep/features/feature_264_markdown_file_creation.py
  (referenced in research findings). Each feature has a dedicated module for: (1) feature-specific metadata,
  (2) custom commit message formatting with feature number, (3) orchestration and error handling,
  (4) testability at the feature level.

  ### 2. Reusable Utilities Layer (src/sheep/content_generators.py)

  The implementation leverages existing reusable functions from content_generators.py:
  - `generate_markdown_content()` — Claude API via CrewAI for content generation with validation
  - `write_markdown_file()` — pathlib-based file I/O with comprehensive checks
  - `validate_markdown_file()` — multi-stage validation (encoding, line endings, structure, syntax)
  - `commit_markdown_file()` — GitCommitTool wrapper with conventional commit formatting
  - `push_markdown_file()` — GitPushTool wrapper with error handling

  These utilities are proven across 200+ successful feature implementations and provide:
  - Consistent error handling and validation logic
  - DRY principle (no code duplication across features)
  - Single source of truth for validation rules (NFRs: UTF-8, LF, CommonMark syntax, etc.)
  - Platform-aware operations via pathlib and git tools

  ### 3. Test Layer (tests/features/test_feature_265_markdown_file_creation.py)

  - **Unit tests**: Each component (generation, write, validation, git) tested independently
  - **Integration tests**: Full orchestration function tested end-to-end
  - **Acceptance tests**: All requirements from spec verified (file name, size, encoding, etc.)
  - **Mocking strategy**: Mock LLM API, filesystem operations where appropriate; use real git for integration
  - **Test organization**: Fixtures for common test data, parametrized tests for variant scenarios

  ---

  ## Key Design Decisions

  ### 1. Orchestration Function Pattern (Chosen)

  **Decision**: Create feature_265_markdown_file_creation.py with dedicated orchestration function.

  **Rationale from Research**: All 90+ preceding features (001-264) follow this pattern. The research findings
  (decision #11: "Implementation Architecture") explicitly recommend this approach:
  - Provides feature-specific metadata and custom commit message formatting
  - Enables logging at orchestration level for auditing
  - Allows clean testing at feature level
  - Maintains DRY principle by calling reusable utilities

  **Why Not**: Direct calls to content_generators utilities would lose feature-specific metadata and
  couldn't customize commit messages with feature number.

  ---

  ### 2. Claude API via CrewAI (Chosen)

  **Decision**: Use Claude API through CrewAI's LLM interface for markdown content generation.

  **Rationale from Research**: Research findings (decision #3: "Markdown Content Generation") detail this choice:
  - Proven across 200+ successful implementations (features 001-264)
  - Generates coherent, semantically-appropriate prose with variety
  - Implementation exists in content_generators.py (lines 26-67)
  - Clear prompt requesting H1 heading + 2-3 sentences ensures format compliance

  **Why Not**: Hardcoded content lacks variety; template systems add complexity without benefit;
  pseudo-random generation produces lower quality content.

  ---

  ### 3. Pathlib for File I/O (Chosen)

  **Decision**: Use Python pathlib (Path class) for all file operations.

  **Rationale from Research**: Research findings (decision #1: "File I/O Implementation") justify this:
  - Standard for Python 3.11+, idiomatic modern Python
  - Used consistently in all 90+ preceding features
  - Clear semantics: Path.cwd(), path.write_text(), path.exists()
  - Avoids string manipulation for paths, platform-aware
  - Implementation pattern in content_generators.py (lines 100-142)

  **Why Not**: os.path is less object-oriented; built-in open() without pathlib is verbose;
  third-party libraries add unnecessary dependencies.

  ---

  ### 4. GitCommitTool & GitPushTool (Chosen)

  **Decision**: Use sheep.tools infrastructure (GitCommitTool, GitPushTool) for git operations.

  **Rationale from Research**: Research findings (decision #7: "Git Integration Pattern") establish:
  - Sheep codebase provides these tools with error handling and logging
  - All features 001-264 use this pattern (example: feature_264_markdown_file_creation.py lines 86-87, 91-92)
  - Handles platform differences and git configuration validation
  - Provides structured return values for testing and introspection

  **Why Not**: Subprocess calls bypass error handling; GitPython introduces external dependencies;
  manual shell commands create security risks (command injection).

  ---

  ### 5. Conventional Commit Format (Chosen)

  **Decision**: Use format "feat(265): Create markdown file test-etv56m.md with prose content"

  **Rationale from Research**: Research findings (decision #8: "Conventional Commit Message Format"):
  - Specified in feature requirements (FR-6) and observed across all 200+ implementations
  - Follows Conventional Commits standard, enables semantic versioning
  - Feature number keeps messages concise and searchable
  - Consistent with established pattern from all prior features

  **Why Not**: Generic messages ("Add test file") are less descriptive and lose semantic meaning;
  different prefixes would be inconsistent with established pattern.

  ---

  ### 6. Comprehensive Validation Strategy (Chosen)

  **Decision**: Multi-stage validation: after generation, after file write, before git operations.

  **Rationale from Research**: Research findings (decision #9: "Validation Strategy") detail three validation stages:
  1. After LLM generation: _validate_markdown_content (content_generators.py lines 70-97)
  2. After file write: File existence, size, structure checks (lines 131-137)
  3. Pre-commit: validate_markdown_file comprehensive checks (lines 209-303)

  This staged approach ensures all NFRs are met (UTF-8 encoding, LF line endings, H1 syntax,
  sentence count, trailing newline, file size) before any git operations.

  **Why Not**: No validation would miss issues early; single post-write validation would fail late;
  minimal validation (file exists only) would miss encoding/line ending issues.

  ---

  ## Implementation Strategy

  ### Phase Sequencing Rationale

  The three phases are ordered to maximize efficiency and enable early error detection:

  **Phase 1: Module Setup** comes first because:
  - Establishes the container for all subsequent work
  - Allows test structure to be created alongside implementation (TDD)
  - Creates a clear checkpoint before implementing complex logic
  - Minimal setup enables quick feedback loop

  **Phase 2: Core Implementation** follows because:
  - Three components are relatively independent (can be developed in parallel in principle,
    but sequenced for clarity)
  - Each component builds on pathlib, CrewAI, and sheep.tools infrastructure (no inter-component dependencies)
  - Errors in generation are caught before file I/O; errors in validation prevent git operations
  - Natural flow mirrors the git workflow: generate → write → validate → commit → push

  **Phase 3: Testing** comes last because:
  - Tests exercise the full implementation from Phase 2
  - Validation tests ensure all acceptance criteria are met
  - Integration tests verify orchestration function wires components correctly
  - Final checkpoint before git operations and code review

  ### Dependency Resolution

  - **No external dependencies** beyond Python standard library (pathlib) and already-installed sheep.tools
  - **CrewAI/Anthropic SDK** already available in project (used by features 001-264)
  - **Git infrastructure** assumes git is configured and feature branch exists (pre-created as noted in spec)
  - **Feature pattern** established by 90+ prior implementations, no new architectural patterns needed

  ### Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | **LLM API call fails or times out** | Medium | High (blocks file creation) | Implement retry logic (3 attempts, exponential backoff) with clear error messages. Fallback to deterministic content if LLM unavailable (not ideal but acceptable for test artifact). |
  | **File write fails (disk full, permission denied)** | Low | High (blocks entire feature) | Validate write permission before attempting write. Check disk space. Use pathlib's exception handling for clear error messages. |
  | **Validation rejects generated content (wrong sentence count, format)** | Medium | Medium (must regenerate) | Validation logic is proven across 200+ implementations. If edge case occurs, regenerate content with refined prompt. Log validation failures for debugging. |
  | **Git operations fail (push rejected, branch issue)** | Low | High (blocks merge) | Feature branch is pre-created (no creation needed). GitCommitTool/GitPushTool handle most git errors. Ensure feature branch tracking is correct before pushing. |
  | **File already exists from previous run** | Low | Low (easy fix) | File name (test-etv56m.md) is unique to feature 265. If file exists, skip creation (idempotent) or error with clear message. Validation would catch duplicate runs. |
  | **Encoding issues (UTF-8 with BOM, CRLF line endings)** | Low | Medium (fails validation) | Python's default encoding="utf-8" produces UTF-8 without BOM on all platforms. Text mode write automatically handles LF on Unix. Validation explicitly checks for and rejects BOM and CRLF. |
  | **Test failures reveal implementation bugs** | Medium | Low-Medium (caught before commit) | Comprehensive test suite catches issues early (TDD approach). Feature-level tests verify orchestration works correctly. Unit tests isolate individual components. |

  ---

  ## Files & Scope

  ### New Files Created
  - **src/sheep/features/feature_265_markdown_file_creation.py** (~70 lines)
    - Orchestration function with metadata, error handling, logging
    - Calls reusable utilities from content_generators.py

  - **tests/features/test_feature_265_markdown_file_creation.py** (~150-200 lines)
    - Unit tests for each component (generation, write, validation, git)
    - Integration tests for orchestration function
    - Acceptance tests for all requirements

  - **test-etv56m.md** (~400-600 bytes)
    - Markdown file created as feature artifact
    - H1 heading + 2-3 sentences of prose
    - UTF-8 encoding, LF line endings, valid CommonMark syntax

  ### Files Modified
  - **None** — Feature only uses existing utilities from content_generators.py
  - No changes to source code, configuration, or application logic

  ### Reused Infrastructure
  - **src/sheep/content_generators.py** — Existing reusable utilities
    - generate_markdown_content() for LLM-based content generation
    - write_markdown_file() for file I/O with validation
    - validate_markdown_file() for comprehensive format checking
    - commit_markdown_file() and push_markdown_file() for git operations
  - **sheep.tools** — Git operation tools (GitCommitTool, GitPushTool)
  - **sheep.observability.logging** — Structured logging infrastructure

  ---

  ## Acceptance Criteria by Phase

  ### Phase 1: Module Setup
  - [ ] feature_265_markdown_file_creation.py created in src/sheep/features/
  - [ ] create_feature_265_markdown_file() function exists with proper signature
  - [ ] FEATURE_NUMBER=265 and MARKDOWN_FILENAME="test-etv56m.md" constants defined
  - [ ] Test file created (test_feature_265_markdown_file_creation.py) with test structure
  - [ ] Module imports without errors

  ### Phase 2: Core Implementation
  - [ ] Content generation produces H1 heading + 2-3 sentences
  - [ ] File written to repository root with correct name
  - [ ] File encoding is UTF-8 without BOM
  - [ ] File line endings are LF (not CRLF)
  - [ ] File contains valid CommonMark syntax
  - [ ] File size is 400-600 bytes
  - [ ] git add stages the file
  - [ ] git commit uses conventional format with feature number
  - [ ] git push succeeds to feature branch

  ### Phase 3: Testing & Validation
  - [ ] All unit tests pass (generation, write, validation, git)
  - [ ] All integration tests pass (orchestration function)
  - [ ] All acceptance tests pass (file format, encoding, git workflow)
  - [ ] Test coverage includes edge cases and error scenarios
  - [ ] Orchestration function returns structured result with metadata

  ---

  ## Notes

  - This feature is fully specified by the 90+ precedents (features 001-264).
  - The implementation follows proven patterns with no new architectural decisions.
  - The research findings provide detailed justification for every technical choice.
  - Expected implementation time: 10-15 minutes (per size estimate in spec).
  - No external documentation needs to be updated (established pattern is documented elsewhere).
