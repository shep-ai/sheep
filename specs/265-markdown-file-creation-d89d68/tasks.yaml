content: |
  ## Summary

  Feature 265 implementation is organized into **7 focused tasks across 3 phases**:

  ### Phase 1: Foundation (Task 1)
  Create feature module structure matching the established pattern from features 001-264.
  This sets up the container for orchestration, metadata constants, and test infrastructure.
  Estimated: 15 minutes.

  ### Phase 2: Implementation (Tasks 2-5)
  Implement the four core components sequentially, then integrate into orchestration function:
  1. Content generation using Claude API (20 min)
  2. File writing with comprehensive validation (20 min)
  3. Git operations (add, commit, push) (20 min)
  4. Orchestration function integration (15 min)

  Each component uses reusable utilities from content_generators.py and sheep.tools,
  maintaining DRY principle and consistency with prior features. The sequence (generate → write → validate → commit → push)
  mirrors the natural workflow and enables early error detection.
  Estimated: 75 minutes (but straightforward following established patterns).

  ### Phase 3: Testing & Validation (Tasks 6-7)
  Create comprehensive test suite covering unit, integration, and acceptance scenarios.
  Execute full test suite to verify all acceptance criteria are met.
  Expected to identify and resolve any edge cases missed in implementation.
  Estimated: 40 minutes.

  ### Total Estimated Effort: 2 hours (planning/implementation buffer)

  Actual implementation is straightforward (10-15 minutes per spec) following the proven pattern
  from 90+ preceding features. The estimates above include planning, testing, and validation overhead.

  ---

  ## Task Dependency Graph

  ```
  task-1 (Module Setup)
    ├── task-2 (Content Generation)
    ├── task-3 (File Writing)
    └── task-4 (Git Operations)
         └── task-5 (Orchestration Integration)
              └── task-6 (Test Suite Creation)
                   └── task-7 (Full Test Execution & Verification)
  ```

  **Key Points**:
  - Task 1 (module setup) is the foundation; all other tasks depend on it
  - Tasks 2-4 can theoretically be developed in parallel (independent concerns)
  - Task 5 depends on tasks 2-4 and integrates them
  - Tasks 6-7 form the validation phase (test suite, then execution)

  ---

  ## Acceptance Criteria By Feature

  All tasks collectively satisfy the feature requirements:

  ### File Requirements (Tasks 2-3)
  - [ ] File `test-etv56m.md` exists in repository root
  - [ ] File contains H1 heading (# syntax) as title
  - [ ] File contains 2-3 sentences of prose below heading
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses LF line endings (not CRLF)
  - [ ] File size is 400-600 bytes
  - [ ] File has valid CommonMark markdown syntax

  ### Git Requirements (Tasks 4-5)
  - [ ] File is staged with git add
  - [ ] File is committed with message: "feat(265): Create markdown file test-etv56m.md with prose content"
  - [ ] Commit is pushed to feature branch feat/265-markdown-file-creation-d89d68
  - [ ] No other files are modified or created

  ### Testing Requirements (Tasks 6-7)
  - [ ] Comprehensive test suite exists (10+ test cases)
  - [ ] All tests pass (0 failures)
  - [ ] Tests cover all acceptance criteria and non-functional requirements
  - [ ] Tests include error scenarios and edge cases
  - [ ] End-to-end validation confirms feature works as specified

  ---

  ## Notes

  - Each task follows **TDD: RED → GREEN → REFACTOR** cycle
  - Dependencies are ordered to prevent circular dependencies or forward references
  - Estimated effort includes actual implementation + testing + debugging buffer
  - The pattern is proven across 200+ feature implementations (features 001-264)
  - No external documentation updates needed (pattern is established)
  - Feature is scoped to be small and focused (single file creation)
