# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a new markdown file named `test-zihquv.md` in the repository root directory with a title and 2-3 sentences of prose content. This task is part of a series of similar markdown file creation features (features 118+) that serve as test cases for the Sheep agentic platform's file creation capabilities.

  ## Success Criteria

  - [ ] Markdown file `test-zihquv.md` is created at the repository root directory
  - [ ] File contains exactly one H1 markdown heading (e.g., `# Title Here`)
  - [ ] File contains between 2-3 sentences of prose content
  - [ ] Prose content is on any topic (not restricted)
  - [ ] File follows valid CommonMark markdown syntax
  - [ ] Changes are committed with conventional commit message format: `feat(128): Create markdown file test-zihquv.md`
  - [ ] Commit is pushed to the feature branch on remote repository
  - [ ] Feature branch matches branch name: `feat/128-markdown-file-create-e85bb7`

  ## Functional Requirements

  - **FR-1: File Creation**: Create a new file named `test-zihquv.md` in the repository root directory. The file must not exist before creation.
  - **FR-2: Heading Structure**: The file must contain exactly one H1 markdown heading using the syntax `# Title` (not HTML `<h1>` tags).
  - **FR-3: Prose Content**: The file must contain 2-3 sentences of prose content below the H1 heading. Each sentence must end with a period.
  - **FR-4: Content Topic**: The prose content may be about any topic; no topic restrictions apply. This is a test file for demonstrating file creation capability.
  - **FR-5: Markdown Validity**: The complete file must conform to CommonMark specification (https://commonmark.org/). When validated by a CommonMark parser, the file must produce valid HTML output.
  - **FR-6: File Encoding**: The file must be saved as UTF-8 with Unix line endings (LF, not CRLF).

  ## Non-Functional Requirements

  - **NFR-1: Git Commit Format**: Changes must be committed using conventional commits specification with scope `(128)`, type `feat`, and subject line matching the file creation: `feat(128): Create markdown file test-zihquv.md`.
  - **NFR-2: Atomic Commit**: All changes (file creation) must be committed in a single, atomic git commit with no separate commits for this feature.
  - **NFR-3: Remote Push**: The feature branch must be pushed to the remote repository using standard git push workflow. Branch tracking should be set up with `-u origin` flag on first push.
  - **NFR-4: No Side Effects**: File creation must not modify any existing files, directories, or configuration. The task must be isolated to creating exactly one new markdown file.
  - **NFR-5: Performance**: File creation must complete in under 1 minute from start to push, including commit message composition.

  ## Codebase Analysis

  ### Project Structure

  The repository is **Sheep**, an agentic development platform built with CrewAI for automated code implementation. The relevant structure for this task is:

  ```
  /
  ├── specs/                    # Feature specifications and metadata
  │   ├── 128-markdown-file-create-e85bb7/  # Current feature spec
  │   └── [other specs]/
  ├── test-*.md                 # Markdown test files (growing collection)
  ├── README.md                 # Project documentation
  ├── DESIGN_PATTERN.md         # Reference documentation
  └── [other root markdown files]
  ```

  ### Architecture Patterns

  **File Creation Pattern:** The project follows a consistent pattern for features that create markdown files:
  1. Each feature creates exactly one markdown file
  2. Files are placed in the repository root directory
  3. Filenames follow the pattern `test-<randomstring>.md` or similar identifiers
  4. Content includes an H1 title (Markdown heading) and prose text (2-3 sentences)
  5. No code changes, tests, or architectural modifications are required
  6. Each feature results in a single commit with a conventional commit message

  **Git Workflow:** Features follow a standard git workflow:
  - Feature branches are created with names like `feat/128-markdown-file-create-e85bb7`
  - Changes are committed with conventional commit messages (e.g., `feat(128): Create markdown file test-zihquv.md`)
  - Commits are pushed to remote and associated with pull requests

  ### Relevant Technologies

  - **Markdown** - The file format for the output file; must comply with CommonMark specification
  - **Git** - Version control for tracking file creation; must follow conventional commits format
  - **File System** - Storage layer where the file will be created; must use UTF-8 encoding with LF line endings

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Only adds a new markdown file to the root directory; no modifications to existing files or directories |
  | Specs Directory | Low | No impact; spec metadata is already in place in `/specs/128-markdown-file-create-e85bb7/` |
  | Build/Test Systems | None | No code changes, so no impact on build, test, or CI/CD systems |
  | Documentation | None | No impact on existing documentation; creates a standalone markdown file |

  ## Dependencies

  **External Dependencies:** None. This is a pure file creation task with no external package or service dependencies.

  **Existing Code Dependencies:** None. The task does not depend on or interact with any existing Python, JavaScript, or other source code.

  **Infrastructure Dependencies:**
  - Git repository (already present and initialized)
  - File system write permissions to repository root (standard for any feature branch)
  - Remote repository access for push (standard workflow via git remote)

  ## Size Estimate

  **S** (hours) — This is a trivial file creation task requiring:
  - 5 minutes to write the markdown content with H1 heading and 2-3 sentences
  - 2 minutes to stage, commit with proper message, and push to remote
  - No code review complexity
  - No testing requirements beyond file existence and markdown validity
  - Total estimated time: < 15 minutes

  The task has zero architectural complexity, no algorithmic work, and no dependencies on other systems or code.
