# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep repository maintains a collection of markdown content files at the repository root serving
  various purposes (documentation, guides, state machines, examples, test files). This feature extends
  that established pattern by creating a new markdown file named `test-7uexry.md` containing a title
  and 2-3 sentences of content about any topic. This is a straightforward content addition with no
  code changes required. Similar features (034-039) have already implemented this pattern successfully.

  ## Success Criteria

  - [ ] File `test-7uexry.md` is created at the repository root
  - [ ] File contains exactly one valid Markdown heading (H1 with `#` or H2 with `##`)
  - [ ] File contains between 2-3 sentences of coherent content following the heading
  - [ ] Content is meaningful and comprehensible (not gibberish or placeholder text)
  - [ ] File uses valid Markdown syntax with no syntax errors or formatting issues
  - [ ] File encoding is UTF-8 without BOM (Byte Order Mark)
  - [ ] Line endings are LF (Unix-style, `\n`), not CRLF (`\r\n`)
  - [ ] No other files are created, modified, or deleted as part of this feature
  - [ ] Changes are committed with a descriptive conventional commit message following the pattern `feat(content): Create test-7uexry.md markdown file`
  - [ ] Commit is pushed to the feature branch (feat/040-test-markdown-file-bfe362)
  - [ ] File follows formatting and style conventions consistent with existing test markdown files in the repository

  ## Functional Requirements

  - **FR-1**: The system must create a file named `test-7uexry.md` in the repository root directory
  - **FR-2**: The file must contain a valid Markdown heading (H1 or H2) that serves as the document title
  - **FR-3**: The file must contain 2-3 sentences of content immediately following the heading
  - **FR-4**: The file content must be substantive and coherent (developer chooses appropriate topic)
  - **FR-5**: The file must be tracked in Git and committed to the feature branch with a conventional commit message
  - **FR-6**: No other repository files, configurations, or code must be modified as part of this feature

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM to ensure compatibility across platforms and editors
  - **NFR-2**: Line endings must use LF (Unix-style `\n`) to maintain consistency with repository standards and prevent Git diffs
  - **NFR-3**: File must use valid Markdown syntax that renders correctly in GitHub, markdown viewers, and static site generators
  - **NFR-4**: File size must be minimal (< 1 KB) as befits a test file with 2-3 sentences of content
  - **NFR-5**: Implementation must not introduce any new dependencies or require configuration changes
  - **NFR-6**: Feature implementation must be isolated and reversible (single file addition with no side effects)

  ## Product Questions & Decisions

  No open product questions. The requirements are fully specified:

  - **File name and location**: Already defined as `test-7uexry.md` at repository root
  - **Content structure**: Already defined as heading + 2-3 sentences
  - **Content topic**: Delegated to developer discretion (any topic acceptable)
  - **Heading level**: Both H1 and H2 are acceptable per specification
  - **Sentence count**: Range of 2-3 is already fixed

  Implementation proceeds directly to execution phase with these specifications.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository has the following key directories and their purposes:

  - **Repository Root**: Contains collection of markdown files including documentation, guides (kiln-construction.md, cartography.md, salt-mining.md), state machines (DOOR_LOCK_STATE_MACHINE.md, ELEVATOR_STATE_MACHINE.md), and test files (test-*.md)
  - **src/sheep**: Python source code implementing the agentic platform
  - **tests/**: Test suite for the platform
  - **specs/**: Feature specifications directory containing numbered feature specifications (006-040+)
  - **.github/workflows**: CI/CD pipeline configuration

  ### Architecture Patterns

  The repository follows these patterns:

  - **Markdown-first documentation**: Core documentation is stored as markdown files in the root directory, version-controlled in Git
  - **Feature branch workflow**: Each feature is developed on a dedicated branch (feat/NNN-name)
  - **Specification-driven development**: Each feature has a corresponding spec.yaml in the specs/ directory documenting requirements
  - **Conventional commits**: Commit messages follow the pattern `feat(content): description` for content additions
  - **Isolated features**: Each feature makes minimal, focused changes without side effects

  ### Relevant Technologies

  - **Markdown**: The content format for this feature
  - **Git**: Version control system for tracking file additions and changes
  - **YAML**: Specification format for feature documentation

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root markdown files | Low | Adding a new markdown file at the root directory following existing naming conventions. No code, configuration, or test modifications. |
  | Feature specifications (specs/) | Low | The spec.yaml file itself is created/updated to document this feature, as per the standard process. |
  | Git repository | Low | Single file addition; no destructive changes or complex merge implications. |
  | Python source code (src/) | None | No impact to any executable code, dependencies, or architecture. |
  | Test suite (tests/) | None | No test modifications required; this is a static content addition only. |

  ## Dependencies

  **None identified**. This feature has no dependencies on:

  - Existing code or libraries
  - Other features or components
  - External systems or infrastructure
  - Configuration or environment changes

  The feature is completely isolated: it only adds a static text file to the repository.

  ## Size Estimate

  **S** (Small) — This is a trivial feature requiring only the creation of a single static markdown
  file with minimal content. No code analysis, no architectural decisions, no testing, and no integration
  with any system components. Effort is limited to:

  1. Create the file with appropriate content (< 2 minutes)
  2. Stage and commit the change (< 1 minute)
  3. Push to remote (< 1 minute)

  Expected effort: < 5 minutes. The S estimate is appropriate given the minimal scope.

