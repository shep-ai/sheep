  ## Summary

  Implementation consists of two sequential tasks:

  1. **Create markdown file** (5 min) — Write test-ss6paz.md with H1 heading,
     blank line, and 2-3 sentences of prose. Use pathlib for UTF-8 encoding
     and LF line endings.

  2. **Execute git workflow** (10 min) — Stage file with `git add`, commit with
     conventional message, and push to feature branch using `git push`.

  File creation uses `pathlib.Path.write_text(content, encoding='utf-8', newline='')`
  for simplicity and cross-platform compatibility. Git operations use `subprocess.run()`
  to invoke git CLI with explicit argument lists (no shell injection risk).

  No application code is modified, no external dependencies introduced beyond
  Python standard library. Implementation follows established pattern from 95+
  prior features (069-095) exactly.

  Total estimated effort: **15 minutes**

  Both tasks follow TDD approach:
  - **RED:** Write assertions/checks for desired state
  - **GREEN:** Write minimal code to achieve that state
  - **REFACTOR:** Clean up (minimal needed for simple tasks)
