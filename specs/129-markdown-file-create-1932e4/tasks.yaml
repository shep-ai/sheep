content: |
  ## Summary

  This feature requires 4 sequential tasks across 2 phases:

  **Phase 1: File Creation & Validation** (5-8 minutes)
  - Task 1 creates the markdown file with proper H1 heading, blank line separation, and 2-3 sentences of prose
  - Task 2 optionally validates the file against CommonMark specification to ensure compliance with FR-5

  **Phase 2: Git Integration** (4 minutes)
  - Task 3 commits the file with the conventional commit message format required by NFR-1
  - Task 4 pushes the commit to the remote feature branch, completing the feature

  All tasks follow the established pattern from 11+ successful similar features (118-128). The total estimated effort is 12 minutes, well within the 60-minute performance requirement (NFR-5).

  ## Task Ordering Rationale

  Tasks are sequenced by dependency:
  1. Task-1 creates the file (must complete first)
  2. Task-2 validates the file (depends on Task-1 creating it)
  3. Task-3 commits the validated file (depends on Task-2 completing validation)
  4. Task-4 pushes the commit (depends on Task-3 creating it)

  This dependency chain ensures quality and prevents pushing uncommitted files or invalid content.

  ## Implementation Notes

  **For Task 1:**
  - Use `pathlib.Path` to construct repository root path
  - Check `path.exists()` before creation (FR-1 requirement)
  - Use `open(filepath, 'w', encoding='utf-8', newline='\n')` for proper encoding and line endings
  - Write content with exact format: heading, blank line, prose

  **For Task 2:**
  - Use optional `commonmark` library if available
  - Parse markdown and verify valid HTML output
  - Task is optional; file is valid if Task 1 is done correctly

  **For Task 3:**
  - Use exact commit message: `feat(129): Create markdown file test-y465rm.md`
  - Verify only test-y465rm.md is in commit (git status check)

  **For Task 4:**
  - Push with upstream tracking: `git push -u origin feat/129-markdown-file-create-1932e4`
  - Verify remote branch exists after push
