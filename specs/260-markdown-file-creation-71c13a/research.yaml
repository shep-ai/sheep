# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path.write_text() with explicit encoding and newline parameters"
    rejected:
      - "open() context manager with manual line ending handling — more verbose and error-prone, requires manual mode/buffering configuration"
      - "os.open() with low-level file descriptors — overly complex for simple text file creation, lacks built-in encoding support"
      - "write() shell builtin via subprocess — unsafe for file operations, less portable, harder to control encoding"
    rationale: >
      pathlib.Path.write_text() is the modern, idiomatic Python approach for this use case (Python 3.11+ in production).
      It provides: (1) Cross-platform path handling via Path objects, (2) Direct encoding parameter support (eliminates manual
      codec wrapping), (3) Built-in newline parameter to enforce platform-independent line endings, (4) Atomic write semantics
      (failure doesn't create partial files). This matches all 259+ precedent implementations verified in create_markdown_file_219.py
      and prior feature commits. Preferred over open() for its simplicity and safety.

  - title: "Git Integration Method"
    chosen: "subprocess.run() with check=True for deterministic error handling"
    rejected:
      - "GitPython library (pygit2/gitpython package) — unnecessary external dependency for simple git operations, adds dependency management overhead"
      - "Direct shell subprocess calls (e.g., shell=True with git command string) — security risk for command injection, harder to debug, less portable"
      - "os.system() or popen() — deprecated pattern, no structured error handling, difficult to capture output or exit codes"
    rationale: >
      subprocess.run() with check=True is part of Python standard library (3.5+), deterministic, and secure. It provides:
      (1) Structured subprocess execution with clear error handling via CalledProcessError exceptions, (2) Explicit command
      arguments as list prevents shell injection vulnerabilities, (3) check=True raises exception if command fails, making
      failures explicit rather than silent, (4) Preferred in Python 3.5+ over .call() or .Popen(). Matches all precedent
      implementations (features 151-259) which avoid external git libraries to minimize dependencies.

  - title: "Line Ending Consistency"
    chosen: "Explicit newline=\"\\n\" parameter in write_text() to enforce Unix LF on all platforms"
    rejected:
      - "Platform-dependent newline handling (newline=None or platform default) — violates NFR-6 (LF requirement) on Windows where platform default is CRLF, causes inconsistent behavior"
      - "Post-write manual conversion (read-then-replace, dos2unix utility) — adds complexity, slower, defeats atomic write semantics, requires two operations"
      - "Git autocrlf configuration reliance — defers responsibility to git config which may vary per repository, not guaranteed to be set correctly"
    rationale: >
      Explicit newline=\"\\n\" in write_text() is the most reliable approach: (1) Enforces Unix LF line endings across
      all platforms (Windows, macOS, Linux) regardless of system defaults, (2) Ensures consistency with NFR-6 requirement
      and 259+ existing test files, (3) Python's write_text() automatically translates \\n to platform newlines when newline=None,
      but newline=\"\\n\" disables this translation and writes literal \\n bytes, (4) No dependency on git config or external tools.
      This pattern is used in all precedent implementations and is the recommended approach in pathlib documentation.

  - title: "Content Structure and Formatting"
    chosen: "f-string formatting with explicit title and prose variables"
    rejected:
      - "Template files (Jinja2 or similar) — unnecessary complexity for single-use content generation, requires template file management"
      - "Hardcoded content as single string literal — inflexible, no separation of concerns between title and prose"
      - "Format strings with % or .format() — less readable than f-strings, less Pythonic in 3.6+ context"
    rationale: >
      f-strings (Python 3.6+) provide clarity and readability: (1) Simple interpolation of TITLE and PROSE variables into
      content template, (2) Explicit control over blank line structure (\\n\\n between heading and prose, final \\n at end),
      (3) Matches precedent implementations which use f\"-string format for content. String format: f\"# {TITLE}\\n\\n{PROSE}\\n\"
      produces H1 heading, blank line, prose, trailing newline — consistent with all 259+ test files in repository.

  - title: "Character Encoding Specification"
    chosen: "Explicit encoding=\"utf-8\" parameter in write_text()"
    rejected:
      - "Platform default encoding (no encoding parameter) — locale-dependent on Windows (could be cp1252) vs UTF-8 on Linux, causes cross-platform inconsistency"
      - "Manual BOM handling (prepend BOM to content) — unnecessary, pathlib.write_text() never adds BOM, adds extra bytes without value"
      - "Codecs module with open() wrapper — more complex, less idiomatic than pathlib parameter"
    rationale: >
      Explicit UTF-8 encoding ensures consistent behavior: (1) pathlib.write_text(encoding=\"utf-8\") enforces UTF-8 on all
      platforms regardless of system locale, (2) Satisfies NFR-1 requirement (UTF-8 without BOM — pathlib never adds BOM,
      only adds UTF-8 content), (3) Matches all precedent implementations which specify encoding=\"utf-8\". This is critical
      for cross-platform consistency and git compatibility (git prefers UTF-8 for text files).

  - title: "Prose Content Generation"
    chosen: "Manually authored, grammatically correct prose sentences (3 sentences per precedent)"
    rejected:
      - "Generated/synthetic prose (random words, Lorem Ipsum) — violates NFR-2 (coherent, grammatically correct prose); test files must demonstrate valid prose"
      - "Minimal content (1 sentence) — violates FR-4 specification requiring 2-3 sentences, insufficient content to validate prose generation"
      - "Repetitive boilerplate (templated sentences) — lacks variety, doesn't validate prose quality, reduces test file diversity"
    rationale: >
      Feature 260 specification (FR-4, NFR-2) requires \"exactly 2-3 sentences of coherent prose content\" and \"grammatically
      correct and coherent\" writing. Precedent implementations (features 151-259) use authored prose on varied topics (communication,
      technology, design patterns, etc.) to validate that automated system can generate valid content. This is a deliberate design
      choice: test files are not throwaway artifacts but validation of prose generation capability. 3 sentences per existing
      test-*.md files (test-8hjiqa.md, test-440dhk.md samples) is the established standard.

