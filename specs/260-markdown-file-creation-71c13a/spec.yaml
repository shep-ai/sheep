content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-ynmdu9.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 151-259,
  with 259+ similar test files already existing in the repository as precedents. The feature serves
  as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File `test-ynmdu9.md` is created in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings (\n), not CRLF
  - [ ] File is between 300-600 bytes in size (typical for test markdown files)
  - [ ] File is staged with `git add test-ynmdu9.md` and tracked by git
  - [ ] Commit message follows conventional format: `feat(260): Create markdown file test-ynmdu9.md with prose content`
  - [ ] Commit is pushed to the feature branch `feat/260-markdown-file-creation-71c13a`
  - [ ] No modifications are made to existing files or directories (single file creation only)

  ## Functional Requirements

  - **FR-1**: The system SHALL create a new markdown file named exactly `test-ynmdu9.md` in the repository root directory
  - **FR-2**: The file SHALL contain exactly one H1 markdown heading (single `#` followed by title text) on the first line
  - **FR-3**: The file SHALL contain a blank line after the H1 heading
  - **FR-4**: The file SHALL contain exactly 2-3 sentences of coherent prose content after the blank line
  - **FR-5**: The file SHALL be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: The file SHALL use LF (\n) line endings throughout
  - **FR-7**: The file SHALL be added to git staging area using `git add test-ynmdu9.md`
  - **FR-8**: The file SHALL be committed with a conventional commit message: `feat(260): Create markdown file test-ynmdu9.md with prose content`
  - **FR-9**: The commit SHALL be pushed to the feature branch `feat/260-markdown-file-creation-71c13a`
  - **FR-10**: No existing files or directories in the repository SHALL be modified or deleted

  ## Non-Functional Requirements

  - **NFR-1**: File size SHALL be within 300-600 bytes, consistent with existing test markdown files in the repository
  - **NFR-2**: Prose content SHALL be grammatically correct and coherent (no gibberish or nonsensical sentences)
  - **NFR-3**: The feature implementation SHALL complete within 10-15 minutes of work
  - **NFR-4**: The feature SHALL require no external dependencies beyond Python 3.11+ standard library and git
  - **NFR-5**: The feature SHALL not modify any source code in `src/sheep/` or other production directories
  - **NFR-6**: The feature SHALL follow the established pattern from features 151-259 for consistency and maintainability
  - **NFR-7**: The prose topic SHALL be arbitrary and unconstrained (free-form selection permitted)

  ## Product Decisions Summary

  This feature has a well-defined scope with established precedents (259+ similar test files in the repository).
  All major product decisions are resolved:

  | Decision | Recommendation | Rationale |
  | -------- | -------------- | --------- |
  | File location | Repository root directory | Matches established pattern from features 151-259 |
  | Content format | H1 heading + blank line + 2-3 sentences | Standardized format observed in 259+ existing test files |
  | Prose topic | Free-form/arbitrary selection | No business constraints; test files use varied topics for pattern validation |
  | Content quality | Grammatically correct and coherent | Validates proper prose generation capabilities (NFR-2) |
  | Git workflow | Conventional commits to feature branch | Aligns with project standards and CI/CD integration |
  | File encoding | UTF-8 without BOM | Platform standard for consistent cross-system handling |
  | Line endings | LF (\n) | Unix standard for version control compatibility |

  **No open product questions require stakeholder input.** All requirements are derived from established
  project patterns, user query constraints, and technical best practices.

  ## Acceptance Criteria

  Implementation is complete when:
  1. All success criteria checkboxes above are verified as complete
  2. File `test-ynmdu9.md` exists in repository root with correct content format
  3. Git log shows commit with message `feat(260): Create markdown file test-ynmdu9.md with prose content`
  4. File encoding is UTF-8 without BOM (verify with `file` command)
  5. Line endings are LF (verify with `file` command or `git diff --cached`)
  6. File size is between 300-600 bytes
  7. No other files were modified or created

  ## Implementation Notes

  **Recommended Implementation Pattern (from precedents 151-259):**
  ```python
  from pathlib import Path
  import subprocess

  # Define file path and content
  file_path = Path("./test-ynmdu9.md")
  title = "Selected Title"
  prose = "Sentence 1. Sentence 2. Sentence 3."
  content = f"# {title}\n\n{prose}\n"

  # Write file with UTF-8 encoding and LF line endings
  file_path.write_text(content, encoding="utf-8", newline="\n")

  # Git workflow
  subprocess.run(["git", "add", str(file_path)], check=True)
  subprocess.run([
    "git", "commit", "-m",
    "feat(260): Create markdown file test-ynmdu9.md with prose content"
  ], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  **Key Implementation Details:**
  - Use `pathlib.Path` for cross-platform file operations
  - Enforce `newline="\n"` in `write_text()` to ensure LF line endings on all platforms
  - Validate file size after creation (should be ~350-550 bytes for 2-3 sentences)
  - Use `check=True` in subprocess calls to catch errors
  - Verify git configuration has `user.name` and `user.email` set before committing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 259+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 151-259; no branch/merge complexity, no destructive operations |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Spec documentation updated during this phase; no impact on other specs or configurations |
  | Dependencies | None | Feature uses only Python standard library (`pathlib`) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |

  ## Dependencies

  **Required:**
  - Git repository with feature branch `feat/260-markdown-file-creation-71c13a` (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with `pathlib` (standard library, no external packages required)
  - Git configuration with user.name and user.email set for commits

  **Reference/Precedent:**
  - 259+ existing test markdown files (test-*.md) provide clear pattern to follow
  - Previous feature implementations (151-259) demonstrate successful execution of identical pattern
  - Features 151-259 specs provide exact templates and working examples
  - Previous implementation scripts provide working code patterns

  **Not Required:**
  - No source code dependencies
  - No new external package dependencies
  - No modifications to configuration files
  - No changes to src/sheep/ directory

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents:

  - **File creation**: ~5 minutes (compose one markdown heading + 2-3 sentences of prose content)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Well-established pattern with 259+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (151-259) demonstrate efficient execution in 10-15 minutes
  - No git merge conflicts or branch management complexity

  ---

  **Requirements phase complete — ready for implementation planning**
