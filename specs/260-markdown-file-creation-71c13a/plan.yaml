content: |
  ## Architecture Overview

  Feature 260 is a minimal, focused implementation that creates a single test markdown file following
  the established pattern from features 151-259 (259+ precedent test files in the repository).

  The implementation is purely additive: it creates one file with no modifications to existing code,
  configuration, or directory structure. It fits seamlessly into the Sheep project's test file structure,
  adding test-ynmdu9.md to the collection of test-*.md files used for pattern validation.

  The feature has no architectural complexity:
  - **No new dependencies:** Uses only Python 3.11+ standard library (pathlib, subprocess)
  - **No API changes:** Does not interact with source code in src/sheep/
  - **No configuration changes:** Does not modify any configuration or spec files
  - **Git workflow:** Standard feature branch workflow with conventional commits

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path.write_text(content, encoding="utf-8", newline="\n")` for file creation.

  **Alternatives Considered:**
  - `open()` context manager — more verbose, requires manual encoding and line ending configuration
  - `os.open()` with file descriptors — overly complex, lacks built-in encoding support
  - Shell-based write operations — less safe and portable

  **Rationale:** pathlib.Path.write_text() is the modern, idiomatic Python approach (best practice in Python 3.6+):
  - Provides cross-platform path handling via Path objects
  - Supports direct encoding parameter (eliminates codec wrapping)
  - Includes newline parameter for platform-independent line ending control
  - Offers atomic write semantics (failure doesn't create partial files)

  **Precedent:** All 259+ preceding test files (features 151-259) use this identical approach, confirming it
  as the established pattern in this codebase. Reference: create_markdown_file_219.py and similar implementations.

  ### 2. Git Integration: subprocess.run() with check=True

  **Decision:** Use `subprocess.run([cmd_args], check=True)` for all git operations (add, commit, push).

  **Alternatives Considered:**
  - GitPython library — external dependency (violates NFR-4 requirement for no external dependencies)
  - Direct shell subprocess with shell=True — security risk for command injection
  - os.system() — deprecated pattern with poor error handling

  **Rationale:** subprocess.run() with check=True is part of Python standard library (3.5+):
  - Provides deterministic error handling via CalledProcessError exceptions
  - Secure (command arguments as list, prevents shell injection)
  - Recommended approach in Python 3.5+ documentation
  - Simple and readable for straightforward command execution

  **Precedent:** All 259+ preceding implementations use this pattern exclusively. It is the clear standard
  for git integration in this codebase.

  ### 3. Line Ending Enforcement: newline="\n" Parameter

  **Decision:** Use explicit `newline="\n"` parameter in write_text() to enforce Unix LF on all platforms.

  **Alternatives Considered:**
  - Platform-dependent defaults (newline=None) — causes CRLF on Windows, violates requirement
  - Post-write conversion tools (dos2unix) — adds complexity, defeats atomic write semantics
  - Relying on git autocrlf config — behavior depends on external configuration

  **Rationale:** The `newline="\n"` parameter:
  - Disables Python's automatic newline translation
  - Writes literal LF bytes (\n) regardless of platform (critical on Windows)
  - Guarantees consistency with existing 259+ test files and spec requirement (NFR-6)
  - No dependency on git config or external tools

  This is the only reliable way to enforce LF line endings on all platforms while maintaining atomic write semantics.

  ### 4. Content Structure: f-String Formatting

  **Decision:** Use f-string formatting with separate TITLE and PROSE variables for content generation.

  **Alternatives Considered:**
  - Template files (Jinja2) — unnecessary complexity for simple string substitution
  - Hardcoded string literals — inflexible, poor code organization
  - Legacy % or .format() — less readable than f-strings in Python 3.6+

  **Rationale:** f-strings provide:
  - Clear, readable interpolation of title and prose variables
  - Explicit control over blank line structure (\n\n separator, final \n)
  - Idiomatic approach in Python 3.6+
  - Matches all precedent implementations

  Content format: `f"# {title}\n\n{prose}\n"` produces H1 heading, blank line, prose, trailing newline —
  consistent with all 259+ existing test files.

  ### 5. Character Encoding: Explicit UTF-8

  **Decision:** Specify explicit `encoding="utf-8"` parameter in write_text().

  **Alternatives Considered:**
  - Platform default encoding — locale-dependent (cp1252 on Windows, UTF-8 on Linux)
  - Manual BOM handling — unnecessary and adds extra bytes
  - Codecs module wrapper — less idiomatic than pathlib parameter

  **Rationale:** Explicit UTF-8:
  - Guarantees UTF-8 on all platforms regardless of system locale
  - Satisfies spec requirement (UTF-8 without BOM)
  - pathlib.write_text() never adds BOM, only content bytes
  - Used in all precedent implementations

  This ensures consistency and cross-platform portability.

  ### 6. Prose Content: Authored, Grammatically Correct Sentences

  **Decision:** Manually author 2-3 grammatically correct prose sentences on an arbitrary topic.

  **Alternatives Considered:**
  - Generated/synthetic prose (Lorem Ipsum, random words) — violates spec requirement for coherent content
  - Single sentence — violates spec requirement for 2-3 sentences
  - Repetitive boilerplate — lacks variety, doesn't validate prose quality

  **Rationale:** Feature spec (FR-4, NFR-2) explicitly requires "exactly 2-3 sentences of coherent prose content"
  and "grammatically correct and coherent" writing. Precedent implementations (features 151-259) use authored prose
  on varied topics to validate the system's capability to generate valid content. Test files are validation artifacts,
  not throwaway content. Three sentences is the established standard across all 259+ existing test-*.md files.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation)** comes first because:
  - The file must exist before it can be staged with git
  - Creating the file validates that the content structure is correct
  - Separates file creation concerns from git integration concerns

  **Phase 2 (Git Integration)** comes second because:
  - Depends on the file existing (Phase 1 prerequisite)
  - Stages, commits, and pushes the file to establish it in version control
  - Completes the full feature workflow

  ### Implementation Approach

  Implementation follows the pattern established in features 151-259:

  1. **File Creation Phase:**
     - Define file path: `test-ynmdu9.md` in repository root
     - Author title and prose content
     - Compose content string with f-string formatting
     - Write file using pathlib.Path.write_text() with UTF-8 encoding and newline="\n"

  2. **Git Integration Phase:**
     - Stage file: `git add test-ynmdu9.md`
     - Commit: `git commit -m "feat(260): Create markdown file test-ynmdu9.md with prose content"`
     - Push: `git push -u origin HEAD` (pushes to feature branch and sets upstream tracking)

  ### Validation Points

  After implementation, verify:
  - File `test-ynmdu9.md` exists in repository root
  - File contains H1 heading, blank line, and 2-3 prose sentences
  - File is UTF-8 encoded (verify with `file` command)
  - File uses LF line endings (verify with `file` or `git diff --cached`)
  - File size is 300-600 bytes
  - Git log shows commit with correct message
  - Remote branch has the pushed commit

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Git authentication fails on push | Low | Feature cannot be completed | Assume git is configured (per spec dependency). If push fails, verify SSH keys or credentials are set up. |
  | File already exists and would be overwritten | Low | Data loss (though only test file) | Check if file exists before creation. If it exists, verify it is safe to overwrite (it should be a test file from a prior run). |
  | Line endings converted to CRLF on Windows | Low | Test fails (NFR-6 requirement) | Use explicit `newline="\n"` parameter in write_text(). This parameter is supported in Python 3.4+ and disables automatic newline translation. |
  | File created with wrong encoding | Very Low | Spec validation fails | Use explicit `encoding="utf-8"` parameter in write_text(). This is standard practice and eliminates platform-specific encoding issues. |
  | Git commit message malformed | Very Low | CI/CD rejects commit | Use exact conventional commit format: "feat(260): Create markdown file test-ynmdu9.md with prose content". This is a fixed string, no variables. |
  | Prose content is incoherent or duplicated | Very Low | Spec validation fails (NFR-2) | Author new prose manually for this file. Ensure it is grammatically correct and coherent (not Lorem Ipsum or random text). |

  ## Files

  **Files to Create:**
  - `test-ynmdu9.md` — Markdown file with title, blank line, and 2-3 prose sentences

  **Files to Modify:**
  - None — Feature is purely additive

  ## Conclusion

  Feature 260 is a straightforward implementation of the established markdown-file-creation pattern.
  All architecture decisions are precedent-validated through 259+ successful test files. The implementation
  requires no novel technologies, no external dependencies, and no modifications to existing code.

  Implementation should follow the pattern from create_markdown_file_219.py exactly, with the only variable
  being the prose content (topic and wording can be arbitrary per spec).
