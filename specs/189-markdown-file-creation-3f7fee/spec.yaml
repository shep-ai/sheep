content: |
  ## Problem Statement

  Create a single markdown file called test-joedur.md with a title and 2-3 sentences about any topic. The file should follow the established pattern used by 100+ similar test files already present in the repository.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The codebase is organized as follows:

  - `src/sheep/` - Main package containing agent definitions, configuration, and flows
  - `specs/` - Feature specifications in YAML format (189+ feature specs)
  - `tests/` - Test suite using pytest
  - Root directory - Contains numerous test markdown files (test-*.md) and feature implementations

  The project demonstrates a clear pattern of creating test markdown files through simple Python scripts that follow consistent conventions.

  ### Architecture Patterns

  The project follows a **pattern-based architecture** for file creation tasks:

  1. **Simple Script Execution**: Feature implementations are standalone Python scripts that handle create, validate, commit, and push operations
  2. **Modular File I/O**: All scripts use `pathlib.Path` for modern, cross-platform file operations
  3. **Git Integration**: Direct subprocess calls for git operations (add, commit, push)
  4. **Validation**: Each created file is validated for structure, encoding, and size
  5. **Consistent Messaging**: Conventional commit messages follow the pattern `feat(number): description`

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher
  - **pathlib.Path**: Modern file I/O library (used exclusively in similar implementations)
  - **subprocess**: Git operations via command line
  - **Markdown**: Plain text format for documentation
  - **Git**: Version control workflow (add, commit, push)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | Low | Creates a single new file (test-joedur.md) in repo root, following the pattern of 100+ existing test-*.md files |
  | Git repository | Low | Stages, commits, and pushes the new file using standard git workflow |
  | File system | Low | Simple file write operation (450-500 bytes) with UTF-8 encoding |

  ## Dependencies

  **External Dependencies:**
  - None (uses only Python standard library: pathlib, subprocess, sys)

  **Internal Dependencies:**
  - Git (version control system)
  - Established markdown file patterns from existing test files (test-2cw6g8.md, test-n49t8o.md, etc.)

  **Known Working Examples:**
  - 100+ similar test markdown files already exist in the repository root
  - Multiple implementation scripts demonstrate the pattern (create_markdown.py, create_markdown_file.py)
  - Feature implementations in src/sheep/features/ (feature_148_markdown_file_creation.py, etc.)

  ## Size Estimate

  **S** — 1-2 hours of effort

  **Justification:**
  - Trivial complexity: Single file creation following an established, well-documented pattern
  - No new code paths or logic required: Copy pattern from 100+ existing test files
  - No dependencies: Only uses Python standard library (pathlib, subprocess)
  - Clear success criteria: H1 heading + 2-3 sentences, proper encoding, git workflow
  - Expected file size: ~450-550 bytes (consistent with similar test files)
  - No architectural decisions required: Pattern is already established
  - No testing framework needed beyond file validation
