content: |
  ## Problem Statement

  Create a single markdown file named test-joedur.md in the repository root containing an H1 heading and 2-3 sentences of prose content about any topic. The file must follow the established pattern used by 100+ existing test files in the repository: UTF-8 encoding, Unix LF line endings, proper markdown structure, comprehensive validation, and be committed and pushed to git.

  ## Success Criteria

  - [ ] File test-joedur.md is created in repository root (not in subdirectories)
  - [ ] File contains exactly one H1 heading (markdown level 1: # followed by space and title text)
  - [ ] File contains 2-3 sentences of valid prose content (substantive text about any topic)
  - [ ] File encoding is UTF-8 (verified by reading and writing as utf-8)
  - [ ] File line endings are Unix LF only (no CRLF, no mixed line endings)
  - [ ] File validates successfully for markdown syntax and structure
  - [ ] File is staged with git add and committed to git
  - [ ] Commit message follows conventional commit format: \"feat(189): [descriptive message]\"
  - [ ] Commit is pushed to remote repository
  - [ ] File size is between 400-600 bytes (consistent with similar test files)
  - [ ] File matches the format and structure of existing test-*.md files
  - [ ] Script executes without errors or exceptions
  - [ ] If file already exists, script aborts with clear error message

  ## Functional Requirements

  - **FR-1**: Create file at repository root path with exact name \"test-joedur.md\"
  - **FR-2**: File must contain one H1 markdown heading (single # character followed by space and descriptive title)
  - **FR-3**: File must contain 2-3 sentences of prose content covering any topic the implementation chooses
  - **FR-4**: Content must be grammatically valid and substantive (not placeholder or repeated text)
  - **FR-5**: Ensure file encoding is UTF-8 using Python's utf-8 codec
  - **FR-6**: Ensure file uses Unix LF line endings only (use \"\\n\" not \"\\r\\n\")
  - **FR-7**: Validate file exists and is readable immediately after creation
  - **FR-8**: Verify file encoding by reading file content as UTF-8 without errors
  - **FR-9**: Stage file with \"git add test-joedur.md\" command
  - **FR-10**: Commit file with conventional commit message including feature number (189)
  - **FR-11**: Push commit to remote repository using \"git push\" (respects origin/branch configuration)
  - **FR-12**: If test-joedur.md already exists at creation time, abort immediately with descriptive error
  - **FR-13**: Validate file structure matches markdown requirements before committing

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must use only Python standard library (pathlib, subprocess, sys, os) — no pip packages
  - **NFR-2**: Script execution must complete in under 10 seconds including all git operations
  - **NFR-3**: File size must be between 400-600 bytes (reasonable for H1 + 2-3 sentences)
  - **NFR-4**: Implementation must follow code patterns established in existing markdown creation scripts in the codebase
  - **NFR-5**: Must validate file structure, encoding, and line endings before committing
  - **NFR-6**: Error messages must be clear, specific, and actionable (e.g., \"File test-joedur.md already exists\")
  - **NFR-7**: File must match the format and structure conventions of 100+ existing test-*.md files in repo
  - **NFR-8**: Git operations must handle standard error cases (e.g., git not in PATH, no network)
  - **NFR-9**: Implementation must not require user input or configuration beyond running the script

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  |---|----------|-------------------|-----------|
  | 1 | Should implementation push to remote repository? | Yes, push to remote | Established pattern includes push operations. 100+ test files are in remote repo. Ensures team accessibility. |
  | 2 | How to handle existing test-joedur.md file? | Error and abort | Prevents data loss. Makes failures visible. Aligns with fail-fast principle. User can easily recover by deleting file. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  |------|--------|-----------|
  | Root directory | Low | Creates single new file (test-joedur.md) in repo root, following pattern of 100+ existing test-*.md files |
  | Git repository | Low | Stages, commits, and pushes new file using standard git workflow (add, commit, push) |
  | File system | Low | Simple file write operation (~450-550 bytes) with UTF-8 encoding and LF line endings |

  ## Dependencies

  **External Dependencies:**
  - None (uses only Python standard library: pathlib, subprocess, sys)

  **Internal Dependencies:**
  - Git (version control system) — must be available in PATH
  - Established markdown file patterns from existing test files (test-2cw6g8.md, test-n49t8o.md, test-abc123.md, etc.)
  - Repository must be a valid git repository with remote configured

  **Known Working Examples:**
  - 100+ similar test markdown files already exist in repository root
  - Multiple implementation scripts demonstrate the pattern (create_markdown.py, create_markdown_file.py)
  - Feature implementations in src/sheep/features/ directory show git workflow patterns
  - Feature #148, #185, #186, #187, #188 all completed markdown file creation successfully

  ## Size Estimate

  **S** — 1-2 hours of effort

  **Justification:**
  - Trivial complexity: Single file creation following an established, well-documented pattern
  - No new code paths or logic required: Copy pattern from 100+ existing test files
  - No external dependencies: Only uses Python standard library (pathlib, subprocess)
  - Clear success criteria: H1 heading + 2-3 sentences, proper encoding/line endings, git workflow
  - Expected file size: ~450-550 bytes (consistent with similar test files)
  - No architectural decisions required: Pattern is already established in codebase
  - Validation is straightforward: File existence, encoding, line endings, markdown syntax checks
