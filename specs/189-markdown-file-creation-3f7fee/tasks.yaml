content: |
  ## Summary

  This task breakdown implements the test-joedur.md markdown file creation feature
  across three phases:

  **Phase 1: File Creation & Validation (5 tasks)**
  First, we define content constants and validate that the target file doesn't already exist.
  Then we create the markdown file with proper UTF-8 encoding and Unix LF line endings using
  pathlib.Path.write_text(). Finally, we perform comprehensive validation: checking encoding
  (no BOM), line endings (LF only), markdown structure (H1 + blank line + prose), sentence
  count (2-3), and file size (400-600 bytes). This ensures file quality before committing.

  **Phase 2: Git Integration (1 task)**
  After validation passes, we run the git workflow: stage the file with `git add`,
  create a commit with conventional format message, and push to remote with `git push -u origin HEAD`.
  Uses subprocess.run() with check=True for robust error handling.

  **Phase 3: Error Handling & Integration (2 tasks)**
  We wrap the entire workflow in comprehensive error handling, catching specific exception
  types (ValueError for validation, OSError for I/O, CalledProcessError for git). All errors
  print clear, actionable messages to stderr and exit with code 1. Finally, we verify the
  complete end-to-end workflow with an integration test, ensuring the file is created,
  validated, committed, and pushed successfully.

  **Task Dependencies:**
  - Task 1 (constants) is the foundation
  - Task 2 (file exists check) depends on Task 1
  - Tasks 3, 4, 5, 6 (file creation and validation) all depend on Tasks 1-2
  - Task 7 (git workflow) depends on Task 6 (all validation must pass first)
  - Task 8 (error handling and integration) depends on Task 7

  **Total Effort:** 2 hours 25 minutes (8 tasks, estimated 15-30 min each)
