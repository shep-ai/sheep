decisions:
  - title: "File Creation Method"
    chosen: "pathlib.Path.write_text() with encoding=\"utf-8\" and newline=\"\\n\""
    rejected:
      - "pathlib.Path.write_bytes() with content.encode('utf-8') — More verbose and less Pythonic. Requires manual string-to-bytes conversion when pathlib handles this natively."
      - "open() context manager — Lower-level API, requires explicit file closing and more boilerplate. pathlib is the modern standard for Python 3.11+."
      - "os.path with os.open() — Legacy approach lacking object-oriented interface and readability."
    rationale: >
      Path.write_text() is the modern Pythonic standard for file I/O in Python 3.11+.
      Using encoding=\"utf-8\" ensures UTF-8 without BOM, and newline=\"\\n\" guarantees
      Unix LF line endings on all platforms without platform-specific behavior. This approach
      is clearest to readers and matches the pattern used in features #174 and #176. The single
      method call handles encoding, newline handling, and file closing automatically, reducing
      code complexity and error risk.

  - title: "Existing File Conflict Handling"
    chosen: "Check file existence and abort with clear error message"
    rejected:
      - "Silently overwrite existing file — Risks data loss and makes failures invisible. Violates fail-fast principle."
      - "Silently skip and report success — Obscures the issue entirely. Hides real problems that should be visible."
    rationale: >
      The specification explicitly requires \"Error and abort\" behavior (resolved open questions).
      This prevents accidental data loss, makes failures obvious and debuggable, and aligns
      with Unix philosophy of explicit error handling. Users can easily recover by manually
      deleting the file and re-running. This matches the implementation in feature #174.

  - title: "Validation Strategy and Scope"
    chosen: "Comprehensive validation before git commit: file existence, encoding (no BOM), line endings (LF only), structure (H1 + blank line + prose), sentence count (2-3), file size (400-600 bytes), file ends with newline"
    rejected:
      - "Minimal validation (only file exists) — Fails to catch encoding issues, improper line endings, or structural problems."
      - "No validation — Risks pushing invalid files to remote repo. Violates specification requirements."
    rationale: >
      Comprehensive validation ensures file quality before committing to remote repo. This is
      particularly important since git history is immutable once pushed. The pattern is
      established across features #185-188. Each check is specific and provides clear error messages.

  - title: "Git Operations Library and Approach"
    chosen: "subprocess.run() with check=True for all git operations (add, commit, push)"
    rejected:
      - "GitPython library — External dependency violates NFR-1 requirement for standard library only."
      - "git shell commands with os.system() — No return code checking, poor error handling."
      - "Manual git parsing/implementation — Unnecessary complexity. subprocess is built for this use case."
    rationale: >
      subprocess.run() is the standard library tool for shell command execution. Using check=True
      automatically raises CalledProcessError on non-zero exit, ensuring clear error handling.
      This avoids the external dependency of GitPython (violates NFR-1). Pattern established
      in features #174-188 and across the codebase.

  - title: "Commit Message Format"
    chosen: "Conventional commit format: \"feat(189): create markdown file test-joedur.md with prose content\""
    rejected:
      - "Simple message like \"Create test-joedur.md\" — Lacks structure and context for tooling."
      - "Long detailed message — Unnecessary verbosity. Conventional format with brief subject is sufficient."
    rationale: >
      Specification requirement FR-10 explicitly requires conventional commit format.
      This provides consistency with 100+ existing commits in the repository and enables
      automated tooling for changelog, versioning, and release automation. Pattern matches
      all prior implementations in features #174-188.

  - title: "Git Push Target and Configuration"
    chosen: "git push -u origin HEAD (push current branch to remote with upstream tracking)"
    rejected:
      - "Commit locally only without push — Spec requirement FR-11 explicitly requires push to remote."
      - "git push origin explicit-branch-name — Less flexible when branch name may vary by environment."
    rationale: >
      Specification requirement FR-11 explicitly requires pushing to remote. Using \"origin HEAD\"
      is flexible and works with any branch name. The -u flag sets upstream tracking, making
      future pulls/pushes on this branch simpler. Established pattern in all prior implementations.

  - title: "Prose Content Generation Strategy"
    chosen: "Hardcoded meaningful prose in module-level constants (not generated or random)"
    rejected:
      - "Generated/lorem ipsum content — Risk of grammatically invalid sentences. Specification FR-4 requires \"substantive text,\" not placeholder."
      - "Random content generation — Same risk. Difficult to validate grammar and quality programmatically."
    rationale: >
      Hardcoded prose ensures FR-4 requirement is met: grammatically valid and substantive content
      about a meaningful topic. By writing prose as a string constant, we can review it once and
      ensure quality. Pattern matches all prior implementations which carefully crafted prose about
      meaningful topics.

  - title: "Error Handling and Reporting"
    chosen: "Try/except with specific exception types (ValueError for validation, OSError for I/O, CalledProcessError for git); print clear messages to stderr; exit(1) on failure"
    rejected:
      - "Silent failures — Errors with no output make debugging impossible."
      - "Generic Exception catch-all only — Loses specific context about failure type."
    rationale: >
      Specific exception handling matches the pattern in features #174-176. ValueError for
      validation failures tells user what is wrong with file content. OSError for file I/O
      tells user about permissions or disk issues. CalledProcessError for git operations tells
      user git command failed. All errors print to stderr (per Unix convention) with descriptive
      message. Exit code 1 signals failure to shell/CI/CD.

  - title: "File Size Validation Bounds"
    chosen: "400-600 bytes (strict bounds per spec, consistent with 100+ existing test files)"
    rejected:
      - "300-800 bytes (wider range) — Specification explicitly requires 400-600. Stricter bounds ensure consistency with established test-*.md files."
      - "No size validation — Violates specification success criteria."
    rationale: >
      Specification explicitly requires file size 400-600 bytes (success criteria #9, NFR-3).
      Actual test files confirm this: test-0tyide.md (454 bytes), test-2cw6g8.md (401 bytes).
      H1 heading + 2-3 sentences naturally fits this range.

