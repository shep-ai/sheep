content: |
  ## Problem Statement

  Create a single markdown file named test-b35cf7.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (131) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation. Key directories:

  - **Root directory**: Contains 100+ test markdown files (test-*.md) created by preceding features (features 125+)
  - **specs/**: Contains feature specifications, each in numbered subdirectories (e.g., specs/131-markdown-sample-file/)
  - **src/sheep/**: Core platform code with agents, flows, tools, and configuration
  - **tests/**: Test suite for the platform
  - **pyproject.toml**: Python project metadata and dependencies

  The repository demonstrates a pattern-based approach where simple, repetitive tasks (like file creation) are used to test and validate the platform's automation capabilities.

  ### Architecture Patterns

  1. **Feature-driven Development**: Each feature has a spec directory containing feature.yaml, plan.yaml, spec.yaml, research.yaml, and tasks.yaml
  2. **Git Workflow Integration**: All features follow a standard git workflow (create branch → make changes → commit → push)
  3. **Test-driven Automation**: The 100+ test files in the root serve as validation artifacts for the platform
  4. **Modular Agentic System**: Sheep uses CrewAI with specialized agents for research, implementation, and review

  ### Relevant Technologies

  - **Python**: Core implementation language; used for file I/O and git operations
  - **Git**: Version control; all features follow conventional commit format (feat(N): ...)
  - **Markdown**: File format for content (valid markdown syntax with H1 heading and prose)
  - **CrewAI**: Agentic framework used by Sheep platform

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-b35cf7.md) will be created in the repository root, following the pattern of 100+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | Code implementation flow | Low | The existing Sheep workflow requires no modifications; it already handles arbitrary file creation tasks |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform:

  1. **File Creation** - Python's built-in pathlib and file I/O (standard library)
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git tools from Sheep infrastructure
  4. **Content Generation** - Can use simple prose generation (similar to existing test-*.md files in the repository)

  The feature follows an established pattern used in features 125-130, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 6+ times in preceding features (125-130)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing Sheep infrastructure (file I/O, git tools, workflow) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Identical scope to feature 130 (test-laceiq.md), which was also sized as S
