content: |
  ## Architecture Overview

  Feature 131 is a straightforward file creation task that follows the established pattern from features 125-130. The implementation requires no architectural changes to the Sheep platform and operates entirely within the feature development workflow:

  1. **File Creation**: Use Python pathlib.Path.write_text() with explicit UTF-8 encoding to create test-b35cf7.md in the repository root
  2. **Content Structure**: H1 markdown heading (~30 bytes) + blank line + 2-3 sentences of prose (~150 bytes each) = ~400-600 bytes total
  3. **Validation**: In-script validation before commit checks encoding (no BOM), line endings (LF only), file size (350-650 bytes), and structure (H1 present, 2-3 sentences)
  4. **Git Workflow**: Standard three-step workflow (git add, git commit --no-verify, git push) via subprocess.run()

  This feature is orthogonal to the main Sheep codebase and requires no integration with /src/sheep/. The repository root already contains 100+ similar test-*.md files created by features 125-130, establishing the pattern this feature follows exactly.

  ## Key Design Decisions

  ### Decision 1: File Creation Method
  **Chosen:** Python pathlib.Path.write_text() with explicit UTF-8 encoding
  - **Why:** Modern standard Python approach, already specified in feature technologies, used consistently in features 125-130
  - **Alternatives Rejected:** Direct bash echo (less portable, harder to control encoding), os.write() (requires manual handle management), open() context manager (more verbose)
  - **Impact:** Zero external dependencies, clean readable code, automatic file closing

  ### Decision 2: Prose Content Strategy
  **Chosen:** Hardcoded, topic-specific prose (H1 heading + 2-3 sentences)
  - **Why:** Spec allows "about anything", any coherent topic is valid; hardcoding is simple, deterministic, requires no dependencies
  - **Alternatives Rejected:** Template-based generation (unnecessary complexity), AI-generated content (latency, non-determinism), Lorem ipsum (unprofessional, inconsistent with existing 100+ test files)
  - **Impact:** Simple implementation, matches established pattern exactly

  ### Decision 3: Line Ending Management
  **Chosen:** Python text mode write_text() producing Unix LF line endings
  - **Why:** Feature runs on Linux; Python text mode naturally produces LF endings, required by success criteria
  - **Alternatives Rejected:** Platform defaults (would produce CRLF on Windows), post-creation conversion (two-pass inefficiency)
  - **Impact:** Single clean write operation, guaranteed correct line endings

  ### Decision 4: Git Workflow Implementation
  **Chosen:** Direct subprocess.run() calls for git add, commit (--no-verify), and push
  - **Why:** Standard library, safe argument handling, matches established pattern (features 125-130), no external dependencies
  - **Alternatives Rejected:** GitPython (external dependency), shell string execution (injection risk)
  - **Impact:** Simple, reliable, exactly mirrors reference implementations

  ### Decision 5: Validation Strategy
  **Chosen:** In-script validation of encoding, line endings, file size, structure before commit
  - **Why:** Ensures all success criteria met before pushing, provides immediate feedback on failures, matches reference pattern (125-130)
  - **Alternatives Rejected:** No validation (risky), external validation script (separation of concerns), test suite validation (over-engineering)
  - **Impact:** Prevents invalid commits, immediate error detection

  ### Decision 6: Encoding Specification
  **Chosen:** UTF-8 without byte-order mark (BOM)
  - **Why:** Required by spec (FR-5), standard for markdown files, required by CommonMark specification
  - **Alternatives Rejected:** UTF-16 (incompatible), ASCII-only (limiting), UTF-8 with BOM (violates spec)
  - **Impact:** Full compliance with spec and standards

  ## Implementation Strategy

  ### Phase 1: File Creation & Validation
  This phase creates the markdown file with hardcoded prose content and validates it meets all structural and encoding requirements before any git operations.

  **Sequence:**
  1. Define prose content: H1 heading about any topic + 2-3 sentences (~400-600 bytes)
  2. Create file using pathlib.Path.write_text(content, encoding='utf-8')
  3. Validate file encoding (no BOM) using bytes inspection
  4. Validate line endings (LF only, no CRLF) using bytes inspection
  5. Validate file size (350-650 bytes, approximately) via file stats
  6. Validate structure (H1 heading present, 2-3 sentences) via regex/string inspection

  **Why This Order:** Validation catches encoding/format errors before any git operations, preventing invalid commits. File structure validation ensures prose meets FR-2 and FR-3 requirements.

  ### Phase 2: Git Integration & Push
  Once file is validated, stage it, commit with conventional message, and push to remote.

  **Sequence:**
  1. Stage file with `git add test-b35cf7.md`
  2. Verify staging succeeded (check git status or rely on subprocess exit code)
  3. Commit with message `feat(131): Create markdown file test-b35cf7.md` using --no-verify to skip hooks
  4. Push to remote with `git push -u origin HEAD`
  5. Verify push succeeded (subprocess exit code)

  **Why This Order:** Staging must precede commit. Commit must precede push. --no-verify skips pre-commit hooks as required. Push confirms work is available on remote.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding incorrect (BOM, CRLF) | Breaks success criteria FR-4, FR-5 | Validate encoding before commit; explicit UTF-8 without BOM in write_text() call |
  | Prose content invalid (wrong sentence count, no H1) | Violates FR-2, FR-3 | Hardcode prose; validate structure before commit; regex/string inspection verifies H1 and sentence count |
  | File size out of range (too small, too large) | Breaks intended structure | Hardcode prose targeting 400-600 bytes naturally; validate size before commit |
  | Git push fails (network, permissions) | Feature incomplete, success criteria FR-7 not met | Fail-fast on subprocess errors; raise exception if push fails; let caller investigate |
  | Git configuration missing (user.name, user.email) | Commit will fail | Assume git is already configured (not feature responsibility); documented as prerequisite |
  | File already exists at test-b35cf7.md | Overwrite existing file | Check if file exists; raise error before overwriting; prevent silent data loss |
  | Invalid markdown syntax in prose | Violates spec requirement (valid markdown) | Prose is hardcoded, grammatically correct sentences; inherently valid markdown if H1 and structure are correct |
