content: |
  ## Summary

  Feature 131 is implemented in 6 sequential tasks across 2 phases:

  **Phase 1 — File Creation & Validation (Tasks 1-3):** Create a markdown file with H1 heading and 2-3 sentences of hardcoded prose content, then validate encoding (UTF-8, no BOM, LF-only line endings) and structure (file size 350-650 bytes, H1 heading present, 2-3 sentences).

  **Phase 2 — Git Integration (Tasks 4-6):** Stage the validated file with git add, create a conventional commit with message "feat(131): Create markdown file test-b35cf7.md" using --no-verify, and push to the remote feature branch.

  All tasks are sequential (each depends on the previous) because validation must complete before committing, and staging must precede commit, which must precede push. Each task includes TDD cycles: write tests that fail (RED), implement minimal code to pass (GREEN), then refactor and clean up (REFACTOR).

  Total estimated effort: 1.5 hours (20+20+25+15+15+15 minutes)

  ## Task Breakdown

  ### Phase 1: File Creation & Validation

  **Task 1 — Create markdown file** (20 min): Write prose content with H1 heading and 2-3 sentences using pathlib.Path.write_text(). Prose content is hardcoded; any coherent topic is acceptable per spec.

  **Task 2 — Validate encoding** (20 min): Verify file has UTF-8 encoding without BOM and uses Unix LF line endings only (no CRLF). Extract validation into validate_encoding() function.

  **Task 3 — Validate structure** (25 min): Verify file size (350-650 bytes), H1 heading presence (regex: '^# '), and sentence count (2-3). Extract validation into validate_structure() function using regex.

  ### Phase 2: Git Integration

  **Task 4 — Stage with git** (15 min): Stage file with `git add test-b35cf7.md`. Verify staging succeeded via exit code and git status.

  **Task 5 — Commit** (15 min): Commit staged file with message "feat(131): Create markdown file test-b35cf7.md" using --no-verify flag to skip pre-commit hooks.

  **Task 6 — Push** (15 min): Push commit to remote with `git push -u origin HEAD`. Verify push succeeded and remote is updated.

  All tasks follow TDD: RED (write failing tests), GREEN (minimal implementation), REFACTOR (cleanup and extraction).
