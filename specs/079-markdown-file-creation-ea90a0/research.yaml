  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-17
  - **Status:** Complete — all technical decisions documented, no open questions

  ## Technology Decisions

  ### 1. File I/O Library: pathlib.Path

  **Chosen:** `pathlib.Path` from Python standard library

  **Rejected:**
  - `os` module (open, write) — Lower-level API, less readable, requires more manual encoding/line-ending handling. pathlib is the modern Python standard.
  - Third-party file libraries (e.g., `nio`, `upath`) — Introduces external dependencies, violates NFR-9. Spec explicitly requires pathlib (NFR-5).

  **Rationale:**
  The spec explicitly mandates Python `pathlib.Path` for file I/O operations (NFR-5). pathlib provides:
  - Cross-platform path handling (abstract away OS differences)
  - Clean, readable API with `.write_text()` method
  - Automatic UTF-8 encoding on POSIX systems (no BOM by default)
  - Part of Python standard library since 3.4 (no dependencies, NFR-9)

  All 65+ precedent test files were created using pathlib. This is the established pattern in the codebase.

  **Implementation:**
  ```python
  from pathlib import Path
  Path("test-v7xasn.md").write_text("# Title\n\nProse content.")
  ```

  ### 2. Text Encoding: UTF-8 without BOM

  **Chosen:** UTF-8 without BOM (Python pathlib default on POSIX)

  **Rejected:**
  - UTF-8 with BOM (`utf-8-sig`) — Spec explicitly forbids BOM (NFR-1). BOM adds unnecessary bytes (0xEF 0xBB 0xBF) and is discouraged for UTF-8 in modern web/Unix contexts.
  - ASCII encoding — Too restrictive, does not support accented characters or non-Latin scripts. UTF-8 is the modern standard.

  **Rationale:**
  Spec requires UTF-8 without BOM (NFR-1). Python's `pathlib.Path.write_text()` defaults to UTF-8 on POSIX systems and does not include BOM. This is the natural, zero-configuration choice:
  - No explicit encoding parameter needed
  - Matches all 65+ precedent files (all UTF-8, no BOM)
  - Aligns with Unix conventions and web standards
  - Supports any character set without restriction

  **Implementation:** pathlib handles automatically; no explicit encoding parameter required.

  ### 3. Line Endings: Unix LF (\n)

  **Chosen:** Unix LF line endings (\n) — platform default on Linux/POSIX

  **Rejected:**
  - CRLF (Windows, `\r\n`) — Spec explicitly requires LF (NFR-2). CRLF is Windows convention; target platform is Linux.
  - `newline=''` parameter — Unnecessary; platform is POSIX where LF is standard.

  **Rationale:**
  Spec requires Unix LF line endings (NFR-2). The execution environment is Linux/POSIX, where:
  - Python naturally uses `\n` (LF) as the line separator
  - `pathlib.Path.write_text()` uses the system default line ending
  - No explicit `newline` parameter is needed (defaults to `None`, which uses platform default)

  All 65+ precedent files use LF. This is the established Unix convention and the spec requirement.

  **Implementation:** Write content with `\n` separators; pathlib handles platform-appropriate line ending.

  ### 4. Git Integration: subprocess.run()

  **Chosen:** `subprocess.run()` for git CLI commands

  **Rejected:**
  - `GitPython` library (or `PyGit2`) — External dependency, violates NFR-9. Adds unnecessary abstraction for simple operations.
  - `os.system()` or `shell=True` — Security risk (command injection). Less structured error handling. Less explicit.

  **Rationale:**
  Spec forbids new external dependencies (NFR-9). Python's `subprocess` module (standard library) provides:
  - Structured execution of external commands without shell interpretation (security)
  - Proper error handling via return codes and exceptions
  - Clean separation between command, arguments, and stdout/stderr
  - Sufficient for simple git operations (add, commit, push)

  All 65+ precedent implementations use git CLI via subprocess. This is the established pattern.

  **Implementation:**
  ```python
  import subprocess
  subprocess.run(["git", "add", "test-v7xasn.md"], check=True)
  subprocess.run(["git", "commit", "-m", "feat(079): ..."], check=True)
  subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  ### 5. Markdown Content Structure

  **Chosen:** H1 heading + blank line + 2-3 prose sentences (established pattern)

  **Rejected:**
  - Title-only content — Spec explicitly requires 2-3 sentences (FR-4). No meaningful content.
  - Multiple headings (H1/H2/H3 hierarchy) — Unnecessary complexity. Spec requires single H1 (FR-3).

  **Rationale:**
  Spec defines required structure:
  - FR-3: One H1 heading (`# Title`) on the first line
  - FR-4: Exactly 2-3 sentences of prose following a blank line
  - This structure is validated by file size guideline 300-600 bytes (NFR-3)

  All 65+ precedent files follow this exact pattern. Examples:
  - `test-6tawx3.md`: `# The Joy of Reading` + blank line + 3 sentences
  - `test-3nslmx.md`: `# The Joy of Discovery` + blank line + 3 sentences

  **Implementation:**
  ```
  # Heading Title

  Sentence one. Sentence two. Sentence three.
  ```

  ### 6. Prose Content Topic Selection

  **Chosen:** Implementer flexible choice — any topic permitted

  **Rejected:**
  - Fixed/predetermined topic — User query explicitly states "about anything" (NFR-8). Limits flexibility.
  - Random topic generation — Unnecessary complexity. Implementer choice is simpler and cleaner.

  **Rationale:**
  - User query: "create... with 2-3 sentences about **anything**" (explicitly permissive)
  - Spec NFR-8: "Prose topic may be any topic chosen by the implementer"
  - Topic choice has **zero impact** on functional requirements (success criteria are structural, not content-based)
  - All 65+ precedent files use different topics (reading, discovery, creativity, technology, etc.)
  - This flexibility reduces decision friction during implementation

  **Implication:** Topic validation is out of scope. Any grammatically correct prose satisfies FR-5.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | `pathlib` (stdlib) | File I/O, path operations | **Use** | Required by spec (NFR-5). Standard library. No alternatives. |
  | `subprocess` (stdlib) | Execute git commands | **Use** | Standard library. Only option without introducing external dependencies (NFR-9). |
  | `GitPython` | Simplified git operations | **Reject** | External dependency. Violates NFR-9 (no new dependencies). Unnecessary for simple operations. |
  | `os.system()` | Execute shell commands | **Reject** | Security risk (command injection). Less structured. subprocess is superior. |
  | `Markdown` or `mistune` | Markdown validation | **Reject** | Spec requires valid CommonMark, but validation is implicit in manual content creation. No automated validation needed. |
  | `chardet` | Encoding detection | **Reject** | Unnecessary. Spec mandates UTF-8 (NFR-1). No multi-encoding support needed. |

  ## Security Considerations

  **1. File Creation Security**
  - **Risk:** Creating a file in repository root could overwrite existing files
  - **Mitigation:** Filename `test-v7xasn.md` is unique (per feature branch pattern). Risk is minimal if filename is exact.
  - **Status:** Low risk — filename collision unlikely with established naming pattern

  **2. Git Command Injection**
  - **Risk:** Using `shell=True` or `os.system()` with user input could allow command injection
  - **Mitigation:** Using `subprocess.run()` with list arguments (not shell=True) prevents shell interpretation. Commit message is fixed (not user-supplied dynamically).
  - **Status:** Safe — subprocess without shell=True is secure

  **3. File Content Security**
  - **Risk:** Markdown content could contain malicious content (though unlikely for prose)
  - **Mitigation:** Content is simple prose sentences. No code execution, no template injection possible.
  - **Status:** Not applicable — content is static text

  **4. UTF-8 Encoding Safety**
  - **Risk:** UTF-8 without BOM could be misinterpreted by legacy systems
  - **Mitigation:** This is the spec requirement (NFR-1). No alternative. All modern systems support UTF-8.
  - **Status:** Per spec — not a concern

  ## Performance Considerations

  **1. File I/O Performance**
  - Single file write operation: negligible performance impact (~1ms for 300-600 byte file)
  - pathlib.write_text() is optimized for small files
  - **Status:** No optimization needed — operation is minimal

  **2. Git Operations Performance**
  - Three subprocess calls: `git add`, `git commit`, `git push`
  - Each operation is I/O-bound; minimal CPU usage
  - Push may be slow on slow networks; unavoidable
  - **Status:** No optimization applicable — simple sequential operations

  **3. Memory Usage**
  - Content is small (~300-600 bytes); negligible memory footprint
  - No large data structures required
  - **Status:** Negligible

  **4. Disk Space**
  - Single file: ~300-600 bytes (plus git object storage, negligible in context of 65+ existing files)
  - **Status:** Not a concern

