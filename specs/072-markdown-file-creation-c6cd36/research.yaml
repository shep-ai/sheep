# Structured technology decisions
decisions:
  - title: 'File I/O Implementation Approach'
    chosen: 'Python pathlib.Path.write_text() with explicit UTF-8 encoding'
    rejected:
      - 'Built-in open() function — more verbose, requires manual encoding specification and close handling'
      - 'External file libraries (e.g., pathspec) — adds unnecessary dependencies when pathlib is standard'
      - 'Subprocess-based file creation (e.g., echo to file) — less precise, harder to control encoding/line endings'
    rationale: >
      pathlib.Path.write_text() is the modern Python standard (3.4+) for simple file operations.
      It provides explicit control over encoding (UTF-8 without BOM), automatic resource management
      (no manual close needed), and is already the established pattern in this codebase (confirmed via
      create_markdown.py). Works consistently across Windows/Unix platforms with automatic line-ending
      handling via encoding parameter. Requires zero external dependencies (standard library only).

  - title: 'Content Format and Generation'
    chosen: 'Hardcoded meaningful prose: H1 heading + blank line + 2-3 sentences'
    rejected:
      - 'Programmatically generated content using templates — adds complexity, may produce poor quality text'
      - 'Variable topics with user input — spec explicitly states "about anything", but meaning "implementer chooses", not runtime input'
      - 'Random or Lorem ipsum text — fails requirement that prose must be "readable and grammatically correct"'
    rationale: >
      Requirement FR-5 mandates prose be "readable and grammatically correct". Hardcoded meaningful
      content ensures quality compliance. Spec explicitly permits flexible topic selection ("about anything")
      by the implementer, so hardcoding prose once per implementation is appropriate. Precedent files
      (test-esahpp.md, test-uiq4ld.md) all use hardcoded, meaningful prose. This approach is simple,
      reliable, and matches established pattern across 65+ test files.

  - title: 'Git Workflow Implementation'
    chosen: 'Use subprocess to invoke git CLI: git add, git commit --no-verify, git push'
    rejected:
      - 'GitPython library — introduces external dependency; subprocess approach is already standard in codebase'
      - 'Direct bash/shell scripting — less portable, harder to debug, less control over error handling'
      - 'Web API calls to git service — assumes specific git hosting; local git CLI is more portable'
    rationale: >
      Git CLI via subprocess is the established pattern in create_markdown.py and provides transparency
      (can see exact git commands being executed). GitPython would add a dependency when subprocess is
      sufficient. Using --no-verify skips pre-commit hooks (already validated file before this step).
      Subprocess provides proper error handling via check=True. Pattern proven across multiple prior
      features (064-071) without issues.

  - title: 'File Encoding: UTF-8 without BOM'
    chosen: 'Explicit UTF-8 encoding via pathlib.write_text(encoding="utf-8") + validation'
    rejected:
      - 'Relying solely on .gitattributes or .editorconfig — configuration files may be missing or misconfigured'
      - 'UTF-8 with BOM — violates spec requirement NFR-1; also breaks many markdown parsers'
      - 'Platform default encoding — non-portable, may cause issues on Windows (defaults to cp1252)'
    rationale: >
      UTF-8 without BOM is markdown standard and explicitly required by spec (NFR-1). Python pathlib
      write_text() defaults to platform encoding if not specified, so explicit encoding="utf-8" parameter
      is required for consistency. Validation step (reading binary content and checking for BOM) ensures
      compliance. This is the explicit approach used in create_markdown.py validation.

  - title: 'Line Ending Handling: Unix LF vs CRLF'
    chosen: 'Use pathlib.write_text() which normalizes to LF on all platforms + explicit validation'
    rejected:
      - 'Relying solely on .gitattributes or git config — configuration may be missing or inconsistent'
      - 'Manual line-ending conversion using .replace() — error-prone, duplicates pathlib functionality'
      - 'Platform-specific handling with conditional logic — adds unnecessary complexity'
    rationale: >
      pathlib.write_text() with UTF-8 encoding on Python 3 defaults to LF line endings on all platforms
      (Unix, Windows, macOS). Spec requires LF (NFR-2). Validation step in create_markdown.py explicitly
      checks that binary content does not contain b'\r\n' (CRLF), ensuring compliance. This approach is
      platform-independent and follows the established pattern.

  - title: 'File Size Validation Criteria'
    chosen: 'Validate file size in range 350-650 bytes (typical range from 65+ precedent files)'
    rejected:
      - 'No size validation — could silently produce files that are too large or too small'
      - 'Strict size limit (e.g., exactly 500 bytes) — unnecessarily rigid, allows natural variation in prose'
      - 'Different range based on word count — harder to verify, less stable than byte count'
    rationale: >
      Spec guideline NFR-3 suggests 400-600 bytes typical. Analysis of 65+ precedent files confirms this
      range. Validation range of 350-650 (slightly wider) provides tolerance for prose variation while
      catching obvious errors (e.g., missing content, duplicate file bodies). Using byte count is stable
      and unambiguous across platforms.

