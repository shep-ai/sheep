content: |
  ## Architecture Overview

  Feature 272 implementation is minimal and relies entirely on existing infrastructure
  in the Sheep codebase:

  **Utility Module Pattern (content_generators.py)**
  The `content_generators.py` module provides an end-to-end pipeline with proven functions:
  - `generate_markdown_content()` — Calls Claude API via CrewAI to generate unique prose
  - `write_markdown_file()` — Uses pathlib to write file with UTF-8 encoding
  - `validate_markdown_file()` — Strictly validates format (encoding, line endings, structure)
  - `commit_markdown_file()` — Uses GitCommitTool to stage and commit
  - `push_markdown_file()` — Uses GitPushTool to push with upstream tracking
  - `create_markdown_file()` — Orchestrates the entire pipeline

  This pattern has been proven across 270+ identical implementations with 100% success rate.
  No custom code is needed — the implementation is pure orchestration of these functions.

  **Integration with CrewAI & Anthropic**
  Content generation uses `sheep.config.llm.get_reasoning_llm()` which provides a
  CrewAI-managed LLM instance. CrewAI handles provider selection (Anthropic Claude is
  the primary provider per specification). The LLM is asked to generate a markdown file
  with an H1 heading and 2-3 sentences of prose.

  **Git Operations via GitPython**
  Git integration uses abstractions from `src/sheep/tools/git_tools.py`:
  - GitCommitTool handles staging and committing with conventional message format
  - GitPushTool handles pushing to the remote with upstream branch tracking
  - Both tools provide error handling and structured logging

  **Validation Framework**
  Strict validation is enforced at multiple points:
  - LLM response validation during generation (`_validate_markdown_content()`)
  - File format validation before commit (`validate_markdown_file()`)
  - Checks include: UTF-8 without BOM, Unix LF line endings, H1 heading presence,
    exactly 2-3 sentences, and trailing newline character

  **Observability via structlog**
  All operations emit structured logs via `sheep.observability.logging.get_logger()`.
  This enables debugging, performance tracking, and integration with Langfuse observability.

  ## Key Design Decisions

  ### 1. Content Generation: LLM-Based via Claude API

  **Decision:** Use Anthropic Claude API for unique, natural-sounding prose generation.

  **Alternatives Considered:**
  - Templated content with variable substitution — Would result in repetitive output
    across 270+ test files; fails to demonstrate content generation capability
  - Hardcoded static prose — Creates identical content across all files; no generation
    capability demonstrated; reduces test value

  **Rationale:**
  LLM-generated content is the established approach across all 270 prior features.
  It ensures variety, validates the full content generation pipeline, and demonstrates
  CrewAI + Anthropic integration working end-to-end. The `MARKDOWN_GENERATION_PROMPT`
  in `content_generators.py` provides a stable, tested prompt that consistently produces
  well-formatted output (H1 heading + blank line + 2-3 sentences).

  ### 2. Validation: Strict Enforcement of Format Requirements

  **Decision:** Fail immediately on any format deviation.

  **Alternatives Considered:**
  - Lenient validation with warnings — Allows partial success; risks inconsistent output
    quality across 270+ test files
  - No validation — Eliminates quality assurance; allows malformed files; breaks
    downstream processing

  **Rationale:**
  Strict validation maintains consistency across 270+ test files and enables early error
  detection. The `validate_markdown_file()` function checks: UTF-8 encoding without BOM,
  Unix LF line endings only, H1 heading at start of file, blank line after heading,
  exactly 2-3 sentences in prose content, and trailing newline character. This matches
  the established pattern across all 270 prior features.

  ### 3. Commit Strategy: Single Atomic Commit

  **Decision:** All operations result in one conventional commit per file.

  **Alternatives Considered:**
  - Multiple commits per pipeline stage — Would create 5+ commits per feature,
    cluttering git history without adding value
  - Implicit automation commits — Less control, harder to track

  **Rationale:**
  Single atomic commits create clean, trackable git history. The conventional commit
  format `feat(272): create markdown file test-4mg4tn.md with prose content` clearly
  documents what was done. This matches the pattern across 270+ prior features and
  makes git history easy to understand and bisect.

  ### 4. File I/O: pathlib (Standard Library)

  **Decision:** Use Python pathlib for cross-platform file operations.

  **Alternatives Considered:**
  - os.path module — Lower-level API, less cross-platform abstraction
  - Raw file operations — More error-prone, less Pythonic

  **Rationale:**
  pathlib is the modern Python standard (built-in, available in Python 3.11+),
  provides clear OOP API, and enables safe path manipulation. Uses `Path.cwd() / filename`
  for repository root relative paths with UTF-8 encoding specified explicitly.

  ### 5. Git Integration: GitPython via Tool Abstractions

  **Decision:** Use GitPython 3.1.0+ via GitCommitTool and GitPushTool abstractions.

  **Alternatives Considered:**
  - subprocess.run() with git commands — Requires shell parsing, more error-prone
  - PyGit2 — Overkill for simple operations, lower-level API

  **Rationale:**
  GitPython provides safe, high-level Python bindings for git. The tool abstractions
  in `src/sheep/tools/git_tools.py` handle error checking, upstream tracking
  (set_upstream=True), and conventional commit message formatting. Proven across
  270+ prior features.

  ### 6. Encoding & Line Endings: UTF-8 LF

  **Decision:** UTF-8 encoding without BOM, Unix LF (\\n) line endings.

  **Alternatives Considered:**
  - UTF-16 or other encodings — Unnecessarily complex, non-standard for markdown
  - CRLF line endings — Windows-style, creates cross-platform inconsistencies

  **Rationale:**
  UTF-8 without BOM is the universal markdown standard. Unix LF ensures consistency
  in git repositories across platforms. `validate_markdown_file()` enforces both
  requirements via binary file inspection.

  ## Implementation Strategy

  ### Phase 1: Content Generation & File Creation

  1. Call `generate_markdown_content()` from content_generators module
     - Uses Claude API via CrewAI to create unique prose
     - Returns dict with 'title' and 'content' keys
     - Includes response validation

  2. Call `write_markdown_file()` to create test-4mg4tn.md
     - Writes file to repository root (Path.cwd() / filename)
     - Uses UTF-8 encoding
     - Formats as: H1 heading + blank line + prose content + trailing newline

  3. Call `validate_markdown_file()` to verify format
     - Checks UTF-8 without BOM, Unix LF line endings, H1 heading, 2-3 sentences, trailing newline
     - Fails fast with descriptive error on any deviation

  ### Phase 2: Git Integration & Verification

  1. Call `commit_markdown_file()` via GitCommitTool
     - Stages file in git index
     - Creates conventional commit with feature number and filename
     - Uses pre-configured git author identity

  2. Call `push_markdown_file()` via GitPushTool
     - Pushes to remote origin on feature branch
     - Enables upstream tracking
     - Verifies successful push

  3. Verify completion
     - Confirm file exists at repository root
     - Confirm commit is present on feature branch
     - Confirm commit is pushed to remote

  ### Why This Order?

  Content generation and file creation come first because validation must occur before
  git operations. File must be validated and correct before committing. Git integration
  comes second because commit and push are final, atomic operations that should not occur
  if file validation fails.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM API failure | Anthropic API already configured and tested across 270 prior features; CrewAI handles timeouts and retries |
  | File encoding issues | Binary file inspection checks for BOM and CRLF; strict validation prevents malformed files from being committed |
  | Git operation failure | GitPython error handling is comprehensive; conventional commit format is validated; upstream tracking prevents branch divergence |
  | Content validation failure | Multiple validation points prevent bad data in repository |
  | Path traversal security | Filename validation rejects filenames with "/" "\\" prefixes or starting with "." |
