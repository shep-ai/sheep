decisions:
  - title: "Content Generation Approach"
    chosen: "LLM-based content generation via Anthropic Claude API"
    rejected:
      - "Templated content with variable substitution — Results in repetitive output across 270+ test files; does not demonstrate content generation capability; lacks variety"
      - "Hardcoded prose — Creates static, unmaintainable output; reduces test value; does not validate LLM integration"
    rationale: >
      LLM-based generation via Claude API is the proven approach across all 270 prior
      implementations. Provides unique, natural-sounding content for each file; demonstrates
      content generation capability; validates CrewAI and Anthropic integration; ensures
      variety across test suite. API credentials are already configured in the environment.
      The MARKDOWN_GENERATION_PROMPT in content_generators.py provides a stable, tested
      prompt template that consistently produces well-formatted H1 heading + 2-3 sentences.

  - title: "File Validation Strategy"
    chosen: "Strict validation — fail on any format deviation"
    rejected:
      - "Lenient validation with warnings — Allows partial success and format inconsistencies; risks data quality issues; contradicts established pattern across 270 prior features"
      - "No validation — Eliminates quality assurance; allows malformed files; breaks downstream processing"
    rationale: >
      Strict validation maintains consistency across 270+ test files and catches format
      errors immediately. The validate_markdown_file() function in content_generators.py
      performs comprehensive checks: UTF-8 without BOM, Unix LF line endings, H1 heading
      format, 2-3 sentence count, and trailing newline. Fails fast on any violation,
      enabling quick error resolution. Matches established pattern across all prior
      implementations.

  - title: "Commit Strategy"
    chosen: "Single atomic commit per file"
    rejected:
      - "Multiple commits per pipeline stage — Splits generation, write, validate, and commit into separate commits; creates cluttered git history; unnecessary complexity; violates 270+ feature precedent"
      - "Squash commits — Adds complexity for no benefit; excessive for single-file operations"
    rationale: >
      Single atomic commit creates clean, trackable git history. The conventional commit
      format `feat(272): create markdown file test-4mg4tn.md with prose content` clearly
      documents what was done. Matches established pattern across all 270 prior features.
      One commit per file makes history easy to understand and is consistent with how
      Sheep automation works.

  - title: "File I/O Library"
    chosen: "Python pathlib (standard library)"
    rejected:
      - "os.path module — Lower-level API; less Pythonic; less cross-platform abstraction"
      - "Direct file operations without abstraction — Error-prone; no path normalization"
    rationale: >
      pathlib is the modern Python standard for file operations. Provides cross-platform
      compatibility (Linux, macOS, Windows); clear, object-oriented API; built-in Path
      manipulation; available in Python 3.11+ (project requirement). Used consistently
      throughout content_generators.py (write_markdown_file, validate_markdown_file
      functions).

  - title: "Git Integration Library"
    chosen: "GitPython 3.1.0+ with tool abstractions"
    rejected:
      - "subprocess.run() with git commands — Requires shell command parsing; more error-prone; less maintainable; higher security risk"
      - "PyGit2 — Lower-level API; overkill for simple commit and push operations"
    rationale: >
      GitPython provides high-level Python bindings for git operations. Used via
      GitCommitTool and GitPushTool abstractions in src/sheep/tools/git_tools.py. Provides
      error handling, upstream tracking, and conventional commit message support. Proven
      across 270+ prior features. Safer than subprocess; more maintainable than low-level
      alternatives.

  - title: "LLM Orchestration Framework"
    chosen: "CrewAI with Anthropic Claude provider"
    rejected:
      - "Direct Anthropic SDK calls — Loses LLM orchestration benefits; no multi-agent support; less flexible provider switching"
      - "LangChain — Overkill for simple content generation; excessive dependency; slower iteration"
    rationale: >
      CrewAI is the project's chosen orchestration framework (specified in pyproject.toml
      and existing architecture). Provides multi-LLM support, provider auto-selection via
      environment variables, and clean integration with sheep.config.llm.get_reasoning_llm().
      Anthropic Claude is the primary provider (specified in feature requirements and
      proven across 270 prior features). Using the framework directly maintains architectural
      consistency and simplifies provider switching.

  - title: "Encoding and Line Ending Standards"
    chosen: "UTF-8 without BOM, Unix LF line endings"
    rejected:
      - "UTF-16 or other encodings — Unnecessarily complex; not standard for markdown; adds maintenance burden"
      - "CRLF line endings — Windows-style; creates cross-platform inconsistencies; invalidates validation checks"
    rationale: >
      UTF-8 without BOM is the universal markdown standard. Unix LF line endings ensure
      cross-platform consistency in git repositories. validate_markdown_file() in
      content_generators.py enforces both requirements via binary file checking. Matches
      established pattern across 270+ test files. File writing uses `open(file_path, 'w',
      encoding='utf-8')` which naturally produces LF on Unix systems.

  - title: "Logging and Observability"
    chosen: "structlog with sheep.observability.logging.get_logger()"
    rejected:
      - "Python's built-in logging module — Less structured; harder to parse in logs; inconsistent with project standards"
      - "No logging — Eliminates observability; makes debugging difficult; violates project NFR-5"
    rationale: >
      structlog 24.0.0+ is the project's chosen logging framework (specified in
      pyproject.toml). Provides structured logs compatible with Langfuse observability
      platform. NFR-5 requires structured logging. content_generators.py uses
      sheep.observability.logging.get_logger() consistently for all operations (content
      generation, file I/O, validation, git operations).

