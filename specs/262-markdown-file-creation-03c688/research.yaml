decisions:
  - title: "File I/O approach for markdown file creation"
    chosen: "Python pathlib.Path with write_text() method"
    rejected:
      - "os.path module — older API design, less ergonomic, requires separate open() calls, pathlib is the modern Python standard since 3.4+"
      - "builtin open() function — less abstraction, doesn't handle path normalization, requires context manager; pathlib.write_text() is more concise"
      - "External I/O library (e.g., file manipulation utilities) — unnecessary dependency when pathlib covers all requirements"
    rationale: >
      Python's pathlib module is the modern, recommended approach for file I/O in Python 3.4+. It provides
      cross-platform path handling, readable API, and the write_text() method which handles encoding and
      line endings in a single call. This approach is consistent with Python 3.11+ best practices and is
      already the standard used throughout the project. The Path("test-mylh5m.md").write_text() pattern
      is concise, readable, and requires no external dependencies.

  - title: "Line ending enforcement (UTF-8 encoding and LF/CRLF)"
    chosen: "Pass newline='\\n' and encoding='utf-8' parameters to write_text()"
    rejected:
      - "Rely on platform defaults — platform-specific line endings (CRLF on Windows, LF on Unix) would violate spec requirement for consistent LF line endings across all systems"
      - "Manual line ending conversion after writing — adds unnecessary complexity when pathlib.write_text() handles this natively"
      - "Use encoding='utf-8-sig' for BOM — spec explicitly requires UTF-8 WITHOUT BOM; utf-8-sig adds BOM which violates requirements"
    rationale: >
      The spec explicitly requires UTF-8 encoding without Byte Order Mark and LF (\n) line endings on all
      platforms. Python's write_text(encoding='utf-8', newline='\n') handles both requirements directly,
      ensuring consistency across Windows, macOS, and Linux. The newline='\n' parameter forces universal
      newline mode to use only LF, preventing platform-specific CRLF on Windows. This approach is simple,
      explicit, and prevents encoding/line-ending bugs.

  - title: "Git command execution approach"
    chosen: "Python subprocess module (standard library) with explicit command list"
    rejected:
      - "GitPython library — adds external dependency for simple git operations (add, commit, push); subprocess is already available and used throughout the codebase"
      - "shell=True for git commands — creates shell injection vulnerability (though not a risk here, subprocess without shell=True is safer and more explicit)"
      - "git.Repo API — higher-level abstraction than needed; subprocess provides sufficient control and is consistent with other parts of the codebase"
    rationale: >
      The subprocess module is part of Python's standard library and is the appropriate tool for executing
      git commands. This approach avoids adding external dependencies (GitPython) for straightforward
      operations like git add, git commit, and git push. Using subprocess.run() with a list of arguments
      (not shell=True) is the safest approach. This is consistent with established patterns in the codebase
      for git automation and follows Python best practices.

  - title: "Content generation approach"
    chosen: "Simple string composition with f-string template or string literals"
    rejected:
      - "Template engine (Jinja2, Mako, etc.) — unnecessary complexity for single file with fixed structure; raw string composition is more direct"
      - "Content generator library — over-engineered for 2-3 sentences of prose"
      - "External content API or LLM — would add dependency and complexity; spec permits arbitrary prose selection"
    rationale: >
      The feature requires creating a single markdown file with a simple structure: H1 heading, blank line,
      2-3 sentences of prose. There is no dynamic templating, conditional logic, or complex content generation
      needed. Simple string composition is the most direct, readable approach. The prose topic is arbitrary
      and can be chosen from any domain (nature, technology, science, etc.) — no external data source needed.
      Manual prose composition is straightforward and matches the established pattern across 261+ precedents.

  - title: "File naming and location"
    chosen: "Repository root directory (cwd) with exact filename test-mylh5m.md"
    rejected:
      - "Configurable file paths — not needed; spec defines exact filename and location"
      - "Subdirectory structure (e.g., tests/, artifacts/) — established pattern places all test-*.md files in repository root alongside other test files"
    rationale: >
      The spec explicitly requires the file to be named exactly test-mylh5m.md in the repository root.
      This is the established pattern across 261+ existing test files. No parameterization or conditional
      logic is needed — hardcoded filename and root directory are appropriate and consistent with precedents.

  - title: "Prose content topic selection"
    chosen: "Arbitrary topic selection (free-form, based on domain knowledge)"
    rejected:
      - "Fixed topic list — spec explicitly permits arbitrary content selection; restricting to a list would be unnecessary"
      - "Random selection from topic database — over-engineered; manual selection is simpler and more direct"
    rationale: >
      NFR-7 explicitly states: \"The prose topic SHALL be arbitrary and unconstrained (free-form selection
      permitted).\" This means the implementation can choose any topic (technology, nature, science, history,
      culture, etc.). Manual prose composition based on an arbitrary topic choice is simpler, more direct,
      and consistent with the established pattern observed across existing test files.

