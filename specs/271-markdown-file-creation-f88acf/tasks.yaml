content: |
  ## Summary

  This feature breaks down into 4 focused tasks across 2 sequential phases. **Phase 1 (File Creation)**
  creates the markdown file with correct structure, encoding, and line endings using pathlib.Path.write_text().
  The file contains an H1 heading, blank line, and 2-3 sentences of prose on any meaningful topic.

  **Phase 2 (Git Workflow)** completes the git operations: staging the file with git add, committing with
  the conventional message format, and pushing to the feature branch. Each task builds on the previous one,
  with clear acceptance criteria and verification steps.

  Total estimated effort is 15 minutes, aligned with the specification's "S" (small) size estimate and
  consistent with the established pattern from 200+ identical implementations (features 1-270).

  ## Task Execution Flow

  1. **task-1** (Phase 1): Create markdown file with H1 heading, blank line, 2-3 prose sentences
     - Choose prose topic, write content, use pathlib to create file with UTF-8 encoding
     - Verify encoding (no BOM), line endings (LF not CRLF), file size (300-600 bytes)

  2. **task-2** (Phase 2): Stage file with git add → verify staging area

  3. **task-3** (Phase 2): Commit with conventional message → verify in git log

  4. **task-4** (Phase 2): Push to feature branch → verify on remote

  All tasks follow the established pattern from features 1-270 with proven implementations and minimal risk.
