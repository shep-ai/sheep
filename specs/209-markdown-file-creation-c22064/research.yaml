  ---

  ## Executive Summary

  Feature 209 is a straightforward markdown file creation task following the proven pattern from features 200-207. The technical approach is well-established:

  1. **Content Generation**: Use hard-coded template-based prose (not AI-generated)
  2. **Validation**: Strict checks before any git operations (no silent failures)
  3. **Git Integration**: Automatic push to remote after commit
  4. **Cross-Platform**: Use pathlib for file operations, explicit UTF-8 + LF encoding

  All technical decisions align with the feature spec, previous implementations, and the Sheep platform's philosophy. Implementation complexity is low (\"S\" size estimate: 2-4 hours).

  ---

  ## Technology Decisions

  ### 1. Content Generation Strategy

  **Chosen**: Deterministic template-based generation with hard-coded prose templates

  **Why Not AI-Generated**:
  - Features 202+ use Claude API (temperature=0), but features 207-208 specs explicitly recommend template-based approach
  - Template-based is simpler, faster (no API latency), and requires zero external dependencies
  - Ensures reproducibility without network dependency or potential API failures

  **Why Not Random**:
  - Non-deterministic output complicates testing and validation
  - Features 200-207 demonstrate deterministic approaches are preferred for consistency

  **Implementation**: Create a simple list of pre-written markdown blocks (title + 2-3 sentences pairs), then select based on the feature filename or a deterministic seed.

  Example template structure:
  ```
  templates = [
      {
          "title": "Cloud Computing Architecture",
          "prose": "Cloud computing has transformed how organizations deploy and scale applications..."
      },
      # ... more templates
  ]
  ```

  **Validation Points**:
  - Prose must contain exactly 2-3 sentences (count punctuation: `.`, `!`, `?`)
  - Sentences must be grammatically correct and complete
  - Total file size must be 300-800 bytes

  ### 2. Validation Approach

  **Chosen**: Strict validation with fail-fast error handling

  **Validation Checklist** (all must pass before git operations):
  1. File exists at expected path
  2. File starts with H1 heading (`# ` prefix on first line)
  3. Blank line immediately follows H1
  4. Prose content contains exactly 2-3 sentences
  5. File size is 300-800 bytes (inclusive)
  6. File encoding is UTF-8 without BOM
  7. Line endings are LF, not CRLF
  8. No git conflicts or status issues

  **Error Handling**: Raise explicit exceptions with descriptive messages. Do not attempt recovery or log warnings — validation failures must block the entire workflow.

  **Why Strict**:
  - Prevents invalid files from entering git history
  - Provides clear, immediate error messages for debugging
  - Matches the pattern from features 200-207
  - Aligns with spec requirement: \"Strict (fail fast)\" is selected

  ### 3. Git Integration

  **Chosen**: Automatic push to remote after successful commit

  **Workflow**:
  1. `git add test-xvuuel.md` — Stage the file
  2. `git commit -m \"feat(209): Create markdown file test-xvuuel.md\"` — Conventional commit
  3. `git push -u origin HEAD` — Push to remote with upstream tracking

  **Why Automatic**:
  - Features 200-207 all use this pattern
  - Provides end-to-end automation (create → validate → commit → push)
  - Aligns with Sheep platform's philosophy of deterministic workflows
  - Simpler than conditional push logic

  **Error Handling**:
  - Git operations raise subprocess.CalledProcessError on failure
  - Common failures: wrong branch, auth issues, network problems
  - No retry logic — these are explicit issues requiring human intervention

  ### 4. File Path and I/O Handling

  **Chosen**: Python pathlib.Path for all file operations

  **Why pathlib**:
  - Modern Python standard library (recommended since 3.4, preferred in 3.6+)
  - Cross-platform: handles Windows paths transparently
  - Clean API: `.exists()`, `.read_text()`, `.write_text()` are ergonomic
  - Type-safe with IDE autocomplete support
  - Used in features 200-207 implementations

  **Implementation**:
  ```python
  from pathlib import Path

  repo_root = Path.cwd()
  file_path = repo_root / \"test-xvuuel.md\"

  # Write file with explicit UTF-8 encoding and LF line endings
  content = \"# Title\\n\\nProse content here.\"
  file_path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")

  # Read and validate
  text = file_path.read_text(encoding=\"utf-8\")
  ```

  **Line Ending Control**: Use `newline=\"\\n\"` in `write_text()` to ensure Unix LF endings and prevent Python's automatic line ending conversion.

  ### 5. Sentence Boundary Detection

  **Chosen**: Count sentence-ending punctuation (`.`, `!`, `?`) in prose content

  **Implementation**:
  ```python
  def count_sentences(prose: str) -> int:
      \"\"\"Count sentences by counting terminal punctuation marks.\"\"\"
      return prose.count(\".\") + prose.count(\"!\") + prose.count(\"?\")
  ```

  **Why Simple Punctuation Count**:
  - Test content will be well-formed (no ambiguous abbreviations)
  - Fast O(n) algorithm, deterministic, no dependencies
  - Spec requires exactly 2-3 sentences; this rule is clear and unambiguous
  - Features 200-207 use this approach successfully

  **Edge Cases Not Handled** (because test content won't have them):
  - Abbreviations like \"Mr.\" or \"e.g.\" (not in test templates)
  - Ellipses (\"...\") — test content won't use these
  - Quoted sentences — test content structure is simple

  ### 6. Encoding and Line Ending Enforcement

  **Chosen**: Write files explicitly as UTF-8 without BOM and Unix LF line endings

  **Implementation**:
  ```python
  # Write with explicit encoding and newline control
  file_path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")

  # Validate encoding (check no BOM)
  raw_bytes = file_path.read_bytes()
  if raw_bytes.startswith(b'\\xef\\xbb\\xbf'):  # UTF-8 BOM
      raise ValueError(\"File contains UTF-8 BOM\")

  # Validate line endings
  content = file_path.read_text(encoding=\"utf-8\")
  if \"\\r\\n\" in content:
      raise ValueError(\"File contains CRLF line endings, expected LF\")
  ```

  **Why Explicit Control**:
  - Git best practice: LF line endings prevent spurious diffs on Windows
  - UTF-8 without BOM is the modern standard for code and documents
  - Spec explicitly requires these standards (NFR-2, NFR-3)
  - Prevents platform-specific inconsistencies

  **Windows Consideration**: On Windows, Python's text mode defaults to CRLF. Using `newline=\"\\n\"` forces LF regardless of platform.

  ### 7. Error Handling Strategy

  **Chosen**: Fail-fast with explicit exception raising and descriptive error messages

  **Pattern**:
  ```python
  def validate_file(file_path: Path) -> None:
      if not file_path.exists():
          raise FileNotFoundError(f\"File not found: {file_path}\")

      content = file_path.read_text(encoding=\"utf-8\")
      if not content.startswith(\"# \"):
          raise ValueError(\"File must start with H1 heading (# Title)\")

      # ... more validations, each raising specific exceptions
  ```

  **Why No Recovery**:
  - Silent failures hide problems and create invalid files in git
  - Retry logic is inappropriate for structural/format issues
  - Exceptions force explicit error handling at the call site
  - Clear error messages speed up debugging

  **Git Error Handling**:
  ```python
  result = subprocess.run(
      [\"git\", \"add\", filename],
      check=True,  # Raises CalledProcessError on non-zero exit
      capture_output=True,
      text=True
  )
  # Calling code can catch CalledProcessError and report the error
  ```

