content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-25
  - **Status:** All architectural decisions finalized; ready for implementation

  ## Architecture Overview

  Feature 209 implementation follows the **modular, single-responsibility pattern** established across features 200-208.

  ### Module Structure

  ```
  src/sheep/features/feature_209_markdown_file_creation.py
  ├── Constants (FILENAME, FEATURE_NUMBER, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT)
  ├── Phase 1: File creation (create_markdown_file())
  ├── Phase 2: Validation functions (validate_*() suite)
  ├── Phase 3: Git operations (git_add_file, git_commit, git_push)
  └── Orchestration (main() function)
  ```

  ### Key Design Decisions

  **1. File I/O with pathlib (Phase 1)**
  - Use pathlib.Path for cross-platform operations
  - Explicit UTF-8 encoding: write_text(content, encoding=\"utf-8\")
  - Force Unix LF: write_text(content, newline=\"\\n\") prevents CRLF on Windows
  - Rationale: Modern Python standard, eliminates platform-specific issues, proven in features 200-207

  **2. Content Generation (Phase 1)**
  - Hard-coded TITLE_TEXT and PROSE_CONTENT constants (no API calls)
  - Template-based, deterministic output (reproducible across runs)
  - Content pre-verified for grammar and proper punctuation
  - Rationale: Spec decision, research findings, zero external dependencies, aligns with features 200-207

  **3. Validation Strategy (Phase 2)**
  - Strict (fail-fast) approach: all 8 validation checks must pass before git operations
  - Sequential checks in order: exists → format → sentences → encoding → line endings → size
  - Checks from research findings: file existence, H1 format, blank line, 2-3 sentences, UTF-8 no BOM, LF only, size 300-800 bytes
  - Rationale: Spec decision, prevents invalid files in git history, clear error messages for debugging

  **4. Git Integration (Phase 3)**
  - Use subprocess.run() with list arguments (shell=False for security)
  - check=True for fail-fast on git errors
  - Conventional message: feat(209): Create markdown file test-xvuuel.md
  - Automatic push: git push -u origin HEAD
  - Rationale: Spec decision, matches features 200-207, complete end-to-end automation, secure command execution

  **5. Error Handling**
  - Raise explicit exceptions with descriptive messages
  - No silent failures, no retry logic
  - Logging: info for phases/steps, debug for details, error for failures
  - Rationale: Clear cause-effect for debugging, aligns with strict validation requirement

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation) must come first:**
  - Creates the file that all later phases validate and push
  - No other phase can start without it
  - Focuses on core requirement: correct encoding/content

  **Phase 2 (Validation) depends on Phase 1:**
  - Validates file created in Phase 1
  - Must pass before Phase 3 to prevent bad files entering repo
  - Isolated functions are testable independently

  **Phase 3 (Git) depends on Phase 2:**
  - Only run git operations after validation passes
  - Implements fail-fast principle
  - Self-contained and testable

  **Phase 4 (Integration Testing) uses all phases:**
  - Tests full workflow and error handling
  - Confirms end-to-end success and fail-fast behavior

  ### Files to Create

  1. **src/sheep/features/feature_209_markdown_file_creation.py** (~300-350 lines)
     - Module docstring explaining deterministic content generation approach
     - Constants: FILENAME, FEATURE_NUMBER, BRANCH_NAME, COMMIT_MESSAGE, TITLE_TEXT, PROSE_CONTENT
     - Phase 1 functions: create_markdown_file()
     - Phase 2 functions: verify_file_exists, validate_markdown_format, extract_prose_content, count_sentences, validate_sentence_count, validate_encoding, validate_line_endings, validate_file_size, validate_markdown_file (orchestrator)
     - Phase 3 functions: git_add_file, git_commit, git_push
     - Orchestration: main() function coordinating all phases

  2. **tests/sheep/features/test_feature_209_markdown_file_creation.py** (~400-500 lines)
     - Unit tests for file creation and each validation function
     - Integration test for full workflow
     - Error case tests (git failures, validation failures)
     - Setup/teardown to create/clean temporary test files

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Git push fails (auth/network) | Clear error messages; test on feature branch first; use git push -u origin HEAD for auto-detection |
  | Validation too strict | Use same logic as proven features 200-207; test with sample markdown |
  | Encoding/line ending issues | Explicit UTF-8+LF control via pathlib; validate on both read and write; test on Windows |
  | Sentence counting edge cases | Hard-coded prose is well-formed with unambiguous punctuation; proven approach in 200-207 |
  | File already exists (rerun) | Filename is hardcoded and unique; document idempotency behavior |
  | Tests don't match code | TDD approach: write tests first (RED), implement (GREEN), refactor (REFACTOR) |

  **Overall Risk:** Low. Follows proven pattern from 8+ prior successful implementations. All decisions align with spec and research.

  ## Testing Approach

  **Unit Tests:** validate_markdown_file(), validate_encoding(), validate_line_endings(), validate_file_size(), count_sentences(), create_markdown_file()

  **Integration Tests:** Full end-to-end workflow; git error handling; validation failure handling

  **Manual Testing:** Run on feature branch; verify push succeeds; check git history and remote repository

  ---

  _Planning phase completed 2026-03-25. All architectural decisions finalized._
