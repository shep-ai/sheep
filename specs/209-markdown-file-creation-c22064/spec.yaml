content: |
  ## Problem Statement

  Create a single markdown file named `test-xvuuel.md` in the repository root directory
  containing a markdown H1 title and 2-3 sentences of prose content on any topic.
  This feature continues the series of similar file creation tasks implemented in features 200-207,
  demonstrating the Sheep platform's capability to execute straightforward, deterministic
  file creation workflows following established patterns and conventions.

  The task encompasses three major activities:
  1. Generate and create the markdown file with properly formatted content
  2. Validate the file meets all format and content requirements
  3. Stage, commit, and push the file to the remote repository

  ## Success Criteria

  - [ ] File `test-xvuuel.md` is created in the repository root directory
  - [ ] File contains exactly one H1 (Markdown `# Title`) heading on the first line
  - [ ] A blank line (no whitespace) separates the title from prose content
  - [ ] File contains exactly 2 or 3 sentences of prose content
  - [ ] All sentences are grammatically correct and properly punctuated
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File size is between 300-800 bytes (inclusive)
  - [ ] File is staged with `git add test-xvuuel.md`
  - [ ] File is committed with the conventional commit message: `feat(209): Create markdown file test-xvuuel.md`
  - [ ] Commit is pushed to remote branch with `git push -u origin HEAD`
  - [ ] All validation checks pass without errors before commit
  - [ ] Sentence parsing correctly identifies 2-3 sentences in the content
  - [ ] No git errors or conflicts occur during staging, commit, or push operations

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-xvuuel.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 (markdown heading) using the syntax `# Title` on the first line of the file
  - **FR-3**: Include a blank line (empty line with no whitespace) between the H1 title and prose content
  - **FR-4**: File must contain exactly 2 or 3 sentences of prose content (grammatically correct and properly punctuated)
  - **FR-5**: Validate the created file meets all format requirements before staging for commit
  - **FR-6**: Stage the file using `git add test-xvuuel.md`
  - **FR-7**: Commit the file with a conventional commit message in the format: `feat(209): Create markdown file test-xvuuel.md`
  - **FR-8**: Push the commit to the remote branch using `git push -u origin HEAD`
  - **FR-9**: Implement sentence counting logic that recognizes sentence boundaries (period, exclamation mark, question mark)
  - **FR-10**: Generate prose content deterministically using pre-defined templates or seed-based variation to ensure reproducibility

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 300-800 bytes (inclusive) to ensure meaningful content without verbosity
  - **NFR-2**: File encoding must be UTF-8 without BOM (Byte Order Mark) for cross-platform compatibility
  - **NFR-3**: File line endings must be LF (Unix-style, `\n`) not CRLF (`\r\n`) for consistency across platforms
  - **NFR-4**: Implementation must follow the established pattern from features 200-207 for consistency and maintainability
  - **NFR-5**: Validation must be deterministic and reproducible across multiple executions with the same input
  - **NFR-6**: No external API calls are required (no LLM calls, no HTTP requests) to keep the feature self-contained and fast
  - **NFR-7**: Implementation must work cross-platform (Linux, macOS, Windows) using cross-platform file path handling (pathlib)
  - **NFR-8**: Total implementation time should not exceed 4 hours, following the \"S\" size estimate
  - **NFR-9**: Validation failures must be caught and reported clearly before any git operations are performed
  - **NFR-10**: The feature must be idempotent when called multiple times (creating the same file without duplicates or conflicts)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-xvuuel.md` will be created and committed here, following the established pattern of 200+ similar files |
  | Git repository | High | File will be staged, committed with conventional message (feat(209): Create markdown file test-xvuuel.md), and pushed to remote |
  | specs/209-markdown-file-creation-c22064/ | High | Spec documentation and implementation tracking files |
  | Implementation scripts | Low | May reference or extend existing markdown file creation patterns from features 200-207 |

  ## Dependencies

  - **Python standard library**: pathlib, subprocess, sys modules for file operations and git integration
  - **Git**: Available in environment for staging, committing, and pushing
  - **Established markdown creation pattern**: Based on 9+ previous features (200-208) providing proven implementation template
  - **Sentence parsing logic**: Simple parsing to count sentences using punctuation delimiters (period, exclamation mark, question mark)

  ## Size Estimate

  **S** (2-4 hours) — This feature is straightforward file creation following an established pattern:
  - Nearly identical scope to features 200-207 (validated through recent commit history and spec analysis)
  - Core implementation requires 3-4 functions: file creation (~30 lines), validation (~50 lines), git operations (~20 lines)
  - File validation is well-understood: check existence, size (300-800 bytes), H1 format, blank line, sentence count, encoding, line endings
  - No complex business logic, external API calls, or architectural changes required
  - Effort breakdown: 2-3 hours implementation and testing, 1 hour validation and git operations
  - Low risk due to proven pattern established across 9+ recent similar features

  ---

  _Requirements phase completed — feature is ready for implementation planning_
