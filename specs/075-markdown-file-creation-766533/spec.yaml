# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-juhs9z.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 75+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 063-074, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-juhs9z.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] File size is approximately 400-600 bytes (typical range for this pattern)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-juhs9z.md`)
  - [ ] Git commit exists with message: `feat(075): create markdown file test-juhs9z.md with prose content`
  - [ ] Commit is on the feature branch `feat/075-markdown-file-creation-766533`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-juhs9z.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-juhs9z.md`
  - **FR-7**: File must be committed with the exact message: `feat(075): create markdown file test-juhs9z.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/075-markdown-file-creation-766533`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes (guideline, not strict limit)
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 75+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (explicitly flexible per user query "about anything")
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 75+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/075-markdown-file-creation-766533/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **Dockerfile** and **docker-compose.yml**: Container orchestration files
  - Various other markdown files and documentation

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (75+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes (natural variation based on topic)
  - Implementation follows straightforward imperative code (create content string, write to file)
  - Topic diversity: existing files cover nature, technology, science, design patterns, state machines, etc.

  **Git Workflow Pattern**:
  - Create feature branch (pre-created as feat/075-markdown-file-creation-766533)
  - Create/modify files
  - Stage with git add
  - Commit with conventional commit format: `feat(075): create markdown file test-juhs9z.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 063-074):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Rapid implementation and validation (documented 10-15 minutes in prior features)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (e.g., Path("test-juhs9z.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content
  - **CrewAI**: Framework used by Sheep platform (mentioned in README, not directly used in this feature)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose topic be freely chosen by the implementer or assigned by the platform? | Implementer chooses topic freely | User query explicitly permits "about anything"; 75+ existing test files demonstrate successful topic diversity; flexible selection accelerates implementation |
  | 2 | Is the 400-600 byte file size a strict requirement or a typical guideline? | Guideline; natural variation acceptable | Prose naturally varies by topic and complexity; established pattern shows expected variation; strict enforcement would unnecessarily constrain content |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-juhs9z.md) to existing collection of 75+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-074; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Git History | Low | Adds one commit to the feature branch; follows conventional commit format matching prior 12+ implementations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/075-markdown-file-creation-766533` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 75+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Implementation Notes

  Based on analysis of 12+ prior identical features (063-074):
  - File creation is straightforward: Path(filename).write_text(content, encoding="utf-8")
  - Example precedent from test-macwxa.md and test-i85c38.md shows exact format
  - Git operations follow subprocess calls: git add, git commit, git push
  - No validation complexity beyond verifying file exists and contains expected format

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file presence)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 75+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (063-074) demonstrate efficient implementation of identical features in 10-15 minutes
  - All prior features in this series follow the same workflow and completion pattern

