decisions:
  - title: "Feature Module Architecture Pattern"
    chosen: "Replicate established pattern from features 101-186: single orchestration function that composes existing content_generators utilities in sequence"
    rejected:
      - "Create new utility functions in content_generators.py — unnecessary; all required functions (generate, write, validate, commit, push) already exist and are fully tested across 186 implementations"
      - "Use inline git operations with GitPython directly — violates DRY principle; GitCommitTool and GitPushTool already exist in sheep.tools with proper error handling"
      - "Create new validation library — content_generators.validate_markdown_file() already handles all validation requirements (H1, prose, UTF-8, LF endings)"
    rationale: "The established feature module pattern has been validated 186 times. It provides optimal balance between simplicity, testability, and consistency. Deviating would introduce unnecessary risk and maintenance burden. All required utilities are production-tested and well-documented. Feature 186 is the immediate predecessor—following its exact structure ensures maximum compatibility and requires zero learning curve for future maintainers."

  - title: "Function Signature and Return Type"
    chosen: "create_feature_187_markdown_file(repo_path=None) -> dict[str, str] with keys: filepath, content, commit_message, push_result"
    rejected:
      - "Simple boolean return (True/False) — loses observability; callers cannot verify which steps succeeded/failed; harder to debug when issues occur; inconsistent with 186 prior features"
      - "Return only filepath (minimal) — insufficient for testing and debugging; callers must perform additional I/O to access content or commit details; breaks established contract"
    rationale: "Detailed metadata dict is required by the spec (FR-11, NFR-6). Returns full observability of the operation (filepath, content generated, commit message used, push result). Matches features 101-186 consistently. Enables comprehensive testing and debugging. Callers can verify success/failure of each step and access generated content without additional I/O operations."

  - title: "Content Generation Strategy"
    chosen: "Use existing generate_markdown_content() function from content_generators.py which calls Claude API via CrewAI's get_reasoning_llm()"
    rejected:
      - "Call Claude API directly with anthropic SDK — unnecessary; CrewAI wrapper (get_reasoning_llm) already exists with proper error handling, logging, and configuration management; adds direct dependency"
      - "Use separate LLM for feature 187 — all features 101-186 use the same reasoning LLM; changing creates inconsistency and complicates observability"
      - "Hard-code markdown content — violates test coverage requirements; content must be generated to properly test LLM integration and validation pipeline"
    rationale: "generate_markdown_content() is a battle-tested utility used across 186 features. It handles prompt construction (MARKDOWN_GENERATION_PROMPT), response parsing (handles dict and string responses), validation (H1 heading, sentence count, length), and trailing newline normalization. Reuse eliminates 30+ lines of potentially buggy code and ensures consistency with established patterns."

  - title: "File I/O and Encoding"
    chosen: "Use write_markdown_file() utility which handles pathlib.Path I/O with UTF-8 encoding and provides file creation verification"
    rejected:
      - "Use pathlib.Path.write_text() directly with inline encoding — requires duplicating validation logic (file existence check, size verification); harder to maintain"
      - "Use open() context manager directly — manual resource management; no built-in verification that file was created successfully; requires manual size checks"
    rationale: "write_markdown_file() encapsulates all I/O concerns: filename validation (prevents path traversal attacks), file path resolution, UTF-8 encoding specification, file existence verification, file size validation. Reusing eliminates duplicated validation logic and ensures consistent error messages. The function already handles edge cases like empty file writes and provides structured logging."

  - title: "Markdown Validation Approach"
    chosen: "Call validate_markdown_file() which validates structure (H1 heading, blank line separator, 2-3 sentences), encoding (UTF-8 no BOM), and line endings (Unix LF)"
    rejected:
      - "Implement custom validation inline — duplicates 70+ lines of carefully-crafted validation logic; misses edge cases (UTF-8 BOM detection, CRLF detection via binary read); unmaintainable"
      - "Skip validation — violates spec requirement (success criteria: 'file passes markdown structure validation'); untested implementations lead to invalid commits; fail-fast approach requires validation"
    rationale: "validate_markdown_file() is comprehensive and thoroughly tested across 186 features. It validates all three requirements: (1) Markdown structure—H1 heading at start, blank line separator, 2-3 sentence prose; (2) Encoding—UTF-8 without BOM using binary read for detection; (3) Line endings—Unix LF (no CRLF) verified at binary level. Reusing ensures identical validation behavior across all features and prevents regression."

  - title: "Git Staging and Commit Strategy"
    chosen: "Use commit_markdown_file() utility which uses GitCommitTool (from sheep.tools) to stage and commit with conventional commit message"
    rejected:
      - "Use GitPython directly — requires importing Repo, handling .git directory discovery, managing git errors; adds complexity vs. existing GitCommitTool wrapper"
      - "Use subprocess.run(['git', ...]) directly — no error handling, no logging, harder to test; GitCommitTool already wraps this with proper validation"
    rationale: "commit_markdown_file() provides abstraction over git complexity: validates repo_path, constructs conventional commit message (feat(187): create markdown file ...), uses GitCommitTool._run() with add_all=True (stages all changes), handles 'nothing to commit' edge case, logs at debug level. Reusing eliminates 15+ lines and ensures consistent commit message format across features."

  - title: "Git Push Strategy"
    chosen: "Use push_markdown_file() utility which uses GitPushTool to push with -u (upstream tracking) flag to origin remote"
