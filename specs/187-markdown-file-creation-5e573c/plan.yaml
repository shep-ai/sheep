content: |
  ## Architecture Overview

  Feature 187 implementation follows the **established feature module pattern** validated across 186 prior features (101-186).
  This pattern is optimal for this use case: pure orchestration (no business logic), maximal code reuse, and minimal complexity.

  ### Module Structure
  The feature_187_markdown_file_creation.py module will:
  1. Import existing utilities from sheep.content_generators (generate, write, validate, commit, push)
  2. Define module-level constants (FEATURE_NUMBER=187, MARKDOWN_FILENAME=\"test-awwni7.md\", COMMIT_MESSAGE)
  3. Initialize structured logger using get_logger(__name__)
  4. Implement create_feature_187_markdown_file(repo_path=None) -> dict[str, str]
  5. Include optional __main__ block for standalone execution

  ### Utility Function Dependency Chain
  The orchestration function calls utilities in strict sequence:
  - generate_markdown_content() → generates H1 + 2-3 sentences via Claude API
  - write_markdown_file() → writes to disk with UTF-8 encoding
  - validate_markdown_file() → verifies structure, encoding, line endings
  - commit_markdown_file() → stages and commits with conventional message
  - push_markdown_file() → pushes to remote origin with upstream tracking

  Each utility is already production-tested, well-documented, and includes error handling.
  The feature function wraps them in try/except with structured logging at each step.

  ### Integration Points
  - **content_generators.py**: Reuses 5 existing functions (generate, write, validate, commit, push)
  - **sheep.observability.logging**: Uses get_logger(__name__) for structured logging
  - **sheep.tools**: Indirectly used via content_generators (GitCommitTool, GitPushTool)
  - **pathlib.Path**: Standard library, already used in content_generators
  - **CrewAI LLM framework**: Already configured, called via get_reasoning_llm()

  ### No Architectural Changes
  This feature requires **zero architectural changes**:
  - No new utility functions needed (all already exist)
  - No new dependencies required (all in pyproject.toml)
  - No new observability infrastructure (uses existing structlog config)
  - No configuration files needed (uses module constants)
  - No changes to existing modules

  ## Key Design Decisions

  ### 1. Reuse Feature Module Pattern from 186 Predecessors
  **Decision:** Replicate the orchestration pattern from feature 186 exactly, with only minimal changes (feature number, filename, commit message).

  **Why chosen:** The pattern has been validated 186 times. It provides optimal balance between simplicity, testability, and consistency. Features 101-186 all use this approach with zero issues. Following it requires zero learning curve for maintainers and ensures maximum compatibility.

  **Alternatives rejected:**
  - Monolithic implementation with all logic inline: Harder to test, violates DRY, duplicates validation/git logic
  - Creating new utility functions: All required functions exist; adding new ones increases maintenance burden
  - Using inline git operations: violates DRY; GitCommitTool and GitPushTool already handle this

  ### 2. Return Detailed Metadata Dictionary
  **Decision:** Return dict[str, str] with keys: filepath, content, commit_message, push_result

  **Why chosen:** Spec requirement (FR-11). Provides full observability: caller can verify which steps succeeded/failed, inspect generated content, access commit message used, and check push result. Minimal added complexity (4 dict entries) with significant testing/debugging value. Matches features 101-186 consistently.

  **Alternatives rejected:**
  - Simple boolean return (True/False): Loses observability; caller cannot verify steps; harder to debug
  - No return value (None): Worst observability; impossible to verify success deterministically

  ### 3. Fail-Fast on Validation Errors
  **Decision:** Raise exceptions immediately when validation fails; do not log warnings and continue.

  **Why chosen:** Spec requirement (resolved open question 2). Ensures data integrity—invalid files should never be committed to repository. Aligns with testing patterns from features 1-186. Provides immediate feedback when something goes wrong. Exception propagation enables higher-level error handling and observability.

  **Alternatives rejected:**
  - Log warning and continue: Risks invalid files in repository; harder to debug downstream issues
  - Return error status in dict: Softer approach but less idiomatic Python; requires callers to check

  ### 4. Use Structured Logging via structlog
  **Decision:** Use get_logger(__name__) at module level; log major steps (5 tasks) at info level; log details at debug level.

  **Why chosen:** structlog is configured application-wide. get_logger(__name__) returns BoundLogger with context propagation and consistent formatting. Already used in all features 101-186. Integrates with optional Langfuse observability. Pattern matches application conventions.

  **Alternatives rejected:**
  - print() statements: No structured logging; poor observability
  - Standard logging module: Already wrapped by structlog; get_logger() provides consistency

  ### 5. Minimal Code (~100 Lines)
  **Decision:** Pure orchestration function calling existing utilities; no duplicated validation, file I/O, or git logic.

  **Why chosen:** Feature 186 demonstrates this is optimal size. Simplicity aids maintenance and testing. All logic is delegated to tested utilities. Matches the 30-60 minute time budget for S-sized features.

  **Alternatives rejected:**
  - Implementing validation inline: Would add 70+ lines of duplicated logic; harder to maintain
  - Creating helper functions: Unnecessary for pure orchestration; uses established utilities

  ## Implementation Strategy

  ### Phase Ordering Rationale
  1. **Phase 1 (Foundation)**: Review feature 186 pattern first. This is the direct predecessor and provides the exact template. Understanding the pattern eliminates implementation uncertainty.

  2. **Phase 2 (Implementation)**: Create the module once pattern is understood. Straightforward file creation and function orchestration using known utilities.

  3. **Phase 3 (Testing)**: Write tests for the feature function. Verify markdown generation works, file is created properly, validation passes, and git operations succeed. Can run locally without pushing.

  4. **Phase 4 (Finalization)**: Verify module can be imported and executed standalone. Commit and push. Quick verification phase before final push.

  ### Code Completion Path
  1. Copy feature 186 structure as template
  2. Update constants: FEATURE_NUMBER=187, MARKDOWN_FILENAME=\"test-awwni7.md\", COMMIT_MESSAGE with feature number and filename
  3. Keep orchestration function body identical to feature 186 (calls same utilities in same order)
  4. Keep logging statements identical (log major steps at info level)
  5. Add module docstring with feature 187 context
  6. Keep __main__ block from feature 186 pattern

  This minimizes changes and maximizes confidence in correctness.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Utility function changes/incompatibility** | All utilities are from content_generators.py which hasn't changed its API in 186 features. Test locally before pushing. |
  | **Git operations fail (network, permissions)** | GitCommitTool and GitPushTool handle errors gracefully. Feature includes proper exception handling. If git fails, error message will be descriptive. |
  | **LLM API timeout or failure** | CrewAI get_reasoning_llm() includes retry logic. If LLM fails after retries, generate_markdown_content() raises exception which is caught and logged. |
  | **File encoding issues** | write_markdown_file() explicitly uses UTF-8 encoding. validate_markdown_file() verifies no UTF-8 BOM and no CRLF. All platforms handled correctly. |
  | **Module import errors** | Follow feature 186 imports exactly. All modules (sheep.content_generators, sheep.observability.logging) exist and are importable. |
  | **Path resolution issues** | write_markdown_file() uses Path.cwd() to find repo root. validate_markdown_file() and commit_markdown_file() expect absolute paths. All path handling delegated to utilities which are battle-tested. |
  | **Specification not met** | Spec requirements are clear and matched exactly by feature 186 pattern. Replicating feature 186 ensures spec compliance. |
