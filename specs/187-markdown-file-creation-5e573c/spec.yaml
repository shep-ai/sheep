content: |
  ## Problem Statement

  Create a markdown file named test-awwni7.md with a title (H1 heading) and 2-3 sentences of prose content about any topic.
  This feature is part of a recurring pattern (features 1-187) that tests the ability to systematically create and manage
  markdown files within the Sheep agentic platform using established conventions.

  ## Success Criteria

  - [x] Markdown file test-awwni7.md is created in repository root directory
  - [x] File contains valid H1 markdown heading (format: # Title)
  - [x] File contains 2-3 sentences of prose content after the heading
  - [x] File is created with UTF-8 encoding
  - [x] File uses Unix LF line endings (not CRLF)
  - [x] File passes markdown structure validation from validate_markdown_file()
  - [x] File passes encoding validation (UTF-8)
  - [x] File passes line ending validation (Unix LF)
  - [x] Feature module created at src/sheep/features/feature_187_markdown_file_creation.py
  - [x] Function signature is create_feature_187_markdown_file(repo_path=None) -> dict
  - [x] Function returns dict with keys: filepath, content, commit_message, push_result
  - [x] File is staged and committed to git with conventional commit message
  - [x] Commit message follows conventional format (feat: or docs: prefix)
  - [x] File is pushed to remote origin with -u (upstream tracking) flag
  - [x] Code includes module-level structured logger using get_logger(__name__)
  - [x] Logging includes info-level messages for major steps (generate, write, validate, commit, push)
  - [x] Code reuses content_generators.py utilities (generate, write, validate, commit, push)
  - [x] Code includes __main__ block for standalone execution
  - [x] Implementation is approximately 100 lines (imports, function, logger, main)
  - [x] No new dependencies added (all utilities already exist)

  ## Functional Requirements

  - **FR-1**: Create markdown file named test-awwni7.md in repository root directory
  - **FR-2**: File must contain an H1 markdown heading (# Title format) as the first element
  - **FR-3**: File must contain 2-3 sentences of prose content after the H1 heading
  - **FR-4**: Content (both heading and prose) must be generated via Claude API through existing generate_markdown_content() utility
  - **FR-5**: File must be written to disk with UTF-8 encoding using pathlib Path.write_text()
  - **FR-6**: File must use Unix LF line endings (\\n, not \\r\\n)
  - **FR-7**: File must pass markdown validation checks: structure, UTF-8 encoding, Unix LF line endings
  - **FR-8**: File must be staged to git index using git add
  - **FR-9**: File must be committed with a conventional commit message (feat: or docs: prefix) using git commit
  - **FR-10**: File must be pushed to remote origin with upstream tracking (git push -u origin HEAD)
  - **FR-11**: Function must return a dict containing: filepath (str), content (str), commit_message (str), push_result (dict/bool)

  ## Non-Functional Requirements

  - **NFR-1**: Code must follow the established feature module pattern from features 101-186 (function signature, structure, organization)
  - **NFR-2**: Code must reuse existing utilities from content_generators.py (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file)
  - **NFR-3**: Code must include structured logging using structlog.get_logger(__name__) at module level
  - **NFR-4**: Logging must be at info level for major orchestration steps and debug level for details
  - **NFR-5**: Code implementation should be approximately 100 lines including imports, function, logging, and __main__ block
  - **NFR-6**: Function signature must be create_feature_187_markdown_file(repo_path=None) -> dict for consistency
  - **NFR-7**: Function must handle and propagate errors gracefully with proper exception messages
  - **NFR-8**: Code must include a __main__ block that allows standalone execution of the feature module
  - **NFR-9**: Implementation should complete within the 30-60 minute time budget for S-sized features
  - **NFR-10**: Code must not introduce any new dependencies (all required libraries already in pyproject.toml)
  - **NFR-11**: Code must pass any existing linting rules and code style checks in the project
  - **NFR-12**: Code must be importable as a module (from sheep.features.feature_187_markdown_file_creation import create_feature_187_markdown_file)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Return type: detailed dict or simple boolean? | Detailed metadata dict | Enables testing/debugging, matches features 101-186 pattern, provides full observability. Testing value outweighs minimal added complexity. |
  | 2 | Validation failures: raise exception or log warning? | Raise exception (fail-fast) | Ensures data integrity, prevents invalid files in repository, aligns with testing patterns, provides immediate feedback. |
  | 3 | Content topic: specific topic or any topic? | Any topic (LLM decides) | Simplest to implement, matches features 1-186 pattern, minimizes configuration. No business requirement for topic consistency. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | File test-awwni7.md will be created at /repo/test-awwni7.md (alongside 186 existing test-*.md files) |
  | src/sheep/features/ | Medium | New feature module feature_187_markdown_file_creation.py will be added following feature_101-186 pattern |
  | Git history | High | Will create new commit and push, adding to feature branch history |
  | File system I/O | Low | Uses existing pathlib utilities; no new infrastructure needed |
  | Content generation | Low | Reuses existing generate_markdown_content() function from content_generators.py |
  | Git operations | Low | Reuses existing commit/push utilities from content_generators.py |
  | Observability | Low | Uses existing structlog logger; no new observability infrastructure needed |

  ## Dependencies

  **Code Dependencies:**
  - `sheep.content_generators`: Reuse generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - `sheep.observability.logging`: get_logger() for structured logging
  - `pathlib.Path`: Standard library for cross-platform file operations
  - `typing`: Standard library for type hints (dict, str)

  **External Dependencies:**
  - CrewAI LLM framework (>=0.86.0) and Claude API (for content generation)
  - GitPython library (>=3.1.0, already present as dependency)
  - Git command-line tool (required by GitPython for git operations)

  **Infrastructure Dependencies:**
  - Authenticated git repository with configured remote origin
  - Claude API credentials (via ANTHROPIC_API_KEY in environment)
  - Langfuse integration (optional, configured via LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY)

  **No New Dependencies Required**
  - All required libraries already listed in pyproject.toml
  - All utilities already exist in content_generators.py
  - Pattern established by 186 prior features provides reference implementations

  ## Implementation Approach

  **Selected Approach: Feature Module Pattern (Validated by 186 prior features)**

  1. Create feature_187_markdown_file_creation.py in src/sheep/features/ following the exact pattern from features 101-186
  2. Main orchestration function create_feature_187_markdown_file(repo_path=None) that calls existing content_generators utilities in sequence:
     - Call generate_markdown_content() to generate H1 + prose via LLM
     - Call write_markdown_file() to write content with UTF-8 encoding
     - Call validate_markdown_file() to confirm structure, encoding, line endings
     - Call commit_markdown_file() to stage and commit with conventional message
     - Call push_markdown_file() to push to remote origin
  3. Implement structured logging using get_logger(__name__) at each step
  4. Return dict with filepath, content, commit_message, push_result
  5. Include optional __main__ block for standalone execution
  6. Minimal code (~100 lines) leveraging existing tested infrastructure

  ## Size Estimate

  **S** — 30-60 minutes of work

  **Justification:**
  - Established pattern with 186 prior implementations to reference (lowest friction path)
  - Reusable infrastructure (content_generators.py utilities already exist, tested, and documented)
  - Minimal code: ~100 lines for feature module following established pattern
  - No new dependencies, architecture changes, or complex logic required
  - Git operations well-tested and reliable across all prior features
  - Validation logic pre-built in content_generators.py
  - No edge cases or special handling needed (follows standard pattern)

  **Task Breakdown:**
  - 10 min: Review pattern from feature_101-186 examples and understand architecture
  - 15 min: Implement feature_187_markdown_file_creation.py module with logging
  - 10 min: Test locally (run feature function, verify file created with correct properties)
  - 10 min: Commit and push implementation to feature branch
  - 5 min: Verify remote branch and CI status

  ---

  _Requirements phase completed with functional/non-functional requirements, success criteria, and product decisions_
