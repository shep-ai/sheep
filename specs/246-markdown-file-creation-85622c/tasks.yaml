name: "markdown-file-creation-85622c"
summary: >
  4 tasks across 2 phases: Create and validate markdown file (Phase 1),
  then stage, commit, and push to git (Phase 2). Total effort: 15 minutes.

relatedFeatures: []

technologies:
  - "Python 3.11+ (pathlib)"
  - "subprocess (git)"
  - "Markdown (CommonMark)"

relatedLinks:
  - title: "CommonMark Specification"
    url: "https://spec.commonmark.org/"
  - title: "Python pathlib documentation"
    url: "https://docs.python.org/3/library/pathlib.html"

tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Create markdown file with H1 heading and prose content"
    description: >
      Create test-rp1yui.md at repository root with proper structure:
      one H1 heading, one blank line separator, and 2-3 sentences of prose.
      Use pathlib.Path.write_text() with explicit UTF-8 encoding and Unix
      line endings (newline='\\n' parameter).
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-rp1yui.md exists at repository root"
      - "File starts with H1 heading (# Title)"
      - "Second line is blank"
      - "Remaining content is 2-3 sentences of prose"
      - "File uses UTF-8 encoding without BOM"
      - "File uses Unix LF line endings (not CRLF)"
      - "File size is between 400-600 bytes"
    tdd:
      red:
        - "Assert file does not exist initially"
        - "Assert that after creation, file exists at correct path"
        - "Assert file content matches expected structure"
        - "Assert file size is within 400-600 byte range"
      green:
        - "Create pathlib.Path object for test-rp1yui.md"
        - "Define prose content (2-3 sentences on meaningful topic)"
        - "Write H1 heading, blank line, and prose to file"
        - "Use encoding='utf-8' for UTF-8 encoding without BOM"
        - "Use newline parameter to force Unix LF line endings"
        - "Read file back and verify structure"
      refactor:
        - "Extract prose content to variable for clarity"
        - "Add inline comments explaining file structure"
        - "Consider extracting heading creation to helper if needed"
    estimatedEffort: "5 minutes"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Validate file encoding and line endings"
    description: >
      Verify the created file has correct encoding (UTF-8 without BOM)
      and line endings (Unix LF, not CRLF). Read file in binary mode
      to check for BOM marker and CRLF byte sequences. Validate UTF-8
      text decoding.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "File does not start with UTF-8 BOM (bytes EF BB BF)"
      - "File does not contain CRLF byte sequence (0D 0A)"
      - "File contains only LF line endings (0A bytes)"
      - "File decodes successfully as UTF-8 text"
      - "Validation passes without errors or exceptions"
    tdd:
      red:
        - "Assert file is valid UTF-8 (no decode errors)"
        - "Assert file has no BOM marker"
        - "Assert file has no CRLF byte sequences"
        - "Assert validation raises exception if checks fail"
      green:
        - "Read file in binary mode"
        - "Check that file does not start with EF BB BF (UTF-8 BOM)"
        - "Check that file does not contain 0D 0A (CRLF) bytes"
        - "Attempt to decode file content as UTF-8 (catches encoding errors)"
        - "Raise ValidationError if any check fails"
      refactor:
        - "Extract encoding validation into separate helper function"
        - "Extract line ending validation into separate helper function"
        - "Add informative error messages for each check"
    estimatedEffort: "3 minutes"

  - id: "task-3"
    phaseId: "phase-1"
    title: "Validate file structure and content"
    description: >
      Verify the file has correct markdown structure (H1 heading, blank
      line separator, prose content) and that prose contains exactly 2-3
      sentences. Count sentences by counting periods (.) in the prose.
      Validate file size is in acceptable range.
    state: "Todo"
    dependencies:
      - "task-2"
    acceptanceCriteria:
      - "First line starts with '# ' (H1 heading marker)"
      - "Second line is empty (blank line separator)"
      - "Content after blank line is non-empty prose"
      - "Prose contains at least 2 periods (minimum 2 sentences)"
      - "Prose contains at most 3 periods (maximum 3 sentences)"
      - "File size is between 400-600 bytes"
      - "Validation passes without errors"
    tdd:
      red:
        - "Assert first line is valid H1 heading"
        - "Assert second line is blank"
        - "Assert prose content exists and is non-empty"
        - "Assert prose has 2-3 sentences (via period counting)"
        - "Assert file size is in 400-600 byte range"
      green:
        - "Split file content into lines"
        - "Check that first line starts with '# '"
        - "Check that second line is empty (after strip)"
        - "Extract prose (content after blank line)"
        - "Assert prose is non-empty"
        - "Count periods in prose content"
        - "Assert period count is between 2 and 3 inclusive"
        - "Get file size via Path.stat().st_size"
        - "Assert size is between 400-600 bytes"
        - "Raise ValidationError if any check fails"
      refactor:
        - "Extract prose extraction logic into helper function"
        - "Extract sentence counting into helper function"
        - "Add clear error messages showing actual vs expected values"
        - "Consider edge cases (ellipsis, abbreviations) if needed"
    estimatedEffort: "3 minutes"

  - id: "task-4"
    phaseId: "phase-2"
    title: "Stage file, commit with conventional message, and push"
    description: >
      Use subprocess to invoke git commands: stage the created and
      validated markdown file with 'git add', create a conventional
      commit with message 'feat(246): create markdown file test-rp1yui.md
      with prose content' using --no-verify flag, and push to remote
      feature branch with 'git push -u origin HEAD'.
    state: "Todo"
    dependencies:
      - "task-3"
    acceptanceCriteria:
      - "File is staged in git (git add completed)"
      - "Git commit exists with correct message format"
      - "Commit is on feature branch feat/246-markdown-file-creation-85622c"
      - "Commit is pushed to remote origin"
      - "No other files are staged or committed"
      - "Pre-commit hooks are skipped using --no-verify flag"
      - "All git operations complete successfully"
    tdd:
      red:
        - "Assert file is not in git index before operations"
        - "Assert git add completes without error"
        - "Assert commit message matches expected format"
        - "Assert commit is on correct feature branch"
        - "Assert changes are pushed to remote origin"
      green:
        - "Execute 'git add test-rp1yui.md' via subprocess.run()"
        - "Execute 'git commit --no-verify -m \"feat(246): create markdown file test-rp1yui.md with prose content\"'"
        - "Execute 'git push -u origin HEAD' to push feature branch"
        - "Use subprocess.run(check=True) to raise CalledProcessError on failure"
        - "Raise exception if any git command returns non-zero exit code"
      refactor:
        - "Extract git command execution into helper function"
        - "Add error handling with informative error messages"
        - "Consider extracting commit message format to variable"
    estimatedEffort: "4 minutes"

totalEstimate: "15 minutes"

