content: |
  ## Task Execution Flow

  ### Phase 1: File Creation & Content Generation (5 minutes)

  **Task 1** is the primary work item in this phase:
  1. Compose 2-3 sentences of grammatically correct, coherent prose on any appropriate topic (generic/universal topics preferred)
  2. Create H1 markdown heading to serve as file title
  3. Use Python pathlib.Path.write_text() to create test-65trjw.md at repository root with:
     - Content: `# Heading\n\n<prose sentences>`
     - Encoding: UTF-8
     - Result: File should be 320-600 bytes
  4. Verify file exists and has correct basic structure

  Expected output: File test-65trjw.md exists at repository root with proper markdown format.

  ### Phase 2: Validation & Git Workflow (10 minutes)

  **Task 2** validates the created file:
  1. Verify encoding is UTF-8 without BOM via `file` command
  2. Verify line endings are Unix LF (not CRLF) via `od -c` or file inspection
  3. Verify file size via `wc -c` (should be 320-600 bytes)
  4. Manually verify markdown syntax (H1 heading, blank line, 2-3 sentences)
  5. Address any issues found (encoding, line endings, syntax, size)

  Expected outcome: File validated against all specification criteria.

  **Task 3** performs git operations:
  1. Stage file: `git add test-65trjw.md`
  2. Commit: `git commit -m "feat(097): create markdown file test-65trjw.md with prose content"`
  3. Push: `git push -u origin HEAD` (pushes to feature branch)
  4. Verify clean working tree: `git status` shows no uncommitted changes

  Expected outcome: File committed and pushed to feature branch feat/097-markdown-file-creation-ced0cf.

  ## Summary

  Implementation follows a simple, linear workflow validated across 96+ prior features:
  1. **Create file** with markdown content (5 min) → test-65trjw.md exists
  2. **Validate** encoding, line endings, syntax, size (3 min) → file meets spec
  3. **Git workflow** add/commit/push (5 min) → changes committed to feature branch

  No parallelization possible; each task depends on previous completion. Total effort: 10-15 minutes.
  This aligns with size estimate (S) and matches historical completion times for identical pattern
  across features 069-096.
