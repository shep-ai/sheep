# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 96+ times. This feature creates a single
  test markdown file (`test-65trjw.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 96+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-096.

  ## Success Criteria

  - [ ] File `test-65trjw.md` exists at repository root (testable: `ls -la test-65trjw.md`)
  - [ ] File contains exactly one H1 markdown heading as title (first non-empty line starts with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading (separated by blank line)
  - [ ] Markdown syntax is valid (parseable by standard markdown processors without warnings)
  - [ ] Prose content is grammatically correct and coherent
  - [ ] File uses UTF-8 encoding without BOM (testable: `file test-65trjw.md` returns UTF-8)
  - [ ] File uses Unix-style line endings (LF: `\n` only, not CRLF: `\r\n`)
  - [ ] File size is 320-600 bytes (testable: `wc -c test-65trjw.md`)
  - [ ] File is staged in git and appears in `git status` staging area
  - [ ] Commit message follows conventional format: `feat(097): create markdown file test-65trjw.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/097-markdown-file-creation-ced0cf` (testable: `git log --oneline`)
  - [ ] Repository shows no uncommitted changes after implementation (testable: `git status` shows clean working tree)

  ## Functional Requirements

  - **FR-1**: Create markdown file at repository root with filename exactly `test-65trjw.md`
  - **FR-2**: File must contain one H1 markdown heading (using `#` syntax) as the title/first line
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading, separated by blank line
  - **FR-4**: File must be created using standard Python pathlib methods: `Path("test-65trjw.md").write_text(content)`
  - **FR-5**: Stage file with git using `git add test-65trjw.md` command
  - **FR-6**: Commit file with conventional commit message: `feat(097): create markdown file test-65trjw.md with prose content`
  - **FR-7**: Push commit to feature branch using `git push` or `git push -u origin HEAD`

  ## Non-Functional Requirements

  - **NFR-1**: Markdown syntax must be valid — file must parse correctly in standard markdown processors
  - **NFR-2**: Prose content must be grammatically correct, coherent, and appropriate in tone
  - **NFR-3**: File encoding must be UTF-8 without byte order mark (BOM)
  - **NFR-4**: Line endings must be Unix-style (LF: `\n` only, not CRLF: `\r\n`)
  - **NFR-5**: File size should fall within 320-600 bytes (observed range from prior test files)
  - **NFR-6**: Implementation must follow established pattern from features 069-096 without deviation
  - **NFR-7**: No modifications to existing files; implementation is purely additive (new file only)
  - **NFR-8**: Implementation should complete in approximately 10-15 minutes
  - **NFR-9**: Prose topic can be any appropriate subject (generic/universal topics are preferred)

  ## Product Decisions

  All design decisions below are resolved through 96+ successful prior implementations (features 069-096).
  These decisions are encoded as openQuestions above with structured options and recommendations.
  All recommendations have been validated through prior feature execution and are set as defaults.

  | # | Decision | Selected Answer | Rationale |
  | - | -------- | --------------- | --------- |
  | 1 | File location | Repository root | Established across 96+ prior test files; standard location for test artifacts |
  | 2 | File format | Markdown (H1 heading + 2-3 sentences) | Consistent pattern from all prior features; validated for quality and consistency |
  | 3 | Prose topic | Flexible/any appropriate subject | Validated through 96+ implementations; generic/universal topics preferred for broad relevance |
  | 4 | Prose length | Exactly 2-3 sentences | Established requirement; 3 sentences typical in prior test files (320-600 byte range) |
  | 5 | Git workflow | `add` → `commit` → `push` to feature branch | Standard workflow pattern; conventional commit format required per project standards |
  | 6 | File encoding | UTF-8 without BOM, Unix LF line endings | Consistent across all 96+ test files; required for cross-platform compatibility |
  | 7 | Commit message format | `feat(097): create markdown file test-65trjw.md with prose content` | Conventional Commits standard per project; matches all prior feature implementations |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 96+ test markdown files (test-*.md) following a consistent pattern, created by features 069-096
  - **src/sheep/**: Application source code with modular architecture:
    - `agents/`: Agent definitions (code_agents.py, general_agents.py) for research, implementation, and review phases
    - `config/`: Configuration management (settings.py, llm.py) for multi-LLM support
    - `flows/`: Flow definitions (code_implementation.py, chat.py) orchestrating agent execution
    - `tools/`: Agent tools (git_tools.py, file_tools.py, web_tools.py) for file and git operations
    - `observability/`: Logging and tracing (logging.py, langfuse_client.py) for execution monitoring
    - `content_generators.py`: Content generation utilities
  - **specs/**: Feature specification directory with subdirectories for each feature numbered 006+
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (requires Python 3.11+) with dependencies (CrewAI, pathlib, Git, etc.)
  - **.env.example / .env**: Environment configuration for API keys (OpenAI, Anthropic, Google, Langfuse)
  - **README.md**: Project documentation describing the CrewAI-based agentic platform
  - **Documentation files**: DESIGN_PATTERN.md, ABOUT_ME.md, TOPIC.md, and other artifacts from prior feature implementations
  - **Docker**: Dockerfile and docker-compose.yml for containerized deployment

  The test markdown files at repository root are artifacts created during feature implementation phases
  and do not form part of the application source code. They serve as simple, repeatable test cases
  for the Sheep automated implementation system.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (96+ precedents):
  - Simple file creation using Python pathlib: `Path("test-65trjw.md").write_text(content)`
  - Standard markdown format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix-style LF line endings (\n)
  - File size typically 320-600 bytes (observed range: 405-572 bytes across existing test files)
  - Topic selection is flexible (generic/universal topics like "The Gift of Change", "The Value of Deep Work")
  - Prose content must be grammatically correct and coherent, typically 3 sentences

  **Git Workflow Pattern** (consistently applied across features 069-096):
  - Feature branch pre-created with naming convention: `feat/{number}-markdown-file-creation-{slug}`
  - Files created at repository root (no subdirectories)
  - Standard git workflow: `git add <file>` → `git commit -m "feat({number}): ..."` → `git push`
  - Conventional commit format: `feat({number}): create markdown file {filename} with prose content`
  - Commits pushed to feature branch (not merged to main during implementation phase)

  **Modular Application Architecture**:
  - Separation of flows (control structure) and crews (LLM intelligence)
  - Multi-LLM support with factory pattern (OpenAI, Anthropic, Google APIs)
  - Observable execution via Langfuse integration
  - Specialized agents for research, implementation, and review phases
  - File I/O and git operations via dedicated tool modules

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); supports 3.11-3.12
  - **pathlib (Python standard library)**: Cross-platform file I/O operations for markdown file creation
  - **Git**: Version control system for file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content blocks
  - **CrewAI**: Multi-agent framework used by the Sheep platform (from dependencies in pyproject.toml)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-65trjw.md) to existing collection of 96+ test files; no modifications to existing files or structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code | None | Feature is purely file creation; does not depend on or impact /src/sheep/ application code |
  | Configuration | None | No modifications to pyproject.toml, .env, or other configuration files |
  | Documentation | None | No changes to README.md or other documentation (though documentation files may exist from prior features) |
  | Test Suite | None | No modifications to tests/ directory or test infrastructure |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/097-markdown-file-creation-ced0cf` must already exist (pre-created)
  - **File system permissions**: Write access to repository root directory (standard in development environment)
  - **Established pattern**: 96+ test files provide clear precedent for content structure, format, and quality expectations
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose with an appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size ~320-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 96+ prior features with identical requirements
  - Flexible topic selection with no research or architectural decisions required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-096 demonstrate efficient implementation of identical tasks in 10-15 minutes
  - Pattern is simple enough to implement without external libraries or complex logic

