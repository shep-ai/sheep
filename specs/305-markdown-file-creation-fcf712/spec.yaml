content: |
  ## Problem Statement

  Feature 305 requires creating a single markdown file named test-n33d8c.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 305th iteration of a well-established markdown-file-creation feature pattern successfully executed in features 269-304 and beyond. The repository contains 300+ test markdown files following this identical pattern, providing clear precedent for implementation approach and content structure.

  ## Codebase Analysis

  ### Project Structure

  The repository consists of:
  - **Repository root**: Contains 300+ test markdown files (test-*.md) following a consistent pattern
  - **specs/**: Feature specification directory with subdirectories for each feature (specs/305-markdown-file-creation-fcf712/)
  - **src/sheep/**: Application source code (agents, configuration, tools, observability, content generation infrastructure)
  - **tests/**: Test suite for the application
  - **.github/**: GitHub workflows and CI/CD configuration
  - **pyproject.toml**: Python project configuration
  - **Dockerfile**: Container configuration

  The test markdown files at repository root are artifacts of the markdown-file-creation feature pattern and serve as validation artifacts for the automated implementation system. They are not application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (300+ precedents across features 269-304):
  - Simple file creation at repository root using Python file I/O
  - Each markdown file follows the structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), Unix LF line endings
  - File size typically 400-600 bytes as natural outcome of proper structure
  - Implementation uses straightforward imperative code (compose content string, write to file)
  - Files are isolated artifacts with no dependencies on application source code
  - Topic selection is free-form with diverse subjects observed across existing files (nature, technology, science, history, culture, philosophy, etc.)

  **Git Workflow Pattern**:
  - Feature branch created as `feat/305-markdown-file-creation-fcf712` (pre-existing)
  - Create/modify file in working directory
  - Stage with `git add test-n33d8c.md`
  - Commit with conventional commit format: `feat(305): create markdown file test-n33d8c.md with prose content`
  - Push to feature branch with upstream tracking
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed across features 269-304):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward file I/O
  - Each feature is identical in structure and requirements
  - Implementation time is consistently 10-15 minutes based on precedent

  ### Relevant Technologies

  - **Python 3.x**: Project runtime (from pyproject.toml)
  - **pathlib (Python standard library)**: Cross-platform file I/O operations
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content per CommonMark specification

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-n33d8c.md) to existing collection of 300+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 269-304; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  **External Dependencies**:
  - **Git CLI**: Executable for staging, committing, pushing (subprocess or direct shell commands)
  - **Python Standard Library**: pathlib for file I/O, os for file system operations

  **No New Dependencies Required**: All required infrastructure (pathlib, git) is already available and proven across 300+ prior features.

  **Pre-requisites**:
  - Feature branch `feat/305-markdown-file-creation-fcf712` must exist (pre-created)
  - Write access to repository root directory
  - Git repository initialized with standard configuration

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes)

  **Rationale**:
  - Well-established pattern with 300+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences of prose)
  - No testing, documentation, or configuration changes required
  - File naming (test-n33d8c.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 35+ recent implementations (features 269-304)
  - Estimated breakdown: 5 min (compose/write file) + 3 min (validate structure) + 2-5 min (git workflow) = 10-15 min total

