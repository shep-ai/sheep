content: |
  ## Problem Statement

  Feature 305 requires creating a single markdown file named test-n33d8c.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This is the 305th iteration of a well-established markdown-file-creation feature pattern successfully executed in features 269-304 and beyond. The repository contains 300+ test markdown files following this identical pattern, providing clear precedent for implementation approach and content structure.

  ## Success Criteria

  - [ ] File created at repository root with exact filename "test-n33d8c.md"
  - [ ] File begins with an H1 markdown heading (format: # Title)
  - [ ] Blank line separates H1 heading from prose content
  - [ ] File contains exactly 2-3 complete sentences of coherent prose
  - [ ] Prose content is meaningful, readable, and appropriate
  - [ ] File encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] File size is naturally between 400-600 bytes (expected outcome of structure)
  - [ ] File successfully staged with git add command
  - [ ] Commit created with conventional format: "feat(305): create markdown file test-n33d8c.md with prose content"
  - [ ] Commit successfully pushed to feature branch (feat/305-markdown-file-creation-fcf712)
  - [ ] No other files in repository modified or created
  - [ ] Feature branch tracking properly configured for upstream push

  ## Functional Requirements

  - **FR-1**: The markdown file must be created at the repository root
  - **FR-2**: File must have the exact filename "test-n33d8c.md"
  - **FR-3**: File must begin with an H1 markdown heading in the format "# Title" on the first line
  - **FR-4**: A blank line must separate the H1 heading from the prose content
  - **FR-5**: File must contain exactly 2-3 complete, grammatically correct sentences
  - **FR-6**: Prose content must be coherent, meaningful, and readable (not gibberish)
  - **FR-7**: Prose content may be about any topic (no topic restrictions)
  - **FR-8**: File must be staged using "git add test-n33d8c.md"
  - **FR-9**: Commit must be created with conventional commit message format: "feat(305): create markdown file test-n33d8c.md with prose content"
  - **FR-10**: Commit must be pushed to the feature branch with upstream tracking configured

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be Unix LF format (\\n), not Windows CRLF (\\r\\n)
  - **NFR-3**: File size should naturally range from 400-600 bytes based on content structure
  - **NFR-4**: Implementation must follow the established pattern proven across features 269-304
  - **NFR-5**: Content must be appropriate for a professional repository (no offensive or inappropriate material)
  - **NFR-6**: Implementation should complete within the estimated 10-15 minute timeframe
  - **NFR-7**: No modifications to source code (/src/sheep/), tests, or configuration files
  - **NFR-8**: Git workflow must follow conventional commit standards and proper branch management

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-n33d8c.md) to existing collection of 300+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 269-304; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  **External Dependencies**:
  - **Git CLI**: Executable for staging, committing, pushing (subprocess or direct shell commands)
  - **Python Standard Library**: pathlib for file I/O, os for file system operations (no new dependencies)

  **No New Dependencies Required**: All required infrastructure (pathlib, git) is already available and proven across 300+ prior features.

  **Pre-requisites**:
  - Feature branch `feat/305-markdown-file-creation-fcf712` must exist (pre-created)
  - Write access to repository root directory
  - Git repository initialized with standard configuration
  - Git user configured (name and email)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes)

  **Rationale**:
  - Well-established pattern with 300+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences of prose)
  - No testing, documentation, or configuration changes required
  - File naming (test-n33d8c.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 35+ recent implementations (features 269-304)
  - Estimated breakdown: 5 min (compose/write file) + 3 min (validate structure) + 2-5 min (git workflow) = 10-15 min total

  ## Product Decisions

  **Scope Decisions (All Confirmed by Precedent)**:
  - Topic selection: Free-form (any topic allowed) — confirmed across existing files with diverse subjects
  - Content length: Exactly 2-3 sentences (not flexible) — specified requirement
  - File location: Repository root only — established pattern
  - Git workflow: Add, commit, push to feature branch — standard workflow

  ---

  Requirements phase complete — functional and non-functional requirements defined, success criteria established, ready for implementation
