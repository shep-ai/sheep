content: |
  ## Summary

  Feature 091 implementation consists of 4 ordered tasks across 2 phases:

  **Phase 1: File Creation & Validation (Tasks 1-2)**
  First, we create the markdown file with deterministic prose content using pathlib with
  explicit UTF-8 encoding and Unix LF line endings. Then we validate the file comprehensively:
  UTF-8 without BOM, Unix LF (not CRLF), proper markdown structure (H1 + blank + prose),
  2-3 sentences, and file size 320-600 bytes. Validation must pass before proceeding to git.

  **Phase 2: Git Integration & Verification (Tasks 3-4)**
  Once validation passes, we stage the file, commit with conventional message format,
  and push to the feature branch. Finally, we verify the git working tree is clean and
  all success criteria are met.

  This approach mirrors the 90+ established implementations and follows fail-fast principle:
  validate content quality before git operations, ensuring only compliant files are pushed.

  ## Task Execution Order

  1. **task-1** (File creation) — independent, can start immediately
  2. **task-2** (Validation) — depends on task-1, ensures file quality before git
  3. **task-3** (Git workflow) — depends on task-2, stages and pushes validated file
  4. **task-4** (Final verification) — depends on task-3, confirms feature complete

  No parallelization possible due to sequential dependencies. Each task has clear
  acceptance criteria and TDD cycle (red/green/refactor) for validation-driven development.
