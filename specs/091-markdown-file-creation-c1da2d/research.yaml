    rationale: >
      pathlib.Path is the modern, Pythonic approach for file I/O in Python 3.4+. The Path.write_text()
      method provides a high-level interface that automatically handles file creation, encoding, resource
      management, and closing. This pattern is consistently used across all 90+ established test files
      in features 069-090 (e.g., file_creation_089.py uses Path.write_text()). pathlib also provides
      cross-platform path handling and the newline parameter for Unix LF control. The method signature
      Path.write_text(content, encoding='utf-8', newline='\n') directly addresses all encoding and
      line-ending requirements.

  - title: 'Line Ending Handling (Unix LF vs Windows CRLF)'
    chosen: 'Explicit newline="\n" parameter in Path.write_text()'
    rejected:
      - 'Platform-default line endings — would produce CRLF on Windows, violating NFR-2 (Unix LF requirement); data portability issues across platforms'
      - 'Manual byte-level LF insertion — more complex code with higher error risk; pathlib newline parameter is purpose-built for this use case'
    rationale: >
      The spec requires Unix-style LF line endings (NFR-2) even on Windows Server. Without explicit
      control, Path.write_text() would use platform-default CRLF. The newline='\n' parameter forces
      Unix LF regardless of platform, matching file_creation_089.py. This is standard Python (3.3+)
      and avoids low-level complexity of byte manipulation.

  - title: 'UTF-8 Encoding and BOM Handling'
    chosen: 'encoding="utf-8" parameter in Path.write_text() with validation'
    rejected:
      - 'Default encoding (platform-dependent, often cp1252 on Windows) — would violate NFR-1 (UTF-8 requirement) and create portability issues'
      - 'UTF-8-sig encoding (includes BOM) — adds unnecessary 3-byte BOM (0xEF 0xBB 0xBF), violating spec requirement for "UTF-8 without BOM"'
    rationale: >
      Python''s encoding="utf-8" creates valid UTF-8 without Byte Order Mark, required by NFR-1.
      Using UTF-8-sig would add a 3-byte BOM causing validation failures. All established test files
      use encoding="utf-8" with binary validation to confirm BOM absence via
      binary_content.startswith(b'\xef\xbb\xbf').

