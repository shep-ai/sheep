# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 091 follows the established architecture pattern from 90+ preceding features (069-090).
  The implementation is purely file-creation — no application code modifications, no test suite changes,
  no configuration updates. This design principle is core to the Sheep platform: test markdown files
  serve as minimal, isolated units of work for validating the automated implementation system.

  The architecture leverages Python standard library exclusively:
  - **pathlib.Path** for cross-platform file I/O with explicit encoding control
  - **subprocess** for git operations with proper error handling (check=True)
  - **built-in string operations** for markdown structure validation
  - **os.path.getsize()** for file size verification

  No external dependencies are introduced (matching NFR-7). This approach is identical to
  file_creation_089.py, file_creation_090.py, and all other established test implementations.

  ## Key Design Decisions

  ### 1. Content Generation: Deterministic Placeholder Prose
  **Chosen**: Hardcoded meaningful prose content
  **Alternatives Considered**: Random/creative content, template-based generation
  **Rationale**:
  All 90+ established test files use predetermined topics for reproducibility and consistency.
  Deterministic content ensures the automated platform can validate with predictable outcomes.
  The user query grants complete flexibility ("about anything"), so a fixed topic aligns with
  automated patterns where consistency and reproducibility are critical for validation.
  **Implementation Detail**: Select a meaningful prose topic (e.g., "Continuous Learning",
  "Resilience", "Growth") and write 2-3 sentences that are grammatically correct and semantically meaningful.

  ### 2. File I/O: pathlib.Path with Explicit Encoding Control
  **Chosen**: `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`
  **Alternatives Considered**: Built-in open(), third-party pathlib backports
  **Rationale**:
  pathlib is the modern, Pythonic standard for Python 3.4+. The write_text() method provides
  high-level file creation with automatic resource management. Critically, it supports explicit
  control over both encoding (UTF-8 without BOM) and line endings (Unix LF on all platforms).
  This single method call ensures full compliance with NFR-1 and NFR-2 without manual byte manipulation.
  All 90+ established test files use this same pattern.

  ### 3. Line Ending Strategy: Unix LF on Windows
  **Chosen**: `newline='\n'` parameter in write_text()
  **Alternatives Considered**: Platform defaults, manual LF insertion
  **Rationale**:
  The spec requires Unix-style LF line endings (NFR-2) even on Windows Server environment.
  Without explicit control, write_text() would produce platform-default CRLF on Windows.
  The newline='\n' parameter (standard Python 3.3+) forces Unix LF regardless of platform,
  ensuring consistency across development environments. This is preferred over manual byte-level
  manipulation which is more error-prone.

  ### 4. UTF-8 Encoding Without BOM
  **Chosen**: `encoding='utf-8'` in write_text() with validation
  **Alternatives Considered**: UTF-8-sig (with BOM), platform-dependent encoding
  **Rationale**:
  Python's encoding='utf-8' produces standard UTF-8 without Byte Order Mark (required by NFR-1).
  Using UTF-8-sig would add a 3-byte BOM (0xEF 0xBB 0xBF) causing validation failures.
  All established test files use encoding='utf-8' with binary validation to confirm BOM absence.

  ### 5. Validation Scope: Comprehensive Multi-Step Checks
  **Chosen**: Validate UTF-8, LF, markdown structure, sentence count, and file size
  **Alternatives Considered**: Basic file existence, no validation
  **Rationale**:
  The spec explicitly requires comprehensive validation (analysis section, NFR-1 through NFR-6).
  All 90+ established test files use detailed checks. Comprehensive validation ensures early
  detection of issues and aligns with platform quality standards. Validation catches encoding
  problems, structural issues, and size violations before proceeding to git operations.

  ### 6. Git Operations: subprocess with Explicit Error Handling
  **Chosen**: `subprocess.run(['git', ...], check=True)` for add, commit, and push
  **Alternatives Considered**: GitPython library, os.system()
  **Rationale**:
  subprocess is standard Python with superior error handling. The check=True parameter raises
  an exception immediately on failure, ensuring proper error propagation. Explicit argument arrays
  prevent command injection vulnerabilities. This pattern matches create_markdown.py and is more
  secure and testable than os.system(). No external library dependency needed for simple operations.

  ## Implementation Strategy

  **Phase 1: File Creation & Validation** comes first because:
  - File must exist before it can be staged for git operations
  - Validation runs on the created file, catching issues before git workflow
  - Early validation prevents pushing non-compliant files to the repository
  - Follows fail-fast principle: validate immediately and report errors

  **Phase 2: Git Integration & Verification** comes second because:
  - Only proceeds if Phase 1 validation passes
  - Stages the validated file, commits with conventional message, and pushes
  - Final verification ensures clean git working tree
  - Completes the feature workflow

  This two-phase approach mirrors the 90+ established implementations and ensures quality
  at each step before proceeding to the next.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Platform line endings on Windows | Use explicit `newline='\n'` parameter in pathlib.write_text() to force Unix LF regardless of platform |
  | UTF-8 BOM accidentally included | Use `encoding='utf-8'` (not 'utf-8-sig') and validate file binary content with `assert not content.startswith(b'\xef\xbb\xbf')` |
  | File size out of range | Validate file size is between 320-600 bytes before git staging |
  | Missing H1 heading or blank line | Parse file line-by-line and validate markdown structure matches spec (H1 + blank + prose) |
  | Incorrect sentence count | Count sentences using simple string operations (split on '.!?' and filter empty) before git staging |
  | Encoding mismatch on validation | Use pathlib.Path.read_bytes() to verify binary content, then decode('utf-8') for text validation |
  | Git operations fail silently | Use `subprocess.run(..., check=True)` to raise exception on any git command failure |
  | Pre-existing file collision | Check file doesn't exist before creation; spec guarantees no existing test-kbk06h.md |
  | Dirty working tree after push | Verify working tree with `git status` returns clean (no uncommitted changes or untracked files) |
