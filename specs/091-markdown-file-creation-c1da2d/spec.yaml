# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 90+ times. This feature creates a single
  test markdown file (`test-kbk06h.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 90+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-090.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI with comprehensive
  observability via Langfuse. The project is organized as follows:

  - **Root directory**: Contains 90+ test markdown files (test-*.md), Python scripts for markdown creation
    and git integration, configuration files (pyproject.toml, docker-compose.yml, .env.example)
  - **/src/sheep**: Main application code with agents, flows, config, tools, and CLI
  - **/specs**: Feature specifications organized by number (001-091 directories)
  - **/tests**: Test suite for the platform
  - **Language/Stack**: Python 3.11+, CrewAI framework, Git, Docker

  ### Architecture Patterns

  1. **Specification-Driven Development**: Features are defined in YAML specs with problem statement,
     requirements, success criteria, and affected areas
  2. **Git-Based Workflow**: Uses feature branches, conventional commits (feat(NNN): message), and push
     to origin for each implemented feature
  3. **Established Test Pattern**: 90+ prior features demonstrate identical markdown file creation pattern,
     showing clear architectural precedent and predictable workflow
  4. **Python Standard Library**: File I/O uses pathlib.Path for robustness; git operations use subprocess
  5. **File Validation**: Created files validated for UTF-8 encoding (no BOM), Unix LF line endings,
     correct markdown structure (H1 + blank line + 2-3 sentences), and appropriate file size (320-600 bytes)

  ### Relevant Technologies

  - **Python 3.11+**: pathlib module for cross-platform file I/O, subprocess for git command execution
  - **Markdown**: Standard format for content files with H1 heading and prose paragraphs
  - **Git**: Version control with conventional commit format (feat(NNN): description)
  - **CrewAI**: Framework for agentic implementation (used by Sheep platform, not directly by this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-kbk06h.md) to existing collection of 90+ test files; no modifications to existing files or structure |
  | File System | Low | Single file creation operation (~320-600 bytes); no directory creation, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch complexity, no destructive operations, feature branch pre-exists |
  | Source Code (/src/sheep) | None | Feature is purely file creation; does not depend on or impact application code |
  | Configuration | None | No modifications to pyproject.toml, .env, docker-compose.yml, or other configuration files |
  | Documentation | None | No changes to README.md or other documentation |
  | Tests | None | No test modifications required; feature is validated through file content checks |

  ## Dependencies

  - **Git repository state**: Feature branch `feat/091-markdown-file-creation-c1da2d` must already exist (pre-created)
  - **File system permissions**: Write access to repository root directory (standard in development environment)
  - **Established pattern**: 90+ test files provide clear precedent for content structure, format, and quality expectations (see test-rhubmf.md, test-objvv0.md, test-l20qnc.md, etc.)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib module available in Python 3.11+ (no external dependencies required)

  ## Functional Requirements

  - **FR-1**: System must create a file named `test-kbk06h.md` at the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (#) on the first line serving as the title
  - **FR-3**: File must contain a blank line immediately following the H1 heading
  - **FR-4**: File must contain exactly 2-3 sentences of prose content after the blank line
  - **FR-5**: Prose content must be grammatically correct and semantically meaningful
  - **FR-6**: File must be staged for commit using `git add test-kbk06h.md`
  - **FR-7**: Changes must be committed with conventional commit message: `feat(091): create markdown file test-kbk06h.md with prose content`
  - **FR-8**: Committed changes must be pushed to the feature branch `feat/091-markdown-file-creation-c1da2d`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (\n), not Windows CRLF (\r\n)
  - **NFR-3**: File size must be between 320-600 bytes, consistent with established pattern in features 069-090
  - **NFR-4**: Implementation must not modify, delete, or overwrite any existing files
  - **NFR-5**: Git working tree must be clean (no uncommitted changes) after the feature branch push
  - **NFR-6**: Implementation should follow established patterns from prior features (069-090) for consistency and maintainability
  - **NFR-7**: If implemented as a Python script, must use only Python 3.11+ standard library (pathlib for file I/O, subprocess for git operations) with no external dependencies

  ## Success Criteria

  - [ ] File `test-kbk06h.md` is created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (#) serving as the title
  - [ ] File contains 2-3 sentences of prose content following a blank line after the title
  - [ ] Prose content is grammatically correct and semantically meaningful
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix-style LF line endings (\n), not Windows CRLF
  - [ ] File size is between 320-600 bytes (consistent with established pattern)
  - [ ] File is staged with `git add test-kbk06h.md`
  - [ ] Commit message follows conventional format: `feat(091): create markdown file test-kbk06h.md with prose content`
  - [ ] Changes are successfully pushed to feature branch `feat/091-markdown-file-creation-c1da2d`
  - [ ] No existing files are modified, deleted, or overwritten
  - [ ] Git working tree is clean after push

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Implementation Strategy: Reusable utility or direct inline code? | **Reusable Python utility** | Spec explicitly mentions "Existing create_markdown.py script provides clear reference implementation" and 90+ prior features use this pattern. Utility-based approach enables code reuse, test coverage, and consistency. |
  | 2 | Content Topic: Deterministic placeholder or creative/varied content? | **Deterministic placeholder content** | Automated platform requires reproducibility and consistency. User query grants complete flexibility ("about anything"), so predetermined topic aligns with established automated patterns in features 069-090. |
  | 3 | Validation Level: Comprehensive checks or basic file existence? | **Comprehensive validation** | Analysis section specifies detailed validation for UTF-8 encoding, Unix LF, markdown structure, and size (320-600 bytes). Consistency with 90+ established test files is critical. |

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation following a well-established pattern:

  - **File creation**: ~5 minutes (write markdown heading + 2-3 sentences of prose with an appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size ~320-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total effort**: 10-15 minutes of actual work

  **Justification**:
  - Clear, well-established pattern demonstrated across 90+ prior features with identical requirements
  - Flexible topic selection with no research or architectural decisions required
  - Single file with straightforward content format (one H1 heading + 2-3 sentences of prose)
  - No testing, code modifications, or configuration changes required
  - Features 069-090 demonstrate efficient implementation of identical tasks in 10-15 minutes
  - Pattern is simple enough to implement without external libraries or complex logic
  - Existing create_markdown.py script provides clear reference implementation

