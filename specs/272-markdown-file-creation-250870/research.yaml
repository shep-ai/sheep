  - title: "Validation strategy: automated pre-commit validation"
    chosen: "Perform automated validation immediately after file write, before git commit"
    rejected:
      - "Skip validation — violates FR-5 and NFR-6, increases malformed file risk, deviates from proven pattern"
      - "Post-push validation — delays error detection, makes correction harder, violates fail-fast principle"
    rationale: >
      validate_markdown_file() performs comprehensive checks immediately after file creation: UTF-8 encoding
      without BOM, Unix LF line endings, H1 heading presence, blank line separator, sentence count 2-3, trailing
      newline. Checks are deterministic, fast (~1-2ms), catch ~95% of format errors before committing. Early
      validation catches errors before commit, reduces manual review, ensures consistency across 270+ files.
