# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-auuucp.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 99+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 099-118, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-auuucp.md` created in repository root directory
  - [ ] File contains exactly one H1 markdown heading (`# [Title]`)
  - [ ] File contains 2-3 sentences of prose content below the heading
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses LF (Unix-style) line endings
  - [ ] File size is between 300-600 bytes (consistent with established pattern)
  - [ ] File is staged to git with `git add test-auuucp.md`
  - [ ] Commit created with message format: `feat(119): Create markdown file test-auuucp.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/119-markdown-file-creation-36cf03`
  - [ ] No other files modified or created in repository root
  - [ ] No changes to source code (`/src/sheep/`) or configuration files

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-auuucp.md` in the repository root directory
  - **FR-2**: File must contain a single H1 markdown heading as the title (format: `# [Title]`)
  - **FR-3**: File must contain 2-3 sentences of prose content following the heading
  - **FR-4**: Stage the created file to git using `git add test-auuucp.md`
  - **FR-5**: Create a git commit with conventional commit message: `feat(119): Create markdown file test-auuucp.md with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/119-markdown-file-creation-36cf03` using `git push`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM, consistent with established pattern from features 099-118
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF or CR
  - **NFR-3**: File size should be approximately 300-600 bytes, following the pattern of 99+ existing test files
  - **NFR-4**: Implementation must follow straightforward imperative code pattern: create content string, write to file (no validation)
  - **NFR-5**: Implementation must not modify source code, configuration files, or test files
  - **NFR-6**: Implementation must follow the established pattern from features 099-118 exactly

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should file creation include validation checks for encoding/line endings/file size? | No validation — straightforward imperative pattern | Features 099-118 use simple create-and-write approach without validation. These are test artifacts, not production files. Validation adds unnecessary complexity. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 99+ test markdown files (test-*.md) following a consistent pattern, plus configuration and documentation files
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability) implementing the CrewAI-based automated implementation platform
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/119-markdown-file-creation-36cf03/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (requires Python >=3.11) with CrewAI, Pydantic, and other dependencies
  - **.github/**: GitHub workflows and CI/CD configuration
  - **README.md**: Project documentation describing the Sheep platform

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern (features 099-118) and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern (99+ precedents)**:
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 300-600 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/119-markdown-file-creation-36cf03`
  - Create/modify files in working directory
  - Stage with `git add test-auuucp.md`
  - Commit with conventional commit format: `feat(119): Create markdown file test-auuucp.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern (observed in features 099-118)**:
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-auuucp.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with heading (#) and prose content
  - **CrewAI**: Framework used in the Sheep platform (not directly involved in this feature)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-auuucp.md) to existing collection of 99+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 099-118; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/119-markdown-file-creation-36cf03` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 99+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 99+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (099-118) demonstrate efficient implementation of identical features in 10-15 minutes
  - Straightforward imperative code pattern (no validation) keeps implementation simple

