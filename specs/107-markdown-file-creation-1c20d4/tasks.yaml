# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature creates a single markdown test file and integrates it into version control.

  **Phase 1 (File Creation):** Create test-e39stk.md with pathlib.Path.write_text(),
  containing an H1 heading, blank line, and 2-3 sentences of prose. Verify UTF-8
  encoding, LF line endings, and file size (Task 1).

  **Phase 2 (Git Integration):** Execute git workflow to stage the file (Task 2),
  create a commit with conventional message (Task 3), and push to remote (Task 4).
  Each task is dependent on the previous one to ensure linear progression.

  **Task Flow:**
  1. Task 1 creates the markdown file using pathlib, verifying structure and encoding
  2. Task 2 stages the file with git add
  3. Task 3 commits with the exact conventional message format
  4. Task 4 pushes to the remote feature branch

  Total estimated effort is 30 minutes across 4 focused tasks. The implementation
  follows established patterns from 65+ precedent test files and requires no
  modifications to source code or configuration. No parallelization opportunities
  exist due to linear dependency chain (file must exist before staging, staging
  must complete before commit, commit must exist before push).
