  - question: "Should implementation use subprocess.run() or subprocess.check_call() for git commands?"
    resolved: true
    options:
      - option: "subprocess.run() with capture_output=True"
        description: >
          Captures stdout/stderr for inspection. Allows explicit return code checking. More verbose
          but provides visibility into git command output for debugging and CI/CD logs.
        selected: true
      - option: "subprocess.check_call()"
        description: >
          Automatically raises CalledProcessError on non-zero exit. Simpler but provides less output
          visibility. Requires try/except for error handling.
        selected: false
      - option: "subprocess.call()"
        description: >
          Returns exit code, no automatic error raising. Minimal abstraction but requires manual
          error checking. Least preferred for feature implementation.
        selected: false
    selectionRationale: >
      subprocess.run() is the modern, recommended approach in Python 3.7+ (current project uses 3.11+).
      Capturing output provides visibility into git operations (useful for debugging failed commits,
      understanding push results). The additional verbosity is minimal and aligns with good CI/CD
      practices of visible command output. Explicit return code checking (checking run().returncode)
      is clearer than implicit exception handling. This approach makes troubleshooting easier during
      feature implementation.

