content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-fyijj3.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 240+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-243, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-fyijj3.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the exact structure: `# Heading\n\n<2-3 sentences>`
  - [ ] Prose is thematically coherent and written in proper English with correct grammar and punctuation
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-fyijj3.md`
  - [ ] Git commit with exact message exists: `feat(244): create markdown file test-fyijj3.md with prose content`
  - [ ] Commit is created on the feature branch `feat/244-markdown-file-creation-ff64df`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-fyijj3.md` in the repository root directory (must use exact filename specified)
  - **FR-2**: File must contain exactly one H1 markdown heading (`#`) on the first line as the title
  - **FR-3**: File must contain exactly 2-3 sentences of prose content, separated from the heading by a blank line
  - **FR-4**: Stage the created file in git using `git add test-fyijj3.md` command
  - **FR-5**: Create a git commit with exact conventional commit message: `feat(244): create markdown file test-fyijj3.md with prose content`
  - **FR-6**: Push the commit to remote origin repository on the feature branch `feat/244-markdown-file-creation-ff64df`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark) — standard encoding for text files and consistency across the existing 240+ test files
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF (`\r\n`) — ensures consistency across platforms and matches all existing test files
  - **NFR-3**: Prose content must be thematically coherent and written in proper English with correct grammar and punctuation — maintains quality standard of existing files
  - **NFR-4**: File size should naturally fall within the 400-600 byte range as a consequence of proper structure — expected outcome of one H1 heading plus 2-3 sentences
  - **NFR-5**: Implementation must follow the established pattern from features 069-243 with identical structure and workflow for consistency — ensures compatibility with existing test infrastructure
  - **NFR-6**: Implementation must not modify any source code files in `/src/sheep/` or configuration files — file creation only, isolation of test artifacts
  - **NFR-7**: Commit must be created on the correct feature branch `feat/244-markdown-file-creation-ff64df` with no branch switches or merges — maintains feature branch isolation

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Validation approach: automated vs. manual? | Manual verification using checklist | Success criteria are explicit; all 240+ precedents use this approach; added validation infrastructure unnecessary |
  | 2 | Prose topic: implementer choice or assigned? | Implementer chooses any topic | All 240+ files use diverse topics; flexibility speeds implementation; no architectural constraint on topic |
  | 3 | Prose quality level: strict or lenient? | Strict enforcement | NFR-3 requires proper grammar and coherence; matches quality of 240+ existing files; simple feature allows high-quality prose |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-fyijj3.md) to existing collection of 240+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-243; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/244-markdown-file-creation-ff64df` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 240+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-fyijj3.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness using manual checklist)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 240+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (240-243) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-fyijj3.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 175+ prior implementations
  - Manual validation approach keeps process lightweight and straightforward
