# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation spans three phases with clear dependencies and TDD cycles for each task.

  **Phase 1: File Creation & Content** — Task 1 creates the markdown file using pathlib with explicit UTF-8 encoding. Prose content is generated via Claude API (with hardcoded fallback) to ensure quality. File structure (H1 heading + blank line + 2-3 sentences) is constructed and written in one operation.

  **Phase 2: Validation & Encoding** — Task 2 validates the created file before any git operations. Programmatic checks verify UTF-8 encoding (no BOM), Unix LF line endings (no CRLF), proper markdown structure (H1, blank line, sentences), and file size range (350-650 bytes). Errors are caught early and reported clearly.

  **Phase 3: Git Integration** — Task 3 completes the workflow. File is staged with `git add`, committed with the exact conventional message, and pushed to the feature branch. subprocess.run() with list arguments ensures portability and safety (no shell injection risk).

  Linear dependency chain (task-1 → task-2 → task-3) ensures file exists before validation, and file is validated before git operations. No parallel work; each phase builds on the previous.

  Total estimated effort: 1h 20min, including prose generation logic, validation implementation, and git integration. Follows TDD methodology: RED (write tests that fail), GREEN (implement minimal code to pass), REFACTOR (clean up and organize).
