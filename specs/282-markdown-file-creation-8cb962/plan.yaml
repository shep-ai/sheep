content: |
  ## Architecture Overview

  Feature 282 leverages a proven three-layer architecture already established across 280+ prior features:

  ### Layer 1: Orchestration (Existing)
  The `src/sheep/content_generators.create_markdown_file()` function (already exists, no code to write)
  handles all heavy lifting:
  - **Generation**: Calls Claude API via CrewAI's get_reasoning_llm() with MARKDOWN_GENERATION_PROMPT
  - **Validation**: Two-phase validation (content validation post-generation, file validation post-write)
  - **File I/O**: Writes with UTF-8 encoding, enforces Unix LF line endings
  - **Git Operations**: Stages, commits with conventional message, pushes with upstream tracking
  - **Error Handling**: Comprehensive logging and exception propagation

  ### Layer 2: Wrapper Script (To Be Implemented)
  Lightweight entry point (`specs/282-markdown-file-creation-8cb962/create_markdown_file.py`) that:
  - Imports sys.path manipulation to locate src/sheep modules (follows feature 279 pattern)
  - Calls create_markdown_file(filename="test-9xt2ec.md", feature_number=282)
  - Catches exceptions and displays formatted output
  - Returns exit code for CI/CD integration

  ### Layer 3: Test Suite (To Be Implemented)
  Comprehensive pytest suite (`specs/282-markdown-file-creation-8cb962/test_create_markdown_file.py`) covering:
  - **Unit Tests**: Wrapper script imports, argument handling
  - **Integration Tests**: Mocked calls to orchestration function
  - **Validation Tests**: Encoding (UTF-8, no BOM), structure (H1, blank line), content (2-3 sentences), size (400-600 bytes)
  - **Git Tests**: Commit message format, push operations (mocked)

  ## Key Design Decisions

  ### Decision 1: Use Existing Orchestration Function (Not Custom Implementation)
  **Chosen:** Leverage `src/sheep/content_generators.create_markdown_file()`

  **Rationale:** This function is proven across 280+ prior markdown file creation features. It handles
  all 15 functional requirements (generation, validation, encoding, line endings, size checking, git ops)
  in a single coordinated workflow. Custom implementation would duplicate validated code, increase testing
  burden, and risk introducing bugs. Per NFR-2, no modifications to core Sheep platform code are allowed,
  so using existing utilities is the only appropriate approach.

  ### Decision 2: Lightweight Wrapper Script Over Direct Test Invocation
  **Chosen:** Create standalone wrapper script in specs/282-*/create_markdown_file.py

  **Rationale:** Feature 279 (and 280+ prior features) demonstrate this pattern works perfectly. Wrapper
  script provides clean CI/CD entry point that can be invoked with `python create_markdown_file.py`.
  Allows formatted output display for user feedback. Takes ~15 minutes to implement. Maintains consistency
  with established patterns.

  ### Decision 3: Comprehensive Test Suite with Mocking (Not Minimal or Integration Only)
  **Chosen:** Pytest suite covering all validation aspects using unittest.mock

  **Rationale:** Specification lists 12 success criteria and 15 functional requirements — all must be tested.
  Mocking prevents external dependencies (API calls, git network ops) while validating integration logic.
  Matches feature 279 pattern which passed all CI checks. Comprehensive coverage catches encoding/structure/size
  issues early before pushing to repository.

  ### Decision 4: Strict Validation Enforcement (Not Lenient)
  **Chosen:** Enforce all constraints exactly — 2-3 sentences, 400-600 bytes, UTF-8, LF endings, no BOM

  **Rationale:** Specification explicitly defines all constraints. Validation functions in content_generators.py
  check all of them. Leniency would introduce specification drift. Strict approach guarantees all success
  criteria are met and matches 280+ prior features.

  ### Decision 5: Unconstrained Content Generation (Any Topic)
  **Chosen:** Claude API generates prose autonomously on any topic (no Sheep-project constraint)

  **Rationale:** User query explicitly states "about anything". All 280+ prior features show topic variance
  is both acceptable and expected. Unconstrained generation maximizes content diversity, requires no additional
  prompt tuning, and aligns with FR-6 (AI-chosen topic). Cleaner implementation with no topic filtering logic.

  ## Implementation Strategy

  ### Phase 1: Setup (10 minutes)
  - Create specs/282-markdown-file-creation-8cb962/ directory (already exists, verify structure)
  - Validate ANTHROPIC_API_KEY environment variable is set
  - Verify src/sheep modules are importable (sys.path setup needed)
  - Verify git repository state (origin remote, writable filesystem)

  ### Phase 2: Wrapper Script (15 minutes)
  - Create minimal create_markdown_file.py (~30 lines) that:
    - Imports necessary modules (sys, pathlib, src/sheep.content_generators)
    - Calls create_markdown_file(filename="test-9xt2ec.md", feature_number=282)
    - Catches exceptions and prints descriptive error messages
    - Displays result (filepath, bytes, commit hash, push status)
    - Returns exit code (0 for success, 1 for failure)
  - Follow exact structure from feature 279 for consistency

  ### Phase 3: Test Suite (35 minutes)
  - Create test_create_markdown_file.py with comprehensive test classes:
    - **TestWrapperScript** (5 tests): Imports, arg handling, error cases
    - **TestOrchestrationIntegration** (4 tests): Mocked create_markdown_file() calls
    - **TestMarkdownValidation** (8 tests): H1 heading, blank line, sentence count, encoding
    - **TestFileProperties** (4 tests): Size validation, UTF-8 without BOM, LF line endings
    - **TestGitIntegration** (3 tests): Commit message format, push operations (mocked)
  - Use unittest.mock.patch for LLM and git tool mocking
  - Use tempfile.TemporaryDirectory for isolated test environments
  - Total ~450 lines following feature 279 test pattern

  ### Phase 4: Execution & Validation (10 minutes)
  - Run pytest to execute all tests
  - Run `python create_markdown_file.py` to create actual file
  - Verify test-9xt2ec.md exists in repository root with correct properties
  - Verify git commit and push operations completed
  - Commit plan and task files with conventional message

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM API unavailable | Low | Blocks feature (retry) | API status monitoring, ANTHROPIC_API_KEY validation before execution |
  | Git push fails (no remote) | Very Low | Local commit OK, retry push | Repository setup validation during phase 1 |
  | File size outside 400-600 bytes | Low | Content validation catches it | Prompt template from content_generators.py ensures sufficient content |
  | Encoding issues on Windows | Low | Platform-specific (Linux CI/CD) | Binary validation checks H1, no BOM, LF-only line endings |
  | Test flakiness from mocking | Very Low | Test suite unreliable | Clear mock setup, isolated fixtures, deterministic outputs matching feature 279 |
  | Import failures (sys.path) | Low | Script won't run | Follow feature 279 sys.path.insert pattern exactly |

  ## Technical Rationale

  ### Why Existing Orchestration Function?
  The `create_markdown_file()` function in src/sheep/content_generators.py is mature, well-tested,
  and successfully proven across 280+ prior markdown file creation features. It provides:
  - **Unified API**: Single function call handles all 15 functional requirements
  - **Comprehensive Validation**: Two-phase approach (content + file) catches all error conditions
  - **Proven Error Handling**: Logging and exception handling are battle-tested
  - **No Code Duplication**: Writing custom logic would duplicate validated code
  - **Consistency**: Matches all 280+ prior features exactly (same function, same pattern)
  - **Low Risk**: Using existing code is lower risk than custom implementation

  ### Why Comprehensive Testing?
  Specification requires validation of all 15 functional requirements and 12 success criteria.
  Comprehensive test suite ensures:
  - **All Requirements Met**: Each FR has corresponding test
  - **Early Detection**: Encoding/structure/size issues caught before git push
  - **CI/CD Integration**: Mocked tests run without external dependencies
  - **Maintainability**: Clear test structure matches feature 279 pattern
  - **Confidence**: Passing tests guarantee file integrity before push

  ### Why TDD with Mocking?
  Test-Driven Development with mocks provides:
  - **No External Dependencies**: Tests don't require LLM API or git network access
  - **Isolation**: Each test validates one aspect in controlled environment
  - **Repeatability**: Deterministic outputs, no flakiness from external systems
  - **Fast Feedback**: Tests complete in seconds, not minutes
  - **Feature 279 Proof**: Prior feature demonstrates this pattern works perfectly

  ## Performance Profile

  Expected runtime (end-to-end):
  - Content generation (LLM API): 1-2 seconds
  - Content validation: <10ms
  - File write: <50ms
  - File validation: <10ms
  - Git commit: 100-200ms
  - Git push: 1-3 seconds
  - **Total: 4-6 seconds** (acceptable for CI/CD)

  No performance optimizations needed. LLM API is primary bottleneck (not under our control).

  ## Security Analysis

  - **Path Traversal**: write_markdown_file() rejects filenames with `/`, `\`, `.` prefix
  - **Encoding Safety**: UTF-8 validation catches invalid byte sequences, BOM check prevents injection
  - **API Credentials**: ANTHROPIC_API_KEY from environment only (not hardcoded)
  - **Git Safety**: Custom GitCommitTool/GitPushTool prevent shell injection
  - **Content Validation**: LLM output validated before write, file validated after write

  ## Success Criteria (From Feature Spec)

  All success criteria are mapped to implementation tasks:
  - [ ] File `test-9xt2ec.md` exists → Phase 4 execution
  - [ ] H1 heading validation → Phase 3 tests + Phase 4 execution
  - [ ] Blank line separator → Phase 3 tests + Phase 4 execution
  - [ ] 2-3 sentences → Phase 3 tests + Phase 4 execution
  - [ ] UTF-8 without BOM → Phase 3 tests + Phase 4 execution
  - [ ] Unix LF endings → Phase 3 tests + Phase 4 execution
  - [ ] File size 400-600 bytes → Phase 3 tests + Phase 4 execution
  - [ ] Git staging → Phase 2 wrapper + Phase 3 tests
  - [ ] Conventional commit → Phase 2 wrapper + Phase 3 tests
  - [ ] Push with upstream → Phase 2 wrapper + Phase 3 tests
  - [ ] All tests pass → Phase 4 execution
  - [ ] CI/CD succeeds → Phase 4 execution (GitHub Actions)
