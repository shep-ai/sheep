content: |
  ## Task Execution Summary

  This task breakdown implements feature 282 across 4 phases with a total estimated effort of ~65 minutes.

  ### Phase 1: Setup (10 minutes)
  Tasks 1-2 establish the foundation: directory structure and environment validation.
  These are prerequisites that ensure all runtime dependencies are available before
  implementation begins. No code is written; setup is verification-only.

  ### Phase 2: Wrapper Script (15 minutes)
  Task 3 implements the lightweight wrapper script that orchestrates file creation.
  The script is minimal (~30 lines) and delegates all heavy lifting to the existing
  create_markdown_file() function from src/sheep/content_generators.py. TDD cycle
  ensures the wrapper correctly calls the orchestration function with proper arguments.

  ### Phase 3: Comprehensive Test Suite (35 minutes)
  Tasks 4-6 build the pytest test suite with three focused test classes:
  - **TestWrapperScript** (task-4): Tests the wrapper script itself
  - **TestMarkdownValidation** (task-5): Tests all markdown file constraints
  - **TestGitIntegration** (task-6): Tests git operations (stage, commit, push)

  All tests use unittest.mock to mock external dependencies (LLM API, git commands),
  ensuring tests are fast, deterministic, and don't require external resources.
  Comprehensive coverage validates all 15 functional requirements and 12 success criteria.

  ### Phase 4: Validation & Execution (15 minutes)
  Tasks 7-9 execute and validate the implementation:
  - **Task 7**: Run full test suite to confirm all tests pass
  - **Task 8**: Execute script to create actual file and verify properties
  - **Task 9**: Commit planning files (plan.yaml, tasks.yaml) to repository

  ## Task Dependencies

  Task dependency flow ensures proper ordering:
  ```
  task-1 (setup)
    ↓
  task-2 (validate env)
    ↓
  task-3 (wrapper script) [TDD: write test, implement, refactor]
    ↓
  task-4 (wrapper tests) [TDD: write tests that call task-3 script]
    ↓
  task-5 (validation tests) [TDD: validation-specific tests]
    ↓
  task-6 (git tests) [TDD: git operation tests]
    ↓
  task-7 (run tests)
    ↓
  task-8 (execute & verify)
    ↓
  task-9 (commit & push)
  ```

  Each task builds on prior tasks. No circular dependencies. Linear execution path ensures
  clean separation of concerns: setup → implementation → testing → execution → completion.

  ## TDD Approach

  All code tasks (3, 4, 5, 6) follow RED-GREEN-REFACTOR cycle:

  1. **RED**: Write test assertions that express the desired behavior
  2. **GREEN**: Implement minimal code to pass the tests
  3. **REFACTOR**: Clean up code quality, extract helpers, improve naming

  This ensures:
  - Tests are written first (before code exists)
  - Implementation matches test requirements exactly
  - Code quality is maintained through refactoring phase
  - Regression prevention (tests must pass after refactoring)

  Non-code tasks (1, 2, 7, 8, 9) don't follow TDD — they're verification or execution tasks.

  ## Effort Estimate Breakdown

  | Phase | Tasks | Description | Effort |
  | ----- | ----- | ----------- | ------ |
  | 1 | 1-2 | Setup & validation | 10m |
  | 2 | 3 | Wrapper script (TDD) | 15m |
  | 3 | 4-6 | Test suite (TDD) | 35m |
  | 4 | 7-9 | Execution & completion | 15m |
  | **Total** | **9 tasks** | **All phases** | **65m** |

  Estimate fits within size budget (S = 30-60 minutes). Accounts for writing tests first (TDD),
  mocking setup complexity, and comprehensive validation coverage. The 65-minute estimate
  allows for realistic time spent on assertion clarity, mock setup, and refactoring.

  ## Success Criteria Mapping

  Each task directly implements features from the spec:

  - **Task 1**: Creates required directory structure
  - **Task 2**: Validates prerequisites (ANTHROPIC_API_KEY, git, Python)
  - **Task 3**: Implements wrapper that creates actual file (FR-1, FR-13, FR-14)
  - **Task 4**: Tests wrapper behavior (indirect validation of FR-10, FR-11, FR-12)
  - **Task 5**: Tests all markdown properties (FR-2 through FR-9)
  - **Task 6**: Tests git operations (FR-10, FR-11, FR-12)
  - **Task 7**: Confirms all tests pass (success criteria #11)
  - **Task 8**: Verifies file creation in real execution (success criteria #1-10, #12)
  - **Task 9**: Commits planning phase work (project milestone)

  All 15 functional requirements (FR-1 through FR-15) are covered by tasks 3-6.
  All 12 success criteria are validated by tasks 7-8.
