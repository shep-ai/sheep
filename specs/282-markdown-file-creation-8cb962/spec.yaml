content: |
  ## Problem Statement

  Create a single markdown file called `test-9xt2ec.md` in the repository root with an H1 heading as title and 2-3 sentences of prose content. This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established pattern and convention used throughout 280+ previous iterations in this repository.

  The file must conform to established markdown conventions and file requirements:
  - H1 heading as title (e.g., `# A Meaningful Title`)
  - Blank line separator between heading and prose
  - 2-3 sentences of prose content (counted by periods)
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - File size 400-600 bytes
  - Staged, committed, and pushed via Git with conventional commit format
  - Generated via Claude API for content autonomy

  ## Success Criteria

  - [ ] File `test-9xt2ec.md` exists in repository root (no subdirectories)
  - [ ] File contains exactly one H1 heading (matches pattern `# Title`)
  - [ ] File contains exactly one blank line after the H1 heading
  - [ ] File contains exactly 2-3 sentences of prose content (separated by periods)
  - [ ] File is encoded in UTF-8 without BOM
  - [ ] File uses Unix LF line endings (verified via git or od -c)
  - [ ] File size is between 400-600 bytes (inclusive)
  - [ ] File is staged with git add
  - [ ] File is committed with conventional commit message: `feat(282): create markdown file test-9xt2ec.md with title and prose content`
  - [ ] Commit is pushed to origin with upstream tracking set
  - [ ] All pytest tests pass (structure, encoding, size, git integration)
  - [ ] GitHub Actions CI/CD pipeline succeeds

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-9xt2ec.md` in repository root using pathlib
  - **FR-2**: Generate H1 heading via Claude API with natural, coherent title text
  - **FR-3**: Generate 2-3 sentences of prose content via Claude API with natural language
  - **FR-4**: Validate generated content has exactly one H1 heading before writing to disk
  - **FR-5**: Validate blank line exists between H1 heading and prose content
  - **FR-6**: Validate prose content contains exactly 2-3 sentences (period-delimited)
  - **FR-7**: Write file with UTF-8 encoding without BOM
  - **FR-8**: Normalize line endings to Unix LF (convert any CRLF to LF)
  - **FR-9**: Validate final file size is 400-600 bytes before git staging
  - **FR-10**: Stage file using `git add test-9xt2ec.md`
  - **FR-11**: Create commit with conventional message format `feat(282): create markdown file test-9xt2ec.md with title and prose content`
  - **FR-12**: Push commit to origin with `-u` flag to set upstream tracking
  - **FR-13**: Use existing `sheep.content_generators.create_markdown_file()` function for orchestration
  - **FR-14**: Implement minimal wrapper script in `specs/282-markdown-file-creation-8cb962/create_markdown_file.py`
  - **FR-15**: Display implementation results (filepath, byte count, commit hash, push status)

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow established pattern from 280+ prior features (file structure, import layout, function calls)
  - **NFR-2**: No modifications to core Sheep platform code (src/sheep/) — use only existing utilities
  - **NFR-3**: No changes to configuration or dependency management
  - **NFR-4**: ANTHROPIC_API_KEY environment variable must be available at runtime
  - **NFR-5**: Git repository must have remote origin configured with SSH/HTTPS access
  - **NFR-6**: Generated content must be completely autonomous (AI-chosen topic, no human override)
  - **NFR-7**: All validation errors must be descriptive and actionable (not silent failures)
  - **NFR-8**: Test suite must provide comprehensive coverage matching prior features (unit + integration + validation tests)
  - **NFR-9**: Git operations must not modify working directory beyond creating the target file
  - **NFR-10**: Implementation must be completable in 30-60 minutes (S estimate must hold)

  ## Product Decisions & AI Recommendations

  | # | Decision | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Prose topic autonomy | Unconstrained (any topic) | User query explicitly states "about anything"; aligns with 280+ prior features showing topic variance is expected and acceptable |
  | 2 | Implementation approach | Use shared create_markdown_file() | Maintains consistency with all prior iterations; existing function handles all requirements (API, validation, git); avoids code duplication and risk |
  | 3 | Test coverage | Comprehensive (all validation) | Matches 280+ prior patterns; catches encoding/structure/size edge cases; provides confidence in file integrity before push |
  | 4 | Validation strictness | Strict enforcement | Specification explicitly defines constraints; prior features enforce successfully; leniency would introduce inconsistency and drift |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (new file) | High | Creation of test-9xt2ec.md file in repository root following established naming convention |
  | specs/282-markdown-file-creation-8cb962/ | Medium | Implementation scripts (create_markdown_file.py, test_create_markdown_file.py) must be created following established pattern from 280+ prior features |
  | Git history | High | New commit will be added with conventional commit message feat(282): create test-9xt2ec.md... |
  | Remote repository | High | New file and commit will be pushed to origin, affecting remote branch state |
  | src/sheep/content_generators.py | None | Shared module already exists and supports this task; no modifications needed |
  | Project patterns | None | No changes to existing infrastructure; strictly follows established pattern from 280+ prior features |

  ## Dependencies

  **External Dependencies**:
  - Python 3.6+ (for pathlib and subprocess modules)
  - Git (for version control operations)
  - GitHub (for remote repository and CI/CD)
  - Anthropic SDK (for Claude API access)
  - pytest (for test execution)

  **Internal Dependencies**:
  - `src/sheep/content_generators.py` - Core orchestration module with `create_markdown_file()` function
  - Established markdown file pattern and conventions (proven across 280+ prior features)
  - Conventional commit message format already in use throughout repository
  - File structure template: H1 heading + blank line + prose content
  - UTF-8 encoding and LF line endings requirements

  **No Application Code Dependencies**:
  - This feature does not depend on any application source code changes
  - Uses only existing utilities and established patterns
  - No modifications needed to core Sheep platform

  ## Size Estimate

  **S** (Small - implementable in hours) — The implementation is straightforward because:

  1. **Established Pattern**: 280+ prior features follow an identical implementation pattern. The Python script structure is proven and repeatable.
  2. **Simple File Creation**: Core task is creating a single markdown file with ~400-600 bytes of content (H1 title + 2-3 sentences).
  3. **Known Workflow**: Validation and git operations follow the exact same sequence as all prior features (specs/*/create_markdown_file.py).
  4. **No Complexity**: Unlike features that involve code changes, architecture decisions, or infrastructure setup, this is purely file creation and git operations.
  5. **Minimal Testing**: Validation is straightforward (file exists, has H1 heading, has prose content, proper encoding).
  6. **Shared Infrastructure**: All heavy lifting is handled by `src/sheep/content_generators.py`, which is mature and well-tested.

  Implementation effort: ~30-60 minutes including file creation, validation, testing, and git operations.
