content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-vt032y.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is a continuation of the markdown-file-creation pattern established in features 063-112, with
  identical requirements and implementation approach. The repository currently contains 112+ test markdown
  files following this consistent pattern, serving as both functional examples and test artifacts for the
  Sheep automation platform.

  ## Success Criteria

  - [ ] File `test-vt032y.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) followed by a space and heading text
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] Heading and prose are separated by exactly one blank line (LF-only)
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings only (`\n`, no CRLF or mixed)
  - [ ] File size is between 400-600 bytes
  - [ ] Prose content is simple and generic in style (2-3 basic sentences)
  - [ ] Prose covers a freely chosen arbitrary topic (no domain restrictions)
  - [ ] File is staged in git using `git add test-vt032y.md`
  - [ ] Git commit with message exactly: `feat(113): create markdown file test-vt032y.md with prose content`
  - [ ] Commit is on the feature branch `feat/113-markdown-file-creation-7a465a`
  - [ ] Changes are pushed to remote origin on the feature branch

  ## Functional Requirements

  - **FR-1**: Create a markdown file with filename `test-vt032y.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading using the syntax `# <heading text>`
  - **FR-3**: File must contain 2-3 sentences of prose content separated from the heading by one blank line
  - **FR-4**: Prose content must be simple and generic in style with minimal effort/complexity
  - **FR-5**: Prose topic must be freely chosen (arbitrary domain, no restrictions)
  - **FR-6**: File must be encoded as UTF-8 without BOM (byte order mark)
  - **FR-7**: File must use exclusively LF line endings (`\n`), no CRLF or mixed line endings
  - **FR-8**: File must be staged in the git index using `git add test-vt032y.md`
  - **FR-9**: File must be committed with conventional commit message: `feat(113): create markdown file test-vt032y.md with prose content`
  - **FR-10**: Commit must be created on the feature branch `feat/113-markdown-file-creation-7a465a`
  - **FR-11**: Commit and all changes must be pushed to remote origin on the feature branch

  ## Non-Functional Requirements

  - **NFR-1**: File size should be between 400-600 bytes, matching the established pattern from 112+ prior test files
  - **NFR-2**: Implementation must use Python pathlib (pathlib.Path.write_text()) for file creation to maintain consistency with established pattern
  - **NFR-3**: No modifications to existing files, source code, configuration, or test files are permitted
  - **NFR-4**: No external dependencies required; use Python 3.11+ standard library only
  - **NFR-5**: Implementation should follow straightforward imperative code pattern: create content string, write to file
  - **NFR-6**: Feature must not impact source code in `/src/sheep/`, tests, or project configuration
  - **NFR-7**: Compliance with existing file creation patterns from features 063-112 for consistency and maintainability

  ## Product Decisions

  All product questions have been resolved with AI-recommended defaults:
  - **Prose Topic**: Freely chosen arbitrary topic (maximum flexibility, aligns with user intent)
  - **Prose Style**: Simple and generic prose (lightweight, test artifact appropriate)
  - **Implementation Technology**: Python pathlib (consistency with 112+ prior features)

  These decisions enable straightforward implementation with clear guidance.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-vt032y.md) to existing collection of 112+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 063-112; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/113-markdown-file-creation-7a465a` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 112+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Current feature branch**: Implementation must occur on feat/113-markdown-file-creation-7a465a (already checked out)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with chosen topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 112+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (100-112) demonstrate efficient implementation of identical features in 10-15 minutes
  - Straightforward git workflow with no merge complexity or branch management

  ---

  _Requirements phase complete — all product decisions resolved, ready for implementation_
