content: |
  ## Problem Statement

  Feature 302 requires creating a single markdown file named test-k6bwm0.md with:
  - An H1 markdown heading (# Title) as the first line
  - A blank line separator between heading and prose
  - Exactly 2-3 sentences of coherent prose content about any topic
  - UTF-8 encoding with no BOM (byte order mark)
  - Unix LF line endings (not CRLF)
  - Git staging, commit with conventional message format, and push to remote
  - File placed at repository root

  This continues the well-established feature pattern successfully executed 300+ times in the Sheep codebase. Feature 302 follows the identical requirements, infrastructure, and implementation approach as features 297-301.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **`/src/sheep/`** — Main Python package containing all application logic
    - `content_generators.py` — Core orchestration functions for markdown file creation, validation, and git operations
    - `cli.py` — Command-line interface for feature execution
    - `config/` — Configuration management (LLM settings, application settings)
    - `features/` — Individual feature implementations (feature_*.py files)
    - `agents/` — CrewAI agent definitions for automated workflows
    - `tools/` — Tool definitions for git operations and file manipulation
    - `observability/` — Logging and monitoring utilities
    - `flows/` — High-level orchestration flows

  - **`/specs/`** — Feature specifications (100+ numbered features with YAML specs)
    - Each feature has its own directory: `XXX-markdown-file-creation-HASH/`
    - Contains spec.yaml (requirements), feature.yaml, research.yaml, plan.yaml, tasks.yaml

  - **Repository root** — Contains 300+ generated test markdown files (`test-*.md`)

  ### Architecture Patterns

  The codebase follows a highly modular, service-oriented architecture:

  1. **Content Generation Pipeline** — Defined in `content_generators.py`
     - Separation of concerns: generation → writing → validation → git operations
     - Each step is a discrete function that can be called independently or as part of orchestration
     - Comprehensive validation at each stage before proceeding

  2. **Infrastructure-as-Code** — Proven infrastructure components
     - All markdown file creation logic is centralized in `content_generators.py`
     - Features 297-301 (and 100+ before) all reuse the same orchestration functions
     - No duplication; each feature is a thin wrapper calling `create_markdown_file()`

  3. **Git Integration** — Subprocess-based git operations
     - Git commands executed directly via subprocess in content_generators.py
     - Conventional commit message format: `feat(N): create markdown file test-HASH.md with prose content`
     - Upstream tracking enabled (`git push -u origin BRANCH`)

  4. **Logging & Observability** — Structured logging throughout
     - All functions use `get_logger(__name__)` from `sheep.observability.logging`
     - Debug, info, warning, and error levels used appropriately
     - Logging is non-intrusive; doesn't affect feature execution

  5. **Error Handling** — Explicit exception raising
     - File operations raise IOError/OSError on failure
     - Validation raises ValueError with descriptive messages
     - Git operations raise subprocess.CalledProcessError
     - Features fail explicitly rather than silently; user gets clear error messages

  ### Relevant Technologies

  **Python Stack**:
  - **Python 3.11+** — Runtime environment
  - **pathlib** — Cross-platform file path operations (already in stdlib)
  - **subprocess** — For git command execution
  - **UTF-8 encoding/decoding** — Built-in string handling

  **External Services**:
  - **Anthropic Claude API** — LLM for generating prose content (configured in `config/llm.py`)
  - **CrewAI** — Agent framework (indirect; provides LLM factory pattern used by content_generators.py)

  **Version Control**:
  - **Git CLI** — For staging, committing, and pushing (called via subprocess)
  - **Conventional Commits** — Message format standard for all features

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/content_generators.py` | None | All infrastructure is already implemented and tested. Only needs to be invoked with `filename="test-k6bwm0.md"` and `feature_number=302`. |
  | `src/sheep/features/` | High | New feature module `feature_302_markdown_file_creation.py` will be created following the established pattern from features 297-301. Simple wrapper function calling `create_markdown_file()`. |
  | Repository root | High | Output location where `test-k6bwm0.md` will be created and persisted with 300+ other test files. |
  | `.git/` directory | Medium | Git operations will stage, commit, and push changes to remote. Commit message added to git history. |
  | Specs directory | Low | This spec.yaml file will be updated during analysis phase. No other specs affected. |
  | `src/sheep/config/llm.py` | None | No changes needed. LLM factory is pre-configured for content generation via `get_reasoning_llm()`. |
  | `src/sheep/cli.py` | None | No CLI changes required. Feature can be invoked directly via `create_markdown_file()` or via CLI if integrated. |

  ## Dependencies

  **Internal Infrastructure** (Already Implemented):
  - `sheep.content_generators.create_markdown_file()` — Main orchestration function that handles all steps: generate → write → validate → commit → push
  - `sheep.content_generators.generate_markdown_content()` — LLM-powered prose generation
  - `sheep.content_generators.write_markdown_file()` — File I/O with UTF-8 encoding
  - `sheep.content_generators.validate_markdown_file()` — Validation of format, encoding, line endings, sentence count
  - `sheep.content_generators.commit_markdown_file()` — Git staging and conventional commit
  - `sheep.content_generators.push_markdown_file()` — Push to remote with upstream tracking
  - `sheep.observability.logging.get_logger()` — Structured logging utility
  - `pathlib.Path` — Cross-platform path operations

  **External Services**:
  - **Anthropic Claude API** — Content generation (accessed via `sheep.config.llm.get_reasoning_llm()`)
  - **Git CLI** — Executable for git operations (subprocess calls)

  **Python Standard Library**:
  - `subprocess` — For git command execution
  - `pathlib` — For file path operations
  - Standard string/encoding functions

  **No New Dependencies Required** — All infrastructure is proven across 300+ prior features; no new packages, libraries, or external services needed.

  ## Size Estimate

  **S** (Small — 5-15 minutes) — Minimal-effort feature following established pattern:

  - **Feature module creation**: ~2-3 minutes (copy pattern from feature_301.py, update feature number and filename)
  - **Infrastructure invocation**: ~1 minute (call `create_markdown_file(filename="test-k6bwm0.md", feature_number=302)`)
  - **LLM content generation**: ~2-5 minutes (API call to Claude, validation of 2-3 sentences)
  - **File I/O and validation**: ~1-2 minutes (write, validate format/encoding/line endings)
  - **Git workflow**: ~2-3 minutes (add, commit, push to remote)
  - **Total estimated effort**: 8-15 minutes of actual execution

  **Justification**:
  - Well-proven pattern with 300+ identical implementations providing clear precedent
  - Core infrastructure in `content_generators.py` is mature, tested, and reusable
  - No architectural decisions, no research, no configuration changes needed
  - Implementation is purely a thin wrapper function following feature_301 template
  - Filename is pre-specified (test-k6bwm0.md), eliminating any naming decisions
  - Topic selection is completely open-ended (any topic, 2-3 sentences, any structure)
  - Git workflow is mechanical and proven across prior features
  - Recent features (297-301) demonstrate consistent 5-15 minute implementation times
  - No testing framework changes, no documentation updates, no complex logic required

  ---

  _Analysis phase complete — ready for requirements definition and implementation planning_
