content: |
  ## Architecture Overview

  Feature 302 follows the proven 300+ feature pattern in the Sheep repository. The implementation
  is a minimal wrapper around the existing `create_markdown_file()` orchestration function in
  `content_generators.py`. This design:

  - **Reuses proven infrastructure**: All complexity (content generation, validation, git ops) handled by existing orchestration function
  - **Maintains consistency**: Feature module pattern identical to features 297-301, allowing automated tooling and feature registry
  - **Provides clean entry point**: Feature-specific wrapper allows logging at feature level and enables CLI invocation
  - **Integrates seamlessly**: No modifications to existing modules; pure new feature code following established conventions

  ### Architecture Layers

  ```
  Feature CLI/Main
      ↓
  Feature Module (302) — entry point
      ↓
  Orchestration Layer — create_markdown_file()
      ├─→ Content Generation (generate_markdown_content via CrewAI + Claude)
      ├─→ File I/O (write_markdown_file with UTF-8, LF line endings)
      ├─→ Validation (validate_markdown_file with multi-layer checks)
      ├─→ Git Staging (stage file via git add)
      ├─→ Git Commit (conventional commit message format)
      └─→ Git Push (upstream tracking with -u flag)
  ```

  The feature module sits at the top, delegating all work to the orchestration function
  which is already integrated with LLM configuration, git tools, logging infrastructure,
  and validation framework.

  ## Key Design Decisions

  ### 1. Reuse Existing Orchestration Function

  **Chosen:** Call `create_markdown_file()` from `content_generators.py` with parameters:
  - `filename="test-k6bwm0.md"`
  - `repo_path=None` (defaults to cwd)
  - `feature_number=302`

  **Rationale (from research findings):**
  The `create_markdown_file()` function is battle-tested across 300+ features and encapsulates
  all steps: content generation via LLM (with 2-3 sentence validation), file writing with proper
  encoding/line endings, structural validation, git operations, and error handling. Reimplementing
  any of these steps would violate DRY principle, reduce code quality, and increase maintenance burden.

  **Alternatives rejected:**
  - Inline orchestration (duplicates logic, harder to maintain)
  - Direct subprocess/file operations (loses validation layer)
  - Different LLM framework (breaks consistency, adds configuration)

  ### 2. Feature Module Pattern from feature_301

  **Chosen:** Create thin wrapper module with:
  - Module-level constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME
  - Wrapper function: `create_test_k6bwm0_markdown_file()` → calls `create_markdown_file()`
  - Main entry point: `main()` with try-except, logging, and exit code

  **Rationale:**
  Features 297-301 establish this pattern which provides:
  - Consistent interface for feature registry and CLI
  - Feature-level logging for observability
  - Clear responsibility separation (feature metadata vs orchestration logic)
  - Reusable entry point for automation/CI-CD

  **Alternatives rejected:**
  - Monolithic module with helper functions (adds complexity, violates KISS)
  - Direct calls to orchestration without wrapper (breaks feature registry, harder to test)
  - Static content generation (violates FR-1: LLM content generation requirement)

  ### 3. Content Validation: Minimal, Proven Approach

  **Chosen:** Rely on existing validation in `create_markdown_file()` which includes:
  - Structure validation: H1 heading on line 1, blank separator, prose on following lines
  - Sentence count: exactly 2-3 sentences via period detection
  - File encoding: UTF-8 without BOM
  - Line endings: Unix LF (not CRLF or mixed)
  - Size minimum: 50 bytes (meaningful content)

  **Rationale (from research findings and spec product question):**
  The spec explicitly endorses minimal validation (strict 2-3 sentences) because LLM output
  consistently meets these criteria without extended validation (NLP metrics, flesch score, etc).
  The existing validation layer:
  - Is proven across 300+ features
  - Covers all functional requirements FR-3 through FR-6
  - Provides fail-fast semantics (catches errors during generation, not post-write)
  - Keeps implementation focused on core responsibility

  **Alternatives rejected:**
  - Skip validation (risky, violates data integrity)
  - Extended validation with NLP metrics (unnecessary per spec, adds complexity)
  - Custom validation in feature module (duplicates existing, harder to test)

  ### 4. Git Operations: Subprocess via Existing Tools

  **Chosen:** Use `commit_markdown_file()` and `push_markdown_file()` wrapped by `create_markdown_file()`

  **Rationale:**
  These functions use subprocess with proper quoting, automatic branch detection, upstream
  tracking (-u flag), and error handling (raise exceptions on failure per spec). They're proven
  across all prior features and integrate with git_tools.py infrastructure.

  **Alternatives rejected:**
  - Raw subprocess in feature module (verbose, loses error handling)
  - Direct GitCommitTool/GitPushTool (adds complexity, loses orchestration)
  - Shell-based git with shell=True (security risk, not used in codebase)

  ### 5. LLM Framework: CrewAI via Config Factory

  **Chosen:** Use `get_reasoning_llm()` factory from `config/llm.py` (called by orchestration function)

  **Rationale:**
  The factory pattern allows runtime model selection via settings.json without code changes.
  CrewAI provides abstraction over Anthropic API, handles prompt templating, response parsing,
  and integrates with observability. Feature module doesn't directly call LLM; orchestration
  function handles all LLM interactions.

  **Alternatives rejected:**
  - Direct Anthropic API calls (couples code to provider, loses abstraction)
  - Different LLM framework (breaks consistency across 300+ features)
  - Hardcoded model selection (loses flexibility, violates settings pattern)

  ## Implementation Strategy

  ### Phase 1: Feature Module Creation

  Create `src/sheep/features/feature_302_markdown_file_creation.py` following feature_301 pattern exactly:

  1. **Module header docstring** — document feature purpose, file, and workflow
  2. **Imports** — `create_markdown_file` from `content_generators`, logger from observability
  3. **Constants** — FEATURE_NUMBER=302, FEATURE_NAME="markdown-file-creation-c622f7", MARKDOWN_FILENAME="test-k6bwm0.md"
  4. **Logger setup** — `_logger = get_logger(__name__)`
  5. **Wrapper function** — `create_test_k6bwm0_markdown_file(repo_path: str | None = None) -> dict[str, str]`
     - Calls `create_markdown_file(filename=MARKDOWN_FILENAME, repo_path=repo_path, feature_number=FEATURE_NUMBER)`
     - Wraps in try-except with logging
     - Returns orchestration function result
  6. **Main entry point** — `main() -> int`
     - Calls wrapper function
     - Logs success and prints file info
     - Returns 0 on success, 1 on failure

  ### Phase 2: Integration Testing & Verification

  Test the complete feature execution:

  1. **Module import test** — verify feature_302_markdown_file_creation can be imported
  2. **Function execution test** — call `create_test_k6bwm0_markdown_file()` and verify it returns dict with expected keys
  3. **Output file verification** — check `test-k6bwm0.md` exists in repo root
  4. **Markdown structure validation** — verify H1 heading, blank line, prose format
  5. **Content validation** — confirm 2-3 sentences in prose section
  6. **Encoding validation** — verify UTF-8 without BOM
  7. **Line ending validation** — confirm Unix LF (not CRLF)
  8. **Git operations verification** — check git log shows feature 302 commit, verify push succeeded

  ## Risk Mitigation

  | Risk | Probability | Impact | Mitigation |
  | ---- | ----------- | ------ | ---------- |
  | Orchestration function doesn't exist or has changed API | Very Low | High | Reference implementation already uses create_markdown_file() successfully (feature 301); API stable across 300+ features |
  | LLM generates content that fails validation | Low | Medium | LLM is configured with temperature=0.2 for deterministic output; validation is multi-layer with fail-fast semantics |
  | File write fails (disk full, permission denied) | Very Low | High | File write uses proven path validation and error handling from write_markdown_file(); exceptions propagate clearly |
  | Git operations fail (auth, network, branch conflict) | Low | High | Git functions raise exceptions on failure with clear messages; user can diagnose and retry; pushing to feature branch minimizes conflict risk |
  | Path traversal attack with hardcoded filename | None | N/A | Filename is hardcoded as test-k6bwm0.md with no user input; no path traversal possible |
  | Module naming conflict or import issues | Very Low | Low | Follow feature_301 naming convention; module location is src/sheep/features/ which is established pattern |
  | Regression in existing infrastructure (content_generators.py) | Very Low | Critical | Feature 302 is lowest-risk feature type (pure wrapper); any regression would affect 300+ features and be caught immediately by automated testing |

  ## Effort Estimate

  **Total: 15-30 minutes**

  - **Phase 1 (Feature Module)**: 5-10 minutes
    - Copy feature_301 as template (1-2 min)
    - Update constants and function names (2-3 min)
    - Review for correctness (1-2 min)
    - Add to feature registry if needed (<1 min)

  - **Phase 2 (Integration Testing)**: 10-20 minutes
    - Run feature manually and verify output file (2-3 min)
    - Check git log and git status (1-2 min)
    - Verify file structure, encoding, line endings (2-3 min)
    - Run any automated tests (5-10 min depending on test framework)
    - Document any unexpected behavior (1-2 min)

  This estimate aligns with the spec's size estimate (S: 5-15 minutes) plus validation time.
  The feature is lowest-risk because it reuses proven infrastructure with no new code complexity.

  ---

  _Planning phase complete — ready for implementation and testing_
