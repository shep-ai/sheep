content: |
  ## Problem Statement

  Create a new markdown file called `test-tmardz.md` in the repository root with a title and 2-3 sentences of content about any topic. This continues the established pattern of the Sheep project, which maintains a collection of markdown content files serving various purposes (documentation, guides, state machines, examples, test files, etc.).

  All requirements are finalized and unambiguous. No product decisions are required; the feature scope and acceptance criteria are complete.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository structure includes:

  - **Root Directory**: Contains various markdown files (test files, design patterns, jokes, documentation, state machines) and configuration files (pyproject.toml, Dockerfile, docker-compose.yml)
  - **`/src/sheep`**: Python source code organized by function:
    - `agents/` — Agent definitions (code_agents.py)
    - `config/` — Configuration management (settings.py, llm.py)
    - `flows/` — Flow definitions for orchestration (code_implementation.py)
    - `observability/` — Logging and tracing (logging.py, langfuse_client.py)
    - `tools/` — Agent tools (git_tools.py, file_tools.py)
    - `cli.py` — CLI entry point
  - **`/specs`**: Feature specification directory with 46+ subdirectories (one per feature), each containing spec.yaml, research.yaml, feature.yaml, tasks.yaml, and plan.yaml files
  - **`/tests`**: Test files
  - **`.github`**: GitHub workflows for CI/CD
  - **Config Files**: pyproject.toml, .env.example, .gitignore, docker-compose.yml, Dockerfile, .dockerignore

  ### Architecture Patterns

  **Multi-Phase Feature Development**:
  - Each feature is defined in `/specs/<number>-<name>/spec.yaml` (source of truth)
  - Features progress through phases: Analysis → Requirements → Implementation → Review
  - Specifications are YAML-based with structured metadata and markdown content
  - Git features use conventional branch naming: `feat/<number>-<name>`

  **Established File Creation Pattern**:
  - Markdown files at repository root are simple content files
  - No special organization—files are added directly to root with descriptive names
  - File naming convention: `test-<random-id>.md` for test/example files
  - Content format: single H1 or H2 heading + 2-3 sentences (observed in test-5ito9r.md, test-r7uy00.md, test-g12aiq.md, etc.)
  - Git commit convention: `feat: Create <filename> markdown file about <topic>` or `feat(content): Create <filename> markdown file`

  ### Relevant Technologies

  - **Markdown**: Lightweight markup language for content files (no special processing required)
  - **Git**: Version control with conventional commit messages and feature branches
  - **GitHub**: Issue tracking and PR workflows (observed in commit history: #104–#108)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root | Low | Single new `.md` file added to root directory; no modifications to existing files |
  | Specs Directory | Low | Feature specification file (this file) documents the requirement; no implementation impact |
  | Source Code (`/src`) | None | No Python code, configuration, or build artifacts affected |
  | Tests (`/tests`) | None | No test files created or modified |
  | CI/CD (`.github`) | None | No workflows or automation changes required; standard PR/commit flow applies |
  | Git History | Low | Single commit with one new file; no rewriting or destructive operations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/046-markdown-content-file-d0596b` exists and is active
  - **File system**: Write access to repository root directory
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation, not code-dependent
  - **No build/test dependencies**: No changes to `pyproject.toml`, test setup, or CI/CD pipelines

  ## Success Criteria

  - [ ] File `test-tmardz.md` exists in repository root (verified via `git ls-files`)
  - [ ] File is not empty and contains valid Markdown syntax
  - [ ] File contains exactly one top-level heading (H1 `#` or H2 `##`)
  - [ ] File contains 2-3 sentences of content after the heading
  - [ ] File is encoded as UTF-8
  - [ ] Line endings are LF (Unix-style), not CRLF
  - [ ] Git status shows only the new file (no unintended modifications)
  - [ ] Changes are committed to feature branch `feat/046-markdown-content-file-d0596b`
  - [ ] No other files in the repository have been modified

  ## Size Estimate

  **S** (Hours) — This is a minimal-effort, single-file creation feature requiring:

  - **File creation**: ~5 minutes (write one heading + 2-3 sentences)
  - **Testing/verification**: ~5 minutes (validate syntax, check encoding, verify in git)
  - **Commit and push**: ~2 minutes (standard git workflow)
  - **Total estimate**: 10-15 minutes of actual work

  No research, no code analysis, no architectural decisions, and no testing framework integration needed. This is a straightforward content creation task matching the established pattern of features #044, #045, and prior similar features (test-5ito9r.md, test-r7uy00.md, test-g12aiq.md, etc., all created in recent commits #104–#108).
