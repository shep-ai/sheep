# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the established repository pattern for lightweight markdown content files.
  The Sheep project maintains a collection of simple markdown files in the repository root
  (test-5ito9r.md, test-r7uy00.md, test-g12aiq.md, etc.) that serve as examples, documentation,
  or test content. No special organization, processing, or integration with source code is required.

  The implementation is purely file I/O: create a text file with specific encoding/line ending
  requirements, verify it meets acceptance criteria, then commit to Git. No impact on:
  - Source code in `/src/sheep`
  - Test infrastructure in `/tests`
  - Configuration files or build system
  - CI/CD pipelines or workflows
  - Dependencies or package management

  ## Key Design Decisions

  ### 1. H1 Heading Format
  **Decision:** Use H1 heading (`#`) for the title

  **Rationale:** Analysis of existing pattern files (test-5ito9r.md, test-r7uy00.md, test-g12aiq.md)
  shows consistent use of H1 as the primary document title. H1 is semantically correct for a
  document's main subject and provides clarity. While H2 is also acceptable per requirements,
  H1 ensures consistency with established patterns (NFR-5).

  ### 2. Direct Filesystem Write
  **Decision:** Create file using standard file I/O (Python open() or equivalent shell write)

  **Rationale:** Direct write is the simplest, most deterministic approach for creating a new file.
  No special tooling, templates, or multi-step processes needed. File must exist before Git can
  track it, making direct creation the natural first step.

  ### 3. UTF-8 Encoding Without BOM
  **Decision:** Use UTF-8 character encoding with no Byte Order Mark

  **Rationale:** UTF-8 without BOM is the modern standard for text files and markdown (NFR-1).
  BOM can cause parsing issues on Unix systems and is unnecessary when using UTF-8 with LF
  line endings. Eliminates platform-specific behavior that could cause compatibility issues
  across different tools and systems.

  ### 4. LF Line Endings
  **Decision:** Use LF (`\n`) line endings exclusively

  **Rationale:** Repository infrastructure is Unix-based (Docker, GitHub CI/CD). Git on Unix
  systems uses LF as the standard. All existing pattern files use LF exclusively (NFR-2).
  Ensures consistency across all platforms and tools, prevents line-ending drift that can
  complicate diffs and cause parsing issues in some tools.

  ### 5. Substantive Content Topic
  **Decision:** Choose any meaningful topic (technology, concept, methodology, etc.)

  **Rationale:** Existing test files contain substantive topics: stream processing, API design,
  cloud computing. While specific topic is not mandated, pattern compliance (NFR-5) suggests
  meaningful content rather than placeholder text or Lorem ipsum. Topic flexibility allows
  this feature to fit naturally into the repository's content collection while meeting intent.

  ### 6. Conventional Commit Message Format
  **Decision:** Use pattern: `feat: Create test-tmardz.md markdown file about [topic]`

  **Rationale:** Repository uses conventional commits throughout (observed in commits #104-#108).
  This format provides clear scope, good commit history searchability, and fulfills FR-5
  requirement for conventional commit messages. Matches established repository pattern.

  ### 7. Manual Validation Approach
  **Decision:** Post-creation verification via git and file inspection tools

  **Rationale:** Given minimal scope (single file, ~2-3 sentences), manual verification is
  sufficient and proportionate. Key validations: file exists (git ls-files), correct encoding
  (file command), correct line endings (cat -A), content structure (sentence count). No need
  for markdown linting tools or complex validation framework—risk is low and requirements
  are straightforward.

  ## Implementation Strategy

  **Phase 1 - File Creation & Validation** comes first because the file must exist before
  it can be committed. This phase creates the markdown file with all encoding/format requirements,
  then validates against acceptance criteria.

  **Phase 2 - Git Integration** follows file creation. Once file is verified to meet all
  requirements, it's staged, committed with a conventional message, and pushed to the
  feature branch.

  This two-phase approach is appropriate because:
  - File creation and validation are logically coupled (can't verify until file exists)
  - Git operations depend on file existing and being correct
  - Simple sequential flow with no parallelization needed
  - Matches the feature's minimal complexity

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Incorrect encoding (e.g., with BOM) | NFR-1 violation; tools may misinterpret file | Verify with `file` command and hex inspection before commit |
  | CRLF line endings instead of LF | NFR-2 violation; Git diffs become messy; platform drift | Use tools that explicitly write LF; verify with `cat -A` or `od -c` |
  | Content structure errors (wrong heading level, sentence count) | FR-2, FR-3 violations; acceptance criteria fail | Manual sentence count verification; ensure exactly one H1 heading |
  | Commit to wrong branch | Feature ends up on main or other branch | Verify `git branch` before commit; use explicit `-b` if needed |
  | Other files accidentally modified | FR-6 violation; unintended changes in commit | Use `git status` to confirm only test-tmardz.md is modified |
  | File size exceeds 5KB | NFR-4 violation | Keep content to 2-3 sentences (~200-300 words); verify with `ls -lh` |
  | Incorrect filename (typo in test-tmardz) | FR-1 violation; file won't match expected name | Double-check exact filename before creation; use git ls-files to verify
