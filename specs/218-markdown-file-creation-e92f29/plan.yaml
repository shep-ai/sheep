content: |
  ## Architecture Overview

  This feature creates a single markdown file (test-gmvvpm.md) following the well-established
  pattern from 100+ identical test files in the Sheep project (features 099-217). The implementation
  is minimal and focused: create the file, validate it meets all requirements, then integrate with git.

  ### Implementation Pattern

  The codebase has established a proven pattern for markdown file creation:
  1. Use Python pathlib for modern, safe file I/O
  2. Explicitly control encoding (UTF-8) and line endings (Unix LF) to ensure cross-platform consistency
  3. Define file content as a code constant (H1 heading + blank line + 2-3 sentences of prose)
  4. Validate file structure and content before git operations
  5. Use subprocess for git integration (add, commit, push) with conventional commit format

  This pattern is evidenced in features 213-217, which demonstrate the same approach with 100%
  consistency. No architectural decisions are needed—the pattern is proven and should be replicated exactly.

  ### File I/O Strategy

  The file is created using pathlib.Path.write_text() with two critical parameters:
  - encoding='utf-8': Ensures UTF-8 encoding without BOM
  - newline='\n': Forces Unix LF line endings on all platforms (prevents Windows CRLF conversion)

  This approach is cleaner and more Pythonic than write_bytes() alternatives and directly matches
  the implementation in features 216-217 (most recent predecessors).

  ### Content Structure

  Content is hand-written and defined as a module-level string constant:
  - H1 heading: # [Title] (any meaningful topic)
  - Blank line: separates heading from prose
  - Prose: 2-3 coherent sentences about any non-harmful topic

  This follows the pattern seen in all existing test files and features 213-217. Topics are flexible
  (no pre-approval needed)—existing files cover storytelling, innovation, testing, and personal development.

  ## Key Design Decisions

  ### Decision 1: File Creation Method — pathlib.Path.write_text()

  **Chosen:** pathlib.Path with write_text(encoding='utf-8', newline='\n')

  **Rationale:** All features 213-217 use this approach. It provides:
  - Modern, object-oriented Python idiom
  - Explicit encoding control (UTF-8, no BOM)
  - Cross-platform line ending consistency via newline parameter
  - Simpler and more readable than write_bytes() with manual encoding
  - Safe defaults for file creation

  **Alternatives Rejected:**
  - os.open() + os.write() — verbose, error-prone for encoding; not used in recent features
  - Built-in open() function — older approach; pathlib preferred
  - write_bytes() — requires manual string-to-bytes conversion; harder to read
  - Default write_text() without newline parameter — uses platform defaults (CRLF on Windows)

  ### Decision 2: Line Ending Control — Explicit newline='\n' parameter

  **Chosen:** pathlib.Path.write_text(..., newline='\n')

  **Rationale:** The newline parameter is critical for spec compliance:
  - Specification explicitly requires "LF line endings (Unix-style)"
  - newline='\n' prevents pathlib from converting \n to platform-specific endings
  - Without this parameter, Windows would output CRLF, violating the requirement
  - Feature 216 uses this exact approach and is the reference implementation

  **Example Impact:**
  - With newline='\n': File contains only \n (Unix LF) ✓
  - Without parameter on Windows: File contains \r\n (CRLF) ✗

  ### Decision 3: Validation Before Git Operations — Fail-Fast Approach

  **Chosen:** Comprehensive validation function that runs before any git command

  **Rationale:** Feature 216 demonstrates comprehensive validation is the standard:
  - Validates file exists and is readable
  - Checks encoding is UTF-8 without BOM (by reading raw bytes)
  - Verifies line endings are Unix LF only (no CR or CRLF)
  - Validates H1 heading format (# followed by title)
  - Verifies blank line separator between heading and prose
  - Checks prose contains 2-3 sentences (by counting periods)
  - Verifies file size is 300-600 bytes
  - Raises clear error messages if any check fails

  This validation ensures all 9 functional requirements are met before committing.
  Fail-fast approach prevents invalid files from being committed to git.

  ### Decision 4: Git Integration — subprocess.run() with system git

  **Chosen:** subprocess.run() with command list (not string)

  **Rationale:** All features 213-217 use this approach:
  - Safe: command list prevents shell injection attacks (vs string concatenation)
  - Simple: direct git commands (add, commit, push) are straightforward
  - Minimal dependencies: uses only Python standard library
  - check=True raises CalledProcessError if command fails, enabling clean error handling

  **Three Commands:**
  1. git add test-gmvvpm.md
  2. git commit -m "feat(218): Create markdown file test-gmvvpm.md"
  3. git push -u origin feat/218-markdown-file-creation-e92f29

  **Alternatives Rejected:**
  - GitPython library — external dependency not in project; not used in any feature
  - Manual string concatenation — security risk (command injection)
  - No git integration — would not satisfy git-related requirements

  ### Decision 5: Conventional Commit Format with Feature Scope

  **Chosen:** feat(218): Create markdown file test-gmvvpm.md

  **Rationale:** All features 213-217 use this exact format:
  - Type: "feat" (new feature/file)
  - Scope: "218" (feature number for traceability)
  - Subject: "Create markdown file test-gmvvpm.md" (clear, descriptive)
  - Follows conventional commits specification used across Sheep project

  This format enables:
  - Semantic commit history (clear classification)
  - Traceability to feature number
  - Easy querying of feature-related commits
  - Compliance with project standards

  ### Decision 6: Content Strategy — Hand-Written Prose as Code Constant

  **Chosen:** Define prose content directly as string constant in Python code

  **Rationale:** All 100+ existing test files and features 213-217 follow this pattern:
  - Topics are flexible: storytelling, innovation, testing, personal development, etc.
  - Specification: "any non-harmful topic is acceptable"
  - Content is deterministic and reviewable (not generated/random)
  - Simple string constant keeps implementation straightforward
  - No template system or content pool needed

  Content should be coherent 2-3 sentences on a meaningful topic appropriate for a public repository.

  ## Implementation Strategy

  ### Phase 1: Core Implementation

  Create the markdown file with proper encoding and validate it thoroughly:

  1. **Task 1**: Create file using pathlib.write_text() with explicit encoding/newline params
  2. **Task 2**: Implement comprehensive validation function covering all spec requirements

  Validation runs before git operations and is the critical step ensuring correctness.

  ### Phase 2: Git Integration

  Once file is created and validated, perform git operations:

  3. **Task 3**: Implement git workflow (add → commit → push) with error handling
  4. **Task 4**: Execute complete script and verify all success criteria are met

  ## Risk Mitigation

  | Risk | Mitigation Strategy |
  | ---- | ------------------- |
  | File already exists (test-gmvvpm.md) | Check Path.exists() before creating; raise FileExistsError with clear message if file exists. Prevents overwriting. |
  | Encoding corruption (BOM included) | Explicitly use encoding='utf-8' (no BOM) and verify by reading file raw bytes. Check for absence of EF BB BF bytes (BOM marker). |
  | Line ending issues (CRLF on Windows) | Force newline='\n' parameter in write_text(). Verify by reading file and checking for absent \r characters. |
  | Invalid file structure | Comprehensive validation catches missing heading, blank line, incorrect prose. All checks run before git operations. |
  | File size out of range | Validation checks file is 300-600 bytes. Prevents under-spec (too short) and over-spec (too long) files. |
  | Prose doesn't have 2-3 sentences | Validation counts sentences by splitting on periods. Clear error message shows actual count vs expected. |
  | Git authentication failure | Assume system git is properly configured. git push will fail with clear error message if auth fails; process exits with status 1. |
  | Git push fails (branch doesn't exist) | Pre-condition: feature branch must exist (created by harness before implementation). If missing, git push will fail with clear error. |
  | Script encounters unexpected error | try/except blocks catch exceptions with informative error messages. Non-zero exit code signals failure to calling process. |

  ## Files to Create/Modify

  **Create:**
  - test-gmvvpm.md (in repository root, same level as other test-*.md files)

  **Modify:**
  - None (no existing source code or configuration changes)

