decisions:
  - title: "File Creation Method: pathlib vs os module"
    chosen: "Python pathlib.Path — modern, object-oriented, safe default handling of encoding/line endings"
    rejected:
      - "os.open() + os.write() — verbose, error-prone, requires manual encoding/line ending handling; does not follow codebase pattern established across 100+ existing test files"
      - "open() built-in with write() — older approach, more manual control required; pathlib is preferred modern Python idiom"
    rationale: >
      pathlib is the established pattern across all recent feature implementations (213-217). It provides object-oriented Path handling with safe defaults for UTF-8 encoding and proper newline handling. The write_text() method with explicit encoding and newline parameters ensures cross-platform consistency (UTF-8 without BOM, LF line endings). This approach is cleaner, more Pythonic, and directly matches the implementation pattern in features 216-217, which are the immediate predecessors of this feature.

  - title: "Encoding Approach: write_text() with newline parameter vs write_bytes()"
    chosen: "pathlib.Path.write_text(encoding='utf-8', newline='\\n') — explicit, readable, handles encoding transparently"
    rejected:
      - "write_bytes() with manual .encode('utf-8') — requires manual string-to-bytes conversion and explicit '\\n' in all string literals; adds complexity without benefit; harder to read and maintain"
      - "Default pathlib.Path.write_text() — uses platform default line endings (CRLF on Windows); does not guarantee Unix LF endings required by specification"
    rationale: >
      Feature 216 (most recent predecessor) uses write_text(encoding='utf-8', newline='\\n') and represents the cleaner, more modern approach. This method explicitly ensures UTF-8 encoding without BOM and forces Unix LF line endings, meeting all specification requirements. The newline='\\n' parameter is key: it prevents pathlib from converting '\\n' to platform-specific line endings, ensuring consistent LF across Windows/Linux/macOS. This is more maintainable than write_bytes() and directly matches the proven implementation pattern.

  - title: "Markdown Content Structure: fixed content vs template-driven"
    chosen: "Fixed prose content with coherent 2-3 sentence paragraph — simple, deterministic, proven by 100+ existing files"
    rejected:
      - "Template-driven/parametrized content — adds unnecessary complexity; contradicts established pattern where each feature has unique prose topic; requires additional configuration or content pool; violates principle that implementation should be straightforward imperative code"
      - "Generated content (random sentences, AI-generated text) — introduces non-determinism; harder to review; adds external dependencies (if using generative APIs); existing pattern shows manually-written coherent prose about diverse topics"
    rationale: >
      All existing test files (test-*.md) and recent feature implementations contain hand-written prose about diverse topics (storytelling, innovation, testing, personal development, experimentation). This shows the pattern accepts any appropriate topic with coherent 2-3 sentence content. Prose should be written directly in code constants (as shown in features 213-217), avoiding template complexity. This keeps implementation simple, deterministic, and reviewable.

  - title: "Git Integration: subprocess vs GitPython library"
    chosen: "subprocess.run() with system git command — minimal dependencies, direct git commands, proven by all existing implementations"
    rejected:
      - "GitPython library (git.Repo) — adds external dependency not in project; heavier abstraction layer; not used in any existing feature implementation; overkill for simple add/commit/push workflow"
      - "Manual git command string concatenation — error-prone, security risk (command injection); subprocess.run() with list arguments is safer and cleaner"
    rationale: >
      All analyzed feature implementations (213-217) use subprocess.run() with list arguments for git commands. This pattern ensures security (no shell injection), simplicity (direct git commands), and zero external dependencies. The three-command sequence (git add, git commit, git push) is straightforward and proven across 100+ existing features. subprocess.run(check=True) provides error handling: CalledProcessError is raised if any git command fails, allowing clean exception handling in main().

  - title: "Commit Message Format: feature number scope"
    chosen: "Conventional commits with feature number as scope: 'feat(218): Create markdown file test-gmvvpm.md'"
    rejected:
      - "No scope, just 'feat: Create markdown file test-gmvvpm.md' — less precise; loses traceability to feature number; not consistent with existing implementations"
      - "Task/ticket style 'FEAT-218: ...' — violates conventional commits specification; not followed by any existing feature in codebase"
    rationale: >
      All recent features (213-217) use conventional commits format with feature number as scope. This provides semantic clarity, clear commit history organization, and traceability. The scope (218) uniquely identifies the feature, making it easy to query/find related commits. This format is standardized across the Sheep project and required by the specification.

  - title: "File Validation: comprehensive checks vs minimal validation"
    chosen: "Comprehensive validation covering encoding, line endings, structure, size, and sentence count — matches feature 216 approach"
    rejected:
      - "Minimal validation (just check file exists) — insufficient; cannot catch encoding/line ending issues; violates requirement to verify UTF-8/LF compliance; feature 216 shows comprehensive validation is standard"
      - "No validation — dangerous; could miss file creation failures; specification explicitly requires verification that file meets requirements"
    rationale: >
      Feature 216 includes comprehensive validation before git operations. This validates: file existence, UTF-8 encoding without BOM, Unix LF line endings, H1 heading format, blank line separator, prose content presence, file size range (300-600 bytes), and sentence count (2-3). This ensures the feature's success criteria are met before committing/pushing. Validation is fast, deterministic, and provides clear error messages if anything fails.

  - title: "Error Handling Strategy: fail-fast with detailed errors"
    chosen: "Exception-based error handling (FileExistsError, subprocess.CalledProcessError) with informative error messages"
    rejected:
      - "Silent failures or return codes — harder to debug; unclear what failed and why; not user-friendly"
      - "Warnings instead of exceptions — allows implementation to proceed with partial failures; violates 'fail-fast' principle; feature should either fully succeed or fail clearly"
    rationale: >
      Features 213-217 use try/except blocks to catch and report specific error types (FileExistsError for duplicate files, CalledProcessError for git failures). This provides clear diagnostics: what failed, why, and the exact command/return code. The fail-fast approach ensures the feature either fully succeeds (all three git operations complete) or exits with status code 1 and an error message. This matches established error handling patterns.

