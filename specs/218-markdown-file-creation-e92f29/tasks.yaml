content: |
  ## Task Execution Flow

  Implementation proceeds across 4 ordered tasks in 2 phases, with each task building on the previous.

  ### Phase 1: Core Implementation

  **Task 1 — Create Markdown File** (30 min)
  Creates test-gmvvpm.md using pathlib.Path.write_text(encoding='utf-8', newline='\\n').
  The newline parameter is critical: it forces Unix LF line endings on all platforms,
  preventing Windows from converting to CRLF. Content is H1 heading + blank line + prose.

  **Task 2 — Implement Validation** (45 min)
  Validates file structure before git operations. Comprehensive checks ensure all spec
  requirements are met: UTF-8 without BOM, Unix LF only, H1 heading, blank line, 2-3 sentences,
  300-600 bytes. Validation is the fail-fast safeguard preventing invalid files from committing.
  If any check fails, process exits with clear error message before git operations start.

  ### Phase 2: Git Integration

  **Task 3 — Implement Git Workflow** (30 min)
  Performs three git operations in sequence: add, commit, push. Uses subprocess.run() with
  check=True for safety (prevents command injection via list args, raises CalledProcessError
  on failure). Error handling catches git failures and reports which command failed with exit code.

  **Task 4 — Execute and Verify** (15 min)
  Runs complete script and verifies all success criteria are met. Confirms:
  - File exists in repository root with correct structure and encoding
  - Git operations succeeded (file is committed and pushed)
  - All 9 functional requirements and 8 non-functional requirements are satisfied
  - Feature is complete and correct

  ## Implementation Notes

  ### File Creation (Task 1)

  The pathlib.write_text() call is the core of this task:
  ```python
  Path('test-gmvvpm.md').write_text(
      content,
      encoding='utf-8',     # UTF-8 without BOM
      newline='\\n'          # Force Unix LF (no CRLF conversion)
  )
  ```

  The newline parameter is non-obvious but critical:
  - Default behavior (no newline param): pathlib uses platform-specific line endings
  - Windows: converts \\n to \\r\\n (CRLF) — violates spec
  - Unix/Mac: keeps \\n (LF) — meets spec
  - With newline='\\n': All platforms use \\n (LF) — meets spec

  Without explicit newline parameter, tests would pass on Unix but fail on Windows CI.

  ### Validation (Task 2)

  Validation runs before git operations and is the quality gate:
  - File exists (prevents NullPointerException in git add)
  - UTF-8 without BOM (prevents mojibake)
  - Unix LF only (prevents CRLF issues)
  - Correct structure (H1, blank, prose)
  - Correct size (300-600 bytes)
  - Correct sentence count (2-3)

  If validation fails, git operations are never attempted. This fail-fast approach is essential
  for maintaining code quality and preventing commits of broken files.

  ### Git Workflow (Task 3)

  Three commands execute in strict order:
  1. git add test-gmvvpm.md — stages file for commit
  2. git commit -m \"feat(218): ...\" — creates commit with conventional message
  3. git push -u origin feat/... — pushes commit to remote feature branch

  Each command uses subprocess.run() with check=True:
  - check=True raises CalledProcessError if command returns non-zero exit code
  - Command is passed as list (not string) to prevent shell injection
  - -u flag in git push sets upstream branch for future pulls

  If any command fails, CalledProcessError is caught and reported. Process exits with status 1.

  ### Execution & Verification (Task 4)

  Final task runs the complete script and systematically verifies:
  - File properties (exists, size, encoding, structure)
  - Git integration (commit message, branch, remote status)
  - Functional requirements (FR-1 through FR-9)
  - Non-functional requirements (NFR-1 through NFR-8)

  This verification confirms the implementation is complete and all specification requirements
  are met. Success means feature 218 is ready to close.

  ## Key Testing Strategies

  ### TDD Cycles

  Each task follows Red-Green-Refactor:
  1. **RED**: Write test that fails (asserts behavior not yet implemented)
  2. **GREEN**: Implement minimal code to make test pass
  3. **REFACTOR**: Improve code clarity (extract functions, add docstrings, etc.)

  ### File-Based Testing

  Since tasks involve file I/O and git, tests can verify:
  - File existence: Path('test-gmvvpm.md').exists()
  - File content: Path('test-gmvvpm.md').read_text()
  - File encoding: read raw bytes and check encoding
  - Git status: subprocess.run(['git', 'status', '--porcelain'])
  - Git log: subprocess.run(['git', 'log', '-1', '--pretty=format:%s'])

  ### Error Message Quality

  When implementing error handling, error messages should be specific:
  - \"Error occurred\" — too vague
  - \"Failed to add file: git returned exit code 128 (permission denied)\" — clear
  - \"Bad encoding\" — unclear what's wrong
  - \"File encoding is UTF-16, expected UTF-8 without BOM\" — specific

