content: |
  ## Technology Decisions

  ### 1. Reusing Existing Content Generation Infrastructure

  **Chosen:** Reuse all utility functions from `sheep.content_generators`

  **Rejected:**
  - Custom content generation with feature-specific prompts — Code duplication, divergence from proven patterns
  - Direct Claude API calls — Bypasses validation, error handling, logging infrastructure

  **Rationale:** The `generate_markdown_content()` function is battle-tested across 269 iterations.
  It handles prompt construction, LLM calls via CrewAI, response parsing, validation of H1 heading
  and sentence count, and proper error handling. Writing custom code would duplicate this logic
  and risk inconsistency. The same principle applies to `write_markdown_file()` (handles UTF-8/LF
  encoding enforcement), `validate_markdown_file()` (comprehensive format validation),
  `commit_markdown_file()` (git staging and conventional commit formatting), and `push_markdown_file()`
  (remote operations with upstream tracking).

  ### 2. CrewAI LLM Framework Integration

  **Chosen:** Use `sheep.config.llm.get_reasoning_llm()` for LLM access

  **Rejected:**
  - Direct Anthropic Python SDK — Loses CrewAI orchestration and integration benefits
  - Custom LLM abstraction layer — Unnecessary complexity, diverges from established patterns

  **Rationale:** The project standardizes on CrewAI (>=0.86.0) for LLM access. The `get_reasoning_llm()`
  factory (temperature=0.2) returns a CrewAI LLM instance preconfigured for the project's default
  reasoning model (typically Claude 3.5 Sonnet). This factory handles:
  - Model selection from project settings
  - API key injection based on provider (Anthropic, OpenAI, Google, Cursor)
  - Temperature tuning for deterministic output
  - Automatic Langfuse instrumentation via openinference-instrumentation-crewai

  The content generation prompt (`MARKDOWN_GENERATION_PROMPT`) works with any CrewAI-compatible LLM.

  ### 3. Fail-Safe File Overwrite Handling

  **Chosen:** Fail with clear error if file already exists

  **Rejected:**
  - Create backup and overwrite — Adds cleanup burden and operator confusion
  - Silently skip if exists — Ambiguous success/failure state

  **Rationale:** Codebase analysis documents 'fail-safe' pattern. If `test-f2zwii.md` already exists,
  the feature should raise `ValueError` with message: "File test-f2zwii.md already exists. Delete
  the file and retry." This prevents:
  - Accidental data loss (existing file preserved)
  - Ambiguous operation results (clear error vs silent skip)
  - Operator confusion about what happened

  The `write_markdown_file()` function should check `Path(file_path).exists()` before write and
  raise ValueError if true.

  ### 4. Exponential Backoff Retry Logic for API Failures

  **Chosen:** Exponential backoff (1s, 2s, 4s, 8s) with max 4 retries

  **Rejected:**
  - Fixed retry count with constant delays — Less effective for transient slowness
  - No retry logic — Sacrifices reliability for simplicity

  **Rationale:** API calls can fail transiently (rate limiting, brief outages, network jitter).
  Exponential backoff is industry standard (AWS SDKs, Google Cloud client libraries). The pattern:

  ```
  Attempt 1: immediate (fail → wait 1s)
  Attempt 2: after 1s (fail → wait 2s)
  Attempt 3: after 2s (fail → wait 4s)
  Attempt 4: after 4s (fail → wait 8s)
  Attempt 5: after 8s (give up)
  ```

  Total max wait time: ~15 seconds. This respects API rate limits (doesn't hammer), handles
  transient failures (sufficient wait times), and caps worst-case delay (fail fast on permanent errors).

  The `generate_markdown_content()` function should implement this via the CrewAI LLM's built-in
  retry mechanism, or wrap with `tenacity` library (already available in CrewAI dependencies).

  ### 5. Strict 2-3 Sentence Content Validation

  **Chosen:** Enforce exactly 2-3 sentences (count sentence-ending periods)

  **Rejected:**
  - Flexible 1-5 sentences — Introduces inconsistency across iterations
  - Minimum 2 sentences only — Loses upper bound control

  **Rationale:** Feature specification and codebase analysis explicitly require '2-3 sentences'.
  The `_validate_markdown_content()` function counts periods (`.`) in the prose: if count < 2
  or count > 3, raise ValueError. This strict validation:
  - Ensures consistent output across all 270 iterations
  - Prevents API temperature variations from producing outliers
  - Matches feature requirement exactly
  - Fails fast if LLM produces unexpected structure

  The prompt template in `MARKDOWN_GENERATION_PROMPT` explicitly states "Exactly 2-3 sentences".
  The validation enforces this requirement.

  ### 6. UTF-8 Encoding with No-BOM and Unix LF Line Endings

  **Chosen:** Explicit UTF-8 encoding, reject BOM, enforce LF-only line endings

  **Rejected:**
  - System default encoding — Platform-dependent, inconsistent
  - Allow flexible line endings — Creates CRLF vs LF inconsistency across platforms

  **Rationale:** `write_markdown_file()` calls `open(file_path, 'w', encoding='utf-8')`. Python's
  text mode defaults to system line ending (`\r\n` on Windows, `\n` on Unix), but `generate_markdown_content()`
  explicitly ensures Unix LF by appending `\n` if needed (line 56-57 in content_generators.py).

  `validate_markdown_file()` performs explicit checks:

  ```python
  # Check for UTF-8 BOM
  if binary_content.startswith(b'\xef\xbb\xbf'):
      raise ValueError("File has UTF-8 BOM")

  # Check for CRLF (should be LF only)
  if b'\r\n' in binary_content:
      raise ValueError("File uses CRLF line endings")

  # Verify UTF-8 decoding
  binary_content.decode('utf-8')  # Raises UnicodeDecodeError if invalid
  ```

  This ensures:
  - Portable files (Git diffs are clean, no spurious line-ending changes)
  - Cross-platform consistency (Windows to Unix to Mac)
  - Markdown standard compliance (UTF-8 + LF is convention)
  - CI/CD reproducibility

  ### 7. Module Structure: Exact Copy of feature_267 Pattern

  **Chosen:** Replicate `feature_267_markdown_file_creation.py` structure exactly

  **Rejected:**
  - Enhance with additional validation — Diverges from established pattern
  - Minimal viable module — Loses important structure for maintainability

  **Rationale:** Feature 267 defines the canonical pattern. The `feature_270_markdown_file_creation.py`
  module should have identical structure:

  ```python
  """Docstring explaining the feature"""
  from pathlib import Path
  from sheep.content_generators import (
      generate_markdown_content,
      write_markdown_file,
      validate_markdown_file,
      commit_markdown_file,
      push_markdown_file,
  )
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  # Feature metadata
  FEATURE_NUMBER = 270
  FEATURE_NAME = "markdown-file-creation-a09312"
  MARKDOWN_FILENAME = "test-f2zwii.md"

  def create_feature_270_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      """Full docstring with Args, Returns, Raises"""
      # 5 major steps with logging at each step
      # Try-except with logging on error
      # Return structured result

  if __name__ == "__main__":
      # Script execution example
  ```

  This consistency:
  - Enables copy-paste for future iterations (271, 272, ...)
  - Reduces cognitive load (all features look identical)
  - Minimizes implementation risk (proven pattern)
  - Aids code review (expected structure is clear)

  ### 8. Standard-Detail Structured Logging

  **Chosen:** Log each major step (generate, write, validate, stage, commit, push)

  **Rejected:**
  - Minimal logging (start/end only) — Sacrifices debugging visibility
  - Verbose logging (API calls, token counts) — Creates log clutter and risks data leakage

  **Rationale:** Each of the 5 major workflow steps logs an INFO-level message:
  - Task 1: Generating markdown content
  - Task 2: Writing markdown file to disk
  - Task 3: Validating markdown file
  - Task 4: Staging and committing file
  - Task 5: Pushing to remote repository

  Success messages: "Successfully created and published feature 270"
  Error messages: "Failed to create feature 270: {error}"

  The structlog framework provides:
  - Automatic timestamps (ISO format)
  - JSON-compatible output (machine-parseable)
  - Context preservation (all logs share correlation metadata)
  - Log level filtering (DEBUG for details, INFO for major steps)

  This level of detail answers critical debugging questions:
  - Did content generation complete? (Step 1 log)
  - Did file write succeed? (Step 2 log)
  - Where did validation fail? (Step 3 log)
  - Did git commit work? (Step 4 log)
  - Did push complete? (Step 5 log)

  ### 9. Langfuse Observability Tracing

  **Chosen:** Include Langfuse integration (automatic via infrastructure)

  **Rejected:**
  - Structured logging only — Loses cloud observability and performance dashboards
  - Optional/conditional Langfuse — Creates configuration burden and inconsistency

  **Rationale:** Langfuse (>=2.0.0) is a project dependency providing cloud-based observability.
  The `openinference-instrumentation-crewai` package automatically traces CrewAI LLM calls to
  Langfuse when `LANGFUSE_SECRET_KEY` environment variable is set.

  Benefits:
  - Structured event tracing in Langfuse web UI
  - Performance metrics (latency per step, LLM token usage)
  - Error tracking with full call context
  - Correlation across distributed systems

  The feature module doesn't need explicit Langfuse code; tracing is automatic:
  1. `get_reasoning_llm()` returns CrewAI LLM instance
  2. openinference instrumentation hooks the LLM.call() method
  3. Every LLM call is traced to Langfuse if credentials are available
  4. Structlog events at INFO level are captured as traces

  Feature module developers inherit this observability for free by following the pattern.

  ### 10. GitPython for Git Operations

  **Chosen:** Use GitPython (>=3.1.0) via `sheep.tools.GitCommitTool` and `GitPushTool`

  **Rejected:**
  - Direct subprocess.run(['git', ...]) calls — Security, portability, error handling risks
  - Custom git wrapper — Reinvents the wheel; GitPython is already a dependency

  **Rationale:** GitPython provides a mature, stable Python abstraction over git. The project's
  `sheep.tools` module wraps this further:

  - `GitCommitTool._run(repo_path, message, add_all=True)` — Stages all changes and creates commit
  - `GitPushTool._run(repo_path, remote='origin', set_upstream=True)` — Pushes with upstream tracking

  Benefits:
  - Cross-platform (works on Windows, Linux, macOS)
  - Error handling (catches and reports git errors clearly)
  - Security (no shell injection risks)
  - Consistency (all features use same git infrastructure)

  The feature module calls these tools without concern for git implementation details.

  ## Library Analysis

  | Library | Purpose | Version | Decision | Reasoning |
  | ------- | ------- | ------- | -------- | --------- |
  | CrewAI | LLM orchestration and reasoning framework | >=0.86.0 | **Use** | Handles Claude API access, model configuration, temperature tuning, error handling |
  | Anthropic Claude API | Large language model for content generation | (via CrewAI) | **Use** | Generates markdown H1 headings and prose via `get_reasoning_llm()` |
  | GitPython | Git operations library | >=3.1.0 | **Use** | Safe, portable git staging/commit/push via sheep.tools wrappers |
  | Pydantic | Data validation and settings management | >=2.0.0 | **Use** | Validates project settings and LLM configuration (already used in codebase) |
  | structlog | Structured logging framework | >=24.0.0 | **Use** | JSON-compatible logging at each workflow step with automatic timestamping |
  | Langfuse | Cloud observability and tracing platform | >=2.0.0 | **Use** | Automatic LLM tracing and performance monitoring when credentials available |
  | openinference-instrumentation-crewai | Instrumentation bridge for Langfuse | >=0.1.0 | **Use** | Automatically traces CrewAI LLM calls to Langfuse |
  | pathlib | Python standard library for path operations | (stdlib) | **Use** | Safe, cross-platform file path manipulation (no os.path.join strings) |
  | typing | Python standard library for type hints | (stdlib) | **Use** | Full type hints for function signatures (str \| None, dict[str, str]) |

  ## Security Considerations

  ### 1. API Credentials Management
  - **Risk:** Exposing Anthropic API keys
  - **Mitigation:** CrewAI's `create_llm()` function injects API keys from environment variables (ANTHROPIC_API_KEY) or Pydantic SecretStr fields. Feature module never hardcodes or logs API keys. Langfuse credentials come from environment (LANGFUSE_SECRET_KEY).
  - **Implementation:** Feature module calls `get_reasoning_llm()` which abstracts credential management.

  ### 2. File Path Traversal
  - **Risk:** Accepting unsanitized filenames could allow writing outside repository
  - **Mitigation:** `write_markdown_file()` validates filename: rejects "/" and "\\" characters and filenames starting with ".". Always resolves paths relative to repo root via `Path.cwd()`. No `os.path.join` string concatenation.
  - **Implementation:** Feature module passes hardcoded `MARKDOWN_FILENAME = "test-f2zwii.md"` — no user input.

  ### 3. Command Injection via Git Operations
  - **Risk:** Untrusted commit messages could inject shell commands if using subprocess + shell=True
  - **Mitigation:** GitPython library handles escaping. Feature module passes commit message to GitCommitTool, not shell. No subprocess shell execution.
  - **Implementation:** Feature module generates commit message: `f"feat({FEATURE_NUMBER}): create markdown file {MARKDOWN_FILENAME} with prose content"` — safe string formatting, no user input.

  ### 4. Log Information Leakage
  - **Risk:** Logging could inadvertently expose tokens, API responses, or generated content
  - **Mitigation:** Feature module logs at INFO level for major steps (start, end) and DEBUG level for details. Content itself is not logged. Validation failures are logged with error message only, not full content dump. Structlog ensures logs are JSON-compatible (safe for transmission).
  - **Implementation:** `_logger.info()` calls use safe string templates. `_logger.debug()` is only for sizes/filenames, not full content.

  ### 5. LLM Output Injection
  - **Risk:** Generated content could contain malicious markdown or scripts
  - **Mitigation:** Content is validated before file write: must contain H1 heading, must have exactly 2-3 sentences, must be pure text markdown. No HTML, no embedded code, no special characters besides standard markdown. Validation function `_validate_markdown_content()` enforces structure. File is written as-is (no execution), so malicious markdown is harmless in a repo.
  - **Implementation:** `generate_markdown_content()` validates; any deviation raises ValueError and aborts.

  ### 6. File Permissions and Ownership
  - **Risk:** Created file could have overly permissive permissions
  - **Mitigation:** File is created with `open(file_path, 'w')` which uses system defaults (typically 644 umask on Unix). No explicit chmod() call. File inherits permissions from parent directory (repo convention). Feature module doesn't attempt to change permissions.
  - **Implementation:** Standard Python file operations; no security special-casing needed.

  ## Performance Implications

  ### 1. Content Generation Latency
  - **Concern:** LLM API call is the slowest operation (30+ second timeout)
  - **Optimization:** Use `get_reasoning_llm()` with temperature=0.2 for faster convergence (lower temperature, more deterministic output). CrewAI's built-in caching and request batching reduce per-call overhead.
  - **Target:** Content generation should complete within 30 seconds (NFR-1).

  ### 2. File I/O Efficiency
  - **Concern:** Multiple read/write cycles (generate → write → validate → commit → push)
  - **Optimization:** Each operation reads the file once only. Validation reads binary then text (one open). No redundant reads. File size is small (250-600 bytes), so I/O is negligible.
  - **Target:** File operations should complete within 1-2 seconds total.

  ### 3. Retry Logic Overhead
  - **Concern:** Exponential backoff could add up to ~15 seconds in worst case
  - **Optimization:** Backoff is only on failure. Success cases avoid any retry delay. Initial retry delay (1s) is small, allows fast transient recovery.
  - **Target:** Total execution time < 60 seconds end-to-end (NFR-1).

  ### 4. Logging Overhead
  - **Concern:** Structured logging with Langfuse integration could add latency
  - **Optimization:** Structlog is asynchronous where possible. Langfuse tracing is best-effort (doesn't block on network failure). Logging at INFO/DEBUG only, no verbose output on happy path.
  - **Target:** Logging should add < 1 second to overall execution.

  ### 5. Git Operations
  - **Concern:** Git operations (add, commit, push) require filesystem and network access
  - **Optimization:** All operations run sequentially (must commit before push). GitPython is efficient; staging/committing are local operations (fast). Push must wait for network (10s timeout is reasonable).
  - **Target:** Git operations should complete within 10-15 seconds total.

  ### Scalability Note
  This feature creates one file and pushes one commit per execution. It's not designed for high
  volume parallel execution (no sharding, no batch operations). If feature orchestration runs
  hundreds of parallel feature_270 instances, git push contention on the remote is possible.
  Current design assumes single-feature-at-a-time execution, which is the established pattern.

  ## Architecture Notes

  ### 1. Feature Module Pattern
  The `feature_270_markdown_file_creation.py` module follows the established pattern:

  - **Metadata constants** at module level (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - **Main orchestration function** `create_feature_270_markdown_file()` that coordinates 5 steps
  - **Error handling** with logging and reraise (let caller decide recovery)
  - **Return value** is dict with filepath, content, commit message, push result
  - **CLI support** via `if __name__ == "__main__"` for direct execution

  This pattern enables:
  - Feature discovery (import feature_270 module, call its main function)
  - Consistent error handling (all features behave identically on failure)
  - Observable logging (all steps tracked)
  - Testability (function returns structured results)

  ### 2. Utility Function Abstraction
  The feature module delegates actual work to sheep.content_generators:

  ```
  Feature Module (orchestration)
    ↓ calls
  Content Generators (implementation)
    ↓ uses
  CrewAI LLM + GitPython (infrastructure)
    ↓ uses
  Anthropic Claude API + Git Remote (external services)
  ```

  This layering:
  - Keeps feature modules thin (30-40 lines of logic)
  - Centralizes content generation logic (one source of truth)
  - Enables consistent error handling and observability
  - Simplifies testing (mock content_generators functions)

  ### 3. Git Workflow Integration
  The feature integrates with the project's git workflow:

  - Feature branch: `feat/270-markdown-file-creation-a09312` (created before feature starts)
  - File location: Repository root (`test-f2zwii.md`)
  - Commit message: Conventional format `feat(270): create markdown file test-f2zwii.md with prose content`
  - Remote: `origin` (GitHub or similar)
  - Push upstream: `--set-upstream origin HEAD` (feature branch tracking)

  This ensures the created file is part of the feature PR and can be reviewed/merged.

  ### 4. Observability Integration
  The feature integrates with the project's observability stack:

  - **Structlog:** All major steps log at INFO level (automatically JSON-formatted)
  - **Langfuse:** LLM calls and structured log events traced if credentials available
  - **Error tracking:** Exceptions logged with full context before reraise

  This enables:
  - Production debugging (review logs for step-by-step execution)
  - Performance monitoring (Langfuse dashboard shows latency per step)
  - Error alerting (error logs trigger alerts in observability platform)

  ### 5. Dependencies on Other Modules
  The feature has minimal external dependencies:

  - **sheep.content_generators:** Main implementation (generate, write, validate, commit, push)
  - **sheep.config.llm:** LLM factory (get_reasoning_llm)
  - **sheep.observability.logging:** Logger factory (get_logger)
  - **pathlib, typing:** Python stdlib

  No dependencies on:
  - UI/CLI modules (feature is library, not standalone command)
  - Other feature modules (no feature-to-feature coupling)
  - Database (no persistent state)
  - External APIs besides Claude and Git

