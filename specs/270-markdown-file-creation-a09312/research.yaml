decisions:
  - title: "Utility Function Reuse vs Custom Implementation"
    chosen: "Reuse existing sheep.content_generators utility functions"
    rejected:
      - "Implement custom content generation with feature-specific prompts — This would create code duplication, diverge from established patterns tested across 269 iterations, and require reimplementation of retry logic, encoding validation, and git operations. The existing functions are already proven and tested."
      - "Call Claude API directly without wrapping — This bypasses existing validation infrastructure, error handling, logging, and observability hooks. Loses consistency with other features and reinvents the wheel."
    rationale: >
      The codebase analysis from feature_267 and preceding iterations (001-269) shows that all core
      functionality is already implemented in sheep.content_generators: generate_markdown_content()
      for content generation with H1 + prose validation, write_markdown_file() with UTF-8/LF
      enforcement, validate_markdown_file() for comprehensive format checking, commit_markdown_file()
      for git staging/committing, and push_markdown_file() for remote operations. These functions
      are production-tested across hundreds of feature iterations. Reusing them ensures consistency,
      reduces risk, and follows the DRY (Don't Repeat Yourself) principle. The feature module
      pattern explicitly states to reuse existing infrastructure.

  - title: "LLM Framework Integration (CrewAI vs Direct Anthropic SDK)"
    chosen: "Use CrewAI LLM framework via sheep.config.llm.get_reasoning_llm()"
    rejected:
      - "Use Anthropic Python SDK directly — While direct SDK usage provides minimal abstraction, it loses CrewAI's orchestration capabilities, agent framework integration, and tool management. CrewAI is already a project dependency and recommended for consistent LLM access across the platform."
      - "Implement custom LLM abstraction layer — This adds unnecessary complexity and diverges from established sheep.config patterns. The get_reasoning_llm() factory is designed exactly for this use case."
    rationale: >
      The codebase uses CrewAI as the primary LLM orchestration framework (>=0.86.0 in dependencies).
      The sheep.config.llm module provides factory functions (get_reasoning_llm() and get_fast_llm())
      that abstract away model configuration, API key management, and temperature settings. This
      follows the dependency injection pattern used throughout the codebase. CrewAI's LLM class
      handles provider detection (OpenAI, Anthropic, Google, Cursor), automatic API key injection
      based on the model provider prefix (e.g., "anthropic/claude-3-5-sonnet-20241022"), and
      integration with observability frameworks. Using get_reasoning_llm() (temperature 0.2)
      is appropriate for deterministic content generation where consistency matters.

  - title: "File Overwrite Handling Strategy"
    chosen: "Fail with clear error message if file already exists"
    rejected:
      - "Create backup and overwrite — While safer than silent overwrite, this adds backup cleanup burden, complicates logic, and could clutter the repository with .backup files. Increases chance of operator confusion about which file is authoritative."
      - "Silently skip if file exists — Simplest implementation but creates ambiguity: did the feature succeed or was the file already there? Operator cannot distinguish between 'file created successfully' and 'file already existed, skipped'. Violates fail-fast principle."
    rationale: >
      The codebase analysis explicitly mentions 'fail-safe: prevents overwriting existing files'.
      Failing with a clear error message forces explicit cleanup and retry, preventing silent
      failures and accidental data loss. This aligns with Unix philosophy and common DevOps patterns.
      The error message will indicate exactly what went wrong: "File test-f2zwii.md already exists,
      refusing to overwrite. Delete the file and retry, or specify a different filename." This
      clarity aids operational troubleshooting. The write_markdown_file() utility function should
      check file existence before write and raise ValueError appropriately.

  - title: "API Failure Retry Strategy"
    chosen: "Exponential backoff with 4-5 maximum retry attempts"
    rejected:
      - "Fixed retry count with consistent delays — Simpler to implement but less effective for transient failures. If an API is temporarily slow, fixed delays might not provide enough buffer time. Wastes time on fast failures. Less elegant than adaptive backoff."
      - "No retry logic (fail immediately) — Maximizes development simplicity but sacrifices reliability. Transient API timeouts or temporary rate limits will cause feature failure, reducing success rate in production."
    rationale: >
      Codebase analysis explicitly documents 'Retry logic with exponential backoff for API failures'
      as established pattern. Exponential backoff (e.g., 1s, 2s, 4s, 8s delays) balances API
      respect with reliability: short initial delays minimize latency in the common case (no failure),
      while increasing delays handle transient slowness without overwhelming the API. The maximum
      4-5 attempts caps total retry time to prevent indefinite hangs. This strategy is standard in
      production cloud systems (AWS SDKs, Google Cloud, etc.) and proven effective. The delay
      sequence respects rate limiting while giving transient issues time to resolve.

  - title: "Content Generation Prompt and Validation"
    chosen: "Use existing MARKDOWN_GENERATION_PROMPT with strict 2-3 sentence validation"
    rejected:
      - "Flexible sentence count (1-5 sentences) — Reduces validation rigor but introduces inconsistency. API temperature variations could produce 1-sentence or 5-sentence outputs, breaking feature uniformity across 270 iterations."
      - "Custom prompt engineering per feature — Unnecessary complexity and divergence. The existing prompt in sheep.content_generators is already proven to generate valid H1 + 2-3 sentence content."
    rationale: >
      The MARKDOWN_GENERATION_PROMPT in sheep.content_generators explicitly requests H1 heading +
      blank line separator + exactly 2-3 sentences. This has been validated across 269 preceding
      features. The _validate_markdown_content() function counts sentence-ending periods: if count
      is not exactly 2-3, it raises ValueError. This strict validation ensures consistent output
      across iterations and meets the feature specification precisely. The prompt example shows
      expected format: "# Example Title\n\nSentence 1. Sentence 2. Sentence 3." Any deviation
      triggers validation failure, forcing regeneration.

  - title: "File Encoding and Line Ending Enforcement"
    chosen: "UTF-8 encoding with explicit no-BOM check and Unix LF-only line endings"
    rejected:
      - "Allow flexible encodings and line endings — Reduces validation burden but creates cross-platform inconsistency. Windows systems using CRLF would produce different files than Unix systems. Git would detect line ending differences, complicating diffs."
      - "Assume system default encoding — Risky. System encoding varies by OS/locale. UTF-8 is the standard for modern web/code, but system might default to Latin-1 or Big5. Explicit is better than implicit (PEP 20)."
    rationale: >
      The validate_markdown_file() function implements strict checks: BOM detection
      (rejects if binary content starts with b'\xef\xbb\xbf'), CRLF detection (rejects if
      b'\r\n' appears in content), and UTF-8 decode validation. The write_markdown_file()
      function writes with encoding='utf-8', which Python defaults to LF on Unix. This ensures
      reproducible output across platforms. Markdown files should be portable and diff-friendly.
      Git best practice is UTF-8 + LF for version control. Strict enforcement prevents
      encoding-related platform bugs and ensures CI/CD consistency.

  - title: "Module Structure and Code Organization"
    chosen: "Replicate feature_267_markdown_file_creation.py structure exactly"
    rejected:
      - "Enhance with additional validation or features — The size estimate explicitly states 'implementation is essentially a copy-paste with updated metadata'. Adding enhancements diverges from the pattern, increases implementation complexity, and risks inconsistency with future iterations."
      - "Minimal viable module (bare essentials only) — Strips important patterns like logging structure, error handling context, and docstring documentation. Reduces code clarity and diverges from established patterns that aid maintainability."
    rationale: >
      Feature 267 (feature_267_markdown_file_creation.py) defines the established pattern for all
      subsequent features (268, 269, 270, and beyond). The structure includes: metadata constants
      (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME), main orchestration function
      (create_feature_NNN_markdown_file), comprehensive docstrings with Args/Returns/Raises,
      step-by-step logging for observability, and proper exception handling with reraise.
      By exactly replicating this pattern, we ensure consistency, minimize cognitive load,
      and reduce risk of introducing bugs. Future features can copy-paste the same structure.
      The pattern is proven across 267 iterations and follows Python conventions (PEP 257
      docstrings, type hints, logging best practices).

  - title: "Logging Strategy and Detail Level"
    chosen: "Standard detail: log each major step (generate, write, validate, stage, commit, push)"
    rejected:
      - "Minimal logging (start/end only) — Sacrifices visibility into failures. If feature fails at step 3 (validation), minimal logging won't show that steps 1-2 succeeded. Harder to debug in production."
      - "Verbose logging (include API call details) — Excessive output clutters logs with token counts, intermediate results, raw API responses. Risks information overload and could accidentally log sensitive data (API responses with PII)."
    rationale: >
      The feature_267 pattern logs at each major boundary: 'Task 1: Generating markdown content',
      'Task 2: Writing markdown file to disk', 'Task 3: Validating markdown file', etc. This
      'step-by-step progress tracking' from codebase analysis provides enough observability to
      answer: where did it fail? how far did it progress? The structlog framework with INFO
      level for major steps and DEBUG level for details provides configurable verbosity. Langfuse
      integration captures the full trace at INFO level for production observability while keeping
      logs readable. Each step log includes timestamp (via TimeStamper processor), step name,
      and relevant context (file size, commit message, etc.). This balances clarity and practicality.

  - title: "Observability and Langfuse Integration"
    chosen: "Include Langfuse integration via sheep.observability patterns"
    rejected:
      - "Structured logging only (no Langfuse) — Loses cloud observability and traces. Logs are text in stderr; no structured queries or performance dashboards. Harder to correlate feature execution across infrastructure."
      - "Make Langfuse optional/conditional — Adds configuration burden and creates two code paths. Operators must remember to set LANGFUSE_SECRET_KEY or features silently run without tracing. Inconsistent observability across environments."
    rationale: >
      Langfuse (>=2.0.0) is listed as an explicit project dependency. The openinference-instrumentation-crewai
      package provides automatic CrewAI instrumentation to Langfuse. The sheep.observability module
      already integrates Langfuse for tracing. Feature modules should follow this pattern: when
      structlog logs at INFO level, those events automatically flow to Langfuse if LANGFUSE_SECRET_KEY
      is configured. This provides: 1) structured event tracing in Langfuse UI, 2) performance
      metrics (latency per step), 3) error tracking with full context, 4) correlation across
      distributed calls. The implementation requires zero additional code in feature_270 module;
      it inherits tracing from get_reasoning_llm() LLM instance and structured logging.

  - title: "Git Operations Library Selection"
    chosen: "Use GitPython (>=3.1.0) via sheep.tools.GitCommitTool and GitPushTool"
    rejected:
      - "Execute git commands via subprocess/shell — Simpler initial implementation but creates security risks (shell injection), platform-specific behavior (Windows vs Unix), and hard-to-parse output. GitPython abstracts these concerns."
      - "Use subprocess.run(['git', 'add', ...]) directly — Still avoids shell injection but loses error handling, output parsing, and cross-platform abstractions. GitPython is already a dependency; not using it wastes the investment."
    rationale: >
      GitPython is a mature library (>=3.1.0, stable API) that wraps git operations safely. The
      sheep.tools module provides GitCommitTool and GitPushTool which encapsulate git logic,
      handle errors, and ensure cross-platform compatibility. The GitCommitTool._run() method
      accepts repo_path and commit message, handles staging (git add), creates the commit with
      proper error handling, and returns result. GitPushTool._run() handles push with upstream
      tracking (--set-upstream origin HEAD). This abstraction ensures consistency: all features
      use the same git infrastructure, reducing duplication and risk of divergent implementations.

  - title: "Error Handling and Exception Strategy"
    chosen: "Catch specific exceptions, log with context, reraise for caller to handle"
    rejected:
      - "Silent failure with logging only — Feature silently succeeds even if critical step fails. Operators assume feature worked because no exception was raised. Dangerous in automated pipelines."
      - "Generic Exception catch with generic error message — Loses specific error context (IOError vs ValueError vs APIError). Makes debugging harder. Doesn't distinguish recoverable (transient) vs fatal (invalid input) errors."
    rationale: >
      The feature_267 pattern (lines 105-107) catches Exception, logs with _logger.error(),
      and reraises. This preserves stack trace and lets caller decide how to handle it (retry,
      skip, alert). Each utility function (generate_markdown_content, write_markdown_file, etc.)
      raises specific exceptions: ValueError for validation failures, IOError/OSError for file
      operations, Exception for git failures. The feature orchestrator logs the step where
      failure occurred ('Failed to create feature {FEATURE_NUMBER}: {e}') providing context
      for debugging. This pattern is robust: errors propagate, full stack trace is preserved,
      and logs capture the failure context at the point of origin (most specific location).

