content: |
  ## Problem Statement

  Create a markdown file named `test-f2zwii.md` in the repository root with an H1 heading and 2-3 sentences of coherent prose content. This is the 270th iteration of a markdown file creation feature in the Sheep agentic platform, following the established pattern from 269 preceding features.

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as a modular agentic platform for automated code implementation:

  ```
  src/
  ├── sheep/
  │   ├── agents/           # Agent definitions (research, implementation, review)
  │   ├── config/           # Configuration (LLM factory, settings management)
  │   ├── flows/            # Flow orchestration (execution control paths)
  │   ├── features/         # Individual feature implementations (feature_001...feature_269)
  │   ├── tools/            # Git and file operation tools
  │   ├── observability/    # Logging and tracing (Langfuse integration)
  │   └── content_generators.py  # Shared utilities for markdown creation
  └── create_markdown.py    # Legacy standalone markdown orchestration (1318 lines)
  ```

  ### Architecture Patterns

  1. **Content Generation**: Uses Anthropic Claude API via CrewAI LLM framework
     - Prompt-based generation with validation
     - Retry logic with exponential backoff for API failures
     - Structured content requirements (H1 heading + 2-3 sentences)

  2. **File Operations**: Pathlib-based file management
     - UTF-8 encoding without BOM (explicitly enforced)
     - Unix LF line endings (validated)
     - Parent directory auto-creation
     - Fail-safe: prevents overwriting existing files

  3. **Git Integration**: GitPython-based workflow
     - File staging with `git add`
     - Conventional commit format: `feat(270): create markdown file test-f2zwii.md with prose content`
     - Automatic push to feature branch
     - Branch naming convention: `feat/270-markdown-file-creation-a09312`

  4. **Validation Layer**: Multi-stage validation
     - Content validation: H1 heading, 2-3 sentences, minimum length
     - File encoding validation: UTF-8 (no BOM), LF line endings
     - File size validation: 250-600 bytes typical range

  5. **Logging & Observability**: Structured logging with structlog
     - Step-by-step progress tracking
     - Langfuse integration for execution traces
     - Error context preservation

  ### Relevant Technologies

  - **CrewAI (>=0.86.0)**: Agentic orchestration framework for agent coordination
  - **Anthropic Claude API**: Via CrewAI's LLM framework for content generation
  - **GitPython (>=3.1.0)**: Git operations (staging, committing, pushing)
  - **Pydantic (>=2.0.0)**: Data validation and settings management
  - **structlog (>=24.0.0)**: Structured logging framework
  - **Langfuse (>=2.0.0)**: Observability platform for execution tracing

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | The markdown file `test-f2zwii.md` will be created here (project convention) |
  | `src/sheep/features/` | Medium | New file `feature_270_markdown_file_creation.py` will be created following established pattern |
  | `src/sheep/content_generators.py` | Low | Existing utilities will be reused; no modifications needed |
  | `.git/` (working directory) | High | File will be staged, committed with conventional commit format, and pushed to feature branch |
  | Git history | Low | Adds one commit with message format: `feat(270): create markdown file test-f2zwii.md with prose content` |

  ## Dependencies

  ### Existing Code
  - `sheep.content_generators`: `generate_markdown_content()`, `write_markdown_file()`, `validate_markdown_file()`, `commit_markdown_file()`, `push_markdown_file()`
  - `sheep.config.llm.get_reasoning_llm()`: LLM factory for Claude API access
  - `sheep.observability.logging.get_logger()`: Structured logging

  ### External Libraries
  - **Anthropic Claude API**: Generates markdown content via CrewAI
  - **GitPython**: Stages, commits, and pushes file to feature branch
  - **Pydantic**: Settings validation and environment management

  ### Git Infrastructure
  - Feature branch: `feat/270-markdown-file-creation-a09312`
  - Remote: `origin`
  - Push target: Feature branch on remote

  ## Size Estimate

  **S** — This is a single, well-established task requiring minimal implementation effort:

  - **Content generation**: Uses existing `generate_markdown_content()` function (already tested with 269 iterations)
  - **File creation**: Uses existing `write_markdown_file()` function with standardized encoding/line-ending handling
  - **Validation**: Uses existing `validate_markdown_file()` function
  - **Git workflow**: Uses existing `commit_markdown_file()` and `push_markdown_file()` functions
  - **New code**: Only a new feature module (`feature_270_markdown_file_creation.py`) following the exact pattern of feature_267

  **Estimated effort**: 1-2 hours including testing and validation. The implementation is essentially a copy-paste of `feature_267_markdown_file_creation.py` with updated metadata (feature number, filename, etc.). All infrastructure and utility functions are already in place and tested.
