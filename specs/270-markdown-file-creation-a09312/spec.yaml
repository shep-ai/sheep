content: |
  ## Problem Statement

  Create a markdown file named `test-f2zwii.md` in the repository root with an H1 heading and 2-3 sentences of coherent prose content. This is the 270th iteration of a markdown file creation feature in the Sheep agentic platform, following the established pattern from 269 preceding features. The feature demonstrates the platform's capability to orchestrate content generation via Claude API, file system operations, and git workflows in a reproducible, observable manner.

  ## Success Criteria

  - [ ] Markdown file `test-f2zwii.md` exists in repository root with correct name and location
  - [ ] File contains exactly one H1 heading (starts with `#`) as the first line
  - [ ] File contains 2-3 grammatically correct sentences of coherent prose after the heading
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix LF line endings (no CR, no CRLF)
  - [ ] File size is within expected range of 250-600 bytes
  - [ ] Content validation passes all checks (H1 presence, sentence count, minimum length)
  - [ ] File is staged with `git add test-f2zwii.md`
  - [ ] Commit is created with exact message: `feat(270): create markdown file test-f2zwii.md with prose content`
  - [ ] Commit is pushed to remote on branch `feat/270-markdown-file-creation-a09312`
  - [ ] No pre-existing file is overwritten; operation fails if file already exists
  - [ ] All major execution steps are logged via structured logging (content generation, file creation, validation, staging, commit, push)
  - [ ] Langfuse trace is created if credentials are available, capturing full execution flow
  - [ ] API failures trigger exponential backoff retry logic with documented max attempts
  - [ ] Feature module `feature_270_markdown_file_creation.py` follows exact structure of `feature_267_markdown_file_creation.py`

  ## Functional Requirements

  - **FR-1: Content Generation via Claude API**
    - Use existing `sheep.content_generators.generate_markdown_content()` function
    - Content must include exactly one H1 heading (must start with `#`)
    - Content must include 2-3 grammatically correct sentences
    - Each sentence must be complete and contextually coherent
    - Generated content must be suitable for a markdown file (no extra formatting)
    - API calls must use CrewAI LLM framework via `sheep.config.llm.get_reasoning_llm()`
    - Transient API failures must trigger exponential backoff retry logic (1s, 2s, 4s, 8s delays with reasonable max attempts)

  - **FR-2: File Creation at Repository Root**
    - Create file named exactly `test-f2zwii.md` in repository root directory
    - Parent directories must exist (auto-create if needed via pathlib)
    - File must not be created if `test-f2zwii.md` already exists; operation must fail with clear error
    - File ownership and permissions inherited from parent directory (no special chmod)
    - File must contain generated markdown content with no additional wrapper or transformation

  - **FR-3: File Encoding and Format Validation**
    - Write file using UTF-8 encoding explicitly (no BOM - Byte Order Mark)
    - Use Unix LF line endings exclusively (no CR, no CRLF)
    - Validate encoding after write: read file back and confirm UTF-8 without BOM
    - Validate line endings after write: confirm all lines use LF only
    - Report validation failure immediately if checks fail

  - **FR-4: Content Validation**
    - Validate file contains exactly one H1 heading starting with `#` on first line
    - Validate file contains 2-3 sentences (count sentences after heading)
    - Validate no lines have trailing whitespace
    - Validate file size is within 250-600 bytes (typical range for H1 + 2-3 sentences)
    - Report validation errors with clear context (which check failed, actual vs expected)
    - Use existing `sheep.content_generators.validate_markdown_file()` function

  - **FR-5: Git Staging and Commit**
    - Stage file with `git add test-f2zwii.md` command
    - Create commit with exact message: `feat(270): create markdown file test-f2zwii.md with prose content`
    - Use conventional commit format (feat(NUMBER): ...)
    - Commit must be created on current feature branch `feat/270-markdown-file-creation-a09312`
    - Use existing `sheep.content_generators.commit_markdown_file()` function

  - **FR-6: Git Push to Remote**
    - Push commit to remote `origin` on feature branch `feat/270-markdown-file-creation-a09312`
    - Push must occur after successful commit
    - Use `--set-upstream origin HEAD` if branch is not yet tracked
    - Use existing `sheep.content_generators.push_markdown_file()` function
    - Allow network failures to be handled by retry logic

  - **FR-7: Feature Module Implementation**
    - Create new file `src/sheep/features/feature_270_markdown_file_creation.py`
    - Structure module exactly as `feature_267_markdown_file_creation.py` (verified by direct code comparison)
    - Module must export execution function callable by feature orchestration system
    - Module must use existing utility functions from `sheep.content_generators`
    - Module must not modify shared utility functions

  ## Non-Functional Requirements

  - **NFR-1: Performance**
    - Content generation via API must complete within 30 seconds
    - File creation must be instant (< 1 second)
    - Validation must complete within 1 second
    - Git staging must complete within 2 seconds
    - Commit creation must complete within 2 seconds
    - Push to remote must complete within 10 seconds (excluding network latency)
    - Total execution time target: < 60 seconds end-to-end

  - **NFR-2: Reliability**
    - API call failures must not cause operation abort without retry
    - Exponential backoff retry logic must be applied (1s, 2s, 4s, 8s minimum delays)
    - Maximum of 4-5 retry attempts before final failure
    - File system operations must be atomic (create temp file, move/rename on success)
    - Git operations must be verifiable (confirm file staged, commit created, push successful)
    - Transient network failures during push must be handled gracefully

  - **NFR-3: Observability and Logging**
    - Structured logging using `structlog` framework for all major steps
    - Each step logged with context: timestamp, step name, status, duration
    - Log levels: INFO for major steps, DEBUG for detailed operations, ERROR for failures
    - Langfuse integration must capture full execution trace if configured
    - Error logs must include stack traces and error context
    - Logs must not contain sensitive information (API keys, tokens, credentials)
    - Logs must be machine-parseable (JSON format via structlog)

  - **NFR-4: Maintainability and Code Quality**
    - Feature module must follow exact pattern from `feature_267_markdown_file_creation.py`
    - Code must be reusable for future iterations (270-N pattern for all future features)
    - Naming conventions must match codebase (feature_NNN_description.py)
    - Docstrings must document purpose, inputs, outputs, and error cases
    - No magic numbers; use named constants for retry counts, timeouts, file sizes
    - Share utility functions via `sheep.content_generators` (do not duplicate code)

  - **NFR-5: Security**
    - No sensitive information stored in git commit messages
    - API credentials managed via CrewAI config (not embedded in feature module)
    - File permissions inherited from repository directory (no special chmod)
    - No execution of arbitrary user input via shell commands
    - Git operations must use GitPython library (not shell exec)
    - Log output must be sanitized (no token leakage)

  - **NFR-6: Validation Strictness**
    - Content validation must enforce 2-3 sentence requirement strictly
    - H1 heading must be present and formatted correctly (starting with `#`)
    - UTF-8 encoding must be verified (no BOM, no other encodings)
    - Line endings must be Unix LF only (reject CRLF or mixed)
    - File size must be within documented range (250-600 bytes typical)
    - All validation failures must report specific error cause

  - **NFR-7: Consistency**
    - Output must match format of all preceding iterations (feature_001 through feature_269)
    - Git history must show single, well-formed commit
    - File content structure identical to feature_267 and earlier iterations
    - No divergence from established patterns

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should content validation enforce exactly 2-3 sentences or allow flexibility? | Strict 2-3 sentences | Aligns with feature specification and codebase analysis; maintains consistency across 270 iterations |
  | 2 | How should system handle attempts to overwrite existing test-f2zwii.md? | Fail with clear error message | Matches codebase 'fail-safe' pattern; prevents accidental data loss |
  | 3 | What retry strategy for Anthropic Claude API failures? | Exponential backoff | Codebase analysis explicitly documents this pattern; handles transient failures effectively |
  | 4 | Reuse existing generate_markdown_content() or create custom logic? | Reuse existing function | Already tested across 269 iterations; reduces complexity; maintains patterns |
  | 5 | Mirror feature_267 exactly or allow enhancements? | Exact copy of feature_267 pattern | Guaranteed consistency; size estimate shows 'essentially a copy-paste'; minimizes implementation risk |
  | 6 | What detail level for structured logging? | Standard (each major step) | Matches codebase 'step-by-step progress tracking'; sufficient for debugging |
  | 7 | Include Langfuse observability tracing? | Include Langfuse integration | Codebase lists Langfuse as dependency; matches sheep.observability patterns |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | The markdown file `test-f2zwii.md` will be created here (project convention) |
  | `src/sheep/features/` | Medium | New file `feature_270_markdown_file_creation.py` will be created following established pattern |
  | `src/sheep/content_generators.py` | Low | Existing utilities will be reused; no modifications needed |
  | `.git/` (working directory) | High | File will be staged, committed with conventional commit format, and pushed to feature branch |
  | Git history | Low | Adds one commit with message format: `feat(270): create markdown file test-f2zwii.md with prose content` |

  ## Dependencies

  ### Existing Code
  - `sheep.content_generators.generate_markdown_content()`: Generate H1 + prose via Claude API
  - `sheep.content_generators.write_markdown_file()`: File creation with UTF-8/LF validation
  - `sheep.content_generators.validate_markdown_file()`: Content and encoding validation
  - `sheep.content_generators.commit_markdown_file()`: Git staging and commit
  - `sheep.content_generators.push_markdown_file()`: Push to remote
  - `sheep.config.llm.get_reasoning_llm()`: LLM factory for Claude API access
  - `sheep.observability.logging.get_logger()`: Structured logging infrastructure

  ### External Libraries
  - **Anthropic Claude API**: Generates markdown content via CrewAI
  - **CrewAI (>=0.86.0)**: Agentic orchestration and LLM framework
  - **GitPython (>=3.1.0)**: Git operations (staging, committing, pushing)
  - **Pydantic (>=2.0.0)**: Data validation and settings management
  - **structlog (>=24.0.0)**: Structured logging framework
  - **Langfuse (>=2.0.0)**: Observability platform for execution tracing

  ### Git Infrastructure
  - Feature branch: `feat/270-markdown-file-creation-a09312`
  - Remote: `origin`
  - Push target: Feature branch on remote
  - Conventional commit format: `feat(NUMBER): create markdown file test-FILE.md with prose content`

  ## Size Estimate

  **S** — This is a single, well-established task requiring minimal implementation effort:

  - **Content generation**: Uses existing `generate_markdown_content()` function (already tested with 269 iterations)
  - **File creation**: Uses existing `write_markdown_file()` function with standardized encoding/line-ending handling
  - **Validation**: Uses existing `validate_markdown_file()` function
  - **Git workflow**: Uses existing `commit_markdown_file()` and `push_markdown_file()` functions
  - **New code**: Only a new feature module (`feature_270_markdown_file_creation.py`) following the exact pattern of feature_267

  **Estimated effort**: 1-2 hours including testing and validation. The implementation is essentially a copy-paste of `feature_267_markdown_file_creation.py` with updated metadata (feature number, filename, etc.). All infrastructure and utility functions are already in place and tested.
