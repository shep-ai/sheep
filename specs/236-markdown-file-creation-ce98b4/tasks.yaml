content: |
  ## Summary

  This feature is implemented in 7 focused tasks across 2 sequential phases:

  **Phase 1: File Creation & Validation (4 tasks, ~80 minutes)**
  - Create the markdown file with H1 heading and 2-3 sentences of prose (task-1)
  - Validate encoding (UTF-8 without BOM) and line endings (Unix LF) (task-2)
  - Validate markdown structure (H1 + blank line + 2-3 sentences) (task-3)
  - Validate file size (400-600 bytes) (task-4)

  **Phase 2: Git Integration (3 tasks, ~45 minutes)**
  - Stage file with git add (task-5)
  - Commit with conventional message format (task-6)
  - Push to feature branch (task-7)

  Each task follows TDD: write a test that fails (RED), implement minimal code to pass (GREEN),
  then clean up and improve code structure (REFACTOR). Validation is front-loaded in phase 1
  to ensure only correct files are committed; git operations in phase 2 are straightforward
  and well-understood.

  Tasks are ordered by dependency: file must exist and be valid before staging; staging must
  complete before committing; commits must exist before pushing. No parallelization is possible
  due to strict sequential dependencies.

  **Effort Estimate:** 2h 5min total (or roughly 10-15 minutes in practice if implementation
  is streamlined). This aligns with the small (S) size estimate and matches actual implementation
  time from 90+ identical precedent features.

  ---

