  ## Summary

  This feature requires a single, straightforward task: create the markdown file test-yqt0pi.md
  at the repository root. The file must contain an H1 heading and 2-3 sentences of coherent
  content, using UTF-8 encoding and Unix line endings (LF).

  **Task sequence:**

  1. **Create and validate test-yqt0pi.md** — Write the file with proper markdown structure,
     verify all functional and non-functional requirements are met, and ensure the file
     follows the established pattern of existing test-*.md files in the repository.

  The TDD cycle for this task is:
  - **RED:** Define verification assertions for file existence, structure, encoding, and line endings
  - **GREEN:** Create the file with H1 heading and 2-3 sentences of prose, encoded in UTF-8 with LF ending
  - **REFACTOR:** Review content quality, compare to existing test files, ensure prose is coherent and matches repository style

  No external dependencies exist. No code changes required. The file integrates directly
  into the existing collection of test-*.md files at the repository root.

  **Effort estimate:** 15 minutes total (straightforward single-file creation following established pattern).
