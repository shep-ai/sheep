  | --- | --- | --- | --- |
  | Markdown | File format | Use | Plain text format, human-readable, supported by git, matches existing pattern |
  | UTF-8 | Text encoding | Use | Standard encoding for text files, required by FR-4, fully compatible with git |
  | LF | Line ending | Use | Unix standard, required by FR-5, prevents merge conflicts |

