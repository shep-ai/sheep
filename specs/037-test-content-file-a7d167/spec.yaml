# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository contains an established pattern of creating test markdown files at the repository root
  (test-*.md files) as part of feature development. This feature continues that pattern by creating a new
  markdown file named `test-yqt0pi.md` with a title and 2-3 sentences of arbitrary content.

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-yqt0pi.md` at the repository root
  - **FR-2**: File must contain exactly one H1 markdown heading (`# Title`)
  - **FR-3**: File must contain 2-3 sentences of content immediately following the heading
  - **FR-4**: File must use UTF-8 text encoding
  - **FR-5**: File must end with a newline character (LF)

  ## Non-Functional Requirements

  - **NFR-1**: File structure must match the established pattern of existing test-*.md files (test-u6624u.md, test-hhpvhe.md, etc.)
  - **NFR-2**: File must be a valid UTF-8 text file that can be tracked by git
  - **NFR-3**: Content should be coherent and meaningful (not random gibberish), though topic is arbitrary

  ## Success Criteria

  - [ ] File `test-yqt0pi.md` exists at repository root
  - [ ] File contains exactly one H1 heading (line starting with `#` followed by space and title)
  - [ ] File contains 2-3 complete sentences of content below the heading
  - [ ] File is valid UTF-8 with no encoding errors
  - [ ] File ends with exactly one newline character
  - [ ] No other files are modified (only test-yqt0pi.md is added)
  - [ ] File structure matches existing test-*.md files in the repo

  ## Product Questions & AI Recommendations

  No product questions or ambiguous decisions identified. The specification is explicit about:
  - File name and location (test-yqt0pi.md at repository root)
  - Structure (H1 heading + 2-3 sentences)
  - Format (UTF-8 with trailing newline)
  - Pattern consistency (follows existing test-*.md files)

  The only developer choice is the content topic, which is intentionally left open ("about anything").

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | test-yqt0pi.md (new file) | Low | New standalone markdown file at repository root, follows established pattern |
  | specs/037-test-content-file-a7d167/ | Low | Specification files only, no code changes |

  ## Dependencies

  None. This feature is completely independent with no dependencies on other code, libraries, or infrastructure.

  ## Size Estimate

  **S** — Straightforward single-file creation task. No code changes, no infrastructure modifications, no tests required.
  Analogous to features 035-036 (simple content creation). Estimated effort: less than 1 hour.
