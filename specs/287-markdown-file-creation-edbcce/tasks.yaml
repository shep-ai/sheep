content: |
  ## Summary

  This feature implements a 2-task workflow across 2 phases:

  **Phase 1: File Creation & Validation (Task 1, ~8 min)**
  Create test-hzqchm.md at repository root with proper markdown structure using pathlib.Path.write_text(),
  ensuring UTF-8 encoding without BOM and LF line endings. Validate file meets all technical requirements
  (structure, encoding, line endings, size, syntax).

  **Phase 2: Git Integration (Task 2, ~7 min)**
  Stage the created file with git add, commit with conventional commit message
  `feat(287): create markdown file test-hzqchm.md with title and prose content`, and push to feature
  branch feat/287-markdown-file-creation-edbcce on remote origin.

  **Rationale:** File must be created and validated before git operations (Task 2 depends on Task 1).
  This follows the established pattern used across 287+ similar test-file-creation features, requiring
  only Python stdlib (pathlib, subprocess) and standard git configuration. Total estimated effort: 15 minutes.

  ## Detailed Task Breakdown

  ### Task 1: Create markdown file with proper structure, encoding, and line endings

  **What:** Create test-hzqchm.md with H1 heading and 2-3 sentences of prose, using pathlib with explicit
  UTF-8 encoding and LF line endings.

  **Why:** Specification requires specific file format, encoding, line endings, and size. This must be
  completed before Task 2 (git integration) can proceed.

  **How:** Use pathlib.Path.write_text(content, encoding=\"utf-8\", newline=\"\") to ensure correct
  encoding and line endings across all platforms (Windows, Linux, macOS).

  **Acceptance Criteria:**
  - File exists at repository root
  - Contains H1 heading and 2-3 sentences
  - Uses UTF-8 encoding without BOM
  - Uses LF line endings
  - File size approximately 400-600 bytes
  - Prose content is meaningful and grammatically correct
  - Markdown syntax is valid per CommonMark specification

  ### Task 2: Implement git workflow (add, commit, push)

  **What:** Stage the markdown file with git add, commit with conventional message, and push to feature branch.

  **Why:** Specification requires changes to be integrated into version control with proper commit message
  and branch workflow.

  **How:** Use subprocess.run() to execute git CLI commands (add, commit, push) with proper error
  handling and verification.

  **Acceptance Criteria:**
  - File staged with git add
  - Committed with exact message: feat(287): create markdown file test-hzqchm.md with title and prose content
  - Pushed to remote origin branch feat/287-markdown-file-creation-edbcce
  - git log shows correct commit message
  - No other files staged or committed

  ## Testing Strategy

  **Task 1 (File Creation):**
  - Assert file does not exist before creation
  - Assert file exists after creation
  - Verify file contents (heading, sentences, blank line)
  - Validate encoding (read as bytes, verify UTF-8 without BOM)
  - Validate line endings (check for '\\n' not '\\r\\n')
  - Check file size in 400-600 byte range
  - Validate CommonMark syntax

  **Task 2 (Git Integration):**
  - Assert git add succeeds (exit code 0)
  - Assert git commit succeeds with correct message
  - Assert git push succeeds
  - Verify git log output contains exact commit message
  - Confirm git status is clean (no uncommitted changes)
  - Verify remote branch is updated

  ## Total Effort Estimate

  - Task 1 (File Creation): 8 minutes
  - Task 2 (Git Integration): 7 minutes
  - **Total: 15 minutes**

  This follows the established pattern with 287+ similar features. Time estimates account for:
  - Simple file I/O (~3 min)
  - Validation and verification (~3 min)
  - Git workflow (add, commit, push) (~5 min)
  - Testing and verification (~4 min)
