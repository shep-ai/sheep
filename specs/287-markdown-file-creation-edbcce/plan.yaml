content: |
  ## Architecture Overview

  This feature follows the well-established test-file-creation pattern used consistently across 287+ features
  in the Sheep automation platform. The implementation is deliberately minimal and isolated:

  - **No impact on source code**: Changes confined to repository root (one new markdown file)
  - **No dependencies on application logic**: File is a test artifact with no coupling to /src/sheep/ or other modules
  - **Standard git workflow**: Uses git CLI commands via subprocess (no external dependencies like GitPython)
  - **Simple file I/O**: Uses Python's pathlib module (required by specification, available in stdlib)

  The architecture is consistent with prior features (284-286) and demonstrates the principle of minimal,
  focused changes with clear success criteria. No architectural complexity or refactoring is required.

  ## Key Design Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** `pathlib.Path("test-hzqchm.md").write_text(content, encoding="utf-8", newline="")`

  **Rationale:**
  - Specification explicitly requires pathlib (NFR-5)
  - Modern Python standard for file operations in Python 3.11+
  - write_text() method elegantly handles both encoding and newline parameters
  - Eliminates manual file handle management vs. open()
  - Object-oriented API is clearer than os.path idioms

  ### 2. Line Ending Control: Universal Newlines Mode

  **Chosen:** Use `newline=""` parameter with write_text() to preserve LF line endings

  **Rationale:**
  - Specification requires LF line endings (NFR-2)
  - On Windows, Python's default text mode converts '\\n' to '\\r\\n', violating requirement
  - `newline=""` forces universal newlines mode, preserving '\\n' exactly as written
  - Standard Python approach, works identically on all platforms (Windows, Linux, macOS)
  - Requires no additional configuration or platform-conditional code

  ### 3. Character Encoding: Explicit UTF-8 Without BOM

  **Chosen:** `encoding="utf-8"` parameter, no BOM (Byte Order Mark)

  **Rationale:**
  - Specification requires UTF-8 without BOM (NFR-1)
  - Explicit encoding ensures correctness and intent clarity
  - Python's UTF-8 codec does not add BOM by default
  - Explicit specification guarantees this behavior regardless of system configuration

  ### 4. Content Generation: Simple Imperative Approach

  **Chosen:** Manually authored prose content (simple, straightforward)

  **Rejected alternatives:**
  - CrewAI agent-based generation — over-engineered for test files, adds unnecessary complexity
  - Template system — unnecessary abstraction for simple content
  - Algorithmic/random generation — cannot ensure meaningful, grammatically correct text

  **Rationale:**
  - Specification requires meaningful, grammatically correct prose (FR-5)
  - Manual authoring guarantees quality and certainty
  - 287+ existing test files follow this simple pattern
  - Imperative approach (compose string, write to file) is fastest (~5 minutes for creation)
  - Consistent with established patterns in the codebase

  ### 5. Git Workflow: subprocess Module for CLI Commands

  **Chosen:** Use subprocess.run() to execute git add, commit, push

  **Rejected alternatives:**
  - GitPython library — adds external dependency, overkill for simple operations
  - Full CrewAI agent orchestration — over-engineered for mechanical workflow

  **Rationale:**
  - subprocess is part of Python standard library (no external dependencies)
  - Reliably executes git CLI commands without additional complexity
  - Git CLI guaranteed to be available in git repository
  - Simple to understand and debug

  ### 6. File Naming: Exact Specification

  **Chosen:** Use exact filename from specification: `test-hzqchm.md`

  **Rationale:**
  - Specification explicitly provides exact filename as functional requirement (FR-1)
  - Ensures consistency with 287+ existing test files

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**
  - Create markdown file with H1 heading and 2-3 sentences of prose
  - Ensure file uses correct encoding (UTF-8, no BOM) and line endings (LF)
  - Validate file size (~400-600 bytes) and CommonMark syntax compliance
  - This phase is self-contained and produces the artifact required by Phase 2

  **Phase 2: Git Integration**
  - Stage created file with `git add test-hzqchm.md`
  - Commit with conventional message
  - Push to feature branch on remote origin
  - This phase depends on Phase 1 (file must exist before staging)

  **Rationale for Phase Ordering:**
  - Phase 1 comes first because git operations require the file to exist
  - Separating concerns makes testing and validation clearer
  - Phase 1 validates the artifact before Phase 2 integrates it into version control

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | Incorrect line endings on Windows | File would use CRLF instead of LF, violating specification | Use `newline=""` parameter in write_text() to force universal newlines mode |
  | UTF-8 encoding with BOM | File would include Byte Order Mark, violating specification | Explicitly specify `encoding="utf-8"` (not `utf-8-sig`) |
  | File size outside expected range | Indicates content structure problem | Write test that validates file size is in ~400-600 byte range |
  | Git configuration missing | Commit would fail if user.name or user.email not set | Feature branch is pre-created; standard git config required |
  | Invalid CommonMark syntax | File would not conform to specification | Validate markdown syntax in test or manual verification |
  | Feature branch doesn't exist | Push would fail | Feature branch `feat/287-markdown-file-creation-edbcce` is pre-created by system |

  ## Implementation Constraints

  - **No source code modifications**: Feature must not change /src/sheep/, configuration files, or test infrastructure
  - **Single file only**: Create only test-hzqchm.md; no other files
  - **No external dependencies**: Use only Python stdlib (pathlib, subprocess)
  - **Exact specifications**: Follow file naming, commit message format, and technical requirements precisely
  - **Established pattern**: Implementation must be consistent with 287+ existing test files
