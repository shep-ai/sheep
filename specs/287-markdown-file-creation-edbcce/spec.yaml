# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following
  an established pattern. This feature creates a single test markdown file (`test-hzqchm.md`) at the repository
  root with a title and prose content, serving as a minimal, testable unit of work for the automated implementation system.

  The feature continues a well-established pattern with 287+ similar test files already existing in the repository
  as precedents (test-*.md files at the root directory). This represents feature #287 in the markdown-file-creation
  pattern series, with identical requirements and implementation approach across all iterations.

  ## Success Criteria

  - [ ] File `test-hzqchm.md` is created at the repository root directory
  - [ ] File contains a valid markdown H1 heading as the title (format: `# Title`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by blank line
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses LF line endings (`\n`), not CRLF or other line ending formats
  - [ ] File size is approximately 400-600 bytes (natural outcome of proper structure)
  - [ ] Markdown syntax is valid per CommonMark specification with no syntax errors
  - [ ] File is staged in git using `git add test-hzqchm.md`
  - [ ] Changes are committed with conventional commit message: `feat(287): create markdown file test-hzqchm.md with title and prose content`
  - [ ] Commit is pushed to the feature branch `feat/287-markdown-file-creation-edbcce` on remote origin
  - [ ] No modifications are made to source code, configuration files, or test infrastructure
  - [ ] Prose content is meaningful, grammatically correct text on any topic

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-hzqchm.md` at the repository root using Python's pathlib.Path
  - **FR-2**: File must contain a markdown H1 heading (single `#` symbol followed by space) as the title
  - **FR-3**: File must have a blank line between the title heading and prose content
  - **FR-4**: File must contain exactly 2-3 sentences of prose content (not more, not less)
  - **FR-5**: Prose content must be meaningful, grammatically correct text with proper capitalization and punctuation
  - **FR-6**: Prose content may be on any topic; no topic constraints or requirements
  - **FR-7**: Stage the created file using `git add test-hzqchm.md` command
  - **FR-8**: Commit changes using conventional commit format with exact message: `feat(287): create markdown file test-hzqchm.md with title and prose content`
  - **FR-9**: Push the commit to remote feature branch using `git push -u origin feat/287-markdown-file-creation-edbcce` or equivalent

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark); no other encodings allowed
  - **NFR-2**: Line endings must be LF (`\n`), not CRLF (`\r\n`) or other formats; ensures cross-platform compatibility
  - **NFR-3**: File size must be approximately 400-600 bytes as a natural outcome of H1 title + 2-3 sentence prose
  - **NFR-4**: Markdown syntax must strictly conform to CommonMark specification (https://spec.commonmark.org/)
  - **NFR-5**: Implementation must use Python pathlib.Path for file I/O operations (no os.path or string manipulation)
  - **NFR-6**: Implementation must follow straightforward, imperative coding pattern (create content string, write to file) consistent with 287+ existing test files
  - **NFR-7**: No external dependencies beyond Python 3.11+ standard library and existing project dependencies
  - **NFR-8**: No changes to source code files in `/src/sheep/`, configuration files, or test infrastructure
  - **NFR-9**: Git operations (add, commit, push) must use standard git CLI commands with conventional commit format
  - **NFR-10**: Implementation must complete within estimated 10-15 minutes following established pattern

