content: |
  ## Technology Decisions

  ### 1. File I/O Implementation: pathlib.Path

  **Chosen:** `pathlib.Path("test-hzqchm.md").write_text(content, encoding="utf-8", newline="")`

  **Rejected:**
  - os.path.join() with open() — older idiom, requires separate file handle management
  - Direct open() with string path — more verbose, less expressive about path handling
  - External libraries — pathlib is sufficient and built-in

  **Rationale:** The specification explicitly requires pathlib.Path (NFR-5). It's the modern Python
  standard for file operations in Python 3.11+. The write_text() method is clean, handles both
  encoding and newline parameters, and eliminates manual file handle management. This is the
  recommended approach in modern Python code.

  ### 2. Line Ending Control: Universal Newlines Mode

  **Chosen:** Use `newline=""` parameter with write_text() to preserve LF line endings

  **Rejected:**
  - Binary mode with manual encoding — adds unnecessary complexity
  - Git configuration (core.autocrlf) — requires user setup, not guaranteed
  - Platform-conditional code — adds complexity without benefit

  **Rationale:** The specification requires LF line endings (NFR-2). On Windows, Python's default
  text mode converts '\n' to '\r\n'. The `newline=""` parameter forces universal newlines mode,
  preserving '\n' exactly. This is the standard Python approach, works identically on all platforms,
  and requires no additional configuration.

  ### 3. Character Encoding: Explicit UTF-8

  **Chosen:** `encoding="utf-8"` explicitly specified, no BOM

  **Rejected:**
  - Implicit default encoding — system-dependent, unclear intent
  - `encoding="utf-8-sig"` — would add Byte Order Mark, violating NFR-1
  - Binary mode — unnecessary for text files

  **Rationale:** The specification requires UTF-8 without BOM (NFR-1). Explicit encoding ensures
  correctness and intent clarity. Python's UTF-8 codec does not add BOM by default, but explicit
  specification guarantees this behavior regardless of system configuration.

  ### 4. Content Generation: Simple Imperative Approach

  **Chosen:** Manually authored prose content following the established pattern

  **Rejected:**
  - CrewAI agent-based generation — over-engineered for test files
  - Template system — unnecessary abstraction
  - Algorithmic generation — cannot ensure meaningful, correct content

  **Rationale:** The specification requires meaningful, grammatically correct prose. Manual authoring
  guarantees this. The 287+ existing test files follow this simple pattern. For a minimal feature,
  straightforward hand-written content is most appropriate.

  ### 5. Git Workflow: subprocess CLI Integration

  **Chosen:** Use subprocess module to execute git commands

  **Rejected:**
  - GitPython library — adds external dependency not needed for simple operations
  - Full CrewAI orchestration — over-engineered for mechanical workflow
  - Manual user execution — contradicts automation platform architecture

  **Rationale:** The specification describes an "automated implementation platform". subprocess is
  in the Python standard library and reliably executes git CLI commands. This avoids external
  dependencies, is guaranteed to work (git CLI is always available), and is simple to understand.

  ### 6. Markdown Format: Simple Structure

  **Chosen:** H1 heading (`# Title`) + blank line + 2-3 sentences of prose

  **Rejected:**
  - Alternative structures — specification explicitly defines this format
  - Different heading levels — specification requires H1
  - No blank line — specification requires blank line

  **Rationale:** The specification is explicit about format (FR-2, FR-3, FR-4). This simple structure
  is straightforward, CommonMark-compliant, and produces the required ~400-600 byte file naturally.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O and path operations | **Use** | Required by spec (NFR-5), part of Python 3.11+, modern API |
  | subprocess (stdlib) | Git command execution | **Use** | Reliable, no external dependencies, guaranteed available |
  | textwrap (stdlib) | Text wrapping (optional) | **Evaluate** | Not needed for 2-3 sentence prose, unnecessary complexity |
  | GitPython | Git operations via Python API | **Reject** | External dependency, overkill for simple add/commit/push |
  | CrewAI (existing) | Agent-based automation | **Evaluate** | Project uses it, but test file creation is too simple for agent overhead |
  | os.path | Legacy path operations | **Reject** | Older idiom, replaced by pathlib in modern Python |

  ## Security Considerations

  - **File Encoding:** UTF-8 without BOM ensures consistent interpretation across platforms and text processing tools
  - **Line Endings:** LF normalization prevents potential issues with tools expecting Unix line endings
  - **No Input Validation:** Content is locally authored (not user/external input), so no injection risk
  - **No Interpolation:** Git commands use exact strings (no template variables), minimal attack surface
  - **File Permissions:** Default file creation permissions are appropriate for test files
  - **No Secrets:** Content is prose only, no credentials or sensitive data at risk
  - **Git Safety:** Using git CLI commands (vs. reimplementation) ensures correct, secure git operations

  ## Performance Considerations

  - **File I/O:** Single file creation (~400-600 bytes) has negligible I/O overhead
  - **Encoding/Decoding:** UTF-8 processing is fast, unmeasurable overhead for this file size
  - **Git Operations:** Local repository operations are fast, no network latency
  - **Memory Usage:** Minimal — just holding a small content string during write
  - **Startup Cost:** subprocess.run() for git commands is fast for local operations
  - **No Optimization Needed:** This is a single-file feature with no performance-critical operations

  ## Architecture Notes

  This feature fits the established test-file-creation pattern used across 287+ features:

  - **Isolation:** Changes confined to repository root, no impact on source code (/src/sheep/)
  - **No Dependencies:** Uses only Python stdlib and existing git configuration
  - **Consistency:** Follows identical pattern as related features (284, 285, 286)
  - **Simplicity:** Straightforward imperative implementation, no complex abstractions
  - **Integration:** Works with existing Sheep platform git workflow
  - **Precedent:** 287+ existing test files demonstrate this pattern is well-established

  The feature demonstrates the principle of minimal, isolated changes with clear success criteria.
  No architectural refactoring or complex integration is required.

  ## Markdown Validation

  The output markdown conforms to CommonMark 0.30 specification:
  - H1 headings via `# Title` syntax (ATX heading format)
  - Blank lines between block elements (preserve structural separation)
  - Plain text paragraphs with no special formatting
  - UTF-8 character encoding
  - LF line endings

  No syntax errors or validation issues expected.

  ## Implementation Approach

  The straightforward implementation pattern:

  1. Compose content string: `"# Title\n\nSentence 1. Sentence 2. Sentence 3."`
  2. Write to file: `Path("test-hzqchm.md").write_text(content, encoding="utf-8", newline="")`
  3. Stage file: `subprocess.run(["git", "add", "test-hzqchm.md"])`
  4. Commit: `subprocess.run(["git", "commit", "-m", "feat(287): create markdown file test-hzqchm.md with title and prose content"])`
  5. Push: `subprocess.run(["git", "push", "-u", "origin", "feat/287-markdown-file-creation-edbcce"])`

  Total implementation: ~10-15 minutes following established pattern with 287+ precedents.
