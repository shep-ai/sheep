# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 164 follows the exact architecture established by Features 001-163. The implementation
  consists of a single Python module (`feature_164_markdown_file_creation.py`) that orchestrates
  5 existing helper functions from `sheep.content_generators`:

  1. **generate_markdown_content()** - Calls Claude API via CrewAI to generate H1 heading + prose
  2. **write_markdown_file()** - Writes content to test-qmgc7d.md with UTF-8 encoding and LF line endings
  3. **validate_markdown_file()** - Validates file format (one H1, blank line, 2-3 sentences, etc.)
  4. **commit_markdown_file()** - Stages file and creates git commit with conventional message
  5. **push_markdown_file()** - Pushes commit to remote feature branch with upstream tracking

  The module exports a single public function: `create_feature_164_markdown_file(repo_path: str | None = None)`

  This function:
  - Accepts optional repository path parameter (defaults to current working directory)
  - Orchestrates the 5 steps in sequence with proper error handling
  - Logs INFO level messages for major steps and DEBUG level for details
  - Returns dict with keys: filepath, content, commit_message, push_result
  - Raises exceptions on any failure (fail-fast strategy)

  No architectural changes are required. This feature adds:
  - One new module: `src/sheep/features/feature_164_markdown_file_creation.py`
  - Two test modules (unit and integration)
  - One export to `src/sheep/features/__init__.py`

  ## Key Design Decisions

  ### Decision 1: Content Generation via Claude API
  **Chosen:** Use `content_generators.generate_markdown_content()` which calls Claude API via CrewAI.
  **Rationale:** Specification requires Claude API. Feature 163 establishes this as proven pattern.
  The helper is already implemented, tested, and proven across 163+ features.

  ### Decision 2: File I/O with Strict Format Enforcement
  **Chosen:** Use `content_generators.write_markdown_file()` and `validate_markdown_file()`.
  **Rationale:** Provides UTF-8 encoding without BOM, Unix LF line endings, and strict validation.
  These helpers are tested across 163+ features and enforce all specification requirements.

  ### Decision 3: One Module Per Feature
  **Chosen:** Create dedicated `feature_164_markdown_file_creation.py` module.
  **Rationale:** Every feature (001-163) follows this pattern. It ensures modularity, discoverability,
  and maintainability. The module can be reused and tested independently.

  ### Decision 4: Fail-Fast Error Handling
  **Chosen:** Let exceptions propagate without recovery attempts.
  **Rationale:** Allows caller to decide whether to retry or fix root cause. Prevents masking issues.
  Simplifies error handling logic while maintaining clear execution contract.

  ### Decision 5: Use Existing Git Helpers
  **Chosen:** Use `commit_markdown_file()` and `push_markdown_file()` from content_generators.
  **Rationale:** These helpers provide abstraction over GitPython, support custom commit messages,
  handle upstream tracking, and are tested across 163+ features.

  ### Decision 6: Structured Logging
  **Chosen:** Use `sheep.observability.logging.get_logger()` with INFO and DEBUG levels.
  **Rationale:** Specification requirement. Integrates with platform observability infrastructure.
  Provides context and enables production-grade observability.

  ## Implementation Strategy

  The implementation is straightforward orchestration of existing, tested helper functions:

  1. **Phase 1: Feature Module Implementation**
     - Create `feature_164_markdown_file_creation.py` with constants, imports, and orchestration function
     - Implement fail-fast error handling with try-except and logging
     - Write unit tests with all 5 helpers mocked to verify orchestration order
     - Write integration tests with real helpers to verify end-to-end execution
     - Testing validates error propagation, correct function calls, and return value structure

  2. **Phase 2: Integration and Verification**
     - Export `create_feature_164_markdown_file` from `features.__init__.py`
     - Execute feature end-to-end with real repository state
     - Verify all specification requirements: file exists, content format, git state, push result
     - Clean up any temporary test artifacts

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Helper functions have changed since research | Low | Reference Feature 163 (recent, uses same helpers). Content_generators.py is stable infrastructure. |
  | File encoding or line ending issues | Very Low | Helpers handle encoding/line endings. Validation enforces format before commit. |
  | Git operations fail (push, commit) | Low | Use existing git helpers with error handling. Feature branch pre-created. Try-catch with logging catches all failures. |
  | Test file cleanup issues | Very Low | Integration tests clean up created files. Temporary files use timestamps if needed. |
  | Import/export configuration incorrect | Very Low | Follow exact pattern from Feature 163 (recent reference). Test imports explicitly. |
  | Claude API failures | Low | Not under our control. Caller handles retry logic. Logging captures API error details. |

  This is a low-risk feature with proven infrastructure, recent reference implementations, and minimal
  new code. The only source of complexity is external dependencies (Claude API, git), both of which
  are abstracted through existing tested helpers.
