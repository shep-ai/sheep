content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, well-proven pattern. This feature creates a single test markdown file (`test-qmgc7d.md`)
  at the repository root with a title and prose content.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 163+
  similar test files already existing in the repository as precedents (test-*.md files at the root directory).
  This is a continuation of the markdown-file-creation pattern established in feature 069, with identical
  requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-qmgc7d.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM
  - [ ] File uses Unix-style LF line endings (`\n`)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-qmgc7d.md`)
  - [ ] Git commit exists on the current branch with conventional commit message format
  - [ ] Commit message matches: `feat(164): Create markdown file test-qmgc7d.md with prose content`
  - [ ] Commit is on the feature branch `feat/164-markdown-file-creation-834788`
  - [ ] Changes have been pushed to remote origin
  - [ ] Implementation follows the pattern from features 001-163

  ## Functional Requirements

  - **FR-1: Generate markdown heading** - The system must generate an appropriate H1 markdown heading using Claude API via CrewAI
  - **FR-2: Generate prose content** - The system must generate exactly 2-3 sentences of prose content on any topic using Claude API
  - **FR-3: Write file to disk** - The system must write the heading and prose to `test-qmgc7d.md` in the repository root using pathlib
  - **FR-4: Ensure correct encoding** - The system must write the file with UTF-8 encoding without BOM
  - **FR-5: Ensure correct line endings** - The system must use Unix-style LF line endings (`\n`) in the output file
  - **FR-6: Validate file format** - The system must validate that the created file has exactly one H1 heading, a blank line separator, and 2-3 sentences
  - **FR-7: Stage file with git** - The system must stage the file using `git add test-qmgc7d.md`
  - **FR-8: Create git commit** - The system must create a git commit with conventional commit message format: `feat(164): Create markdown file test-qmgc7d.md with prose content`
  - **FR-9: Push to remote branch** - The system must push the commit to the remote feature branch `feat/164-markdown-file-creation-834788` with upstream tracking

  ## Non-Functional Requirements

  - **NFR-1: Consistency with precedent** - Implementation must follow the established pattern from features 001-163, including file structure, naming conventions, and helper function usage for maintainability and codebase coherence
  - **NFR-2: Code maintainability** - Implementation should be clear, well-organized, and follow Python conventions for readability and future reusability
  - **NFR-3: Reuse existing infrastructure** - Must leverage existing helper functions from `content_generators.py` rather than reimplementing functionality, to avoid duplication and ensure consistency
  - **NFR-4: Format compliance** - Output file must strictly comply with format requirements: exactly one H1 heading, blank line separator, 2-3 sentences, UTF-8 encoding without BOM, LF line endings
  - **NFR-5: Git workflow compliance** - Implementation must follow the established git workflow: use pre-created feature branch, stage changes, use conventional commit messages, push with upstream tracking
  - **NFR-6: No scope creep** - Feature implementation must be isolated to the single markdown file creation; no changes to source code, tests, configuration, or other files outside of the feature implementation module

  ## Product Questions & Decisions

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Code organization: dedicated feature file vs inline? | Dedicated feature_164_markdown_file_creation.py file (following 163-feature precedent) | Maintains consistency with established codebase pattern, ensures code discoverability, supports architecture, enables future reusability and testing |
  | 2 | Prose content: specific constraints or unrestricted? | Any topic, no constraints (per user request "about anything") | User explicitly requested no constraints; maximizes variety and quality across 164+ test files; simpler to implement; leverages generative capability |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-qmgc7d.md) to existing collection of 163+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-163; no branch/merge complexity, no destructive operations |
  | `src/sheep/content_generators.py` | None | Existing helper functions provide all needed functionality; no changes required |
  | `src/sheep/features/` | Low | Will create `feature_164_markdown_file_creation.py` following established pattern from features 001-163 |
  | `src/sheep/features/__init__.py` | Low | Will export `create_feature_164_markdown_file()` function following established pattern |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |

  ## Dependencies

  **Existing Infrastructure** (no new dependencies required):
  - `content_generators.generate_markdown_content()` - Generate H1 + prose via Claude API
  - `content_generators.write_markdown_file()` - Write to disk with proper encoding and line endings
  - `content_generators.validate_markdown_file()` - Validate structure requirements
  - `content_generators.commit_markdown_file()` - Stage and commit with conventional message
  - `content_generators.push_markdown_file()` - Push to remote with upstream tracking
  - `sheep.observability.logging.get_logger()` - Structured logging infrastructure
  - Git repository with feature branch `feat/164-markdown-file-creation-834788` (pre-created)
  - CrewAI framework (already installed, version 0.86.0+)
  - Claude API credentials (configured via .env)
  - GitPython (already installed)
  - Python pathlib (standard library)

  **Pattern Reference**: Features 159-163 provide exact implementation patterns to follow.

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes to 1 hour) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (Claude API call via existing helper function)
  - **File writing**: ~2 minutes (use existing write_markdown_file helper)
  - **Validation**: ~2 minutes (use existing validate_markdown_file helper)
  - **Feature file creation**: ~2-3 minutes (create feature_164_markdown_file_creation.py following pattern from feature 163)
  - **Git workflow**: ~3-5 minutes (stage file, commit with conventional message, push to branch)
  - **Verification**: ~2-3 minutes (verify file content, check git history, confirm push)
  - **Total estimate**: 10-15 minutes of actual implementation work, up to 1 hour with verification

  **Justification**:
  - Well-established pattern with 163+ identical test files providing clear precedent
  - All heavy lifting (content generation, validation, git operations) already implemented in content_generators.py
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (159-163) demonstrate efficient implementation of identical features in 10-15 minutes
  - Can copy/adapt implementation directly from Feature 163 (feature_163_markdown_file_creation.py)

  ---

  _Requirements phase complete — functional and non-functional requirements defined, product decisions documented with AI recommendations, ready for implementation planning_
