# Structured technology decisions
decisions:
  - title: Markdown Syntax Standard
    chosen: CommonMark with optional GitHub Flavored Markdown extensions
    rejected:
      - Strict original Markdown (Gruber dialect) — less widely supported and doesn't define all edge cases
      - Proprietary markdown variants — unnecessary complexity and poor portability
    rationale: >
      CommonMark is the most widely adopted, interoperable markdown standard with clear spec.
      GitHub Flavored Markdown (GFM) is a superset of CommonMark used throughout this repository.
      This choice ensures the file is valid across all markdown processors in the project.
      Existing markdown files in the repository follow this convention.

  - title: Heading Level for Document Title
    chosen: H1 (single # ) for document title
    rejected:
      - H2 (##) — functionally equivalent but less conventional for primary document titles
      - H3 or lower (### and beyond) — violates semantic HTML/markdown conventions for main headings
    rationale: >
      H1 is the standard markdown convention for a single document's primary title.
      It provides semantic clarity about the document structure.
      While the spec allows H1 or H2, H1 is the established pattern in similar markdown files in this repository.

  - title: File Encoding and Line Endings
    chosen: UTF-8 encoding without BOM, LF line endings
    rejected:
      - UTF-8 with BOM — adds unnecessary bytes and causes issues with some tools
      - UTF-16 or other encodings — not standard for markdown or text files
      - CRLF line endings — Windows-only; repository uses Unix conventions
    rationale: >
      These requirements are explicitly specified in NFR-1 and NFR-2 of the feature spec.
      UTF-8 without BOM is the standard for web and version-controlled text files.
      LF line endings align with the repository's established git configuration and CI/CD practices.
      These settings are enforced by .gitattributes or similar version control configuration.

  - title: Content Topic Selection
    chosen: Select a topic relevant to the repository or general knowledge domain
    rejected:
      - Placeholder/filler content — unprofessional and clutters the repository
      - Overly technical content requiring external context — unnecessary complexity
    rationale: >
      The spec explicitly allows "about anything," but established patterns suggest selecting
      meaningful content. Similar features (e.g., 027, 008) created content with substance.
      The repository serves as a portfolio of markdown content, so topic should be relevant
      and readable. Topic selection is deferred to implementation phase based on developer preference.

  - title: Validation Approach
    chosen: Use git commands and standard markdown validators post-implementation
    rejected:
      - No validation — risks silent failures not caught until testing
      - Complex linting pipeline — unnecessary overhead for single-file creation
      - Automated markdown generation — violates the spec's intent (direct file creation)
    rationale: >
      Git verification (git ls-files, git diff --cached) ensures file exists and is tracked.
