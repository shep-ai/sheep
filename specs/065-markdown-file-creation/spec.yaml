# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-g6uftw.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 50+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 059-064, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-g6uftw.md` is created in the repository root directory
  - [ ] File contains a valid markdown H1 heading (line 1)
  - [ ] File contains a blank line after the heading (line 2)
  - [ ] File contains exactly 2-3 sentences of prose content (lines 3+)
  - [ ] File is encoded in UTF-8 with Unix-style LF line endings
  - [ ] File size is between 400-600 bytes
  - [ ] File is staged in the git staging area
  - [ ] File is committed with a conventional commit message starting with `feat:`
  - [ ] Commit message includes test filename and topic in the description
  - [ ] Commit is pushed to the feature branch `feat/065-markdown-file-creation`
  - [ ] All markdown syntax is valid and file is parseable as valid markdown

  ## Functional Requirements

  - **FR-1**: Create a new file named exactly `test-g6uftw.md` in the repository root directory
  - **FR-2**: File must begin with a markdown H1 heading on line 1 (format: `# Heading Text`)
  - **FR-3**: File must contain exactly one blank line between the heading and prose content
  - **FR-4**: File must contain exactly 2 or 3 sentences of coherent prose content
  - **FR-5**: Prose content must form a complete, meaningful thought on any freely-chosen topic
  - **FR-6**: File must be encoded in UTF-8 character encoding
  - **FR-7**: File must use Unix-style LF line endings (not CRLF or CR)
  - **FR-8**: Stage the created file in git using `git add test-g6uftw.md`
  - **FR-9**: Commit the file with a conventional commit message using `feat:` prefix
  - **FR-10**: Commit message must reference the test filename and topic in the description
  - **FR-11**: Push the commit to the feature branch `feat/065-markdown-file-creation`

  ## Non-Functional Requirements

  - **NFR-1**: File must be 400-600 bytes in total size (ensures prose is of appropriate length)
  - **NFR-2**: Implementation must match the established pattern from features 059-064 exactly
  - **NFR-3**: Markdown syntax must be valid and parseable by standard markdown parsers
  - **NFR-4**: No external dependencies required beyond Python standard library and git
  - **NFR-5**: Implementation must be completable within 10-15 minutes of actual work
  - **NFR-6**: No modifications to source code in `/src/sheep/` or other existing files
  - **NFR-7**: No changes to project configuration, build system, or CI/CD pipelines
  - **NFR-8**: Feature must not impact any other files, tests, or components in the repository

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation with the following structure:

  - `/src/sheep/` — Main source code directory containing:
    - `/agents/` — Agent definitions for research, implementation, and review
    - `/config/` — Configuration management (settings, LLM factory)
    - `/flows/` — Flow definitions for orchestration
    - `/observability/` — Logging and tracing (Langfuse integration)
    - `/tools/` — Agent tools (git operations, file operations)
  - `/tests/` — Test directory (contains unit and integration tests)
  - `/specs/` — Feature specification directory (65 numbered feature specs, including this one)
  - Repository root — Contains 50+ test markdown files (test-*.md) created by similar features
  - `pyproject.toml` — Python project configuration
  - `create_markdown.py` — Reference implementation script for creating markdown files
  - `test_create_markdown.py` — Test suite validating markdown file requirements

  ### Architecture Patterns

  **Separation of Structure and Intelligence**: The Sheep platform separates:
  - **Flows** — Define execution structure and control paths (orchestration)
  - **Crews** — Provide autonomous AI decision-making (intelligence)
  - **Agents** — Specialized units with focused roles and expertise
  - **Tools** — Modular tools for common operations (git, file I/O, etc.)

  **Design Principles in Use**:
  - Task-first design: Well-crafted tasks elevate agent performance
  - Specialized agents: Each agent has focused role with clear goals
  - Git integration: Full support for branch management, commits, and pushes
  - File I/O operations: Standard Python `pathlib.Path` for file creation

  **Established Pattern for Test File Creation**:
  - Reference implementation: `create_markdown.py` shows the standard approach
  - File creation: Use `pathlib.Path.write_text()` with UTF-8 encoding
  - Content structure: Heading (line 1) → Blank line (line 2) → Prose (lines 3+)
  - Git workflow: Stage file → Commit with `feat:` prefix → Push to feature branch
  - Validation: Comprehensive test suite (`test_create_markdown.py`) validates all requirements

  ### Relevant Technologies

  **Core Framework**: CrewAI (0.86.0+) for agent orchestration
  **LLM Support**: OpenAI, Anthropic Claude, Google Gemini
  **File I/O**: Python `pathlib.Path` (standard library, no external dependencies)
  **Version Control**: GitPython (3.1.0+) for git operations
  **Observability**: Langfuse (2.0.0+) for execution tracing and metrics
  **Configuration**: Pydantic (2.0.0+) for settings management
  **Testing**: Pytest (8.0.0+) with asyncio support

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-g6uftw.md) to existing collection of 50+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 059-064 and recent commits; no branch/merge complexity, no destructive operations |
  | Workflow/Process | Low | Uses existing file creation and git tooling; no new dependencies, infrastructure, or platform modifications required; no changes to build system or CI/CD |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Testing | None | No changes to test infrastructure or existing tests; feature will be validated by same test suite pattern as features 059-064 |

  ## Dependencies

  - **Git repository**: Feature branch `feat/065-markdown-file-creation` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **No external libraries**: Markdown file creation requires no runtime dependencies or imports beyond Python stdlib
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Established pattern**: 50+ test files provide clear precedent for content format and structure
  - **Reference implementation**: `create_markdown.py` and test suite `test_create_markdown.py` are available as guides

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 50+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (059-064) demonstrate efficient implementation of identical features
  - Reference implementation (`create_markdown.py`) provides starting point
  - Test suite (`test_create_markdown.py`) shows exact validation requirements

  ---

