# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 065 implementation consists of 5 ordered tasks across 3 phases:

  **Phase 1: File Creation (Task 1, 10m)**
  Create test-g6uftw.md with markdown H1 heading, blank line, and 2-3 sentences of original prose
  on a freely-chosen topic. Use pathlib.Path.write_text() with explicit UTF-8 encoding and ensure
  file size falls within 400-600 byte range. Content must be substantive and meaningful, not
  templated or generated.

  **Phase 2: Git Integration (Tasks 2-4, 11m)**
  Stage the file with git add, commit with conventional commit message (feat: prefix including
  filename and topic), and push to feature branch feat/065-markdown-file-creation. Follow
  established pattern from features 059-064.

  **Phase 3: Validation (Task 5, 10m)**
  Execute test_create_markdown.py test suite to validate all success criteria including encoding,
  structure, sentence count, prose quality, markdown syntax, and byte size. Iterate file content
  if any tests fail.

  The implementation is straightforward and low-risk, following a proven pattern from 40+ existing
  test files. Total estimated effort: 45 minutes.
