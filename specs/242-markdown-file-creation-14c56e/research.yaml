# Structured technology decisions
decisions:
  - title: "Content Generation Strategy"
    chosen: "Use existing create_markdown.py utility with Claude API for prose generation"
    rejected:
      - "Hard-coded prose content: Simple and fast but lacks flexibility and semantic quality. Violates the established pattern from features 001-241 which use AI-generated content for variety and natural prose."
      - "Manual prose authoring: Time-consuming and not scalable. Contradicts the automation objective of the Sheep platform."
      - "Template-based content: Adds complexity without clear benefit. Risks producing formulaic prose that lacks natural variation."
    rationale: >
      The existing `create_markdown.py` utility in src/ provides proven, tested implementation
      for content generation using the Claude API. It includes validation logic, retry handling,
      and integration with the Sheep logging framework. Features 001-241 demonstrate this pattern
      works reliably across 240+ implementations. Using the utility ensures consistency, leverages
      existing infrastructure (sheep.config.llm, observability.logging), and follows the established
      pattern documented in recent commits (feat(241), feat(240), etc.). The utility generates
      varied, high-quality prose matching the spec requirements (2-3 sentences, thematically coherent).

  - title: "File I/O Library Choice"
    chosen: "Python pathlib.Path (stdlib module)"
    rejected:
      - "os.path with open(): Legacy approach, more verbose and error-prone. pathlib is more ergonomic and expressive."
      - "GitPython file operations: Over-engineered for simple file creation. subprocess for git operations is more appropriate."
    rationale: >
      pathlib is the modern Python standard library approach for file operations. It provides:
      explicit encoding parameter (write_text(encoding='utf-8')), platform-independent
      path handling, cleaner and more readable API than os.path, and no external dependencies
      (stdlib in Python 3.11+). The Sheep project already uses pathlib implicitly in the
      established pattern, and it's the recommended approach in Python 3.4+ (PEP 428).
      Write operation: Path(\"test-tjrb4a.md\").write_text(content, encoding='utf-8')

  - title: "Line Ending Handling"
    chosen: "Use Python's universal newlines handling with explicit LF enforcement"
    rejected:
      - "Platform defaults: Would produce CRLF on Windows, violating spec requirement for LF."
      - "Manual line ending conversion: Adds complexity when Python's built-in handling suffices."
    rationale: >
      Python 3 defaults to universal newlines mode on text file open operations. When writing
      with pathlib.write_text(), Python normalizes to the platform default. To guarantee LF:
      use explicit '\\n' in content strings (Python source code strings use LF by default),
      ensure the content generated from create_markdown.py uses LF (Python's Claude API response
      parsing preserves LF), and validate post-write that file uses LF (hex dump or read in
      binary mode). The spec requires LF (Unix-style) line endings. This is enforced by the
      validate_file_structure() function which reads the file and checks line ending format.

  - title: "Git Integration Approach"
    chosen: "subprocess.run() for git commands (git add, commit, push)"
    rejected:
      - "GitPython library: Already in dependencies (gitpython>=3.1.0), but subprocess is more direct and transparent. GitPython adds abstraction layer for simple operations."
      - "os.system(): Deprecated, less safe, requires shell=True equivalent risk."
    rationale: >
      subprocess.run() with explicit command lists (no shell=True) is the safest, most transparent
      approach for git operations. It provides: clear, direct git command execution, safety
      (no shell interpretation, prevents injection), error handling (returncode, stderr capture),
      and consistency with established pattern from features 001-241. The three git operations
      are simple and well-defined: git add, git commit, and git push.

  - title: "File Validation Strategy"
    chosen: "Standard validation: file existence, encoding (UTF-8 no BOM), line endings (LF), structure (heading/prose), size (~400-600 bytes)"
    rejected:
      - "Minimal validation (file exists only): Misses encoding/format issues. Too loose for quality assurance."
      - "Strict validation (detailed syntax parsing, word count, metadata): Over-engineered. Current validation catches all issues specified in requirements."
    rationale: >
      Standard validation balances quality assurance with simplicity. It checks: file exists
      at correct path (test-tjrb4a.md in repo root), UTF-8 encoding without BOM (verify with
      'utf-8' decode, no BOM header check), LF line endings (check file content for '\\r'
      characters, reject if found), markdown structure (validate heading format with regex,
      prose follows blank line), and file size approximately 400-600 bytes (natural outcome
      of proper 2-3 sentence prose). This approach ensures consistency with 240+ existing
      test files while catching encoding, format, and structural issues early.

  - title: "Encoding Specification (UTF-8 without BOM)"
    chosen: "Use UTF-8 encoding in pathlib.write_text(), verify no BOM in validation"
    rejected:
      - "UTF-8 with BOM: Explicitly contradicts spec requirement (\"without BOM\")."
      - "System default encoding: May not be UTF-8 on all systems, violates spec."
    rationale: >
      Python's pathlib.write_text(encoding='utf-8') writes UTF-8 without BOM by default. BOM
      (Byte Order Mark) is not written unless explicitly requested. The spec explicitly requires
      UTF-8 without BOM, consistent with CommonMark specification and Unix conventions.
      Validation: After file creation, validate by reading first 3 bytes to ensure they are NOT
      the UTF-8 BOM sequence (0xEF 0xBB 0xBF). Python's UTF-8 decoder will handle BOM transparently,
      so validation checks the raw bytes.

  - title: "Prose Topic Selection"
    chosen: "Flexible topic selection via Claude API (any domain: nature, technology, science, history, culture, philosophy, etc.)"
    rejected:
      - "Fixed domain requirement (e.g., technology-only): Contradicts established pattern from 240+ files with diverse topics. Reduces quality and variety."
      - "Automated random selection: Unnecessary complexity. Claude API naturally produces varied topics."
    rationale: >
      The spec and feature analysis explicitly recommend flexible topic selection. Analysis of
      240+ existing test files demonstrates diverse, natural topics (nature, technology, science,
      history, culture, philosophy). The MARKDOWN_GENERATION_PROMPT in create_markdown.py
      instructs Claude to \"Create an H1 heading (format: # Title) on a new topic of your choice\",
      ensuring natural variety. This flexibility is intentional and supports the Sheep platform's
      automation objectives.

  - title: "Commit Message Format"
    chosen: "Exact conventional commit format: 'feat(242): create markdown file test-tjrb4a.md with prose content'"
    rejected:
      - "Flexible conventional commits (variations in wording): Breaks pattern consistency needed for automation. Prior features use exact format."
      - "Simple format (no conventional commits): Non-standard, breaks 240+ feature pattern, hinders automated analysis."
    rationale: >
      The spec explicitly requires exact format consistency. Analysis of recent commits shows
      the exact format is maintained. This exact format enables pattern-based automation,
      facilitates searching, and ensures coherence across 240+ features. The conventional
      commit (feat(...)) structure is standard in modern projects and required by this
      codebase's commit conventions.

