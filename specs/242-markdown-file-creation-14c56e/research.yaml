# Markdown content (the full research document)
content: |
  ## Status

  **Phase:** Research (Complete)
  **Updated:** 2026-03-27

  ## Overview

  Feature 242 creates a single markdown file (`test-tjrb4a.md`) in the repository root with:
  - One H1 markdown heading (# Title)
  - 2-3 sentences of thematically coherent prose content
  - UTF-8 encoding without BOM
  - LF (Unix-style) line endings
  - Approximately 400-600 bytes file size

  This feature follows an established pattern from 240+ prior implementations (features 001-241)
  and leverages existing infrastructure within the Sheep project.

  ## Architecture Overview

  The implementation reuses the proven `create_markdown.py` utility located in `src/create_markdown.py`,
  which provides:

  1. **Content Generation**: Uses Claude API via `sheep.config.llm.get_reasoning_llm()` to generate
     natural, varied prose content with automatic topic selection
  2. **Validation**: Comprehensive post-creation validation of file structure, encoding, line endings
  3. **Git Integration**: Stage, commit, and push operations using standard git commands via subprocess
  4. **Error Handling**: Retry logic with exponential backoff for API failures, detailed logging

  The utility has been tested across 240+ prior feature implementations and provides a reliable,
  proven pattern for this feature.

  ## Technology Decisions

  ### 1. File I/O: Python pathlib

  **Chosen:** `pathlib.Path` with explicit UTF-8 encoding

  **Rejected:**
  - os.path + open(): More verbose, less ergonomic, legacy approach
  - GitPython file operations: Over-engineered for simple file creation
  - Direct file writing with open(): Less safe, no encoding guarantees

  **Rationale:** pathlib is the modern Python standard library approach (PEP 428, Python 3.4+).
  It provides explicit encoding control (`write_text(encoding='utf-8')`), platform-independent
  path handling, and a cleaner API. No external dependencies—available in Python 3.11+ stdlib.
  The Sheep project already uses pathlib implicitly in established patterns.

  **Implementation:**
  ```python
  from pathlib import Path
  Path("test-tjrb4a.md").write_text(content, encoding='utf-8')
  ```

  ### 2. Content Generation: Claude API via create_markdown.py

  **Chosen:** Reuse existing `src/create_markdown.py` utility with Claude API

  **Rejected:**
  - Hard-coded prose: Simple but lacks flexibility and variety. Contradicts 240+ feature pattern.
  - Manual authoring: Not scalable, contradicts automation objective.
  - Template-based: Adds complexity, risks formulaic output.

  **Rationale:** The existing utility provides:
  - Proven implementation tested across 240+ features (001-241)
  - Integration with Sheep infrastructure (sheep.config.llm, observability.logging)
  - Comprehensive validation and retry logic
  - Natural, varied prose output via Claude API
  - MARKDOWN_GENERATION_PROMPT instructs Claude for high-quality 2-3 sentence prose

  Recent commits demonstrate this utility works reliably. Reusing it ensures consistency,
  quality, and reduced implementation risk.

  ### 3. Git Integration: subprocess for explicit commands

  **Chosen:** `subprocess.run()` with explicit command lists (git add, commit, push)

  **Rejected:**
  - GitPython: Available in dependencies but adds abstraction for simple operations
  - os.system(): Deprecated, less safe, requires shell interpretation
  - Manual git operations: Reinventing the wheel

  **Rationale:** subprocess.run() with explicit command lists is:
  - Safe: No shell interpretation, prevents injection attacks
  - Transparent: Clear git operations visible in code
  - Standard: Recommended approach in Python documentation
  - Consistent: Established pattern in Sheep codebase

  Git operations (3 total):
  ```python
  subprocess.run(['git', 'add', 'test-tjrb4a.md'], check=True)
  subprocess.run(['git', 'commit', '-m', 'feat(242): create markdown file test-tjrb4a.md with prose content'],
                 check=True, universal_newlines=True)
  subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
  ```

  Note: Commit operation uses `--no-verify` to skip pre-commit hooks (standard in spec).

  ### 4. File Validation: Standard validation checks

  **Chosen:** Post-creation validation of file existence, encoding, line endings, structure, size

  **Rejected:**
  - Minimal validation (file exists only): Misses encoding/format issues
  - Strict validation (detailed parsing): Unnecessary complexity beyond requirements

  **Rationale:** Standard validation balances quality assurance with simplicity. Checks:
  - File exists at `test-tjrb4a.md` in repository root
  - UTF-8 encoding without BOM (verify no BOM header bytes 0xEF 0xBB 0xBF)
  - LF line endings only (reject if '\\r' present)
  - Valid markdown structure (# heading, blank line separator, prose)
  - File size approximately 400-600 bytes (natural outcome of proper 2-3 sentence prose)

  The `create_markdown.py` utility includes `validate_file_structure()` which implements these checks.

  ### 5. Encoding: UTF-8 without BOM

  **Chosen:** UTF-8 encoding via pathlib, explicit BOM validation

  **Rejected:**
  - UTF-8 with BOM: Contradicts spec requirement
  - System default encoding: May vary by platform, violates spec
  - Manual encoding handling: Unnecessary when pathlib handles automatically

  **Rationale:** Python's pathlib.write_text(encoding='utf-8') writes UTF-8 without BOM by default.
  This is the standard and matches CommonMark specification expectations. Validation verifies no
  BOM is present by checking raw bytes (0xEF 0xBB 0xBF should not appear at file start).

  ### 6. Line Ending Handling: LF enforcement

  **Chosen:** Use Python's default LF in strings, validate post-write to ensure LF only

  **Rejected:**
  - Platform defaults: Would produce CRLF on Windows, violating spec
  - Manual conversion: Adds complexity when Python handles correctly

  **Rationale:** Python 3 source code strings use LF by default. Claude API responses preserve LF.
  pathlib.write_text() preserves these line endings. Validation checks the written file to ensure
  no CRLF present. Spec explicitly requires LF (Unix-style) line endings.

  ### 7. Prose Topic Selection: Flexible domains

  **Chosen:** Claude API generates topics freely (nature, technology, science, history, culture, philosophy, etc.)

  **Rejected:**
  - Fixed domain requirement: Contradicts 240+ feature pattern with diverse topics
  - Automated random selection: Unnecessary, Claude naturally produces variety
  - Template-based topics: Risks formulaic output

  **Rationale:** Spec explicitly recommends flexible topic selection. Analysis of 240+ existing
  test files shows intentional diversity across multiple domains. The MARKDOWN_GENERATION_PROMPT
  instructs Claude to select topics of its choice, ensuring natural variety and quality prose.

  ### 8. Commit Message Format: Exact conventional commit

  **Chosen:** Exact format: `feat(242): create markdown file test-tjrb4a.md with prose content`

  **Rejected:**
  - Flexible variations: Breaks pattern consistency across 240+ features
  - Simple format: Non-standard, hinders automated analysis

  **Rationale:** Spec explicitly requires exact format consistency. Recent commits demonstrate
  this exact pattern. Conventional commit structure (feat(...)) is standard in the codebase
  and enables pattern-based automation. Git history shows this exact format is maintained
  across all similar features.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O operations | Use | Modern Python stdlib (3.4+), explicit encoding support, ergonomic API |
  | subprocess | Git command execution | Use | Safe (no shell), transparent, stdlib, standard approach for external commands |
  | GitPython | Alternative git library | Reject | Available in dependencies but subprocess is more direct for simple operations |
  | sheep.config.llm | Claude API integration | Use | Existing Sheep infrastructure, already integrated, proven across 240+ features |
  | sheep.observability.logging | Structured logging | Use | Existing infrastructure, used by create_markdown.py, consistent with codebase |
  | create_markdown.py | Content generation/validation/git | Use | Proven utility across 240+ implementations, comprehensive validation, tested |
  | re (regex) | Sentence boundary detection | Use | Stdlib, used by create_markdown.py for validating sentence count |
  | time | Retry delay | Use | Stdlib, used for exponential backoff in create_markdown.py |

  ## Security Considerations

  **File Creation:** Low risk. Writing to known location (test-tjrb4a.md) in repository root with
  fixed filename eliminates path traversal risks.

  **Git Operations:** Use subprocess.run() with explicit command lists (no shell=True) prevents
  command injection. Arguments are passed as list items, not shell-interpreted strings.

  **Content Handling:** Prose content is generated by Claude API, not user-provided. No injection
  vectors from external input.

  **Encoding:** UTF-8 without BOM is safe and standard. No security implications.

  **API Authentication:** Claude API authentication is handled by sheep.config.llm module using
  existing Sheep infrastructure. No credentials exposed in implementation code.

  **Validation:** Post-creation validation ensures file integrity and correct format before commit,
  reducing risk of malformed files in repository.

  ## Performance Implications

  **File I/O:** Negligible. Single file write operation (~400-600 bytes) completes instantly.

  **Content Generation:** Primary bottleneck is Claude API call (~2-10 seconds typical, depends on API
  latency). Retry logic with exponential backoff (1s, 2s, 4s max) handles transient failures.

  **Validation:** Post-creation validation is fast (regex checks, file read, encoding verification)
  and completes in <100ms.

  **Git Operations:** Standard git operations (add, commit, push) complete in <1 second each
  (assuming network latency for push is acceptable). Total git time: ~3-5 seconds.

  **Total Implementation Time:** Approximately 10-15 minutes as estimated (spec size: S).
  - Content generation via API: 5-10 minutes (API latency + retries)
  - Validation: <1 minute (local checks)
  - Git workflow: 1-2 minutes (git operations)

  No optimization needed. Performance is acceptable for the feature's scope.

  ## Integration Points

  1. **Sheep LLM Infrastructure** (`sheep.config.llm.get_reasoning_llm()`): Existing API integration
  2. **Sheep Logging** (`sheep.observability.logging.get_logger()`): Structured logging via Sheep framework
  3. **Git Repository**: Standard git operations, no integration needed beyond git CLI
  4. **Feature Branch**: Pre-created branch `feat/242-markdown-file-creation-14c56e` is target
  5. **Existing Utility** (`src/create_markdown.py`): Primary code reuse point

  ## Dependencies

  - **Git repository**: Feature branch `feat/242-markdown-file-creation-14c56e` must be checked out
  - **Git configuration**: user.name and user.email must be set (standard git setup)
  - **Python 3.11+**: Project requirement (from pyproject.toml)
  - **Claude API access**: Available via sheep.config.llm module (Sheep handles authentication)
  - **File system**: Write access to repository root (already available)
  - **stdlib modules**: pathlib, subprocess, time, re (all available in Python 3.11+)
  - **sheep.create_markdown module**: Existing utility in src/create_markdown.py
  - **sheep.config and sheep.observability modules**: Existing Sheep infrastructure

  ## Risks and Mitigations

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | Claude API unavailable | Medium | Retry logic with exponential backoff (max 3 attempts) |
  | Network latency | Low | Acceptable for one-off file creation, not time-sensitive |
  | Git authentication failure | Low | Assumes standard git setup (git config user.name, user.email) |
  | File system permission denied | Low | Unlikely in development environment, would fail at write time |
  | Encoding issues on Windows | Low | pathlib.write_text() handles encoding correctly across platforms |
  | Git hook failures | Low | Commit uses --no-verify flag to skip pre-commit hooks (per spec) |

  ## Conclusion

  Feature 242 implementation should leverage the proven `create_markdown.py` utility to generate
  content, validate file structure, and integrate with git. This approach:

  - **Reuses tested code**: 240+ prior implementations validate the pattern
  - **Minimizes risk**: Leverages existing, proven infrastructure
  - **Ensures consistency**: Follows established patterns across the codebase
  - **Integrates cleanly**: Uses existing Sheep modules (config.llm, observability.logging)
  - **Meets all requirements**: Produces correct file format, encoding, line endings, and structure
  - **Handles errors**: Comprehensive validation, retry logic, detailed logging

  No significant technical blockers identified. Implementation can proceed with the existing
  create_markdown.py utility as the foundation.

