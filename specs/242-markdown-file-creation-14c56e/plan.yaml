content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-27

  ## Architecture Overview

  This feature creates a single markdown test file following an established pattern from 240+
  prior implementations (features 001-241). The implementation reuses the proven `create_markdown.py`
  utility located in `src/create_markdown.py`, which provides a complete, tested solution for:

  1. **Content Generation**: Claude API via `sheep.config.llm.get_reasoning_llm()` generates varied,
     natural prose (2-3 sentences on flexible topics)
  2. **File Creation**: Uses `pathlib.Path().write_text(encoding='utf-8')` for safe, explicit UTF-8
     encoding without BOM
  3. **Validation**: Post-creation checks for file existence, encoding, line endings, structure,
     and file size
  4. **Git Integration**: Stages file, creates commit with exact conventional message, and pushes
     to feature branch

  The utility has been refined across 240+ prior feature implementations and provides reliability,
  consistency, and reduced implementation risk compared to custom implementation.

  ## Key Design Decisions

  ### 1. Reuse Existing create_markdown.py Utility

  **Decision**: Use the complete `src/create_markdown.py` module for content generation, file
  creation, validation, and git integration.

  **Alternatives Considered**:
  - Implement from scratch: Faster for a single feature but misses proven code and 240+ precedents
  - Extract only content generation: Requires duplicate validation and git integration code

  **Rationale**: The existing utility has been tested across 240+ similar features (001-241) and
  is documented in recent commits (feat(241), feat(240), etc.). It integrates with Sheep
  infrastructure (sheep.config.llm, observability.logging), includes comprehensive validation
  with retry logic, and ensures consistency. Reusing it reduces implementation risk and maintains
  the established pattern.

  ### 2. Content Generation via Claude API

  **Decision**: Use Claude API via `sheep.config.llm.get_reasoning_llm()` for natural, varied
  prose generation.

  **Rationale**: The spec explicitly recommends flexible topic selection. Analysis of 240+ existing
  test files demonstrates diverse topics (nature, technology, science, history, culture, philosophy).
  Claude API naturally produces this variety while ensuring high-quality, thematically coherent
  prose (2-3 sentences). The MARKDOWN_GENERATION_PROMPT in create_markdown.py instructs Claude
  to generate new topics, ensuring natural variation across implementations.

  ### 3. File I/O with pathlib

  **Decision**: Use `pathlib.Path().write_text(encoding='utf-8')` for file creation with explicit
  UTF-8 encoding.

  **Rationale**: pathlib is the modern Python standard library approach (PEP 428, Python 3.4+).
  It provides explicit encoding control, platform-independent path handling, and a clean API.
  No external dependencies—available in Python 3.11+ stdlib. The approach ensures UTF-8 encoding
  without BOM by default, matching spec requirements and CommonMark standards.

  ### 4. Line Ending Enforcement (LF)

  **Decision**: Use Python's default LF in strings and validate post-write to ensure no CRLF.

  **Rationale**: Python 3 source code strings use LF by default. Claude API responses preserve LF.
  pathlib.write_text() preserves these line endings. Validation verifies the written file contains
  only LF (no '\\r' characters), ensuring Unix-style line endings as specified.

  ### 5. Git Integration via subprocess

  **Decision**: Use `subprocess.run()` with explicit command lists for git operations (add, commit,
  push).

  **Rationale**: subprocess with explicit command lists is safe (no shell interpretation), transparent
  (clear git operations), and standard (Python documentation recommended). No risk of command
  injection. Recent features demonstrate this approach is reliable.

  ### 6. Commit Message Format: Exact Consistency

  **Decision**: Use exact conventional commit format:
  `"feat(242): create markdown file test-tjrb4a.md with prose content"`

  **Rationale**: The spec explicitly requires exact format consistency. This format enables
  pattern-based automation, facilitates searching across 240+ features, and maintains coherence.
  Recent commits demonstrate this exact format is maintained across all similar features.

  ## Implementation Strategy

  **Phase 1: File Creation and Validation**
  1. Call `create_markdown.py` utility with filename parameter "test-tjrb4a.md"
  2. Utility generates prose content via Claude API (with retry logic for transient failures)
  3. File is created with pathlib using UTF-8 encoding, no BOM
  4. Post-creation validation checks:
     - File exists at repository root
     - UTF-8 encoding without BOM
     - LF line endings only (no CRLF)
     - Valid markdown structure (# heading, blank line, 2-3 sentences of prose)
     - File size approximately 400-600 bytes

  **Phase 2: Git Integration**
  1. Stage file: `git add test-tjrb4a.md`
  2. Commit with exact message: `git commit -m "feat(242): create markdown file test-tjrb4a.md with prose content"`
     (Note: Use --no-verify to skip pre-commit hooks per spec requirements)
  3. Push to feature branch: `git push -u origin HEAD`

  **Phase Ordering Rationale**: File creation must complete successfully before git integration.
  Git integration verifies the file meets all requirements and commits it to version control.

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | Claude API unavailable | Medium | create_markdown.py includes retry logic with exponential backoff (3 attempts max) |
  | Network latency during API calls | Low | Acceptable for single file creation, not time-sensitive; retry handles brief outages |
  | Git authentication failure | Low | Assumes standard git setup (git config user.name/email already configured) |
  | File system permission denied | Low | Unlikely in development environment; would fail at write time with clear error |
  | Encoding/line-ending issues on Windows | Low | pathlib.write_text() handles encoding correctly across platforms; validation catches any issues |
  | Pre-commit hook failures | Low | Commit uses --no-verify flag per spec to skip hooks |
  | File already exists | Low | Utility will overwrite or error gracefully; spec requires file creation in empty root |

