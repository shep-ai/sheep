content: |
  ## Problem Statement

  Create a single markdown file named test-a0c634.md at the repository root following the established pattern in the codebase. The file must contain proper markdown structure (H1 heading, blank line, and 2-3 sentences of prose) with UTF-8 encoding and Unix-style LF line endings. The feature demonstrates the capability to create markdown files with consistent formatting conventions.

  ## Success Criteria

  - [ ] Markdown file test-a0c634.md exists at repository root
  - [ ] File contains H1 heading on first line (format: # Title)
  - [ ] File contains exactly one blank line after heading
  - [ ] File contains 2-3 sentences of prose content after blank line
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix-style LF line endings throughout
  - [ ] File is staged in git repository
  - [ ] File is committed with conventional commit message: "feat(270): create markdown file test-a0c634.md with prose content"
  - [ ] File is pushed to remote origin on feature branch
  - [ ] File passes basic validation (exists and is readable)

  ## Functional Requirements

  - **FR-1**: File must be created at repository root with exact name test-a0c634.md
  - **FR-2**: File must contain H1 heading on the first line in markdown format (# followed by space and title text)
  - **FR-3**: File must contain exactly one blank line between heading and prose content
  - **FR-4**: File must contain exactly 2-3 sentences of prose content after blank line
  - **FR-5**: File must be created using pathlib.Path.write_text() with encoding="utf-8" and newline="\n"
  - **FR-6**: File must be staged to git index using git add command
  - **FR-7**: File must be committed with conventional commit message format: feat(270): create markdown file test-a0c634.md with prose content
  - **FR-8**: File must be pushed to remote origin using git push

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without byte order mark (BOM)
  - **NFR-2**: File line endings must use Unix-style LF (0x0A), not Windows CRLF (0x0D0A)
  - **NFR-3**: Implementation must be simple and maintainable, following existing codebase patterns
  - **NFR-4**: No external dependencies beyond Python 3.11+ standard library (pathlib, git command available)
  - **NFR-5**: Code must follow established conventions for markdown file creation in the codebase
  - **NFR-6**: Implementation must be documented and reproducible for future similar features
  - **NFR-7**: File content must be appropriate for a test/example file with no sensitive information

  ## Product Decisions

  | # | Decision | AI Recommendation | Rationale |
  | - | --------- | ----------------- | --------- |
  | 1 | Prose content focus | Generic placeholder text | Neutral content maximizes flexibility for test files, aligns with existing test pattern (CLASSIC_JOKE.md, DAD_JOKE.md) |
  | 2 | H1 heading title | Filename-derived title | Maintains 1:1 relationship between filename and heading, reduces ambiguity and confusion |
  | 3 | File validation | Basic validation (exists + readable) | Provides safety check without complexity, catches common failures |
  | 4 | Implementation structure | Standalone Python script | Matches established pattern of create_markdown.py, create_file.py scripts in codebase |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | High | Markdown file test-a0c634.md will be created at repository root, following existing pattern of many similar markdown files |
  | Git repository | High | File must be staged, committed with conventional message, and pushed to remote origin |
  | Spec directory | Low | Only spec.yaml file in specs/270-markdown-file-creation-9d9707/ is updated during this requirements phase |
  | Sheep platform code | None | No changes to src/sheep/ — this is a standalone markdown file creation, not a platform feature |

  ## Dependencies

  - **Python 3.11+**: pathlib.Path is built-in standard library, no external dependencies needed
  - **Git**: For staging, committing, and pushing the file (must be installed and accessible)
  - **Established conventions**: Feature depends on following markdown structure and git workflow patterns established by prior similar features

  ## Size Estimate

  **S** — Small. This is a trivial feature requiring minimal implementation effort:
  - File creation is straightforward pathlib.Path.write_text() call (~2-3 lines)
  - Content is hardcoded prose (no dynamic generation, no dependencies)
  - Basic validation is simple (check file exists and is readable)
  - Git operations are standard (add, commit, push)
  - Total implementation: ~30-45 minutes including validation, testing, and git workflow
  - No complex logic, no architectural changes, no integration work required
