content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-rc1h43.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 100+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-104, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-rc1h43.md` created in repository root directory
  - [ ] File contains valid markdown with H1 heading as title
  - [ ] File contains exactly 2-3 sentences of prose content
  - [ ] File encoded in UTF-8 without BOM (byte order mark)
  - [ ] File uses LF line endings exclusively (no CRLF or CR)
  - [ ] File staged in git with `git add test-rc1h43.md`
  - [ ] Commit created with message matching pattern: `feat(105): markdown file creation test-rc1h43.md`
  - [ ] Commit pushed to feature branch `feat/105-markdown-file-creation-7f6445`
  - [ ] File format and content match established test file pattern from repository

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-rc1h43.md` in repository root directory
  - **FR-2**: File must contain an H1 markdown heading (`# Title`) as the title
  - **FR-3**: File must contain 2-3 sentences of meaningful prose content following the heading
  - **FR-4**: Include blank line between heading and prose content (follows established markdown convention)
  - **FR-5**: Stage the created file using `git add test-rc1h43.md`
  - **FR-6**: Commit the file with conventional commit message: `feat(105): markdown file creation test-rc1h43.md`
  - **FR-7**: Push the commit to feature branch `feat/105-markdown-file-creation-7f6445`

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 encoding without BOM (byte order mark)
  - **NFR-2**: File must use Unix line endings (LF only: `\n`, no CRLF `\r\n` or CR `\r`)
  - **NFR-3**: Implementation must follow the established pattern from 100+ existing test files in repository root
  - **NFR-4**: File content must be valid markdown syntax
  - **NFR-5**: Completion must occur within 15 minutes of actual work time
  - **NFR-6**: No modifications to source code, configuration files, or existing test files
  - **NFR-7**: No external dependencies beyond Python standard library (pathlib, subprocess)
  - **NFR-8**: Implementation must use Python pathlib for file creation (following project convention from create_markdown.py)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should we include validation checks on the created file to ensure quality standards (UTF-8 encoding, LF line endings, markdown format)? | Basic validation | Catches critical issues (encoding, line endings) with minimal overhead (~2-3 minutes), ensures consistency with 100+ existing test files, fits within S size estimate. |

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository
  is organized as follows:

  - **Root directory**: Contains 100+ test markdown files (test-*.md) demonstrating the established
    pattern that this feature will follow. Also contains sample Python scripts showing implementation patterns.
  - **src/sheep/**: Main source code module with submodules:
    - `agents/` — Agent definitions for research, implementation, and review tasks
    - `config/` — Configuration management (settings.py, llm.py factory)
    - `flows/` — Flow orchestration and state management
    - `tools/` — Agent tools for git operations and file manipulation
    - `observability/` — Logging and Langfuse integration
    - `content_generators.py` — Content generation utilities
  - **tests/**: Comprehensive test suite with 30+ test modules covering markdown creation,
    git integration, file validation, and configuration
  - **specs/**: Feature specifications organized by feature number (006-105)
  - **.github/workflows/**: CI/CD pipelines for testing and validation

  ### Architecture Patterns

  1. **Task-First Design**: Well-defined, focused tasks drive agent behavior (task clarity over
     complex agent configuration)

  2. **Modular Separation**: Clear separation between flows (orchestration/structure) and crews
     (AI decision-making)

  3. **Observable Execution**: Full tracing via Langfuse with execution graphs and metrics

  4. **Git Workflow Pattern**: Established convention across 100+ similar features:
     - Create file in repo root
     - Stage with `git add <filename>`
     - Commit with conventional message: `feat(NNN): create markdown file <filename> with prose content`
     - Push to feature branch

  5. **File I/O Convention**: Use Python pathlib (Path.write_text()) for file creation,
     as demonstrated in create_markdown.py and test files

  ### Relevant Technologies

  - **Python 3.11+** (from pyproject.toml requires-python): Standard library pathlib for file I/O,
    subprocess for git operations
  - **Git**: Version control; push/pull/commit operations via subprocess or GitPython
  - **Markdown**: Simple text format; no special parsing or generation libraries needed
  - **UTF-8 encoding**: Standard text encoding for all markdown files (no BOM)
  - **Unix line endings (LF)**: Convention enforced in all existing test files (\n, not \r\n)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-rc1h43.md) to existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-104; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code, modules, or agent implementations |
  | Tests (/tests/) | None | Feature does not require creating or modifying test files (feature itself is a test artifact) |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/105-markdown-file-creation-7f6445` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 100+ test files provide clear precedent for content format and structure:
    - H1 heading (markdown `# Title`)
    - Blank line separator
    - 2-3 sentences of meaningful prose content
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib module (available in Python 3.11+, no external dependencies)

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of meaningful prose with appropriate topic)
  - **Basic validation** (AI-recommended): ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file conforms to pattern)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent
  - Topic selection is open-ended ("anything") with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-104) demonstrate efficient implementation of identical features in 10-15 minutes
  - No external dependencies; uses only Python standard library (pathlib)
  - Basic validation adds minimal overhead while ensuring quality consistency

  ---

  _Requirements phase complete — functional/non-functional requirements defined, success criteria established, product decisions AI-recommended, ready for implementation phase_
