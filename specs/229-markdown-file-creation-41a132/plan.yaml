  ✓ File contains H1 heading on first line
  ✓ File contains 2-3 sentences of prose after blank line
  ✓ File is UTF-8 encoded without BOM
  ✓ File uses Unix LF line endings
  ✓ File is staged with `git add test-3zdw9d.md`
  ✓ Commit exists with message: `feat(229): create markdown file test-3zdw9d.md with prose content`
  ✓ Changes are pushed to remote origin repository

