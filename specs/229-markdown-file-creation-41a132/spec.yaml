# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-3zdw9d.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 90+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-228, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-3zdw9d.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-3zdw9d.md`
  - [ ] Git commit with exact message exists: `feat(229): create markdown file test-3zdw9d.md with prose content`
  - [ ] Commit is created on the feature branch `feat/229-markdown-file-creation-41a132`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-3zdw9d.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-3zdw9d.md`
  - **FR-7**: File must be committed with the exact message: `feat(229): create markdown file test-3zdw9d.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/229-markdown-file-creation-41a132`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes as a natural outcome of proper structure
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 90+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (free-form)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | If test-3zdw9d.md already exists, should implementation overwrite, skip, or fail? | **Overwrite existing file** | Spec is source of truth; overwrite ensures compliance; aligns with 150+ prior markdown-file-creation implementations; prevents test pollution |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project follows a straightforward directory layout optimized for automated feature implementation:

  ```
  .
  ├── .github/              # GitHub Actions workflows and configuration
  ├── .claude/              # Claude Code configuration and agents
  ├── specs/                # Feature specifications (200+ spec directories)
  │   ├── 006-joke-markdown/
  │   ├── 007-joke-markdown-2/
  │   ├── ...
  │   └── 229-markdown-file-creation-41a132/  # This feature's spec
  ├── test-*.md             # 90+ existing test markdown files (root level)
  ├── ABOUT_ME.md
  ├── DESIGN_PATTERN.md
  ├── SHEEP.md
  ├── README.md
  ├── Dockerfile
  └── .gitignore
  ```

  **Key observations**:
  - No `/src/` directory — project is purely file creation and git workflow
  - Specs directory contains 200+ feature specifications with standardized structure
  - Test files (`test-*.md`) are created at repository root, not in subdirectories
  - Each spec has a corresponding feature branch (e.g., `feat/229-markdown-file-creation-41a132`)
  - Recent commits (features 224-228) all follow the identical pattern

  ### Architecture Patterns

  The project implements a **specification-driven implementation workflow**:

  1. **Feature Specification Phase**: Each feature is defined in `specs/<number>-<name>/spec.yaml`
  2. **Automated Implementation**: Agents implement features by reading the spec
  3. **Minimal Output**: Feature creates only the specified file (test-3zdw9d.md) — no source code changes
  4. **Git Integration**: Each implementation includes git staging, conventional commits, and push
  5. **Pattern-Based Consistency**: All 90+ test files follow identical markdown structure (H1 heading + 2-3 sentences)

  **Dependency flow**:
  - Feature spec (spec.yaml) → Implementation reads spec → Create test-3zdw9d.md → Git workflow → Push to branch
  - No cross-feature dependencies (each markdown file is independent)
  - No internal modules or packages — purely file system operations

  ### Relevant Technologies

  - **Markdown**: CommonMark-compliant markdown format for test files
  - **Git**: Version control, branching (`feat/229-markdown-file-creation-41a132`), commits, and pushing
  - **Python 3.11+**: Runtime language for file I/O operations using `pathlib`
  - **File System**: Unix-style text file creation with UTF-8 encoding and LF line endings
  - **GitHub Actions**: Likely CI/CD integration (based on `.github/` directory presence)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-3zdw9d.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-228; no branch/merge complexity, no destructive operations |
