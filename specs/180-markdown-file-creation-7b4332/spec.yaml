content: |
  ## Problem Statement

  Create a markdown file named `test-d8xuk6.md` with a title (H1 heading) and 2-3 sentences of prose
  content about any topic. This is a continuation of feature 179 and follows the established pattern
  from 179 prior markdown file creation features (001-179).

  The file must meet these technical requirements:
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - H1 heading on first line
  - Blank line between heading and prose
  - 2-3 sentences of coherent prose
  - File size approximately 300-600 bytes
  - Git commit and push after creation

  ## Codebase Analysis

  ### Project Structure

  This is the "Sheep" platform - an agentic framework for automated code implementation:

  ```
  repo/
  ├── src/sheep/
  │   ├── agents/              # Agent definitions
  │   ├── config/              # Configuration and LLM setup (settings.py, llm.py)
  │   ├── features/            # Individual feature implementations (features 101-170+)
  │   ├── flows/               # Orchestration flows
  │   ├── tools/               # Git and file operation tools
  │   ├── observability/       # Logging and tracing
  │   ├── content_generators.py # Reusable utilities for markdown generation
  │   └── cli.py               # CLI entry point
  ├── tests/                   # Test files for features
  ├── specs/                   # Feature specifications (180+ specs)
  └── pyproject.toml           # Python project configuration
  ```

  ### Architecture Patterns

  **Content Generation Pipeline**: Each feature follows this pattern:
  1. Generate markdown content using Claude API (via `content_generators.generate_markdown_content()`)
  2. Write file to disk with proper encoding (via `content_generators.write_markdown_file()`)
  3. Validate file meets all requirements (via `content_generators.validate_markdown_file()`)
  4. Commit to git with conventional message (via `content_generators.commit_markdown_file()`)
  5. Push to remote branch (via `content_generators.push_markdown_file()`)

  **LLM Integration**: The `sheep.config.llm.get_reasoning_llm()` factory provides Claude API access
  through CrewAI's LLM framework. The prompt for markdown generation is defined in
  `content_generators.MARKDOWN_GENERATION_PROMPT`.

  **Logging and Observability**: Uses structured logging via `sheep.observability.logging.get_logger()`
  for tracing execution through each step.

  **Git Operations**: Uses GitPython for all git operations, abstracted through the tools module.

  ### Relevant Technologies

  - **CrewAI**: Agent orchestration and task management framework
  - **Anthropic Claude**: LLM used for generating prose content
  - **GitPython**: Git repository operations (commit, push)
  - **Pydantic**: Configuration validation and settings
  - **Pathlib**: Cross-platform file path handling
  - **Structured Logging**: Observability and debugging

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/` | High | Add new feature module `feature_180_markdown_file_creation.py` following the pattern from feature 170 and similar prior features |
  | `tests/` | Low | May add a test file to validate the feature, but not required for core functionality |
  | Repository root | Low | The markdown file `test-d8xuk6.md` will be created here, which is expected per feature pattern |
  | `src/sheep/content_generators.py` | None | No changes needed - all utilities already exist and are reused |
  | `src/sheep/config/` | None | No configuration changes needed - LLM setup is already in place |

  ## Dependencies

  ### Existing Infrastructure (Already Implemented)

  - `sheep.content_generators.generate_markdown_content()` - Calls Claude API to generate prose
  - `sheep.content_generators.write_markdown_file()` - Writes file with UTF-8 encoding
  - `sheep.content_generators.validate_markdown_file()` - Validates file properties and structure
  - `sheep.content_generators.commit_markdown_file()` - Creates conventional commit message and stages changes
  - `sheep.content_generators.push_markdown_file()` - Pushes to remote branch
  - `sheep.observability.logging.get_logger()` - Structured logging for each step
  - `sheep.config.llm.get_reasoning_llm()` - LLM factory for Claude API access

  ### Required LLM Configuration

  - Environment variable `ANTHROPIC_API_KEY` must be set for Claude API access
  - This is handled by existing configuration in `sheep/config/settings.py`

  ### External Dependencies

  - **CrewAI**: Already in dependencies (pyproject.toml)
  - **Anthropic SDK**: Already in dependencies via CrewAI
  - **GitPython**: Already in dependencies
  - **Python 3.11+**: Required

  ## Size Estimate

  **S** (Small - 1-2 hours)

  ### Justification

  This is a straightforward, repetitive feature with minimal complexity:

  1. **Well-Established Pattern**: 179 prior features follow the exact same implementation pattern.
     The implementation is essentially copying and renaming from feature 170, with only:
     - Change feature number from 170 to 180
     - Change filename from test-ir293z.md to test-d8xuk6.md
     - Update docstrings and constants

  2. **No New Infrastructure**: All required tools and utilities are already implemented and tested
     across 179 prior iterations:
     - Content generation via Claude API (proven pattern)
     - File writing with proper encoding (proven pattern)
     - File validation (proven pattern)
     - Git operations (proven pattern)
     - Logging infrastructure (proven pattern)

  3. **No Architectural Changes**: No modifications to core architecture, configuration, or patterns
     are required. This is a data-driven variation of an existing pattern.

  4. **Minimal Testing**: Can reuse test patterns from feature 170 with minor adjustments.

  5. **Implementation Effort Breakdown**:
     - Create feature module: ~15 minutes (copy template, update identifiers)
     - Update any documentation/imports: ~5 minutes
     - Test and validation: ~10 minutes
     - Total: ~30 minutes of actual work

  The complexity comes from ensuring adherence to the established pattern, not from solving new problems.

