content: |
  ## Task Summary

  Feature 280 implementation is broken into 5 focused tasks across 2 phases:

  ### Phase 1: Content Generation and File Creation (Tasks 1-3)

  **Task 1 (25m): Generate markdown content**
  - Uses Claude LLM via CrewAI to create H1 heading + 2-3 sentences
  - Validates content structure post-generation
  - Sets foundation for file creation

  **Task 2 (15m): Write file to disk**
  - Uses pathlib to write content to test-fra9no.md
  - Ensures UTF-8 encoding and proper file closure
  - Depends on task-1 (needs generated content)

  **Task 3 (20m): Validate file properties**
  - Checks UTF-8 encoding (no BOM) and LF-only line endings
  - Independent validation layer separate from content validation
  - Depends on task-2 (needs file to exist)

  ### Phase 2: Git Integration (Tasks 4-5)

  **Task 4 (20m): Git integration**
  - Stages file with git add
  - Commits with required message using sheep.tools
  - Pushes to feature branch
  - Depends on task-3 (validates file before git operations)

  **Task 5 (10m): End-to-end orchestration**
  - Calls all tasks in sequence
  - Comprehensive integration test
  - Verifies complete feature execution
  - Depends on task-4 (final integration step)

  ## Execution Flow

  1. Generate markdown (task-1) → validate structure
  2. Write file (task-2) → confirm file exists with content
  3. Validate encoding (task-3) → ensure UTF-8/LF compliance
  4. Git operations (task-4) → stage, commit, push
  5. Integration test (task-5) → verify end-to-end success

  ## TDD Approach

  Each task follows RED-GREEN-REFACTOR cycle:
  - **RED**: Write test that will fail (test-first)
  - **GREEN**: Implement minimal code to pass test
  - **REFACTOR**: Clean up, add error handling, improve code quality

  This approach ensures each component is testable and each test validates actual requirements.

  ## Effort Breakdown

  - Task 1 (Content generation): 25m (LLM latency: 1-3s, validation: minimal)
  - Task 2 (File I/O): 15m (pathlib is straightforward)
  - Task 3 (Validation): 20m (binary file inspection is straightforward)
  - Task 4 (Git integration): 20m (sheep.tools abstraction reduces complexity)
  - Task 5 (Orchestration): 10m (composition of existing tasks)
  - **Total**: 1h 30m

  LLM latency (1-3 seconds) is acceptable within the 10-15 minute overall feature estimate
  and is inherent to the content generation approach.

  ## Implementation Notes

  - All tasks follow existing patterns from features 069-279
  - No modifications to source code (/src/sheep/) required (NFR-7)
  - Leverage existing functions where available (content_generators.py, sheep.tools)
  - Test suite validates both functionality and requirement compliance
  - Comprehensive error handling ensures graceful failure with helpful messages
