content: |
  ## Architecture Overview

  Feature 280 implements the well-established markdown-file-creation pattern from 225+ identical
  test files in the repository. The implementation is straightforward and leverages proven
  technologies and patterns:

  ### Components

  1. **Content Generation (Claude LLM + CrewAI)**
     - Calls get_reasoning_llm() to access Claude via CrewAI framework
     - Uses MARKDOWN_GENERATION_PROMPT template to generate content
     - Produces markdown with H1 heading and 2-3 sentences of prose
     - Topic selection is free-form (LLM chooses contextually appropriate topic)
     - Existing content_generators.py module in src/sheep/ implements this pattern

  2. **File I/O (Python pathlib)**
     - Uses Path.cwd() / "test-fra9no.md" for safe path construction
     - Writes content with explicit encoding="utf-8"
     - Ensures file creation in repository root (no subdirectories)
     - Post-write validation checks file exists and has content

  3. **Encoding & Line Ending Validation**
     - Python's open(encoding="utf-8") handles UTF-8 correctly on all platforms
     - validate_file_properties() function checks for absence of UTF-8 BOM
     - Validates LF-only line endings (no CRLF) post-write
     - Complies with NFR-1 and NFR-2 requirements

  4. **Git Integration (sheep.tools)**
     - Uses GitCommitTool and GitPushTool from sheep.tools module
     - Integrates with platform observability and logging (structlog)
     - Staged with "git add test-fra9no.md" before commit
     - Commit message: "feat(280): create markdown file test-fra9no.md with title and prose content"
     - Push to feature branch (origin/feat/280-markdown-file-creation-1673aa)

  ### Integration with Existing Codebase

  - **Pattern Alignment**: Identical to features 069-279 (225+ precedents)
  - **No Source Modifications**: Feature does not require changes to /src/sheep/ or test files (NFR-7)
  - **Proven Dependencies**: CrewAI (>=0.86.0) and GitPython (>=3.1.0) already production dependencies
  - **Existing Modules**: Leverages content_generators.py functions for generation and validation

  ## Key Design Decisions

  ### 1. Content Generation: Claude LLM via CrewAI

  **Chosen**: Claude LLM via CrewAI framework for markdown content generation

  **Rationale**:
  - Aligns with Sheep platform's agentic automation purpose
  - CrewAI is already a production dependency (crewai>=0.86.0)
  - Successfully used for features 069-279 (225+ precedents)
  - Provides content variety and quality without additional implementation burden
  - Free-form topic selection leverages LLM capability (topic is flexible per NFR-8)

  **Alternatives Rejected**:
  - Hardcoded prose snippets (less flexible, reduces content variety)
  - Template-based generation (adds maintenance burden without proportional benefit)

  **Evidence**: Research findings document successful implementation in content_generators.py
  with MARKDOWN_GENERATION_PROMPT template and get_reasoning_llm() function already available.

  ### 2. File I/O: Python pathlib.Path with UTF-8 Encoding

  **Chosen**: pathlib.Path with open(encoding="utf-8"), explicit post-write property validation

  **Rationale**:
  - Explicitly required by NFR-5 ("Implementation must use Python pathlib")
  - Modern Python standard library (cross-platform, safe path joining)
  - Highly readable with / operator for path construction
  - Already used throughout codebase (content_generators.py, existing features 069-279)
  - UTF-8 encoding ensures compliance with NFR-1 and NFR-2

  **Alternatives Rejected**:
  - os.open() + os.write() (verbose, requires manual file descriptor management)
  - Direct string path concatenation (separator issues on Windows, security risk)
  - Third-party path libraries (unnecessary complexity, violates NFR-9)

  **Evidence**: Research confirms pathlib is the modern standard and explicitly required;
  existing features use this approach successfully.

  ### 3. Git Integration: sheep.tools Abstraction Layer

  **Chosen**: Use GitCommitTool and GitPushTool from sheep.tools module

  **Rationale**:
  - Maintains consistency with features 069-279 (all use sheep.tools)
  - Integrates with platform observability and structlog logging
  - Provides abstraction layer that insulates from low-level git complexity
  - Enables future changes and monitoring without updating feature implementations
  - Exact commit message format enforced: "feat(280): create markdown file test-fra9no.md with title and prose content"

  **Alternatives Rejected**:
  - GitPython library directly (bypasses platform abstractions, duplicate work)
  - subprocess.run() with git CLI (lower-level, no observability integration, error-prone)

  **Evidence**: Features 069-279 use sheep.tools consistently; research confirms this is
  the established pattern with proven reliability.

  ### 4. Validation Strategy: Dual-Layer Approach

  **Chosen**: Format validation (markdown structure) + property validation (encoding/line endings)

  **Rationale**:
  - Ensures semantic correctness: H1 heading present, 2-3 sentences of prose (success criteria)
  - Ensures technical correctness: UTF-8 encoding, LF-only line endings (NFR-1, NFR-2)
  - Catches issues at their source (generation vs. file I/O)
  - Layered approach enables targeted error messages and debugging
  - Post-write validation ensures cross-platform consistency

  **Components**:
  - _validate_markdown_content() checks H1 heading and sentence count post-generation
  - validate_file_properties() checks encoding/BOM/line endings post-write
  - Both functions raise descriptive ValueError on failure

  **Evidence**: Research findings document these functions already exist in content_generators.py.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Content Generation & File Creation)** comes first because:
  - Must generate and validate content before git operations
  - File must exist before staging with git add
  - Validation ensures file meets all success criteria before version control

  **Phase 2 (Git Integration)** follows because:
  - Requires file to exist and be validated
  - Must stage validated file before commit
  - Exact commit message documents what file was created and why
  - Push completes the feature

  ### Execution Flow

  1. **Generate Content**: Call Claude LLM via CrewAI with MARKDOWN_GENERATION_PROMPT
     - Validate generated content: H1 heading + 2-3 sentences
     - Ensure proper markdown syntax per CommonMark

  2. **Write File**: Use pathlib to write content to test-fra9no.md
     - Specify encoding="utf-8" for cross-platform consistency
     - Validate file was created with correct properties

  3. **Validate Properties**: Check encoding, line endings, file size
     - Ensure UTF-8 encoding without BOM
     - Verify LF-only line endings (no CRLF)
     - Confirm file size in typical range (400-600 bytes)

  4. **Stage File**: Use git add test-fra9no.md
     - Verify file is staged before proceeding to commit

  5. **Commit**: Use GitCommitTool with exact message
     - Message: "feat(280): create markdown file test-fra9no.md with title and prose content"
     - Commit to feature branch feat/280-markdown-file-creation-1673aa

  6. **Push**: Use GitPushTool to push to origin
     - Push to origin/feat/280-markdown-file-creation-1673aa
     - Verify push completes successfully

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | LLM API unavailable | Low | High | CrewAI + Claude are production dependencies; fallback patterns available |
  | Generated content fails validation | Very Low | Medium | Dual validation catches malformed content immediately; well-established prompt from 200+ features |
  | File encoding issues on Windows | Very Low | Medium | Explicit encoding="utf-8" parameter + post-write validation ensures consistency across platforms |
  | Git authentication failure | Very Low | High | sheep.tools handles git auth; assume git configuration is correctly set up on runner |
  | File already exists | Very Low | Low | Overwrite test-fra9no.md (per established pattern); file is test artifact, not source code |
  | Insufficient write permissions | Very Low | High | Repository root should be writable; feature follows NFR-7 (no system/config modifications) |
  | Network issues during push | Low | Medium | Retry push operation; sheep.tools should handle transient errors gracefully |

  ## Summary

  Feature 280 is a proven, low-risk implementation following established patterns from 225+
  identical test files. All technical decisions are made based on existing codebase patterns
  and validated through features 069-279. Implementation requires no architectural changes,
  no source code modifications (NFR-7), and uses only existing dependencies. The work is
  straightforward, well-scoped (S estimate: 10-15 minutes), and can proceed directly to
  execution phase with high confidence.
