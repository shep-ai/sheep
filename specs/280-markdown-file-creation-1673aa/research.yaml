# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (complete)
  - **Updated:** 2026-03-30
  - **Decision Status:** All decisions resolved; technical approach fully specified

  ## Summary of Findings

  Feature 280 is a straightforward continuation of the markdown-file-creation pattern established in features 069-279.
  Research reveals that:

  1. **No new architectural decisions are required** — all choices align with established precedent
  2. **Technology stack is fully specified** — Python 3.11+, pathlib, CrewAI, Claude LLM, existing sheep.tools
  3. **Implementation pattern is proven** — 225+ existing test files demonstrate the approach works reliably
  4. **Content generation is validated** — content_generators.py already implements the full generation and validation pipeline
  5. **Git integration is mature** — sheep.tools provides robust git abstraction with observability

  ## Technology Decisions

  ### 1. Content Generation Method: Claude LLM via CrewAI

  **Chosen:** Claude LLM via CrewAI framework for markdown content generation

  **Rejected:**
  - Hardcoded prose snippets — less flexible, reduces content variety, doesn't demonstrate LLM capabilities
  - Template-based generation with substitution — adds maintenance burden, less scalable across 200+ features

  **Rationale:** The Sheep platform's core purpose is agentic automation. Using Claude LLM via CrewAI aligns with this mission
  while leveraging infrastructure already in place (CrewAI is dependency crewai>=0.86.0). The content_generators.py module
  in src/sheep/ implements this pattern successfully for features 069-279. LLM generation provides content variety while
  maintaining quality through validation (2-3 sentences, H1 heading requirement).

  **Implementation Details:**
  - Uses MARKDOWN_GENERATION_PROMPT template from content_generators.py
  - Calls get_reasoning_llm() to access Claude LLM
  - Validates response format post-generation
  - Ensures trailing LF newline

  ### 2. File I/O: Python pathlib.Path with UTF-8 Encoding

  **Chosen:** pathlib.Path with open(encoding=\"utf-8\"), validate file properties post-write

  **Rejected:**
  - os.open() + os.write() — verbose, requires manual FD management, less Pythonic
  - String path concatenation — separator issues on Windows, security risk for path traversal

  **Rationale:** pathlib.Path is the modern Python 3 standard (explicitly required by NFR-5), cross-platform safe,
  and already used throughout the codebase. The / operator for path joining is safe and readable. Using context manager
  (with statement) ensures proper file closure. UTF-8 encoding is specified in NFR-1; Python's default on Unix systems
  ensures consistent behavior.

  **Implementation Details:**
  - Use Path.cwd() to get repository root (correct at invocation time)
  - Use path / filename for safe path joining
  - Specify encoding=\"utf-8\" in open() call
  - Validate file exists and has content post-write

  ### 3. Git Integration: sheep.tools GitCommitTool and GitPushTool

  **Chosen:** Use existing sheep.tools.GitCommitTool and GitPushTool classes

  **Rejected:**
  - GitPython library — available as dependency but bypasses sheep abstractions
  - subprocess.run() — lower-level, harder to maintain, no observability integration

  **Rationale:** sheep.tools provides abstraction layer that integrates with platform observability, logging, and error handling.
  This maintains consistency with features 069-279, which all use the same tools. The abstraction provides foundation for future
  changes and monitoring while avoiding code duplication.

  **Implementation Details:**
  - Import GitCommitTool and GitPushTool from sheep.tools
  - Use exact commit message format: \"feat(280): create markdown file test-fra9no.md with title and prose content\"
  - Ensure staging (git add) occurs before commit
  - Push to current branch (feat/280-markdown-file-creation-1673aa)

  ### 4. Encoding and Line Ending Validation

  **Chosen:** UTF-8 encoding (Python default), explicit LF validation post-write

  **Rejected:**
  - Manual CRLF conversion — unnecessary complexity on modern systems
  - Skip validation — risky, could result in platform-specific line ending issues

  **Rationale:** Python's open() with encoding=\"utf-8\" handles UTF-8 correctly cross-platform. Unix systems naturally produce LF.
  The validate_file_properties() function in content_generators.py checks for absence of UTF-8 BOM (b\"\\xef\\xbb\\xbf\") and
  presence of LF-only line endings (no b\"\\r\\n\"). This validation ensures compliance with NFR-1 and NFR-2.

  **Implementation Details:**
  - No additional code needed; use Python's standard encoding parameter
  - Call validate_file_properties(filepath) after write to verify
  - Validation raises ValueError if BOM present or CRLF found

  ### 5. Content Validation: Dual-Layer Approach

  **Chosen:** Format validation after generation + property validation after file write

  **Rejected:**
  - No validation — violates success criteria, quality risk
  - Single-layer validation — misses either semantic or technical correctness

  **Rationale:** Dual validation ensures both semantic correctness (2-3 sentences, H1 heading) and technical correctness
  (UTF-8, LF, non-empty file). The _validate_markdown_content() function checks structure; validate_file_properties() checks
  encoding. This layered approach catches issues at their source.

  **Implementation Details:**
  - Generate content → validate_markdown_content() [checks H1 heading, sentence count]
  - Write to file → validate_file_properties() [checks encoding, line endings, BOM]
  - Both functions raise descriptive ValueError on failure

  ### 6. Topic Selection: Free-Form LLM Choice

  **Chosen:** Allow LLM to select topic freely per prompt

  **Rejected:**
  - Fixed topic list — adds constraint without benefit, requires maintenance
  - Predefined prose corpus — reduces LLM utilization, less flexible

  **Rationale:** Spec explicitly allows free-form topic selection (NFR-8). Existing test files demonstrate successful free-form
  topics (iterative development, Aurora Borealis, joy of discovery, etc.). LLM-based selection is simpler and scales better
  than maintaining predefined topics.

  **Implementation Details:**
  - MARKDOWN_GENERATION_PROMPT allows LLM to choose any topic
  - No topic constraints or validation needed
  - LLM naturally produces contextually appropriate content

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  |---|---|---|---|
  | pathlib (stdlib) | File I/O and path operations | Use | Required by NFR-5; modern Python standard; cross-platform safe |
  | CrewAI (>=0.86.0) | LLM orchestration framework | Use | Already production dependency; Claude support configured; proven in 200+ features |
  | Claude (via CrewAI) | Content generation | Use | Best-in-class LLM; produces coherent, contextually appropriate prose |
  | structlog (>=24.0.0) | Structured logging | Use | Platform standard; already used in content_generators.py |
  | sheep.tools | Git integration | Use | Provides abstraction; integrated observability; established pattern |
  | GitPython (>=3.1.0) | Low-level git operations | Reject* | Available but using higher-level abstractions (sheep.tools) is preferred |
  | subprocess (stdlib) | External command execution | Reject for git | Prefer sheep.tools abstraction for maintainability and observability |
  | pathspec (external) | Path pattern matching | Reject | Not needed; filename is hardcoded (test-fra9no.md) |
  | Jinja2 (hypothetical) | Template rendering | Reject | No templates needed; direct string generation works |

  *GitPython is an available dependency but not used directly; sheep.tools provides better abstraction.

  ## Security Considerations

  ### 1. Path Traversal Prevention
  - **Issue:** Unsafe filename could write to arbitrary location
  - **Mitigation:** Filename validation in write_markdown_file() checks for \"/\", \"\\\", and \".\" prefixes
  - **Implementation:** Use Path.cwd() / filename pattern; validate filename before use
  - **Status:** ✓ Covered by content_generators.py validation

  ### 2. UTF-8 Encoding Safety
  - **Issue:** Encoding mismatches could cause file corruption or display issues
  - **Mitigation:** Explicit encoding=\"utf-8\" in open() call; post-write validation
  - **Implementation:** Use open(file_path, \"w\", encoding=\"utf-8\")
  - **Status:** ✓ Covered by Python's encoding parameter and validate_file_properties()

  ### 3. LLM Content Safety
  - **Issue:** Generated content could include malicious or inappropriate text
  - **Mitigation:** Structural validation (H1 heading, 2-3 sentences) provides constraint; sentence count check prevents prompt injection payloads
  - **Implementation:** _validate_markdown_content() checks structure; sentence count (2-3) limits content size
  - **Status:** ✓ Covered by validation layer

  ### 4. Git Operation Safety
  - **Issue:** Git operations could fail or corrupt repository state
  - **Mitigation:** Use sheep.tools which handles error checking; validate file staged before commit
  - **Implementation:** Ensure git add succeeds before calling GitCommitTool
  - **Status:** ✓ Covered by sheep.tools error handling

  ### 5. File Permissions and Ownership
  - **Issue:** File could be created with incorrect permissions or ownership
  - **Mitigation:** File creation uses default umask; no special permission handling needed for test artifacts
  - **Implementation:** pathlib.Path.write_text() uses system defaults
  - **Status:** ✓ Standard behavior acceptable for test files

  ## Performance Implications

  ### 1. LLM Generation Latency
  - **Impact:** Single LLM request adds 1-3 seconds typical latency
  - **Mitigation:** Feature is expected to complete in ~10-15 minutes; LLM latency is acceptable
  - **Optimization:** No optimization needed; content generation latency is inherent to approach

  ### 2. File I/O Performance
  - **Impact:** Single write operation (~400-600 bytes) is negligible
  - **Optimization:** No optimization needed; write is atomic operation

  ### 3. Git Operations Performance
  - **Impact:** Single add/commit/push sequence adds 1-5 seconds typical
  - **Optimization:** No optimization needed; operations are standard git performance

  ### 4. Memory Usage
  - **Impact:** Generated content (~400-600 bytes) + validation overhead is minimal
  - **Optimization:** No optimization needed; memory footprint is negligible

  ### 5. Overall Feature Execution
  - **Expected duration:** 10-15 minutes (per size estimate S)
  - **Breakdown:** LLM generation (1-3s) + validation (negligible) + file write (negligible) + git ops (1-5s)
  - **Bottleneck:** LLM API latency (expected and acceptable)

  ## Architecture Notes

  ### Integration with Sheep Platform

  Feature 280 integrates with Sheep's established architecture:

  1. **CrewAI Integration:** Leverages platform's LLM orchestration via CrewAI framework
  2. **Observability:** Uses structlog for logging; sheep.tools integration provides monitoring
  3. **Error Handling:** Validation functions raise descriptive errors; platform captures and reports
  4. **File Artifacts:** Test markdown files are validation artifacts of automation system, not application code

  ### Pattern Consistency

  Feature 280 follows identical patterns from features 069-279:
  - Same markdown structure (H1 + prose)
  - Same LLM-based generation approach
  - Same git workflow (add/commit/push)
  - Same file naming convention (test-RANDOMID.md)
  - Same encoding standards (UTF-8, LF)

  ### No Breaking Changes

  Implementation has no impact on:
  - Application source code (/src/sheep/)
  - Test suite or test files
  - Configuration or CI/CD pipelines
  - Dependencies (no new packages required)
  - Platform architecture

  ## Conclusion

  Feature 280 is a mature, well-established pattern with proven implementation across 200+ prior features. All technical
  decisions are resolved; chosen approaches align with existing codebase patterns and have been validated in production.
  Implementation can proceed directly to planning/execution phase without architectural concerns.

