decisions:
  - title: "Content Generation Method"
    chosen: "Claude LLM via CrewAI framework"
    rejected:
      - "Hardcoded prose snippets — less flexible, reduces content variety, doesn't align with Sheep platform's agentic automation purpose"
      - "Template-based generation system — adds complexity without proportional benefit, requires template management, less scalable"
    rationale: >
      The Sheep platform is designed for agentic automation; using Claude LLM via CrewAI aligns with this purpose and demonstrates
      LLM-driven implementation. CrewAI is already a production dependency (crewai>=0.86.0) with Claude support configured.
      LLM-based generation provides content variety and scalability across 200+ iterations while maintaining quality constraints
      (2-3 sentences, H1 heading). The content_generators.py module in src/sheep/ already implements this pattern for features 069-279,
      confirming its viability.

  - title: "File I/O Implementation"
    chosen: "Python pathlib.Path with context manager"
    rejected:
      - "os.open() + os.write() — more verbose, less Pythonic, requires manual file descriptor management"
      - "open() with os.getcwd() — works but doesn't use modern pathlib API, less safe for path operations"
      - "Direct string concatenation for paths — prone to separator issues on Windows, security risk"
    rationale: >
      pathlib.Path is the modern Python standard (stdlib), cross-platform safe, and explicitly required by NFR-5.
      The / operator for path joining is safe and readable. Using context manager (with statement) ensures proper
      file closure. pathlib is already used throughout the codebase (sheep/content_generators.py, existing features).
      UTF-8 encoding is the Python default on Unix systems; explicitly specifying it ensures cross-platform consistency.

  - title: "Git Integration Approach"
    chosen: "Existing sheep.tools.GitCommitTool and GitPushTool classes"
    rejected:
      - "GitPython library wrapper — while available as dependency (gitpython>=3.1.0), direct use bypasses sheep abstraction"
      - "subprocess.run() with git CLI — lower-level approach, less integrated with sheep observability/logging, harder to maintain"
    rationale: >
      sheep.tools provides GitCommitTool and GitPushTool which integrate with the platform's observability, logging (structlog),
      and error handling patterns. This maintains consistency with features 069-279, which all use the same tools. The abstraction
      layer provides a better foundation for future changes and monitoring.

  - title: "Encoding and Line Ending Handling"
    chosen: "UTF-8 encoding (default), LF validation post-write"
    rejected:
      - "Manual CRLF conversion on Windows — adds complexity, error-prone, unnecessary on modern systems"
      - "UTF-16 or other encodings — spec requires UTF-8, no rationale for alternatives"
      - "No validation — risky, could result in CRLF files on Windows systems"
    rationale: >
      Python's open() with encoding=\"utf-8\" handles UTF-8 correctly on all platforms. Unix systems naturally produce LF;
      Windows Python also respects encoding parameter on write. The content_generators.py already includes validate_file_properties()
      which checks for absence of UTF-8 BOM and presence of LF-only line endings. Post-write validation ensures compliance.
      This matches the requirement in NFR-1 and NFR-2.

  - title: "Content Validation Strategy"
    chosen: "Dual validation: format validation after generation, property validation after file write"
    rejected:
      - "No validation — risky, could result in malformed files, violates success criteria"
      - "Only content validation — misses encoding/line ending issues, incomplete quality assurance"
      - "Only file property validation — misses semantic correctness (sentence count, H1 structure)"
    rationale: >
      Dual validation ensures both semantic correctness (2-3 sentences, H1 heading, prose quality) and technical correctness
      (UTF-8 encoding, LF line endings, file exists and has content). The _validate_markdown_content() and validate_file_properties()
      functions in content_generators.py implement this pattern. This aligns with success criteria which require both structure
      (H1 heading, 2-3 sentences) and technical properties (UTF-8, LF, 400-600 bytes).

  - title: "Topic Selection Mechanism"
    chosen: "Free-form topic selection by LLM prompt"
    rejected:
      - "Hardcoded topic list (predefined categories) — adds constraint without proportional benefit, requires maintenance"
      - "Random topic selection from fixed corpus — reduces LLM capability utilization, less flexible"
    rationale: >
      The feature specification explicitly allows free-form topic selection (NFR-8: \"Prose topic may be any topic chosen by the
      implementer\"). The LLM is well-capable of generating coherent, contextually appropriate prose on any topic. Existing test files
      (test-elv4sx.md, test-b2fl92.md, test-3nslmx.md) demonstrate successful free-form topics (iterative development, Aurora Borealis,
      joy of discovery). Allowing the LLM to choose topic is simpler, more scalable, and provides content variety without additional
      implementation complexity.

