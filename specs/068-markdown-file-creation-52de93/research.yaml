decisions:
  - title: "File Creation Method"
    chosen: "Python pathlib.Path.write_text() with explicit encoding='utf-8' and newline='\\n'"
    rejected:
      - "Python open() with context manager — More verbose (5-7 lines vs. 1 line), requires manual resource management"
      - "Custom file I/O function — Unnecessary abstraction; pathlib is sufficient and modern"
      - "External library (GitPython, crewai tools) — Overengineered for simple file creation"
    rationale: >
      The existing create_markdown.py script uses this exact pattern, establishing clear precedent.
      pathlib is idiomatic in Python 3.11+ (minimum required version per pyproject.toml). The method
      is declarative and handles encoding transparently. Critical parameters: encoding='utf-8' ensures
      UTF-8 without BOM (NFR-1); newline='\\n' prevents platform-specific CRLF translation on Windows (NFR-2).

  - title: "Prose Content Generation"
    chosen: "Hardcoded prose content written directly in implementation, any topic developer selects"
    rejected:
      - "Random topic from predefined list — Adds complexity, requires list maintenance, unnecessary for single file"
      - "AI-generated content via LLM API — Adds network dependency, latency, and complexity for simple content"
    rationale: >
      The spec explicitly allows 'any topic, developer chooses'. The 68+ existing test files demonstrate
      diverse topics (bioluminescence, kiln construction, nautical knots, fermentation science) without
      central coordination. Hardcoding prose directly is simplest and allows meaningful, substantive content
      rather than generic filler. Developers can select any topic of interest and write 2-3 sentences directly.

  - title: "File Size Validation Strategy"
    chosen: "Validate file size after creation using path.stat().st_size, ensure 400-600 bytes"
    rejected:
      - "Pre-calculate content length and adjust prose — Difficult to predict exact UTF-8 byte count, error-prone"
      - "Skip validation entirely — Violates NFR-3 requirement, leaves implementation unverified"
    rationale: >
      Post-creation validation is fail-safe. Existing test files all fall within 400-600 byte range with
      2-3 sentences of content. By writing prose of equivalent length and then validating, we guarantee
      NFR-3 compliance. If prose unexpectedly exceeds or falls short, validation catches it immediately.
      Check is trivial in Python: path.stat().st_size returns bytes.

  - title: "Git Integration Approach"
    chosen: "Use subprocess.run() to invoke git command-line tool for add, commit, and push operations"
    rejected:
      - "GitPython library — Available in dependencies but adds object-oriented overhead; subprocess matches established patterns"
      - "CrewAI git tools — Designed for multi-agent orchestration, unnecessary for standalone script"
    rationale: >
      The git_tools.py module (src/sheep/tools/git_tools.py) consistently uses subprocess.run() for all
      git operations (status, diff, log, commit, push, worktree). This establishes architectural pattern.
      subprocess is lightweight, preserves git semantics directly, and requires no abstractions. For the
      simple three-operation sequence (add, commit, push), subprocess is more appropriate than object-oriented wrappers.

  - title: "Line Ending Enforcement"
    chosen: "Explicitly specify newline='\\n' parameter to pathlib.write_text() to guarantee Unix LF"
    rejected:
      - "Rely on platform-default behavior — Windows defaults to CRLF; violates NFR-2 requirement"
      - "Post-processing line ending conversion — Adds complexity and error risk; better to get right at creation"
    rationale: >
      The spec explicitly requires Unix-style LF line endings (\\n), not CRLF or mixed (NFR-2). Without
      explicit newline control, Python on Windows translates '\\n' to '\\r\\n' (CRLF) in text mode.
      Setting newline='\\n' disables platform-specific translation on all operating systems, guaranteeing
      exact bytes written to disk match specification. This is standard practice for cross-platform tools.

  - title: "UTF-8 Encoding Specification"
    chosen: "Explicitly specify encoding='utf-8' parameter; never use 'utf-8-sig' which adds BOM"
    rejected:
      - "Rely on system default encoding — Locale-dependent and unpredictable in different environments"
      - "Use UTF-8 with BOM (utf-8-sig) — Violates NFR-1 requirement for no Byte Order Mark"
    rationale: >
      The spec explicitly requires UTF-8 without Byte Order Mark (NFR-1). While default text encoding
      varies by system locale, explicit encoding='utf-8' guarantees consistency. UTF-8 doesn't require
      BOM for byte-order detection (unlike UTF-16/UTF-32); BOM is unnecessary and can cause issues in
      text processing tools and version control. This is the standard for modern web and Unix systems.

