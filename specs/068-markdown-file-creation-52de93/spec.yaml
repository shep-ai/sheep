# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-r1dvmd.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 68+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 059-067, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-r1dvmd.md` exists at repository root (not in subdirectory)
  - [ ] File contains a valid markdown H1 heading (#) as the title
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line following the heading
  - [ ] File uses UTF-8 encoding (no BOM)
  - [ ] File uses LF line endings (Unix-style `\n`, not CRLF or mixed)
  - [ ] File size is within 400-600 bytes (consistent with established pattern)
  - [ ] Markdown syntax is valid per GitHub Flavored Markdown (GFM) specification
  - [ ] File is staged in git with `git add test-r1dvmd.md`
  - [ ] Commit message follows conventional commits format: `feat(068): create markdown file test-r1dvmd.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/068-markdown-file-creation-52de93`
  - [ ] No modifications to any source code, tests, or configuration files
  - [ ] No changes to any existing files in the repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-r1dvmd.md` at the repository root directory
  - **FR-2**: Include a single H1 markdown heading (#) as the document title (e.g., `# My Title`)
  - **FR-3**: Include exactly 2-3 sentences of prose content separated from the heading by a blank line
  - **FR-4**: Stage the created file in git using `git add test-r1dvmd.md`
  - **FR-5**: Create a git commit with a conventional commit message using the `feat:` prefix and scope, following the format `feat(068): create markdown file test-r1dvmd.md with prose content`
  - **FR-6**: Push the commit to the feature branch `feat/068-markdown-file-creation-52de93`
  - **FR-7**: Do not modify, overwrite, or delete any existing files in the repository during the implementation

  ## Non-Functional Requirements

  - **NFR-1**: File Encoding: The markdown file must be encoded in UTF-8 without a Byte Order Mark (BOM)
  - **NFR-2**: Line Endings: The file must use Unix-style LF line endings (`\n`), not Windows CRLF or mixed line endings
  - **NFR-3**: File Size: The file must be between 400-600 bytes in size, consistent with the established pattern from features 059-067
  - **NFR-4**: Markdown Syntax: The file must conform to GitHub Flavored Markdown (GFM) specification for valid syntax
  - **NFR-5**: Pattern Consistency: The implementation must follow the established markdown structure pattern: heading → blank line → prose paragraphs (observed in 68+ existing test files)
  - **NFR-6**: No Dependencies: The file creation must not depend on or modify any source code in `/src/sheep/` or other directories outside the repository root

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the markdown title use H1 (#) or H2 (##) heading level? | H1 (#) | H1 is the standard markdown convention for document titles, providing clear semantic hierarchy and consistency with documentation best practices. |
  | 2 | How should the 2-3 sentences of prose content be selected or generated? | Any topic, developer chooses | Aligns with user query "about anything", maximizes implementation simplicity, and matches the variety observed in 68+ existing test files. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-r1dvmd.md) to existing collection of 68+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 059-067; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/068-markdown-file-creation-52de93` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 68+ test files provide clear precedent for content format and structure (H1 heading → blank line → prose)
  - **Python standard library**: pathlib module for file I/O (no external dependencies)
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Editor/File Tools**: Access to create and write plain text files with UTF-8 encoding and LF line endings

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is structured as follows:

  - **Repository Root**: Contains multiple markdown files including:
    - `README.md` — Main project documentation describing the agentic platform
    - `test-*.md` — Test markdown files (68+ existing files with varied content and topics)
    - Design pattern and educational markdown files (e.g., DESIGN_PATTERN.md, DESIGN_PATTERN_SUMMARY.md)
    - State machine example files (e.g., ELEVATOR_STATE_MACHINE.md, DOOR_LOCK_STATE_MACHINE.md)
    - Topical content files (e.g., cartography.md, fermentation-science-6tiohf.md, kiln-construction.md)
  - **specs/ directory**: Contains feature specifications organized by feature number and name
    - Each feature has a subdirectory with spec.yaml
  - **src/ directory**: Contains the Sheep application source code
    - `sheep/agents/` — Agent definitions (code_agents.py, general_agents.py)
    - `sheep/config/` — Configuration management (settings.py, llm.py)
    - `sheep/flows/` — Flow orchestration (code_implementation.py, chat.py)
    - `sheep/tools/` — Agent tools (file_tools.py, git_tools.py, web_tools.py)
    - `sheep/observability/` — Logging and tracing (langfuse_client.py, logging.py)
    - `sheep/cli.py` — Command-line interface
  - **tests/ directory**: Test suite for the Sheep application
  - **Project Configuration**:
    - `pyproject.toml` — Python project metadata, dependencies, and tool configuration
    - `Dockerfile`, `docker-compose.yml` — Container deployment configuration
    - `uv.lock` — Python dependency lock file

  ### Architecture Patterns

  - **Specification-Driven Design**: Features are defined through detailed YAML specifications with problem statements, success criteria, and requirements
  - **Incremental Feature Implementation**: Each numbered feature builds on previous ones, testing different aspects of the automated implementation system
  - **Standalone Artifacts**: Markdown test files are independent, self-contained documents with no cross-dependencies
  - **Established Naming Conventions**: Test files follow the pattern `test-<random_id>.md` with varied prose content on any topic
  - **Modular Agentic Architecture**: The Sheep platform uses CrewAI with specialized agents (Research, Implementation, Review) orchestrated through flows
  - **Observable Execution**: Full tracing via Langfuse for execution graphs, metrics, and logs

  ### Relevant Technologies

  - **Markdown**: Standard GitHub Flavored Markdown (GFM) syntax, used for all test files and documentation
  - **Git**: Version control with branch-per-feature workflow (feat/068-markdown-file-creation-52de93)
  - **Python**: Primary implementation language; Python 3.11+ required per pyproject.toml
  - **Python pathlib**: Standard library module for file I/O (used in existing create_markdown.py)
  - **CrewAI**: Framework for building agentic systems (v0.86.0+ per dependencies)
  - **Pydantic**: Data validation and settings management

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown H1 heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 68+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (059-067) demonstrate efficient implementation of identical features
  - File I/O is straightforward using Python pathlib (requires 2-3 lines of code)
  - Git operations follow standard workflow (add, commit, push)

