# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single test markdown file following an established, proven pattern
  from 65+ existing test files (features 063-079). The implementation is isolated to the
  repository root directory with no dependencies on application source code, tests, or
  configuration files.

  **Integration Points:**
  - Repository root directory: Adds one new .md file to existing collection of 65+ test files
  - Git repository: Follows standard feature branch workflow (pre-created branch: feat/080-markdown-file-creation-172d87)
  - File system: Single write operation (~300-600 bytes)

  **Isolation:**
  - Feature affects ONLY repository root (one new test file)
  - No modifications to /src/sheep/, tests/, configuration, or documentation
  - No impact on application code, build system, CI/CD pipeline, or other features
  - No dependencies on or changes to other features

  ## Key Design Decisions

  All design decisions have been researched and documented in research.yaml with rationale
  and rejected alternatives. Key choices:

  ### 1. File I/O Library: pathlib.Path.write_text()

  **Chosen:** Python pathlib.Path.write_text() with explicit encoding="utf-8"

  **Why:** Required by NFR-5 ("Implementation must use Python pathlib.Path for file I/O operations").
  pathlib is the modern, Pythonic approach with clean object-oriented API, proper resource
  management, and explicit encoding control. Single-line usage: Path("test-k5yjxa.md").write_text(content, encoding="utf-8").
  Matches pattern from all 65+ precedent test files.

  **Alternatives considered:** open() with manual handling (more verbose, harder to guarantee
  cleanup); third-party libraries (unnecessary dependencies, violates NFR-9).

  ### 2. Git Operations: subprocess.run() with hardcoded commands

  **Chosen:** subprocess.run() with shell=False for three deterministic git operations

  **Why:** Git operations (add, commit, push) are deterministic with no variable interpolation.
  subprocess.run(shell=False) is the safest, most direct approach. No command injection risk
  because all command strings are hardcoded. Avoids unnecessary abstraction layer of GitPython.

  **Alternatives considered:** GitPython library (adds abstraction; subprocess is simpler);
  shell=True (unsafe; subprocess with shell=False prevents injection).

  ### 3. Content Generation: Hardcoded prose string

  **Chosen:** Hardcoded content string with flexible topic chosen by implementer

  **Why:** Spec explicitly allows "implementer complete flexibility (any topic)" per user query
  "about anything". Prose topic is irrelevant to functionality (file creation, git workflow,
  validation). Hardcoded content is deterministic, zero-dependency, and simplest possible
  approach. File size naturally falls into 300-600 byte range without calculation.

  **Alternatives considered:** Template system (unnecessary abstraction for single static file);
  AI/LLM generation (external dependencies, non-deterministic, overkill).

  ### 4. Line Endings & Encoding: Explicit \n in content, explicit UTF-8 in pathlib

  **Chosen:** Content string with explicit \n newlines; pathlib.write_text(encoding="utf-8")

  **Why:** Python str with \n represents Unix LF internally. pathlib.write_text(encoding="utf-8")
  preserves \n as LF on all platforms and produces UTF-8 without BOM. No platform-specific
  code or post-processing needed. Complies with NFR-1 (UTF-8 without BOM) and NFR-2 (Unix LF).

  **Alternatives considered:** OS defaults (leads to platform-dependent line endings, violates
  NFR-2); post-processing (dos2unix) (adds complexity, error-prone).

  ### 5. Markdown Structure: H1 heading + blank line + 2-3 sentences

  **Chosen:** `# Title\n\n<2-3 sentences of prose>`

  **Why:** Matches structure of all 65+ existing test files (verified: test-v7xasn.md ~534 bytes,
  test-6tawx3.md ~400 bytes). Provides meaningful, readable content while keeping implementation
  simple. File size naturally in 300-600 byte range. Zero-risk pattern with proven precedents.

  **Alternatives considered:** Title-only (deviates from precedent, minimal content);
  Multiple headings with variable prose (adds unnecessary complexity, diverges from pattern).

  ## Implementation Strategy

  **Two sequential phases ensure correct file artifact before git integration:**

  1. **Phase 1: File Creation & Validation** — Create the markdown file with proper content
     structure and verify encoding/line endings. This is the "what" (the artifact).
     - Task 1: Create markdown file with H1 heading + 2-3 prose sentences (using pathlib)
     - Task 2: Verify UTF-8 encoding and LF line endings (read_bytes check)
     - Task 3: Verify file size in expected range (~300-600 bytes)

  2. **Phase 2: Git Integration & Push** — Stage, commit, and push the file to the feature
     branch. This is the "how it flows through git" (the integration).
     - Task 4: Stage file and commit with conventional message (git add, git commit)
     - Task 5: Push to feature branch (git push)

  **Why this ordering:** File must exist before staging; staged and committed before pushing.
  Logical separation allows verification of file properties before involving git.

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | File encoding mismatch (CRLF instead of LF) | Low | High (violates NFR-2) | Explicit \n in content string + pathlib.write_text() with encoding="utf-8" handles all platforms correctly |
  | File contains BOM marker | Low | Medium (violates NFR-1) | pathlib.write_text() with encoding="utf-8" (not "utf-8-sig") produces UTF-8 without BOM |
  | Git configuration missing (user.name, user.email) | Low | High (commit fails) | Assume standard git config exists (typical in CI/development environment); task accepts subprocess error |
  | Feature branch doesn't exist | Very Low | High (push fails) | Branch is pre-created as part of test setup; task accepts subprocess error if missing |
  | File permissions prevent write | Very Low | High | Standard file write permissions in repo root (already verified in 65+ precedent features) |
  | Markdown syntax invalid | Very Low | Low | Structure is trivial (single # heading + prose); standard CommonMark compliance verified in validation task |

  **Overall risk assessment: MINIMAL.** Well-established pattern with 65+ successful precedents,
  no external dependencies, no complex operations, isolated changes, proven safety. All technical
  decisions are grounded in research findings and best practices.

