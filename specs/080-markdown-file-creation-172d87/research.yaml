  - title: 'Git Operations Implementation'
    chosen: 'subprocess.run() with hardcoded git commands'
    rejected:
      - 'GitPython library (git.Repo) — Available in pyproject.toml but adds abstraction layer; subprocess is simpler, more direct control, and avoids library method mapping'
      - 'Direct git CLI invocation (shell=True) — Unsafe; potential for command injection if any user input involved; subprocess with shell=False is more secure and equally simple'
    rationale: >
      subprocess.run() with shell=False is the safest, most direct approach. Git operations are deterministic
      (add, commit with exact message, push to feature branch), with no variable interpolation needed.
      While GitPython is a dependency, subprocess avoids abstraction and method lookup overhead.
      Matches pattern from similar features: straightforward, imperative git command execution.
