  - title: 'Line Ending and Encoding Control'
    chosen: 'pathlib.Path.write_text() with explicit encoding="utf-8" parameter; content string uses explicit \n newlines'
    rejected:
      - 'Rely on OS defaults (platform-dependent line endings) — Leads to CRLF on Windows, violates NFR-2 (Unix-style LF required)'
      - 'Post-processing step to convert line endings (e.g., dos2unix) — Adds extra subprocess call, increases complexity, error-prone'
    rationale: >
      Python str with \n represents Unix LF internally. pathlib.write_text(encoding="utf-8") writes UTF-8 without BOM
      and preserves \n as LF on all platforms. No platform-specific code needed. Explicit encoding parameter
      ensures compliance with NFR-1 (UTF-8 without BOM). Simplest approach: embed proper newlines in content string,
