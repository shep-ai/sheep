# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 179 is a minimal, isolated file creation task that does not integrate with the application codebase in `/src/sheep/`.
  The feature creates a single test artifact (test-brrq8h.md) in the repository root, following the established pattern
  from features 001-178.

  ### Integration Pattern

  - **Scope:** Repository root only (test file artifact, not application code)
  - **Impact on /src/sheep/:** None
  - **Impact on tests:** None
  - **Impact on configuration:** None
  - **Architecture coupling:** Zero — test files are standalone artifacts

  ### Established Pattern (178+ Precedents)

  All markdown-file-creation features (001-178) follow an identical pattern:
  1. Create single markdown file in repository root with pattern `test-*.md`
  2. File contains H1 heading (title) followed by 2-3 sentences of prose
  3. Use pathlib.Path.write_text() with UTF-8 encoding (no BOM), LF line endings
  4. File size typically 300-800 bytes (measured across 178+ test files)
  5. Stage with git add, commit with conventional format, push to feature branch
  6. No application code changes, no configuration changes, no test modifications

  ## Key Design Decisions

  ### 1. File Creation Technology: pathlib.Path

  **Decision:** Use `pathlib.Path.write_text()` for atomic file creation with UTF-8 encoding.

  **Alternatives Considered:**
  - Standard `open()` context manager — requires manual encoding and newline parameter specification; more verbose
  - Low-level `os.open()` with `os.write()` — unnecessarily verbose for this use case
  - File templates or builders — adds unnecessary abstraction for single, simple file

  **Rationale:**
  pathlib is the established pattern across all 178+ test files in the repository (empirically verified).
  It handles UTF-8 encoding and file creation atomically in a single call. Python 3.11+ (project requirement)
  has mature, recommended pathlib support for cross-platform file operations.

  ### 2. Content Strategy: Hardcoded Prose

  **Decision:** Write hardcoded prose content (H1 heading + 2-3 sentences) about any unconstrained topic.

  **Alternatives Considered:**
  - Dynamic content generation — introduces unnecessary complexity and potential for incoherence
  - Template-based content — adds indirection and configuration overhead
  - Random sentence generation — risks fragmentation and unpredictability

  **Rationale:**
  Feature specification explicitly allows unconstrained topic selection ("about anything"). Hardcoded prose is proven
  across 178+ existing test files, each with coherent, grammatically correct 2-3 sentences on varied topics.
  This approach ensures quality, readability, and predictability without requiring external research or complexity.

  ### 3. Git Integration: subprocess with CLI Commands

  **Decision:** Use `subprocess.run()` with explicit git CLI commands (add, commit, push).

  **Alternatives Considered:**
  - GitPython library — available in project dependencies but introduces unnecessary abstraction for simple commands
  - Direct file system modification — bypasses git staging and workflow entirely
  - Shell script wrappers — reduces transparency and debugging capability

  **Rationale:**
  subprocess with CLI commands is the established pattern across features 001-178. It provides transparent,
  explicit control over git operations. GitPython (available in pyproject.toml) adds abstraction layer without
  benefit for straightforward `git add`, `git commit`, `git push` operations. Subprocess calls are lightweight,
  debuggable, and match existing practice.

  ### 4. Encoding and Line Endings: UTF-8 + LF

  **Decision:** UTF-8 encoding (no BOM), LF (Unix) line endings.

  **Alternatives Considered:**
  - Platform-default encoding — introduces variability and potential mismatches across developers/CI
  - CRLF line endings — increases file size, complicates diffs, inconsistent with existing test files
  - UTF-8 with BOM — violates CommonMark compliance and adds unnecessary 3 bytes

  **Rationale:**
  UTF-8 without BOM and LF line endings is the established standard across all 178+ test files in the repository.
  `pathlib.Path.write_text()` defaults to UTF-8 in Python 3.11+ when encoding parameter is not specified.
  LF is the Unix/Linux standard and matches repository git configuration. This approach ensures clean diffs,
  cross-platform compatibility, and CommonMark compliance.

  ### 5. Implementation Scope: Repository Root Only

  **Decision:** Feature modifies only repository root; no changes to `/src/sheep/`, tests, or configuration.

  **Alternatives Considered:**
  - Integration into /src/sheep/ application modules — violates separation of concerns
  - Dedicated module in src/sheep/tools/ — creates unnecessary coupling for isolated task
  - Bash script implementation — less portable and inconsistent with Python-based codebase

  **Rationale:**
  Test files are artifacts created by feature implementation, not part of application logic or infrastructure.
  Feature 179 follows the established pattern from 001-178, which isolates file creation to repository root
  with zero impact on application code. This maintains clear separation, auditability, and simplicity.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation & Validation)** must complete before Phase 2 (Git Integration) because:
  - File must exist and be valid before staging in git
  - Validation confirms all requirements are met before committing
  - TDD approach: assert file structure, implement creation, verify properties

  **Phase 2 (Git Integration)** follows naturally:
  - File is already created and validated
  - Standard git workflow (add → commit → push) is straightforward
  - Changes are pushed to feature branch which already exists

  ### Execution Flow

  1. **File Creation (Phase 1, Task 1):** Use pathlib to write markdown file with H1 heading and prose content
  2. **File Validation (Phase 1, Tasks 2-4):** Verify encoding, line endings, and file size meet requirements
  3. **Git Staging (Phase 2, Task 5):** Stage file with `git add`
  4. **Git Commit (Phase 2, Task 5):** Create commit with conventional message format
  5. **Git Push (Phase 2, Task 6):** Push to feature branch

  No additional steps required; feature is self-contained.

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File encoding mismatch (CRLF or wrong encoding) | Medium | Explicitly verify line endings and encoding in validation task; pathlib.write_text() handles encoding correctly by default |
  | Git push failure (network, credentials) | Medium | Feature branch and git user config are pre-configured; standard git workflow is proven across 178+ features |
  | File size out of range | Low | Validation task verifies 300-800 byte range; prose guidelines (2-3 sentences) naturally fit this range |
  | Markdown syntax errors | Low | Simple H1 + prose structure is validated; no complex markdown features used |
  | Prose quality issues | Low | Content is reviewed by human implementer; unconstrained topic allows flexibility in choosing coherent prose |
  | File already exists | Low | Feature creates new unique file (test-brrq8h.md); no collision with existing files |

  ## Technology Stack

  - **Python 3.11+:** Project requirement; pathlib and subprocess are standard library modules with no external dependencies
  - **pathlib (stdlib):** Cross-platform file I/O with atomic UTF-8 handling
  - **subprocess (stdlib):** Transparent git command execution
  - **Git CLI:** Standard version control interface; no special configuration required
  - **Markdown syntax:** Simple, standard format (H1 heading + prose); CommonMark compliant

