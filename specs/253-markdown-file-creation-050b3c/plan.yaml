content: |
  ## Architecture Overview

  This feature follows the established pattern from 205+ similar test files in the Sheep project.
  The implementation is straightforward:

  1. Create a markdown file with pathlib.Path using hardcoded content (heading + prose)
  2. Integrate with git using subprocess to stage, commit, and push

  The architecture is minimal—no abstractions, no complexity, just direct file I/O and subprocess
  calls. This matches the established pattern from features 069-252 and requires no special
  architecture or design.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path

  **Chosen:** Python pathlib.Path for file creation and management

  **Why:** Feature requirement FR-6 explicitly specifies pathlib. It's the modern Python standard
  library approach, provides safe, object-oriented API, and handles encoding/line endings
  correctly. Research confirms this is the established pattern from features 069-252.

  ### 2. Markdown Content: Hardcoded

  **Chosen:** Hardcoded markdown content (title and 2-3 sentences)

  **Why:** Content is written once and committed. Hardcoding is simpler than templating,
  requires zero external dependencies (matches NFR-8), and follows the established pattern.
  Topic selection (free choice per product decision) provides flexibility without requiring
  dynamic generation.

  ### 3. Git Integration: subprocess

  **Chosen:** Python subprocess module for git commands

  **Why:** Standard Python approach for external command execution. No external dependencies
  required (Python stdlib), provides error handling via check=True, and matches the established
  pattern from features 069-252. Alternative approaches (GitPython, Dulwich) add unnecessary
  complexity.

  ### 4. Encoding & Line Endings

  **Chosen:** UTF-8 without BOM, LF line endings via explicit newline='' parameter

  **Why:** Feature requirements FR-7 and FR-8 specify these explicitly. UTF-8 is the CommonMark
  standard. LF is required for cross-platform consistency. On Windows, Python text mode defaults
  to CRLF, so explicit newline='' is necessary to write literal LF characters.

  ### 5. Error Handling

  **Chosen:** Minimal error handling with subprocess.run(check=True) for git operations

  **Why:** check=True raises CalledProcessError if git commands fail, making failures visible.
  Catches OSError from file operations. No retries or fallbacks needed—feature is simple enough
  that failures should stop execution. Matches NFR-4 (simple imperative style).

  ## Implementation Strategy

  ### Phase 1: File Creation
  - Use pathlib.Path('test-iztdfx.md') to create the file
  - Write hardcoded markdown content: heading (#) + blank line + 2-3 sentences
  - Use write_text(content, encoding='utf-8', newline='') for proper encoding and line endings
  - Content topic: free choice (any subject, following established pattern from 205+ test files)

  ### Phase 2: Git Integration
  - Stage file: subprocess.run(['git', 'add', 'test-iztdfx.md'], check=True, cwd=repo_root)
  - Commit: subprocess.run(['git', 'commit', '-m', 'feat(253): ...'], check=True, cwd=repo_root)
  - Push: subprocess.run(['git', 'push'], check=True, cwd=repo_root)
  - All git commands run with explicit cwd=repo_root for correct context

  ### Why This Order

  Phase 1 must come before Phase 2 because the file must exist before it can be staged in git.
  Git integration is kept separate because it's logically distinct from file creation, though
  both are required for successful feature completion.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File written with CRLF instead of LF on Windows | Use explicit newline='' parameter in write_text() to disable newline translation |
  | File written with UTF-8 BOM | Use pathlib.Path.write_text() without explicit encoding parameter—Python defaults to UTF-8 without BOM |
  | Git commands fail (missing config, wrong context) | Use subprocess.run(check=True) to raise CalledProcessError on non-zero exit codes; explicit cwd=repo_root ensures correct directory context |
  | File not actually committed or pushed | Verify git status after staging; verify commit in log after commit operation; verify branch state after push |
  | Content quality issues (grammar, coherence) | Hand-write and review prose carefully; follow established pattern from 205+ examples; ensure 2-3 complete sentences |
  | File path conflicts or overwrites | Filename test-iztdfx.md is unique and pre-specified; no existing file should conflict; verify no unintended modifications |
