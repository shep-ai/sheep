decisions:
  - title: "File I/O Library: pathlib vs open() vs other approaches"
    chosen: "Python pathlib.Path (Path class)"
    rejected:
      - "Built-in open() function — less object-oriented, requires explicit file handle management, violates FR-6 requirement"
      - "os.path module — deprecated in favor of pathlib, less modern and less readable than Path object"
      - "Third-party libraries (e.g., upath, pathspec) — unnecessary overhead for simple file creation, violates NFR-8 (no external dependencies)"
    rationale: >
      Feature requirement FR-6 explicitly specifies pathlib. pathlib.Path provides a modern,
      object-oriented API with automatic resource management through context managers. Pattern
      from features 069-252 confirms pathlib as the established standard. pathlib.Path.write_text()
      handles encoding automatically (UTF-8 by default per FR-7) and is more readable than
      open(). No external dependencies required — pathlib is in Python 3.11+ standard library.

  - title: "Markdown Content Generation: Hardcoded vs Dynamic vs Template"
    chosen: "Hardcoded markdown content (title and 2-3 sentences)"
    rejected:
      - "Dynamic content generation (e.g., using faker library or template engine) — unnecessary complexity, violates NFR-8 (no external dependencies), contradicts simple imperative pattern observed in features 069-252"
      - "Template-based approach (e.g., Jinja2) — overkill for single file with minimal content, violates NFR-8 (no external dependencies), doesn't match established pattern"
      - "Prose generation from external sources — adds complexity and external dependencies, violates simple single-file pattern"
    rationale: >
      FR-5 permits free choice of any topic, and the established pattern from 205+ existing
      test files shows hardcoded diverse content (nature, technology, science, history, culture,
      philosophy). Hardcoded content is simpler, requires zero external dependencies (NFR-8),
      and matches the straightforward imperative style documented in NFR-4. Content can be
      written directly in code or generated once and committed. Topic choice flexibility is
      best exercised at implementation time, not through templating.

  - title: "Git Integration: subprocess vs GitPython vs other git libraries"
    chosen: "Python subprocess module for git CLI commands"
    rejected:
      - "GitPython library (GitPython package) — external dependency violates NFR-8, adds unnecessary abstraction layer over git commands, matches established pattern less directly than subprocess"
      - "Dulwich (pure Python git implementation) — external dependency violates NFR-8, overkill for simple git add/commit/push sequence, introduces unnecessary git protocol complexity"
      - "Direct git command invocation via os.system() — works but lacks error handling and cross-platform compatibility; subprocess.run() is the modern Python standard"
    rationale: >
      subprocess.run() is the Python standard for executing external commands with error
      handling and cross-platform support. Features 069-252 confirm subprocess as the established
      pattern. subprocess requires no external dependencies (standard library in Python 3.11+),
      provides clear error reporting via return codes and stdout/stderr capture, and maps directly
      to the git commands in the success criteria (git add, git commit, git push). Direct subprocess
      calls match the simple, imperative style documented in NFR-4.

  - title: "Text Encoding: UTF-8 vs other encodings and BOM handling"
    chosen: "UTF-8 without BOM (Python default for pathlib.write_text())"
    rejected:
      - "UTF-8 with BOM — adds unnecessary bytes, violates FR-7 (UTF-8 without BOM), causes parsing issues with CommonMark readers"
      - "ASCII encoding — insufficient for modern content diversity, pathlib defaults to UTF-8 anyway"
      - "Latin-1 or other legacy encodings — outdated, no benefit, violates modern markdown best practices"
    rationale: >
      FR-7 explicitly requires UTF-8 without BOM. pathlib.Path.write_text() uses UTF-8 by
      default without BOM when called without explicit encoding parameter. This is Python's
      modern standard. UTF-8 is the encoding specified in CommonMark 0.30+, ensuring markdown
      syntax compatibility. No explicit encoding parameter needed — Python's default is correct.

  - title: "Line Endings: LF vs CRLF vs CR and cross-platform handling"
    chosen: "Unix-style LF line endings (\\n) via Python universal newline mode"
    rejected:
      - "Windows CRLF (\\r\\n) — violates FR-8 (Unix-style LF), problematic across teams with mixed platforms"
      - "Platform-native line endings — creates inconsistency across Windows/Unix/Mac, violates success criteria and NFR-2 (CommonMark conformance)"
      - "Explicit binary mode with manual line ending control — unnecessary complexity, Python's text mode handles this automatically"
    rationale: >
      FR-8 explicitly requires Unix-style LF. pathlib.Path.write_text() opens files in text mode
      with Python's universal newline handling by default. When writing '\\n' (Python's internal
      representation) with pathlib.write_text(), Python automatically converts to the platform's
      native line ending. To ensure LF on Windows, use explicit newline='' parameter:
      Path.write_text(content, newline='', encoding='utf-8'). This disables newline translation
      and writes literal \\n characters. CommonMark specification requires LF for conformance
      (NFR-2). All 205+ existing test files use LF. Features 069-252 confirm this pattern.

  - title: "Error Handling Strategy: Comprehensive vs Minimal vs Silent"
    chosen: "Minimal error handling with explicit failures for file I/O and git operations"
    rejected:
      - "Comprehensive error handling with retries and fallbacks — violates NFR-4 (simple imperative style), adds unnecessary complexity, contradicts single-file creation simplicity"
      - "Silent error swallowing with defaults — violates correctness, makes debugging impossible, creates hidden failures"
      - "No error handling — appropriate for scripts but lacks robustness; minimal explicit error handling is preferred"
    rationale: >
      Implementation should catch exceptions from pathlib.Path operations (e.g., file write
      failures, permission issues) and subprocess.run() calls (e.g., git command failures, missing
      git configuration). Errors should fail loudly with clear messages so failures are visible.
      However, no retries or complex fallbacks needed — feature is simple enough that retries add
      no value. Use subprocess.check_returncode() or check=True to fail on git command errors.
      Catch and report OSError/IOError from file operations. Pattern from features 069-252
      demonstrates this minimal-but-explicit approach.

  - title: "Markdown Syntax Validation: Validate via library vs Validate manually vs Trust"
    chosen: "Trust CommonMark specification and established pattern — no runtime validation"
    rejected:
      - "Runtime markdown validation library (e.g., markdown-it-py, commonmark) — external dependencies violate NFR-8, unnecessary overhead for hardcoded content, contradicts simple pattern"
      - "Manual validation of structure (regex checks for heading, sentence count, etc.) — adds complexity, brittle, contradicts imperative style (NFR-4)"
      - "External markdown linting (e.g., markdownlint) — requires separate tool invocation, violates single-script simplicity, not in established pattern"
    rationale: >
      Content is hardcoded and follows the established pattern from 205+ files, which have
      proven CommonMark conformance. Manual syntax validation of content you write yourself
      contradicts the principle of trusting the code pattern. Markdown validation libraries
      are unnecessary overhead for content that is hand-written to follow a known, validated
      pattern. Success criteria require CommonMark conformance (NFR-2) — this is validated
      through code review and testing of the output file, not runtime validation. Features
      069-252 do not include validation — they follow the pattern directly.

decisions:
  - title: "Platform Compatibility: Windows universal newline translation"
    chosen: "Use explicit newline='' parameter in write_text() to prevent automatic line ending conversion"
    rejected:
      - "Default text mode with no newline parameter — on Windows, Python converts \\n to \\r\\n, violating FR-8"
      - "Binary mode with manual byte writing — verbose, error-prone, loses text encoding safety"
      - "Always use subprocess to write file via git (git hash-object, etc.) — unnecessary indirection, violates simple file creation pattern"
    rationale: >
      On Windows, Python's text mode converts \\n to \\r\\n by default (platform-native behavior).
      To ensure LF output on all platforms, must use newline='' parameter. This disables newline
      translation and writes literal characters. Code: Path('test-iztdfx.md').write_text(content,
      newline='', encoding='utf-8'). This is documented in Python pathlib documentation as the
      standard way to control line endings. Critical for FR-8 compliance.

