content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-iztdfx.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 205+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-252, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-iztdfx.md` exists in the repository root directory
  - [ ] File contains a markdown level-1 heading (# Title) as the first line
  - [ ] File contains exactly 2-3 sentences of prose content after a blank line following the heading
  - [ ] Markdown heading is followed by a blank line before prose content
  - [ ] File is encoded in UTF-8 without BOM (byte order mark)
  - [ ] File uses Unix-style LF line endings (not CRLF or CR)
  - [ ] Prose content is grammatically correct and forms coherent sentences
  - [ ] Markdown syntax is valid per CommonMark specification
  - [ ] File size is approximately 400-600 bytes (natural result of proper structure)
  - [ ] File is staged in git using `git add test-iztdfx.md`
  - [ ] File is committed with conventional commit message: `feat(253): create markdown file test-iztdfx.md with prose content`
  - [ ] Commit is pushed to feature branch `feat/253-markdown-file-creation-050b3c`
  - [ ] No other files in the repository are modified
  - [ ] No source code, test files, or configuration files are changed

  ## Functional Requirements

  - **FR-1**: Create a file named exactly `test-iztdfx.md` in the repository root directory (same level as existing test files)
  - **FR-2**: File must contain a markdown level-1 heading (# Title) as the first line; heading text can be any descriptive phrase
  - **FR-3**: File must contain exactly 2-3 sentences of prose content after a blank line following the heading
  - **FR-4**: Prose content must be coherent, grammatically correct, and form complete sentences
  - **FR-5**: Content topic can be any subject matter (nature, technology, science, history, culture, philosophy, etc.), with no topic constraints
  - **FR-6**: Implement using Python pathlib (Path class) for file I/O operations
  - **FR-7**: Write file contents using UTF-8 encoding without byte order mark (BOM)
  - **FR-8**: Ensure file uses Unix-style LF line endings (not Windows CRLF)
  - **FR-9**: Stage the file in git using `git add test-iztdfx.md` command
  - **FR-10**: Create a git commit with conventional commit message format: `feat(253): create markdown file test-iztdfx.md with prose content`
  - **FR-11**: Push the commit to the feature branch `feat/253-markdown-file-creation-050b3c` using `git push` or equivalent
  - **FR-12**: Do not create, modify, or delete any files other than `test-iztdfx.md`
  - **FR-13**: Do not modify any source code in `/src/sheep/` or any other application code
  - **FR-14**: Do not modify any test files, configuration files, or documentation files

  ## Non-Functional Requirements

  - **NFR-1**: File size should be approximately 400-600 bytes, as a natural outcome of the proper file structure (one heading + blank line + 2-3 sentences)
  - **NFR-2**: Markdown syntax must conform to CommonMark specification (https://spec.commonmark.org/)
  - **NFR-3**: File format must match the established pattern observed in 205+ existing test files in the repository
  - **NFR-4**: Implementation must follow the straightforward, imperative coding style observed in features 069-252 (simple file creation, no abstractions or utilities)
  - **NFR-5**: Feature must be implementable within the estimated time of 10-15 minutes
  - **NFR-6**: Git workflow must follow conventional commits specification (https://www.conventionalcommits.org/)
  - **NFR-7**: Implementation should require no research, configuration changes, or architectural decisions
  - **NFR-8**: No external dependencies or package installations are required (only Python standard library: pathlib)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | --- | -------- | ----------------- | --------- |
  | 1 | Should content topic be constrained or free choice? | Free choice of any topic | 205+ precedent files use diverse topics; user query says "about anything"; reduces decision overhead |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-iztdfx.md) to existing collection of 205+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-252; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/253-markdown-file-creation-050b3c` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 205+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits and push operations
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies to install)
  - **File naming**: Filename `test-iztdfx.md` is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness against success criteria)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 205+ identical test files providing clear precedent and de facto specification
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + blank line + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-252) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (`test-iztdfx.md`) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 205+ prior implementations

  ---

  _Requirements phase complete — functional and non-functional requirements defined, success criteria specified, product decisions documented, ready for implementation planning_
