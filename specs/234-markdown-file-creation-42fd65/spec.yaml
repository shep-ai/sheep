content: |
  ## Problem Statement

  Create a single markdown file named `test-y7gbjb.md` with a title (H1 heading) and 2-3 sentences
  about any topic. The file should follow the well-established pattern from 230+ existing markdown
  files in this repository, with proper encoding and line endings.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. This particular
  repository serves as a test/demonstration environment where each feature creates a markdown file
  following a consistent, repeatable pattern.

  Key directories:
  - **Root directory**: Contains 200+ markdown test files (test-*.md) and implementation scripts
  - **src/sheep/**: Main source code (agents, config, flows, tools)
  - **specs/**: Feature specifications in YAML format
  - **tests/**: Test files
  - **src/sheep/features/**: Feature-specific implementations

  ### Architecture Patterns

  The repository follows a **feature-per-file** pattern where:
  1. Each feature gets a specification in `specs/NNN-description/spec.yaml`
  2. An implementation script creates the artifact (markdown file in this case)
  3. Git operations (add, commit, push) are part of the implementation
  4. Each implementation follows the same structure and naming convention

  Established markdown file pattern:
  ```markdown
  # Title Here

  Prose content with 2-3 sentences about the topic.
  ```

  File requirements (from 230+ examples):
  - UTF-8 encoding without BOM
  - Unix LF line endings (not CRLF)
  - File size typically 300-600 bytes
  - Structure: heading, blank line, prose
  - Standard naming: `test-[random-id].md` or `test-y7gbjb.md` for this feature

  ### Relevant Technologies

  - **Python 3.11+**: Primary implementation language (from pyproject.toml)
  - **Pathlib**: File system operations (standard library)
  - **Subprocess**: Git command execution
  - **Git**: Version control integration (add, commit, push)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory (file system) | Low | Single markdown file creation at repository root; no code changes, no architectural impact |
  | Git repository | Low | File will be staged, committed, and pushed following established workflow patterns |
  | Specification system | None | Spec file itself is not affected; implementation only creates markdown artifact |

  ## Dependencies

  **External dependencies**: None. This feature requires only:
  - Python standard library (pathlib, subprocess, sys)
  - Git (for version control, not a code dependency)

  **Internal dependencies**: None. This is a standalone file creation task with no code imports
  or architectural dependencies. The implementation can execute independently.

  **Reference implementations**: 230+ existing features (commits 93098ffa through 97477cd2 in git history)
  provide templates. Feature 233 (create_markdown_file_233.py) is the most recent example showing
  the full pattern: file creation → validation → git add → git commit → git push.

  ## Size Estimate

  **S** (hours) — This is a trivial implementation task. Effort breakdown:
  - File creation: 5 minutes (copy existing pattern, change filename/content)
  - Validation: negligible (3-5 lines of code matching established checks)
  - Git operations: negligible (subprocess calls following existing pattern)
  - Total: ~15-30 minutes, well under the 1-hour threshold for S-sized tasks

  The task has zero complexity because:
  - The pattern is already established in 230+ implementations
  - No design decisions required (structure is fixed)
  - No architectural considerations
  - No interdependencies
  - No edge cases (simple file creation with known inputs)
