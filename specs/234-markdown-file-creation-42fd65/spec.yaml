content: |
  ## Problem Statement

  Create a single markdown file named `test-y7gbjb.md` at the repository root with a professional structure:
  an H1 heading followed by at least 2 sentences of prose content. The file should follow the
  well-established pattern from 230+ existing markdown files in this repository, with proper
  encoding (UTF-8 without BOM), Unix LF line endings, and be integrated into the git repository
  via add, commit, and push operations.

  ## Success Criteria

  - [ ] File `test-y7gbjb.md` exists in the repository root directory
  - [ ] File contains exactly one H1 heading (line beginning with `# `)
  - [ ] File contains at least 2 sentences of prose content following the heading
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix LF line endings (not Windows CRLF)
  - [ ] File size is between 200 and 1000 bytes (typical range for markdown files in this repository)
  - [ ] File is staged with `git add test-y7gbjb.md`
  - [ ] File is committed with a conventional commit message (e.g., `feat(234): Create markdown file test-y7gbjb.md with prose content`)
  - [ ] Commit is pushed to the remote repository
  - [ ] Implementation script executes without errors or exceptions
  - [ ] Git operations complete successfully (no authentication, merge conflicts, or network errors)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-y7gbjb.md` in the repository root directory
  - **FR-2**: The file must contain one H1 heading (markdown format: `# Heading Text`)
  - **FR-3**: The file must contain at least 2 sentences of prose content after the heading
  - **FR-4**: The file must be preceded by the heading with a blank line separator (standard markdown structure)
  - **FR-5**: Stage the created file using `git add test-y7gbjb.md`
  - **FR-6**: Commit the file with a conventional commit message following the pattern: `feat(234): Create markdown file test-y7gbjb.md with prose content`
  - **FR-7**: Push the commit to the remote repository using `git push`
  - **FR-8**: Validate file creation and encoding before committing (verify UTF-8, no BOM, LF line endings)
  - **FR-9**: Report success/failure status including file path, file size, and git operation results

  ## Non-Functional Requirements

  - **NFR-1 (Encoding)**: File must be UTF-8 encoded without BOM. No encoding detection or conversion tools should modify the file after creation.
  - **NFR-2 (Line Endings)**: File must use Unix LF line endings exclusively. No CRLF conversion should occur (even on Windows).
  - **NFR-3 (Consistency)**: Implementation must follow the established pattern from features 230+ (especially feature 233). No deviations in file structure, naming, or git workflow.
  - **NFR-4 (Idempotency)**: Implementation should handle cases where the file already exists. Either skip creation with a warning or overwrite with user confirmation.
  - **NFR-5 (Error Handling)**: Errors in file I/O, encoding validation, or git operations must be caught and reported with clear messages. Implementation must not silently fail.
  - **NFR-6 (Logging)**: Implementation should log key steps (file creation, validation, git staging, commit, push) for debugging and audit purposes.
  - **NFR-7 (Performance)**: File creation and git operations must complete within 30 seconds (network I/O included).
  - **NFR-8 (Maintainability)**: Code should be self-documenting with clear variable names and minimal complexity (matching the pattern from feature 233).

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Git workflow scope | Full workflow (add, commit, push) | 230+ existing features all push to remote, establishing consistency and enabling CI/CD integration |
  | 2 | Prose validation | Flexible (minimum 2 sentences) | Avoids brittle sentence-counting logic; validates substance without over-constraining punctuation styles |
  | 3 | File naming | Fixed (test-y7gbjb.md) | Creates a concrete, verifiable deliverable specified in requirements; easier to test than dynamic IDs |
  | 4 | Content topic | Predetermined by implementation | Ensures professional, consistent output aligned with 230+ existing files; reduces validation complexity |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory (file system) | Low | Single markdown file creation at repository root; no code changes, no architectural impact |
  | Git repository | Low | File will be staged, committed, and pushed following established workflow patterns |
  | Specification system | None | Spec file itself is not affected; implementation only creates markdown artifact |

  ## Dependencies

  **External dependencies**: None. This feature requires only:
  - Python standard library (pathlib, subprocess, sys, utf-8 codec)
  - Git (for version control, not a code dependency)

  **Internal dependencies**: None. This is a standalone file creation task with no code imports
  or architectural dependencies. The implementation can execute independently.

  **Reference implementations**: 230+ existing features (commits 93098ffa through 97477cd2 in git history)
  provide templates. Feature 233 (create_markdown_file_233.py) is the most recent example showing
  the full pattern: file creation → validation → git add → git commit → git push.

  ## Size Estimate

  **S** (hours) — This is a trivial implementation task. Effort breakdown:
  - File creation with validated encoding/line endings: 10 minutes (pathlib + encoding validation)
  - Git operations (add, commit, push): 5 minutes (subprocess calls following feature 233 pattern)
  - Error handling and logging: 5 minutes (following established patterns)
  - Testing and validation: 10 minutes (manual verification of file properties and git state)
  - Total: ~30 minutes, well under the 1-hour threshold for S-sized tasks

  The task has low complexity because:
  - The pattern is already established in 230+ implementations
  - Product questions are resolved with clear defaults
  - No design decisions required (structure and workflow are fixed)
  - No architectural considerations or interdependencies
  - Minimal edge cases (file already exists is the only one, handled via overwrite/skip logic)
