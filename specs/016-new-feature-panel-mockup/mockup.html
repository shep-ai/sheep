<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Feature Panel Mockup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
  }

  /* ── LEFT SIDEBAR ─────────────────────────────────── */
  .sidebar {
    width: 44px;
    background: #fff;
    border-right: 1px solid #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 4px;
    z-index: 10;
    flex-shrink: 0;
  }

  .sidebar-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: #888;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-icon:hover { background: #f0f0f0; color: #333; }
  .sidebar-icon svg { width: 16px; height: 16px; }

  /* ── CANVAS AREA ──────────────────────────────────── */
  .canvas {
    flex: 1;
    position: relative;
    background-color: #fafafa;
    background-image: radial-gradient(circle, #ccc 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
  }

  /* Repo card */
  .repo-card {
    position: absolute;
    top: 200px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 20px;
    padding: 8px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    white-space: nowrap;
  }

  .repo-card-name {
    font-size: 13px;
    font-weight: 500;
    color: #222;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .repo-card-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #888;
  }

  .repo-card-actions svg { width: 15px; height: 15px; cursor: pointer; }
  .repo-card-actions svg:hover { color: #333; }

  .repo-card-divider {
    width: 1px;
    height: 16px;
    background: #e0e0e0;
  }

  /* Dashed connector line */
  .connector {
    position: absolute;
    top: 218px;
    left: 390px;
    width: 185px;
    height: 1px;
    border-top: 2px dashed #ccc;
  }

  /* Review card */
  .review-card {
    position: absolute;
    top: 170px;
    left: 578px;
    width: 268px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .review-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
  }

  .review-card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #888;
    text-transform: uppercase;
  }

  .review-card-badges {
    display: flex;
    gap: 4px;
  }

  .badge-lightning {
    width: 20px;
    height: 20px;
    background: #fef3c7;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f59e0b;
  }

  .badge-x {
    width: 20px;
    height: 20px;
    background: #fee2e2;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ef4444;
    cursor: pointer;
  }

  .badge-lightning svg, .badge-x svg { width: 11px; height: 11px; }

  .review-card-body {
    padding: 0 12px 10px;
  }

  .review-card-title {
    font-size: 13px;
    font-weight: 600;
    color: #111;
    margin-bottom: 4px;
  }

  .review-card-subtitle {
    font-size: 11.5px;
    color: #888;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .review-card-hash {
    font-size: 10.5px;
    color: #aaa;
    font-family: 'SF Mono', 'Fira Code', monospace;
    margin-bottom: 10px;
  }

  .review-card-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #d1fae5;
    color: #059669;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .review-card-action:hover { background: #a7f3d0; }
  .review-card-action svg { width: 13px; height: 13px; }

  /* Bottom controls */
  .canvas-controls {
    position: absolute;
    bottom: 24px;
    left: 52px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ctrl-btn {
    width: 28px;
    height: 28px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #555;
  }
  .ctrl-btn:hover { background: #f5f5f5; }
  .ctrl-btn svg { width: 13px; height: 13px; }

  /* Avatar */
  .avatar {
    position: absolute;
    bottom: 16px;
    left: 8px;
    width: 30px;
    height: 30px;
    background: #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }

  /* ── RIGHT PANEL ──────────────────────────────────── */
  .panel {
    width: 440px;
    background: #fff;
    border-left: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
  }

  .panel-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-dot {
    width: 10px;
    height: 10px;
    background: #3b82f6;
    border-radius: 50%;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.07em;
    color: #111;
    text-transform: uppercase;
  }

  .panel-close {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    cursor: pointer;
    border-radius: 4px;
  }
  .panel-close:hover { background: #f5f5f5; color: #555; }
  .panel-close svg { width: 14px; height: 14px; }

  .panel-divider {
    height: 1px;
    background: #e8e8e8;
    margin: 0;
  }

  .panel-body {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Describe section */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #aaa;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .feature-textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #e8e8e8;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    resize: none;
    outline: none;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .feature-textarea:focus { border-color: #3b82f6; }

  /* Attachment row */
  .attachment-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .attachment-thumb {
    width: 46px;
    height: 46px;
    border-radius: 6px;
    background: #1a1a2e;
    border: 1px solid #333;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb-inner {
    width: 38px;
    height: 30px;
    background: #0f0f23;
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    padding: 4px 5px;
    gap: 2px;
    overflow: hidden;
  }

  .thumb-line {
    height: 2px;
    border-radius: 1px;
    background: #4ade80;
  }
  .thumb-line:nth-child(1) { width: 70%; }
  .thumb-line:nth-child(2) { width: 90%; background: #60a5fa; }
  .thumb-line:nth-child(3) { width: 55%; }
  .thumb-line:nth-child(4) { width: 80%; background: #f87171; }

  /* Claude model row */
  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #f9f9f9;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .model-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .claude-icon {
    width: 20px;
    height: 20px;
    background: #e74c3c;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .model-name {
    font-size: 12.5px;
    font-weight: 600;
    color: #222;
  }

  .model-version {
    font-size: 12px;
    color: #888;
  }

  .model-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Toggle switch */
  .toggle-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .toggle-label-small {
    font-size: 11.5px;
    color: #555;
    font-weight: 500;
  }

  .toggle {
    position: relative;
    display: inline-block;
    width: 30px;
    height: 17px;
    flex-shrink: 0;
  }

  .toggle input { display: none; }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #d1d5db;
    border-radius: 17px;
    transition: 0.2s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 13px;
    width: 13px;
    left: 2px;
    bottom: 2px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  .toggle input:checked + .toggle-slider { background: #3b82f6; }
  .toggle input:checked + .toggle-slider::before { transform: translateX(13px); }

  .attach-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    cursor: pointer;
  }
  .attach-icon svg { width: 14px; height: 14px; }

  /* Approve / Git sections */
  .approval-section {
    padding: 14px 0;
    border-top: 1px solid #e8e8e8;
  }

  .approval-row {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .approval-section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    color: #bbb;
    text-transform: uppercase;
    width: 70px;
    flex-shrink: 0;
  }

  .approval-toggles {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
  }

  .toggle-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .toggle-item-label {
    font-size: 12px;
    font-weight: 500;
    color: #444;
  }

  .all-btn {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .all-btn:hover { background: #f0f0f0; color: #444; }

  /* Panel footer */
  .panel-footer {
    border-top: 1px solid #e8e8e8;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .btn-cancel {
    padding: 8px 18px;
    border: 1px solid #e0e0e0;
    background: #fff;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-cancel:hover { background: #f5f5f5; }

  .btn-create {
    padding: 8px 18px;
    background: #2563eb;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-create:hover { background: #1d4ed8; }
</style>
</head>
<body>

<!-- ── LEFT SIDEBAR ── -->
<div class="sidebar">
  <!-- Grid icon -->
  <div class="sidebar-icon">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1" y="1" width="5.5" height="5.5" rx="1"/>
      <rect x="9.5" y="1" width="5.5" height="5.5" rx="1"/>
      <rect x="1" y="9.5" width="5.5" height="5.5" rx="1"/>
      <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1"/>
    </svg>
  </div>
  <!-- Home icon -->
  <div class="sidebar-icon">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 7l6-5 6 5v7a1 1 0 01-1 1H3a1 1 0 01-1-1z"/>
      <path d="M6 14V9h4v5"/>
    </svg>
  </div>
  <!-- Wrench/tool icon -->
  <div class="sidebar-icon">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12.5 2a3.5 3.5 0 00-3.46 4.06L2.5 12.5a1 1 0 001.41 1.41l6.45-6.54A3.5 3.5 0 1012.5 2z"/>
    </svg>
  </div>
  <!-- Settings icon -->
  <div class="sidebar-icon">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="2.5"/>
      <path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.4 3.4l.7.7M11.9 11.9l.7.7M3.4 12.6l.7-.7M11.9 4.1l.7-.7"/>
    </svg>
  </div>
</div>

<!-- ── CANVAS ── -->
<div class="canvas">
  <!-- Repo card -->
  <div class="repo-card">
    <div class="repo-card-name">
      <!-- GitHub mark -->
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#333">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      sheep
    </div>
    <div class="repo-card-divider"></div>
    <div class="repo-card-actions">
      <!-- Code icon -->
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 3 1 8 5 13"/><polyline points="11 3 15 8 11 13"/>
      </svg>
      <!-- Terminal icon -->
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2 5 6 8 2 11"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <!-- Folder icon -->
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4a1 1 0 011-1h3.5l1.5 1.5H14a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1z"/>
      </svg>
      <!-- Plus icon -->
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
      </svg>
    </div>
  </div>

  <!-- Dashed connector -->
  <div class="connector"></div>

  <!-- Review card -->
  <div class="review-card">
    <div class="review-card-header">
      <span class="review-card-label">Review</span>
      <div class="review-card-badges">
        <div class="badge-lightning">
          <svg viewBox="0 0 12 12" fill="currentColor">
            <path d="M7 1L2 7h4v4l5-6H7V1z"/>
          </svg>
        </div>
        <div class="badge-x">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="review-card-body">
      <div class="review-card-title">Shep Feature Action Toolbar</div>
      <div class="review-card-subtitle">A compact pill-shaped toolbar component for ...</div>
      <div class="review-card-hash">43d25c7f-7203-4d4a-a03a-9d6dc9434f6a</div>
      <div class="review-card-action">
        <!-- git merge icon -->
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="4" cy="3" r="1.5"/><circle cx="4" cy="13" r="1.5"/><circle cx="12" cy="6" r="1.5"/>
          <path d="M4 4.5v7M4 4.5C4 7 12 7 12 7.5"/>
        </svg>
        Review Merge Request
      </div>
    </div>
  </div>

  <!-- Canvas controls -->
  <div class="canvas-controls">
    <div class="ctrl-btn" title="Zoom in">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/>
      </svg>
    </div>
    <div class="ctrl-btn" title="Zoom out">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="2" y1="7" x2="12" y2="7"/>
      </svg>
    </div>
    <div class="ctrl-btn" title="Fit view">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 5 1 1 5 1"/><polyline points="9 1 13 1 13 5"/>
        <polyline points="13 9 13 13 9 13"/><polyline points="5 13 1 13 1 9"/>
      </svg>
    </div>
    <div class="ctrl-btn" title="Reset">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7a5 5 0 11-1.5-3.5"/><polyline points="12 2 12 5.5 8.5 5.5"/>
      </svg>
    </div>
  </div>

  <!-- Avatar -->
  <div class="avatar">N</div>
</div>

<!-- ── RIGHT PANEL ── -->
<div class="panel">
  <div class="panel-header">
    <div class="panel-header-left">
      <div class="panel-dot"></div>
      <span class="panel-title">New Feature</span>
    </div>
    <div class="panel-close">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </div>
  </div>

  <div class="panel-divider"></div>

  <div class="panel-body">
    <!-- Describe section -->
    <div class="section-label">Describe your feature</div>
    <textarea class="feature-textarea">add html file</textarea>

    <!-- Attachment thumbnail -->
    <div class="attachment-row">
      <div class="attachment-thumb">
        <div class="thumb-inner">
          <div class="thumb-line"></div>
          <div class="thumb-line"></div>
          <div class="thumb-line"></div>
          <div class="thumb-line"></div>
        </div>
      </div>
    </div>

    <!-- Claude model row -->
    <div class="model-row">
      <div class="model-left">
        <div class="claude-icon">C</div>
        <span class="model-name">Claude Code</span>
        <span class="model-version">Haiku 4.5</span>
      </div>
      <div class="model-right">
        <div class="toggle-group">
          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label-small">
            <!-- Lightning bolt -->
            <svg width="11" height="11" viewBox="0 0 12 12" fill="#f59e0b" style="vertical-align:middle">
              <path d="M7 1L2 7h4v4l5-6H7V1z"/>
            </svg>
            Fast Mode
          </span>
        </div>
        <div class="attach-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9.5a5.5 5.5 0 01-11 0V4a4 4 0 018 0v5.5a2.5 2.5 0 01-5 0V5"/>

    <div class="approval-section">
      <div class="approval-row">

          <div class="toggle-item">
            <label class="toggle">

              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-item-label">PRD</span>
          </div>
          <div class="toggle-item">
            <label class="toggle">
              <input type="checkbox" checked>

            </label>
            <span class="toggle-item-label">Plan</span>
          </div>
          <div class="toggle-item">
            <label class="toggle">
              <input type="checkbox">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-item-label">Merge</span>

        </div>
        <span class="all-btn">ALL</span>

    <!-- Git section -->
    <div class="approval-section">
      <div class="approval-row">
        <span class="approval-section-label">Git</span>

          <div class="toggle-item">

      </div>

  </div>

  <!-- Footer -->
