content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established, well-proven pattern. This feature creates a single test markdown file (test-omg7kb.md) at the repository root with a title and prose content, demonstrating automated file creation and git integration capabilities.

  This is the 194th iteration in a well-established markdown-file-creation pattern with 193 identical prior implementations providing clear, proven precedent. The feature serves as a minimal, testable unit of work for the automated implementation system.

  ## Success Criteria

  - [ ] File test-omg7kb.md exists in repository root directory
  - [ ] File contains exactly one H1 markdown heading on line 1
  - [ ] File contains blank line on line 2
  - [ ] File contains 2-3 sentences of prose on lines 3 and beyond
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses LF (Unix-style) line endings exclusively
  - [ ] File size is between 300-600 bytes
  - [ ] File is staged and tracked by git
  - [ ] Commit message matches pattern "feat(194): create markdown file test-omg7kb.md"
  - [ ] Commit is pushed to feature branch feat/194-markdown-file-creation-195fc2
  - [ ] No modifications to existing files or directories
  - [ ] File is readable in any text editor without encoding issues
  - [ ] Prose is grammatically correct and semantically coherent

  ## Functional Requirements

  - **FR-1**: Create file named test-omg7kb.md in repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (format: # Heading Text)
  - **FR-3**: File must contain a blank line immediately after the H1 heading
  - **FR-4**: File must contain 2-3 sentences of descriptive prose after the blank line
  - **FR-5**: File must be encoded in UTF-8 without Byte Order Mark
  - **FR-6**: File must use LF (Unix-style, \n) line endings exclusively
  - **FR-7**: File must be staged in git tracking (git add)
  - **FR-8**: File must be committed with message matching pattern "feat(194): create markdown file test-omg7kb.md"
  - **FR-9**: Commit must be pushed to feature branch feat/194-markdown-file-creation-195fc2
  - **FR-10**: No modifications to any existing files or directories

  ## Non-Functional Requirements

  - **NFR-1**: File size must be between 300-600 bytes (consistency with precedent files)
  - **NFR-2**: Prose content must be grammatically correct and properly punctuated
  - **NFR-3**: Prose content must be semantically coherent and readable
  - **NFR-4**: File must be readable in any standard text editor without encoding errors
  - **NFR-5**: Implementation must follow established pattern from features 191-193 (193 identical prior implementations)
  - **NFR-6**: Markdown structure must be valid per CommonMark specification

  ## Product Decisions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content topic be constrained to specific category, or any topic acceptable? | Flexible topic (any topic acceptable) | Spec explicitly states "about anything" indicating flexibility is intended. 193 prior features each used different topics, establishing flexible content as the pattern. Maintains precedent while allowing creative freedom. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-omg7kb.md) to existing collection of 190+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~350-550 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 1-193; no branch/merge complexity |
  | Source Code (src/sheep/) | None | Feature is purely file creation; does not depend on or impact any source code |
  | Specs Directory | Low | Updates only this spec.yaml file during requirements phase; no impact on other specs |
  | Dependencies | None | Feature uses only Python standard library (pathlib) and git; no new package dependencies required |
  | Tests | None | No test modifications or additions required; feature is simple file creation with no complex logic to test |
  | Configuration | None | No changes to pyproject.toml, .env, or other config files required |

  ## Dependencies

  ### Required

  - Git repository with feature branch feat/194-markdown-file-creation-195fc2 (pre-created)
  - Write access to repository root directory (already available)
  - Python 3.11+ with pathlib standard library (no external packages beyond CrewAI stack)
  - Git configuration with user.name and user.email set for commits
  - Working CrewAI environment with agents available

  ### Reference / Precedent

  - 190+ existing test markdown files (test-*.md) in repository root provide clear pattern to follow
  - Features 191-193 provide recent, nearly-identical implementations as templates
  - Feature specifications 006-193 demonstrate expected quality and format standards

  ### Not Required

  - No source code modifications or additions
  - No new external package dependencies
  - No modifications to configuration files (pyproject.toml, .env, etc.)
  - No changes to src/sheep/ directory
  - No database or external API interactions
  - No testing infrastructure modifications

  ## Size Estimate

  **S (Small — approximately 10-15 minutes of work)**

  This is a minimal-effort, single-file creation feature with well-established precedents from 193 identical prior implementations:

  - **File creation**: ~5 minutes (compose one markdown H1 heading + 2-3 sentences of prose)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size, sentence count)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification:**
  - Extremely well-established pattern with 193 identical prior implementations providing clear precedent
  - Flexible topic selection with no research or architectural decisions required
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (191-193) demonstrate efficient execution of this identical task
  - No git merge conflicts or branch management complexity
  - Standard pathlib and subprocess usage with no novel implementation challenges

  ---

  _Requirements phase complete — ready for implementation_
