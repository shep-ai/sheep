tasks:
  - id: "task-1"
    phaseId: "phase-1"
    title: "Implement file creation function with proper UTF-8 encoding"
    description: |
      Create Python function that generates markdown file test-omg7kb.md at repository root.
      Function must use pathlib.Path.write_bytes() with explicit .encode('utf-8') to guarantee
      UTF-8 without BOM and LF line endings. Content includes H1 heading, blank line, and 2-3
      sentences of hardcoded prose. This establishes the foundation for validation and git operations.
    state: "Todo"
    dependencies: []
    acceptanceCriteria:
      - "File test-omg7kb.md created at repository root"
      - "File contains H1 markdown heading on line 1"
      - "File contains blank line on line 2"
      - "File contains 2-3 sentences of prose on lines 3+"
      - "File is UTF-8 encoded (verified by reading bytes)"
      - "File uses LF line endings (no CRLF)"
      - "File size is between 300-600 bytes"
      - "File is readable in standard text editor"
    tdd:
      red:
        - "Write test that creates file and asserts it exists"
        - "Assert file contains expected H1 heading text"
        - "Assert file contains blank line as second line"
        - "Assert file contains prose content starting on line 3"
      green:
        - "Create function that constructs markdown content string with H1 + blank line + prose"
        - "Use pathlib.Path.write_bytes(content.encode('utf-8')) to write file"
        - "Run test and verify file exists with correct content"
      refactor:
        - "Extract hardcoded prose to named constant (PROSE_CONTENT)"
        - "Extract H1 title to named constant (TITLE)"
        - "Verify test passes with extracted constants"
        - "Review code for clarity and maintainability"
    estimatedEffort: "2-3m"

  - id: "task-2"
    phaseId: "phase-1"
    title: "Implement validation for encoding and line endings"
    description: |
      Create validation function that verifies file encoding (UTF-8 without BOM) and line endings
      (LF only, no CRLF). Read file as bytes and check for BOM signature (0xEF 0xBB 0xBF).
      Verify all line breaks are LF (\n), not CRLF (\r\n). Critical for consistency with 193
      precedent files. Raise clear exceptions on validation failure.
    state: "Todo"
    dependencies:
      - "task-1"
    acceptanceCriteria:
      - "Function reads file bytes and checks for UTF-8 BOM (0xEF 0xBB 0xBF)"
      - "Function verifies no CRLF sequences exist in file"
      - "Function confirms all line endings are LF"
      - "Function raises exception with clear message if encoding issues found"
      - "Function raises exception with clear message if CRLF detected"
      - "Test verifies encoding validation passes for created file"
      - "Test verifies validation fails if BOM present (test with modified file)"
      - "Test verifies validation fails if CRLF present (test with modified file)"
    tdd:
      red:
        - "Write test that asserts file is valid UTF-8 without BOM"
        - "Write test that asserts file has no CRLF sequences"
        - "Write test that creates file with BOM and expects validation to fail"
        - "Write test that creates file with CRLF and expects validation to fail"
      green:
        - "Read file as bytes: file_bytes = pathlib.Path('test-omg7kb.md').read_bytes()"
        - "Check for BOM: if file_bytes.startswith(b'\\xef\\xbb\\xbf'): raise ValueError(...)"
        - "Check for CRLF: if b'\\r\\n' in file_bytes: raise ValueError(...)"
        - "Return True or raise exception on failure"
      refactor:
        - "Extract BOM signature to constant"
        - "Improve error messages with specific details (BOM vs CRLF)"
        - "Test all code paths: valid file, BOM file, CRLF file"
        - "Ensure exceptions are clear for debugging"
    estimatedEffort: "2-3m"

  - id: "task-3"
    phaseId: "phase-1"
    title: "Implement validation for structure and size"
    description: |
      Create validation function that verifies file structure (H1 heading present, blank line
      present, prose content exists, 2-3 sentences) and file size (300-600 bytes). Split prose
      on periods to count sentences, accounting for edge cases. Raise clear exceptions on any
      validation failure. Ensures consistency with 175+ precedent files.
    state: "Todo"
    dependencies:
