content: |
  ## Problem Statement

  Create a single markdown file named `test-xvaf7y.md` in the repository root with a properly formatted H1 heading as
  the title and 2-3 sentences of coherent prose content about any topic. This is part of an established series of
  markdown file creation features (289-294+) that demonstrate the Sheep automation platform's consistent ability to
  execute simple, repetitive file creation tasks following established patterns.

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is organized as follows:

  - **Root Directory**: Contains markdown test files (test-*.md), Python scripts, and configuration files (Dockerfile, .gitignore, .env.example)
  - **specs/ Directory**: Contains 294+ numbered feature specification directories with individual spec.yaml files. Each spec follows a consistent YAML structure documenting requirements, success criteria, and technical analysis
  - **Implementation Pattern**: From features 289 onward, the task follows an identical, well-established pattern:
    - Create a markdown file with filename format `test-{random_string}.md`
    - Add an H1 heading (single `#`) as the title on the first line
    - Add a blank line after the heading
    - Add 2-3 sentences of prose content in a single paragraph
    - Commit with conventional message: `feat(NUMBER): create markdown file {filename} with prose content` or similar variant
    - Push to the feature branch
  - **Recent Commits**: Feature 293 (test-msqxtg.md) and features 292, 291, 290 all follow this exact pattern with consistent implementation

  ### Architecture Patterns

  1. **Feature-Driven Workflow**: Each feature has a corresponding spec directory in `specs/` with a `spec.yaml` file that drives implementation
  2. **Conventional Commit Pattern**: All recent commits use the format `feat(NUMBER): create markdown file {filename} with {description}`
  3. **Simple Linear Pattern**: Features 289-294 are all identical in structure, requirements, and implementation. No architectural complexity or decision-making required
  4. **Content Generation**: Content is generated (typically via Claude API) with topics chosen flexibly to ensure variety across 289+ files
  5. **Git Workflow**: Standard git add → commit → push workflow with feature branch isolation

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment for the Sheep platform
  - **pathlib**: Used for cross-platform file creation and path handling
  - **Git**: Version control system for tracking the new markdown file
  - **Markdown**: Simple text format with H1 heading syntax (`# Title`)
  - **CrewAI**: Orchestration framework that provides task execution and logging (via structlog)
  - **Claude API**: LLM used to generate prose content (referenced as sheep.config.llm in implementation patterns)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | High | The markdown file (test-xvaf7y.md) will be created here, which is the standard location for all test files in this series |
  | Git Repository | Low | File will be tracked by git on the feature branch; no changes to git configuration or infrastructure |
  | specs/294-markdown-file-creation-d5f4d7 | Medium | This spec file itself serves as the source of truth for requirements; it documents the feature definition and success criteria |
  | Feature Branch (feat/294-markdown-file-creation-d5f4d7) | High | All changes will be isolated to this branch and committed there before pushing |
  | Repository File Structure | None | No architectural changes; only addition of one new markdown file with no modifications to existing files |

  ## Dependencies

  - **File System**: Standard file creation capability via Python pathlib (no external libraries required)
  - **Git**: Version control system already configured in the repository (used for staging, committing, and pushing)
  - **Markdown Format**: Standard CommonMark-compatible markdown syntax (no special parsers or libraries needed)
  - **Claude API Access**: For content generation (pre-configured in sheep.config.llm based on features 289-293)
  - **No External APIs**: Content generation uses the existing Sheep platform's LLM integration
  - **No Database Requirements**: Pure file creation with no persistence beyond git history

  ## Success Criteria

  - [x] Markdown file `test-xvaf7y.md` created in repository root directory
  - [x] File begins with H1 heading (`# {Title}`) on first line
  - [x] Blank line separates H1 heading from prose content
  - [x] File contains exactly 2-3 sentences of prose in a single paragraph
  - [x] Prose content is grammatically correct and topically coherent with the H1 title
  - [x] File is committed with conventional message: `feat(294): create markdown file test-xvaf7y.md with prose content` or variant
  - [x] Commit is made to feature branch `feat/294-markdown-file-creation-d5f4d7`
  - [x] File is tracked by git and visible in repository history

  ## Size Estimate

  **S** — This is an extremely minimal, straightforward task:
  - **Single file creation**: Requires creating one markdown file with standard H1 + prose format (~5 minutes of actual work)
  - **Established pattern**: Requirements are identical to features 289-293; no new architectural decisions or code changes needed
  - **Proven pattern precedent**: 289+ previous features follow this exact same pattern, making this highly predictable
  - **No testing or validation**: Beyond basic file existence and format verification
  - **Simple repetitive workflow**: Create file → stage in git → commit → push
  - **Zero complexity**: No edge cases, error handling, or special requirements

  The **S** estimate reflects the straightforward nature of the underlying task. Within the Sheep platform's context, the full feature cycle (spec analysis, implementation, review, CI/CD) may require additional time, but the core implementation itself is minimal.

