content: |
  ## Problem Statement

  Create a single markdown file named `test-xvaf7y.md` in the repository root directory with a properly formatted markdown structure: an H1 heading as the title on the first line, followed by a blank line, then exactly 2-3 sentences of coherent prose content about any topic. This feature is part of an established series (features 289-294+) that demonstrates the Sheep automation platform's capability to consistently execute simple, repetitive file creation tasks while maintaining pattern fidelity and quality standards.

  ## Success Criteria

  - [ ] Markdown file `test-xvaf7y.md` is created in the repository root directory
  - [ ] File begins with a single H1 markdown heading (`# {Title}`) on the first line
  - [ ] Blank line follows the H1 heading (line 2 is empty)
  - [ ] File contains exactly 2-3 sentences of prose content in a single paragraph (starting line 3)
  - [ ] Prose content is grammatically correct and topically coherent with the H1 title
  - [ ] File is encoded in UTF-8
  - [ ] File is staged and committed to git with conventional message: `feat(294): create markdown file test-xvaf7y.md with prose content` (or minor variants per established pattern)
  - [ ] Commit is made to the feature branch `feat/294-markdown-file-creation-d5f4d7`
  - [ ] File is successfully pushed to remote and visible in git history

  ## Functional Requirements

  - **FR-1: File Creation**: Create a markdown file named exactly `test-xvaf7y.md` in the repository root directory using Python's pathlib module (or equivalent cross-platform file I/O).

  - **FR-2: H1 Heading**: The file must start with a markdown H1 heading (single `#` character followed by space and title text) on the first line. Title text must be descriptive and relevant to the prose content.

  - **FR-3: Blank Line Separator**: Line 2 of the file must be blank (empty line separating heading from prose content), following CommonMark formatting conventions.

  - **FR-4: Prose Content**: Lines 3+ must contain exactly 2-3 sentences of grammatically correct, topically coherent prose in a single paragraph (no line breaks within the prose block). Content must use proper sentence punctuation.

  - **FR-5: Content Generation**: Prose content should be generated programmatically using the Claude API (via `sheep.config.llm`) with flexible topic selection (\"about anything\" per requirements).

  - **FR-6: Git Staging**: The created markdown file must be staged in git using standard `git add` workflow (either targeted or via blanket add based on implementation strategy).

  - **FR-7: Git Commit**: Changes must be committed with a conventional commit message following the pattern: `feat(294): create markdown file test-xvaf7y.md with prose content` or minor variants consistent with features 289-293.

  - **FR-8: Branch Isolation**: All changes must be committed to the feature branch `feat/294-markdown-file-creation-d5f4d7`, not to main or any other branch.

  - **FR-9: Remote Push**: Committed changes must be pushed to the remote repository on the feature branch, making the file visible in git history.

  ## Non-Functional Requirements

  - **NFR-1: File Encoding**: The markdown file must be encoded in UTF-8 (standard for markdown files and modern Python string handling).

  - **NFR-2: Markdown Format Compliance**: Prose content must be valid markdown, following CommonMark specification basics (proper sentence punctuation, no unescaped special markdown syntax that would cause parsing conflicts).

  - **NFR-3: Conventional Commits**: Git commit messages must strictly follow the conventional commits format (`feat(294): ...`), consistent with repository standards and features 289-293.

  - **NFR-4: Performance**: File creation and git operations should complete within acceptable timeframes (< 10 seconds total for file creation, commit, and push) with no artificial delays.

  - **NFR-5: Consistency**: Implementation must follow the established pattern from features 289-293 to ensure consistency across the file series and maintain predictable execution patterns.

  - **NFR-6: Simplicity**: Implementation should avoid unnecessary complexity, validation frameworks, error handling, or conditional logic beyond standard file system and git operations.

  - **NFR-7: Idempotency**: While not required to be re-runnable, implementation should use deterministic approaches that produce consistent results across invocations.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be auto-generated via Claude API or manually written? | Auto-generate via Claude API | Maintains consistency with proven pattern (289-293), ensures variety across files, aligns with Sheep platform's LLM integration, fully automates workflow |
  | 2 | Should the markdown file format be validated before committing? | No validation | Simple, deterministic format makes validation unnecessary; established pattern does not include validation and works reliably |
  | 3 | Should prose topic be randomly chosen or specified? | Freely chosen by content generator | Matches spec requirement (\"about anything\"), ensures variety, maintains pattern simplicity, enables full automation |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | High | The markdown file (test-xvaf7y.md) will be created here, which is the standard location for all test files in this series |
  | Git Repository | Low | File will be tracked by git on the feature branch; no changes to git configuration or infrastructure |
  | specs/294-markdown-file-creation-d5f4d7 | Medium | This spec file documents the feature definition and serves as the source of truth for requirements |
  | Feature Branch (feat/294-markdown-file-creation-d5f4d7) | High | All changes will be isolated to this branch and committed there before pushing |
  | Repository File Structure | None | No architectural changes; only addition of one new markdown file with no modifications to existing files |

  ## Dependencies

  - **File System**: Standard file creation capability via Python pathlib (no external libraries required beyond Python standard library)
  - **Git**: Version control system already configured in the repository for staging, committing, and pushing
  - **Markdown Format**: Standard CommonMark-compatible markdown syntax (no special parsers or libraries needed for validation)
  - **Claude API Access**: For content generation via Sheep platform's `sheep.config.llm` integration (pre-configured based on features 289-293)
  - **No External APIs**: Content generation uses existing Sheep platform LLM integration, no additional API setup required
  - **No Database Requirements**: Pure file creation with persistence only through git history
  - **Git Hooks**: No special git hooks required; standard pre-commit/commit-msg hooks (if any) should work with conventional format

  ## Size Estimate

  **S** — This is an extremely minimal, straightforward task:

  - **Single file creation**: Requires creating one markdown file with standard H1 + prose format (~5 minutes of actual work)
  - **Established pattern**: Requirements are identical to features 289-293; no new architectural decisions or code changes needed
  - **Proven precedent**: 289+ previous features follow this exact same pattern, making this highly predictable and low-risk
  - **No testing or validation**: Beyond basic file existence and format verification
  - **Simple repetitive workflow**: Create file → stage in git → commit with conventional message → push
  - **Zero complexity**: No edge cases, error handling, or special requirements beyond standard operations

  The **S** estimate reflects the straightforward nature of the underlying task. Within the Sheep platform's context, the full feature cycle (spec analysis, implementation, review, CI/CD) may require additional time, but the core implementation itself is minimal and well-defined.

  ---

  _Requirements phase completed. Feature is well-specified and ready for implementation planning._
