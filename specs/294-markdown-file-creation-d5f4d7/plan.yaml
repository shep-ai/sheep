content: |
  ## Architecture Overview

  Feature 294 is a straightforward markdown file creation task following the established
  pattern from features 289-293. The implementation leverages the `sheep.content_generators`
  module, which provides a proven orchestration function that encapsulates the complete
  workflow:

  1. **Content Generation** — Calls Claude API via CrewAI's LLM framework to generate
     a descriptive H1 heading and 2-3 sentences of topically coherent prose content
  2. **File Creation** — Writes the markdown file to the repository root using Python's
     pathlib module for cross-platform path handling
  3. **Comprehensive Validation** — Validates H1 heading structure, blank line separator,
     sentence count (exactly 2-3), UTF-8 encoding without BOM, LF line endings, and
     trailing newline (POSIX compliance). Regenerates content if sentence count mismatches
  4. **Git Operations** — Stages the file, creates a conventional commit message
     (`feat(294): create markdown file test-xvaf7y.md with prose content`), and pushes
     to the feature branch on the remote

  The implementation requires no changes to application source code, configuration, or
  system architecture. The markdown file is a pure deliverable/artifact with no integration
  into existing application logic or workflows.

  ## Key Design Decisions

  ### 1. Reuse Existing Orchestration Function (CRITICAL)

  **Decision:** Use `sheep.content_generators.create_markdown_file(filename, feature_number=294)`

  **Rationale:** The research findings explicitly recommend this approach. The function
  encapsulates the complete workflow and has been proven to work across features 289-293.
  This decision provides:
  - Perfect consistency with established pattern and proven implementation
  - Minimal implementation effort (single function call)
  - Reduced risk of bugs and inconsistencies
  - No code duplication across similar features
  - Automatic error handling and logging via platform infrastructure

  **Trade-off:** Dependency on sheep.content_generators module being available and working
  correctly. **Mitigation:** Module is proven across 289-293; no additional risk.

  **Alternative Rejected:** Building from scratch would require ~2-3 hours of implementation
  vs. 30 minutes with orchestration function.

  ### 2. Leverage CrewAI LLM Framework for Content Generation

  **Decision:** Use `sheep.config.llm.get_reasoning_llm()` via orchestration function

  **Rationale:** Sheep platform abstracts LLM access through CrewAI's LLM factory,
  centralizing API key management, model selection, and temperature tuning. Using the
  platform's abstraction ensures:
  - Consistent configuration across all features
  - Proper error handling and retries
  - Access to pre-configured Claude API settings
  - Support for future model switching without code changes

  **Temperature Setting:** Research recommends temperature=0.2 for focused, consistent
  prose generation while still maintaining variety across 289+ files.

  **Alternative Rejected:** Direct Anthropic SDK calls would break platform abstraction
  and duplicate setup already handled by CrewAI.

  ### 3. Comprehensive Validation Before Git Commit

  **Decision:** Validate H1 heading, blank line separator, sentence count, UTF-8 encoding,
  LF line endings, and trailing newline

  **Rationale:** Requirements explicitly mandate specific markdown structure (FR-2 through
  FR-4) and encoding standards (NFR-1, NFR-5). The research recommends comprehensive
  lightweight validation (not full CommonMark parsing, which is overkill). The
  sheep.content_generators module includes validation functions. This approach:
  - Prevents non-compliance with explicit functional requirements
  - Ensures consistent file quality across the series
  - Adds minimal performance overhead (~100ms)
  - Catches encoding/line-ending issues that could cause portability problems

  **Sentence Count Validation:** Strict enforcement of exactly 2-3 sentences. If LLM
  generates wrong count, prompt is refined and content is regenerated (with reasonable retry limit).

  **Alternative Rejected:** "No validation" increases risk of non-compliance; features
  289-293 actually do validate despite feature.yaml's "no validation" answer.

  ### 4. Subprocess-Based Git Operations

  **Decision:** Use subprocess module to call `git add`, `git commit`, `git push`

  **Rationale:** Subprocess provides:
  - Transparent command execution (visible in CI/CD logs for debugging)
  - No external dependencies (already in Python standard library)
  - Proven pattern across features 289-293
  - Guaranteed availability in CI/CD environment

  **Alternative Rejected:** GitPython library would add external dependency; subprocess
  is simpler and already proven.

  ### 5. Reuse Platform Logging Infrastructure

  **Decision:** Use `sheep.observability.logging.get_logger()` for structured logging

  **Rationale:** Ensures logs integrate with CrewAI observability and CI/CD pipelines.
  Provides context for debugging failures and tracking execution.

  ## Implementation Strategy

  ### Execution Flow

  1. **Task 1 (Understanding Phase):** Locate sheep.content_generators module and
     examine create_markdown_file() function signature, parameters, and documentation
  2. **Task 2 (Implementation Phase):** Call create_markdown_file() with filename and
     feature_number; function handles content generation, file creation, validation,
     and git operations
  3. **Task 3 (Verification Phase):** Write comprehensive tests validating all 9 success
     criteria and 14 requirements (file existence, H1 format, blank line, sentence count,
     encoding, line endings, git commit format, push success)
  4. **Task 4 (Git Completion):** If needed, manually verify git commit and push (may be
     handled automatically by orchestration function)

  ### Why This Order

  - Task 1 before Task 2: Understanding API prevents calling function incorrectly
  - Task 2 before Task 3: Need the artifact (file + git commit) to test
  - Task 3 before Task 4: Verification ensures quality before finalizing
  - Task 4 last: Git operations complete the workflow

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Claude API rate limiting during content generation | Low | CrewAI handles retries; Sheep platform may batch requests across features |
  | LLM generates wrong sentence count | Low | Validation logic detects mismatch and regenerates with refined prompt |
  | File I/O permission errors | Very Low | CI/CD environment guarantees write permissions to repo root |
  | Git authentication/credential failure | Very Low | Sheep platform handles git credentials via environment variables |
  | sheep.content_generators module missing | Very Low | Module is proven across 289-293; research confirms it exists and works |
  | Markdown format non-compliance | Low | Built-in validation ensures FR-2 through FR-4 compliance before commit |
  | UTF-8 encoding issues | Very Low | Python 3.11+ handles UTF-8 transparently in text mode |
  | Network latency on git push | Low | Expected and acceptable; platform may optimize with batched pushes |

  ## Files & Impact

  ### Source Code
  - **Files to Create:** None — no new source code files
  - **Files to Modify:** None — no existing source code changes
  - **Architecture Changes:** None — no new patterns or abstractions required

  ### Deliverables (Artifacts)
  - **test-xvaf7y.md** — Markdown file in repository root (created by orchestration function)
    - Line 1: H1 markdown heading with descriptive title
    - Line 2: Blank line (empty)
    - Lines 3+: 2-3 sentences of prose content
    - Encoding: UTF-8 (no BOM)
    - Line endings: LF (Unix style)
    - Trailing newline: Yes (POSIX compliance)

  ### Git Changes
  - **Commit:** Created on feature branch `feat/294-markdown-file-creation-d5f4d7`
  - **Message:** `feat(294): create markdown file test-xvaf7y.md with prose content`
  - **Push:** To remote repository on feature branch
  - **Visibility:** File visible in GitHub repository view and git history

  ## Success Criteria Mapping

  **Success Criteria → Implementation:**

  1. ✓ File created in repo root — orchestration function handles
  2. ✓ H1 heading on line 1 — LLM generation + validation
  3. ✓ Blank line on line 2 — validation ensures this
  4. ✓ 2-3 sentences on line 3+ — sentence count validation with regeneration
  5. ✓ Grammatically correct, coherent — LLM quality + topic matching
  6. ✓ UTF-8 encoding — validation checks, Python 3 default
  7. ✓ Staged in git — orchestration function (git add)
  8. ✓ Conventional commit message — orchestration function hardcoded message
  9. ✓ Committed to feature branch — orchestration function enforces
  10. ✓ Pushed to remote — orchestration function (git push)

  ## Comparison with Features 289-293

  Feature 294 follows **exact same pattern** as preceding features:

  | Aspect | Feature 294 | Features 289-293 |
  | ------ | ----------- | --------------- |
  | Markdown format | H1 + blank line + prose | Identical pattern |
  | File location | Repository root | Identical |
  | Content generation | Claude API via CrewAI | Identical |
  | Validation strategy | Comprehensive (H1, blank, sentence count, encoding, line endings) | Identical approach proven |
  | Git workflow | add, commit (conventional), push | Identical pattern |
  | Implementation approach | Call orchestration function | Identical proven pattern |
  | Testing strategy | Verify all requirements met | Identical verification approach |

  **Consistency Ensures:**
  - Predictable execution
  - High quality across file series
  - Minimal risk of surprises
  - Seamless integration with CI/CD

  ## Total Effort Estimate

  - **Task 1 (Understanding):** 15 minutes
  - **Task 2 (Implementation):** 20 minutes
  - **Task 3 (Verification):** 20 minutes
  - **Task 4 (Git completion):** 5 minutes
  - **Total:** ~1 hour

  This includes reading documentation, writing and running tests, manual verification,
  and git operations. Effort is dominated by test writing and verification; actual
  implementation (function call) is minimal.

