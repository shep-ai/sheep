content: |
  ## Summary

  Feature 294 implementation breaks down into 4 focused tasks across 2 phases, following
  the proven pattern from features 289-293.

  **Phase 1 — Implementation (35 minutes):**
  - **Task 1 (15 min):** Understand the sheep.content_generators.create_markdown_file() API
    by examining the module, function signature, and documentation. No code changes yet.
  - **Task 2 (20 min):** Call the orchestration function with filename='test-xvaf7y.md'
    and feature_number=294. Function handles: LLM content generation, file creation,
    validation, and git operations. Write TDD tests (RED: file existence/format assertions;
    GREEN: call function, pass tests; REFACTOR: add logging and error handling).

  **Phase 2 — Verification & Completion (25 minutes):**
  - **Task 3 (20 min):** Write comprehensive integration tests validating all 9 success
    criteria and 14 requirements (file structure, encoding, line endings, git commit format,
    push success). TDD approach: RED (16 granular test assertions), GREEN (implement tests,
    verify all pass), REFACTOR (extract patterns, improve error messages).
  - **Task 4 (5 min):** Final sanity check: confirm git commit exists with correct message
    on correct branch, push succeeded, and file is visible in GitHub. Non-code task.

  **Task Dependencies:**
  - Task 1 → Task 2: Understand API before calling it
  - Task 2 → Task 3: Need artifact (file + git commit) to test
  - Task 3 → Task 4: Verify quality before finalizing
  - All tasks sequential (no parallelism)

  ## Why This Structure

  1. **Understand First:** Task 1 prevents costly mistakes by ensuring we understand the API
  2. **Minimal Implementation:** Task 2 is just one function call (orchestration handles everything)
  3. **Comprehensive Testing:** Task 3 validates all 9 success criteria + 14 requirements (zero ambiguity)
  4. **Final Verification:** Task 4 confirms the entire workflow end-to-end
  5. **TDD Discipline:** RED/GREEN/REFACTOR cycles ensure test-driven quality

  ## Key Testing Strategies

  **Task 2 Tests (Implementation-level):**
  - File existence checks (path operations, file system state)
  - Basic format validation (H1 regex, blank line, sentence count)
  - Encoding/line ending checks (binary file inspection)
  - Git staging status (subprocess git commands)

  **Task 3 Tests (Integration-level):**
  - All 16 granular assertions covering every success criterion
  - Prose relevance checking (H1 title words appear in prose)
  - Grammar/punctuation validation (basic checks for sentence structure)
  - Full git history verification (commit message, branch, remote push)
  - File visibility in GitHub (confirms push succeeded)

  ## Expected Outcome

  After completing all 4 tasks, feature 294 will have achieved:

  ✅ **File Created & Formatted:**
  - test-xvaf7y.md exists in repository root
  - H1 heading with descriptive title (line 1)
  - Blank line separator (line 2)
  - 2-3 sentences of coherent prose (lines 3+)
  - UTF-8 encoding, LF line endings, trailing newline

  ✅ **Validation Passed:**
  - Sentence count validated (exactly 2-3)
  - Encoding verified (UTF-8 without BOM)
  - Line endings correct (LF, no CRLF)
  - POSIX compliance (trailing newline)

  ✅ **Git Operations Complete:**
  - File staged in git
  - Conventional commit created: feat(294): create markdown file test-xvaf7y.md with prose content
  - Commit on feature branch: feat/294-markdown-file-creation-d5f4d7
  - Pushed to remote
  - Visible in GitHub repository view

  ✅ **All Requirements Met:**
  - All 9 success criteria satisfied
  - All 9 functional requirements (FR-1 through FR-9) satisfied
  - All 7 non-functional requirements (NFR-1 through NFR-7) satisfied
  - All 16 integration tests passing

  ✅ **Ready for Next Phase:**
  - Implementation complete
  - Tests passing
  - Git history clean
  - Ready for CI/CD checks and code review

  ## Implementation Notes

  **Pattern Consistency:** All tasks follow the same approach as features 289-293,
  ensuring no surprises and leveraging proven workflows.

  **Error Handling:** Task 2 includes error handling for API failures, file I/O issues,
  and git operation problems. Errors are logged with structured logging for debuggability.

  **No Regressions:** Orchestration function is responsible for file creation and git
  operations; our tests verify the function works correctly but don't modify any source code.

  **Quick Execution:** Total estimated effort is ~1 hour, dominated by test writing and
  verification (not implementation).

  ---

  _Task breakdown completed 2026-03-31. Ready for implementation._
