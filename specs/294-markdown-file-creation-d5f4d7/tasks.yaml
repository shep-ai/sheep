      - "File has exactly 2-3 sentences of prose content starting at line 3"
      - "Prose content is grammatically correct and topically coherent with H1 title"
      - "File is encoded in UTF-8 (confirmed by encoding detection)"
      - "File uses LF line endings (not CRLF or mixed)"
      - "File ends with newline character (POSIX compliance, git reports no 'no newline' warning)"
