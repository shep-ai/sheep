content: |
  ## Architecture Overview

  Feature 267 implementation is a thin orchestration layer that coordinates existing utilities
  from the Sheep codebase. The architecture follows a proven pattern established by 266+ preceding
  features (001-266).

  ### Key Architecture Components

  1. **Feature Module** (`feature_267_markdown_file_creation.py`):
     - Module-level constants: `FEATURE_NUMBER`, `FEATURE_NAME`, `MARKDOWN_FILENAME`
     - Main orchestration function: `create_feature_267_markdown_file(repo_path=None)`
     - Returns dictionary with file path, content, commit message, and push result
     - Follows single-responsibility principle: module coordinates, utilities execute

  2. **Content Generation** (via `content_generators.generate_markdown_content()`):
     - Uses CrewAI's LLM framework with Claude 3.5 Sonnet via `get_reasoning_llm()`
     - Prompt is static and well-tested: requests H1 heading + 2-3 sentences
     - Returns valid markdown string with trailing newline
     - Validates format before returning (H1 heading, period count for sentences)

  3. **File I/O** (via `content_generators.write_markdown_file()`):
     - Uses `pathlib.Path` for cross-platform file operations
     - Writes to repository root with UTF-8 encoding (no BOM)
     - Platform-native line endings (LF on Unix, CRLF on Windows)
     - Validates file exists and has non-zero size after writing

  4. **Validation** (via `content_generators.validate_markdown_file()`):
     - Three-step validation: markdown structure, encoding, line endings
     - Checks: H1 heading present, blank line separator, 2-3 sentences, UTF-8, LF only, trailing newline
     - Raises descriptive `ValueError` exceptions on any failure
     - Logs validation results at INFO level, details at DEBUG level

  5. **Git Operations** (via `content_generators.commit_markdown_file()` and `push_markdown_file()`):
     - Uses tool abstraction layer (`GitCommitTool`, `GitPushTool`)
     - Commit: stages file, commits with conventional commit message format
     - Push: pushes to remote with `set_upstream=True` for tracking branch setup
     - Both operations handle authentication via pre-configured git/SSH credentials

  6. **Logging** (via `sheep.observability.logging.get_logger()`):
     - Structured logging with `get_logger(__name__)`
     - INFO level for major workflow steps
     - DEBUG level for detailed operation results
     - ERROR level for exceptions with stack context

  ### Integration Points

  The feature module integrates with:
  - **LLM Configuration**: `sheep.config.llm.get_reasoning_llm()` provides Claude 3.5 Sonnet
  - **File I/O Utilities**: All markdown file operations encapsulated in `content_generators.py`
  - **Git Tool Abstraction**: Staging, commit, and push delegated to tool layer in `sheep.tools`
  - **Observability**: Structured logging via `sheep.observability.logging`

  ### No Architectural Changes Required

  - No new agent definitions or flows
  - No modifications to tool layer (existing tools are sufficient)
  - No configuration changes (existing LLM and logging config works)
  - No dependency additions (all required libraries already present)
  - No database or storage layer changes

  ## Key Design Decisions

  ### 1. Utility Orchestration Pattern

  **Decision**: Call existing utility functions from `content_generators.py` in sequence.
  No duplication of file I/O, validation, or git operations logic.

  **Rationale**: The utilities are proven across 266+ features, have comprehensive error
  handling, logging, and validation built-in. Reusing them ensures consistency, reduces
  bugs, and follows DRY principle. Feature module focuses on orchestration, not implementation.

  **Alternatives Rejected**:
  - Direct API calls to CrewAI, pathlib, GitPython → loses abstraction, duplicates logic
  - Generic markdown file creator function with feature number as parameter → loses clarity
  - Custom implementation bypassing utilities → breaks consistency, harder to maintain

  ### 2. Feature Module File Structure

  **Decision**: Create `src/sheep/features/feature_267_markdown_file_creation.py` with:
  - Module-level constants: `FEATURE_NUMBER=267`, `FEATURE_NAME=\"markdown-file-creation-7ccda9\"`, `MARKDOWN_FILENAME=\"test-c6jsj2.md\"`
  - Main function: `create_feature_267_markdown_file(repo_path: str | None = None) -> dict[str, str]`
  - Docstring with workflow steps, parameters, return value, exceptions
  - `if __name__ == \"__main__\"` block for direct execution
  - Structured logging at each workflow step

  **Rationale**: This pattern is established by features 263-266 and eliminates ambiguity
  about feature numbers, filenames, and implementation structure. Makes features importable
  modules and executable scripts. Consistent naming enables discovery and maintenance.

  **Alternatives Rejected**:
  - Reuse generic creator from utilities → loses feature number in code, harder to track
  - Inline in test file → reduces reusability, violates module separation
  - Central feature registry → over-engineered for 267 features, breaks precedent

  ### 3. Error Handling and Exception Propagation

  **Decision**: Let exceptions from utility functions propagate with descriptive logging.
  Feature module catches and logs exceptions, then re-raises them. Caller decides retry strategy.

  **Rationale**: Utilities already have comprehensive error handling with descriptive messages.
  Feature module adds context logging. Propagation allows orchestrators to implement
  retry logic if needed. Matches pattern in feature 265 and specification NFR-10.

  **Alternatives Rejected**:
  - Suppress errors silently → masks problems, violates specification
  - Implement retry logic in feature → unnecessary complexity, utilities may have transient failures
  - Raise generic Exception → loses specific error context from utilities

  ### 4. Logging Strategy

  **Decision**: Use `get_logger(__name__)` from `sheep.observability.logging`. Log at:
  - INFO level for major steps (content generation, file write, validation, commit, push)
  - DEBUG level for operation results (content preview, file path, git result details)
  - ERROR level for exceptions with full context

  **Rationale**: Provides observability for debugging and audit trail. Structured logging
  integrates with Langfuse tracing. Follows platform conventions established across
  codebase. Matches feature 265 logging pattern.

  **Alternatives Rejected**:
  - No logging → loses debugging capability, violates NFR-9
  - print() statements → not suitable for production, inconsistent format
  - Custom logging configuration → unnecessary, platform-wide logger is configured

  ### 5. LLM Provider and Model

  **Decision**: Use `get_reasoning_llm()` from `sheep.config.llm`, which is configured as
  Anthropic Claude 3.5 Sonnet with temperature 0.2 for precise prose generation.

  **Rationale**: Feature specification (FR-4) explicitly requires Claude API via CrewAI.
  Research findings confirm Claude 3.5 Sonnet is configured for reasoning tasks. Temperature
  0.2 balances coherence with adequate diversity. This is proven across 266+ features.

  **Alternatives Rejected**:
  - GPT-4o (default model) → less suitable for prose generation, not spec-compliant
  - Custom fine-tuned model → unnecessary overhead, general-purpose model sufficient
  - Cached/memoized content → reduces diversity, violates test independence

  ### 6. File Encoding and Line Ending Handling

  **Decision**: Let `write_markdown_file()` handle encoding/line endings. Python's text mode
  writes UTF-8 without BOM (platform-native line endings). `validate_markdown_file()` verifies
  encoding and LF line endings via binary read post-write.

  **Rationale**: `pathlib` with text mode 'w' is standard Python practice. UTF-8 without BOM
  is default and safest. Validation catches any platform-specific issues. This approach is
  proven in content_generators.py and eliminates unnecessary complexity.

  **Alternatives Rejected**:
  - Explicit newline='\n' parameter → redundant on Unix, already handled by utilities
  - Manual CRLF-to-LF conversion → unnecessary, platform defaults work correctly
  - Encoding declaration header → not needed in markdown, UTF-8 is standard

  ### 7. Markdown Validation Approach

  **Decision**: Call `validate_markdown_file()` which performs targeted validation:
  H1 heading presence/format, blank line separator, sentence count (via period counting),
  UTF-8 encoding, LF-only line endings, trailing newline.

  **Rationale**: Sufficient for specification requirements. No external parser needed.
  Period counting is simple and effective for 2-3 sentence validation. Efficient binary
  read validates encoding and line endings. Matches existing utility implementation.

  **Alternatives Rejected**:
  - Full CommonMark parser → overkill, adds unnecessary dependency, slows validation
  - Regex-based validation → fragile for variable sentence structures
  - No validation (trust LLM) → insufficient, LLM occasionally produces edge cases

  ### 8. Git Operations Pattern

  **Decision**: Use `commit_markdown_file()` and `push_markdown_file()` utilities which
  abstract GitCommitTool and GitPushTool. Pass explicit commit message format:
  `feat(267): Create markdown file test-c6jsj2.md with prose content`

  **Rationale**: Tool abstraction is established pattern, promotes testability and consistency.
  Explicit commit message matches specification FR-10 and provides stability (not dependent
  on generated title). Utilities handle authentication via SSH/configured credentials.

  **Alternatives Rejected**:
  - Direct subprocess.run(['git', ...]) → couples to shell, harder to mock/test
  - Extract title from content for commit → introduces variability, less predictable
  - Separate staging step → violates DRY, utilities handle both atomically

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation & Pattern Review)** comes first because understanding existing patterns
  and utilities is prerequisite for consistent implementation. This phase is zero-risk and
  clarifies what to build.

  **Phase 2 (Feature Module Implementation)** follows naturally after understanding patterns.
  Creates the feature module by orchestrating proven utilities. Implementation is straightforward
  orchestration, not complex logic.

  **Phase 3 (Integration Testing & Verification)** comes last to validate the completed feature
  meets all requirements. Includes both automated tests and manual end-to-end verification.

  ### Workflow Sequence

  1. Create module with constants and function stub (RED-GREEN-REFACTOR)
  2. Call `generate_markdown_content()` and log result
  3. Call `write_markdown_file()` and validate file exists
  4. Call `validate_markdown_file()` to ensure quality gates
  5. Call `commit_markdown_file()` with exact message format
  6. Call `push_markdown_file()` and verify remote tracking
  7. Write integration test that executes entire workflow
  8. Manual execution to verify file, git history, and remote state

  ### Why This Approach

  Each step is a minimal function call that delegates to proven utilities. No complex logic
  required in feature module. TDD cycles are straightforward: test imports/calls function,
  minimal implementation adds the call, refactor improves logging/error handling.
  Integration test validates end-to-end workflow. Manual verification catches any platform-
  or environment-specific issues.

  ## Risk Mitigation

  | Risk | Mitigation | Likelihood |
  | ---- | ---------- | ---------- |
  | LLM generates invalid prose | Utilities validate format before file write; raises ValueError on mismatch. Feature propagates exception. | Low — LLM is reliable for this task, validated across 266+ features |
  | File write fails (disk full, permissions) | write_markdown_file() validates file exists and has content. IOError propagates to caller. | Very Low — test environment is well-provisioned |
  | UTF-8 encoding issues on Windows | validate_markdown_file() checks encoding via binary read. Rejects CRLF. Feature only uses utilities, encoding is platform-abstracted. | Very Low — utilities handle platform differences |
  | Git staging/commit fails | commit_markdown_file() uses GitCommitTool which handles auth and errors. Exception propagates with descriptive message. | Low — feature branch pre-created, credentials configured |
  | Git push fails (network, auth) | push_markdown_file() uses GitPushTool with set_upstream=True. Network issues are transient and handled by caller retry logic. | Low — local network is stable, SSH keys configured |
  | Feature module structure inconsistent with 265-266 | Review feature 265 first. Mirror module structure exactly. Code review catches inconsistencies. | Very Low — pattern is explicit and straightforward |
  | Logging not integrated properly | Use get_logger(__name__) from sheep.observability.logging exactly. Follow feature 265 logging pattern at each step. | Very Low — logging pattern is established |
  | Markdown content doesn't meet 2-3 sentence requirement | validate_markdown_file() counts periods and rejects < 2 or > 3. This is reliable for sentence detection. | Very Low — LLM consistently generates 2-3 sentences with prompting |
