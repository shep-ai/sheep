# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform has established a pattern of creating simple test markdown files
  for validating and demonstrating the core implementation workflow. This feature creates a single markdown file
  (`test-c6jsj2.md`) at the repository root with a markdown heading as title and 2-3 sentences of prose content.

  This is a straightforward, well-precedented file creation task. The repository contains 266+ test files
  following this identical pattern (test-*.md files at repository root), providing clear reference implementations
  and demonstrating the routine nature of this operation within the Sheep platform.

  **Context**: The Sheep project is a modular, observable agentic platform for automated code implementation.
  It uses CrewAI for multi-agent orchestration, supports multiple LLM providers (OpenAI, Anthropic, Google),
  and includes comprehensive observability via Langfuse. This feature is part of a testing/validation suite
  that exercises the file creation and git workflow capabilities.

  ## Success Criteria

  - [ ] File `test-c6jsj2.md` is created and exists at repository root
  - [ ] File contains exactly one H1 heading using markdown syntax (`# Title`)
  - [ ] File contains 2-3 sentences of coherent, meaningful prose content following the heading
  - [ ] File is encoded in UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (\n, not CRLF or CR)
  - [ ] File passes markdown validation (valid H1 syntax, proper sentence structure)
  - [ ] File is staged in git (visible in `git status` before commit)
  - [ ] Git commit created with message format: `feat(267): Create markdown file test-c6jsj2.md with title and prose content`
  - [ ] File is pushed to remote feature branch `origin/feat/267-markdown-file-creation-7ccda9`
  - [ ] No validation errors occur during content generation, file writing, or git operations

  ## Functional Requirements

  - **FR-1**: System SHALL create a new markdown file named exactly `test-c6jsj2.md` at the repository root directory
  - **FR-2**: System SHALL generate and include exactly one H1 heading (markdown syntax: `# Title`) as the file title
  - **FR-3**: System SHALL generate and include 2-3 sentences of coherent, meaningful prose content immediately after the H1 heading
  - **FR-4**: System SHALL use Claude API via CrewAI's `get_reasoning_llm()` to generate prose content based on a topic prompt
  - **FR-5**: System SHALL write the file to disk with UTF-8 encoding (no BOM)
  - **FR-6**: System SHALL ensure file uses Unix LF line endings (\n), automatically converting any CRLF or CR to LF during write
  - **FR-7**: System SHALL validate markdown structure before persisting: verify H1 heading is present, count and validate 2-3 sentences, check valid markdown formatting
  - **FR-8**: System SHALL reject file creation if validation fails and report specific validation errors
  - **FR-9**: System SHALL stage the file in git (equivalent to `git add test-c6jsj2.md`)
  - **FR-10**: System SHALL create a git commit with conventional commit message format: `feat(267): Create markdown file test-c6jsj2.md with title and prose content`
  - **FR-11**: System SHALL push the committed file to the remote feature branch `origin/feat/267-markdown-file-creation-7ccda9`
  - **FR-12**: System SHALL follow the established implementation pattern from features 263-266 using utilities in `src/sheep/content_generators.py`

  ## Non-Functional Requirements

  - **NFR-1**: File encoding MUST be UTF-8 without BOM (Byte Order Mark); encoding must be verifiable by reading file bytes
  - **NFR-2**: Line endings MUST be Unix LF (\n), not Windows CRLF (\r\n) or old Mac CR (\r); validation must check line ending consistency
  - **NFR-3**: Markdown syntax MUST be valid according to CommonMark specification; H1 heading must use proper `# Title` syntax
  - **NFR-4**: Prose content MUST be grammatically correct, coherent, and meaningful; sentences must be complete (not fragments)
  - **NFR-5**: Git operations MUST follow conventional commit format: `feat(NNN): description` per established project standards
  - **NFR-6**: Implementation MUST reuse existing utilities from `src/sheep/content_generators.py`; no code duplication of file I/O or git operations
  - **NFR-7**: Content generation MUST use the established LLM integration pattern via `get_reasoning_llm()` from `src/sheep/config/llm.py`
  - **NFR-8**: Feature implementation MUST follow the established pattern from features 263-266 and preceding features; implementation structure must be consistent with precedent
  - **NFR-9**: Logging MUST use structured logging from `src/sheep/observability/logging.py` for debugging and audit trail
  - **NFR-10**: Error handling MUST propagate exceptions from git operations and file I/O with descriptive error messages

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as follows:

  - **src/sheep/** - Main Python package containing platform logic
    - **agents/** - CrewAI agent definitions (code_agents.py, general_agents.py)
    - **config/** - Configuration management (settings.py, llm.py for LLM access)
    - **flows/** - Flow definitions for orchestrating agent tasks
    - **tools/** - Tool implementations for git, file, and web operations
    - **features/** - Feature implementations (266+ markdown file creation variants with pattern feature_NNN_markdown_file_creation.py)
    - **content_generators.py** - Reusable utilities for markdown generation, validation, writing, committing, and pushing
    - **observability/** - Logging and Langfuse tracing integration
    - **cli.py** - Command-line interface entry point

  - **specs/** - Feature specifications with YAML specs and research/planning documents for each feature

  - **Root directory** - Contains many generated markdown files (test-*.md) from 266 preceding features

  - **tests/** - Test suite for the platform

  ### Architecture Patterns

  1. **Modular Content Generation**: The project uses centralized utility functions in `content_generators.py`
     for markdown creation tasks. These utilities handle:
     - LLM-based content generation via CrewAI and Claude API
     - File writing with proper encoding (UTF-8) and line endings (Unix LF)
     - Markdown validation (H1 heading presence, sentence count, formatting)
     - Git operations (staging, committing with conventional commit format, pushing to remote)

  2. **Established Workflow Pattern**: All 266+ markdown file creation features follow this identical orchestration:
     1. Generate markdown content with H1 heading + 2-3 sentences using LLM
     2. Write file to repository root with UTF-8 encoding and Unix LF line endings
     3. Validate markdown structure and content (heading present, sentence count, formatting)
     4. Stage and commit with conventional commit message format: `feat(NNN): <description>`
     5. Push to remote feature branch (pre-created: origin/feat/267-markdown-file-creation-7ccda9)

  3. **LLM Integration**: Uses CrewAI's LLM framework and `get_reasoning_llm()` utility to generate coherent prose
     via Claude API. Content generation is templated with specific requirements for format and structure.

  4. **Separation of Concerns**: Feature implementations in src/sheep/features/ are thin wrappers that
     orchestrate predefined utilities. Git operations are abstracted via GitPushTool and GitCommitTool,
     avoiding direct git command invocations and promoting testability.

  5. **Feature Implementation Pattern**: Individual features follow this structure:
     - Import utilities from content_generators.py
     - Call generate_markdown_content() with prompt specifying H1 heading + 2-3 sentences
     - Call write_markdown_file() to persist with UTF-8 and Unix LF
     - Call validate_markdown_file() to ensure quality gates
     - Call commit_markdown_file() and push_markdown_file() for git workflow

  ### Relevant Technologies

  - **CrewAI (>=0.86.0)** - Multi-agent framework for orchestrating LLM-based workflows; used via get_reasoning_llm()
  - **Python 3.11+** - Language for implementation
  - **pathlib** - Standard library module for filesystem operations (cross-platform)
  - **GitPython (>=3.1.0)** - Git library for version control operations
  - **Pydantic (>=2.0.0)** - Data validation and configuration management
  - **Markdown (content format)** - Text format for generated files; no external markdown library required
  - **UTF-8 encoding** - Standard text encoding for all file operations
  - **Langfuse (>=2.0.0)** - Optional observability framework for execution tracing and monitoring

