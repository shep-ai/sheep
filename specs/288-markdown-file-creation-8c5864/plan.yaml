content: |
  ## Architecture Overview

  Feature 288 is implemented as a thin orchestration layer on top of existing,
  battle-tested utility functions. The architecture reuses the complete pattern
  from 287 preceding identical features:

  **Module Structure:**
  - **feature_288_markdown_file_creation.py**: Minimal orchestrator module
    - Defines constants: FEATURE_NUMBER=288, FEATURE_NAME="markdown-file-creation", MARKDOWN_FILENAME="test-dx2xd7.md"
    - Provides create_feature_288_markdown_file(repo_path: str | None = None) entry point
    - Logs workflow progress via structlog

  **Dependency Chain:**
  - Feature module calls content_generators.generate_markdown_content()
    → Calls sheep.config.llm.get_reasoning_llm() to access Claude API
    → Generates H1 heading + 2-3 sentences of prose
  - Feature module calls content_generators.write_markdown_file()
    → Uses pathlib.Path.write_text(encoding='utf-8') for file creation
    → Ensures Unix LF line endings
  - Feature module calls content_generators.validate_markdown_file()
    → Binary validation (checks for UTF-8 BOM, CRLF sequences)
    → Structure validation (H1 heading present, 2-3 sentences)
  - Feature module calls content_generators.commit_markdown_file()
    → Uses sheep.tools.GitCommitTool for staging and conventional commit
  - Feature module calls content_generators.push_markdown_file()
    → Uses sheep.tools.GitPushTool for remote push with upstream tracking

  **Why This Approach:**
  The existing content_generators.py module encapsulates proven logic from 287
  prior features. Each function handles error logging, encoding validation, and
  integration with platform infrastructure (structlog, CrewAI). Reusing these
  functions:
  - Minimizes new code (only ~50 lines for orchestration)
  - Reduces bug surface (validation logic already proven)
  - Maintains consistency with 287 precedents
  - Leverages platform observability infrastructure

  ## Key Design Decisions

  ### 1. Reuse Existing Utility Functions (Not Building from Scratch)

  **Chosen:** Call content_generators functions as provided (generate_markdown_content,
  write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file)

  **Why:** The research phase validated that 287 preceding features use identical
  utility functions with proven correctness. These functions encapsulate:
  - Claude API integration with proper error handling
  - Markdown structure validation (H1 heading, sentence count)
  - UTF-8/BOM/CRLF validation
  - Git tool abstraction
  - structlog integration

  Building equivalent logic locally would introduce duplication and risk. Reusing
  established utilities leverages 287 prior validations.

  **Reference:** See research findings section "Orchestration: Feature Module Pattern"
  which documents this as the proven pattern across all prior features.

  ### 2. Validate Before Git Commit

  **Chosen:** Call validate_markdown_file() immediately after write_markdown_file(),
  before commit_markdown_file()

  **Why:** The feature specification explicitly resolves this decision to "Validate
  before commit" with rationale: "ensure data quality and catch potential encoding
  or formatting issues early." This prevents committing invalid files.

  The validate_markdown_file() function performs comprehensive checks:
  - H1 heading present at file start
  - 2-3 sentences in prose body
  - UTF-8 encoding without BOM
  - Unix LF line endings (no CRLF)
  - Trailing newline present

  **Reference:** See feature spec openQuestions section which explicitly selects
  this approach.

  ### 3. File I/O: pathlib (Not os.path or Direct open)

  **Chosen:** Use pathlib.Path for all file operations

  **Why:** pathlib is the modern Python standard (PEP 428) and is used consistently
  throughout the Sheep codebase. The content_generators.py module uses pathlib
  exclusively. This provides:
  - Cross-platform path handling
  - Object-oriented API (Path.exists(), Path.write_text())
  - Type safety
  - Established convention matching all 287 prior features

  **Reference:** See research findings technology decisions section on pathlib.

  ### 4. UTF-8 Without BOM, Unix LF Line Endings

  **Chosen:** UTF-8 encoding without Byte Order Mark; Unix LF (\n) line endings only

  **Why:** This is explicitly mandated by the feature specification (NFR-1, NFR-2)
  and validated by content_generators.validate_markdown_file():
  - UTF-8 without BOM: binary check for b'\xef\xbb\xbf' prefix
  - No CRLF: binary check for b'\r\n' sequences
  - Unix LF: standard for repository (Git is configured for LF)

  This is non-negotiable per specification and all 287 prior implementations.

  **Reference:** See research findings technology decisions section on encoding.

  ### 5. Claude API for Content Generation (Not Local Models)

  **Chosen:** Use Claude API via CrewAI framework (sheep.config.llm.get_reasoning_llm())

  **Why:** Claude is the proven standard across all 287 preceding features and
  provides:
  - Highest quality prose generation (essential for test file variety)
  - CrewAI integration with observability (structlog, Langfuse)
  - Configuration management via sheep.config.llm
  - Error handling via CrewAI framework

  Other options (local models, other commercial APIs) were evaluated and rejected
  in research findings.

  **Reference:** See research findings technology decisions section on content generation.

  ### 6. Standalone Feature Module (Not Embedded in Agent/Flow)

  **Chosen:** Create feature_288_markdown_file_creation.py as standalone module
  with create_feature_288_markdown_file() function

  **Why:** All 287 preceding features follow this pattern. It provides:
  - Clear module organization
  - Feature-specific constants (FEATURE_NUMBER, MARKDOWN_FILENAME)
  - Ability to invoke feature independently
  - Flexibility for future feature-specific requirements

  **Reference:** See research findings openQuestions section "Content Generation
  Orchestration: Single Entry Point" which documents this decision.

  ## Implementation Strategy

  **Phase 1 (Foundation):** Create the feature module structure with proper
  metadata and function signature. This establishes the orchestration entry
  point and follows the pattern of feature_280 and other prior implementations.

  **Phase 2 (Orchestration):** Implement the workflow by calling content_generators
  functions in sequence. Each step (generate → write → validate → commit → push)
  is independently tested via TDD, catching errors at each stage.

  **Phase 3 (Integration & Execution):** Execute the complete workflow end-to-end
  and verify the result. Confirm the markdown file is created correctly, has proper
  structure/encoding, is staged and committed, and is pushed to the feature branch.

  **Rationale for Phase Order:**
  - Phase 1 is prerequisite for Phases 2 and 3 (module must exist)
  - Phase 2 builds the workflow step-by-step with testing
  - Phase 3 validates the complete integrated flow
  - No phases can run in parallel; each depends on previous steps

  **Why This Is Simple:**
  The feature reuses existing utilities that are proven by 287 prior features.
  No architectural decisions needed. No new libraries. No testing framework setup.
  The implementation is mechanical orchestration of proven functions.

  **Estimated Timeline:** 15-20 minutes total
  - Module creation: ~3 minutes
  - Workflow implementation: ~8 minutes
  - Testing and execution: ~4-9 minutes

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **API Key Exposure** | ANTHROPIC_API_KEY is managed by sheep.config.llm module; never logged; CrewAI sanitizes error messages before logging |
  | **File Path Traversal** | write_markdown_file() validates filename; rejects paths containing "/" or "\\"; only writes to repository root |
  | **Invalid Markdown Structure** | validate_markdown_file() checks H1 heading, sentence count, encoding, line endings before commit; fails fast if invalid |
  | **Git Configuration Missing** | Git user.name/user.email must be configured (platform prerequisite); GitCommitTool handles errors with logging |
  | **UTF-8 Encoding Issues** | validate_markdown_file() performs explicit UTF-8 validation and checks for BOM; Python's UTF-8 handling is standardized |
  | **CRLF Line Endings** | validate_markdown_file() checks for and rejects CRLF; pathlib writes UTF-8 with Unix LF on Linux (platform default) |
  | **Dependencies Missing** | All required libraries already in pyproject.toml (pathlib is stdlib); no new dependencies added |
  | **Git Operations Fail** | GitCommitTool/GitPushTool abstract git operations with error logging; exceptions are caught and logged at ERROR level |

  ---

  **Implementation approach is proven by 287 identical preceding features.
  No architectural risks or unknowns identified.**
