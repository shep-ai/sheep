content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following a well-established pattern. This feature creates a single test markdown file (`test-652ge1.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 120+ similar test files already existing in the repository as precedents (test-*.md files at
  the root directory). This is a continuation of the markdown-file-creation pattern established in
  features 001-125, with identical requirements and implementation approach. Recent implementations
  (features 121-125) validate that this pattern is well-understood and efficiently executable.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 120+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into:
    - `agents/`: Agent definitions for research, implementation, and review
    - `config/`: Configuration management (settings, LLM factories)
    - `flows/`: Flow definitions for orchestration (code_implementation.py is primary flow)
    - `tools/`: Git and file operation tools
    - `features/`: Feature-specific implementations (feature_XXX_markdown_file_creation.py files)
    - `content_generators.py`: Reusable content generation and file I/O utilities
    - `observability/`: Logging and tracing integration
  - **specs/**: Feature specification directory with numbered subdirectories (specs/126-markdown-file-create/)
  - **tests/**: Test suite for validation
  - **pyproject.toml**: Python project configuration with dependencies and build settings

  ### Architecture Patterns

  **Established Content Generation Pattern** (120+ precedents):
  - Uses `content_generators.py` module with reusable functions:
    - `generate_markdown_content()`: LLM-based generation producing H1 heading + 2-3 sentences
    - `write_markdown_file()`: File I/O with UTF-8 encoding and path validation
    - `validate_markdown_file()`: Format validation (H1 heading, 2-3 sentences, encoding, line endings)
    - `commit_markdown_file()`: Git staging and conventional commit
    - `push_markdown_file()`: Git push with upstream tracking
  - LLM integration via `get_reasoning_llm()` from config.llm module
  - Structured logging via `sheep.observability.logging`

  **Git Workflow Pattern**:
  - Feature branch pre-created as `feat/126-markdown-file-create`
  - Create/validate file in repository root
  - Stage with git add (handled by GitCommitTool)
  - Commit with conventional format: `feat(126): create markdown file test-652ge1.md with prose content`
  - Push to feature branch with upstream tracking
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 101-125):
  - Feature-specific Python files in src/sheep/features/ directory (e.g., feature_126_markdown_file_creation.py)
  - Main function orchestrates the workflow: generate → write → validate → commit → push
  - Dependencies: pathlib, GitCommitTool, GitPushTool, logging
  - Return dictionary with filepath, content, commit_message, push_result
  - Error handling with descriptive logging

  **File Format Pattern** (120+ precedents):
  - Structure: `# Heading\n\n<2-3 sentences>\n`
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix-style LF line endings (not Windows CRLF)
  - Trailing newline required
  - File size typically 400-600 bytes (varies with topic length)
  - H1 markdown heading on first line
  - Exactly 2-3 sentences of coherent prose (counted by sentence periods)

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **CrewAI**: Agentic framework for orchestrating agent-based workflows
  - **Anthropic Claude LLM**: Used via CrewAI's LLM integration for content generation
  - **pathlib**: Python standard library module for file I/O and path operations
  - **Git**: Version control system; file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content
  - **Python standard library**: Path, logging, string operations

  ## Product Decisions

  Three key product decisions apply consistently across all 120+ similar features:

  1. **Prose topic**: Implementer has full flexibility to choose any topic ("about anything" per user query)
  2. **Sentence requirement**: Exactly 2-3 sentences (hard constraint for consistency)
  3. **File size**: 400-600 bytes is typical guideline; natural variation acceptable based on topic and prose

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-652ge1.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-125; no branch/merge complexity, no destructive operations |
  | src/sheep/features/ | Low | May add feature_126_markdown_file_creation.py if using feature-specific implementation pattern, but reuses content_generators.py utilities |
  | src/sheep/content_generators.py | None | Feature implementation uses existing functions; no modifications to this module required |
  | Source Code (general) | None | Feature is purely file creation; does not depend on or impact any other source code in /src/sheep/ |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **LLM API**: Anthropic Claude API access configured via ANTHROPIC_API_KEY environment variable
  - **content_generators.py**: Existing reusable functions for markdown generation, file I/O, validation, and git operations
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **CrewAI LLM framework**: Already integrated in project; get_reasoning_llm() available from config.llm module
  - **Established pattern**: 120+ test files provide clear precedent for content format, structure, and validation requirements

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~3-5 minutes (LLM call via existing generate_markdown_content())
  - **File creation and validation**: ~2-3 minutes (write_markdown_file() + validate_markdown_file())
  - **Git workflow**: ~2-3 minutes (commit_markdown_file() + push_markdown_file() using existing tools)
  - **Feature integration**: ~2-5 minutes (optional feature-specific Python file if following pattern)
  - **Total estimate**: 10-20 minutes of actual work

  **Justification**:
  - Well-established pattern with 120+ identical test files and 5 recent feature implementations (121-125) validating the approach
  - Reusable content_generators.py module provides all required functionality (content generation, validation, git operations)
  - No research, architectural decisions, or testing required
  - Single file creation with straightforward, well-understood format (H1 heading + 2-3 sentences)
  - No modifications to source code, configuration, or dependency structure
  - Recent commits (features 121-125) demonstrate efficient completion of identical features in 10-20 minutes
  - LLM-based content generation is non-deterministic but reliable (validated by 120+ precedents)

  ---

  _Analysis phase complete — proceeding to implementation planning_
