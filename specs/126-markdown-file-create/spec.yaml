content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following a well-established pattern. This feature creates a single test markdown file (`test-652ge1.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git
  integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 120+ similar test files already existing in the repository as precedents (test-*.md files at
  the root directory). This is a continuation of the markdown-file-creation pattern established in
  features 001-125, with identical requirements and implementation approach. Recent implementations
  (features 121-125) validate that this pattern is well-understood and efficiently executable.

  ## Success Criteria

  - [ ] File `test-652ge1.md` created in repository root directory
  - [ ] File contains H1 markdown heading (single `#` followed by title text) on first line
  - [ ] File contains exactly 2-3 sentences of coherent prose content after blank line
  - [ ] File is encoded as UTF-8 without Byte Order Mark (BOM)
  - [ ] File uses Unix-style LF line endings (not Windows CRLF)
  - [ ] File has trailing newline at end
  - [ ] File size within 400-600 byte typical range (natural variance acceptable)
  - [ ] File committed to feature branch with conventional commit message format: `feat(126): create markdown file test-652ge1.md with prose content`
  - [ ] File pushed to `feat/126-markdown-file-create` branch
  - [ ] Git history shows commit with correct scope and message
  - [ ] Feature implementation follows established pattern from features 121-125
  - [ ] All validation checks pass (H1 heading, sentence count, encoding, line endings)

  ## Functional Requirements

  - **FR-1**: Generate markdown content comprising one H1 heading and 2-3 sentences of prose using Claude LLM via Anthropic API
  - **FR-2**: Create markdown file at repository root with exact filename `test-652ge1.md`
  - **FR-3**: Write file content with UTF-8 encoding and no Byte Order Mark (BOM)
  - **FR-4**: Ensure file uses Unix-style LF line endings (LF, not CRLF)
  - **FR-5**: Include trailing newline at end of file
  - **FR-6**: Validate markdown structure: H1 heading on line 1, blank line 2, prose content lines 3+
  - **FR-7**: Validate markdown content: exactly 2-3 sentences (counted by sentence-ending periods)
  - **FR-8**: Stage file with `git add` command
  - **FR-9**: Commit file to feature branch with conventional commit message: `feat(126): create markdown file test-652ge1.md with prose content`
  - **FR-10**: Push committed file to `feat/126-markdown-file-create` branch with upstream tracking

  ## Non-Functional Requirements

  - **NFR-1**: File generation time should not exceed 5 minutes (LLM call + file operations)
  - **NFR-2**: Content generation must use Anthropic Claude API with ANTHROPIC_API_KEY environment variable
  - **NFR-3**: Implementation must reuse functions from `src/sheep/content_generators.py` module
  - **NFR-4**: No modifications to source code files in `src/sheep/` beyond feature-specific file creation
  - **NFR-5**: No modifications to configuration files or dependency structure
  - **NFR-6**: File operations must be idempotent (safe to re-run if interrupted)
  - **NFR-7**: Error handling must log descriptive messages for debugging and tracing
  - **NFR-8**: Implementation must follow consistent patterns observed in features 121-125

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should implementation use existing utilities or custom code? | Use existing utilities (content_generators.py) | Consistency with 120+ precedents, proven code reuse, aligns with features 121-125 |
  | 2 | What file size range is acceptable? | 400-600 bytes typical with natural variance | Balances consistency with quality; natural variation emerges from well-written prose |
  | 3 | How strictly should sentence count be enforced? | Strictly enforce exactly 2-3 sentences | Explicit user requirement and hard constraint in established pattern across 120+ files |
  | 4 | Should we create feature-specific file? | Yes, create feature_126_markdown_file_creation.py | Maintains consistency with features 121-125, improves organization and traceability |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-652ge1.md) to existing collection of 120+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 121-125; no branch/merge complexity, no destructive operations |
  | src/sheep/features/ | Low | Creates feature_126_markdown_file_creation.py following established pattern, but reuses content_generators.py utilities with no modifications |
  | src/sheep/content_generators.py | None | Feature implementation uses existing functions; no modifications to this module required |
  | Source Code (general) | None | Feature is purely file creation; does not depend on or impact any other source code in /src/sheep/ |
  | Specs Directory | Low | Updates this spec.yaml file as part of requirements phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/126-markdown-file-create` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **LLM API**: Anthropic Claude API access configured via ANTHROPIC_API_KEY environment variable
  - **content_generators.py**: Existing reusable functions for markdown generation, file I/O, validation, and git operations
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **CrewAI LLM framework**: Already integrated in project; get_reasoning_llm() available from config.llm module
  - **Established pattern**: 120+ test files provide clear precedent for content format, structure, and validation requirements

  ## Size Estimate

  **S** (Small — approximately 10-20 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~3-5 minutes (LLM call via existing generate_markdown_content())
  - **File creation and validation**: ~2-3 minutes (write_markdown_file() + validate_markdown_file())
  - **Git workflow**: ~2-3 minutes (commit_markdown_file() + push_markdown_file() using existing tools)
  - **Feature integration**: ~2-5 minutes (create feature-specific Python file following established pattern)
  - **Total estimate**: 10-20 minutes of actual work

  **Justification**:
  - Well-established pattern with 120+ identical test files and 5 recent feature implementations (121-125) validating the approach
  - Reusable content_generators.py module provides all required functionality (content generation, validation, git operations)
  - No research, architectural decisions, or testing required
  - Single file creation with straightforward, well-understood format (H1 heading + 2-3 sentences)
  - No modifications to source code, configuration, or dependency structure
  - Recent commits (features 121-125) demonstrate efficient completion of identical features in 10-20 minutes
  - LLM-based content generation is non-deterministic but reliable (validated by 120+ precedents)
