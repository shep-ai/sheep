content: |
  ## Architecture Overview

  Feature 126 follows the well-established markdown file creation pattern from features 121-125.
  The implementation is a feature-specific orchestration module that composes existing utilities
  from `content_generators.py`:

  - **generate_markdown_content()**: LLM-based content generation with H1 heading and 2-3 sentences
  - **write_markdown_file()**: UTF-8 file I/O with no BOM and Unix LF line endings
  - **validate_markdown_file()**: Comprehensive validation (H1, blank line, sentence count, encoding, line endings)
  - **commit_markdown_file()**: Git staging and commit with conventional message support
  - **push_markdown_file()**: Push to remote with upstream tracking

  The feature module creates an entry point function that orchestrates these utilities in sequence,
  adding feature-specific logging for observability and error handling for robustness. This approach
  ensures consistency with 120+ precedent files and the proven pattern from features 121-125.

  ### Why This Architecture

  - **Reuse over Custom Code**: All functionality already exists and is battle-tested across 120+ features
  - **Consistency**: Follows exact pattern from feature 121, enabling clear precedent and reduced cognitive load
  - **Observability**: Feature-specific logging at each step enables tracing and debugging
  - **Maintainability**: Clear separation of concerns (orchestration vs. utilities) makes future changes easy
  - **No New Dependencies**: Uses existing project infrastructure (CrewAI, Claude API, Git tools)

  ## Key Design Decisions

  ### 1. Leverage Existing Utilities (NOT Custom Implementation)

  **Decision**: Compose existing functions from `content_generators.py` rather than writing custom code.

  **Alternatives Considered**:
  - Custom implementation with duplicate logic → Rejected: Creates maintenance burden, diverges from 120+ precedent
  - Generic `create_markdown_file()` function → Rejected: Loses feature-specific commit message and logging

  **Rationale** (from research):
  The five functions in `content_generators.py` are proven across 120+ identical features with
  comprehensive validation, error handling, and encoding support already implemented. Feature 121
  demonstrates that composing these utilities directly enables feature-specific commit messages
  (e.g., `feat(126): Create test-652ge1.md...`) and per-step logging without code duplication.
  This is the clear, proven approach.

  ### 2. Feature-Specific Module Organization

  **Decision**: Create `src/sheep/features/feature_126_markdown_file_creation.py` with metadata
  constants and orchestration function.

  **Rationale** (from research):
  Feature 121's implementation shows this provides clear separation of concerns, enables
  feature-specific logging and observability, maintains consistency with features 121-125,
  and improves maintainability. The ~50-line overhead is minimal compared to organization benefits.

  ### 3. LLM Content Generation Strategy

  **Decision**: Use Claude 3.5 Sonnet via `get_reasoning_llm()` from `sheep.config.llm`.

  **Rationale** (from research):
  This function is already integrated, pre-configured with temperature=0.2 for consistent prose,
  and validated across 120+ features. No custom LLM setup needed—just call the existing
  `generate_markdown_content()` utility which uses it.

  ### 4. Git Integration Pattern

  **Decision**: Use `GitCommitTool` and `GitPushTool` via `commit_markdown_file()` and
  `push_markdown_file()` with custom commit message.

  **Rationale** (from research):
  These functions already integrate with the sheep.tools framework for observability and error
  handling. The `custom_message` parameter in `commit_markdown_file()` enables the spec-required
  commit format: `feat(126): Create test-652ge1.md with prose content`.

  ### 5. Strict Sentence Count Validation

  **Decision**: Enforce exactly 2-3 sentences via period counting (already implemented in
  `validate_markdown_file()`).

  **Rationale** (from research):
  This is an explicit user requirement and hard constraint in the established pattern across
  120+ features. The existing validation in `content_generators.py` (lines 94-98) handles this
  via period-based counting, which is proven reliable for the generated prose structure.

  ## Implementation Strategy

  ### Phase 1: Module Foundation (5 min)
  - Create `src/sheep/features/feature_126_markdown_file_creation.py`
  - Add module docstring explaining the feature
  - Define feature metadata constants (FEATURE_NUMBER=126, MARKDOWN_FILENAME="test-652ge1.md")
  - Import required utilities and logging

  **Why First**: Establishes the structure everything else builds on. Quick to complete.

  ### Phase 2: Orchestration & Integration (10 min)
  - Implement `create_feature_126_markdown_file()` entry point function
  - Orchestrate utility calls: generate → write → validate → commit → push
  - Add comprehensive logging at each step
  - Include proper error handling with descriptive messages

  **Why Second**: Composes the utilities in the right order. All utilities already exist,
  so this is mostly wiring them together.

  ### Phase 3: Testing & Verification (5-10 min)
  - Write unit test to verify orchestration function returns expected structure
  - Write integration test to verify complete workflow
  - Manually verify output file format and git operations

  **Why Last**: Tests verify that implementation meets all requirements. Manual verification
  confirms git workflow and output format.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates invalid content | `generate_markdown_content()` validates content before returning; if invalid, retries automatically (handled by utility) |
  | File encoding issues | `write_markdown_file()` uses UTF-8 explicit encoding; `validate_markdown_file()` verifies no BOM and checks for CRLF |
  | Incorrect sentence count | `validate_markdown_file()` counts periods and raises ValueError if not 2-3; prevents invalid files from being committed |
  | Git workflow fails | `commit_markdown_file()` and `push_markdown_file()` use GitCommitTool/GitPushTool with framework error handling |
  | File already exists | `write_markdown_file()` will overwrite if file exists; this is acceptable for feature branches |
  | Missing ANTHROPIC_API_KEY | `get_reasoning_llm()` will raise clear error if API key not configured; prevents silent failures |

  ## Summary

  Feature 126 is a minimal-effort implementation that reuses proven utilities and follows
  the established pattern from features 121-125. The only new code is a ~50-line feature module
  that orchestrates existing functions. No custom implementation needed. Estimated effort: 20 minutes.
