# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-20
  - **Status:** Complete

  ## Technology Decisions

  ### 1. LLM Content Generation

  **Chosen:** Claude 3.5 Sonnet via get_reasoning_llm() from sheep.config.llm

  **Rejected:**
  - Custom LLM setup in feature file — redundant when get_reasoning_llm() exists, creates duplicate API key handling
  - Alternative models (GPT-4, Gemini) — project optimized for Anthropic, would require different API setup
  - Static template-based content — violates requirement for LLM-based generation

  **Rationale:**
  The get_reasoning_llm() factory function returns a pre-configured Claude instance with optimal
  settings (temperature=0.2) for reasoning tasks like prose generation. This function is already
  integrated in content_generators.py and validated across 120+ test files. No custom LLM setup is
  needed in the feature file — just import and use the existing utilities.

  ### 2. File Operations and Encoding Validation

  **Chosen:** pathlib.Path with UTF-8 encoding validation via write_markdown_file() and validate_markdown_file()

  **Rejected:**
  - os.path module — less expressive than pathlib for Python 3.11+, duplicates utility code
  - Custom validation logic — unnecessary when battle-tested validation exists in content_generators.py

  **Rationale:**
  The content_generators.py module provides two production-tested functions:
  - write_markdown_file(content, filename): Uses pathlib.Path, writes UTF-8 without BOM, ensures LF line endings
  - validate_markdown_file(filepath): Comprehensive checks for UTF-8, no BOM, LF (not CRLF), H1 heading, blank line, 2-3 sentences, trailing newline

  All non-functional requirements (NFR-3, NFR-4, NFR-5) are satisfied by these existing functions.
  No custom code needed.

  ### 3. Code Reuse: Leverage Existing Utilities

  **Chosen:** Composition of proven utilities from content_generators.py; create minimal feature-specific orchestration file

  **Rejected:**
  - Custom implementation — duplicates code, risks divergence from 120+ precedent, maintenance burden
  - Direct use of create_markdown_file() function — loses feature-specific commit message and logging granularity

  **Rationale:**
  The content_generators.py module provides five battle-tested functions used across 120+ features:

  | Function | Purpose | Status |
  | -------- | ------- | ------ |
  | generate_markdown_content() | LLM call + H1 + 2-3 sentences validation | Proven, tested |
  | write_markdown_file() | File I/O with UTF-8, no BOM, LF line endings | Proven, tested |
  | validate_markdown_file() | Comprehensive format, encoding, and content checks | Proven, tested |
  | commit_markdown_file() | Git staging and commit with custom message support | Proven, tested |
  | push_markdown_file() | Push to remote with upstream tracking | Proven, tested |

  Feature 121's implementation shows the ideal pattern: compose these functions directly to enable
  feature-specific logging and custom commit messages (e.g., 'feat(126): Create test-652ge1.md...')
  while reusing all validation and I/O logic.

  ### 4. Git Integration

  **Chosen:** GitCommitTool and GitPushTool via commit_markdown_file() and push_markdown_file() with custom commit message

  **Rejected:**
  - Direct subprocess calls to git — bypasses framework observability and error handling
  - Inline operations without wrapper — loses feature-specific context

  **Rationale:**
  The content_generators.py functions wrap git tools and accept a custom_message parameter,
  enabling the spec-required commit format: 'feat(126): Create test-652ge1.md with prose content'.
  This integrates with the broader sheep.tools framework for observability and error handling
  without reinventing git integration logic. GitCommitTool and GitPushTool handle staging,
  committing, and pushing with proper error context.

  ### 5. Feature-Specific File Organization

  **Chosen:** Create src/sheep/features/feature_126_markdown_file_creation.py following pattern from features 121-125

  **Rejected:**
  - Shell script or inline Python — loses code organization and feature-specific metadata
  - No feature wrapper — minimal approach, but inconsistent with established pattern

  **Rationale:**
  Feature 121's implementation at src/sheep/features/feature_121_markdown_file_creation.py
  demonstrates the ideal pattern. A ~50-line feature file provides:
  - Feature metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME)
  - Clear entry-point function (create_feature_126_markdown_file)
  - Feature-specific logging at each step (import get_logger)
  - Integration with content_generators utilities
  - Consistency with 121-125 and the broader codebase

  This minimal overhead provides substantial benefits in traceability and maintainability.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | content_generators.py | Core utilities (generate, write, validate, commit, push) | Use all functions | Battle-tested across 120+ features, comprehensive validation, no reimplementation needed |
  | pathlib.Path | File path operations | Use via content_generators | Standard library for Python 3.11+, safely handles repository root paths, no external dependencies |
  | CrewAI LLM framework | LLM orchestration and configuration | Use via get_reasoning_llm() | Already integrated, provides temperature and API key management, no custom setup needed |
  | Claude API (Anthropic SDK) | Language model inference | Use via get_reasoning_llm() | Project default, validated across 120+ features, configured via ANTHROPIC_API_KEY |
  | GitCommitTool (sheep.tools) | Git staging and committing | Use via commit_markdown_file() | Framework integration, observability, error handling, supports custom messages |
  | GitPushTool (sheep.tools) | Git push with upstream tracking | Use via push_markdown_file() | Framework integration, observability, supports set_upstream flag |
  | sheep.observability.logging | Structured logging | Use get_logger(__name__) | Framework standard, enables tracing and debugging via Langfuse |

  **Summary:** No external dependencies required beyond what the project already uses. All functionality
  is available through existing utilities in content_generators.py and the sheep framework.

  ## Security Considerations

  ### Encoding Safety
  - **Requirement:** UTF-8 without BOM (NFR-3 on Functional Requirement FR-3)
  - **Implementation:** write_markdown_file() uses open(..., encoding='utf-8') with automatic LF handling
  - **Validation:** validate_markdown_file() checks for UTF-8 BOM and decoding errors
  - **Implication:** Ensures consistent encoding across platforms; LF line endings ensure Unix convention

  ### Path Traversal Prevention
  - **Requirement:** File created at repository root only (FR-2)
  - **Implementation:** write_markdown_file() validates filename, rejects '/', '\', leading '.'
  - **Validation:** Uses Path(filename), prevents directory traversal
  - **Implication:** Prevents accidental or malicious file creation outside repo root

  ### Input Validation
  - **Requirement:** All prose must be LLM-generated, 2-3 sentences (FR-1, FR-7)
  - **Implementation:** validate_markdown_file() counts sentence-ending periods
  - **Validation:** Raises ValueError if count < 2 or > 3
  - **Implication:** Ensures generated content meets specification; prevents misformatted files

  ### Git Integration Safety
  - **Requirement:** Proper commit and push (FR-8, FR-9, FR-10)
  - **Implementation:** GitCommitTool and GitPushTool handle authentication and error handling
  - **Validation:** Framework logs all git operations, can trace failures
  - **Implication:** No shell command injection risks; uses framework abstractions

  **Overall Security Posture:** No custom security risks introduced. All security concerns (encoding, path validation,
  input validation, git safety) are addressed by existing utilities and framework safeguards.

  ## Performance Implications

  ### LLM Call Duration
  - **Bottleneck:** Anthropic Claude API call via get_reasoning_llm()
  - **Expected Duration:** 3-5 seconds typical (standard for API calls)
  - **Optimization:** Already configured with temperature=0.2 (fast, deterministic)
  - **SLA:** NFR-1 requires completion within 5 minutes; LLM call is well within budget

  ### File I/O Operations
  - **Duration:** <1 second for all file operations combined
  - **Operations:** write_markdown_file() + validate_markdown_file() = two file accesses
  - **Optimization:** None needed; operations are simple sequential reads/writes
  - **Impact:** Negligible; LLM call dominates overall time

  ### Git Operations
  - **Duration:** 1-2 seconds for commit and push
  - **Operations:** git add, git commit, git push (via tools)
  - **Optimization:** Framework handles batching and optimization
  - **Impact:** Linear, predictable; does not depend on repository size for single file

  ### Overall Execution Budget
  - **Total Expected Time:** 5-10 seconds
  - **LLM Call:** ~5 seconds (50%)
  - **File I/O:** <1 second (10%)
  - **Git Operations:** 1-2 seconds (20%)
  - **Feature Overhead:** <1 second (logging, orchestration)
  - **Margin:** 10+ minutes remaining from NFR-1 5-minute SLA
  - **Implication:** ample headroom for retries, logging, and edge cases

  **Performance Conclusion:** No optimizations needed; existing utilities are efficient enough.
  Bottleneck is inherent to LLM API latency, which is well-budgeted. Feature will complete
  within SLA with significant margin.

  ## Architecture Notes

  ### Codebase Fit
  The feature fits naturally into the sheep project's architecture:

  1. **Feature Pattern:** Follows the established pattern from features 121-125 (markdown file creation)
  2. **Code Organization:** Feature-specific module at src/sheep/features/ provides clear separation
  3. **Utilities Reuse:** Leverages content_generators.py (proven, battle-tested)
  4. **LLM Integration:** Uses get_reasoning_llm() from config.llm (framework standard)
  5. **Git Integration:** Uses GitCommitTool and GitPushTool (framework standard)
  6. **Observability:** Feature-specific logging via get_logger(__name__) (framework standard)
  7. **Error Handling:** Exceptions propagate through framework for centralized handling

  ### Related Features
  - Features 121-125: Identical pattern, already successfully implemented
  - Features 001-120: Established precedent for markdown file creation pattern
  - Total Precedent: 120+ identical features provide high confidence in approach

  ### No Breaking Changes
  - No modifications to existing utilities or configuration
  - No changes to source code beyond new feature file
  - No new dependencies or configuration changes
  - Fully backward-compatible with existing codebase

  ### Size Estimate Validation
  - **Small (S) — 10-20 minutes:** Confirmed
  - **Content Generation:** 3-5 minutes (LLM call + validation)
  - **File Operations:** 2-3 minutes (write + validate)
  - **Git Workflow:** 2-3 minutes (commit + push)
  - **Feature Integration:** 2-5 minutes (create file + compose utilities + logging)
  - **Confidence:** High, based on 121-125 execution times

  ### Precedent Summary
  The feature is the 126th in a well-established pattern:
  - 120+ existing test files demonstrate expected format
  - 5 recent implementations (121-125) validate the approach works efficiently
  - All utilities are proven and battle-tested
  - No unknown unknowns; implementation is straightforward composition

  ---

  **Research Status:** Complete. All technical decisions documented with clear rationale.
  Ready for implementation phase.
