content: |
  ## Task Summary

  Feature 126 implementation is organized across three phases with 8 concrete tasks.

  **Phase 1: Module Foundation (5 min)**
  Creates the feature-specific module file with metadata constants and imports. This is
  foundational — all subsequent tasks build on this structure.

  **Phase 2: Orchestration & Integration (10 min)**
  Implements the entry point function by orchestrating existing utilities in sequence:
  generate content → write file → validate → commit → push. Adds comprehensive logging
  and error handling at each step. All utility functions already exist and are proven
  across 120+ features.

  **Phase 3: Testing & Verification (5 min)**
  Creates unit tests and integration test to verify behavior. Manually executes feature
  to confirm output file format, git workflow, and all specification requirements.

  ## Implementation Approach

  The implementation follows the established pattern from feature 121:

  1. Create feature-specific module (`feature_126_markdown_file_creation.py`)
  2. Compose utilities from `content_generators.py` in sequence
  3. Add feature-specific logging for observability
  4. Include error handling with descriptive messages
  5. Return structured result dictionary
  6. Test thoroughly (unit + integration + manual)

  ## Why This Task Breakdown

  - **Task 1 is independent**: Module skeleton can be created and tested immediately
  - **Tasks 2-5 are sequential**: Each step depends on previous step's output
  - **Tasks 6-8 are testing**: Verify implementation meets all requirements
  - **Small, focused tasks**: Each task is 2-4 minutes, easy to verify completion
  - **Clear dependencies**: No circular dependencies or blocking issues
  - **TDD approach**: RED-GREEN-REFACTOR cycle ensures quality and correctness

  ## Success Criteria for All Tasks

  - Feature function is callable and returns expected structure
  - File test-652ge1.md created with valid content
  - All validation checks pass (H1, sentences, encoding, line endings)
  - Conventional commit message format correct
  - Git push completed
  - All tests pass (unit and integration)
  - Manual verification confirms specification compliance
