content: |
  ## Task Execution Flow

  The implementation follows a simple, sequential workflow:

  1. **Task 1 (File Creation)**: The foundational task. Create test-objvv0.md with proper markdown
     formatting, UTF-8 encoding, Unix line endings, and appropriate file size. This task has no
     dependencies and can be executed first.

  2. **Task 2 (Git Staging)**: Depends on Task 1. Once the file exists with correct content, stage
     it in git. This prepares the file for the commit workflow.

  3. **Task 3 (Git Commit)**: Depends on Task 2. Once the file is staged, create a conventional
     commit with the specified message. This captures the work in git history.

  4. **Task 4 (Git Push)**: Depends on Task 3. Once the commit exists locally, push it to the feature
     branch on the remote repository. This completes the feature and makes it visible to the team.

  ## TDD Strategy

  Each task uses the RED-GREEN-REFACTOR cycle:

  - **RED**: Write tests that verify the initial state and desired outcome
  - **GREEN**: Implement minimal code to make tests pass
  - **REFACTOR**: Clean up, review quality, ensure best practices

  Task 1 includes prose quality review in the refactor phase (manual verification of grammar and
  coherence). Tasks 2-4 focus on git operations, which are straightforward and require no complex logic.

  ## Effort Breakdown

  | Task | Phase | Effort | Rationale |
  | ---- | ----- | ------ | --------- |
  | Task 1: File Creation | Phase 1 | 5min | Prose composition (2-3 sentences) + format verification |
  | Task 2: Git Staging | Phase 2 | 2min | Simple subprocess call + verification |
  | Task 3: Git Commit | Phase 2 | 2min | Standard git commit with conventional message |
  | Task 4: Git Push | Phase 2 | 3min | Push to feature branch; may include network latency |
  | **Total** | | **12min** | **Aligns with size estimate (S = 10-15 min)** |

  ## Success Criteria

  When all tasks are complete:
  - test-objvv0.md exists at repository root with correct formatting and encoding
  - File is staged, committed, and pushed to feature branch
  - Commit message follows conventional format
  - Feature branch is ready for review and merging
  - All tests pass without errors or warnings
