content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern that has been repeated 88+ times. This feature creates a single
  test markdown file (`test-objvv0.md`) at the repository root with a markdown heading as title
  and 2-3 sentences of prose content, demonstrating automated file creation, git staging, conventional
  commit workflows, and branch push operations.

  The feature serves as a minimal, testable unit of work for validating the automated implementation
  system. A clear precedent exists with 88+ identical test files already in the repository (test-*.md
  files at the root directory), enabling straightforward implementation following the established pattern
  from features 069-088.

  ## Success Criteria

  - [ ] File `test-objvv0.md` exists at repository root
  - [ ] File contains valid markdown H1 heading (`# <Title>`) as the title
  - [ ] File contains exactly 2-3 sentences of grammatically correct and coherent prose following the title
  - [ ] File is UTF-8 encoded without BOM
  - [ ] File uses Unix-style line endings (LF, `\n` only — not CRLF)
  - [ ] File size is between 320-600 bytes (following established pattern)
  - [ ] File is staged in git with `git add test-objvv0.md`
  - [ ] Commit created with conventional commit message: `feat(089): create markdown file test-objvv0.md with prose content`
  - [ ] Commit pushed to feature branch `feat/089-markdown-file-creation-ed2730`
  - [ ] Feature branch contains the commit and is ready for review

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-objvv0.md` at the repository root directory using Python pathlib (e.g., `Path("test-objvv0.md").write_text(content)`)
  - **FR-2**: The file must contain a markdown H1 heading on the first line, using the format `# <Title>` (where Title is a descriptive heading)
  - **FR-3**: The file must contain a blank line after the H1 heading, followed by 2-3 sentences of prose content
  - **FR-4**: Prose content must be grammatically correct, coherent, and complete (not fragments or incomplete thoughts)
  - **FR-5**: Topic selection for prose content is flexible — any generic/universal topic is acceptable (e.g., "Why Coffee Shops Are Great for Work", "The Importance of Regular Breaks", "Learning New Skills")
  - **FR-6**: Stage the created file in git using `git add test-objvv0.md`
  - **FR-7**: Create a git commit with conventional commit message format: `feat(089): create markdown file test-objvv0.md with prose content`
  - **FR-8**: Push the commit to the feature branch `feat/089-markdown-file-creation-ed2730` on the remote repository

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be Unix-style LF (`\n`), not Windows-style CRLF (`\r\n`)
  - **NFR-3**: File size must be within the range of 320-600 bytes, consistent with existing test files in the repository
  - **NFR-4**: Implementation must follow the established pattern used in features 069-088 without deviations
  - **NFR-5**: No modifications to existing files or directories (other than the new test-objvv0.md file)
  - **NFR-6**: No changes to source code, configuration files, or project metadata (pyproject.toml, .env, etc.)
  - **NFR-7**: Git operations must use standard git commands (git add, git commit, git push) with no force flags or destructive operations

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose topic selection be completely unrestricted, or should certain topics be excluded? | Completely unrestricted (any generic/universal topic) | Maximizes flexibility and aligns with established pattern across 88+ existing test files which demonstrate varied topics. User query explicitly states "about anything", indicating unrestricted selection is intended. |
  | 2 | How should prose content quality (grammatical correctness, coherence) be validated? | Manual review during implementation | Prose quality is inherently subjective and context-dependent. Automated tools are error-prone; manual review has proven effective across 88+ prior features and ensures quality without unnecessary tooling complexity. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository root**: Contains 88+ test markdown files (test-*.md) following a consistent pattern, created by features 069-088
  - **src/sheep/**: Application source code with modular architecture (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/089-markdown-file-creation-ed2730/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration with dependencies and build metadata
  - **.env.example / .env**: Environment configuration for API keys (OpenAI, Anthropic, Google, Langfuse)
  - **README.md**: Project documentation describing the CrewAI-based agentic platform
  - **Documentation files**: Design pattern and state machine documents (artifacts from prior feature implementations)

  The test markdown files at repository root are artifacts created during feature implementation phases
  and do not form part of the application source code. They serve as simple, repeatable test cases
  for the Sheep automated implementation system.

  ### Architecture Patterns

  **Established Markdown File Creation Pattern** (88+ precedents):
  - Simple file creation using Python pathlib: `Path("test-objvv0.md").write_text(content)`
  - Standard markdown format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM, Unix-style LF line endings (\n)
  - File size typically 320-600 bytes (observed range across existing test files)
  - Topic selection is flexible (generic/universal topics like "Why Coffee Shops Are Great for Work")
  - Prose content must be grammatically correct and coherent

  **Git Workflow Pattern** (consistently applied across features 069-088):
  - Feature branch pre-created with naming convention: `feat/{number}-markdown-file-creation-{slug}`
  - Files created at repository root (no subdirectories)
  - Standard git workflow: `git add <file>` → `git commit -m "feat({number}): ..."` → `git push`
  - Conventional commit format: `feat({number}): create markdown file {filename} with prose content`
  - Commits pushed to feature branch (not merged to main during implementation phase)

  **Modular Application Architecture**:
  - Separation of flows (control structure) and crews (LLM intelligence)
  - Multi-LLM support with factory pattern (OpenAI, Anthropic, Google APIs)
  - Observable execution via Langfuse integration
  - Specialized agents for research, implementation, and review phases
  - File I/O and git operations via dedicated tool modules

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml); supports 3.11-3.12
  - **pathlib (Python standard library)**: Cross-platform file I/O operations for markdown file creation
  - **Git**: Version control system for file staging, commits, and branch operations
  - **Markdown syntax**: Simple format with H1 heading (#) and prose content blocks

