content: |
  ## Problem Statement

  Create a single markdown file named test-8yajvp.md in the repository root with an H1 markdown heading as a title and 2-3 sentences of prose content. This is a straightforward file creation task that serves as a test iteration (131) of the Sheep agentic platform's ability to execute simple file creation and git workflow automation.

  ## Success Criteria

  - [ ] File test-8yajvp.md is created in the repository root
  - [ ] File contains exactly one H1 markdown heading (#) as the title
  - [ ] File contains between 2-3 sentences of coherent prose content
  - [ ] File is valid markdown syntax with no formatting errors
  - [ ] File is staged in git (git add)
  - [ ] File is committed with a conventional commit message (feat(131): Create markdown file test-8yajvp.md)
  - [ ] Commit is pushed to the feature branch (feat/131-test-markdown-file-407ea4)
  - [ ] No unintended side effects: only test-8yajvp.md is created/modified in the working directory

  ## Functional Requirements

  - **FR-1**: Create a markdown file with filename exactly "test-8yajvp.md" in the repository root directory
  - **FR-2**: File must contain an H1 markdown heading (single # followed by title text) as the first line
  - **FR-3**: File must contain 2-3 sentences of prose content following the heading
  - **FR-4**: Stage the created file in git using git add
  - **FR-5**: Create a commit with message following conventional commits format: "feat(131): Create markdown file test-8yajvp.md"
  - **FR-6**: Push the commit to the feature branch (feat/131-test-markdown-file-407ea4)
  - **FR-7**: Verify file creation success before attempting git operations (per openQuestion resolution)

  ## Non-Functional Requirements

  - **NFR-1**: File creation must complete without errors or exceptions; errors must be immediately visible to the platform
  - **NFR-2**: Commit message must follow the conventional commits format observed in related features (feat(NUMBER): Create markdown file FILENAME.md)
  - **NFR-3**: Implementation must prevent unintended side effects (only test-8yajvp.md should be created; no other files modified)
  - **NFR-4**: Git operations (add, commit, push) must execute reliably and report failures clearly
  - **NFR-5**: Feature execution must be idempotent: running multiple times should produce consistent results (or fail with clear conflict/exists errors)
  - **NFR-6**: Prose content must be coherent and well-formed (grammatically correct sentences)

  ## Product Questions & AI Recommendations

  See openQuestions section above for structured decision points. All three questions have been resolved with AI-recommended defaults:

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | File validation before commit? | Validate file creation | Test features need visibility into failures; validates platform reliability |
  | 2 | Prose content approach? | Implementation chooses content | Spec says "about anything"; simpler and allows natural variety |
  | 3 | Error handling strategy? | Fail immediately with visible errors | Errors should surface clearly for diagnostics; transient failures unlikely in this simple task |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using CrewAI. The structure includes:

  - **Root level**: Contains numerous test markdown files (100+ files created during features 125-130) and Python helper scripts
  - **src/sheep/**: Core platform code with agents, configuration, flows, observability, and tools
  - **specs/**: Feature specifications directory (131 total feature specs, one per feature)
  - **.github/**: GitHub workflows and configuration
  - **Dockerfile**: Docker configuration for the platform

  This repository is primarily used as a test harness for validating Sheep's ability to automate repetitive file creation tasks consistently.

  ### Architecture Patterns

  The repository follows these patterns:

  - **File Creation Pattern**: Simple markdown files (test-*.md) with H1 heading + 2-3 sentences of prose
  - **Git Workflow**: Features follow git flow - create branch, make changes, commit, push
  - **Specification-Driven**: Each feature has a spec.yaml file defining requirements
  - **Repetitive Testing**: Features 125-131 all follow the identical pattern, testing platform reliability at scale
  - **No Code Architecture**: This test repository intentionally avoids code changes; it's purely about file I/O and git operations

  ### Relevant Technologies

  - **Python**: File operations (pathlib, file I/O) for creating markdown files
  - **Git**: Version control operations (staging, committing, pushing) via git commands
  - **Markdown**: Simple plaintext format for content files
  - **CrewAI**: Underlying framework used by Sheep platform

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root repository directory | High | A new markdown file (test-8yajvp.md) will be created in the repository root, following the pattern of 130+ existing test files |
  | Git workflow (add/commit/push) | Medium | Standard git operations will be performed: staging the new file, creating a conventional commit, and pushing to the feature branch |
  | File system I/O | High | Implementation requires Python file operations to create and write the markdown file with proper formatting |
  | Platform test coverage | Low | This feature contributes to overall platform test coverage by exercising file creation and git workflows |

  ## Dependencies

  **No external dependencies** — This feature depends on capabilities already present in the Sheep platform and test repository:

  1. **File Creation** - Python's built-in pathlib and file I/O (already used in features 125-130)
  2. **Markdown Generation** - Simple string formatting (no markdown libraries required)
  3. **Git Integration** - Existing git tools and workflows established in the repository
  4. **Content Generation** - Can use simple prose generation matching the pattern from existing test-*.md files

  The feature follows the established pattern used in features 125-130, so no new dependencies or utilities need to be created.

  ## Size Estimate

  **S** — This is a small task requiring only a few hours of work.

  **Justification:**
  - Simple, repetitive task: Create a markdown file with a title and 2-3 sentences
  - Follows an established pattern repeated 6+ times in preceding features (125-130)
  - No code changes, architectural modifications, or testing framework updates needed
  - Existing repository infrastructure (file I/O, git tools, workflows) handles all heavy lifting
  - No dependencies to resolve or integrate
  - Straightforward implementation: generate content → write to file → stage → commit → push
  - Estimated effort: File creation (<5 min), content generation (<10 min), git operations (<10 min) = ~25 minutes of active work
