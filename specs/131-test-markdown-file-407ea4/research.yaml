content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-20
  - **Status:** Ready for implementation planning

  ## Technology Decisions

  ### 1. Content Generation Strategy

  **Chosen:** Use existing LLM-based `generate_markdown_content()` function from `sheep.content_generators` module.

  **Why this approach:**
  - The codebase already has a proven function used in features 125-127 that generates coherent H1 + 2-3 sentence prose via Claude API/CrewAI
  - Validates output format before returning (checks H1 heading, sentence count, text length)
  - Creates natural variety across 131+ test files without management overhead
  - Integrates with existing LLM configuration and API infrastructure
  - Spec explicitly resolves \"Implementation chooses content\" resolution in openQuestion #2

  **Alternative approaches rejected:**
  - Static/hardcoded prose: Reduces file variety and does not exercise LLM integration
  - Template-based: Adds unnecessary abstraction when LLM approach already proven
  - Content rotation from pool: Adds configuration overhead without clear benefit

  ### 2. File I/O Implementation

  **Chosen:** Use Python pathlib.Path with existing `write_markdown_file()` helper function.

  **Key implementation details:**
  - Filename validation: Prevents path traversal attacks (checks for `/`, `\`, leading `.`)
  - UTF-8 encoding with explicit no-BOM requirement
  - File existence verification immediately after write
  - Non-empty file check (prevents silent 0-byte failures)
  - Repository root path resolution via `Path.cwd()`
  - Clear error messages with file path and size information

  **Why this approach:**
  - Pathlib is Pythonic, modern, and already used in codebase
  - Existing helper function is battle-tested in 6+ prior features
  - Integrates safely with file system and git operations
  - Less error-prone than raw `open()` or `os` module approaches

  ### 3. File Validation

  **Chosen:** Validate immediately after file write, before git operations.

  **Validation checks performed by `validate_markdown_file()`:**
  - H1 heading: Starts with `# ` (single space required)
  - Blank line separator: Second line must be empty
  - Prose structure: Exactly 2-3 sentences (validated by period count)
  - Encoding: Valid UTF-8, no BOM bytes
  - Line endings: Uses LF (not CRLF), Unix convention
  - Trailing newline: File ends with `\n` character
  - File existence: Actually exists on disk (not just returned path)

  **Why early validation:**
  - Spec explicitly resolves openQuestion #1 to validate file creation
  - Detects I/O failures immediately, before expensive git operations
  - Provides clear, actionable error messages for diagnostics
  - Aligns with NFR-1: \"File creation must complete without errors; errors immediately visible\"
  - Improves platform reliability testing by exposing encoding/format issues early

  ### 4. Git Operations

  **Chosen:** Use existing `GitCommitTool` and `GitPushTool` from `sheep.tools.git_tools` via helper functions.

  **Implementation flow:**
  1. `commit_markdown_file()`: Stages changes with `git add` and commits with conventional message
  2. `push_markdown_file()`: Pushes to remote with `-u` upstream tracking
  3. Both use subprocess.run() with `check=True` for immediate error detection

  **Why this approach:**
  - Avoids external dependency (GitPython not used in codebase)
  - Subprocess approach is reliable and used throughout features 125-130
  - Error handling is immediate and transparent (no retries or masking)
  - Integrates with existing git tools infrastructure
  - Commit messages are conventional format with feature number for traceability

  ### 5. Commit Message Format

  **Chosen:** `feat(131): Create markdown file test-8yajvp.md`

  **Message structure:**
  - Type: `feat` (feature type)
  - Scope: `131` (feature number for traceability)
  - Subject: `Create markdown file test-8yajvp.md` (concise, descriptive)

  **Why this format:**
  - Follows conventional commits specification
  - Consistent with git log patterns in repository (features 125-130)
  - Includes feature number for cross-referencing with spec
  - Subject line stays under 50 characters (best practice)
  - Aligns with team conventions established in prior features

  ### 6. Error Handling Strategy

  **Chosen:** Fail immediately with clear error messages; no retry logic.

  **Error handling approach:**
  - Exceptions propagate up with descriptive context
  - Logging captures error details for troubleshooting
  - No silent failures or recovery attempts
  - Errors are immediately visible to platform and user

  **Why this approach:**
  - Spec explicitly resolves openQuestion #3 to \"Fail immediately with errors visible\"
  - Transient failures unlikely for simple local file + git operations
  - Test features should expose issues clearly, not mask them
  - Aligns with NFR-1 and NFR-4: immediate error visibility and clear reporting
  - Simpler implementation without retry complexity

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | ------------ | ------- | -------- | --------- |
  | pathlib (stdlib) | File path handling and I/O | Use | Built-in, Pythonic, cross-platform; already used in codebase |
  | CrewAI | LLM orchestration framework | Use (existing) | Already configured in project; provides structured LLM access |
  | Claude API | Content generation | Use (via CrewAI) | Powers `generate_markdown_content()`; existing API integration |
  | subprocess (stdlib) | Git command execution | Use | Reliable, lightweight; used by GitCommitTool and GitPushTool |
  | GitPython | Git library wrapper | Do Not Use | Not used in codebase; subprocess approach is established |
  | write_markdown_file() | Helper for file writing | Use (existing) | Already implements validation and error handling |
  | validate_markdown_file() | File format validation | Use (existing) | Comprehensive checks for markdown format, encoding, line endings |
  | generate_markdown_content() | LLM-based prose generation | Use (existing) | Proven in features 125-127; integrates LLM infrastructure |
  | commit_markdown_file() | Git commit wrapper | Use (existing) | Handles staging and conventional message formatting |
  | push_markdown_file() | Git push wrapper | Use (existing) | Handles upstream tracking and remote configuration |

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** The `write_markdown_file()` function validates filenames to prevent path traversal attacks by checking for `/`, `\`, and leading `.` characters. This ensures the file is created only in the repository root.
  - **Encoding safety:** UTF-8 encoding is enforced with no BOM, preventing encoding-based injection or confusion attacks.

  ### File System Safety
  - **Race conditions:** File is verified to exist immediately after write; no window for interference.
  - **Permissions:** Uses standard file I/O with inherited directory permissions; no special permission elevation required.

  ### Git Operations
  - **Command injection:** Uses subprocess.run() with list arguments (not shell=True), preventing shell injection.
  - **Credential handling:** Git credentials use existing SSH keys or configured git authentication; no credentials stored in code.

  ### Content Generation
  - **LLM output validation:** Generated markdown is validated before file write, ensuring format compliance before touching filesystem.
  - **No user input:** Content is LLM-generated, not user-supplied, eliminating injection attack vectors.

  ## Performance Implications

  ### Expected Performance Profile
  - **Content generation:** ~2-5 seconds (LLM API call latency)
  - **File write:** <100ms (local I/O)
  - **File validation:** <50ms (regex pattern matching on file content)
  - **Git operations:** 1-10 seconds (network latency for push)
  - **Total workflow:** ~5-15 seconds end-to-end (dominated by LLM and git network latency)

  ### Performance Considerations
  - **No caching:** Each file generation calls LLM fresh; intentional to test platform reliability
  - **No batch operations:** Files are created one at a time per feature; batch creation not needed
  - **Validation overhead:** Minor (<50ms); good trade-off for error detection
  - **Git operations:** Push latency depends on network; no optimization available at feature level

  ### Scalability Notes
  - **File count:** Creating 131+ markdown files in repository root is scalable (filesystem handles millions of files)
  - **Repository size:** Each file ~400-600 bytes; 131 files = ~60KB total (negligible overhead)
  - **Git history:** Each commit is small (single file); no impact on git performance

  ## Architecture Notes

  ### Integration with Sheep Platform

  This feature follows the established pattern from features 125-130 within the Sheep agentic platform:

  1. **No architectural changes:** The feature uses existing sheep.content_generators and sheep.tools.git_tools infrastructure
  2. **Module organization:** Implementation lives in `src/sheep/features/feature_131_markdown_file_creation.py` following convention
  3. **Dependency chain:** Feature orchestration function → content generation (LLM-based) → file I/O with validation → git tools (commit + push)
  4. **Error propagation:** Exceptions bubble up with context for platform error handling
  5. **Logging integration:** Uses existing logger infrastructure (`sheep.observability.logging.get_logger()`)

  ### Codebase Patterns Followed

  - **Feature metadata constants:** FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME defined at module level
  - **Main entry point:** `create_feature_131_markdown_file(repo_path=None)` function matching feature 127 signature
  - **Workflow orchestration:** Try/except block capturing and logging each step
  - **Return value:** Dictionary with filepath, content, commit_message, push_result
  - **Script execution:** `if __name__ == \"__main__\"` block for direct execution

  ### No Architectural Debt

  This feature is intentionally simple and follows proven patterns:
  - No new dependencies introduced
  - No infrastructure changes required
  - No database or state management needed
  - Uses existing tools and helpers without modification
  - Minimal code duplication (3 lines per feature file unique to feature number/filename)

  ## Validation and Testing Strategy

  ### Pre-Implementation Validation
  - File creation succeeds at repository root
  - Markdown format is valid (H1 heading + 2-3 sentences)
  - Encoding is UTF-8 with no BOM
  - Line endings are Unix LF
  - Trailing newline is present

  ### Git Workflow Validation
  - File is staged (appears in git status)
  - Commit message is properly formatted
  - Push succeeds to remote
  - Branch tracking is set up correctly

  ### Integration Verification
  - Feature executes end-to-end without errors
  - Error messages are clear and actionable
  - File exists and is readable after completion
  - Git log shows proper commit
  - Remote repository reflects pushed commit

  ## Risk Analysis

  ### Low-Risk Areas
  - **File I/O:** Proven approach in 6 prior features; straightforward operation
  - **Git operations:** Existing tools used; established patterns in codebase
  - **Error handling:** Immediate failures are simple and reliable

  ### Potential Issues and Mitigations
  - **LLM API failures:** Would cause immediate exception with clear message; user would retry
  - **Git push failure:** Could fail due to network or permissions; tool already handles with error message
  - **Encoding issues:** Unlikely with explicit UTF-8; validation catches any problems
  - **Path conflicts:** File might already exist; git would catch as modification; okay per non-idempotence NFR-5

  ## Conclusion

  Feature 131 is a straightforward file creation task following a proven pattern from features 125-130. Technical decisions are guided by existing codebase patterns and infrastructure, explicit resolutions in feature spec (openQuestions 1-3), and non-functional requirements (immediate error visibility, validation, clear messages).

  The implementation requires minimal code (~20-30 lines for feature orchestration), leverages existing helper functions, and integrates seamlessly with the Sheep platform's established patterns.
