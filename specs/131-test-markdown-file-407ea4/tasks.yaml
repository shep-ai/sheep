content: |
  ## Summary

  Feature 131 implementation follows a simple 2-task workflow:

  **Task 1: Create Feature Module (1h)** — Write the feature module with orchestration
  function that coordinates 5 sequential steps: (1) Generate markdown via LLM, (2) Write
  file to disk, (3) Validate file format/encoding, (4) Stage and commit to git, (5) Push
  to remote. Write integration test that mocks all external dependencies and verifies
  the orchestration function works end-to-end.

  **Task 2: Execute & Verify (30min)** — Run the feature implementation against the
  actual repository and verify all success criteria: file created at repo root with
  proper H1 heading and 2-3 sentences, valid markdown/encoding, properly staged/committed
  with conventional message, and pushed to remote. Verify no unintended side effects.

  The 2-task structure reflects TDD methodology: Task 1 implements the code with tests
  (RED → GREEN → REFACTOR), and Task 2 performs end-to-end integration verification
  using the actual repository, LLM, and git operations (not mocked).

  All work is contained in Phase 1 (Feature Implementation & Validation) because steps
  are tightly coupled and cannot be parallelized. Sequential execution is required:
  content generation must complete before file write, which must complete before validation,
  which must complete before git operations.
