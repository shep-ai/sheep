content: |
  ## Implementation Flow

  The six tasks execute sequentially in three phases, with dependencies enforcing order:

  **Phase 1: Content Generation (Task 1)**
  - Generate prose via CrewAI: H1 title + 2-3 sentences
  - Validate semantic coherence and length
  - Output: Markdown content string ready for file writing

  **Phase 2: File Creation and Validation (Tasks 2-4)**
  - Write content to test-396h0d.md using pathlib
  - Validate markdown structure: H1, blank line, prose
  - Validate encoding: UTF-8 without BOM, LF line endings, 300-600 bytes
  - Output: Validated file in repository root, ready for commit

  **Phase 3: Git Workflow (Tasks 5-6)**
  - Stage file and commit with conventional message
  - Push to feature branch with upstream tracking
  - Output: Commit in feature branch history, ready for pull request

  ## Test-Driven Development Approach

  Each task follows RED-GREEN-REFACTOR:
  1. **RED**: Write test asserting the requirement
  2. **GREEN**: Implement minimal code to pass the test
  3. **REFACTOR**: Clean up, improve naming, ensure quality

  Example (Task 1):
  - RED: `assert "# " in generated_content and generated_content.count(".") in [2, 3]`
  - GREEN: `result = generate_markdown_content(); return result`
  - REFACTOR: Verify output quality and conformance

  ## Dependencies and Sequencing

  - Task 1 is root (no dependencies)
  - Tasks 2 and 3 depend on Task 1 (need generated content)
  - Task 4 depends on Task 3 (validate file after structure check)
  - Task 5 depends on Task 4 (commit only validated files)
  - Task 6 depends on Task 5 (push only committed files)

  Linear progression ensures quality at each stage: generate → write → validate structure → validate encoding → commit → push.

  ## Validation Checkpoints

  - **Task 1 exit**: Content string with correct structure and length
  - **Task 2 exit**: File created at repo root with correct content
  - **Task 3 exit**: Markdown structure validated (H1, blank, prose)
  - **Task 4 exit**: Encoding and properties validated (UTF-8, LF, 300-600 bytes)
  - **Task 5 exit**: File committed with conventional message
  - **Task 6 exit**: Commit pushed to feature branch with upstream tracking

  ## Effort Justification

  - **Task 1** (5-7 min): LLM call + validation of output structure/length
  - **Task 2** (5-7 min): File write + path verification
  - **Task 3** (5-7 min): Markdown structural validation (line parsing, sentence counting)
  - **Task 4** (5-7 min): Binary encoding validation (BOM/CRLF checks, size check)
  - **Task 5** (5-7 min): Git staging and commit with message verification
  - **Task 6** (5-7 min): Git push with upstream tracking setup

  Total: 40-50 minutes. Breakdown aligns with feature size estimate (S: 10-15 min implementation in production, 40-50 min in test-driven environment with detailed validation).
