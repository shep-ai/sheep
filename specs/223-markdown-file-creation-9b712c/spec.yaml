# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository contains a series of simple markdown files created as test content. This feature
  is part of an ongoing pattern where new markdown files are added to the repository root with
  minimal content: a title and a few sentences. The task is to create one more such file,
  named `test-oklxm1.md`, following the established conventions observed in recent similar
  features (features 219-222).

  ## Functional Requirements

  - **FR-1**: File named `test-oklxm1.md` must be created at the repository root (no subdirectories)
  - **FR-2**: File must contain exactly one H1 heading (Markdown syntax: `# Title`) as the first content line
  - **FR-3**: File must contain 2-3 sentences of prose content following the H1 heading
  - **FR-4**: Prose content must be coherent, grammatically correct, and self-contained
  - **FR-5**: Content may address any topic (implementation has full discretion on subject matter)
  - **FR-6**: All content must use valid GitHub Flavored Markdown (GFM) syntax
  - **FR-7**: File must be committed to the feature branch with a conventional commit message

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 (no BOM)
  - **NFR-2**: Line endings must use Unix LF format only (no CRLF or CR)
  - **NFR-3**: No other files in the repository may be modified or created by this feature
  - **NFR-4**: File size must be approximately 400-600 bytes (~80-150 words)
  - **NFR-5**: No changes to source code, build system, configuration files, or existing documentation
  - **NFR-6**: Implementation must follow the established pattern from features 219-222 with consistency

  ## Success Criteria

  - [ ] File `test-oklxm1.md` exists at repository root (git status shows only this file as added)
  - [ ] File begins with exactly one H1 heading line (format: `# <title>`)
  - [ ] H1 heading is followed by a blank line
  - [ ] File contains 2-3 complete sentences of prose (word count: 80-150 words)
  - [ ] All Markdown syntax is valid (no unclosed formatting, valid link syntax, etc.)
  - [ ] Content is coherent and self-contained (readable without external context)
  - [ ] File uses UTF-8 encoding (verifiable with file command)
  - [ ] File uses Unix LF line endings (verifiable with git diff or hexdump)
  - [ ] Only `test-oklxm1.md` is staged and committed (no other file modifications)
  - [ ] Commit message follows conventional commits format (e.g., `feat(223): Create test-oklxm1.md`)
  - [ ] Feature branch contains only this commit (no extraneous commits)

  ## Product Decisions

  **No open product questions.** The specification is fully defined:
  - Filename, location, and structure are explicit
  - Content scope is clear ("any topic" with full implementer discretion)
  - Pattern and conventions are established (features 219-222)
  - No ambiguous trade-offs or decision points requiring stakeholder input

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI. The
  repository structure is organized as follows:

  - **Repository Root**: Contains markdown documentation and content files (README.md, ABOUT_ME.md,
    JOKE.md, JOKE2.md, JOKE3.md, JOKE4.md, and various test markdown files like test-atwx74.md,
    test-5vnehe.md, test-hmis8d.md, test-6ess1a.md, etc.)
  - **specs/**: Feature specifications organized by feature number. Each spec directory contains
    YAML files defining the feature requirements (spec.yaml, plan.yaml, research.yaml, tasks.yaml)
  - **src/**: Python source code for the Sheep platform (agents, flows, configuration, tools, CLI)
  - **.github/**: GitHub workflows and configuration (CI pipeline, Dependabot)
  - **.claude/**: Claude-specific configuration files

  ### Content Addition Pattern

  Recent features (219-222) demonstrate an established pattern for simple markdown file creation:
  1. Create a new file at repository root with a `test-*.md` naming convention
  2. File contains a single H1 heading (title) and 2-3 sentences of prose
  3. Content is self-contained, requiring no code changes or existing file modifications
  4. Files are committed with feature-specific commit messages

  ### Relevant Technologies

  - **Markdown**: Standard GitHub Flavored Markdown (GFM) syntax for content files
  - **Git**: Version control for tracking feature implementations and commits

