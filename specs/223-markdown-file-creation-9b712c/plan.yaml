content: |
  ## Architecture Overview

  Feature 223 is a pure content creation task that follows the established pattern
  from 60+ identical features (160-222). The implementation requires:

  1. **File Creation** — Create a single markdown file at repository root using Python
     pathlib with explicit UTF-8 encoding and Unix LF line endings
  2. **Content Structure** — H1 heading (title) followed by a blank line and 2-3
     sentences of prose (total ~400-600 bytes)
  3. **Git Integration** — Stage, commit, and push the file using subprocess with
     conventional commit format
  4. **No Code Changes** — Repository source code (src/), configuration, dependencies,
     and existing files remain unchanged

  This fits the existing codebase pattern as an extension of the feature validation
  workflow. Features 160-222 have proven this exact workflow 60+ times, with consistent
  success using pathlib and subprocess.

  ## Key Design Decisions

  ### 1. File Creation with pathlib (UTF-8 + LF)

  **Decision:** Use Python pathlib `Path.write_text()` with explicit `encoding="utf-8"`
  and `newline="\n"` parameters

  **Rationale:**
  - pathlib is the modern Python standard library (no external dependencies)
  - `encoding="utf-8"` ensures UTF-8 without BOM, satisfying NFR-1
  - `newline="\n"` forces Unix LF line endings on all platforms (Windows, macOS, Linux),
    satisfying NFR-2
  - This exact pattern is proven across features 216-222
  - Raises FileExistsError if file already exists (defensive check)

  **Rejected alternatives:**
  - Direct bash/shell commands — inconsistent with codebase patterns, harder to debug
  - External file libraries (open/write) — less safe, no encoding guarantees
  - Template-based generation — over-engineered for simple 500-byte file

  ### 2. Content Generation (Flexible Topic)

  **Decision:** Flexible/generic prose content (any topic, no thematic constraint)

  **Rationale:**
  - Spec explicitly states "about anything" with full implementer discretion
  - Reduces decision overhead and enables fastest execution
  - Features 219-222 confirm flexible topics are the accepted approach
  - Keeps focus on core feature (file creation, git integration) not content creativity

  **Rejected alternatives:**
  - Thematic content constraint — adds decision burden, conflicts with spec
  - Pre-generated content library — over-engineered for test file
  - Random/procedural generation — adds non-determinism without benefit

  ### 3. Git Integration with subprocess

  **Decision:** Sequential `subprocess.run()` calls with `check=True` for each git
  operation (add → commit → push)

  **Rationale:**
  - Established pattern across all 200+ features in Sheep project
  - `check=True` raises CalledProcessError on non-zero exit (safe error handling)
  - `-u` flag on push sets upstream tracking for feature branch
  - No external git library needed (zero additional dependencies)
  - Cross-platform compatible (subprocess handles platform differences)

  **Rejected alternatives:**
  - GitPython library — adds external dependency (violates NFR-3)
  - Single shell command chain — less safe, harder to isolate failures
  - os.system() — unsafe, deprecated pattern

  ### 4. Minimal Error Handling (No Validation Layer)

  **Decision:** Defensive checks for specific exceptions only: FileExistsError (file I/O),
  OSError (permissions), CalledProcessError (git operations). No validation layer.

  **Rationale:**
  - Spec explicitly requires "No validation layer per spec requirement"
  - Feature 222 (immediate precedent) uses this exact pattern
  - Features 217+ confirm this is the accepted approach for test files
  - Minimal error handling keeps implementation lean (~50 lines) while providing
    meaningful failure diagnostics
  - File encoding and line endings are guaranteed by pathlib parameters, not validated

  **Rejected alternatives:**
  - No error handling — fragile, unclear failure modes
  - Full validation layer (feature 217 pattern) — adds 100+ lines, contradicts spec
  - Generic Exception catching — masks specific error types, harder to debug

  ## Implementation Strategy

  **Overall flow:** Create the file → Stage with git → Commit → Push → Verify success

  **Phase ordering rationale:**

  1. **Phase 1: File Creation & Encoding**
     - Start with file creation because git operations depend on the file existing
     - Use pathlib to create file with guaranteed UTF-8 and LF encoding
     - Test that file structure, encoding, and line endings are correct
     - Minimal implementation enables early validation

  2. **Phase 2: Git Integration & Verification**
     - Implement git workflow (add → commit → push) after file is created
     - Verify all success criteria are met
     - Ensure commit message follows conventional commits format
     - Final checks confirm feature branch state is correct

  **Why this order:** Logical dependency chain (file must exist before git operations,
  git operations must complete before verification). Sequential phases are necessary
  because each depends on the prior phase's output.

  **Execution strategy:**
  - Keep implementation minimal and focused
  - Leverage existing proven pattern from features 160-222
  - Estimated total effort: 10-15 minutes (consistent with "S" size estimate)
  - No integration with Sheep core code required
  - Use standard library only (no dependency changes)

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **File already exists** | FileExistsError check in pathlib.write_text() prevents accidental overwrites |
  | **Incorrect encoding** | Explicit `encoding="utf-8"` parameter guarantees UTF-8 without BOM |
  | **Incorrect line endings** | Explicit `newline="\n"` parameter forces Unix LF on all platforms |
  | **Git not configured** | OSError exception handling provides clear error message if git fails |
  | **File not committed** | CalledProcessError handling for each git operation (add, commit, push) |
  | **Branch tracking not set** | `-u` flag on git push automatically sets upstream tracking |
  | **Accidental modifications** | Spec requires "only this file" to be staged; subprocess operations are atomic |
  | **Performance** | File size (~500 bytes) and single file ensure negligible I/O overhead |
  | **Pattern consistency** | Features 160-222 prove this exact workflow 60+ times |

  ## Rationale for Simplicity

  This feature is intentionally simple because:
  - Spec is fully defined with zero open questions
  - Proven pattern exists across 60+ prior features
  - No code changes, no external dependencies, no integration needed
  - Pure content addition following established conventions
  - Size estimate "S" reflects minimal complexity

  The implementation should remain lean and focused on the core workflow: create file
  with correct encoding → stage → commit → push. No additional complexity, validation
  layers, or features should be added beyond what the spec requires.
