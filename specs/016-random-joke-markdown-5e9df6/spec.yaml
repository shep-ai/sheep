# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The repository has existing joke files (JOKE.md, JOKE2.md, JOKE3.md) and random content files (RANDOM.txt, RANDOM_WORD.txt). The feature request is to add a **single** markdown file containing a **random** joke — combining both patterns. The joke should be selected randomly at implementation time (or fetched from an API) and written to a new .md file following the established joke format.

  Current limitations:
  - No file yet exists that combines "random" selection with "joke" + "markdown"
  - The exact source of "randomness" (LLM, static list, API) is unspecified

  ## Codebase Analysis

  ### Project Structure

  ```
  sheep/
  ├── src/sheep/
  │   ├── agents/           # AI agents (researcher, implementer, reviewer)
  │   ├── config/           # Settings, LLM factory
  │   ├── flows/            # Code implementation flow (branch → research → implement → review → commit)
  │   ├── observability/    # Logging, Langfuse
  │   ├── tools/            # Agent tools
  │   │   ├── file_tools.py # file_read, file_write, file_search, directory_tree
  │   │   ├── git_tools.py  # Git operations
  │   │   └── web_tools.py  # web_fetch, web_search, shell_command
  │   └── cli.py            # sheep implement, chat, config
  ├── tests/                # pytest tests (e.g. test_random_word_file.py)
  ├── specs/                 # Feature specifications (YAML)
  └── (repo root)            # Content files: JOKE.md, JOKE2.md, JOKE3.md, RANDOM.txt, RANDOM_WORD.txt
  ```

  Key directories:
  - **src/sheep/agents/code_agents.py**: Defines researcher (DirectoryTree, FileRead, FileSearch, GitLog), implementer (FileRead, FileWrite, FileSearch, GitStatus, GitDiff), reviewer (FileRead, FileSearch, GitDiff, GitStatus). Implementer has no WebFetchTool.
  - **src/sheep/flows/code_implementation.py**: Orchestrates branch creation → research → implementation → review → commit/push. Agents receive issue_description and work in working_path.
  - **src/sheep/tools/**: FileWriteTool and WebFetchTool exist; implementer only has file tools.
  - **tests/**: test_random_word_file.py validates RANDOM_WORD.txt (exists, one word, trailing newline). No joke-file tests.

  ### Architecture Patterns

  - **Separation of structure and intelligence**: Flows define steps; crews/agents execute with tools.
  - **Task-first design**: Well-crafted task descriptions drive agent behavior.
  - **Tool-based execution**: Agents use tools (file, git, web) — no direct code execution beyond tool calls.
  - **Conventional content files**: Repo root uses UPPER_SNAKE_CASE for content files (JOKE.md, RANDOM.txt, RANDOM_WORD.txt).

  ### Relevant Technologies

  - **Python 3.11+**, **CrewAI** (agents, flows, tasks)
  - **Pydantic** (settings, models)
  - **httpx** (web_fetch in web_tools) — available for joke API fetching if needed
  - **pytest** (现有测试)
  - **ruff** (lint)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | repo root (new file) | High | Primary deliverable: one new .md file |
  | tests/ | Medium | May add test similar to test_random_word_file.py to validate file structure |
  | src/sheep/agents/code_agents.py | Low | Only if implementer needs WebFetchTool for joke API — optional |
  | specs/016-*/ | Low | Spec and plan artifacts updated during development |

  ## Dependencies

  - **Existing content patterns**: JOKE.md, JOKE2.md, JOKE3.md define the joke format (bold **Q:** / **A:**, `---` separators).
  - **File tools**: FileWriteTool allows agent to create the file; no code changes required for basic implementation.
  - **Optional API**: icanhazdadjoke.com (no API key, returns JSON) could provide random jokes if WebFetchTool is added to implementer. httpx is already a dependency.
  - **No new package dependencies** if using LLM-generated or hardcoded joke.

  ## Size Estimate

  **M** — Estimated 1–2 days. Justification:
  - **Scope**: One new file + optional test + optional API integration.
  - **Complexity**: "Random" adds ambiguity — requires resolving joke source (LLM vs list vs API). API path adds WebFetchTool wiring and error handling.
  - **Precedent**: 009 (joke md) and 010 (random content) were S-sized; combining both with an explicit "random" requirement adds design decisions and potentially API integration.
  - **Risk**: If API chosen, network flakiness and rate limits add testing complexity.

