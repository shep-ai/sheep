# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 227 extends the established test sequence by creating a markdown file with
  deterministic, hardcoded content. The implementation follows the proven pattern from
  features 101-211+:

  - **Standalone Module**: Feature logic encapsulated in `src/sheep/features/feature_227_markdown_file_creation.py`
    with no cross-feature dependencies or shared utilities. Module contains: (1) hardcoded
    content constants, (2) file creation via pathlib, (3) comprehensive validation functions,
    (4) git operations via subprocess, (5) structured logging via structlog, (6) main() orchestrator.

  - **Hardcoded Content**: Title and prose sentences embedded as module-level constants (TITLE_TEXT,
    PROSE_CONTENT), ensuring deterministic execution with no LLM calls, API latency, or variability.
    Content is static and reproducible across all executions.

  - **File I/O Strategy**: pathlib.Path.write_text(content, encoding=\"utf-8\") handles:
    (1) Automatic Unix LF line endings on all platforms, (2) UTF-8 encoding without BOM,
    (3) Clean, readable API. No shell commands, explicit encoding handling, or manual
    line-ending conversion needed.

  - **Comprehensive Validation**: Five sequential validation checks copied from feature_211:
    (1) validate_markdown_format() — ensures single H1 heading and prose section structure,
    (2) validate_encoding() — verifies UTF-8 without BOM, (3) validate_line_endings() —
    confirms Unix LF only (no CRLF or CR), (4) validate_file_size() — checks 300-800 byte range,
    (5) validate_sentence_count() — confirms 2-3 sentences. Validation executes before
    any git operations; failure raises immediately.

  - **Secure Git Integration**: subprocess.run() with shell=False and explicit argument list
    for git add, commit, and push operations. No shell interpolation, preventing command injection
    even if filenames contain special characters. Error handling via CalledProcessError;
    failed git operations raise exceptions that prevent further execution.

  - **Structured Logging**: structlog BoundLogger via sheep.observability.logging.get_logger(__name__)
    provides ISO timestamps, log levels, and colored console output. Clear progress messages
    at each phase (file creation, validation, git operations) aid debugging and visibility.

  - **Testing Strategy**: Unit tests for each validation function (RED: assertions on error cases
    and edge conditions, GREEN: copy validated functions from feature_211, REFACTOR: ensure clarity).
    Git operation tests use mocked subprocess.run() to verify correct command construction and
    error handling without executing actual git commands. Integration test verifies complete
    workflow: file creation → validation → git operations.

  ## Key Design Decisions

  ### 1. Template-Based Implementation (Copy feature_211)

  **Chosen**: Copy src/sheep/features/feature_211_markdown_file_creation.py,
  adapt constants and content, reuse all functions unchanged.

  **Rationale**:
  - Feature 211 is proven, tested pattern established in prior work
  - Validation functions are thoroughly tested and deterministic (no randomness)
  - Git operations follow secure subprocess pattern verified in production
  - Copying eliminates cross-feature dependencies while maintaining module independence
  - Estimated effort: 30-60 minutes (copy, update constants, test, verify)
  - Zero risk: pattern has been validated 211+ times

  **Alternatives Considered**:
  - Create shared utilities module: Breaks feature isolation, premature abstraction (only 2 features), increases complexity
  - Write from scratch: Duplicates proven code, introduces testing burden, higher error risk
  - Import from feature_211: Creates implicit dependency, violates module independence pattern

  ### 2. Hardcoded Content (Not LLM-Generated)

  **Chosen**: Hardcoded title and prose sentences as module-level constants
  (TITLE_TEXT, PROSE_CONTENT).

  **Rationale** (from spec resolution):
  - Ensures deterministic, reproducible execution with no external dependencies
  - No LLM API calls, network latency, or variability in output
  - Consistent with features 101-211+ established pattern
  - Simple, fast, predictable — aligns with straightforward task nature
  - Minimal code: constants + string formatting, no complex logic

  **Alternatives Considered**:
  - LLM-generated content: Breaks pattern, introduces CrewAI/API dependency, slower, non-deterministic
  - File-based content: Requires additional file, more complex path handling

  ### 3. Comprehensive Validation (Strict Format Checks)

  **Chosen**: Five validation functions checking markdown format, encoding, line endings,
  file size, and sentence count, all before git operations.

  **Rationale** (from spec resolution):
  - Matches established pattern from features 101-211+
  - Validation utilities already exist and are proven/tested
  - Catches format issues early before commit (fail-fast)
  - Ensures consistent file quality across project
  - Prevents pushing invalid files to remote

  **Alternatives Considered**:
  - Basic validation: Misses edge cases (CRLF, BOM, size violations), inconsistent with pattern
  - No validation: Violates spec requirements, risks invalid files in repository

  ### 4. File I/O via pathlib.Path.write_text()

  **Chosen**: `Path(FILENAME).write_text(content, encoding=\"utf-8\")`

  **Rationale** (from research):
  - Python 3.11+ pathlib automatically handles platform-specific line endings,
    using Unix LF on all platforms when writing in text mode
  - UTF-8 encoding enforced without BOM by default
  - Clean, object-oriented API familiar to modern Python developers
  - Already used in feature_211 (proven pattern in codebase)
  - Sub-millisecond execution for small files (~300-800 bytes)

  **Alternatives Considered**:
  - subprocess/shell commands: Unsafe (shell injection), inconsistent with codebase pattern
  - os.open() with explicit encoding: Verbose, requires manual line-ending handling
  - io.open(): More boilerplate than pathlib, less readable

  ### 5. Git Operations via subprocess.run(shell=False)

  **Chosen**: `subprocess.run([cmd_list], shell=False, check=True, capture_output=True)`

  **Rationale** (from research):
  - Secure by default: explicit argument list prevents command injection even
    if filenames contain spaces, quotes, or special characters
  - Clear error handling via CalledProcessError with descriptive messages
  - Transparent subprocess calls match team practices and existing patterns
  - Already used in feature_211 (proven pattern in codebase)
  - No external dependencies (stdlib subprocess)

  **Alternatives Considered**:
  - GitPython: Overkill for simple add/commit/push; adds unnecessary dependency; more complex API
  - shell subprocess (shell=True): Critical security vulnerability (command injection);
    blocks deployment to production; explicitly rejected in codebase
  - os.system(): Deprecated; no error handling; poor logging; unsafe

  ### 6. Structured Logging via structlog

  **Chosen**: `from sheep.observability.logging import get_logger; logger = get_logger(__name__)`

  **Rationale** (from research):
  - Sheep project uses structlog for all structured logging
  - Already configured in sheep.observability.logging with ISO timestamps, log levels,
    colored console output
  - Zero additional setup required (inherited from project configuration)
  - Logs are machine-parseable and aid monitoring/debugging
  - Provides clear visibility into feature execution phases

  **Alternatives Considered**:
  - stdlib logging: Less structured, harder to parse, inconsistent with project
  - print() statements: No timestamp/level info, not production-grade
  - No logging: Violates NFR-5, hides errors and progress

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Module Creation)** comes first because it establishes the complete
  feature module with all constants, functions, and logic. This phase is fast
  (copy/adapt), deterministic, and unblocks testing.

  **Phase 2 (Testing)** comes second because it validates the module before
  execution. Tests catch errors early (RED: what breaks? GREEN: fix it. REFACTOR:
  improve quality). Mocked git operations prevent unintended commits during testing.

  **Phase 3 (Execution)** comes last after validation passes. Execution creates
  the actual markdown file, validates it, and pushes to remote. No risk at this
  point — module is tested and proven to work.

  ### What Gets Built, In What Order

  1. **Create feature_227_markdown_file_creation.py** (10 min)
     - Copy feature_211_markdown_file_creation.py
     - Update FEATURE_NUMBER → 227
     - Update FILENAME → \"test-avbwfa.md\"
     - Update BRANCH_NAME → \"feat/227-markdown-file-creation-f6bfc7\"
     - Update COMMIT_MESSAGE → \"feat(227): create markdown file test-avbwfa.md\"
     - Write TITLE_TEXT and PROSE_CONTENT (2-3 sentences, 300-800 bytes total)
     - Verify module structure and imports

  2. **Write unit tests** (20 min)
     - Copy test_feature_211_markdown_file_creation.py as template
     - Adapt test constants (FEATURE_NUMBER, FILENAME)
     - Write/copy tests for validation functions (markdown format, encoding,
       line endings, file size, sentence count)
     - Write tests for git operations with mocked subprocess
     - Write integration test for complete workflow

  3. **Run tests locally** (5 min)
     - Execute pytest on test_feature_227_markdown_file_creation.py
     - Verify all tests pass (RED→GREEN→REFACTOR complete)
     - Confirm 100% coverage or acceptable coverage for feature module

  4. **Execute feature module** (5 min)
     - Run feature_227.main() in local environment
     - Module creates test-avbwfa.md in repository root
     - Module validates file (all checks pass)
     - Module stages, commits, and pushes to remote

  5. **Verify results** (5 min)
     - Confirm test-avbwfa.md exists in repository root
     - Verify file content matches spec (H1 title, 2-3 sentences)
     - Check git log: see commit \"feat(227): create markdown file test-avbwfa.md\"
     - Verify remote branch has commit: `git log origin/feat/227-markdown-file-creation-f6bfc7`

  **Total effort**: ~45 minutes (3 phases, 5-30 minutes each)

  ## Risk Mitigation

  | Risk | Likelihood | Impact | Mitigation |
  | ---- | ---------- | ------ | ---------- |
  | Byte count doesn't meet 300-800 requirement | Low | High (validation fails, commit blocked) | Write content, verify byte count before module execution. Task includes explicit acceptance criterion for this. |
  | File encoding is not UTF-8 without BOM | Low | High (validation fails, git blocked) | pathlib.Path.write_text(..., encoding=\"utf-8\") guarantees UTF-8 without BOM; validation function checks; copying feature_211 code that's proven in production. |
  | Line endings are CRLF or mixed | Low | High (validation fails, git blocked) | pathlib writes Unix LF on all platforms in text mode; validation function explicitly checks and rejects CRLF/CR; no manual handling needed. |
  | Git operations fail (wrong branch, no permissions) | Very Low | High (file not pushed) | subprocess.run() with shell=False prevents command injection; error handling via CalledProcessError raises immediately; module logs all git commands and responses. |
  | Sentence count is not 2-3 | Low | High (validation fails) | Validation function counts periods (.); task includes acceptance criterion checking sentence count before module run. |
  | Module imports fail (wrong path, missing dependency) | Very Low | High (module won't run) | Copy from feature_211 (proven imports); verify imports execute without error during testing phase. All dependencies (pathlib, subprocess, structlog) are stdlib or already in project. |
  | Filename collision or file already exists | Very Low | Low (overwritten) | File test-avbwfa.md is unique to feature 227; no prior feature uses this name. If file exists, pathlib.write_text() overwrites it (expected behavior). |
  | Test environment has no git or wrong git version | Very Low | Medium (tests fail locally) | Mocked subprocess.run() in tests eliminates git dependency; integration test requires git but local environment has it. If remote git fails, error caught by CalledProcessError. |
