content: |
  ## Problem Statement

  Feature 227 requires creating a markdown file named `test-avbwfa.md` with specific content requirements. This is part of a continuous test sequence on the Sheep project (an agentic platform for automated code implementation using CrewAI). Features 1-226 have already been implemented; Feature 227 continues this pattern.

  The task is straightforward: generate a markdown file with a title and 2-3 sentences of prose, commit it, and push to the remote feature branch.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. Key directories:

  ```
  sheep/
  ├── src/sheep/
  │   ├── agents/              # Agent definitions (code_agents.py, general_agents.py)
  │   ├── config/              # Configuration (settings.py, llm.py for LLM factories)
  │   ├── content_generators.py # Utilities for markdown generation, validation, git ops
  │   ├── features/            # Feature implementations (feature_*.py files)
  │   ├── observability/       # Logging and tracing (logging.py, langfuse integration)
  │   ├── tools/               # Agent tools (git_tools.py, file_tools.py)
  │   └── cli.py               # CLI entry point
  ├── pyproject.toml           # Project metadata and dependencies
  ├── README.md                # Project documentation
  └── specs/                   # Feature specifications (this file)
  ```

  ### Architecture Patterns

  **Separation of Concerns:**
  - **content_generators.py**: Reusable utility functions for markdown operations
    - `generate_markdown_content()` - Creates H1 + 2-3 sentences using LLM or hardcoded text
    - `write_markdown_file()` - Writes content to disk with UTF-8 encoding
    - `validate_markdown_file()` - Comprehensive validation (format, encoding, line endings, size)
    - `commit_markdown_file()` - Git staging and committing
    - `push_markdown_file()` - Push to remote

  - **feature_*.py files**: Self-contained feature implementations
    - Each feature (101-211+) has its own module with hardcoded content and validation
    - Follows consistent workflow: Create → Validate → Git Operations
    - Pattern established by features 101-211 (later features moved to hardcoded content for determinism)

  **Logging & Observability:**
  - Structured logging via `sheep.observability.logging.get_logger()`
  - Optional Langfuse integration for execution tracing
  - Python structlog for consistent log formatting

  **Git Integration:**
  - Uses `subprocess.run()` with shell=False for secure git command execution
  - GitPython library available for more complex operations
  - Conventional commit messages: `feat(NUMBER): create markdown file FILENAME`

  ### Relevant Technologies

  | Technology | Version | Purpose |
  | ---------- | ------- | ------- |
  | Python | 3.11+ | Core language |
  | CrewAI | 0.86.0+ | Agent orchestration framework |
  | GitPython | 3.1.0+ | Git operations library |
  | Pathlib | stdlib | File operations (UTF-8, LF handling) |
  | structlog | 24.0.0+ | Structured logging |
  | Pydantic | 2.0.0+ | Configuration validation |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/feature_227_markdown_file_creation.py` | High | **NEW FILE** - Must create this module with hardcoded content, validation, and git operations following the pattern from features 101-211 |
  | `src/create_markdown.py` | Low | May need to register feature 227 in any orchestration/discovery mechanism (if exists) |
  | Repository root (`test-avbwfa.md`) | High | New markdown file will be created, committed, and pushed |
  | Git remote (`origin`) | Medium | Changes will be pushed to remote feature branch |

  ## Dependencies

  **Internal Dependencies:**
  - `sheep.observability.logging.get_logger()` - for structured logging
  - `pathlib.Path` - file operations with UTF-8 encoding
  - `subprocess` - secure git command execution
  - Existing validation patterns from features 101-211

  **External Dependencies:**
  - GitPython 3.1.0+ (git command execution)
  - Python 3.11+ standard library (pathlib, subprocess)

  **No New External Dependencies Required** - All infrastructure exists in the codebase.

  ## Success Criteria

  1. ✅ File named `test-avbwfa.md` created in repository root
  2. ✅ Content has H1 heading (markdown `# Title`)
  3. ✅ Content contains 2-3 sentences of prose
  4. ✅ File encoded as UTF-8 without BOM
  5. ✅ File uses Unix LF line endings only (no CRLF)
  6. ✅ File size between 300-800 bytes
  7. ✅ File staged with `git add`
  8. ✅ File committed with conventional message: `feat(227): create markdown file test-avbwfa.md`
  9. ✅ Changes pushed to remote feature branch
  10. ✅ Feature module created at `src/sheep/features/feature_227_markdown_file_creation.py`

  ## Size Estimate

  **S (Small)** — 30-60 minutes of implementation work

  **Reasoning:**
  - Straightforward implementation: follow established pattern from features 101-211
  - Copy/adapt existing feature file (e.g., feature_211_markdown_file_creation.py)
  - Change only: feature number (227), filename (test-avbwfa.md), hardcoded content (title + 2-3 sentences)
  - All validation, git operations, and logging utilities already exist and tested
  - No architectural decisions or new dependencies required
  - Self-contained module (~500-600 lines, mostly copied from feature_211 with minor changes)
  - Validation can reuse exact same validation functions (no customization needed)

  **Effort Breakdown:**
  - Copy feature_211 template: 5 min
  - Adapt constants (FILENAME, FEATURE_NUMBER, content): 10 min
  - Verify format meets spec (H1, 2-3 sentences, encoding): 10 min
  - Test locally if needed: 10-15 min
  - Create commit and push: 5 min

