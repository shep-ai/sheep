content: |
  ## Problem Statement

  Feature 227 is the continuation of a test sequence on the Sheep project (an agentic platform for automated code implementation using CrewAI). Features 1-226 have already been implemented; Feature 227 requires creating a markdown file with specific content and format requirements.

  The task: generate a markdown file named `test-avbwfa.md` containing an H1 title and 2-3 sentences of prose content, ensure it meets encoding/format standards, validate it, commit it with a conventional message, and push to the remote feature branch.

  This is a straightforward implementation following the established pattern from features 101-211+, with no new architectural complexity or external dependencies.

  ## Success Criteria

  - [ ] File named `test-avbwfa.md` created in repository root directory
  - [ ] File content includes an H1 heading (markdown `# Title`)
  - [ ] File content contains exactly 2-3 sentences of prose
  - [ ] File encoded as UTF-8 without byte-order mark (BOM)
  - [ ] File uses Unix LF line endings only (no CRLF, no mixed line endings)
  - [ ] File size is between 300-800 bytes (inclusive)
  - [ ] File is staged with `git add test-avbwfa.md`
  - [ ] File is committed with conventional message: `feat(227): create markdown file test-avbwfa.md`
  - [ ] Commit is pushed to remote feature branch `origin/feat/227-markdown-file-creation-f6bfc7`
  - [ ] Feature module created at `src/sheep/features/feature_227_markdown_file_creation.py`
  - [ ] Feature module includes hardcoded content (title + prose)
  - [ ] Feature module includes comprehensive validation logic
  - [ ] Feature module includes git operations (add, commit, push)
  - [ ] Structured logging applied via `sheep.observability.logging.get_logger()`

  ## Functional Requirements

  - **FR-1**: Create a markdown file at repository root with filename `test-avbwfa.md` containing hardcoded prose content.
  - **FR-2**: File must contain a single H1 heading (markdown `# ` syntax) with an appropriate title.
  - **FR-3**: File must contain exactly 2-3 complete sentences of prose content following the H1 heading.
  - **FR-4**: Content must be deterministic and hardcoded in the feature module (not generated dynamically).
  - **FR-5**: Write file to disk using UTF-8 encoding without BOM via `pathlib.Path.write_text()`.
  - **FR-6**: Validate file meets all encoding, line-ending, size, and content requirements before committing.
  - **FR-7**: Stage file with `git add test-avbwfa.md` (secure subprocess execution, no shell=True).
  - **FR-8**: Commit staged file with conventional commit message: `feat(227): create markdown file test-avbwfa.md`.
  - **FR-9**: Push committed changes to remote feature branch `origin/feat/227-markdown-file-creation-f6bfc7`.
  - **FR-10**: Create feature module `src/sheep/features/feature_227_markdown_file_creation.py` with encapsulated logic.

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM; validate with `validate_markdown_file()` or equivalent check.
  - **NFR-2**: Line endings must be Unix LF only (0x0A); no CRLF (0x0D0A) or mixed endings; enforce via pathlib or explicit conversion.
  - **NFR-3**: File size must be 300-800 bytes inclusive; fails validation if outside range.
  - **NFR-4**: Implementation must follow established pattern from features 101-211+ (hardcoded content, modular structure, validation-first).
  - **NFR-5**: All operations must use structured logging via `sheep.observability.logging.get_logger()` with clear progress messages.
  - **NFR-6**: Validation must execute before git operations; any validation failure must prevent commit.
  - **NFR-7**: Git operations must use secure subprocess execution (`subprocess.run()` with shell=False); no shell injection risk.
  - **NFR-8**: Feature module must be self-contained; no external API calls or dynamic LLM generation.
  - **NFR-9**: Code must be consistent with project style and patterns; reuse utilities from content_generators.py where applicable (but maintain standalone module structure).

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Hardcoded vs. LLM-generated content? | Hardcoded content | Ensures determinism, consistency with features 101-211+, faster execution, no external dependencies. |
  | 2 | Basic or comprehensive validation? | Comprehensive validation | Matches established pattern, catches all format issues early, utilities already exist and tested. |
  | 3 | Standalone module or shared integration? | Standalone feature module | Maintains consistency with 101-211+ pattern, clearer ownership, easier independent testing and modification. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/sheep/features/feature_227_markdown_file_creation.py` | High | **NEW FILE** — Must create this module with hardcoded content, comprehensive validation, and git operations following the pattern from features 101-211. Approximately 500-600 lines, mostly adapted from feature_211. |
  | `src/create_markdown.py` or feature discovery | Low | May need to register feature 227 in any orchestration/discovery mechanism if one exists (verify during implementation). |
  | Repository root (`test-avbwfa.md`) | High | New markdown file will be created, validated, committed, and pushed to remote. |
  | Git remote (`origin`) | Medium | Changes will be pushed to remote feature branch `origin/feat/227-markdown-file-creation-f6bfc7`. |

  ## Dependencies

  ### Internal Dependencies
  - `sheep.observability.logging.get_logger()` — for structured logging throughout feature execution
  - `pathlib.Path` — file operations with native UTF-8 encoding support
  - `subprocess` — secure git command execution (no shell=True)
  - Existing validation patterns from features 101-211+ (reference implementation_

  ### External Dependencies
  - GitPython 3.1.0+ — for git operations (already in pyproject.toml)
  - Python 3.11+ standard library (pathlib, subprocess, logging)

  ### No New External Dependencies Required
  All infrastructure exists in the codebase; no additional packages or services needed.

  ## Size Estimate

  **S (Small)** — 30-60 minutes of implementation work

  ### Reasoning
  - Straightforward implementation: follow established pattern from features 101-211
  - Copy/adapt existing feature file (e.g., feature_211_markdown_file_creation.py as template)
  - Change only: feature number (227), filename (test-avbwfa.md), hardcoded content (title + 2-3 sentences)
  - All validation, git operations, and logging utilities already exist and are tested
  - No architectural decisions or new dependencies required (resolved via openQuestions)
  - Self-contained module (~500-600 lines, mostly copied from feature_211 with minor changes)
  - Validation can reuse exact same validation functions (no customization needed)

  ### Effort Breakdown
  - Copy feature_211 or equivalent template: 5 min
  - Adapt constants (FILENAME, FEATURE_NUMBER, content strings): 10 min
  - Verify format meets all spec requirements (H1, 2-3 sentences, encoding, line endings, size): 10 min
  - Test locally if needed (run feature module, verify output): 10-15 min
  - Create commit and push to remote: 5 min

  ---

  _Requirements phase complete — ready for implementation phase_
