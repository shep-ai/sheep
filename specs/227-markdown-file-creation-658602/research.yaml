# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-26
  - **Implementation Pattern:** Established (100+ precedents: features 069-226)
  - **External Dependencies:** None (Python standard library only)

  ## Technology Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `Path("test-jwx3m2.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - `open()` with explicit encoding — more verbose, less idiomatic
  - `os.write()` with binary mode — requires manual encoding/line-ending handling
  - `str.encode()` + `file.write()` — adds manual complexity

  **Rationale:** pathlib is idiomatic, safe, and handles encoding/line-endings correctly.
  Explicit parameters (encoding="utf-8", newline="\n") enforce spec requirements (NFR-1, NFR-2).
  Consistent with feature 217 and 100+ existing implementations in repository.

  ### 2. Text Encoding: UTF-8 Without BOM

  **Chosen:** `encoding="utf-8"` (standard UTF-8, no BOM)

  **Rejected:**
  - `encoding="utf-8-sig"` — adds BOM (violates NFR-1)
  - Platform-dependent encoding — unreliable, violates NFR-1

  **Rationale:** NFR-1 explicitly requires UTF-8 without BOM. pathlib's standard UTF-8 encoding
  produces clean UTF-8 without BOM. BOM causes issues with markdown parsers and git diffs.

  ### 3. Line Ending Strategy: Explicit Unix LF

  **Chosen:** `newline="\n"` in Path.write_text()

  **Rejected:**
  - Default newline handling (None) — platform-dependent (CRLF on Windows)
  - Manual conversion — error-prone
  - Git config core.safecrlf — shifts responsibility, not guaranteed

  **Rationale:** NFR-2 requires Unix LF line endings. Explicit newline="\n" ensures LF-only
  output regardless of platform. Most reliable, explicit approach verified across all test files.

  ### 4. Git Integration: subprocess Module

  **Chosen:** `subprocess.run()` for git add/commit/push

  **Rejected:**
  - GitPython library — unnecessary dependency for 3 simple commands
  - os.system() — security risk (command injection), no error handling
  - pygit2 — overkill, adds C binding complexity

  **Rationale:** subprocess provides proper error handling (check=True) with no external
  dependencies. Established pattern in feature 217 and throughout repository. Three simple
  commands don't justify adding a dependency.

  ### 5. Prose Content: Deterministic Pre-Written Content

  **Chosen:** Pre-written 3-sentence prose about technology/software engineering

  **Rejected:**
  - LLM-based generation — adds dependency, complexity, latency
  - Random topic selection — unnecessary given no uniqueness requirement
  - Template substitution — over-engineered

  **Rationale:** Spec requires coherent 2-3 sentences with no uniqueness requirement.
  Established pattern uses pre-written prose on diverse topics. Simple, testable, deterministic.
  Content quality and variety demonstrated across 100+ test files (features 069-226).

  ### 6. Error Handling: Fail-Fast with Descriptive Exceptions

  **Chosen:** Re-raise FileExistsError and CalledProcessError with context

  **Rejected:**
  - Silent failure — masks problems
  - Custom error classes — unnecessary abstraction
  - Logging without exceptions — doesn't prevent broken state

  **Rationale:** File creation failures should halt execution with clear errors. Allows
  calling code to detect/handle failures. Matches feature 217 pattern. Aids debugging.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O with encoding control | Use (std lib) | Built-in, safe, idiomatic for Python 3.3+ |
  | subprocess | Execute git commands | Use (std lib) | Built-in, proper error handling, no dependencies |
  | GitPython | Alternative git interface | Reject | Unnecessary for 3 simple commands; adds dependency |
  | os/sys | Low-level file/system operations | Reject (use pathlib instead) | pathlib is higher-level, safer, more idiomatic |

  ## Security Considerations

  ### File Path & Naming
  - **Risk:** Path traversal (e.g., "../" in filename)
  - **Mitigation:** Filename "test-jwx3m2.md" is hardcoded in spec; no user input handling needed
  - **Status:** No risk

  ### File Encoding & BOM
  - **Risk:** UTF-8 BOM can interfere with markdown parsers and git diff output
  - **Mitigation:** Explicit encoding="utf-8" (no BOM variant) in pathlib
  - **Status:** Mitigated

  ### Git Command Execution
  - **Risk:** Command injection if filenames/messages are user-controlled
  - **Mitigation:** Filename and commit message are hardcoded in spec; no user input
  - **Status:** No risk

  ### File Overwrite
  - **Risk:** Accidental overwrite of existing test-jwx3m2.md if script re-runs
  - **Mitigation:** Check file existence before creation; raise FileExistsError if present
  - **Status:** Mitigated (verified in feature 217 pattern)

  ### Content Safety
  - **Risk:** Injection of malicious markdown/git metadata
  - **Mitigation:** Content is pre-written prose; no parsing of external input
  - **Status:** No risk

  ## Performance Implications

  ### File I/O
  - Single file creation (~400-600 bytes per spec)
  - pathlib.Path.write_text() is optimized for small files
  - No performance concerns; typically <1ms

  ### Git Operations
  - Three git commands (add, commit, push) are blocking
  - Typical latency: add ~10ms, commit ~50ms, push ~100-500ms (network-dependent)
  - No performance optimization needed for feature size (S estimate, 10-15 minutes)

  ### Scalability
  - Implementation creates single file and commits once; linear time complexity
  - No caching, indexing, or repeated operations
  - Suitable for automated feature implementations

  ## Architecture Notes

  ### Codebase Integration
  - Feature follows established pattern from features 069-226 (100+ test files)
  - No modifications to src/sheep/ or application logic
  - Pure file creation and git workflow; no architectural coupling

  ### Dependency Graph
  - Python 3.11+ (3.12.3 available) ✓
  - pathlib (standard library) ✓
  - subprocess (standard library) ✓
  - Git 2.53.0 (external tool) ✓
  - No external Python dependencies

  ### File Structure
  - Markdown file created in repository root (alongside 100+ existing test-*.md files)
  - Structure: `# Heading\n\n<3 sentences of prose>\n`
  - Size: ~400-600 bytes (natural consequence of proper structure)

  ### Git Workflow
  - Feature branch: feat/227-markdown-file-creation-658602 (pre-created)
  - Commit message: `feat(227): create markdown file test-jwx3m2.md with prose content`
  - Operations: git add, git commit, git push -u origin HEAD
  - No merges, rebases, or branch creation needed

  ### Testing & Validation
  - File structure validation (heading, blank line, prose count)
  - Encoding validation (UTF-8 without BOM)
  - Line ending validation (LF only, no CRLF)
  - Size range validation (300-600 bytes)
  - Sentence count validation (2-3 sentences)
  - Matches feature 217 validation pattern

  ## Implementation Approach

  ### Phase 1: File Creation
  1. Define constants (FILENAME, PROSE_CONTENT)
  2. Build markdown content: `# Title\n\n<prose>\n`
  3. Write file via Path.write_text(encoding="utf-8", newline="\n")
  4. Check file exists and size is correct

  ### Phase 2: Validation
  1. Read file binary to check UTF-8 encoding (no BOM)
  2. Verify no CRLF line endings (\r\n absent)
  3. Parse structure: H1 heading, blank line, prose
  4. Validate sentence count (2-3 sentences)
  5. Verify file size (300-600 bytes)

  ### Phase 3: Git Operations
  1. `git add test-jwx3m2.md`
  2. `git commit -m "feat(227): create markdown file test-jwx3m2.md with prose content"`
  3. `git push -u origin HEAD`

  ### Success Criteria
  - ✓ File test-jwx3m2.md exists in repository root
  - ✓ File contains H1 heading + blank line + 2-3 sentences of prose
  - ✓ UTF-8 encoding without BOM (verified via binary inspection)
  - ✓ Unix LF line endings only (no CRLF)
  - ✓ File size 300-600 bytes
  - ✓ Markdown syntax valid per CommonMark
  - ✓ Git commit with exact message on feature branch
  - ✓ Changes pushed to remote origin

