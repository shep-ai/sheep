# Structured technology decisions
decisions:
  - title: "File Creation Method"
    chosen: "Python pathlib.Path.write_text()"
    rejected:
      - "Using open() with explicit encoding — more verbose, less idiomatic for simple operations"
      - "Using os.write() with binary mode — lower-level, requires manual encoding/line-ending handling"
      - "Using str.encode() and file.write() — manual encoding control adds complexity without benefit"
    rationale: >
      pathlib.Path.write_text() is the standard, idiomatic approach in Python 3.3+. It provides
      safe handling of encoding (UTF-8 by default), line-ending normalization via the newline
      parameter, and atomic file operations. The method is concise, readable, and used consistently
      across the 100+ existing test files in this repository (verified in feature 217 implementation).
      Explicit newline="\n" parameter ensures Unix LF line endings regardless of platform, meeting
      NFR-5 requirement.

  - title: "Text Encoding Strategy"
    chosen: "UTF-8 without BOM via pathlib.Path.write_text(encoding=\"utf-8\")"
    rejected:
      - "Using encoding=\"utf-8-sig\" — automatically adds UTF-8 BOM, violates NFR-1 requirement"
      - "Platform-dependent encoding (default) — unreliable across systems, violates NFR-1"
      - "Manual BOM detection and removal — unnecessary complexity when pathlib handles correctly"
    rationale: >
      The spec (NFR-1) explicitly requires UTF-8 without BOM. pathlib's default UTF-8 encoding
      (without the -sig variant) produces clean UTF-8 without BOM. This is platform-independent
      and matches the established pattern from prior implementations. BOM causes issues with
      markdown parsers and git diffs, making explicit avoidance critical.

  - title: "Line Ending Handling"
    chosen: "Explicit newline=\"\\n\" parameter in Path.write_text()"
    rejected:
      - "Default newline handling (None) — platform-dependent, CRLF on Windows"
      - "Manual conversion of line endings (e.g., content.replace('\\n', '\\r\\n')) — error-prone"
      - "Post-processing with git config core.safecrlf — shifts responsibility to git, not guaranteed"
    rationale: >
      NFR-2 requires Unix LF line endings. Explicit newline=\"\\n\" in Path.write_text() ensures
      consistent LF-only output regardless of platform. This is the most explicit, reliable approach
      and prevents accidental CRLF insertion on Windows systems. The implementation is verified
      in feature 217 and across all existing test files.

  - title: "Git Command Execution"
    chosen: "Python subprocess module for git operations (add, commit, push)"
    rejected:
      - "GitPython library — adds external dependency, unnecessary for simple operations"
      - "Calling git via shell (os.system) — security risk (command injection), no error handling"
      - "pygit2 library — overkill for basic git workflow, adds C binding complexity"
    rationale: >
      subprocess is ideal for executing external tools (git) with proper error handling and no
      external dependencies. Verified pattern in feature 217 implementation and throughout the
      repository. subprocess.run() with check=True provides clear error detection. GitPython
      is rejected because three simple git commands (add, commit, push) don't justify a dependency.

  - title: "Prose Content Generation"
    chosen: "Deterministic, pre-written prose about a selected topic (3 sentences)"
    rejected:
      - "AI/LLM-based generation — adds dependency, complexity, latency; spec doesn't require unique content"
      - "Random selection from topic library — unnecessary complexity; pattern already established"
      - "Template substitution with variables — over-engineered for simple requirement"
    rationale: >
      The spec requires 2-3 sentences of coherent prose with no requirement for uniqueness or
      randomness. The established pattern (features 069-226, 100+ test files) uses pre-written
      prose on diverse topics (nature, technology, philosophy, collaboration, etc.). This is
      simple, deterministic, testable, and avoids external dependencies. Content quality is
      high and demonstrates the pattern clearly.

  - title: "Error Handling Strategy"
    chosen: "Fail fast with descriptive exceptions from pathlib and subprocess"
    rejected:
      - "Silent failure (try/except without re-raising) — masks problems, violates debugging needs"
      - "Custom error handling classes — unnecessary abstraction for straightforward operations"
      - "Logging instead of exceptions — doesn't prevent broken state or stop execution"
    rationale: >
      File creation failures (FileExistsError from pathlib, CalledProcessError from subprocess)
      should halt execution with clear error messages. This matches the feature 217 pattern and
      allows calling code to detect and handle failures. Descriptive errors aid debugging during
      automated implementation phases.

