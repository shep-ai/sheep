# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature follows the well-established pattern demonstrated by 100+ existing test files
  (features 069-226) in the repository. The implementation is purely declarative file creation
  with no architectural coupling to the application source code (src/sheep/). The file
  (test-jwx3m2.md) is created in the repository root alongside other test-*.md files.

  **Key characteristics:**
  - Single, isolated file creation (no modifications to existing files)
  - No dependencies on application source code or configuration
  - Follows the standard 3-part markdown structure: H1 heading + blank line + 2-3 sentences
  - Git workflow is straightforward: add → commit → push (no merges or branches)
  - Deterministic, pre-written content (no external dependencies or randomization)

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** Use `Path("test-jwx3m2.md").write_text(content, encoding="utf-8", newline="\n")`

  **Rationale:** pathlib is the idiomatic, modern approach for file I/O in Python 3.3+.
  It provides safe handling of encoding (UTF-8 by default), atomic file operations, and
  explicit control over line endings. The explicit parameters enforce spec requirements
  (NFR-1: UTF-8 without BOM, NFR-2: Unix LF). This approach is consistent with the
  feature 217 implementation and verified across all 100+ existing test files.

  **Alternatives considered:**
  - `open()` with explicit encoding — more verbose, less idiomatic
  - `os.write()` with binary mode — requires manual encoding and line-ending handling
  - `str.encode()` + `file.write()` — adds unnecessary manual complexity

  ### 2. Text Encoding: UTF-8 Without BOM

  **Chosen:** `encoding="utf-8"` (standard UTF-8, no BOM variant)

  **Rationale:** NFR-1 explicitly requires UTF-8 without BOM. The standard utf-8 encoding
  (not utf-8-sig) produces clean UTF-8 without any Byte Order Mark. BOM can interfere with
  markdown parsers and cause issues in git diffs. This is platform-independent and matches
  the established pattern from all prior implementations.

  **Alternatives considered:**
  - `encoding="utf-8-sig"` — automatically adds BOM (violates NFR-1)
  - Platform-dependent encoding — unreliable across systems

  ### 3. Line Ending Handling: Explicit Unix LF

  **Chosen:** `newline="\n"` parameter in `Path.write_text()`

  **Rationale:** NFR-2 requires Unix LF line endings. The explicit `newline="\n"` parameter
  ensures LF-only output regardless of platform (prevents accidental CRLF on Windows).
  This is the most reliable, explicit approach verified across all existing test files.

  **Alternatives considered:**
  - Default newline handling (None) — platform-dependent (CRLF on Windows)
  - Manual post-processing — error-prone and less maintainable

  ### 4. Git Integration: Python subprocess Module

  **Chosen:** `subprocess.run()` for git add/commit/push operations

  **Rationale:** subprocess provides proper error handling (check=True) with no external
  dependencies. It's the standard approach for executing external tools (git) from Python.
  Three simple git commands don't justify adding a dependency like GitPython.

  **Alternatives considered:**
  - GitPython library — unnecessary dependency for simple operations
  - `os.system()` — security risk (command injection), no error handling
  - pygit2 — adds C binding complexity, overkill for basic workflow

  ### 5. Prose Content: Deterministic Pre-Written Content

  **Chosen:** Pre-written, 3-sentence prose about technology/software engineering

  **Rationale:** The spec requires coherent 2-3 sentences with no requirement for uniqueness
  or randomization. The established pattern (features 069-226, 100+ test files) uses pre-written
  prose on diverse topics (nature, technology, philosophy, collaboration, etc.). This is simple,
  deterministic, testable, and avoids external dependencies or LLM calls.

  **Alternatives considered:**
  - LLM-based generation — adds complexity, latency, dependencies
  - Random topic selection — unnecessary given no uniqueness requirement
  - Template substitution — over-engineered for simple requirement

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**
  1. Create the markdown file using pathlib with H1 heading and prose content
  2. Verify file encoding (UTF-8 without BOM) and line endings (Unix LF only)
  3. Validate file structure (H1 heading, blank line, 2-3 sentences) and size

  **Phase 2: Git Integration**
  1. Stage the file: `git add test-jwx3m2.md`
  2. Commit with conventional message: `feat(227): create markdown file test-jwx3m2.md with prose content`
  3. Push to remote feature branch: `git push -u origin HEAD`

  **Rationale for ordering:**
  - File must be created and validated before git integration (no point adding a broken file)
  - Git operations must follow in sequence (add before commit, commit before push)
  - Dependencies are linear: validation depends on file creation, git operations depend on validation

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (overwrite risk) | Check for FileExistsError from pathlib; fail fast with descriptive error message |
  | Incorrect encoding (BOM or non-UTF-8) | Use explicit `encoding="utf-8"` parameter; validate via binary read before git add |
  | CRLF line endings on Windows | Use explicit `newline="\n"` parameter in write_text() |
  | Git add/commit/push fails | Use subprocess with `check=True` to raise CalledProcessError on failure; halt execution |
  | File has invalid structure | Validate markdown structure (H1 heading, blank line, sentence count) after creation |
  | Incorrect commit message | Use exact string from spec; verify via git log after commit |
  | Push fails (network/auth) | Use subprocess check=True; descriptive error aids debugging |
