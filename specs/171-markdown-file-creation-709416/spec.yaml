content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-jn0b4n.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is the 171st iteration of an identical feature pattern, with 170+ prior implementations existing
  in the repository as precedents (test-*.md files at the root directory). The pattern is fully mature,
  with clear examples and proven success in features 166-170. This feature serves as validation of the
  platform's ability to execute well-understood, repetitive tasks with consistency and reliability.

  ## Success Criteria

  - [ ] File `test-jn0b4n.md` created at repository root with no subdirectories
  - [ ] File contains exactly one H1 heading (single `#` character followed by space and title text)
  - [ ] File contains exactly 2-3 complete sentences of coherent, meaningful prose
  - [ ] File uses UTF-8 encoding without BOM (Byte Order Mark)
  - [ ] File uses Unix LF line endings (0x0A), not CRLF (0x0D0x0A) or other formats
  - [ ] File size is between 300-600 bytes (inclusive)
  - [ ] File has blank line separating H1 heading from prose content
  - [ ] File is staged to git index via `git add test-jn0b4n.md` command
  - [ ] File is committed with message: `feat(171): Create markdown file test-jn0b4n.md with prose content`
  - [ ] Commit is pushed to remote origin on feature branch `feat/171-markdown-file-creation-709416`
  - [ ] Content is semantically coherent and grammatically correct (not placeholder or dummy text)

  ## Functional Requirements

  - **FR-1**: Generate markdown content with H1 heading describing a topic of interest
  - **FR-2**: Validate that generated content contains exactly 2-3 complete sentences (neither fewer nor more)
  - **FR-3**: Validate markdown structure compliance (H1 heading on first line, followed by blank line, followed by prose)
  - **FR-4**: Write validated content to file at repository root with exact filename `test-jn0b4n.md`
  - **FR-5**: Validate file uses UTF-8 encoding without BOM (using binary file inspection if needed)
  - **FR-6**: Validate file uses Unix LF line endings exclusively (no CRLF or other line ending formats)
  - **FR-7**: Validate file size is within expected range of 300-600 bytes (inclusive)
  - **FR-8**: Stage file with `git add test-jn0b4n.md` using standard git command-line operations
  - **FR-9**: Create git commit with conventional commit message format: `feat(171): Create markdown file test-jn0b4n.md with prose content`
  - **FR-10**: Push commit to remote origin on current feature branch using `git push` command

  ## Non-Functional Requirements

  - **NFR-1**: Complete feature implementation and all validations in under 15 minutes
  - **NFR-2**: No modifications to source code in `/src/sheep/` directory or any configuration files
  - **NFR-3**: No test file modifications, additions, or deletions
  - **NFR-4**: Follow established git workflow: file creation → validation → git add → git commit → git push
  - **NFR-5**: No directory structure changes; file created only in repository root directory
  - **NFR-6**: No external dependencies; use only Python 3.11+ standard library (pathlib, subprocess) and system git
  - **NFR-7**: Implementation must be deterministic (same inputs always produce same file content and structure)
  - **NFR-8**: All validations must be automated and produce clear pass/fail results

  ## Product Decisions

  All product decisions for this feature are predetermined by the established pattern from 170+ prior
  implementations (features 001-170). No ambiguous decisions or stakeholder input required:

  | Decision | Answer | Rationale |
  | -------- | ------ | --------- |
  | File name | `test-jn0b4n.md` (specified in user query) | Explicitly provided in requirement; matches established test file naming convention |
  | File location | Repository root | Established pattern from 170+ prior test files; no subdirectories |
  | Content format | H1 heading + 2-3 sentences | Defined and validated in established pattern; proven in features 166-170 |
  | Topic selection | Flexible/implementer-chosen | No constraint in specification; implementer selects meaningful topic |
  | Implementation approach | Python pathlib for file I/O | Simple, proven cross-platform approach from features 166-170; standard library only |
  | Git workflow | Conventional commits, push to feature branch | Pattern proven in 170+ prior features; standard Sheep workflow |
  | Validation strategy | Automated checks via helper scripts or imperative code | Established pattern; validated in create_markdown_file.py and similar implementations |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-jn0b4n.md) to existing collection of 170+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-170; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in `/src/sheep/` or elsewhere |
  | Configuration | None | No configuration files modified, no settings changed |
  | Tests | None | No test files created, modified, or deleted |

  ## Dependencies

  - **Git repository**: Feature branch `feat/171-markdown-file-creation-709416` must exist (pre-created by platform)
  - **File system**: Write access to repository root directory must be available
  - **Established pattern**: 170+ test files (test-*.md) provide proven precedent for content format and structure
  - **Git configuration**: Standard git configuration with `user.name` and `user.email` must be set
  - **Python 3.11+**: Must be available in execution environment with pathlib and subprocess modules
  - **Git command-line**: Standard git CLI tool must be available and executable
  - **No external dependencies**: Feature uses only Python standard library; no pip packages required

  ## Size Estimate

  **S (Small — approximately 10-15 minutes)**

  This is a minimal-effort, single-file creation feature with well-established patterns:

  - **File creation**: ~3-5 minutes (generate markdown content with H1 heading + 2-3 sentences)
  - **Validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size)
  - **Git operations**: ~2-5 minutes (stage, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes

  **Justification**:
  - Fully mature pattern with 170+ identical test files providing clear, proven precedent
  - Flexible topic selection requires no research or architectural decisions
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent features (166-170) demonstrate efficient implementation in 10-15 minutes
  - All product decisions are predetermined; no ambiguity or stakeholder negotiation needed

