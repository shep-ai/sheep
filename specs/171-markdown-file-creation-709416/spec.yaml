content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-jn0b4n.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  This is the 171st iteration of an identical feature pattern, with 170+ prior implementations existing
  in the repository as precedents (test-*.md files at the root directory). The pattern is fully mature,
  with clear examples and proven success in features 166-170. This feature serves as validation of the
  platform's ability to execute well-understood, repetitive tasks with consistency and reliability.

  ## Success Criteria

  - [ ] File `test-jn0b4n.md` created at repository root
  - [ ] File contains valid markdown with H1 heading (single `#` at start of line)
  - [ ] File contains exactly 2-3 sentences of coherent prose content
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] File size is between 300-600 bytes (following established pattern)
  - [ ] File is staged to git index with `git add test-jn0b4n.md`
  - [ ] File is committed with conventional commit message: `feat(171): Create markdown file test-jn0b4n.md with prose content`
  - [ ] Commit is pushed to remote origin on feature branch `feat/171-markdown-file-creation-709416`
  - [ ] Content is meaningful, grammatically correct prose (not placeholder text)

  ## Functional Requirements

  - **FR-1**: Generate markdown content with H1 heading describing a topic of interest
  - **FR-2**: Validate that generated content contains exactly 2-3 sentences (not fewer, not more)
  - **FR-3**: Validate markdown syntax compliance (H1 heading present, proper formatting)
  - **FR-4**: Write validated content to file at repository root with filename `test-jn0b4n.md`
  - **FR-5**: Validate UTF-8 encoding without BOM
  - **FR-6**: Validate Unix LF line endings (not CRLF)
  - **FR-7**: Validate file size is within expected range (300-600 bytes)
  - **FR-8**: Stage file with `git add` using standard git operations
  - **FR-9**: Create git commit with conventional commit format message
  - **FR-10**: Push commit to remote origin on current feature branch using standard git push

  ## Non-Functional Requirements

  - **NFR-1**: Complete feature implementation in under 15 minutes (Size estimate S maintained)
  - **NFR-2**: No modifications to source code in /src/sheep/ or configuration files
  - **NFR-3**: No test modifications or additions required
  - **NFR-4**: Follow established git workflow pattern: file creation → stage → commit → push
  - **NFR-5**: No directory structure changes; file added only to repository root
  - **NFR-6**: Content generated deterministically using Python pathlib and standard file I/O

  ## Product Questions & AI Recommendations

  **No open product questions** — Feature specification is fully determined by the established pattern
  from 170+ prior implementations. All key decisions have been resolved:

  | Decision | Answer | Rationale |
  | -------- | ------ | --------- |
  | File name | `test-jn0b4n.md` (specified in user query) | Explicitly provided in requirement |
  | File location | Repository root | Established pattern from 170+ prior test files |
  | Content format | H1 heading + 2-3 sentences | Defined in established pattern and validated in prior features |
  | Topic selection | Flexible/implementer-chosen | No constraint in specification; implementer chooses topic coherently |
  | Implementation approach | Direct Python file I/O using pathlib | Simple, proven approach from features 166-170 |
  | Git workflow | Conventional commits, push to feature branch | Pattern proven in 170+ prior features |
  | Validation approach | Manual checks or helper scripts | Established pattern demonstrated in create_markdown_file.py and similar files |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 170+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code organized into modules:
    - `agents/`: Agent definitions for research, implementation, and review
    - `config/`: Configuration and LLM factory (settings.py, llm.py)
    - `flows/`: Flow definitions and orchestration (code_implementation.py)
    - `tools/`: Git and file operation tools
    - `observability/`: Logging and Langfuse integration
    - `features/`: Individual feature implementation modules
  - **specs/**: Feature specification directory with subdirectories for each feature (specs/171-markdown-file-creation-709416/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation describing the platform and capabilities

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They demonstrate completed iterations
  of identical feature implementations.

  ### Architecture Patterns

  **Established File Creation Pattern (170+ precedents)**:
  - Simple file creation leveraging Python pathlib for cross-platform I/O operations
  - Each markdown file follows the format: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings, typical size 300-600 bytes
  - Implementation uses straightforward imperative code with standard Python libraries

  **File Validation Pattern** (observed in create_markdown_file.py and similar):
  - Verify file exists with non-zero content
  - Check UTF-8 encoding without BOM using binary read
  - Verify Unix LF line endings (not CRLF)
  - Validate markdown structure (H1 heading on first line, blank line, prose content)
  - Count sentences to ensure 2-3 sentence requirement met
  - Validate file size within typical range (350-700 bytes)

  **Git Workflow Pattern**:
  - Create/modify files in working directory
  - Stage with git add
  - Commit with conventional commit format: `feat(171): Create markdown file test-jn0b4n.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 001-170):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Reusable validation patterns from prior implementations

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher; features pathlib, f-strings, type hints
  - **pathlib (Python standard library)**: Used for cross-platform file I/O operations (Path.cwd(), Path().write_text())
  - **subprocess (Python standard library)**: Used for git operations (git add, git commit, git push)
  - **Markdown syntax**: Simple CommonMark format with H1 heading (#) and prose content
  - **Git**: Version control system for staging, committing, and pushing changes
  - **GitPython 3.1.0+**: Python library for Git operations (available in project dependencies)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-jn0b4n.md) to existing collection of 170+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~300-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-170; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |

  ## Dependencies

  - **Git repository**: Feature branch `feat/171-markdown-file-creation-709416` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 170+ test files provide proven precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Git command-line tools**: Standard git must be available in the shell environment

  ## Size Estimate

  **S (Small — approximately 10-15 minutes)** — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~3-5 minutes (write markdown content with H1 heading + 2-3 sentences of prose)
  - **File validation**: ~2-3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Fully mature pattern with 170+ identical test files providing clear, proven precedent
  - Straightforward helper scripts (create_markdown_file.py, create_test_*.py files) available as reference
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (166-170) demonstrate efficient implementation of identical features in 10-15 minutes
  - All product decisions are straightforward; no ambiguity or stakeholder input required
