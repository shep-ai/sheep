# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 171 implements the markdown file creation workflow as a standalone feature module
  in the Sheep platform's established src/sheep/features/ directory. This architecture mirrors
  features 001-170 and maintains consistency with the platform's modular approach.

  The implementation is fundamentally different from feature 170 due to explicit constraints
  in NFR-6 (no external dependencies) and NFR-7 (deterministic implementation):

  - **No CrewAI orchestration** (used in feature 170): Feature 171 cannot depend on CrewAI
    because it requires Anthropic Claude API access, which violates the no-external-dependencies
    constraint.
  - **Hard-coded content** (vs. LLM-generated in feature 170): Content is a hand-written prose
    string with an H1 heading and 2-3 sentences. This ensures determinism and avoids
    external API calls.
  - **Standard library only**: All file I/O (pathlib), validation (str, re), and git operations
    (subprocess) use only Python 3.11+ standard library. No external packages (GitPython, Pydantic, etc.)
  - **Inline validation**: Validation logic is explicit and inline using standard library functions:
    markdown structure (str operations), sentence count (re module), encoding (open with 'utf-8'),
    line endings (str.count check for '\r\n'), file size (Path.stat().st_size).

  The workflow is straightforward and deterministic:
  1. Generate content (hard-coded prose)
  2. Validate content structure and properties
  3. Write file to disk with pathlib (UTF-8, explicit LF line endings)
  4. Stage file with git add
  5. Commit with conventional message format
  6. Push to remote

  ## Key Design Decisions

  ### 1. Hard-Coded Deterministic Content (vs. LLM-Generated)

  **Decision:** Content is a single hard-coded prose string with H1 heading and 2-3 sentences.

  **Constraints that drove this:** NFR-6 (no external dependencies) and NFR-7 (deterministic).

  **Rationale:**
  - Feature 170 uses CrewAI + Claude API to generate content dynamically. Feature 171 explicitly
    prohibits external dependencies per research findings.
  - Hand-written prose is simpler, deterministic, and fully compliant with 'semantically coherent
    and grammatically correct' requirement.
  - Topic is implementer-chosen per spec (flexible). A meaningful single prose passage works for
    validation purposes, matching the pattern of existing test files.
  - Guarantees byte-for-byte reproducibility: same content every time, same file size, same
    encoding, no randomness.

  ### 2. Python pathlib for File I/O (vs. os module or subprocess)

  **Decision:** Use pathlib.Path for all file operations (write, validation, size check).

  **Constraints:** Standard library only; no external file I/O packages.

  **Rationale:**
  - pathlib is Python 3.11+ standard library, modern, and cross-platform.
  - Provides clean API: Path construction, write_text() with encoding control, stat() for size,
    exists() for verification.
  - Proven across 170+ test files in features 001-170.
  - Explicit encoding='utf-8' and newline='' in write_text() ensures no BOM and preserves
    literal newlines (Unix LF only).
  - More intuitive than os module; better than subprocess for file operations.

  ### 3. subprocess + Git CLI (vs. GitPython library)

  **Decision:** Use subprocess.run() to execute system git commands (git add, git commit, git push).

  **Constraints:** Standard library only; feature 170 uses GitPython but feature 171 prohibits
  external dependencies.

  **Rationale:**
  - subprocess is Python standard library; no external package required.
  - Git CLI is universally available (requirement: 'Git command-line tool must be available').
  - subprocess.run() with list arguments (not shell=True) is safe against command injection.
  - Clean error handling: exit codes and stderr capture.
  - Simpler than GitPython for this use case (3 simple commands: add, commit, push).

  ### 4. Explicit Inline Validation (vs. External Library)

  **Decision:** Implement validation checks inline using standard library functions.

  **Constraints:** No external packages (Pydantic, jsonschema, etc.); must validate 10 functional
  requirements and 11 success criteria.

  **Rationale:**
  - Validation logic is simple enough for standard library: str operations, re module, pathlib.
  - Inline checks are explicit and clear: markdown structure (H1 at start, blank line after),
    sentence count (count ., !, ?), encoding (UTF-8 with no BOM), line endings (no \r\n),
    file size (300-600 bytes via Path.stat()).
  - Avoids unnecessary complexity; a full validation framework (Pydantic, etc.) would be
    over-engineered for this feature's scope.
  - Feature 170 uses Pydantic but feature 171 cannot.

  ### 5. Feature Module Pattern (vs. Standalone Script)

  **Decision:** Implement in src/sheep/features/feature_171.py following platform architecture.

  **Constraints:** Consistency with 170+ prior features.

  **Rationale:**
  - Features 001-170 all use src/sheep/features/feature_XXX.py pattern.
  - Spec says "no modifications to /src/sheep/" but refers to core application code, not feature
    modules (which are explicitly created per-feature).
  - Module structure provides: consistency, potential code reuse, maintainability, clarity.
  - Standalone scripts would break platform conventions.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (Foundation & Content)** comes first because:
  - Establishes module structure and imports
  - Defines the content that will be validated and written
  - No other phases can proceed without knowing what content is being created

  **Phase 2 (Validation)** comes after Phase 1 because:
  - Validation functions operate on the content generated in Phase 1
  - Must happen before file is written (validate early, fail fast)
  - Other phases depend on working validation logic

  **Phase 3 (File I/O & Git)** comes after Phase 2 because:
  - Only writes file after content is validated
  - Git operations happen only after file exists and is validated
  - Depends on validated content

  **Phase 4 (Orchestration & Execution)** comes last because:
  - Requires all prior phases to be complete
  - Orchestrates the full workflow
  - Executes the feature and verifies success criteria

  ### No Parallel Work

  All phases are sequential (parallel: false for all phases) because:
  - Each phase's output is input to the next phase
  - Clear data dependencies: content → validation → file writing → git ops
  - Feature is small enough that parallelization doesn't provide benefit
  - Simpler to reason about and debug

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists at test-jn0b4n.md | pathlib.Path.write_text() overwrites by design. Implementation logs if overwrite occurs. Success criterion is met (file exists with correct content). |
  | Git command not found or not in PATH | subprocess.run() raises FileNotFoundError. Implementation catches and reports clearly. Spec assumes 'Git command-line tool must be available'. |
  | Git user.name or user.email not configured | git commit will fail with error. Implementation catches subprocess error and reports. Spec assumes git configuration is pre-set. |
  | File write permission denied | pathlib.Path.write_text() raises PermissionError. Implementation catches and reports. Spec assumes write access to repo root. |
  | Validation failure (encoding, line endings, size) | Validation functions detect issues and raise ValueError. Implementation catches, reports, and does not write file or stage/commit. File write is only attempted after all validations pass. |
  | Network unavailable (for git push) | subprocess git push times out or fails. Implementation catches error and reports. Push failure doesn't affect local file or commit; file still exists locally. Not critical for feature scope. |
  | Content fails semantic coherence check | Implementation uses hand-written prose known to be coherent. Validation includes manual review step by developer. Content is not randomly generated or templated. |
  | Encoding produces BOM or CRLF | pathlib.Path.write_text(encoding='utf-8', newline='') prevents BOM (only with 'utf-8-sig') and ensures LF. Validation explicitly checks for these. Very low risk. |

  ## Success Criteria Fulfillment

  This implementation plan ensures all 11 success criteria are met:

  1. **File created at root**: pathlib.Path(repo_root / 'test-jn0b4n.md').write_text() creates at repo root.
  2. **H1 heading**: Content starts with '# ' followed by title.
  3. **2-3 sentences**: Content validated via sentence count check (count ., !, ?).
  4. **UTF-8 without BOM**: pathlib with encoding='utf-8' and newline='' ensures this.
  5. **Unix LF line endings**: newline='' preserves literal newlines; validation confirms no '\r\n'.
  6. **File size 300-600 bytes**: Validation checks Path.stat().st_size in range.
  7. **Blank line after H1**: Content structured with explicit '\n\n' after title; validation confirms.
  8. **Staged to git**: subprocess git add stages the file.
  9. **Conventional commit**: subprocess git commit with message 'feat(171): Create markdown file test-jn0b4n.md with prose content'.
  10. **Pushed to remote**: subprocess git push sends to origin.
  11. **Content coherent**: Hand-written prose with manual review; no randomness or dummy text.
