        description: >
          External libraries provide robust sentence tokenization. Violates NFR-6 (no external dependencies).
          Not viable for this feature.
        selected: false
      - option: "Manual inspection without automated validation"
        description: >
          Developer manually checks prose during implementation. No automated validation code. Violates FR-2
          and NFR-8 ('all validations must be automated'). Not acceptable.
        selected: false
    selectionRationale: >
      Regex/split approach uses only standard library, is simple, and sufficient for the controlled prose content
      (implementer writes 2-3 sentences carefully without abbreviations). Manual checks in existing test files
      show simple sentence counts work fine. FR-2 requires automated validation, so manual inspection is not
      acceptable. External libraries violate constraints.

  - question: "Should implementation be in module structure (src/sheep/features/) or standalone script?"
