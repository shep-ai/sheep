decisions:
  - title: "Content Generation Strategy"
    chosen: "Hard-coded deterministic prose with meaningful topic"
    rejected:
      - "Claude API via CrewAI — Violates NFR-6 (no external dependencies); feature 171 explicitly prohibits CrewAI and Claude API"
      - "Random word/sentence generation — Violates requirement for 'semantically coherent' content and violates NFR-7 (determinism)"
      - "Template-based generation — Unnecessary complexity; hard-coded prose is simpler and fully deterministic"
    rationale: >
      Feature 171 spec explicitly states NFR-6: \"No external dependencies; use only Python 3.11+ standard library\"
      and NFR-7: \"Implementation must be deterministic\". Hard-coded prose meets both constraints while satisfying
      the requirement for \"semantically coherent and grammatically correct\" content. The topic is implementer-chosen
      (per spec) and does not require non-deterministic input. Existing test files demonstrate that single coherent
      prose passages work perfectly.

  - title: "File I/O Library"
    chosen: "Python pathlib (standard library)"
    rejected:
      - "os module with open() — Less modern; pathlib is the preferred interface in Python 3.11+"
      - "External file I/O libraries — Violates NFR-6 (standard library only)"
      - "subprocess-based file writing — Unnecessary overhead; pathlib handles all operations directly"
    rationale: >
      pathlib.Path is part of Python 3.11+ standard library, provides cross-platform file operations, and is proven
      across 170+ test files in features 001-170. Modern, intuitive interface for Path construction, existence checking,
      file writing with encoding control. Consistent with established pattern in feature 170's write_markdown_file().

  - title: "Encoding and Line Ending Management"
    chosen: "Explicit UTF-8 encoding with newline parameter control for Unix LF line endings"
    rejected:
      - "Platform-default encoding — Violates success criterion requiring Unix LF line endings; would produce CRLF on Windows"
      - "Post-processing with sed/awk — Overcomplicates implementation; Python's open() handles this natively"
      - "Binary mode with manual byte handling — More complex; text mode with newline parameter is simpler and proven"
    rationale: >
      Python's open(newline='') with encoding='utf-8' ensures text-mode encoding while preserving literal newline
      characters. No BOM is produced with encoding='utf-8' (BOM only appears with 'utf-8-sig'). Success criteria require
      Unix LF line endings (0x0A) and UTF-8 without BOM. This approach is proven across 170+ test files in feature 170.
      Cross-platform and deterministic.

  - title: "Git Integration Approach"
    chosen: "subprocess.run() with system git CLI commands (no GitPython library)"
    rejected:
      - "GitPython library — Violates NFR-6 (no external dependencies); feature 170 uses it but feature 171 does not"
      - "Manual git directory manipulation — Unnecessary complexity; git CLI is mature and universally available"
      - "Shell script wrapper — Reduces portability; subprocess is Python standard library"
    rationale: >
      Feature 171 explicitly prohibits external dependencies including GitPython. subprocess.run() is Python standard
      library and provides clean interface for executing system git commands (git add, git commit, git push). Git CLI
      is universally available on all development systems (requirement: 'Git command-line: Standard git CLI tool must
      be available and executable'). subprocess handles exit codes and error reporting properly.

  - title: "Validation Strategy"
    chosen: "Explicit inline validation checks using standard library only (str operations, re module, pathlib)"
    rejected:
      - "External validation library (Pydantic, etc.) — Violates NFR-6 (no external dependencies)"
      - "Consolidated validation helper module — Over-engineered for single-use feature; inline is clearer"
      - "Minimal validation — Violates FR-1 through FR-10 which require comprehensive validation"
    rationale: >
      Feature 171 specifies 10 functional requirements (FR-1 to FR-10) and 11 success criteria that must all be
      validated. Inline validation using standard library (pathlib, str operations, re module, open() with encoding)
      is straightforward and explicit. Validation checks include markdown structure (str.count, regex), sentence count
      (split on punctuation), encoding (decode UTF-8, check for BOM), line endings (check for \\r\\n), file size
      (Path.stat().st_size). All use only standard library.

