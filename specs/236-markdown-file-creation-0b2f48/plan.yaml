# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 236 implements markdown file creation following the established pattern proven across 235+ identical
  prior features. The architecture is deliberately decoupled from the main application:

  - **Test Artifact Location**: Repository root (test-*.md files are build artifacts, not source code)
  - **Source Code Impact**: Zero — feature only calls existing utility functions from content_generators.py
  - **Reusable Utilities**: Five functions already implemented and production-tested across 235+ features
  - **Orchestration Pattern**: Linear five-step workflow proven to work reliably

  The feature module acts as a lightweight orchestrator that sequences the existing utilities in the correct
  order, providing a clear, testable implementation that can be executed directly (python -m sheep.features.feature_236_...)
  or imported programmatically.

  ### Codebase Integration

  The implementation integrates with the Sheep platform's existing architecture:

  1. **Content Generation** — Uses create.get_reasoning_llm() from config/llm.py (CrewAI framework)
  2. **File I/O** — Uses pathlib.Path from standard library (wrapped by write_markdown_file())
  3. **Validation** — Uses regex and binary file operations (encapsulated in validate_markdown_file())
  4. **Git Integration** — Uses GitCommitTool and GitPushTool from tools/git_tools.py
  5. **Logging & Observability** — Uses sheep.observability.logging for all operations

  The feature module imports these utilities and calls them in sequence. No modifications to these utilities
  are required; the module is a thin orchestration layer.

  ## Key Design Decisions

  ### Decision 1: Reuse generate_markdown_content() from content_generators.py

  **Chosen Approach:** Call the existing generate_markdown_content() function

  **Rationale:**
  - Function encapsulates MARKDOWN_GENERATION_PROMPT and Claude API invocation
  - Enforces content validation (H1 heading start, minimum content, 2-3 sentences)
  - Adds trailing newline per Unix convention
  - Used successfully across 235+ features — proven, tested code
  - Consistency requirement: deviating would risk format divergence

  **Rejected Alternatives:**
  - Implement custom LLM integration — violates DRY, breaks established pattern
  - Use direct Anthropic SDK — duplicates config.llm factory logic, reduces flexibility

  ### Decision 2: Use write_markdown_file() wrapper for safe file I/O

  **Chosen Approach:** Call write_markdown_file(content, filename) from content_generators.py

  **Rationale:**
  - Enforces UTF-8 encoding without BOM (critical for NFR-1)
  - Validates filename for path traversal attacks (/, \, . prefixes)
  - Verifies file exists and is non-empty after write
  - Provides consistent encoding across all generated files
  - Encapsulates safety checks that manual open() would require

  **Rejected Alternatives:**
  - Direct pathlib.Path.write_text() — bypasses encoding validation, risks BOM issues
  - Manual open() with encoding="utf-8" — error-prone, duplicates safety logic

  ### Decision 3: Validate with validate_markdown_file()

  **Chosen Approach:** Call validate_markdown_file(filepath) for comprehensive validation

  **Rationale:**
  - Checks UTF-8 encoding and rejects files with BOM
  - Detects CRLF line endings (Windows format) and enforces LF (Unix)
  - Validates markdown structure (H1 heading, blank line after heading)
  - Counts sentences and enforces 2-3 requirement
  - Checks trailing newline (Unix convention)
  - Comprehensive authority on file validity

  **Rejected Alternatives:**
  - No validation — risks invalid files violating NFR requirements
  - Partial validation — misses important structure checks

  ### Decision 4: Git workflow via GitCommitTool and GitPushTool

  **Chosen Approach:** Use commit_markdown_file() and push_markdown_file() from content_generators.py

  **Rationale:**
  - commit_markdown_file() encapsulates GitCommitTool._run() with proper error handling
  - Supports custom_message parameter for conventional commit format
  - push_markdown_file() uses GitPushTool with set_upstream=True (establishes branch tracking)
  - These tools use subprocess with capture_output=True (no shell injection risk)
  - Established pattern across all 235+ prior features

  **Rejected Alternatives:**
  - Raw subprocess.run() with git commands — no error handling abstraction
  - GitPython or other wrapper — adds external dependency, inconsistent with codebase

  ### Decision 5: Dedicated feature module following feature_227 pattern

  **Chosen Approach:** Create src/sheep/features/feature_236_markdown_file_creation.py

  **Rationale:**
  - All 235+ prior features use this pattern — consistency requirement
  - Feature 227 (most recent reference) demonstrates optimal structure:
    - Module docstring with clear purpose
    - FEATURE_NUMBER and MARKDOWN_FILENAME as constants
    - Main orchestration function
    - __main__ block for direct execution
  - Makes feature execution explicit and testable
  - Supports both import (programmatic) and direct execution (CLI)
  - Clear separation of concerns

  **Rejected Alternatives:**
  - Use generic create_markdown_file() orchestrator — less explicit, requires post-processing
  - Inline orchestration — duplicates logic, breaks consistency

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  ### Phase 1: Feature Module Implementation
  Create the Python module that orchestrates the five-step workflow. The module will:
  1. Define constants (FEATURE_NUMBER=236, MARKDOWN_FILENAME="test-5aiifd.md")
  2. Import the five utility functions from content_generators.py
  3. Implement create_feature_236_markdown_file() function that:
     - Calls generate_markdown_content() to create prose
     - Calls write_markdown_file() to write to disk
     - Calls validate_markdown_file() to verify structure
     - Calls commit_markdown_file() with conventional commit message
     - Calls push_markdown_file() to push to feature branch
  4. Return results dict with status and metadata
  5. Add __main__ block for direct execution

  This module is self-contained and requires no modifications to existing code.

  ### Phase 2: Execution & Validation
  Execute the feature module to generate the artifact and validate:
  1. Run the feature module: python -m sheep.features.feature_236_markdown_file_creation
  2. Verify markdown file properties (name, encoding, line endings, structure)
  3. Verify git history (commit message format, file staging, branch state)
  4. Confirm all success criteria are satisfied
  5. Ensure changes are ready for merge to main

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API rate limit or timeout | Existing generate_markdown_content() has retry logic and error handling; feature inherits this robustness |
  | File encoding issues (BOM, CRLF) | write_markdown_file() enforces UTF-8; validate_markdown_file() rejects any encoding violations |
  | Git operation failure (network, permissions) | GitCommitTool and GitPushTool have error handling; feature will propagate clear error messages |
  | Markdown validation failure | validate_markdown_file() is authoritative; failures indicate content generation issue, not implementation bug |
  | Path traversal or file system attack | write_markdown_file() validates filename; repository root only destination |
  | Concurrent execution conflicts | Feature branch pre-exists; simple linear workflow with no concurrency complexity |
  | Inconsistency with established pattern | Feature strictly follows feature_227 reference implementation and 235+ precedents |

  ## Why This Architecture

  The architecture is optimized for **consistency**, **maintainability**, and **risk minimization**:

  - **Consistency**: Identical structure to 235+ prior features ensures team familiarity and reduces cognitive load
  - **Reuse**: Leverages production-tested utilities instead of reinventing — DRY principle
  - **Testability**: Feature module can be unit tested independently and imported in integration tests
  - **Safety**: Write_markdown_file() and validate_markdown_file() are the authorities on file safety and validity
  - **Observability**: All operations logged through sheep.observability.logging for traceability
  - **Simplicity**: Five-step orchestration is easy to understand and debug

  No architectural changes are required. The feature fits seamlessly into the existing infrastructure.

