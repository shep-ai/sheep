content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-5aiifd.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  LLM-based content generation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 235+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in earlier features, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-5aiifd.md` exists in repository root directory
  - [ ] File contains exactly one H1 markdown heading (format: `# Heading`)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] Prose and heading are substantively related (title describes content)
  - [ ] File structure follows established format: `# <Heading>\n\n<2-3 sentence prose>\n`
  - [ ] File content is valid CommonMark markdown (no syntax errors)
  - [ ] File uses UTF-8 character encoding without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is 400-600 bytes (natural result of proper structure)
  - [ ] File is staged with `git add test-5aiifd.md`
  - [ ] Changes are committed with message: `feat(236): Create markdown file test-5aiifd.md with prose content`
  - [ ] Commit follows conventional commits format (feat prefix, scope, subject)
  - [ ] Changes are pushed to feature branch `feat/236-markdown-file-creation-0b2f48`
  - [ ] No modifications to source code files (`/src/sheep/` directory)
  - [ ] No modifications to test files (`/tests/` directory)
  - [ ] No modifications to configuration files (pyproject.toml, .env, etc.)

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-5aiifd.md` at repository root (exact filename as specified)
  - **FR-2**: File must contain exactly one H1 heading using markdown syntax `# <heading text>`
  - **FR-3**: File must contain 2-3 complete sentences of prose after the heading, separated by blank line
  - **FR-4**: Prose content must be substantively related to the H1 heading (title describes subject matter)
  - **FR-5**: Content structure must follow established pattern: one blank line after heading, prose on separate lines, single trailing newline
  - **FR-6**: Content generation must use Claude API via LLM framework (src/sheep/content_generators.py:generate_markdown_content())
  - **FR-7**: Stage the created file in git using `git add test-5aiifd.md` command
  - **FR-8**: Commit staged changes with conventional commit message: `feat(236): Create markdown file test-5aiifd.md with prose content`
  - **FR-9**: Push committed changes to feature branch `feat/236-markdown-file-creation-0b2f48` using `git push origin <branch>`

  ## Non-Functional Requirements

  - **NFR-1**: File character encoding must be UTF-8 without BOM (Byte Order Mark) per Unicode standard
  - **NFR-2**: Line endings must be Unix-style LF (`\n`, character code 0x0A), not Windows CRLF (`\r\n`)
  - **NFR-3**: File size should naturally result from proper content structure (expected 400-600 bytes)
  - **NFR-4**: Implementation must not modify any source code, tests, or configuration files (read-only outside of file creation)
  - **NFR-5**: Markdown content must be valid per CommonMark specification (https://spec.commonmark.org/)
  - **NFR-6**: Implementation must follow established pattern from 235+ prior identical features (consistency requirement)
  - **NFR-7**: Implementation must use Python 3.11+ and standard library tools (pathlib module for file I/O)
  - **NFR-8**: Git workflow must follow conventional commits standard for commit messages
  - **NFR-9**: Feature branch must pre-exist (provided by feature setup, no branch creation needed)
  - **NFR-10**: LLM API calls must use the configured reasoning LLM from sheep.config.llm module

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should topic selection be completely free or constrained to specific domains? | Free topic selection (any domain) | Aligns with 235+ precedents showing diverse topics; reduces constraints; maintains consistency with established pattern |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an automated code implementation platform with the following structure:

  - **Repository root**: Contains 235+ test markdown files (test-*.md pattern) from repeated markdown-file-creation features
  - **src/sheep/**: Application source code organized into modular components:
    - `agents/`: Agent definitions (Research, Implementation, Review agents)
    - `config/`: Configuration management (settings, LLM factory with get_reasoning_llm())
    - `flows/`: Flow definitions and orchestration logic
    - `tools/`: Agent tools (git_tools.py including GitCommitTool, GitPushTool; file_tools.py)
    - `content_generators.py`: Content generation utilities (generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file())
    - `observability/`: Logging and tracing (Langfuse integration)
    - `cli.py`: CLI entry point
    - `features/`: Feature implementation modules (feature_227_markdown_file_creation.py and others showing established pattern)
  - **specs/**: Feature specification directory with subdirectories for each feature (e.g., specs/236-markdown-file-creation-0b2f48/)
  - **tests/**: Test suite for application validation
  - **pyproject.toml**: Python project metadata and dependencies (requires Python 3.11+)
  - **.github/**: GitHub Actions workflows and CI/CD configuration
  - **Dockerfile**: Container configuration for deployment
  - **README.md**: Comprehensive platform documentation

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as lightweight validation
  artifacts for the automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (235+ identical precedents):
  - Content generation using Claude API via LLM framework (generate_markdown_content() from content_generators.py)
  - File writing using Python pathlib (Path.write_text() with UTF-8 encoding)
  - Standard markdown structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding without BOM (Byte Order Mark) - enforced in write_markdown_file()
  - Unix-style LF line endings (`\n`), not Windows CRLF - ensured by pathlib on Unix systems
  - File size naturally results from proper structure: typically 400-600 bytes
  - Implementation uses orchestration pattern: generate → write → validate → commit → push
  - Files are isolated test artifacts with zero dependencies on application source code
  - Topic selection is free-form (Claude API generates any appropriate topic)

  **Content Generation** (core implementation in src/sheep/content_generators.py):
  - LLM prompt template in MARKDOWN_GENERATION_PROMPT
  - Claude API invocation via get_reasoning_llm().call()
  - Content validation checks: H1 heading start, non-empty content, 2-3 sentences (counting periods)
  - Automatic trailing newline addition for Unix convention

  **Git Workflow Pattern** (consistent across 235+ precedents):
  - Feature branch pre-created as `feat/236-markdown-file-creation-0b2f48`
  - Simple create/modify in working directory, no complex branching
  - Stage with `git add test-5aiifd.md`
  - Commit with conventional commit format: `feat(236): Create markdown file test-5aiifd.md with prose content`
  - Push changes to feature branch using GitPushTool
  - No modifications to source code, tests, or configuration files
  - Branch naming convention: `feat/<number>-<feature-name>-<suffix>`

  **Feature Implementation Pattern** (observed across features 001-235+):
  - Minimal, isolated changes affecting only repository root
  - Zero dependencies on application source code (/src/sheep/) except for utility functions
  - Single-file operations with straightforward Python file I/O
  - Each feature is structurally identical with identical success criteria
  - Implementation time is consistently 10-15 minutes per feature
  - Reuse of src/sheep/content_generators.py functions across all similar features

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **Claude API**: LLM-based content generation via Anthropic SDK, accessed through CrewAI LLM framework
  - **CrewAI**: Framework for agent-based automation; provides LLM abstraction via get_reasoning_llm()
  - **pathlib (Python standard library)**: File I/O operations (Path.write_text() for UTF-8 file creation)
  - **Git**: Version control; file staging, commits, branch management via GitCommitTool and GitPushTool
  - **Markdown syntax**: Simple format with H1 heading and prose per CommonMark specification
  - **UTF-8 Encoding**: File encoding standard with no BOM (Byte Order Mark)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-5aiifd.md) to existing collection of 235+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-235; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation using existing utilities; does not add new source code, modify agents, flows, or tools |
  | Tests | None | No test modifications, no test failures expected, no test coverage impact |
  | Configuration Files | None | No changes to pyproject.toml, .env, or other configuration |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other spec files |
  | Content Generators (src/sheep/content_generators.py) | None | Feature reuses existing utility functions; no modifications needed |

  ## Dependencies

  - **Git repository**: Feature branch `feat/236-markdown-file-creation-0b2f48` must exist (pre-created)
  - **File system**: Write access to repository root directory (standard, already available)
  - **Established pattern**: 235+ test files provide clear, proven precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (zero external dependencies)
  - **Claude API**: Must be configured via environment variables (ANTHROPIC_API_KEY) per .env.example
  - **CrewAI LLM framework**: Already integrated in src/sheep/config/llm.py (get_reasoning_llm() function)
  - **Content generators**: src/sheep/content_generators.py module with generate_markdown_content(), write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file() functions
  - **File naming**: Filename `test-5aiifd.md` is provided in the feature spec and must be used exactly

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~3 minutes (invoke generate_markdown_content() via Claude API)
  - **File creation**: ~2 minutes (call write_markdown_file() with generated content)
  - **Validation**: ~2 minutes (call validate_markdown_file() to verify UTF-8 encoding, LF line endings, structure)
  - **Git workflow**: ~3-5 minutes (call commit_markdown_file() and push_markdown_file() functions)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 235+ identical test files providing clear, proven precedent
  - Claude API handles content generation automatically (no manual writing needed)
  - Existing utility functions in src/sheep/content_generators.py handle all heavy lifting (file writing, validation, git operations)
  - Single file with minimal, well-understood content format (one H1 heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (features 235, 234, 233, etc.) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-5aiifd.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 235+ prior implementations
  - No complexity, no edge cases, no dependencies to resolve beyond Claude API configuration

