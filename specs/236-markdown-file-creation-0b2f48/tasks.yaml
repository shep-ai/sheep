# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 236 is implemented in two tasks across two phases:

  **Phase 1: Feature Module Implementation** (Task 1, ~5 min)
  Create the Python module that orchestrates the five-step markdown file creation workflow.
  The module imports existing utility functions and sequences them in the correct order:
  generate markdown content via Claude API → write file with UTF-8 encoding → validate structure →
  commit with conventional message → push to feature branch. The module is tested with TDD
  (write test, implement function, refactor for clarity and error handling).

  **Phase 2: Execution & Validation** (Task 2, ~10 min)
  Run the feature module to generate the test artifact and perform comprehensive validation.
  Verify that the markdown file has correct properties (encoding, line endings, structure, size),
  validate git history (commit message format, file staging, branch tracking), and confirm all
  12 success criteria from the specification are satisfied. This operational task uses tdd: null
  since it is verification/execution, not code development.

  **Total Effort**: 15 minutes (3-5 minutes for content generation via Claude API, 10-15 minutes
  for implementation, testing, and validation combined)

  ## Implementation Notes

  ### Phase 1 Approach

  The feature module is a thin orchestration layer (~50 lines of Python) that:

  1. **Imports existing utilities** from sheep.content_generators and sheep.tools
  2. **Defines metadata constants** (FEATURE_NUMBER, MARKDOWN_FILENAME) for clarity
  3. **Implements five-step orchestration function** that calls utilities in sequence
  4. **Returns result dictionary** with status for downstream processing
  5. **Supports direct execution** via __main__ block for CLI usage

  The module follows the exact pattern used in feature_227 (reference implementation) and
  235+ prior features. No modifications to existing utilities are required.

  ### Phase 2 Approach

  Execution validation checks:

  - **File properties**: Existence, encoding (UTF-8 no BOM), line endings (LF only), size (400-600 bytes)
  - **Content structure**: H1 heading present, blank line after heading, 2-3 sentences, trailing newline
  - **Git state**: File staged, commit message correct, branch correct, branch tracking established
  - **Specification alignment**: All 12 success criteria satisfied, no violations of 10 non-functional requirements

  The validation is performed using standard tools (cat, xxd, wc, git log, git status) to verify
  the implementation produced the expected artifact.

  ## Why Two Tasks

  - **Task 1 (Implementation)** is a code task with TDD cycles: write test, implement, refactor
  - **Task 2 (Validation)** is an operational task (tdd: null) that verifies the result

  Separating them makes it clear what is development work vs. verification work, and allows
  tracking progress through both implementation and validation phases.

  ## Dependencies and Ordering

  - Task 2 depends on Task 1 (module must exist before it can be executed)
  - Both tasks must complete sequentially (no parallelization)
  - Validation cannot begin until the module is implemented and functional

  ## Estimated Effort Breakdown

  - **Task 1 (Implementation)**: ~5 minutes
    - Writing test structure: ~1 minute
    - Implementing the five-step orchestration: ~2 minutes
    - Refactoring and error handling: ~2 minutes

  - **Task 2 (Validation)**: ~10 minutes
    - Executing feature module: ~3-5 minutes (dominated by Claude API latency)
    - File property validation: ~2 minutes
    - Git state validation: ~2 minutes
    - Final success criteria checklist: ~1-2 minutes

  **Total: 15 minutes** (matches spec's S (Small) estimate of 10-15 minutes)

