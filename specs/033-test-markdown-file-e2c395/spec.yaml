content: |
  ## Problem Statement

  Create a single markdown file called test-6z96k8.md in the root directory with a
  markdown title and 2-3 sentences of content about any topic. This is a simple
  content addition task following the established pattern from recent features
  (029-032) that created similar test markdown files (test-an5dun.md, test-xa3rxn.md,
  test-mf05k4.md, test-gsul5o.md).

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation using
  CrewAI. The current working directory contains:

  - **Root directory**: Primary location for markdown content files (test files, documentation,
    design patterns, state machines, etc.)
  - **specs/ directory**: Contains feature specifications organized by number and name
    (e.g., 033-test-markdown-file-e2c395/)
  - **/.github/**: GitHub configuration
  - **/dockerfile**: Docker container configuration
  - **/.env.example**: Environment configuration template

  The repository primarily consists of markdown documentation and specification files
  with no build system, no code compilation, and no tests to pass.

  ### Architecture Patterns

  **Content-focused repository**: This repository follows a content-aggregation pattern
  where markdown files are the primary artifacts. Recent commits (029-032, 090-094)
  demonstrate a consistent pattern of adding individual markdown files to the root
  directory without modifying any system code or configuration.

  **Established pattern**: Features 029-032 created test markdown files following an
  identical structure:
  - Single markdown file in root directory
  - Filename format: test-[random_chars].md
  - Content: H1 heading (title) + 2-3 sentences
  - Commit format: feat(content): add [filename] markdown file
  - No modifications to other project files

  ### Relevant Technologies

  - **Markdown**: The only relevant technology. Standard markdown syntax with:
    - H1 headings using # syntax for titles
    - Plain text paragraphs for content
    - UTF-8 encoding
    - Unix/LF line endings (observed in existing files)

  No build tools, no testing frameworks, no code compilation—purely file creation.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Root directory | Low | Single file creation only; no modifications to existing files or directory structure |
  | Git repository | Low | Single file addition to version control; standard tracking with conventional commit |
  | Documentation | Negligible | Content file has no impact on project documentation, configuration, or system architecture |
  | Build/CI/Tests | None | Content files have no impact on build processes, CI pipelines, or test suites |
  | Configuration | None | No environment, dependency, or configuration changes needed |

  ## Dependencies

  None. This is a standalone file creation task with no dependencies on:
  - Existing code or libraries
  - Infrastructure or external services
  - Other features or files
  - Build or test systems

  The feature follows the well-established pattern already present in the repository
  (features 029-032) and requires only markdown file creation.

  ## Success Criteria

  - [ ] File test-6z96k8.md exists in the repository root directory
  - [ ] File contains exactly one markdown title using # (H1) heading syntax
  - [ ] File contains 2-3 complete sentences of descriptive content
  - [ ] File is valid markdown format with no syntax errors
  - [ ] File uses UTF-8 encoding with Unix/LF line endings
  - [ ] Changes are committed with conventional commit message format
  - [ ] Changes are pushed to feature branch (feat/033-test-markdown-file-e2c395)

  ## Functional Requirements

  - **FR-1**: Create file named test-6z96k8.md in repository root directory
  - **FR-2**: File must contain single markdown title using # (H1) heading syntax
  - **FR-3**: File must contain 2-3 complete sentences of descriptive content
  - **FR-4**: Content topic can be any subject (no restrictions on topic selection)
  - **FR-5**: File must be persisted to disk with UTF-8 encoding and Unix/LF line endings
  - **FR-6**: File must be tracked in git repository (not ignored by .gitignore)

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow markdown conventions established by
    features 029-032 (test-an5dun.md, test-xa3rxn.md, test-mf05k4.md, test-gsul5o.md)
  - **NFR-2**: Git commit must use conventional commit format: feat(content): add test-6z96k8.md markdown file
  - **NFR-3**: File must maintain consistency with project line ending standards (Unix/LF)
  - **NFR-4**: Implementation should be completed with minimal effort (estimated: <15 minutes)
  - **NFR-5**: Changes must not introduce breaking changes or affect other project files

  ## Size Estimate

  **S (Small)** — Trivial task requiring only file creation with minimal content.
  Estimated effort: 10-15 minutes. Reasoning:

  - Single file creation with no code analysis required
  - Well-established pattern from features 029-032 provides clear implementation template
  - No architecture decisions, code changes, or complex logic needed
  - Simple markdown syntax with no special requirements
  - Minimal git operations (add, commit, push)
  - No testing, building, or deployment considerations

  This is identical in scope and complexity to completed features 029-032, which all
  received S (Small) estimates and were implemented quickly.
