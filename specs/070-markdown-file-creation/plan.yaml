# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  The markdown-file-creation feature follows a simple, standalone pattern established by 65+ existing
  test files in the repository root. The implementation consists of two main operations:

  1. **File Creation**: Use Python's pathlib module to create a markdown file with proper structure
     (H1 heading + blank line + 2-3 sentences of prose), explicit UTF-8 encoding, and Unix LF
     line endings.

  2. **Git Integration**: Use subprocess to execute standard git operations (add, commit, push)
     with conventional commit formatting.

  The feature is intentionally independent from application source code (no modifications to
  /src/sheep/, tests/, or configuration files per NFR-7). This maintains clean separation
  between test artifacts and application logic, matching the pattern established by features
  063-069 and the 65+ existing test files.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path().write_text() with Explicit UTF-8 Encoding

  **Decision**: Use Python's modern pathlib API with explicit encoding='utf-8' parameter.

  **Rationale** (from research):
  - pathlib is the Python standard for file I/O since 3.4
  - write_text() provides clean, chainable syntax for content creation
  - Explicit encoding='utf-8' ensures platform-independent behavior
  - No external dependencies (part of standard library)
  - Matches established patterns in the project (features 063-069)

  **Alternatives Considered**:
  - open() context manager: More verbose, older style, requires separate encoding parameter
  - subprocess/shell commands: Introduces unnecessary external process, harder to control encoding
  - Third-party libraries: Adds dependencies when pathlib is sufficient

  ### 2. Prose Content: Handcrafted, Topic-Flexible

  **Decision**: Implementer writes 2-3 sentences on a topic of their choice (no procedural generation).

  **Rationale** (from research):
  - Spec explicitly grants implementer flexibility ("about anything" per user query)
  - Handcrafted content ensures FR-5 requirement: "readable and grammatically correct"
  - Matches pattern of all 65+ existing test files (diverse, meaningful prose)
  - Simpler than generation approaches, maintains content quality

  **Alternatives Considered**:
  - Procedural/random generation: Risks poor grammar, incoherent output
  - Template libraries: Unnecessary complexity, reduces content quality
  - Lorem ipsum: Not suitable for meaningful test files

  ### 3. Encoding & Line Endings: Python Text Mode

  **Decision**: Use Python text mode with explicit encoding='utf-8', rely on platform-aware
  newline handling. Explicit encoding ensures UTF-8 without BOM; Python automatically
  converts \n to platform-native line endings on write.

  **Rationale** (from research):
  - Python's text mode is the recommended approach for cross-platform file I/O
  - Explicit encoding='utf-8' ensures UTF-8 without BOM (Python's default for utf-8)
  - Automatic newline handling: LF on Unix (current environment), CRLF on Windows
  - Simpler and more reliable than binary mode or post-processing

  **Alternatives Considered**:
  - Binary mode with manual encoding: Requires explicit byte conversion, error-prone
  - System default encoding: Risks encoding mismatch on non-UTF-8 systems
  - Post-processing with sed/awk: Adds subprocess complexity, separates concerns

  ### 4. Git Integration: subprocess.run() for Standard Commands

  **Decision**: Use subprocess.run() to execute git commands (add, commit, push) as a
  list of arguments (no shell string evaluation).

  **Rationale** (from research):
  - subprocess is Python's standard for external command execution
  - List-based argument format eliminates shell injection risk
  - For simple git operations, subprocess is more lightweight than GitPython
  - Transparent, predictable command execution
  - Error handling via subprocess.run(check=True) raises CalledProcessError on failure

  **Alternatives Considered**:
  - GitPython library: Adds abstraction layer, subprocess is simpler for basic operations
  - Manual git implementation: Complex, error-prone, unnecessary
  - Shell script wrapping: Portability issues, harder to handle errors

  ### 5. Implementation Location: Standalone Repository Root

  **Decision**: Create file at repository root only, no modifications to /src/sheep/, tests/,
  or configuration files.

  **Rationale** (from research and spec NFR-7):
  - Feature is purely file creation and git workflow, not application logic
  - Explicit NFR-7 requirement: "no modifications to source code in /src/sheep/"
  - All 65+ precedent test files located at repository root
  - Features 063-069 follow identical standalone pattern
  - Maintains clean separation between test artifacts and application code

  **Alternatives Considered**:
  - Source code integration: Violates NFR-7, adds unnecessary complexity
  - Configuration modifications: Breaks established pattern from precedents
  - CrewAI agent integration: Over-engineered for simple file creation

  ### 6. Validation: Minimal Post-Creation Checks

  **Decision**: Verify file exists and is readable before git operations. Spec treats
  sentence count and file size as guidelines (not strict limits).

  **Rationale** (from research and spec):
  - Minimal validation catches obvious failures (permissions, disk space) without over-engineering
  - Spec explicitly resolves: "Strict enforcement" for format (2-3 sentences expected)
    but "Guideline, not limit" for file size (400-600 bytes is typical)
  - Programmatic validation of prose grammar/readability requires sophisticated NLP (not feasible)
  - Simple existence/readability check is sufficient to catch errors

  **Alternatives Considered**:
  - Complex validation (regex sentence counting, byte-exact size limits): Over-engineering
  - No validation: Risks silent failures, reduces debuggability

  ### 7. Error Handling: Explicit Exceptions with Informative Messages

  **Decision**: Use try-except blocks to catch file I/O and subprocess errors, report
  clearly what operation failed and why.

  **Rationale**:
  - File operations can fail (permissions, disk space, git configuration)
  - Explicit error handling improves debuggability and user experience
  - Informative error messages help identify root cause

  **Alternatives Considered**:
  - Silent error suppression: Hides failures, difficult to debug
  - Exception propagation without context: Poor user experience, unclear what failed

  ## Implementation Strategy

  The single phase (File Creation and Git Workflow) encompasses the complete feature:

  1. **Create markdown file** with pathlib.Path().write_text(), ensuring:
     - Proper structure: H1 heading, blank line, 2-3 sentences
     - UTF-8 encoding (explicit encoding parameter)
     - Unix LF line endings (platform-native via Python text mode)
     - Approximately 400-600 bytes (guideline, not strict limit)
     - Readable, grammatically correct prose (implementer's choice of topic)

  2. **Validate file** before git operations:
     - Verify file exists and is readable
     - Confirm structure matches expectations

  3. **Stage with git add** test-mnwin6.md

  4. **Commit with conventional message**: `feat(070): create markdown file test-mnwin6.md with prose content`

  5. **Push to remote origin** on feature branch `feat/070-markdown-file-creation`

  This ordering is intentional: file creation happens first (the core feature), then validation
  ensures correctness, then git workflow completes the changeset.

  ## Risk Mitigation

  | Risk | Likelihood | Mitigation |
  | ---- | ---------- | ---------- |
  | Git credentials not configured (user.name, user.email) | Low | Error handling catches subprocess CalledProcessError from git commit; error message guides user to configure git |
  | File already exists (name collision) | Low | Feature branch isolation prevents collision with other branches; overwrite is acceptable behavior on isolated branch |
  | Insufficient disk space | Low | Error handling reports FileNotFoundError or OSError; implementation halts cleanly |
  | Encoding issues on non-UTF-8 system | Very Low | Explicit encoding='utf-8' parameter ensures consistent behavior across all platforms |
  | Git repository not initialized or remote missing | Very Low | Feature assumes pre-initialized repo with remote origin (branch was pre-created by infrastructure) |
  | Newline issues on Windows | Very Low | Python text mode with explicit encoding automatically handles platform newline conversion correctly |

  ## Files to Create vs. Modify

  **To Create**: `test-mnwin6.md` (repository root)
  - Contains markdown H1 heading and 2-3 sentences of prose
  - UTF-8 encoded, Unix LF line endings
  - No other files are created

  **To Modify**: None
  - Feature is purely additive, no source code or configuration changes
  - No modifications to /src/sheep/, tests/, specs/, or pyproject.toml

  This constraint (no modifications) is intentional per NFR-7 and matches the pattern of
  65+ existing test files and features 063-069.
