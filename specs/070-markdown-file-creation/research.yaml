name: markdown-file-creation
summary: >
  Technical research for feature 070 validates that markdown file creation follows an established
  pattern with 65+ precedent implementations. Core implementation uses Python's pathlib for file I/O
  with explicit UTF-8 encoding and Unix LF line endings. Git integration uses subprocess for standard
  git operations (add, commit, push). No external dependencies beyond the standard library and Python
  3.11+. Security and performance implications are minimal.

relatedFeatures:
  - number: 069
    name: markdown-file-creation
    relationship: Identical pattern — implementation precedent with validation and git integration
  - number: 068
    name: markdown-file-creation
    relationship: Identical pattern — implementation precedent with markdown file creation
  - number: 067
    name: markdown-file-creation
    relationship: Identical pattern — implementation precedent

technologies:
  - Python 3.11+ (standard library)
  - pathlib (file I/O operations)
  - subprocess (git command execution)
  - Markdown syntax (CommonMark specification)
  - Git (version control)
  - UTF-8 encoding (text encoding standard)

relatedLinks:
  - title: Python pathlib documentation
    url: https://docs.python.org/3/library/pathlib.html
  - title: CommonMark Markdown specification
    url: https://spec.commonmark.org/
  - title: Git commit conventions
    url: https://www.conventionalcommits.org/

decisions:
  - title: 'File I/O Implementation Method'
    chosen: 'Python pathlib.Path().write_text() with explicit encoding'
    rejected:
      - 'open() context manager — more verbose, requires explicit encoding parameter separate from write operation, older style approach'
      - 'subprocess/shell commands (echo, cat heredoc) — introduces shell complexity, harder to control encoding/line endings, unnecessary external process overhead'
      - 'Third-party file libraries (biopython, etc.) — adds external dependencies when pathlib provides sufficient functionality'
    rationale: >
      pathlib.Path().write_text() is the modern Python standard (3.4+) for file I/O operations.
      It provides clean, chainable syntax for both creation and content writing in a single operation.
      The method accepts explicit encoding parameter, making it explicit and platform-independent.
      pathlib is part of Python standard library (no external dependencies) and is already used throughout
      the project per established patterns. This approach handles newline normalization automatically on
      different platforms when using text mode with explicit encoding='utf-8'.

  - title: 'Prose Content Generation Strategy'
    chosen: 'Handcrafted, topic-flexible prose content — single well-written piece chosen by implementer'
    rejected:
      - 'Procedural/random content generation — adds complexity, risks poor grammar or incoherent output, violates requirement that "prose content must be readable and grammatically correct"'
      - 'Template library with parameterization — unnecessary complexity, requires external library, reduces content quality and creativity'
      - 'Lorem ipsum or placeholder text — not suitable for test files that should be meaningful and readable'
    rationale: >
      The feature requirements specify that implementers have full flexibility in topic selection
      ("about anything" per user query). Handcrafting prose content ensures grammatical correctness,
      readability, and meaningful substance. This approach matches the pattern of all 65+ existing
      test files which contain unique, human-written prose on diverse topics (problem solving, beekeeping,
      incremental progress, etc.). The 2-3 sentence constraint and prose quality requirements make
      handcrafting the most reliable approach. Flexibility in topic selection reduces implementation burden
      and aligns with explicit "implementer flexibility" decision in the feature spec.

  - title: 'Encoding and Line Ending Strategy'
    chosen: 'Python text mode with explicit encoding=utf-8, relying on platform-aware newline handling'
    rejected:
      - 'Binary mode with manual line ending control — requires explicit byte conversion (content.encode()), manual newline character selection (\n vs \r\n), more error-prone'
      - 'System default encoding — risks encoding mismatch on non-UTF-8 systems, violates NFR-1 requirement for UTF-8 without BOM'
      - 'Post-processing with sed/awk — introduces subprocess complexity, requires platform-specific commands, separates content creation from encoding concerns'
    rationale: >
      Python's text mode with explicit encoding='utf-8' is the recommended approach for cross-platform
      file I/O (per pathlib documentation). In text mode, Python automatically converts \n to platform-native
      line endings on write (CRLF on Windows, LF on Unix), then back on read. Since the current environment
      is Unix-like (based on git workflow and bash shell), text mode will write Unix LF by default. Explicit
      encoding='utf-8' parameter ensures UTF-8 without BOM (Python doesn't add BOM for utf-8, only for
      utf-8-sig). This approach is simpler than binary mode and more reliable than post-processing.

  - title: 'Git Integration Approach'
    chosen: 'subprocess.run() for git commands (git add, git commit, git push) with standard subprocess error handling'
    rejected:
      - 'GitPython library (git.Repo) — adds external dependency; while gitpython>=3.1.0 is already in pyproject.toml, subprocess is simpler for basic operations and avoids extra abstraction'
      - 'Manual git implementation — extremely complex, error-prone, requires understanding git internals and pack format'
      - 'Shell script wrapping — introduces shell portability issues, harder to capture output/errors, unnecessary external process'
    rationale: >
      subprocess.run() is the Python standard library approach for executing external commands.
      For simple git operations (add, commit, push), subprocess is more lightweight and transparent than
      GitPython's object-oriented abstraction. While GitPython is available as a project dependency
      (gitpython>=3.1.0 in pyproject.toml), subprocess provides direct, predictable git command execution
      without requiring domain knowledge of GitPython's API. Error handling is straightforward with
      subprocess.run(check=True) to raise CalledProcessError on non-zero exit. For a minimal feature like
      this, subprocess is more appropriate than a full git library.

  - title: 'Implementation Location and Architecture'
    chosen: 'Standalone implementation — file creation and git operations executed directly, not integrated into source code'
    rejected:
      - 'Source code integration into /src/sheep/ — violates NFR-7 requirement "no modifications to source code in /src/sheep/", adds unnecessary architectural complexity'
      - 'Configuration file modifications — violates implicit requirement to follow pattern from features 063-069 which don''t modify configuration'
      - 'Agent integration in CrewAI workflows — over-engineered for simple file creation task, adds unnecessary framework overhead'
    rationale: >
      The feature is purely a file creation and git workflow operation affecting only the repository root.
      NFR-7 explicitly prohibits modifications to source code in /src/sheep/. All 65+ precedent test files
      and features 063-069 follow this pattern: standalone implementations that create files, commit, and push
      without integrating into application source code. This approach maintains clean separation between
      test artifacts and application logic, reduces deployment/build complexity, and matches the established
      architecture pattern for markdown-file-creation features.

  - title: 'Validation Strategy'
    chosen: 'Minimal post-creation verification — verify file exists and is readable before git operations'
    rejected:
      - 'Complex validation with sentence counting — requires NLP or regex parsing, adds complexity and maintenance burden, error-prone for edge cases (abbreviations, ellipses)'
      - 'Byte-exact size validation — enforces 400-600 byte range as hard limit rather than guideline, requires truncation or padding logic that reduces content quality'
      - 'No validation — risks silent failures (file creation fails but script continues), reduces reliability and debuggability'
    rationale: >
      Minimal validation balances simplicity with reliability. Verifying file existence and readability
      catches obvious failures (permission issues, disk full) without over-engineering. The spec resolves
      the sentence-count and file-size questions as guidelines rather than strict limits: "Strict enforcement"
      applies to format (2-3 sentences expected) but "Guideline not limit" for file size (400-600 bytes is typical).
      Complex validation to enforce these guidelines would add unnecessary complexity; prose quality and
      grammatical correctness cannot be validated programmatically without sophisticated NLP.

  - title: 'Error Handling and Reporting'
    chosen: 'Explicit error handling with informative messages — catch subprocess errors and file I/O exceptions, report clearly'
    rejected:
      - 'Silent error suppression — hides failures, makes debugging difficult, violates principle of explicit is better than implicit'
      - 'Exception propagation without handling — crashes without clear error message, poor user experience'
      - 'Logging to file only — errors may be missed if log not reviewed, should report to stdout for visibility'
    rationale: >
      File creation and git operations can fail for several reasons (permissions, disk space, git configuration).
      Explicit error handling with informative error messages improves debuggability and user experience.
      Try-except blocks around file I/O and subprocess calls catch CalledProcessError, FileNotFoundError,
      PermissionError, and similar exceptions. Error messages should indicate what operation failed and why
      (e.g., "git add failed: permission denied on repository" vs generic "Error occurred").

