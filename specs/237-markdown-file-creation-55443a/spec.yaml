content: |
  ## Problem Statement

  Create a single markdown file named test-rgk7lw.md in the repository root containing a markdown H1 heading
  (title) and 2-3 sentences of prose content about any topic. This feature follows the well-established pattern of 236+
  test files in the Sheep project, which uses repetitive markdown file creation as a test harness for the
  agentic code implementation platform.

  ## Success Criteria

  - [ ] File test-rgk7lw.md exists at repository root directory
  - [ ] File contains valid CommonMark markdown syntax (no parsing errors)
  - [ ] File includes exactly one H1 heading (# Title) as the first content line
  - [ ] File includes 2-3 sentences of coherent, meaningful prose following a blank line after heading
  - [ ] File is staged to git using `git add test-rgk7lw.md`
  - [ ] File is committed with conventional message: `feat(237): Create markdown file test-rgk7lw.md with prose content (#309)`
  - [ ] Commit is pushed to feat/237-markdown-file-creation-55443a branch
  - [ ] Git log shows commit with correct message, author, and timestamp
  - [ ] File content is meaningful prose (not placeholder, auto-generated, or gibberish text)
  - [ ] No other files are modified or created as side effects

  ## Functional Requirements

  - **FR-1**: Create markdown file named test-rgk7lw.md at repository root (same directory as .git/)
  - **FR-2**: File must include exactly one H1 heading (single # with space and title text) as first line
  - **FR-3**: File must include blank line after H1 heading
  - **FR-4**: File must include 2-3 sentences of prose content following the blank line
  - **FR-5**: Stage the created file using `git add test-rgk7lw.md` command
  - **FR-6**: Commit the file with conventional commit format: `feat(237): Create markdown file test-rgk7lw.md with prose content (#309)`
  - **FR-7**: Push the commit to the feat/237-markdown-file-creation-55443a feature branch
  - **FR-8**: Commit message must include feature number (237), description, and PR reference (#309)

  ## Non-Functional Requirements

  - **NFR-1**: File must conform to CommonMark markdown specification (v0.30+)
  - **NFR-2**: Prose content must be coherent, grammatically correct English (not auto-generated or placeholder text)
  - **NFR-3**: Commit message must follow conventional commit format (feat(NUMBER): description (references))
  - **NFR-4**: Implementation must follow the established pattern from features 1-236 for consistency
  - **NFR-5**: File formatting must be consistent with existing test markdown files in repository root
  - **NFR-6**: Operation must complete with no git errors, warnings, or merge conflicts
  - **NFR-7**: No unintended modifications to .gitignore, .gitattributes, or other git configuration files

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should commit message include GitHub PR number reference? | Include next expected PR number (#309) | All 236+ preceding features follow this pattern; consistency is critical for test suite maintainability and historical tracking |

  ## Codebase Analysis

  ### Project Context

  Sheep is an agentic platform for automated code implementation using CrewAI. The project includes:
  - Multi-LLM support (OpenAI, Anthropic, Google)
  - Observable execution via Langfuse integration
  - Modular flow-based architecture with CrewAI agents
  - Full git integration including branch creation, commits, and pushes
  - Command-line interface and Python API

  The repository root contains 200+ test markdown files (test-*.md) created by the Sheep system as part of its
  automated testing and demonstration suite. These files follow an identical pattern: H1 heading + 2-3 sentences.

  ### Project Structure

  **Relevant directories for this feature:**
  - `/` (root): Where the markdown file will be created (alongside existing test files)
  - `/specs/`: Contains spec.yaml files for all features (this analysis is part of specs/237-markdown-file-creation-55443a/)
  - `/src/sheep/`: Source code for the Sheep platform itself (not affected by this feature)
  - `/.git/`: Standard git repository (will handle commit and push)

  ### Architecture Patterns

  The Sheep project uses a **Flow-based architecture** where:
  - Flows define execution structure and control paths
  - Crews provide autonomous AI decision-making
  - Features are tracked via spec.yaml files in the specs/ directory
  - Implementations follow conventional commit messages (feat(...), docs(...), etc.)

  For file creation features like this one:
  - The implementation involves simple file I/O (write markdown content to test-rgk7lw.md)
  - Git integration handles: branch already created, file staging, commit creation, and push
  - No modifications to source code, configuration, or other project files

  ### Relevant Technologies

  - **Markdown**: All test files are CommonMark-compliant markdown with H1 heading + prose
  - **Git**: Full version control workflow (already on feature branch, needs commit and push)
  - **Python 3.11+**: Standard library pathlib module for file operations (Path.write_text())
  - **File I/O**: Simple write operation to repository root

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New markdown file (test-rgk7lw.md) will be created here, alongside 236+ existing test files |
  | Git repository (.git/) | High | File must be staged, committed with conventional message, and pushed to branch feat/237-markdown-file-creation-55443a |
  | specs/237-markdown-file-creation-55443a/spec.yaml | Medium | This specification file is updated during Requirements phase (documentation only, not source code) |
  | Source code (src/sheep/) | None | No modifications to application code, agents, flows, or configuration |
  | Other project files | None | No dependencies on or modifications to existing files |

  ## Dependencies

  **External dependencies:**
  - Git (available on system, already initialized)
  - Python 3.11+ standard library (pathlib for file operations)

  **Internal dependencies:**
  - None — this feature is completely isolated and does not depend on or affect other features
  - Pattern is identical to features 1-236, all of which implemented successfully

  **Git state:**
  - Feature branch (feat/237-markdown-file-creation-55443a) is already created
  - Ready for file creation, commit, and push

  ## Implementation Approach

  **Step 1: File Creation**
  - Create markdown file at: `./test-rgk7lw.md`
  - Content format:
    ```markdown
    # [Title about any topic]

    [2-3 sentences of prose content.]
    ```
  - Example structure from existing files: H1 heading (1 line), blank line (1 line), prose (2-3 sentences = 2-4 lines)

  **Step 2: Git Integration**
  - Stage the file: `git add test-rgk7lw.md`
  - Commit with conventional message: `git commit -m "feat(237): Create markdown file test-rgk7lw.md with prose content (#309)"`
  - Push to branch: `git push`

  **Step 3: Verification**
  - Confirm file exists at repository root
  - Verify git commit appears in branch history
  - Ensure file is valid markdown and meets specification

  ## Size Estimate

  **S** — (1-2 hours)

  **Justification:**
  - Single markdown file creation (2-4 lines of content)
  - No code changes, configuration modifications, or dependencies
  - Identical pattern to 236 preceding features, all completed successfully
  - Standard git workflow (stage, commit, push) with established conventions
  - Well-defined acceptance criteria (file exists, valid markdown, proper git history)
  - No testing, refactoring, or review of existing code required
  - Minimal complexity: pure file I/O + standard git operations

  ---

  _Requirements phase complete — ready for design_
