content: |
  ## Implementation Flow

  This task breakdown implements feature 237 in a straightforward sequential flow aligned
  with the proven pattern from 236+ preceding features:

  **Phase 1 — File Creation & Content (Tasks 1-2)**
  - Task 1: Create markdown file with pathlib.Path.write_text(), ensuring CommonMark compliance
  - Task 2: Verify file format against CommonMark v0.30+ specification

  **Phase 2 — Git Integration & Verification (Tasks 3-5)**
  - Task 3: Stage file using git add command
  - Task 4: Commit with conventional message including feature number and PR reference
  - Task 5: Push to feature branch and perform final verification

  ## TDD Approach

  Each task follows RED-GREEN-REFACTOR cycles:

  1. **RED**: Define test assertions that verify success criteria
  2. **GREEN**: Implement minimal code to make assertions pass
  3. **REFACTOR**: Clean up code, verify compliance, ensure quality

  For file creation and git operations:
  - RED tests verify file doesn't exist, then verify it does after creation
  - GREEN implementations use pathlib and git CLI
  - REFACTOR ensures code is clean, follows conventions, meets all criteria

  ## Task Dependencies

  - Task 1 (Create file) has no dependencies — first task
  - Task 2 (Verify format) depends on Task 1 — requires file to exist
  - Task 3 (Stage file) depends on Task 2 — requires validated file
  - Task 4 (Commit) depends on Task 3 — requires staged file
  - Task 5 (Push & verify) depends on Task 4 — requires committed changes

  Linear dependency chain ensures each task builds on previous success.

  ## Effort Estimation

  - Task 1: 30 minutes (file creation, prose authoring, initial validation)
  - Task 2: 15 minutes (format verification against CommonMark spec)
  - Task 3: 10 minutes (git add and staging verification)
  - Task 4: 10 minutes (git commit with conventional message)
  - Task 5: 15 minutes (git push and comprehensive verification)

  **Total: 1-1.5 hours** — Aligns with S (small) size estimate. Minimal complexity,
  straightforward execution, no unexpected dependencies or risks.

  ## Success Verification Checklist

  Final verification (Task 5) confirms:

  - ✓ File test-rgk7lw.md exists at repository root
  - ✓ File contains valid CommonMark markdown (H1 + blank line + 2-3 prose)
  - ✓ Prose content is meaningful and coherent
  - ✓ File is staged via git add
  - ✓ Commit message: feat(237): Create markdown file test-rgk7lw.md with prose content (#309)
  - ✓ Commit appears in git log with correct message, author, timestamp
  - ✓ Changes are pushed to feat/237-markdown-file-creation-55443a
  - ✓ No unintended modifications to other files
  - ✓ Repository is in clean state after implementation
