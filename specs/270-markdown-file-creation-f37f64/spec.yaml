# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform uses simple test markdown file creation as a foundational
  feature for validating the end-to-end workflow: research → implementation → validation → git operations.
  This feature continues that pattern by creating a new markdown file (test-2sqwpg.md) with a title
  heading and 2-3 sentences of prose content. With 217+ existing test markdown files in the repository
  and 270 features in total, this task serves as a lightweight validation of the system's ability to
  execute basic file operations and git integration.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The repository is organized as:

  - **Root directory**: Contains 217+ test markdown files (test-*.md) as artifacts of prior features, along with multiple feature implementation scripts
  - **src/sheep/**: Core platform modules:
    - agents/: Agent definitions for research, implementation, and review
    - flows/: Flow orchestration using CrewAI
    - tools/: Git operations and file I/O utilities
    - config/: LLM and settings management
    - cli.py: Command-line interface
  - **specs/**: Feature specifications directory with 300+ subdirectories (one per feature)
    - Each feature has: spec.yaml (source of truth), feature.yaml, research.yaml, plan.yaml, tasks.yaml
  - **src/create_markdown.py**: Core module for markdown file creation
  - **tests/**: Test suite for platform functionality
  - **pyproject.toml**: Project metadata and dependencies

  ### Architecture Patterns

  1. **Feature-Driven Development**: Each feature (266-270) follows the same lifecycle:
     - Specification (spec.yaml) defines requirements
     - Implementation creates the feature artifact
     - Git workflow (add, commit, push to feature branch)
     - Related features follow identical patterns for markdown file creation

  2. **File I/O Pattern**: Established across 217+ test files:
     - Use `pathlib.Path` for cross-platform file operations
     - Write text with UTF-8 encoding (explicit `encoding="utf-8"`)
     - Enforce Unix LF line endings (`newline="\n"`)
     - Validate file structure post-creation

  3. **Validation Pattern**: Comprehensive checks on created files:
     - File exists and has expected size (400-600 bytes)
     - Content structure: H1 heading on line 1, blank line on line 2, prose on line 3+
     - Prose contains exactly 2-3 sentences
     - Encoding is UTF-8 without BOM
     - Line endings are Unix LF (no CRLF)

  4. **Git Workflow Pattern**:
     - Stage file: `git add <filename>`
     - Commit with conventional format: `feat(<number>): create markdown file <filename>`
     - Push with upstream tracking: `git push -u origin HEAD`
     - Comprehensive error handling for each operation

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment (requires-python: ">=3.11")
  - **pathlib**: Standard library module for cross-platform file operations
  - **subprocess**: Standard library module for git command execution
  - **Git**: Version control system; must be available in execution environment
  - **CrewAI**: Multi-agent orchestration framework used by Sheep platform
  - **Conventional Commits**: Commit message format (feat/fix/docs/etc.)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root (file creation) | Low | Creates new test-2sqwpg.md file; does not modify existing files or directories |
  | Git repository | Low | Staging, committing, and pushing a single file; follows established workflow |
  | No code changes | None | This feature does not modify source code, tests, configuration, or documentation |

  ## Dependencies

  **External:**
  - Git (for version control operations) — must be available in execution environment
  - Python 3.11+ standard library (pathlib, subprocess, sys, os)

  **Internal:**
  - No dependencies on other features or modules in Sheep
  - No modifications to existing code or infrastructure required
  - Related to patterns established in features #266, #267, #268, #269

  **Established Pattern:**
  - 217+ existing test markdown files provide clear precedent for structure and format
  - 269 prior features established the implementation workflow (create → validate → git operations)
  - Conventional commit format and git workflow established across platform
  - src/create_markdown_file.py provides reference implementation of file creation, validation, and git workflow

  ## Size Estimate

  **S** (Simple, 1-2 hours) — This is a lightweight, straightforward implementation task for these reasons:

  - **Minimal scope**: Single file creation (test-2sqwpg.md) with fixed structure
  - **Established pattern**: 217+ existing test files and 269 prior features define clear precedent for structure, validation, and git workflow
  - **No complexity**: No conditional logic, error handling, or edge cases beyond standard file I/O
  - **Deterministic output**: File structure is fixed (H1 heading + blank line + 2-3 sentences)
  - **Standard tooling**: Uses only Python standard library (pathlib, subprocess) and Git
  - **Git integration**: Straightforward staging, committing, and pushing to feature branch
  - **No architectural decisions**: No design choices to make; implementation pattern is fully defined by precedent

  **Time breakdown:**
  - File creation with pathlib: 5-10 minutes
  - Content generation (title + prose): 5-10 minutes
  - Validation (structure, encoding, size): 5-10 minutes
  - Git operations (add, commit, push with error handling): 5-10 minutes
  - **Total: 20-40 minutes of active implementation**
