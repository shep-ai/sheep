content: |
  ## Architecture Overview

  Feature 270 implements markdown file creation following the Sheep platform's established pattern
  from 266+ preceding features. The architecture leverages the existing `content_generators` module
  (`src/sheep/content_generators.py`), which provides reusable functions for file I/O, validation,
  and git operations.

  ### Key Components

  1. **Content Generation**: Hardcoded generic prose content (defined as module constants)
     - TITLE: A meaningful H1 heading (e.g., \"Software Engineering Practices\")
     - PROSE: 2-3 sentences of generic placeholder prose
     - Deterministic: identical output across multiple executions
     - No external dependencies or API calls

  2. **File Creation**: Uses pathlib.Path.write_text() with explicit UTF-8 encoding and newline=\"\\n\"
     - Creates test-2sqwpg.md at repository root
     - Format: H1 heading + blank line + 2-3 sentences
     - Cross-platform compatible (Windows, Linux, macOS)
     - Atomic write operation via pathlib

  3. **File Validation**: Multi-point validation checks
     - File existence (Path.exists())
     - File size (400-600 bytes)
     - UTF-8 encoding without BOM
     - Unix LF line endings (not CRLF)
     - Structure: H1 on line 1, blank line on line 2, prose on line 3+
     - Sentence count: exactly 2-3 sentences

  4. **Git Workflow**: subprocess.run() with comprehensive error handling
     - Stage: `git add test-2sqwpg.md`
     - Commit: `git commit -m \"feat(270): create markdown file test-2sqwpg.md\"`
     - Push: `git push -u origin HEAD`
     - Fail-early: prevent commits if validation fails

  5. **Error Handling**: Try-except blocks at each step
     - File creation errors caught and logged
     - Validation failures prevent git operations
     - Git operation failures (add, commit, push) handled independently
     - Clear error messages for debugging

  ### Existing Pattern (Features 266-269)

  The `content_generators.py` module provides:
  - `write_markdown_file(content, filename)` - Creates file with proper encoding/line endings
  - `validate_markdown_file(filepath)` - Comprehensive validation
  - `commit_markdown_file(filepath, content, repo_path, custom_message)` - Git commit
  - `push_markdown_file(repo_path)` - Git push with upstream tracking

  Feature 270 follows this pattern with one optimization: use hardcoded content instead of calling
  `generate_markdown_content()`. This eliminates LLM API calls and aligns with the S-size estimate.

  ### Why Hardcoded Content?

  The feature spec explicitly resolves to generic placeholder content (openQuestions[0]):
  - **Infrastructure validation focus**: Feature validates file I/O and git workflow, not prose quality
  - **Determinism**: Hardcoded content is identical across runs (no randomness/API variation)
  - **Performance**: 0ms latency vs 1-3 seconds for LLM API call (feature 269)
  - **Simplicity**: No external dependencies, no authentication overhead
  - **Consistency**: Aligns with S-size estimate and establishes scalable pattern

  ## Key Design Decisions

  ### 1. Hardcoded Generic Content vs LLM Generation

  **Chosen**: Hardcoded generic placeholder prose

  **Rationale**: Feature spec explicitly resolves to generic placeholder content: \"Generic placeholder
  content is recommended because this feature validates file creation and git workflow, not prose quality.
  Generic content keeps implementation deterministic and scope minimal, consistent with the 'S' (Simple)
  size estimate.\" Feature 270 validates infrastructure. Hardcoded prose eliminates API overhead of
  feature 269 (1-2 second improvement), reduces complexity, and maintains determinism. Total execution
  time: 2-4 seconds vs 3-5 seconds for feature 269.

  ### 2. File I/O Method (pathlib.Path)

  **Chosen**: `pathlib.Path.write_text(content, encoding=\"utf-8\", newline=\"\\n\")`

  **Rationale**: NFR-2 explicitly requires pathlib for cross-platform compatibility. The newline=\"\\n\"
  parameter ensures Unix LF line endings across all platforms (Windows, Linux, macOS), meeting success
  criteria requirement for \"Unix LF (not CRLF) line endings\". This is the most idiomatic modern Python
  approach (PEP 20: \"Readability counts\"). Identical pattern to features 266-269.

  ### 3. Git Operations Error Handling (subprocess.run)

  **Chosen**: Comprehensive subprocess error handling with `check=True` and stderr/stdout capture

  **Rationale**: NFR-4 requires \"comprehensive error handling for common failure scenarios\". Feature spec
  explicitly chooses fail-early: \"Fail early — prevent commits on validation failure, ensuring only valid
  artifacts reach the repository and making failures immediately visible to operators.\" Each git command
  (add, commit, push) can fail independently. Using subprocess.run() with check=True provides reliable
  feedback. Aligns with feature 269 implementation pattern.

  ### 4. Validation Scope (Comprehensive Multi-Point)

  **Chosen**: Full validation: file existence, size (400-600 bytes), UTF-8 encoding, Unix LF, structure

  **Rationale**: Feature spec explicitly resolves to full validation: \"Full validation is recommended
  because the Sheep platform has validated all 269 prior features with comprehensive checks. Consistency
  is critical for a test-driven automation platform where validation patterns establish reliability
  guarantees.\" The 400-600 byte range is naturally achieved by H1 heading (~30-50 bytes) + blank line
  (1 byte) + 2-3 sentences (~300-500 bytes), providing high-value, low-cost validation.

  ### 5. Fail-Early Behavior (Prevent Commits on Validation Failure)

  **Chosen**: Exit immediately if file creation or validation fails; prevent git add/commit/push

  **Rationale**: Feature spec explicitly resolves to fail-early: \"Fail early is recommended because
  the feature's purpose is to create valid test artifacts. Committing invalid files defeats the testing
  objective and masks problems. Early failure ensures the platform remains healthy and valid.\" Aligns
  with NFR-7: \"Fail-fast behavior — stop immediately on any validation failure, do not attempt to commit
  invalid files.\" Invalid files pollute the repository and break downstream assumptions.

  ### 6. Commit Message Format (Conventional Commits)

  **Chosen**: `feat(270): create markdown file test-2sqwpg.md`

  **Rationale**: Success criteria explicitly specify this format. Conventional Commits provide structured,
  searchable commit history. The 'feat(270)' prefix correlates commits to feature specifications in the
  Sheep platform, enabling traceability from commit → feature → implementation. Identical pattern to
  features 266-269.

  ### 7. Line Ending Handling (Unix LF via pathlib Parameter)

  **Chosen**: Use `pathlib.Path.write_text(newline=\"\\n\")` to enforce Unix LF line endings

  **Rationale**: Success criteria requires \"File must have Unix LF line endings (\\n), no CRLF or mixed
  line endings\". Setting newline=\"\\n\" ensures Unix LF exclusively across all platforms. This is the
  most direct, idiomatic Python approach for cross-platform line ending control. More reliable than
  post-processing string replacement.

  ## Implementation Strategy

  The implementation will follow these ordered phases:

  1. **Phase 1 (Foundation & Content Setup)**: Define hardcoded prose constants in feature module
     - Create feature_270_markdown_file_creation.py with FEATURE_NUMBER, MARKDOWN_FILENAME constants
     - Define TITLE and PROSE constants (hardcoded generic content)
     - Test that constants have correct format and length

  2. **Phase 2 (File Creation & Validation)**: Create and validate file
     - Implement file creation using existing write_markdown_file() from content_generators
     - Implement comprehensive validation using existing validate_markdown_file()
     - Test file structure, size, encoding, line endings
     - Ensure fail-fast: validation failures prevent git operations

  3. **Phase 3 (Git Integration)**: Implement git workflow
     - Implement git add operation using subprocess
     - Implement git commit operation with conventional message
     - Implement git push operation with upstream tracking
     - Each operation includes error handling and logging

  4. **Phase 4 (Error Handling & Integration)**: Finalize and orchestrate
     - Add comprehensive error handling around all operations
     - Implement fail-early logic (skip git on validation failure)
     - Create main orchestration function (create_feature_270_markdown_file)
     - Write integration test for end-to-end workflow

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Generic prose seems too simple | Prose is explicitly validated by feature spec; feature validates infrastructure. Feature spec resolution explicitly chooses generic content. |
  | File size outside 400-600 byte range | Hardcoded prose size is pre-calculated and known to be within range. Fixed content ensures consistency. |
  | Git push fails (auth/network/upstream) | Comprehensive error handling detects failure at each git step. Error messages distinguish add/commit/push failures. |
  | Platform lacks git executable | Error handling detects missing git; clear error message to operator. subprocess will raise CalledProcessError. |
  | Line ending issues on different platforms | pathlib.Path.write_text(newline=\"\\n\") explicitly sets Unix LF regardless of OS. This is the standard approach for cross-platform control. |
  | File already exists from prior run | pathlib.Path.write_text() overwrites by default. Test validates overwrite behavior. |
  | Validation too strict / false positives | Validation checks are identical to features 266-269. Size range is naturally achieved by H1+blank+prose. Pattern is proven. |

  ## Files & Structure

  **New File**: `src/sheep/features/feature_270_markdown_file_creation.py`
  - Feature implementation orchestration
  - FEATURE_NUMBER = 270
  - MARKDOWN_FILENAME = \"test-2sqwpg.md\"
  - TITLE, PROSE constants
  - Main function: create_feature_270_markdown_file()
  - Integration with existing content_generators module

  **Existing (No Modifications)**: `src/sheep/content_generators.py`
  - Already provides: write_markdown_file(), validate_markdown_file(), commit_markdown_file(), push_markdown_file()
  - Feature 270 uses existing functions with hardcoded content

  ## Testing Strategy

  Each task includes TDD cycles (RED-GREEN-REFACTOR):
  - RED: Write test asserting desired behavior
  - GREEN: Implement minimal code to pass test
  - REFACTOR: Clean up and improve

  Integration test verifies end-to-end workflow:
  - Executes create_feature_270_markdown_file()
  - Validates file existence, content, encoding, line endings, size
  - Validates git commit with correct message
  - Fast execution (<5 seconds) due to no external API calls (hardcoded content)

  ## Performance Expectations

  Total execution time: ~2-4 seconds
  - Content setup: 0ms (hardcoded)
  - File creation: <1ms
  - Validation: <10ms
  - Git add: <100ms
  - Git commit: <100ms
  - Git push: 1-2 seconds (network dependent)

  Significantly faster than feature 269 (~3-5 seconds) due to eliminating 1-2 second Claude API call.
