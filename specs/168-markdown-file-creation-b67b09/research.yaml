content: |
  ## Status

  - **Phase:** Research — Completed 2026-03-22
  - **Key Decisions:** 8 documented with rationale and alternatives
  - **New Dependencies:** None required; uses existing infrastructure only
  - **Estimated Implementation Time:** 45 minutes code + 15 minutes testing

  ## Technology Decisions Summary

  Feature 168 requires one key architectural addition (retry loop for content validation) plus explicit file size validation.
  All other infrastructure (LLM, file I/O, git operations, logging) is reused from 167 prior features.

  ### 1. Retry Logic Implementation

  **Chosen:** Implement retry loop with max 2 retries in feature module's main orchestration function

  **Rejected:**
  - Embed retries in generate_markdown_content() utility — Violates separation of concerns
  - Add retry decorator on main function — Less readable, harder to debug
  - Implement retries in content_generators.py — Adds complexity to shared infrastructure

  **Rationale:** Feature module orchestration is the appropriate layer for workflow control. Retry loop will be explicit:
  ```
  for attempt in range(1, 4):  # 1 initial + 2 retries = 3 total
      try:
          content = generate_markdown_content()
          break  # Success
      except ValueError as e:
          if attempt == 3:
              _logger.error(f"Content validation failed after 3 attempts: {e}")
              raise
          _logger.warning(f"Attempt {attempt}/3 failed, retrying...")
  ```
  This makes retry semantics explicit, provides clear logging at retry boundaries, and keeps retry policy localized to
  feature 168 (not imposed on all features via shared utilities).

  ### 2. File Size Validation Placement

  **Chosen:** Validate file size (300-600 bytes) after write but before commit

  **Rejected:**
  - Only validate in validate_markdown_file() — Size check deserves explicit checkpoint
  - Validate only after push — Delays detection; should catch before committing
  - Check during generation — Size depends on UTF-8 encoding; must validate post-write

  **Rationale:** File size is critical spec requirement. Validation happens post-write because:
  1. File is on disk with actual UTF-8 encoding at that point
  2. Size violation caught before committing to git history (prevents pollution)
  3. Explicit checkpoint aids debugging with detailed logs

  Implementation: Use `Path(filepath).stat().st_size` after write, raise ValueError if outside 300-600 range.
  This triggers retry loop (if content generation caused oversized output).

  ### 3. Error Handling Strategy

  **Chosen:** Fail fast with detailed structured logging; no rollback on git failures

  **Rejected:**
  - Attempt rollback on git failure — Adds complexity, can fail unexpectedly
  - Retry git operations — Already handling retries at content level
  - Continue silently — Violates spec requirement for explicit failure signaling

  **Rationale:** Spec explicitly recommends fail-fast approach. Benefits:
  - Preserves workflow intent — clear signal that feature is incomplete
  - Simple implementation — no rollback logic to maintain
  - Clear debugging — structured logs show exact failure point and context
  - Aligns with codebase patterns — exceptions propagate with logged context

  When git operations fail, user receives clear error, can investigate root cause, and re-run feature.

  ### 4. Module Architecture

  **Chosen:** Copy feature_167 structure; update 3 constants and add retry loop

  **Structure:**
  ```python
  \"\"\"Implementation for feature 168: Create markdown file test-oyiqcz.md\"\"\"

  from sheep.content_generators import (...)
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)

  FEATURE_NUMBER = 168
  MARKDOWN_FILENAME = "test-oyiqcz.md"
  COMMIT_MESSAGE = "feat(168): Create markdown file test-oyiqcz.md with prose content"

  def create_feature_168_markdown_file(repo_path: str | None = None) -> dict[str, str]:
      # Orchestration with retry loop on validation failure
      # Return dict: {filepath, content, commit_message, push_result}

  if __name__ == "__main__":
      result = create_feature_168_markdown_file()
      print(...)
  ```

  **Rationale:**
  - Maintains consistency with 167 prior features
  - Custom orchestration (retry loop) is localized to feature 168
  - Enables standalone execution, clear workflow steps, explicit logging
  - Constants to update: FEATURE_NUMBER=168, MARKDOWN_FILENAME=\"test-oyiqcz.md\",
    COMMIT_MESSAGE=\"feat(168): Create markdown file test-oyiqcz.md with prose content\"

  ### 5. LLM Provider Configuration

  **Chosen:** Use existing get_reasoning_llm() from sheep.config.llm

  **Rejected:**
  - Direct Anthropic API calls — Bypasses existing infrastructure
  - Per-feature LLM configuration — Unnecessary complexity
  - Alternative providers — No business requirement

  **Rationale:** Existing infrastructure is proven across 167 features. get_reasoning_llm() returns configured CrewAI
  instance. Feature 168 uses this via existing generate_markdown_content() utility. Zero configuration changes needed.

  ### 6. Validation Function Usage

  **Chosen:** Use existing validate_markdown_content() for early validation; add explicit file size check post-write

  **Rejected:**
  - Skip early validation, only validate post-write — Wastes LLM tokens on invalid content
  - Inline all validation in feature module — Duplicates logic, violates DRY
  - Create new unified validation function — Adds to shared infrastructure complexity

  **Rationale:** Two-layer validation approach:
  1. Early: _validate_markdown_content() catches generation failures (missing H1, wrong sentence count, too short)
  2. Post-write: validate_markdown_file() checks encoding, line endings, content structure
  3. Pre-commit: Explicit file size validation (300-600 bytes) using Path.stat().st_size

  This reuses existing functions without modification while adding size validation checkpoint.

  ### 7. Logging Strategy

  **Chosen:** structlog with INFO for workflow steps, DEBUG for details, ERROR for failures

  **Log Points:**
  - INFO: Feature start, each task boundary, generation success, file write success, size validation pass, commit/push
  - DEBUG: Content byte count, LLM response preview, retry attempt count, file size in bytes
  - ERROR: Validation failures with context (expected vs actual, file path, operation phase)

  **Rationale:** Matches feature_167 and content_generators.py patterns. Provides observability for workflow monitoring
  and debugging. Integrates with platform's structured logging infrastructure.

  ### 8. File Overwrite Semantics

  **Chosen:** Silently overwrite any existing test-oyiqcz.md; do not warn or check before overwrite

  **Rejected:**
  - Check and skip if file exists — Non-deterministic behavior (sometimes creates, sometimes doesn't)
  - Raise error if exists — Breaks automation workflows
  - Warn but overwrite — Adds noise without changing behavior

  **Rationale:** Spec explicitly recommends silent overwrite. Feature is designed to create test-oyiqcz.md with fresh
  generated content. Idempotent design requires always producing same result. write_markdown_file() opens file in
  write mode (\"w\"), truncating existing content automatically.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | CrewAI | LLM orchestration | Use existing | Already integrated, configured with Claude API via environment variables. Content generation via get_reasoning_llm(). |
  | Anthropic Claude | LLM backend for content generation | Use existing | Accessed via CrewAI. No direct SDK calls needed. API configuration already in place. |
  | GitPython | Git repository operations | Use existing | Already used in content_generators.py via GitCommitTool and GitPushTool. Reliable for staging, commit, push. |
  | Pydantic | Data validation | Use existing | Already available in project. Feature 168 doesn't require new Pydantic models; uses dict return type like feature_167. |
  | structlog | Structured logging | Use existing | Standard logging throughout codebase. Feature 168 uses same pattern: get_logger(__name__). |
  | Pathlib | File path and size operations | Use existing | Used in content_generators.py and feature_167. Path.cwd(), Path.stat().st_size for validation. |
  | UTF-8 encoding | Text file encoding | Built-in | Python's native open(encoding='utf-8') parameter. No external library. |

  **Dependency Conclusion:** Feature 168 requires **ZERO new external dependencies**. All infrastructure is proven across
  167 prior features. Implementation uses only existing modules and utilities.

  ## Security Considerations

  ### File Path Safety
  **Concern:** write_markdown_file() must prevent path traversal attacks
  **Mitigation:** Existing validation in write_markdown_file() rejects filenames containing \"/\", \"\\\", or starting with \".\"
  **Feature 168 Responsibility:** Pass only hardcoded filename constant \"test-oyiqcz.md\"

  ### Encoding Safety
  **Concern:** Ensure file is valid UTF-8 without BOM
  **Mitigation:** validate_markdown_file() checks for UTF-8 BOM (\\xef\\xbb\\xbf) and validates UTF-8 decoding succeeds
  **Feature 168 Responsibility:** Use existing validation functions; never bypass encoding checks

  ### Credential Security
  **Concern:** LLM API credentials (Anthropic key) must not appear in logs
  **Mitigation:** CrewAI and structlog already filter sensitive data; LLM calls don't log request bodies or tokens
  **Feature 168 Responsibility:** Use get_reasoning_llm() without modification; never log raw API responses

  ### Git Credentials
  **Concern:** Git push must authenticate without exposing credentials
  **Mitigation:** GitPushTool uses git configuration (SSH keys or OS credentials manager), not hardcoded credentials
  **Feature 168 Responsibility:** Ensure git repository is properly configured; never pass credentials in arguments

  ## Performance Implications

  ### Content Generation Performance
  - **Target:** < 30 seconds per attempt (spec NFR-1)
  - **Actual:** Claude via CrewAI typically 3-8 seconds for markdown generation
  - **With retries:** Maximum 3 * 30 = 90 seconds for content phase (initial + 2 retries)
  - **Optimization:** Validate after generation, only retry on validation failure (not on every LLM latency)

  ### File I/O Performance
  - **Target:** < 5 seconds total (spec NFR-2)
  - **Actual:** File write + validation + size check: < 100ms on typical systems
  - **Limitation:** Single-pass binary read in validate_markdown_file() is already optimal

  ### Git Operations Performance
  - **Target:** < 10 seconds each for commit and push (spec NFR-3)
  - **Actual:** Depends on repository size and network; typically 1-3 seconds
  - **Limitation:** Feature module doesn't do expensive operations (cloning, merging); straightforward add/commit/push

  ### Overall Workflow Performance
  - **Best case:** ~5 seconds (1st attempt generation + file I/O + git operations)
  - **Worst case:** ~75 seconds (2 failed retries + 1 successful, plus file I/O and git)
  - **Typical case:** ~15-20 seconds (single generation attempt, no retries needed)

  **Conclusion:** Feature 168 performance is dominated by LLM response latency, which is not optimizable at feature level.

  ## Architecture Notes

  ### Relationship to Existing Codebase

  Feature 168 integrates into Sheep platform as:
  1. **Feature Module** — One of 168 agentic capability demonstrations
  2. **Content Generation Pipeline** — Uses existing markdown generation and validation utilities
  3. **Git Integration** — Leverages existing GitCommitTool and GitPushTool
  4. **Observability** — Integrates with structlog for platform-level monitoring
  5. **No new architectural changes** — Feature-specific code only; zero modifications to shared infrastructure

  ### Retry Loop Integration

  The retry loop on content validation failure is the only new workflow logic:
  - Initial generation attempt → validation
  - If validation fails (ValueError from _validate_markdown_content):
    - Retry 1: Generate again → validate
    - Retry 2: Generate again → validate
    - If still failing, propagate exception
  - On success: Continue to file write, size validation, git operations

  This preserves single-responsibility principle: generation and validation are unchanged; orchestration logic
  (retry loop) is localized to feature 168's main function.

  ### Testing Strategy (Optional)

  If test_168_markdown_file_creation.py is created, it would follow feature_167 pattern:
  - Verify feature_168 creates file with correct name
  - Validate file content has H1 heading and 2-3 sentences
  - Check file size is 300-600 bytes
  - Verify UTF-8 encoding with LF line endings
  - Confirm git operations (commit, push) succeed
  - Test retry logic: mock validation failure to verify retries work
  - Confirm existing files are overwritten

  Tests would use existing patterns: mocking git operations, temporary test directories, validating file properties.
  **Note:** Tests are optional per spec; feature is complete without them.

