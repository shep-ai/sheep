content: |
  ## Problem Statement

  Create a single markdown file named `test-oyiqcz.md` in the repository root containing:
  - An H1 markdown heading (`#`) as a title about any topic
  - 2-3 sentences of coherent, well-written prose content
  - Proper UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (not CRLF)
  - File size between 300-600 bytes (inclusive)
  - File staged in git, committed with conventional commit message format, and pushed to remote repository

  This is the 168th feature in a series of markdown file creation tasks that test and demonstrate the Sheep platform's agentic capabilities. The feature reuses all existing infrastructure (LLM content generation, file I/O, git integration, structured logging) with no new dependencies or architectural changes required.

  ## Success Criteria

  - [ ] File `test-oyiqcz.md` created in repository root
  - [ ] File contains exactly 1 H1 heading (`#`) as title
  - [ ] File contains exactly 2-3 sentences of coherent prose
  - [ ] File encoding is UTF-8 without BOM
  - [ ] Line endings are Unix LF (`\n`), not CRLF (`\r\n`)
  - [ ] File size is between 300-600 bytes (inclusive)
  - [ ] Content validation passes before file write
  - [ ] File is staged in git index
  - [ ] Commit message follows conventional format: `"feat(168): Create markdown file test-oyiqcz.md with prose content"`
  - [ ] File is pushed to remote repository on feature branch
  - [ ] All operations logged with structured logging (structlog)
  - [ ] Feature module follows established pattern from 167 prior features
  - [ ] Feature module can be executed directly via Python `__main__` block
  - [ ] Content generation retried up to 2 times on validation failure
  - [ ] Existing files are overwritten with new content

  ## Functional Requirements

  - **FR-1**: Generate markdown content consisting of exactly one H1 heading and 2-3 sentences of prose
  - **FR-2**: Validate generated content before writing to disk (check for H1 presence, sentence count, length)
  - **FR-3**: Write validated content to file named `test-oyiqcz.md` in repository root
  - **FR-4**: Encode file content as UTF-8 without BOM
  - **FR-5**: Use Unix LF line endings (not CRLF) in the generated file
  - **FR-6**: Validate file size is between 300-600 bytes before committing
  - **FR-7**: Stage the generated file in git index
  - **FR-8**: Create a conventional commit with message `"feat(168): Create markdown file test-oyiqcz.md with prose content"`
  - **FR-9**: Push the commit to remote repository on the feature branch
  - **FR-10**: Log all major operations (content generation, file write, validation, git operations) using structured logging
  - **FR-11**: Implement content generation retry logic (up to 2 retries on validation failure)
  - **FR-12**: Overwrite any existing `test-oyiqcz.md` file with newly generated content
  - **FR-13**: Provide a feature module (`feature_168_markdown_file_creation.py`) with a main function `create_feature_168_markdown_file(repo_path: str | None) -> dict[str, str]` returning operation results
  - **FR-14**: Follow the established feature module pattern: module docstring, FEATURE_NUMBER constant, MARKDOWN_FILENAME constant, COMMIT_MESSAGE constant

  ## Non-Functional Requirements

  - **NFR-1**: LLM content generation must complete within 30 seconds per attempt
  - **NFR-2**: File I/O operations (write, validate, read) must complete within 5 seconds total
  - **NFR-3**: Git operations (stage, commit, push) must complete within 10 seconds each
  - **NFR-4**: All errors must be logged with sufficient context (error type, operation phase, relevant file/git state)
  - **NFR-5**: Feature code must follow established architectural patterns for maintainability and consistency
  - **NFR-6**: No new dependencies may be added; only use existing infrastructure (CrewAI, GitPython, Pydantic, structlog)
  - **NFR-7**: Content generation should produce varied, contextually relevant prose (not boilerplate)
  - **NFR-8**: Feature module should be independent and runnable in isolation with no external setup

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Content topic constraints? | Complete freedom (any topic) | Simplicity, variety, aligns with 167 prior features with no topic restrictions |
  | 2 | Prose tone/style? | Professional and accessible | Balanced clarity and approachability, works in diverse contexts, matches platform style |
  | 3 | Retry policy on validation failure? | Retry up to 2 times | Robustness vs. cost balance, handles LLM variability, follows established pattern |
  | 4 | Existing file handling? | Overwrite silently | Predictable behavior, ensures fresh output, aligns with idempotent design |
  | 5 | Git error recovery? | Fail fast with detailed logging | Simple, preserves intent, clear error signals for debugging |

  ## Codebase Analysis

  ### Project Structure

  The Sheep project is an agentic platform for automated code implementation using CrewAI. Key directories:

  - **src/sheep/**: Main source code
    - **features/**: Feature implementation modules (feature_XXX_markdown_file_creation.py) with 167 existing implementations
    - **content_generators.py**: Reusable utilities for markdown generation, file I/O, validation, and git operations
    - **tools/**: Custom tools including GitCommitTool and GitPushTool
    - **config/**: LLM configuration and factory functions
    - **observability/**: Logging via structlog
    - **agents/**: Agent definitions (not used for simple features)
    - **flows/**: Flow orchestration (not needed for this feature)
  - **specs/**: Feature specification files (YAML) with 167 prior feature specifications
  - **tests/**: Test files with comprehensive coverage patterns
  - **Repository root**: Output location for generated markdown files

  ### Architecture Patterns

  The codebase follows these key architectural patterns:

  1. **Feature Module Pattern**: Each feature (001-168+) has a corresponding Python module in src/sheep/features/ following this structure:
     - Module docstring explaining the feature
     - FEATURE_NUMBER constant
     - MARKDOWN_FILENAME constant
     - COMMIT_MESSAGE constant
     - Main function `create_feature_XXX_markdown_file(repo_path: str | None) -> dict[str, str]`
     - If-name-main block for direct execution

  2. **Orchestration Pattern**: Feature functions orchestrate a multi-step workflow:
     - Task 1: Generate markdown content via LLM
     - Task 2: Validate content structure and metadata
     - Task 3: Write file to disk with proper encoding and line endings
     - Task 4: Validate file properties (encoding, line endings, size)
     - Task 5: Stage and commit with git
     - Task 6: Push to remote repository

  3. **Content Generation Pipeline**:
     - `generate_markdown_content()`: Uses CrewAI LLM framework to generate H1 heading + 2-3 sentences
     - `_validate_markdown_content()`: Ensures content has proper structure (H1, sentence count, minimum length)
     - `write_markdown_file()`: Writes UTF-8 encoded content with LF line endings
     - `validate_markdown_file()`: Checks encoding, line endings, and file integrity
     - `commit_markdown_file()`: Stages file and creates conventional commit
     - `push_markdown_file()`: Pushes to remote feature branch

  4. **Error Handling**: Features use structured logging with detailed error messages and exceptions propagation for observability

  ### Relevant Technologies

  - **CrewAI** (v0.86.0+): Multi-agent orchestration framework
  - **Anthropic Claude**: LLM backend for content generation (via CrewAI)
  - **GitPython** (v3.1.0+): Python git repository interface for commit/push operations
  - **Pydantic** (v2.0+): Data validation
  - **structlog**: Structured logging for observability
  - **Pathlib**: Path manipulation and file operations
  - **UTF-8 Encoding**: Text file encoding standard
  - **Unix LF Line Endings**: Platform-standard line endings

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | src/sheep/features/ | High | New feature module (feature_168_markdown_file_creation.py) required with ~120 lines of orchestration code following established pattern |
  | src/sheep/content_generators.py | None | No changes needed; utilities are already generalized and reusable across all 168 features |
  | Repository root | High | New file test-oyiqcz.md (300-600 bytes) will be created and committed |
  | Git history | High | New commit with message "feat(168): Create markdown file test-oyiqcz.md with prose content" will be added; new push to remote |
  | tests/ | Low | Optional test file (test_168_markdown_file_creation.py) may be added following patterns from test_166, test_167, etc. |
  | pyproject.toml | None | No changes to dependencies; all required infrastructure already available |
  | README.md | None | No documentation updates needed for simple feature |

  ## Dependencies

  ### Existing Infrastructure Required

  1. **Content Generation** (`sheep.content_generators`):
     - `generate_markdown_content()`: LLM-based generation via CrewAI
     - `_validate_markdown_content()`: Format validation (H1, sentences, length)

  2. **File Operations** (`sheep.content_generators`):
     - `write_markdown_file()`: UTF-8 encoding with LF line endings
     - `validate_markdown_file()`: Encoding and line ending verification

  3. **Git Integration** (`sheep.content_generators`):
     - `commit_markdown_file()`: Staging and conventional commit
     - `push_markdown_file()`: Remote push operations

  4. **LLM Configuration** (`sheep.config.llm`):
     - `get_reasoning_llm()`: CrewAI LLM instance configured for content generation

  5. **Logging** (`sheep.observability.logging`):
     - `get_logger()`: Structured logging for observability and debugging

  ### External Dependencies

  - **CrewAI**: Already integrated; provides LLM orchestration
  - **Anthropic Claude**: Configured via environment variables; generates markdown content
  - **GitPython**: Already integrated; powers git operations
  - **Git repository**: Working directory must be a valid git repository with remote configured

  ## Size Estimate

  **S (Small - Hours)** — This feature has minimal implementation effort:

  1. **Code Creation** (30 minutes):
     - Create feature_168_markdown_file_creation.py by copying feature_167_markdown_file_creation.py
     - Update 3 constants: FEATURE_NUMBER (168), MARKDOWN_FILENAME (test-oyiqcz.md), COMMIT_MESSAGE ("feat(168): Create markdown file test-oyiqcz.md with prose content")
     - Implement retry logic (up to 2 retries on content validation failure) - minimal change to main orchestration
     - No other logic changes needed; reuse existing orchestration pattern

  2. **Testing** (15 minutes, if test file created):
     - Optional test file would follow existing patterns with minimal customization
     - Integration tests would reuse infrastructure from test_167

  3. **Validation** (10 minutes):
     - Run feature module directly to validate end-to-end workflow
     - Verify markdown file created, committed, and pushed with correct properties

  4. **Total Effort**: ~1-1.5 hours

  **Rationale**:
  - All infrastructure (content generation, file I/O, git operations, logging) is already in place
  - Feature follows identical pattern proven over 167 prior iterations
  - No new dependencies, architectural changes, or complex logic required
  - Retry logic is straightforward addition to existing orchestration
  - Well-tested building blocks reduce implementation and debugging risk

