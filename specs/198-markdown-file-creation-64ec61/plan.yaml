content: |
  ## Architecture Overview

  This feature implements the well-established pattern from 197+ preceding markdown test files. The
  architecture is intentionally simple, focusing on proven patterns rather than over-engineering.

  ### Core Components

  1. **Feature Module** (`src/sheep/features/feature_298_markdown_file_creation.py`)
     - Module-level constants: FILENAME, TITLE, PROSE
     - `create_markdown_file()` — writes file to disk with proper encoding/line endings
     - Four validation functions: `validate_encoding()`, `validate_line_endings()`,
       `validate_structure()`, `validate_file_size()`
     - Three git functions: `git_add()`, `git_commit()`, `git_push()`
     - `main()` orchestration function coordinating complete workflow

  2. **Test Module** (`tests/test_feature_198_markdown_file_creation.py`)
     - Unit tests for each validation function (success and failure cases)
     - Integration tests for complete workflow
     - Git operations mocked to prevent repository modifications during testing
     - Comprehensive edge case coverage

  3. **Deliverable** (`test-p27cj6.md`)
     - Target markdown file created by running the feature module
     - Follows identical structure as 197+ existing test files
     - Staged, committed, and pushed via git integration

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib with Explicit Encoding & Line Endings

  **Chosen:** `Path.write_text(content, encoding="utf-8", newline="\n")`

  The `newline="\n"` parameter is critical. Python normally adapts line endings based on operating
  system: Windows uses CRLF, Unix uses LF. Explicitly setting `newline="\n"` forces Unix line
  endings regardless of platform, satisfying FR-6 requirement. The `encoding="utf-8"` parameter
  ensures consistent UTF-8 encoding without BOM across all platforms. This approach is proven in
  features 195-197 with demonstrated success across Windows, macOS, and Linux.

  **Why Not:**
  - `open()` with manual handling: verbose, error-prone, requires manual close()
  - `os.path` module: pre-modern API, lacks pathlib's ergonomics
  - `io.open()`: lower-level complexity with no additional benefits

  ### 2. Validation Architecture: Modular Separation of Concerns

  **Chosen:** Four separate validation functions instead of monolithic validator

  - `validate_encoding()` checks UTF-8 without BOM using binary read
  - `validate_line_endings()` checks Unix LF only using binary inspection
  - `validate_structure()` parses content for H1 heading and 2-3 sentences
  - `validate_file_size()` checks 300-600 byte range

  This modular approach enables independent testing, clear error diagnostics (error message
  identifies exactly which check failed), and reusability in test suites. Features 195-197
  demonstrate this pattern with comprehensive test coverage of each function.

  **Why Not:**
  - Monolithic validator: harder to debug, difficult to test individually, unclear failure cause
  - No validation: risks invalid files, violates spec success criteria
  - Inline validation scattered in main(): reduces readability, duplicates logic

  ### 3. Git Integration: subprocess with shell=False

  **Chosen:** `subprocess.run(["git", "add", ...], check=True, capture_output=True)`

  Using `shell=False` with a list of arguments ensures commands pass directly without shell
  interpretation, preventing command injection attacks. The `check=True` parameter raises
  `CalledProcessError` if any git command fails, implementing fail-fast behavior. The
  `capture_output=True` suppresses output to keep terminal clean during automated execution.
  Uses only standard library (no external dependencies).

  **Why Not:**
  - GitPython library: introduces external dependency (violates NFR-4)
  - `shell=True`: security vulnerability (command injection risk)
  - `os.system()`: deprecated, no error handling, insecure

  ### 4. Prose Content: Hardcoded Meaningful Text

  **Chosen:** Module-level constants with grammatically correct, coherent prose

  Hardcoded prose ensures consistent, meaningful content satisfying NFR-2 requirement. Content
  defined once as module constants, making it testable, reproducible, and free from external
  dependencies or API calls. The 197+ precedent files demonstrate successful diverse topics
  (sustainable coffee sourcing, meaningful communication, automated testing, etc.).

  **Why Not:**
  - Random/gibberish generation: violates NFR-2 (grammatically correct requirement)
  - External API (faker, LLM): adds dependencies, complexity, latency
  - Template system: overengineering for single file creation

  ### 5. Encoding Implementation: Explicit Parameters

  **Chosen:** Use `Path.write_text(encoding="utf-8", newline="\n")` to enforce UTF-8 without BOM
  and Unix LF line endings

  Python's `newline` parameter is specifically designed for this use case. Setting `newline="\n"`
  prevents Python from automatically converting line endings based on OS. The `encoding="utf-8"`
  ensures UTF-8 without BOM (Python's default UTF-8 implementation). This combination satisfies
  FR-5 (UTF-8 no BOM) and FR-6 (LF line endings) in a single, idiomatic call.

  **Why Not:**
  - Platform default encoding: inconsistent across Windows/macOS/Linux
  - Manual BOM handling (`utf-8-sig`): would add unwanted BOM bytes
  - Post-hoc line ending conversion: doesn't prevent OS interference, more error-prone

  ### 6. File Size Validation: Static Range Check

  **Chosen:** Constants `MIN_SIZE = 300` and `MAX_SIZE = 600` with simple range comparison

  Spec defines requirement as specific byte range (300-600). Static constants make the validation
  explicit and auditable. Range empirically measured from 197+ existing test files per spec codebase
  analysis. Feature 197 uses identical approach with measured success.

  **Why Not:**
  - Dynamic calculation from existing files: adds complexity, fragile to file size changes
  - No validation: violates NFR-1 requirement for file size consistency
  - Percentage-based validation: adds complexity, doesn't match spec requirement

  ## Implementation Strategy

  **Phase 1: Foundation & File Creation**
  - Task 1: Create feature module skeleton with FILENAME, TITLE, PROSE constants
  - Task 2: Implement file creation using pathlib with explicit encoding/line endings
  - Task 3: Implement four modular validation functions with comprehensive error handling

  Phase 1 establishes solid foundation. File creation and validation must be robust before
  introducing git complexity.

  **Phase 2: Git Integration, Testing & Execution**
  - Task 4: Implement git operations (add, commit, push) using subprocess
  - Task 5: Implement main() orchestration function coordinating complete workflow
  - Task 6: Create comprehensive test suite with unit and integration tests
  - Task 7: Execute feature code to create test-p27cj6.md and commit
  - Task 8: Final verification that all success criteria and requirements are met

  Phase 2 builds on Phase 1 foundation. Testing is deferred until all components are implemented,
  allowing comprehensive integration tests. Execution and verification are final steps ensuring
  deliverable meets all requirements.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | "Incorrect file encoding or line endings" | "Explicit `encoding=\"utf-8\"` and `newline=\"\\n\"` parameters in pathlib.Path.write_text(); validation functions check both; tests verify with binary read" |
  | "File size outside expected range" | "`validate_file_size()` function checks 300-600 byte range; test cases cover boundary conditions (299, 300, 600, 601 bytes)" |
  | "Git operations fail silently" | "subprocess with `check=True` raises CalledProcessError if any git command fails; main() catches and reports errors clearly" |
  | "Invalid prose structure (not 2-3 sentences)" | "`validate_structure()` parses content and counts sentences; test cases verify with 1, 2, 3, and 4 sentence content" |
  | "Tests pass but actual file is wrong" | "Integration tests run complete feature code against temporary test repository; only git operations mocked, not file I/O" |
  | "Git user configuration not set" | "Error handling in `git_commit()` catches CalledProcessError and reports missing configuration; tests verify error messages" |

  ## Dependencies

  **Required:**
  - Python 3.11+ (for pathlib with modern APIs)
  - Git 2.30+ (for git commands and conventional commits)
  - Feature branch `feat/198-markdown-file-creation-64ec61` (pre-created)
  - Write access to repository root

  **Not Required:**
  - No external Python packages (all from standard library)
  - No external APIs or services
  - No system configuration changes
  - No modifications to existing source code

