content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-24
  - **Status:** Ready for implementation planning

  ## Architecture Overview

  This feature follows the well-established pattern from features 195-197 (and 150+ prior features),
  creating a simple markdown file with structured content, validating the result, and staging/committing
  to git. The implementation requires no architectural changes or new components — it's a straightforward
  application of existing, proven patterns.

  ### Implementation Components

  1. **File Creation Module** (`feature_198_markdown_file_creation.py`)
     - Constants: FILENAME, TITLE, PROSE
     - File creation: `create_markdown_file()` with proper encoding/line endings
     - Validation functions (4 separate checks)
     - Git operations: `git_add()`, `git_commit()`, `git_push()`
     - Main orchestration: `main()` that coordinates all steps

  2. **Testing Module** (`test_feature_198_markdown_file_creation.py`)
     - Unit tests for each validation function
     - Integration tests for complete workflow
     - Mocked git operations to avoid actual repository changes
     - Error handling and edge case testing

  ## Technology Decisions

  ### 1. File I/O: Python pathlib with UTF-8 and LF

  **Chosen:** `Path.write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - `open()` with manual file handling — verbose, error-prone, less readable
  - `os.path` — pre-modern, less ergonomic, requires manual path string manipulation
  - `io.open()` — lower-level, more complexity, no additional benefits

  **Rationale:** pathlib is the standard library approach for Python 3.11+. The `encoding="utf-8"`
  parameter ensures consistent UTF-8 encoding across all platforms. The `newline="\n"` parameter
  is critical: it forces Unix line endings regardless of the operating system. Without this parameter,
  Windows would automatically convert `\n` to `\r\n` (CRLF), violating FR-6 requirement. This approach
  is proven in features 195-197 with demonstrated success.

  ### 2. Git Integration: subprocess with shell=False

  **Chosen:** `subprocess.run(["git", "add", filename], check=True, capture_output=True)`

  **Rejected:**
  - GitPython library — adds external dependency (violates NFR-4), overkill for simple operations
  - `shell=True` — security vulnerability (command injection), unnecessary complexity
  - `os.system()` — deprecated, no error handling, insecure

  **Rationale:** subprocess with `shell=False` is secure (arguments are passed directly without shell
  interpretation), uses only standard library, provides proper error handling with `check=True`.
  The `capture_output=True` parameter suppresses output to keep the terminal clean during automated
  execution. No external dependencies required.

  ### 3. Prose Content: Hardcoded Meaningful Text

  **Chosen:** Module-level constants with grammatically correct, coherent prose
  ```python
  TITLE = "The Art of Sustainable Coffee Sourcing"
  PROSE = "The global coffee industry has undergone..."
  ```

  **Rejected:**
  - Random/gibberish string generation — violates NFR-2 (grammatically correct)
  - External API (faker, LLM, etc.) — adds dependencies, complexity, latency
  - Template system — overengineering for single file creation

  **Rationale:** Hardcoded prose ensures meaningful, grammatically correct content that satisfies
  NFR-2. Content is defined once, making it testable, reproducible, and free from external
  dependencies. The 197+ precedent files demonstrate successful prose topics spanning diverse
  subjects (coffee sourcing, communication, simplicity, testing, etc.), confirming that arbitrary
  topic selection works well.

  ### 4. Validation: Modular Separate Functions

  **Chosen:** Four separate validation functions:
  - `validate_encoding()` — checks UTF-8 without BOM
  - `validate_line_endings()` — checks Unix LF only
  - `validate_structure()` — checks H1 heading and 2-3 sentences
  - `validate_file_size()` — checks 300-600 byte range

  **Rejected:**
  - Single monolithic validation function — harder to debug, difficult to test, unclear which check failed
  - No validation — risks invalid files, violates spec requirements
  - Inline validation scattered in main() — reduces readability, code duplication

  **Rationale:** Separation of concerns allows each validation to be tested independently, makes
  failures easy to diagnose (error message clearly identifies which check failed), and enables
  reuse of validation functions in test suites. Feature 197 demonstrates this pattern with
  comprehensive test coverage of each validation function.

  ### 5. Encoding Implementation: Explicit Parameters

  **Chosen:** `Path.write_text(content, encoding="utf-8", newline="\n")`

  **Rejected:**
  - Relying on platform default encoding — inconsistent across OS
  - Manual BOM handling (`utf-8-sig`) — would add unwanted BOM bytes
  - Post-hoc line ending conversion — doesn't prevent OS interference, error-prone

  **Rationale:** Python's `newline` parameter is specifically designed for this purpose. Setting
  `newline="\n"` prevents Python from automatically converting line endings based on the OS.
  The `encoding="utf-8"` ensures UTF-8 without BOM (Python's default UTF-8 implementation).
  This combination satisfies FR-5 and FR-6 in a single, idiomatic call.

  ### 6. File Size Validation: Static Range Check

  **Chosen:** Constants `MIN_SIZE = 300` and `MAX_SIZE = 600`, validate `MIN_SIZE <= size <= MAX_SIZE`

  **Rejected:**
  - Dynamic calculation from existing files — adds complexity, fragile to changes
  - No validation — violates NFR-1 requirement
  - Percentage-based validation — adds complexity, doesn't match spec requirement

  **Rationale:** Spec defines the requirement as a specific byte range (300-600). Static constants
  make the validation explicit and auditable. Feature 197 uses identical approach with measured
  success.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib | File I/O, path handling | Use (stdlib) | Modern Python 3.11+ standard for file operations, cross-platform path handling, clean API for text file creation with encoding control |
  | subprocess | External command execution (git) | Use (stdlib) | Standard library for safe command execution (shell=False prevents injection), proper error handling with check=True, no external dependencies |
  | sys | System operations (stderr, exit codes) | Use (stdlib) | Standard for error reporting and exit code management in CLI applications |
  | GitPython | Git operations (alternative) | Reject | Introduces external dependency (violates NFR-4), unnecessary for simple git add/commit/push operations, feature 197 uses subprocess successfully |
  | os.path | File path manipulation (alternative) | Reject | Pre-pathlib approach, less ergonomic, doesn't provide pathlib advantages, not idiomatic Python 3.11+ |
  | faker | Content generation (alternative) | Reject | External dependency, violates NFR-4, unnecessary complexity, doesn't match 197+ precedent approach |

  ## Security Considerations

  1. **Command Injection Prevention:** Using `subprocess.run(shell=False)` with a list of arguments
     (not a string) ensures git command arguments are passed directly without shell interpretation.
     This prevents command injection attacks even if filename or commit message contained special characters.

  2. **File Encoding Safety:** Explicitly specifying UTF-8 encoding prevents:
     - Encoding errors from platform-dependent encoding (Windows might try cp1252 by default)
     - Encoding confusion in CI/CD environments where locale may be undefined
     - File corruption from encoding mismatches in version control systems

  3. **Line Ending Consistency:** Forcing Unix LF line endings (`newline="\n"`) prevents:
     - Git detecting "false changes" from CRLF/LF differences across team members
     - Cross-platform compatibility issues in markdown rendering
     - Potential injection vulnerabilities if line endings are misinterpreted by tools

  4. **No External Dependencies:** Using only Python standard library minimizes attack surface:
     - No supply chain risk from third-party packages
     - No dependency version conflicts or transitive vulnerabilities
     - Easier to audit and verify code security

  ## Performance Considerations

  1. **File Creation:** Single `Path.write_text()` call is highly optimized (single OS syscall).
     Performance impact: negligible (sub-millisecond for small files).

  2. **Validation Functions:** Each validation reads the file once:
     - `validate_encoding()` and `validate_line_endings()` use `read_bytes()` (binary read, fast)
     - `validate_structure()` uses `read_text()` (text parsing, minimal overhead for small files)
     - Total validation overhead: ~1-2 milliseconds for 300-600 byte files

  3. **Git Operations:** Network latency dominates:
     - Local file operations: ~1-2 milliseconds
     - Git add/commit: ~10-50 milliseconds (local repo operations)
     - Git push: 100-1000+ milliseconds (network I/O, depends on latency and server)
     - Overall feature: dominated by network latency, not code efficiency

  4. **No Optimization Needed:** All operations are bounded by the small file size (~350-550 bytes typical).
     Performance is well within acceptable parameters for a 10-15 minute feature.

  ## Integration Points

  1. **Git Integration:** Feature relies on:
     - Existing git repository with feature branch `feat/198-markdown-file-creation-64ec61` (pre-created)
     - Git user configuration (user.name and user.email must be set)
     - Push access to remote origin branch
     - No merge conflicts (straight file addition)

  2. **File System Integration:**
     - Requires write access to repository root directory
     - No modifications to existing files or directory structure
     - Single file creation operation (atomic, no partial state)

  3. **Project Infrastructure:**
     - Feature module integrates into `src/sheep/features/` (following precedent from features 195-197)
     - Test module integrates into `tests/` directory
     - No modifications to core Sheep platform code (`src/sheep/` excluding features/)
     - No changes to configuration, CLI, or other system components

  ## Dependencies

  **Required:**
  - Python 3.11+ (for pathlib with modern APIs)
  - Git 2.30+ (for git commands and conventional commits)
  - Feature branch `feat/198-markdown-file-creation-64ec61` (pre-created)
  - Write access to repository root and git push permissions

  **Optional/Not Required:**
  - No external Python packages (all from standard library)
  - No external APIs or services
  - No system configuration changes
  - No modifications to existing source code

  ## Risk Assessment

  **Low Risk:** Feature is simple, well-precedented, and isolated:
  - Single file creation (no modifications to existing files)
  - No changes to core platform code
  - Proven pattern from 197+ preceding features
  - Comprehensive validation before git operations
  - No external dependencies or API calls

  **Mitigations:**
  - Validation functions check all success criteria before git operations (fail-fast)
  - Error handling with clear messages helps diagnose any issues
  - Test suite validates all validation functions independently
  - Integration tests verify complete workflow

  ---

  _Research phase complete — ready for implementation planning_
