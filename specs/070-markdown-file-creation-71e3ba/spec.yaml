# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Create a single markdown file named `test-9yn2il.md` at the repository root with the following structure:
  - One H1 markdown heading serving as a title
  - 2-3 sentences of coherent, grammatically correct prose immediately following the heading

  This is a pure content-creation task demonstrating the Sheep platform's markdown file generation and git integration workflow. No code modifications, architecture changes, or new dependencies are required.

  ## Success Criteria

  - [ ] File `test-9yn2il.md` created in the repository root directory
  - [ ] File contains exactly one H1 heading (`# Title`) as the first line
  - [ ] File contains exactly 2-3 sentences of coherent prose immediately following the H1 heading
  - [ ] File content is grammatically correct, properly punctuated, and semantically coherent
  - [ ] File passes markdown validation (via existing validate_markdown_file function)
  - [ ] File is committed to git with a conventional commit message (e.g., `feat: create test-9yn2il.md`)
  - [ ] Commit is pushed to remote repository on the feature branch
  - [ ] No new code files created; implementation uses only existing content_generators.py infrastructure
  - [ ] All operations logged via structured logging for observability

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-9yn2il.md` in the repository root directory
  - **FR-2**: File must contain a single H1 markdown heading (title) as the first line
  - **FR-3**: File must contain exactly 2-3 sentences of coherent prose immediately following the H1 heading
  - **FR-4**: Content must be grammatically correct, properly punctuated, and semantically coherent
  - **FR-5**: File must be valid markdown format (parseable by markdown validator without errors)
  - **FR-6**: File must be staged and committed to git with a conventional commit message (feat: create test-9yn2il.md)
  - **FR-7**: Committed changes must be pushed to the remote repository on the current feature branch

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded in UTF-8 with Unix LF line endings (cross-platform compatibility)
  - **NFR-2**: Content generation must use Claude API via existing `content_generators.py` infrastructure (no new LLM integrations)
  - **NFR-3**: Content generation must complete within 30 seconds (reasonable timeout for LLM API call and validation)
  - **NFR-4**: All file operations and git interactions must be logged via structured logging for observability and debugging
  - **NFR-5**: Implementation must use only existing project dependencies; no new packages or external tools required
  - **NFR-6**: No modifications to existing source code files (content_generators.py, config, tools); feature uses only existing functions
  - **NFR-7**: Generated content must avoid sensitive information, external references, or platform-specific assumptions

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the markdown content cover? | Any topic (unrestricted) | Matches user query "about anything". Maximizes flexibility. Existing infrastructure has no topic constraints. |
  | 2 | Should sentence count be strictly 2-3 or flexible? | Strict 2-3 sentences | Specification explicitly requires "2-3 sentences". Users expect deliverables to match documented requirements. Validation ensures compliance. |
  | 3 | Should file creation include commit and push operations? | Yes, full workflow | Matches features 066-069 pattern. Demonstrates end-to-end integration. Existing create_markdown_file() already orchestrates all steps. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adding a single new markdown file (test-9yn2il.md) |
  | content_generators.py | None | Uses existing functions, no modification needed |
  | Git history | Low | Creates one new commit on the current branch |
  | Filesystem | Low | Single file creation, no deletions or modifications |
  | Dependencies | None | Uses only existing project infrastructure |

  ## Dependencies

  **Existing Infrastructure (no new dependencies required):**
  - `src/sheep/content_generators.py` - Main markdown creation workflow
    - `generate_markdown_content()` - LLM-based content generation
    - `write_markdown_file()` - Disk I/O with safety validation
    - `validate_markdown_file()` - Markdown format validation
    - `commit_markdown_file()` - Git staging and committing
    - `push_markdown_file()` - Remote repository push
    - `create_markdown_file()` - Orchestration function (recommended entry point)
  - `src/sheep/config/llm.py` - LLM configuration and factory (`get_reasoning_llm()`)
  - `src/sheep/tools` - Git operations (GitCommitTool, GitPushTool)
  - `src/sheep/observability/logging.py` - Structured logging
  - Python 3.11+ standard library (pathlib, logging, json)
  - CrewAI LLM framework (already in project dependencies)
  - Claude API access (via ANTHROPIC_API_KEY environment variable)

  **Implementation Approach:**
  Call the existing `create_markdown_file("test-9yn2il.md")` function from `content_generators.py`. This single function call orchestrates:
  1. Generate markdown content using Claude API
  2. Write file to disk with safety validation
  3. Validate markdown format
  4. Commit to git with conventional message
  5. Push to remote repository

  No additional code required; all infrastructure is existing and tested.

  ## Size Estimate

  **S** (Small) — Single file creation with zero code changes. The complete implementation workflow is already built into `content_generators.py`.

  **Effort breakdown:**
  - Invoke existing orchestration function: ~1 minute
  - Content generation via Claude API: ~10-20 seconds
  - Validation and git operations: ~5-10 seconds
  - **Total estimated time: <5 minutes**

  No complexity, no tests required, no integration issues expected. This follows the established pattern from features 066-069.

