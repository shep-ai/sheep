content: |
  ## Problem Statement

  Create a single markdown file called test-mkh44q.md at the repository root with a title and 2-3
  sentences about any topic. This feature is part of the test file generation workflow used in the
  Sheep agentic platform repository.

  ## Success Criteria

  - [ ] File `test-mkh44q.md` created at repository root level
  - [ ] File contains an h1 heading (markdown title format: `# Title`) as the first element
  - [ ] File contains exactly 2-3 sentences of prose following the h1 heading
  - [ ] File format and style matches existing test markdown files (e.g., test-g0dk19.md, test-fj138v.md)
  - [ ] File uses valid markdown syntax with no syntax errors
  - [ ] File is committed to feature branch `feat/060-markdown-test-file-ea664d` with descriptive commit message
  - [ ] No existing files or code are modified by this feature

  ## Functional Requirements

  - **FR-1**: The system must create a markdown file with the exact filename `test-mkh44q.md`
  - **FR-2**: The file must be created at the repository root directory (not in any subdirectory)
  - **FR-3**: The file must contain an h1 heading (using `# ` markdown syntax) as the first element
  - **FR-4**: The file must contain 2-3 sentences of prose content following the h1 heading
  - **FR-5**: The prose content can be about any topic of the implementer's choosing

  ## Non-Functional Requirements

  - **NFR-1**: The file must be valid markdown—no syntax errors, proper formatting, and renderability in standard markdown viewers
  - **NFR-2**: The file must be committed to version control with a descriptive commit message following conventional commit format (e.g., `feat: Create test-mkh44q.md markdown file`)
  - **NFR-3**: The file format, structure, and style must match the established pattern of existing test markdown files in the repository
  - **NFR-4**: The feature must not modify, delete, or depend on any existing files, code modules, or functionality
  - **NFR-5**: The implementation must be self-contained and require no external build processes, code generation, or integration steps

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the prose content be meaningful and informative, or generic/placeholder? | Meaningful and informative prose | Previous test files show thematic content (cloud computing, curiosity, clear communication). Maintaining this pattern ensures consistency and demonstrates platform quality. |
  | 2 | Are there content restrictions or topic requirements? | No restrictions - any topic is acceptable | Specification explicitly states "about any topic." Complete creative freedom aligns with this requirement and observed patterns where each test file has distinct themes. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new markdown file added to root directory alongside existing test-*.md files |
  | Git tracking | Low | New file committed to feature branch, follows standard git workflow |

  ## Dependencies

  None. This feature has no dependencies on:
  - External libraries or frameworks
  - Build systems
  - Other code modules
  - Existing markdown files

  The feature is entirely self-contained—creating a static markdown file with specified content.

  ## Size Estimate

  **S** — This is a minimal task requiring only file creation. The work involves:
  - Writing a markdown file with a title and 2-3 sentences (~5 minutes)
  - No code changes or integrations
  - Clear, established pattern from 60+ existing test files in the repository
  - Single isolated file with no dependencies or side effects
  - Straightforward implementation with no complexity or decision-making required
