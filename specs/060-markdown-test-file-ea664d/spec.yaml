content: |
  ## Problem Statement

  Create a single markdown file called test-mkh44q.md at the repository root with a title and 2-3
  sentences about any topic. This feature is part of the test file generation workflow used in the
  Sheep agentic platform repository.

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is an agentic platform for automated code implementation. The current
  working directory organization is:

  - **Root directory**: Contains markdown files (primary artifact type for this task)
  - **specs/**: Feature specifications organized by feature number (e.g., `060-markdown-test-file-ea664d/`)
  - **README.md**: Project documentation describing Sheep framework features and architecture
  - **Various markdown files**: test-*.md, JOKE.md, DESIGN_PATTERN.md, etc.

  ### Architecture Patterns

  The repository follows a simple, flat structure for markdown files. Related to this task:
  - Markdown files are placed at the repository root level
  - File naming conventions for test files: `test-<random-id>.md`
  - Each markdown file contains a single h1 title followed by prose paragraphs
  - No build process, code generation, or dependencies needed
  - Files are static content, directly committed to git

  ### Relevant Technologies

  - **Markdown**: Simple markup format for content
  - **Git**: Version control (files are tracked as regular commits)
  - No code frameworks, build tools, or compilers involved

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new markdown file added to root directory alongside existing test-*.md files |
  | Git tracking | Low | New file committed to feature branch, follows standard git workflow |

  ## Dependencies

  None. This feature has no dependencies on:
  - External libraries or frameworks
  - Build systems
  - Other code modules
  - Existing markdown files

  The feature is entirely self-contained—creating a static markdown file with specified content.

  ## Success Criteria

  - [ ] File `test-mkh44q.md` created at repository root
  - [ ] File contains an h1 heading (title)
  - [ ] File contains 2-3 sentences of prose about any topic
  - [ ] File format matches existing test markdown files (e.g., test-g0dk19.md, test-fj138v.md)
  - [ ] File committed to feature branch `feat/060-markdown-test-file-ea664d`

  ## Size Estimate

  **S** — This is a minimal task requiring only file creation. The work involves:
  - Writing a markdown file with a title and 3 sentences (~5 minutes)
  - No code changes or integrations
  - Clear, established pattern from 60+ existing test files in the repository
  - Single isolated file with no dependencies or side effects
  - Straightforward implementation with no complexity or decision-making required
