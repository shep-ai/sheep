content: |
  ## Summary

  This implementation creates test-n8i3as.md following the established pattern from 110+ identical features.
  Work is divided into two phases:

  **Phase 1 (File Creation):** Create the markdown file with proper structure using Python's pathlib module.
  The file contains an H1 heading, blank line, and 2-3 sentences of prose with UTF-8 encoding and Unix LF
  line endings. Implementation is straightforward: choose a topic, write prose, write file using
  pathlib.Path.write_text().

  **Phase 2 (Git Integration):** Execute three sequential git operations (add, commit, push) using subprocess
  to run git CLI commands. Each operation follows explicit patterns from the spec: staging the file, committing
  with the conventional message format, and pushing to the feature branch.

  All tasks are ordered by dependency. Total estimated effort is 30 minutes (file creation 10 min, git
  operations 20 min combined).
