# Markdown content (the full research document)
content: |
  ## Research Summary

  - **Phase:** Research
  - **Updated:** 2026-03-19
  - **Status:** Complete — all technology decisions documented, alternatives evaluated, ready for implementation

  ## Technology Decisions

  ### 1. File I/O Implementation

  **Chosen:** Python pathlib.Path.write_text() with explicit UTF-8 encoding

  **Rejected:**
  - Built-in open() function — lower-level, requires manual encoding/decoding and context manager
  - os.open() + os.write() — unnecessarily verbose and low-level
  - Tempfile module — adds complexity without benefit

  **Rationale:** pathlib.Path.write_text() is the modern Python 3.11+ standard for file I/O. It provides:
  - Clean, high-level API (single method call)
  - Explicit encoding support (prevents silent encoding errors)
  - Cross-platform path handling (automatic)
  - Follows the established pattern from 110+ existing test files

  ### 2. Line Ending Handling (CRLF vs LF)

  **Chosen:** Explicit \\n (newline) characters in Python string literals

  **Rejected:**
  - os.linesep — produces \\r\\n (CRLF) on Windows, violates spec requirement for Unix LF
  - newline parameter in write_text() — adds complexity
  - Post-processing to convert line endings — unnecessary overhead

  **Rationale:** Spec explicitly requires Unix LF line endings. Python string literals with \\n produce pure LF
  on all operating systems. pathlib.write_text() preserves these \\n characters unchanged. This approach is:
  - Platform-independent (works correctly on Windows, macOS, Linux)
  - Explicit and easy to understand
  - Consistent with 110+ existing test files

  ### 3. Text Encoding

  **Chosen:** UTF-8 without BOM (Python pathlib default)

  **Rejected:**
  - UTF-8 with BOM — violates spec requirement "without BOM"; adds unwanted 3 bytes
  - Other encodings (latin1, cp1252, etc.) — unnecessary; less universal

  **Rationale:** Spec explicitly requires UTF-8 without BOM. pathlib.write_text() defaults to UTF-8 without BOM.
  This encoding:
  - Is the universal standard for text files
  - Perfectly compatible with markdown format
  - Consistent with all 110+ existing test files
  - Requires no special configuration

  ### 4. Markdown Content Structure

  **Chosen:** Standard format observed in features 108-110:
  ```
  # Heading Title

  <2-3 sentences of prose content>
  ```

  **Rejected:**
  - Alternative markdown syntax (##, ###, lists, code blocks) — breaks consistency
  - Prose without blank line — violates readability and CommonMark conventions
  - Complex formatting (bold, italics) — unnecessary for simple prose

  **Rationale:** The established pattern (test-4lc6c9.md, test-fsgmci.md, test-141tdz.md) is:
  - Line 1: Markdown H1 heading (# Title)
  - Line 2: Blank line (CommonMark requirement)
  - Lines 3+: 2-3 sentences of prose
  - Trailing newline at file end

  This format is CommonMark compliant and maintains consistency with all prior implementations.

  ### 5. Git Workflow Implementation

  **Chosen:** Subprocess calls to git CLI for staging, committing, pushing

  **Rejected:**
  - GitPython library — unnecessary abstraction for simple workflow
  - Manual git plumbing — bypasses safety checks and error handling
  - REST API or remote operations — overly complex for local operations

  **Rationale:** The feature requires three straightforward sequential git operations:
  1. `git add test-n8i3as.md` — stage the file
  2. `git commit -m "feat(111): create markdown file test-n8i3as.md with prose content"` — commit
  3. `git push origin feat/111-markdown-file-creation-cb60cf` — push to feature branch

  Subprocess is best because it:
  - Executes commands directly and transparently
  - Provides clear error messages if operations fail
  - Is easier to debug (can see exact git commands)
  - Requires no library API learning
  - Follows the pattern likely used in features 108-110

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O | **Use** | Modern Python standard; Path.write_text() method; part of stdlib |
  | subprocess (stdlib) | Git operations | **Use** | Execute git CLI commands; straightforward for sequential operations |
  | gitpython | Git operations | **Reject** | Unnecessary abstraction for simple staging/commit/push workflow |
  | os (stdlib) | File operations | **Reject** | Lower-level than pathlib; pathlib is modern standard for Python 3.11+ |
  | tempfile (stdlib) | Temporary files | **Reject** | Not needed for direct file creation |

  ## Security Considerations

  **File Permissions:** pathlib.write_text() creates files with platform-dependent permissions (0o644 on Unix,
  inherited on Windows). Test files are public artifacts with no sensitive content.

  **Path Traversal:** Spec requires exact filename `test-n8i3as.md` in repository root. No user input used for
  filename; no directory traversal vulnerability possible.

  **Content Injection:** Markdown content is prose (natural language), not executable code. No risk of code injection
  or script attacks. Content is human-written.

  **Git Operations:** Subprocess execution is safe because git command and arguments are hardcoded (not user-input).
  Commit message is pre-specified in spec. No shell injection risk.

  **Data Integrity:** Explicit UTF-8 encoding ensures reliable file handling across platforms. LF line endings are
  explicit in string literals. No conversion risk.

  **No Sensitive Data:** Test markdown files are public repository artifacts. Prose content is generic (never contains
  secrets or credentials).

  ## Performance Implications

  **File Creation:** pathlib.write_text() is a single system call (~1-5ms). File size is 400-600 bytes (minimal I/O).

  **Git Operations:**
  - git add: ~1-5ms (indexes file in staging area)
  - git commit: ~5-10ms (writes to git object database)
  - git push: ~100-500ms (network operation to remote)

  **Overall:** Total execution ~500-1000ms (dominated by git push latency). No performance optimization needed.

  ## Architecture Notes

  **Integration:** Feature is isolated to repository root; does not depend on `/src/sheep/` application source;
  does not modify tests, configuration, or tooling; follows established pattern from 110+ implementations.

  **Established Patterns:**
  - File creation: pathlib.Path.write_text()
  - Markdown format: H1 + blank line + prose
  - Git workflow: stage → commit → push
  - Filename: test-<random-id>.md

  **No New Dependencies:** Uses only Python standard library (pathlib, subprocess).

  **Minimal Blast Radius:** Only affects repository root; single new file; no modifications to existing files;
  affects only feature branch; cannot impact application functionality.

