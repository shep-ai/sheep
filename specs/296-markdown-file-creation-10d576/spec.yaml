content: |
  ## Problem Statement

  Create a single markdown file called `test-cawbvq.md` in the repository root with a title and 2-3 sentences of prose content.
  This feature is part of a systematic workflow where each numbered task creates a single markdown file following an established
  pattern and convention used throughout 295+ previous iterations in this repository (features 005-295).

  The file must conform to established markdown conventions:
  - H1 heading as title (using `#` syntax)
  - Blank line separator following the heading
  - 2-3 sentences of coherent prose content
  - UTF-8 encoding without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not Windows CRLF
  - File size typically 400-600 bytes (natural outcome of proper structure)
  - Staged in git using `git add test-cawbvq.md`
  - Committed with conventional commit message: `feat(296): create markdown file test-cawbvq.md with prose content`
  - Pushed to the feature branch `feat/296-markdown-file-creation-10d576`

  ## Codebase Analysis

  ### Project Structure

  The Sheep platform is a systematic markdown file creation testing infrastructure with the following key directories and purposes:

  - **Repository Root**: Contains 295+ test markdown files (test-*.md pattern) created across features 005-295
  - **`/specs/`**: Master directory containing subdirectories for each feature (features 005-296+), each with feature.yaml, plan.yaml, research.yaml, spec.yaml, and tasks.yaml
  - **`/.github/`**: GitHub Actions CI/CD workflows for automated testing and feature management
  - **`/src/`** (if present): Application source code not directly involved in file creation workflow
  - **`/.claude/`**: Claude Code assistant configuration and memory

  The repository demonstrates a clear, scalable pattern where features are numbered sequentially, each with a dedicated spec directory containing documentation for that feature's requirements, analysis, plan, and task tracking.

  ### Architecture Patterns

  The Sheep platform follows a **systematic feature-based architecture** with the following patterns:

  - **Feature Isolation**: Each feature (005-296+) is self-contained with its own spec directory, planning, and tracking documentation
  - **Conventional Commit Pattern**: All commits follow `feat(<number>): <description>` format with precise, consistent messaging
  - **Sequential Numbering**: Features are numbered sequentially (005, 006, ..., 294, 295, 296), enabling easy tracking and relationship mapping
  - **Markdown File Pattern**: Each feature creates exactly one markdown file with identical structure: H1 heading + blank line + 2-3 sentences of prose
  - **Git Workflow**: Standard feature branch → commit → push pattern, with no branching complexity or merge conflicts (each feature adds one file)
  - **CI/CD Integration**: GitHub Actions workflows automate testing and validation of feature implementations

  The established pattern demonstrates that this simple, repeatable workflow scales across 295+ prior implementations with zero architectural complexity or technical debt.

  ### Relevant Technologies

  - **Python 3.11+**: Runtime environment (specified in pyproject.toml); uses pathlib standard library for file I/O
  - **Markdown (CommonMark spec)**: File format standard; features are simple files with H1 heading + prose paragraphs
  - **Git**: Version control system for staging, committing, and pushing files to remote repository
  - **GitHub**: Remote repository hosting; feature branch destination for all commits
  - **Unix/Linux shell**: Command execution environment for git operations
  - **GitHub Actions**: CI/CD automation for running tests and validating feature implementations on push

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-cawbvq.md) to existing collection of 295+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites, no permission changes |
  | Git Repository | Low | Standard single commit and push following established pattern from features 005-295; no branch/merge complexity, no destructive operations, no conflicts |
  | Git History | Low | One new commit added to feature branch with conventional message; does not affect main branch until merged |
  | Remote Repository | Low | New file and single commit pushed to origin; no impact on release branches or other infrastructure |
  | Source Code (/src/) | None | Feature is purely file creation; does not depend on or impact any source code, packages, or application behavior |
  | Tests | None | No modifications to test suite; feature does not require test updates |
  | Configuration Files | None | No changes to pyproject.toml, .env, docker configuration, or GitHub workflows |
  | CI/CD Pipeline | None | Placeholder CI jobs will run on push but are not affected by this feature; feature does not modify workflow definitions |
  | Application Logic | None | Feature has no impact on agents, flows, tools, or observability infrastructure |

  ## Dependencies

  **External Runtime Dependencies**:
  - Python 3.11+ (specified in pyproject.toml; required for pathlib and standard library features)
  - Git (for version control operations: add, commit, push)
  - Unix/Linux shell or equivalent command execution environment
  - Network access to GitHub remote repository (for push operation)

  **Internal Dependencies**:
  - Feature branch `feat/296-markdown-file-creation-10d576` must exist (pre-created by feature setup)
  - File system write access to repository root directory (already available)
  - Git configuration with user.name and user.email set (standard prerequisite for commits)
  - pathlib standard library module (included in Python 3.11+; no external packages needed)

  **Pattern/Convention Dependencies**:
  - Established markdown file pattern across 295+ prior features provides clear precedent for:
    - File structure: H1 heading + blank line + prose
    - Filename format: test-<random-string>.md
    - Content format: UTF-8 encoding, LF line endings, 400-600 byte size
    - Git workflow: conventional commits, feature branch, push to origin
  - No modifications to source code, tests, or configuration needed; feature is purely file creation

  **No External Package Dependencies**:
  - Feature uses only Python standard library (pathlib, subprocess/os for git operations if needed)
  - No additional pip packages required beyond existing project dependencies
  - No API keys, credentials, or external service integrations needed
  - No database, cache, or storage system dependencies

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes of actual implementation work)

  **Justification**:
  - Well-established pattern with 295+ identical test files providing clear, proven precedent
  - No architectural decisions, design choices, or research required
  - Flexible topic selection with no constraints; implementer chooses freely
  - Single file with minimal, straightforward content format (one H1 heading + 2-3 sentences of prose)
  - File naming (test-cawbvq.md) is pre-specified, eliminating naming decisions
  - Git workflow is mechanical and follows exact precedent from 295+ prior implementations
  - Recent feature implementations (290-295) demonstrate efficient execution in 10-15 minutes
  - No code review complexity or architectural concerns; purely file creation following established pattern

