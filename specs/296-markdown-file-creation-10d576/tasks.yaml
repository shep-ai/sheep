content: |
  ## Summary

  The implementation is a straightforward sequence of file creation followed by git integration, organized into two phases.

  **Phase 1** creates the markdown file artifact: define prose content as string constants, construct markdown formatted content with H1 heading and blank line separator, and write to disk using pathlib with explicit UTF-8 encoding and Unix LF line endings. This phase produces the 400-600 byte file that will be integrated into git.

  **Phase 2** integrates the file into the repository via three sequential git operations: stage the file (git add), commit with conventional commit message (git commit), and push to the feature branch (git push). Each operation depends on the previous step completing successfully.

  The overall workflow is simple, deterministic, and follows the established pattern from 295+ prior markdown file creation features (005-295). All error handling is via subprocess.CalledProcessError with check=True, providing fail-fast behavior and clear error reporting.

  ## Execution Flow

  ```
  Task 1: Create markdown file
    ├─ Define constants (filename, title, prose, commit message)
    ├─ Construct markdown content with proper formatting
    ├─ Write to disk with pathlib (UTF-8, LF line endings)
    └─ Verify file structure and encoding

  Task 2: Stage file (depends on Task 1)
    ├─ Run git add test-cawbvq.md
    └─ Verify file appears in staging area

  Task 3: Commit file (depends on Task 2)
    ├─ Run git commit with conventional message
    └─ Verify commit message matches specification

  Task 4: Push to remote (depends on Task 3)
    ├─ Run git push -u origin HEAD
    └─ Verify commit is on remote and branch tracking is set
  ```

  ## Effort Distribution

  - **Phase 1 (File Creation):** 4 minutes
    - Task 1: Define prose, write file, verify structure
  - **Phase 2 (Git Integration):** 6-8 minutes
    - Task 2: git add (2 minutes)
    - Task 3: git commit (2 minutes)
    - Task 4: git push (2 minutes)
  - **Total:** 10-12 minutes

  ## Testing Strategy

  Each task uses TDD with RED-GREEN-REFACTOR cycles:
  - **RED:** Assert pre-condition (file doesn't exist, not staged, etc.)
  - **GREEN:** Execute the minimal operation to satisfy the condition
  - **REFACTOR:** Verify post-condition and clean up any temporary state

  No traditional unit tests are written (feature is file I/O intensive and integration-focused). Instead, verification is via:
  - File system checks (file existence, size, encoding, line endings)
  - Git commands (git status, git log, git show, git ls-remote)
  - Exception handling (CalledProcessError for git failures)

  ## Notes for Implementation

  - Prose content should be coherent, manually-written (not generated or templated)
  - Topic choice is free — implementer selects prose content that is 2-3 complete sentences
  - All file operations must specify encoding='utf-8' and newline='\\n' to ensure spec compliance
  - All subprocess calls must use check=True to enable fail-fast error handling
  - Git authentication is assumed to be pre-configured (SSH keys or credential helpers)
  - No modifications to existing files — feature is purely additive
