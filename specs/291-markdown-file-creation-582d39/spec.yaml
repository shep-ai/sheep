content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-p1rf9x.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 90+ similar test files already existing in the repository as precedents (test-*.md files at the root directory). This is a continuation of the markdown-file-creation pattern established in features 069-290, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File test-p1rf9x.md is created in the repository root directory
  - [ ] File contains a single markdown heading (# followed by title text)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is UTF-8 encoded without BOM (Byte Order Mark)
  - [ ] File uses LF (Unix-style) line endings, not CRLF
  - [ ] File follows the established pattern from 90+ existing test markdown files
  - [ ] File structure matches precedent: heading, blank line, prose content
  - [ ] File size naturally results from proper structure (approximately 400-600 bytes)
  - [ ] File is staged using git add test-p1rf9x.md
  - [ ] Commit is created with conventional format: feat(291): create markdown file test-p1rf9x.md with prose content
  - [ ] Commit message follows project conventions (type(number): description)
  - [ ] Commit is pushed to feature branch feat/291-markdown-file-creation-582d39
  - [ ] No existing files are modified during implementation
  - [ ] No source code files (/src/sheep/) are impacted

  ## Functional Requirements

  - **FR-1**: Create a markdown file with exact filename test-p1rf9x.md
  - **FR-2**: Place the file in the repository root directory (not in subdirectories)
  - **FR-3**: File must contain a markdown heading (# followed by title text) as the first element
  - **FR-4**: File must contain 2-3 sentences of prose content following the heading
  - **FR-5**: Prose content must be coherent, well-formed English text on any topic (per spec: "about anything")
  - **FR-6**: Stage the created file using git add test-p1rf9x.md
  - **FR-7**: Create a git commit with conventional commit message format
  - **FR-8**: Commit message must follow pattern: feat(291): create markdown file test-p1rf9x.md with prose content
  - **FR-9**: Push the commit to the remote feature branch feat/291-markdown-file-creation-582d39

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without Byte Order Mark (BOM)
  - **NFR-2**: Line endings must be LF (Unix-style), not CRLF or CR
  - **NFR-3**: Implementation must follow the established pattern from 90+ existing test files (heading + blank line + prose)
  - **NFR-4**: File structure: markdown heading (#) on first line, blank line, prose content (no extra blank lines at end unless natural from editor)
  - **NFR-5**: No modifications to existing files or source code during implementation
  - **NFR-6**: No impact on application source code in /src/sheep/ or application configuration
  - **NFR-7**: No test modifications, no configuration changes, no dependency updates
  - **NFR-8**: Implementation must be isolated to repository root file creation and git operations
  - **NFR-9**: File should follow CommonMark markdown specification for heading syntax and content formatting
  - **NFR-10**: File should follow project git conventions (user.name, user.email configured; standard commit workflow)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What topic should the markdown content address? | Any topic (implementation chosen) | Spec explicitly allows "about anything" without topic constraints. 90+ precedent test files demonstrate diverse topics (nature, technology, science, history, culture, philosophy) all following same format successfully. No external research or validation needed. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-p1rf9x.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-290; no branch/merge complexity, no destructive operations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code in /src/sheep/ or elsewhere |
  | Specs Directory | Low | Updates only this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Application Logic | None | Feature has no impact on application behavior, agents, flows, or tools |

  ## Dependencies

  - **Git repository**: Feature branch `feat/291-markdown-file-creation-582d39` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-p1rf9x.md is provided in the feature spec and must be used exactly as specified
  - **Markdown syntax knowledge**: Implementation must follow CommonMark specification for markdown heading syntax

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-290) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-p1rf9x.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 220+ prior implementations

  ---

  _Requirements phase complete — functional/non-functional requirements defined, success criteria specified, product decisions documented with AI recommendations, ready for implementation_
