content: |
  ## Architecture Overview

  This feature follows the established Sheep architecture pattern proven across 290+ identical
  markdown-file-creation features (numbers 069-290). The implementation orchestrates existing,
  validated utilities in a clear three-phase workflow:

  ### Phase 1: Content Generation (Claude API)
  - Use sheep.config.llm module for Claude API integration
  - Structured prompt (existing MARKDOWN_GENERATION_PROMPT pattern) requests H1 heading + 2-3 sentences
  - Automatic retry with exponential backoff (max 3 attempts, 1-4 second delays)
  - Comprehensive logging via sheep.observability.logging for observability
  - Generate semantically coherent, unique prose content

  ### Phase 2: File I/O & Validation
  - Use pathlib.Path.write_text() with explicit encoding='utf-8' (guarantees no BOM)
  - Explicit '\n' line endings ensure LF on all platforms (not os.linesep which is platform-dependent)
  - Comprehensive validation before git operations:
    - Heading structure (H1 markdown format: # Title)
    - Sentence count (regex-based boundary detection: 2-3 sentences)
    - Prose length (100-300 characters)
    - UTF-8 encoding verification
    - Blank line separation between heading and prose
    - Vocabulary variety (minimum 10 unique words)
  - Fail fast principle: validation catches errors before git operations

  ### Phase 3: Git Workflow
  - Stage file: `git add test-p1rf9x.md`
  - Commit: conventional format 'feat(291): create markdown file test-p1rf9x.md with prose content'
  - Push: `git push -u origin feat/291-markdown-file-creation-582d39`
  - Standard subprocess calls for git operations (matches Sheep codebase patterns)

  ## Key Design Decisions

  ### 1. Content Generation: Claude API with Structured Prompts (from research)
  **Why this approach:**
  - Proven across 290+ prior features (features 069-290)
  - Ensures semantic coherence and quality (vs hard-coded or random content)
  - Existing sheep.config.llm integration is production-hardened
  - Retry logic with exponential backoff handles transient API failures
  - Scales to any number of features without modification
  - Each feature generates unique content (no repetition)

  ### 2. File Creation: pathlib with Explicit UTF-8 Encoding (from research)
  **Why this approach:**
  - pathlib is Python 3.11+ stdlib (no external dependencies)
  - Explicit encoding='utf-8' parameter guarantees UTF-8 without BOM (spec NFR-1)
  - Explicit '\n' ensures LF line endings on all platforms (spec NFR-2)
  - Cleaner API than open() context managers
  - Existing create_markdown.py module already uses pathlib internally

  ### 3. Comprehensive Validation Before Git (from research)
  **Why this approach:**
  - Catches API generation errors early (fail fast principle)
  - Ensures output meets all spec requirements before irreversible git operations
  - Existing validate_content() module provides all needed checks
  - Reduces post-commit issues and debugging effort
  - Detailed error messages aid troubleshooting

  ### 4. Git Integration: subprocess with Standard Commands (from research)
  **Why this approach:**
  - Sheep project standardizes on subprocess for git operations
  - No external dependencies (subprocess is stdlib)
  - Matches established codebase patterns (used in features 069-290)
  - Standard git commands are well-documented and easy to debug
  - Error handling via return codes is straightforward

  ### 5. Error Handling: Retry with Exponential Backoff (from research)
  **Why this approach:**
  - Handles transient API failures (network timeouts, rate limiting)
  - Max 3 retries with 1s, 2s, 4s delays = 7 seconds total max wait
  - Balances robustness with timeout expectations
  - Logged via sheep.observability.logging for observability
  - Proven pattern across all 290+ features

  ### 6. Topic Selection: Any Topic (from spec resolution)
  **Why this approach:**
  - Spec explicitly allows "about anything" without constraints
  - 90+ existing test files demonstrate diverse topics (nature, technology, science, history, etc.)
  - Implementation can choose appropriate topic that results in coherent prose
  - No external research or validation required
  - Maximizes flexibility while maintaining consistency with requirements

  ## Implementation Strategy

  ### Phase Ordering Rationale
  1. **Phase 1 (Content Generation) comes first** because downstream phases depend on valid content
     - If API fails or returns invalid content, validation catches it before file creation
     - Fail fast: detect problems early, before file system operations

  2. **Phase 2 (File Creation & Validation) comes second** because file must exist before git operations
     - Phase 1 provides validated content
     - Phase 2 creates the file with correct encoding/line endings
     - Validation ensures file meets spec before git staging

  3. **Phase 3 (Git) comes last** because it's irreversible
     - Phases 1-2 ensure file is correct before committing
     - Git operations can't be easily undone (commits are permanent)
     - Final verification confirms file state matches expectations

  ### Key Success Factors
  - **Consistency**: Follow 290+ established precedent from features 069-290
  - **Validation**: Comprehensive checks ensure spec compliance before git operations
  - **Error Handling**: Retry logic handles transient API failures gracefully
  - **Encoding**: Explicit UTF-8 encoding guarantees proper byte-level handling
  - **Line Endings**: Explicit '\n' ensures LF on all platforms (not platform-dependent)
  - **Logging**: All operations logged for observability and debugging

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude API timeout or transient failure | Implement retry logic with exponential backoff (max 3 attempts, 1-4s delays). Logged for observability. Timeout max: 7 seconds. |
  | Invalid content generation (wrong format, too many/few sentences) | Comprehensive validation (heading structure, sentence count, prose length) before file creation. Fail fast if validation fails. |
  | Incorrect file encoding (BOM present, wrong charset) | Use pathlib.Path.write_text(encoding='utf-8') which explicitly excludes BOM. Verify encoding after creation. |
  | Wrong line endings (CRLF instead of LF) | Use explicit '\n' in content strings; avoid os.linesep which is platform-dependent. Verify line endings after creation. |
  | Git operations fail (file already exists, permissions, branch mismatch) | Check file doesn't exist before creation. Verify feature branch exists (pre-created). Use standard git commands with error handling via return codes. |
  | File size outside spec range (~400-600 bytes) | Validation enforces prose length (100-300 characters), heading/blank line add ~50-100 bytes. Natural file size results from proper structure. |
  | No existing files modified during implementation | Feature creates only test-p1rf9x.md; no modifications to existing files. Strict file naming prevents accidental overwrites. |

  ## Files to Create
  - `test-p1rf9x.md` — markdown file with H1 heading and 2-3 sentences of prose in repository root

  ## Files to Modify
  - None — this feature is purely file creation, no modifications to existing files or source code

  ## Dependencies
  - **Git repository**: Feature branch `feat/291-markdown-file-creation-582d39` must exist (pre-created)
  - **Python 3.11+**: Runtime environment with pathlib and subprocess (stdlib, no external deps)
  - **Sheep modules**: sheep.config.llm (LLM configuration), sheep.observability.logging (structured logging)
  - **Git configuration**: user.name and user.email configured for commits
  - **API access**: Claude API available via sheep.config.llm (authentication handled by Sheep)

  ## Effort Estimate
  - **Total**: ~30 minutes (planning + 3 task phases + validation)
    - Content generation: ~15 minutes (API call + validation)
    - File creation & verification: ~5 minutes (write file + check encoding/line endings)
    - Git workflow: ~5 minutes (stage, commit, push)
    - Integration testing: ~5 minutes (end-to-end verification)

  Aligns with spec size estimate (S: 10-15 minutes) — planning overhead adds ~15 minutes to total task time.

  ---

  _Plan complete — architecture, strategy, and risk mitigation documented. Ready for task breakdown and implementation._
