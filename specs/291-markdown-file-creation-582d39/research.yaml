content: |
  ## Research Summary

  Feature 291 creates a markdown file (test-p1rf9x.md) following the established Sheep pattern proven
  across 290+ identical features. The implementation uses Claude API for content generation, pathlib
  for file I/O with strict encoding/line ending requirements, comprehensive validation, and standard
  git workflow for staging/committing/pushing.

  ## Technology Decisions

  ### 1. Content Generation: Claude API with Structured Prompts

  **Chosen:** Use Claude API via sheep.config.llm module with structured prompts (existing pattern)

  **Rejected:**
  - Hard-coded content — inflexible, doesn't scale, violates DRY for 290+ features
  - Random/template content — lacks semantic coherence, harder to validate

  **Rationale:**
  The existing create_markdown.py module implements Claude API integration with:
  - Structured MARKDOWN_GENERATION_PROMPT that requests H1 heading + 2-3 sentences
  - Automatic retry with exponential backoff (max 3 attempts, 1-4 second delays)
  - Integration with sheep.config.llm for LLM configuration
  - Comprehensive logging via sheep.observability.logging

  This approach is proven across all 290+ prior markdown-file-creation features (290, 289, 288, etc.).
  Each feature generates unique, thematically related prose. The model is configured for reasoning
  to ensure content quality.

  ### 2. File I/O: pathlib.Path.write_text() with Explicit UTF-8

  **Chosen:** Use pathlib.Path(filename).write_text(content, encoding='utf-8')

  **Rejected:**
  - Python open() with manual encoding — same result, more boilerplate
  - Bash/shell echo — platform differences, line ending issues, less portable

  **Rationale:**
  - pathlib is Python 3.11+ stdlib (no dependencies)
  - Explicit encoding='utf-8' parameter guarantees UTF-8 without BOM
  - Spec explicitly requires "Python pathlib (file I/O)"
  - Clean, idiomatic Python API
  - Existing create_markdown.py module already uses pathlib for file operations
  - Less boilerplate than open() context managers

  ### 3. Content Validation: Comprehensive Multi-Stage Checks

  **Chosen:** Implement validation before git operations (heading structure, sentence count, length, encoding)

  **Rejected:**
  - Minimal validation — risks invalid output, harder debugging
  - No validation — violates spec requirements

  **Rationale:**
  The existing create_markdown.py module implements comprehensive validation via validate_content():
  - Checks for H1 heading format (# Title)
  - Validates exactly 2-3 sentences via regex SENTENCE_BOUNDARY_PATTERN
  - Validates prose length (100-300 characters)
  - Ensures blank line separator between heading and prose
  - Checks vocabulary variety (minimum 10 unique words)
  - Validates UTF-8 encoding

  This validation:
  - Ensures output meets spec success criteria before git operations
  - Catches API generation errors early (fail fast principle)
  - Provides detailed error messages for troubleshooting
  - Is logged for observability

  ### 4. Git Integration: subprocess with Standard Commands

  **Chosen:** Use subprocess.run() for git add, commit, push (standard pattern)

  **Rejected:**
  - GitPython library — adds external dependency, unnecessary abstraction
  - Custom git tools — reinvents wheel, already have git installed

  **Rationale:**
  - Sheep project standardizes on subprocess for git operations
  - Git is guaranteed to be available (feature branch workflow requires it)
  - subprocess.run() is stdlib, no dependencies
  - Pattern matches existing codebase (see prior features 290, 289, 288)
  - Standard git commands are well-documented, easy to debug
  - Error handling via return codes is straightforward

  Git workflow sequence:
  1. `git add test-p1rf9x.md` — stage the file
  2. `git commit -m "feat(291): create markdown file test-p1rf9x.md with prose content"` — commit with conventional message
  3. `git push -u origin feat/291-markdown-file-creation-582d39` — push to feature branch

  ### 5. Line Ending Handling: Explicit LF in Python

  **Chosen:** Write content with explicit '\n' characters (pathlib handles this natively)

  **Rejected:**
  - .gitattributes normalization — less explicit, harder to guarantee
  - os.linesep — platform-dependent (CRLF on Windows), violates spec

  **Rationale:**
  Spec requires "File uses LF (Unix-style) line endings, not CRLF" (NFR-2).
  Using '\n' in Python strings is:
  - Explicit and platform-agnostic
  - Guaranteed by Python (always '\n' internally, platform handled at I/O level)
  - pathlib.write_text() writes these exactly as specified
  - All 290+ existing test files follow this pattern
  - Simpler than trying to normalize via git attributes

  ### 6. Error Handling: Retry with Exponential Backoff

  **Chosen:** Retry on API failures with exponential backoff (max 3 attempts)

  **Rejected:**
  - Fail immediately — poor UX, doesn't handle transient failures
  - Infinite retries — could hang, violates timeout expectations

  **Rationale:**
  Claude API calls can experience transient failures:
  - Network timeouts
  - Rate limiting (brief cooldown)
  - Temporary service unavailability

  The create_markdown.py module implements:
  - max_retries: 3 attempts
  - retry_delay: 1.0 seconds (exponential: 1s, 2s, 4s)
  - Total max wait: 7 seconds before permanent failure
  - Logging at each attempt for observability
  - Clear error messages on final failure

  This balances reliability with timeout expectations.

  ### 7. Encoding and BOM Handling: UTF-8 without BOM

  **Chosen:** pathlib.Path.write_text(encoding='utf-8') guarantees UTF-8 without BOM

  **Rejected:**
  - encoding='utf-8-sig' — includes BOM, violates NFR-1 requirement
  - Manual byte-level handling — unnecessary, pathlib handles correctly

  **Rationale:**
  Python's UTF-8 codec (encoding='utf-8') by default:
  - Writes UTF-8 encoded bytes
  - Does NOT include BOM (Byte Order Mark)
  - The 'utf-8-sig' variant explicitly adds BOM (used for Windows compatibility)

  Spec explicitly requires "File encoding must be UTF-8 without Byte Order Mark (BOM)" (NFR-1).
  Using encoding='utf-8' (without '-sig') is the correct approach.

  ## Library Analysis

  | Library/Module | Purpose | Decision | Reasoning |
  | -------------- | ------- | -------- | --------- |
  | pathlib | File I/O, path operations | Use | Stdlib, explicit UTF-8 encoding, clean API, required by spec |
  | subprocess | Execute git commands | Use | Stdlib, matches Sheep patterns, no extra dependencies |
  | sheep.config.llm | LLM configuration | Use | Provides Claude API integration, already integrated, tested |
  | sheep.observability.logging | Structured logging | Use | Standard Sheep logging, enables observability, debugging |
  | re (regex) | Sentence boundary detection | Use | Stdlib, used for validation in create_markdown.py |
  | GitPython | Git operations | Reject | Unnecessary abstraction over subprocess, adds dependency |
  | pyenchant/spellcheck | Content validation | Reject | Already have regex-based validation, overkill for requirements |
  | pandas/numpy | Data processing | Reject | No data processing needed for simple file creation |

  ## Security Considerations

  ### Input Validation

  The Claude API-generated content is validated before file creation:
  - Content structure checked (H1 heading, blank line, prose)
  - Sentence count validated (regex-based boundary detection)
  - Length constraints enforced (100-300 characters)
  - Encoding verified (UTF-8 validation)

  No user input is accepted for content generation (topic chosen by Claude), eliminating
  injection risks.

  ### File System Security

  - File created in repository root only (no path traversal via symbolic links)
  - No directory creation or modification
  - No existing file overwriting (would be caught by git staging error if file exists)
  - File permissions inherited from repository (umask-controlled)

  ### Git Security

  - Git must be configured with user.name/user.email (spec requirement)
  - Commits are signed/verified per project configuration
  - Push to feature branch (not main), reduces impact of any issues
  - Conventional commit message format is clear and auditable

  ### API Security

  - Claude API calls use existing sheep.config.llm module (production-hardened)
  - API key management handled by sheep infrastructure
  - Retry logic includes exponential backoff to avoid rate limit issues
  - Error messages don't leak sensitive information (logged, not printed)

  ## Performance Implications

  ### API Latency

  - Claude API call: ~2-5 seconds typical
  - Retry logic adds up to 7 seconds worst-case (3 retries with backoff)
  - Total time for feature: ~10-15 minutes (matches spec size estimate "S")

  ### File System Operations

  - File creation: <1ms (single write operation)
  - No disk I/O bottleneck

  ### Git Operations

  - `git add`: <100ms (single file)
  - `git commit`: <100ms (local operation)
  - `git push`: 1-5 seconds (network-dependent)
  - Total git overhead: <10 seconds

  ### Overall Performance

  The implementation is I/O-bound (dominated by API latency), not compute-bound.
  No optimization opportunities identified beyond API response times (external).

  ## Architecture Notes

  ### Integration with Sheep Project

  This feature follows established Sheep patterns evident in features 290, 289, 288, etc.:

  1. **Orchestration Layer**: Feature module imports and sequences utilities
     - generate_markdown_content() for Claude API
     - validate_content() for quality checks
     - pathlib for file I/O
     - subprocess for git operations

  2. **Configuration**: Uses sheep.config.llm for LLM setup
     - Handles API authentication
     - Manages model selection
     - Supports retries/timeouts

  3. **Observability**: Uses sheep.observability.logging for structured logging
     - All steps logged (generation, validation, file creation, git operations)
     - Errors include full context for debugging
     - Supports tracing across distributed system

  4. **Error Handling**: Follows Sheep error conventions
     - ValueError for validation failures
     - Exception wrapping for API errors
     - Logging at appropriate levels (info, debug, warning, error)

  ### File Structure

  The implementation fits into the existing project structure:

  - **Repository Root**: test-p1rf9x.md (created file)
  - **Specs**: This research + plan + tasks + feature spec (metadata)
  - **Source Code**: No changes to /src/sheep/ or application logic
  - **Tests**: Integration tests follow existing patterns

  ### Consistency with Prior Features

  This feature 291 is identical in pattern to:
  - Feature 290 (test-f7lgjt.md) — same approach, different filename/content
  - Feature 289 — same approach
  - Feature 288 — same approach
  - ... extending back to feature 069 (220+ identical features)

  All follow the same pattern: Claude API generation → validation → pathlib write → git workflow.
  This research documents the rationale for choices already proven across 290+ implementations.

  ## Conclusion

  The technical approach for feature 291 leverages the established, proven Sheep pattern used
  across 290+ identical markdown-file-creation features. Key decisions prioritize consistency
  (following existing patterns), simplicity (no unnecessary abstractions), and robustness
  (comprehensive validation, error handling with retries).

  The implementation is straightforward:
  1. Generate markdown content via Claude API (with retries)
  2. Validate content structure and quality
  3. Write to file with pathlib (explicit UTF-8, LF line endings)
  4. Stage, commit, and push via git (subprocess commands)
  5. Log all steps for observability

  All technology choices are standard library or existing Sheep infrastructure.
  No new external dependencies required. Estimated implementation time: 10-15 minutes.

  ---

  _Research phase complete. Technical decisions documented with clear rationale.
  Ready for implementation planning and phase execution._
