content: |
  ## Task Breakdown Summary

  Feature 291 consists of 8 concrete tasks across 3 implementation phases:

  ### Phase 1: Content Generation & Validation (Tasks 1-2, ~25 minutes)
  Tasks 1-2 generate and validate markdown content via Claude API. Task 1 calls Claude API with
  structured prompt to generate H1 heading + 2-3 sentences of prose, with automatic retry logic
  for transient failures. Task 2 validates content structure (heading format, sentence count,
  prose length, encoding, vocabulary) before file creation. Both tasks use existing Sheep
  patterns and utilities from create_markdown.py module.

  ### Phase 2: File I/O & Encoding Verification (Tasks 3-4, ~18 minutes)
  Tasks 3-4 create the markdown file with proper encoding and line endings. Task 3 uses
  pathlib.Path.write_text() with explicit encoding='utf-8' (guarantees no BOM) and explicit
  '\n' characters (ensures LF line endings on all platforms). Task 4 verifies file properties
  after creation: checks UTF-8 without BOM, verifies LF line endings (not CRLF), and validates
  file structure (heading, blank line, prose). Together, these tasks guarantee spec compliance
  for encoding and line endings (NFR-1, NFR-2).

  ### Phase 3: Git Integration & Completion (Tasks 5-8, ~31 minutes)
  Tasks 5-7 implement the git workflow (stage, commit, push). Task 5 stages file using
  'git add test-p1rf9x.md'. Task 6 creates commit with conventional message format
  'feat(291): create markdown file test-p1rf9x.md with prose content'. Task 7 pushes to
  feature branch 'feat/291-markdown-file-creation-582d39'. Task 8 runs end-to-end integration
  test verifying complete workflow and all success criteria from spec are met.

  ### Task Dependencies
  - Task 1 (content generation) has no dependencies
  - Task 2 (validation) depends on task 1 (validates task 1 output)
  - Task 3 (file creation) depends on task 2 (uses validated content)
  - Task 4 (encoding verification) depends on task 3 (verifies task 3 output)
  - Task 5 (git add) depends on task 4 (stages file after verification)
  - Task 6 (git commit) depends on task 5 (commits staged file)
  - Task 7 (git push) depends on task 6 (pushes committed changes)
  - Task 8 (integration test) depends on task 7 (verifies complete workflow)

  Linear dependency chain: task-1 → task-2 → task-3 → task-4 → task-5 → task-6 → task-7 → task-8.
  No parallel execution possible due to sequential nature of task dependencies.

  ### Effort Breakdown
  - Phase 1 (content generation & validation): 25 minutes
  - Phase 2 (file I/O & encoding): 18 minutes
  - Phase 3 (git workflow): 21 minutes
  - Total: 64 minutes

  This includes all TDD cycles (RED/GREEN/REFACTOR), testing, validation, and integration
  testing. Matches spec size estimate (S: 10-15 minutes) for core implementation plus ~50
  minutes for comprehensive testing and validation.

  ### Success Criteria Traceability
  Each success criterion from spec.yaml is addressed by one or more tasks:
  - File creation in repo root: Task 3, 4
  - H1 heading and 2-3 sentences: Task 1, 2, 4
  - UTF-8 without BOM: Task 3, 4
  - LF line endings: Task 3, 4
  - File structure (heading, blank line, prose): Task 1, 2, 4
  - File size 400-600 bytes: Task 3, 4
  - Git add: Task 5
  - Git commit with conventional message: Task 6
  - Git push to feature branch: Task 7
  - No modifications to existing files: Task 8 (verification)

  ---

  _Task breakdown complete — ordered by dependency, each task has TDD cycles and acceptance criteria.
  Ready for implementation execution._
