content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-22
  - **Status:** Complete — no new technical decisions required

  ## Technology Decisions

  ### 1. Content Generation Implementation

  **Chosen:** Use existing `generate_markdown_content()` helper function from sheep.content_generators module

  **Rejected:**
  - Custom LLM prompt and response handling — duplicates existing code, increases maintenance burden, breaks established pattern from 166+ prior implementations
  - Third-party markdown generation library — adds unnecessary external dependency, conflicts with existing helper functions, already solved problem

  **Rationale:**
  The `sheep.content_generators.generate_markdown_content()` function is battle-tested across 166+ prior features. It encapsulates:
  - Claude API integration via CrewAI's `get_reasoning_llm()`
  - Structured prompt template (`MARKDOWN_GENERATION_PROMPT`) for consistent output format
  - Built-in response validation with `_validate_markdown_content()` checking for H1 heading and 2-3 sentences
  - Automatic trailing newline enforcement for Unix convention
  - Comprehensive logging at info and debug levels

  Custom implementation would duplicate this logic and create ongoing maintenance risk. The function already guarantees the required format: `# Heading\n\n<2-3 sentences>\n` per specification requirements.

  ### 2. File I/O and Encoding Approach

  **Chosen:** Use Python pathlib for cross-platform file operations combined with `write_markdown_file()` helper from sheep.content_generators

  **Rejected:**
  - Direct `open()` calls without helper function — loses centralized encoding/validation logic, increases error handling complexity, breaks pattern consistency
  - External file management library — adds dependency, conflicts with Python stdlib approach used throughout project, overengineered for simple file write

  **Rationale:**
  The `write_markdown_file(filename, content)` helper function ensures:
  - UTF-8 encoding without BOM (Byte Order Mark) — critical for Windows compatibility where Python's default can vary
  - LF line endings (`\n`) on all platforms by opening file in text mode with default newline handling
  - Filename safety validation (checks for `/`, `\`, `.` prefix) to prevent path traversal attacks
  - Post-write verification: checks file exists and is non-empty before returning

  pathlib.Path is the modern Python standard for cross-platform I/O and is available in Python 3.11+ without external dependencies. The function's encoding parameter `encoding=\"utf-8\"` ensures consistency regardless of platform default encoding.

  ### 3. Markdown Validation Strategy

  **Chosen:** Use comprehensive `validate_markdown_file()` from sheep.content_generators covering H1 heading, sentence count, encoding, line endings, and trailing newline

  **Rejected:**
  - Basic validation (only check file exists) — insufficient to catch encoding bugs on Windows, allows invalid markdown to pass, misses line ending issues that cause cross-platform failures
  - External markdown validator library — adds dependency, overkill for simple format validation, existing Pydantic-based validation already handles all requirements

  **Rationale:**
  The `validate_markdown_file(filepath)` function performs comprehensive validation:
  - **Encoding check**: Reads file as binary, verifies no UTF-8 BOM (`\xef\xbb\xbf`), validates UTF-8 decodability
  - **Line ending check**: Inspects binary content for CRLF (`\r\n`) sequences, raises error if found (Unix LF required)
  - **Markdown structure**: Verifies H1 heading (`# `) at start, blank line separator, and prose content follows
  - **Sentence count**: Counts periods in prose content, validates 2-3 sentences per specification
  - **Trailing newline**: Ensures file ends with `\n` per Unix convention

  These checks prevent subtle bugs that manifest only on Windows or with certain editors that auto-convert line endings. The function has been proven across 166+ features and is designed specifically for this markdown file creation use case.

  ### 4. Git Workflow Integration

  **Chosen:** Use existing GitCommitTool and GitPushTool from sheep.tools via helper functions `commit_markdown_file()` and `push_markdown_file()`

  **Rejected:**
  - Direct GitPython usage — requires managing Repo object state, loses logging integration from sheep.observability, duplicates wrapper code already in place
  - Subprocess calls to git CLI — no error handling framework, loses observability through Langfuse, not type-safe, error-prone with path handling on Windows

  **Rationale:**
  The sheep.tools.git_tools module provides GitCommitTool and GitPushTool integrated with:
  - Error handling with custom exceptions and descriptive messages
  - Langfuse observability logging for execution tracing
  - Repository path management and validation
  - `set_upstream=True` for automatic branch tracking setup

  The content_generators helper functions orchestrate these tools:
  - `commit_markdown_file(filepath, content, repo_path, custom_message)` stages the file with `git add` and commits with provided message
  - `push_markdown_file(repo_path, remote)` pushes with upstream tracking

  This pattern is established and tested across 166+ features, ensuring consistency with platform architecture.

  ### 5. LLM Provider Choice

  **Chosen:** Use Claude API via CrewAI's `get_reasoning_llm()` configured through sheep.config.llm factory

  **Rejected:**
  - Direct Anthropic SDK calls — loses CrewAI's message formatting and orchestration, duplicates existing factory logic, breaks consistency with platform architecture
  - Other LLM providers (OpenAI, Google) — specification explicitly lists Claude API as the technology; no requirement flexibility on provider choice

  **Rationale:**
  The `get_reasoning_llm()` factory function from sheep.config.llm is pre-configured for complex reasoning tasks with temperature 0.2 for consistency. CrewAI's LLM abstraction ensures:
  - Message format compatibility with CrewAI's internal message passing
  - API key management through Settings with secure secret handling
  - Provider abstraction for potential fallback (though Claude is specified)
  - Consistent token accounting for observability and cost tracking

  This approach is used throughout the platform and by all 166+ prior implementations, ensuring architectural consistency.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | Python pathlib | Cross-platform file path operations | Use (standard library) | Built-in to Python 3.11+, no dependencies, modern alternative to os.path |
  | CrewAI 0.86.0+ | LLM framework and orchestration | Use (existing) | Already integrated in project, provides message formatting and observability |
  | Anthropic SDK | Claude API access | Use (via CrewAI) | Already integrated through CrewAI's LLM abstraction, no direct usage needed |
  | GitPython 3.1.0+ | Git operations | Use (via tools) | Already wrapped in sheep.tools.git_tools, use helpers not direct library |
  | Pydantic 2.0+ | Content validation | Use (existing) | Already used for validation in content_generators module |
  | markdown library | Markdown parsing | Reject | Unnecessary; content_generators already performs required validation, not a full parser needed |
  | external file tools | File I/O | Reject | Python stdlib pathlib is sufficient, no external dependency needed |

  ## Security Considerations

  1. **Path Traversal Prevention**: The `write_markdown_file()` function validates filenames to prevent directory traversal (`/`, `\`, `.` prefix checks). This prevents writing files outside repository root.

  2. **Encoding Validation**: UTF-8 without BOM validation via binary inspection prevents encoding-based vulnerabilities and platform-specific bugs (Windows default encoding differs from Unix).

  3. **LLM Prompt Injection**: The `MARKDOWN_GENERATION_PROMPT` is fixed (not user-controlled per iteration). It requests specific format with a clear example, constraining output to expected structure. The validation function catches malformed responses.

  4. **Git Operations**: GitCommitTool and GitPushTool handle authentication through existing git configuration (user.name, user.email). No credential handling in this feature code.

  5. **File System Permissions**: File creation uses default umask; no explicit permission setting needed for test files. On Windows, file is created with default permissions. On Unix, respects umask.

  ## Performance Implications

  1. **LLM Call Latency**: `generate_markdown_content()` makes a single API call to Claude. Expected latency: 1-3 seconds depending on network and Claude API load. This is acceptable for a ~10-15 minute feature implementation.

  2. **File I/O Performance**: Write operation to disk is fast (<10ms). Validation via binary read is efficient (single sequential read of ~400 bytes). No performance concerns.

  3. **Git Operations**: Commit and push operations depend on git configuration and network latency. Typical: <500ms locally, <2s for remote push. No optimization needed for this scale.

  4. **Memory Usage**: Minimal — content generation produces ~400 bytes of text, validation reads small file into memory, no streaming needed.

  5. **No Caching**: Each feature iteration generates fresh content (intentional by design). No caching logic needed.

  ## Architecture Integration

  ### Seamless Integration with Existing Codebase

  This feature integrates seamlessly with existing architecture:

  1. **Helper Function Pattern**: Leverages the mature `sheep.content_generators` module which encapsulates all markdown-specific operations. This module has been refined through 166+ feature iterations.

  2. **Logging and Observability**: Uses `get_logger(__name__)` from `sheep.observability.logging`, consistent with all other modules. Logs are collected by Langfuse for execution tracing.

  3. **Configuration Management**: LLM configuration flows through `sheep.config.llm.get_reasoning_llm()` which reads from `sheep.config.settings.Settings`. Centralizes credential management and model selection.

  4. **Git Integration**: Uses `sheep.tools.git_tools.GitCommitTool` and `GitPushTool` wrapped by content_generators helpers. All git operations go through these abstracted tools for consistent error handling and logging.

  5. **Feature Implementation Structure**: Follows pattern established in feature_166_markdown_file_creation.py with metadata constants, orchestration function, and comprehensive error handling.

  ### Established Pattern Validation

  This feature replicates the proven pattern from feature 166:
  - Filename adjustment: Change from `test-5iigac.md` to `test-m6t9bm.md`
  - Feature number: Change from 166 to 167 in metadata
  - Commit message: Update message to include feature 167 and new filename
  - No architectural changes: Content generation, validation, git workflow remain identical

  This minimal variation approach ensures consistency and reduces implementation risk.

