# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a single markdown file (test-m6t9bm.md) in the repository root following the proven
  pattern from 166+ prior identical implementations. The implementation is pure orchestration of five existing
  helper functions from the sheep.content_generators module:

  1. **generate_markdown_content()** — Orchestrates Claude API call via CrewAI's get_reasoning_llm() to produce
     markdown with H1 heading + 2-3 sentences of prose. Includes built-in validation via _validate_markdown_content().

  2. **write_markdown_file()** — Writes content to disk with explicit UTF-8 encoding (no BOM) and LF line endings.
     Validates filename for safety (prevents path traversal) and verifies post-write file existence.

  3. **validate_markdown_file()** — Comprehensive validation: checks UTF-8 encoding without BOM via binary inspection,
     verifies Unix LF line endings (rejects CRLF), validates H1 heading presence and position, counts sentences
     (2-3 required), checks trailing newline.

  4. **commit_markdown_file()** — Stages file with git add and commits with provided conventional message.
     Uses GitCommitTool from sheep.tools with integrated error handling and Langfuse logging.

  5. **push_markdown_file()** — Pushes changes to remote origin with set_upstream=True for automatic branch tracking.
     Uses GitPushTool with integrated observability.

  No new feature modules, source code modifications, or configuration changes are required. The implementation is
  a straightforward sequential orchestration of these five existing functions.

  ## Key Design Decisions

  All key technical decisions were finalized in the Requirements and Research phases. This planning phase executes those decisions:

  ### Decision 1: Content Generation with Claude API
  **Chosen:** Use sheep.content_generators.generate_markdown_content()

  **Why:** Battle-tested across 166+ prior features. Encapsulates Claude API integration via CrewAI, includes structured
  prompt template for consistent output format (H1 heading + 2-3 sentences), and built-in response validation. Custom
  implementation would duplicate code and break established pattern.

  ### Decision 2: File I/O with UTF-8 and LF Line Endings
  **Chosen:** Use sheep.content_generators.write_markdown_file()

  **Why:** Centralizes encoding logic. Explicitly sets UTF-8 without BOM (critical for Windows compatibility where
  Python's default encoding can vary), enforces LF line endings on all platforms, validates filename for path traversal
  prevention, verifies post-write file creation. Alternative (direct open() calls) loses centralized validation and breaks
  pattern consistency.

  ### Decision 3: Comprehensive Validation Strategy
  **Chosen:** Use sheep.content_generators.validate_markdown_file()

  **Why:** Prevents subtle cross-platform bugs that only manifest on Windows or with certain editors. Performs binary
  inspection to verify encoding and line endings (not just text-level checks). Validates markdown structure (H1 heading,
  2-3 sentences, trailing newline) per CommonMark spec. Alternative (basic validation) insufficient to catch encoding
  issues that break cross-platform consistency.

  ### Decision 4: Git Workflow Integration
  **Chosen:** Use GitCommitTool and GitPushTool via helper functions commit_markdown_file() and push_markdown_file()

  **Why:** Already integrated with error handling, Langfuse observability logging, and repository path management.
  Alternative (direct GitPython) requires manual Repo state management and loses logging integration. Alternative
  (subprocess to git CLI) error-prone without safety checks, especially on Windows.

  ### Decision 5: LLM Provider via CrewAI Factory
  **Chosen:** Use Claude API via CrewAI's get_reasoning_llm() from sheep.config.llm

  **Why:** Pre-configured factory function ensures consistent LLM configuration across platform. CrewAI's message
  formatting ensures compatibility with orchestration layer. Centralizes API key management through Settings.
  Alternative (direct Anthropic SDK) breaks platform orchestration patterns.

  ## Implementation Strategy

  **Phase 1 — Content and File Creation** (5-7 minutes):
  - Call generate_markdown_content() to produce markdown via Claude API (~2-3 seconds for LLM)
  - Call write_markdown_file() to persist with UTF-8/LF encoding (~<10ms disk I/O)
  - Call validate_markdown_file() to verify properties match specification (~<10ms for validation)

  This phase completes all file-level work: content generation, disk persistence, and validation.

  **Phase 2 — Git Integration** (3-5 minutes):
  - Call commit_markdown_file() to stage file and create conventional commit (~<100ms git add + commit)
  - Call push_markdown_file() to push to remote origin (~<2 seconds for network push)

  This phase completes version control integration: tracking, committing, and publishing changes.

  **Separation of Concerns:** Phases are logically separated (file creation vs. version control) to match the natural
  flow of development: first ensure the artifact is correct, then publish it.

  **No Parallelization:** Tasks within each phase have strict ordering dependencies:
  - Content must be generated before being written to disk
  - File must be validated before committing (ensures quality gates)
  - File must be committed before pushing (git invariant)

  **No New Code:** All implementation is orchestration of existing, proven helpers. No new modules, classes, or functions
  required. This approach minimizes risk and leverages 166+ iterations of validation and refinement.

  ## Risk Mitigation

  | Risk | Impact | Mitigation Strategy |
  | ---- | ------ | ------------------- |
  | Platform-specific encoding on Windows | HIGH | write_markdown_file() explicitly sets UTF-8 encoding; validate_markdown_file() performs binary inspection for encoding/line-ending verification |
  | LLM API call failure or timeout | MEDIUM | generate_markdown_content() includes retry logic; any failure logged with full context via Langfuse observability |
  | Invalid markdown structure from LLM | LOW | _validate_markdown_content() enforces H1 + 2-3 sentences format; validation catches and rejects malformed output |
  | Git commit/push failure | LOW | GitCommitTool/GitPushTool have integrated error handling; repository state validated before operations |
  | File already exists in repo | LOW | write_markdown_file() intentionally overwrites existing files (expected behavior per established pattern from 166+ prior features) |
  | Upstream branch not configured | LOW | push_markdown_file() uses set_upstream=True to automatically configure tracking on first push |

  ## Files to Create and Modify

  **Files to Create:** None — implementation purely orchestrates existing helpers, no new modules required.

  **Files to Modify:** None — no source code, tests, or configuration changes needed.

  **Artifact Created:** test-m6t9bm.md in repository root (output file, not source code).
