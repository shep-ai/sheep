content: |
  ## Summary

  This task breakdown covers implementation of feature 255 across three phases totaling 7 concrete tasks and approximately 3h 50min effort.

  **Phase 1: Foundation (task-1)** establishes the module structure with imports and configuration, taking 30 minutes.

  **Phase 2: Core Implementation (tasks 2-6)** implements the main orchestration function orchestrating five sequential steps:
  - Step 1: Content generation via Claude API (task-3)
  - Step 2-3: File writing and validation (task-4)
  - Step 4-5: Git commit and push (task-5)
  - Return value construction (task-6)

  The function skeleton is created first (task-2), then each step is implemented with logging and error handling. Total for phase 2: 3h.

  **Phase 3: Testing (task-7)** writes comprehensive integration tests that verify the complete end-to-end flow: file creation, encoding compliance, content validation, git operations, and return value structure. This takes 1h.

  Each task follows TDD discipline with RED (test writing), GREEN (minimal implementation), and REFACTOR (cleanup) phases. Tasks have clear dependencies enforcing sequential implementation.

  The implementation reuses existing high-level wrapper functions from `content_generators.py`, keeping the feature module lean (~30-40 lines) and avoiding code duplication across 255 features. Error handling follows fail-fast strategy with clear logging for operator debugging.
