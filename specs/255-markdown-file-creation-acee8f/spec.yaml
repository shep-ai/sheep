content: |
  ## Problem Statement

  Create a single markdown file called test-zbl9x9.md with a clear H1 title and 2-3 sentences of prose content about any topic. The file must follow the established pattern used across 254 prior similar features, ensuring consistent encoding (UTF-8 without BOM), line endings (Unix LF), and file structure.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform built on CrewAI that automates software development tasks. The key directories are:

  - `/src/sheep/` - Main Python package containing core functionality
  - `/src/sheep/features/` - Individual feature implementations (254 prior markdown creation features)
  - `/src/create_markdown.py` - Comprehensive utilities for markdown generation, validation, and Git operations (47KB of reusable code)
  - `/src/sheep/content_generators.py` - High-level content generation and file writing wrappers
  - `/specs/` - YAML-based feature specifications (this file and others)

  **Repository root files**: The target file (test-zbl9x9.md) will be created here, joining 254 other test-*.md files already committed.

  ### Architecture Patterns

  The codebase follows a **modular, reusable pattern** for markdown file creation:

  1. **Content Generation**: Claude API via `get_reasoning_llm()` generates prose that matches a strict prompt template
  2. **File I/O**: Markdown written to disk with explicit UTF-8 encoding and Unix LF line endings via pathlib.Path.write_text()
  3. **Validation**: Three-level validation
     - Content validation: H1 heading, 2-3 sentences, 100-300 character prose
     - Encoding validation: UTF-8 without BOM, Unix LF line endings
     - Structure validation: File size checks (250-600 bytes typical)
  4. **Git Integration**: Using subprocess to execute `git add`, `git commit`, and `git push` commands with proper error handling
  5. **Feature Module Pattern**: Each feature (e.g., feature_227_markdown_file_creation.py) orchestrates the workflow in a standardized way

  Conventions observed:
  - Feature modules named `feature_NNN_markdown_file_creation.py` with module-level metadata
  - Commit messages following conventional format: `feat(NNN): create markdown file TEST-XXX.md with prose content`
  - Logging via `get_logger(__name__)` for observability
  - Return dictionaries with consistent key names (filepath, content, commit_message, push_result)

  ### Relevant Technologies

  - **Python 3.10+**: Type hints, pathlib, subprocess
  - **CrewAI**: Agentic framework for orchestrating LLM-based tasks
  - **Anthropic Claude API**: Content generation via `get_reasoning_llm()` with configurable models
  - **Git**: Version control operations (add, commit, push)
  - **Langfuse** (optional): Observability and execution tracing

  The project uses environment variable-based configuration for LLM selection and Git operations.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Creates single file test-zbl9x9.md alongside 254 existing test-*.md files |
  | /src/sheep/features/ | Low | Would add feature_255_markdown_file_creation.py following established pattern |
  | /src/create_markdown.py | None | Existing utilities are reused, no modifications needed |
  | /src/sheep/content_generators.py | None | Existing utilities are reused, no modifications needed |
  | Git repository | Low | Creates one commit and push operation to feature branch |

  ## Dependencies

  This feature depends on:

  - **Existing utilities in `/src/create_markdown.py`**:
    - `generate_markdown_content()` - Generates H1 heading + prose via Claude
    - `validate_content()` - Validates generated content format
    - `create_markdown_file()` - Writes file with proper encoding/line endings
    - `validate_markdown_file()` - Comprehensive file validation
    - `stage_and_commit_file()` - Git staging and commit operations

  - **Existing utilities in `/src/sheep/content_generators.py`**:
    - `generate_markdown_content()` - Higher-level wrapper for content generation
    - `write_markdown_file()` - File writing wrapper
    - `commit_markdown_file()` - Commit wrapper
    - `push_markdown_file()` - Push wrapper

  - **External dependencies**:
    - Anthropic Claude API (already configured via environment)
    - Git executable (already in use across repo)
    - Python pathlib (standard library)

  ## Size Estimate

  **S** (hours) — This is a straightforward, low-complexity feature with established patterns:

  - Content generation logic is fully implemented and tested across 254 prior features
  - File creation and validation utilities are mature and reusable
  - Feature module structure is standardized (copy-paste-customize pattern)
  - Git integration is already proven and stable
  - No architectural changes or new functionality required
  - Implementation involves: (1) creating feature_255_markdown_file_creation.py (~50 lines following feature_227 pattern), (2) calling existing utility functions in sequence, (3) adding one test markdown file
  - Total implementation effort: <2 hours for an experienced developer

  ## Success Criteria

  - [ ] File test-zbl9x9.md is created in repository root
  - [ ] File contains valid H1 markdown heading (format: `# Title`)
  - [ ] File contains exactly 2-3 sentences of coherent prose (100-300 characters)
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] File is staged, committed with conventional message format, and pushed to remote
  - [ ] Commit message follows: `feat(255): create markdown file test-zbl9x9.md with prose content`
  - [ ] All existing validation functions pass (content, encoding, structure)
  - [ ] Feature branch remains clean with single commit

