content: |
  ## Problem Statement

  Create a single markdown file called test-zbl9x9.md in the repository root with a clear H1 title and 2-3 sentences of prose content on any topic. The file must follow established patterns from 254 prior similar features, including UTF-8 encoding without BOM, Unix LF line endings, and proper Git integration (stage, commit with conventional message, push to feature branch).

  ## Functional Requirements

  - **FR-1**: Create markdown file named `test-zbl9x9.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (format: `# <Title>`)
  - **FR-3**: File must contain 2-3 sentences of coherent prose content
  - **FR-4**: Content must be semantically meaningful and grammatically correct
  - **FR-5**: Stage file using `git add test-zbl9x9.md`
  - **FR-6**: Commit file with conventional commit message: `feat(255): create markdown file test-zbl9x9.md with prose content`
  - **FR-7**: Push committed file to remote feature branch (feat/255-markdown-file-creation-acee8f)
  - **FR-8**: Return structured result containing filepath, content, commit message, and push status

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: Line endings must be Unix LF (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: File size must be between 250-600 bytes (typical range from 254 prior features)
  - **NFR-4**: Prose content length must be 100-300 characters (before H1 heading)
  - **NFR-5**: Implementation must reuse existing utility functions from `/src/create_markdown.py` or `/src/sheep/content_generators.py` — no new utility functions required
  - **NFR-6**: Feature module must follow naming convention: `feature_255_markdown_file_creation.py`
  - **NFR-7**: Feature module must be located in `/src/sheep/features/`
  - **NFR-8**: Implementation must include logging via `get_logger(__name__)` for observability
  - **NFR-9**: All validation checks must pass: content structure, encoding format, file size, and Git operations
  - **NFR-10**: Implementation should not require any external dependencies beyond those already in use (CrewAI, Claude API, pathlib, subprocess)
  - **NFR-11**: Feature branch must remain clean with exactly one commit after completion

  ## Success Criteria

  - [ ] File `test-zbl9x9.md` is created in repository root (alongside existing test-*.md files)
  - [ ] File contains valid H1 markdown heading matching pattern `# <Title>`
  - [ ] File contains exactly 2-3 sentences of coherent prose (100-300 characters)
  - [ ] File uses UTF-8 encoding without BOM
  - [ ] File uses Unix LF line endings (verified via validation function)
  - [ ] File size is between 250-600 bytes (typical range)
  - [ ] File is staged using `git add`
  - [ ] File is committed with message: `feat(255): create markdown file test-zbl9x9.md with prose content`
  - [ ] Commit is pushed to remote branch `feat/255-markdown-file-creation-acee8f`
  - [ ] All validation functions pass (content validation, encoding validation, structure validation)
  - [ ] Feature branch contains exactly one new commit (no orphaned changes)
  - [ ] Feature module follows `feature_255_markdown_file_creation.py` naming and structure

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should prose content be free-form or domain-constrained? | Free-form any topic | Maximizes generation flexibility and aligns with 254 prior features showing diverse topics |
  | 2 | Should implementation fail fast or retry on validation errors? | Fail fast on any validation error | Keeps implementation simple, provides clear debugging, respects operator control — matches established patterns |
  | 3 | Which utility layer (low-level vs high-level)? | Use content_generators.py wrappers | Keeps feature module lean (~30 lines), abstracts encoding/validation, aligns with recent implementations |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Creates single file `test-zbl9x9.md` alongside 254 existing test-*.md files |
  | `/src/sheep/features/` | Low | Adds `feature_255_markdown_file_creation.py` following established pattern |
  | `/src/create_markdown.py` | None | Existing utilities are reused, no modifications needed |
  | `/src/sheep/content_generators.py` | None | Existing utilities are reused, no modifications needed |
  | Git repository | Low | Creates one commit and push operation to feature branch |

  ## Dependencies

  This feature depends on:

  - **Existing utilities in `/src/create_markdown.py`**:
    - `generate_markdown_content()` — Generates H1 heading + prose via Claude
    - `validate_content()` — Validates generated content format (H1, sentences, char count)
    - `create_markdown_file()` — Writes file with proper encoding/line endings
    - `validate_markdown_file()` — Comprehensive file validation (size, encoding, structure)
    - `stage_and_commit_file()` — Git staging and commit operations

  - **Existing utilities in `/src/sheep/content_generators.py`**:
    - `generate_markdown_content()` — Higher-level wrapper for content generation
    - `write_markdown_file()` — File writing wrapper
    - `commit_markdown_file()` — Commit wrapper
    - `push_markdown_file()` — Push wrapper

  - **External dependencies**:
    - Anthropic Claude API (already configured via environment)
    - Git executable (already in use across repo)
    - Python 3.10+ standard library (pathlib, subprocess)
    - CrewAI framework (already integrated)

  ## Size Estimate

  **S** (Small — <2 hours) — This is a straightforward, low-complexity feature:

  - Content generation logic is fully implemented and tested across 254 prior features
  - File creation and validation utilities are mature and reusable
  - Feature module structure is standardized (copy-paste-customize pattern)
  - Git integration is already proven and stable
  - No architectural changes or new functionality required
  - Implementation: (1) Create `feature_255_markdown_file_creation.py` (~30-40 lines using wrappers), (2) Call existing utility functions in sequence, (3) Single markdown file created
  - Estimated implementation effort: <2 hours for experienced developer, <3 hours for new team member

  ---

