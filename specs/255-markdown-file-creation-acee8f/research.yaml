content: |
  ## Technology Decisions

  ### 1. Content Generation via CrewAI LLM Framework

  **Chosen:** Use `get_reasoning_llm()` from `sheep.config.llm` via `content_generators.py` wrapper

  **Architecture:**
  - CrewAI LLM abstraction layer (`from crewai import LLM`)
  - Configured with Anthropic Claude API backend
  - Temperature = 0.2 (low) for deterministic, reproducible prose generation
  - Prompt template ensures consistent H1 + 2-3 sentence format
  - Returns content as string, fully compatible with file writing pipeline

  **Rejected:**
  - Direct Anthropic SDK calls — adds dependency, bypasses CrewAI abstraction, repeats integration code
  - Hard-coded model strings — should use configuration system (`get_settings()`)
  - High temperature values — reduces content quality consistency

  **Rationale:** CrewAI is the primary AI framework in the codebase. The LLM configuration
  system provides model flexibility (Claude, GPT, Gemini) and temperature control. `get_reasoning_llm()`
  is already optimized for complex reasoning tasks with temperature=0.2. The `content_generators.py`
  wrapper uses this appropriately. No feature module changes needed — the wrapper handles all LLM interaction.

  ### 2. High-Level Wrapper Pattern Over Low-Level Orchestration

  **Chosen:** Use functions from `content_generators.py` for orchestration

  **Available functions:**
  - `generate_markdown_content()` — LLM + validation
  - `write_markdown_file(content, filename)` — File I/O with encoding guarantees
  - `validate_markdown_file(filepath)` — Comprehensive validation
  - `commit_markdown_file(filepath, content, repo_path, custom_message)` — Git staging + commit
  - `push_markdown_file(repo_path)` — Git push to remote

  **Comparison of approaches:**

  | Aspect | High-Level Wrapper | Low-Level Direct |
  | ------ | ------------------- | ------------------- |
  | Feature code size | ~30-40 lines | ~70-100 lines |
  | Code duplication | None (centralized) | Duplication across features |
  | Error handling | Centralized in wrappers | Duplicated per feature |
  | Testing surface | Tested via wrapper tests | Must test per feature |
  | Maintenance | Single point of change | Must update 255 features if validation changes |
  | Pattern observed | Features 200+ (modern) | Features 100-203 (legacy) |

  **Rationale:** Specification NFR-5 explicitly requires reusing existing utilities without creating
  new ones. The wrappers are production-tested across 200+ features. Feature 227 demonstrates
  this pattern yields clean implementations. High-level wrappers encapsulate all complexity:
  LLM interaction, encoding guarantees, validation logic, Git operations. Feature module focus
  is orchestration and coordination, not re-implementation.

  ### 3. Fail-Fast Error Strategy

  **Chosen:** Propagate exceptions immediately on validation failure, no retries

  **Validation points:**
  1. Content generation — validates format in `generate_markdown_content()`
  2. File writing — verifies creation in `write_markdown_file()`
  3. File validation — comprehensive checks in `validate_markdown_file()`
  4. Git operations — errors from `GitCommitTool`, `GitPushTool`

  **Error handling:**
  - ValueError on content validation failure
  - OSError/IOError on file operations
  - subprocess.CalledProcessError on Git failures
  - All exceptions propagate with logging via `_logger.error()`

  **Rejected:**
  - Automatic retry logic (exponential backoff) — adds complexity, masks real issues, ~50 LOC
  - Silent fallbacks — violates transparency principle, harder to debug

  **Rationale:** Specification requirement #2 explicitly selects fail-fast as the error strategy.
  When validation fails, operators receive immediate, clear error messages for debugging.
  CrewAI's LLM layer already handles API-level retries automatically. Content generation failures
  are rare (temperature=0.2 promotes consistency). Operator can manually retry with confidence.
  Fail-fast approach keeps implementation clean and respects operator control over error recovery.

  ### 4. Structured Logging Integration

  **Chosen:** Use `get_logger(__name__)` from `sheep.observability.logging`

  **Logging usage pattern:**

  ```python
  from sheep.observability.logging import get_logger

  _logger = get_logger(__name__)
  _logger.info(\"Creating markdown file\")
  _logger.debug(f\"Generated {len(content)} bytes\")
  _logger.error(f\"Validation failed: {e}\")
  ```

  **Log levels:**
  - `info()` — Major workflow steps (content generation, file creation, validation, commit, push)
  - `debug()` — Detailed operation data (file size, content preview, git commands)
  - `error()` — Exceptions with context

  **Infrastructure:**
  - structlog framework for structured logging
  - Rich console output with colors
  - Context preservation across async operations
  - Log level filtering per settings

  **Rationale:** Specification NFR-8 requires logging for observability. The structlog system
  is already integrated system-wide with Rich output. Feature modules use `get_logger(__name__)`
  and call standard logging methods. The logging infrastructure handles formatting, timestamps,
  and filtering automatically. This approach provides visibility without complexity.

  ### 5. File Encoding and Line Ending Guarantees

  **Chosen:** Use `write_markdown_file()` wrapper which enforces encoding/line ending standards

  **Encoding standards:**
  - UTF-8 without BOM (Byte Order Mark)
  - Unix LF line endings (`\n`), not CRLF (`\r\n`)
  - Trailing newline at end of file

  **Validation in validation function:**

  ```python
  # Binary checks for BOM and CRLF
  if binary_content.startswith(b\"\\xef\\xbb\\xbf\"):  # UTF-8 BOM check
      raise ValueError(\"File has UTF-8 BOM\")
  if b\"\\r\\n\" in binary_content:  # CRLF check
      raise ValueError(\"File uses CRLF line endings\")
  ```

  **Rationale:** Specification NFR-1 and NFR-2 require UTF-8 without BOM and Unix LF line endings.
  Python's file writing on Unix systems automatically produces LF line endings. The wrapper
  functions handle this consistently. Validation checks verify at the binary level that encoding
  and line endings are correct. This centralized approach ensures consistency across 255 features.

  ### 6. Git Integration via CrewAI Tools

  **Chosen:** Use `GitCommitTool` and `GitPushTool` via `content_generators.py` wrappers

  **Tool abstractions:**
  - `GitCommitTool._run(repo_path, message, add_all=True)` — Stage all changes + commit
  - `GitPushTool._run(repo_path, remote=\"origin\", set_upstream=True)` — Push with upstream tracking

  **Advantages:**
  - Transparent authentication handling (via environment)
  - Structured error reporting
  - Logging integration via CrewAI framework
  - Consistent with other tool usage in codebase

  **Rationale:** CrewAI tools provide a consistent abstraction for external operations.
  These tools are already integrated with the logging and error handling infrastructure.
  Using tools instead of direct subprocess calls reduces feature code responsibility and
  enables centralized improvements. The `content_generators.py` wrappers handle all tool coordination.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | CrewAI | LLM framework, tools | **Use** | Already integrated system-wide, provides LLM abstraction and tool orchestration |
  | Anthropic Claude API | Content generation | **Use** (via CrewAI) | Primary AI backend, temperature=0.2 ensures deterministic content |
  | pathlib | File system operations | **Use** | Standard library, safer than os.path, used throughout codebase |
  | subprocess | Git command execution | **Use** (via CrewAI tools) | Standard library, wrapped by CrewAI GitTools for consistent error handling |
  | structlog | Structured logging | **Use** | Already integrated, provides Rich console output and context preservation |
  | json/yaml | Configuration | **Not needed for feature** | Handled by existing config system |
  | pytest | Testing | **Use for validation** | Standard test framework in project, validates feature implementation |
  | GitPython | Git abstraction | **Reject** | Not in current stack, unnecessary since CrewAI tools handle Git |
  | dacite | YAML to dataclass | **Use if needed** | Already available for configuration deserialization |

  ## Security Considerations

  ### Input Validation
  - **Filename validation:** `write_markdown_file()` checks for path traversal (`/`, `\\`, `.` prefixes)
  - **Content validation:** `validate_markdown_file()` confirms structure (H1, blank line, 2-3 sentences)
  - **Encoding safety:** Binary-level validation ensures UTF-8 without BOM

  ### Environment/API Security
  - **API keys:** Managed by config system, never logged or exposed
  - **CrewAI framework:** Handles authentication transparently via environment variables
  - **Git credentials:** Handled by system git configuration, not exposed in feature code

  ### File System Security
  - **Path isolation:** Operations confined to repository root (current directory)
  - **File permissions:** Created files inherit repository permissions (no explicit chmod needed)
  - **No executable content:** Markdown file is data-only, no code execution risk

  ### Git Operations Security
  - **Branch isolation:** Pushes to feature branch only, not main
  - **Commit signing:** Currently unsigned (could be added via GitCommitTool config)
  - **No force pushes:** Standard push operation, cannot overwrite history

  **Risk assessment:** LOW — Feature operates in controlled environment with centralized
  validation and error handling. No novel security concerns beyond standard file I/O.

  ## Performance Implications

  ### Content Generation
  - **LLM latency:** 1-3 seconds (typical Claude API response time)
  - **Temperature setting:** 0.2 promotes faster convergence on deterministic output
  - **No retries:** Fail-fast removes retry loop overhead
  - **Expected P95 latency:** <5 seconds for full operation

  ### File Operations
  - **File I/O:** Negligible (<10ms for ~500 byte file)
  - **Validation:** Binary-level checks are fast (<1ms)
  - **Encoding conversion:** UTF-8 validation overhead is minimal

  ### Git Operations
  - **git add:** <100ms for single file
  - **git commit:** ~500ms (includes object creation, refs update)
  - **git push:** 1-3 seconds (network latency, server-side refs update)
  - **Total git time:** ~2-4 seconds

  ### Overall Performance Profile
  - **Critical path:** LLM request (1-3s) + git push (2-4s)
  - **Total expected time:** 3-7 seconds per feature
  - **Parallelization:** Limited to single-threaded execution (Git's design)
  - **Bottleneck:** Network latency to Claude API and git remote server

  **Conclusion:** Performance is acceptable. Feature latency is dominated by I/O (API,
  network) rather than computation. No optimization recommended unless system-wide
  throughput becomes bottleneck.

  ## Architecture Integration

  ### Feature Module Location
  - **Path:** `/src/sheep/features/feature_255_markdown_file_creation.py`
  - **Imports:** `content_generators`, `logging`, `pathlib`
  - **Module structure:**
    - Feature metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME)
    - Main orchestration function (`create_feature_255_markdown_file()`)
    - Optional CLI entry point (`if __name__ == \"__main__\"`)

  ### Dataflow Architecture

  ```
  [Feature 255 module]
    ↓
  [content_generators.generate_markdown_content()]  → Claude API → LLM
    ↓
  [content_generators.write_markdown_file()]  → File I/O → Repository root
    ↓
  [content_generators.validate_markdown_file()]  → Validation checks
    ↓
  [content_generators.commit_markdown_file()]  → GitCommitTool → Git index
    ↓
  [content_generators.push_markdown_file()]  → GitPushTool → Remote repository
    ↓
  [Return result dict]  → Caller (feature system, CLI, agent)
  ```

  ### Integration Points
  - **LLM system:** Via `get_reasoning_llm()` in content_generators
  - **File system:** Via pathlib (standard library)
  - **Git system:** Via CrewAI GitTools abstraction
  - **Logging:** Via structlog integration
  - **Configuration:** Via sheep.config.settings and sheep.config.llm

  ### Feature Dependencies
  - **Direct:** content_generators, logging, pathlib
  - **Transitive:** CrewAI, structlog, Anthropic SDK (via CrewAI)
  - **External:** Git binary (system-level), Claude API (network)

  ## Specification Alignment

  | Requirement | Implementation | Status |
  | ----------- | -------------- | ------ |
  | FR-1: Create test-zbl9x9.md | `write_markdown_file(content, filename)` | ✓ |
  | FR-2: H1 heading | `generate_markdown_content()` produces \"# Title\" | ✓ |
  | FR-3: 2-3 sentences | Validated in `_validate_markdown_content()` | ✓ |
  | FR-4: Meaningful prose | Claude API with reasoning LLM | ✓ |
  | FR-5: git add | `commit_markdown_file()` with add_all=True | ✓ |
  | FR-6: Conventional message | `commit_message = f\"feat(255): create markdown file {filename}\"` | ✓ |
  | FR-7: Push to feature branch | `push_markdown_file()` with origin/HEAD tracking | ✓ |
  | FR-8: Return structured result | Feature returns dict with filepath, content, message, push_result | ✓ |
  | NFR-1: UTF-8 no BOM | Binary validation in `validate_markdown_file()` | ✓ |
  | NFR-2: Unix LF | Binary validation for `\r\n` absence | ✓ |
  | NFR-3: 250-600 bytes | `validate_file_size()` in content_generators | ✓ |
  | NFR-4: 100-300 char prose | Validated in `_validate_markdown_content()` | ✓ |
  | NFR-5: Reuse utilities | Uses content_generators, no new utilities | ✓ |
  | NFR-6: Module naming | `feature_255_markdown_file_creation.py` | ✓ |
  | NFR-7: Features directory | `/src/sheep/features/` | ✓ |
  | NFR-8: Logging | `get_logger(__name__)` at module level | ✓ |
  | NFR-9: Validation | All validation functions called via wrappers | ✓ |
  | NFR-10: No new deps | Uses CrewAI, Claude, Git, pathlib, structlog (all existing) | ✓ |
  | NFR-11: Single commit | One commit via `commit_markdown_file()` | ✓ |

  ## Implementation Readiness

  ### Code Pattern (Feature 227 as Template)
  Feature 227 demonstrates the recommended implementation pattern:
  - Metadata constants (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Main orchestration function (40 lines)
  - 5 sequential steps: generate → write → validate → commit → push
  - Comprehensive logging at each step
  - Return result dict with all relevant data
  - Optional __main__ for CLI execution

  ### No Technical Blockers
  All dependencies are satisfied by existing system configuration. No libraries need to be added,
  no new tools need to be created, no architectural changes needed. Feature 255 can be implemented
  with high confidence using established patterns proven across 200+ features.

