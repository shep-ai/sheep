decisions:
  - title: "Content Generation Approach"
    chosen: "Use existing `generate_markdown_content()` wrapper from `content_generators.py`"
    rejected:
      - "Implement content generation inline in feature module — leads to duplication across 255 features, inconsistent validation, harder to maintain. Violates DRY principle established across codebase."
      - "Use low-level functions from `create_markdown.py` directly — requires more orchestration code, ~70 lines vs. ~30 lines with wrappers. Wrappers abstract encoding/validation consistently."
    rationale: >
      The `content_generators.py` module provides a battle-tested, high-level `generate_markdown_content()`
      function that encapsulates all Claude API interaction, validation, and error handling.
      Feature 227 (most recent predecessor) uses this pattern with excellent results (~40 lines total).
      This approach: (1) reduces code duplication across 255 features, (2) centralizes validation logic,
      (3) ensures consistent behavior, (4) allows feature module to focus on orchestration.
      Mature pattern observed in features 200+.

  - title: "Error Handling Strategy"
    chosen: "Fail fast on first validation error, no automatic retries"
    rejected:
      - "Implement automatic retry logic with exponential backoff — adds ~50 lines of code, masks underlying issues that operators should debug, increases latency. Only justified if LLM API is unreliable (it is not)."
      - "Implement custom recovery mechanisms per error type — complex state management, difficult to debug, violates single responsibility principle."
    rationale: >
      Fail-fast approach aligns with established pattern across all 254 prior features.
      When validation fails, the operator gets immediate, clear error messages for debugging.
      CrewAI LLM framework already handles API-level retries and exponential backoff automatically.
      Content generation failures from `get_reasoning_llm()` are rare (temperature=0.2 promotes
      deterministic output). Operator can manually retry the feature with confidence. Keeps
      implementation clean (~30 lines) and respects operator control per spec requirement #2.

  - title: "Utility Layer Selection"
    chosen: "Use high-level wrappers from `content_generators.py` (recommended in spec)"
    rejected:
      - "Direct low-level functions from `create_markdown.py` — requires manual orchestration of generate → write → validate → commit → push, ~70 lines. Older feature 203 demonstrates this approach causes code bloat."
      - "New utilities in this feature — violates spec requirement NFR-5 which explicitly forbids creating new utility functions. Utilities are already mature and tested."
    rationale: >
      Specification requirement NFR-5 mandates reusing existing utilities, not creating new ones.
      High-level wrappers already handle all complexity: content generation with Claude API,
      file writing with proper encoding (UTF-8, no BOM), Unix LF line ending enforcement,
      comprehensive validation (structure, encoding, file size), Git operations (stage, commit, push).
      These wrappers emerged from 200+ features of iteration and are production-tested.
      Feature 227 demonstrates this pattern yields clean, maintainable 30-40 line feature modules.

  - title: "Git Integration Approach"
    chosen: "Use `GitCommitTool` and `GitPushTool` abstractions via `content_generators.py` wrappers"
    rejected:
      - "Direct subprocess calls to `git` — requires manual error handling, harder to test, no logging integration. Feature 203 demonstrates maintenance burden."
      - "GitPython library — not in current tech stack, adds external dependency, unnecessary when wrappers already handle Git via CrewAI tools."
    rationale: >
      The `content_generators.py` module provides `commit_markdown_file()` and `push_markdown_file()`
      functions that wrap CrewAI's `GitCommitTool` and `GitPushTool`. These tools: (1) handle
      authentication transparently, (2) integrate with structured logging system, (3) manage
      error states consistently, (4) support repo path configuration. This abstraction reduces
      feature module responsibility and centralizes Git operation logic. No new dependencies required.

  - title: "Logging and Observability"
    chosen: "Use structured logging via `get_logger(__name__)` from `sheep.observability.logging`"
    rejected:
      - "Print statements — no observability, not searchable, no log level control, fails in non-interactive environments."
      - "Python built-in `logging` module — structlog is already integrated system-wide with Rich console output and context preservation."
    rationale: >
      Specification requirement NFR-8 mandates logging via `get_logger(__name__)` for observability.
      The system uses structlog for structured, contextual logging. Feature modules simply:
      `_logger = get_logger(__name__)` and call `_logger.info()`, `_logger.debug()`, etc.
      Structlog automatically handles formatting, timestamp injection, context, and log level filtering.
      This approach provides visibility into feature execution without adding complexity to feature code.
      Pattern demonstrated in feature_227.

  - title: "Validation Strategy"
    chosen: "Reuse comprehensive validation functions from `content_generators.py`"
    rejected:
      - "Implement custom validation per feature — duplicates code across 255 features, inconsistent validation rules, hard to maintain centrally. Violates DRY principle."
      - "Skip validation step entirely — violates NFR-9 which explicitly requires validation. Spec requires file size, encoding, structure, and content validation."
    rationale: >
      The `content_generators.py` module provides `validate_markdown_file(filepath)` which performs
      comprehensive multi-step validation: (1) file exists, (2) markdown structure (H1, blank line),
      (3) sentence count (2-3), (4) UTF-8 encoding without BOM, (5) Unix LF line endings, (6) file size
      (250-600 bytes). This function has been stress-tested across 200+ features. Validation is
      orchestrated in the high-level wrapper, so feature module need not handle it explicitly.
      Fail-fast approach means if validation fails, exception propagates with clear error message.

