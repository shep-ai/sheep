content: |
  ## Implementation Flow

  Feature 252 implementation flows through four ordered tasks across two sequential phases:

  **Phase 1: Markdown File Creation** — Task 1 creates the file
  - Task 1 creates test-us0h0e.md with markdown structure (H1 heading + 2-3 sentences)
  - Implementer chooses free-form topic, writes prose, validates structure
  - File is created using pathlib with UTF-8 encoding and Unix LF line endings
  - Task 1 must complete before Phase 2 can begin

  **Phase 2: Git Integration** — Tasks 2-4 perform sequential git operations
  - Task 2 stages the file in git (git add)
  - Task 3 commits with conventional message (git commit)
  - Task 4 pushes to remote (git push)
  - Each task depends on the previous one; operations must be performed in order

  No parallel work is possible; all tasks are strictly sequential. Total estimated effort is 10-15 minutes,
  consistent with the feature size estimate and the 204+ identical implementations across features 069-251.

  Each task follows TDD cycle: RED (write assertion that currently fails), GREEN (implement minimal code
  to pass assertion), REFACTOR (clean up, verify details, validate acceptance criteria).

  For file creation (task-1), assertions verify file existence and content structure. For git operations
  (tasks 2-4), assertions verify git state (staging, commit, remote). Implementer validation during task-1
  ensures prose readability and markdown validity; subsequent tasks verify mechanical git operations.
