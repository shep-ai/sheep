  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-28
  - **Status:** Complete

  ## Feature Summary

  Feature 252 is a minimal test file creation task: create a single markdown file (`test-us0h0e.md`)
  with a title (H1 heading) and 2-3 sentences of prose content. This is one of 204+ identical test
  files in the repository (features 069-251), following an established, well-tested pattern.

  The feature requires:
  - File creation with exact filename at repository root
  - Markdown structure: H1 heading on line 1, blank line, 2-3 sentences
  - UTF-8 encoding without BOM
  - Unix LF line endings
  - Git staging, commit with conventional message, push to feature branch
  - No source code modifications or new dependencies

  ## Technology Decisions

  ### 1. File I/O Implementation: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path('test-us0h0e.md').write_text(content, encoding='utf-8')`

  **Rejected:**
  - `open()` with manual file handling — verbose, requires explicit encoding and flush calls, not idiomatic for Python 3.11+
  - `os.path` + `os.open()` — low-level API, outdated approach, requires manual buffer management
  - External libraries (shutil, etc.) — unnecessary overhead, pathlib is the standard

  **Rationale:** pathlib is the modern Python standard (since 3.4) and is explicitly required by NFR-5.
  `Path.write_text()` is a one-liner that handles encoding, file creation, and proper closure atomically.
  UTF-8 is the default encoding, and pathlib produces UTF-8 without BOM (the default Python behavior).
  This approach is consistent with all 204+ existing test files in the repository and aligns with
  Python 3.11+ best practices.

  ### 2. Git Integration: subprocess.run() with individual commands

  **Chosen:** Three separate `subprocess.run()` calls:
  1. `git add test-us0h0e.md`
  2. `git commit -m "feat(252): create markdown file test-us0h0e.md with prose content"`
  3. `git push -u origin HEAD`

  **Rejected:**
  - GitPython library — violates NFR-9 (no external dependencies); unnecessary abstraction for simple commands
  - Direct shell execution (`shell=True`) — security risk (command injection); not Pythonic
  - Git plumbing commands — overly complex; porcelain commands are clearer

  **Rationale:** subprocess is standard library, safe when `shell=False` (the default), and appropriate
  for running external tools. Individual git commands are self-documenting and match the feature spec's
  exact commit message requirement. The approach avoids external dependencies while maintaining clarity,
  testability, and security. This pattern scales from single-file operations (this feature) to batch
  operations across 204+ precedents.

  ### 3. Markdown Validation: Manual implementer review

  **Chosen:** Implementer validates structure during creation (no automated validation)

  **Rejected:**
  - Automated markdown linting (markdownlint, pylint-markdown, etc.) — violates NFR-9; overkill for test content
  - Regex-based structure validation — brittle, difficult to maintain, misses semantic issues
  - No validation — violates established precedent and FR-5 (prose readability requirement)

  **Rationale:** The feature spec explicitly resolves this in the product questions (answer: "Implementer
  manual validation"). This is the standard across all 204+ precedents. Manual review is appropriate because:
  (1) this is test content, not production code, (2) implementer has sufficient context to ensure basic
  markdown validity and prose readability, (3) avoids external dependencies, (4) catches semantic issues
  automated tools miss. The implementer verifies: H1 heading present, 2-3 sentences, proper spacing,
  UTF-8 encoding without BOM, and LF line endings.

  ### 4. Encoding and Line Ending Enforcement

  **Chosen:** Rely on pathlib.Path.write_text() defaults; use Python string literals for line endings

  **Rejected:**
  - Manual byte-level encoding — unnecessary, error-prone, duplicates pathlib's native behavior
  - Post-creation encoding validation — adds complexity without benefit
  - Platform-specific line endings (os.linesep) — violates NFR-2 (Unix LF only)

  **Rationale:** pathlib.Path.write_text(content, encoding='utf-8') automatically produces UTF-8 without
  BOM (Python's default). Python string literals ('\\n') produce Unix LF on all platforms when written
  via UTF-8 encoding. No post-processing is needed. This satisfies NFR-1 and NFR-2 with zero additional
  code. The 204+ existing test files demonstrate this approach is reliable and requires no special handling.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | pathlib (stdlib) | File I/O | Use | Required by NFR-5; modern standard; handles encoding cleanly |
  | subprocess (stdlib) | Git commands | Use | Standard library; safe with shell=False; no external dependencies |
  | GitPython | Git abstraction | Reject | External dependency; violates NFR-9; unnecessary for simple operations |
  | markdown (PyPI) | Markdown parsing | Reject | External dependency; violates NFR-9; not needed for validation |
  | markdownlint (external) | Markdown linting | Reject | External tool; violates NFR-9; overkill for test content |

  ## Security Considerations

  **File Creation:**
  - pathlib.Path.write_text() atomically creates the file with secure defaults (mode 0o644 on Unix)
  - No command injection risk; file path is literal string, not user input
  - UTF-8 encoding ensures no encoding attacks (e.g., UTF-7 exploits)

  **Git Integration:**
  - subprocess.run() with shell=False prevents command injection
  - Commit message is literal string from the feature spec; no user input interpolation
  - No shell escaping needed; git commands are passed as array to subprocess

  **Content Validation:**
  - Manual implementer review is sufficient for test content
  - No parsing of untrusted input; content is generated by implementer
  - Markdown structure is simple enough that readability review catches all issues

  **No Security Improvements Needed:**
  This is a small, isolated feature with no user input, network I/O, or system interaction beyond
  file creation and git commands. The default security posture of pathlib and subprocess is sufficient.

  ## Performance Implications

  **Negligible impact:**
  - File creation: single disk write (~400-600 bytes), microseconds
  - Git operations: standard file staging, commit, push; no optimization needed for single file
  - No caching, batching, or optimization required at this scale

  **Scalability Notes:**
  - The approach scales linearly from single-file operations (this feature) to batch operations
  - 204+ existing test files created with identical pattern confirm no performance bottlenecks
  - If batch file creation is needed in future, subprocess.run() can be called in a loop or
    subprocess.Popen() can be used for parallel git operations

  **Resource Usage:**
  - Memory: minimal (single string in memory)
  - Disk: ~400-600 bytes per file
  - CPU: negligible (file write + git commands)

  ## Architecture Notes

  **Codebase Integration:**
  - This feature is purely file creation; no integration with source code in `/src/sheep/`
  - Follows established pattern from features 069-251 (204+ identical implementations)
  - No modifications to existing files, configurations, or directory structure
  - Feature is self-contained: create file, stage, commit, push

  **Design Pattern:**
  The 204+ identical test files across features 069-251 establish a clear, proven pattern:
  ```
  # Heading

  Sentence 1. Sentence 2. Sentence 3.
  ```

  This feature reproduces that pattern exactly. No architectural decisions needed; implementation
  is mechanical application of proven approach.

  **No Dependencies on Other Features:**
  - Feature is independent of other implementation details
  - Works on any feature branch with git configured
  - No integration tests, documentation, or configuration changes required

  **Future Extensibility:**
  - If automated test file generation is needed, this approach supports it (loop over file configs)
  - If batch file operations are required, subprocess can be optimized with Popen()
  - If validation automation becomes necessary, structured markdown parsing (ast-based) is viable

  ## Implementation Approach

  Based on research, the implementation will:

  1. **Create markdown file:**
     ```python
     from pathlib import Path
     content = "# <Heading>\\n\\n<Sentence 1>. <Sentence 2>. <Sentence 3>."
     Path('test-us0h0e.md').write_text(content, encoding='utf-8')
     ```

  2. **Stage in git:**
     ```python
     subprocess.run(['git', 'add', 'test-us0h0e.md'], check=True)
     ```

  3. **Commit with message:**
     ```python
     subprocess.run([
         'git', 'commit',
         '-m', 'feat(252): create markdown file test-us0h0e.md with prose content'
     ], check=True)
     ```

  4. **Push to origin:**
     ```python
     subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)
     ```

  5. **Validate implementer:**
     - Review markdown syntax (H1 + 2-3 sentences)
     - Verify UTF-8 encoding (no BOM)
     - Verify LF line endings (not CRLF)
     - Confirm file size ~400-600 bytes

