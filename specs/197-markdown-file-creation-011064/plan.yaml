content: |
  ## Architecture Overview

  This feature implements a single, isolated module following the well-established pattern
  from 197+ test file creations in the Sheep platform. The implementation is purely additive:
  create one new feature file with no modifications to existing code.

  **Module:** `src/sheep/features/feature_197_markdown_file_creation.py`
  - Provides `main()` orchestration function
  - Called by Sheep workflow engine
  - Self-contained with no external dependencies beyond Python 3.11+ stdlib
  - Matches directory structure and patterns from features 150-196

  **Integration Point:** Feature execution follows the pattern:
  1. Sheep workflow engine calls `feature_197_markdown_file_creation.main()`
  2. Module returns exit code 0 (success) or 1 (error)
  3. No modifications needed to platform core

  ## Key Design Decisions

  ### 1. Hardcoded Prose Content (vs. API Generation)

  **Decision:** Use hardcoded meaningful prose with thematically related title.

  **Why:** Feature 196 (direct precedent) demonstrates this approach produces professional,
  coherent output. All 196+ existing test files use hardcoded prose, establishing a quality
  baseline. This eliminates external API calls, network dependencies, and rate limiting.
  The prose is written at implementation time to be meaningful and intentional, not templated.

  **Trade-off:** Less flexibility than dynamic generation, but zero latency, fully deterministic,
  and proven successful across the entire codebase.

  ### 2. pathlib.Path.write_text() with Explicit Parameters

  **Decision:** Use `Path(filename).write_text(content, encoding="utf-8", newline="\n")`
  for all file creation.

  **Why:** This is the standard pattern across the codebase (feature 196). The explicit
  parameters ensure UTF-8 encoding and Unix LF line endings on all platforms (Windows/Mac/Linux).
  pathlib is cross-platform, part of Python 3.11+ standard library, and cleaner than
  built-in open(). Satisfies NFR-2 (no external dependencies).

  **Trade-off:** None significant. This is the established pattern with no viable alternatives
  in the standard library that are simpler or more portable.

  ### 3. Comprehensive Validation Before Git

  **Decision:** Implement five validation checks before ANY git operations.

  **Why:** Spec requirement (openQuestion resolved: comprehensive validation). Validation
  catches all common errors (encoding, line endings, structure, size) before they enter
  the repository. Validation is fast (~2-5ms) and provides clear error diagnostics.
  Prevents repository pollution if file creation fails.

  **Validation Functions:**
  - `validate_encoding()` - UTF-8 without BOM
  - `validate_line_endings()` - Unix LF only (no CRLF or CR)
  - `validate_structure()` - H1 heading + 2-3 sentences
  - `validate_file_size()` - 300-600 bytes
  - `check_file_does_not_exist()` - Prevent overwrites (pre-creation check)

  **Trade-off:** Adds ~5-10ms to execution time, but catches errors early and prevents
  rework. Worth the minimal overhead for quality assurance.

  ### 4. subprocess for Git Operations (vs. GitPython)

  **Decision:** Use `subprocess.run(["git", ...], check=True, capture_output=True)`
  for add/commit/push operations.

  **Why:** Feature 196 uses subprocess exclusively. For simple linear workflow
  (add → commit → push), subprocess is simpler, more transparent, and easier to debug
  than GitPython abstraction. Direct git commands are easy to understand and verify.
  subprocess is standard library (no additional dependencies).

  **Trade-off:** GitPython (already in dependencies) could provide more abstraction,
  but adds complexity for straightforward operations. Subprocess is the right tool
  for this linear workflow.

  ### 5. Simple Period Counting for Sentence Validation

  **Decision:** Count periods in prose: `text.count(".")` determines sentence count.

  **Why:** Feature 196 pattern. For well-formed markdown prose with clear sentence
  boundaries (one period per sentence), period counting is reliable and sufficient.
  No need for NLP complexity (NLTK, spacy) or fragile regex patterns.

  **Trade-off:** Assumes prose is well-formed. This is safe because prose is hardcoded
  at implementation time and can be carefully written to have exactly 2-3 periods.

  ## Implementation Strategy

  **Phase 1: Module Setup & File Creation** (~3 minutes)
  - Create feature module with pathlib and subprocess imports
  - Define FILENAME, TITLE, and PROSE constants (hardcoded, meaningful, related)
  - Implement check_file_does_not_exist() (pre-creation safety check)
  - Implement create_file() using pathlib.Path.write_text()
  - Wire into main() orchestration function

  **Phase 2: Comprehensive Validation** (~4 minutes)
  - Implement validate_encoding() - check UTF-8 without BOM
  - Implement validate_line_endings() - reject CRLF and CR
  - Implement validate_structure() - verify H1 + period counting
  - Implement validate_file_size() - check 300-600 bytes range
  - Implement validate_all() coordinator function
  - Wire validation into main() - validate before git operations

  **Phase 3: Git Integration & Error Handling** (~4 minutes)
  - Implement git_add(), git_commit(), git_push() using subprocess
  - Implement comprehensive try-except with specific exception types
  - Add exit code handling (0 for success, 1 for any error)
  - Implement main() orchestration: create → validate → git → return code
  - Verify error messages are descriptive

  **Total Estimated Execution Time:** 10-15 minutes (size estimate: S)

  ## Risk Mitigation

  | Risk | Impact | Mitigation |
  | ---- | ------ | ---------- |
  | File already exists in repo | File not created, workflow fails | Pre-creation check raises FileExistsError before file operations. Prevents overwriting existing files. |
  | Encoding or line ending errors | File created but fails validation, git commit fails | Comprehensive validation before git operations. Catches and reports encoding/line ending issues early. |
  | Incorrect sentence count in prose | File fails validation, workflow aborts | Prose is hardcoded at implementation time. Developer can verify exact sentence count before commit. |
  | Git operations fail (network, permissions) | File exists but not committed, partial state | subprocess.run(..., check=True) raises CalledProcessError on non-zero exit. Early failure before partial commits. |
  | BOM accidentally included | File has BOM, breaks downstream tools | validate_encoding() explicitly checks for and rejects UTF-8 BOM using binary prefix matching. |
  | CRLF line endings on Windows | File has wrong line endings, breaks in CI/CD | pathlib.Path.write_text(..., newline="\n") forces LF on all platforms. validate_line_endings() confirms no CRLF/CR. |
  | Unhandled exceptions crash silently | Silent failure, no error diagnostics | Comprehensive try-except with specific exception types. All exceptions caught and exit code 1 returned. stderr output for diagnostics. |

  ## Success Criteria

  Implementation is complete when:
  1. Module file `src/sheep/features/feature_197_markdown_file_creation.py` exists
  2. Running `python -m src.sheep.features.feature_197_markdown_file_creation` creates file
  3. File `test-d7cznn.md` exists in repository root
  4. File has correct structure: H1 heading + blank line + 2-3 sentences + final newline
  5. File is UTF-8 encoded without BOM
  6. File has Unix LF line endings only (no CRLF or CR)
  7. File size is 300-600 bytes
  8. File is staged with `git add test-d7cznn.md`
  9. Commit message is: `feat(197): Create markdown file test-d7cznn.md with title and prose content`
  10. Commit is pushed to feature branch on origin
  11. Exit code is 0 on success, 1 on any error
  12. All 196+ existing test files remain unmodified
  13. No source code, config, or other files are modified

  ---

  _Plan complete — ready for implementation phase_
