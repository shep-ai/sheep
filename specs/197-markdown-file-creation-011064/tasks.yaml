content: |
  ## Implementation Flow

  The 8 tasks are organized across 3 phases following the TDD pattern (RED-GREEN-REFACTOR):

  **Phase 1: Module Setup & File Creation (2 tasks, ~35 min)**
  - Task 1: Create module structure with imports and prose constants
  - Task 2: Implement file creation with correct encoding/line endings

  After Phase 1, the module can create a markdown file with correct technical properties
  (UTF-8, LF endings). File is not yet validated or committed.

  **Phase 2: Comprehensive Validation (3 tasks, ~40 min)**
  - Task 3: Implement encoding and line ending validation
  - Task 4: Implement structure and size validation
  - Task 5: Integrate validation orchestration

  After Phase 2, the module validates all aspects before git operations. Validation catches
  encoding errors, wrong line endings, incorrect structure, and file size issues early,
  preventing repository pollution.

  **Phase 3: Git Integration & Error Handling (3 tasks, ~45 min)**
  - Task 6: Implement git operations (add, commit, push)
  - Task 7: Implement comprehensive error handling and orchestration
  - Task 8: End-to-end integration testing

  After Phase 3, the complete workflow is functional: file creation → validation → git
  operations → return appropriate exit code. Error handling prevents partial states and
  provides diagnostic information.

  ## TDD Cycle Pattern

  Each task follows the TDD pattern:

  **RED Phase:** Write test(s) that define the desired behavior. Tests initially fail
  because functionality doesn't exist yet.

  **GREEN Phase:** Implement minimal code to make tests pass. Focus on functionality,
  not optimization.

  **REFACTOR Phase:** Improve code quality, extract helpers, improve naming, add
  comments. Ensure tests still pass.

  ## Task Dependencies

  - Task 1: No dependencies (foundation)
  - Task 2: Depends on Task 1 (needs constants defined)
  - Task 3: Depends on Task 2 (needs file to validate)
  - Task 4: Depends on Task 2 (needs file to validate)
  - Task 5: Depends on Tasks 3, 4 (needs all validations)
  - Task 6: Depends on Task 5 (git only after validation passes)
  - Task 7: Depends on Task 6 (error handling for complete workflow)
  - Task 8: Depends on Task 7 (integration testing of complete system)

  ## Testing Approach

  Each task includes unit tests (TDD cycle RED phase). Final task includes end-to-end
  integration tests. Tests verify:
  - File creation with correct properties
  - Validation catches specific error types
  - Git operations execute in correct order
  - Error handling returns appropriate exit codes
  - Complete workflow succeeds and fails correctly

  ## Success Metric

  All 8 tasks completed when:
  1. All unit tests pass (TDD cycles complete)
  2. Integration tests pass (complete workflow verified)
  3. Feature file test-d7cznn.md exists in repository root
  4. Commit pushed to feat/197-markdown-file-creation-011064 branch
  5. Exit code 0 on success, 1 on any error
  6. All success criteria from spec met

  ---

  _Task breakdown complete — ready for implementation_
