content: |
  ## Summary

  This feature is implemented across 3 focused tasks spanning 1 hour 15 minutes of development time:

  **Task 1: Foundation (15 min)** — Create the feature module skeleton with constants and imports.
  This establishes the structure that the remaining tasks build upon.

  **Task 2: Core Implementation (30 min)** — Implement the orchestration logic that sequences all 5
  workflow steps: generate → write → validate → commit → push. This is where the actual work happens.
  Each step calls an existing content_generators utility with proper error handling and logging.

  **Task 3: Integration Testing (30 min)** — Write end-to-end tests that verify the complete workflow.
  Tests validate that the file is created correctly, has proper encoding/line endings, contains
  valid markdown with 2-3 sentences, is committed with conventional message, and is pushed to the
  feature branch.

  The implementation follows the established orchestration pattern from 270+ prior features, using
  zero new technologies and requiring zero architectural changes. All core functionality is provided
  by existing, battle-tested utilities in content_generators.py. The feature module adds value
  through sequencing, error handling, and logging—keeping the implementation simple and focused.

  ## Task Workflow

  1. **Task 1** must complete first to establish the module structure
  2. **Task 2** depends on Task 1 and implements the complete orchestration logic
  3. **Task 3** depends on Task 2 and validates the implementation

  Each task follows TDD methodology: RED (write failing test), GREEN (implement minimal code to
  pass), REFACTOR (improve code quality). This ensures all requirements are met and functionality
  is verified.

  ## Testing Approach

  **Unit Testing (Task 2):** Orchestration logic uses mocks to verify content_generators functions
  are called correctly in sequence. Mocks isolate the feature logic from actual file I/O and git
  operations.

  **Integration Testing (Task 3):** Full end-to-end test that actually executes the feature, creates
  the file, and verifies all outputs. This validates that the orchestration works with real utilities.

  **Isolation:** Tests clean up after themselves and don't depend on prior test runs. Each test is
  reproducible and can run in any order.

  ## Success Criteria Verification

  All success criteria from the feature specification will be verified:

  - ✓ File test-6poz5r.md is created at repository root (Task 1: module structure, Task 2: orchestration, Task 3: verified)
  - ✓ File contains exactly one H1 heading (Task 2: calls generate_markdown_content(), Task 3: validates)
  - ✓ File contains 2-3 sentences (Task 2: validate_markdown_file() checks, Task 3: test asserts)
  - ✓ UTF-8 encoding without BOM (Task 2: write_markdown_file() handles, Task 3: test verifies)
  - ✓ Unix LF line endings (Task 2: write_markdown_file() handles, Task 3: test verifies binary content)
  - ✓ Valid CommonMark markdown (Task 2: validate_markdown_file() checks, Task 3: test parses)
  - ✓ File staged in git (Task 2: commit_markdown_file() stages, Task 3: verifies git status)
  - ✓ Committed with conventional message (Task 2: message format verified, Task 3: git log verified)
  - ✓ Pushed to feature branch (Task 2: push_markdown_file() executes, Task 3: verified)

  All non-functional requirements are met through orchestration of proven utilities:
  - Content generation completes within 60s (Claude API baseline)
  - File I/O is atomic and reliable (pathlib.Path guarantees)
  - Git operations follow conventions (GitCommitTool/GitPushTool enforce)
  - Implementation reuses existing utilities (no code duplication)
  - Code follows project patterns (feature_*.py orchestration pattern)
  - No manual intervention required (fully automated)
  - Error handling provides clear messages (logging at each step)
  - Operations are idempotent where appropriate (can be re-run if needed)
