content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established and well-proven pattern. Feature 272 creates a single test markdown file (`test-wvkqjb.md`) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This feature is part of a continuous test suite pattern where 271+ identical test files (`test-*.md`) have been created across prior features. The feature serves as a minimal, testable unit of work that validates file creation capabilities and version control integration within the Sheep automation platform. Each test file demonstrates end-to-end automation: content generation, file I/O, git staging, conventional commits, and remote push operations.

  ## Success Criteria

  **File Creation & Content:**
  - [ ] File `test-wvkqjb.md` is created at repository root
  - [ ] File contains exactly one H1 markdown heading (format: `# Title`)
  - [ ] File contains 2-3 complete sentences of prose content immediately following the heading
  - [ ] Prose content uses neutral and informative tone (clear, objective, professional language)
  - [ ] Prose topic is random or generic (not project/technical-specific)
  - [ ] Markdown syntax is valid per CommonMark specification
  - [ ] No extra blank lines, formatting errors, or syntax violations present

  **File Format & Encoding:**
  - [ ] File uses UTF-8 encoding without BOM (byte order mark)
  - [ ] File uses Unix LF line endings (`\n`), not Windows CRLF (`\r\n`)
  - [ ] File size is between 150-800 bytes (proportional to ~300-600 bytes of prose)

  **Git Operations:**
  - [ ] File is staged in git (git index contains `test-wvkqjb.md`)
  - [ ] Commit message follows conventional format: `feat(272): create markdown file test-wvkqjb.md with title and prose content`
  - [ ] Commit is created on feature branch `feat/272-markdown-file-creation-e18c7f`
  - [ ] Changes are pushed to remote origin (visible in GitHub/remote repository)
  - [ ] Only `test-wvkqjb.md` is modified—no other files are staged or committed
  - [ ] Git log shows the feature commit with correct author and timestamp

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-wvkqjb.md` at the repository root (working directory root, not a subdirectory)
  - **FR-2**: Include exactly one H1 markdown heading as the first line of the file (format: `# <title text>`)
  - **FR-3**: Include 2-3 complete sentences of prose content immediately following the heading, separated by a blank line
  - **FR-4**: Generate prose content using Claude API via CrewAI framework (LLM-based generation)
  - **FR-5**: Select prose topic randomly or generically (topics should not be project/technical-specific)
  - **FR-6**: Use neutral and informative tone for prose (clear, objective, professional language)
  - **FR-7**: Stage the file in git using `git add test-wvkqjb.md`
  - **FR-8**: Create a commit with conventional commit message: `feat(272): create markdown file test-wvkqjb.md with title and prose content`
  - **FR-9**: Push commits to the remote repository on the feature branch (`feat/272-markdown-file-creation-e18c7f`)
  - **FR-10**: Verify no other files are modified, staged, or committed alongside `test-wvkqjb.md`

  ## Non-Functional Requirements

  **Format & Encoding:**
  - **NFR-1**: Markdown must comply with CommonMark specification (see https://spec.commonmark.org/)
  - **NFR-2**: File must use UTF-8 encoding without BOM for cross-platform compatibility
  - **NFR-3**: File must use Unix LF line endings (`\n`) for git normalization and cross-platform consistency

  **Performance & Execution:**
  - **NFR-4**: Feature should complete in under 30 seconds end-to-end (including API calls, file I/O, and git operations)
  - **NFR-5**: Content generation via Claude API should timeout after 10 seconds; fail gracefully if API is unavailable

  **Reliability & Pattern Consistency:**
  - **NFR-6**: Implementation must follow established pattern from 271+ prior identical features (test-*.md creation pattern)
  - **NFR-7**: Implementation must use existing utility functions from `src/sheep/content_generators.py` (DRY principle)
  - **NFR-8**: Implementation must integrate with CrewAI framework for orchestration (agentic pattern)

  **Observability & Logging:**
  - **NFR-9**: Feature must emit structured logs using `src/sheep/observability/logging.py` (debug-level for each step: content generation, file write, git operations)
  - **NFR-10**: Feature must report success/failure status clearly (success = file pushed, failure = explicit error message)

  **Code Quality & Maintainability:**
  - **NFR-11**: Implementation must follow PEP 8 Python style guide (enforce with ruff)
  - **NFR-12**: Implementation must pass type checking with mypy (static type safety)
  - **NFR-13**: Implementation must use type hints on all functions and parameters

  **Dependency & Environment:**
  - **NFR-14**: Feature requires `ANTHROPIC_API_KEY` environment variable set for Claude API access
  - **NFR-15**: Feature requires Python 3.11+ runtime (per pyproject.toml specification)
  - **NFR-16**: Feature requires CrewAI 0.86.0+, GitPython 3.1.0+, and Pydantic 2.0+ dependencies available

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  |---|----------|-------------------|-----------|
  | 1 | Should prose content use a random/generic topic or a specific technical topic? | **Random or generic topic** | Maximizes diversity across the test file suite (271+ files). No domain strategy required. Aligns with precedent from prior features. Demonstrates flexibility of content generation. |
  | 2 | Should prose be LLM-generated (Claude API) or hardcoded? | **LLM-generated via Claude API** | Demonstrates core platform value (agentic automation with Claude). Required for CrewAI integration showcase. Established pattern from 271+ prior features. Produces unique, varied content. |
  | 3 | What tone/style should the prose use? | **Neutral and informative** | Prioritizes clarity and objective validation over stylistic variation. Universally applicable across any topic. Easiest to verify for correctness. Maintains consistency without domain bias. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  |------|--------|-----------|
  | `/test-wvkqjb.md` (new file) | High | Primary artifact created by this feature; new file at repository root with markdown content |
  | `src/create_markdown.py` | Medium | Entry point module may be invoked or referenced for implementation (existing utility module) |
  | `src/sheep/content_generators.py` | Medium | Provides reusable functions for markdown generation, validation, file I/O, and git operations |
  | `src/sheep/config/llm.py` | Low | LLM configuration needed for Claude API integration if using LLM-based content generation |
  | `src/sheep/observability/logging.py` | Low | Structured logging integration for feature execution and debugging |
  | Git working tree | High | File staging, commit, and push operations modify git state on the feature branch |
  | Repository root | High | File is created directly in root directory (alongside existing 271+ test-*.md files) |
  | specs/272-markdown-file-creation-e18c7f/spec.yaml | High | This specification file documents the complete requirements |

  ## Dependencies

  **External Dependencies:**
  - **CrewAI Framework (0.86.0+)**: Required for agentic workflow orchestration and task management
  - **Anthropic Claude API**: Used for content generation; requires valid API key in `ANTHROPIC_API_KEY` environment variable
  - **GitPython (3.1.0+)**: Required for git operations (staging, committing, pushing)
  - **Python (3.11+)**: Minimum runtime requirement per pyproject.toml
  - **Pydantic (2.0+)**: Data validation and settings management required by CrewAI

  **Internal Dependencies:**
  - **`src/sheep/content_generators.py`**: Provides utility functions for markdown generation, validation, and git operations
  - **`src/sheep/config/llm.py`**: Provides LLM configuration factory (`get_reasoning_llm()`) for Claude API setup
  - **`src/sheep/observability/logging.py`**: Provides structured logging via `get_logger()` for execution tracing
  - **`src/sheep/agents/`**: CrewAI agent definitions for task execution (if using agentic pattern)
  - **`src/sheep/flows/`**: Flow definitions for orchestration logic (if using flow-based pattern)

  **Pattern Dependencies:**
  - Follows established pattern from 271+ prior markdown file creation features (test-*.md suite)
  - Git workflow requires feature branch `feat/272-markdown-file-creation-e18c7f` to be active and tracked
  - Environment variables: `ANTHROPIC_API_KEY` must be set and valid before execution
  - Repository must have git initialized with remote origin configured (for push operation)

  ## Size Estimate

  **S (hours)** — This is a minimal task:

  - **Content Generation** (~3-5 min): Generate prose via Claude API using CrewAI or manually compose 2-3 sentences
  - **File Creation** (~1-2 min): Write markdown file with heading and prose using pathlib
  - **Git Operations** (~2 min): Stage, commit with conventional message, and push to remote
  - **Validation** (~1 min): Verify markdown syntax, encoding (UTF-8), and line endings (LF)
  - **Total**: ~10-15 minutes of actual implementation work

  This estimate is based on 271 prior identical implementations demonstrating consistent, minimal scope. The task is straightforward file creation with no complex logic, architecture changes, or cross-module dependencies beyond existing utility functions.

  ---

  _Requirements phase — ready for implementation planning and team review_
