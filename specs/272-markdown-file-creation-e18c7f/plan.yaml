content: |
  ## Architecture Overview

  Feature 272 follows the well-established pattern used across 267+ prior markdown file creation
  features in the Sheep automation platform. The implementation is deliberately minimal and
  straightforward: a feature module that orchestrates existing, production-tested utilities.

  ### Module Structure

  The feature module (`src/sheep/features/feature_272_markdown_file_creation.py`) will:
  1. Import utilities from `content_generators.py` (content generation, file I/O, validation)
  2. Import logging utilities from `observability/logging.py`
  3. Define feature metadata constants: FEATURE_NUMBER=272, FEATURE_NAME, MARKDOWN_FILENAME
  4. Implement the main orchestration function `create_feature_272_markdown_file(repo_path)`
  5. Provide an `if __name__ == "__main__"` block for direct CLI execution

  ### Integration with Existing Utilities

  The implementation leverages these existing, proven utilities from `src/sheep/content_generators.py`:
  - **`generate_markdown_content()`**: Generates markdown with H1 heading and 2-3 sentences via Claude API
  - **`write_markdown_file(filename, content)`**: Writes file with UTF-8 encoding and LF line endings
  - **`validate_markdown_file(filepath)`**: Validates format against all spec requirements
  - **`commit_markdown_file(filepath, custom_message)`**: Stages and commits with custom message
  - **`push_markdown_file()`**: Pushes to remote origin

  LLM configuration is handled by existing `get_reasoning_llm()` from `src/sheep/config/llm.py`,
  which is already integrated into `generate_markdown_content()`.

  ## Key Design Decisions

  ### 1. Reuse Existing Orchestration Utilities (vs. Custom Implementation)
  **Decision**: Call individual utilities from `content_generators.py` in sequence, using the
  `custom_message` parameter of `commit_markdown_file()` to set the feature 272 commit message.

  **Rationale**:
  - The research findings show that `create_markdown_file()` is a complete orchestration function
    used by all prior features, but it has a hardcoded feature number (145) in the commit message
  - Rather than modifying that function or duplicating logic, the feature module orchestrates
    the individual steps: generate → write → validate → commit (with custom message) → push
  - This approach maintains separation of concerns: the generic utilities remain unchanged,
    and the feature-specific logic (commit message) lives in the feature module
  - All 267+ prior features use this orchestration pattern; consistency is critical

  ### 2. Feature Module Pattern (vs. CLI Command or Standalone Script)
  **Decision**: Create feature-specific module at `src/sheep/features/feature_272_markdown_file_creation.py`
  following the established convention from all prior features.

  **Rationale**:
  - All 267+ prior features use this module structure: `src/sheep/features/feature_NNN_markdown_file_creation.py`
  - The pattern is discoverable, maintainable, and allows both programmatic import and direct execution
  - Feature modules are self-contained and don't require CLI integration or registry changes
  - The `if __name__ == "__main__"` block allows: `python -m sheep.features.feature_272_markdown_file_creation`

  ### 3. Error Handling Strategy (Fail-Fast vs. Retry)
  **Decision**: Wrap orchestration steps in try-except to log failures and re-raise exceptions.
  No retry logic in the feature module; let the caller decide on retry strategy.

  **Rationale**:
  - Error handling is already comprehensive in existing utilities (validation errors, API timeouts, git errors)
  - The feature module should simply catch, log, and propagate—this keeps logic centralized
  - Retry logic belongs at a higher level (CLI runner, test harness), not in individual feature modules
  - All 267+ prior features follow this fail-fast pattern

  ### 4. Synchronous Implementation (vs. Async)
  **Decision**: Implement the orchestration function synchronously (blocking calls, no asyncio).

  **Rationale**:
  - Git operations are synchronous and can't be parallelized
  - File I/O and validation are fast (<100ms) and don't benefit from async
  - All 267+ prior features use synchronous implementations
  - Keeping the implementation simple is preferred over premature async optimization

  ### 5. Commit Message Format (Feature Number Control)
  **Decision**: Use the `custom_message` parameter of `commit_markdown_file()` to ensure the
  commit message includes the correct feature number: `feat(272): create markdown file test-wvkqjb.md with title and prose content`

  **Rationale**:
  - The spec (FR-8) explicitly requires this commit message format
  - The generic `create_markdown_file()` utility has a hardcoded feature 145, so we bypass it
  - By calling individual utilities, we gain control over the commit message while still reusing
    the validation, file writing, and git operation logic
  - This approach is more explicit and maintainable than modifying the generic orchestration function

  ## Implementation Strategy

  ### Phase 1: Module Creation & Setup
  Create the feature module with proper structure:
  - Metadata constants (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME)
  - Logger instance via `get_logger(__name__)`
  - Function signatures with type hints
  - Docstrings following codebase conventions

  ### Phase 2: Content Generation & File Operations
  Implement the core workflow:
  - Generate content via `generate_markdown_content()` (handles Claude API, topic selection, validation)
  - Write file via `write_markdown_file()` (handles UTF-8 encoding, LF line endings)
  - Validate file via `validate_markdown_file()` (checks format, size, structure)

  ### Phase 3: Git Integration & Orchestration
  Complete the workflow with git operations:
  - Stage and commit with custom message via `commit_markdown_file(filepath, custom_message)`
  - Push to remote via `push_markdown_file()`
  - Implement main `create_feature_272_markdown_file()` orchestration function
  - Add error handling and logging around each step

  ### Phase 4: Testing & Validation
  Write comprehensive tests:
  - Unit tests for each step (content generation, file creation, git operations)
  - Integration test verifying end-to-end execution
  - Validation tests for each success criterion from the spec
  - Parametrized tests to cover edge cases

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  |------|----------|-----------|
  | LLM API unavailable or timeout | Medium | `get_reasoning_llm()` handles timeouts (10s default per NFR-5). Log API errors explicitly, fail fast. |
  | Commit message has wrong feature number | High | Use explicit `custom_message` parameter rather than relying on default orchestration function. |
  | File already exists (overwrite risk) | Low | File overwrite is acceptable for test files. Utilities handle it safely. |
  | Git push fails (network) | Medium | Git errors from `push_markdown_file()` bubble up with descriptive messages. Caller can retry. |
  | ANTHROPIC_API_KEY not set | Medium | `get_reasoning_llm()` validates via Pydantic settings. Fails with clear error message. |
  | Disk full during file write | Low | `write_markdown_file()` raises OSError. Caller can handle. |

  ## Files to Create & Modify

  ### Create (2 files)
  1. **`src/sheep/features/feature_272_markdown_file_creation.py`** (main implementation, ~50-60 lines)
     - Feature metadata and imports
     - Orchestration function calling utilities in sequence
     - Error handling and logging
     - `if __name__ == "__main__"` block for CLI execution

  2. **`tests/features/test_feature_272_markdown_file_creation.py`** (test suite, ~200-250 lines)
     - Unit tests for each orchestration step
     - Integration test for end-to-end execution
     - Spec compliance validation tests
     - Fixtures for file cleanup and git state

  ### Modify (0 files)
  No existing files need modification. All necessary utilities already exist and are production-tested.

  ## Conclusion

  Feature 272 is a minimal, straightforward implementation using well-proven patterns and
  comprehensive existing utilities. The feature module is ~50-60 lines and requires no changes to
  any existing code. Following the established convention from 267+ prior features ensures
  consistency, discoverability, and maintainability. Implementation should complete in 30-45 minutes.
