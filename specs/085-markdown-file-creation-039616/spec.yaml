# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-fmr7ew.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 85+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 080-084, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-fmr7ew.md` exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (format: `# Title`)
  - [ ] File contains 2-3 sentences of prose content after the heading
  - [ ] Prose content is coherent and grammatically correct English
  - [ ] File is encoded in UTF-8 (without BOM)
  - [ ] File uses LF line endings only (Unix style, no CRLF)
  - [ ] File size is between 400-600 bytes (matches established pattern)
  - [ ] File content is valid CommonMark markdown (renders without syntax errors)
  - [ ] File is staged and committed in git with message format: `feat(085): ...`
  - [ ] Commit is pushed to feature branch `feat/085-markdown-file-creation-039616`
  - [ ] File is reachable from the feature branch HEAD (git log shows the commit)
  - [ ] No existing files are modified by this feature

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-fmr7ew.md` in the repository root directory
  - **FR-2**: File must contain a markdown H1 heading on the first line (format: `# <title>`)
  - **FR-3**: File must contain 2-3 sentences of original prose content following the heading
  - **FR-4**: File must be created using Python's `pathlib.Path` module (Python 3.11+ standard library)
  - **FR-5**: File must be staged in git using `git add`
  - **FR-6**: File must be committed to git with a conventional commit message: `feat(085): create markdown file test-fmr7ew.md with prose content`
  - **FR-7**: Commit must be pushed to the remote feature branch `feat/085-markdown-file-creation-039616`
  - **FR-8**: Implementation must not modify any existing files in the repository
  - **FR-9**: Implementation must not create subdirectories or additional files beyond the single markdown file

  ## Non-Functional Requirements

  - **NFR-1**: File must use UTF-8 character encoding (no BOM prefix)
  - **NFR-2**: File must use LF line endings exclusively (Unix/Linux style, not CRLF)
  - **NFR-3**: File size must be within 400-600 bytes range (consistent with 85+ existing test files)
  - **NFR-4**: Implementation must use only Python 3.11+ standard library (no external dependencies)
  - **NFR-5**: Markdown content must be valid CommonMark-compliant markdown
  - **NFR-6**: Git commit must follow conventional commit specification (`feat(NNN): <description>`)
  - **NFR-7**: Implementation must be completed without modifying source code in `/src/sheep/` or build/test infrastructure
  - **NFR-8**: No CI/CD pipelines, tests, or documentation should be required or modified
  - **NFR-9**: Feature follows the identical pattern established by features 080-084 for consistency and precedent adherence

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the markdown file topic be freely chosen or domain-restricted? | Free choice (any topic) | Aligns with features 080-084 precedent, eliminates decision overhead, maximizes velocity, appropriate for test file creation |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository consists of:
  - **Repository root**: Contains 85+ test markdown files (test-*.md) following a consistent pattern
  - **src/sheep/**: Application source code (agents, config, flows, tools, observability)
  - **specs/**: Feature specification directory with subdirectories for each feature number (e.g., specs/085-markdown-file-creation-039616/)
  - **tests/**: Test suite for the application
  - **pyproject.toml**: Python project configuration (dependencies, build, tools)
  - **README.md**: Project documentation for the CrewAI-based automation platform
  - **.github/workflows/**: CI/CD pipeline configurations

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature
  pattern and do not form part of the application source code. They serve as test cases for the
  automated implementation system.

  ### Architecture Patterns

  **Established File Creation Pattern** (85+ precedents):
  - Simple file creation using Python pathlib for I/O operations
  - Each markdown file follows: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes
  - Implementation follows straightforward imperative code (create content string, write to file)
  - No dependencies on application source code or external libraries

  **Git Workflow Pattern**:
  - Feature branch already created as `feat/085-markdown-file-creation-039616`
  - Create/modify files
  - Stage with git add
  - Commit with conventional commit format: `feat(085): create markdown file test-fmr7ew.md with prose content`
  - Push to feature branch
  - No modifications to source code or configuration files

  **Feature Implementation Pattern** (observed in features 080-084):
  - Minimal, isolated changes affecting only repository root
  - No dependencies on application source code (/src/sheep/)
  - No test modifications, no configuration changes
  - Single-file operations with straightforward I/O
  - Efficient execution: 10-15 minutes per feature

  ### Relevant Technologies

  - **Python 3.11+**: Project requires Python 3.11 or higher (from pyproject.toml)
  - **pathlib (Python standard library)**: Used for file I/O operations (example: Path("test-fmr7ew.md").write_text())
  - **Git**: Version control; file staging, commits, and branch operations
  - **Markdown syntax**: Simple CommonMark format with heading (#) and prose content

