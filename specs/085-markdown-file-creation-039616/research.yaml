decisions:
  - title: 'File Creation Method'
    chosen: 'pathlib.Path.write_text() with explicit newline and encoding parameters'
    rejected:
      - 'Direct file I/O using open() — verbose and requires manual resource management; pathlib is more idiomatic and handles edge cases better'
      - 'subprocess.run([''touch'', ''filename'']) — cannot write content directly; requires separate content-writing step; not cross-platform friendly'
      - 'pathlib.Path.write_bytes() with explicit UTF-8 bytes — requires manual byte encoding; less readable than write_text()'
    rationale: >
      pathlib.Path.write_text() is the standard idiomatic Python approach for simple file creation in Python 3.11+.
      It is part of the standard library (no external dependencies), handles encoding/decoding transparently,
      and provides atomic writes on most platforms. By specifying encoding='utf-8' and newline='\n',
      we ensure exactly the required behavior: UTF-8 without BOM and LF-only line endings.
      This matches the established pattern across all 80+ existing test files in the repository.

  - title: 'Content Generation Strategy'
    chosen: 'Simple string literal with H1 heading followed by 2-3 sentences of prose content'
    rejected:
      - 'Template-based generation (Jinja2, string.Template) — adds unnecessary complexity and external dependencies for simple, static content; violates the minimal-dependency requirement'
      - 'Content generation via LLM or random selection — introduces non-determinism and external service dependencies; violates the "no external dependencies" requirement and adds complexity'
      - 'Reading from a template file — requires additional file I/O and storage; inconsistent with the established pattern of inline content in 80+ existing test files'
    rationale: >
      This is a test file with no functional purpose beyond demonstrating file creation capability.
      Content is static, deterministic, and small (2-3 sentences). A simple string literal is the clearest,
      most efficient approach. The established pattern across features 080-084 and all 80+ existing test files
      uses this exact approach. No template system is needed. Content topics are freely chosen per feature 085 spec
      requirement (resolved open question).

  - title: 'Line Ending and Encoding Handling'
    chosen: 'Path.write_text(content, encoding=''utf-8'', newline=''\n'')'
    rejected:
      - 'Relying on default platform encoding — may vary by OS; Windows defaults to CRLF; violates the explicit LF-only requirement'
      - 'Post-processing with .replace(''\r\n'', ''\n'') — two-step process is error-prone and less efficient; encoding parameter is explicit and reliable'
      - 'Using os.linesep — platform-dependent; Windows uses CRLF, violating the Unix-style LF requirement'
    rationale: >
      The feature spec explicitly requires UTF-8 encoding without BOM and LF line endings (Unix style, not CRLF).
      pathlib.Path.write_text() with encoding='utf-8' and newline='\n' parameters guarantees this behavior across all platforms.
      The newline='\n' parameter tells Python to translate '\n' characters as-is (LF only) without platform-specific conversion.
      This is the most reliable, explicit approach. Analysis of 80+ existing test files confirms they all follow this pattern.

  - title: 'Git Integration Method'
    chosen: 'Use subprocess.run() with git CLI commands (git add, git commit, git push)'
    rejected:
      - 'GitPython library (gitpython>=3.1.0) — external dependency; repo already requires it for other uses, but subprocess is simpler for straightforward operations'
      - 'os.system(''git ...'') — dangerous and less portable; subprocess is more robust and secure'
      - 'Direct libgit2 bindings (pygit2) — overkill complexity for simple add/commit/push operations; external dependency'
    rationale: >
      subprocess.run() with git CLI is the simplest, most transparent approach for straightforward git operations.
      It requires no additional dependencies beyond the standard library. The feature requires only three operations:
      git add <filename>, git commit -m <message>, and git push. These are simple string operations.
      While the repo includes gitpython as a dependency, subprocess is more readable and has zero additional overhead
      for this minimal task. The git config (user.name, user.email) is already set up in the CI/CD environment.

  - title: 'File Size Constraint (400-600 bytes)'
    chosen: 'Generate exactly 2-3 sentences of prose content (typically 350-500 characters) + H1 heading (20-40 characters) = 400-600 bytes'
    rejected:
      - 'Generating variable-length content and validating afterward — adds complexity and error handling; unnecessarily complicated'
      - 'Using a fixed template with variable-length topics — difficult to predict final size reliably'
      - 'Ignoring the size constraint and checking afterward — no validation; violates spec requirement'
    rationale: >
      Analysis of 80+ existing test files shows they naturally fall into the 400-600 byte range when using
      this exact pattern: H1 heading (typically 20-40 chars) + single paragraph with 2-3 well-formed sentences (350-500 chars).
      The simple, straightforward approach (one heading + three sentences of prose) reliably produces files in this range.
      No explicit size validation or padding is needed. Verification of final file size is part of the implementation
      validation step (not research).

  - title: 'No External Dependencies Strategy'
    chosen: 'Restrict implementation to Python 3.11+ standard library only (pathlib, subprocess, os modules)'
    rejected:
      - 'Using GitPython library — external dependency violates NFR-4 (standard library only); unnecessary complexity'
      - 'Using Markdown validation library — external dependency; CommonMark is simple enough to validate manually'
      - 'Using string templating library (Jinja2, mako) — external dependency unnecessary for static content'
    rationale: >
      Feature spec NFR-4 explicitly states: "Implementation must use only Python 3.11+ standard library (no external dependencies)."
      The entire feature can be implemented with standard library modules:
      - pathlib.Path for file I/O
      - subprocess.run() for git operations
      - os.path for file system checks
      No external libraries are needed. This constraint is intentional for test file creation to minimize complexity and dependencies.

