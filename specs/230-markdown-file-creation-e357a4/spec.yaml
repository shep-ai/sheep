# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-hp1mtq.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 90+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory). This is a continuation of the markdown-file-creation pattern established
  in features 069-229, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-hp1mtq.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content following a blank line after the heading
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] Prose content follows the structure: `# Heading\n\n<2-3 sentences>`
  - [ ] File size naturally falls in the typical range of 400-600 bytes (consequence of proper structure)
  - [ ] File is staged in git using `git add test-hp1mtq.md`
  - [ ] Git commit with exact message exists: `feat(230): create markdown file test-hp1mtq.md with prose content`
  - [ ] Commit is created on the feature branch `feat/230-markdown-file-creation-e357a4`
  - [ ] Changes are pushed to remote origin repository

  ## Functional Requirements

  - **FR-1**: Create a markdown file with the exact filename `test-hp1mtq.md`
  - **FR-2**: File must be created in the repository root directory (no subdirectories)
  - **FR-3**: File must contain a markdown H1 heading (`#`) as the title on the first line
  - **FR-4**: File must contain exactly 2-3 sentences of prose content following a blank line after the heading
  - **FR-5**: Prose content must be readable and grammatically correct
  - **FR-6**: File must be staged using `git add test-hp1mtq.md`
  - **FR-7**: File must be committed with the exact message: `feat(230): create markdown file test-hp1mtq.md with prose content`
  - **FR-8**: Commit must be created on the current branch `feat/230-markdown-file-creation-e357a4`
  - **FR-9**: Changes must be pushed to the remote origin repository

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark)
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF
  - **NFR-3**: File size should typically be 400-600 bytes as a natural outcome of proper structure
  - **NFR-4**: Markdown syntax must be valid per CommonMark specification
  - **NFR-5**: Implementation must use Python `pathlib.Path` for file I/O operations
  - **NFR-6**: Implementation must follow the established pattern from 90+ existing test files in the repository
  - **NFR-7**: No modifications to source code in `/src/sheep/`, test files, or configuration files
  - **NFR-8**: Prose topic may be any topic chosen by the implementer (free-form)
  - **NFR-9**: Implementation must not introduce any new dependencies or external packages

  ## Codebase Analysis

  ### Project Structure

  The Sheep project follows a straightforward directory layout optimized for automated feature implementation:

  ```
  .
  ├── .github/              # GitHub Actions workflows and configuration
  ├── .claude/              # Claude Code configuration and agents
  ├── specs/                # Feature specifications (230+ spec directories)
  │   ├── 006-joke-markdown/
  │   ├── 007-joke-markdown-2/
  │   ├── ...
  │   └── 230-markdown-file-creation-e357a4/  # This feature's spec
  ├── test-*.md             # 90+ existing test markdown files (root level)
  ├── ABOUT_ME.md
  ├── DESIGN_PATTERN.md
  ├── SHEEP.md
  ├── README.md
  ├── Dockerfile
  └── .gitignore
  ```

  **Key observations**:
  - No `/src/` directory — project is purely file creation and git workflow
  - Specs directory contains 230+ feature specifications with standardized structure
  - Test files (`test-*.md`) are created at repository root, not in subdirectories
  - Each spec has a corresponding feature branch (e.g., `feat/230-markdown-file-creation-e357a4`)
  - Recent commits (features 224-229) all follow the identical pattern

  ### Architecture Patterns

  The project implements a **specification-driven implementation workflow**:

  1. **Feature Specification Phase**: Each feature is defined in `specs/<number>-<name>/spec.yaml`
  2. **Automated Implementation**: Agents implement features by reading the spec
  3. **Minimal Output**: Feature creates only the specified file (test-hp1mtq.md) — no source code changes
  4. **Git Integration**: Each implementation includes git staging, conventional commits, and push
  5. **Pattern-Based Consistency**: All 90+ test files follow identical markdown structure (H1 heading + 2-3 sentences)

  **Dependency flow**:
  - Feature spec (spec.yaml) → Implementation reads spec → Create test-hp1mtq.md → Git workflow → Push to branch
  - No cross-feature dependencies (each markdown file is independent)
  - No internal modules or packages — purely file system operations

  ### Relevant Technologies

  - **Markdown**: CommonMark-compliant markdown format for test files
  - **Git**: Version control, branching (`feat/230-markdown-file-creation-e357a4`), commits, and pushing
  - **Python 3.11+**: Runtime language for file I/O operations using `pathlib`
  - **File System**: Unix-style text file creation with UTF-8 encoding and LF line endings
  - **GitHub Actions**: Likely CI/CD integration (based on `.github/` directory presence)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-hp1mtq.md) to existing collection of 90+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 069-229; no branch/merge complexity, no destructive operations |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase; no impact on other specs or configurations |
  | Source Code | None | Feature is purely file creation; does not depend on or impact any source code, configurations, or application logic |

  ## Dependencies

  - **Git repository**: Feature branch `feat/230-markdown-file-creation-e357a4` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 90+ test files provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **File naming**: Filename test-hp1mtq.md is provided in the feature spec and must be used exactly as specified

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, structure correctness)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 90+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (069-229) demonstrate efficient implementation of identical features in 10-15 minutes
  - File naming (test-hp1mtq.md) is pre-specified, eliminating any naming decisions
  - Git workflow is mechanical and follows exact precedent from 150+ prior implementations

