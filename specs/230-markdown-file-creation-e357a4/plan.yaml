content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-27
  - **Status:** Complete — Ready for implementation

  ## Architecture Overview

  This feature implements a simple, well-established pattern used for 90+ existing test files
  in the Sheep project. The implementation is purely file creation and git workflow with no
  code complexity, external dependencies, or coupling to other features.

  **How it fits the existing architecture:**
  - Follows the spec-driven workflow established by features 069-229
  - Consistent with 90+ test-*.md files at repository root (no subdirectory changes)
  - Pure file creation using Python stdlib (pathlib) — no external packages
  - Standard git workflow using bash commands — no new tools or infrastructure
  - No impact on source code, configuration, or other features

  **File structure and location:**
  - Location: Repository root (`./test-hp1mtq.md`)
  - Format: H1 markdown heading + blank line + 2-3 sentences of prose
  - Encoding: UTF-8 (Python default) without BOM
  - Line endings: Unix LF (`\n`) ensured by explicit `newline='\n'` parameter
  - Expected size: 400-600 bytes (natural outcome of correct structure)

  ## Key Design Decisions

  ### 1. File I/O: Python pathlib with text mode

  **Chosen:** `pathlib.Path` with text mode and explicit UTF-8 encoding

  **Why this approach:**
  - Modern Python standard (PEP 519) required by NFR-5
  - Explicitly required by research findings (confirmed pattern)
  - Cross-platform path handling without manual `/` vs `\` logic
  - Clean, readable API: `Path('file').write_text(content, encoding='utf-8', newline='\n')`
  - No external dependencies (part of Python 3.11+ stdlib)

  **Alternative approaches rejected:**
  - `os.path` + `open()` — Older, more verbose, less Pythonic
  - Binary mode with manual encoding — Unnecessary complexity for text files
  - Direct string operations — Error-prone and unreadable

  ### 2. Encoding and line endings strategy

  **Chosen:** UTF-8 text mode with explicit `newline='\n'` parameter

  **Why this approach:**
  - UTF-8 is Python 3's default and handles encoding without BOM
  - Explicit `newline='\n'` ensures Unix-style LF line endings on all platforms (Windows, macOS, Linux)
  - Satisfies NFR-1 (UTF-8 without BOM) and NFR-2 (Unix LF line endings)
  - Minimal, explicit specification that avoids platform-specific issues

  **Research validation:**
  Research findings confirm this exact approach used in features 227-229 with success.
  Pattern from existing test files (test-3zdw9d.md, test-arvwkm.md) validates correctness.

  **Alternative approaches rejected:**
  - Binary mode with manual encoding — Overly complex for text files
  - Default text mode without newline parameter — May produce CRLF on Windows
  - UTF-8-sig encoding — Would add BOM, violating NFR-1

  ### 3. Prose content: Meaningful sentences on chosen topic

  **Chosen:** Author 3 well-formed sentences on a chosen topic

  **Why this approach:**
  - Matches established pattern of all 90+ existing test files
  - Satisfies NFR-5 (readable and grammatically correct prose)
  - Topic is free-form per NFR-8 (any topic accepted)
  - Direct authorship is more efficient than introducing generation logic
  - Research confirms this approach in features 227-229

  **Pattern confirmed from existing files:**
  - test-3zdw9d.md: "The Evolution of Programming Languages" (3 sentences about programming)
  - test-arvwkm.md: "The Power of Persistence" (3 sentences about persistence)
  - All files follow format: H1 heading + blank line + exactly 3 sentences

  ### 4. Git workflow: Bash commands

  **Chosen:** Bash shell commands (`git add`, `git commit`, `git push`)

  **Why this approach:**
  - Standard approach used in features 227-229 (confirmed by recent commits)
  - No external dependencies (git is universally available)
  - Simple, direct, and widely understood
  - Feature branch already exists (created during feature initialization)
  - Conventional commit format follows established pattern

  **Workflow:**
  ```bash
  git add test-hp1mtq.md
  git commit -m "feat(230): create markdown file test-hp1mtq.md with prose content"
  git push origin feat/230-markdown-file-creation-e357a4
  ```

  **Alternative approaches rejected:**
  - GitPython library — Adds external dependency (violates NFR-9)
  - Manual git object manipulation — Unnecessary complexity
  - Subprocess with complex parsing — Bash commands are clearer

  ### 5. File location and naming

  **Chosen:** Repository root with exact filename `test-hp1mtq.md`

  **Why this approach:**
  - FR-1 and FR-2 explicitly specify this location and filename
  - 90+ existing test-*.md files follow this exact pattern
  - No flexibility or alternatives are appropriate (hard requirement)

  ## Implementation Strategy

  The implementation follows a linear, dependency-ordered approach with two phases:

  **Phase 1: Markdown File Creation** (3-5 minutes)
  - Create file with pathlib using UTF-8 encoding and explicit Unix line endings
  - Verify file structure, encoding, and line endings meet all requirements
  - File must be ready for git staging before proceeding to Phase 2

  **Phase 2: Git Integration** (2-6 minutes)
  - Stage file with `git add test-hp1mtq.md`
  - Commit with exact conventional message: `feat(230): create markdown file test-hp1mtq.md with prose content`
  - Push to feature branch `feat/230-markdown-file-creation-e357a4`
  - Verify remote has received changes

  **Why this order:**
  - File must exist before git operations
  - Validation ensures quality before committing
  - Git operations are mechanical and depend on file existence
  - Linear order with clear dependencies (Phase 1 → Phase 2)

  ## Risk Mitigation

  | Risk | Probability | Mitigation |
  | ---- | ----------- | ---------- |
  | Incorrect encoding (BOM or UTF-16) | Low | Explicit `encoding='utf-8'` parameter; validate with hexdump or Python file inspection |
  | Wrong line endings (CRLF instead of LF) | Medium (on Windows) | Explicit `newline='\n'` parameter in pathlib.write_text(); validate with hexdump showing `0a` not `0d 0a` |
  | File not at repository root | Low | Exact path specification in code; verify file exists at `./test-hp1mtq.md` |
  | Incorrect markdown structure | Low | Validate structure matches pattern: H1 heading + blank line + 3 sentences |
  | Git commit message not exact | Low | Use exact string from spec; verify with `git log --oneline` |
  | Push fails due to authentication | Very Low | Feature branch exists; standard git push with no force flag; assume git credentials configured |
  | Prose content missing or incomplete | Low | Author content directly; verify 3 sentences present and grammatically correct |

  ## Summary

  This is a minimal, low-risk feature following a well-established pattern (150+ prior implementations).
  No architectural complexity, no new dependencies, no code changes — purely file creation and git workflow.
  Estimated 7-11 minutes of actual work (well within S size estimate of 10-15 minutes).
  Ready for implementation.

