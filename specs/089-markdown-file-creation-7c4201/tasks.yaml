# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementation of feature 089 proceeds through 4 phases over 7 tasks:

  **Phase 1 (Script Foundation):** Create the script scaffold with prose constant, then implement
  prose validation to ensure hardcoded content meets spec before any file I/O.

  **Phase 2 (File Creation & Validation):** Implement file creation using pathlib with UTF-8/LF,
  then implement comprehensive post-write validation to catch encoding/structure errors before
  committing to git.

  **Phase 3 (Git Integration):** Implement git operations (add, commit, push) with explicit error
  handling and distinct error messages. Wire all components into main() function with proper
  orchestration and error handling.

  **Phase 4 (Testing):** End-to-end testing confirms all spec requirements are met and git state
  is correct. Test error scenarios to ensure fail-fast behavior works properly.

  The implementation follows TDD: write validation/test assertions first (RED), implement minimal
  code to pass (GREEN), then refactor for clarity and extract helpers (REFACTOR). Total effort
  estimate: 3 hours (~30min per task on average, with file validation and testing being more complex).
