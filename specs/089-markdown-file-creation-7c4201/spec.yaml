    answer: 'Fail immediately'

content: |
  ## Problem Statement

  Create a single markdown file called test-mprgt7.md at the repository root with a markdown H1 heading
  as title and 2-3 sentences of prose content. This is the 89th implementation of an established pattern
  in the Sheep project where each feature creates a test markdown file to validate the automated code
  implementation platform's ability to handle repetitive, well-defined tasks.

  ## Success Criteria

  - [ ] File test-mprgt7.md is created at repository root (same level as README.md, pyproject.toml)
  - [ ] File has UTF-8 encoding with no BOM (Byte Order Mark)
  - [ ] File uses LF line endings (\n), not CRLF or CR
  - [ ] First line is a markdown H1 heading (line starts with `# ` followed by title text)
  - [ ] Second line is empty/blank (no characters, just line break)
  - [ ] Lines 3 through end contain exactly 2-3 complete sentences of prose content
  - [ ] File total size is between 350-650 bytes (inclusive)
  - [ ] File is staged for commit using `git add test-mprgt7.md`
  - [ ] Commit exists with message: `feat(089): create markdown file test-mprgt7.md with prose content`
  - [ ] Commit is on the feature branch: feat/089-markdown-file-creation-7c4201
  - [ ] Commit is pushed to origin/feat/089-markdown-file-creation-7c4201 (remote tracking updated)

  ## Functional Requirements

  - **FR-1**: Create a file named test-mprgt7.md at the repository root using Python pathlib.Path
  - **FR-2**: File must contain an H1 markdown heading (format: `# <title>`) as the first line
  - **FR-3**: File must have a blank line immediately following the heading (line 2)
  - **FR-4**: File must contain 2-3 complete sentences of prose content on lines 3 and beyond
  - **FR-5**: Write file content using UTF-8 encoding without BOM
  - **FR-6**: Ensure file uses LF line endings throughout (Unix-style, no CRLF)
  - **FR-7**: Stage the created file for commit using `git add test-mprgt7.md`
  - **FR-8**: Create a commit with conventional commit message: `feat(089): create markdown file test-mprgt7.md with prose content`
  - **FR-9**: Push the commit to origin on the feature branch (feat/089-markdown-file-creation-7c4201)
  - **FR-10**: Validate file meets all requirements before git operations (early failure detection)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding validation: UTF-8, no BOM, must not contain invalid characters
  - **NFR-2**: Line ending validation: all lines must use LF (\n) exclusively, no CRLF or CR
  - **NFR-3**: File size validation: total file size must be between 350-650 bytes (inclusive)
  - **NFR-4**: Implementation must use only Python 3.11+ standard library (pathlib, subprocess, sys, re, etc.)
  - **NFR-5**: No new external dependencies; must work with existing project dependencies
  - **NFR-6**: Code style and patterns must match features 069-088 implementations
  - **NFR-7**: Git commit message must follow conventional commits format: `feat(089): <description>`
  - **NFR-8**: All file I/O and git operations must be synchronous, single-threaded execution
  - **NFR-9**: Script must use subprocess.run() or subprocess.check_call() for git operations (CLI, not API)
  - **NFR-10**: Prose content must be unique from previous test files (no exact duplicates from test-*.md files)
  - **NFR-11**: Implementation must detect and handle file encoding/format errors clearly
  - **NFR-12**: Git operation errors must be reported with descriptive messages to help debugging

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Where should prose content come from? | Hardcoded in script | Matches all 88 prior implementations, deterministic, no external dependencies |
  | 2 | Should all file constraints be enforced or just warnings? | Enforce strictly | Maintains quality consistency, catches errors early, matches established pattern |
  | 3 | How to handle if test-mprgt7.md already exists? | Fail with error | Prevents accidental data loss, clear error reporting, matches CLI safety practices |
  | 4 | Validate sentence count programmatically? | Yes, with regex sentence parsing | Ensures spec compliance, catches formatting errors, feasible with stdlib |
  | 5 | What if git operations fail? | Fail immediately with error | Clear visibility, matches typical CLI behavior, git failures usually require manual intervention |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adding one new test-mprgt7.md file; no modification of existing files |
  | Git repository | Low | Single commit to feature branch, push to origin; follows established pattern from 20+ prior features |
  | Source code (src/) | None | No changes to agents, flows, tools, or configuration |
  | Tests | None | No test modifications needed; feature is self-contained file creation |
  | Documentation | None | Spec documentation is auto-generated from this spec.yaml |

  ## Dependencies

  **External Libraries**:
  - No new dependencies required
  - Uses only Python standard library: pathlib, subprocess, sys, re (regex for sentence validation)

  **Existing Code/Infrastructure**:
  - Git repository with feature branch (already created: feat/089-markdown-file-creation-7c4201)
  - Established commit message convention: `feat(089): create markdown file test-mprgt7.md with prose content`
  - Previous 88 implementations as reference for validation patterns and file structure

  **Workflow Dependencies**:
  - Feature branch already exists (feat/089-markdown-file-creation-7c4201)
  - User's git identity configured (user.name, user.email)
  - Can be implemented independently; no blocking dependencies on other features

  ## Size Estimate

  **S** — Single day / hours of effort

  **Justification**:
  - Extremely straightforward implementation: file creation + validation + git operations
  - Pattern established and proven in 20+ previous features (069-088)
  - All 88 prior implementations completed at S complexity (hours)
  - No architectural decisions, no code changes, no new dependencies
  - Expected implementation time: 15-30 minutes of coding + validation
  - Git operations are trivial (add, commit, push follow standard patterns)
  - Validation logic is straightforward file checks (encoding, size, structure)
  - Product decisions (5 questions) are all pre-resolved with recommended defaults

  ---

  _Requirements phase complete — ready for implementation_
