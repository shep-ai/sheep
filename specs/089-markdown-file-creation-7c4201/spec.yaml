content: |
  ## Problem Statement

  Create a single markdown file called test-mprgt7.md at the repository root with a markdown H1 heading
  as title and 2-3 sentences of prose content. This is the 89th implementation of an established pattern
  in the Sheep project where each feature creates a test markdown file to validate the automated code
  implementation platform's ability to handle repetitive, well-defined tasks.

  ## Codebase Analysis

  ### Project Structure

  **Sheep** is an agentic platform for automated code implementation using CrewAI. The project organization:

  ```
  .
  ├── src/sheep/               # Main package
  │   ├── agents/              # CrewAI agent definitions
  │   ├── config/              # Configuration and LLM factory
  │   ├── flows/               # Flow orchestration
  │   ├── tools/               # Agent tools (git, file operations)
  │   └── cli.py               # CLI entry point
  ├── tests/                   # Test suite
  ├── specs/                   # Feature specifications (089 total)
  ├── *.md files              # Documentation and generated test files
  ├── *.py scripts             # Implementation scripts for features
  └── pyproject.toml           # Project metadata and dependencies
  ```

  The repository root contains:
  - 88+ generated markdown files (test-*.md pattern) from previous features 069-088
  - Implementation scripts that follow a consistent pattern
  - Python 3.11+ with minimal dependencies (CrewAI, pydantic, git integration)

  ### Architecture Patterns

  This project follows a **feature-driven workflow**:

  1. **Spec Definition**: Each feature has a spec.yaml file defining requirements
  2. **Analysis Phase**: Research repository structure and similar implementations
  3. **Implementation Phase**: Execute the feature with validation
  4. **Commit & Push**: Standard git workflow with conventional commits

  The **markdown file creation pattern** (features 069-089):
  - Creates a file at repository root using Python pathlib.Path
  - File structure: H1 heading (title) + blank line + 2-3 sentences (prose)
  - Validation: UTF-8 encoding (no BOM), LF line endings, file size 350-650 bytes, sentence count
  - Git workflow: add → commit with conventional message → push to origin

  ### Relevant Technologies

  - **Python 3.11+**: Core language, used for all feature implementations
  - **pathlib.Path**: Cross-platform file I/O, preferred over os.path (per code patterns)
  - **subprocess**: Git operations (add, commit, push) via CLI
  - **Standard library**: No external dependencies beyond CrewAI for the project itself

  Previous implementations show all steps are synchronous, single-threaded Python scripts.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Adding one new test-mprgt7.md file; no modification of existing files |
  | Git repository | Low | Single commit to feature branch, push to origin; follows established pattern from 20+ prior features |
  | Source code (src/) | None | No changes to agents, flows, tools, or configuration |
  | Tests | None | No test modifications needed; feature is self-contained file creation |
  | Documentation | None | Spec documentation is auto-generated from this spec.yaml |

  ## Dependencies

  **External Libraries**:
  - No new dependencies required
  - Uses only Python standard library: pathlib, subprocess, sys

  **Existing Code/Infrastructure**:
  - Git repository with feature branch (already created)
  - Established commit message convention: `feat(089): create markdown file test-mprgt7.md with prose content`
  - Previous 88 implementations as reference for validation patterns

  **Workflow Dependencies**:
  - Feature branch already exists (feat/089-markdown-file-creation-7c4201)
  - Can be implemented independently; no blocking dependencies on other features

  ## Size Estimate

  **S** — Single day / hours of effort

  **Justification**:
  - Extremely straightforward implementation: file creation + validation + git operations
  - Pattern established and proven in 20+ previous features (069-088)
  - All 88 prior implementations completed at S complexity (hours)
  - No architectural decisions, no code changes, no new dependencies
  - Expected implementation time: 15-30 minutes of coding + validation
  - Git operations are trivial (add, commit, push follow standard patterns)
  - Validation logic is straightforward file checks (encoding, size, structure)

