content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established, proven pattern. This feature creates a single test markdown file (`test-7jjfmd.md`)
  at the repository root with a title and prose content, demonstrating automated file creation, git integration,
  and conventional commit workflows.

  This is the 181st iteration of an identical feature pattern. The Sheep project has successfully implemented
  180+ preceding features using this exact approach, with 180+ test markdown files already present in the
  repository root directory as precedents (test-*.md files). The implementation approach is fully validated,
  patterns are established, and success criteria are well-understood.

  ## Functional Requirements

  - **FR-1**: Create a new markdown file named `test-7jjfmd.md` in the repository root directory
  - **FR-2**: File must contain exactly one H1 markdown heading (marked with `#` prefix) serving as the title
  - **FR-3**: File must contain 2-3 sentences of coherent prose content following the H1 heading
  - **FR-4**: Prose content may be on any topic; implementation has discretion in content selection
  - **FR-5**: File must be staged for commit using `git add test-7jjfmd.md`
  - **FR-6**: File must be committed with conventional commit message: `feat(181): Create markdown file test-7jjfmd.md with prose content`
  - **FR-7**: Commit must be pushed to remote branch `feat/181-markdown-file-creation-7f901b`
  - **FR-8**: After push, git working tree must contain no uncommitted or untracked changes (clean state)

  ## Non-Functional Requirements

  - **NFR-1**: File encoding: UTF-8 without Byte Order Mark (BOM)
  - **NFR-2**: Line endings: Unix LF (`\n`), not Windows CRLF (`\r\n`)
  - **NFR-3**: Implementation must use Python's `pathlib.Path().write_text()` for file creation (atomic, reliable UTF-8 handling)
  - **NFR-4**: Commit message must follow Conventional Commits specification (feat: prefix with scope)
  - **NFR-5**: Implementation must follow the established pattern used in features 1-180 for consistency
  - **NFR-6**: File creation must be idempotent — multiple runs should produce the same result without errors
  - **NFR-7**: No external dependencies or new library imports required

  ## Success Criteria

  - [ ] File `test-7jjfmd.md` exists in the repository root directory
  - [ ] File contains exactly one H1 markdown heading (title line starting with `#`)
  - [ ] File contains exactly 2-3 sentences of prose content after the heading
  - [ ] File is encoded in UTF-8 without Byte Order Mark
  - [ ] File uses Unix LF line endings (standard on Linux/Unix systems)
  - [ ] File is staged and committed with conventional commit message: `feat(181): Create markdown file test-7jjfmd.md with prose content`
  - [ ] Commit is pushed to remote branch `feat/181-markdown-file-creation-7f901b`
  - [ ] Git working tree is clean after implementation (no unstaged or untracked files)

  ## Codebase Analysis

  ### Project Structure

  **Repository**: `jobnik/sheep` — An agentic platform for automated code implementation

  **Root structure**:
  ```
  /
  ├── src/sheep/                 # Main source code (agents, flows, tools, config)
  ├── specs/                     # Feature specifications (YAML-based)
  ├── test-*.md                  # 180+ test markdown files (precedents for this feature)
  ├── README.md                  # Project documentation
  ├── Dockerfile, setup.py       # Deployment and build configuration
  └── .github/                   # GitHub workflows and actions
  ```

  **Key directories**:
  - `src/sheep/agents/` — Agent definitions (Research, Implementation, Review agents)
  - `src/sheep/flows/` — Flow orchestration (main code_implementation.py flow)
  - `src/sheep/tools/` — Utility tools (git_tools.py, file_tools.py)
  - `src/sheep/config/` — Configuration and LLM factory
  - `specs/*/` — Feature specification files (YAML source of truth)

  ### Architecture Patterns

  **Flow-based orchestration**: The Sheep platform uses CrewAI flows to orchestrate work across phases:
  1. **Analysis Phase** — Research agents analyze the codebase
  2. **Requirements Phase** — Requirements are defined and validated (CURRENT)
  3. **Implementation Phase** — Implementation agents write code and create files
  4. **Review Phase** — Review agents validate changes
  5. **Commit Phase** — Git integration stages, commits, and pushes changes

  **Multi-phase feature tracking**: Each feature has phases (Analysis → Requirements → Implementation → Complete)
  with YAML specs stored in `specs/{number}-{name}/spec.yaml`.

  **Git integration pattern**:
  - File creation happens in the repository root
  - Git staging and commits follow conventional commit specification
  - Format: `feat: Create {filename} with {content_description}`
  - Automated push to remote after commit

  **File I/O approach**: The established implementation uses Python's `pathlib.Path().write_text()` for
  UTF-8 encoded file creation. This approach:
  - Handles file creation atomically
  - Automatically encodes content as UTF-8
  - Produces Unix LF line endings on Linux/Unix systems
  - Works reliably across 180+ prior implementations

  ### Relevant Technologies

  **Markdown**: Standard lightweight markup language for documentation
  - Format: H1 heading (`# Title`) followed by prose paragraphs
  - All test files follow identical markdown structure
  - File encoding: UTF-8 without BOM
  - Line endings: LF (Unix standard)

  **Git**: Version control integration
  - Staging: `git add {filename}`
  - Commit: `git commit -m "{conventional message}"`
  - Push: `git push -u origin {branch}`
  - Branch: `feat/181-markdown-file-creation-7f901b` (already created)

  **Python pathlib**: Built-in standard library for path operations
  ```python
  from pathlib import Path
  Path("test-7jjfmd.md").write_text("# Title\n\nSentence 1. Sentence 2. Sentence 3.")
  ```

  **CrewAI**: Agentic framework orchestrating agents and tasks
  - Already integrated and proven across 180+ features
  - Handles agent coordination, task definition, and result aggregation
  - Full integration with file I/O and git tools

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root directory | High | New file `test-7jjfmd.md` created at root alongside 180+ existing test files |
  | Git working tree | Medium | File staging and commit will update git index and HEAD |
  | Feature specification system | Low | No changes to spec infrastructure; only adds new feature record |
  | Implementation agents | None | Agents execute existing, proven implementation patterns — no code changes needed |
  | Build/CI systems | None | Test file creation does not trigger build system changes |

  ## Dependencies

  **Existing Project Infrastructure**:
  - CrewAI framework (already integrated and proven)
  - File I/O tools (pathlib — standard library, already used)
  - Git integration (already implemented in `src/sheep/tools/git_tools.py`)
  - Conventional commit pattern (established across 180 features)

  **No External Dependencies**:
  - No new libraries required
  - No API integrations needed
  - No database changes
  - No configuration modifications

  **Precedent Code**:
  - 180 preceding markdown file creation features provide complete pattern
  - Feature implementations 176-180 serve as immediate templates
  - All required tools already exist and are battle-tested

  ## Size Estimate

  **S** (1-2 hours) — Minimal complexity due to:

  1. **Proven pattern**: 180 preceding features with identical requirements
  2. **No discovery needed**: All patterns, tools, and conventions are established and documented
  3. **Single file creation**: One markdown file with straightforward structure (heading + 2-3 sentences)
  4. **Existing tooling**: File I/O, git integration, and CrewAI flows already exist and work reliably
  5. **No ambiguous decisions**: All content topics, prose generation, and commit format are precedented
  6. **Established success criteria**: Clear, measurable, and identical to 180 prior features

  Implementation effort breakdown:
  - Implementation logic: ~5 minutes (copy pattern from feature 180, change filename)
  - Prose generation: ~5 minutes (generate 2-3 coherent sentences)
  - Git operations: ~2 minutes (stage, commit, push)
  - Verification: ~3 minutes (validate file structure, encoding, git status)

  **Total**: ~15-30 minutes for implementation, ~30-90 minutes for full feature cycle including review/testing.

