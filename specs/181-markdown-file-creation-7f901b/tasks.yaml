content: |
  ## Overview

  This task breakdown covers 4 concrete work items across 2 implementation phases:

  **Phase 1: File Creation & Content** — Tasks 1-2
  - Create test-7jjfmd.md with proper markdown structure
  - Verify file encoding, line endings, and content structure

  **Phase 2: Git Integration & Remote Push** — Tasks 3-4
  - Stage file and create conventional commit
  - Push to remote and verify clean working tree

  ## Execution Flow

  1. **Task 1 (Create File)** — Write test-7jjfmd.md using pathlib.Path().write_text()
     - Uses RED-GREEN-REFACTOR: test baseline, implement file creation, verify prose quality
     - ~15 minutes including prose generation

  2. **Task 2 (Verify File)** — Validate encoding, line endings, and markdown structure
     - Uses RED-GREEN-REFACTOR: test encoding/line endings, validate structure, improve error handling
     - ~10 minutes for comprehensive validation

  3. **Task 3 (Stage & Commit)** — Git staging and conventional commit
     - Uses RED-GREEN-REFACTOR: test git state before/after, stage and commit, validate message format
     - ~10 minutes for git operations
     - Depends on Task 2 (file must be valid before committing)

  4. **Task 4 (Push to Remote)** — Remote push and working tree verification
     - Uses RED-GREEN-REFACTOR: test pre/post push state, execute push, verify clean state
     - ~10 minutes for push and verification
     - Depends on Task 3 (commit must exist before pushing)

  **Total Effort**: ~1.5 hours (breakdown: 15+10+10+10 minutes implementation + buffer for integration testing)

  ## Rationale

  Tasks follow a natural dependency chain:
  - File must exist before verification
  - File must be verified before committing (quality gate)
  - File must be committed before pushing
  - Verification after push ensures clean state

  Each task includes TDD cycles (RED-GREEN-REFACTOR) to ensure quality:
  - **RED** phases test baseline state and expected behavior
  - **GREEN** phases implement minimal functionality to pass tests
  - **REFACTOR** phases improve code quality and error handling

  ## Success Criteria

  Implementation is complete when:
  1. ✅ test-7jjfmd.md exists in repository root
  2. ✅ File contains H1 heading + 2-3 sentences about Perseverance and Resilience
  3. ✅ File is UTF-8 encoded without BOM, uses Unix LF line endings
  4. ✅ File is committed with message: "feat(181): Create markdown file test-7jjfmd.md with prose content"
  5. ✅ Commit is pushed to feat/181-markdown-file-creation-7f901b
  6. ✅ Git working tree is clean
