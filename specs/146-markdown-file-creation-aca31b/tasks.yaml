content: |
  ## Summary

  Feature 146 implementation follows a linear, dependency-ordered task flow:

  **Phase 1 (Feature Module Setup) — 22 minutes**:
  1. Create feature module file with metadata constants (10 min)
  2. Implement wrapper function calling orchestrator (12 min)

  **Phase 2 (Integration & Validation) — 23 minutes**:
  3. Test end-to-end execution and integration (15 min)
  4. Commit and push to feature branch (8 min)

  Each task in Phase 1 follows TDD: first write a test that fails (RED), then implement minimal code to pass (GREEN), then clean up and improve (REFACTOR). Phase 2's final operational task (commit/push) does not require TDD.

  The implementation reuses the proven `create_markdown_file()` orchestrator from content_generators, which handles all complexity (generation, validation, git workflow). The feature module is a thin wrapper with metadata constants. This pattern is proven through 145+ identical features and minimizes implementation risk.

  No modifications to existing application source code required. The feature module is purely additive.

  ## Task Dependencies

  ```
  task-1 (Create module)
    ↓
  task-2 (Implement function)
    ↓
  task-3 (End-to-end testing)
    ↓
  task-4 (Commit & push)
  ```

  All tasks are sequential with no parallelization (each depends on the previous).

  ## Implementation Notes

  ### Key Reusable Components

  - `sheep.content_generators.create_markdown_file()` — Proven orchestrator handling generation, writing, validation, commit, push
  - `sheep.tools.GitCommitTool` and `GitPushTool` — Git abstractions
  - `sheep.observability.logging.get_logger()` — Structured logging via structlog
  - `sheep.config.llm.get_reasoning_llm()` — LLM configured with settings

  ### Pattern Match

  Implementation follows established pattern from features 001-145:
  - Module location: `src/sheep/features/feature_146_markdown_file_creation.py`
  - Metadata constants: FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME, COMMIT_MESSAGE
  - Wrapper function: `create_feature_146_markdown_file(repo_path=None) -> dict`
  - Logging: structlog via get_logger(__name__)
  - No new dependencies or libraries
  - Atomic operations (all succeed or all fail)

  ### Testing Strategy

  - **Unit test**: Module metadata constants correct and importable
  - **Integration test**: Function calls orchestrator with correct parameters
  - **End-to-end test**: Markdown file created, committed, and pushed correctly
  - All tests should verify orchestrator integration and artifact creation

  ### Risk Mitigation

  - Reuse proven orchestrator reduces implementation risk to near-zero
  - Validation before commit catches issues early
  - Logging at all steps enables debugging
  - Pattern consistency (145+ precedents) ensures maintainability
  - Atomic operations prevent partial failures
