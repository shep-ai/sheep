content: |
  ## Architecture Overview

  Feature 146 follows the established orchestrator pattern from features 001-145. The architecture is simple and proven:

  1. **Feature Module** (`feature_146_markdown_file_creation.py`): Thin wrapper with metadata constants and entry function
  2. **Orchestrator** (`content_generators.create_markdown_file()`): Handles all complexity (generation, writing, validation, git)
  3. **Integration**: Feature module imports and calls orchestrator with feature-specific metadata

  The pattern separates concerns cleanly:
  - **Metadata** lives in the feature module (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME, COMMIT_MESSAGE)
  - **Logic** lives in the proven content_generators orchestrator (generation, validation, git workflow)
  - **Entry point** is the feature module wrapper function, callable directly or via orchestration systems

  ### Alignment with Existing Codebase

  - **Module location**: Follows features 001-145 at `src/sheep/features/feature_146_markdown_file_creation.py`
  - **Orchestrator usage**: Reuses battle-tested `create_markdown_file()` from sheep.content_generators
  - **Git workflow**: Uses GitCommitTool and GitPushTool abstractions via content_generators wrappers
  - **Logging**: Uses structlog via `get_logger(__name__)` matching content_generators pattern
  - **LLM configuration**: Uses `get_reasoning_llm()` from sheep.config.llm with settings-based model selection

  No changes to existing application code required. Implementation is purely additive.

  ## Key Design Decisions

  ### 1. Orchestrator Pattern (Not Custom Logic)

  **Decision**: Use existing `create_markdown_file()` orchestrator from content_generators module

  **Alternatives Considered**:
  - Build custom implementation using individual utility functions → adds complexity, diverges from pattern
  - Use raw Claude API calls directly → loses proven validation, error handling, git workflow

  **Rationale**: The orchestrator is proven through 145+ identical implementations with zero issues.
  It combines all required operations (generation, writing, validation, commit, push) into a single
  tested function. This approach minimizes implementation risk, maintains consistency, and reduces
  the feature module to simple metadata constants and a wrapper. Reusing proven code is a core
  principle of this architecture.

  ### 2. Feature Module Architecture

  **Decision**: Create feature_146_markdown_file_creation.py with metadata constants + wrapper function

  **Alternatives Considered**:
  - Call content_generators directly without feature module → breaks architectural pattern
  - Create a bare wrapper with no metadata → possible but inconsistent with 145 precedents

  **Rationale**: Feature modules (001-145) follow a consistent pattern with metadata constants
  (FEATURE_NUMBER, FEATURE_NAME, MARKDOWN_FILENAME, COMMIT_MESSAGE) plus a wrapper function.
  This enables: (1) direct script execution (`python -m sheep.features.feature_146_markdown_file_creation`);
  (2) consistent entry points for orchestration; (3) easy pattern reuse (copy prior feature, update constants);
  (4) clear separation of concerns. The pattern is proven and scales linearly.

  ### 3. Content Generation Configuration

  **Decision**: Use `get_reasoning_llm()` with Claude 3.5 Sonnet, temperature 0.2

  **Rationale**: The reasoning LLM is optimized for coherent prose generation. Temperature 0.2
  encourages focused, deterministic output. Settings-based configuration (not hardcoded) allows
  flexibility to change the model globally without code changes. This configuration is proven
  in features 001-145 and is already used by content_generators orchestrator.

  ### 4. File Validation Strategy

  **Decision**: Validate markdown file using `validate_markdown_file()` before commit

  **Rationale**: The validation function checks: UTF-8 encoding, LF line endings, H1 heading
  format, 2-3 sentence content, trailing newline. This is low-cost (~5ms) and catches real issues.
  The function is already tested and used in all prior features. It's better to catch issues
  before pushing to remote than to commit invalid content.

  ### 5. Git Workflow Integration

  **Decision**: Use GitCommitTool and GitPushTool via content_generators wrapper functions

  **Rationale**: The content_generators module already wraps git operations with proper error
  handling, logging, and conventional commit message formatting ("feat(146): ...").
  Reusing these functions maintains consistency with features 001-145 and avoids reimplementing
  git logic. The wrappers handle repository path defaults, structured logging, and upstream tracking.

  ## Implementation Strategy

  ### Phase 1: Feature Module Setup

  Create `src/sheep/features/feature_146_markdown_file_creation.py` following the established pattern:

  1. Define metadata constants:
     - `FEATURE_NUMBER = 146`
     - `FEATURE_NAME = "markdown-file-creation-aca31b"`
     - `MARKDOWN_FILENAME = "test-h875yn.md"`
     - `COMMIT_MESSAGE = "feat(146): create markdown file test-h875yn.md with prose content"`

  2. Implement wrapper function:
     - Signature: `create_feature_146_markdown_file(repo_path: str | None = None) -> dict`
     - Import and call `create_markdown_file()` from sheep.content_generators
     - Pass feature-specific metadata to orchestrator
     - Return result dictionary from orchestrator

  3. Add logging:
     - Use `get_logger(__name__)` for structlog integration
     - Log at info level: start of feature execution
     - Log at info level: successful file creation and commit
     - Log at error level: any failures

  4. Add module docstring and type hints following project conventions

  ### Phase 2: Integration & Validation

  1. Write end-to-end test:
     - Verify module imports successfully
     - Call `create_feature_146_markdown_file()`
     - Check that `test-h875yn.md` file exists
     - Verify file contains valid markdown (H1 heading + 2-3 sentences)
     - Verify git commit was created with correct message
     - Verify file was pushed to feature branch

  2. Verify integration with orchestrator:
     - Confirm content_generators functions are called correctly
     - Verify error handling works (orchestrator propagates errors cleanly)
     - Confirm logging output is structured and searchable

  3. No additional code modifications needed (orchestrator handles all complexity)

  ## Implementation Flow

  ```
  create_feature_146_markdown_file()
    ↓
  (metadata constants passed to orchestrator)
    ↓
  create_markdown_file(
    feature_number=146,
    filename="test-h875yn.md",
    commit_message="feat(146): create markdown file test-h875yn.md with prose content",
    repo_path=None
  )
    ↓
  Orchestrator executes in sequence:
    1. generate_markdown_content()    → Claude API call
    2. write_markdown_file()           → File I/O
    3. validate_markdown_file()        → Content validation
    4. commit_markdown_file()          → Git add + commit
    5. push_markdown_file()            → Git push
    ↓
  Return result dictionary with status
  ```

  All operations are logged via structlog with appropriate levels (debug/info/error).

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | LLM generates invalid content | Low | Validation catches issues before commit; orchestrator handles regeneration if needed |
  | Git push fails | Low | Orchestrator provides error handling and logging; feature branch already exists |
  | File already exists | Low | Orchestrator overwrites with new content (idempotent operation) |
  | API key misconfiguration | Low | Handled by CrewAI configuration; would fail fast with clear error message |
  | Import errors | Low | Verify imports work in Phase 1 testing; dependencies already in project |
  | Partial failure | Low | Orchestrator is atomic: either all steps succeed or operation fails cleanly |

  ## Files Created

  - `src/sheep/features/feature_146_markdown_file_creation.py` (~50-70 lines)
    - Metadata constants (4 lines)
    - Type hints and imports (10 lines)
    - Wrapper function (20-30 lines)
    - Docstrings and comments (remaining lines)

  ## Success Criteria

  - Feature module created at correct path with proper structure
  - Module imports without errors
  - Wrapper function calls orchestrator with correct parameters
  - Markdown file `test-h875yn.md` is created at repository root
  - File contains valid markdown: H1 heading + 2-3 sentences
  - File is UTF-8 encoded with LF line endings
  - Git commit exists with conventional message format
  - Commit is pushed to feature branch
  - All operations are logged via structlog
  - No modifications to existing application source code
  - Implementation follows established pattern from features 001-145
