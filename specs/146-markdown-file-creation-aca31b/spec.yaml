content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. Feature 146 creates a single test markdown file (`test-h875yn.md`) at the repository root with a title (H1 heading) and prose content (2-3 sentences), demonstrating automated file creation and git integration.

  This is the 146th implementation of an identical pattern established in features 001-145. The pattern is foundational to the Sheep project's test suite and serves as a minimal unit of work for validating the automated implementation system. The implementation should leverage proven utilities in the `content_generators` module rather than building custom logic.

  ## Success Criteria

  - [ ] Markdown file `test-h875yn.md` exists at repository root after implementation
  - [ ] File contains valid CommonMark markdown syntax (passes validation)
  - [ ] File contains exactly one H1 heading (title) and 2-3 sentences of prose content
  - [ ] File is UTF-8 encoded with Unix-style (LF) line endings
  - [ ] Git commit with message "feat(146): create markdown file test-h875yn.md with prose content" exists in git history
  - [ ] Commit is pushed to feature branch `feat/146-markdown-file-creation-aca31b`
  - [ ] Feature-specific module `src/sheep/features/feature_146_markdown_file_creation.py` exists following established pattern
  - [ ] All operations are logged via structlog with appropriate log levels (debug for steps, info for completion)
  - [ ] Implementation completes without errors in <15 minutes
  - [ ] File size is within expected range (400-600 bytes)

  ## Functional Requirements

  - **FR-1**: Create a markdown file named exactly `test-h875yn.md` at the repository root
  - **FR-2**: The file must contain valid CommonMark markdown syntax
  - **FR-3**: The markdown file must have exactly one H1 heading (title) at the start
  - **FR-4**: The markdown file must contain exactly 2-3 sentences of prose content after the heading
  - **FR-5**: File must be encoded in UTF-8 with Unix-style line endings (LF, not CRLF)
  - **FR-6**: Generated content must be produced by Claude API via CrewAI (not manually written or static)
  - **FR-7**: Validate the markdown file after creation using `validate_markdown_file()` from content_generators
  - **FR-8**: Stage the created file using git with `git add test-h875yn.md`
  - **FR-9**: Create a git commit with conventional commit message: "feat(146): create markdown file test-h875yn.md with prose content"
  - **FR-10**: Push the commit to the feature branch `feat/146-markdown-file-creation-aca31b` with upstream tracking
  - **FR-11**: Use the `create_markdown_file()` orchestrator function from `sheep.content_generators` module as the primary implementation entry point
  - **FR-12**: Create a feature-specific module `src/sheep/features/feature_146_markdown_file_creation.py` with metadata constants and entry function

  ## Non-Functional Requirements

  - **NFR-1**: Implementation must follow the established architecture pattern from features 001-145 (feature module structure, metadata constants, orchestrator usage)
  - **NFR-2**: All file operations, git operations, and API calls must be logged using structlog with clear, structured log messages
  - **NFR-3**: File creation must be atomic: either the file and commit are created successfully, or the operation fails cleanly without partial state
  - **NFR-4**: Implementation must complete within 15 minutes of execution (single file, proven utilities, no complex logic)
  - **NFR-5**: No modifications to existing application source code (src/sheep/) except for creation of the new feature module
  - **NFR-6**: Implementation must use Python 3.11+ language features and follow PEP 8 conventions
  - **NFR-7**: Error messages must be descriptive and help debugging if any step (generation, writing, validation, or git) fails
  - **NFR-8**: Content generation must be deterministic and idempotent (same inputs produce consistent output)
  - **NFR-9**: Implementation must not break or modify any existing test files, features, or configurations
  - **NFR-10**: Git operations must use the existing GitCommitTool and GitPushTool from the sheep.tools module

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should we use existing `create_markdown_file()` orchestrator or build custom logic? | Use existing orchestrator | Proven through 145+ implementations; reduces risk and code duplication; maintains established pattern consistency |
  | 2 | What prose topic should generated content focus on? | Generic/flexible (let Claude choose) | Maintains flexibility and consistency with features 001-145; eliminates unnecessary constraints |
  | 3 | Should we validate the file before committing? | Yes, use validate_markdown_file() | Ensures quality; catches encoding/format issues early; proven utility available in content_generators |
  | 4 | Should we create a feature-specific module? | Yes, create feature_146_markdown_file_creation.py | Maintains architectural consistency; enables pattern reuse; supports modular design from 001-145 |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-h875yn.md) to existing collection of 145+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-145; no branch/merge complexity, no destructive operations |
  | src/sheep/ | Low | Adds new feature_146_markdown_file_creation.py module; does not modify existing source code beyond using content_generators module utilities |
  | Specs Directory | Low | Updates this spec.yaml file as part of analysis and requirements phases; no impact on other specs or configurations |
  | Test Suite | None | No modifications to test files or testing infrastructure; feature itself creates a test artifact (markdown file) |
  | Feature Modules | Low | Adds new feature_146_markdown_file_creation.py module following established pattern from 145 preceding features |

  ## Dependencies

  - **Git repository**: Feature branch `feat/146-markdown-file-creation-aca31b` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 145+ test files in features 001-145 provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python 3.11+**: Project requires Python 3.11 or higher (specified in pyproject.toml)
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Claude API**: Content generation requires Claude API access via CrewAI LLM framework
  - **CrewAI Framework**: Already installed; handles LLM interaction and response formatting
  - **sheep.content_generators module**: Provides `create_markdown_file()` orchestration function and validation utilities
  - **sheep.tools module**: GitCommitTool and GitPushTool available for git operations
  - **structlog**: Already configured in project for structured logging

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **Content generation**: ~2-3 minutes (Claude API call via `create_markdown_file()` in content_generators)
  - **File creation and validation**: ~3-5 minutes (use `write_markdown_file()` and `validate_markdown_file()` utilities)
  - **Git workflow**: ~2-5 minutes (use `commit_markdown_file()` and `push_markdown_file()` utilities)
  - **Feature module creation**: ~2-3 minutes (copy/adapt feature_145_markdown_file_creation.py, update constants)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 145+ identical test files in features 001-145 providing clear precedent
  - Proven content generators in `sheep.content_generators` module available for reuse (`create_markdown_file()` is primary entry point)
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (143-145) demonstrate consistent 10-15 minute implementation of identical features
  - Zero impact on application source code or architecture (only adds feature module)
  - Claude API handles prose generation, eliminating manual content composition
  - Can reuse feature_145_markdown_file_creation.py as template, changing only metadata constants (FEATURE_NUMBER, MARKDOWN_FILENAME, COMMIT_MESSAGE)

  ---

  _Requirements phase complete — specification ready for implementation_
