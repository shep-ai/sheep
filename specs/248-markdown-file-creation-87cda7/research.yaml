  - title: "Sentence Boundary Detection"
    chosen: "Regex-based sentence detection: split on periods/question marks/exclamation marks followed by space or end-of-string"
    rejected:
      - "Simple sentence.split('.') — Fails on ellipses (...), abbreviations (e.g., 'Mr.'), decimal numbers; produces false positives"
      - "NLTK or spacy — External NLP dependencies; overkill for simple sentence counting; adds significant setup overhead"
