      - "GitPython library or similar — External dependency adds maintenance burden, larger attack surface; subprocess is standard library and sufficient for simple git operations"
      - "Direct git plumbing (object creation) — Overly complex for this use case, unmaintainable, bypasses git's normal user-facing interface"
    rationale: >
      subprocess.run() with shell=False and explicit argument lists provides safe, direct integration
      with git CLI. Using shell=False prevents command injection vulnerabilities and ensures consistent
      behavior across Windows/Unix. Explicit argument lists (not shell command strings) make code
      auditable and prevent filename-based injection attacks. This approach is documented in Python
