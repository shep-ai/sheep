content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (`test-ghy0tt.md`) at the repository root with a title and prose content, demonstrating automated file creation and git integration.

  This is a continuation of the markdown-file-creation pattern established in features 001-143, with 143+ identical test files already existing in the repository. The pattern is foundational to the Sheep project's test suite and serves as a minimal unit of work for validating the automated implementation system.

  ## Success Criteria

  - [ ] File `test-ghy0tt.md` exists in the repository root directory
  - [ ] File contains exactly one markdown H1 heading (`#`) as the title on the first line
  - [ ] File contains exactly 2-3 sentences of prose content after the heading, separated by a blank line
  - [ ] File is encoded as UTF-8 without BOM (Byte Order Mark)
  - [ ] File uses Unix-style LF line endings (`\n`), not Windows CRLF
  - [ ] File size is typically 400-600 bytes (accepted as guideline, not strict requirement)
  - [ ] Prose content follows the format: `# Heading\n\n<2-3 sentences>`
  - [ ] File is staged in git (`git add test-ghy0tt.md`)
  - [ ] Git commit exists with message: `feat(144): create markdown file test-ghy0tt.md with prose content`
  - [ ] Commit is on the feature branch `feat/144-markdown-file-creation-9442aa`
  - [ ] Changes have been pushed to remote origin

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-ghy0tt.md` in the repository root directory
  - **FR-2**: File must contain exactly one markdown H1 heading (`#`) as the title, placed on the first line
  - **FR-3**: File must contain 2-3 sentences of prose content after the heading (flexible topic selection)
  - **FR-4**: The H1 heading and prose content must be separated by exactly one blank line (format: `# Heading\n\n<prose>`)
  - **FR-5**: Stage the created file in git with the command `git add test-ghy0tt.md`
  - **FR-6**: Create a git commit with the exact message: `feat(144): create markdown file test-ghy0tt.md with prose content`
  - **FR-7**: Push the commit to the remote repository on the feature branch `feat/144-markdown-file-creation-9442aa`

  ## Non-Functional Requirements

  - **NFR-1**: File must be encoded as UTF-8 without BOM (Byte Order Mark) to ensure version control and CI/CD compatibility
  - **NFR-2**: File must use Unix-style LF line endings (`\n`), not Windows CRLF (`\r\n`), for cross-platform consistency
  - **NFR-3**: File size should typically be between 400-600 bytes (guideline based on prose variation; not a strict constraint to allow flexibility)
  - **NFR-4**: Implementation must not modify application source code, tests, or configuration files
  - **NFR-5**: Implementation must follow the established pattern from 143+ prior markdown-file-creation features (001-143)
  - **NFR-6**: Feature implementation must have zero impact on source code architecture, agents, flows, or tools beyond established content generators
  - **NFR-7**: Implementation must use Python 3.11+ standard library tools (pathlib) and established content generator utilities from `sheep.content_generators` module
  - **NFR-8**: Exactly one commit must be created per feature; all changes must be included in that single commit

  ## Product Questions & AI Recommendations

  All product ambiguities have been resolved through analysis of the 143+ established markdown-file-creation features (001-143). Four key decisions were documented as resolved questions with recommended approaches above in the openQuestions section.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-ghy0tt.md) to existing collection of 143+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single commit and push following established pattern from features 001-143; no branch/merge complexity, no destructive operations |
  | Source Code (/src/sheep/) | None | Feature is purely file creation at repository root; does not depend on or impact any source code, agents, flows, or tools beyond content generators |
  | Specs Directory | Low | Updates this spec.yaml file as part of requirements phase; no impact on other specs or configurations |
  | Test Suite | None | No modifications to test files or testing infrastructure |

  ## Dependencies

  - **Git repository**: Feature branch `feat/144-markdown-file-creation-9442aa` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **Established pattern**: 143+ test files in features 001-143 provide clear precedent for content format and structure
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python pathlib**: Available in Python 3.11+ standard library (no external dependencies)
  - **Content generators**: `sheep.content_generators` module provides utilities for file creation and validation

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation and validation**: ~5-7 minutes (use existing `generate_markdown_content()` utility, write file, validate syntax/encoding/line endings)
  - **Git workflow**: ~2-5 minutes (use existing `commit_markdown_file()` and `push_markdown_file()` utilities)
  - **Testing/verification**: ~1-2 minutes (verify file size, prose count, encoding)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 143+ identical test files in features 001-143 providing clear precedent
  - Proven content generators in `sheep.content_generators` module available for reuse
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, documentation, or configuration changes required
  - Recent feature implementations (141-143) demonstrate consistent 10-15 minute implementation of identical features
  - Zero impact on application source code or architecture

  ---

  _Requirements phase complete — specification ready for implementation_
