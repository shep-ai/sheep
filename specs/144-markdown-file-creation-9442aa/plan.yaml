content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-21
  - **Size Estimate:** S (10-15 minutes)

  ## Architecture Overview

  This feature implements a straightforward markdown file creation workflow that has been
  repeated successfully 143+ times across features 001-143. The implementation is organized
  around three core operations:

  1. **Content Generation** — Use Claude API via CrewAI to generate prose content
  2. **File Operations** — Write content to disk with proper encoding/line endings using pathlib
  3. **Version Control** — Stage, commit, and push changes using sheep.tools abstraction

  The feature has zero impact on application source code or architecture. It is purely a
  test file creation exercise that validates the automation platform's ability to execute
  a complete workflow: generate content → persist to disk → version control integration.

  ### Integration with Existing Codebase

  All components are implemented using established patterns from prior features:

  - **LLM Configuration:** Uses `sheep.config.llm.get_reasoning_llm()` (temperature 0.2)
    for consistent, coherent prose generation — same approach as features 001-143

  - **File I/O:** Uses Python `pathlib.Path` for modern, cross-platform file operations
    with explicit UTF-8 encoding — same pattern as existing content generators

  - **Git Tools:** Uses `sheep.tools.git_tools.GitCommitTool` and `GitPushTool` via their
    `_run()` methods — provides consistent logging, error handling, and subprocess management

  - **Observability:** Uses `sheep.observability.logging.get_logger(__name__)` for structured
    logging at each stage — integrates with existing observability infrastructure

  - **Validation:** Uses comprehensive format validation (H1 heading, blank line, sentence count,
    encoding, line endings) — same validation strategy as features 001-143

  ## Key Design Decisions

  ### 1. Content Generation via Claude API (CrewAI)

  **Decision:** Use `sheep.config.llm.get_reasoning_llm()` with temperature 0.2 to generate
  markdown content (H1 heading + 2-3 sentence prose).

  **Rationale:**
  - Established pattern across all 143+ prior markdown-file-creation features
  - CrewAI LLM framework is already configured in codebase with proper API key management
  - Temperature 0.2 ensures consistent, coherent prose while allowing topic/phrasing variation
  - Demonstrates LLM integration capability (core to Sheep platform mission)
  - No additional dependencies needed beyond existing CrewAI setup

  **Alternatives Considered:**
  - Hard-coded templates: Would reduce flexibility and violate established pattern
  - External content service: Would add external dependency and latency

  ### 2. File Operations via pathlib

  **Decision:** Use `pathlib.Path` from Python 3.11+ standard library for all file operations
  (create, write, validate, check existence).

  **Rationale:**
  - Modern, object-oriented API that abstracts platform differences (Windows/Unix)
  - Better error handling than legacy `os.path` module
  - Explicit encoding parameter enables UTF-8 enforcement
  - Part of Python standard library — no external dependencies
  - Already used in existing content_generators.py

  **Alternatives Considered:**
  - os.path module: Older, more verbose API with worse error handling
  - External file I/O library: Unnecessary complexity; stdlib suffices

  ### 3. Encoding & Line Ending Enforcement

  **Decision:** Write with `encoding="utf-8"` (gives Unix LF by default on Unix systems).
  Validate output via binary read to check for BOM (`b"\xef\xbb\xbf"`) and CRLF (`b"\r\n"`).
  Raise `ValueError` if either is detected.

  **Rationale:**
  - UTF-8 without BOM is the established standard across all 143+ prior test files
  - BOM can cause line ending churn in git on mixed-OS teams
  - CRLF breaks CI/CD pipelines that expect Unix line endings
  - Comprehensive validation prevents git/CI issues early

  **Alternatives Considered:**
  - Ignore encoding (let OS defaults apply): Risks breaking CI/CD; violates spec NFR-1, NFR-2
  - Implicit line ending conversion: Unnecessary; Python text mode on Unix uses LF by default

  ### 4. Markdown Format Validation

  **Decision:** Implement comprehensive validation:
  - H1 heading present at start (content starts with `"# "`)
  - Blank line separator (second line is empty string)
  - Sentence count: prose contains exactly 2-3 periods (.)
  - Trailing newline (file ends with `\n`, Unix convention)

  **Rationale:**
  - Comprehensive validation ensures spec compliance and catches errors early
  - Sentence counting via period detection is established pattern from features 001-143
  - Simple string checks are sufficient; AST parsing library would add unnecessary complexity
  - Validation immediately after write ensures content correctness before git commit

  **Alternatives Considered:**
  - Minimal validation (only check file exists): Cannot guarantee format compliance
  - AST-based markdown parsing: Introduces external dependency for simple format check

  ### 5. Git Integration Architecture

  **Decision:** Use existing `sheep.tools.git_tools.GitCommitTool` and `GitPushTool` classes
  via their `_run()` methods.

  **Rationale:**
  - Consistent with existing tool framework and established patterns from features 001-143
  - Provides integrated logging, error handling, and subprocess management
  - Atomic staging and commit via `GitCommitTool._run(repo_path, message, add_all=True)`
  - Upstream tracking via `GitPushTool._run(repo_path, remote, set_upstream=True)`
  - Tested in prior features; known to work reliably

  **Alternatives Considered:**
  - Direct subprocess calls: Risk of inconsistent error handling; lose centralized logging
  - Shell commands: Security risk (shell injection); harder to test; less consistent

  ### 6. Commit Message Format

  **Decision:** Use conventional commit with extracted topic:
  `feat: Create test-ghy0tt.md markdown file with [Topic] content`

  Where `[Topic]` is extracted from the H1 heading generated by the LLM.

  **Rationale:**
  - Follows conventional commits specification (feat: prefix for new feature/test)
  - Extracted topic provides semantic meaning in git history
  - Automated extraction from content — no additional configuration needed
  - Established pattern from features 001-143

  **Alternatives Considered:**
  - Generic message: Loses semantic information about file purpose
  - User-specified custom message: Adds unnecessary configuration complexity

  ## Implementation Strategy

  ### Phase Ordering Rationale

  1. **Phase 1 (Content Generation)** comes first because:
   - Must validate content before writing to disk
   - LLM output is external and potentially unpredictable
   - Early validation catches issues before persistence

  2. **Phase 2 (File Operations)** comes second because:
   - Depends on validated content from Phase 1
   - Must complete before git operations (can't commit non-existent file)
   - Enforces encoding/line endings at write time

  3. **Phase 3 (Git Integration)** comes last because:
   - Depends on file existing with correct properties
   - Final step that makes changes permanent in version control
   - Follows standard development workflow: develop → test → commit → push

  ### Task Breakdown Strategy

  Each phase is broken into focused tasks following TDD (Test-Driven Development):

  - **RED:** Write test that asserts expected behavior (test fails initially)
  - **GREEN:** Implement minimal code to pass the test
  - **REFACTOR:** Improve implementation without changing behavior

  This approach ensures:
  - Each component has verifiable requirements
  - Code is written to satisfy tests, not opinion
  - Quality is built in from the start, not retrofitted later
  - Prior features 001-143 followed this approach successfully

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | LLM generates malformed content | Comprehensive format validation immediately after generation catches errors before persistence |
  | File write fails (disk full, permissions) | Try/except in write function with clear error messages; validation ensures file properties before committing |
  | Encoding/line ending issues in CI/CD | Binary validation checks for BOM and CRLF; matches established pattern from 143+ prior features |
  | Git operation fails (not configured, auth issues) | Uses established sheep.tools abstraction with built-in error handling; prior features have proven this works |
  | File already exists (collision) | pathlib.Path.exists() check prevents overwrites; fail fast with clear message |
  | Content generation timeout/API error | Timeout on LLM call; error handling provides retry opportunity or clear failure message |

