content: |
  ## Problem Statement

  Create a single markdown file at the repository root with filename test-ypzjo0.md, containing an H1 heading (title) and 2-3 sentences of coherent prose. The file must be properly encoded (UTF-8, no BOM) with Unix line endings (LF). This feature follows the established workflow pattern from 303+ preceding markdown file creation features: generate content → write file → validate → commit → push.

  ## Success Criteria

  - [ ] File `test-ypzjo0.md` exists at repository root
  - [ ] File contains valid UTF-8 encoded text with no BOM
  - [ ] File uses Unix LF line endings (not CRLF)
  - [ ] First line is an H1 markdown heading (# Title)
  - [ ] Content includes 2-3 additional sentences of coherent prose
  - [ ] Prose content is grammatically correct and meaningful
  - [ ] File passes validation via validate_markdown_file() utility
  - [ ] Git commit created with message format: `feat(304): create markdown file test-ypzjo0.md with prose content`
  - [ ] Commit includes all required metadata and follows conventional commits standard
  - [ ] Changes pushed to remote repository on origin/feat/304-markdown-file-creation-3e35de branch
  - [ ] No existing files or source code modified
  - [ ] Execution completes without errors or warnings

  ## Functional Requirements

  - **FR-1**: Generate markdown content with H1 heading and 2-3 sentences using Claude API via generate_markdown_content() utility
  - **FR-2**: Create file at repository root with filename test-ypzjo0.md using write_markdown_file() utility
  - **FR-3**: Write content with UTF-8 encoding (no BOM) and Unix LF line endings
  - **FR-4**: Validate file encoding, line endings, markdown structure, and content integrity using validate_markdown_file()
  - **FR-5**: Stage file for commit using git add (or equivalent)
  - **FR-6**: Create git commit with author metadata and conventional message: `feat(304): create markdown file test-ypzjo0.md with prose content`
  - **FR-7**: Push commit to remote repository using git push
  - **FR-8**: Log execution steps, validation results, and git operations for observability

  ## Non-Functional Requirements

  - **NFR-1**: File encoding must be UTF-8 without BOM (Byte Order Mark); hex validation acceptable
  - **NFR-2**: Line endings must be LF (Unix style 0x0A), not CRLF (Windows style 0x0D0x0A) or CR (old Mac style)
  - **NFR-3**: Markdown must follow standard syntax (H1 = "# Title")
  - **NFR-4**: Implementation must reuse existing utilities from content_generators.py; no new content generation code
  - **NFR-5**: No modification to existing source files, tests, or configuration
  - **NFR-6**: Process must be repeatable and deterministic (same inputs → same outputs where applicable)
  - **NFR-7**: Execution must log all steps using structured logging from observability/logging.py
  - **NFR-8**: Prose content must be coherent, grammatically correct, and contextually meaningful
  - **NFR-9**: Feature implementation must follow 303+ pattern architecture (orchestrate generate → write → validate → commit → push)
  - **NFR-10**: Git operations must use subprocess or GitPython; no raw shell command injection

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | --------- | --------- |
  | 1 | Content source: Claude API or predefined static? | Claude API (dynamic generation) | Existing infrastructure already supports it; demonstrates full workflow; consistent with 303+ pattern |
  | 2 | Include git commit and push? | Yes, full workflow | 303+ pattern expects end-to-end completion; commit/push is established success criteria |
  | 3 | Validation scope: full or minimal? | Full validation per pattern | Prevents malformed content; existing utilities support it; 303+ standard |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file added; no existing files modified |
  | src/sheep/features/ | None | Feature implementation may be added but existing code unchanged |
  | src/sheep/content_generators.py | None | Existing utilities reused; no modifications needed |
  | Git history | Low | Single commit added with conventional message |

  ## Dependencies

  **Runtime Dependencies:**
  - Python pathlib (standard library)
  - git command-line tool or GitPython (for staging and pushing)
  - Claude API credentials and client (for content generation)

  **Code Dependencies:**
  - src/sheep/content_generators.py (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file)
  - src/sheep/config/llm.py (LLM configuration and model selection)
  - src/sheep/observability/logging.py (structured logging)
  - src/sheep/tools/ (git operations)

  **No external package dependencies** — all required functionality either exists in stdlib or is available via existing project infrastructure.

  ## Size Estimate

  **S** — This is the smallest possible feature unit:

  - Single file creation at repository root (4-5 lines of Python orchestration code)
  - No new source code modules or utilities required
  - No tests, no documentation, no configuration changes
  - Follows an established, battle-tested pattern from 303+ preceding features
  - Estimated effort: 15-20 minutes for implementation (generates content, writes, validates, commits, pushes)
  - All supporting infrastructure (generate, write, validate, commit, push) already exists in content_generators.py

  ---

  _Requirements phase complete — ready for implementation_
