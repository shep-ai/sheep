content: |
  ## Problem Statement

  The task is to create a single markdown file with a specific filename (test-ypzjo0.md) containing
  a title (H1 heading) and 2-3 sentences of prose content. This is a content-only feature that
  requires no source code modifications and follows the established pattern from 303 preceding
  similar features in the Sheep project.

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as a Python package under `src/sheep/` with the following key
  components:

  - **src/sheep/content_generators.py** - Reusable utilities for markdown generation, file I/O,
    validation, and git operations. Provides functions:
    - `generate_markdown_content()` - Uses Claude API to generate H1 heading + 2-3 sentences
    - `write_markdown_file(content, filename)` - Writes to repo root with UTF-8 encoding
    - `validate_markdown_file(filepath)` - Validates encoding, line endings, structure
    - `commit_markdown_file()` - Stages and commits with conventional message
    - `push_markdown_file()` - Pushes to remote repository

  - **src/sheep/features/** - Individual feature implementations. Each feature (e.g.,
    feature_289_markdown_file_creation.py) orchestrates the workflow: generate → write → validate
    → commit → push.

  - **specs/** - Feature specifications in YAML format with detailed requirements. Specs 006-303
    establish the pattern for markdown file creation features.

  - **src/sheep/config/llm.py** - LLM configuration and model selection.
  - **src/sheep/observability/logging.py** - Structured logging for tracking execution.
  - **src/sheep/tools/** - Git and file operation tools.

  ### Architecture Patterns

  1. **Separation of Concerns**: Content generation (LLM), file I/O, validation, and git
     operations are decoupled into separate functions in content_generators.py. Features
     orchestrate these as a workflow.

  2. **Specification-Driven**: Each feature has a detailed YAML spec defining requirements,
     success criteria, and functional/non-functional requirements. Specs are the source of truth.

  3. **Reusable Utilities**: Common operations (generate, write, validate, commit, push) are
     centralized in content_generators.py to avoid duplication across 300+ similar features.

  4. **Conventional Commits**: All features use the format `feat(NUMBER): create markdown file
     FILENAME with prose content` for consistency and traceability.

  5. **Validation Layer**: Every feature validates file encoding (UTF-8, no BOM), line endings
     (LF not CRLF), file size, and content structure before committing.

  ### Relevant Technologies

  - **Python 3.8+** - Language for implementation
  - **pathlib** - Modern file path handling and I/O (preferred over os.path)
  - **git** - Version control (via subprocess or GitPython)
  - **Claude API** (via CrewAI) - Content generation (optional; can use hardcoded content)
  - **Markdown** - File format (plain text, no special processing needed)

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository root | Low | Single new .md file added; no existing files modified |
  | src/sheep/features/ | None | Feature implementation may be added but existing code unchanged |
  | src/sheep/content_generators.py | None | Existing utilities reused; no modifications needed |
  | Git history | Low | Single commit added with conventional message |

  ## Dependencies

  **Runtime Dependencies:**
  - Python pathlib (standard library)
  - git command-line tool (for staging and pushing)
  - Optional: Claude API (if using LLM for content generation)

  **Code Dependencies:**
  - src/sheep/content_generators.py (reusable utilities)
  - src/sheep/config/llm.py (LLM configuration, if using API)
  - src/sheep/observability/logging.py (logging)

  **No external package dependencies** — all required functionality either exists in stdlib
  or is available via existing project infrastructure.

  ## Size Estimate

  **S** — This is the smallest possible feature unit:

  - Single file creation at repository root (4-5 lines of Python I/O code)
  - No new source code modules required
  - No tests, no documentation, no configuration changes
  - Follows an established, battle-tested pattern from 303 preceding features
  - Estimated effort: 10-15 minutes for implementation
  - All supporting infrastructure (generate, write, validate, commit, push) already exists
    in content_generators.py

