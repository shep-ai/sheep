content: |
  ## Summary

  Feature 304 implementation consists of 5 concrete tasks across 3 phases:

  **Phase 1 (Feature Implementation):** Create the feature module and implement the orchestration function that calls existing `create_markdown_file()` utility. The implementation is minimal (2-5 lines of functional code) because all complexity is delegated to pre-built infrastructure.

  **Phase 2 (Validation & Testing):** Write comprehensive test that verifies the generated markdown file has correct encoding (UTF-8, no BOM), line endings (LF), and structure (H1 heading, 2-3 sentences). This validates that the file meets specification requirements before committing.

  **Phase 3 (Git Integration):** Verify that git operations (stage, commit, push) complete successfully with proper metadata and conventional commit message format. This ensures the feature integrates correctly with project version control workflow.

  All tasks follow TDD cycles: write test first (RED), implement minimal code to pass (GREEN), then refactor for clarity (REFACTOR). The feature leverages 300+ preceding features' proven patterns and utilities, so the implementation footprint is intentionally minimal.

  ## Task Dependencies

  ```
  task-1 (Module creation)
    ↓
  task-2 (Feature function implementation)
    ↓
  task-3 (File validation testing)
    ↓
  task-4 (Git commit verification)
    ↓
  task-5 (Git push verification)
  ```

  Each task builds on the previous one. Task-1 creates the module structure, task-2 implements the core logic, and tasks-3-5 verify the outputs through increasingly detailed testing.

  ## Effort Estimate Breakdown

  | Task | Phase | Time | Rationale |
  | ---- | ----- | ---- | --------- |
  | task-1 | Phase 1 | 10 min | Create module, imports, boilerplate; straightforward setup |
  | task-2 | Phase 1 | 10 min | Implement function; mostly one-liner calling create_markdown_file() |
  | task-3 | Phase 2 | 15 min | Write test with multiple validation checks (encoding, line endings, structure) |
  | task-4 | Phase 3 | 10 min | Test git commit; parse git log output and assert message format |
  | task-5 | Phase 3 | 10 min | Test git push; compare local and remote refs |
  | **Total** | | **45 min** | Includes test writing, implementation, debugging, verification |

  ## Testing Strategy

  - **Unit-level:** Task-1 tests module import and function existence (minimal scope)
  - **Integration-level:** Task-2 tests feature function returns expected dict structure
  - **Validation-level:** Task-3 tests output file meets specification (encoding, structure, content)
  - **Git-level:** Task-4 and Task-5 test integration with version control (commit, push)

  Testing is performed incrementally as tasks complete, with each test building on previous validation.

  ## Success Criteria for Full Feature

  Upon completion of all 5 tasks:

  1. ✅ File `test-ypzjo0.md` exists at repository root
  2. ✅ File contains H1 heading and 2-3 sentences of prose
  3. ✅ File uses UTF-8 encoding without BOM
  4. ✅ File uses LF line endings (not CRLF)
  5. ✅ File passes validate_markdown_file() checks
  6. ✅ Git commit exists with message: `feat(304): create markdown file test-ypzjo0.md with prose content`
  7. ✅ Commit includes proper author metadata
  8. ✅ Changes are pushed to remote origin/feat/304-markdown-file-creation-3e35de
  9. ✅ All tests pass (unit, integration, validation, git)
  10. ✅ No source code modifications (only feature_304.py created, test-ypzjo0.md generated)

  ---

  _Task breakdown for implementation tracking_
