    rationale: >
      The project already has a battle-tested generate_markdown_content() function that uses CrewAI's LLM abstraction to call Claude API for dynamic markdown generation. This function validates output format (H1 heading + 2-3 sentences), handles error cases, and includes logging. Reusing it follows the existing architecture pattern (features 303, 302, etc.) and avoids code duplication. The function encapsulates the complexity of LLM interaction and prompt engineering, requiring only a single function call from the feature implementation.

