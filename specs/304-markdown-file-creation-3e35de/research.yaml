    chosen: "Use existing write_markdown_file() from content_generators.py with pathlib and UTF-8 encoding"
    rejected:
      - "Direct open() call with manual encoding handling — loses validation and error handling already present in write_markdown_file(); increases code surface area for bugs"
      - "Binary mode with manual byte writing — unnecessarily complex; requires explicit handling of UTF-8 byte sequences; error-prone for cross-platform compatibility"
    rationale: >
      The write_markdown_file() utility already handles path validation (prevents path traversal attacks), creates the file with UTF-8 encoding (no BOM), enforces Unix LF line endings, and validates file creation. It includes comprehensive error handling and logging. Reusing this function guarantees consistency across all markdown file creation in the project and reduces implementation surface area.

  - title: "File Validation Approach"
    chosen: "Use existing validate_markdown_file() from content_generators.py with comprehensive checks"
    rejected:
      - "Minimal validation (just check file exists) — risks committing malformed content; violates established pattern; doesn't catch encoding/line-ending issues"
      - "Custom validation in feature code — duplicates logic already in validate_markdown_file(); increases maintenance burden; reduces consistency"
    rationale: >
      The validate_markdown_file() function performs comprehensive validation: UTF-8 encoding check (rejects BOM), CRLF detection (rejects Windows line endings), H1 heading presence, sentence count (2-3), trailing newline, and markdown structure. This follows the 303+ pattern and prevents malformed content from entering the repository. The function is already proven across hundreds of feature implementations.

  - title: "Git Operations Implementation"
    chosen: "Use existing commit_markdown_file() and push_markdown_file() from content_generators.py with subprocess-based git operations"
    rejected:
      - "GitPython library — adds external dependency; creates version pinning concerns; overkill for simple git operations; project already uses subprocess for git commands"
      - "GitCommitTool/GitPushTool from tools module — designed for agent-based workflows with structured return values; adds unnecessary indirection for straightforward sequential operations"
    rationale: >
      The content_generators.py module provides commit_markdown_file() and push_markdown_file() that wrap subprocess.run() calls with proper error handling, logging, and validation. These functions handle edge cases (nothing to commit, push failures) and follow the project's established subprocess-based approach. They already incorporate the conventional commit message format required by the spec.

  - title: "Orchestration Pattern"
    chosen: "Use existing create_markdown_file() orchestration function from content_generators.py"
    rejected:
      - "Manual orchestration in feature code (call each step sequentially) — duplicates logic; violates DRY principle; increases implementation complexity and testing surface area"
      - "Agent-based orchestration with CrewAI — overkill for sequential deterministic workflow; adds complexity for minimal benefit; not the pattern used in 303+ features"
    rationale: >
      The create_markdown_file() function orchestrates the complete workflow: generate → write → validate → commit → push with proper error handling, logging at each step, and return values documenting the operation. It's already production-ready and exactly matches the required workflow. The feature implementation can call this single function and handle any exceptions.

  - title: "Logging and Observability"
    chosen: "Use existing structlog integration from sheep.observability.logging with get_logger(__name__)"
    rejected:
      - "print() statements — loses structured logging capability; harder to filter/search logs; doesn't integrate with project's observability infrastructure"
      - "Standard logging module — verbose boilerplate; content_generators.py already uses structlog, so duplicating with stdlib logging creates inconsistency"
    rationale: >
      All functions in content_generators.py use structlog for structured logging. The project infrastructure is already configured with structured logging, colors, and proper log levels. The feature implementation can rely on logging already present in the utility functions (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file).

