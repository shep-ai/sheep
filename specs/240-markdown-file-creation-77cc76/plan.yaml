# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature creates a lightweight test artifact following the established pattern from 90+ existing
  markdown files in the repository root. The implementation is purely file-based with no impact on
  source code (`/src/sheep/`), tests, or configuration files.

  The feature validates core platform capabilities:
  - **File I/O:** Creating files with specific encoding and line endings using Python standard library
  - **Git integration:** Staging, committing, and pushing files following conventional commit format
  - **Test artifacts:** Maintaining lightweight validation files without application logic dependency

  Architecture pattern (from features 237-239 and 100+ prior implementations):
  - Single markdown file at repository root
  - Minimal content structure: H1 heading + prose
  - No external dependencies or framework integration
  - Git workflow via CLI commands (already available in CI/CD environment)
  - Isolated from application source code and test infrastructure

  ## Key Design Decisions

  All design decisions are predetermined by feature specification and codebase precedent:

  ### 1. File I/O with pathlib

  **Decision:** Use `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')`

  **Rationale:** pathlib is the modern Python standard for file operations (since Python 3.4, stable
  in 3.11+). Using `write_text()` with explicit encoding and newline parameters provides the cleanest,
  most Pythonic approach. No external dependencies required. Consistent with all 90+ existing markdown
  test files in the repository. The `newline='\n'` parameter ensures Unix LF line endings across all
  platforms (disables Python's universal newline mode).

  **Alternatives rejected:**
  - `os.path` module — older, more verbose API
  - `open()` context manager — lower-level; pathlib provides better abstraction for simple file creation
  - Third-party libraries — unnecessary external dependency

  ### 2. File Content Structure

  **Decision:** H1 markdown heading (`# Title`) + blank line + 2-3 sentences of prose

  **Rationale:** Structure is specified by feature requirements (FR-2, FR-3, FR-4) and validated by
  90+ existing test files. Blank line separator follows CommonMark convention for semantic separation.
  Topic is free-form (NFR-7); any topic is acceptable. This exact structure appears in features
  237-239 and 100+ prior implementations.

  ### 3. Text Encoding and Line Endings

  **Decision:** UTF-8 encoding without BOM; Unix-style LF line endings

  **Rationale:** Specification explicitly requires UTF-8 without BOM (NFR-1) and Unix LF (NFR-2).
  Python's pathlib defaults to UTF-8 and never writes a BOM. Using `newline='\n'` ensures LF across
  all platforms (critical for git consistency). Repository standard is UTF-8 with LF.

  ### 4. Git Workflow via CLI

  **Decision:** Git CLI commands via subprocess: `git add`, `git commit`, `git push`

  **Rationale:** Feature spec requires specific git operations (FR-5, FR-6, FR-7). Git CLI is standard
  in CI/CD environments. Subprocess is simpler than GitPython library for this straightforward linear
  workflow (no merge handling or complex branching). Matches pattern from 100+ prior implementations.

  ## Implementation Strategy

  ### Phase 1: File Creation and Validation (5-8 minutes)

  Create the markdown file following the specification and verify format correctness. This phase
  produces the test artifact with proper encoding and structure before introducing git workflow.

  - **Task 1:** Create test-fxpnv0.md with correct markdown structure, UTF-8 encoding, and LF line endings
  - **Task 2:** Verify file format (encoding, line endings, size, structure) and validate against specification

  ### Phase 2: Git Integration (7-10 minutes)

  Execute the git workflow to stage, commit, and push the file to the feature branch. This phase
  follows the mechanical, well-established pattern from 100+ prior features.

  - **Task 3:** Stage the file and verify git status
  - **Task 4:** Create conventional commit and push to feature branch

  **Rationale for phase ordering:** File must exist and be verified before git operations. Validation
  ensures the artifact meets specification before being committed to the repository.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding/line ending errors** | Task 2 includes verification of UTF-8 encoding and LF line endings; will fail if incorrect |
  | **Git configuration missing** | Assume CI/CD environment has git user.name/user.email configured (standard practice); feature will fail fast with clear error if missing |
  | **File already exists** | Task 1 checks for pre-existing file; will fail if test-fxpnv0.md already exists |
  | **Git command failures** | All git operations will fail fast with clear error messages; no silent failures |
  | **Push to wrong branch** | Feature branch (`feat/240-markdown-file-creation-77cc76`) is pre-created and specified in push command; cannot push to wrong branch |

  ## Implementation Constraints

  - Feature branch `feat/240-markdown-file-creation-77cc76` must exist (pre-created)
  - Repository root directory must be writable (standard CI/CD precondition)
  - Git must be configured with user.name and user.email (standard CI/CD precondition)
  - Git must be available in PATH (standard CI/CD tool)
  - Python 3.11+ with pathlib available (standard runtime)

  ## Success Criteria

  All feature specification success criteria will be met through task execution:
  - [ ] File `test-fxpnv0.md` exists in repository root
  - [ ] File contains H1 heading + blank line + 2-3 sentences
  - [ ] UTF-8 encoding without BOM verified
  - [ ] Unix LF line endings verified
  - [ ] File size approximately 400-600 bytes (natural outcome of proper structure)
  - [ ] File staged, committed with conventional message, and pushed to origin
