# Structured technology decisions
decisions:
  - title: "File I/O Library Selection"
    chosen: "Python pathlib (Path.write_text())"
    rejected:
      - "os.path module — older API with more verbose syntax; pathlib is the modern Python standard"
      - "open() context manager — lower-level API; pathlib provides cleaner abstraction for simple file creation"
      - "Third-party libraries (e.g., files, pathy) — unnecessary external dependency; pathlib is sufficient and built-in"
    rationale: >
      pathlib is the modern Python standard library for file operations (since Python 3.4, stable in 3.11+).
      Using Path.write_text() with explicit encoding='utf-8' and newline='\n' provides the cleanest,
      most Pythonic approach. No external dependencies required. Consistent with established codebase
      patterns across 90+ existing markdown test files. The write_text() method handles encoding and
      line ending normalization correctly.

  - title: "File Content Structure"
    chosen: "Single H1 markdown heading + blank line + 2-3 sentences of prose"
    rejected:
      - "Multiple headings or nested structure — violates spec requirement of single H1 title"
      - "Prose without heading — doesn't meet file organization requirement"
      - "Complex markdown with links/formatting — unnecessary complexity; prose must be plain text per spec"
    rationale: >
      Specification mandates exactly one H1 heading followed by a blank line and 2-3 sentences of prose.
      This structure is predetermined by feature spec (FR-2, FR-3, FR-4) and validated by 90+ existing
      test markdown files in the repository. The blank line separator follows CommonMark convention for
      semantic content separation. Topic selection is free-form; any topic is acceptable per NFR-7.

  - title: "Text Encoding"
    chosen: "UTF-8 without BOM, configured via write_text(encoding='utf-8')"
    rejected:
      - "UTF-8 with BOM — explicitly forbidden by spec NFR-1; adds unnecessary bytes"
      - "ASCII or other encodings — UTF-8 is repository standard; required by spec NFR-1"
    rationale: >
      Specification requires UTF-8 without BOM (NFR-1). Python's pathlib.Path.write_text() defaults to
      UTF-8 in Python 3.11+ and never writes a BOM by default. Using encoding='utf-8' explicitly ensures
      consistent behavior. BOM is not needed and would violate requirements.

  - title: "Line Ending Strategy"
    chosen: "Unix-style LF (\\n) configured via write_text(newline='\\n')"
    rejected:
      - "Platform-default line endings (CRLF on Windows) — violates spec NFR-2 requiring Unix LF; breaks git diff"
      - "Mixed line endings — violates repository consistency standard"
    rationale: >
      Specification requires Unix-style LF line endings (NFR-2). Using write_text(newline='\n') with
      a newline parameter set to literal '\\n' ensures consistent output across platforms (Python's
      universal newline mode is disabled). This is critical for git consistency and matches existing
      repository files. Repository .gitattributes or git config should normalize line endings, but
      explicit newline='\\n' ensures correctness regardless of platform or git configuration.

  - title: "Git Workflow Approach"
    chosen: "Git CLI commands: git add, git commit with conventional format, git push"
    rejected:
      - "GitPython library — adds external dependency; shell commands are simpler for this use case"
      - "Programmatic git manipulation — unnecessary abstraction for straightforward workflow"
      - "Manual git operations — not feasible in automation context"
    rationale: >
      Feature spec (FR-5, FR-6, FR-7) requires specific git operations: stage file, commit with
      conventional format, push to feature branch. Git CLI is the standard tool available in CI/CD
      environments. Using shell commands via subprocess or bash execution is simpler than GitPython
      library dependency, especially since this is a straightforward linear workflow with no merge
      conflict handling or complex branching logic.

