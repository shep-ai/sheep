# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research Complete
  - **Updated:** 2026-03-17

  ## Technology Decisions Summary

  ### 1. File I/O Implementation

  **Chosen:** pathlib.Path.write_text(encoding='utf-8')

  **Rejected:**
  - os.open() and manual file operations — lower-level, less readable, requires explicit close()
  - io.open() — older pattern, less modern than pathlib

  **Rationale:** pathlib is the modern Python 3.11+ standard for file operations. It automatically manages file handles, provides clean encoding specification, and prevents resource leaks. The codebase pattern (65+ test files) and create_markdown.py precedent both use pathlib.Path.write_text(). Explicit encoding='utf-8' ensures no BOM is added and complies with UTF-8 requirement (NFR-4).

  ### 2. Content Generation

  **Chosen:** Hardcoded prose content with H1 heading and 2-3 sentences

  **Rejected:**
  - Random/procedurally generated content — adds complexity, introduces non-determinism
  - Template-based generation — overcomplicated for single-file feature

  **Rationale:** Hardcoded content is simple, reliable, and deterministic. The create_markdown.py precedent uses hardcoded prose about "The Moon and Its Impact on Earth" with exactly 3 sentences, totaling ~430 bytes. This ensures predictable file size (400-600 bytes per NFR-1) and coherent content.

  ### 3. Git Operations

  **Chosen:** subprocess.run() with check=True for git add, commit, and push

  **Rejected:**
  - GitPython library — despite being available in pyproject.toml, subprocess is simpler
  - Manual error handling — verbose and error-prone

  **Rationale:** subprocess.run(check=True) raises CalledProcessError automatically on failure, providing clean error handling. This pattern is used in create_markdown.py for all git operations (add, commit, push). subprocess is the standard Python approach for shell operations.

  ### 4. Encoding and Line Ending Control

  **Chosen:** pathlib.Path.write_text(encoding='utf-8') with Python's default LF handling

  **Rejected:**
  - Platform-default encoding — could produce CRLF on Windows (violates NFR-5)
  - Manual encoding to bytes — unnecessary complexity when write_text handles everything

  **Rationale:** Python's pathlib.Path.write_text(encoding='utf-8') ensures UTF-8 encoding without BOM and Unix-style LF line endings. This matches create_markdown.py precedent and meets requirements NFR-4 and NFR-5. No manual byte manipulation is needed.

  ### 5. Validation Methodology

  **Chosen:** Comprehensive validation of encoding, line endings, structure, and size

  **Rejected:**
  - No validation — risks silent failures and undetected requirement violations
  - Minimal validation (file exists only) — insufficient to catch encoding/format issues

  **Rationale:** The create_markdown.py precedent implements thorough validation:
  - Binary read check for BOM marker (\xef\xbb\xbf)
  - Binary read check for CRLF line endings (\r\n)
  - File size range check (350-650 bytes, targeting 400-600)
  - Content structure validation (H1 heading, blank line, prose)
  - Sentence count check via period count (2-3 sentences)
  This comprehensive approach prevents silent failures and provides clear feedback before git operations.

  ### 6. Error Handling Pattern

  **Chosen:** subprocess.run(check=True) for git operations, top-level try-except

  **Rejected:**
  - Ignoring errors — fails silently without feedback
  - Manual returncode checks — verbose and easy to miss cases

  **Rationale:** subprocess.run(check=True) raises CalledProcessError if commands fail, providing immediate feedback. A try-except wrapper catches all exceptions and returns proper exit codes. This matches create_markdown.py and standard Python CLI patterns.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib (stdlib) | File I/O | Use | Modern Python 3.11+ standard, clean API, automatic resource management |
  | subprocess (stdlib) | Git operations | Use | Standard Python approach for shell commands, check=True provides clean error handling |
  | GitPython | Alternative git operations | Reject | Already in dependencies but adds unnecessary complexity for simple operations |

  ## Security Considerations

  **No security vulnerabilities identified:**

  - **File I/O:** pathlib.Path.write_text() is secure — no shell injection or path traversal risks
  - **Hardcoded content:** Prose is static, no dynamic string interpolation or injection vectors
  - **Subprocess calls:** Using list-based arguments (not shell=True) prevents shell injection; all arguments are hardcoded
  - **Encoding:** UTF-8 is safe; no BOM simplifies parsing
  - **Git commands:** No user input or dynamic data, no command injection risks

  ## Performance Considerations

  **Performance is not a constraint for this feature:**

  - **File creation:** Single write_text() call is atomic and efficient (~400-600 bytes)
  - **Validation:** Minimal overhead — two read operations to check encoding and structure
  - **Git operations:** Standard git commands, performance is negligible
  - **Total execution:** Expected 1-2 seconds (meeting NFR-5: 10-15 minute feature completion)

  No optimization is needed — the feature is I/O-bound and minimally complex.

  ## Architecture Notes

  **Integration into existing codebase:**

  This feature follows established patterns from features 063-069:
  - Pure file creation at repository root (not in src/sheep/)
  - No dependencies on application source code
  - Standard git workflow (add, commit, push)
  - No configuration or test file modifications

  **Codebase alignment:**

  - Python 3.11+ requirement: met (pyproject.toml specifies >=3.11)
  - No new external dependencies: confirmed (uses only stdlib pathlib and subprocess)
  - Follows ruff/mypy standards: simple, straightforward code with type hints
  - Matches precedent: create_markdown.py provides exact reference implementation

  **Implementation pattern:**

  The reference implementation (create_markdown.py) provides a complete, tested pattern:
  1. Create content string with H1 heading and 2-3 prose sentences
  2. Use pathlib.Path.write_text() with encoding='utf-8'
  3. Validate file (BOM, CRLF, size, structure, sentence count)
  4. Stage with git add
  5. Commit with conventional message: feat(070): create markdown file test-7n2hlm.md with prose content
  6. Push to origin

  This pattern is proven (65+ existing files) and tested (feature 069 implementation).

