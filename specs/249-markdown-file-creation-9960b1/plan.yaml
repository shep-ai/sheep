# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-03-28

  ## Architecture Overview

  This feature implements a simple markdown file creation task that follows an established pattern
  across 90+ existing test files in the Sheep repository. The implementation is minimal and isolated:

  1. **File Creation** — Create test-65ou0n.md at repository root with hardcoded prose content
  2. **Structure Validation** — Verify file contains H1 heading, 2-3 sentences, UTF-8 encoding, LF line endings
  3. **Git Integration** — Stage, commit with conventional message, and push to feature branch

  The feature fits the existing codebase as a test artifact following the markdown-file-creation
  pattern. No modifications to source code (/src/sheep/), tests, or configuration files are required.
  The file is created at the repository root alongside 90+ other test-*.md files.

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()
  **Decision:** Use `pathlib.Path.write_text(content, encoding='utf-8', newline='\n')` for file creation.

  **Rationale:**
  - Spec explicitly requires pathlib (NFR-5)
  - Single call handles UTF-8 encoding (no BOM) and LF line endings
  - Direct, Pythonic API — no manual file handle management
  - Standard library (no dependencies)
  - Matches established pattern across 90+ precedent files

  ### 2. Git Operations: subprocess.run()
  **Decision:** Use `subprocess.run()` with git CLI for add, commit, and push operations.

  **Rationale:**
  - Spec forbids external dependencies (NFR-9); subprocess is standard library
  - Git CLI is available in environment (required by workflow)
  - Three operations are simple: `git add`, `git commit`, `git push`
  - `shell=False` prevents injection attacks; filename and message are hardcoded
  - Enables direct control over exact commit message format (FR-7)
  - Matches established pattern across 180+ implementations (features 069-248)

  ### 3. Structure Validation: Mechanical Checks
  **Decision:** Validate structure (H1 present, 2-3 sentences), encoding (UTF-8), and line endings (LF).

  **Rationale:**
  - Testing/CI context requires explicit validation to verify success criteria
  - Structural checks are mechanical, unambiguous: regex for H1, count sentence terminators
  - Grammar/spell-checking violates product decision #3 (implementer manual validation only)
  - Byte-range enforcement not needed per product decision #1 (natural outcome of structure)
  - No external dependencies needed; uses only Python standard library

  ### 4. Prose Content: Implementer-Created Hardcoded String
  **Decision:** Implementer chooses topic freely and creates prose content as hardcoded string literal.

  **Rationale:**
  - Spec requires implementer authorship with manual validation (FR-5, product decision #3)
  - Content is fixed at implementation time, no runtime generation
  - Supports free-form topic selection per product decision #2 (\"about anything\")
  - Matches simple pattern across 90+ precedents with diverse topics
  - No external dependencies, no latency, no complexity

  ### 5. Line Ending Control: newline Parameter in write_text()
  **Decision:** Use `newline='\n'` parameter to force LF on all platforms (Windows, Mac, Linux).

  **Rationale:**
  - Spec requires Unix LF line endings (NFR-2), not Windows CRLF
  - Default Python uses os.linesep (system-dependent)
  - `newline='\n'` parameter in write_text() forces LF explicitly on all platforms
  - Direct control at write point — no post-processing or git configuration needed
  - Clear intent, single parameter, no ambiguity

  ### 6. Error Handling: Fail Fast
  **Decision:** Raise exception with clear error message on any failure; exit with non-zero status.

  **Rationale:**
  - Feature operates in automated context (CI/testing)
  - Fail-fast enables immediate diagnosis and prevents silent data corruption
  - File I/O and git operations in controlled environment have minimal transient failure risk
  - Exceptions provide visibility for debugging
  - Matches established pattern across 180+ implementations

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1: File Creation and Structure Validation** comes first because:
  - File must exist and be valid before git operations can succeed
  - Validation verifies all success criteria are met before committing
  - Structural correctness is prerequisite for clean git history
  - Isolates file creation concerns from version control concerns

  **Phase 2: Git Integration** comes second because:
  - Operates on validated file (ensures clean commit)
  - Stages, commits, and pushes as atomic operation
  - Follows established git workflow pattern
  - Final step completes feature end-to-end

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (CRLF instead of LF on Windows) | Use explicit `newline='\n'` parameter in write_text() to force LF on all platforms |
  | File encoding includes BOM | Use `encoding='utf-8'` (standard UTF-8 without BOM) in write_text() |
  | Prose content is unreadable or grammatically incorrect | Implementer manually reviews content during creation (product decision #3); tested approach |
  | Git operations fail (uncommitted state, auth issues) | Ensure git is configured (user.name, user.email) and remote is reachable |
  | File already exists (collision) | Feature branch is clean; only this feature creates this file; safe to create |
  | Commit message typo | Use exact hardcoded message in subprocess call; no string interpolation |
  | Subprocess injection attack | Use `shell=False` and pass git commands as list; all strings are hardcoded |
  | File validation false positives | Keep validation checks simple and mechanical (regex, string operations) |

  ## Success Criteria Mapping

  The implementation strategy addresses all success criteria from the feature spec:

  - ✓ File `test-65ou0n.md` exists in repository root (Phase 1)
  - ✓ Contains exactly one H1 heading (Phase 1 validation)
  - ✓ Contains 2-3 sentences of prose (Phase 1 validation)
  - ✓ UTF-8 encoding without BOM (Phase 1 file creation)
  - ✓ LF line endings (Phase 1 file creation)
  - ✓ Staged with `git add` (Phase 2)
  - ✓ Commit with exact message (Phase 2)
  - ✓ Commit on feature branch (Phase 2)
  - ✓ Pushed to remote (Phase 2)

