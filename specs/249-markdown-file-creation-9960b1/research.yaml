# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-03-28

  ## Executive Summary

  This feature implements markdown file creation following an established pattern across 90+ existing
  test files. Implementation is straightforward: create file with pathlib, write prose content, validate
  structure, and commit via git. All operations use Python 3.11+ standard library; no external dependencies.
  Technical decisions are constrained by spec requirements (pathlib required, no external deps) and
  aligned with established pattern across precedents.

  ## Technology Decisions

  ### 1. File I/O Implementation — pathlib.Path.write_text()

  **Chosen:** `pathlib.Path.write_text()` with explicit UTF-8 encoding and LF line endings.

  **Rejected:**
  - `open()` function — more verbose, requires manual encoding/newline parameter handling, less Pythonic
  - `os.path + os.open()` — legacy API, less type-safe, poor newline handling
  - `io.open()` — same verbosity as `open()` without pathlib benefits

  **Rationale:**
  Spec explicitly requires pathlib (NFR-5). The `write_text()` method provides clean API with single call:
  ```python
  Path("test-65ou0n.md").write_text(content, encoding='utf-8', newline='\n')
  ```
  Handles all requirements: UTF-8 (no BOM), LF line endings, file creation. Standard library (no dependencies).
  Pythonic and readable. Matches pattern across 90+ precedent test files.

  ### 2. Git Operations — subprocess.run() with git CLI

  **Chosen:** `subprocess.run()` for git add, commit, and push operations.

  **Rejected:**
  - GitPython — external dependency (violates NFR-9), unnecessary abstraction for three simple commands
  - dulwich — pure Python git implementation, still external dependency (violates NFR-9)
  - Manual .git directory manipulation — too low-level, error-prone, no advantage

  **Rationale:**
  Spec forbids external dependencies (NFR-9). subprocess is standard library. Git CLI is available in
  environment (required by git workflow). Operations are simple:
  - `git add test-65ou0n.md`
  - `git commit -m "feat(249): create markdown file test-65ou0n.md with prose content"`
  - `git push -u origin HEAD`

  subprocess.run() with shell=False prevents injection attacks. Gives direct control over exact
  commit message format per spec requirement (FR-7). Matches established pattern.

  ### 3. Markdown Structure Validation

  **Chosen:** Validate structure (H1 heading, 2-3 sentences), encoding (UTF-8), and line endings (LF).

  **Rejected:**
  - No validation — cannot verify success criteria
  - Full CommonMark parsing — requires external library (violates NFR-9), over-engineered for test artifact
  - Automated grammar/spell-checking — violates product decision #3 (manual validation only)

  **Rationale:**
  Testing context requires explicit validation to verify success criteria. Structural checks are mechanical
  and unambiguous: file exists, contains exactly one H1 heading (regex: `^# `), contains 2-3 sentences
  (count periods or use sentence tokenizer heuristic), proper newline structure. Grammar validation violates
  spec (implementer manual validation per FR-5). Byte-range validation not needed per product decision #1
  (natural outcome, not strict constraint).

  Validation logic:
  ```python
  # Read back file, check structure
  content = Path("test-65ou0n.md").read_text(encoding='utf-8')
  # Verify H1 heading present: content.startswith('# ')
  # Verify 2-3 sentences (count sentence terminators)
  # Verify LF line endings: '\n' in content, '\r\n' not in content
  ```

  ### 4. Prose Content Strategy — Implementer-Created

  **Chosen:** Hardcoded prose string chosen by implementer during feature implementation.

  **Rejected:**
  - AI-generated prose (Claude API) — external dependency (violates NFR-9), latency, unnecessary
  - Template-based generation — adds complexity for single file, doesn't match simple pattern
  - Markov chain / algorithmic generation — violates spec requirement for implementer authorship

  **Rationale:**
  Spec requires implementer authorship with manual validation (FR-5, product decision #3). Prose is
  hardcoded as string literal chosen once. Implementer selects topic freely per product decision #2
  (\"about anything\"). Examples across 90+ precedents show diverse topics (nature, technology, science,
  culture, philosophy). Approach is simple, maintainable, no runtime generation needed.

  Typical implementation:
  ```python
  content = """# Title About Topic

  First sentence about topic. Second sentence with detail. Third sentence with conclusion."""

  Path("test-65ou0n.md").write_text(content, encoding='utf-8', newline='\n')
  ```

  ### 5. Line Ending Control — newline Parameter

  **Chosen:** Use `newline='\n'` parameter in `Path.write_text()` to force LF on all platforms.

  **Rejected:**
  - Default line ending behavior — uses system default (CRLF on Windows), violates NFR-2
  - Post-processing with string replace — adds complexity, error-prone, less direct
  - Git config (core.safecrlf, .gitattributes) — delegates control to git layer, less direct

  **Rationale:**
  Spec requires Unix LF line endings (NFR-2), not CRLF. Default Python uses os.linesep (system-dependent).
  The `newline='\n'` parameter in write_text() forces LF explicitly on all platforms (Windows, Mac, Linux).
  This is direct, Pythonic control at the write point. Single parameter, clear intent. No post-processing
  or git configuration needed.

  ### 6. Error Handling — Fail Fast

  **Chosen:** Raise exception with clear error message on any failure (file creation, git operation, validation).

  **Rejected:**
  - Graceful degradation with retry logic — over-engineered, transient failures unlikely
  - Logging and silent failures — unsuitable for automated/CI context
  - Interactive recovery flows — not suitable for non-interactive automation

  **Rationale:**
  Feature operates in automated context (CI/testing). Fail-fast is appropriate: if any step fails,
  operation should fail visibly with clear error message. This enables immediate diagnosis. File I/O
  and git operations in controlled environment have minimal transient failure risk. Exceptions provide
  visibility for debugging. Matches established pattern.

  ## Library Analysis

  | Library/Tool | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | **pathlib** | File I/O (create, read, write) | **USE** | Required by spec (NFR-5), standard library, handles encoding/newlines directly, Pythonic API |
  | **subprocess** | Git operations (add, commit, push) | **USE** | Standard library, no dependencies (NFR-9), git CLI is available, clean and direct |
  | **Git CLI** | Version control commands | **USE** | Available in environment (required by workflow), controlled via subprocess |
  | **GitPython** | Git library bindings | **REJECT** | External dependency (violates NFR-9), unnecessary abstraction for simple commands |
  | **dulwich** | Pure Python git implementation | **REJECT** | External dependency (violates NFR-9), overkill for three simple operations |
  | **mistune/markdown-it** | Markdown parsing | **REJECT** | External dependency (violates NFR-9), over-engineered for basic structure validation |
  | **TextBlob/NLTK** | Grammar/spell-checking | **REJECT** | External dependency (violates NFR-9), violates product decision #3 (manual validation only) |
  | **Claude API / LLM** | Prose generation | **REJECT** | External dependency (violates NFR-9), violates implementer authorship requirement (FR-5) |
  | **re (regex)** | Markdown structure validation | **USE** | Standard library, lightweight pattern matching for H1 detection |
  | **os** | System operations (if needed) | **USE** | Standard library for fallback operations |

  ## Security Considerations

  ### Subprocess Command Injection Prevention
  - Use `shell=False` in subprocess.run() calls to prevent shell injection
  - Pass git commands as list: `subprocess.run(['git', 'add', 'test-65ou0n.md'], shell=False)`
  - Do NOT use f-strings or string interpolation in shell commands
  - Safe implementation: filename is hardcoded in spec (test-65ou0n.md), no user input

  ### File Path Security
  - Use pathlib.Path directly (prevents directory traversal if file path is hardcoded)
  - Do NOT construct paths with string concatenation
  - Hardcoded filename (test-65ou0n.md) at repository root (no subdirectories per FR-2)
  - No risk from file creation in this controlled context

  ### Content Security
  - Prose content is test artifact, no sensitive data or credentials
  - No external input processed (implementer-created prose)
  - File permissions inherit from repository (standard for test artifacts)
  - No authentication or authorization required for test file creation

  ### Git Commit Security
  - Commit message is hardcoded per spec (FR-7): \"feat(249): create markdown file test-65ou0n.md with prose content\"
  - No user input in commit message (spec requires exact message)
  - Standard git operations (add, commit, push) — no force push or destructive operations
  - Feature branch already exists; no branch creation or merge conflicts

  ## Performance Considerations

  ### I/O Operations
  - File creation is I/O-bound, negligible latency (~1-5ms for small file)
  - File size typically 400-600 bytes (small, fast to read/write)
  - Single file operation; no batching or optimization needed

  ### Git Operations
  - Three git commands (add, commit, push) are executed sequentially
  - Total time: ~100-500ms depending on network (push operation is slowest)
  - Local operations (add, commit) are fast (~10-50ms)
  - No caching, parallelization, or optimization needed for test artifact

  ### Validation Overhead
  - Structure validation uses simple string operations and regex (~1-2ms)
  - Read file once to validate (no redundant I/O)
  - Negligible impact on overall operation

  ### Scalability
  - Feature creates single file; no scalability concerns
  - Pattern is repeated 180+ times across features 069-248, each independent
  - Each feature implementation is isolated; no resource contention
  - Standard deployment/CI environment provides sufficient resources

  ### Resource Usage
  - Memory: ~1-10 KB (small file content + git command output)
  - Disk: ~500 bytes for markdown file + ~100-200 bytes for git metadata
  - CPU: Negligible, mostly I/O bound

  No optimization needed for this use case.

  ## Architecture Notes

  ### Integration with Existing Pattern
  This feature follows the established pattern across 90+ existing test files (features 069-248):
  - Create single markdown file at repository root
  - Content: H1 heading + blank line + 2-3 sentences
  - Git workflow: add, commit (conventional format), push
  - No source code changes, no dependencies, no architectural impact
  - Files are isolated test artifacts, not part of application logic

  ### Repository Structure Impact
  - **Affected:** Repository root directory (adds test-65ou0n.md)
  - **Not affected:** src/, tests/, specs/, .github/, Dockerfile, pyproject.toml, etc.
  - **Git impact:** Single commit on feature branch feat/249-markdown-file-creation-9960b1
  - **No merge conflicts:** Feature branch is clean, single file addition

  ### Implementation Pattern
  Typical implementation structure (Python):
  ```python
  from pathlib import Path
  import subprocess

  def create_test_markdown():
      # 1. Create content
      content = """# Topic Title

      First sentence. Second sentence. Third sentence."""

      # 2. Write file
      Path("test-65ou0n.md").write_text(content, encoding='utf-8', newline='\n')

      # 3. Validate structure
      validate_markdown_structure(Path("test-65ou0n.md"))

      # 4. Git operations
      subprocess.run(['git', 'add', 'test-65ou0n.md'], check=True)
      subprocess.run(['git', 'commit', '-m', 'feat(249): create markdown file test-65ou0n.md with prose content'], check=True)
      subprocess.run(['git', 'push', '-u', 'origin', 'HEAD'], check=True)

  def validate_markdown_structure(filepath):
      content = filepath.read_text(encoding='utf-8')
      assert content.startswith('# '), \"Missing H1 heading\"
      assert '\r\n' not in content, \"Found CRLF; LF required\"
      # Additional validation as needed
  ```

  ### Dependencies and Constraints
  - Python 3.11+ (from pyproject.toml)
  - Git installed and configured (user.name, user.email)
  - Feature branch already exists: feat/249-markdown-file-creation-9960b1
  - Write access to repository root directory
  - Remote origin repository available
  - No external packages (all standard library)

  ### Testing and Validation
  - Structural validation (H1, sentence count, line endings) verified in implementation
  - Success criteria checkable post-execution: file exists, git log shows commit, file content correct
  - No additional test suite needed for test artifact
  - Can be integrated into CI pipeline for verification

