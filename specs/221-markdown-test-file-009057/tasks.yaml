content: |
  ## Task Workflow Summary

  Feature 221 implementation follows a straightforward three-phase workflow:

  ### Phase 1: File Creation (Tasks 1-2, ~7 min)

  Start with script skeleton (task-1), then implement file creation (task-2). By the end of Phase 1, test-0uftqx.md exists in repository root with proper:
  - H1 markdown heading
  - 2-3 sentences of prose
  - UTF-8 encoding without BOM
  - Unix LF line endings

  ### Phase 2: Git Integration (Task 3, ~4 min)

  Build on Phase 1 by adding git operations: stage file (git add), create commit with conventional message (git commit), push to feature branch (git push). Sequence is critical: file must exist before git operations.

  ### Phase 3: Error Handling & Integration Testing (Tasks 4-5, ~6 min)

  Wrap entire workflow with error handling (task-4), then test complete end-to-end workflow (task-5). Verify all success criteria: file format, git staging, commit message, remote push.

  ## Implementation Notes

  ### TDD Approach

  Each task follows RED-GREEN-REFACTOR cycle:
  - **RED**: Define what success looks like via tests/verification steps
  - **GREEN**: Implement minimal code to pass the test
  - **REFACTOR**: Clean up, add clarity, improve structure

  For simple features like this, "tests" are often verification commands (file exists, git log shows commit, etc.) rather than formal unit tests. Integration tests are appropriate for git operations since mocking subprocess would obscure the real requirement.

  ### Key Implementation Patterns

  1. **File I/O**: Use pathlib.Path.write_text() with encoding="utf-8" and newline="\n"
  2. **Git Operations**: Use subprocess.run() with list arguments (safe, no shell injection)
  3. **Error Handling**: Specific exceptions (FileExistsError, OSError, CalledProcessError)
  4. **Exit Codes**: 0 for success, 1 for any error

  ### Dependency Chain

  - Task 2 depends on Task 1 (script must exist before implementing functions)
  - Task 3 depends on Task 2 (file must be created before git operations)
  - Task 4 depends on Task 3 (error handling wraps entire workflow)
  - Task 5 depends on Task 4 (integration test runs complete script)

  **No parallelization:** Tasks must be sequential to build functionality incrementally.

  ## Time Estimation Rationale

  | Task | Estimate | Rationale |
  | ---- | -------- | --------- |
  | task-1 | 3m | Simple script skeleton: imports, constants, main() stub |
  | task-2 | 4m | File creation with pathlib; verify encoding/line endings |
  | task-3 | 4m | Three subprocess calls + conventional commit message |
  | task-4 | 3m | Try-except blocks for three exception types |
  | task-5 | 3m | End-to-end workflow verification |
  | **Total** | **17m** | Includes all implementation + testing; well within 15-minute spec estimate (conservative) |

  ## Success Criteria Reference

  All tasks work together to satisfy the feature's 9 success criteria:
  1. File exists in repository root ← Task 2
  2. H1 heading format ← Task 2
  3. 2-3 sentences prose ← Task 2
  4. Unix LF line endings ← Task 2
  5. Git add successful ← Task 3
  6. Conventional commit message ← Task 3
  7. Pushed to feature branch ← Task 3
  8. Consistent with existing test files ← Tasks 2, 5
  9. Feature branch HEAD updated ← Task 3

  ## Risk Mitigation During Implementation

  - **Task 2, Defensive Check**: File-exists check prevents accidental overwrites
  - **Task 3, List Arguments**: subprocess.run() with list args prevents command injection
  - **Task 4, Error Handling**: Specific exceptions enable clear debugging and automation-friendly exit codes
  - **Task 5, Integration Testing**: End-to-end verification confirms all operations succeed together
