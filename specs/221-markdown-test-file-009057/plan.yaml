content: |
  ## Architecture Overview

  Feature 221 is a straightforward, single-file creation task demonstrating automated file creation, git integration, and conventional commits. Implementation follows proven patterns from 60+ identical features (160-220).

  ### Design Pattern: Standalone Script

  Rather than integrating with Sheep's agent/crew system, this feature uses a **standalone Python script** with simple sequential execution. Rationale:

  - Feature scope is minimal (single file, 3 git commands)
  - Sheep agents/crews handle complex, multi-step workflows
  - Simple sequential operations don't benefit from orchestration
  - All 60+ precedent features (160-220) use standalone scripts successfully
  - Enables rapid execution, clear error handling, easy debugging

  If future features require file creation as a sub-step, they would call this script, not reimplement it.

  ### Architecture Consistency

  The Sheep platform uses agents/crews for complex multi-agent tasks and standalone scripts for atomic operations like file creation. This feature is atomic. The script uses only Python standard library (pathlib, subprocess, sys) with no external dependencies, matching features 216-220.

  ## Key Design Decisions

  ### 1. File Creation: pathlib.Path.write_text()

  **Chosen:** `Path(FILENAME).write_text(content, encoding="utf-8", newline="\n")`

  **Why:**
  - Modern Python 3.11+ standard for text file I/O
  - `encoding="utf-8"`: UTF-8 without BOM (correct for markdown/code)
  - `newline="\n"`: Forces Unix LF line endings on all platforms (critical for consistency with 220+ test files)
  - Clean, readable API
  - Defensive check prevents accidental overwrites

  **Alternatives Rejected:**
  - `os.open()`: Lower-level, requires manual encoding and line-ending conversion
  - `open()` built-in: More verbose; pathlib is modern standard
  - Shell `echo`: Platform-dependent, unsafe for special characters

  **Research Reference:** Technical decision #1 from research findings; proven in features 218-220.

  ### 2. Git Integration: subprocess.run() with list arguments

  **Chosen:** `subprocess.run(["git", "add", FILENAME], check=True)` and similar for commit/push

  **Why:**
  - List arguments prevent shell injection (safe by design)
  - `check=True` raises CalledProcessError on failure
  - Uses only Python standard library (no external dependencies)
  - `-u origin HEAD`: Sets upstream tracking for feature branches
  - Matches pattern in features 218-220

  **Alternatives Rejected:**
  - GitPython: External dependency (violates NFR-3), unnecessary complexity
  - Shell strings: Vulnerable to injection
  - `os.system()`: Deprecated, poor error handling

  **Research Reference:** Technical decision #2 from research findings; subprocess safety confirmed.

  ### 3. Content Format: Flexible prose, NO validation

  **Chosen:** 2-3 sentences of generic prose content, no validation layer

  **Why:**
  - Spec states "about anything" (flexible content acceptable)
  - File is correct by construction (pathlib ensures encoding/line endings)
  - Validation adds ~60 lines for zero benefit in simple feature
  - Feature 219 successfully omits validation
  - Minimizes decision overhead, enables fastest execution

  **Alternatives Rejected:**
  - Themed content: Adds overhead, contradicts "about anything"
  - With validation: Unnecessary complexity for straightforward feature

  **Research Reference:** Technical decisions #3 (content) and validation strategy from research.

  ### 4. Error Handling: Specific exceptions with descriptive output

  **Chosen:** Catch FileExistsError, OSError, CalledProcessError separately; log to stderr; exit(1)

  **Why:**
  - Specific exception types aid debugging
  - Descriptive stderr output enables automation/CI
  - Proper exit codes (0 success, 1 failure)
  - Defensive file-exists check prevents overwrites
  - Matches feature 219 pattern

  **Alternatives Rejected:**
  - Generic `except Exception`: Masks errors
  - No error handling: Crashes without explanation
  - Silent failures: No feedback to user

  **Research Reference:** Technical decision #4; security analysis confirms no injection risk.

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 → Phase 2 → Phase 3** (sequential, no parallelization)

  1. **Phase 1 (File Creation):** Foundation phase. Must complete first since git operations depend on file existing. Establishes proper encoding/line endings.

  2. **Phase 2 (Git Integration):** Workflow phase. Depends on Phase 1. Stages, commits, pushes the created file.

  3. **Phase 3 (Error Handling & Testing):** Robustness phase. Wraps both phases with defensive checks. Integrates all components into main() function.

  ### Incremental Development

  Each phase represents a functional increment:
  - After Phase 1: File created with correct format
  - After Phase 2: File staged, committed, pushed
  - After Phase 3: All error cases handled; complete, production-ready script

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File already exists (accidental overwrite) | Defensive check: `if file_path.exists(): raise FileExistsError(...)` |
  | Incorrect encoding or line endings | Use pathlib.write_text() with explicit encoding="utf-8" and newline="\n"; enforced across all platforms |
  | Git operations fail (network, permissions) | subprocess.run(check=True) raises CalledProcessError; catch and report with descriptive message |
  | Command injection via git arguments | subprocess.run() with list arguments (no shell); no user input in commands |
  | File format doesn't match spec | Correct by construction: pathlib ensures encoding, content string ensures H1 + 2-3 sentences |
  | Feature branch doesn't exist | Assume pre-created by feature setup; clear git error if missing |
  | Git user.name/user.email not configured | Script fails with clear git error; user configures before running |

  ## Success Criteria Mapping

  | Criterion | Implementation | Phase |
  | ---- | ---- | ---- |
  | File `test-0uftqx.md` exists in repo root | pathlib.Path.write_text() | Phase 1 |
  | H1 heading in file | Content: `f"# {TITLE}..."` | Phase 1 |
  | 2-3 sentences of prose | Content: `{PROSE}` (3 sentences) | Phase 1 |
  | Unix LF line endings | pathlib newline="\n" | Phase 1 |
  | File staged (git add) | subprocess.run(["git", "add", ...]) | Phase 2 |
  | Conventional commit message | subprocess.run(["git", "commit", "-m", "feat(221)..."]) | Phase 2 |
  | Pushed to feature branch | subprocess.run(["git", "push", "-u", "origin", "HEAD"]) | Phase 2 |
  | Format consistent with test files | Matches 220+ test-*.md files | Phase 1 |
  | Feature branch HEAD updated | Result of git push | Phase 2 |

  ## Technical Confidence

  **Confidence Level: High** — Identical pattern successfully executed 60+ times (features 160-220). All design decisions documented in research and proven in production. No architectural innovation required.

  **Execution Estimate:** 10-15 minutes (operations complete in 1-3 seconds; remaining time for development/testing).
