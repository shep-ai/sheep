decisions:
  - title: "File Creation Method: pathlib.Path vs alternatives"
    chosen: "pathlib.Path.write_text() with encoding='utf-8' and newline='\\n'"
    rejected:
      - "os.open()/write() — lower-level, requires manual encoding handling and line-ending conversion"
      - "open() built-in with manual mode specification — more verbose, pathlib is modern Python standard"
      - "Direct shell/bash echo — platform-dependent line endings, no encoding control, unsafe for special chars"
    rationale: >
      pathlib.Path.write_text() is the modern Python 3.11+ standard for text file operations.
      It provides: (1) explicit encoding control (UTF-8 without BOM), (2) cross-platform line-ending handling
      (newline='\n' forces LF on all platforms), (3) clean, readable API.
      This matches the pattern used in features 218-220, which have proven this approach in production.
      The newline='\n' parameter is critical: it ensures Unix LF line endings even on Windows,
      which is required for consistency with the Sheep repository (which uses LF throughout).

  - title: "Git Integration: subprocess vs GitPython vs direct commands"
    chosen: "subprocess.run() with list arguments (no shell interpretation)"
    rejected:
      - "GitPython library — external dependency, adds complexity for simple operations, violates NFR-3"
      - "Direct shell string execution — vulnerable to command injection if any user input involved"
      - "os.system() — deprecated, poor error handling, shell-dependent behavior"
    rationale: >
      subprocess.run() with list arguments provides: (1) safety (no shell interpretation, safe from injection),
      (2) error handling (check=True raises CalledProcessError on failure), (3) simplicity (minimal code),
      (4) standard library (no external dependencies, satisfies NFR-3).
      Using list arguments like ['git', 'add', FILENAME] instead of shell strings prevents command injection.
      This is the standard approach in features 218-220 and matches codebase conventions.
      The -u flag in 'git push -u origin HEAD' sets upstream tracking, which is appropriate for feature branches.

  - title: "Content Format: Prose approach and validation"
    chosen: "Flexible/generic prose content (2-3 sentences), NO validation layer"
    rejected:
      - "Themed/specific content — adds decision overhead, contradicts 'about anything' requirement"
      - "With validation layer — unnecessary complexity per spec; features 219+ omit validation for simple files"
    rationale: >
      The spec explicitly states 'about anything', which indicates flexible/generic content is acceptable.
      Feature 219 demonstrates that omitting validation is acceptable for straightforward features.
      Feature 218 includes validation but requires more complex error handling; this feature is simpler.
      Flexible content minimizes decision overhead and aligns with Sheep's test-file philosophy:
      the focus is on automation capability demonstration, not content quality.
      Prose content follows the pattern from features 218-220 (2-3 sentences on generic topics like 'communication', 'learning').

  - title: "Error Handling Strategy"
    chosen: "Specific exception handling (FileExistsError, OSError, CalledProcessError) with descriptive stderr output"
    rejected:
      - "Generic try-except all — masks errors, harder to debug, unclear failure reasons"
      - "No error handling — script would crash on failures without helpful messages"
      - "Silent failures — user wouldn't know if file creation or git operations failed"
    rationale: >
      Feature 219 demonstrates the effective pattern: catch specific exceptions (FileExistsError, OSError, CalledProcessError),
      log descriptive error messages to stderr, exit with status 1 on failure.
      This provides: (1) debuggability (users know what failed), (2) robustness (handles expected failures),
      (3) automation-friendly (exit codes allow scripting/CI integration).
      Defensive check for file existence prevents accidental overwrites.
      Separation of error types (file I/O, git operations) allows targeted troubleshooting.

  - title: "Line Ending Strategy: LF vs CRLF vs platform-dependent"
    chosen: "Explicitly force LF (Unix) line endings using newline='\\n' parameter"
    rejected:
      - "Platform-dependent (newline='') — would use CRLF on Windows, inconsistent with repo"
      - "Manual line ending conversion — error-prone, handled automatically by newline parameter"
    rationale: >
      The Sheep repository consistently uses LF line endings (verified by existence of 220+ test files).
      Feature NFR-4 explicitly requires LF line endings for consistency.
      Using newline='\n' in Path.write_text() ensures this across all platforms (Linux, macOS, Windows).
      This is critical for git diffs and CI/CD consistency; features 218-220 all use this approach.

  - title: "Encoding Strategy: UTF-8 plain vs UTF-8 with BOM"
    chosen: "UTF-8 without BOM using encoding='utf-8' parameter"
    rejected:
      - "UTF-8 with BOM — not appropriate for code/markdown files, causes issues with text processing"
      - "Other encodings (ASCII, Latin-1, etc.) — insufficient for international text support if needed"
    rationale: >
      UTF-8 is the modern standard for text files; plain UTF-8 (no BOM) is correct for markdown/code.
      The BOM (Byte Order Mark, bytes EF BB BF) was historically used for byte-order detection but is unnecessary
      for UTF-8 (which has fixed byte order) and causes issues in some tools.
      Python's encoding='utf-8' parameter produces plain UTF-8 without BOM.
      Features 218-220 all validate for absence of BOM, confirming this is the project standard.


