content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-26
  - **Research Status:** Complete

  ## Technology Decisions Summary

  This feature follows the well-established pattern from 60+ identical features (160-220). All key technical decisions align with proven approaches in the codebase.

  ### 1. File Creation Method: pathlib.Path.write_text()

  **Chosen:** `pathlib.Path.write_text(content, encoding="utf-8", newline="\n")`

  **Key Properties:**
  - Creates the file with UTF-8 encoding (no BOM)
  - Forces Unix LF line endings on all platforms (newline="\n" parameter)
  - Modern Python 3.11+ standard; clean, readable API
  - Matches implementation in features 218-220

  **Rejected Alternatives:**
  - `os.open()` + manual write: requires manual encoding and line-ending conversion
  - `open()` built-in: more verbose than pathlib
  - Shell `echo`: platform-dependent, unsafe for special characters

  **Rationale:** pathlib is the modern Python standard for file operations. The `newline="\n"` parameter is critical—it ensures LF line endings even on Windows, which is required for consistency with the Sheep repository. Features 218-220 have proven this approach in production.

  ### 2. Git Integration: subprocess.run() with list arguments

  **Chosen:** `subprocess.run(["git", "add", FILENAME], check=True)`

  **Key Operations:**
  - `git add test-0uftqx.md`: Stage file for commit
  - `git commit -m "feat(221): Create markdown file test-0uftqx.md"`: Create commit with conventional message
  - `git push -u origin HEAD`: Push to feature branch with upstream tracking

  **Rejected Alternatives:**
  - GitPython library: external dependency (violates NFR-3), unnecessary complexity
  - Direct shell strings: vulnerable to command injection
  - `os.system()`: deprecated, poor error handling

  **Rationale:** subprocess.run() with list arguments provides safety (no shell interpretation), error handling (check=True raises on failure), and uses only standard library. List arguments prevent command injection. The `-u origin HEAD` flags are appropriate for feature branches (sets upstream tracking). This matches features 218-220.

  ### 3. Content Format: Flexible/generic prose, NO validation

  **Chosen:** 2-3 sentences of generic prose content, no validation layer

  **Content Example:**
  ```
  # A Simple Title

  This is the first sentence of prose content. This is the second sentence.
  This is the third sentence if needed.
  ```

  **Rejected Alternatives:**
  - Themed/specific content: adds decision overhead, contradicts "about anything" requirement
  - With validation layer: unnecessary complexity; feature 219 omits validation for simple files

  **Rationale:** The spec explicitly states "about anything", indicating flexible content. Feature 219 demonstrates that validation can be omitted for straightforward features. Validation adds ~60 lines of code for a feature that is correct by construction (pathlib ensures proper encoding/line endings). Flexible content minimizes decision overhead and aligns with Sheep's test-file philosophy: demonstrating automation, not content quality.

  ### 4. Error Handling: Specific exceptions with descriptive stderr output

  **Chosen:** Catch FileExistsError, OSError, CalledProcessError separately; log to stderr; exit(1) on failure

  **Example:**
  ```python
  try:
      file_path.write_text(...)
  except FileExistsError as e:
      print(f"✗ File already exists: {e}", file=sys.stderr)
      sys.exit(1)
  except OSError as e:
      print(f"✗ File I/O error: {e}", file=sys.stderr)
      sys.exit(1)
  ```

  **Rejected Alternatives:**
  - Generic `except Exception`: masks errors, unclear failure reason
  - No error handling: script crashes without explanation
  - Silent failures: no feedback to user

  **Rationale:** Specific exception handling provides debuggability (users know what failed), robustness (handles expected failures), and automation-friendliness (exit codes for CI/scripting). Feature 219 demonstrates this pattern. Defensive check for file existence prevents accidental overwrites.

  ### 5. Line Endings: Explicitly enforce LF (Unix)

  **Chosen:** Use `newline="\n"` parameter in write_text()

  **Effect:** Forces LF line endings on all platforms (Linux, macOS, Windows)

  **Rejected Alternatives:**
  - Platform-dependent (newline=""): would use CRLF on Windows, inconsistent with repo
  - Manual conversion: error-prone, handled automatically

  **Rationale:** Spec NFR-4 requires LF line endings. The Sheep repo consistently uses LF (verified by 220+ test files). Using newline='\n' ensures this universally. Features 218-220 all use this approach.

  ### 6. Encoding: UTF-8 without BOM

  **Chosen:** `encoding="utf-8"` (produces plain UTF-8, no BOM)

  **Rejected Alternatives:**
  - UTF-8 with BOM: inappropriate for markdown/code, causes tool issues
  - Other encodings (ASCII, Latin-1): insufficient for modern text

  **Rationale:** UTF-8 is the standard; plain UTF-8 (no BOM) is correct for markdown. The BOM is unnecessary for UTF-8 and causes issues in some tools. Features 218-220 validate for absence of BOM, confirming this is the project standard.

  ---

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File operations | **Use** | Modern Python standard for file I/O; provides encoding and line-ending control; matches features 218-220 |
  | subprocess | Git integration | **Use** | Standard library; safe subprocess.run() with list args prevents injection; proven in 218-220 |
  | sys | Error handling and exit codes | **Use** | Standard library; sys.stderr for error output; sys.exit(code) for status |
  | GitPython | Git operations (alternative) | **Reject** | External dependency; violates NFR-3 (standard library only); unnecessary complexity for simple operations |
  | markdown | Markdown validation (alternative) | **Reject** | External dependency; not needed; file is correct by construction |
  | PyGit | Git operations (alternative) | **Reject** | External dependency; subprocess is better for simple operations |

  ---

  ## Security Considerations

  ### 1. Command Injection Prevention

  **Risk:** If user input were included in git commands, command injection is possible.

  **Mitigation:** All git commands use subprocess.run() with list arguments:
  ```python
  subprocess.run(["git", "add", FILENAME], check=True)  # Safe
  # NOT: subprocess.run(f"git add {FILENAME}", shell=True)  # Unsafe
  ```

  List arguments prevent shell interpretation; no user input involved in command strings.

  **Status:** ✅ Safe — no user input in git commands; list arguments prevent injection.

  ### 2. File Permissions

  **Risk:** Created file could be world-readable if umask is permissive.

  **Mitigation:** File permissions are controlled by system umask. Created file inherits standard permissions (typically 0644 with umask 0022). This is appropriate for source code/documentation files. No sensitive data in the file.

  **Status:** ✅ Safe — no sensitive data; standard file permissions appropriate for repo files.

  ### 3. Path Traversal

  **Risk:** If filename came from user input, path traversal could occur (e.g., "../../../evil.md").

  **Mitigation:** Filename is hardcoded: `FILENAME = "test-0uftqx.md"`. No user input involved. Path operations use pathlib (which resists path traversal).

  **Status:** ✅ Safe — filename is hardcoded constant; pathlib prevents path traversal.

  ### 4. File Overwrite

  **Risk:** If file already exists, write_text() overwrites it.

  **Mitigation:** Defensive check before writing:
  ```python
  if file_path.exists():
      raise FileExistsError(f"File {file_path} already exists")
  ```

  **Status:** ✅ Safe — defensive check prevents accidental overwrites.

  ### 5. Encoding Attacks

  **Risk:** Malformed encoding could cause unexpected behavior.

  **Mitigation:** Explicit encoding='utf-8' with newline='\n' ensures consistent behavior. No raw binary data or untrusted input.

  **Status:** ✅ Safe — explicit encoding; controlled content.

  **Overall Security:** No significant risks identified. This is a simple file creation task with no user input, no sensitive data, and no network operations. Standard library usage and explicit parameter control provide security by design.

  ---

  ## Performance Considerations

  ### 1. File I/O

  **Operation:** Single pathlib.write_text() call (~3 ms typical)

  **Optimization Potential:** None needed — already minimal. File size ~350-400 bytes.

  **Status:** ✅ Optimal for feature scope.

  ### 2. Git Operations

  **Operations:**
  - `git add`: Stages file (~100-200 ms)
  - `git commit`: Creates commit (~200-300 ms)
  - `git push -u origin HEAD`: Pushes to remote (~500 ms - 2 s depending on network)

  **Total Estimated Time:** 1-3 seconds per execution (95% of time is network-dependent git push)

  **Optimization Potential:** Could parallelize with other features, but not within a single feature.

  **Status:** ✅ Acceptable for simple feature (well within NFR-1 15-minute budget).

  ### 3. Process Overhead

  **Python interpreter startup:** ~50 ms (negligible)

  **subprocess.run() overhead:** ~20 ms per call (minimal; only 3 calls)

  **Status:** ✅ Negligible overhead.

  **Overall Performance:** Feature completes in 1-3 seconds, well within 15-minute budget. No optimization needed; straightforward implementation is appropriate.

  ---

  ## Architecture Notes

  ### 1. Integration with Sheep Platform

  **Design Decision:** Standalone Python script (not integrated into agents/crews).

  **Rationale:**
  - Feature is simple, single-purpose file creation
  - No need for agent orchestration or complex workflow
  - Matches 60+ precedent features (160-220), all using standalone scripts
  - Enables rapid execution and clear error handling

  **Integration Points (if needed by other features):**
  - Other features can call this script via subprocess: `subprocess.run(["python", "create_markdown_file_221.py"])`
  - Could be adapted into a Sheep Tool if file creation becomes a common sub-step in complex features

  **Current Architecture:** Sheep uses agents, crews, and tasks for complex multi-step workflows. Simple single-operation tasks like file creation don't benefit from this framework. Standalone scripts are appropriate for atomic operations.

  ### 2. Workflow Structure

  **2-Phase Workflow:**
  1. **Phase 1: File Creation** — Create test-0uftqx.md with proper structure
  2. **Phase 2: Git Integration** — Stage, commit, and push to remote

  **No Validation Phase** — Feature is correct by construction (pathlib ensures encoding/line endings).

  **Error Handling:** Each phase can fail independently; specific exceptions are caught and logged.

  **Orchestration:** Simple sequential execution in main(). No branching or complex control flow.

  ### 3. Consistency with Codebase Patterns

  **Precedent Features:** 160-220 all follow this identical pattern:
  - Python 3.11+ standard library (pathlib, subprocess)
  - Simple 2-3 phase workflows
  - Conventional commit messages
  - Standalone scripts in repository root

  **Alignment:** Feature 221 follows this established pattern exactly. No architectural innovation needed; proven approach is appropriate.

  **File Organization:** Script will be placed at repository root as `create_markdown_file_221.py`, matching the naming pattern of features 216-220.

  ---

  ## Implementation Approach

  ### Phase 1: File Creation

  ```python
  def create_file():
      content = f"# {TITLE}\n\n{PROSE}\n"
      file_path = Path(FILENAME)

      if file_path.exists():
          raise FileExistsError(f"File {file_path} already exists")

      file_path.write_text(content, encoding="utf-8", newline="\n")
      return file_path
  ```

  **Key Points:**
  - F-string constructs content (readable, efficient)
  - Hardcoded TITLE and PROSE (no user input, no decision overhead)
  - Defensive check prevents overwrites
  - Explicit encoding and line-ending parameters

  ### Phase 2: Git Integration

  ```python
  def git_add():
      subprocess.run(["git", "add", FILENAME], check=True)

  def git_commit():
      subprocess.run(["git", "commit", "-m", COMMIT_MESSAGE], check=True)

  def git_push():
      subprocess.run(["git", "push", "-u", "origin", "HEAD"], check=True)
  ```

  **Key Points:**
  - Separate functions for each git operation (clarity, testability)
  - List arguments prevent shell injection
  - check=True raises CalledProcessError on failure
  - Conventional commit message format

  ### Phase 3: Main Orchestration

  ```python
  def main():
      try:
          file_path = create_file()
          git_add()
          git_commit()
          git_push()
          sys.exit(0)
      except FileExistsError as e:
          print(f"✗ {e}", file=sys.stderr)
          sys.exit(1)
      except OSError as e:
          print(f"✗ File I/O error: {e}", file=sys.stderr)
          sys.exit(1)
      except subprocess.CalledProcessError as e:
          print(f"✗ Git command failed: {e.cmd}", file=sys.stderr)
          sys.exit(1)
  ```

  **Key Points:**
  - Sequential execution (clear control flow)
  - Specific exception handling (debuggability)
  - User-friendly error messages
  - Proper exit codes (0 on success, 1 on failure)

  ---

  ## Conclusion

  Feature 221 is a straightforward file creation task with well-established precedents in features 160-220. All technical decisions align with proven patterns in the codebase:

  - **File creation:** pathlib.Path.write_text() with UTF-8 and LF enforcement
  - **Git integration:** subprocess.run() with list arguments (safe, reliable)
  - **Content:** Flexible/generic prose (no decision overhead)
  - **Error handling:** Specific exceptions with descriptive output
  - **Validation:** None (correct by construction)
  - **Architecture:** Standalone script (simple, proven)

  **Risk Profile:** Minimal. No user input, no sensitive data, no complex operations.

  **Execution Time Estimate:** 1-3 seconds (git push network latency), well within 15-minute budget.

  **Confidence Level:** High. Identical pattern has been executed 60+ times successfully (features 160-220).
