  - question: "Should git operations include the --no-verify flag to skip pre-commit hooks?"
    resolved: true
    options:
      - option: "No --no-verify flag (let hooks run)"
        description: >
          Allow pre-commit hooks to run on git commit and git push.
          Advantages: respects project conventions, catches linting/formatting issues early.
