      No --no-verify flag is selected. Pre-commit hooks exist to enforce project standards (linting, formatting, etc.).
      For a simple feature that produces clean, correct output, hooks should pass without issue.
      If a hook fails, it indicates a real problem that should be fixed, not bypassed.
