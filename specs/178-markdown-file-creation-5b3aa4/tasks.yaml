# Markdown content (the full tasks document)
content: |
  ## Summary

  Implement feature 178 markdown file creation in 6 ordered tasks across 2 phases.

  **Phase 1: File Creation and Validation** creates the markdown artifact with correct structure,
  encoding, and line endings. Tasks 1-3 focus on the file itself: H1 heading creation, prose content
  addition, and validation of UTF-8 encoding + LF line endings + file size.

  **Phase 2: Git Integration and Push** integrates the file into version control. Tasks 4-6 focus on
  git operations: staging with git add, committing with conventional format, and pushing to the feature
  branch. Each task depends on the previous one due to sequential git workflow requirements.

  All tasks follow TDD cycle: RED (write test), GREEN (implement minimal code), REFACTOR (cleanup/verify).
  Total estimated effort: 1h 15min (6 tasks × ~10-15 minutes each, with validation tasks taking ~15 minutes).

  ## Task Flow

  **Task 1 → Task 2 → Task 3:** File Creation and Validation Phase
  - Create markdown file with H1 heading
  - Add 2-3 sentences of prose content
  - Validate UTF-8 encoding, LF line endings, file size (300-800 bytes)

  **Task 4 → Task 5 → Task 6:** Git Integration Phase
  - Stage file in git (git add)
  - Commit with conventional message (feat(178): ...)
  - Push to feature branch (git push -u origin HEAD)

  ## Implementation Notes

  - Feature branch (feat/178-markdown-file-creation-5b3aa4) is pre-created and checked out
  - Git user configuration (user.name, user.email) assumed available
  - No application code changes; repository root only
  - Pattern follows 177+ identical test file creation features (001-177)
  - All dependencies satisfied by Python 3.11+ stdlib (pathlib, subprocess)

  ---

  _Ready for implementation — all tasks specified with TDD cycles_
