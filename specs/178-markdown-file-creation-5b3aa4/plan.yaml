# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  This feature implements a minimal, isolated task within the Sheep automated implementation platform:
  create a single test markdown file artifact and integrate it into version control. The implementation
  follows the established pattern from 177+ identical features (001-177), requiring no architectural decisions,
  no application code changes, and no integration with /src/sheep/ or the broader Sheep platform.

  **Scope & Impact:**
  - **In scope:** Repository root directory only; single markdown file creation; standard git workflow
  - **Out of scope:** Application code in /src/sheep/; test modifications; configuration changes; any other files

  **Pattern Precedent:**
  The Sheep repository contains 177+ test files (features 001-177, plus 100+ legacy test-*.md files) following
  an identical pattern. This establishes a proven, tested approach across multiple implementations with consistent
  results (10-15 minute execution time, 400-600 byte typical file size, simple two-phase workflow).

  **Technical Stack:**
  - **File I/O:** Python 3.11+ pathlib.Path for cross-platform file creation with atomic UTF-8 write
  - **Git Operations:** Python subprocess.run() for transparent, explicit git command execution
  - **Markdown:** Simple H1 heading + 2-3 sentences of coherent prose; CommonMark compliant
  - **Encoding:** UTF-8 (no BOM), LF line endings — established standard across repository test files

  ## Key Design Decisions

  ### 1. File Creation Approach: pathlib.Path.write_text()

  **Decision:** Use `pathlib.Path.write_text(content, encoding='utf-8')` to create test-khrvcn.md.

  **Alternatives Considered:**
  - `open()` context manager — requires manual encoding/newline handling; less concise than pathlib
  - `os.open()` with `os.write()` — low-level, verbose; no advantage for this simple task
  - File templates or builders — unnecessary abstraction for single, straightforward file

  **Rationale:**
  pathlib is the established pattern across all 177+ test files in the repository. It handles UTF-8 encoding
  and file creation atomically, works cross-platform, and is the recommended standard in Python 3.11+.
  Sampling existing test files confirms the pattern is proven and produces files in the expected 300-800 byte range.

  ### 2. Content Generation Strategy: Hardcoded Prose

  **Decision:** Use hardcoded prose with meaningful topic selection (not dynamic generation or templates).

  **Alternatives Considered:**
  - Dynamic content generation — introduces unnecessary complexity and unpredictability
  - Template-based content — adds indirection and configuration overhead for single file
  - Random sentence generation — risks incoherence; established pattern uses quality prose

  **Rationale:**
  The feature spec explicitly allows unconstrained topic selection (\"about anything\"). Hardcoded prose is proven
  across 177+ existing test files. This approach ensures quality, readability, and predictability without research
  or dynamic logic. Simple, imperative prose works well.

  ### 3. Git Integration: subprocess.run() with CLI Commands

  **Decision:** Use `subprocess.run(['git', 'add', ...])`, `subprocess.run(['git', 'commit', ...])`, and
  `subprocess.run(['git', 'push', ...])` to manage git staging, commits, and push operations.

  **Alternatives Considered:**
  - GitPython library — available in pyproject.toml but adds abstraction layer unnecessary for simple CLI commands
  - Direct file system modification — bypasses git staging; violates workflow pattern
  - Shell script wrapper — reduces transparency and is harder to debug than explicit subprocess calls

  **Rationale:**
  subprocess.run() is the established pattern across features 001-177. It provides transparent, explicit control
  over git commands and is lightweight. GitPython is available but adds unnecessary abstraction for straightforward
  `git add`, `git commit`, `git push` operations. The feature branch is pre-created.

  ### 4. Encoding and Line Endings: UTF-8 (no BOM), LF

  **Decision:** Write file with UTF-8 encoding (no byte order mark), using LF (Unix) line endings.

  **Alternatives Considered:**
  - Platform-default encoding — introduces variability across developers and CI environments
  - CRLF line endings — increases file size, complicates diffs, inconsistent with established test files
  - UTF-8 with BOM — violates CommonMark specification and established pattern

  **Rationale:**
  UTF-8 without BOM is the established pattern across all 177+ existing test files. pathlib.Path.write_text()
  defaults to UTF-8 in Python 3.11+. LF line endings are standard in Unix/Linux environments. This matches
  CommonMark compliance and ensures clean diffs.

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  **Phase 1: File Creation and Validation**
  Create the markdown file with correct structure, encoding, and line endings. Tasks focus on the file artifact
  itself: creating the H1 heading, adding prose content, validating UTF-8 encoding and LF line endings, ensuring
  file size is in the 300-800 byte range. This phase establishes the artifact before git integration.

  **Phase 2: Git Integration and Push**
  Integrate the created file into version control: stage with git add, commit with conventional message, push to
  the feature branch. This phase completes the workflow and persists the artifact in the repository.

  **Phase Ordering Rationale:**
  File creation comes first because git operations depend on the file existing. Git integration comes second
  because it depends on the artifact being ready. No parallelization is possible due to ordering dependencies.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding mismatch (not UTF-8) | Use pathlib.Path.write_text() with explicit encoding parameter; verify by checking file encoding after creation |
  | Incorrect line endings (CRLF instead of LF) | Write content with explicit \\n characters; verify with git diff showing no spurious line ending changes |
  | Prose content incoherent or too short/long | Write 2-3 grammatically correct, coherent sentences; count sentences and validate before commit |
  | File size out of range (not 300-800 bytes) | Calculate expected prose length; verify file size with pathlib.Path.stat().st_size after creation |
  | Git staging fails (file not added) | Verify git add output; check git status to confirm file is staged |
  | Git commit fails (message format incorrect) | Use conventional format: feat(178): create markdown file test-khrvcn.md with prose content |
  | Git push fails (no remote tracking) | Feature branch is pre-created; use git push -u origin HEAD or explicit branch name |
  | Feature branch not checked out | Verify branch name with git status before starting; feature branch is pre-created per requirements |
