# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files
  following an established pattern. This feature creates a single test markdown file (`test-ue5l1f.md`)
  at the repository root with a title and prose content, demonstrating automated file creation,
  git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system,
  with 50+ similar test files already existing in the repository as precedents (test-*.md files
  at the root directory).

  ## Codebase Analysis

  ### Project Structure

  The Sheep project has a modular architecture organized as follows:

  - **Root directory**: Contains test markdown files (test-*.md) and standalone scripts (create_markdown.py)
  - **src/sheep/**: Main package containing all core application code
    - `agents/`: Agent definitions for code research, implementation, and review
    - `config/`: Configuration management (LLM settings, environment)
    - `flows/`: Flow orchestration logic using CrewAI
    - `observability/`: Logging and Langfuse integration
    - `tools/`: Git and file manipulation tools
    - `content_generators.py`: Utilities for generating markdown content using LLM
  - **specs/**: Feature specifications and research documents (064+ directories)
  - **tests/**: Test suite for the project
  - **Docker support**: Dockerfile and docker-compose.yml for containerization

  ### Architecture Patterns

  The project follows a **modular, task-first architecture** with clear separation of concerns:

  1. **Flows** orchestrate execution (high-level control structure)
  2. **Agents** provide autonomous AI decision-making with specialized roles
  3. **Tools** encapsulate specific operations (git, file, web operations)
  4. **Content generators** handle markdown generation with optional LLM support

  Key patterns observed:
  - **Stateless file creation**: Individual markdown files follow a simple, repeatable structure
  - **Git workflow integration**: Each feature includes git staging, conventional commits, and push operations
  - **Python standard library**: File I/O uses pathlib.Path, no external file libraries
  - **Established conventions**: 50+ existing test-*.md files demonstrate the exact format expected

  ### Relevant Technologies

  1. **Python (file I/O)**: Uses pathlib.Path for cross-platform file operations; standard library only
  2. **Markdown**: Plain-text format with H1 heading (#) followed by prose content
  3. **Git**: Version control integration for staging, committing, and pushing changes
  4. **CrewAI** (optional): LLM-based content generation available via content_generators.py
  5. **Python 3.11+**: Project requires Python 3.11 minimum per pyproject.toml

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file (test-ue5l1f.md) to existing collection of 50+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes |
  | Git Repository | Low | Standard single commit and push following established pattern from commits #122-#130+; no branch/merge complexity |
  | src/ Package | None | Feature does not modify any source code in src/sheep/ package |
  | Specs Directory | Low | Updates only this spec.yaml file as part of analysis phase |

  ## Dependencies

  - **Git repository**: Feature branch `feat/064-markdown-file-creation-79e72a` must exist (pre-created)
  - **File system**: Write access to repository root directory (already available)
  - **No external libraries**: Markdown files require no runtime dependencies or imports
  - **No code dependencies**: Feature is purely file creation; does not depend on or impact any source code
  - **No infrastructure**: No configuration changes, environment variables, or build system modifications required
  - **Established pattern**: 50+ test files provide clear precedent for content format and structure

  ## Implementation Approach

  Based on analysis of create_markdown.py and 63+ precedent features:

  1. **Content creation**: Write markdown with H1 heading + blank line + 2-3 sentences of prose
  2. **File location**: Save as test-ue5l1f.md at repository root
  3. **Encoding**: UTF-8 with Unix line endings (LF), ensured by pathlib.write_text()
  4. **Git workflow**: Stage file, commit with conventional message (feat:), push to branch
  5. **Format validation**: Verify heading, line breaks, and prose count match requirements

  Content may be generated manually or via content_generators.py with LLM support, following
  the pattern established in create_markdown.py which writes static prose content.

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown heading + 2-3 sentences of prose)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings)
  - **Git workflow**: ~2-5 minutes (stage file, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes of actual work

  This estimate is based on:
  - Well-established pattern with 50+ identical test files providing clear precedent
  - Flexible topic selection with no research or architectural decisions needed
  - Single file with minimal, well-understood content format (one heading + prose)
  - No testing, documentation, or configuration changes required
  - Recent commits (#122-#130) demonstrate efficient implementation of identical features
