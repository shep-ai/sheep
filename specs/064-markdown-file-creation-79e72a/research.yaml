decisions:
  - title: File I/O Library Selection
    chosen: pathlib.Path (standard library)
    rejected:
      - os.path module — older API, less Pythonic, requires manual encoding/line-ending handling
      - External libraries (anyio, aiofiles) — adds unnecessary dependencies for synchronous file creation; no performance benefit for single file write
    rationale: >
      pathlib.Path is the modern Python standard library choice and is used throughout
      the Sheep project (git_tools.py, file_tools.py, create_markdown.py). The .write_text()
      method handles UTF-8 encoding by default and automatically uses LF line endings on
      Unix systems, eliminating manual encoding concerns. No external library is needed
      or justified for a simple synchronous file creation task.

  - title: Git Integration Approach
    chosen: subprocess + explicit commands (git add, git commit, git push)
    rejected:
      - GitPython library — While available in dependencies, the codebase uses subprocess
        for all git operations (see git_tools.py). Using GitPython would add an unnecessary
        abstraction layer and deviate from project conventions.
      - Inline git operations — Not applicable; git workflow is external to file creation
    rationale: >
      The Sheep project establishes a clear pattern in git_tools.py using subprocess.run()
      with git commands. This approach is consistent across agents and tools. Commits #122-#130
      demonstrate the simple linear workflow: create file, stage with git add, commit, push.
      Using subprocess allows exact control over git operations and matches all precedent files.

  - title: Content Generation Method
    chosen: Static prose (hardcoded text)
    rejected:
      - LLM-based generation via content_generators.py — While available, adds runtime
        dependency and LLM API calls. The spec explicitly requires static prose matching
        the established pattern in 44+ existing test files (commits #122-#130).
      - Random prose generators — Unnecessary complexity for test file purpose
    rationale: >
      The specification explicitly selects static prose over LLM generation to match
      the established pattern across 50+ identical test files. All existing test-*.md
      files (visible in the repository) use static, hardcoded prose content. This ensures
      consistency, speed, predictability, and eliminates runtime dependencies on LLM services.

  - title: Text Encoding and Line Endings
    chosen: UTF-8 with LF (Unix) line endings
    rejected:
      - Manual encoding handling — pathlib.write_text() handles this automatically
      - Platform-specific line endings (CRLF on Windows) — Violates spec requirement for LF;
        unnecessary complexity on cross-platform systems
    rationale: >
      pathlib.Path.write_text(content, encoding='utf-8') is the standard, idiomatic Python
      approach that guarantees UTF-8 encoding without BOM. On Unix systems (and in CI/CD),
      it automatically uses LF line endings, meeting the specification requirement. This
      matches the pattern in create_markdown.py and all 44+ existing test files. No manual
      line ending conversion is needed.

  - title: Markdown Format Structure
    chosen: H1 heading + blank line + 2-3 sentences of prose
    rejected:
      - Other heading levels (H2, H3) — Specification explicitly requires H1 (#) as title
      - Multiple paragraphs — Spec requires 2-3 sentences; 44+ precedent files follow this
      - Complex markdown features (lists, code blocks, tables) — Test files use simple prose only
    rationale: >
      The specification and all 44+ precedent test files establish a consistent, minimal
      markdown structure: exactly one H1 heading followed by a blank line and 2-3 sentences
      of substantive prose. This simple format is sufficient for test file purpose and
      ensures consistency across the test suite. File size naturally falls within the 400-600
      byte range specified.

  - title: Script Execution Pattern
    chosen: Standalone Python script (create_markdown.py pattern)
    rejected:
      - Integration into agent flow (crewai agents) — Unnecessary complexity; file creation
        is a simple task best implemented as standalone script
      - Creating a new Python module in src/sheep — Would add to the codebase; creates
        a one-off file not shared with other features
    rationale: >
      The project establishes a proven pattern in create_markdown.py: a simple, standalone
      script that creates the markdown file, prints success message, and exits. This approach
      is easy to understand, maintain, and test. The script can be executed directly and
      integrates with existing git tools for staging, committing, and pushing. This pattern
      is used in all 50+ similar features (commits #122-#130+).

