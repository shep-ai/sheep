content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-3pz04c.md) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  This is the 129th iteration of the markdown file creation feature pattern, continuing a series of identical test features (125-128) that serve as minimal, testable units of work for the automated implementation system. Over 100 similar test files already exist in the repository root directory as precedents.

  ## Success Criteria

  - [ ] File test-3pz04c.md is created in repository root directory
  - [ ] File contains exactly one markdown level-1 heading (# format) with a meaningful title
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] Blank line separates heading from prose content
  - [ ] File is UTF-8 encoded without byte-order mark (BOM)
  - [ ] File uses LF (Unix) line endings, not CRLF
  - [ ] File size is approximately 400-600 bytes (consistent with features 125-128)
  - [ ] Git commit created with conventional message: "feat(129): Create markdown file test-3pz04c.md"
  - [ ] Commit is pushed to remote on feature branch feat/129-markdown-file-create-f1300c
  - [ ] Repository shows clean working tree after push
  - [ ] Prose content is coherent and grammatically correct
  - [ ] Markdown syntax is valid per CommonMark specification

  ## Functional Requirements

  - **FR-1: File Creation** — The system must create a markdown file named exactly "test-3pz04c.md" in the repository root directory
  - **FR-2: H1 Heading Requirement** — The file must contain exactly one markdown level-1 heading (`# Title`) at the top of the file with a meaningful, descriptive title
  - **FR-3: Prose Content** — The file must contain exactly 2-3 complete, grammatically correct sentences of prose following the heading
  - **FR-4: Content Separation** — The file must include one blank line between the H1 heading and the prose content
  - **FR-5: Character Encoding** — The file must be encoded as UTF-8 without a byte-order mark (BOM)
  - **FR-6: Line Endings** — The file must use Unix-style LF line endings (not CRLF or CR)
  - **FR-7: Git Commit Creation** — A git commit must be created with the conventional message format: "feat(129): Create markdown file test-3pz04c.md"
  - **FR-8: Git Push** — The commit must be pushed to the remote repository on the feature branch "feat/129-markdown-file-create-f1300c" with upstream tracking enabled (-u origin)
  - **FR-9: Repository Cleanliness** — After completion, the repository must show a clean working tree with no uncommitted changes

  ## Non-Functional Requirements

  - **NFR-1: File Size** — The file must be approximately 400-600 bytes in size, consistent with related features 125-128 to maintain precedent patterns
  - **NFR-2: Markdown Validity** — All markdown syntax must be valid according to the CommonMark specification (https://commonmark.org/)
  - **NFR-3: Content Quality** — Prose content must be coherent, well-formed, and free of grammatical errors; suitable for a test markdown file in an automated implementation test suite
  - **NFR-4: Conventional Commit Compliance** — The git commit message must strictly follow the Conventional Commits specification (https://www.conventionalcommits.org/) with scope "(129)" and type "feat"
  - **NFR-5: Implementation Consistency** — Implementation must follow the established pattern demonstrated by features 125-128 using Python pathlib.Path and standard git commands

  ## Product Questions & AI Recommendations

  **No open product questions identified.** This feature is fully constrained by:

  1. **Established Pattern** — 100+ identical test markdown files and recent features (125-128) provide a complete, proven pattern for file format, structure, naming, and git workflow
  2. **Explicit Success Criteria** — All measurable requirements are defined in the success criteria above
  3. **Flexible Content Topic** — The user query explicitly states "about anything", giving complete freedom in prose topic selection
  4. **Standardized Git Workflow** — Conventional commits and remote push procedures are well-established organizational standards
  5. **No Architectural Decisions** — This is pure file creation with no design choices regarding system behavior, performance trade-offs, or architectural direction

  All requirements flow directly from the established precedent pattern and success criteria; no additional product input is needed before implementation can proceed.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Only adds one new markdown file to the existing collection of 100+ test files; no modifications to existing files or directory structure |
  | File System | Low | Single file creation operation (~400-600 bytes); no directory structure changes, no deletions or overwrites |
  | Git Repository | Low | Standard single atomic commit and push following established pattern from features 125-128; no branch/merge complexity, no destructive operations |
  | Specs Directory | Low | Feature spec (spec.yaml) already exists in /specs/129-markdown-file-create-f1300c/; implementation does not modify spec files |
  | Source Code | None | Feature is purely file creation; does not depend on or interact with any source code in /src/sheep/, application code, or build systems |
  | Build/Test Systems | None | No code changes; no impact on Python package, build systems, test runners, or CI/CD pipelines |
  | Documentation | None | Creates a standalone markdown test file; does not modify README.md, project documentation, or reference materials |

  ## Dependencies

  **External Dependencies:** None. This is a pure file creation task with no external package or service dependencies.

  **Existing Code Dependencies:** None. The feature does not depend on or interact with any existing Python modules, application code, or external libraries. It uses only Python standard library (pathlib).

  **Infrastructure Dependencies:**
  - Git repository (already initialized and configured)
  - File system write access to repository root directory (required for any feature branch)
  - Remote repository (already configured via git remote origin)
  - Git configuration with user.name and user.email (required for commits)

  **Existing Files as Reference:**
  - 100+ test markdown files (test-*.md) at repository root serve as precedents for format and structure
  - create_markdown.py script provides reference implementation pattern
  - Feature 128 (test-zihquv.md) is the most recent identical feature for comparison
  - specs/128-markdown-file-create-e85bb7/spec.yaml shows completed spec structure

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — This is a minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (write one markdown H1 heading + 2-3 sentences of prose with appropriate topic)
  - **Validation**: ~3 minutes (verify markdown syntax, UTF-8 encoding, LF line endings, file size 400-600 bytes, content structure)
  - **Git workflow**: ~2-5 minutes (stage file with `git add`, commit with conventional message, push to remote with `-u origin` flag)
  - **Total estimate**: 10-15 minutes of actual work

  **Justification**:
  - Well-established pattern with 100+ identical test files providing clear precedent and reference implementations
  - Flexible topic selection with no research, architectural decisions, or algorithmic work needed
  - Single file with minimal, well-understood content format (one H1 heading + 2-3 sentences)
  - No testing, code review, documentation, or configuration changes required
  - Recent feature implementations (125-128) demonstrate efficient, consistent execution of identical features
  - No external dependencies or complex environment setup required (git + Python standard library only)
  - Spec structure and requirements already established by pattern (125-128)

  ---

  _Requirements phase complete — functional and non-functional requirements formalized, success criteria validated, product questions assessed (none needed), implementation ready to proceed_
