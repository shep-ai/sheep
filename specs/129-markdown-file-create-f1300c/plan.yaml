content: |
  ## Architecture Overview

  Feature 129 follows the exact pattern established by features 125-128. The
  implementation creates a markdown file, validates all properties, and integrates
  with git for commit and push operations.

  **Implementation Structure:**
  - Phase 1 (File Creation & Validation): Creates test-3pz04c.md using pathlib.Path
    and validates all properties match the success criteria
  - Phase 2 (Git Integration): Uses subprocess to stage, commit, and push the file

  **No Architectural Changes:** This feature does not modify application code,
  build systems, or infrastructure. It is a pure file creation task that fits
  completely outside the source code tree. The pattern is proven by 100+ existing
  test files and recent features 125-128.

  **Integration with Existing System:** The implementation uses:
  - Git repository (already initialized and configured)
  - File system (repository root writable)
  - Remote origin (already configured)
  - Git configuration (user.name, user.email already set)

  No new infrastructure or configuration is required.

  ## Key Design Decisions

  ### 1. File Creation Method: pathlib.Path.write_text()

  - **Decision:** Use Python pathlib.Path.write_text() with explicit UTF-8 encoding
  - **Rationale:** Modern Python standard library approach, automatic file closing,
    explicit encoding control, no external dependencies, matches established pattern
    (features 125-128)
  - **Alternatives Rejected:**
    - Bash echo command — platform-dependent line endings, harder to control encoding
    - Python os.write() — manual file handle management, more error-prone
    - Manual open() context manager — more verbose, no advantage for single write

  ### 2. Prose Content Strategy: Hardcoded Topic-Specific Content

  - **Decision:** Hardcoded H1 heading + 2-3 sentences of coherent prose
  - **Rationale:** Spec allows "about anything", hardcoding simplifies implementation,
    matches pattern (125-128), deterministic output, no external dependencies
  - **Alternatives Rejected:**
    - Template-based prose — unnecessary complexity for single-use feature
    - AI-generated content — latency, non-determinism, external dependency
    - Lorem ipsum — unprofessional, inconsistent with 100+ existing test files

  ### 3. Line Ending Management: Unix LF via Python Text Mode

  - **Decision:** Python text mode write_text() naturally produces LF on Unix systems
  - **Rationale:** Feature runs on Linux platform; Python text mode is guaranteed to
    produce LF. Matches established pattern (125-128)
  - **Alternatives Rejected:**
    - Platform defaults — would produce CRLF on Windows, violating FR-6
    - Post-creation conversion — inefficient two-pass approach
    - Binary mode conversion — error-prone and verbose

  ### 4. Git Workflow: subprocess.run() with Standard Library

  - **Decision:** Use subprocess.run() for 'git add', 'git commit --no-verify', 'git push -u origin HEAD'
  - **Rationale:** Standard library, safe argument handling (no shell injection),
    --no-verify skips pre-commit hooks as required, matches pattern (125-128)
  - **Alternatives Rejected:**
    - GitPython library — external dependency, unnecessary abstraction
    - Shell string execution — less safe, harder to handle errors
    - Pre-commit hook integration — would conflict with --no-verify requirement

  ### 5. Validation Strategy: In-Script Checks Before Commit

  - **Decision:** Validate file properties (encoding, line endings, size, structure)
    before committing to git
  - **Rationale:** Reference implementations (125-128) validate before commit,
    provides immediate feedback, prevents invalid files in repository, ensures all
    success criteria met
  - **Validation Checks:**
    - No UTF-8 BOM present
    - No CRLF line endings (LF only)
    - File size 350-650 bytes
    - Exactly one H1 heading
    - 2-3 sentences of prose
    - Blank line between heading and prose

  ### 6. Character Encoding: UTF-8 Without BOM

  - **Decision:** UTF-8 encoding without byte-order mark
  - **Rationale:** FR-5 requirement, CommonMark standard, Python write_text(encoding='utf-8')
    automatically produces BOM-free UTF-8
  - **Alternatives Rejected:**
    - UTF-16 — incompatible with CommonMark, overly complex
    - ASCII-only — artificially limiting
    - UTF-8 with BOM — violates FR-5 requirement

  ### 7. File Size Target: Natural Prose (400-600 bytes)

  - **Decision:** Natural prose generation targeting 2-3 sentences yields ~400-600 bytes
  - **Rationale:** Spec allows 'approximately 400-600 bytes'; H1 heading (~30 bytes) +
    3 sentences (~150 bytes each) = ~500 bytes naturally, no padding needed
  - **Alternatives Rejected:**
    - Exact byte padding — artificial, fragile, violates spec's 'approximately'
    - Variable prose length — inconsistent with precedent (125-128)

  ## Implementation Strategy

  **Phase 1: File Creation & Validation**
  - Create test-3pz04c.md in repository root using pathlib.Path.write_text()
  - Content: H1 heading + blank line + 2-3 sentences of prose
  - Validate: encoding (UTF-8, no BOM), line endings (LF only), size (350-650 bytes),
    structure (H1 heading present, sentence count 2-3, blank line separator)
  - Do NOT proceed to Phase 2 until all validations pass

  **Phase 2: Git Integration & Remote Push**
  - Stage file: git add test-3pz04c.md
  - Commit: git commit --no-verify -m "feat(129): Create markdown file test-3pz04c.md"
  - Push: git push -u origin HEAD
  - Verify: repository shows clean working tree after push

  **Ordering Rationale:**
  Phase 1 must complete before Phase 2 because:
  1. File must exist and be validated before git staging
  2. Git operations depend on file already being in working tree
  3. Validation catches issues early, preventing invalid commits

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | **Encoding issues (UTF-8 with BOM)** | Use pathlib.Path.write_text(encoding='utf-8') which never adds BOM unless explicitly requested. Validate with: `content.startswith('\\ufeff')` to detect BOM if present. |
  | **Line ending issues (CRLF instead of LF)** | Python text mode on Unix naturally produces LF. Validate with: `'\\r' not in content` to detect CRLF. |
  | **File size out of range** | Calculate file size in bytes: `len(content.encode('utf-8'))`. Validate 350 <= size <= 650. |
  | **Structure validation failure** | Check for H1 heading with `content.startswith('#')`, verify blank line after heading, count sentences by splitting on `. ` and verifying 2-3 sentences. |
  | **Git push failure (network, auth, etc.)** | Use subprocess.run(..., check=True) to raise CalledProcessError on non-zero exit. Fail fast with clear error message for investigation. |
  | **Pre-commit hook interference** | Use --no-verify flag on 'git commit' to skip hooks. This is intentional and required by feature spec (matches features 125-128). |
  | **Incorrect conventional commit message** | Hardcode message format: "feat(129): Create markdown file test-3pz04c.md". Validate message structure after commit using 'git log' if needed. |
  | **Repository state issues (uncommitted changes blocking push)** | Validation ensures file is properly staged and committed before push. Verify working tree is clean after push with 'git status'. |

  ## Files Created & Modified

  **Files Created:**
  - test-3pz04c.md (markdown file in repository root)

  **Files Modified:**
  - None

  **Specification Files (Already Exist):**
  - specs/129-markdown-file-create-f1300c/spec.yaml (requirement specification)
  - specs/129-markdown-file-create-f1300c/research.yaml (research findings)

  ## Conclusion

  Feature 129 implementation follows the proven pattern from features 125-128. No new
  architectural decisions are needed; all design choices flow from the established
  precedent pattern. The implementation is straightforward:

  1. Create file with pathlib.Path.write_text()
  2. Validate all properties before commit
  3. Commit and push with git subprocess operations

  No external dependencies, no code changes to application, no infrastructure changes.
  Ready to proceed to task breakdown and implementation.
