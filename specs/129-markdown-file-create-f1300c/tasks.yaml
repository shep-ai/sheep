content: |
  ## Summary

  Feature 129 implementation consists of 4 focused tasks across 2 phases:

  **Phase 1: File Creation & Validation (Tasks 1-2)**
  - Task 1 creates the markdown file test-3pz04c.md with proper content structure
    and encoding using pathlib.Path.write_text()
  - Task 2 validates all properties (structure, encoding, line endings, size) before
    proceeding to git integration

  **Phase 2: Git Integration & Remote Push (Tasks 3-4)**
  - Task 3 stages the file and creates a commit with conventional message format
    using subprocess.run() for git operations
  - Task 4 pushes the commit to remote with upstream tracking and verifies
    repository cleanliness

  This sequential approach ensures:

  1. File creation comes first (prerequisite for all downstream work)
  2. Validation passes before git integration (prevents invalid commits)
  3. Commit happens before push (standard git workflow)
  4. All success criteria verified after push completes (complete feature validation)

  ## Implementation Notes

  **No External Dependencies:**
  - All work uses Python standard library (pathlib, subprocess)
  - Git CLI is pre-installed on Linux platform
  - No package installations or setup required

  **Pattern Consistency:**
  - Follows exact pattern from features 125-128
  - Validation approach matches reference implementations
  - Git workflow uses proven --no-verify flag approach

  **Content Topic (Task 1):**
  The prose content can be about any topic (software, nature, learning, business, etc.).
  Examples that fit in 2-3 sentences:
  - "The Moon: Earth's natural satellite has fascinated humans for millennia. It
    influences ocean tides and provides light at night. Many cultures have myths
    and legends about the Moon."
  - "Markdown: A lightweight markup language for formatting text with simple syntax.
    It's widely used in documentation, READMEs, and technical writing. Many developers
    prefer Markdown for its simplicity and readability."

  **Git Integration (Tasks 3-4):**
  Tasks use subprocess.run() with explicit argument arrays (no shell strings) to
  safely execute git commands. The --no-verify flag is essential to skip pre-commit
  hooks as required by feature specification. Push is atomic: either succeeds
  completely or fails with an exception for investigation.

  ## Validation Strategy (Task 2)

  Validation before commit prevents invalid files in repository. Key checks:
  - Encoding: File is readable as UTF-8, no BOM detected
  - Line endings: Only LF (\\n), no CRLF (\\r\\n)
  - Structure: H1 heading at start, blank line after, sentences follow
  - Size: File is 350-650 bytes (accounts for heading, blank line, prose)
  - Content: 2-3 sentences, grammatically correct (enforced by hardcoding)

  ## Total Effort

  Estimated 55 minutes of implementation work:
  - Task 1 (file creation): 20 minutes
  - Task 2 (validation): 15 minutes
  - Task 3 (git commit): 10 minutes
  - Task 4 (git push): 10 minutes

  This aligns with feature spec estimate of S (Small, 10-15 minutes of actual work).
  The additional time accounts for test-driven development cycles (RED-GREEN-REFACTOR),
  error handling, and comprehensive validation.
