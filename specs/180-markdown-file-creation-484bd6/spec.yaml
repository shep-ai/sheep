content: |
  ## Problem Statement

  The Sheep automated implementation platform requires the ability to create simple test markdown files following an established pattern. This feature creates a single test markdown file (test-hylnjg.md) at the repository root with a title and prose content, demonstrating automated file creation, git integration, and conventional commit workflows.

  The feature serves as a minimal, testable unit of work for the automated implementation system, with 179+ similar test files already existing in the repository as precedents (features 001-179, plus 100+ legacy test-*.md files at the root directory). This is a direct continuation of the markdown-file-creation pattern established in features 001+, with identical requirements and implementation approach.

  ## Success Criteria

  - [ ] File `test-hylnjg.md` is created in the repository root directory
  - [ ] File contains a valid markdown heading (single `#` with title text)
  - [ ] File contains exactly 2-3 sentences of prose content following the heading
  - [ ] File uses UTF-8 encoding with no byte order mark (BOM)
  - [ ] File uses LF (Unix-style) line endings
  - [ ] File size is within 300-800 byte range (typical for established pattern)
  - [ ] File is staged in git (verified with `git status` or `git diff --cached`)
  - [ ] Commit message follows conventional format: `feat(180): create markdown file test-hylnjg.md with prose content`
  - [ ] Commit is authored with proper git user configuration (user.name and user.email)
  - [ ] Changes are pushed to feature branch `feat/180-markdown-file-creation-484bd6`
  - [ ] Markdown syntax is valid (heading followed by prose without syntax errors)
  - [ ] Prose is grammatically correct and coherent

  ## Functional Requirements

  - **FR-1**: Create a markdown file named `test-hylnjg.md` at the repository root directory
  - **FR-2**: File must contain a markdown level-1 heading (`# Heading Text`) as the title
  - **FR-3**: File must contain exactly 2 or 3 sentences of prose content (not 1, not 4+)
  - **FR-4**: Implementation must use Python `pathlib.Path` for file creation and writing
  - **FR-5**: File must be written with UTF-8 encoding (standard: no BOM)
  - **FR-6**: File must use LF (line feed) line endings, not CRLF or CR
  - **FR-7**: Stage the created file in git using standard `git add` workflow
  - **FR-8**: Create a git commit with message format: `feat(180): create markdown file test-hylnjg.md with prose content`
  - **FR-9**: Push the commit to the remote feature branch `feat/180-markdown-file-creation-484bd6`
  - **FR-10**: Prose content may be about any topic (user specifies \"about anything\")
  - **FR-11**: No modifications to source code, tests, configuration files, or any files outside the repository root

  ## Non-Functional Requirements

  - **NFR-1** — File Size: Target file size 300-800 bytes; typical range is 400-600 bytes based on prose length and topic
  - **NFR-2** — Implementation Time: Must complete within 10-15 minutes (small, focused task with no research needed)
  - **NFR-3** — Pattern Consistency: Implementation must follow established pattern from features 001-179 (same structure, same workflow, same approach)
  - **NFR-4** — Code Simplicity: Implementation must be straightforward imperative code (create content string → write to file) with no unnecessary abstraction
  - **NFR-5** — Scope Isolation: Feature touches only repository root; zero impact on `/src/sheep/` application code, tests, or configurations
  - **NFR-6** — Prose Quality: Content must be grammatically coherent and syntactically correct English
  - **NFR-7** — Git Hygiene: Commit must be clean (single file change, no merge conflicts, no unrelated changes)
  - **NFR-8** — Reproducibility: Implementation approach must be reproducible and match the 179+ test file precedents already in the repository

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ------------------- | --------- |
  | 1 | Should markdown content be generated using content_generators.py module (LLM) or inline hardcoded prose? | Use content_generators.py module (LLM-generated) | Maintains consistency with 179+ prior features, reuses proven shared infrastructure, ensures reproducibility and pattern alignment. LLM generation provides content variety and follows established architectural approach. |

  ## Codebase Analysis

  ### Project Structure

  The Sheep repository is organized as follows:

  - **Repository Root**: Contains 179+ test markdown files (test-*.md) following a consistent pattern from features 001-179, plus legacy test files; also contains design pattern and state machine documentation files
  - **src/sheep/**: Application source code with agents, config, flows, observability, tools, and feature implementations
  - **specs/**: Feature specification directory with subdirectories for each feature number
  - **tests/**: Test suite for the Sheep platform application
  - **.github/**: GitHub Actions workflows and CI/CD configuration
  - **pyproject.toml**: Python project configuration
  - **docker-compose.yml**: Docker Compose configuration for local development
  - **Dockerfile**: Container image definition

  The test markdown files at the repository root are artifacts of the markdown-file-creation feature pattern and do not form part of the application source code.

  ### Architecture Patterns

  **Established File Creation Pattern** (179+ precedents from features 001-179):
  - Simple file creation using Python pathlib: `pathlib.Path(filename).write_text(content, encoding='utf-8')`
  - Each markdown file structure: `# Heading\n\n<2-3 sentences of prose>`
  - UTF-8 encoding (no BOM), LF line endings
  - File size typically 400-600 bytes (acceptable range 300-800 bytes)
  - Straightforward imperative code with no unnecessary abstraction
  - Files named with pattern test-*.md where * is a random identifier

  **Shared Content Generator Module** (src/sheep/content_generators.py):
  - `generate_markdown_content()`: Uses LLM to generate markdown with H1 heading and 2-3 sentences
  - `write_markdown_file()`: Writes content to disk with UTF-8 encoding and safety checks
  - `validate_markdown_file()`: Validates markdown syntax, encoding, line endings, and sentence count
  - `commit_markdown_file()`: Stages and commits file with conventional commit messages
  - `push_markdown_file()`: Pushes changes to remote repository
  - `create_markdown_file()`: Orchestrates complete workflow

  **Git Workflow Pattern** (consistent across features 001-179):
  - Create file in repository root with pathlib
  - Stage with git add via GitCommitTool
  - Commit with conventional format: `feat(180): create markdown file test-hylnjg.md with prose content`
  - Push to feature branch via GitPushTool with upstream tracking
  - No modifications to source code or application infrastructure

  ### Relevant Technologies

  - **Python 3.11+**: pathlib is stable standard library module
  - **pathlib**: Cross-platform file I/O operations with explicit UTF-8 encoding
  - **Git**: Version control, staging, commits, and branch operations
  - **Markdown**: Simple format with heading and prose content; CommonMark compliant
  - **CrewAI**: Agentic framework underlying the Sheep platform (not directly used in file creation features)
  - **Claude LLM API**: Used by content_generators to generate prose

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | Repository Root Directory | Low | Adds one new markdown file to existing collection of 179+ test files; no modifications to existing files |
  | File System | Low | Single file creation operation (~300-800 bytes); no directory structure changes |
  | Git Repository | Low | Standard single commit and push following established pattern; no branch/merge complexity |
  | Source Code | None | Feature is purely file creation; does not impact any source code in /src/sheep/ |

  ## Dependencies

  - **Git repository**: Feature branch `feat/180-markdown-file-creation-484bd6` must exist and be checked out (pre-created)
  - **File system**: Write access to repository root directory
  - **Established pattern**: 179+ test files from features 001-179 provide clear precedent
  - **Git configuration**: Standard git configuration (user.name, user.email) must be set up for commits
  - **Python standard library**: pathlib and subprocess available in Python 3.11+
  - **Content generator module**: src/sheep/content_generators.py provides reusable utilities
  - **Shared tools**: GitCommitTool and GitPushTool available in src/sheep/tools/

  ## Size Estimate

  **S** (Small — approximately 10-15 minutes) — Minimal-effort, single-file creation feature:

  - **File creation**: ~5 minutes (leverage existing content_generators module)
  - **Validation**: ~2-3 minutes (verify markdown syntax, encoding, line endings, file size)
  - **Git workflow**: ~3-5 minutes (stage, commit with conventional message, push to branch)
  - **Total estimate**: 10-15 minutes

  **Justification**:
  - Well-established pattern with 179+ identical test files providing clear precedent
  - No research or architectural decisions needed
  - Single file with minimal, well-understood content format
  - Reusable content_generators module and feature pattern eliminate boilerplate
  - No testing, documentation, or configuration changes required
  - Recent features (174-179) demonstrate efficient 10-15 minute implementation
  - Pattern is fully validated and tested across 179+ prior features

