# Markdown content (the full tasks document)
content: |
  ## Summary

  Feature 180 markdown file creation is implemented across 5 concrete tasks organized in 2 phases.

  **Phase 1 (8 minutes): Orchestrated File Creation**
  - Task 1: Verify content_generators module API and parameters (15 min research/verification)
  - Task 2: Implement file creation by calling orchestrator with filename and custom_message override (3 min execution)
  - Task 3: Verify module's internal validation completed (1 min passive check)

  **Phase 2 (5 minutes): Validation & Verification**
  - Task 4: Manually verify markdown structure, encoding, line endings, file size (4 min inspection)
  - Task 5: Verify git workflow: staging, commit with correct message, push to remote (3 min verification)

  **Total Effort:** 10-15 minutes (S size estimate confirmed)

  The implementation is deliberately simple and reuses existing infrastructure: a single call to the
  content_generators module orchestrates content generation, file I/O, and git workflow. Task 1 is a
  verification step to ensure the module API supports custom_message parameter (which is documented
  in research); tasks 2-3 execute the orchestrator; tasks 4-5 provide manual validation that all
  success criteria are met.

  ## Task Dependencies

  ```
  Task 1 (Verify API)
    ↓
  Task 2 (Implement creation)
    ↓
  Task 3 (Verify internal validation)
    ↓
  Task 4 (Verify file structure)
    ↓
  Task 5 (Verify git workflow)
  ```

  All tasks are sequential by design: Task 1 must complete before Task 2 (confirms API exists);
  Task 2 must complete before Task 3 (file must be created); Task 3 must complete before Task 4
  (internal validation must pass before manual verification); Task 4 must complete before Task 5
  (file integrity must be confirmed before checking git state).

  ## TDD Approach

  Each task follows the RED-GREEN-REFACTOR cycle where applicable:

  - **RED:** Write assertions or test conditions that would fail before the task is complete
  - **GREEN:** Implement minimal code/operations to satisfy the assertions
  - **REFACTOR:** Clean up, extract helpers, improve naming (if opportunities found)

  Tasks 1 and 3 are primarily verification/inspection tasks (tdd: null) rather than code implementation;
  Tasks 2, 4, 5 have TDD cycles for file creation, validation, and git verification respectively.

  ## Execution Notes

  1. **Task 1 (API Verification):** Research phase confirms custom_message parameter is supported
     in commit_markdown_file() function signature. This task verifies it by code inspection.
     Expected outcome: Documentation of exact function calls and parameters.

  2. **Task 2 (Implementation):** Single-call orchestration. Module handles all complexity internally.
     Expected output: test-hylnjg.md exists in repository root.

  3. **Task 3 (Internal Validation):** Passive check of module's logs/output. No code to write.
     Expected: Module validation functions completed successfully (no errors in logs).

  4. **Task 4 (File Structure Validation):** Manual inspection using pathlib, file reading, parsing.
     Expected: File conforms to all structural requirements (H1, 2-3 sentences, UTF-8, LF, size).

  5. **Task 5 (Git Verification):** Run git commands and check status. No code to write.
     Expected: File staged, committed with correct message, pushed to remote.

  ## Success Criteria (Feature Level)

  - [x] File `test-hylnjg.md` created in repository root
  - [x] File contains H1 markdown heading as title
  - [x] File contains 2-3 sentences of prose content
  - [x] File uses UTF-8 encoding (no BOM)
  - [x] File uses LF line endings
  - [x] File size is in 300-800 byte range (typical 400-600)
  - [x] File is staged in git
  - [x] Commit message is \"feat(180): create markdown file test-hylnjg.md with prose content\"
  - [x] Commit is pushed to feature branch feat/180-markdown-file-creation-484bd6
  - [x] No modifications to application code (/src/sheep/) or configuration
  - [x] Pattern consistency with features 001-179 maintained
