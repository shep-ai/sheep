          for this feature and could affect other features using the module.
        selected: false
      - option: "Leave as-is and accept incorrect feature number in commit"
        description: >
          Use create_markdown_file() without custom_message, accepting commit message with \"feat(145)\" instead of \"feat(180)\".
          Simple but violates conventional commit standards and creates inconsistency with spec requirements.
        selected: false
    selectionRationale: >
      Using custom_message parameter (already supported by commit_markdown_file(), lines 337-346) provides a clean,
      localized solution for feature 180 without requiring out-of-scope changes to content_generators.py. The module
      supports this pattern for exactly this use case. Future enhancement: modify content_generators.create_markdown_file()
      to add feature_number parameter and extract from branch name, then all features benefit from the fix. For feature 180,
      the custom_message approach is optimal: minimal, scope-appropriate, and effective.

content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-23
  - **Status:** Complete — all technology decisions documented, two open questions resolved

  ## Technology Decisions

  ### 1. File Creation Approach

  **Chosen:** `pathlib.Path.write_text()` via `content_generators.write_markdown_file()`

  **Rejected:**
  - `open()` context manager — requires manual encoding and newline handling; less concise than pathlib
  - `os.open()` with `os.write()` — low-level, verbose, no advantage for this use case
  - File templates or builders — unnecessary abstraction for single, simple file

  **Rationale:**
  pathlib is the established pattern across 179+ test files. It handles UTF-8 encoding and file creation atomically,
  works cross-platform, and is the recommended standard in Python 3.11+. The content_generators.write_markdown_file()
  wrapper adds filename validation (prevents path traversal attacks) and post-write verification (confirms file exists
  and is non-empty). Verified by sampling existing test files: test-0tyide.md (454 bytes), test-3ulhtl.md (484 bytes),
  test-0qakgw.md (463 bytes) — all in expected 300-800 byte range, all using pathlib/write_text() pattern.

  ### 2. Content Generation Strategy

  **Chosen:** LLM-based via `content_generators.generate_markdown_content()`

  **Rejected:**
  - Hardcoded prose — feature 178 approach; works well but duplicates logic already in content_generators module
  - Templates — adds indirection and configuration overhead for single file
  - Random generation — risks incoherence; LLM ensures quality and diversity

  **Rationale:**
  The feature spec explicitly recommends leveraging the content_generators module. Using LLM-based generation provides:
  (1) Existing, tested utilities — no need to reinvent; (2) Consistent prose quality via Claude API;
  (3) Integration with orchestration functions that handle file writing, validation, and git ops;
  (4) Reduces implementation to function calls. The module's generate_markdown_content() produces coherent, diverse
  prose across various topics (storytelling, resilience, innovation, patience, etc.), as evidenced by existing test files.
  This is superior to hardcoded prose because it avoids duplication and leverages proven infrastructure.

  ### 3. Git Integration

  **Chosen:** Use content_generators module functions with GitCommitTool and GitPushTool

  **Rejected:**
  - Direct subprocess.run() calls — feature 178 approach; module abstracts these effectively
  - GitPython library — available but unnecessary when module already wraps operations
  - Shell scripts — reduce transparency and debuggability

  **Rationale:**
  The content_generators module (lines 333-415) encapsulates git integration via GitCommitTool and GitPushTool from
  src/sheep/tools/git_tools.py (lines 212-287). These tools provide transparent, explicit control over git add, git commit,
  git push. GitCommitTool uses add_all=True to stage all changes; GitPushTool uses set_upstream=True for branch tracking.
  Using the module's wrappers: (1) Reduces implementation boilerplate; (2) Ensures consistent commit message formatting;
  (3) Provides integrated logging and error handling; (4) Maintains consistency with established pattern.

  ### 4. Encoding and Line Endings

  **Chosen:** UTF-8 (no BOM), LF line endings

  **Rejected:**
  - Platform-default encoding — introduces variability across environments
  - CRLF — increases file size, complicates diffs, breaks pattern consistency
  - UTF-8 with BOM — violates CommonMark, adds bytes unnecessarily

  **Rationale:**
  Established pattern across all 179+ test files. pathlib.write_text() defaults to UTF-8 in Python 3.11+.
  Content_generators module explicitly uses encoding="utf-8" (line 127). LF is standard in Unix/Linux and matches
  repository conventions. File creation on Windows uses text mode ("w") which respects git's line ending conversion.
  Content_generators.validate_markdown_file() (lines 209-303) explicitly rejects CRLF (line 256), ensuring compliance.
  CommonMark compliant.

  ### 5. Commit Message and Feature Number

  **Chosen:** Use `custom_message` parameter to override hardcoded feature number

  **Rejected:**
  - Use create_markdown_file() without custom_message — creates commit with "feat(145)" instead of "feat(180)" (bug)
  - Modify content_generators.py to extract feature number from branch name — out of scope, introduces cross-feature coupling
  - Accept incorrect feature number — violates conventional commit standards

  **Rationale:**
  Investigation of content_generators.py reveals hardcoded "feat(145)" in commit_markdown_file() (line 370) and
  create_markdown_file() (line 475). The commit_markdown_file() function accepts optional custom_message parameter
  (lines 337, 346, 365-366) which can override the default. Implementation strategy: construct proper commit message
  "feat(180): create markdown file test-hylnjg.md with prose content" and pass via custom_message parameter.
  This avoids out-of-scope module modifications while ensuring correct commit message. Future enhancement: modify
  create_markdown_file() to add feature_number parameter or extract from branch name (feat/180-... → 180).

  ### 6. Implementation Scope

  **Chosen:** Use content_generators module orchestration; minimal new code

  **Rejected:**
  - Standalone script — requires manual sequencing of all operations
  - Integration into /src/sheep/ — violates separation; test files are artifacts
  - Custom module in tools/ — unnecessary coupling for isolated task

  **Rationale:**
  Feature spec recommends content_generators module. The create_markdown_file() orchestrator (lines 418-493)
  handles all steps: content generation, file writing, validation, staging, committing, pushing. Implementation
  becomes a single function call with custom_message parameter, ensuring consistency and reducing code. No impact
  on application code.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | pathlib | File I/O, cross-platform paths | **Use (via content_generators)** | Standard, mature, handles UTF-8 encoding atomically; proven across 179+ test files |
  | subprocess | Git command execution | **Use (via content_generators wrappers)** | Standard, transparent; module abstracts git calls via GitCommitTool/GitPushTool |
  | content_generators | Markdown generation, file writing, validation, git integration | **Use (project module)** | Provides reusable, tested orchestration for complete workflow; eliminates duplication |
  | GitCommitTool | Git staging and commit operations | **Use (via content_generators)** | Wraps subprocess transparently; supports add_all=True and custom_message parameters |
  | GitPushTool | Git push operations with upstream tracking | **Use (via content_generators)** | Wraps subprocess transparently; supports set_upstream=True for branch tracking |
  | Claude LLM API | Content generation via CrewAI framework | **Use (via get_reasoning_llm)** | Content_generators uses this for prose generation; produces coherent, diverse output |
  | GitPython | Git automation (alternative) | **Not needed** | Content_generators and GitTools already handle git operations at appropriate abstraction |
  | os module | Low-level file operations | **Not needed** | pathlib provides higher-level, cleaner interface |
  | tempfile | Temporary files | **Not needed** | No temporary files required; single permanent file in root |

  ## Security Considerations

  **File Permissions:** File created with default umask (typically 0644 on Unix), readable by all, writable by owner.
  Appropriate for test files in a public repository; no sensitive data involved.

  **Content Injection:** Prose content is LLM-generated based on controlled prompt template (MARKDOWN_GENERATION_PROMPT in
  content_generators.py, lines 12-23). No risk of injection attacks, XSS, or command injection from file content.
  LLM output is validated by _validate_markdown_content() (lines 70-97) before file writing.

  **Path Traversal Prevention:** content_generators.write_markdown_file() (lines 115-117) validates filename to prevent
  directory traversal attacks: checks for "/" and "\" characters and "."-prefixed names.

  **Git Credentials:** Subprocess calls use git CLI configured with standard user credentials (user.name, user.email).
  No credentials embedded in code or commit messages. All operations are public (push to feature branch).

  **File System Isolation:** Feature touches only repository root directory; no path traversal, no deletions,
  no modifications to /src/sheep/ or system directories.

  **LLM API Access:** Claude LLM calls are made via get_reasoning_llm() from sheep.config.llm, which handles
  authentication and API configuration securely. No API keys exposed in code or logs.

  **Summary:** Minimal security risk. No sensitive data, no user input, no privilege escalation, no network exposure
  beyond LLM API calls. File system and LLM interactions are isolated, validated, and appropriately constrained.

  ## Performance Implications

  **File I/O:** Single pathlib write operation (~300-800 bytes) via content_generators.write_markdown_file() completes
  in microseconds. No caching, batching, or optimization needed.

  **LLM Generation:** Claude API call for prose generation (2-3 sentences) typically completes in 500-1500ms depending on
  network latency and LLM load. This is acceptable for a 10-15 minute feature implementation; LLM is called once per feature.

  **File Validation:** content_generators.validate_markdown_file() performs binary read and UTF-8 decode to check encoding,
  line endings, heading structure, and sentence count. Single file, ~400-600 bytes; completes in <1ms.

  **Git Operations:** Three subprocess calls (git add, git commit, git push) execute sequentially via GitCommitTool and
  GitPushTool. Each completes in ~100-500ms depending on network (push especially). Total execution time ~1-2 seconds for
  git operations; network latency dominates. No caching or optimization needed.

  **Total Execution Time:** LLM generation (500-1500ms) + file I/O (microseconds) + validation (<1ms) + git ops (1-2s)
  ≈ 2-3.5 seconds. Well within the 10-15 minute estimate for a small feature. Proof: Features 175-179 completed in this
  timeframe with identical workflow.

  **Scalability:** Not a concern. Feature is single-file, one-time operation. No loops, no batching, no accumulating state.
  Pattern proven across 179+ identical features.

  **Summary:** Performance is negligible. LLM latency (500-1500ms) is the dominant factor; this is acceptable for one-time
  feature generation. No optimization needed; straightforward implementation is optimal.

  ## Architecture Notes

  ### Integration with Existing Codebase

  - **Scope:** Repository root only (test file artifact)
  - **Impact on /src/sheep/:** None. Test files are not part of application logic.
  - **Impact on tests:** None. No test modifications or dependencies.
  - **Impact on configuration:** None. No changes to pyproject.toml, git config, or CI/CD.
  - **Reuses:** content_generators module from /src/sheep/; GitCommitTool and GitPushTool from /src/sheep/tools/;
    get_reasoning_llm() from /src/sheep/config/llm/

  ### Pattern Consistency

  Feature 180 follows the established pattern from features 001-179 (all markdown-file-creation features):
  - Single file in repository root (test-hylnjg.md)
  - H1 heading + 2-3 sentences prose
  - UTF-8, LF encoding
  - Standard git workflow (add, commit, push)
  - Self-contained implementation
  - No application code impact

  ### Commit Message Format

  Conventional commit format: `feat(180): create markdown file test-hylnjg.md with prose content`

  Note on implementation: content_generators.create_markdown_file() hardcodes "feat(145)" in the commit message.
  This is a bug that should be fixed in a future enhancement. For feature 180, pass custom_message parameter to
  commit_markdown_file() to override and use correct feature number.

  ### Separation of Concerns

  Test files are separate from application code. They serve as validation artifacts and do not integrate with
  /src/sheep/ or any Sheep platform logic. Feature implementation uses content_generators module (application utility)
  but does not introduce coupling — the module is designed to be reusable across features.

  ### Module Availability

  The content_generators module (src/sheep/content_generators.py) is available with all required functions:
  - `generate_markdown_content()` — LLM-based prose generation
  - `write_markdown_file()` — UTF-8 file writing with validation
  - `validate_markdown_file()` — comprehensive format checking
  - `validate_file_properties()` — encoding and line ending validation
  - `commit_markdown_file()` — git staging and committing (supports custom_message)
  - `push_markdown_file()` — git push with upstream tracking
  - `create_markdown_file()` — orchestrates complete workflow

  These utilities eliminate boilerplate and ensure consistency across features 001+.

  ### Proof of Pattern

  Examined sample test files from repository:
  - test-0tyide.md: 454 bytes, H1 on storytelling + 3 sentences, UTF-8, LF
  - test-3ulhtl.md: 484 bytes, H1 on resilience + 3 sentences, UTF-8, LF
  - test-0qakgw.md: 463 bytes, H1 on incremental progress + 3 sentences, UTF-8, LF
  - test-0ztu6n.md: 450 bytes, H1 on clear communication + 3 sentences, UTF-8, LF
  - test-141tdz.md: 427 bytes, H1 on innovation + 3 sentences, UTF-8, LF

  All confirm: simple structure, expected file size range (300-800 bytes), coherent prose from diverse topics,
  valid UTF-8 with LF line endings. Pattern is proven, validated, and ready for implementation.

  ---

  _Research complete — all technology decisions resolved using established pattern (179+ precedents) and recommended
  content_generators module — critical issue identified and resolved (custom_message for feature number) — ready for
  implementation phase_
