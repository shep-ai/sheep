decisions:
  - title: "File Creation Approach"
    chosen: "Python pathlib.Path.write_text() via content_generators.write_markdown_file()"
    rejected:
      - "Direct open() context manager — requires manual encoding specification and explicit newline handling; pathlib is more concise and recommended for Python 3.11+"
      - "os.open() with os.write() — lower-level, more verbose, no advantage over pathlib for this use case"
      - "File templates or builders — unnecessary abstraction for single, straightforward file"
    rationale: >
      pathlib.Path.write_text() is the established pattern across 179+ test files (features 001-179).
      It is concise, clear, and handles UTF-8 encoding and file creation atomically. Python 3.11+ (project requirement)
      has mature pathlib support, and this approach is verified across existing test files (e.g., test-0tyide.md: 454 bytes,
      test-3ulhtl.md: 484 bytes, test-0qakgw.md: 463 bytes), all in the expected 300-800 byte range.
      Leverage this proven pattern rather than introducing alternative approaches. Use content_generators.write_markdown_file()
      wrapper which adds filename validation (prevents directory traversal) and post-write verification (file exists, non-empty).

  - title: "Content Generation Strategy"
    chosen: "LLM-based via content_generators.generate_markdown_content()"
    rejected:
      - "Hardcoded prose — feature 178 approach; works well but duplicates logic already available in content_generators module"
      - "Template-based content — adds indirection and configuration overhead for single file without benefit"
      - "Random sentence generation — introduces fragility and unpredictability; existing LLM approach ensures coherence"
    rationale: >
      The feature spec explicitly documents and recommends the content_generators module approach as superior to feature 178's
      hardcoded prose. Using generate_markdown_content() provides several advantages: (1) Leverages existing, tested utilities
      in src/sheep/content_generators.py, reducing code duplication; (2) Ensures consistent prose quality via Claude LLM,
      which produces diverse, coherent topics visible in existing test files; (3) Integrates seamlessly with the
      create_markdown_file() orchestration function; (4) Validates generated content before file writing via _validate_markdown_content().
      The module is already available in the project, making this the most efficient path to implementation.

  - title: "Git Integration Method"
    chosen: "content_generators module with GitCommitTool and GitPushTool wrappers"
    rejected:
      - "Direct subprocess.run() calls — feature 178 approach; works but the content_generators module abstracts these details effectively"
      - "GitPython library — available in project dependencies but adds unnecessary abstraction when content_generators already wraps git operations"
      - "Shell script wrapper — reduces transparency and is harder to debug compared to Python subprocess via tools"
    rationale: >
      The content_generators module (commit_markdown_file and push_markdown_file functions, lines 333-415) encapsulates
      git integration using GitCommitTool and GitPushTool from src/sheep/tools/git_tools.py. These tools, defined in
      git_tools.py (lines 212-287), provide transparent, explicit control over git commands (git add, git commit, git push)
      without additional abstraction. Using the module's wrapper functions is preferable because: (1) Reduces implementation
      code to a single create_markdown_file() call; (2) Ensures consistent commit message formatting across features;
      (3) Provides logging and error handling already built into the module; (4) GitCommitTool uses add_all=True to stage
      all changes, GitPushTool uses set_upstream=True for branch tracking. The feature branch (feat/180-markdown-file-creation-484bd6)
      is pre-created, so no branch creation logic is needed.

  - title: "Encoding and Line Ending Specification"
    chosen: "UTF-8 encoding, LF (Unix) line endings, no BOM"
    rejected:
      - "Platform-default encoding — introduces variability and potential encoding mismatches across developers/CI environments"
      - "CRLF line endings — increases file size, complicates diffs, inconsistent with established test files"
      - "UTF-8 with BOM — violates CommonMark spec and established pattern; adds 3 bytes unnecessarily"
    rationale: >
      UTF-8 without BOM is the established pattern across all 179+ existing test files in the repository.
      pathlib.Path.write_text() defaults to UTF-8 in Python 3.11+ standard. The content_generators module explicitly
      specifies encoding=\"utf-8\" when writing files (line 127 of content_generators.py). LF line endings are standard
      in Unix/Linux environments and enforced by repository .gitattributes or git config. File creation on Windows uses
      text mode (\"w\") which respects git's configured line ending conversion. content_generators.validate_markdown_file()
      (lines 209-303) explicitly checks for and rejects CRLF line endings (line 256), ensuring compliance.
      This matches CommonMark compliance and ensures clean diffs without spurious whitespace changes.

  - title: "Commit Message Format and Feature Number"
    chosen: "Use custom_message parameter to override hardcoded feature number in content_generators module"
    rejected:
      - "Use create_markdown_file() without custom_message — creates commit with hardcoded \"feat(145)\" instead of \"feat(180)\" (bug in lines 370, 475)"
      - "Modify content_generators.py to extract feature number from branch name — out of scope for feature 180, introduces cross-feature coupling"
      - "Pass feature_number parameter to create_markdown_file() — requires modifying content_generators module, not yet implemented"
    rationale: >
      Investigation of content_generators.py reveals hardcoded feature number \"feat(145)\" in commit_markdown_file()
      (line 370) and create_markdown_file() (line 475). The commit_markdown_file() function accepts optional custom_message
      parameter (line 337, 346) which can override the default hardcoded message. Implementation strategy: construct proper
      commit message \"feat(180): create markdown file test-hylnjg.md with prose content\" and pass via custom_message
      parameter to commit_markdown_file(). This avoids modifying content_generators.py (out of scope) while ensuring
      correct commit message for feature 180. Alternative: extract feature number from current branch name
      (feat/180-markdown-file-creation-484bd6 → 180) and construct message dynamically — deferred to future module enhancement.

  - title: "Implementation Scope and Approach"
    chosen: "Use content_generators module orchestration; minimal new code beyond function calls"
    rejected:
      - "Standalone script implementation — feature 178 approach; requires manual sequencing of file creation, validation, and git operations"
      - "Integration into /src/sheep/ application code — violates separation of concerns; test files are artifacts, not application logic"
      - "Dedicated module in src/sheep/tools/ — creates unnecessary coupling and maintenance burden for simple, isolated task"
    rationale: >
      The create_markdown_file() function in content_generators.py (lines 418-493) orchestrates the complete workflow:
      generate content, write to disk, validate format, stage and commit, and push. This single entry point provides
      maximum code reuse, reduces implementation effort, and ensures consistency with feature patterns. The feature spec
      identifies this module as the recommended approach. Implementation becomes: call create_markdown_file() with custom_message
      parameter, verify success, done. This keeps the feature self-contained, auditable, and easy to validate without
      any impact on /src/sheep/ application code.

