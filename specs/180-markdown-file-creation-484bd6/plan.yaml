  ## Scope Isolation

  Feature is scoped to repository root only:
  - ✅ Creates single markdown file in root directory
  - ❌ Does NOT modify /src/sheep/ application code
  - ❌ Does NOT modify tests, configuration, or CI/CD
  - ❌ Does NOT create new modules or utilities
  - ❌ Does NOT introduce new dependencies beyond existing content_generators module

  This ensures clean separation: test files are artifacts, not part of application logic.

