# Markdown content (the full plan document)
content: |
  ## Architecture Overview

  Feature 180 follows the established markdown-file-creation pattern proven across 179+ prior features (001-179).
  The implementation leverages the `content_generators` module from `src/sheep/content_generators.py`, which provides
  a complete, reusable orchestration workflow:

  1. **Content Generation** — `generate_markdown_content()` calls Claude LLM to produce H1 heading + 2-3 sentences prose
  2. **File Writing** — `write_markdown_file()` writes to disk with UTF-8 encoding, LF line endings, post-write validation
  3. **Format Validation** — `validate_markdown_file()` checks markdown syntax, encoding, line endings, sentence count
  4. **Git Integration** — `commit_markdown_file()` and `push_markdown_file()` stage, commit with conventional format, push
  5. **Orchestration** — `create_markdown_file()` coordinates all steps in sequence

  The feature integrates seamlessly with the repository's existing file system (repository root) and git workflow
  (feature branch `feat/180-markdown-file-creation-484bd6` pre-created). No impact on `/src/sheep/` application code,
  tests, or configuration — test files are artifact outputs of the markdown-file-creation pattern, not part of the
  application logic.

  ## Key Design Decisions

  ### 1. Leverage Existing content_generators Module

  **Chosen:** Call `content_generators.create_markdown_file()` orchestrator with `custom_message` parameter

  **Why:** The module is already implemented, tested, and reused across 179+ identical features. Using it provides:
  - **Code Reuse** — Eliminates reimplementation of file creation, validation, and git integration
  - **Pattern Consistency** — Ensures feature 180 follows the same architecture as features 001-179
  - **Quality Assurance** — Module is proven across 179+ prior features with consistent results
  - **Reduced Implementation Effort** — Single function call replaces manual sequencing of content generation,
    file I/O, validation, and git operations

  **Alternative Rejected:** Hardcoded prose implementation (feature 178 approach) — duplicates logic, breaks consistency,
  requires more code.

  ### 2. Content Generation via Claude LLM

  **Chosen:** Use `generate_markdown_content()` for LLM-based prose generation

  **Why:** Research validates that LLM-generated content provides:
  - **Quality & Diversity** — Claude produces coherent prose across varied topics (storytelling, resilience, innovation, etc.)
  - **Consistency** — Prose quality matches or exceeds hardcoded prose approaches
  - **Validation** — Generated content is validated before file writing via `_validate_markdown_content()`
  - **No New Dependencies** — Claude API access is already available via `get_reasoning_llm()` in `src/sheep/config/llm`

  **Proof:** Sampled test files (test-0tyide.md, test-3ulhtl.md, test-0qakgw.md, etc.) show diverse, coherent topics
  with consistent quality; all generated via LLM.

  ### 3. Handle Feature Number Bug via custom_message Parameter

  **Chosen:** Pass `custom_message="feat(180): create markdown file test-hylnjg.md with prose content"` to
  `commit_markdown_file()` to override hardcoded "feat(145)" bug

  **Why:** The module has a bug (hardcoded feature number "feat(145)" in lines 370, 475), but the `commit_markdown_file()`
  function accepts an optional `custom_message` parameter (lines 337, 346, 365-366) specifically for this purpose.
  - **Scope-Appropriate** — Avoids out-of-scope modifications to `content_generators.py`
  - **Localized** — Solves the problem for feature 180 without affecting other features
  - **Intentional Design** — The `custom_message` parameter exists for exactly this use case
  - **Future-Ready** — A future enhancement can add feature_number parameter to create_markdown_file() to fix root cause

  **Alternative Rejected:** Modify `content_generators.py` to extract feature number from branch name — introduces
  cross-feature coupling and is out of scope for feature 180.

  ### 4. UTF-8 Encoding & LF Line Endings (No BOM)

  **Chosen:** Establish UTF-8 encoding (no BOM) and LF line endings per content_generators defaults and project standards

  **Why:** Research confirms this is the established pattern across all 179+ test files:
  - `pathlib.Path.write_text()` defaults to UTF-8 in Python 3.11+
  - `content_generators.write_markdown_file()` explicitly specifies `encoding="utf-8"` (line 127)
  - LF is standard in Unix/Linux environments and enforced by repository .gitattributes
  - `validate_markdown_file()` explicitly rejects CRLF (line 256), ensuring compliance
  - CommonMark compliant; no BOM interference

  **Validation:** content_generators module handles encoding/line ending validation automatically.

  ### 5. File Size Target: 300-800 Bytes (Typical: 400-600)

  **Chosen:** Follow established pattern from 179+ test files; target 400-600 bytes typical range

  **Why:** Sampled test files (test-0tyide.md: 454 bytes, test-3ulhtl.md: 484 bytes, test-0qakgw.md: 463 bytes)
  confirm this is the natural range for H1 heading + 2-3 sentences prose. LLM-generated content naturally falls
  into this range when constrained to 2-3 sentences.

  **Validation:** Post-write verification checks file size is non-empty and sensible.

  ## Implementation Strategy

  The implementation follows a two-phase approach:

  ### Phase 1: Orchestrated File Creation
  - Call `content_generators.create_markdown_file()` (or sequence of module functions) with:
    - `filename="test-hylnjg.md"`
    - `custom_message="feat(180): create markdown file test-hylnjg.md with prose content"` to override feature number bug
  - This single call orchestrates: content generation → file writing → validation → git staging → commit → push

  ### Phase 2: Validation & Verification
  - Verify file `test-hylnjg.md` exists in repository root
  - Verify markdown structure (H1 heading, 2-3 sentences, valid syntax)
  - Verify encoding (UTF-8, no BOM) and line endings (LF)
  - Verify file size is in expected range (300-800 bytes)
  - Verify git state: file is staged, committed with correct message "feat(180): ...", pushed to branch

  **Why This Order:**
  1. Phase 1 creates and validates the file using proven orchestration
  2. Phase 2 provides additional verification that all success criteria are met
  3. Phases are sequential (not parallel) to ensure file exists before verification

  ## Risk Mitigation

  | Risk | Severity | Mitigation |
  | ---- | -------- | ---------- |
  | LLM content generation fails or times out | Low | content_generators module handles retries and validation; Claude API is reliable for single prose generation (~500-1500ms typical). If API fails, clear error message and logs available. |
  | File encoding/line ending mismatch (Windows development environment) | Low | content_generators.write_markdown_file() explicitly handles encoding="utf-8"; subprocess calls respect git's configured line ending conversion. Validation checks for CRLF and rejects it. |
  | Git operations fail (no network, branch mismatch, permissions) | Low | Feature branch is pre-created. Git user config (user.name, user.email) assumed configured. GitPushTool uses set_upstream=True for automatic tracking. If git operations fail, clear error and debugging info available. |
  | Hardcoded feature number bug causes wrong commit message | Mitigated | custom_message parameter is explicitly passed to override bug. Verification step checks commit message for "feat(180)". |
  | Module not available or incompatible | Very Low | content_generators.py is part of project codebase; all functions (generate_markdown_content, write_markdown_file, validate_markdown_file, commit_markdown_file, push_markdown_file, create_markdown_file) are confirmed to exist in research phase. |
  | Markdown validation rejects generated prose | Very Low | Module's _validate_markdown_content() is tested across 179+ prior features; Claude-generated prose consistently passes validation. |

