content: |
  ## Summary

  This feature is implemented in three sequential tasks across a single phase:

  1. **Create markdown file** (5 min): Write test-fys4xe.md with pathlib.Path, using hardcoded
     prose with an implementer-selected topic. Content is a single H1 heading, blank line, and
     2-3 sentences. UTF-8 encoding and LF line endings are ensured through explicit parameters
     and literal `\n`.

  2. **Verify file meets criteria** (5 min): Manually verify the file matches all success criteria:
     correct structure, no BOM, LF line endings, proper file size (400-600 bytes), and readable
     prose.

  3. **Git operations** (5 min): Stage the file, commit with the exact conventional commit message,
     and push to the remote origin on the feature branch.

  **Why this order**: The file must exist before verification (Task 1 → Task 2). Both file creation
  and verification must be complete before git operations (Tasks 1-2 → Task 3). This is the natural,
  linear flow for this minimal feature.

  **Why single phase**: This feature is small, self-contained, and has no complex dependencies or
  architectural decisions. All work is file creation and git integration in a single, straightforward
  sequence. No parallel work is possible.

  ## Task Dependencies

  - **Task 1** (Create file): No dependencies. Can start immediately.
  - **Task 2** (Verify file): Depends on Task 1. File must exist before verification.
  - **Task 3** (Git operations): Depends on Task 2. File must be verified before committing.

  Linear dependency chain ensures work flows naturally: create → verify → commit.

  ## Effort Breakdown

  - **File creation**: 5 minutes (write heading and 2-3 sentences using pathlib)
  - **Verification**: 5 minutes (manual inspection of encoding, structure, line endings)
  - **Git workflow**: 5 minutes (add, commit, push operations)
  - **Total**: 15 minutes

  This aligns with the "S (Small)" size estimate in the feature spec, and matches implementation
  speed observed across all 75+ precedent test files (features 063-077).
