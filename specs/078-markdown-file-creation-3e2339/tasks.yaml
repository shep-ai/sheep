      - 'File contains exactly 2-3 sentences of readable, grammatically correct prose'
      - 'File is encoded as UTF-8 without BOM (Byte Order Mark)'
      - 'File uses Unix-style LF line endings (\n), not Windows CRLF'
      - 'File size naturally falls in the 400-600 byte range'
