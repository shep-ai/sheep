content: |
  ## Summary

  The implementation consists of 9 focused tasks across 2 phases:

  **Phase 1: File Creation & Formatting (Tasks 1-5)**
  - Compose markdown content with heading and prose (task-1)
  - Write file with pathlib using UTF-8 encoding (task-2)
  - Verify correct line endings (LF, not CRLF) (task-3)
  - Verify file structure and content (task-4)
  - Verify UTF-8 encoding without BOM (task-5)

  **Phase 2: Git Workflow Integration (Tasks 6-9)**
  - Stage file with 'git add' (task-6)
  - Commit with conventional message (task-7)
  - Push to feature branch (task-8)
  - Final verification and spot-check (task-9)

  Each task follows the TDD cycle: RED (define what should be true), GREEN (implement minimal code),
  REFACTOR (clean up and verify). Tasks are ordered by dependency — each task depends only on
  preceding tasks in its phase, ensuring linear execution.

  Total estimated effort is 10-15 minutes, following the established pattern from 200+ prior
  implementations (features 069-274). Most time is spent on content composition (task-1) and
  manual verification (task-9); file creation and git operations are mechanical and quick.

  This task breakdown is the source of truth for implementation. The plan.yaml file documents
  high-level strategy and architecture decisions; this file (tasks.yaml) provides the concrete
  work items and acceptance criteria for execution.
