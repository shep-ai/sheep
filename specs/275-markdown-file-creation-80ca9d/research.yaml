    rationale: >
      Feature spec requires explicit: (1) git add test-mdhar3.md, (2) conventional commit message, (3) git push.
      Direct subprocess.run() calls are transparent, predictable, and directly execute the required commands.
      The shell approach is already used extensively in Sheep automation (CrewAI agents execute shell commands).
      While GitPython is available, it requires: Repo object setup, actor (user) configuration, Index handling.
      For mechanical add/commit/push operations, subprocess is cleaner, requires no GitPython-specific imports,
