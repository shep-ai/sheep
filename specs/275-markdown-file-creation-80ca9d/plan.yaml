content: |
  ## Architecture Overview

  This feature extends the established markdown file creation pattern from features 069-274.
  The implementation is minimal and follows a proven approach used 200+ times in the repository:

  1. **File Location**: Repository root directory (consistent with all existing test-*.md files)
  2. **Content Structure**: Single H1 markdown heading followed by blank line and 2-3 sentences of prose
  3. **Encoding**: UTF-8 without BOM (standard Python default for pathlib.write_text)
  4. **Line Endings**: Explicit LF (Unix-style) by composing content with `\n` characters
  5. **Prose Topic**: Flexible selection matching the diverse topics across 200+ existing test files
  6. **Git Integration**: Standard workflow using subprocess for add, commit, and push operations

  The feature has **zero impact on application architecture** because:
  - The markdown file is a test artifact, not source code
  - It is not imported, executed, or referenced by the application
  - It does not depend on or modify any code in `/src/sheep/`
  - No new dependencies are introduced
  - The git workflow is mechanical and follows exact precedent from 200+ prior features

  ## Key Design Decisions

  ### 1. File I/O: pathlib.Path.write_text()

  **Chosen**: `Path('test-mdhar3.md').write_text(content, encoding='utf-8')`

  **Why**: pathlib is the modern Python standard for file operations. It provides a clean API,
  automatically creates the file, and explicit encoding parameter ensures UTF-8 without BOM.
  Already used throughout the codebase (CrewAI framework uses pathlib internally).

  **Alternatives Rejected**:
  - `os.open()/os.write()` — Lower-level, more verbose, less Pythonic
  - `io.open()` context managers — More code for the same result
  - Third-party libraries — Unnecessary for simple local file creation

  ### 2. Encoding & Line Endings: Explicit `\n` + UTF-8 Encoding

  **Chosen**: Compose content with literal `\n` characters; write with `encoding='utf-8'`

  **Why**: Python's `write_text(encoding='utf-8')` encodes content to UTF-8 without BOM (standard).
  When source contains `\n` (Unicode line feed), write_text() writes it as 0x0A (LF) in UTF-8.
  This guarantees both UTF-8 without BOM and LF line endings with zero post-processing.
  Directly verifiable with `file -i` and `file` commands.

  **Alternatives Rejected**:
  - Platform detection (`os.linesep`) — Spec explicitly requires LF, not platform-native
  - Post-processing with dos2unix — Fragile, adds unnecessary subprocess calls
  - `newline='\n'` parameter — More verbose than pathlib

  ### 3. Prose Content: Hand-Composed with Flexible Topic

  **Chosen**: Hand-compose 2-3 sentences of coherent prose with flexible topic selection

  **Why**: Feature spec explicitly recommends flexible topic selection because it matches
  the diverse pattern of 200+ existing test files (nature, technology, science, history, culture, philosophy).
  Hand-composing is faster than any programmatic approach and allows natural prose quality.

  **Alternatives Rejected**:
  - Random topic generation with templates — Adds complexity for minimal benefit
  - AI-generated prose via LLM API — Introduces latency, cost, external dependency
  - Programmatic prose generation — Over-engineered for 2-3 sentences

  ### 4. Git Integration: Subprocess Shell Commands

  **Chosen**: Direct `subprocess.run()` calls for `git add`, `git commit`, `git push`

  **Why**: Feature spec requires explicit operations (add, commit, push). Direct subprocess calls are:
  - Transparent and auditable (shell commands visible in logs)
  - Predictable (no abstraction layer or configuration needed)
  - Already used throughout Sheep platform (CrewAI agents use subprocess for shell commands)

  **Alternatives Rejected**:
  - GitPython library (git.Repo API) — Unnecessary abstraction; simpler via subprocess
  - Programmatic git operations (Index/Repo APIs) — Adds complexity without benefit

  ### 5. Error Handling: Fail Fast with No Retries

  **Chosen**: Let exceptions propagate; no retry logic or silent fallbacks

  **Why**: File I/O and git operations are deterministic. If either fails, the error is real
  (permission denied, branch missing, authentication failure, etc.) and should be visible immediately.
  Retries or fallbacks would mask underlying problems and delay failure visibility.
  Fail-fast semantics are appropriate for automated implementation systems.

  **Alternatives Rejected**:
  - Retry logic — Masks real problems
  - Silent fallback (skip push if it fails) — Violates spec requirement for push
  - Custom error wrapping — Python's built-in exceptions are sufficient

  ### 6. Validation: Manual Inspection (No Automated Checks)

  **Chosen**: Validate file properties through code review and spot-checking

  **Why**: Feature spec explicitly resolves this question: "Manual inspection is recommended because
  it aligns with the established pattern from features 069-274 which have successfully validated 200+ files
  without automated checks, avoids unnecessary tooling dependencies, and visual inspection is sufficient
  for simple format." The markdown structure is straightforward and transparent.

  **Alternatives Rejected**:
  - Markdown linters — Adds external tool dependency for minimal benefit
  - Programmatic validation — Over-engineered for simple H1 + prose format

  ## Implementation Strategy

  ### Phase Ordering Rationale

  **Phase 1 (File Creation) comes before Phase 2 (Git Integration)** because:
  1. The file must exist before it can be staged in git
  2. Git operations (add, commit, push) operate on an existing file
  3. Phase 1 focuses on content/encoding correctness; Phase 2 focuses on version control
  4. Separating these phases makes each task focused and testable

  ### Work Breakdown

  **Phase 1**: Create test-mdhar3.md with correct structure and encoding
  - Compose markdown content (H1 heading + prose)
  - Write file with pathlib, UTF-8 encoding, explicit LF line endings
  - Verify file properties (size, encoding, line endings, content structure)

  **Phase 2**: Git workflow
  - Stage file with `git add test-mdhar3.md`
  - Commit with conventional message: `feat(275): create markdown file test-mdhar3.md with prose content`
  - Push to feature branch `feat/275-markdown-file-creation-80ca9d`

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | File encoding issues (non-UTF-8 or with BOM) | Compose content with explicit `\n`; use `write_text(encoding='utf-8')` which guarantees UTF-8 without BOM by default. Verify with `file -i test-mdhar3.md`. |
  | Incorrect line endings (CRLF instead of LF) | Use literal `\n` in Python strings (Unicode line feed); pathlib.write_text() encodes as 0x0A in UTF-8. Verify with `file test-mdhar3.md` or `od -c`. |
  | Prose quality or structure issues | Hand-compose prose carefully to ensure 2-3 coherent sentences. Topic can be any subject; use established diversity pattern from 200+ existing files as reference. |
  | Git staging/commit/push failures | Use `subprocess.run(..., check=True)` to ensure commands succeed; exceptions are raised on failure. User will see error immediately and can investigate (auth, permissions, branch state). |
  | File size out of range | Hand-composed prose of 2-3 sentences naturally produces ~400-600 bytes. Verify final file size is in expected range. |
  | Existing file conflict | Check whether test-mdhar3.md already exists before writing. If it does, overwrite it (pathlib.write_text() handles this atomically). |
  | Conventional commit message format | Use exact format specified in requirements: `feat(275): create markdown file test-mdhar3.md with prose content`. No variations. |

  ## Summary

  This is a minimal, well-understood feature that follows 200+ established precedents. The implementation
  requires no novel decisions, external dependencies, or architectural complexity. The approach is
  straightforward: compose markdown content with correct encoding/line endings, write it with pathlib,
  and execute standard git workflow via subprocess. Manual inspection validates the output.

  Expected total effort: 10-15 minutes, following the established pattern from features 069-274.
